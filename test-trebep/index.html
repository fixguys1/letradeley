es». El precepto no menciona para este personal el Estatuto, que la opción a) antepone al convenio colectivo, ni la legislación de Función Pública de la opción b) ni el régimen estatutario de la opción d).","cita":"«Su personal laboral se regirá por la legislación laboral y demás normas convencionalmente aplicables.»","dificultad":1},{"id":"TREBEP-L1-017","ley":"TREBEP","articulo":"7","articulo_txt":"Art. 7 TREBEP","bloque_id":"TREBEP|Título I. Objeto y ámbito de aplicación","enunciado":"Según el artículo 7 del TREBEP, en materia de permisos de nacimiento, adopción, del progenitor diferente de la madre biológica, de lactancia y parental, el personal laboral al servicio de las Administraciones públicas se regirá:","opciones":{"a":"Por las previsiones del Estatuto de los Trabajadores sobre suspensión del contrato, con preferencia sobre el TREBEP.","b":"Por lo que disponga el convenio colectivo y, en su defecto, por el TREBEP.","c":"Por lo previsto en el TREBEP, sin aplicarse las previsiones del Estatuto de los Trabajadores sobre suspensión del contrato.","d":"Por el régimen que elija cada trabajador entre el del TREBEP y el del Estatuto de los Trabajadores."},"correcta":"c","explicacion":"El párrafo segundo del art. 7, en la redacción dada por el art. 2.1 del Real Decreto-ley 9/2025, de 29 de julio, dispone que en esos permisos este personal «se regirá por lo previsto en el presente Estatuto», sin que le sean de aplicación las previsiones del texto refundido de la Ley del Estatuto de los Trabajadores sobre las suspensiones de los contratos de trabajo por los mismos supuestos de hecho. Por eso fallan la opción a), que da preferencia al Estatuto de los Trabajadores, la opción b), que remite al convenio colectivo, y la opción d), que deja la elección al trabajador. El art. 7 también fue modificado por el art. 3.1 del Real Decreto-ley 6/2019, de 1 de marzo.","cita":"«No obstante, en materia de permisos de nacimiento, adopción, del progenitor diferente de la madre biológica, de lactancia y parental, el personal laboral al servicio de las Administraciones públicas se regirá por lo previsto en el presente Estatuto, no siendo de aplicación a este personal, por tanto, las previsiones del texto refundido de la Ley del Estatuto de los Trabajadores sobre las suspensiones de los contratos de trabajo que, en su caso, corresponderían por los mismos supuestos de hecho.»","dificultad":2},{"id":"TREBEP-L1-018","ley":"TREBEP","articulo":"8.1","articulo_txt":"Art. 8.1 TREBEP","bloque_id":"TREBEP|Título II. Personal al servicio de las Administraciones Públicas · Capítulo I. Clases de personal","enunciado":"Según el artículo 8.1 del TREBEP, son empleados públicos quienes desempeñan funciones retribuidas en las Administraciones Públicas al servicio de:","opciones":{"a":"La autoridad que los nombra.","b":"El Gobierno de la Nación.","c":"La Administración que los contrata.","d":"Los intereses generales."},"correcta":"d","explicacion":"El art. 8.1 define a los empleados públicos como quienes desempeñan funciones retribuidas en las Administraciones Públicas «al servicio de los intereses generales». Las opciones a), b) y c) sustituyen esa referencia por una autoridad, el Gobierno o la Administración de la que dependen, que el precepto no menciona.","cita":"«1. Son empleados públicos quienes desempeñan funciones retribuidas en las Administraciones Públicas al servicio de los intereses generales.»","dificultad":1},{"id":"TREBEP-L1-030","ley":"TREBEP","articulo":"10.4","articulo_txt":"Art. 10.4 TREBEP","bloque_id":"TREBEP|Título II. Personal al servicio de las Administraciones Públicas · Capítulo I. Clases de personal","enunciado":"Según el artículo 10.4 del TREBEP, una vez producido el fin de la relación de interinidad por el transcurso del plazo previsto desde el nombramiento del personal funcionario interino, la vacante:","opciones":{"a":"Deberá ser amortizada y no podrá volver a cubrirse por personal funcionario interino en ningún caso.","b":"Podrá cubrirse mediante la contratación de personal laboral temporal.","c":"Solo podrá ocuparla personal funcionario de carrera, salvo que el proceso selectivo quede desierto.","d":"Quedará reservada al personal funcionario interino que la venía ocupando."},"correcta":"c","explicacion":"El art. 10.4, párrafo segundo, dispone que, transcurridos tres años desde el nombramiento, «la vacante solo podrá ser ocupada por personal funcionario de carrera, salvo que el correspondiente proceso selectivo quede desierto, en cuyo caso se podrá efectuar otro nombramiento de personal funcionario interino». Por eso fallan la opción a), que impone la amortización y prohíbe todo nuevo nombramiento interino, la opción b), que admite personal laboral temporal, y la opción d), que reserva la plaza al interino que la ocupaba.","cita":"«No obstante, transcurridos tres años desde el nombramiento del personal funcionario interino se producirá el fin de la relación de interinidad, y la vacante solo podrá ser ocupada por personal funcionario de carrera, salvo que el correspondiente proceso selectivo quede desierto, en cuyo caso se podrá efectuar otro nombramiento de personal funcionario interino.»","dificultad":2},{"id":"TREBEP-L1-041","ley":"TREBEP","articulo":"13.2","articulo_txt":"Art. 13.2 TREBEP","bloque_id":"TREBEP|Título II. Personal al servicio de las Administraciones Públicas · Capítulo II. Personal directivo","enunciado":"Según el artículo 13.2 del TREBEP, la designación del personal directivo atenderá a principios de mérito y capacidad y a criterios de:","opciones":{"a":"Antigüedad.","b":"Oportunidad.","c":"Idoneidad.","d":"Representatividad."},"correcta":"c","explicacion":"El art. 13.2 dispone que la designación «atenderá a principios de mérito y capacidad y a criterios de idoneidad», y que se llevará a cabo mediante procedimientos que garanticen la publicidad y concurrencia. La antigüedad, la oportunidad y la representatividad de las opciones a), b) y d) no figuran en el precepto.","cita":"«2. Su designación atenderá a principios de mérito y capacidad y a criterios de idoneidad, y se llevará a cabo mediante procedimientos que garanticen la publicidad y concurrencia.»","dificultad":1},{"id":"TREBEP-L9-002","ley":"TREBEP","articulo":"13.3","articulo_txt":"Art. 13.3 TREBEP","bloque_id":"TREBEP|Título II. Personal al servicio de las Administraciones Públicas · Capítulo II. Personal directivo","enunciado":"Según el artículo 13.3 del TREBEP, el personal directivo estará sujeto a evaluación con arreglo a los criterios de eficacia y eficiencia, responsabilidad por su gestión y control de resultados en relación con:","opciones":{"a":"Los objetivos que les hayan sido fijados.","b":"Las disponibilidades presupuestarias de su unidad.","c":"El rendimiento medio del personal de su unidad.","d":"La valoración del personal a su cargo."},"correcta":"a","explicacion":"El art. 13.3 vincula el control de resultados «en relación con los objetivos que les hayan sido fijados». El precepto no menciona las disponibilidades presupuestarias de la opción b), el rendimiento del personal de la unidad de la opción c) ni la valoración por sus subordinados de la opción d).","cita":"«3. El personal directivo estará sujeto a evaluación con arreglo a los criterios de eficacia y eficiencia, responsabilidad por su gestión y control de resultados en relación con los objetivos que les hayan sido fijados.»","dificultad":2},{"id":"TREBEP-L2-004","ley":"TREBEP","articulo":"14.h)","articulo_txt":"Art. 14.h) TREBEP","bloque_id":"TREBEP|Título III. Derechos y deberes. Código de conducta de los empleados públicos · Capítulo I. Derechos de los empleados públicos","enunciado":"Según el artículo 14.h) del TREBEP, ¿cuál de los siguientes NO figura expresamente entre los aspectos cuyo respeto en el trabajo reconoce esa letra?","opciones":{"a":"La propia imagen.","b":"La expresión de género.","c":"Las características sexuales.","d":"El honor."},"correcta":"d","explicacion":"El art. 14.h), en la redacción dada por la disposición final 16.1 de la Ley 4/2023, de 28 de febrero, reconoce el derecho «Al respeto de su intimidad, orientación e identidad sexual, expresión de género, características sexuales, propia imagen y dignidad en el trabajo», sin mencionar el honor. Sí figuran la propia imagen de la opción a), la expresión de género de la opción b) y las características sexuales de la opción c).","cita":"«h) Al respeto de su intimidad, orientación e identidad sexual, expresión de género, características sexuales, propia imagen y dignidad en el trabajo, especialmente frente al acoso sexual y por razón de sexo, de orientación e identidad sexual, expresión de género o características sexuales, moral y laboral.»","dificultad":2},{"id":"TREBEP-L2-009","ley":"TREBEP","articulo":"15.c)","articulo_txt":"Art. 15.c) TREBEP","bloque_id":"TREBEP|Título III. Derechos y deberes. Código de conducta de los empleados públicos · Capítulo I. Derechos de los empleados públicos","enunciado":"Según el artículo 15.c) del TREBEP, el derecho al ejercicio de la huelga se reconoce a los empleados públicos con la garantía de:","opciones":{"a":"El mantenimiento de los servicios esenciales de la comunidad.","b":"La autorización previa del órgano competente en materia de función pública.","c":"La continuidad de todos los servicios de atención directa a la ciudadanía.","d":"Unos servicios mínimos que fijen las organizaciones sindicales convocantes."},"correcta":"a","explicacion":"El art. 15.c) reconoce el derecho «Al ejercicio de la huelga, con la garantía del mantenimiento de los servicios esenciales de la comunidad». El precepto no exige la autorización previa de la opción b), no extiende la garantía a todos los servicios de atención a la ciudadanía como dice la opción c) ni atribuye a los sindicatos convocantes la fijación de servicios mínimos como afirma la opción d).","cita":"«c) Al ejercicio de la huelga, con la garantía del mantenimiento de los servicios esenciales de la comunidad.»","dificultad":1},{"id":"TREBEP-L2-016","ley":"TREBEP","articulo":"17","articulo_txt":"Art. 17 TREBEP","bloque_id":"TREBEP|Título III. Derechos y deberes. Código de conducta de los empleados públicos · Capítulo II. Derecho a la carrera profesional y a la promoción interna. La evaluación del desempeño","enunciado":"Según el artículo 17 del TREBEP, la regulación de la carrera horizontal de los funcionarios de carrera por las leyes de Función Pública que se dicten en desarrollo del Estatuto:","opciones":{"a":"Es obligatoria para todas las Administraciones Públicas.","b":"Es potestativa, pues esas leyes podrán regularla.","c":"Es obligatoria solo en la Administración General del Estado.","d":"Corresponde en exclusiva al Estado, sin intervención autonómica."},"correcta":"b","explicacion":"El art. 17 dispone que las leyes de Función Pública que se dicten en desarrollo del Estatuto «podrán regular la carrera horizontal de los funcionarios de carrera». Al ser una facultad, no es obligatoria para todas las Administraciones como dice la opción a) ni solo para la del Estado como dice la opción c), y el precepto no la reserva al Estado como afirma la opción d).","cita":"«Las leyes de Función Pública que se dicten en desarrollo del presente Estatuto podrán regular la carrera horizontal de los funcionarios de carrera, pudiendo aplicar, entre otras, las siguientes reglas:»","dificultad":2},{"id":"TREBEP-L9-004","ley":"TREBEP","articulo":"20.5","articulo_txt":"Art. 20.5 TREBEP","bloque_id":"TREBEP|Título III. Derechos y deberes. Código de conducta de los empleados públicos · Capítulo II. Derecho a la carrera profesional y a la promoción interna. La evaluación del desempeño","enunciado":"Según el artículo 20.5 del TREBEP, ¿cuál de los siguientes supuestos requerirá la aprobación previa, en cada caso, de sistemas objetivos que permitan evaluar el desempeño?","opciones":{"a":"Las retribuciones complementarias del apartado d) del artículo 24.","b":"La aplicación de la carrera profesional horizontal.","c":"Las retribuciones complementarias del apartado b) del artículo 24.","d":"La asignación de funciones distintas a las propias del puesto."},"correcta":"b","explicacion":"El art. 20.5 exige esa aprobación previa para «La aplicación de la carrera profesional horizontal», para las retribuciones complementarias derivadas del apartado c) del art. 24 y para el cese del puesto de trabajo obtenido por concurso. Las opciones a) y c) se refieren a los apartados d) y b) del art. 24, que no se mencionan en ese apartado, y la asignación de funciones distintas de la opción d) tampoco figura en él.","cita":"«5. La aplicación de la carrera profesional horizontal, de las retribuciones complementarias derivadas del apartado c) del artículo 24 del presente Estatuto y el cese del puesto de trabajo obtenido por el procedimiento de concurso requerirán la aprobación previa, en cada caso, de sistemas objetivos que permitan evaluar el desempeño de acuerdo con lo establecido en los apartados 1 y 2 de este artículo.»","dificultad":2},{"id":"TREBEP-L4-046","ley":"TREBEP","articulo":"22.1","articulo_txt":"Art. 22.1 TREBEP","bloque_id":"TREBEP|Título III. Derechos y deberes. Código de conducta de los empleados públicos · Capítulo III. Derechos retributivos","enunciado":"Según el artículo 22.1 del TREBEP, la clasificación de las retribuciones en básicas y complementarias que establece ese apartado se refiere a las retribuciones de:","opciones":{"a":"Todos los empleados públicos, cualquiera que sea la naturaleza de su relación de servicio.","b":"El personal laboral fijo al servicio de las Administraciones Públicas.","c":"El personal directivo profesional de las Administraciones Públicas.","d":"Los funcionarios de carrera."},"correcta":"d","explicacion":"El art. 22.1 dispone que «Las retribuciones de los funcionarios de carrera se clasifican en básicas y complementarias». No se refiere a todos los empleados públicos —opción a)—, al personal laboral —opción b)— ni al personal directivo profesional —opción c)—.","cita":"«1. Las retribuciones de los funcionarios de carrera se clasifican en básicas y complementarias.»","dificultad":1},{"id":"TREBEP-L2-038","ley":"TREBEP","articulo":"24.d)","articulo_txt":"Art. 24.d) TREBEP","bloque_id":"TREBEP|Título III. Derechos y deberes. Código de conducta de los empleados públicos · Capítulo III. Derechos retributivos","enunciado":"Según el artículo 24.d) del TREBEP, entre los factores para establecer las retribuciones complementarias figuran los servicios extraordinarios prestados:","opciones":{"a":"Exclusivamente en días festivos o en horario nocturno.","b":"Fuera de la jornada normal de trabajo.","c":"En comisión de servicios en otra Administración Pública.","d":"Durante el período de prácticas previo al nombramiento."},"correcta":"b","explicacion":"El art. 24.d) se refiere a «Los servicios extraordinarios prestados fuera de la jornada normal de trabajo». El precepto no los limita a festivos o al horario nocturno como dice la opción a), ni se refiere a la comisión de servicios de la opción c) ni al período de prácticas de la opción d).","cita":"«d) Los servicios extraordinarios prestados fuera de la jornada normal de trabajo.»","dificultad":1},{"id":"TREBEP-L9-006","ley":"TREBEP","articulo":"31.7","articulo_txt":"Art. 31.7 TREBEP","bloque_id":"TREBEP|Título III. Derechos y deberes. Código de conducta de los empleados públicos · Capítulo IV. Derecho a la negociación colectiva, representación y participación institucional. Derecho de reunión","enunciado":"Según el artículo 31.7 del TREBEP, el ejercicio de los derechos establecidos en el capítulo dedicado a la negociación colectiva, representación y participación institucional deberá respetar en todo caso:","opciones":{"a":"El contenido del Estatuto y las leyes de desarrollo previstas en el mismo.","b":"Los pactos que se alcancen en cada una de las Mesas Sectoriales.","c":"Las instrucciones que dicte cada Administración para su propio ámbito.","d":"La legislación laboral común, que se aplicará con preferencia sobre el Estatuto."},"correcta":"a","explicacion":"El art. 31.7 dispone que el ejercicio de esos derechos «deberá respetar en todo caso el contenido del presente Estatuto y las leyes de desarrollo previstas en el mismo». No menciona los pactos de las Mesas Sectoriales de la opción b) ni las instrucciones de cada Administración de la opción c), y la opción d) invierte el planteamiento del precepto al anteponer la legislación laboral al Estatuto.","cita":"«7. El ejercicio de los derechos establecidos en este capítulo deberá respetar en todo caso el contenido del presente Estatuto y las leyes de desarrollo previstas en el mismo.»","dificultad":1},{"id":"TREBEP-L3-044","ley":"TREBEP","articulo":"45.2","articulo_txt":"Art. 45.2 TREBEP","bloque_id":"TREBEP|Título III. Derechos y deberes. Código de conducta de los empleados públicos · Capítulo IV. Derecho a la negociación colectiva, representación y participación institucional. Derecho de reunión","enunciado":"Según el artículo 45.2 del TREBEP, los conflictos que pueden someterse a los sistemas de solución extrajudicial son los derivados de la negociación, aplicación e interpretación de los Pactos y Acuerdos sobre las materias señaladas en el artículo 37:","opciones":{"a":"Incluidas aquellas en que exista reserva de ley, previa autorización parlamentaria.","b":"Excepto para aquellas en que exista reserva de ley.","c":"Excepto las relativas a las retribuciones complementarias de los funcionarios.","d":"Únicamente cuando las materias afecten en exclusiva al personal laboral."},"correcta":"b","explicacion":"El art. 45.2 admite esos conflictos «excepto para aquellas en que exista reserva de ley». La opción a) incluye precisamente las materias excluidas; la opción c) excluye las retribuciones complementarias, que el precepto no excluye, y la opción d) limita los sistemas al personal laboral, algo que el art. 45.2 no establece.","cita":"«2. Los conflictos a que se refiere el apartado anterior podrán ser los derivados de la negociación, aplicación e interpretación de los Pactos y Acuerdos sobre las materias señaladas en el artículo 37, excepto para aquellas en que exista reserva de ley.»","dificultad":2},{"id":"TREBEP-L4-006","ley":"TREBEP","articulo":"47 bis.4","articulo_txt":"Art. 47 bis.4 TREBEP","bloque_id":"TREBEP|Título III. Derechos y deberes. Código de conducta de los empleados públicos · Capítulo V. Derecho a la jornada de trabajo, permisos y vacaciones","enunciado":"Según el artículo 47 bis.4 del TREBEP, ¿a quién corresponde proporcionar y mantener los medios tecnológicos necesarios para la actividad de las personas que trabajen en la modalidad de teletrabajo?","opciones":{"a":"A la Administración.","b":"A la persona que teletrabaja, que recibirá una compensación económica por los gastos.","c":"A la Administración su provisión inicial y a la persona que teletrabaja su mantenimiento.","d":"A la persona que teletrabaja, salvo que el acuerdo de teletrabajo disponga otra cosa."},"correcta":"a","explicacion":"El art. 47 bis.4 dispone que «La Administración proporcionará y mantendrá a las personas que trabajen en esta modalidad, los medios tecnológicos necesarios para su actividad». Las opciones b) y d) cargan los medios sobre la persona que teletrabaja y la opción c) le atribuye su mantenimiento, que el precepto atribuye a la Administración.","cita":"«4. La Administración proporcionará y mantendrá a las personas que trabajen en esta modalidad, los medios tecnológicos necesarios para su actividad.»","dificultad":1},{"id":"TREBEP-L4-031","ley":"TREBEP","articulo":"50.2","articulo_txt":"Art. 50.2 TREBEP","bloque_id":"TREBEP|Título III. Derechos y deberes. Código de conducta de los empleados públicos · Capítulo V. Derecho a la jornada de trabajo, permisos y vacaciones","enunciado":"Según el artículo 50.2 del TREBEP, cuando una situación de incapacidad temporal impida iniciar el disfrute de las vacaciones dentro del año natural al que correspondan, el periodo vacacional se podrá disfrutar aunque haya terminado ese año, siempre que no hayan transcurrido más de:","opciones":{"a":"Dieciocho meses a partir del final del año en que se hayan originado.","b":"Doce meses a partir del final del año en que se hayan originado.","c":"Veinticuatro meses a partir del final del año en que se hayan originado.","d":"Seis meses a partir de la fecha en que concluya la incapacidad temporal."},"correcta":"a","explicacion":"El art. 50.2 permite disfrutar las vacaciones «siempre que no hayan transcurrido más de dieciocho meses a partir del final del año en que se hayan originado». Los plazos de las opciones b) y c) no son los del precepto, y la opción d) cambia además el momento desde el que se computa.","cita":"«2. Cuando las situaciones de permiso de maternidad, incapacidad temporal, riesgo durante la lactancia o riesgo durante el embarazo impidan iniciar el disfrute de las vacaciones dentro del año natural al que correspondan, (…) el periodo vacacional se podrá disfrutar aunque haya terminado el año natural a que correspondan y siempre que no hayan transcurrido más de dieciocho meses a partir del final del año en que se hayan originado.»","dificultad":2},{"id":"TREBEP-L4-036","ley":"TREBEP","articulo":"53.3","articulo_txt":"Art. 53.3 TREBEP","bloque_id":"TREBEP|Título III. Derechos y deberes. Código de conducta de los empleados públicos · Capítulo VI. Deberes de los empleados públicos. Código de Conducta","enunciado":"Según el artículo 53.3 del TREBEP, los empleados públicos ajustarán su actuación, con la Administración en la que presten sus servicios, con sus superiores, compañeros, subordinados y con los ciudadanos, a los principios de:","opciones":{"a":"Obediencia y disciplina.","b":"Solidaridad y compañerismo.","c":"Cortesía y reserva.","d":"Lealtad y buena fe."},"correcta":"d","explicacion":"El art. 53.3 dispone que «Ajustarán su actuación a los principios de lealtad y buena fe con la Administración en la que presten sus servicios, y con sus superiores, compañeros, subordinados y con los ciudadanos». Los pares de principios de las opciones a), b) y c) no son los que recoge ese apartado.","cita":"«3. Ajustarán su actuación a los principios de lealtad y buena fe con la Administración en la que presten sus servicios, y con sus superiores, compañeros, subordinados y con los ciudadanos.»","dificultad":1},{"id":"TREBEP-L9-026","ley":"TREBEP","articulo":"54.5","articulo_txt":"Art. 54.5 TREBEP","bloque_id":"TREBEP|Título III. Derechos y deberes. Código de conducta de los empleados públicos · Capítulo VI. Deberes de los empleados públicos. Código de Conducta","enunciado":"Según el artículo 54.5 del TREBEP, en relación con los recursos y bienes públicos, los empleados públicos:","opciones":{"a":"Los administrarán con austeridad, no los utilizarán en provecho propio o de personas allegadas y tendrán el deber de velar por su conservación.","b":"Los administrarán con eficiencia y podrán utilizarlos ocasionalmente en provecho propio cuando con ello no se perjudique el servicio.","c":"Los administrarán con austeridad, pero el deber de velar por su conservación corresponderá solo a los responsables de cada unidad.","d":"Los administrarán con austeridad y solo responderán de su conservación cuando los tengan asignados de forma personal y exclusiva."},"correcta":"a","explicacion":"El art. 54.5 dispone que los empleados públicos «Administrarán los recursos y bienes públicos con austeridad, y no utilizarán los mismos en provecho propio o de personas allegadas», y añade que tendrán «el deber de velar por su conservación». La opción b) admite un uso en provecho propio que el precepto excluye, y las opciones c) y d) restringen un deber de conservación que la ley impone a todos los empleados públicos.","cita":"«5. Administrarán los recursos y bienes públicos con austeridad, y no utilizarán los mismos en provecho propio o de personas allegadas. Tendrán, asimismo, el deber de velar por su conservación.»","dificultad":2},{"id":"TREBEP-L5-011","ley":"TREBEP","articulo":"57.4","articulo_txt":"Art. 57.4 TREBEP","bloque_id":"TREBEP|Título IV. Adquisición y pérdida de la relación de servicio · Capítulo I. Acceso al empleo público y adquisición de la relación de servicio","enunciado":"Según el artículo 57.4 del TREBEP, los extranjeros con residencia legal en España podrán acceder a las Administraciones Públicas:","opciones":{"a":"Como personal funcionario o laboral, en igualdad de condiciones que los españoles.","b":"Como personal laboral, solo si acreditan cinco años de residencia legal continuada en España.","c":"Como personal funcionario interino, solo si no hay aspirantes españoles o comunitarios suficientes.","d":"Como personal laboral, en igualdad de condiciones que los españoles."},"correcta":"d","explicacion":"El art. 57.4 permite a los extranjeros con residencia legal en España acceder a las Administraciones Públicas «como personal laboral, en igualdad de condiciones que los españoles». La opción a) añade el acceso como personal funcionario, que el art. 57 reserva a los supuestos de sus apartados 1 a 3; la opción b) exige un periodo de residencia que el precepto no prevé, y la opción c) habla de un acceso como interino que el artículo no contempla.","cita":"«4. Los extranjeros a los que se refieren los apartados anteriores, así como los extranjeros con residencia legal en España podrán acceder a las Administraciones Públicas, como personal laboral, en igualdad de condiciones que los españoles.»","dificultad":2},{"id":"TREBEP-L5-021","ley":"TREBEP","articulo":"61.7","articulo_txt":"Art. 61.7 TREBEP","bloque_id":"TREBEP|Título IV. Adquisición y pérdida de la relación de servicio · Capítulo I. Acceso al empleo público y adquisición de la relación de servicio","enunciado":"Según el artículo 61.7 del TREBEP, ¿cuáles son los sistemas selectivos del personal laboral fijo?","opciones":{"a":"Únicamente oposición y concurso-oposición, sin que quepa en ningún caso el concurso de méritos.","b":"Concurso-oposición o libre designación, según determine el convenio colectivo aplicable.","c":"Oposición, concurso-oposición o concurso de valoración de méritos.","d":"Oposición, concurso-oposición o contratación directa previa entrevista curricular del candidato."},"correcta":"c","explicacion":"El art. 61.7 dispone que los sistemas selectivos de personal laboral fijo «serán los de oposición, concurso-oposición, con las características establecidas en el apartado anterior, o concurso de valoración de méritos». La opción a) excluye el concurso; la opción b) incluye la libre designación, y la opción d) la contratación directa, sistemas que el precepto no recoge.","cita":"«7. Los sistemas selectivos de personal laboral fijo serán los de oposición, concurso-oposición, con las características establecidas en el apartado anterior, o concurso de valoración de méritos.»","dificultad":1},{"id":"TREBEP-L5-034","ley":"TREBEP","articulo":"65","articulo_txt":"Art. 65 TREBEP","bloque_id":"TREBEP|Título IV. Adquisición y pérdida de la relación de servicio · Capítulo II. Pérdida de la relación de servicio","enunciado":"Según el artículo 65 del TREBEP, la pérdida de la nacionalidad española que haya sido tenida en cuenta para el nombramiento determinará la pérdida de la condición de funcionario:","opciones":{"a":"En todo caso y de forma inmediata, aunque el funcionario adquiera simultáneamente la nacionalidad de otro Estado miembro de la Unión Europea o de un Estado al que sea de aplicación la libre circulación de trabajadores.","b":"Solo si el funcionario no recupera la nacionalidad española en el plazo de un año desde su pérdida, transcurrido el cual la Administración declarará de oficio la pérdida de la condición de funcionario.","c":"Salvo que simultáneamente se adquiera la nacionalidad de otro Estado miembro de la Unión Europea o de un Estado al que, por tratados celebrados por la Unión y ratificados por España, se aplique la libre circulación de trabajadores.","d":"Salvo que el funcionario obtenga, en el plazo de seis meses desde la pérdida, la residencia legal en España, en cuyo caso pasará a prestar servicios como personal laboral de la misma Administración Pública."},"correcta":"c","explicacion":"El art. 65 dispone que esa pérdida de nacionalidad determinará la pérdida de la condición de funcionario «salvo que simultáneamente se adquiera la nacionalidad de alguno de dichos Estados», es decir, de un Estado miembro de la Unión Europea o de los Estados a los que, por tratados internacionales celebrados por la Unión Europea y ratificados por España, sea de aplicación la libre circulación de trabajadores. La opción a) niega esa salvedad, y el plazo de recuperación de la opción b) y la conversión en personal laboral de la opción d) no figuran en el precepto.","cita":"«La pérdida de la nacionalidad española o la de cualquier otro Estado miembro de la Unión Europea o la de aquellos Estados a los que, en virtud de tratados internacionales celebrados por la Unión Europea y ratificados por España, les sea de aplicación la libre circulación de trabajadores, que haya sido tenida en cuenta para el nombramiento, determinará la pérdida de la condición de funcionario salvo que simultáneamente se adquiera la nacionalidad de alguno de dichos Estados.»","dificultad":3},{"id":"TREBEP-L5-037","ley":"TREBEP","articulo":"67.1","articulo_txt":"Art. 67.1 TREBEP","bloque_id":"TREBEP|Título IV. Adquisición y pérdida de la relación de servicio · Capítulo II. Pérdida de la relación de servicio","enunciado":"Según el artículo 67.1 del TREBEP, ¿cuál de las siguientes NO es una de las clases de jubilación de los funcionarios?","opciones":{"a":"Voluntaria, a solicitud del funcionario.","b":"Forzosa, al cumplir la edad legalmente establecida.","c":"Por la declaración de incapacidad permanente para el ejercicio de las funciones propias de su cuerpo o escala.","d":"Por decisión de la Administración, por razones organizativas motivadas."},"correcta":"d","explicacion":"El art. 67.1 no prevé la jubilación por decisión de la Administración por razones organizativas, por lo que la opción d) es la que no figura. Sí son clases de jubilación la voluntaria, a solicitud del funcionario (art. 67.1.a); la forzosa, al cumplir la edad legalmente establecida (art. 67.1.b), y la debida a la declaración de incapacidad permanente para el ejercicio de las funciones propias del cuerpo o escala (art. 67.1.c).","cita":"«1. La jubilación de los funcionarios podrá ser: a) Voluntaria, a solicitud del funcionario. b) Forzosa, al cumplir la edad legalmente establecida. c) Por la declaración de incapacidad permanente para el ejercicio de las funciones propias de su cuerpo o escala (…)»","dificultad":1},{"id":"TREBEP-L6-003","ley":"TREBEP","articulo":"70.1","articulo_txt":"Art. 70.1 TREBEP","bloque_id":"TREBEP|Título V. Ordenación de la actividad profesional · Capítulo I. Planificación de recursos humanos","enunciado":"Según el artículo 70.1 del TREBEP, la ejecución de la Oferta de empleo público o instrumento similar deberá desarrollarse dentro del plazo:","opciones":{"a":"Improrrogable de dos años.","b":"Máximo de dos años, prorrogable por uno más.","c":"Máximo de tres años, prorrogable por acuerdo del órgano de Gobierno.","d":"Improrrogable de tres años."},"correcta":"d","explicacion":"El art. 70.1 dispone que «la ejecución de la oferta de empleo público o instrumento similar deberá desarrollarse dentro del plazo improrrogable de tres años». La opción a) acorta el plazo; las opciones b) y c) admiten una prórroga que la ley excluye expresamente.","cita":"«En todo caso, la ejecución de la oferta de empleo público o instrumento similar deberá desarrollarse dentro del plazo improrrogable de tres años.»","dificultad":1},{"id":"TREBEP-L9-032","ley":"TREBEP","articulo":"71.5","articulo_txt":"Art. 71.5 TREBEP","bloque_id":"TREBEP|Título V. Ordenación de la actividad profesional · Capítulo I. Planificación de recursos humanos","enunciado":"Según el artículo 71.5 del TREBEP, cuando las Entidades Locales no cuenten con la suficiente capacidad financiera o técnica, ¿quiénes cooperarán con ellas a los efectos contemplados en ese artículo sobre registros de personal y gestión integrada de recursos humanos?","opciones":{"a":"La Federación Española de Municipios y Provincias.","b":"La Administración General del Estado y las comunidades autónomas.","c":"La Mesa General de Negociación de las Administraciones Públicas.","d":"Exclusivamente la comunidad autónoma en cuyo territorio se encuentren."},"correcta":"b","explicacion":"El art. 71.5 dispone que, en ese caso, «la Administración General del Estado y las Comunidades Autónomas cooperarán con aquéllas a los efectos contemplados en este artículo». No atribuye esa cooperación a la Federación Española de Municipios y Provincias de la opción a) ni a la Mesa General de Negociación de la opción c), y la opción d) deja fuera a la Administración General del Estado.","cita":"«5. Cuando las Entidades Locales no cuenten con la suficiente capacidad financiera o técnica, la Administración General del Estado y las Comunidades Autónomas cooperarán con aquéllas a los efectos contemplados en este artículo.»","dificultad":2},{"id":"TREBEP-L6-010","ley":"TREBEP","articulo":"72","articulo_txt":"Art. 72 TREBEP","bloque_id":"TREBEP|Título V. Ordenación de la actividad profesional · Capítulo II. Estructuración del empleo público","enunciado":"Según el artículo 72 del TREBEP, las Administraciones Públicas estructuran sus recursos humanos de acuerdo con las normas que regulan:","opciones":{"a":"La selección, la negociación colectiva, la jornada de trabajo y el régimen disciplinario.","b":"Las retribuciones, la promoción profesional, las situaciones administrativas y la jubilación.","c":"La planificación presupuestaria, la evaluación del desempeño, la formación y los permisos.","d":"La selección, la promoción profesional, la movilidad y la distribución de funciones."},"correcta":"d","explicacion":"El art. 72 se refiere a las normas que regulan «la selección, la promoción profesional, la movilidad y la distribución de funciones», además de lo previsto en el capítulo II del título V. Las opciones a), b) y c) mezclan materias que no figuran en esa enumeración (negociación colectiva, régimen disciplinario, retribuciones, jubilación, evaluación del desempeño, permisos, entre otras).","cita":"«(…) las Administraciones Públicas estructuran sus recursos humanos de acuerdo con las normas que regulan la selección, la promoción profesional, la movilidad y la distribución de funciones y conforme a lo previsto en este capítulo.»","dificultad":2},{"id":"TREBEP-L6-013","ley":"TREBEP","articulo":"74","articulo_txt":"Art. 74 TREBEP","bloque_id":"TREBEP|Título V. Ordenación de la actividad profesional · Capítulo II. Estructuración del empleo público","enunciado":"Según el artículo 74 del TREBEP, ¿a través de qué instrumentos estructurarán las Administraciones Públicas su organización?","opciones":{"a":"Plantillas presupuestarias que se aprueban junto con la Oferta de empleo público.","b":"Acuerdos de condiciones de trabajo negociados con la representación del personal.","c":"Relaciones de puestos de trabajo u otros instrumentos organizativos similares.","d":"Catálogos de funciones aprobados por la Comisión de Coordinación del Empleo Público."},"correcta":"c","explicacion":"El art. 74 dispone que las Administraciones Públicas «estructurarán su organización a través de relaciones de puestos de trabajo u otros instrumentos organizativos similares». Los instrumentos de las opciones a), b) y d) no son los previstos en el art. 74.","cita":"«Las Administraciones Públicas estructurarán su organización a través de relaciones de puestos de trabajo u otros instrumentos organizativos similares (…)»","dificultad":1},{"id":"TREBEP-L6-030","ley":"TREBEP","articulo":"79.3","articulo_txt":"Art. 79.3 TREBEP","bloque_id":"TREBEP|Título V. Ordenación de la actividad profesional · Capítulo III. Provisión de puestos de trabajo y movilidad","enunciado":"Según el artículo 79.3 del TREBEP, en las convocatorias de concursos podrá establecerse una puntuación para quienes tengan la condición de víctima del terrorismo o de amenazados que, como máximo, podrá alcanzar:","opciones":{"a":"La que se determine en las mismas para el grado personal consolidado.","b":"El diez por ciento de la puntuación total prevista en el concurso.","c":"La que se determine en las mismas para la antigüedad.","d":"La mitad de la puntuación máxima prevista para los méritos generales."},"correcta":"c","explicacion":"El art. 79.3 permite establecer una puntuación que, «como máximo, podrá alcanzar la que se determine en las mismas para la antigüedad», en los términos del artículo 35 de la Ley 29/2011, de 22 de septiembre, siempre que se acredite que la obtención del puesto es precisa para los fines de protección y asistencia social integral. Los topes de las opciones a), b) y d) no son los del art. 79.3.","cita":"«3. En las convocatorias de concursos podrá establecerse una puntuación que, como máximo, podrá alcanzar la que se determine en las mismas para la antigüedad, para quienes tengan la condición de víctima del terrorismo o de amenazados, en los términos fijados en el artículo 35 de la Ley 29/2011, de 22 de septiembre, de Reconocimiento y Protección Integral a las Víctimas del Terrorismo (…)»","dificultad":2},{"id":"TREBEP-L6-041","ley":"TREBEP","articulo":"82.2","articulo_txt":"Art. 82.2 TREBEP","bloque_id":"TREBEP|Título V. Ordenación de la actividad profesional · Capítulo III. Provisión de puestos de trabajo y movilidad","enunciado":"Según el artículo 82.2 del TREBEP, los funcionarios víctimas del terrorismo tienen derecho al traslado a otro puesto de trabajo propio de su cuerpo, escala o categoría profesional, de análogas características:","opciones":{"a":"Cuando la vacante sea de necesaria cobertura o, en caso contrario, dentro de la comunidad autónoma.","b":"En cualquier localidad del territorio nacional, aunque no exista vacante dotada presupuestariamente.","c":"Solo cuando la vacante sea de necesaria cobertura y esté ubicada en la misma provincia.","d":"Solo dentro de la misma localidad y siempre que exista vacante dotada presupuestariamente."},"correcta":"a","explicacion":"El art. 82.2 reconoce ese derecho «cuando la vacante sea de necesaria cobertura o, en caso contrario, dentro de la comunidad autónoma». La opción b) prescinde de cualquier límite territorial o de vacante, y las opciones c) y d) introducen restricciones a la provincia o a la localidad que el precepto no recoge.","cita":"«(…) tendrán derecho al traslado a otro puesto de trabajo propio de su cuerpo, escala o categoría profesional, de análogas características, cuando la vacante sea de necesaria cobertura o, en caso contrario, dentro de la comunidad autónoma.»","dificultad":2},{"id":"TREBEP-L7-008","ley":"TREBEP","articulo":"87.3","articulo_txt":"Art. 87.3 TREBEP","bloque_id":"TREBEP|Título VI. Situaciones administrativas","enunciado":"Según el artículo 87.3 del TREBEP, quienes se encuentren en situación de servicios especiales tendrán derecho, al menos, a reingresar al servicio activo:","opciones":{"a":"En la misma localidad, con las retribuciones correspondientes a la categoría, nivel o escalón de la carrera consolidados.","b":"En el mismo puesto de trabajo que ocupaban al pasar a dicha situación, que les queda reservado en todo caso.","c":"En cualquier localidad del ámbito territorial de su Administración, con las retribuciones del último cargo desempeñado.","d":"En la misma localidad, pero con las retribuciones del grado inicial del cuerpo o escala al que pertenezcan."},"correcta":"a","explicacion":"El art. 87.3 reconoce, como mínimo, el reingreso «en la misma localidad, en las condiciones y con las retribuciones correspondientes a la categoría, nivel o escalón de la carrera consolidados». El precepto no garantiza el mismo puesto, como dice la opción b); la opción c) cambia la localidad y la referencia retributiva, y la opción d) ignora la carrera consolidada.","cita":"«3. Quienes se encuentren en situación de servicios especiales tendrán derecho, al menos, a reingresar al servicio activo en la misma localidad, en las condiciones y con las retribuciones correspondientes a la categoría, nivel o escalón de la carrera consolidados, de acuerdo con el sistema de carrera administrativa vigente en la Administración Pública a la que pertenezcan.»","dificultad":2},{"id":"TREBEP-L7-011","ley":"TREBEP","articulo":"89.2","articulo_txt":"Art. 89.2 TREBEP","bloque_id":"TREBEP|Título VI. Situaciones administrativas","enunciado":"Según el artículo 89.2 del TREBEP, ¿qué periodo mínimo de servicios efectivos en cualquiera de las Administraciones Públicas, inmediatamente anteriores, se exige con carácter general para obtener la excedencia voluntaria por interés particular, sin perjuicio de que las leyes de Función Pública de desarrollo puedan establecer una duración menor?","opciones":{"a":"Un año.","b":"Cuatro años.","c":"Diez años.","d":"Cinco años."},"correcta":"d","explicacion":"El art. 89.2 exige haber prestado servicios efectivos «durante un periodo mínimo de cinco años inmediatamente anteriores», aunque añade que las leyes de Función Pública de desarrollo podrán establecer una duración menor. Las cifras de las opciones a), b) y c) no figuran en el precepto.","cita":"«2. Los funcionarios de carrera podrán obtener la excedencia voluntaria por interés particular cuando hayan prestado servicios efectivos en cualquiera de las Administraciones Públicas durante un periodo mínimo de cinco años inmediatamente anteriores. No obstante, las leyes de Función Pública que se dicten en desarrollo del presente Estatuto podrán establecer una duración menor del periodo de prestación de servicios exigido (…)»","dificultad":2},{"id":"TREBEP-L7-027","ley":"TREBEP","articulo":"94.2.a)","articulo_txt":"Art. 94.2.a) TREBEP","bloque_id":"TREBEP|Título VII. Régimen disciplinario","enunciado":"Según el artículo 94.2.a) del TREBEP, el principio de legalidad y tipicidad de las faltas y sanciones se hará efectivo, en el caso del personal laboral, a través de:","opciones":{"a":"Los contratos de trabajo individuales suscritos con cada trabajador.","b":"Los convenios colectivos.","c":"Los reglamentos de régimen interior aprobados por cada organismo público.","d":"Los acuerdos de la Mesa General de Negociación de las Administraciones Públicas."},"correcta":"b","explicacion":"El art. 94.2.a) recoge el principio de legalidad y tipicidad «a través de la predeterminación normativa o, en el caso del personal laboral, de los convenios colectivos». Los instrumentos de las opciones a), c) y d) no figuran en el precepto.","cita":"«a) Principio de legalidad y tipicidad de las faltas y sanciones, a través de la predeterminación normativa o, en el caso del personal laboral, de los convenios colectivos.»","dificultad":2},{"id":"TREBEP-L7-037","ley":"TREBEP","articulo":"97.1","articulo_txt":"Art. 97.1 TREBEP","bloque_id":"TREBEP|Título VII. Régimen disciplinario","enunciado":"Según el artículo 97.1 del TREBEP, ¿en qué plazo prescriben las faltas leves?","opciones":{"a":"A los cuatro meses.","b":"A los ocho meses.","c":"A los seis meses.","d":"A los nueve meses."},"correcta":"c","explicacion":"El art. 97.1 dispone que las infracciones «leves a los seis meses». Las cifras de las opciones a), b) y d) no figuran en el precepto.","cita":"«1. Las infracciones muy graves prescribirán a los tres años, las graves a los dos años y las leves a los seis meses (…)»","dificultad":2},{"id":"TREBEP-L7-045","ley":"TREBEP","articulo":"99","articulo_txt":"Art. 99 TREBEP","bloque_id":"TREBEP|Título VIII. Cooperación entre las Administraciones Públicas","enunciado":"Según el artículo 99 del TREBEP, ¿de acuerdo con qué principios actuarán y se relacionarán entre sí las Administraciones Públicas en las materias objeto del Estatuto?","opciones":{"a":"Jerarquía y coordinación, bajo la dirección de la Administración General del Estado.","b":"Cooperación y colaboración.","c":"Descentralización y desconcentración funcional.","d":"Subsidiariedad y solidaridad entre los territorios."},"correcta":"b","explicacion":"El art. 99 dispone que las Administraciones actuarán y se relacionarán entre sí «de acuerdo con los principios de cooperación y colaboración», respetando, en todo caso, el ejercicio legítimo por las otras Administraciones de sus competencias. Los principios de las opciones a), c) y d) no figuran en el precepto.","cita":"«Las Administraciones Públicas actuarán y se relacionarán entre sí en las materias objeto de este Estatuto de acuerdo con los principios de cooperación y colaboración, respetando, en todo caso, el ejercicio legítimo por las otras Administraciones de sus competencias.»","dificultad":1},{"id":"TREBEP-L7-046","ley":"TREBEP","articulo":"100.2","articulo_txt":"Art. 100.2 TREBEP","bloque_id":"TREBEP|Título VIII. Cooperación entre las Administraciones Públicas","enunciado":"Según el artículo 100.2 del TREBEP, la Comisión de Coordinación del Empleo Público se crea como:","opciones":{"a":"Órgano colegiado de negociación adscrito a la Mesa General de Negociación de las Administraciones Públicas.","b":"Órgano técnico y de trabajo dependiente de la Conferencia Sectorial de Administración Pública.","c":"Órgano consultivo independiente, adscrito al Ministerio competente en materia de función pública.","d":"Órgano de cooperación que sustituye a la Conferencia Sectorial de Administración Pública."},"correcta":"b","explicacion":"El art. 100.2 crea la Comisión «como órgano técnico y de trabajo dependiente de la Conferencia Sectorial de Administración Pública». Las opciones a) y c) le atribuyen otra naturaleza y adscripción, y la opción d) es falsa porque la Comisión depende de la Conferencia Sectorial, que el art. 100.1 mantiene como órgano de cooperación.","cita":"«2. Se crea la Comisión de Coordinación del Empleo Público como órgano técnico y de trabajo dependiente de la Conferencia Sectorial de Administración Pública.»","dificultad":2},{"id":"TREBEP-L8-004","ley":"TREBEP","articulo":"DA 3ª.3","articulo_txt":"DA 3ª.3 · TREBEP","bloque_id":"TREBEP|Disposiciones adicionales","enunciado":"Según la disposición adicional tercera del TREBEP, los funcionarios transferidos a las ciudades de Ceuta y Melilla que se integren como funcionarios propios de la ciudad a la que hayan sido transferidos quedarán en la situación administrativa de:","opciones":{"a":"Servicio activo en la Administración General del Estado.","b":"Excedencia voluntaria por interés particular.","c":"Servicios especiales.","d":"Servicio en otras Administraciones Públicas."},"correcta":"d","explicacion":"La DA 3ª.3 dispone que los funcionarios transferidos podrán integrarse como funcionarios propios de la ciudad «quedando en la situación administrativa de servicio en otras administraciones públicas». No pasan al servicio activo en la Administración del Estado de la opción a), ni a la excedencia de la opción b), ni a los servicios especiales de la opción c).","cita":"«3. Los funcionarios transferidos se regirán por la Ley de Función Pública de la Administración General del Estado y sus normas de desarrollo. No obstante, podrán integrarse como funcionarios propios de la ciudad a la que hayan sido transferidos quedando en la situación administrativa de servicio en otras administraciones públicas.»","dificultad":1},{"id":"TREBEP-L8-016","ley":"TREBEP","articulo":"DA 11ª.2","articulo_txt":"DA 11ª.2 · TREBEP","bloque_id":"TREBEP|Disposiciones adicionales","enunciado":"Según la disposición adicional undécima del TREBEP, ¿qué retribuciones percibirá el personal militar de carrera que preste servicios en la Administración civil?","opciones":{"a":"Las básicas que le correspondan como militar de carrera y las complementarias correspondientes al puesto de trabajo desempeñado.","b":"Las básicas y complementarias que le correspondan como militar de carrera, con independencia del puesto civil que desempeñe.","c":"Las básicas y complementarias del puesto civil, en las mismas condiciones que un funcionario del Subgrupo equivalente.","d":"Las complementarias del puesto civil y, de las básicas, únicamente el sueldo del Subgrupo civil equivalente."},"correcta":"a","explicacion":"La DA 11ª.2 dispone que «Las retribuciones a percibir serán las retribuciones básicas que les correspondan en su condición de militares de carrera, y las complementarias correspondientes al puesto de trabajo desempeñado». La opción b) mantiene también las complementarias militares, y las opciones c) y d) sustituyen las básicas militares por las de un funcionario civil.","cita":"«Las retribuciones a percibir serán las retribuciones básicas que les correspondan en su condición de militares de carrera, y las complementarias correspondientes al puesto de trabajo desempeñado. Los posibles ascensos que puedan producirse en su carrera militar no conllevarán variación alguna en las condiciones retributivas del puesto desempeñado.»","dificultad":2},{"id":"TREBEP-L8-030","ley":"TREBEP","articulo":"DT 3ª.2","articulo_txt":"DT 3ª.2 · TREBEP","bloque_id":"TREBEP|Disposiciones transitorias","enunciado":"Según la disposición transitoria tercera del TREBEP, ¿en qué Grupo o Subgrupo de clasificación profesional previsto en el artículo 76 se integra transitoriamente el Grupo B de clasificación existente a la entrada en vigor de la Ley 7/2007, de 12 de abril?","opciones":{"a":"En el Subgrupo C1.","b":"En el Grupo B del artículo 76.","c":"En el Subgrupo A1.","d":"En el Subgrupo A2."},"correcta":"d","explicacion":"La DT 3ª.2 establece la equivalencia «Grupo B: Subgrupo A2». El antiguo Grupo B no se integra en el Subgrupo C1 de la opción a), que corresponde al antiguo Grupo C, ni en el Subgrupo A1 de la opción c), que corresponde al antiguo Grupo A; tampoco en el Grupo B del art. 76 de la opción b), que es un Grupo distinto. Según la nota del BOE, el apartado 2 está redactado conforme a la corrección de errores publicada en el BOE núm. 278, de 20 de noviembre de 2015.","cita":"«2. Transitoriamente, los Grupos de clasificación existentes a la entrada en vigor de la Ley 7/2007, de 12 de abril, se integrarán en los Grupos de clasificación profesional de funcionarios previstos en el artículo 76, de acuerdo con las siguientes equivalencias: Grupo A: Subgrupo A1. Grupo B: Subgrupo A2. Grupo C: Subgrupo C1. Grupo D: Subgrupo C2. Grupo E: Agrupaciones Profesionales a que hace referencia la disposición adicional sexta.»","dificultad":2},{"id":"TREBEP-L8-033","ley":"TREBEP","articulo":"DT 5ª","articulo_txt":"DT 5ª · TREBEP","bloque_id":"TREBEP|Disposiciones transitorias","enunciado":"Según la disposición transitoria quinta del TREBEP, ¿hasta cuándo se mantienen con carácter de normativa básica los artículos de la Ley 9/1987, de 12 de junio, que esa disposición enumera?","opciones":{"a":"Hasta la entrada en vigor de las leyes de Función Pública que se dicten en desarrollo del Estatuto.","b":"Hasta que la Mesa General de Negociación de las Administraciones Públicas acuerde su sustitución.","c":"En tanto se determine el procedimiento electoral general previsto en el artículo 39 del Estatuto.","d":"Hasta la celebración de las primeras elecciones a órganos de representación tras la entrada en vigor del Estatuto."},"correcta":"c","explicacion":"La DT 5ª mantiene esos artículos como normativa básica «En tanto se determine el procedimiento electoral general previsto en el artículo 39 del presente Estatuto». No vincula su vigencia a las leyes de Función Pública de desarrollo como la opción a), a un acuerdo de la Mesa General como la opción b) ni a la celebración de unas elecciones como la opción d).","cita":"«En tanto se determine el procedimiento electoral general previsto en el artículo 39 del presente Estatuto, se mantendrán con carácter de normativa básica los siguientes artículos de la Ley 9/1987, de 12 de junio, de órganos de representación, determinación de las condiciones de trabajo y participación del personal al servicio de las Administraciones Públicas: 13.2, 13.3, 13.4, 13.5, 13.6, 15, 16, 17, 18, 19, 20, 21, 25, 26, 27, 28 y 29.»","dificultad":2},{"id":"TREBEP-L8-035","ley":"TREBEP","articulo":"DD única.d)","articulo_txt":"DD única.d) · TREBEP","bloque_id":"TREBEP|Disposición derogatoria","enunciado":"Según la disposición derogatoria única del TREBEP, ¿qué queda derogado de la Ley 7/1985, de 2 de abril, reguladora de las bases del Régimen Local?","opciones":{"a":"El título VII en su integridad.","b":"El capítulo III del título VII.","c":"El capítulo II del título VII.","d":"Los capítulos I y II del título VII."},"correcta":"b","explicacion":"La letra d) de la DD única deroga, de la Ley 7/1985, «el capítulo III del título VII», con el alcance establecido en el apartado 2 de la DF 4ª; la letra e) deroga el mismo capítulo y título del Real Decreto Legislativo 781/1986. No se deroga el título VII completo como dice la opción a), ni los capítulos que mencionan las opciones c) y d).","cita":"«d) De la Ley 7/1985, de 2 de abril, reguladora de las bases del Régimen Local, el capítulo III del título VII.»","dificultad":3},{"id":"TREBEP-L8-039","ley":"TREBEP","articulo":"DF 4ª.1","articulo_txt":"DF 4ª.1 · TREBEP","bloque_id":"TREBEP|Disposiciones finales","enunciado":"Según la disposición final cuarta del TREBEP, además de lo establecido en los capítulos II y III del título III, salvo el artículo 25.2, ¿qué otra parte del Estatuto producirá efectos a partir de la entrada en vigor de las leyes de Función Pública que se dicten en su desarrollo?","opciones":{"a":"El capítulo I del título V.","b":"El capítulo III del título V.","c":"El capítulo II del título V.","d":"El capítulo I del título IV."},"correcta":"b","explicacion":"La DF 4ª.1 difiere hasta la entrada en vigor de las leyes de Función Pública de desarrollo los efectos de los capítulos II y III del título III, excepto el art. 25.2, y del «capítulo III del título V», dedicado a la provisión de puestos de trabajo y movilidad. Los capítulos de las opciones a), c) y d) no figuran en esa previsión.","cita":"«1. Lo establecido en los capítulos II y III del título III, excepto el artículo 25.2, y en el capítulo III del título V producirá efectos a partir de la entrada en vigor de las leyes de Función Pública que se dicten en desarrollo de este Estatuto.»","dificultad":3}]};</script>
<script>
/* Letra de Ley — motor de test. Sin dependencias; funciona sin conexión.
   Necesita window.LDL_CONFIG y window.LDL_BANCO (los inyecta sistema/letradeley.py). */
(function () {
  "use strict";
  var CFG = window.LDL_CONFIG, B = window.LDL_BANCO;
  var raiz = document.getElementById("ldl");
  var LETRAS = ["a", "b", "c", "d"];
  var POR_ID = {};
  B.preguntas.forEach(function (p) { POR_ID[p.id] = p; });
  var CLAVE = "ldl1:" + CFG.pack.id;
  var prog = cargar();
  var sesion = null;
  var vista = CFG.modo === "web" ? "portada" : "inicio";
  var reloj = null;

  /* ---------- utilidades ---------- */
  function esc(t) {
    return String(t == null ? "" : t).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function barajar(lista) {
    var a = lista.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function pct(a, b) { return b ? Math.round((a / b) * 100) : 0; }
  function plural(n, uno, varios) { return n + " " + (n === 1 ? uno : varios); }
  function num(n) { return String(n).replace(".", ","); }
  function cargar() {
    try { var s = localStorage.getItem(CLAVE); if (s) { var d = JSON.parse(s); if (d && d.p) return d; } } catch (e) {}
    return { p: {}, h: [] };
  }
  function guardar() { try { localStorage.setItem(CLAVE, JSON.stringify(prog)); } catch (e) {} }
  function registrar(id, acierto) {
    var r = prog.p[id] || { v: 0, a: 0, f: 0, c: 0 };
    r.v++;
    if (acierto) { r.a++; r.c = Math.min((r.c || 0) + 1, 5); } else { r.f++; r.c = 0; }
    r.u = acierto ? 1 : 0;
    r.t = Date.now();
    prog.p[id] = r;
    guardar();
  }
  function fallosPendientes() {
    return B.preguntas.filter(function (p) { var r = prog.p[p.id]; return r && r.u === 0; });
  }
  function resumen(lista) {
    var vistas = 0, aciertos = 0, intentos = 0;
    lista.forEach(function (p) {
      var r = prog.p[p.id];
      if (r) { vistas++; aciertos += r.a; intentos += r.v; }
    });
    return { total: lista.length, vistas: vistas, acierto: pct(aciertos, intentos) };
  }
  function delBloque(id) { return B.preguntas.filter(function (p) { return p.bloque_id === id; }); }

  /* ---------- tema claro / oscuro ---------- */
  function aplicarTema() {
    var t = null;
    try { t = localStorage.getItem("ldl:tema"); } catch (e) {}
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    else document.documentElement.removeAttribute("data-theme");
    return t || "auto";
  }
  function cambiarTema() {
    var orden = { auto: "light", light: "dark", dark: "auto" };
    var actual = aplicarTema();
    try { localStorage.setItem("ldl:tema", orden[actual]); } catch (e) {}
    aplicarTema();
    pintar();
  }

  /* ---------- sesiones ---------- */
  function empezar(tipo, preguntas, opciones) {
    opciones = opciones || {};
    if (!preguntas.length) return;
    pararReloj();
    sesion = {
      tipo: tipo, titulo: opciones.titulo || "Test", ids: preguntas.map(function (p) { return p.id; }),
      i: 0, resp: {}, corregida: {}, inicio: Date.now(), limite: opciones.minutos ? opciones.minutos * 60 : 0, fin: null,
      origen: vista === "test" || vista === "resultado" ? (sesion && sesion.origen) || "inicio" : vista
    };
    vista = "test";
    if (sesion.limite) reloj = setInterval(tic, 1000);
    pintar();
    window.scrollTo(0, 0);
  }
  function tic() {
    if (!sesion || sesion.fin) return pararReloj();
    var el = document.getElementById("ldl-crono");
    var resta = sesion.limite - Math.floor((Date.now() - sesion.inicio) / 1000);
    if (resta <= 0) { terminar(); return; }
    if (el) el.textContent = mmss(resta);
  }
  function pararReloj() { if (reloj) { clearInterval(reloj); reloj = null; } }
  function mmss(s) { var m = Math.floor(s / 60), r = s % 60; return m + ":" + (r < 10 ? "0" : "") + r; }

  function responder(letra) {
    var id = sesion.ids[sesion.i];
    if (sesion.tipo === "simulacro") {
      sesion.resp[id] = sesion.resp[id] === letra ? undefined : letra;
      pintar();
      return;
    }
    if (sesion.corregida[id]) return;
    sesion.resp[id] = letra;
    sesion.corregida[id] = true;
    registrar(id, letra === POR_ID[id].correcta);
    pintar();
  }
  function siguiente() {
    if (sesion.i < sesion.ids.length - 1) { sesion.i++; pintar(); window.scrollTo(0, 0); }
    else terminar();
  }
  function anterior() { if (sesion.i > 0) { sesion.i--; pintar(); } }
  function terminar() {
    pararReloj();
    if (sesion.tipo === "simulacro") {
      sesion.ids.forEach(function (id) {
        if (sesion.resp[id]) registrar(id, sesion.resp[id] === POR_ID[id].correcta);
      });
    }
    sesion.fin = Date.now();
    var r = calcular(sesion);
    prog.h.unshift({ t: sesion.fin, tipo: sesion.tipo, n: r.total, a: r.aciertos, e: r.errores, nota: r.nota });
    prog.h = prog.h.slice(0, 50);
    guardar();
    vista = "resultado";
    pintar();
    window.scrollTo(0, 0);
  }
  function calcular(s) {
    var a = 0, e = 0, nr = 0;
    s.ids.forEach(function (id) {
      var r = s.resp[id];
      if (!r) nr++; else if (r === POR_ID[id].correcta) a++; else e++;
    });
    var pen = (CFG.simulacro && CFG.simulacro.penalizacion) || 1 / 3;
    var neta = s.tipo === "simulacro" ? a - e * pen : a;
    var nota = Math.max(0, (neta / s.ids.length) * 10);
    return { total: s.ids.length, aciertos: a, errores: e, blancos: nr, neta: neta, nota: Math.round(nota * 100) / 100 };
  }

  /* ---------- vistas ---------- */
  function cabecera() {
    var tema = aplicarTema();
    var etiquetas = { auto: "Tema: auto", light: "Tema: claro", dark: "Tema: oscuro" };
    return '<header class="ldl-top"><a class="ldl-brand" href="' + esc(CFG.web || "#") + '">' +
      '<span class="ldl-logo" aria-hidden="true">§</span><span><b>Letra de Ley</b><small>' +
      esc(CFG.pack.nombre) + "</small></span></a>" +
      '<button class="ldl-tema" data-acc="tema" type="button">' + etiquetas[tema] + "</button></header>";
  }
  function navegacion() {
    if (CFG.modo === "web") return "";
    var items = [["inicio", "Inicio"], ["temas", "Por temas"], ["simulacro", "Simulacro"], ["fallos", "Fallos"], ["stats", "Estadísticas"]];
    return '<nav class="ldl-nav" aria-label="Secciones">' + items.map(function (it) {
      var actual = vista === it[0] || (vista === "test" && sesion && sesion.origen === it[0]);
      return '<button type="button" data-acc="ir" data-v="' + it[0] + '"' + (actual ? ' aria-current="page"' : "") + ">" + it[1] + "</button>";
    }).join("") + "</nav>";
  }
  function pie() {
    return '<p class="ldl-pie">Letra de Ley · ' + esc(CFG.pack.edicion) + " · Texto legal actualizado a " +
      esc(CFG.pack.actualizado) + "<br>Uso personal. Prohibida su redistribución.</p>";
  }

  function vInicio() {
    var r = resumen(B.preguntas), f = fallosPendientes().length;
    return '<section class="ldl-card"><h2>' + esc(CFG.pack.nombre) + "</h2>" +
      '<p class="ldl-muted">' + B.preguntas.length + " preguntas comentadas, con el artículo exacto de cada respuesta.</p>" +
      '<div class="ldl-kpis"><div class="ldl-kpi"><b>' + r.vistas + "/" + r.total + "</b><span>respondidas</span></div>" +
      '<div class="ldl-kpi"><b>' + r.acierto + ' %</b><span>de acierto</span></div>' +
      '<div class="ldl-kpi"><b>' + f + "</b><span>fallos por repasar</span></div></div>" +
      '<div class="ldl-acciones"><button class="ldl-btn" data-acc="rapido" type="button">Test rápido de 20</button>' +
      '<button class="ldl-btn sec" data-acc="ir" data-v="simulacro" type="button">Simulacro de examen</button>' +
      (f ? '<button class="ldl-btn sec" data-acc="repasar" type="button">Repasar ' + f + " fallos</button>" : "") +
      "</div></section>" +
      '<section class="ldl-card"><h3>Cómo sacarle partido</h3><ol class="ldl-muted">' +
      "<li>Practica <b>por temas</b>: cada respuesta te enseña el artículo y por qué fallan las demás opciones.</li>" +
      "<li>Cada pocos días, <b>repasa tus fallos</b>: es donde más se aprende.</li>" +
      "<li>Antes del examen, haz <b>simulacros</b> con tiempo y con la penalización real (cada error resta 1/3).</li></ol>" +
      '<p class="ldl-small ldl-muted">Tu progreso se guarda en este dispositivo y en este navegador.</p></section>' + historial();
  }
  function historial() {
    if (!prog.h.length) return "";
    return '<section class="ldl-card"><h3>Últimos tests</h3><ul class="ldl-revision">' + prog.h.slice(0, 5).map(function (h) {
      var d = new Date(h.t);
      return "<li><b>" + (h.tipo === "simulacro" ? "Simulacro" : "Práctica") + "</b> · " + d.toLocaleDateString("es-ES") +
        " · " + h.a + "/" + h.n + " aciertos" + (h.tipo === "simulacro" ? " · nota " + num(h.nota) : "") + "</li>";
    }).join("") + "</ul></section>";
  }
  function vTemas() {
    var html = '<section class="ldl-card"><h2>Practicar por temas</h2><p class="ldl-muted">Elige un bloque. Las preguntas salen en orden aleatorio y se corrigen al momento.</p><ul class="ldl-bloques">';
    B.bloques.forEach(function (b) {
      var lista = delBloque(b.id), r = resumen(lista);
      html += '<li><button type="button" data-acc="bloque" data-id="' + esc(b.id) + '"><span class="t">' + esc(b.nombre) +
        '</span><span class="n">' + r.vistas + "/" + r.total + (r.vistas ? " · " + r.acierto + " %" : "") + "</span>" +
        '<span class="ldl-barra"><i style="width:' + pct(r.vistas, r.total) + '%"></i></span></button></li>';
    });
    return html + "</ul></section>";
  }
  function vSimulacro() {
    var total = B.preguntas.length;
    var opcionesN = [10, 20, 30, 50, 100].filter(function (n) { return n < total; });
    opcionesN.push(total);
    var porDefecto = Math.min((CFG.simulacro && CFG.simulacro.preguntas) || 30, total);
    return '<section class="ldl-card"><h2>Simulacro de examen</h2>' +
      '<p class="ldl-muted">Como el día del examen: no ves las soluciones hasta el final y cada error resta un tercio de acierto.</p>' +
      '<div class="ldl-campo"><label for="ldl-n">Número de preguntas</label><select id="ldl-n">' +
      opcionesN.map(function (n) { return "<option" + (n === porDefecto ? " selected" : "") + ">" + n + "</option>"; }).join("") +
      '</select></div><div class="ldl-campo"><label for="ldl-t">Tiempo</label><select id="ldl-t">' +
      '<option value="1">1 minuto por pregunta</option><option value="0">Sin límite de tiempo</option></select></div>' +
      '<div class="ldl-campo"><label for="ldl-b">Temas</label><select id="ldl-b"><option value="">Todos</option>' +
      B.bloques.map(function (b) { return '<option value="' + esc(b.id) + '">' + esc(b.nombre) + "</option>"; }).join("") +
      '</select></div><div class="ldl-acciones"><button class="ldl-btn" data-acc="simular" type="button">Empezar simulacro</button></div></section>';
  }
  function vFallos() {
    var f = fallosPendientes();
    if (!f.length) {
      return '<section class="ldl-card"><h2>Repaso de fallos</h2><p class="ldl-muted">No tienes fallos pendientes. Cuando falles una pregunta aparecerá aquí hasta que la aciertes.</p></section>';
    }
    return '<section class="ldl-card"><h2>Repaso de fallos</h2><p class="ldl-muted">Tienes <b>' + f.length +
      "</b> preguntas falladas. Salen de aquí en cuanto las aciertas.</p>" +
      '<div class="ldl-acciones"><button class="ldl-btn" data-acc="repasar" type="button">Repasar ahora</button></div></section>';
  }
  function vStats() {
    var html = '<section class="ldl-card"><h2>Estadísticas</h2><ul class="ldl-bloques">';
    B.bloques.forEach(function (b) {
      var r = resumen(delBloque(b.id));
      html += '<li><button type="button" data-acc="bloque" data-id="' + esc(b.id) + '"><span class="t">' + esc(b.nombre) +
        '</span><span class="n">' + (r.vistas ? r.acierto + " % de acierto" : "sin empezar") + '</span><span class="ldl-barra"><i style="width:' +
        r.acierto + '%"></i></span></button></li>';
    });
    html += '</ul></section><section class="ldl-card"><h3>Empezar de cero</h3><p class="ldl-muted ldl-small">Borra tu progreso guardado en este dispositivo.</p>' +
      '<div class="ldl-acciones"><button class="ldl-btn sec" data-acc="borrar" type="button">Borrar mi progreso</button></div></section>';
    return html;
  }
  function vPortada() {
    var n = B.preguntas.length;
    return '<section class="ldl-card"><h2>' + esc(CFG.pack.nombre) + "</h2>" +
      '<p class="ldl-muted">' + n + " preguntas tipo examen, corregidas al momento, con el artículo exacto y la explicación de cada opción. Gratis y sin registrarte.</p>" +
      '<div class="ldl-acciones"><button class="ldl-btn" data-acc="empezarweb" type="button">Empezar el test</button></div></section>';
  }

  function vTest() {
    var id = sesion.ids[sesion.i], p = POR_ID[id], sim = sesion.tipo === "simulacro";
    var elegida = sesion.resp[id], corregida = !sim && sesion.corregida[id];
    var html = '<section class="ldl-card"><div class="ldl-meta"><span>' + esc(sesion.titulo) + " · " + (sesion.i + 1) + " de " + sesion.ids.length +
      "</span><span>" + (sesion.limite ? '⏱ <span id="ldl-crono" class="ldl-crono">' +
        mmss(Math.max(0, sesion.limite - Math.floor((Date.now() - sesion.inicio) / 1000))) + "</span>" : esc(p.articulo_txt)) +
      '</span></div><div class="ldl-progreso"><i style="width:' + pct(sesion.i + (corregida ? 1 : 0), sesion.ids.length) + '%"></i></div>' +
      '<p class="ldl-enunciado">' + esc(p.enunciado) + '</p><div class="ldl-opciones" role="group" aria-label="Opciones">';
    LETRAS.forEach(function (l) {
      var cls = "ldl-op";
      if (corregida) { if (l === p.correcta) cls += " ok"; else if (l === elegida) cls += " ko"; }
      else if (sim && elegida === l) cls += " marcada";
      html += '<button type="button" class="' + cls + '" data-acc="resp" data-l="' + l + '"' + (corregida ? " disabled" : "") +
        (sim ? ' aria-pressed="' + (elegida === l) + '"' : "") + '><span class="l">' + l + ")</span><span>" + esc(p.opciones[l]) + "</span></button>";
    });
    html += "</div>";
    if (corregida) html += feedback(p, elegida);
    html += '<div class="ldl-acciones">';
    if (sim) {
      html += (sesion.i > 0 ? '<button class="ldl-btn sec" data-acc="ant" type="button">Anterior</button>' : "") +
        '<button class="ldl-btn" data-acc="sig" type="button">' + (sesion.i < sesion.ids.length - 1 ? "Siguiente" : "Entregar") + "</button>" +
        (sesion.i < sesion.ids.length - 1 ? '<button class="ldl-btn sec" data-acc="entregar" type="button">Entregar ya</button>' : "");
    } else if (corregida) {
      html += '<button class="ldl-btn" data-acc="sig" type="button">' + (sesion.i < sesion.ids.length - 1 ? "Siguiente" : "Ver resultado") + "</button>";
    }
    html += '<button class="ldl-btn sec" data-acc="salir" type="button">Salir</button></div></section>';
    return html;
  }
  function feedback(p, elegida) {
    var bien = elegida === p.correcta;
    return '<div class="ldl-feedback" aria-live="polite"><div class="v ' + (bien ? "ok" : "ko") + '">' +
      (bien ? "¡Correcta!" : "Incorrecta. La respuesta correcta es la " + p.correcta + ")") + "</div><div>" + esc(p.explicacion) + "</div>" +
      (p.cita ? '<blockquote class="ldl-cita">' + esc(p.cita) + "<small>" + esc(p.articulo_txt) + "</small></blockquote>" : "") + "</div>";
  }
  function vResultado() {
    var r = calcular(sesion), sim = sesion.tipo === "simulacro";
    var html = '<section class="ldl-card"><h2>' + (sim ? "Resultado del simulacro" : "Resultado") + "</h2>" +
      '<div class="ldl-nota">' + (sim ? num(r.nota.toFixed(2)) : r.aciertos + "/" + r.total) + "</div>" +
      '<p class="ldl-muted">' + plural(r.aciertos, "acierto", "aciertos") + " · " + plural(r.errores, "error", "errores") +
      (r.blancos ? " · " + r.blancos + " en blanco" : "") +
      (sim ? " · nota sobre 10 con penalización" : "") + "</p>";
    if (CFG.modo === "web") html += ctaWeb(r);
    html += '<div class="ldl-acciones">' + (CFG.modo === "web" ? '<button class="ldl-btn sec" data-acc="empezarweb" type="button">Repetir con otro orden</button>' :
      '<button class="ldl-btn" data-acc="ir" data-v="inicio" type="button">Volver al inicio</button>') + "</div></section>";
    html += '<section class="ldl-card"><h3>Revisión</h3><ul class="ldl-revision">';
    sesion.ids.forEach(function (id, n) {
      var p = POR_ID[id], e = sesion.resp[id], chip = !e ? '<span class="ldl-chip nr">En blanco</span>' :
        e === p.correcta ? '<span class="ldl-chip ok">Bien</span>' : '<span class="ldl-chip ko">Mal</span>';
      html += "<li>" + chip + '<span class="e">' + (n + 1) + ". " + esc(p.enunciado) + "</span><br>" +
        '<span class="ldl-small">Correcta: <b>' + p.correcta + ") " + esc(p.opciones[p.correcta]) + "</b>" +
        (e && e !== p.correcta ? " · Marcaste " + e + ")" : "") + '</span><br><span class="ldl-small ldl-muted">' + esc(p.explicacion) + "</span></li>";
    });
    return html + "</ul></section>";
  }
  function ctaWeb() {
    var c = CFG.compra || {}, html = "";
    if (c.url) {
      html += '<div class="ldl-card ldl-cta"><h3>' + esc(c.titulo) + '</h3><p class="ldl-muted">' + esc(c.texto) + "</p>" +
        '<div class="ldl-acciones"><a class="ldl-btn acc" href="' + esc(c.url) + '">' + esc(c.boton) + "</a></div></div>";
    }
    if (CFG.telegram) {
      html += '<p class="ldl-small">¿Quieres un test cada día? <a href="' + esc(CFG.telegram) + '">Únete gratis al canal de Telegram</a>.</p>';
    }
    return html;
  }

  function pintar() {
    var cuerpo;
    if (vista === "test") cuerpo = vTest();
    else if (vista === "resultado") cuerpo = vResultado();
    else if (vista === "portada") cuerpo = vPortada();
    else if (vista === "temas") cuerpo = vTemas();
    else if (vista === "simulacro") cuerpo = vSimulacro();
    else if (vista === "fallos") cuerpo = vFallos();
    else if (vista === "stats") cuerpo = vStats();
    else cuerpo = vInicio();
    raiz.innerHTML = '<div class="ldl">' + cabecera() + navegacion() + "<main>" + cuerpo + "</main>" + pie() + "</div>";
  }

  /* ---------- eventos ---------- */
  raiz.addEventListener("click", function (ev) {
    var el = ev.target.closest("[data-acc]");
    if (!el) return;
    var acc = el.getAttribute("data-acc");
    if (acc === "tema") return cambiarTema();
    if (acc === "ir") { pararReloj(); vista = el.getAttribute("data-v"); sesion = null; pintar(); return; }
    if (acc === "rapido") return empezar("practica", barajar(B.preguntas).slice(0, 20), { titulo: "Test rápido" });
    if (acc === "repasar") return empezar("practica", barajar(fallosPendientes()).slice(0, 30), { titulo: "Repaso de fallos" });
    if (acc === "bloque") {
      var b = B.bloques.filter(function (x) { return x.id === el.getAttribute("data-id"); })[0];
      return empezar("practica", barajar(delBloque(b.id)), { titulo: b.nombre });
    }
    if (acc === "simular") {
      var n = parseInt(document.getElementById("ldl-n").value, 10);
      var conTiempo = document.getElementById("ldl-t").value === "1";
      var bloque = document.getElementById("ldl-b").value;
      var fuente = bloque ? delBloque(bloque) : B.preguntas;
      var elegidas = barajar(fuente).slice(0, n);
      return empezar("simulacro", elegidas, { titulo: "Simulacro", minutos: conTiempo ? elegidas.length : 0 });
    }
    if (acc === "empezarweb") return empezar("practica", barajar(B.preguntas), { titulo: "Test gratuito" });
    if (acc === "resp") return responder(el.getAttribute("data-l"));
    if (acc === "sig") return siguiente();
    if (acc === "ant") return anterior();
    if (acc === "entregar") return terminar();
    if (acc === "salir") { pararReloj(); sesion = null; vista = CFG.modo === "web" ? "portada" : "inicio"; pintar(); return; }
    if (acc === "borrar") {
      if (el.getAttribute("data-confirmar") === "1") { prog = { p: {}, h: [] }; guardar(); pintar(); }
      else { el.setAttribute("data-confirmar", "1"); el.textContent = "Pulsa otra vez para confirmar"; }
    }
  });
  document.addEventListener("keydown", function (ev) {
    if (vista !== "test" || !sesion || ev.altKey || ev.ctrlKey || ev.metaKey) return;
    var k = ev.key.toLowerCase(), mapa = { "1": "a", "2": "b", "3": "c", "4": "d", a: "a", b: "b", c: "c", d: "d" };
    if (mapa[k]) { ev.preventDefault(); responder(mapa[k]); }
    else if (k === "enter" || k === "arrowright") {
      var id = sesion.ids[sesion.i];
      if (sesion.tipo === "simulacro" || sesion.corregida[id]) { ev.preventDefault(); siguiente(); }
    } else if (k === "arrowleft" && sesion.tipo === "simulacro") { ev.preventDefault(); anterior(); }
  });

  pintar();
})();
</script>
</body>
</html>
