egislación de las comunidades autónomas, con respeto a la autonomía local». La opción a) excluye la legislación autonómica, la opción c) remite a unas ordenanzas locales que el precepto no menciona y la opción d) convierte la legislación estatal en supletoria.","cita":"«1. El personal funcionario de las entidades locales se rige por la legislación estatal que resulte de aplicación, de la que forma parte este Estatuto y por la legislación de las comunidades autónomas, con respeto a la autonomía local.»","dificultad":2},{"id":"TREBEP-L1-012","ley":"TREBEP","articulo":"4","articulo_txt":"Art. 4 TREBEP","bloque_id":"TREBEP|Título I. Objeto y ámbito de aplicación","enunciado":"Según el artículo 4 del TREBEP, ¿cuál de los siguientes colectivos NO figura en su enumeración?","opciones":{"a":"Personal del Centro Nacional de Inteligencia.","b":"Personal funcionario de los ayuntamientos.","c":"Personal retribuido por arancel.","d":"Personal del Banco de España y del Fondo de Garantía de Depósitos de Entidades de Crédito."},"correcta":"b","explicacion":"El personal funcionario de las entidades locales no está en el art. 4; su régimen lo fija el art. 3.1. El art. 4 sí enumera al personal del Centro Nacional de Inteligencia de la opción a) en su letra g), al personal retribuido por arancel de la opción c) en la letra f) y al personal del Banco de España y del Fondo de Garantía de Depósitos de Entidades de Crédito de la opción d) en la letra h).","cita":"«f) Personal retribuido por arancel. g) Personal del Centro Nacional de Inteligencia. h) Personal del Banco de España y del Fondo de Garantía de Depósitos de Entidades de Crédito.»","dificultad":2},{"id":"TREBEP-L1-014","ley":"TREBEP","articulo":"5","articulo_txt":"Art. 5 TREBEP","bloque_id":"TREBEP|Título I. Objeto y ámbito de aplicación","enunciado":"Según el artículo 5 del TREBEP, el personal laboral de la Sociedad Estatal Correos y Telégrafos se regirá por:","opciones":{"a":"Lo dispuesto en el Estatuto y, en su defecto, por el convenio colectivo.","b":"La legislación de Función Pública de la Administración General del Estado.","c":"La legislación laboral y demás normas convencionalmente aplicables.","d":"El régimen estatutario de los funcionarios públicos."},"correcta":"c","explicacion":"El art. 5, párrafo segundo, dispone: «Su personal laboral se regirá por la legislación laboral y demás normas convencionalmente aplicables». El precepto no menciona para este personal el Estatuto, que la opción a) antepone al convenio colectivo, ni la legislación de Función Pública de la opción b) ni el régimen estatutario de la opción d).","cita":"«Su personal laboral se regirá por la legislación laboral y demás normas convencionalmente aplicables.»","dificultad":1},{"id":"TREBEP-L1-017","ley":"TREBEP","articulo":"7","articulo_txt":"Art. 7 TREBEP","bloque_id":"TREBEP|Título I. Objeto y ámbito de aplicación","enunciado":"Según el artículo 7 del TREBEP, en materia de permisos de nacimiento, adopción, del progenitor diferente de la madre biológica, de lactancia y parental, el personal laboral al servicio de las Administraciones públicas se regirá:","opciones":{"a":"Por las previsiones del Estatuto de los Trabajadores sobre suspensión del contrato, con preferencia sobre el TREBEP.","b":"Por lo que disponga el convenio colectivo y, en su defecto, por el TREBEP.","c":"Por lo previsto en el TREBEP, sin aplicarse las previsiones del Estatuto de los Trabajadores sobre suspensión del contrato.","d":"Por el régimen que elija cada trabajador entre el del TREBEP y el del Estatuto de los Trabajadores."},"correcta":"c","explicacion":"El párrafo segundo del art. 7, en la redacción dada por el art. 2.1 del Real Decreto-ley 9/2025, de 29 de julio, dispone que en esos permisos este personal «se regirá por lo previsto en el presente Estatuto», sin que le sean de aplicación las previsiones del texto refundido de la Ley del Estatuto de los Trabajadores sobre las suspensiones de los contratos de trabajo por los mismos supuestos de hecho. Por eso fallan la opción a), que da preferencia al Estatuto de los Trabajadores, la opción b), que remite al convenio colectivo, y la opción d), que deja la elección al trabajador. El art. 7 también fue modificado por el art. 3.1 del Real Decreto-ley 6/2019, de 1 de marzo.","cita":"«No obstante, en materia de permisos de nacimiento, adopción, del progenitor diferente de la madre biológica, de lactancia y parental, el personal laboral al servicio de las Administraciones públicas se regirá por lo previsto en el presente Estatuto, no siendo de aplicación a este personal, por tanto, las previsiones del texto refundido de la Ley del Estatuto de los Trabajadores sobre las suspensiones de los contratos de trabajo que, en su caso, corresponderían por los mismos supuestos de hecho.»","dificultad":2},{"id":"TREBEP-L1-018","ley":"TREBEP","articulo":"8.1","articulo_txt":"Art. 8.1 TREBEP","bloque_id":"TREBEP|Título II. Personal al servicio de las Administraciones Públicas · Capítulo I. Clases de personal","enunciado":"Según el artículo 8.1 del TREBEP, son empleados públicos quienes desempeñan funciones retribuidas en las Administraciones Públicas al servicio de:","opciones":{"a":"La autoridad que los nombra.","b":"El Gobierno de la Nación.","c":"La Administración que los contrata.","d":"Los intereses generales."},"correcta":"d","explicacion":"El art. 8.1 define a los empleados públicos como quienes desempeñan funciones retribuidas en las Administraciones Públicas «al servicio de los intereses generales». Las opciones a), b) y c) sustituyen esa referencia por una autoridad, el Gobierno o la Administración de la que dependen, que el precepto no menciona.","cita":"«1. Son empleados públicos quienes desempeñan funciones retribuidas en las Administraciones Públicas al servicio de los intereses generales.»","dificultad":1},{"id":"TREBEP-L1-022","ley":"TREBEP","articulo":"9.2","articulo_txt":"Art. 9.2 TREBEP","bloque_id":"TREBEP|Título II. Personal al servicio de las Administraciones Públicas · Capítulo I. Clases de personal","enunciado":"Según el artículo 9.2 del TREBEP, el ejercicio de las funciones que impliquen la participación directa o indirecta en el ejercicio de las potestades públicas corresponde:","opciones":{"a":"A los funcionarios públicos y, si lo autoriza la ley de desarrollo, también al personal laboral fijo.","b":"Exclusivamente a los funcionarios públicos, en los términos de la ley de desarrollo de cada Administración.","c":"Indistintamente a los funcionarios de carrera y al personal laboral fijo.","d":"A cualquier empleado público seleccionado conforme a los principios de mérito y capacidad."},"correcta":"b","explicacion":"El art. 9.2 dispone que esas funciones, igual que las que impliquen la salvaguardia de los intereses generales del Estado y de las Administraciones Públicas, «corresponden exclusivamente a los funcionarios públicos, en los términos que en la ley de desarrollo de cada Administración Pública se establezca». Las opciones a), c) y d) abren esas funciones a personal que no es funcionario, en contra de la reserva exclusiva del precepto.","cita":"«2. En todo caso, el ejercicio de las funciones que impliquen la participación directa o indirecta en el ejercicio de las potestades públicas o en la salvaguardia de los intereses generales del Estado y de las Administraciones Públicas corresponden exclusivamente a los funcionarios públicos, en los términos que en la ley de desarrollo de cada Administración Pública se establezca.»","dificultad":2},{"id":"TREBEP-L1-030","ley":"TREBEP","articulo":"10.4","articulo_txt":"Art. 10.4 TREBEP","bloque_id":"TREBEP|Título II. Personal al servicio de las Administraciones Públicas · Capítulo I. Clases de personal","enunciado":"Según el artículo 10.4 del TREBEP, una vez producido el fin de la relación de interinidad por el transcurso del plazo previsto desde el nombramiento del personal funcionario interino, la vacante:","opciones":{"a":"Deberá ser amortizada y no podrá volver a cubrirse por personal funcionario interino en ningún caso.","b":"Podrá cubrirse mediante la contratación de personal laboral temporal.","c":"Solo podrá ocuparla personal funcionario de carrera, salvo que el proceso selectivo quede desierto.","d":"Quedará reservada al personal funcionario interino que la venía ocupando."},"correcta":"c","explicacion":"El art. 10.4, párrafo segundo, dispone que, transcurridos tres años desde el nombramiento, «la vacante solo podrá ser ocupada por personal funcionario de carrera, salvo que el correspondiente proceso selectivo quede desierto, en cuyo caso se podrá efectuar otro nombramiento de personal funcionario interino». Por eso fallan la opción a), que impone la amortización y prohíbe todo nuevo nombramiento interino, la opción b), que admite personal laboral temporal, y la opción d), que reserva la plaza al interino que la ocupaba.","cita":"«No obstante, transcurridos tres años desde el nombramiento del personal funcionario interino se producirá el fin de la relación de interinidad, y la vacante solo podrá ser ocupada por personal funcionario de carrera, salvo que el correspondiente proceso selectivo quede desierto, en cuyo caso se podrá efectuar otro nombramiento de personal funcionario interino.»","dificultad":2},{"id":"TREBEP-L1-041","ley":"TREBEP","articulo":"13.2","articulo_txt":"Art. 13.2 TREBEP","bloque_id":"TREBEP|Título II. Personal al servicio de las Administraciones Públicas · Capítulo II. Personal directivo","enunciado":"Según el artículo 13.2 del TREBEP, la designación del personal directivo atenderá a principios de mérito y capacidad y a criterios de:","opciones":{"a":"Antigüedad.","b":"Oportunidad.","c":"Idoneidad.","d":"Representatividad."},"correcta":"c","explicacion":"El art. 13.2 dispone que la designación «atenderá a principios de mérito y capacidad y a criterios de idoneidad», y que se llevará a cabo mediante procedimientos que garanticen la publicidad y concurrencia. La antigüedad, la oportunidad y la representatividad de las opciones a), b) y d) no figuran en el precepto.","cita":"«2. Su designación atenderá a principios de mérito y capacidad y a criterios de idoneidad, y se llevará a cabo mediante procedimientos que garanticen la publicidad y concurrencia.»","dificultad":1},{"id":"TREBEP-L1-042","ley":"TREBEP","articulo":"13.4","articulo_txt":"Art. 13.4 TREBEP","bloque_id":"TREBEP|Título II. Personal al servicio de las Administraciones Públicas · Capítulo II. Personal directivo","enunciado":"Según el artículo 13.4 del TREBEP, la determinación de las condiciones de empleo del personal directivo:","opciones":{"a":"No tendrá la consideración de materia objeto de negociación colectiva a los efectos de esta ley.","b":"Será materia objeto de negociación colectiva en la Mesa General de Negociación.","c":"Solo será objeto de negociación colectiva cuando el directivo tenga la condición de funcionario.","d":"Será objeto de negociación colectiva únicamente en las comunidades autónomas."},"correcta":"a","explicacion":"El art. 13.4 dispone que la determinación de las condiciones de empleo del personal directivo «no tendrá la consideración de materia objeto de negociación colectiva a los efectos de esta ley». Las opciones b), c) y d) la someten a negociación colectiva, con carácter general o en determinados casos, en contra de lo que dice el precepto.","cita":"«4. La determinación de las condiciones de empleo del personal directivo no tendrá la consideración de materia objeto de negociación colectiva a los efectos de esta ley.»","dificultad":2},{"id":"TREBEP-L1-043","ley":"TREBEP","articulo":"13.4","articulo_txt":"Art. 13.4 TREBEP","bloque_id":"TREBEP|Título II. Personal al servicio de las Administraciones Públicas · Capítulo II. Personal directivo","enunciado":"Según el artículo 13.4 del TREBEP, cuando el personal directivo reúna la condición de personal laboral, estará sometido a:","opciones":{"a":"La relación laboral común, como el resto del personal laboral.","b":"El régimen del personal eventual.","c":"El régimen estatutario de los funcionarios de carrera.","d":"La relación laboral de carácter especial de alta dirección."},"correcta":"d","explicacion":"El art. 13.4 dispone que, en ese caso, el personal directivo «estará sometido a la relación laboral de carácter especial de alta dirección». El precepto no lo remite a la relación laboral común de la opción a), al régimen del personal eventual de la opción b) ni al régimen estatutario de la opción c).","cita":"«Cuando el personal directivo reúna la condición de personal laboral estará sometido a la relación laboral de carácter especial de alta dirección.»","dificultad":1}]};</script>
<script>
/* Letra de Ley — motor de test. Sin dependencias; funciona sin conexión.
   Necesita window.LDL_CONFIG y window.LDL_BANCO (los inyecta sistema/letradeley.py). */
(function () {
  "use strict";
  var CFG = window.LDL_CONFIG, B = window.LDL_BANCO;
  var raiz = document.getElementById("ldl");
  var LETRAS = ["a", "b", "c", "d"];
  var POR_ID = {};
  B.preguntas.forEach(function (p) { POR_ID[p.id] = p; });
  var CLAVE = "ldl1:" + CFG.pack.id;
  var prog = cargar();
  var sesion = null;
  var vista = CFG.modo === "web" ? "portada" : "inicio";
  var reloj = null;

  /* ---------- utilidades ---------- */
  function esc(t) {
    return String(t == null ? "" : t).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function barajar(lista) {
    var a = lista.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function pct(a, b) { return b ? Math.round((a / b) * 100) : 0; }
  function plural(n, uno, varios) { return n + " " + (n === 1 ? uno : varios); }
  function num(n) { return String(n).replace(".", ","); }
  function cargar() {
    try { var s = localStorage.getItem(CLAVE); if (s) { var d = JSON.parse(s); if (d && d.p) return d; } } catch (e) {}
    return { p: {}, h: [] };
  }
  function guardar() { try { localStorage.setItem(CLAVE, JSON.stringify(prog)); } catch (e) {} }
  function registrar(id, acierto) {
    var r = prog.p[id] || { v: 0, a: 0, f: 0, c: 0 };
    r.v++;
    if (acierto) { r.a++; r.c = Math.min((r.c || 0) + 1, 5); } else { r.f++; r.c = 0; }
    r.u = acierto ? 1 : 0;
    r.t = Date.now();
    prog.p[id] = r;
    guardar();
  }
  function fallosPendientes() {
    return B.preguntas.filter(function (p) { var r = prog.p[p.id]; return r && r.u === 0; });
  }
  function resumen(lista) {
    var vistas = 0, aciertos = 0, intentos = 0;
    lista.forEach(function (p) {
      var r = prog.p[p.id];
      if (r) { vistas++; aciertos += r.a; intentos += r.v; }
    });
    return { total: lista.length, vistas: vistas, acierto: pct(aciertos, intentos) };
  }
  function delBloque(id) { return B.preguntas.filter(function (p) { return p.bloque_id === id; }); }

  /* ---------- tema claro / oscuro ---------- */
  function aplicarTema() {
    var t = null;
    try { t = localStorage.getItem("ldl:tema"); } catch (e) {}
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    else document.documentElement.removeAttribute("data-theme");
    return t || "auto";
  }
  function cambiarTema() {
    var orden = { auto: "light", light: "dark", dark: "auto" };
    var actual = aplicarTema();
    try { localStorage.setItem("ldl:tema", orden[actual]); } catch (e) {}
    aplicarTema();
    pintar();
  }

  /* ---------- sesiones ---------- */
  function empezar(tipo, preguntas, opciones) {
    opciones = opciones || {};
    if (!preguntas.length) return;
    pararReloj();
    sesion = {
      tipo: tipo, titulo: opciones.titulo || "Test", ids: preguntas.map(function (p) { return p.id; }),
      i: 0, resp: {}, corregida: {}, inicio: Date.now(), limite: opciones.minutos ? opciones.minutos * 60 : 0, fin: null,
      origen: vista === "test" || vista === "resultado" ? (sesion && sesion.origen) || "inicio" : vista
    };
    vista = "test";
    if (sesion.limite) reloj = setInterval(tic, 1000);
    pintar();
    window.scrollTo(0, 0);
  }
  function tic() {
    if (!sesion || sesion.fin) return pararReloj();
    var el = document.getElementById("ldl-crono");
    var resta = sesion.limite - Math.floor((Date.now() - sesion.inicio) / 1000);
    if (resta <= 0) { terminar(); return; }
    if (el) el.textContent = mmss(resta);
  }
  function pararReloj() { if (reloj) { clearInterval(reloj); reloj = null; } }
  function mmss(s) { var m = Math.floor(s / 60), r = s % 60; return m + ":" + (r < 10 ? "0" : "") + r; }

  function responder(letra) {
    var id = sesion.ids[sesion.i];
    if (sesion.tipo === "simulacro") {
      sesion.resp[id] = sesion.resp[id] === letra ? undefined : letra;
      pintar();
      return;
    }
    if (sesion.corregida[id]) return;
    sesion.resp[id] = letra;
    sesion.corregida[id] = true;
    registrar(id, letra === POR_ID[id].correcta);
    pintar();
  }
  function siguiente() {
    if (sesion.i < sesion.ids.length - 1) { sesion.i++; pintar(); window.scrollTo(0, 0); }
    else terminar();
  }
  function anterior() { if (sesion.i > 0) { sesion.i--; pintar(); } }
  function terminar() {
    pararReloj();
    if (sesion.tipo === "simulacro") {
      sesion.ids.forEach(function (id) {
        if (sesion.resp[id]) registrar(id, sesion.resp[id] === POR_ID[id].correcta);
      });
    }
    sesion.fin = Date.now();
    var r = calcular(sesion);
    prog.h.unshift({ t: sesion.fin, tipo: sesion.tipo, n: r.total, a: r.aciertos, e: r.errores, nota: r.nota });
    prog.h = prog.h.slice(0, 50);
    guardar();
    vista = "resultado";
    pintar();
    window.scrollTo(0, 0);
  }
  function calcular(s) {
    var a = 0, e = 0, nr = 0;
    s.ids.forEach(function (id) {
      var r = s.resp[id];
      if (!r) nr++; else if (r === POR_ID[id].correcta) a++; else e++;
    });
    var pen = (CFG.simulacro && CFG.simulacro.penalizacion) || 1 / 3;
    var neta = s.tipo === "simulacro" ? a - e * pen : a;
    var nota = Math.max(0, (neta / s.ids.length) * 10);
    return { total: s.ids.length, aciertos: a, errores: e, blancos: nr, neta: neta, nota: Math.round(nota * 100) / 100 };
  }

  /* ---------- vistas ---------- */
  function cabecera() {
    var tema = aplicarTema();
    var etiquetas = { auto: "Tema: auto", light: "Tema: claro", dark: "Tema: oscuro" };
    return '<header class="ldl-top"><a class="ldl-brand" href="' + esc(CFG.web || "#") + '">' +
      '<span class="ldl-logo" aria-hidden="true">§</span><span><b>Letra de Ley</b><small>' +
      esc(CFG.pack.nombre) + "</small></span></a>" +
      '<button class="ldl-tema" data-acc="tema" type="button">' + etiquetas[tema] + "</button></header>";
  }
  function navegacion() {
    if (CFG.modo === "web") return "";
    var items = [["inicio", "Inicio"], ["temas", "Por temas"], ["simulacro", "Simulacro"], ["fallos", "Fallos"], ["stats", "Estadísticas"]];
    return '<nav class="ldl-nav" aria-label="Secciones">' + items.map(function (it) {
      var actual = vista === it[0] || (vista === "test" && sesion && sesion.origen === it[0]);
      return '<button type="button" data-acc="ir" data-v="' + it[0] + '"' + (actual ? ' aria-current="page"' : "") + ">" + it[1] + "</button>";
    }).join("") + "</nav>";
  }
  function pie() {
    return '<p class="ldl-pie">Letra de Ley · ' + esc(CFG.pack.edicion) + " · Texto legal actualizado a " +
      esc(CFG.pack.actualizado) + "<br>Uso personal. Prohibida su redistribución.</p>";
  }

  function vInicio() {
    var r = resumen(B.preguntas), f = fallosPendientes().length;
    return '<section class="ldl-card"><h2>' + esc(CFG.pack.nombre) + "</h2>" +
      '<p class="ldl-muted">' + B.preguntas.length + " preguntas comentadas, con el artículo exacto de cada respuesta.</p>" +
      '<div class="ldl-kpis"><div class="ldl-kpi"><b>' + r.vistas + "/" + r.total + "</b><span>respondidas</span></div>" +
      '<div class="ldl-kpi"><b>' + r.acierto + ' %</b><span>de acierto</span></div>' +
      '<div class="ldl-kpi"><b>' + f + "</b><span>fallos por repasar</span></div></div>" +
      '<div class="ldl-acciones"><button class="ldl-btn" data-acc="rapido" type="button">Test rápido de 20</button>' +
      '<button class="ldl-btn sec" data-acc="ir" data-v="simulacro" type="button">Simulacro de examen</button>' +
      (f ? '<button class="ldl-btn sec" data-acc="repasar" type="button">Repasar ' + f + " fallos</button>" : "") +
      "</div></section>" +
      '<section class="ldl-card"><h3>Cómo sacarle partido</h3><ol class="ldl-muted">' +
      "<li>Practica <b>por temas</b>: cada respuesta te enseña el artículo y por qué fallan las demás opciones.</li>" +
      "<li>Cada pocos días, <b>repasa tus fallos</b>: es donde más se aprende.</li>" +
      "<li>Antes del examen, haz <b>simulacros</b> con tiempo y con la penalización real (cada error resta 1/3).</li></ol>" +
      '<p class="ldl-small ldl-muted">Tu progreso se guarda en este dispositivo y en este navegador.</p></section>' + historial();
  }
  function historial() {
    if (!prog.h.length) return "";
    return '<section class="ldl-card"><h3>Últimos tests</h3><ul class="ldl-revision">' + prog.h.slice(0, 5).map(function (h) {
      var d = new Date(h.t);
      return "<li><b>" + (h.tipo === "simulacro" ? "Simulacro" : "Práctica") + "</b> · " + d.toLocaleDateString("es-ES") +
        " · " + h.a + "/" + h.n + " aciertos" + (h.tipo === "simulacro" ? " · nota " + num(h.nota) : "") + "</li>";
    }).join("") + "</ul></section>";
  }
  function vTemas() {
    var html = '<section class="ldl-card"><h2>Practicar por temas</h2><p class="ldl-muted">Elige un bloque. Las preguntas salen en orden aleatorio y se corrigen al momento.</p><ul class="ldl-bloques">';
    B.bloques.forEach(function (b) {
      var lista = delBloque(b.id), r = resumen(lista);
      html += '<li><button type="button" data-acc="bloque" data-id="' + esc(b.id) + '"><span class="t">' + esc(b.nombre) +
        '</span><span class="n">' + r.vistas + "/" + r.total + (r.vistas ? " · " + r.acierto + " %" : "") + "</span>" +
        '<span class="ldl-barra"><i style="width:' + pct(r.vistas, r.total) + '%"></i></span></button></li>';
    });
    return html + "</ul></section>";
  }
  function vSimulacro() {
    var total = B.preguntas.length;
    var opcionesN = [10, 20, 30, 50, 100].filter(function (n) { return n < total; });
    opcionesN.push(total);
    var porDefecto = Math.min((CFG.simulacro && CFG.simulacro.preguntas) || 30, total);
    return '<section class="ldl-card"><h2>Simulacro de examen</h2>' +
      '<p class="ldl-muted">Como el día del examen: no ves las soluciones hasta el final y cada error resta un tercio de acierto.</p>' +
      '<div class="ldl-campo"><label for="ldl-n">Número de preguntas</label><select id="ldl-n">' +
      opcionesN.map(function (n) { return "<option" + (n === porDefecto ? " selected" : "") + ">" + n + "</option>"; }).join("") +
      '</select></div><div class="ldl-campo"><label for="ldl-t">Tiempo</label><select id="ldl-t">' +
      '<option value="1">1 minuto por pregunta</option><option value="0">Sin límite de tiempo</option></select></div>' +
      '<div class="ldl-campo"><label for="ldl-b">Temas</label><select id="ldl-b"><option value="">Todos</option>' +
      B.bloques.map(function (b) { return '<option value="' + esc(b.id) + '">' + esc(b.nombre) + "</option>"; }).join("") +
      '</select></div><div class="ldl-acciones"><button class="ldl-btn" data-acc="simular" type="button">Empezar simulacro</button></div></section>';
  }
  function vFallos() {
    var f = fallosPendientes();
    if (!f.length) {
      return '<section class="ldl-card"><h2>Repaso de fallos</h2><p class="ldl-muted">No tienes fallos pendientes. Cuando falles una pregunta aparecerá aquí hasta que la aciertes.</p></section>';
    }
    return '<section class="ldl-card"><h2>Repaso de fallos</h2><p class="ldl-muted">Tienes <b>' + f.length +
      "</b> preguntas falladas. Salen de aquí en cuanto las aciertas.</p>" +
      '<div class="ldl-acciones"><button class="ldl-btn" data-acc="repasar" type="button">Repasar ahora</button></div></section>';
  }
  function vStats() {
    var html = '<section class="ldl-card"><h2>Estadísticas</h2><ul class="ldl-bloques">';
    B.bloques.forEach(function (b) {
      var r = resumen(delBloque(b.id));
      html += '<li><button type="button" data-acc="bloque" data-id="' + esc(b.id) + '"><span class="t">' + esc(b.nombre) +
        '</span><span class="n">' + (r.vistas ? r.acierto + " % de acierto" : "sin empezar") + '</span><span class="ldl-barra"><i style="width:' +
        r.acierto + '%"></i></span></button></li>';
    });
    html += '</ul></section><section class="ldl-card"><h3>Empezar de cero</h3><p class="ldl-muted ldl-small">Borra tu progreso guardado en este dispositivo.</p>' +
      '<div class="ldl-acciones"><button class="ldl-btn sec" data-acc="borrar" type="button">Borrar mi progreso</button></div></section>';
    return html;
  }
  function vPortada() {
    var n = B.preguntas.length;
    return '<section class="ldl-card"><h2>' + esc(CFG.pack.nombre) + "</h2>" +
      '<p class="ldl-muted">' + n + " preguntas tipo examen, corregidas al momento, con el artículo exacto y la explicación de cada opción. Gratis y sin registrarte.</p>" +
      '<div class="ldl-acciones"><button class="ldl-btn" data-acc="empezarweb" type="button">Empezar el test</button></div></section>';
  }

  function vTest() {
    var id = sesion.ids[sesion.i], p = POR_ID[id], sim = sesion.tipo === "simulacro";
    var elegida = sesion.resp[id], corregida = !sim && sesion.corregida[id];
    var html = '<section class="ldl-card"><div class="ldl-meta"><span>' + esc(sesion.titulo) + " · " + (sesion.i + 1) + " de " + sesion.ids.length +
      "</span><span>" + (sesion.limite ? '⏱ <span id="ldl-crono" class="ldl-crono">' +
        mmss(Math.max(0, sesion.limite - Math.floor((Date.now() - sesion.inicio) / 1000))) + "</span>" : esc(p.articulo_txt)) +
      '</span></div><div class="ldl-progreso"><i style="width:' + pct(sesion.i + (corregida ? 1 : 0), sesion.ids.length) + '%"></i></div>' +
      '<p class="ldl-enunciado">' + esc(p.enunciado) + '</p><div class="ldl-opciones" role="group" aria-label="Opciones">';
    LETRAS.forEach(function (l) {
      var cls = "ldl-op";
      if (corregida) { if (l === p.correcta) cls += " ok"; else if (l === elegida) cls += " ko"; }
      else if (sim && elegida === l) cls += " marcada";
      html += '<button type="button" class="' + cls + '" data-acc="resp" data-l="' + l + '"' + (corregida ? " disabled" : "") +
        (sim ? ' aria-pressed="' + (elegida === l) + '"' : "") + '><span class="l">' + l + ")</span><span>" + esc(p.opciones[l]) + "</span></button>";
    });
    html += "</div>";
    if (corregida) html += feedback(p, elegida);
    html += '<div class="ldl-acciones">';
    if (sim) {
      html += (sesion.i > 0 ? '<button class="ldl-btn sec" data-acc="ant" type="button">Anterior</button>' : "") +
        '<button class="ldl-btn" data-acc="sig" type="button">' + (sesion.i < sesion.ids.length - 1 ? "Siguiente" : "Entregar") + "</button>" +
        (sesion.i < sesion.ids.length - 1 ? '<button class="ldl-btn sec" data-acc="entregar" type="button">Entregar ya</button>' : "");
    } else if (corregida) {
      html += '<button class="ldl-btn" data-acc="sig" type="button">' + (sesion.i < sesion.ids.length - 1 ? "Siguiente" : "Ver resultado") + "</button>";
    }
    html += '<button class="ldl-btn sec" data-acc="salir" type="button">Salir</button></div></section>';
    return html;
  }
  function feedback(p, elegida) {
    var bien = elegida === p.correcta;
    return '<div class="ldl-feedback" aria-live="polite"><div class="v ' + (bien ? "ok" : "ko") + '">' +
      (bien ? "¡Correcta!" : "Incorrecta. La respuesta correcta es la " + p.correcta + ")") + "</div><div>" + esc(p.explicacion) + "</div>" +
      (p.cita ? '<blockquote class="ldl-cita">' + esc(p.cita) + "<small>" + esc(p.articulo_txt) + "</small></blockquote>" : "") + "</div>";
  }
  function vResultado() {
    var r = calcular(sesion), sim = sesion.tipo === "simulacro";
    var html = '<section class="ldl-card"><h2>' + (sim ? "Resultado del simulacro" : "Resultado") + "</h2>" +
      '<div class="ldl-nota">' + (sim ? num(r.nota.toFixed(2)) : r.aciertos + "/" + r.total) + "</div>" +
      '<p class="ldl-muted">' + plural(r.aciertos, "acierto", "aciertos") + " · " + plural(r.errores, "error", "errores") +
      (r.blancos ? " · " + r.blancos + " en blanco" : "") +
      (sim ? " · nota sobre 10 con penalización" : "") + "</p>";
    if (CFG.modo === "web") html += ctaWeb(r);
    html += '<div class="ldl-acciones">' + (CFG.modo === "web" ? '<button class="ldl-btn sec" data-acc="empezarweb" type="button">Repetir con otro orden</button>' :
      '<button class="ldl-btn" data-acc="ir" data-v="inicio" type="button">Volver al inicio</button>') + "</div></section>";
    html += '<section class="ldl-card"><h3>Revisión</h3><ul class="ldl-revision">';
    sesion.ids.forEach(function (id, n) {
      var p = POR_ID[id], e = sesion.resp[id], chip = !e ? '<span class="ldl-chip nr">En blanco</span>' :
        e === p.correcta ? '<span class="ldl-chip ok">Bien</span>' : '<span class="ldl-chip ko">Mal</span>';
      html += "<li>" + chip + '<span class="e">' + (n + 1) + ". " + esc(p.enunciado) + "</span><br>" +
        '<span class="ldl-small">Correcta: <b>' + p.correcta + ") " + esc(p.opciones[p.correcta]) + "</b>" +
        (e && e !== p.correcta ? " · Marcaste " + e + ")" : "") + '</span><br><span class="ldl-small ldl-muted">' + esc(p.explicacion) + "</span></li>";
    });
    return html + "</ul></section>";
  }
  function ctaWeb() {
    var c = CFG.compra || {}, html = "";
    if (c.url) {
      html += '<div class="ldl-card ldl-cta"><h3>' + esc(c.titulo) + '</h3><p class="ldl-muted">' + esc(c.texto) + "</p>" +
        '<div class="ldl-acciones"><a class="ldl-btn acc" href="' + esc(c.url) + '">' + esc(c.boton) + "</a></div></div>";
    }
    if (CFG.telegram) {
      html += '<p class="ldl-small">¿Quieres un test cada día? <a href="' + esc(CFG.telegram) + '">Únete gratis al canal de Telegram</a>.</p>';
    }
    return html;
  }

  function pintar() {
    var cuerpo;
    if (vista === "test") cuerpo = vTest();
    else if (vista === "resultado") cuerpo = vResultado();
    else if (vista === "portada") cuerpo = vPortada();
    else if (vista === "temas") cuerpo = vTemas();
    else if (vista === "simulacro") cuerpo = vSimulacro();
    else if (vista === "fallos") cuerpo = vFallos();
    else if (vista === "stats") cuerpo = vStats();
    else cuerpo = vInicio();
    raiz.innerHTML = '<div class="ldl">' + cabecera() + navegacion() + "<main>" + cuerpo + "</main>" + pie() + "</div>";
  }

  /* ---------- eventos ---------- */
  raiz.addEventListener("click", function (ev) {
    var el = ev.target.closest("[data-acc]");
    if (!el) return;
    var acc = el.getAttribute("data-acc");
    if (acc === "tema") return cambiarTema();
    if (acc === "ir") { pararReloj(); vista = el.getAttribute("data-v"); sesion = null; pintar(); return; }
    if (acc === "rapido") return empezar("practica", barajar(B.preguntas).slice(0, 20), { titulo: "Test rápido" });
    if (acc === "repasar") return empezar("practica", barajar(fallosPendientes()).slice(0, 30), { titulo: "Repaso de fallos" });
    if (acc === "bloque") {
      var b = B.bloques.filter(function (x) { return x.id === el.getAttribute("data-id"); })[0];
      return empezar("practica", barajar(delBloque(b.id)), { titulo: b.nombre });
    }
    if (acc === "simular") {
      var n = parseInt(document.getElementById("ldl-n").value, 10);
      var conTiempo = document.getElementById("ldl-t").value === "1";
      var bloque = document.getElementById("ldl-b").value;
      var fuente = bloque ? delBloque(bloque) : B.preguntas;
      var elegidas = barajar(fuente).slice(0, n);
      return empezar("simulacro", elegidas, { titulo: "Simulacro", minutos: conTiempo ? elegidas.length : 0 });
    }
    if (acc === "empezarweb") return empezar("practica", barajar(B.preguntas), { titulo: "Test gratuito" });
    if (acc === "resp") return responder(el.getAttribute("data-l"));
    if (acc === "sig") return siguiente();
    if (acc === "ant") return anterior();
    if (acc === "entregar") return terminar();
    if (acc === "salir") { pararReloj(); sesion = null; vista = CFG.modo === "web" ? "portada" : "inicio"; pintar(); return; }
    if (acc === "borrar") {
      if (el.getAttribute("data-confirmar") === "1") { prog = { p: {}, h: [] }; guardar(); pintar(); }
      else { el.setAttribute("data-confirmar", "1"); el.textContent = "Pulsa otra vez para confirmar"; }
    }
  });
  document.addEventListener("keydown", function (ev) {
    if (vista !== "test" || !sesion || ev.altKey || ev.ctrlKey || ev.metaKey) return;
    var k = ev.key.toLowerCase(), mapa = { "1": "a", "2": "b", "3": "c", "4": "d", a: "a", b: "b", c: "c", d: "d" };
    if (mapa[k]) { ev.preventDefault(); responder(mapa[k]); }
    else if (k === "enter" || k === "arrowright") {
      var id = sesion.ids[sesion.i];
      if (sesion.tipo === "simulacro" || sesion.corregida[id]) { ev.preventDefault(); siguiente(); }
    } else if (k === "arrowleft" && sesion.tipo === "simulacro") { ev.preventDefault(); anterior(); }
  });

  pintar();
})();
</script>
</body>
</html>
