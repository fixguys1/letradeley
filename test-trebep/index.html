 locales se rige por:","opciones":{"a":"Solo la legislación estatal aplicable, de la que forma parte el Estatuto, sin intervención de la legislación autonómica.","b":"La legislación estatal aplicable, de la que forma parte el Estatuto, y la legislación autonómica, con respeto a la autonomía local.","c":"Las ordenanzas de cada entidad local y, supletoriamente, el Estatuto.","d":"La legislación de las comunidades autónomas y, supletoriamente, la legislación estatal."},"correcta":"b","explicacion":"El art. 3.1 dispone que ese personal se rige «por la legislación estatal que resulte de aplicación, de la que forma parte este Estatuto y por la legislación de las comunidades autónomas, con respeto a la autonomía local». La opción a) excluye la legislación autonómica, la opción c) remite a unas ordenanzas locales que el precepto no menciona y la opción d) convierte la legislación estatal en supletoria.","cita":"«1. El personal funcionario de las entidades locales se rige por la legislación estatal que resulte de aplicación, de la que forma parte este Estatuto y por la legislación de las comunidades autónomas, con respeto a la autonomía local.»","dificultad":2},{"id":"TREBEP-L1-012","ley":"TREBEP","articulo":"4","articulo_txt":"Art. 4 TREBEP","bloque_id":"TREBEP|Título I. Objeto y ámbito de aplicación","enunciado":"Según el artículo 4 del TREBEP, ¿cuál de los siguientes colectivos NO figura en su enumeración?","opciones":{"a":"Personal del Centro Nacional de Inteligencia.","b":"Personal funcionario de los ayuntamientos.","c":"Personal retribuido por arancel.","d":"Personal del Banco de España y del Fondo de Garantía de Depósitos de Entidades de Crédito."},"correcta":"b","explicacion":"El personal funcionario de las entidades locales no está en el art. 4; su régimen lo fija el art. 3.1. El art. 4 sí enumera al personal del Centro Nacional de Inteligencia de la opción a) en su letra g), al personal retribuido por arancel de la opción c) en la letra f) y al personal del Banco de España y del Fondo de Garantía de Depósitos de Entidades de Crédito de la opción d) en la letra h).","cita":"«f) Personal retribuido por arancel. g) Personal del Centro Nacional de Inteligencia. h) Personal del Banco de España y del Fondo de Garantía de Depósitos de Entidades de Crédito.»","dificultad":2},{"id":"TREBEP-L1-014","ley":"TREBEP","articulo":"5","articulo_txt":"Art. 5 TREBEP","bloque_id":"TREBEP|Título I. Objeto y ámbito de aplicación","enunciado":"Según el artículo 5 del TREBEP, el personal laboral de la Sociedad Estatal Correos y Telégrafos se regirá por:","opciones":{"a":"Lo dispuesto en el Estatuto y, en su defecto, por el convenio colectivo.","b":"La legislación de Función Pública de la Administración General del Estado.","c":"La legislación laboral y demás normas convencionalmente aplicables.","d":"El régimen estatutario de los funcionarios públicos."},"correcta":"c","explicacion":"El art. 5, párrafo segundo, dispone: «Su personal laboral se regirá por la legislación laboral y demás normas convencionalmente aplicables». El precepto no menciona para este personal el Estatuto, que la opción a) antepone al convenio colectivo, ni la legislación de Función Pública de la opción b) ni el régimen estatutario de la opción d).","cita":"«Su personal laboral se regirá por la legislación laboral y demás normas convencionalmente aplicables.»","dificultad":1},{"id":"TREBEP-L1-017","ley":"TREBEP","articulo":"7","articulo_txt":"Art. 7 TREBEP","bloque_id":"TREBEP|Título I. Objeto y ámbito de aplicación","enunciado":"Según el artículo 7 del TREBEP, en materia de permisos de nacimiento, adopción, del progenitor diferente de la madre biológica, de lactancia y parental, el personal laboral al servicio de las Administraciones públicas se regirá:","opciones":{"a":"Por las previsiones del Estatuto de los Trabajadores sobre suspensión del contrato, con preferencia sobre el TREBEP.","b":"Por lo que disponga el convenio colectivo y, en su defecto, por el TREBEP.","c":"Por lo previsto en el TREBEP, sin aplicarse las previsiones del Estatuto de los Trabajadores sobre suspensión del contrato.","d":"Por el régimen que elija cada trabajador entre el del TREBEP y el del Estatuto de los Trabajadores."},"correcta":"c","explicacion":"El párrafo segundo del art. 7, en la redacción dada por el art. 2.1 del Real Decreto-ley 9/2025, de 29 de julio, dispone que en esos permisos este personal «se regirá por lo previsto en el presente Estatuto», sin que le sean de aplicación las previsiones del texto refundido de la Ley del Estatuto de los Trabajadores sobre las suspensiones de los contratos de trabajo por los mismos supuestos de hecho. Por eso fallan la opción a), que da preferencia al Estatuto de los Trabajadores, la opción b), que remite al convenio colectivo, y la opción d), que deja la elección al trabajador. El art. 7 también fue modificado por el art. 3.1 del Real Decreto-ley 6/2019, de 1 de marzo.","cita":"«No obstante, en materia de permisos de nacimiento, adopción, del progenitor diferente de la madre biológica, de lactancia y parental, el personal laboral al servicio de las Administraciones públicas se regirá por lo previsto en el presente Estatuto, no siendo de aplicación a este personal, por tanto, las previsiones del texto refundido de la Ley del Estatuto de los Trabajadores sobre las suspensiones de los contratos de trabajo que, en su caso, corresponderían por los mismos supuestos de hecho.»","dificultad":2},{"id":"TREBEP-L1-018","ley":"TREBEP","articulo":"8.1","articulo_txt":"Art. 8.1 TREBEP","bloque_id":"TREBEP|Título II. Personal al servicio de las Administraciones Públicas · Capítulo I. Clases de personal","enunciado":"Según el artículo 8.1 del TREBEP, son empleados públicos quienes desempeñan funciones retribuidas en las Administraciones Públicas al servicio de:","opciones":{"a":"La autoridad que los nombra.","b":"El Gobierno de la Nación.","c":"La Administración que los contrata.","d":"Los intereses generales."},"correcta":"d","explicacion":"El art. 8.1 define a los empleados públicos como quienes desempeñan funciones retribuidas en las Administraciones Públicas «al servicio de los intereses generales». Las opciones a), b) y c) sustituyen esa referencia por una autoridad, el Gobierno o la Administración de la que dependen, que el precepto no menciona.","cita":"«1. Son empleados públicos quienes desempeñan funciones retribuidas en las Administraciones Públicas al servicio de los intereses generales.»","dificultad":1},{"id":"TREBEP-L1-022","ley":"TREBEP","articulo":"9.2","articulo_txt":"Art. 9.2 TREBEP","bloque_id":"TREBEP|Título II. Personal al servicio de las Administraciones Públicas · Capítulo I. Clases de personal","enunciado":"Según el artículo 9.2 del TREBEP, el ejercicio de las funciones que impliquen la participación directa o indirecta en el ejercicio de las potestades públicas corresponde:","opciones":{"a":"A los funcionarios públicos y, si lo autoriza la ley de desarrollo, también al personal laboral fijo.","b":"Exclusivamente a los funcionarios públicos, en los términos de la ley de desarrollo de cada Administración.","c":"Indistintamente a los funcionarios de carrera y al personal laboral fijo.","d":"A cualquier empleado público seleccionado conforme a los principios de mérito y capacidad."},"correcta":"b","explicacion":"El art. 9.2 dispone que esas funciones, igual que las que impliquen la salvaguardia de los intereses generales del Estado y de las Administraciones Públicas, «corresponden exclusivamente a los funcionarios públicos, en los términos que en la ley de desarrollo de cada Administración Pública se establezca». Las opciones a), c) y d) abren esas funciones a personal que no es funcionario, en contra de la reserva exclusiva del precepto.","cita":"«2. En todo caso, el ejercicio de las funciones que impliquen la participación directa o indirecta en el ejercicio de las potestades públicas o en la salvaguardia de los intereses generales del Estado y de las Administraciones Públicas corresponden exclusivamente a los funcionarios públicos, en los términos que en la ley de desarrollo de cada Administración Pública se establezca.»","dificultad":2},{"id":"TREBEP-L1-030","ley":"TREBEP","articulo":"10.4","articulo_txt":"Art. 10.4 TREBEP","bloque_id":"TREBEP|Título II. Personal al servicio de las Administraciones Públicas · Capítulo I. Clases de personal","enunciado":"Según el artículo 10.4 del TREBEP, una vez producido el fin de la relación de interinidad por el transcurso del plazo previsto desde el nombramiento del personal funcionario interino, la vacante:","opciones":{"a":"Deberá ser amortizada y no podrá volver a cubrirse por personal funcionario interino en ningún caso.","b":"Podrá cubrirse mediante la contratación de personal laboral temporal.","c":"Solo podrá ocuparla personal funcionario de carrera, salvo que el proceso selectivo quede desierto.","d":"Quedará reservada al personal funcionario interino que la venía ocupando."},"correcta":"c","explicacion":"El art. 10.4, párrafo segundo, dispone que, transcurridos tres años desde el nombramiento, «la vacante solo podrá ser ocupada por personal funcionario de carrera, salvo que el correspondiente proceso selectivo quede desierto, en cuyo caso se podrá efectuar otro nombramiento de personal funcionario interino». Por eso fallan la opción a), que impone la amortización y prohíbe todo nuevo nombramiento interino, la opción b), que admite personal laboral temporal, y la opción d), que reserva la plaza al interino que la ocupaba.","cita":"«No obstante, transcurridos tres años desde el nombramiento del personal funcionario interino se producirá el fin de la relación de interinidad, y la vacante solo podrá ser ocupada por personal funcionario de carrera, salvo que el correspondiente proceso selectivo quede desierto, en cuyo caso se podrá efectuar otro nombramiento de personal funcionario interino.»","dificultad":2},{"id":"TREBEP-L1-037","ley":"TREBEP","articulo":"12.2","articulo_txt":"Art. 12.2 TREBEP","bloque_id":"TREBEP|Título II. Personal al servicio de las Administraciones Públicas · Capítulo I. Clases de personal","enunciado":"Según el artículo 12.2 del TREBEP, el número máximo de personal eventual se establecerá por:","opciones":{"a":"Las leyes de Función Pública que se dicten en desarrollo del Estatuto.","b":"La ley de presupuestos de cada Administración Pública.","c":"La Mesa General de Negociación de cada Administración Pública.","d":"Los respectivos órganos de gobierno."},"correcta":"d","explicacion":"El art. 12.2 encarga a las leyes de Función Pública determinar los órganos de gobierno que podrán disponer de personal eventual, pero dispone que «El número máximo se establecerá por los respectivos órganos de gobierno», y que este número y las condiciones retributivas serán públicas. Por eso falla la opción a), y el precepto no menciona la ley de presupuestos de la opción b) ni la Mesa General de Negociación de la opción c).","cita":"«2. Las leyes de Función Pública que se dicten en desarrollo de este Estatuto determinarán los órganos de gobierno de las Administraciones Públicas que podrán disponer de este tipo de personal. El número máximo se establecerá por los respectivos órganos de gobierno. Este número y las condiciones retributivas serán públicas.»","dificultad":2},{"id":"TREBEP-L1-040","ley":"TREBEP","articulo":"13","articulo_txt":"Art. 13 TREBEP","bloque_id":"TREBEP|Título II. Personal al servicio de las Administraciones Públicas · Capítulo II. Personal directivo","enunciado":"Según el artículo 13 del TREBEP, ¿quién podrá establecer, en desarrollo del Estatuto, el régimen jurídico específico del personal directivo y los criterios para determinar su condición?","opciones":{"a":"Las Cortes Generales, mediante ley orgánica.","b":"El Gobierno y los órganos de gobierno de las comunidades autónomas.","c":"El Ministro competente en materia de función pública, mediante orden.","d":"Las entidades locales, en el ámbito de su autonomía."},"correcta":"b","explicacion":"El art. 13 dispone que «El Gobierno y los órganos de gobierno de las comunidades autónomas podrán establecer, en desarrollo de este Estatuto, el régimen jurídico específico del personal directivo así como los criterios para determinar su condición». El precepto no atribuye esa facultad a las Cortes Generales de la opción a), a un Ministro mediante orden como la opción c) ni a las entidades locales de la opción d).","cita":"«El Gobierno y los órganos de gobierno de las comunidades autónomas podrán establecer, en desarrollo de este Estatuto, el régimen jurídico específico del personal directivo así como los criterios para determinar su condición, de acuerdo, entre otros, con los siguientes principios:»","dificultad":1},{"id":"TREBEP-L1-041","ley":"TREBEP","articulo":"13.2","articulo_txt":"Art. 13.2 TREBEP","bloque_id":"TREBEP|Título II. Personal al servicio de las Administraciones Públicas · Capítulo II. Personal directivo","enunciado":"Según el artículo 13.2 del TREBEP, la designación del personal directivo atenderá a principios de mérito y capacidad y a criterios de:","opciones":{"a":"Antigüedad.","b":"Oportunidad.","c":"Idoneidad.","d":"Representatividad."},"correcta":"c","explicacion":"El art. 13.2 dispone que la designación «atenderá a principios de mérito y capacidad y a criterios de idoneidad», y que se llevará a cabo mediante procedimientos que garanticen la publicidad y concurrencia. La antigüedad, la oportunidad y la representatividad de las opciones a), b) y d) no figuran en el precepto.","cita":"«2. Su designación atenderá a principios de mérito y capacidad y a criterios de idoneidad, y se llevará a cabo mediante procedimientos que garanticen la publicidad y concurrencia.»","dificultad":1},{"id":"TREBEP-L1-042","ley":"TREBEP","articulo":"13.4","articulo_txt":"Art. 13.4 TREBEP","bloque_id":"TREBEP|Título II. Personal al servicio de las Administraciones Públicas · Capítulo II. Personal directivo","enunciado":"Según el artículo 13.4 del TREBEP, la determinación de las condiciones de empleo del personal directivo:","opciones":{"a":"No tendrá la consideración de materia objeto de negociación colectiva a los efectos de esta ley.","b":"Será materia objeto de negociación colectiva en la Mesa General de Negociación.","c":"Solo será objeto de negociación colectiva cuando el directivo tenga la condición de funcionario.","d":"Será objeto de negociación colectiva únicamente en las comunidades autónomas."},"correcta":"a","explicacion":"El art. 13.4 dispone que la determinación de las condiciones de empleo del personal directivo «no tendrá la consideración de materia objeto de negociación colectiva a los efectos de esta ley». Las opciones b), c) y d) la someten a negociación colectiva, con carácter general o en determinados casos, en contra de lo que dice el precepto.","cita":"«4. La determinación de las condiciones de empleo del personal directivo no tendrá la consideración de materia objeto de negociación colectiva a los efectos de esta ley.»","dificultad":2},{"id":"TREBEP-L1-043","ley":"TREBEP","articulo":"13.4","articulo_txt":"Art. 13.4 TREBEP","bloque_id":"TREBEP|Título II. Personal al servicio de las Administraciones Públicas · Capítulo II. Personal directivo","enunciado":"Según el artículo 13.4 del TREBEP, cuando el personal directivo reúna la condición de personal laboral, estará sometido a:","opciones":{"a":"La relación laboral común, como el resto del personal laboral.","b":"El régimen del personal eventual.","c":"El régimen estatutario de los funcionarios de carrera.","d":"La relación laboral de carácter especial de alta dirección."},"correcta":"d","explicacion":"El art. 13.4 dispone que, en ese caso, el personal directivo «estará sometido a la relación laboral de carácter especial de alta dirección». El precepto no lo remite a la relación laboral común de la opción a), al régimen del personal eventual de la opción b) ni al régimen estatutario de la opción c).","cita":"«Cuando el personal directivo reúna la condición de personal laboral estará sometido a la relación laboral de carácter especial de alta dirección.»","dificultad":1},{"id":"TREBEP-L2-008","ley":"TREBEP","articulo":"14.p)","articulo_txt":"Art. 14.p) TREBEP","bloque_id":"TREBEP|Título III. Derechos y deberes. Código de conducta de los empleados públicos · Capítulo I. Derechos de los empleados públicos","enunciado":"Según los artículos 14 y 15 del TREBEP, ¿cuál de los siguientes derechos figura entre los derechos individuales de los empleados públicos y NO entre los que se ejercen de forma colectiva?","opciones":{"a":"A la libre asociación profesional.","b":"A la libertad sindical.","c":"A la negociación colectiva.","d":"A la participación en la determinación de las condiciones de trabajo."},"correcta":"a","explicacion":"La libre asociación profesional figura en el art. 14.p) entre los derechos de carácter individual. La libertad sindical de la opción b), la negociación colectiva de la opción c) y la participación en la determinación de las condiciones de trabajo de la opción d) son derechos individuales que se ejercen de forma colectiva según el art. 15, letras a) y b).","cita":"«p) A la libre asociación profesional.»","dificultad":2},{"id":"TREBEP-L2-002","ley":"TREBEP","articulo":"14.f)","articulo_txt":"Art. 14.f) TREBEP","bloque_id":"TREBEP|Título III. Derechos y deberes. Código de conducta de los empleados públicos · Capítulo I. Derechos de los empleados públicos","enunciado":"Según el artículo 14.f) del TREBEP, los empleados públicos tienen derecho a la defensa jurídica y protección de la Administración Pública en los procedimientos que se sigan:","opciones":{"a":"Ante cualquier orden jurisdiccional, solo cuando el empleado público actúe como parte demandante.","b":"Ante cualquier orden jurisdiccional, con independencia de que los hechos guarden o no relación con sus funciones.","c":"Ante cualquier orden jurisdiccional, cuando los hechos se hayan producido dentro del horario de trabajo.","d":"Ante cualquier orden jurisdiccional como consecuencia del ejercicio legítimo de sus funciones o cargos públicos."},"correcta":"d","explicacion":"El art. 14.f) se refiere a los procedimientos que se sigan «ante cualquier orden jurisdiccional como consecuencia del ejercicio legítimo de sus funciones o cargos públicos». La opción a) lo limita a los casos en que el empleado actúa como demandante, la opción b) prescinde de la relación con el ejercicio legítimo de las funciones y la opción c) sustituye esa relación por un criterio horario que el precepto no recoge.","cita":"«f) A la defensa jurídica y protección de la Administración Pública en los procedimientos que se sigan ante cualquier orden jurisdiccional como consecuencia del ejercicio legítimo de sus funciones o cargos públicos.»","dificultad":2},{"id":"TREBEP-L2-010","ley":"TREBEP","articulo":"15.d)","articulo_txt":"Art. 15.d) TREBEP","bloque_id":"TREBEP|Título III. Derechos y deberes. Código de conducta de los empleados públicos · Capítulo I. Derechos de los empleados públicos","enunciado":"Según el artículo 15.d) del TREBEP, el derecho al planteamiento de conflictos colectivos de trabajo se ejerce:","opciones":{"a":"Solo por el personal laboral, conforme a su convenio colectivo.","b":"Únicamente ante la jurisdicción contencioso-administrativa.","c":"De acuerdo con la legislación aplicable en cada caso.","d":"Exclusivamente en los términos que fije el propio artículo 15."},"correcta":"c","explicacion":"El art. 15.d) reconoce el derecho «Al planteamiento de conflictos colectivos de trabajo, de acuerdo con la legislación aplicable en cada caso». El art. 15 atribuye ese derecho a los empleados públicos, no solo al personal laboral como dice la opción a); no lo limita a la jurisdicción contencioso-administrativa como dice la opción b) y no lo regula por sí mismo, sino que remite a la legislación aplicable, frente a lo que afirma la opción d).","cita":"«d) Al planteamiento de conflictos colectivos de trabajo, de acuerdo con la legislación aplicable en cada caso.»","dificultad":2},{"id":"TREBEP-L2-009","ley":"TREBEP","articulo":"15.c)","articulo_txt":"Art. 15.c) TREBEP","bloque_id":"TREBEP|Título III. Derechos y deberes. Código de conducta de los empleados públicos · Capítulo I. Derechos de los empleados públicos","enunciado":"Según el artículo 15.c) del TREBEP, el derecho al ejercicio de la huelga se reconoce a los empleados públicos con la garantía de:","opciones":{"a":"El mantenimiento de los servicios esenciales de la comunidad.","b":"La autorización previa del órgano competente en materia de función pública.","c":"La continuidad de todos los servicios de atención directa a la ciudadanía.","d":"Unos servicios mínimos que fijen las organizaciones sindicales convocantes."},"correcta":"a","explicacion":"El art. 15.c) reconoce el derecho «Al ejercicio de la huelga, con la garantía del mantenimiento de los servicios esenciales de la comunidad». El precepto no exige la autorización previa de la opción b), no extiende la garantía a todos los servicios de atención a la ciudadanía como dice la opción c) ni atribuye a los sindicatos convocantes la fijación de servicios mínimos como afirma la opción d).","cita":"«c) Al ejercicio de la huelga, con la garantía del mantenimiento de los servicios esenciales de la comunidad.»","dificultad":1},{"id":"TREBEP-L2-014","ley":"TREBEP","articulo":"16.3.c)","articulo_txt":"Art. 16.3.c) TREBEP","bloque_id":"TREBEP|Título III. Derechos y deberes. Código de conducta de los empleados públicos · Capítulo II. Derecho a la carrera profesional y a la promoción interna. La evaluación del desempeño","enunciado":"Según el artículo 16.3.c) del TREBEP, la promoción interna vertical consiste en:","opciones":{"a":"El ascenso desde un cuerpo o escala de un Subgrupo, o Grupo de clasificación profesional si este no tiene Subgrupo, a otro superior.","b":"El acceso a cuerpos o escalas del mismo Subgrupo profesional, de acuerdo con lo dispuesto en el artículo 18 del Estatuto.","c":"El paso a un puesto de trabajo de nivel superior dentro del mismo cuerpo o escala, sin cambiar de Subgrupo profesional.","d":"La progresión de grado, categoría, escalón u otros conceptos análogos, sin necesidad de cambiar de puesto de trabajo."},"correcta":"a","explicacion":"El art. 16.3.c) define la promoción interna vertical como «el ascenso desde un cuerpo o escala de un Subgrupo, o Grupo de clasificación profesional en el supuesto de que éste no tenga Subgrupo, a otro superior». La opción b) describe la promoción interna horizontal del art. 16.3.d) y la opción d) la carrera horizontal del art. 16.3.a); la opción c) describe un cambio de puesto dentro del mismo cuerpo o escala, no el ascenso a otro cuerpo o escala superior.","cita":"«c) Promoción interna vertical, que consiste en el ascenso desde un cuerpo o escala de un Subgrupo, o Grupo de clasificación profesional en el supuesto de que éste no tenga Subgrupo, a otro superior, de acuerdo con lo establecido en el artículo 18.»","dificultad":2},{"id":"TREBEP-L2-017","ley":"TREBEP","articulo":"17.a)","articulo_txt":"Art. 17.a) TREBEP","bloque_id":"TREBEP|Título III. Derechos y deberes. Código de conducta de los empleados públicos · Capítulo II. Derecho a la carrera profesional y a la promoción interna. La evaluación del desempeño","enunciado":"Según el artículo 17.a) del TREBEP, en el sistema de grados, categorías o escalones de la carrera horizontal, los ascensos:","opciones":{"a":"Serán siempre consecutivos, sin que quepa prever ninguna excepción en las leyes de Función Pública.","b":"Podrán producirse libremente, sin necesidad de respetar el orden consecutivo de los grados o categorías.","c":"Serán consecutivos solo cuando lo establezca así el convenio colectivo aplicable a cada Administración.","d":"Serán consecutivos con carácter general, salvo en supuestos excepcionales en los que se prevea otra posibilidad."},"correcta":"d","explicacion":"El art. 17.a) establece que «Los ascensos serán consecutivos con carácter general, salvo en aquellos supuestos excepcionales en los que se prevea otra posibilidad». La opción a) suprime esas excepciones, la opción b) invierte la regla general y la opción c) la hace depender de un convenio colectivo que el precepto no menciona.","cita":"«a) Se articulará un sistema de grados, categorías o escalones de ascenso fijándose la remuneración a cada uno de ellos. Los ascensos serán consecutivos con carácter general, salvo en aquellos supuestos excepcionales en los que se prevea otra posibilidad.»","dificultad":2},{"id":"TREBEP-L2-016","ley":"TREBEP","articulo":"17","articulo_txt":"Art. 17 TREBEP","bloque_id":"TREBEP|Título III. Derechos y deberes. Código de conducta de los empleados públicos · Capítulo II. Derecho a la carrera profesional y a la promoción interna. La evaluación del desempeño","enunciado":"Según el artículo 17 del TREBEP, la regulación de la carrera horizontal de los funcionarios de carrera por las leyes de Función Pública que se dicten en desarrollo del Estatuto:","opciones":{"a":"Es obligatoria para todas las Administraciones Públicas.","b":"Es potestativa, pues esas leyes podrán regularla.","c":"Es obligatoria solo en la Administración General del Estado.","d":"Corresponde en exclusiva al Estado, sin intervención autonómica."},"correcta":"b","explicacion":"El art. 17 dispone que las leyes de Función Pública que se dicten en desarrollo del Estatuto «podrán regular la carrera horizontal de los funcionarios de carrera». Al ser una facultad, no es obligatoria para todas las Administraciones como dice la opción a) ni solo para la del Estado como dice la opción c), y el precepto no la reserva al Estado como afirma la opción d).","cita":"«Las leyes de Función Pública que se dicten en desarrollo del presente Estatuto podrán regular la carrera horizontal de los funcionarios de carrera, pudiendo aplicar, entre otras, las siguientes reglas:»","dificultad":2},{"id":"TREBEP-L2-019","ley":"TREBEP","articulo":"18.1","articulo_txt":"Art. 18.1 TREBEP","bloque_id":"TREBEP|Título III. Derechos y deberes. Código de conducta de los empleados públicos · Capítulo II. Derecho a la carrera profesional y a la promoción interna. La evaluación del desempeño","enunciado":"Según el artículo 18.1 del TREBEP, la promoción interna se realizará mediante procesos selectivos que garanticen el cumplimiento de los principios constitucionales de igualdad, mérito y capacidad así como los contemplados en:","opciones":{"a":"El artículo 55.2 del Estatuto.","b":"El artículo 61.1 del Estatuto.","c":"El artículo 20.2 del Estatuto.","d":"El artículo 78.1 del Estatuto."},"correcta":"a","explicacion":"El art. 18.1 exige garantizar los principios constitucionales de igualdad, mérito y capacidad «así como los contemplados en el artículo 55.2 de este Estatuto». Las opciones b), c) y d) citan artículos a los que el art. 18.1 no remite.","cita":"«1. La promoción interna se realizará mediante procesos selectivos que garanticen el cumplimiento de los principios constitucionales de igualdad, mérito y capacidad así como los contemplados en el artículo 55.2 de este Estatuto.»","dificultad":2},{"id":"TREBEP-L4-046","ley":"TREBEP","articulo":"22.1","articulo_txt":"Art. 22.1 TREBEP","bloque_id":"TREBEP|Título III. Derechos y deberes. Código de conducta de los empleados públicos · Capítulo III. Derechos retributivos","enunciado":"Según el artículo 22.1 del TREBEP, la clasificación de las retribuciones en básicas y complementarias que establece ese apartado se refiere a las retribuciones de:","opciones":{"a":"Todos los empleados públicos, cualquiera que sea la naturaleza de su relación de servicio.","b":"El personal laboral fijo al servicio de las Administraciones Públicas.","c":"El personal directivo profesional de las Administraciones Públicas.","d":"Los funcionarios de carrera."},"correcta":"d","explicacion":"El art. 22.1 dispone que «Las retribuciones de los funcionarios de carrera se clasifican en básicas y complementarias». No se refiere a todos los empleados públicos —opción a)—, al personal laboral —opción b)— ni al personal directivo profesional —opción c)—.","cita":"«1. Las retribuciones de los funcionarios de carrera se clasifican en básicas y complementarias.»","dificultad":1},{"id":"TREBEP-L2-031","ley":"TREBEP","articulo":"22.4","articulo_txt":"Art. 22.4 TREBEP","bloque_id":"TREBEP|Título III. Derechos y deberes. Código de conducta de los empleados públicos · Capítulo III. Derechos retributivos","enunciado":"Según el artículo 22.4 del TREBEP, ¿cuántas pagas extraordinarias habrá al año?","opciones":{"a":"Dos.","b":"Tres.","c":"Una.","d":"Cuatro."},"correcta":"a","explicacion":"El art. 22.4 dispone que «Las pagas extraordinarias serán dos al año». Las opciones b), c) y d) no coinciden con el número que fija el precepto.","cita":"«4. Las pagas extraordinarias serán dos al año, cada una por el importe de una mensualidad de retribuciones básicas y de la totalidad de las retribuciones complementarias, salvo aquéllas a las que se refieren los apartados c) y d) del artículo 24.»","dificultad":1},{"id":"TREBEP-L2-038","ley":"TREBEP","articulo":"24.d)","articulo_txt":"Art. 24.d) TREBEP","bloque_id":"TREBEP|Título III. Derechos y deberes. Código de conducta de los empleados públicos · Capítulo III. Derechos retributivos","enunciado":"Según el artículo 24.d) del TREBEP, entre los factores para establecer las retribuciones complementarias figuran los servicios extraordinarios prestados:","opciones":{"a":"Exclusivamente en días festivos o en horario nocturno.","b":"Fuera de la jornada normal de trabajo.","c":"En comisión de servicios en otra Administración Pública.","d":"Durante el período de prácticas previo al nombramiento."},"correcta":"b","explicacion":"El art. 24.d) se refiere a «Los servicios extraordinarios prestados fuera de la jornada normal de trabajo». El precepto no los limita a festivos o al horario nocturno como dice la opción a), ni se refiere a la comisión de servicios de la opción c) ni al período de prácticas de la opción d).","cita":"«d) Los servicios extraordinarios prestados fuera de la jornada normal de trabajo.»","dificultad":1},{"id":"TREBEP-L2-042","ley":"TREBEP","articulo":"27","articulo_txt":"Art. 27 TREBEP","bloque_id":"TREBEP|Título III. Derechos y deberes. Código de conducta de los empleados públicos · Capítulo III. Derechos retributivos","enunciado":"Según el artículo 27 del TREBEP, las retribuciones del personal laboral se determinarán de acuerdo con la legislación laboral, el convenio colectivo que sea aplicable y el contrato de trabajo, respetando en todo caso lo establecido en:","opciones":{"a":"El artículo 21 del Estatuto.","b":"El artículo 22 del Estatuto.","c":"El artículo 24 del Estatuto.","d":"El artículo 19 del Estatuto."},"correcta":"a","explicacion":"El art. 27 exige respetar «en todo caso lo establecido en el artículo 21 del presente Estatuto», que regula la determinación de las cuantías y de los incrementos retributivos. Los arts. 22 y 24 de las opciones b) y c) se refieren a las retribuciones de los funcionarios y el art. 19 de la opción d) a la carrera y promoción del personal laboral.","cita":"«Las retribuciones del personal laboral se determinarán de acuerdo con la legislación laboral, el convenio colectivo que sea aplicable y el contrato de trabajo, respetando en todo caso lo establecido en el artículo 21 del presente Estatuto.»","dificultad":2},{"id":"TREBEP-L3-006","ley":"TREBEP","articulo":"33.1","articulo_txt":"Art. 33.1 TREBEP","bloque_id":"TREBEP|Título III. Derechos y deberes. Código de conducta de los empleados públicos · Capítulo IV. Derecho a la negociación colectiva, representación y participación institucional. Derecho de reunión","enunciado":"Según el artículo 33.1 del TREBEP, ¿cuál de los siguientes NO figura entre los principios a los que está sujeta la negociación colectiva de condiciones de trabajo de los funcionarios públicos?","opciones":{"a":"Cobertura presupuestaria.","b":"Proporcionalidad.","c":"Buena fe negocial.","d":"Obligatoriedad."},"correcta":"b","explicacion":"La proporcionalidad no figura en el art. 33.1, que sujeta la negociación colectiva «a los principios de legalidad, cobertura presupuestaria, obligatoriedad, buena fe negocial, publicidad y transparencia». La cobertura presupuestaria de la opción a), la buena fe negocial de la opción c) y la obligatoriedad de la opción d) sí aparecen en esa enumeración.","cita":"«1. La negociación colectiva de condiciones de trabajo de los funcionarios públicos que estará sujeta a los principios de legalidad, cobertura presupuestaria, obligatoriedad, buena fe negocial, publicidad y transparencia, se efectuará mediante el ejercicio de la capacidad representativa reconocida a las organizaciones sindicales (…)»","dificultad":2},{"id":"TREBEP-L3-021","ley":"TREBEP","articulo":"37.1.k)","articulo_txt":"Art. 37.1.k) TREBEP","bloque_id":"TREBEP|Título III. Derechos y deberes. Código de conducta de los empleados públicos · Capítulo IV. Derecho a la negociación colectiva, representación y participación institucional. Derecho de reunión","enunciado":"Según el artículo 37.1.k) del TREBEP, son objeto de negociación las materias cuya regulación exija norma con rango de ley que afecten:","opciones":{"a":"A las condiciones de trabajo y a las retribuciones del personal directivo.","b":"Al procedimiento de formación de los actos y disposiciones administrativas.","c":"A las condiciones de trabajo y a las retribuciones de los funcionarios.","d":"Al régimen de los recursos administrativos que pueden interponer los ciudadanos."},"correcta":"c","explicacion":"El art. 37.1.k) incluye entre las materias objeto de negociación «Las que afecten a las condiciones de trabajo y a las retribuciones de los funcionarios, cuya regulación exija norma con rango de ley». La determinación de condiciones de trabajo del personal directivo de la opción a) y el procedimiento de formación de los actos y disposiciones administrativas de la opción b) quedan excluidos de la obligatoriedad de la negociación por el art. 37.2.c) y b); la opción d) no se refiere a condiciones de trabajo de los funcionarios, sino a derechos de los ciudadanos, cuya regulación también excluye el art. 37.2.b).","cita":"«k) Las que afecten a las condiciones de trabajo y a las retribuciones de los funcionarios, cuya regulación exija norma con rango de ley.»","dificultad":2},{"id":"TREBEP-L3-020","ley":"TREBEP","articulo":"37.2.a)","articulo_txt":"Art. 37.2.a) TREBEP","bloque_id":"TREBEP|Título III. Derechos y deberes. Código de conducta de los empleados públicos · Capítulo IV. Derecho a la negociación colectiva, representación y participación institucional. Derecho de reunión","enunciado":"Según el artículo 37.2.a) del TREBEP, cuando las consecuencias de las decisiones de las Administraciones Públicas que afecten a sus potestades de organización tengan repercusión sobre condiciones de trabajo de los funcionarios públicos contempladas en el apartado 1 de ese artículo:","opciones":{"a":"Procederá la negociación tanto de la propia decisión organizativa como de sus consecuencias sobre las condiciones de trabajo.","b":"Deberá informarse a las organizaciones sindicales, sin que proceda la negociación de las condiciones afectadas.","c":"Procederá la negociación de dichas condiciones con las organizaciones sindicales a que se refiere el Estatuto.","d":"La decisión quedará en suspenso hasta que se alcance un Acuerdo en la Mesa General de Negociación correspondiente."},"correcta":"c","explicacion":"El art. 37.2.a) dispone que en ese caso «procederá la negociación de dichas condiciones con las organizaciones sindicales a que se refiere este Estatuto». La opción a) extiende la negociación a la propia decisión organizativa, que sigue excluida de la obligatoriedad de la negociación; la opción b) niega la negociación que el precepto impone, y la opción d) añade una suspensión que la ley no prevé.","cita":"«a) Las decisiones de las Administraciones Públicas que afecten a sus potestades de organización. Cuando las consecuencias de las decisiones de las Administraciones Públicas que afecten a sus potestades de organización tengan repercusión sobre condiciones de trabajo de los funcionarios públicos contempladas en el apartado anterior, procederá la negociación de dichas condiciones con las organizaciones sindicales a que se refiere este Estatuto.»","dificultad":3},{"id":"TREBEP-L3-036","ley":"TREBEP","articulo":"42","articulo_txt":"Art. 42 TREBEP","bloque_id":"TREBEP|Título III. Derechos y deberes. Código de conducta de los empleados públicos · Capítulo IV. Derecho a la negociación colectiva, representación y participación institucional. Derecho de reunión","enunciado":"Según el artículo 42 del TREBEP, el mandato de los miembros de las Juntas de Personal y de los Delegados de Personal será de:","opciones":{"a":"Cuatro años, pudiendo ser reelegidos.","b":"Tres años, pudiendo ser reelegidos.","c":"Cuatro años, pudiendo ser reelegidos una sola vez.","d":"Cinco años, sin posibilidad de reelección."},"correcta":"a","explicacion":"El art. 42 fija un mandato «de cuatro años, pudiendo ser reelegidos». La opción b) cambia la duración; la opción c) añade un límite de una sola reelección que la ley no establece, y la opción d) cambia la duración y niega la reelección.","cita":"«El mandato de los miembros de las Juntas de Personal y de los Delegados de Personal, en su caso, será de cuatro años, pudiendo ser reelegidos.»","dificultad":1},{"id":"TREBEP-L4-016","ley":"TREBEP","articulo":"48.k)","articulo_txt":"Art. 48.k) TREBEP","bloque_id":"TREBEP|Título III. Derechos y deberes. Código de conducta de los empleados públicos · Capítulo V. Derecho a la jornada de trabajo, permisos y vacaciones","enunciado":"Según el artículo 48.k) del TREBEP, ¿de cuántos días de permiso por asuntos particulares disponen los funcionarios públicos?","opciones":{"a":"Cuatro días al año.","b":"Seis días al año.","c":"Tres días al año.","d":"Cinco días al año."},"correcta":"b","explicacion":"El art. 48.k) concede permiso «Por asuntos particulares, seis días al año». Las cifras de las opciones a), c) y d) son inferiores a la que fija esa letra. Además, la disposición adicional decimotercera permite a las Administraciones Públicas establecer hasta dos días adicionales de permiso por asuntos particulares al cumplir el sexto trienio, incrementándose, como máximo, en un día adicional por cada trienio cumplido a partir del octavo.","cita":"«k) Por asuntos particulares, seis días al año.»","dificultad":1},{"id":"TREBEP-L4-018","ley":"TREBEP","articulo":"48.m)","articulo_txt":"Art. 48.m) TREBEP","bloque_id":"TREBEP|Título III. Derechos y deberes. Código de conducta de los empleados públicos · Capítulo V. Derecho a la jornada de trabajo, permisos y vacaciones","enunciado":"Según el artículo 48.m) del TREBEP, los funcionarios tienen permiso por el tiempo indispensable, siempre que deban tener lugar dentro de la jornada de trabajo, para la realización de:","opciones":{"a":"Las revisiones médicas periódicas de la propia persona funcionaria.","b":"Las actividades de formación en materia de primeros auxilios.","c":"Los actos preparatorios de la donación de órganos o tejidos.","d":"Las sesiones preparatorias de pruebas selectivas de promoción interna."},"correcta":"c","explicacion":"El art. 48.m) concede permiso «Por el tiempo indispensable para la realización de los actos preparatorios de la donación de órganos o tejidos siempre que deban tener lugar dentro de la jornada de trabajo». Los supuestos de las opciones a), b) y d) no figuran en esa letra, que fue añadida por el art. 3 de la Ley 6/2024, de 20 de diciembre, en vigor desde el 3 de marzo de 2025.","cita":"«m) Por el tiempo indispensable para la realización de los actos preparatorios de la donación de órganos o tejidos siempre que deban tener lugar dentro de la jornada de trabajo.»","dificultad":2},{"id":"TREBEP-L4-030","ley":"TREBEP","articulo":"50.1","articulo_txt":"Art. 50.1 TREBEP","bloque_id":"TREBEP|Título III. Derechos y deberes. Código de conducta de los empleados públicos · Capítulo V. Derecho a la jornada de trabajo, permisos y vacaciones","enunciado":"Según el artículo 50.1 del TREBEP, los funcionarios públicos tendrán derecho a disfrutar, durante cada año natural, de unas vacaciones retribuidas de:","opciones":{"a":"Veintidós días naturales, o los días que correspondan proporcionalmente si el tiempo de servicio durante el año fue menor.","b":"Veinte días hábiles, o los días que correspondan proporcionalmente si el tiempo de servicio durante el año fue menor.","c":"Veintidós días hábiles en todo caso, cualquiera que haya sido el tiempo de servicio prestado durante el año.","d":"Veintidós días hábiles, o los días que correspondan proporcionalmente si el tiempo de servicio durante el año fue menor."},"correcta":"d","explicacion":"El art. 50.1 reconoce «unas vacaciones retribuidas de veintidós días hábiles, o de los días que correspondan proporcionalmente si el tiempo de servicio durante el año fue menor». La opción a) cambia los días hábiles por naturales, la opción b) altera la cifra y la opción c) suprime la regla de proporcionalidad. La disposición adicional decimocuarta permite a cada Administración Pública establecer hasta un máximo de cuatro días adicionales de vacaciones en función del tiempo de servicios prestados.","cita":"«1. Los funcionarios públicos tendrán derecho a disfrutar, durante cada año natural, de unas vacaciones retribuidas de veintidós días hábiles, o de los días que correspondan proporcionalmente si el tiempo de servicio durante el año fue menor.»","dificultad":1},{"id":"TREBEP-L4-036","ley":"TREBEP","articulo":"53.3","articulo_txt":"Art. 53.3 TREBEP","bloque_id":"TREBEP|Título III. Derechos y deberes. Código de conducta de los empleados públicos · Capítulo VI. Deberes de los empleados públicos. Código de Conducta","enunciado":"Según el artículo 53.3 del TREBEP, los empleados públicos ajustarán su actuación, con la Administración en la que presten sus servicios, con sus superiores, compañeros, subordinados y con los ciudadanos, a los principios de:","opciones":{"a":"Obediencia y disciplina.","b":"Solidaridad y compañerismo.","c":"Cortesía y reserva.","d":"Lealtad y buena fe."},"correcta":"d","explicacion":"El art. 53.3 dispone que «Ajustarán su actuación a los principios de lealtad y buena fe con la Administración en la que presten sus servicios, y con sus superiores, compañeros, subordinados y con los ciudadanos». Los pares de principios de las opciones a), b) y c) no son los que recoge ese apartado.","cita":"«3. Ajustarán su actuación a los principios de lealtad y buena fe con la Administración en la que presten sus servicios, y con sus superiores, compañeros, subordinados y con los ciudadanos.»","dificultad":1},{"id":"TREBEP-L4-041","ley":"TREBEP","articulo":"54.6","articulo_txt":"Art. 54.6 TREBEP","bloque_id":"TREBEP|Título III. Derechos y deberes. Código de conducta de los empleados públicos · Capítulo VI. Deberes de los empleados públicos. Código de Conducta","enunciado":"Según el artículo 54.6 del TREBEP, ¿qué regalos, favores o servicios en condiciones ventajosas se rechazarán?","opciones":{"a":"Únicamente los que procedan de personas interesadas en un procedimiento que tramite el propio empleado público.","b":"Únicamente los que superen el valor económico máximo que fije cada Administración en su código ético.","c":"Todos ellos, incluidos los que respondan a los usos habituales, sociales y de cortesía.","d":"Cualquiera que vaya más allá de los usos habituales, sociales y de cortesía, sin perjuicio de lo establecido en el Código Penal."},"correcta":"d","explicacion":"El art. 54.6 dispone que «Se rechazará cualquier regalo, favor o servicio en condiciones ventajosas que vaya más allá de los usos habituales, sociales y de cortesía, sin perjuicio de lo establecido en el Código Penal». No lo limita a quienes tengan procedimientos en curso —opción a)— ni a un valor fijado por cada Administración —opción b)—, y tampoco obliga a rechazar los que respondan a esos usos —opción c)—.","cita":"«6. Se rechazará cualquier regalo, favor o servicio en condiciones ventajosas que vaya más allá de los usos habituales, sociales y de cortesía, sin perjuicio de lo establecido en el Código Penal.»","dificultad":1},{"id":"TREBEP-L4-043","ley":"TREBEP","articulo":"54.11","articulo_txt":"Art. 54.11 TREBEP","bloque_id":"TREBEP|Título III. Derechos y deberes. Código de conducta de los empleados públicos · Capítulo VI. Deberes de los empleados públicos. Código de Conducta","enunciado":"Según el artículo 54.11 del TREBEP, los empleados públicos garantizarán la atención al ciudadano:","opciones":{"a":"En castellano en todo caso, sin perjuicio de que se le facilite una traducción.","b":"En la lengua oficial que elija el empleado público que le atienda en cada caso.","c":"En la lengua que lo solicite, siempre que sea oficial en el territorio.","d":"En cualquier lengua oficial de la Unión Europea que el ciudadano solicite."},"correcta":"c","explicacion":"El art. 54.11 dispone que «Garantizarán la atención al ciudadano en la lengua que lo solicite siempre que sea oficial en el territorio». La opción a) impone el castellano, la opción b) deja la elección al empleado y la opción d) extiende el deber a lenguas que no son oficiales en el territorio.","cita":"«11. Garantizarán la atención al ciudadano en la lengua que lo solicite siempre que sea oficial en el territorio.»","dificultad":1},{"id":"TREBEP-L5-004","ley":"TREBEP","articulo":"56.1.c)","articulo_txt":"Art. 56.1.c) TREBEP","bloque_id":"TREBEP|Título IV. Adquisición y pérdida de la relación de servicio · Capítulo I. Acceso al empleo público y adquisición de la relación de servicio","enunciado":"Según el artículo 56.1.c) del TREBEP, ¿qué edad mínima se exige para poder participar en los procesos selectivos?","opciones":{"a":"Dieciocho años cumplidos.","b":"Dieciséis años cumplidos.","c":"Diecisiete años cumplidos.","d":"Quince años cumplidos."},"correcta":"b","explicacion":"El art. 56.1.c) exige «Tener cumplidos dieciséis años». Las opciones a), c) y d) cambian esa edad mínima, que el precepto fija en dieciséis años.","cita":"«c) Tener cumplidos dieciséis años y no exceder, en su caso, de la edad máxima de jubilación forzosa.»","dificultad":1},{"id":"TREBEP-L5-009","ley":"TREBEP","articulo":"57.1","articulo_txt":"Art. 57.1 TREBEP","bloque_id":"TREBEP|Título IV. Adquisición y pérdida de la relación de servicio · Capítulo I. Acceso al empleo público y adquisición de la relación de servicio","enunciado":"Según el artículo 57.1 del TREBEP, los nacionales de los Estados miembros de la Unión Europea podrán acceder como personal funcionario a los empleos públicos, salvo a aquellos que:","opciones":{"a":"Impliquen, directa o indirectamente, participar en el ejercicio del poder público o en la salvaguardia de los intereses del Estado o de las Administraciones Públicas.","b":"Exijan el conocimiento de una lengua cooficial de la comunidad autónoma en la que radiquen los puestos de trabajo convocados, salvo que el aspirante lo acredite.","c":"Correspondan a cuerpos o escalas clasificados en el Subgrupo A1, cualquiera que sea la Administración Pública que los convoque o en la que estén integrados.","d":"Supongan el ejercicio de funciones de dirección de unidades administrativas con nivel orgánico de subdirección general o superior en cualquier Administración."},"correcta":"a","explicacion":"El art. 57.1 exceptúa los empleos públicos «que directa o indirectamente impliquen una participación en el ejercicio del poder público o en las funciones que tienen por objeto la salvaguardia de los intereses del Estado o de las Administraciones Públicas». El precepto no excluye los puestos por exigir una lengua cooficial, como dice la opción b), ni por su clasificación en el Subgrupo A1, como dice la opción c), ni por su nivel orgánico, como dice la opción d).","cita":"«1. Los nacionales de los Estados miembros de la Unión Europea podrán acceder, como personal funcionario, en igualdad de condiciones que los españoles a los empleos públicos, con excepción de aquellos que directa o indirectamente impliquen una participación en el ejercicio del poder público o en las funciones que tienen por objeto la salvaguardia de los intereses del Estado o de las Administraciones Públicas.»","dificultad":2},{"id":"TREBEP-L5-015","ley":"TREBEP","articulo":"59.1","articulo_txt":"Art. 59.1 TREBEP","bloque_id":"TREBEP|Título IV. Adquisición y pérdida de la relación de servicio · Capítulo I. Acceso al empleo público y adquisición de la relación de servicio","enunciado":"Según el artículo 59.1 del TREBEP, para cubrir las vacantes reservadas en las ofertas de empleo público, las personas con discapacidad deberán:","opciones":{"a":"Acreditar su discapacidad y la compatibilidad con las tareas, sin necesidad de superar las pruebas del proceso selectivo.","b":"Superar los procesos selectivos y acreditar su discapacidad mediante certificado expedido por la Administración convocante.","c":"Superar un curso selectivo específico y acreditar su discapacidad ante el tribunal, que valorará su capacidad funcional.","d":"Superar los procesos selectivos y acreditar su discapacidad y la compatibilidad con el desempeño de las tareas."},"correcta":"d","explicacion":"El art. 59.1 condiciona la reserva a que las personas con discapacidad «superen los procesos selectivos y acrediten su discapacidad y la compatibilidad con el desempeño de las tareas». La opción a) las exime del proceso selectivo; la opción b) omite la compatibilidad con las tareas y añade un certificado de la Administración convocante que el precepto no exige, y la opción c) sustituye el proceso selectivo por un curso específico.","cita":"«(…) siempre que superen los procesos selectivos y acrediten su discapacidad y la compatibilidad con el desempeño de las tareas (…)»","dificultad":2},{"id":"TREBEP-L5-031","ley":"TREBEP","articulo":"64.1","articulo_txt":"Art. 64.1 TREBEP","bloque_id":"TREBEP|Título IV. Adquisición y pérdida de la relación de servicio · Capítulo II. Pérdida de la relación de servicio","enunciado":"Según el artículo 64.1 del TREBEP, la renuncia voluntaria a la condición de funcionario:","opciones":{"a":"Podrá manifestarse verbalmente o por escrito y se entenderá aceptada si la Administración no resuelve en el plazo de un mes.","b":"Habrá de manifestarse por escrito y será aceptada expresamente por la Administración, salvo en los supuestos del apartado 2.","c":"Habrá de manifestarse por escrito con una antelación mínima de un mes y será aceptada expresamente por la Administración.","d":"Habrá de manifestarse por escrito ante el órgano de selección que propuso el nombramiento, que la aceptará de forma expresa."},"correcta":"b","explicacion":"El art. 64.1 dispone que la renuncia «habrá de ser manifestada por escrito y será aceptada expresamente por la Administración, salvo lo dispuesto en el apartado siguiente». No cabe la renuncia verbal ni la aceptación tácita de la opción a), el precepto no exige el preaviso de un mes de la opción c), y quien la acepta es la Administración, no el órgano de selección de la opción d).","cita":"«1. La renuncia voluntaria a la condición de funcionario habrá de ser manifestada por escrito y será aceptada expresamente por la Administración, salvo lo dispuesto en el apartado siguiente.»","dificultad":1},{"id":"TREBEP-L5-033","ley":"TREBEP","articulo":"64.3","articulo_txt":"Art. 64.3 TREBEP","bloque_id":"TREBEP|Título IV. Adquisición y pérdida de la relación de servicio · Capítulo II. Pérdida de la relación de servicio","enunciado":"Según el artículo 64.3 del TREBEP, la renuncia a la condición de funcionario:","opciones":{"a":"No inhabilita para ingresar de nuevo en la Administración Pública a través del procedimiento de selección establecido.","b":"Inhabilita para ingresar de nuevo en la Administración Pública durante los dos años siguientes a su aceptación expresa.","c":"Permite reingresar sin proceso selectivo, mediante una solicitud de rehabilitación de la condición de funcionario.","d":"Impide definitivamente el ingreso en el mismo cuerpo o escala, aunque no en otros de la misma Administración Pública."},"correcta":"a","explicacion":"El art. 64.3 dispone que la renuncia «no inhabilita para ingresar de nuevo en la Administración Pública a través del procedimiento de selección establecido». Por eso fallan la inhabilitación temporal de la opción b) y el impedimento definitivo de la opción d); la opción c) tampoco es correcta, porque el reingreso exige el procedimiento de selección y la rehabilitación del art. 68 no contempla la renuncia entre sus supuestos.","cita":"«3. La renuncia a la condición de funcionario no inhabilita para ingresar de nuevo en la Administración Pública a través del procedimiento de selección establecido.»","dificultad":1},{"id":"TREBEP-L5-035","ley":"TREBEP","articulo":"66","articulo_txt":"Art. 66 TREBEP","bloque_id":"TREBEP|Título IV. Adquisición y pérdida de la relación de servicio · Capítulo II. Pérdida de la relación de servicio","enunciado":"Según el artículo 66 del TREBEP, ¿qué alcance tiene la pérdida de la condición de funcionario producida por la pena principal o accesoria de inhabilitación para cargo público?","opciones":{"a":"La absoluta la produce respecto de los empleos o cargos especificados en la sentencia, y la especial, respecto a todos los que tuviere.","b":"La absoluta la produce respecto a todos los empleos o cargos que tuviere, y la especial, respecto de los especificados en la sentencia.","c":"Ambas la producen respecto a todos los empleos o cargos que tuviere, pero solo la absoluta impide el reingreso en la Administración.","d":"La absoluta la produce respecto a todos los empleos o cargos que tuviere, y la especial solo suspende al funcionario durante la condena."},"correcta":"b","explicacion":"El art. 66 distingue: la inhabilitación absoluta produce la pérdida de la condición de funcionario «respecto a todos los empleos o cargos que tuviere», y la especial, «respecto de aquellos empleos o cargos especificados en la sentencia». La opción a) invierte ambos efectos; la opción c) atribuye a la especial el mismo alcance que a la absoluta, y la opción d) le da un efecto suspensivo que el precepto no recoge.","cita":"«La pena principal o accesoria de inhabilitación absoluta cuando hubiere adquirido firmeza la sentencia que la imponga produce la pérdida de la condición de funcionario respecto a todos los empleos o cargos que tuviere. La pena principal o accesoria de inhabilitación especial cuando hubiere adquirido firmeza la sentencia que la imponga produce la pérdida de la condición de funcionario respecto de aquellos empleos o cargos especificados en la sentencia.»","dificultad":2}]};</script>
<script>
/* Letra de Ley — motor de test. Sin dependencias; funciona sin conexión.
   Necesita window.LDL_CONFIG y window.LDL_BANCO (los inyecta sistema/letradeley.py). */
(function () {
  "use strict";
  var CFG = window.LDL_CONFIG, B = window.LDL_BANCO;
  var raiz = document.getElementById("ldl");
  var LETRAS = ["a", "b", "c", "d"];
  var POR_ID = {};
  B.preguntas.forEach(function (p) { POR_ID[p.id] = p; });
  var CLAVE = "ldl1:" + CFG.pack.id;
  var prog = cargar();
  var sesion = null;
  var vista = CFG.modo === "web" ? "portada" : "inicio";
  var reloj = null;

  /* ---------- utilidades ---------- */
  function esc(t) {
    return String(t == null ? "" : t).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function barajar(lista) {
    var a = lista.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function pct(a, b) { return b ? Math.round((a / b) * 100) : 0; }
  function plural(n, uno, varios) { return n + " " + (n === 1 ? uno : varios); }
  function num(n) { return String(n).replace(".", ","); }
  function cargar() {
    try { var s = localStorage.getItem(CLAVE); if (s) { var d = JSON.parse(s); if (d && d.p) return d; } } catch (e) {}
    return { p: {}, h: [] };
  }
  function guardar() { try { localStorage.setItem(CLAVE, JSON.stringify(prog)); } catch (e) {} }
  function registrar(id, acierto) {
    var r = prog.p[id] || { v: 0, a: 0, f: 0, c: 0 };
    r.v++;
    if (acierto) { r.a++; r.c = Math.min((r.c || 0) + 1, 5); } else { r.f++; r.c = 0; }
    r.u = acierto ? 1 : 0;
    r.t = Date.now();
    prog.p[id] = r;
    guardar();
  }
  function fallosPendientes() {
    return B.preguntas.filter(function (p) { var r = prog.p[p.id]; return r && r.u === 0; });
  }
  function resumen(lista) {
    var vistas = 0, aciertos = 0, intentos = 0;
    lista.forEach(function (p) {
      var r = prog.p[p.id];
      if (r) { vistas++; aciertos += r.a; intentos += r.v; }
    });
    return { total: lista.length, vistas: vistas, acierto: pct(aciertos, intentos) };
  }
  function delBloque(id) { return B.preguntas.filter(function (p) { return p.bloque_id === id; }); }

  /* ---------- tema claro / oscuro ---------- */
  function aplicarTema() {
    var t = null;
    try { t = localStorage.getItem("ldl:tema"); } catch (e) {}
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    else document.documentElement.removeAttribute("data-theme");
    return t || "auto";
  }
  function cambiarTema() {
    var orden = { auto: "light", light: "dark", dark: "auto" };
    var actual = aplicarTema();
    try { localStorage.setItem("ldl:tema", orden[actual]); } catch (e) {}
    aplicarTema();
    pintar();
  }

  /* ---------- sesiones ---------- */
  function empezar(tipo, preguntas, opciones) {
    opciones = opciones || {};
    if (!preguntas.length) return;
    pararReloj();
    sesion = {
      tipo: tipo, titulo: opciones.titulo || "Test", ids: preguntas.map(function (p) { return p.id; }),
      i: 0, resp: {}, corregida: {}, inicio: Date.now(), limite: opciones.minutos ? opciones.minutos * 60 : 0, fin: null,
      origen: vista === "test" || vista === "resultado" ? (sesion && sesion.origen) || "inicio" : vista
    };
    vista = "test";
    if (sesion.limite) reloj = setInterval(tic, 1000);
    pintar();
    window.scrollTo(0, 0);
  }
  function tic() {
    if (!sesion || sesion.fin) return pararReloj();
    var el = document.getElementById("ldl-crono");
    var resta = sesion.limite - Math.floor((Date.now() - sesion.inicio) / 1000);
    if (resta <= 0) { terminar(); return; }
    if (el) el.textContent = mmss(resta);
  }
  function pararReloj() { if (reloj) { clearInterval(reloj); reloj = null; } }
  function mmss(s) { var m = Math.floor(s / 60), r = s % 60; return m + ":" + (r < 10 ? "0" : "") + r; }

  function responder(letra) {
    var id = sesion.ids[sesion.i];
    if (sesion.tipo === "simulacro") {
      sesion.resp[id] = sesion.resp[id] === letra ? undefined : letra;
      pintar();
      return;
    }
    if (sesion.corregida[id]) return;
    sesion.resp[id] = letra;
    sesion.corregida[id] = true;
    registrar(id, letra === POR_ID[id].correcta);
    pintar();
  }
  function siguiente() {
    if (sesion.i < sesion.ids.length - 1) { sesion.i++; pintar(); window.scrollTo(0, 0); }
    else terminar();
  }
  function anterior() { if (sesion.i > 0) { sesion.i--; pintar(); } }
  function terminar() {
    pararReloj();
    if (sesion.tipo === "simulacro") {
      sesion.ids.forEach(function (id) {
        if (sesion.resp[id]) registrar(id, sesion.resp[id] === POR_ID[id].correcta);
      });
    }
    sesion.fin = Date.now();
    var r = calcular(sesion);
    prog.h.unshift({ t: sesion.fin, tipo: sesion.tipo, n: r.total, a: r.aciertos, e: r.errores, nota: r.nota });
    prog.h = prog.h.slice(0, 50);
    guardar();
    vista = "resultado";
    pintar();
    window.scrollTo(0, 0);
  }
  function calcular(s) {
    var a = 0, e = 0, nr = 0;
    s.ids.forEach(function (id) {
      var r = s.resp[id];
      if (!r) nr++; else if (r === POR_ID[id].correcta) a++; else e++;
    });
    var pen = (CFG.simulacro && CFG.simulacro.penalizacion) || 1 / 3;
    var neta = s.tipo === "simulacro" ? a - e * pen : a;
    var nota = Math.max(0, (neta / s.ids.length) * 10);
    return { total: s.ids.length, aciertos: a, errores: e, blancos: nr, neta: neta, nota: Math.round(nota * 100) / 100 };
  }

  /* ---------- vistas ---------- */
  function cabecera() {
    var tema = aplicarTema();
    var etiquetas = { auto: "Tema: auto", light: "Tema: claro", dark: "Tema: oscuro" };
    return '<header class="ldl-top"><a class="ldl-brand" href="' + esc(CFG.web || "#") + '">' +
      '<span class="ldl-logo" aria-hidden="true">§</span><span><b>Letra de Ley</b><small>' +
      esc(CFG.pack.nombre) + "</small></span></a>" +
      '<button class="ldl-tema" data-acc="tema" type="button">' + etiquetas[tema] + "</button></header>";
  }
  function navegacion() {
    if (CFG.modo === "web") return "";
    var items = [["inicio", "Inicio"], ["temas", "Por temas"], ["simulacro", "Simulacro"], ["fallos", "Fallos"], ["stats", "Estadísticas"]];
    return '<nav class="ldl-nav" aria-label="Secciones">' + items.map(function (it) {
      var actual = vista === it[0] || (vista === "test" && sesion && sesion.origen === it[0]);
      return '<button type="button" data-acc="ir" data-v="' + it[0] + '"' + (actual ? ' aria-current="page"' : "") + ">" + it[1] + "</button>";
    }).join("") + "</nav>";
  }
  function pie() {
    return '<p class="ldl-pie">Letra de Ley · ' + esc(CFG.pack.edicion) + " · Texto legal actualizado a " +
      esc(CFG.pack.actualizado) + "<br>Uso personal. Prohibida su redistribución.</p>";
  }

  function vInicio() {
    var r = resumen(B.preguntas), f = fallosPendientes().length;
    return '<section class="ldl-card"><h2>' + esc(CFG.pack.nombre) + "</h2>" +
      '<p class="ldl-muted">' + B.preguntas.length + " preguntas comentadas, con el artículo exacto de cada respuesta.</p>" +
      '<div class="ldl-kpis"><div class="ldl-kpi"><b>' + r.vistas + "/" + r.total + "</b><span>respondidas</span></div>" +
      '<div class="ldl-kpi"><b>' + r.acierto + ' %</b><span>de acierto</span></div>' +
      '<div class="ldl-kpi"><b>' + f + "</b><span>fallos por repasar</span></div></div>" +
      '<div class="ldl-acciones"><button class="ldl-btn" data-acc="rapido" type="button">Test rápido de 20</button>' +
      '<button class="ldl-btn sec" data-acc="ir" data-v="simulacro" type="button">Simulacro de examen</button>' +
      (f ? '<button class="ldl-btn sec" data-acc="repasar" type="button">Repasar ' + f + " fallos</button>" : "") +
      "</div></section>" +
      '<section class="ldl-card"><h3>Cómo sacarle partido</h3><ol class="ldl-muted">' +
      "<li>Practica <b>por temas</b>: cada respuesta te enseña el artículo y por qué fallan las demás opciones.</li>" +
      "<li>Cada pocos días, <b>repasa tus fallos</b>: es donde más se aprende.</li>" +
      "<li>Antes del examen, haz <b>simulacros</b> con tiempo y con la penalización real (cada error resta 1/3).</li></ol>" +
      '<p class="ldl-small ldl-muted">Tu progreso se guarda en este dispositivo y en este navegador.</p></section>' + historial();
  }
  function historial() {
    if (!prog.h.length) return "";
    return '<section class="ldl-card"><h3>Últimos tests</h3><ul class="ldl-revision">' + prog.h.slice(0, 5).map(function (h) {
      var d = new Date(h.t);
      return "<li><b>" + (h.tipo === "simulacro" ? "Simulacro" : "Práctica") + "</b> · " + d.toLocaleDateString("es-ES") +
        " · " + h.a + "/" + h.n + " aciertos" + (h.tipo === "simulacro" ? " · nota " + num(h.nota) : "") + "</li>";
    }).join("") + "</ul></section>";
  }
  function vTemas() {
    var html = '<section class="ldl-card"><h2>Practicar por temas</h2><p class="ldl-muted">Elige un bloque. Las preguntas salen en orden aleatorio y se corrigen al momento.</p><ul class="ldl-bloques">';
    B.bloques.forEach(function (b) {
      var lista = delBloque(b.id), r = resumen(lista);
      html += '<li><button type="button" data-acc="bloque" data-id="' + esc(b.id) + '"><span class="t">' + esc(b.nombre) +
        '</span><span class="n">' + r.vistas + "/" + r.total + (r.vistas ? " · " + r.acierto + " %" : "") + "</span>" +
        '<span class="ldl-barra"><i style="width:' + pct(r.vistas, r.total) + '%"></i></span></button></li>';
    });
    return html + "</ul></section>";
  }
  function vSimulacro() {
    var total = B.preguntas.length;
    var opcionesN = [10, 20, 30, 50, 100].filter(function (n) { return n < total; });
    opcionesN.push(total);
    var porDefecto = Math.min((CFG.simulacro && CFG.simulacro.preguntas) || 30, total);
    return '<section class="ldl-card"><h2>Simulacro de examen</h2>' +
      '<p class="ldl-muted">Como el día del examen: no ves las soluciones hasta el final y cada error resta un tercio de acierto.</p>' +
      '<div class="ldl-campo"><label for="ldl-n">Número de preguntas</label><select id="ldl-n">' +
      opcionesN.map(function (n) { return "<option" + (n === porDefecto ? " selected" : "") + ">" + n + "</option>"; }).join("") +
      '</select></div><div class="ldl-campo"><label for="ldl-t">Tiempo</label><select id="ldl-t">' +
      '<option value="1">1 minuto por pregunta</option><option value="0">Sin límite de tiempo</option></select></div>' +
      '<div class="ldl-campo"><label for="ldl-b">Temas</label><select id="ldl-b"><option value="">Todos</option>' +
      B.bloques.map(function (b) { return '<option value="' + esc(b.id) + '">' + esc(b.nombre) + "</option>"; }).join("") +
      '</select></div><div class="ldl-acciones"><button class="ldl-btn" data-acc="simular" type="button">Empezar simulacro</button></div></section>';
  }
  function vFallos() {
    var f = fallosPendientes();
    if (!f.length) {
      return '<section class="ldl-card"><h2>Repaso de fallos</h2><p class="ldl-muted">No tienes fallos pendientes. Cuando falles una pregunta aparecerá aquí hasta que la aciertes.</p></section>';
    }
    return '<section class="ldl-card"><h2>Repaso de fallos</h2><p class="ldl-muted">Tienes <b>' + f.length +
      "</b> preguntas falladas. Salen de aquí en cuanto las aciertas.</p>" +
      '<div class="ldl-acciones"><button class="ldl-btn" data-acc="repasar" type="button">Repasar ahora</button></div></section>';
  }
  function vStats() {
    var html = '<section class="ldl-card"><h2>Estadísticas</h2><ul class="ldl-bloques">';
    B.bloques.forEach(function (b) {
      var r = resumen(delBloque(b.id));
      html += '<li><button type="button" data-acc="bloque" data-id="' + esc(b.id) + '"><span class="t">' + esc(b.nombre) +
        '</span><span class="n">' + (r.vistas ? r.acierto + " % de acierto" : "sin empezar") + '</span><span class="ldl-barra"><i style="width:' +
        r.acierto + '%"></i></span></button></li>';
    });
    html += '</ul></section><section class="ldl-card"><h3>Empezar de cero</h3><p class="ldl-muted ldl-small">Borra tu progreso guardado en este dispositivo.</p>' +
      '<div class="ldl-acciones"><button class="ldl-btn sec" data-acc="borrar" type="button">Borrar mi progreso</button></div></section>';
    return html;
  }
  function vPortada() {
    var n = B.preguntas.length;
    return '<section class="ldl-card"><h2>' + esc(CFG.pack.nombre) + "</h2>" +
      '<p class="ldl-muted">' + n + " preguntas tipo examen, corregidas al momento, con el artículo exacto y la explicación de cada opción. Gratis y sin registrarte.</p>" +
      '<div class="ldl-acciones"><button class="ldl-btn" data-acc="empezarweb" type="button">Empezar el test</button></div></section>';
  }

  function vTest() {
    var id = sesion.ids[sesion.i], p = POR_ID[id], sim = sesion.tipo === "simulacro";
    var elegida = sesion.resp[id], corregida = !sim && sesion.corregida[id];
    var html = '<section class="ldl-card"><div class="ldl-meta"><span>' + esc(sesion.titulo) + " · " + (sesion.i + 1) + " de " + sesion.ids.length +
      "</span><span>" + (sesion.limite ? '⏱ <span id="ldl-crono" class="ldl-crono">' +
        mmss(Math.max(0, sesion.limite - Math.floor((Date.now() - sesion.inicio) / 1000))) + "</span>" : esc(p.articulo_txt)) +
      '</span></div><div class="ldl-progreso"><i style="width:' + pct(sesion.i + (corregida ? 1 : 0), sesion.ids.length) + '%"></i></div>' +
      '<p class="ldl-enunciado">' + esc(p.enunciado) + '</p><div class="ldl-opciones" role="group" aria-label="Opciones">';
    LETRAS.forEach(function (l) {
      var cls = "ldl-op";
      if (corregida) { if (l === p.correcta) cls += " ok"; else if (l === elegida) cls += " ko"; }
      else if (sim && elegida === l) cls += " marcada";
      html += '<button type="button" class="' + cls + '" data-acc="resp" data-l="' + l + '"' + (corregida ? " disabled" : "") +
        (sim ? ' aria-pressed="' + (elegida === l) + '"' : "") + '><span class="l">' + l + ")</span><span>" + esc(p.opciones[l]) + "</span></button>";
    });
    html += "</div>";
    if (corregida) html += feedback(p, elegida);
    html += '<div class="ldl-acciones">';
    if (sim) {
      html += (sesion.i > 0 ? '<button class="ldl-btn sec" data-acc="ant" type="button">Anterior</button>' : "") +
        '<button class="ldl-btn" data-acc="sig" type="button">' + (sesion.i < sesion.ids.length - 1 ? "Siguiente" : "Entregar") + "</button>" +
        (sesion.i < sesion.ids.length - 1 ? '<button class="ldl-btn sec" data-acc="entregar" type="button">Entregar ya</button>' : "");
    } else if (corregida) {
      html += '<button class="ldl-btn" data-acc="sig" type="button">' + (sesion.i < sesion.ids.length - 1 ? "Siguiente" : "Ver resultado") + "</button>";
    }
    html += '<button class="ldl-btn sec" data-acc="salir" type="button">Salir</button></div></section>';
    return html;
  }
  function feedback(p, elegida) {
    var bien = elegida === p.correcta;
    return '<div class="ldl-feedback" aria-live="polite"><div class="v ' + (bien ? "ok" : "ko") + '">' +
      (bien ? "¡Correcta!" : "Incorrecta. La respuesta correcta es la " + p.correcta + ")") + "</div><div>" + esc(p.explicacion) + "</div>" +
      (p.cita ? '<blockquote class="ldl-cita">' + esc(p.cita) + "<small>" + esc(p.articulo_txt) + "</small></blockquote>" : "") + "</div>";
  }
  function vResultado() {
    var r = calcular(sesion), sim = sesion.tipo === "simulacro";
    var html = '<section class="ldl-card"><h2>' + (sim ? "Resultado del simulacro" : "Resultado") + "</h2>" +
      '<div class="ldl-nota">' + (sim ? num(r.nota.toFixed(2)) : r.aciertos + "/" + r.total) + "</div>" +
      '<p class="ldl-muted">' + plural(r.aciertos, "acierto", "aciertos") + " · " + plural(r.errores, "error", "errores") +
      (r.blancos ? " · " + r.blancos + " en blanco" : "") +
      (sim ? " · nota sobre 10 con penalización" : "") + "</p>";
    if (CFG.modo === "web") html += ctaWeb(r);
    html += '<div class="ldl-acciones">' + (CFG.modo === "web" ? '<button class="ldl-btn sec" data-acc="empezarweb" type="button">Repetir con otro orden</button>' :
      '<button class="ldl-btn" data-acc="ir" data-v="inicio" type="button">Volver al inicio</button>') + "</div></section>";
    html += '<section class="ldl-card"><h3>Revisión</h3><ul class="ldl-revision">';
    sesion.ids.forEach(function (id, n) {
      var p = POR_ID[id], e = sesion.resp[id], chip = !e ? '<span class="ldl-chip nr">En blanco</span>' :
        e === p.correcta ? '<span class="ldl-chip ok">Bien</span>' : '<span class="ldl-chip ko">Mal</span>';
      html += "<li>" + chip + '<span class="e">' + (n + 1) + ". " + esc(p.enunciado) + "</span><br>" +
        '<span class="ldl-small">Correcta: <b>' + p.correcta + ") " + esc(p.opciones[p.correcta]) + "</b>" +
        (e && e !== p.correcta ? " · Marcaste " + e + ")" : "") + '</span><br><span class="ldl-small ldl-muted">' + esc(p.explicacion) + "</span></li>";
    });
    return html + "</ul></section>";
  }
  function ctaWeb() {
    var c = CFG.compra || {}, html = "";
    if (c.url) {
      html += '<div class="ldl-card ldl-cta"><h3>' + esc(c.titulo) + '</h3><p class="ldl-muted">' + esc(c.texto) + "</p>" +
        '<div class="ldl-acciones"><a class="ldl-btn acc" href="' + esc(c.url) + '">' + esc(c.boton) + "</a></div></div>";
    }
    if (CFG.telegram) {
      html += '<p class="ldl-small">¿Quieres un test cada día? <a href="' + esc(CFG.telegram) + '">Únete gratis al canal de Telegram</a>.</p>';
    }
    return html;
  }

  function pintar() {
    var cuerpo;
    if (vista === "test") cuerpo = vTest();
    else if (vista === "resultado") cuerpo = vResultado();
    else if (vista === "portada") cuerpo = vPortada();
    else if (vista === "temas") cuerpo = vTemas();
    else if (vista === "simulacro") cuerpo = vSimulacro();
    else if (vista === "fallos") cuerpo = vFallos();
    else if (vista === "stats") cuerpo = vStats();
    else cuerpo = vInicio();
    raiz.innerHTML = '<div class="ldl">' + cabecera() + navegacion() + "<main>" + cuerpo + "</main>" + pie() + "</div>";
  }

  /* ---------- eventos ---------- */
  raiz.addEventListener("click", function (ev) {
    var el = ev.target.closest("[data-acc]");
    if (!el) return;
    var acc = el.getAttribute("data-acc");
    if (acc === "tema") return cambiarTema();
    if (acc === "ir") { pararReloj(); vista = el.getAttribute("data-v"); sesion = null; pintar(); return; }
    if (acc === "rapido") return empezar("practica", barajar(B.preguntas).slice(0, 20), { titulo: "Test rápido" });
    if (acc === "repasar") return empezar("practica", barajar(fallosPendientes()).slice(0, 30), { titulo: "Repaso de fallos" });
    if (acc === "bloque") {
      var b = B.bloques.filter(function (x) { return x.id === el.getAttribute("data-id"); })[0];
      return empezar("practica", barajar(delBloque(b.id)), { titulo: b.nombre });
    }
    if (acc === "simular") {
      var n = parseInt(document.getElementById("ldl-n").value, 10);
      var conTiempo = document.getElementById("ldl-t").value === "1";
      var bloque = document.getElementById("ldl-b").value;
      var fuente = bloque ? delBloque(bloque) : B.preguntas;
      var elegidas = barajar(fuente).slice(0, n);
      return empezar("simulacro", elegidas, { titulo: "Simulacro", minutos: conTiempo ? elegidas.length : 0 });
    }
    if (acc === "empezarweb") return empezar("practica", barajar(B.preguntas), { titulo: "Test gratuito" });
    if (acc === "resp") return responder(el.getAttribute("data-l"));
    if (acc === "sig") return siguiente();
    if (acc === "ant") return anterior();
    if (acc === "entregar") return terminar();
    if (acc === "salir") { pararReloj(); sesion = null; vista = CFG.modo === "web" ? "portada" : "inicio"; pintar(); return; }
    if (acc === "borrar") {
      if (el.getAttribute("data-confirmar") === "1") { prog = { p: {}, h: [] }; guardar(); pintar(); }
      else { el.setAttribute("data-confirmar", "1"); el.textContent = "Pulsa otra vez para confirmar"; }
    }
  });
  document.addEventListener("keydown", function (ev) {
    if (vista !== "test" || !sesion || ev.altKey || ev.ctrlKey || ev.metaKey) return;
    var k = ev.key.toLowerCase(), mapa = { "1": "a", "2": "b", "3": "c", "4": "d", a: "a", b: "b", c: "c", d: "d" };
    if (mapa[k]) { ev.preventDefault(); responder(mapa[k]); }
    else if (k === "enter" || k === "arrowright") {
      var id = sesion.ids[sesion.i];
      if (sesion.tipo === "simulacro" || sesion.corregida[id]) { ev.preventDefault(); siguiente(); }
    } else if (k === "arrowleft" && sesion.tipo === "simulacro") { ev.preventDefault(); anterior(); }
  });

  pintar();
})();
</script>
</body>
</html>
