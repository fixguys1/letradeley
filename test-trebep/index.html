es». El precepto no menciona para este personal el Estatuto, que la opción a) antepone al convenio colectivo, ni la legislación de Función Pública de la opción b) ni el régimen estatutario de la opción d).","cita":"«Su personal laboral se regirá por la legislación laboral y demás normas convencionalmente aplicables.»","dificultad":1},{"id":"TREBEP-L1-017","ley":"TREBEP","articulo":"7","articulo_txt":"Art. 7 TREBEP","bloque_id":"TREBEP|Título I. Objeto y ámbito de aplicación","enunciado":"Según el artículo 7 del TREBEP, en materia de permisos de nacimiento, adopción, del progenitor diferente de la madre biológica, de lactancia y parental, el personal laboral al servicio de las Administraciones públicas se regirá:","opciones":{"a":"Por las previsiones del Estatuto de los Trabajadores sobre suspensión del contrato, con preferencia sobre el TREBEP.","b":"Por lo que disponga el convenio colectivo y, en su defecto, por el TREBEP.","c":"Por lo previsto en el TREBEP, sin aplicarse las previsiones del Estatuto de los Trabajadores sobre suspensión del contrato.","d":"Por el régimen que elija cada trabajador entre el del TREBEP y el del Estatuto de los Trabajadores."},"correcta":"c","explicacion":"El párrafo segundo del art. 7, en la redacción dada por el art. 2.1 del Real Decreto-ley 9/2025, de 29 de julio, dispone que en esos permisos este personal «se regirá por lo previsto en el presente Estatuto», sin que le sean de aplicación las previsiones del texto refundido de la Ley del Estatuto de los Trabajadores sobre las suspensiones de los contratos de trabajo por los mismos supuestos de hecho. Por eso fallan la opción a), que da preferencia al Estatuto de los Trabajadores, la opción b), que remite al convenio colectivo, y la opción d), que deja la elección al trabajador. El art. 7 también fue modificado por el art. 3.1 del Real Decreto-ley 6/2019, de 1 de marzo.","cita":"«No obstante, en materia de permisos de nacimiento, adopción, del progenitor diferente de la madre biológica, de lactancia y parental, el personal laboral al servicio de las Administraciones públicas se regirá por lo previsto en el presente Estatuto, no siendo de aplicación a este personal, por tanto, las previsiones del texto refundido de la Ley del Estatuto de los Trabajadores sobre las suspensiones de los contratos de trabajo que, en su caso, corresponderían por los mismos supuestos de hecho.»","dificultad":2},{"id":"TREBEP-L1-018","ley":"TREBEP","articulo":"8.1","articulo_txt":"Art. 8.1 TREBEP","bloque_id":"TREBEP|Título II. Personal al servicio de las Administraciones Públicas · Capítulo I. Clases de personal","enunciado":"Según el artículo 8.1 del TREBEP, son empleados públicos quienes desempeñan funciones retribuidas en las Administraciones Públicas al servicio de:","opciones":{"a":"La autoridad que los nombra.","b":"El Gobierno de la Nación.","c":"La Administración que los contrata.","d":"Los intereses generales."},"correcta":"d","explicacion":"El art. 8.1 define a los empleados públicos como quienes desempeñan funciones retribuidas en las Administraciones Públicas «al servicio de los intereses generales». Las opciones a), b) y c) sustituyen esa referencia por una autoridad, el Gobierno o la Administración de la que dependen, que el precepto no menciona.","cita":"«1. Son empleados públicos quienes desempeñan funciones retribuidas en las Administraciones Públicas al servicio de los intereses generales.»","dificultad":1},{"id":"TREBEP-L1-030","ley":"TREBEP","articulo":"10.4","articulo_txt":"Art. 10.4 TREBEP","bloque_id":"TREBEP|Título II. Personal al servicio de las Administraciones Públicas · Capítulo I. Clases de personal","enunciado":"Según el artículo 10.4 del TREBEP, una vez producido el fin de la relación de interinidad por el transcurso del plazo previsto desde el nombramiento del personal funcionario interino, la vacante:","opciones":{"a":"Deberá ser amortizada y no podrá volver a cubrirse por personal funcionario interino en ningún caso.","b":"Podrá cubrirse mediante la contratación de personal laboral temporal.","c":"Solo podrá ocuparla personal funcionario de carrera, salvo que el proceso selectivo quede desierto.","d":"Quedará reservada al personal funcionario interino que la venía ocupando."},"correcta":"c","explicacion":"El art. 10.4, párrafo segundo, dispone que, transcurridos tres años desde el nombramiento, «la vacante solo podrá ser ocupada por personal funcionario de carrera, salvo que el correspondiente proceso selectivo quede desierto, en cuyo caso se podrá efectuar otro nombramiento de personal funcionario interino». Por eso fallan la opción a), que impone la amortización y prohíbe todo nuevo nombramiento interino, la opción b), que admite personal laboral temporal, y la opción d), que reserva la plaza al interino que la ocupaba.","cita":"«No obstante, transcurridos tres años desde el nombramiento del personal funcionario interino se producirá el fin de la relación de interinidad, y la vacante solo podrá ser ocupada por personal funcionario de carrera, salvo que el correspondiente proceso selectivo quede desierto, en cuyo caso se podrá efectuar otro nombramiento de personal funcionario interino.»","dificultad":2},{"id":"TREBEP-L1-041","ley":"TREBEP","articulo":"13.2","articulo_txt":"Art. 13.2 TREBEP","bloque_id":"TREBEP|Título II. Personal al servicio de las Administraciones Públicas · Capítulo II. Personal directivo","enunciado":"Según el artículo 13.2 del TREBEP, la designación del personal directivo atenderá a principios de mérito y capacidad y a criterios de:","opciones":{"a":"Antigüedad.","b":"Oportunidad.","c":"Idoneidad.","d":"Representatividad."},"correcta":"c","explicacion":"El art. 13.2 dispone que la designación «atenderá a principios de mérito y capacidad y a criterios de idoneidad», y que se llevará a cabo mediante procedimientos que garanticen la publicidad y concurrencia. La antigüedad, la oportunidad y la representatividad de las opciones a), b) y d) no figuran en el precepto.","cita":"«2. Su designación atenderá a principios de mérito y capacidad y a criterios de idoneidad, y se llevará a cabo mediante procedimientos que garanticen la publicidad y concurrencia.»","dificultad":1},{"id":"TREBEP-L1-042","ley":"TREBEP","articulo":"13.4","articulo_txt":"Art. 13.4 TREBEP","bloque_id":"TREBEP|Título II. Personal al servicio de las Administraciones Públicas · Capítulo II. Personal directivo","enunciado":"Según el artículo 13.4 del TREBEP, la determinación de las condiciones de empleo del personal directivo:","opciones":{"a":"No tendrá la consideración de materia objeto de negociación colectiva a los efectos de esta ley.","b":"Será materia objeto de negociación colectiva en la Mesa General de Negociación.","c":"Solo será objeto de negociación colectiva cuando el directivo tenga la condición de funcionario.","d":"Será objeto de negociación colectiva únicamente en las comunidades autónomas."},"correcta":"a","explicacion":"El art. 13.4 dispone que la determinación de las condiciones de empleo del personal directivo «no tendrá la consideración de materia objeto de negociación colectiva a los efectos de esta ley». Las opciones b), c) y d) la someten a negociación colectiva, con carácter general o en determinados casos, en contra de lo que dice el precepto.","cita":"«4. La determinación de las condiciones de empleo del personal directivo no tendrá la consideración de materia objeto de negociación colectiva a los efectos de esta ley.»","dificultad":2},{"id":"TREBEP-L2-008","ley":"TREBEP","articulo":"14.p)","articulo_txt":"Art. 14.p) TREBEP","bloque_id":"TREBEP|Título III. Derechos y deberes. Código de conducta de los empleados públicos · Capítulo I. Derechos de los empleados públicos","enunciado":"Según los artículos 14 y 15 del TREBEP, ¿cuál de los siguientes derechos figura entre los derechos individuales de los empleados públicos y NO entre los que se ejercen de forma colectiva?","opciones":{"a":"A la libre asociación profesional.","b":"A la libertad sindical.","c":"A la negociación colectiva.","d":"A la participación en la determinación de las condiciones de trabajo."},"correcta":"a","explicacion":"La libre asociación profesional figura en el art. 14.p) entre los derechos de carácter individual. La libertad sindical de la opción b), la negociación colectiva de la opción c) y la participación en la determinación de las condiciones de trabajo de la opción d) son derechos individuales que se ejercen de forma colectiva según el art. 15, letras a) y b).","cita":"«p) A la libre asociación profesional.»","dificultad":2},{"id":"TREBEP-L2-010","ley":"TREBEP","articulo":"15.d)","articulo_txt":"Art. 15.d) TREBEP","bloque_id":"TREBEP|Título III. Derechos y deberes. Código de conducta de los empleados públicos · Capítulo I. Derechos de los empleados públicos","enunciado":"Según el artículo 15.d) del TREBEP, el derecho al planteamiento de conflictos colectivos de trabajo se ejerce:","opciones":{"a":"Solo por el personal laboral, conforme a su convenio colectivo.","b":"Únicamente ante la jurisdicción contencioso-administrativa.","c":"De acuerdo con la legislación aplicable en cada caso.","d":"Exclusivamente en los términos que fije el propio artículo 15."},"correcta":"c","explicacion":"El art. 15.d) reconoce el derecho «Al planteamiento de conflictos colectivos de trabajo, de acuerdo con la legislación aplicable en cada caso». El art. 15 atribuye ese derecho a los empleados públicos, no solo al personal laboral como dice la opción a); no lo limita a la jurisdicción contencioso-administrativa como dice la opción b) y no lo regula por sí mismo, sino que remite a la legislación aplicable, frente a lo que afirma la opción d).","cita":"«d) Al planteamiento de conflictos colectivos de trabajo, de acuerdo con la legislación aplicable en cada caso.»","dificultad":2},{"id":"TREBEP-L2-014","ley":"TREBEP","articulo":"16.3.c)","articulo_txt":"Art. 16.3.c) TREBEP","bloque_id":"TREBEP|Título III. Derechos y deberes. Código de conducta de los empleados públicos · Capítulo II. Derecho a la carrera profesional y a la promoción interna. La evaluación del desempeño","enunciado":"Según el artículo 16.3.c) del TREBEP, la promoción interna vertical consiste en:","opciones":{"a":"El ascenso desde un cuerpo o escala de un Subgrupo, o Grupo de clasificación profesional si este no tiene Subgrupo, a otro superior.","b":"El acceso a cuerpos o escalas del mismo Subgrupo profesional, de acuerdo con lo dispuesto en el artículo 18 del Estatuto.","c":"El paso a un puesto de trabajo de nivel superior dentro del mismo cuerpo o escala, sin cambiar de Subgrupo profesional.","d":"La progresión de grado, categoría, escalón u otros conceptos análogos, sin necesidad de cambiar de puesto de trabajo."},"correcta":"a","explicacion":"El art. 16.3.c) define la promoción interna vertical como «el ascenso desde un cuerpo o escala de un Subgrupo, o Grupo de clasificación profesional en el supuesto de que éste no tenga Subgrupo, a otro superior». La opción b) describe la promoción interna horizontal del art. 16.3.d) y la opción d) la carrera horizontal del art. 16.3.a); la opción c) describe un cambio de puesto dentro del mismo cuerpo o escala, no el ascenso a otro cuerpo o escala superior.","cita":"«c) Promoción interna vertical, que consiste en el ascenso desde un cuerpo o escala de un Subgrupo, o Grupo de clasificación profesional en el supuesto de que éste no tenga Subgrupo, a otro superior, de acuerdo con lo establecido en el artículo 18.»","dificultad":2},{"id":"TREBEP-L2-017","ley":"TREBEP","articulo":"17.a)","articulo_txt":"Art. 17.a) TREBEP","bloque_id":"TREBEP|Título III. Derechos y deberes. Código de conducta de los empleados públicos · Capítulo II. Derecho a la carrera profesional y a la promoción interna. La evaluación del desempeño","enunciado":"Según el artículo 17.a) del TREBEP, en el sistema de grados, categorías o escalones de la carrera horizontal, los ascensos:","opciones":{"a":"Serán siempre consecutivos, sin que quepa prever ninguna excepción en las leyes de Función Pública.","b":"Podrán producirse libremente, sin necesidad de respetar el orden consecutivo de los grados o categorías.","c":"Serán consecutivos solo cuando lo establezca así el convenio colectivo aplicable a cada Administración.","d":"Serán consecutivos con carácter general, salvo en supuestos excepcionales en los que se prevea otra posibilidad."},"correcta":"d","explicacion":"El art. 17.a) establece que «Los ascensos serán consecutivos con carácter general, salvo en aquellos supuestos excepcionales en los que se prevea otra posibilidad». La opción a) suprime esas excepciones, la opción b) invierte la regla general y la opción c) la hace depender de un convenio colectivo que el precepto no menciona.","cita":"«a) Se articulará un sistema de grados, categorías o escalones de ascenso fijándose la remuneración a cada uno de ellos. Los ascensos serán consecutivos con carácter general, salvo en aquellos supuestos excepcionales en los que se prevea otra posibilidad.»","dificultad":2},{"id":"TREBEP-L4-046","ley":"TREBEP","articulo":"22.1","articulo_txt":"Art. 22.1 TREBEP","bloque_id":"TREBEP|Título III. Derechos y deberes. Código de conducta de los empleados públicos · Capítulo III. Derechos retributivos","enunciado":"Según el artículo 22.1 del TREBEP, la clasificación de las retribuciones en básicas y complementarias que establece ese apartado se refiere a las retribuciones de:","opciones":{"a":"Todos los empleados públicos, cualquiera que sea la naturaleza de su relación de servicio.","b":"El personal laboral fijo al servicio de las Administraciones Públicas.","c":"El personal directivo profesional de las Administraciones Públicas.","d":"Los funcionarios de carrera."},"correcta":"d","explicacion":"El art. 22.1 dispone que «Las retribuciones de los funcionarios de carrera se clasifican en básicas y complementarias». No se refiere a todos los empleados públicos —opción a)—, al personal laboral —opción b)— ni al personal directivo profesional —opción c)—.","cita":"«1. Las retribuciones de los funcionarios de carrera se clasifican en básicas y complementarias.»","dificultad":1},{"id":"TREBEP-L2-038","ley":"TREBEP","articulo":"24.d)","articulo_txt":"Art. 24.d) TREBEP","bloque_id":"TREBEP|Título III. Derechos y deberes. Código de conducta de los empleados públicos · Capítulo III. Derechos retributivos","enunciado":"Según el artículo 24.d) del TREBEP, entre los factores para establecer las retribuciones complementarias figuran los servicios extraordinarios prestados:","opciones":{"a":"Exclusivamente en días festivos o en horario nocturno.","b":"Fuera de la jornada normal de trabajo.","c":"En comisión de servicios en otra Administración Pública.","d":"Durante el período de prácticas previo al nombramiento."},"correcta":"b","explicacion":"El art. 24.d) se refiere a «Los servicios extraordinarios prestados fuera de la jornada normal de trabajo». El precepto no los limita a festivos o al horario nocturno como dice la opción a), ni se refiere a la comisión de servicios de la opción c) ni al período de prácticas de la opción d).","cita":"«d) Los servicios extraordinarios prestados fuera de la jornada normal de trabajo.»","dificultad":1},{"id":"TREBEP-L3-020","ley":"TREBEP","articulo":"37.2.a)","articulo_txt":"Art. 37.2.a) TREBEP","bloque_id":"TREBEP|Título III. Derechos y deberes. Código de conducta de los empleados públicos · Capítulo IV. Derecho a la negociación colectiva, representación y participación institucional. Derecho de reunión","enunciado":"Según el artículo 37.2.a) del TREBEP, cuando las consecuencias de las decisiones de las Administraciones Públicas que afecten a sus potestades de organización tengan repercusión sobre condiciones de trabajo de los funcionarios públicos contempladas en el apartado 1 de ese artículo:","opciones":{"a":"Procederá la negociación tanto de la propia decisión organizativa como de sus consecuencias sobre las condiciones de trabajo.","b":"Deberá informarse a las organizaciones sindicales, sin que proceda la negociación de las condiciones afectadas.","c":"Procederá la negociación de dichas condiciones con las organizaciones sindicales a que se refiere el Estatuto.","d":"La decisión quedará en suspenso hasta que se alcance un Acuerdo en la Mesa General de Negociación correspondiente."},"correcta":"c","explicacion":"El art. 37.2.a) dispone que en ese caso «procederá la negociación de dichas condiciones con las organizaciones sindicales a que se refiere este Estatuto». La opción a) extiende la negociación a la propia decisión organizativa, que sigue excluida de la obligatoriedad de la negociación; la opción b) niega la negociación que el precepto impone, y la opción d) añade una suspensión que la ley no prevé.","cita":"«a) Las decisiones de las Administraciones Públicas que afecten a sus potestades de organización. Cuando las consecuencias de las decisiones de las Administraciones Públicas que afecten a sus potestades de organización tengan repercusión sobre condiciones de trabajo de los funcionarios públicos contempladas en el apartado anterior, procederá la negociación de dichas condiciones con las organizaciones sindicales a que se refiere este Estatuto.»","dificultad":3},{"id":"TREBEP-L3-036","ley":"TREBEP","articulo":"42","articulo_txt":"Art. 42 TREBEP","bloque_id":"TREBEP|Título III. Derechos y deberes. Código de conducta de los empleados públicos · Capítulo IV. Derecho a la negociación colectiva, representación y participación institucional. Derecho de reunión","enunciado":"Según el artículo 42 del TREBEP, el mandato de los miembros de las Juntas de Personal y de los Delegados de Personal será de:","opciones":{"a":"Cuatro años, pudiendo ser reelegidos.","b":"Tres años, pudiendo ser reelegidos.","c":"Cuatro años, pudiendo ser reelegidos una sola vez.","d":"Cinco años, sin posibilidad de reelección."},"correcta":"a","explicacion":"El art. 42 fija un mandato «de cuatro años, pudiendo ser reelegidos». La opción b) cambia la duración; la opción c) añade un límite de una sola reelección que la ley no establece, y la opción d) cambia la duración y niega la reelección.","cita":"«El mandato de los miembros de las Juntas de Personal y de los Delegados de Personal, en su caso, será de cuatro años, pudiendo ser reelegidos.»","dificultad":1},{"id":"TREBEP-L4-016","ley":"TREBEP","articulo":"48.k)","articulo_txt":"Art. 48.k) TREBEP","bloque_id":"TREBEP|Título III. Derechos y deberes. Código de conducta de los empleados públicos · Capítulo V. Derecho a la jornada de trabajo, permisos y vacaciones","enunciado":"Según el artículo 48.k) del TREBEP, ¿de cuántos días de permiso por asuntos particulares disponen los funcionarios públicos?","opciones":{"a":"Cuatro días al año.","b":"Seis días al año.","c":"Tres días al año.","d":"Cinco días al año."},"correcta":"b","explicacion":"El art. 48.k) concede permiso «Por asuntos particulares, seis días al año». Las cifras de las opciones a), c) y d) son inferiores a la que fija esa letra. Además, la disposición adicional decimotercera permite a las Administraciones Públicas establecer hasta dos días adicionales de permiso por asuntos particulares al cumplir el sexto trienio, incrementándose, como máximo, en un día adicional por cada trienio cumplido a partir del octavo.","cita":"«k) Por asuntos particulares, seis días al año.»","dificultad":1},{"id":"TREBEP-L4-030","ley":"TREBEP","articulo":"50.1","articulo_txt":"Art. 50.1 TREBEP","bloque_id":"TREBEP|Título III. Derechos y deberes. Código de conducta de los empleados públicos · Capítulo V. Derecho a la jornada de trabajo, permisos y vacaciones","enunciado":"Según el artículo 50.1 del TREBEP, los funcionarios públicos tendrán derecho a disfrutar, durante cada año natural, de unas vacaciones retribuidas de:","opciones":{"a":"Veintidós días naturales, o los días que correspondan proporcionalmente si el tiempo de servicio durante el año fue menor.","b":"Veinte días hábiles, o los días que correspondan proporcionalmente si el tiempo de servicio durante el año fue menor.","c":"Veintidós días hábiles en todo caso, cualquiera que haya sido el tiempo de servicio prestado durante el año.","d":"Veintidós días hábiles, o los días que correspondan proporcionalmente si el tiempo de servicio durante el año fue menor."},"correcta":"d","explicacion":"El art. 50.1 reconoce «unas vacaciones retribuidas de veintidós días hábiles, o de los días que correspondan proporcionalmente si el tiempo de servicio durante el año fue menor». La opción a) cambia los días hábiles por naturales, la opción b) altera la cifra y la opción c) suprime la regla de proporcionalidad. La disposición adicional decimocuarta permite a cada Administración Pública establecer hasta un máximo de cuatro días adicionales de vacaciones en función del tiempo de servicios prestados.","cita":"«1. Los funcionarios públicos tendrán derecho a disfrutar, durante cada año natural, de unas vacaciones retribuidas de veintidós días hábiles, o de los días que correspondan proporcionalmente si el tiempo de servicio durante el año fue menor.»","dificultad":1},{"id":"TREBEP-L4-036","ley":"TREBEP","articulo":"53.3","articulo_txt":"Art. 53.3 TREBEP","bloque_id":"TREBEP|Título III. Derechos y deberes. Código de conducta de los empleados públicos · Capítulo VI. Deberes de los empleados públicos. Código de Conducta","enunciado":"Según el artículo 53.3 del TREBEP, los empleados públicos ajustarán su actuación, con la Administración en la que presten sus servicios, con sus superiores, compañeros, subordinados y con los ciudadanos, a los principios de:","opciones":{"a":"Obediencia y disciplina.","b":"Solidaridad y compañerismo.","c":"Cortesía y reserva.","d":"Lealtad y buena fe."},"correcta":"d","explicacion":"El art. 53.3 dispone que «Ajustarán su actuación a los principios de lealtad y buena fe con la Administración en la que presten sus servicios, y con sus superiores, compañeros, subordinados y con los ciudadanos». Los pares de principios de las opciones a), b) y c) no son los que recoge ese apartado.","cita":"«3. Ajustarán su actuación a los principios de lealtad y buena fe con la Administración en la que presten sus servicios, y con sus superiores, compañeros, subordinados y con los ciudadanos.»","dificultad":1},{"id":"TREBEP-L4-043","ley":"TREBEP","articulo":"54.11","articulo_txt":"Art. 54.11 TREBEP","bloque_id":"TREBEP|Título III. Derechos y deberes. Código de conducta de los empleados públicos · Capítulo VI. Deberes de los empleados públicos. Código de Conducta","enunciado":"Según el artículo 54.11 del TREBEP, los empleados públicos garantizarán la atención al ciudadano:","opciones":{"a":"En castellano en todo caso, sin perjuicio de que se le facilite una traducción.","b":"En la lengua oficial que elija el empleado público que le atienda en cada caso.","c":"En la lengua que lo solicite, siempre que sea oficial en el territorio.","d":"En cualquier lengua oficial de la Unión Europea que el ciudadano solicite."},"correcta":"c","explicacion":"El art. 54.11 dispone que «Garantizarán la atención al ciudadano en la lengua que lo solicite siempre que sea oficial en el territorio». La opción a) impone el castellano, la opción b) deja la elección al empleado y la opción d) extiende el deber a lenguas que no son oficiales en el territorio.","cita":"«11. Garantizarán la atención al ciudadano en la lengua que lo solicite siempre que sea oficial en el territorio.»","dificultad":1},{"id":"TREBEP-L5-004","ley":"TREBEP","articulo":"56.1.c)","articulo_txt":"Art. 56.1.c) TREBEP","bloque_id":"TREBEP|Título IV. Adquisición y pérdida de la relación de servicio · Capítulo I. Acceso al empleo público y adquisición de la relación de servicio","enunciado":"Según el artículo 56.1.c) del TREBEP, ¿qué edad mínima se exige para poder participar en los procesos selectivos?","opciones":{"a":"Dieciocho años cumplidos.","b":"Dieciséis años cumplidos.","c":"Diecisiete años cumplidos.","d":"Quince años cumplidos."},"correcta":"b","explicacion":"El art. 56.1.c) exige «Tener cumplidos dieciséis años». Las opciones a), c) y d) cambian esa edad mínima, que el precepto fija en dieciséis años.","cita":"«c) Tener cumplidos dieciséis años y no exceder, en su caso, de la edad máxima de jubilación forzosa.»","dificultad":1},{"id":"TREBEP-L5-015","ley":"TREBEP","articulo":"59.1","articulo_txt":"Art. 59.1 TREBEP","bloque_id":"TREBEP|Título IV. Adquisición y pérdida de la relación de servicio · Capítulo I. Acceso al empleo público y adquisición de la relación de servicio","enunciado":"Según el artículo 59.1 del TREBEP, para cubrir las vacantes reservadas en las ofertas de empleo público, las personas con discapacidad deberán:","opciones":{"a":"Acreditar su discapacidad y la compatibilidad con las tareas, sin necesidad de superar las pruebas del proceso selectivo.","b":"Superar los procesos selectivos y acreditar su discapacidad mediante certificado expedido por la Administración convocante.","c":"Superar un curso selectivo específico y acreditar su discapacidad ante el tribunal, que valorará su capacidad funcional.","d":"Superar los procesos selectivos y acreditar su discapacidad y la compatibilidad con el desempeño de las tareas."},"correcta":"d","explicacion":"El art. 59.1 condiciona la reserva a que las personas con discapacidad «superen los procesos selectivos y acrediten su discapacidad y la compatibilidad con el desempeño de las tareas». La opción a) las exime del proceso selectivo; la opción b) omite la compatibilidad con las tareas y añade un certificado de la Administración convocante que el precepto no exige, y la opción c) sustituye el proceso selectivo por un curso específico.","cita":"«(…) siempre que superen los procesos selectivos y acrediten su discapacidad y la compatibilidad con el desempeño de las tareas (…)»","dificultad":2},{"id":"TREBEP-L5-033","ley":"TREBEP","articulo":"64.3","articulo_txt":"Art. 64.3 TREBEP","bloque_id":"TREBEP|Título IV. Adquisición y pérdida de la relación de servicio · Capítulo II. Pérdida de la relación de servicio","enunciado":"Según el artículo 64.3 del TREBEP, la renuncia a la condición de funcionario:","opciones":{"a":"No inhabilita para ingresar de nuevo en la Administración Pública a través del procedimiento de selección establecido.","b":"Inhabilita para ingresar de nuevo en la Administración Pública durante los dos años siguientes a su aceptación expresa.","c":"Permite reingresar sin proceso selectivo, mediante una solicitud de rehabilitación de la condición de funcionario.","d":"Impide definitivamente el ingreso en el mismo cuerpo o escala, aunque no en otros de la misma Administración Pública."},"correcta":"a","explicacion":"El art. 64.3 dispone que la renuncia «no inhabilita para ingresar de nuevo en la Administración Pública a través del procedimiento de selección establecido». Por eso fallan la inhabilitación temporal de la opción b) y el impedimento definitivo de la opción d); la opción c) tampoco es correcta, porque el reingreso exige el procedimiento de selección y la rehabilitación del art. 68 no contempla la renuncia entre sus supuestos.","cita":"«3. La renuncia a la condición de funcionario no inhabilita para ingresar de nuevo en la Administración Pública a través del procedimiento de selección establecido.»","dificultad":1},{"id":"TREBEP-L5-035","ley":"TREBEP","articulo":"66","articulo_txt":"Art. 66 TREBEP","bloque_id":"TREBEP|Título IV. Adquisición y pérdida de la relación de servicio · Capítulo II. Pérdida de la relación de servicio","enunciado":"Según el artículo 66 del TREBEP, ¿qué alcance tiene la pérdida de la condición de funcionario producida por la pena principal o accesoria de inhabilitación para cargo público?","opciones":{"a":"La absoluta la produce respecto de los empleos o cargos especificados en la sentencia, y la especial, respecto a todos los que tuviere.","b":"La absoluta la produce respecto a todos los empleos o cargos que tuviere, y la especial, respecto de los especificados en la sentencia.","c":"Ambas la producen respecto a todos los empleos o cargos que tuviere, pero solo la absoluta impide el reingreso en la Administración.","d":"La absoluta la produce respecto a todos los empleos o cargos que tuviere, y la especial solo suspende al funcionario durante la condena."},"correcta":"b","explicacion":"El art. 66 distingue: la inhabilitación absoluta produce la pérdida de la condición de funcionario «respecto a todos los empleos o cargos que tuviere», y la especial, «respecto de aquellos empleos o cargos especificados en la sentencia». La opción a) invierte ambos efectos; la opción c) atribuye a la especial el mismo alcance que a la absoluta, y la opción d) le da un efecto suspensivo que el precepto no recoge.","cita":"«La pena principal o accesoria de inhabilitación absoluta cuando hubiere adquirido firmeza la sentencia que la imponga produce la pérdida de la condición de funcionario respecto a todos los empleos o cargos que tuviere. La pena principal o accesoria de inhabilitación especial cuando hubiere adquirido firmeza la sentencia que la imponga produce la pérdida de la condición de funcionario respecto de aquellos empleos o cargos especificados en la sentencia.»","dificultad":2},{"id":"TREBEP-L6-003","ley":"TREBEP","articulo":"70.1","articulo_txt":"Art. 70.1 TREBEP","bloque_id":"TREBEP|Título V. Ordenación de la actividad profesional · Capítulo I. Planificación de recursos humanos","enunciado":"Según el artículo 70.1 del TREBEP, la ejecución de la Oferta de empleo público o instrumento similar deberá desarrollarse dentro del plazo:","opciones":{"a":"Improrrogable de dos años.","b":"Máximo de dos años, prorrogable por uno más.","c":"Máximo de tres años, prorrogable por acuerdo del órgano de Gobierno.","d":"Improrrogable de tres años."},"correcta":"d","explicacion":"El art. 70.1 dispone que «la ejecución de la oferta de empleo público o instrumento similar deberá desarrollarse dentro del plazo improrrogable de tres años». La opción a) acorta el plazo; las opciones b) y c) admiten una prórroga que la ley excluye expresamente.","cita":"«En todo caso, la ejecución de la oferta de empleo público o instrumento similar deberá desarrollarse dentro del plazo improrrogable de tres años.»","dificultad":1},{"id":"TREBEP-L6-006","ley":"TREBEP","articulo":"70.3","articulo_txt":"Art. 70.3 TREBEP","bloque_id":"TREBEP|Título V. Ordenación de la actividad profesional · Capítulo I. Planificación de recursos humanos","enunciado":"Según el artículo 70.3 del TREBEP, ¿qué podrá contener la Oferta de empleo público o instrumento similar?","opciones":{"a":"Las bases completas de los procesos selectivos de las plazas que incluya.","b":"La relación nominal del personal interino que ocupe las plazas ofertadas.","c":"Medidas derivadas de la planificación de recursos humanos.","d":"La adjudicación provisional de destinos a los aspirantes que superen los procesos."},"correcta":"c","explicacion":"El art. 70.3 dispone que la Oferta de empleo público o instrumento similar «podrá contener medidas derivadas de la planificación de recursos humanos». Los contenidos de las opciones a), b) y d) no figuran en el art. 70.","cita":"«3. La Oferta de empleo público o instrumento similar podrá contener medidas derivadas de la planificación de recursos humanos.»","dificultad":1},{"id":"TREBEP-L6-014","ley":"TREBEP","articulo":"74","articulo_txt":"Art. 74 TREBEP","bloque_id":"TREBEP|Título V. Ordenación de la actividad profesional · Capítulo II. Estructuración del empleo público","enunciado":"Según el artículo 74 del TREBEP, ¿cuál de los siguientes contenidos NO figura entre los que, como mínimo, deben comprender los instrumentos de ordenación de los puestos de trabajo?","opciones":{"a":"La denominación de los puestos.","b":"Los sistemas de provisión.","c":"Las retribuciones complementarias.","d":"Las retribuciones básicas."},"correcta":"d","explicacion":"El art. 74 exige que esos instrumentos comprendan, al menos, «la denominación de los puestos, los grupos de clasificación profesional, los cuerpos o escalas, en su caso, a que estén adscritos, los sistemas de provisión y las retribuciones complementarias». Las retribuciones básicas no figuran en esa enumeración, mientras que las opciones a), b) y c) sí.","cita":"«(…) que comprenderán, al menos, la denominación de los puestos, los grupos de clasificación profesional, los cuerpos o escalas, en su caso, a que estén adscritos, los sistemas de provisión y las retribuciones complementarias.»","dificultad":2},{"id":"TREBEP-L6-017","ley":"TREBEP","articulo":"75.2","articulo_txt":"Art. 75.2 TREBEP","bloque_id":"TREBEP|Título V. Ordenación de la actividad profesional · Capítulo II. Estructuración del empleo público","enunciado":"Según el artículo 75.2 del TREBEP, los cuerpos y escalas de funcionarios se crean, modifican y suprimen:","opciones":{"a":"Por reglamento aprobado por el Gobierno de la Nación o por el Consejo de Gobierno de cada comunidad autónoma.","b":"Por ley orgánica de las Cortes Generales, cualquiera que sea la Administración a la que pertenezcan.","c":"Por ley de las Cortes Generales o de las asambleas legislativas de las comunidades autónomas.","d":"Por orden del ministro competente en materia de función pública, previa negociación colectiva."},"correcta":"c","explicacion":"El art. 75.2 exige ley: los cuerpos y escalas «se crean, modifican y suprimen por ley de las Cortes Generales o de las asambleas legislativas de las comunidades autónomas». La opción a) remite a normas reglamentarias, la opción b) exige ley orgánica y la opción d) una orden ministerial. Para los funcionarios propios de Ceuta y Melilla, la DA 3ª.2.a) atribuye a sus Asambleas «El establecimiento, modificación y supresión de Escalas, Subescalas y clases de funcionarios, y la clasificación de los mismos».","cita":"«2. Los cuerpos y escalas de funcionarios se crean, modifican y suprimen por ley de las Cortes Generales o de las asambleas legislativas de las comunidades autónomas.»","dificultad":2},{"id":"TREBEP-L6-040","ley":"TREBEP","articulo":"82.1","articulo_txt":"Art. 82.1 TREBEP","bloque_id":"TREBEP|Título V. Ordenación de la actividad profesional · Capítulo III. Provisión de puestos de trabajo y movilidad","enunciado":"Según el artículo 82.1 del TREBEP, el traslado de las funcionarias víctimas de violencia de género o de violencia sexual a otro puesto de trabajo tendrá la consideración de:","opciones":{"a":"Traslado voluntario.","b":"Traslado forzoso.","c":"Adscripción provisional.","d":"Comisión de servicios voluntaria."},"correcta":"b","explicacion":"El art. 82.1 dispone expresamente: «Este traslado tendrá la consideración de traslado forzoso». Las calificaciones de las opciones a), c) y d) no son las del precepto. El art. 82.1 está modificado por la Ley Orgánica 10/2022, de 6 de septiembre (que modificó también la rúbrica), por la Ley 4/2023, de 28 de febrero, y por la Ley Orgánica 2/2024, de 1 de agosto; la pregunta se basa en la redacción vigente.","cita":"«Este traslado tendrá la consideración de traslado forzoso.»","dificultad":1},{"id":"TREBEP-L6-046","ley":"TREBEP","articulo":"84.3","articulo_txt":"Art. 84.3 TREBEP","bloque_id":"TREBEP|Título V. Ordenación de la actividad profesional · Capítulo III. Provisión de puestos de trabajo y movilidad","enunciado":"Según el artículo 84.3 del TREBEP, en el supuesto de cese del puesto obtenido por libre designación en otra Administración, la Administración de destino podrá acordar la adscripción del funcionario a otro puesto o comunicarle que no va a hacer efectiva dicha adscripción en el plazo máximo de:","opciones":{"a":"Quince días hábiles desde la notificación del cese.","b":"Tres meses a contar desde la fecha en que se produzca el cese.","c":"Dos meses a contar desde el día siguiente al del cese.","d":"Un mes a contar desde el día siguiente al del cese."},"correcta":"d","explicacion":"El art. 84.3 fija el «plazo máximo de un mes a contar desde el día siguiente al del cese», durante el cual el funcionario continúa a todos los efectos en servicio activo en la Administración de destino. Los plazos de las opciones a), b) y c) no son los del precepto.","cita":"«En el supuesto de cese del puesto obtenido por libre designación, la Administración de destino, en el plazo máximo de un mes a contar desde el día siguiente al del cese, podrá acordar la adscripción del funcionario a otro puesto de la misma o le comunicará que no va a hacer efectiva dicha adscripción.»","dificultad":2},{"id":"TREBEP-L7-002","ley":"TREBEP","articulo":"85.2","articulo_txt":"Art. 85.2 TREBEP","bloque_id":"TREBEP|Título VI. Situaciones administrativas","enunciado":"Según el artículo 85.2 del TREBEP, ¿qué normas podrán regular otras situaciones administrativas de los funcionarios de carrera, además de las previstas en el propio Estatuto?","opciones":{"a":"Las resoluciones del órgano competente en materia de personal de cada Administración Pública.","b":"Los convenios colectivos y los acuerdos de la Mesa General de Negociación de cada Administración.","c":"Exclusivamente los reales decretos del Gobierno de la Nación, previo informe de las comunidades autónomas.","d":"Las leyes de Función Pública que se dicten en desarrollo del Estatuto."},"correcta":"d","explicacion":"El art. 85.2 atribuye esa posibilidad a «Las leyes de Función Pública que se dicten en desarrollo de este Estatuto», en los supuestos, condiciones y efectos que en ellas se determinen. El precepto no la atribuye a resoluciones administrativas, como dice la opción a), ni a convenios o acuerdos de negociación, como dice la opción b), ni en exclusiva al Gobierno, como dice la opción c).","cita":"«2. Las leyes de Función Pública que se dicten en desarrollo de este Estatuto podrán regular otras situaciones administrativas de los funcionarios de carrera, en los supuestos, en las condiciones y con los efectos que en las mismas se determinen (…)»","dificultad":1},{"id":"TREBEP-L7-004","ley":"TREBEP","articulo":"87.1.b)","articulo_txt":"Art. 87.1.b) TREBEP","bloque_id":"TREBEP|Título VI. Situaciones administrativas","enunciado":"Según el artículo 87.1.b) del TREBEP, los funcionarios de carrera autorizados para realizar una misión en organismos internacionales, gobiernos o entidades públicas extranjeras o en programas de cooperación internacional serán declarados en servicios especiales cuando la misión sea por periodo determinado:","opciones":{"a":"Superior a tres meses.","b":"Superior a un año.","c":"De cualquier duración, siempre que esté autorizada.","d":"Superior a seis meses."},"correcta":"d","explicacion":"El art. 87.1.b) exige una misión «por periodo determinado superior a seis meses». Las opciones a) y b) alteran la cifra, y la opción c) suprime el requisito de duración.","cita":"«b) Cuando sean autorizados para realizar una misión por periodo determinado superior a seis meses en organismos internacionales, gobiernos o entidades públicas extranjeras o en programas de cooperación internacional.»","dificultad":2},{"id":"TREBEP-L7-037","ley":"TREBEP","articulo":"97.1","articulo_txt":"Art. 97.1 TREBEP","bloque_id":"TREBEP|Título VII. Régimen disciplinario","enunciado":"Según el artículo 97.1 del TREBEP, ¿en qué plazo prescriben las faltas leves?","opciones":{"a":"A los cuatro meses.","b":"A los ocho meses.","c":"A los seis meses.","d":"A los nueve meses."},"correcta":"c","explicacion":"El art. 97.1 dispone que las infracciones «leves a los seis meses». Las cifras de las opciones a), b) y d) no figuran en el precepto.","cita":"«1. Las infracciones muy graves prescribirán a los tres años, las graves a los dos años y las leves a los seis meses (…)»","dificultad":2},{"id":"TREBEP-L7-041","ley":"TREBEP","articulo":"98.1","articulo_txt":"Art. 98.1 TREBEP","bloque_id":"TREBEP|Título VII. Régimen disciplinario","enunciado":"Según el artículo 98.1 del TREBEP, la imposición de sanciones por faltas leves se llevará a cabo:","opciones":{"a":"Sin necesidad de procedimiento alguno ni de audiencia al interesado, por tratarse de faltas leves.","b":"Mediante el mismo procedimiento previamente establecido para las faltas muy graves y graves.","c":"Por procedimiento sumario con audiencia al interesado.","d":"Por procedimiento sumario, sin trámite de audiencia al interesado."},"correcta":"c","explicacion":"El art. 98.1 dispone que «La imposición de sanciones por faltas leves se llevará a cabo por procedimiento sumario con audiencia al interesado». La opción a) y la opción d) suprimen la audiencia, y la opción b) aplica el procedimiento previsto para las faltas muy graves y graves.","cita":"«La imposición de sanciones por faltas leves se llevará a cabo por procedimiento sumario con audiencia al interesado.»","dificultad":1},{"id":"TREBEP-L7-046","ley":"TREBEP","articulo":"100.2","articulo_txt":"Art. 100.2 TREBEP","bloque_id":"TREBEP|Título VIII. Cooperación entre las Administraciones Públicas","enunciado":"Según el artículo 100.2 del TREBEP, la Comisión de Coordinación del Empleo Público se crea como:","opciones":{"a":"Órgano colegiado de negociación adscrito a la Mesa General de Negociación de las Administraciones Públicas.","b":"Órgano técnico y de trabajo dependiente de la Conferencia Sectorial de Administración Pública.","c":"Órgano consultivo independiente, adscrito al Ministerio competente en materia de función pública.","d":"Órgano de cooperación que sustituye a la Conferencia Sectorial de Administración Pública."},"correcta":"b","explicacion":"El art. 100.2 crea la Comisión «como órgano técnico y de trabajo dependiente de la Conferencia Sectorial de Administración Pública». Las opciones a) y c) le atribuyen otra naturaleza y adscripción, y la opción d) es falsa porque la Comisión depende de la Conferencia Sectorial, que el art. 100.1 mantiene como órgano de cooperación.","cita":"«2. Se crea la Comisión de Coordinación del Empleo Público como órgano técnico y de trabajo dependiente de la Conferencia Sectorial de Administración Pública.»","dificultad":2},{"id":"TREBEP-L7-047","ley":"TREBEP","articulo":"100.3","articulo_txt":"Art. 100.3 TREBEP","bloque_id":"TREBEP|Título VIII. Cooperación entre las Administraciones Públicas","enunciado":"Según el artículo 100.3 del TREBEP, ¿quién designa a los representantes de la Administración Local en la Comisión de Coordinación del Empleo Público?","opciones":{"a":"La Federación Española de Municipios y Provincias.","b":"Las diputaciones provinciales, cabildos y consejos insulares, por turno rotatorio.","c":"El Ministerio competente en materia de Administración Local, a propuesta de los municipios.","d":"La Conferencia Sectorial de Administración Pública, a propuesta de las comunidades autónomas."},"correcta":"a","explicacion":"El art. 100.3 se refiere a «los representantes de la Administración Local designados por la Federación Española de Municipios y Provincias, como asociación de entidades locales de ámbito estatal con mayor implantación». Los órganos de las opciones b), c) y d) no tienen atribuida esa designación.","cita":"«3. Componen la Comisión de Coordinación del Empleo Público los titulares de aquellos órganos directivos de la política de recursos humanos de la Administración General del Estado, de las Administraciones de las comunidades autónomas y de las ciudades de Ceuta y Melilla, y los representantes de la Administración Local designados por la Federación Española de Municipios y Provincias, como asociación de entidades locales de ámbito estatal con mayor implantación (…)»","dificultad":1},{"id":"TREBEP-L8-005","ley":"TREBEP","articulo":"DA 4ª","articulo_txt":"DA 4ª · TREBEP","bloque_id":"TREBEP|Disposiciones adicionales","enunciado":"Según la disposición adicional cuarta del TREBEP, lo establecido en el Estatuto se aplicará a las autoridades administrativas independientes del ámbito estatal:","opciones":{"a":"En la forma prevista en sus leyes de creación.","b":"Íntegramente y en los mismos términos que al personal de la Administración General del Estado.","c":"Solo con carácter supletorio de sus estatutos orgánicos aprobados por real decreto.","d":"En la forma que determine el Consejo de Ministros, a propuesta del ministerio de adscripción."},"correcta":"a","explicacion":"La DA 4ª aplica el Estatuto a las autoridades administrativas independientes del ámbito estatal, entidades de derecho público reguladas en los arts. 109 y 110 de la Ley 40/2015, de 1 de octubre, «en la forma prevista en sus leyes de creación». No prevé la aplicación íntegra de la opción b), ni la supletoria de la opción c), ni una determinación por el Consejo de Ministros como dice la opción d).","cita":"«Lo establecido en el presente Estatuto se aplicará a las autoridades administrativas independientes del ámbito estatal, Entidades de Derecho Público reguladas en los artículos 109 y 110 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público, en la forma prevista en sus leyes de creación.»","dificultad":1},{"id":"TREBEP-L8-008","ley":"TREBEP","articulo":"DA 7ª.2","articulo_txt":"DA 7ª.2 · TREBEP","bloque_id":"TREBEP|Disposiciones adicionales","enunciado":"Según la disposición adicional séptima del TREBEP, ¿cuándo aprobarán las Administraciones Públicas un Plan para la Igualdad entre mujeres y hombres para sus respectivos ámbitos?","opciones":{"a":"Al final de cada legislatura.","b":"Al inicio de cada ejercicio presupuestario.","c":"Tras cada renovación de los órganos de representación del personal.","d":"Al inicio de cada legislatura."},"correcta":"d","explicacion":"La DA 7ª.2 dispone que las Administraciones Públicas aprobarán el Plan «al inicio de cada legislatura». La opción a) lo sitúa al final, la opción b) lo vincula al ejercicio presupuestario y la opción c) a la renovación de los órganos de representación, nada de lo cual prevé la disposición. La DA 7ª fue modificada por la disposición final 24.3 de la Ley 31/2022, de 23 de diciembre.","cita":"«2. Sin perjuicio de lo dispuesto en el apartado anterior, las Administraciones Públicas aprobarán, al inicio de cada legislatura, un Plan para la Igualdad entre mujeres y hombres para sus respectivos ámbitos, a desarrollar en el convenio colectivo o acuerdo de condiciones de trabajo del personal funcionario que sea aplicable, en los términos previstos en el mismo.»","dificultad":1},{"id":"TREBEP-L8-029","ley":"TREBEP","articulo":"DT 2ª","articulo_txt":"DT 2ª · TREBEP","bloque_id":"TREBEP|Disposiciones transitorias","enunciado":"Según la disposición transitoria segunda del TREBEP, el personal laboral fijo que, en los términos de esa disposición, desempeñe funciones de personal funcionario podrá participar en los procesos selectivos de promoción interna convocados por el sistema de:","opciones":{"a":"Concurso-oposición, de forma independiente o conjunta con los procesos selectivos de libre concurrencia.","b":"Concurso de valoración de méritos, de forma independiente de los procesos selectivos de libre concurrencia.","c":"Oposición, exclusivamente de forma conjunta con los procesos selectivos de libre concurrencia.","d":"Concurso-oposición, únicamente de forma independiente de los procesos selectivos de libre concurrencia."},"correcta":"a","explicacion":"La DT 2ª permite a este personal participar en los procesos de promoción interna «convocados por el sistema de concurso-oposición, de forma independiente o conjunta con los procesos selectivos de libre concurrencia», en los Cuerpos y Escalas a los que figuren adscritos sus funciones o puestos. Las opciones b) y c) cambian el sistema selectivo, y la opción d) excluye la convocatoria conjunta. Según la nota del BOE, la DT 2ª está redactada conforme a la corrección de errores publicada en el BOE núm. 278, de 20 de noviembre de 2015.","cita":"«Asimismo, podrá participar en los procesos selectivos de promoción interna convocados por el sistema de concurso-oposición, de forma independiente o conjunta con los procesos selectivos de libre concurrencia, en aquellos Cuerpos y Escalas a los que figuren adscritos las funciones o los puestos que desempeñe, siempre que posea la titulación necesaria y reúna los restantes requisitos exigidos, valorándose a estos efectos como mérito los servicios efectivos prestados como personal laboral fijo y las pruebas selectivas superadas para acceder a esta condición.»","dificultad":2},{"id":"TREBEP-L8-033","ley":"TREBEP","articulo":"DT 5ª","articulo_txt":"DT 5ª · TREBEP","bloque_id":"TREBEP|Disposiciones transitorias","enunciado":"Según la disposición transitoria quinta del TREBEP, ¿hasta cuándo se mantienen con carácter de normativa básica los artículos de la Ley 9/1987, de 12 de junio, que esa disposición enumera?","opciones":{"a":"Hasta la entrada en vigor de las leyes de Función Pública que se dicten en desarrollo del Estatuto.","b":"Hasta que la Mesa General de Negociación de las Administraciones Públicas acuerde su sustitución.","c":"En tanto se determine el procedimiento electoral general previsto en el artículo 39 del Estatuto.","d":"Hasta la celebración de las primeras elecciones a órganos de representación tras la entrada en vigor del Estatuto."},"correcta":"c","explicacion":"La DT 5ª mantiene esos artículos como normativa básica «En tanto se determine el procedimiento electoral general previsto en el artículo 39 del presente Estatuto». No vincula su vigencia a las leyes de Función Pública de desarrollo como la opción a), a un acuerdo de la Mesa General como la opción b) ni a la celebración de unas elecciones como la opción d).","cita":"«En tanto se determine el procedimiento electoral general previsto en el artículo 39 del presente Estatuto, se mantendrán con carácter de normativa básica los siguientes artículos de la Ley 9/1987, de 12 de junio, de órganos de representación, determinación de las condiciones de trabajo y participación del personal al servicio de las Administraciones Públicas: 13.2, 13.3, 13.4, 13.5, 13.6, 15, 16, 17, 18, 19, 20, 21, 25, 26, 27, 28 y 29.»","dificultad":2},{"id":"TREBEP-L8-035","ley":"TREBEP","articulo":"DD única.d)","articulo_txt":"DD única.d) · TREBEP","bloque_id":"TREBEP|Disposición derogatoria","enunciado":"Según la disposición derogatoria única del TREBEP, ¿qué queda derogado de la Ley 7/1985, de 2 de abril, reguladora de las bases del Régimen Local?","opciones":{"a":"El título VII en su integridad.","b":"El capítulo III del título VII.","c":"El capítulo II del título VII.","d":"Los capítulos I y II del título VII."},"correcta":"b","explicacion":"La letra d) de la DD única deroga, de la Ley 7/1985, «el capítulo III del título VII», con el alcance establecido en el apartado 2 de la DF 4ª; la letra e) deroga el mismo capítulo y título del Real Decreto Legislativo 781/1986. No se deroga el título VII completo como dice la opción a), ni los capítulos que mencionan las opciones c) y d).","cita":"«d) De la Ley 7/1985, de 2 de abril, reguladora de las bases del Régimen Local, el capítulo III del título VII.»","dificultad":3},{"id":"TREBEP-L8-036","ley":"TREBEP","articulo":"DF 1ª","articulo_txt":"DF 1ª · TREBEP","bloque_id":"TREBEP|Disposiciones finales","enunciado":"Según la disposición final primera del TREBEP, por lo que se refiere a la legislación laboral, las disposiciones del Estatuto se dictan al amparo del artículo:","opciones":{"a":"149.1.18.ª de la Constitución.","b":"149.1.13.ª de la Constitución.","c":"149.1.7.ª de la Constitución.","d":"149.1.17.ª de la Constitución."},"correcta":"c","explicacion":"La DF 1ª invoca el art. 149.1.7.ª de la Constitución «por lo que se refiere a la legislación laboral». El art. 149.1.18.ª de la opción a) ampara las bases del régimen estatutario de los funcionarios y el art. 149.1.13.ª de la opción b), las bases y coordinación de la planificación general de la actividad económica; el art. 149.1.17.ª de la opción d) no se cita.","cita":"«Las disposiciones de este Estatuto se dictan al amparo del artículo 149.1.18.ª de la Constitución, constituyendo aquellas bases del régimen estatutario de los funcionarios; al amparo del artículo 149.1.7.ª de la Constitución, por lo que se refiere a la legislación laboral, y al amparo del artículo 149.1.13.ª de la Constitución, bases y coordinación de la planificación general de la actividad económica.»","dificultad":2}]};</script>
<script>
/* Letra de Ley — motor de test. Sin dependencias; funciona sin conexión.
   Necesita window.LDL_CONFIG y window.LDL_BANCO (los inyecta sistema/letradeley.py). */
(function () {
  "use strict";
  var CFG = window.LDL_CONFIG, B = window.LDL_BANCO;
  var raiz = document.getElementById("ldl");
  var LETRAS = ["a", "b", "c", "d"];
  var POR_ID = {};
  B.preguntas.forEach(function (p) { POR_ID[p.id] = p; });
  var CLAVE = "ldl1:" + CFG.pack.id;
  var prog = cargar();
  var sesion = null;
  var vista = CFG.modo === "web" ? "portada" : "inicio";
  var reloj = null;

  /* ---------- utilidades ---------- */
  function esc(t) {
    return String(t == null ? "" : t).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function barajar(lista) {
    var a = lista.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function pct(a, b) { return b ? Math.round((a / b) * 100) : 0; }
  function plural(n, uno, varios) { return n + " " + (n === 1 ? uno : varios); }
  function num(n) { return String(n).replace(".", ","); }
  function cargar() {
    try { var s = localStorage.getItem(CLAVE); if (s) { var d = JSON.parse(s); if (d && d.p) return d; } } catch (e) {}
    return { p: {}, h: [] };
  }
  function guardar() { try { localStorage.setItem(CLAVE, JSON.stringify(prog)); } catch (e) {} }
  function registrar(id, acierto) {
    var r = prog.p[id] || { v: 0, a: 0, f: 0, c: 0 };
    r.v++;
    if (acierto) { r.a++; r.c = Math.min((r.c || 0) + 1, 5); } else { r.f++; r.c = 0; }
    r.u = acierto ? 1 : 0;
    r.t = Date.now();
    prog.p[id] = r;
    guardar();
  }
  function fallosPendientes() {
    return B.preguntas.filter(function (p) { var r = prog.p[p.id]; return r && r.u === 0; });
  }
  function resumen(lista) {
    var vistas = 0, aciertos = 0, intentos = 0;
    lista.forEach(function (p) {
      var r = prog.p[p.id];
      if (r) { vistas++; aciertos += r.a; intentos += r.v; }
    });
    return { total: lista.length, vistas: vistas, acierto: pct(aciertos, intentos) };
  }
  function delBloque(id) { return B.preguntas.filter(function (p) { return p.bloque_id === id; }); }

  /* ---------- tema claro / oscuro ---------- */
  function aplicarTema() {
    var t = null;
    try { t = localStorage.getItem("ldl:tema"); } catch (e) {}
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    else document.documentElement.removeAttribute("data-theme");
    return t || "auto";
  }
  function cambiarTema() {
    var orden = { auto: "light", light: "dark", dark: "auto" };
    var actual = aplicarTema();
    try { localStorage.setItem("ldl:tema", orden[actual]); } catch (e) {}
    aplicarTema();
    pintar();
  }

  /* ---------- sesiones ---------- */
  function empezar(tipo, preguntas, opciones) {
    opciones = opciones || {};
    if (!preguntas.length) return;
    pararReloj();
    sesion = {
      tipo: tipo, titulo: opciones.titulo || "Test", ids: preguntas.map(function (p) { return p.id; }),
      i: 0, resp: {}, corregida: {}, inicio: Date.now(), limite: opciones.minutos ? opciones.minutos * 60 : 0, fin: null,
      origen: vista === "test" || vista === "resultado" ? (sesion && sesion.origen) || "inicio" : vista
    };
    vista = "test";
    if (sesion.limite) reloj = setInterval(tic, 1000);
    pintar();
    window.scrollTo(0, 0);
  }
  function tic() {
    if (!sesion || sesion.fin) return pararReloj();
    var el = document.getElementById("ldl-crono");
    var resta = sesion.limite - Math.floor((Date.now() - sesion.inicio) / 1000);
    if (resta <= 0) { terminar(); return; }
    if (el) el.textContent = mmss(resta);
  }
  function pararReloj() { if (reloj) { clearInterval(reloj); reloj = null; } }
  function mmss(s) { var m = Math.floor(s / 60), r = s % 60; return m + ":" + (r < 10 ? "0" : "") + r; }

  function responder(letra) {
    var id = sesion.ids[sesion.i];
    if (sesion.tipo === "simulacro") {
      sesion.resp[id] = sesion.resp[id] === letra ? undefined : letra;
      pintar();
      return;
    }
    if (sesion.corregida[id]) return;
    sesion.resp[id] = letra;
    sesion.corregida[id] = true;
    registrar(id, letra === POR_ID[id].correcta);
    pintar();
  }
  function siguiente() {
    if (sesion.i < sesion.ids.length - 1) { sesion.i++; pintar(); window.scrollTo(0, 0); }
    else terminar();
  }
  function anterior() { if (sesion.i > 0) { sesion.i--; pintar(); } }
  function terminar() {
    pararReloj();
    if (sesion.tipo === "simulacro") {
      sesion.ids.forEach(function (id) {
        if (sesion.resp[id]) registrar(id, sesion.resp[id] === POR_ID[id].correcta);
      });
    }
    sesion.fin = Date.now();
    var r = calcular(sesion);
    prog.h.unshift({ t: sesion.fin, tipo: sesion.tipo, n: r.total, a: r.aciertos, e: r.errores, nota: r.nota });
    prog.h = prog.h.slice(0, 50);
    guardar();
    vista = "resultado";
    pintar();
    window.scrollTo(0, 0);
  }
  function calcular(s) {
    var a = 0, e = 0, nr = 0;
    s.ids.forEach(function (id) {
      var r = s.resp[id];
      if (!r) nr++; else if (r === POR_ID[id].correcta) a++; else e++;
    });
    var pen = (CFG.simulacro && CFG.simulacro.penalizacion) || 1 / 3;
    var neta = s.tipo === "simulacro" ? a - e * pen : a;
    var nota = Math.max(0, (neta / s.ids.length) * 10);
    return { total: s.ids.length, aciertos: a, errores: e, blancos: nr, neta: neta, nota: Math.round(nota * 100) / 100 };
  }

  /* ---------- vistas ---------- */
  function cabecera() {
    var tema = aplicarTema();
    var etiquetas = { auto: "Tema: auto", light: "Tema: claro", dark: "Tema: oscuro" };
    return '<header class="ldl-top"><a class="ldl-brand" href="' + esc(CFG.web || "#") + '">' +
      '<span class="ldl-logo" aria-hidden="true">§</span><span><b>Letra de Ley</b><small>' +
      esc(CFG.pack.nombre) + "</small></span></a>" +
      '<button class="ldl-tema" data-acc="tema" type="button">' + etiquetas[tema] + "</button></header>";
  }
  function navegacion() {
    if (CFG.modo === "web") return "";
    var items = [["inicio", "Inicio"], ["temas", "Por temas"], ["simulacro", "Simulacro"], ["fallos", "Fallos"], ["stats", "Estadísticas"]];
    return '<nav class="ldl-nav" aria-label="Secciones">' + items.map(function (it) {
      var actual = vista === it[0] || (vista === "test" && sesion && sesion.origen === it[0]);
      return '<button type="button" data-acc="ir" data-v="' + it[0] + '"' + (actual ? ' aria-current="page"' : "") + ">" + it[1] + "</button>";
    }).join("") + "</nav>";
  }
  function pie() {
    return '<p class="ldl-pie">Letra de Ley · ' + esc(CFG.pack.edicion) + " · Texto legal actualizado a " +
      esc(CFG.pack.actualizado) + "<br>Uso personal. Prohibida su redistribución.</p>";
  }

  function vInicio() {
    var r = resumen(B.preguntas), f = fallosPendientes().length;
    return '<section class="ldl-card"><h2>' + esc(CFG.pack.nombre) + "</h2>" +
      '<p class="ldl-muted">' + B.preguntas.length + " preguntas comentadas, con el artículo exacto de cada respuesta.</p>" +
      '<div class="ldl-kpis"><div class="ldl-kpi"><b>' + r.vistas + "/" + r.total + "</b><span>respondidas</span></div>" +
      '<div class="ldl-kpi"><b>' + r.acierto + ' %</b><span>de acierto</span></div>' +
      '<div class="ldl-kpi"><b>' + f + "</b><span>fallos por repasar</span></div></div>" +
      '<div class="ldl-acciones"><button class="ldl-btn" data-acc="rapido" type="button">Test rápido de 20</button>' +
      '<button class="ldl-btn sec" data-acc="ir" data-v="simulacro" type="button">Simulacro de examen</button>' +
      (f ? '<button class="ldl-btn sec" data-acc="repasar" type="button">Repasar ' + f + " fallos</button>" : "") +
      "</div></section>" +
      '<section class="ldl-card"><h3>Cómo sacarle partido</h3><ol class="ldl-muted">' +
      "<li>Practica <b>por temas</b>: cada respuesta te enseña el artículo y por qué fallan las demás opciones.</li>" +
      "<li>Cada pocos días, <b>repasa tus fallos</b>: es donde más se aprende.</li>" +
      "<li>Antes del examen, haz <b>simulacros</b> con tiempo y con la penalización real (cada error resta 1/3).</li></ol>" +
      '<p class="ldl-small ldl-muted">Tu progreso se guarda en este dispositivo y en este navegador.</p></section>' + historial();
  }
  function historial() {
    if (!prog.h.length) return "";
    return '<section class="ldl-card"><h3>Últimos tests</h3><ul class="ldl-revision">' + prog.h.slice(0, 5).map(function (h) {
      var d = new Date(h.t);
      return "<li><b>" + (h.tipo === "simulacro" ? "Simulacro" : "Práctica") + "</b> · " + d.toLocaleDateString("es-ES") +
        " · " + h.a + "/" + h.n + " aciertos" + (h.tipo === "simulacro" ? " · nota " + num(h.nota) : "") + "</li>";
    }).join("") + "</ul></section>";
  }
  function vTemas() {
    var html = '<section class="ldl-card"><h2>Practicar por temas</h2><p class="ldl-muted">Elige un bloque. Las preguntas salen en orden aleatorio y se corrigen al momento.</p><ul class="ldl-bloques">';
    B.bloques.forEach(function (b) {
      var lista = delBloque(b.id), r = resumen(lista);
      html += '<li><button type="button" data-acc="bloque" data-id="' + esc(b.id) + '"><span class="t">' + esc(b.nombre) +
        '</span><span class="n">' + r.vistas + "/" + r.total + (r.vistas ? " · " + r.acierto + " %" : "") + "</span>" +
        '<span class="ldl-barra"><i style="width:' + pct(r.vistas, r.total) + '%"></i></span></button></li>';
    });
    return html + "</ul></section>";
  }
  function vSimulacro() {
    var total = B.preguntas.length;
    var opcionesN = [10, 20, 30, 50, 100].filter(function (n) { return n < total; });
    opcionesN.push(total);
    var porDefecto = Math.min((CFG.simulacro && CFG.simulacro.preguntas) || 30, total);
    return '<section class="ldl-card"><h2>Simulacro de examen</h2>' +
      '<p class="ldl-muted">Como el día del examen: no ves las soluciones hasta el final y cada error resta un tercio de acierto.</p>' +
      '<div class="ldl-campo"><label for="ldl-n">Número de preguntas</label><select id="ldl-n">' +
      opcionesN.map(function (n) { return "<option" + (n === porDefecto ? " selected" : "") + ">" + n + "</option>"; }).join("") +
      '</select></div><div class="ldl-campo"><label for="ldl-t">Tiempo</label><select id="ldl-t">' +
      '<option value="1">1 minuto por pregunta</option><option value="0">Sin límite de tiempo</option></select></div>' +
      '<div class="ldl-campo"><label for="ldl-b">Temas</label><select id="ldl-b"><option value="">Todos</option>' +
      B.bloques.map(function (b) { return '<option value="' + esc(b.id) + '">' + esc(b.nombre) + "</option>"; }).join("") +
      '</select></div><div class="ldl-acciones"><button class="ldl-btn" data-acc="simular" type="button">Empezar simulacro</button></div></section>';
  }
  function vFallos() {
    var f = fallosPendientes();
    if (!f.length) {
      return '<section class="ldl-card"><h2>Repaso de fallos</h2><p class="ldl-muted">No tienes fallos pendientes. Cuando falles una pregunta aparecerá aquí hasta que la aciertes.</p></section>';
    }
    return '<section class="ldl-card"><h2>Repaso de fallos</h2><p class="ldl-muted">Tienes <b>' + f.length +
      "</b> preguntas falladas. Salen de aquí en cuanto las aciertas.</p>" +
      '<div class="ldl-acciones"><button class="ldl-btn" data-acc="repasar" type="button">Repasar ahora</button></div></section>';
  }
  function vStats() {
    var html = '<section class="ldl-card"><h2>Estadísticas</h2><ul class="ldl-bloques">';
    B.bloques.forEach(function (b) {
      var r = resumen(delBloque(b.id));
      html += '<li><button type="button" data-acc="bloque" data-id="' + esc(b.id) + '"><span class="t">' + esc(b.nombre) +
        '</span><span class="n">' + (r.vistas ? r.acierto + " % de acierto" : "sin empezar") + '</span><span class="ldl-barra"><i style="width:' +
        r.acierto + '%"></i></span></button></li>';
    });
    html += '</ul></section><section class="ldl-card"><h3>Empezar de cero</h3><p class="ldl-muted ldl-small">Borra tu progreso guardado en este dispositivo.</p>' +
      '<div class="ldl-acciones"><button class="ldl-btn sec" data-acc="borrar" type="button">Borrar mi progreso</button></div></section>';
    return html;
  }
  function vPortada() {
    var n = B.preguntas.length;
    return '<section class="ldl-card"><h2>' + esc(CFG.pack.nombre) + "</h2>" +
      '<p class="ldl-muted">' + n + " preguntas tipo examen, corregidas al momento, con el artículo exacto y la explicación de cada opción. Gratis y sin registrarte.</p>" +
      '<div class="ldl-acciones"><button class="ldl-btn" data-acc="empezarweb" type="button">Empezar el test</button></div></section>';
  }

  function vTest() {
    var id = sesion.ids[sesion.i], p = POR_ID[id], sim = sesion.tipo === "simulacro";
    var elegida = sesion.resp[id], corregida = !sim && sesion.corregida[id];
    var html = '<section class="ldl-card"><div class="ldl-meta"><span>' + esc(sesion.titulo) + " · " + (sesion.i + 1) + " de " + sesion.ids.length +
      "</span><span>" + (sesion.limite ? '⏱ <span id="ldl-crono" class="ldl-crono">' +
        mmss(Math.max(0, sesion.limite - Math.floor((Date.now() - sesion.inicio) / 1000))) + "</span>" : esc(p.articulo_txt)) +
      '</span></div><div class="ldl-progreso"><i style="width:' + pct(sesion.i + (corregida ? 1 : 0), sesion.ids.length) + '%"></i></div>' +
      '<p class="ldl-enunciado">' + esc(p.enunciado) + '</p><div class="ldl-opciones" role="group" aria-label="Opciones">';
    LETRAS.forEach(function (l) {
      var cls = "ldl-op";
      if (corregida) { if (l === p.correcta) cls += " ok"; else if (l === elegida) cls += " ko"; }
      else if (sim && elegida === l) cls += " marcada";
      html += '<button type="button" class="' + cls + '" data-acc="resp" data-l="' + l + '"' + (corregida ? " disabled" : "") +
        (sim ? ' aria-pressed="' + (elegida === l) + '"' : "") + '><span class="l">' + l + ")</span><span>" + esc(p.opciones[l]) + "</span></button>";
    });
    html += "</div>";
    if (corregida) html += feedback(p, elegida);
    html += '<div class="ldl-acciones">';
    if (sim) {
      html += (sesion.i > 0 ? '<button class="ldl-btn sec" data-acc="ant" type="button">Anterior</button>' : "") +
        '<button class="ldl-btn" data-acc="sig" type="button">' + (sesion.i < sesion.ids.length - 1 ? "Siguiente" : "Entregar") + "</button>" +
        (sesion.i < sesion.ids.length - 1 ? '<button class="ldl-btn sec" data-acc="entregar" type="button">Entregar ya</button>' : "");
    } else if (corregida) {
      html += '<button class="ldl-btn" data-acc="sig" type="button">' + (sesion.i < sesion.ids.length - 1 ? "Siguiente" : "Ver resultado") + "</button>";
    }
    html += '<button class="ldl-btn sec" data-acc="salir" type="button">Salir</button></div></section>';
    return html;
  }
  function feedback(p, elegida) {
    var bien = elegida === p.correcta;
    return '<div class="ldl-feedback" aria-live="polite"><div class="v ' + (bien ? "ok" : "ko") + '">' +
      (bien ? "¡Correcta!" : "Incorrecta. La respuesta correcta es la " + p.correcta + ")") + "</div><div>" + esc(p.explicacion) + "</div>" +
      (p.cita ? '<blockquote class="ldl-cita">' + esc(p.cita) + "<small>" + esc(p.articulo_txt) + "</small></blockquote>" : "") + "</div>";
  }
  function vResultado() {
    var r = calcular(sesion), sim = sesion.tipo === "simulacro";
    var html = '<section class="ldl-card"><h2>' + (sim ? "Resultado del simulacro" : "Resultado") + "</h2>" +
      '<div class="ldl-nota">' + (sim ? num(r.nota.toFixed(2)) : r.aciertos + "/" + r.total) + "</div>" +
      '<p class="ldl-muted">' + plural(r.aciertos, "acierto", "aciertos") + " · " + plural(r.errores, "error", "errores") +
      (r.blancos ? " · " + r.blancos + " en blanco" : "") +
      (sim ? " · nota sobre 10 con penalización" : "") + "</p>";
    if (CFG.modo === "web") html += ctaWeb(r);
    html += '<div class="ldl-acciones">' + (CFG.modo === "web" ? '<button class="ldl-btn sec" data-acc="empezarweb" type="button">Repetir con otro orden</button>' :
      '<button class="ldl-btn" data-acc="ir" data-v="inicio" type="button">Volver al inicio</button>') + "</div></section>";
    html += '<section class="ldl-card"><h3>Revisión</h3><ul class="ldl-revision">';
    sesion.ids.forEach(function (id, n) {
      var p = POR_ID[id], e = sesion.resp[id], chip = !e ? '<span class="ldl-chip nr">En blanco</span>' :
        e === p.correcta ? '<span class="ldl-chip ok">Bien</span>' : '<span class="ldl-chip ko">Mal</span>';
      html += "<li>" + chip + '<span class="e">' + (n + 1) + ". " + esc(p.enunciado) + "</span><br>" +
        '<span class="ldl-small">Correcta: <b>' + p.correcta + ") " + esc(p.opciones[p.correcta]) + "</b>" +
        (e && e !== p.correcta ? " · Marcaste " + e + ")" : "") + '</span><br><span class="ldl-small ldl-muted">' + esc(p.explicacion) + "</span></li>";
    });
    return html + "</ul></section>";
  }
  function ctaWeb() {
    var c = CFG.compra || {}, html = "";
    if (c.url) {
      html += '<div class="ldl-card ldl-cta"><h3>' + esc(c.titulo) + '</h3><p class="ldl-muted">' + esc(c.texto) + "</p>" +
        '<div class="ldl-acciones"><a class="ldl-btn acc" href="' + esc(c.url) + '">' + esc(c.boton) + "</a></div></div>";
    }
    if (CFG.telegram) {
      html += '<p class="ldl-small">¿Quieres un test cada día? <a href="' + esc(CFG.telegram) + '">Únete gratis al canal de Telegram</a>.</p>';
    }
    return html;
  }

  function pintar() {
    var cuerpo;
    if (vista === "test") cuerpo = vTest();
    else if (vista === "resultado") cuerpo = vResultado();
    else if (vista === "portada") cuerpo = vPortada();
    else if (vista === "temas") cuerpo = vTemas();
    else if (vista === "simulacro") cuerpo = vSimulacro();
    else if (vista === "fallos") cuerpo = vFallos();
    else if (vista === "stats") cuerpo = vStats();
    else cuerpo = vInicio();
    raiz.innerHTML = '<div class="ldl">' + cabecera() + navegacion() + "<main>" + cuerpo + "</main>" + pie() + "</div>";
  }

  /* ---------- eventos ---------- */
  raiz.addEventListener("click", function (ev) {
    var el = ev.target.closest("[data-acc]");
    if (!el) return;
    var acc = el.getAttribute("data-acc");
    if (acc === "tema") return cambiarTema();
    if (acc === "ir") { pararReloj(); vista = el.getAttribute("data-v"); sesion = null; pintar(); return; }
    if (acc === "rapido") return empezar("practica", barajar(B.preguntas).slice(0, 20), { titulo: "Test rápido" });
    if (acc === "repasar") return empezar("practica", barajar(fallosPendientes()).slice(0, 30), { titulo: "Repaso de fallos" });
    if (acc === "bloque") {
      var b = B.bloques.filter(function (x) { return x.id === el.getAttribute("data-id"); })[0];
      return empezar("practica", barajar(delBloque(b.id)), { titulo: b.nombre });
    }
    if (acc === "simular") {
      var n = parseInt(document.getElementById("ldl-n").value, 10);
      var conTiempo = document.getElementById("ldl-t").value === "1";
      var bloque = document.getElementById("ldl-b").value;
      var fuente = bloque ? delBloque(bloque) : B.preguntas;
      var elegidas = barajar(fuente).slice(0, n);
      return empezar("simulacro", elegidas, { titulo: "Simulacro", minutos: conTiempo ? elegidas.length : 0 });
    }
    if (acc === "empezarweb") return empezar("practica", barajar(B.preguntas), { titulo: "Test gratuito" });
    if (acc === "resp") return responder(el.getAttribute("data-l"));
    if (acc === "sig") return siguiente();
    if (acc === "ant") return anterior();
    if (acc === "entregar") return terminar();
    if (acc === "salir") { pararReloj(); sesion = null; vista = CFG.modo === "web" ? "portada" : "inicio"; pintar(); return; }
    if (acc === "borrar") {
      if (el.getAttribute("data-confirmar") === "1") { prog = { p: {}, h: [] }; guardar(); pintar(); }
      else { el.setAttribute("data-confirmar", "1"); el.textContent = "Pulsa otra vez para confirmar"; }
    }
  });
  document.addEventListener("keydown", function (ev) {
    if (vista !== "test" || !sesion || ev.altKey || ev.ctrlKey || ev.metaKey) return;
    var k = ev.key.toLowerCase(), mapa = { "1": "a", "2": "b", "3": "c", "4": "d", a: "a", b: "b", c: "c", d: "d" };
    if (mapa[k]) { ev.preventDefault(); responder(mapa[k]); }
    else if (k === "enter" || k === "arrowright") {
      var id = sesion.ids[sesion.i];
      if (sesion.tipo === "simulacro" || sesion.corregida[id]) { ev.preventDefault(); siguiente(); }
    } else if (k === "arrowleft" && sesion.tipo === "simulacro") { ev.preventDefault(); anterior(); }
  });

  pintar();
})();
</script>
</body>
</html>
