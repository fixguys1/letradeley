d).","cita":"«Su personal laboral se regirá por la legislación laboral y demás normas convencionalmente aplicables.»","dificultad":1},{"id":"TREBEP-L1-017","ley":"TREBEP","articulo":"7","articulo_txt":"Art. 7 TREBEP","bloque_id":"TREBEP|Título I. Objeto y ámbito de aplicación","enunciado":"Según el artículo 7 del TREBEP, en materia de permisos de nacimiento, adopción, del progenitor diferente de la madre biológica, de lactancia y parental, el personal laboral al servicio de las Administraciones públicas se regirá:","opciones":{"a":"Por las previsiones del Estatuto de los Trabajadores sobre suspensión del contrato, con preferencia sobre el TREBEP.","b":"Por lo que disponga el convenio colectivo y, en su defecto, por el TREBEP.","c":"Por lo previsto en el TREBEP, sin aplicarse las previsiones del Estatuto de los Trabajadores sobre suspensión del contrato.","d":"Por el régimen que elija cada trabajador entre el del TREBEP y el del Estatuto de los Trabajadores."},"correcta":"c","explicacion":"El párrafo segundo del art. 7, en la redacción dada por el art. 2.1 del Real Decreto-ley 9/2025, de 29 de julio, dispone que en esos permisos este personal «se regirá por lo previsto en el presente Estatuto», sin que le sean de aplicación las previsiones del texto refundido de la Ley del Estatuto de los Trabajadores sobre las suspensiones de los contratos de trabajo por los mismos supuestos de hecho. Por eso fallan la opción a), que da preferencia al Estatuto de los Trabajadores, la opción b), que remite al convenio colectivo, y la opción d), que deja la elección al trabajador. El art. 7 también fue modificado por el art. 3.1 del Real Decreto-ley 6/2019, de 1 de marzo.","cita":"«No obstante, en materia de permisos de nacimiento, adopción, del progenitor diferente de la madre biológica, de lactancia y parental, el personal laboral al servicio de las Administraciones públicas se regirá por lo previsto en el presente Estatuto, no siendo de aplicación a este personal, por tanto, las previsiones del texto refundido de la Ley del Estatuto de los Trabajadores sobre las suspensiones de los contratos de trabajo que, en su caso, corresponderían por los mismos supuestos de hecho.»","dificultad":2},{"id":"TREBEP-L1-016","ley":"TREBEP","articulo":"7","articulo_txt":"Art. 7 TREBEP","bloque_id":"TREBEP|Título I. Objeto y ámbito de aplicación","enunciado":"Según el artículo 7 del TREBEP, el personal laboral al servicio de las Administraciones públicas se rige:","opciones":{"a":"Por la legislación laboral, las normas convencionalmente aplicables y los preceptos del Estatuto que así lo dispongan.","b":"Exclusivamente por la legislación laboral y por los convenios colectivos que le sean aplicables, sin aplicación del Estatuto.","c":"Por el Estatuto y, supletoriamente, por la legislación laboral.","d":"Por el Estatuto en su integridad, en las mismas condiciones que el personal funcionario."},"correcta":"a","explicacion":"El art. 7, párrafo primero, establece que este personal se rige, «además de por la legislación laboral y por las demás normas convencionalmente aplicables, por los preceptos de este Estatuto que así lo dispongan». La opción b) excluye el Estatuto, la opción c) lo convierte en norma preferente con la legislación laboral como supletoria y la opción d) lo aplica en su integridad, nada de lo cual dice el precepto.","cita":"«El personal laboral al servicio de las Administraciones públicas se rige, además de por la legislación laboral y por las demás normas convencionalmente aplicables, por los preceptos de este Estatuto que así lo dispongan.»","dificultad":2},{"id":"TREBEP-L1-018","ley":"TREBEP","articulo":"8.1","articulo_txt":"Art. 8.1 TREBEP","bloque_id":"TREBEP|Título II. Personal al servicio de las Administraciones Públicas · Capítulo I. Clases de personal","enunciado":"Según el artículo 8.1 del TREBEP, son empleados públicos quienes desempeñan funciones retribuidas en las Administraciones Públicas al servicio de:","opciones":{"a":"La autoridad que los nombra.","b":"El Gobierno de la Nación.","c":"La Administración que los contrata.","d":"Los intereses generales."},"correcta":"d","explicacion":"El art. 8.1 define a los empleados públicos como quienes desempeñan funciones retribuidas en las Administraciones Públicas «al servicio de los intereses generales». Las opciones a), b) y c) sustituyen esa referencia por una autoridad, el Gobierno o la Administración de la que dependen, que el precepto no menciona.","cita":"«1. Son empleados públicos quienes desempeñan funciones retribuidas en las Administraciones Públicas al servicio de los intereses generales.»","dificultad":1},{"id":"TREBEP-L1-019","ley":"TREBEP","articulo":"8.2","articulo_txt":"Art. 8.2 TREBEP","bloque_id":"TREBEP|Título II. Personal al servicio de las Administraciones Públicas · Capítulo I. Clases de personal","enunciado":"Según el artículo 8.2 del TREBEP, ¿cuál de las siguientes NO figura entre las clases en que se clasifican los empleados públicos?","opciones":{"a":"Personal directivo profesional.","b":"Funcionarios interinos.","c":"Personal eventual.","d":"Personal laboral."},"correcta":"a","explicacion":"El art. 8.2 enumera cuatro clases: funcionarios de carrera, funcionarios interinos, personal laboral y personal eventual, de modo que las opciones b), c) y d) sí figuran. El personal directivo profesional no está en esa enumeración y se regula aparte, en el art. 13, dentro del capítulo II del título II.","cita":"«2. Los empleados públicos se clasifican en: a) Funcionarios de carrera. b) Funcionarios interinos. c) Personal laboral, ya sea fijo, por tiempo indefinido o temporal. d) Personal eventual.»","dificultad":1},{"id":"TREBEP-L1-022","ley":"TREBEP","articulo":"9.2","articulo_txt":"Art. 9.2 TREBEP","bloque_id":"TREBEP|Título II. Personal al servicio de las Administraciones Públicas · Capítulo I. Clases de personal","enunciado":"Según el artículo 9.2 del TREBEP, el ejercicio de las funciones que impliquen la participación directa o indirecta en el ejercicio de las potestades públicas corresponde:","opciones":{"a":"A los funcionarios públicos y, si lo autoriza la ley de desarrollo, también al personal laboral fijo.","b":"Exclusivamente a los funcionarios públicos, en los términos de la ley de desarrollo de cada Administración.","c":"Indistintamente a los funcionarios de carrera y al personal laboral fijo.","d":"A cualquier empleado público seleccionado conforme a los principios de mérito y capacidad."},"correcta":"b","explicacion":"El art. 9.2 dispone que esas funciones, igual que las que impliquen la salvaguardia de los intereses generales del Estado y de las Administraciones Públicas, «corresponden exclusivamente a los funcionarios públicos, en los términos que en la ley de desarrollo de cada Administración Pública se establezca». Las opciones a), c) y d) abren esas funciones a personal que no es funcionario, en contra de la reserva exclusiva del precepto.","cita":"«2. En todo caso, el ejercicio de las funciones que impliquen la participación directa o indirecta en el ejercicio de las potestades públicas o en la salvaguardia de los intereses generales del Estado y de las Administraciones Públicas corresponden exclusivamente a los funcionarios públicos, en los términos que en la ley de desarrollo de cada Administración Pública se establezca.»","dificultad":2},{"id":"TREBEP-L1-030","ley":"TREBEP","articulo":"10.4","articulo_txt":"Art. 10.4 TREBEP","bloque_id":"TREBEP|Título II. Personal al servicio de las Administraciones Públicas · Capítulo I. Clases de personal","enunciado":"Según el artículo 10.4 del TREBEP, una vez producido el fin de la relación de interinidad por el transcurso del plazo previsto desde el nombramiento del personal funcionario interino, la vacante:","opciones":{"a":"Deberá ser amortizada y no podrá volver a cubrirse por personal funcionario interino en ningún caso.","b":"Podrá cubrirse mediante la contratación de personal laboral temporal.","c":"Solo podrá ocuparla personal funcionario de carrera, salvo que el proceso selectivo quede desierto.","d":"Quedará reservada al personal funcionario interino que la venía ocupando."},"correcta":"c","explicacion":"El art. 10.4, párrafo segundo, dispone que, transcurridos tres años desde el nombramiento, «la vacante solo podrá ser ocupada por personal funcionario de carrera, salvo que el correspondiente proceso selectivo quede desierto, en cuyo caso se podrá efectuar otro nombramiento de personal funcionario interino». Por eso fallan la opción a), que impone la amortización y prohíbe todo nuevo nombramiento interino, la opción b), que admite personal laboral temporal, y la opción d), que reserva la plaza al interino que la ocupaba.","cita":"«No obstante, transcurridos tres años desde el nombramiento del personal funcionario interino se producirá el fin de la relación de interinidad, y la vacante solo podrá ser ocupada por personal funcionario de carrera, salvo que el correspondiente proceso selectivo quede desierto, en cuyo caso se podrá efectuar otro nombramiento de personal funcionario interino.»","dificultad":2},{"id":"TREBEP-L1-037","ley":"TREBEP","articulo":"12.2","articulo_txt":"Art. 12.2 TREBEP","bloque_id":"TREBEP|Título II. Personal al servicio de las Administraciones Públicas · Capítulo I. Clases de personal","enunciado":"Según el artículo 12.2 del TREBEP, el número máximo de personal eventual se establecerá por:","opciones":{"a":"Las leyes de Función Pública que se dicten en desarrollo del Estatuto.","b":"La ley de presupuestos de cada Administración Pública.","c":"La Mesa General de Negociación de cada Administración Pública.","d":"Los respectivos órganos de gobierno."},"correcta":"d","explicacion":"El art. 12.2 encarga a las leyes de Función Pública determinar los órganos de gobierno que podrán disponer de personal eventual, pero dispone que «El número máximo se establecerá por los respectivos órganos de gobierno», y que este número y las condiciones retributivas serán públicas. Por eso falla la opción a), y el precepto no menciona la ley de presupuestos de la opción b) ni la Mesa General de Negociación de la opción c).","cita":"«2. Las leyes de Función Pública que se dicten en desarrollo de este Estatuto determinarán los órganos de gobierno de las Administraciones Públicas que podrán disponer de este tipo de personal. El número máximo se establecerá por los respectivos órganos de gobierno. Este número y las condiciones retributivas serán públicas.»","dificultad":2},{"id":"TREBEP-L1-040","ley":"TREBEP","articulo":"13","articulo_txt":"Art. 13 TREBEP","bloque_id":"TREBEP|Título II. Personal al servicio de las Administraciones Públicas · Capítulo II. Personal directivo","enunciado":"Según el artículo 13 del TREBEP, ¿quién podrá establecer, en desarrollo del Estatuto, el régimen jurídico específico del personal directivo y los criterios para determinar su condición?","opciones":{"a":"Las Cortes Generales, mediante ley orgánica.","b":"El Gobierno y los órganos de gobierno de las comunidades autónomas.","c":"El Ministro competente en materia de función pública, mediante orden.","d":"Las entidades locales, en el ámbito de su autonomía."},"correcta":"b","explicacion":"El art. 13 dispone que «El Gobierno y los órganos de gobierno de las comunidades autónomas podrán establecer, en desarrollo de este Estatuto, el régimen jurídico específico del personal directivo así como los criterios para determinar su condición». El precepto no atribuye esa facultad a las Cortes Generales de la opción a), a un Ministro mediante orden como la opción c) ni a las entidades locales de la opción d).","cita":"«El Gobierno y los órganos de gobierno de las comunidades autónomas podrán establecer, en desarrollo de este Estatuto, el régimen jurídico específico del personal directivo así como los criterios para determinar su condición, de acuerdo, entre otros, con los siguientes principios:»","dificultad":1},{"id":"TREBEP-L1-041","ley":"TREBEP","articulo":"13.2","articulo_txt":"Art. 13.2 TREBEP","bloque_id":"TREBEP|Título II. Personal al servicio de las Administraciones Públicas · Capítulo II. Personal directivo","enunciado":"Según el artículo 13.2 del TREBEP, la designación del personal directivo atenderá a principios de mérito y capacidad y a criterios de:","opciones":{"a":"Antigüedad.","b":"Oportunidad.","c":"Idoneidad.","d":"Representatividad."},"correcta":"c","explicacion":"El art. 13.2 dispone que la designación «atenderá a principios de mérito y capacidad y a criterios de idoneidad», y que se llevará a cabo mediante procedimientos que garanticen la publicidad y concurrencia. La antigüedad, la oportunidad y la representatividad de las opciones a), b) y d) no figuran en el precepto.","cita":"«2. Su designación atenderá a principios de mérito y capacidad y a criterios de idoneidad, y se llevará a cabo mediante procedimientos que garanticen la publicidad y concurrencia.»","dificultad":1},{"id":"TREBEP-L1-042","ley":"TREBEP","articulo":"13.4","articulo_txt":"Art. 13.4 TREBEP","bloque_id":"TREBEP|Título II. Personal al servicio de las Administraciones Públicas · Capítulo II. Personal directivo","enunciado":"Según el artículo 13.4 del TREBEP, la determinación de las condiciones de empleo del personal directivo:","opciones":{"a":"No tendrá la consideración de materia objeto de negociación colectiva a los efectos de esta ley.","b":"Será materia objeto de negociación colectiva en la Mesa General de Negociación.","c":"Solo será objeto de negociación colectiva cuando el directivo tenga la condición de funcionario.","d":"Será objeto de negociación colectiva únicamente en las comunidades autónomas."},"correcta":"a","explicacion":"El art. 13.4 dispone que la determinación de las condiciones de empleo del personal directivo «no tendrá la consideración de materia objeto de negociación colectiva a los efectos de esta ley». Las opciones b), c) y d) la someten a negociación colectiva, con carácter general o en determinados casos, en contra de lo que dice el precepto.","cita":"«4. La determinación de las condiciones de empleo del personal directivo no tendrá la consideración de materia objeto de negociación colectiva a los efectos de esta ley.»","dificultad":2},{"id":"TREBEP-L1-043","ley":"TREBEP","articulo":"13.4","articulo_txt":"Art. 13.4 TREBEP","bloque_id":"TREBEP|Título II. Personal al servicio de las Administraciones Públicas · Capítulo II. Personal directivo","enunciado":"Según el artículo 13.4 del TREBEP, cuando el personal directivo reúna la condición de personal laboral, estará sometido a:","opciones":{"a":"La relación laboral común, como el resto del personal laboral.","b":"El régimen del personal eventual.","c":"El régimen estatutario de los funcionarios de carrera.","d":"La relación laboral de carácter especial de alta dirección."},"correcta":"d","explicacion":"El art. 13.4 dispone que, en ese caso, el personal directivo «estará sometido a la relación laboral de carácter especial de alta dirección». El precepto no lo remite a la relación laboral común de la opción a), al régimen del personal eventual de la opción b) ni al régimen estatutario de la opción c).","cita":"«Cuando el personal directivo reúna la condición de personal laboral estará sometido a la relación laboral de carácter especial de alta dirección.»","dificultad":1},{"id":"TREBEP-L2-005","ley":"TREBEP","articulo":"14.i)","articulo_txt":"Art. 14.i) TREBEP","bloque_id":"TREBEP|Título III. Derechos y deberes. Código de conducta de los empleados públicos · Capítulo I. Derechos de los empleados públicos","enunciado":"Según el artículo 14.i) del TREBEP, ¿cuál de las siguientes circunstancias NO aparece expresamente mencionada en el derecho a la no discriminación?","opciones":{"a":"La edad.","b":"La discapacidad.","c":"La lengua.","d":"El nacimiento."},"correcta":"c","explicacion":"La lengua no aparece en la enumeración del art. 14.i), en la redacción dada por la disposición final 16.1 de la Ley 4/2023, de 28 de febrero, que cierra con «cualquier otra condición o circunstancia personal o social». Sí se mencionan expresamente la edad de la opción a), la discapacidad de la opción b) y el nacimiento de la opción d).","cita":"«i) A la no discriminación por razón de nacimiento, origen racial o étnico, género, sexo u orientación e identidad sexual, expresión de género, características sexuales, religión o convicciones, opinión, discapacidad, edad o cualquier otra condición o circunstancia personal o social.»","dificultad":2},{"id":"TREBEP-L2-003","ley":"TREBEP","articulo":"14.g)","articulo_txt":"Art. 14.g) TREBEP","bloque_id":"TREBEP|Título III. Derechos y deberes. Código de conducta de los empleados públicos · Capítulo I. Derechos de los empleados públicos","enunciado":"Según el artículo 14.g) del TREBEP, los empleados públicos tienen derecho a la formación continua y a la actualización permanente de sus conocimientos y capacidades profesionales:","opciones":{"a":"Exclusivamente fuera del horario laboral.","b":"Siempre y obligatoriamente dentro del horario laboral.","c":"Preferentemente en horario laboral.","d":"En el horario que fije en cada caso el superior jerárquico."},"correcta":"c","explicacion":"El art. 14.g) reconoce ese derecho «preferentemente en horario laboral». La opción a) lo excluye del horario laboral, la opción b) convierte la preferencia en obligación y la opción d) deja el horario a decisión del superior, algo que el precepto no prevé.","cita":"«g) A la formación continua y a la actualización permanente de sus conocimientos y capacidades profesionales, preferentemente en horario laboral.»","dificultad":1},{"id":"TREBEP-L2-008","ley":"TREBEP","articulo":"14.p)","articulo_txt":"Art. 14.p) TREBEP","bloque_id":"TREBEP|Título III. Derechos y deberes. Código de conducta de los empleados públicos · Capítulo I. Derechos de los empleados públicos","enunciado":"Según los artículos 14 y 15 del TREBEP, ¿cuál de los siguientes derechos figura entre los derechos individuales de los empleados públicos y NO entre los que se ejercen de forma colectiva?","opciones":{"a":"A la libre asociación profesional.","b":"A la libertad sindical.","c":"A la negociación colectiva.","d":"A la participación en la determinación de las condiciones de trabajo."},"correcta":"a","explicacion":"La libre asociación profesional figura en el art. 14.p) entre los derechos de carácter individual. La libertad sindical de la opción b), la negociación colectiva de la opción c) y la participación en la determinación de las condiciones de trabajo de la opción d) son derechos individuales que se ejercen de forma colectiva según el art. 15, letras a) y b).","cita":"«p) A la libre asociación profesional.»","dificultad":2},{"id":"TREBEP-L2-002","ley":"TREBEP","articulo":"14.f)","articulo_txt":"Art. 14.f) TREBEP","bloque_id":"TREBEP|Título III. Derechos y deberes. Código de conducta de los empleados públicos · Capítulo I. Derechos de los empleados públicos","enunciado":"Según el artículo 14.f) del TREBEP, los empleados públicos tienen derecho a la defensa jurídica y protección de la Administración Pública en los procedimientos que se sigan:","opciones":{"a":"Ante cualquier orden jurisdiccional, solo cuando el empleado público actúe como parte demandante.","b":"Ante cualquier orden jurisdiccional, con independencia de que los hechos guarden o no relación con sus funciones.","c":"Ante cualquier orden jurisdiccional, cuando los hechos se hayan producido dentro del horario de trabajo.","d":"Ante cualquier orden jurisdiccional como consecuencia del ejercicio legítimo de sus funciones o cargos públicos."},"correcta":"d","explicacion":"El art. 14.f) se refiere a los procedimientos que se sigan «ante cualquier orden jurisdiccional como consecuencia del ejercicio legítimo de sus funciones o cargos públicos». La opción a) lo limita a los casos en que el empleado actúa como demandante, la opción b) prescinde de la relación con el ejercicio legítimo de las funciones y la opción c) sustituye esa relación por un criterio horario que el precepto no recoge.","cita":"«f) A la defensa jurídica y protección de la Administración Pública en los procedimientos que se sigan ante cualquier orden jurisdiccional como consecuencia del ejercicio legítimo de sus funciones o cargos públicos.»","dificultad":2},{"id":"TREBEP-L2-010","ley":"TREBEP","articulo":"15.d)","articulo_txt":"Art. 15.d) TREBEP","bloque_id":"TREBEP|Título III. Derechos y deberes. Código de conducta de los empleados públicos · Capítulo I. Derechos de los empleados públicos","enunciado":"Según el artículo 15.d) del TREBEP, el derecho al planteamiento de conflictos colectivos de trabajo se ejerce:","opciones":{"a":"Solo por el personal laboral, conforme a su convenio colectivo.","b":"Únicamente ante la jurisdicción contencioso-administrativa.","c":"De acuerdo con la legislación aplicable en cada caso.","d":"Exclusivamente en los términos que fije el propio artículo 15."},"correcta":"c","explicacion":"El art. 15.d) reconoce el derecho «Al planteamiento de conflictos colectivos de trabajo, de acuerdo con la legislación aplicable en cada caso». El art. 15 atribuye ese derecho a los empleados públicos, no solo al personal laboral como dice la opción a); no lo limita a la jurisdicción contencioso-administrativa como dice la opción b) y no lo regula por sí mismo, sino que remite a la legislación aplicable, frente a lo que afirma la opción d).","cita":"«d) Al planteamiento de conflictos colectivos de trabajo, de acuerdo con la legislación aplicable en cada caso.»","dificultad":2},{"id":"TREBEP-L2-012","ley":"TREBEP","articulo":"16.2","articulo_txt":"Art. 16.2 TREBEP","bloque_id":"TREBEP|Título III. Derechos y deberes. Código de conducta de los empleados públicos · Capítulo II. Derecho a la carrera profesional y a la promoción interna. La evaluación del desempeño","enunciado":"Según el artículo 16.2 del TREBEP, la carrera profesional es el conjunto ordenado de:","opciones":{"a":"Puestos de trabajo que el funcionario puede desempeñar a lo largo de su vida administrativa.","b":"Grados y categorías personales que el funcionario consolida por el mero transcurso del tiempo.","c":"Retribuciones complementarias que corresponden al funcionario según el puesto que ocupa.","d":"Oportunidades de ascenso y expectativas de progreso profesional."},"correcta":"d","explicacion":"El art. 16.2 define la carrera profesional como «el conjunto ordenado de oportunidades de ascenso y expectativas de progreso profesional conforme a los principios de igualdad, mérito y capacidad». La definición no se refiere a los puestos de trabajo de la opción a), a una consolidación por el mero transcurso del tiempo como la de la opción b) ni a las retribuciones complementarias de la opción c).","cita":"«2. La carrera profesional es el conjunto ordenado de oportunidades de ascenso y expectativas de progreso profesional conforme a los principios de igualdad, mérito y capacidad.»","dificultad":1},{"id":"TREBEP-L2-015","ley":"TREBEP","articulo":"16.4","articulo_txt":"Art. 16.4 TREBEP","bloque_id":"TREBEP|Título III. Derechos y deberes. Código de conducta de los empleados públicos · Capítulo II. Derecho a la carrera profesional y a la promoción interna. La evaluación del desempeño","enunciado":"Según el artículo 16.4 del TREBEP, los funcionarios de carrera podrán progresar simultáneamente en las modalidades de carrera horizontal y vertical:","opciones":{"a":"Cuando la Administración correspondiente las haya implantado en un mismo ámbito.","b":"Solo cuando así lo prevea expresamente el convenio colectivo que les sea aplicable.","c":"En ningún caso, porque el Estatuto configura ambas modalidades como incompatibles.","d":"Previa autorización expresa del titular de la unidad en la que presten servicios."},"correcta":"a","explicacion":"El art. 16.4 permite la progresión simultánea «cuando la Administración correspondiente las haya implantado en un mismo ámbito». No la condiciona a un convenio colectivo como dice la opción b) ni a una autorización individual como dice la opción d), y la opción c) contradice el precepto, que admite expresamente la simultaneidad.","cita":"«4. Los funcionarios de carrera podrán progresar simultáneamente en las modalidades de carrera horizontal y vertical cuando la Administración correspondiente las haya implantado en un mismo ámbito.»","dificultad":2},{"id":"TREBEP-L2-019","ley":"TREBEP","articulo":"18.1","articulo_txt":"Art. 18.1 TREBEP","bloque_id":"TREBEP|Título III. Derechos y deberes. Código de conducta de los empleados públicos · Capítulo II. Derecho a la carrera profesional y a la promoción interna. La evaluación del desempeño","enunciado":"Según el artículo 18.1 del TREBEP, la promoción interna se realizará mediante procesos selectivos que garanticen el cumplimiento de los principios constitucionales de igualdad, mérito y capacidad así como los contemplados en:","opciones":{"a":"El artículo 55.2 del Estatuto.","b":"El artículo 61.1 del Estatuto.","c":"El artículo 20.2 del Estatuto.","d":"El artículo 78.1 del Estatuto."},"correcta":"a","explicacion":"El art. 18.1 exige garantizar los principios constitucionales de igualdad, mérito y capacidad «así como los contemplados en el artículo 55.2 de este Estatuto». Las opciones b), c) y d) citan artículos a los que el art. 18.1 no remite.","cita":"«1. La promoción interna se realizará mediante procesos selectivos que garanticen el cumplimiento de los principios constitucionales de igualdad, mérito y capacidad así como los contemplados en el artículo 55.2 de este Estatuto.»","dificultad":2},{"id":"TREBEP-L2-022","ley":"TREBEP","articulo":"19.2","articulo_txt":"Art. 19.2 TREBEP","bloque_id":"TREBEP|Título III. Derechos y deberes. Código de conducta de los empleados públicos · Capítulo II. Derecho a la carrera profesional y a la promoción interna. La evaluación del desempeño","enunciado":"Según el artículo 19.2 del TREBEP, la carrera profesional y la promoción del personal laboral se hará efectiva a través de los procedimientos previstos en:","opciones":{"a":"El Estatuto de los Trabajadores o en los convenios colectivos.","b":"Las leyes de Función Pública aplicables a los funcionarios de carrera.","c":"Los reglamentos de personal que apruebe cada Administración Pública.","d":"Los sistemas de carrera horizontal y vertical previstos en el artículo 16 del Estatuto."},"correcta":"a","explicacion":"El art. 19.2 remite a «los procedimientos previstos en el Estatuto de los Trabajadores o en los convenios colectivos». No remite a las leyes de Función Pública de la opción b) ni a reglamentos de personal como dice la opción c), y las modalidades de carrera del art. 16 de la opción d) se refieren a los funcionarios de carrera, no al personal laboral.","cita":"«2. La carrera profesional y la promoción del personal laboral se hará efectiva a través de los procedimientos previstos en el Estatuto de los Trabajadores o en los convenios colectivos.»","dificultad":1},{"id":"TREBEP-L2-023","ley":"TREBEP","articulo":"20.1","articulo_txt":"Art. 20.1 TREBEP","bloque_id":"TREBEP|Título III. Derechos y deberes. Código de conducta de los empleados públicos · Capítulo II. Derecho a la carrera profesional y a la promoción interna. La evaluación del desempeño","enunciado":"Según el artículo 20.1 del TREBEP, la evaluación del desempeño es el procedimiento mediante el cual se mide y valora:","opciones":{"a":"La conducta profesional y el rendimiento o el logro de resultados.","b":"Exclusivamente el logro de resultados de cada unidad administrativa.","c":"Los conocimientos teóricos adquiridos mediante la formación continua.","d":"La antigüedad acumulada por el empleado en su Subgrupo de clasificación."},"correcta":"a","explicacion":"El art. 20.1 define la evaluación del desempeño como el procedimiento mediante el cual «se mide y valora la conducta profesional y el rendimiento o el logro de resultados». La opción b) la reduce a los resultados de la unidad, y la definición no menciona los conocimientos teóricos de la opción c) ni la antigüedad de la opción d).","cita":"«La evaluación del desempeño es el procedimiento mediante el cual se mide y valora la conducta profesional y el rendimiento o el logro de resultados.»","dificultad":1},{"id":"TREBEP-L2-030","ley":"TREBEP","articulo":"22.3","articulo_txt":"Art. 22.3 TREBEP","bloque_id":"TREBEP|Título III. Derechos y deberes. Código de conducta de los empleados públicos · Capítulo III. Derechos retributivos","enunciado":"Según el artículo 22.3 del TREBEP, las retribuciones complementarias son las que retribuyen:","opciones":{"a":"La adscripción del cuerpo o escala del funcionario a un determinado Subgrupo o Grupo de clasificación profesional y su antigüedad en el mismo.","b":"Las características de los puestos de trabajo, la carrera profesional o el desempeño, rendimiento o resultados alcanzados por el funcionario.","c":"Exclusivamente las horas de trabajo que el funcionario haya realizado de forma efectiva en cada mes, sin otros factores.","d":"Las cargas familiares y las circunstancias personales del funcionario, con independencia del puesto de trabajo que desempeñe."},"correcta":"b","explicacion":"El art. 22.3 define las retribuciones complementarias como las que retribuyen «las características de los puestos de trabajo, la carrera profesional o el desempeño, rendimiento o resultados alcanzados por el funcionario». La opción a) describe las retribuciones básicas del art. 22.2, y el precepto no menciona las horas efectivamente trabajadas de la opción c) ni las cargas familiares de la opción d).","cita":"«3. Las retribuciones complementarias son las que retribuyen las características de los puestos de trabajo, la carrera profesional o el desempeño, rendimiento o resultados alcanzados por el funcionario.»","dificultad":2},{"id":"TREBEP-L2-042","ley":"TREBEP","articulo":"27","articulo_txt":"Art. 27 TREBEP","bloque_id":"TREBEP|Título III. Derechos y deberes. Código de conducta de los empleados públicos · Capítulo III. Derechos retributivos","enunciado":"Según el artículo 27 del TREBEP, las retribuciones del personal laboral se determinarán de acuerdo con la legislación laboral, el convenio colectivo que sea aplicable y el contrato de trabajo, respetando en todo caso lo establecido en:","opciones":{"a":"El artículo 21 del Estatuto.","b":"El artículo 22 del Estatuto.","c":"El artículo 24 del Estatuto.","d":"El artículo 19 del Estatuto."},"correcta":"a","explicacion":"El art. 27 exige respetar «en todo caso lo establecido en el artículo 21 del presente Estatuto», que regula la determinación de las cuantías y de los incrementos retributivos. Los arts. 22 y 24 de las opciones b) y c) se refieren a las retribuciones de los funcionarios y el art. 19 de la opción d) a la carrera y promoción del personal laboral.","cita":"«Las retribuciones del personal laboral se determinarán de acuerdo con la legislación laboral, el convenio colectivo que sea aplicable y el contrato de trabajo, respetando en todo caso lo establecido en el artículo 21 del presente Estatuto.»","dificultad":2},{"id":"TREBEP-L2-044","ley":"TREBEP","articulo":"29","articulo_txt":"Art. 29 TREBEP","bloque_id":"TREBEP|Título III. Derechos y deberes. Código de conducta de los empleados públicos · Capítulo III. Derechos retributivos","enunciado":"Según el artículo 29 del TREBEP, las cantidades destinadas a financiar aportaciones a planes de pensiones o contratos de seguros tendrán, a todos los efectos, la consideración de:","opciones":{"a":"Retribución complementaria.","b":"Retribución diferida.","c":"Retribución básica.","d":"Prestación de la Seguridad Social."},"correcta":"b","explicacion":"El art. 29 dispone que esas cantidades «tendrán a todos los efectos la consideración de retribución diferida». No son retribuciones complementarias, como dice la opción a), ni básicas, como dice la opción c), ni prestaciones de la Seguridad Social, como dice la opción d).","cita":"«Las cantidades destinadas a financiar aportaciones a planes de pensiones o contratos de seguros tendrán a todos los efectos la consideración de retribución diferida.»","dificultad":1},{"id":"TREBEP-L2-046","ley":"TREBEP","articulo":"30.1","articulo_txt":"Art. 30.1 TREBEP","bloque_id":"TREBEP|Título III. Derechos y deberes. Código de conducta de los empleados públicos · Capítulo III. Derechos retributivos","enunciado":"Según el artículo 30.1 del TREBEP, sin perjuicio de la sanción disciplinaria que pueda corresponder, la parte de jornada no realizada dará lugar a:","opciones":{"a":"La deducción de la totalidad de los haberes del día afectado.","b":"La deducción proporcional de haberes.","c":"La pérdida de las retribuciones complementarias de todo el mes.","d":"La recuperación obligatoria de ese tiempo, sin deducción de haberes."},"correcta":"b","explicacion":"El art. 30.1 dispone que la parte de jornada no realizada «dará lugar a la deducción proporcional de haberes, que no tendrá carácter sancionador». La deducción es proporcional, no de todo el día como dice la opción a) ni de las complementarias del mes como dice la opción c), y el precepto no prevé la recuperación del tiempo de la opción d).","cita":"«1. Sin perjuicio de la sanción disciplinaria que pueda corresponder, la parte de jornada no realizada dará lugar a la deducción proporcional de haberes, que no tendrá carácter sancionador.»","dificultad":1},{"id":"TREBEP-L2-047","ley":"TREBEP","articulo":"30.2","articulo_txt":"Art. 30.2 TREBEP","bloque_id":"TREBEP|Título III. Derechos y deberes. Código de conducta de los empleados públicos · Capítulo III. Derechos retributivos","enunciado":"Según el artículo 30.2 del TREBEP, la deducción de haberes que se efectúe a quienes ejerciten el derecho de huelga, por el tiempo en que hayan permanecido en esa situación:","opciones":{"a":"No tendrá carácter de sanción ni afectará al régimen respectivo de sus prestaciones sociales.","b":"No tendrá carácter de sanción, pero afectará al régimen respectivo de sus prestaciones sociales.","c":"Tendrá carácter de sanción, aunque no afectará al régimen respectivo de sus prestaciones sociales.","d":"Se limitará a las retribuciones complementarias, sin afectar en ningún caso a las retribuciones básicas."},"correcta":"a","explicacion":"El art. 30.2 dispone que quienes ejerciten el derecho de huelga no devengarán ni percibirán las retribuciones de ese tiempo «sin que la deducción de haberes que se efectúe tenga carácter de sanción, ni afecte al régimen respectivo de sus prestaciones sociales». La opción b) afirma que afecta a las prestaciones sociales, la opción c) le atribuye carácter de sanción y la opción d) limita la deducción a las complementarias, cuando el precepto se refiere a las retribuciones correspondientes al tiempo de huelga.","cita":"«2. Quienes ejerciten el derecho de huelga no devengarán ni percibirán las retribuciones correspondientes al tiempo en que hayan permanecido en esa situación sin que la deducción de haberes que se efectúe tenga carácter de sanción, ni afecte al régimen respectivo de sus prestaciones sociales.»","dificultad":2},{"id":"TREBEP-L3-017","ley":"TREBEP","articulo":"36.3","articulo_txt":"Art. 36.3 TREBEP","bloque_id":"TREBEP|Título III. Derechos y deberes. Código de conducta de los empleados públicos · Capítulo IV. Derecho a la negociación colectiva, representación y participación institucional. Derecho de reunión","enunciado":"Según el artículo 36.3 del TREBEP, las Mesas Generales de Negociación que se constituyen en la Administración General del Estado, en cada comunidad autónoma, en las ciudades de Ceuta y Melilla y en las entidades locales con arreglo a ese apartado tienen por objeto la negociación de:","opciones":{"a":"Únicamente las condiciones de trabajo que les remita la Mesa General de Negociación de las Administraciones Públicas.","b":"Las materias que resulten susceptibles de regulación estatal con carácter de norma básica para todas las Administraciones.","c":"Las condiciones de trabajo del personal funcionario y laboral de cada Administración, con exclusión del personal estatutario.","d":"Todas aquellas materias y condiciones de trabajo comunes al personal funcionario, estatutario y laboral de cada Administración Pública."},"correcta":"d","explicacion":"El art. 36.3 constituye estas Mesas «Para la negociación de todas aquellas materias y condiciones de trabajo comunes al personal funcionario, estatutario y laboral de cada Administración Pública». El precepto no limita su objeto a lo que les remita la Mesa General de Negociación de las Administraciones Públicas, como dice la opción a); las materias de regulación estatal con carácter de norma básica de la opción b) corresponden, según el art. 36.2, a esa Mesa General de Negociación de las Administraciones Públicas, y la opción c) excluye al personal estatutario, que el precepto incluye expresamente.","cita":"«3. Para la negociación de todas aquellas materias y condiciones de trabajo comunes al personal funcionario, estatutario y laboral de cada Administración Pública, se constituirá en la Administración General del Estado, en cada una de las comunidades autónomas, ciudades de Ceuta y Melilla y entidades locales una Mesa General de Negociación.»","dificultad":3},{"id":"TREBEP-L3-034","ley":"TREBEP","articulo":"41.1.d)","articulo_txt":"Art. 41.1.d) TREBEP","bloque_id":"TREBEP|Título III. Derechos y deberes. Código de conducta de los empleados públicos · Capítulo IV. Derecho a la negociación colectiva, representación y participación institucional. Derecho de reunión","enunciado":"Según el artículo 41.1.d) del TREBEP, ¿cabe la acumulación de los créditos horarios de los miembros de la Junta de Personal y Delegados de Personal?","opciones":{"a":"Sí, la de los miembros de la misma candidatura, previa autorización expresa del órgano que ostente la Jefatura de Personal.","b":"Sí, la de los miembros de cualquier candidatura, previa autorización de la Mesa General de Negociación de su ámbito.","c":"Sí, la de los miembros de la misma candidatura que así lo manifiesten, previa comunicación al órgano que ostente la Jefatura de Personal.","d":"No, porque el crédito de horas mensuales corresponde individualmente a cada representante y no admite en ningún caso su cesión a otros miembros."},"correcta":"c","explicacion":"El art. 41.1.d) permite que los miembros «de la misma candidatura que así lo manifiesten» procedan, «previa comunicación al órgano que ostente la Jefatura de Personal», a la acumulación de los créditos horarios. La opción a) exige una autorización donde la ley solo pide comunicación; la opción b) admite la acumulación entre candidaturas distintas y con autorización de la Mesa General, y la opción d) la niega.","cita":"«Los miembros de la Junta de Personal y Delegados de Personal de la misma candidatura que así lo manifiesten podrán proceder, previa comunicación al órgano que ostente la Jefatura de Personal ante la que aquélla ejerza su representación, a la acumulación de los créditos horarios.»","dificultad":3},{"id":"TREBEP-L3-040","ley":"TREBEP","articulo":"44.d)","articulo_txt":"Art. 44.d) TREBEP","bloque_id":"TREBEP|Título III. Derechos y deberes. Código de conducta de los empleados públicos · Capítulo IV. Derecho a la negociación colectiva, representación y participación institucional. Derecho de reunión","enunciado":"Según el artículo 44.d) del TREBEP, entre los criterios generales del procedimiento electoral figura que:","opciones":{"a":"Las Juntas de Personal se elegirán mediante listas abiertas y sistema mayoritario, y los Delegados de Personal mediante listas cerradas con sistema proporcional corregido.","b":"Tanto las Juntas de Personal como los Delegados de Personal se elegirán, en todo caso, mediante listas cerradas a través de un sistema proporcional corregido.","c":"Las Juntas de Personal se elegirán mediante listas cerradas con sistema proporcional corregido, y los Delegados de Personal mediante listas abiertas y sistema mayoritario.","d":"Tanto las Juntas de Personal como los Delegados de Personal se elegirán mediante listas abiertas y sistema mayoritario, sin excepción alguna en su aplicación."},"correcta":"c","explicacion":"El art. 44.d) establece que «Las Juntas de Personal se elegirán mediante listas cerradas a través de un sistema proporcional corregido, y los Delegados de Personal mediante listas abiertas y sistema mayoritario». La opción a) intercambia los sistemas, y las opciones b) y d) aplican un mismo sistema a ambos órganos.","cita":"«d) Las Juntas de Personal se elegirán mediante listas cerradas a través de un sistema proporcional corregido, y los Delegados de Personal mediante listas abiertas y sistema mayoritario.»","dificultad":2},{"id":"TREBEP-L3-042","ley":"TREBEP","articulo":"44.f)","articulo_txt":"Art. 44.f) TREBEP","bloque_id":"TREBEP|Título III. Derechos y deberes. Código de conducta de los empleados públicos · Capítulo IV. Derecho a la negociación colectiva, representación y participación institucional. Derecho de reunión","enunciado":"Según el artículo 44.f) del TREBEP, las reclamaciones contra las denegaciones de inscripción de actas electorales:","opciones":{"a":"Podrán plantearse directamente ante la jurisdicción social.","b":"Se tramitarán conforme a un procedimiento arbitral.","c":"Podrán plantearse directamente ante la jurisdicción contencioso-administrativa.","d":"Deberán plantearse previamente ante la Mesa Electoral que dirigió el procedimiento."},"correcta":"a","explicacion":"El art. 44.f) somete las impugnaciones a un procedimiento arbitral, «excepto las reclamaciones contra las denegaciones de inscripción de actas electorales que podrán plantearse directamente ante la jurisdicción social». La opción b) aplica a estas reclamaciones la regla general de la que precisamente se exceptúan; la opción c) cambia la jurisdicción, y la opción d) añade un trámite previo que el precepto no prevé.","cita":"«f) Las impugnaciones se tramitarán conforme a un procedimiento arbitral, excepto las reclamaciones contra las denegaciones de inscripción de actas electorales que podrán plantearse directamente ante la jurisdicción social.»","dificultad":2}]};</script>
<script>
/* Letra de Ley — motor de test. Sin dependencias; funciona sin conexión.
   Necesita window.LDL_CONFIG y window.LDL_BANCO (los inyecta sistema/letradeley.py). */
(function () {
  "use strict";
  var CFG = window.LDL_CONFIG, B = window.LDL_BANCO;
  var raiz = document.getElementById("ldl");
  var LETRAS = ["a", "b", "c", "d"];
  var POR_ID = {};
  B.preguntas.forEach(function (p) { POR_ID[p.id] = p; });
  var CLAVE = "ldl1:" + CFG.pack.id;
  var prog = cargar();
  var sesion = null;
  var vista = CFG.modo === "web" ? "portada" : "inicio";
  var reloj = null;

  /* ---------- utilidades ---------- */
  function esc(t) {
    return String(t == null ? "" : t).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function barajar(lista) {
    var a = lista.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function pct(a, b) { return b ? Math.round((a / b) * 100) : 0; }
  function plural(n, uno, varios) { return n + " " + (n === 1 ? uno : varios); }
  function num(n) { return String(n).replace(".", ","); }
  function cargar() {
    try { var s = localStorage.getItem(CLAVE); if (s) { var d = JSON.parse(s); if (d && d.p) return d; } } catch (e) {}
    return { p: {}, h: [] };
  }
  function guardar() { try { localStorage.setItem(CLAVE, JSON.stringify(prog)); } catch (e) {} }
  function registrar(id, acierto) {
    var r = prog.p[id] || { v: 0, a: 0, f: 0, c: 0 };
    r.v++;
    if (acierto) { r.a++; r.c = Math.min((r.c || 0) + 1, 5); } else { r.f++; r.c = 0; }
    r.u = acierto ? 1 : 0;
    r.t = Date.now();
    prog.p[id] = r;
    guardar();
  }
  function fallosPendientes() {
    return B.preguntas.filter(function (p) { var r = prog.p[p.id]; return r && r.u === 0; });
  }
  function resumen(lista) {
    var vistas = 0, aciertos = 0, intentos = 0;
    lista.forEach(function (p) {
      var r = prog.p[p.id];
      if (r) { vistas++; aciertos += r.a; intentos += r.v; }
    });
    return { total: lista.length, vistas: vistas, acierto: pct(aciertos, intentos) };
  }
  function delBloque(id) { return B.preguntas.filter(function (p) { return p.bloque_id === id; }); }

  /* ---------- tema claro / oscuro ---------- */
  function aplicarTema() {
    var t = null;
    try { t = localStorage.getItem("ldl:tema"); } catch (e) {}
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    else document.documentElement.removeAttribute("data-theme");
    return t || "auto";
  }
  function cambiarTema() {
    var orden = { auto: "light", light: "dark", dark: "auto" };
    var actual = aplicarTema();
    try { localStorage.setItem("ldl:tema", orden[actual]); } catch (e) {}
    aplicarTema();
    pintar();
  }

  /* ---------- sesiones ---------- */
  function empezar(tipo, preguntas, opciones) {
    opciones = opciones || {};
    if (!preguntas.length) return;
    pararReloj();
    sesion = {
      tipo: tipo, titulo: opciones.titulo || "Test", ids: preguntas.map(function (p) { return p.id; }),
      i: 0, resp: {}, corregida: {}, inicio: Date.now(), limite: opciones.minutos ? opciones.minutos * 60 : 0, fin: null,
      origen: vista === "test" || vista === "resultado" ? (sesion && sesion.origen) || "inicio" : vista
    };
    vista = "test";
    if (sesion.limite) reloj = setInterval(tic, 1000);
    pintar();
    window.scrollTo(0, 0);
  }
  function tic() {
    if (!sesion || sesion.fin) return pararReloj();
    var el = document.getElementById("ldl-crono");
    var resta = sesion.limite - Math.floor((Date.now() - sesion.inicio) / 1000);
    if (resta <= 0) { terminar(); return; }
    if (el) el.textContent = mmss(resta);
  }
  function pararReloj() { if (reloj) { clearInterval(reloj); reloj = null; } }
  function mmss(s) { var m = Math.floor(s / 60), r = s % 60; return m + ":" + (r < 10 ? "0" : "") + r; }

  function responder(letra) {
    var id = sesion.ids[sesion.i];
    if (sesion.tipo === "simulacro") {
      sesion.resp[id] = sesion.resp[id] === letra ? undefined : letra;
      pintar();
      return;
    }
    if (sesion.corregida[id]) return;
    sesion.resp[id] = letra;
    sesion.corregida[id] = true;
    registrar(id, letra === POR_ID[id].correcta);
    pintar();
  }
  function siguiente() {
    if (sesion.i < sesion.ids.length - 1) { sesion.i++; pintar(); window.scrollTo(0, 0); }
    else terminar();
  }
  function anterior() { if (sesion.i > 0) { sesion.i--; pintar(); } }
  function terminar() {
    pararReloj();
    if (sesion.tipo === "simulacro") {
      sesion.ids.forEach(function (id) {
        if (sesion.resp[id]) registrar(id, sesion.resp[id] === POR_ID[id].correcta);
      });
    }
    sesion.fin = Date.now();
    var r = calcular(sesion);
    prog.h.unshift({ t: sesion.fin, tipo: sesion.tipo, n: r.total, a: r.aciertos, e: r.errores, nota: r.nota });
    prog.h = prog.h.slice(0, 50);
    guardar();
    vista = "resultado";
    pintar();
    window.scrollTo(0, 0);
  }
  function calcular(s) {
    var a = 0, e = 0, nr = 0;
    s.ids.forEach(function (id) {
      var r = s.resp[id];
      if (!r) nr++; else if (r === POR_ID[id].correcta) a++; else e++;
    });
    var pen = (CFG.simulacro && CFG.simulacro.penalizacion) || 1 / 3;
    var neta = s.tipo === "simulacro" ? a - e * pen : a;
    var nota = Math.max(0, (neta / s.ids.length) * 10);
    return { total: s.ids.length, aciertos: a, errores: e, blancos: nr, neta: neta, nota: Math.round(nota * 100) / 100 };
  }

  /* ---------- vistas ---------- */
  function cabecera() {
    var tema = aplicarTema();
    var etiquetas = { auto: "Tema: auto", light: "Tema: claro", dark: "Tema: oscuro" };
    return '<header class="ldl-top"><a class="ldl-brand" href="' + esc(CFG.web || "#") + '">' +
      '<span class="ldl-logo" aria-hidden="true">§</span><span><b>Letra de Ley</b><small>' +
      esc(CFG.pack.nombre) + "</small></span></a>" +
      '<button class="ldl-tema" data-acc="tema" type="button">' + etiquetas[tema] + "</button></header>";
  }
  function navegacion() {
    if (CFG.modo === "web") return "";
    var items = [["inicio", "Inicio"], ["temas", "Por temas"], ["simulacro", "Simulacro"], ["fallos", "Fallos"], ["stats", "Estadísticas"]];
    return '<nav class="ldl-nav" aria-label="Secciones">' + items.map(function (it) {
      var actual = vista === it[0] || (vista === "test" && sesion && sesion.origen === it[0]);
      return '<button type="button" data-acc="ir" data-v="' + it[0] + '"' + (actual ? ' aria-current="page"' : "") + ">" + it[1] + "</button>";
    }).join("") + "</nav>";
  }
  function pie() {
    return '<p class="ldl-pie">Letra de Ley · ' + esc(CFG.pack.edicion) + " · Texto legal actualizado a " +
      esc(CFG.pack.actualizado) + "<br>Uso personal. Prohibida su redistribución.</p>";
  }

  function vInicio() {
    var r = resumen(B.preguntas), f = fallosPendientes().length;
    return '<section class="ldl-card"><h2>' + esc(CFG.pack.nombre) + "</h2>" +
      '<p class="ldl-muted">' + B.preguntas.length + " preguntas comentadas, con el artículo exacto de cada respuesta.</p>" +
      '<div class="ldl-kpis"><div class="ldl-kpi"><b>' + r.vistas + "/" + r.total + "</b><span>respondidas</span></div>" +
      '<div class="ldl-kpi"><b>' + r.acierto + ' %</b><span>de acierto</span></div>' +
      '<div class="ldl-kpi"><b>' + f + "</b><span>fallos por repasar</span></div></div>" +
      '<div class="ldl-acciones"><button class="ldl-btn" data-acc="rapido" type="button">Test rápido de 20</button>' +
      '<button class="ldl-btn sec" data-acc="ir" data-v="simulacro" type="button">Simulacro de examen</button>' +
      (f ? '<button class="ldl-btn sec" data-acc="repasar" type="button">Repasar ' + f + " fallos</button>" : "") +
      "</div></section>" +
      '<section class="ldl-card"><h3>Cómo sacarle partido</h3><ol class="ldl-muted">' +
      "<li>Practica <b>por temas</b>: cada respuesta te enseña el artículo y por qué fallan las demás opciones.</li>" +
      "<li>Cada pocos días, <b>repasa tus fallos</b>: es donde más se aprende.</li>" +
      "<li>Antes del examen, haz <b>simulacros</b> con tiempo y con la penalización real (cada error resta 1/3).</li></ol>" +
      '<p class="ldl-small ldl-muted">Tu progreso se guarda en este dispositivo y en este navegador.</p></section>' + historial();
  }
  function historial() {
    if (!prog.h.length) return "";
    return '<section class="ldl-card"><h3>Últimos tests</h3><ul class="ldl-revision">' + prog.h.slice(0, 5).map(function (h) {
      var d = new Date(h.t);
      return "<li><b>" + (h.tipo === "simulacro" ? "Simulacro" : "Práctica") + "</b> · " + d.toLocaleDateString("es-ES") +
        " · " + h.a + "/" + h.n + " aciertos" + (h.tipo === "simulacro" ? " · nota " + num(h.nota) : "") + "</li>";
    }).join("") + "</ul></section>";
  }
  function vTemas() {
    var html = '<section class="ldl-card"><h2>Practicar por temas</h2><p class="ldl-muted">Elige un bloque. Las preguntas salen en orden aleatorio y se corrigen al momento.</p><ul class="ldl-bloques">';
    B.bloques.forEach(function (b) {
      var lista = delBloque(b.id), r = resumen(lista);
      html += '<li><button type="button" data-acc="bloque" data-id="' + esc(b.id) + '"><span class="t">' + esc(b.nombre) +
        '</span><span class="n">' + r.vistas + "/" + r.total + (r.vistas ? " · " + r.acierto + " %" : "") + "</span>" +
        '<span class="ldl-barra"><i style="width:' + pct(r.vistas, r.total) + '%"></i></span></button></li>';
    });
    return html + "</ul></section>";
  }
  function vSimulacro() {
    var total = B.preguntas.length;
    var opcionesN = [10, 20, 30, 50, 100].filter(function (n) { return n < total; });
    opcionesN.push(total);
    var porDefecto = Math.min((CFG.simulacro && CFG.simulacro.preguntas) || 30, total);
    return '<section class="ldl-card"><h2>Simulacro de examen</h2>' +
      '<p class="ldl-muted">Como el día del examen: no ves las soluciones hasta el final y cada error resta un tercio de acierto.</p>' +
      '<div class="ldl-campo"><label for="ldl-n">Número de preguntas</label><select id="ldl-n">' +
      opcionesN.map(function (n) { return "<option" + (n === porDefecto ? " selected" : "") + ">" + n + "</option>"; }).join("") +
      '</select></div><div class="ldl-campo"><label for="ldl-t">Tiempo</label><select id="ldl-t">' +
      '<option value="1">1 minuto por pregunta</option><option value="0">Sin límite de tiempo</option></select></div>' +
      '<div class="ldl-campo"><label for="ldl-b">Temas</label><select id="ldl-b"><option value="">Todos</option>' +
      B.bloques.map(function (b) { return '<option value="' + esc(b.id) + '">' + esc(b.nombre) + "</option>"; }).join("") +
      '</select></div><div class="ldl-acciones"><button class="ldl-btn" data-acc="simular" type="button">Empezar simulacro</button></div></section>';
  }
  function vFallos() {
    var f = fallosPendientes();
    if (!f.length) {
      return '<section class="ldl-card"><h2>Repaso de fallos</h2><p class="ldl-muted">No tienes fallos pendientes. Cuando falles una pregunta aparecerá aquí hasta que la aciertes.</p></section>';
    }
    return '<section class="ldl-card"><h2>Repaso de fallos</h2><p class="ldl-muted">Tienes <b>' + f.length +
      "</b> preguntas falladas. Salen de aquí en cuanto las aciertas.</p>" +
      '<div class="ldl-acciones"><button class="ldl-btn" data-acc="repasar" type="button">Repasar ahora</button></div></section>';
  }
  function vStats() {
    var html = '<section class="ldl-card"><h2>Estadísticas</h2><ul class="ldl-bloques">';
    B.bloques.forEach(function (b) {
      var r = resumen(delBloque(b.id));
      html += '<li><button type="button" data-acc="bloque" data-id="' + esc(b.id) + '"><span class="t">' + esc(b.nombre) +
        '</span><span class="n">' + (r.vistas ? r.acierto + " % de acierto" : "sin empezar") + '</span><span class="ldl-barra"><i style="width:' +
        r.acierto + '%"></i></span></button></li>';
    });
    html += '</ul></section><section class="ldl-card"><h3>Empezar de cero</h3><p class="ldl-muted ldl-small">Borra tu progreso guardado en este dispositivo.</p>' +
      '<div class="ldl-acciones"><button class="ldl-btn sec" data-acc="borrar" type="button">Borrar mi progreso</button></div></section>';
    return html;
  }
  function vPortada() {
    var n = B.preguntas.length;
    return '<section class="ldl-card"><h2>' + esc(CFG.pack.nombre) + "</h2>" +
      '<p class="ldl-muted">' + n + " preguntas tipo examen, corregidas al momento, con el artículo exacto y la explicación de cada opción. Gratis y sin registrarte.</p>" +
      '<div class="ldl-acciones"><button class="ldl-btn" data-acc="empezarweb" type="button">Empezar el test</button></div></section>';
  }

  function vTest() {
    var id = sesion.ids[sesion.i], p = POR_ID[id], sim = sesion.tipo === "simulacro";
    var elegida = sesion.resp[id], corregida = !sim && sesion.corregida[id];
    var html = '<section class="ldl-card"><div class="ldl-meta"><span>' + esc(sesion.titulo) + " · " + (sesion.i + 1) + " de " + sesion.ids.length +
      "</span><span>" + (sesion.limite ? '⏱ <span id="ldl-crono" class="ldl-crono">' +
        mmss(Math.max(0, sesion.limite - Math.floor((Date.now() - sesion.inicio) / 1000))) + "</span>" : esc(p.articulo_txt)) +
      '</span></div><div class="ldl-progreso"><i style="width:' + pct(sesion.i + (corregida ? 1 : 0), sesion.ids.length) + '%"></i></div>' +
      '<p class="ldl-enunciado">' + esc(p.enunciado) + '</p><div class="ldl-opciones" role="group" aria-label="Opciones">';
    LETRAS.forEach(function (l) {
      var cls = "ldl-op";
      if (corregida) { if (l === p.correcta) cls += " ok"; else if (l === elegida) cls += " ko"; }
      else if (sim && elegida === l) cls += " marcada";
      html += '<button type="button" class="' + cls + '" data-acc="resp" data-l="' + l + '"' + (corregida ? " disabled" : "") +
        (sim ? ' aria-pressed="' + (elegida === l) + '"' : "") + '><span class="l">' + l + ")</span><span>" + esc(p.opciones[l]) + "</span></button>";
    });
    html += "</div>";
    if (corregida) html += feedback(p, elegida);
    html += '<div class="ldl-acciones">';
    if (sim) {
      html += (sesion.i > 0 ? '<button class="ldl-btn sec" data-acc="ant" type="button">Anterior</button>' : "") +
        '<button class="ldl-btn" data-acc="sig" type="button">' + (sesion.i < sesion.ids.length - 1 ? "Siguiente" : "Entregar") + "</button>" +
        (sesion.i < sesion.ids.length - 1 ? '<button class="ldl-btn sec" data-acc="entregar" type="button">Entregar ya</button>' : "");
    } else if (corregida) {
      html += '<button class="ldl-btn" data-acc="sig" type="button">' + (sesion.i < sesion.ids.length - 1 ? "Siguiente" : "Ver resultado") + "</button>";
    }
    html += '<button class="ldl-btn sec" data-acc="salir" type="button">Salir</button></div></section>';
    return html;
  }
  function feedback(p, elegida) {
    var bien = elegida === p.correcta;
    return '<div class="ldl-feedback" aria-live="polite"><div class="v ' + (bien ? "ok" : "ko") + '">' +
      (bien ? "¡Correcta!" : "Incorrecta. La respuesta correcta es la " + p.correcta + ")") + "</div><div>" + esc(p.explicacion) + "</div>" +
      (p.cita ? '<blockquote class="ldl-cita">' + esc(p.cita) + "<small>" + esc(p.articulo_txt) + "</small></blockquote>" : "") + "</div>";
  }
  function vResultado() {
    var r = calcular(sesion), sim = sesion.tipo === "simulacro";
    var html = '<section class="ldl-card"><h2>' + (sim ? "Resultado del simulacro" : "Resultado") + "</h2>" +
      '<div class="ldl-nota">' + (sim ? num(r.nota.toFixed(2)) : r.aciertos + "/" + r.total) + "</div>" +
      '<p class="ldl-muted">' + plural(r.aciertos, "acierto", "aciertos") + " · " + plural(r.errores, "error", "errores") +
      (r.blancos ? " · " + r.blancos + " en blanco" : "") +
      (sim ? " · nota sobre 10 con penalización" : "") + "</p>";
    if (CFG.modo === "web") html += ctaWeb(r);
    html += '<div class="ldl-acciones">' + (CFG.modo === "web" ? '<button class="ldl-btn sec" data-acc="empezarweb" type="button">Repetir con otro orden</button>' :
      '<button class="ldl-btn" data-acc="ir" data-v="inicio" type="button">Volver al inicio</button>') + "</div></section>";
    html += '<section class="ldl-card"><h3>Revisión</h3><ul class="ldl-revision">';
    sesion.ids.forEach(function (id, n) {
      var p = POR_ID[id], e = sesion.resp[id], chip = !e ? '<span class="ldl-chip nr">En blanco</span>' :
        e === p.correcta ? '<span class="ldl-chip ok">Bien</span>' : '<span class="ldl-chip ko">Mal</span>';
      html += "<li>" + chip + '<span class="e">' + (n + 1) + ". " + esc(p.enunciado) + "</span><br>" +
        '<span class="ldl-small">Correcta: <b>' + p.correcta + ") " + esc(p.opciones[p.correcta]) + "</b>" +
        (e && e !== p.correcta ? " · Marcaste " + e + ")" : "") + '</span><br><span class="ldl-small ldl-muted">' + esc(p.explicacion) + "</span></li>";
    });
    return html + "</ul></section>";
  }
  function ctaWeb() {
    var c = CFG.compra || {}, html = "";
    if (c.url) {
      html += '<div class="ldl-card ldl-cta"><h3>' + esc(c.titulo) + '</h3><p class="ldl-muted">' + esc(c.texto) + "</p>" +
        '<div class="ldl-acciones"><a class="ldl-btn acc" href="' + esc(c.url) + '">' + esc(c.boton) + "</a></div></div>";
    }
    if (CFG.telegram) {
      html += '<p class="ldl-small">¿Quieres un test cada día? <a href="' + esc(CFG.telegram) + '">Únete gratis al canal de Telegram</a>.</p>';
    }
    return html;
  }

  function pintar() {
    var cuerpo;
    if (vista === "test") cuerpo = vTest();
    else if (vista === "resultado") cuerpo = vResultado();
    else if (vista === "portada") cuerpo = vPortada();
    else if (vista === "temas") cuerpo = vTemas();
    else if (vista === "simulacro") cuerpo = vSimulacro();
    else if (vista === "fallos") cuerpo = vFallos();
    else if (vista === "stats") cuerpo = vStats();
    else cuerpo = vInicio();
    raiz.innerHTML = '<div class="ldl">' + cabecera() + navegacion() + "<main>" + cuerpo + "</main>" + pie() + "</div>";
  }

  /* ---------- eventos ---------- */
  raiz.addEventListener("click", function (ev) {
    var el = ev.target.closest("[data-acc]");
    if (!el) return;
    var acc = el.getAttribute("data-acc");
    if (acc === "tema") return cambiarTema();
    if (acc === "ir") { pararReloj(); vista = el.getAttribute("data-v"); sesion = null; pintar(); return; }
    if (acc === "rapido") return empezar("practica", barajar(B.preguntas).slice(0, 20), { titulo: "Test rápido" });
    if (acc === "repasar") return empezar("practica", barajar(fallosPendientes()).slice(0, 30), { titulo: "Repaso de fallos" });
    if (acc === "bloque") {
      var b = B.bloques.filter(function (x) { return x.id === el.getAttribute("data-id"); })[0];
      return empezar("practica", barajar(delBloque(b.id)), { titulo: b.nombre });
    }
    if (acc === "simular") {
      var n = parseInt(document.getElementById("ldl-n").value, 10);
      var conTiempo = document.getElementById("ldl-t").value === "1";
      var bloque = document.getElementById("ldl-b").value;
      var fuente = bloque ? delBloque(bloque) : B.preguntas;
      var elegidas = barajar(fuente).slice(0, n);
      return empezar("simulacro", elegidas, { titulo: "Simulacro", minutos: conTiempo ? elegidas.length : 0 });
    }
    if (acc === "empezarweb") return empezar("practica", barajar(B.preguntas), { titulo: "Test gratuito" });
    if (acc === "resp") return responder(el.getAttribute("data-l"));
    if (acc === "sig") return siguiente();
    if (acc === "ant") return anterior();
    if (acc === "entregar") return terminar();
    if (acc === "salir") { pararReloj(); sesion = null; vista = CFG.modo === "web" ? "portada" : "inicio"; pintar(); return; }
    if (acc === "borrar") {
      if (el.getAttribute("data-confirmar") === "1") { prog = { p: {}, h: [] }; guardar(); pintar(); }
      else { el.setAttribute("data-confirmar", "1"); el.textContent = "Pulsa otra vez para confirmar"; }
    }
  });
  document.addEventListener("keydown", function (ev) {
    if (vista !== "test" || !sesion || ev.altKey || ev.ctrlKey || ev.metaKey) return;
    var k = ev.key.toLowerCase(), mapa = { "1": "a", "2": "b", "3": "c", "4": "d", a: "a", b: "b", c: "c", d: "d" };
    if (mapa[k]) { ev.preventDefault(); responder(mapa[k]); }
    else if (k === "enter" || k === "arrowright") {
      var id = sesion.ids[sesion.i];
      if (sesion.tipo === "simulacro" || sesion.corregida[id]) { ev.preventDefault(); siguiente(); }
    } else if (k === "arrowleft" && sesion.tipo === "simulacro") { ev.preventDefault(); anterior(); }
  });

  pintar();
})();
</script>
</body>
</html>
