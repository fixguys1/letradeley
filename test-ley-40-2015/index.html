rativas · Capítulo II. Deber de colaboración","ley":"L40","nombre":"Título III. Relaciones interadministrativas · Capítulo II. Deber de colaboración"},{"id":"L40|Título III. Relaciones interadministrativas · Capítulo III. Relaciones de cooperación · Sección 1.ª Técnicas de cooperación","ley":"L40","nombre":"Título III. Relaciones interadministrativas · Capítulo III. Relaciones de cooperación · Sección 1.ª Técnicas de cooperación"},{"id":"L40|Título III. Relaciones interadministrativas · Capítulo III. Relaciones de cooperación · Sección 2.ª Técnicas orgánicas de cooperación","ley":"L40","nombre":"Título III. Relaciones interadministrativas · Capítulo III. Relaciones de cooperación · Sección 2.ª Técnicas orgánicas de cooperación"},{"id":"L40|Título III. Relaciones interadministrativas · Capítulo IV. Relaciones electrónicas entre las Administraciones","ley":"L40","nombre":"Título III. Relaciones interadministrativas · Capítulo IV. Relaciones electrónicas entre las Administraciones"}],"preguntas":[{"id":"L40-L1-007","ley":"L40","articulo":"3.1","articulo_txt":"Art. 3.1 Ley 40/2015","bloque_id":"L40|Título Preliminar. Disposiciones generales, principios de actuación y funcionamiento del sector público · Capítulo I. Disposiciones generales","enunciado":"¿Cuál de los siguientes NO figura entre los principios que, según el artículo 3.1 de la Ley 40/2015, deberán respetar las Administraciones Públicas en su actuación y relaciones?","opciones":{"a":"Buena fe, confianza legítima y lealtad institucional.","b":"Simplicidad, claridad y proximidad a los ciudadanos.","c":"Publicidad, gratuidad y celeridad de la actuación administrativa.","d":"Racionalización y agilidad de los procedimientos administrativos y de las actividades materiales de gestión."},"correcta":"c","explicacion":"La opción a) reproduce el art. 3.1.e), la opción b) el art. 3.1.b) y la opción d) el art. 3.1.d). La lista del art. 3.1 recoge la «Participación, objetividad y transparencia de la actuación administrativa» (art. 3.1.c), pero no la publicidad, gratuidad y celeridad.","cita":"«Deberán respetar en su actuación y relaciones los siguientes principios: (…) b) Simplicidad, claridad y proximidad a los ciudadanos. c) Participación, objetividad y transparencia de la actuación administrativa. d) Racionalización y agilidad de los procedimientos administrativos y de las actividades materiales de gestión. e) Buena fe, confianza legítima y lealtad institucional. (…)»","dificultad":2},{"id":"L40-L1-009","ley":"L40","articulo":"4.1","articulo_txt":"Art. 4.1 Ley 40/2015","bloque_id":"L40|Título Preliminar. Disposiciones generales, principios de actuación y funcionamiento del sector público · Capítulo I. Disposiciones generales","enunciado":"Según el artículo 4.1 de la Ley 40/2015, las Administraciones Públicas que, en el ejercicio de sus competencias, establezcan medidas que limiten el ejercicio de derechos individuales o colectivos deberán:","opciones":{"a":"Aplicar el principio de precaución y elegir, entre las posibles, la medida más eficaz.","b":"Aplicar el principio de proporcionalidad y elegir la medida más eficaz.","c":"Aplicar el principio de jerarquía y elegir la medida menos costosa.","d":"Aplicar el principio de proporcionalidad y elegir la medida menos restrictiva."},"correcta":"d","explicacion":"El art. 4.1 obliga a esas Administraciones a «aplicar el principio de proporcionalidad y elegir la medida menos restrictiva», además de motivar su necesidad y justificar su adecuación. Las opciones a), b) y c) cambian el principio aplicable o el criterio de elección de la medida.","cita":"«1. Las Administraciones Públicas que, en el ejercicio de sus respectivas competencias, establezcan medidas que limiten el ejercicio de derechos individuales o colectivos o exijan el cumplimiento de requisitos para el desarrollo de una actividad, deberán aplicar el principio de proporcionalidad y elegir la medida menos restrictiva, motivar su necesidad para la protección del interés público así como justificar su adecuación para lograr los fines que se persiguen, sin que en ningún caso se produzcan diferencias de trato discriminatorias.»","dificultad":2},{"id":"L40-L1-011","ley":"L40","articulo":"5.1","articulo_txt":"Art. 5.1 Ley 40/2015","bloque_id":"L40|Título Preliminar. Disposiciones generales, principios de actuación y funcionamiento del sector público · Capítulo II. De los órganos de las Administraciones Públicas · Sección 1.ª De los órganos administrativos","enunciado":"Según el artículo 5.1 de la Ley 40/2015, tendrán la consideración de órganos administrativos las unidades administrativas:","opciones":{"a":"A las que se atribuyan funciones de carácter material o técnico, o cuya actuación tenga carácter consultivo.","b":"A las que se atribuyan funciones con efectos jurídicos frente a terceros, siempre que tengan personalidad jurídica.","c":"A las que se atribuyan funciones con efectos jurídicos frente a terceros, o cuya actuación sea preceptiva.","d":"A las que se atribuyan funciones de dirección política, o cuya actuación tenga carácter vinculante."},"correcta":"c","explicacion":"El art. 5.1 define como órganos administrativos las unidades «a las que se les atribuyan funciones que tengan efectos jurídicos frente a terceros, o cuya actuación tenga carácter preceptivo». Las funciones materiales o técnicas (opción a) o de dirección política (opción d) no son el criterio legal, y la ley no exige personalidad jurídica (opción b).","cita":"«1. Tendrán la consideración de órganos administrativos las unidades administrativas a las que se les atribuyan funciones que tengan efectos jurídicos frente a terceros, o cuya actuación tenga carácter preceptivo.»","dificultad":1},{"id":"L40-L1-015","ley":"L40","articulo":"6.2","articulo_txt":"Art. 6.2 Ley 40/2015","bloque_id":"L40|Título Preliminar. Disposiciones generales, principios de actuación y funcionamiento del sector público · Capítulo II. De los órganos de las Administraciones Públicas · Sección 1.ª De los órganos administrativos","enunciado":"Según el artículo 6.2 de la Ley 40/2015, el incumplimiento de las instrucciones u órdenes de servicio, respecto de los actos dictados por los órganos administrativos:","opciones":{"a":"Determina por sí solo la nulidad de pleno derecho de los actos dictados por esos órganos.","b":"Determina por sí solo la anulabilidad de los actos así dictados.","c":"No afecta por sí solo a su validez, sin perjuicio de la responsabilidad disciplinaria.","d":"No afecta a su validez ni da lugar, en ningún caso, a responsabilidad disciplinaria."},"correcta":"c","explicacion":"El art. 6.2 dispone que ese incumplimiento «no afecta por sí solo a la validez de los actos dictados por los órganos administrativos, sin perjuicio de la responsabilidad disciplinaria en que se pueda incurrir». No produce por sí solo nulidad (opción a) ni anulabilidad (opción b), y sí puede generar responsabilidad disciplinaria (opción d).","cita":"«2. El incumplimiento de las instrucciones u órdenes de servicio no afecta por sí solo a la validez de los actos dictados por los órganos administrativos, sin perjuicio de la responsabilidad disciplinaria en que se pueda incurrir.»","dificultad":1},{"id":"L40-L1-017","ley":"L40","articulo":"8.1","articulo_txt":"Art. 8.1 Ley 40/2015","bloque_id":"L40|Título Preliminar. Disposiciones generales, principios de actuación y funcionamiento del sector público · Capítulo II. De los órganos de las Administraciones Públicas · Sección 2.ª Competencia","enunciado":"Según el artículo 8.1 de la Ley 40/2015, la competencia es irrenunciable y se ejercerá por los órganos administrativos que la tengan atribuida como propia, salvo los casos de:","opciones":{"a":"Encomienda de gestión o suplencia.","b":"Delegación de firma o suplencia.","c":"Delegación o encomienda de gestión.","d":"Delegación o avocación."},"correcta":"d","explicacion":"El art. 8.1 exceptúa únicamente «los casos de delegación o avocación, cuando se efectúen en los términos previstos en ésta u otras leyes». La encomienda de gestión, la delegación de firma y la suplencia, que aparecen en las opciones a), b) y c), no figuran en esa salvedad.","cita":"«1. La competencia es irrenunciable y se ejercerá por los órganos administrativos que la tengan atribuida como propia, salvo los casos de delegación o avocación, cuando se efectúen en los términos previstos en ésta u otras leyes.»","dificultad":1},{"id":"L40-L1-028","ley":"L40","articulo":"10.2","articulo_txt":"Art. 10.2 Ley 40/2015","bloque_id":"L40|Título Preliminar. Disposiciones generales, principios de actuación y funcionamiento del sector público · Capítulo II. De los órganos de las Administraciones Públicas · Sección 2.ª Competencia","enunciado":"Según el artículo 10.2 de la Ley 40/2015, contra el acuerdo de avocación:","opciones":{"a":"Cabrá recurso de alzada ante el superior jerárquico del órgano que lo adopte.","b":"No cabrá recurso, aunque podrá impugnarse en el que se interponga contra la resolución.","c":"Cabrá recurso potestativo de reposición ante el mismo órgano que lo adopte.","d":"No cabrá recurso alguno ni podrá impugnarse en el que se interponga contra la resolución final."},"correcta":"b","explicacion":"El art. 10.2 dispone: «Contra el acuerdo de avocación no cabrá recurso, aunque podrá impugnarse en el que, en su caso, se interponga contra la resolución del procedimiento». Los recursos de alzada (opción a) y de reposición (opción c), que regula la Ley 39/2015, no proceden contra este acuerdo, y la opción d) niega la posibilidad de impugnarlo con la resolución.","cita":"«Contra el acuerdo de avocación no cabrá recurso, aunque podrá impugnarse en el que, en su caso, se interponga contra la resolución del procedimiento.»","dificultad":2},{"id":"L40-L1-040","ley":"L40","articulo":"15.3","articulo_txt":"Art. 15.3 Ley 40/2015","bloque_id":"L40|Título Preliminar. Disposiciones generales, principios de actuación y funcionamiento del sector público · Capítulo II. De los órganos de las Administraciones Públicas · Sección 3.ª Órganos colegiados de las distintas administraciones públicas · Subsección 1.ª Funcionamiento","enunciado":"Según el artículo 15.3 de la Ley 40/2015, cuando se trate de un órgano colegiado de los previstos en el apartado 2 de ese artículo, la publicidad de su acuerdo de creación y de sus normas de funcionamiento se realizará por:","opciones":{"a":"La Administración a quien corresponda la Presidencia.","b":"La Administración a quien corresponda la Secretaría.","c":"Cada una de las Administraciones representadas.","d":"La Administración General del Estado, en todo caso."},"correcta":"a","explicacion":"El art. 15.3 dispone que, en ese caso, «la citada publicidad se realizará por la Administración a quien corresponda la Presidencia». No corresponde a la Administración que ejerza la Secretaría (opción b), ni a todas las representadas (opción c), ni siempre a la Administración General del Estado (opción d).","cita":"«Cuando se trate de un órgano colegiado a los que se refiere el apartado 2 de este artículo la citada publicidad se realizará por la Administración a quien corresponda la Presidencia.»","dificultad":3},{"id":"L40-L1-043","ley":"L40","articulo":"17.2","articulo_txt":"Art. 17.2 Ley 40/2015","bloque_id":"L40|Título Preliminar. Disposiciones generales, principios de actuación y funcionamiento del sector público · Capítulo II. De los órganos de las Administraciones Públicas · Sección 3.ª Órganos colegiados de las distintas administraciones públicas · Subsección 1.ª Funcionamiento","enunciado":"Según el artículo 17.2 de la Ley 40/2015, para la válida constitución del órgano colegiado, a efectos de la celebración de sesiones, deliberaciones y toma de acuerdos, se requerirá la asistencia del Presidente y del Secretario, o de quienes les suplan, y la de:","opciones":{"a":"La mitad, al menos, de sus miembros.","b":"Dos tercios, al menos, de sus miembros.","c":"Un tercio, al menos, de sus miembros.","d":"Las tres cuartas partes de sus miembros."},"correcta":"a","explicacion":"El art. 17.2 exige, además del Presidente y del Secretario o de quienes les suplan, la asistencia de «la mitad, al menos, de sus miembros». Las opciones b), c) y d) alteran la proporción de miembros que exige la ley.","cita":"«2. Para la válida constitución del órgano, a efectos de la celebración de sesiones, deliberaciones y toma de acuerdos, se requerirá la asistencia, presencial o a distancia, del Presidente y Secretario o en su caso, de quienes les suplan, y la de la mitad, al menos, de sus miembros.»","dificultad":2},{"id":"L40-L2-004","ley":"L40","articulo":"19.4.a)","articulo_txt":"Art. 19.4.a) Ley 40/2015","bloque_id":"L40|Título Preliminar. Disposiciones generales, principios de actuación y funcionamiento del sector público · Capítulo II. De los órganos de las Administraciones Públicas · Sección 3.ª Órganos colegiados de las distintas administraciones públicas · Subsección 2.ª De los órganos colegiados en la Administración General del Estado","enunciado":"Según el artículo 19.4 de la Ley 40/2015, el Secretario de un órgano colegiado de la Administración General del Estado asistirá a las reuniones:","opciones":{"a":"Con voz y voto en todo caso, en las mismas condiciones que los demás miembros del órgano.","b":"Sin voz ni voto, salvo que el Presidente le conceda la palabra durante la sesión.","c":"Con voz pero sin voto, y con voz y voto si la Secretaría la ostenta un miembro del órgano.","d":"Con voz pero sin voto en todo caso, aunque la Secretaría la ostente un miembro del órgano."},"correcta":"c","explicacion":"Corresponde al Secretario, según el art. 19.4.a), «Asistir a las reuniones con voz pero sin voto, y con voz y voto si la Secretaría del órgano la ostenta un miembro del mismo». La opción a) le reconoce siempre el voto, la opción b) le niega la voz y la opción d) ignora el supuesto en que la Secretaría la ostenta un miembro.","cita":"«a) Asistir a las reuniones con voz pero sin voto, y con voz y voto si la Secretaría del órgano la ostenta un miembro del mismo.»","dificultad":1},{"id":"L40-L2-009","ley":"L40","articulo":"22.3","articulo_txt":"Art. 22.3 Ley 40/2015","bloque_id":"L40|Título Preliminar. Disposiciones generales, principios de actuación y funcionamiento del sector público · Capítulo II. De los órganos de las Administraciones Públicas · Sección 3.ª Órganos colegiados de las distintas administraciones públicas · Subsección 2.ª De los órganos colegiados en la Administración General del Estado","enunciado":"Según el artículo 22.3 de la Ley 40/2015, los órganos colegiados que tienen el carácter de grupos o comisiones de trabajo:","opciones":{"a":"Adoptan acuerdos con efectos frente a terceros desde su publicación oficial.","b":"Adoptan acuerdos que no podrán tener efectos directos frente a terceros.","c":"Adoptan acuerdos con efectos frente a terceros si los ratifica el Ministro.","d":"Adoptan acuerdos con efectos directos frente a terceros si son unánimes."},"correcta":"b","explicacion":"El art. 22.3 establece que los acuerdos de los grupos o comisiones de trabajo «no podrán tener efectos directos frente a terceros», sin excepción alguna. Por eso son falsas la publicación (opción a), la ratificación ministerial (opción c) y la unanimidad (opción d).","cita":"«3. En todos los supuestos no comprendidos en el apartado 1 de este artículo, los órganos colegiados tendrán el carácter de grupos o comisiones de trabajo y podrán ser creados por Acuerdo del Consejo de Ministros o por los Ministerios interesados. Sus acuerdos no podrán tener efectos directos frente a terceros.»","dificultad":1},{"id":"L40-L2-016","ley":"L40","articulo":"24.4","articulo_txt":"Art. 24.4 Ley 40/2015","bloque_id":"L40|Título Preliminar. Disposiciones generales, principios de actuación y funcionamiento del sector público · Capítulo II. De los órganos de las Administraciones Públicas · Sección 4.ª Abstención y recusación","enunciado":"Según el artículo 24.4 de la Ley 40/2015, si el recusado niega la causa de recusación, el superior resolverá en el plazo de:","opciones":{"a":"Cinco días, previos los informes y comprobaciones que considere oportunos.","b":"Diez días, previos los informes y comprobaciones que considere oportunos.","c":"Tres días, previos los informes y comprobaciones que considere oportunos.","d":"Quince días, previos los informes y comprobaciones que considere oportunos."},"correcta":"c","explicacion":"El art. 24.4 establece que, si el recusado niega la causa, «el superior resolverá en el plazo de tres días, previos los informes y comprobaciones que considere oportunos». Los plazos de las opciones a), b) y d) no son los del precepto.","cita":"«4. Si el recusado niega la causa de recusación, el superior resolverá en el plazo de tres días, previos los informes y comprobaciones que considere oportunos.»","dificultad":2},{"id":"L40-L2-032","ley":"L40","articulo":"30.2","articulo_txt":"Art. 30.2 Ley 40/2015","bloque_id":"L40|Título Preliminar. Disposiciones generales, principios de actuación y funcionamiento del sector público · Capítulo III. Principios de la potestad sancionadora","enunciado":"Según el artículo 30.2 de la Ley 40/2015, interrumpida la prescripción de la infracción por la iniciación, con conocimiento del interesado, del procedimiento sancionador, el plazo se reiniciará si el expediente estuviera paralizado:","opciones":{"a":"Durante más de tres meses por causa no imputable al presunto responsable.","b":"Durante más de quince días por causa no imputable al presunto responsable.","c":"Durante más de un mes por causa no imputable al presunto responsable.","d":"Durante más de un mes, aunque la causa sea imputable al presunto responsable."},"correcta":"c","explicacion":"El art. 30.2 prevé que se reinicie el plazo «si el expediente sancionador estuviera paralizado durante más de un mes por causa no imputable al presunto responsable». Las opciones a) y b) cambian el plazo y la opción d) prescinde del requisito de que la causa no sea imputable al presunto responsable.","cita":"«Interrumpirá la prescripción la iniciación, con conocimiento del interesado, de un procedimiento administrativo de naturaleza sancionadora, reiniciándose el plazo de prescripción si el expediente sancionador estuviera paralizado durante más de un mes por causa no imputable al presunto responsable.»","dificultad":2},{"id":"L40-L2-039","ley":"L40","articulo":"33.1","articulo_txt":"Art. 33.1 Ley 40/2015","bloque_id":"L40|Título Preliminar. Disposiciones generales, principios de actuación y funcionamiento del sector público · Capítulo IV. De la responsabilidad patrimonial de las Administraciones Públicas · Sección 1.ª Responsabilidad patrimonial de las Administraciones Públicas","enunciado":"Según el artículo 33.1 de la Ley 40/2015, cuando de la gestión dimanante de fórmulas conjuntas de actuación entre varias Administraciones públicas se derive responsabilidad, las Administraciones intervinientes responderán frente al particular:","opciones":{"a":"En todo caso, de forma solidaria.","b":"De forma mancomunada, según su participación.","c":"De forma solidaria, solo si no puede fijarse la de cada una.","d":"De forma subsidiaria respecto de la que gestione el servicio."},"correcta":"a","explicacion":"El art. 33.1 dispone que las Administraciones intervinientes «responderán frente al particular, en todo caso, de forma solidaria», sin perjuicio de que el instrumento regulador distribuya internamente la responsabilidad. La solidaridad condicionada de la opción c) corresponde a los «otros supuestos de concurrencia» del art. 33.2, y las opciones b) y d) no recogen el régimen del precepto.","cita":"«1. Cuando de la gestión dimanante de fórmulas conjuntas de actuación entre varias Administraciones públicas se derive responsabilidad en los términos previstos en la presente Ley, las Administraciones intervinientes responderán frente al particular, en todo caso, de forma solidaria. (…)»","dificultad":2},{"id":"L40-L2-045","ley":"L40","articulo":"36.1","articulo_txt":"Art. 36.1 Ley 40/2015","bloque_id":"L40|Título Preliminar. Disposiciones generales, principios de actuación y funcionamiento del sector público · Capítulo IV. De la responsabilidad patrimonial de las Administraciones Públicas · Sección 2.ª Responsabilidad de las autoridades y personal al servicio de las Administraciones Públicas","enunciado":"Según el artículo 36.1 de la Ley 40/2015, para hacer efectiva la responsabilidad patrimonial, los particulares exigirán las indemnizaciones por los daños y perjuicios causados por las autoridades y personal al servicio de las Administraciones:","opciones":{"a":"Directamente a la autoridad o empleado público causante.","b":"A la Administración, solo si el causante resulta insolvente.","c":"Conjuntamente a la Administración y al causante del daño.","d":"Directamente a la Administración Pública correspondiente."},"correcta":"d","explicacion":"El art. 36.1 dispone que «los particulares exigirán directamente a la Administración Pública correspondiente las indemnizaciones por los daños y perjuicios causados por las autoridades y personal a su servicio». La reclamación no se dirige al causante (opciones a y c) ni la responsabilidad de la Administración es subsidiaria (opción b).","cita":"«1. Para hacer efectiva la responsabilidad patrimonial a que se refiere esta Ley, los particulares exigirán directamente a la Administración Pública correspondiente las indemnizaciones por los daños y perjuicios causados por las autoridades y personal a su servicio.»","dificultad":1},{"id":"L40-L3-019","ley":"L40","articulo":"45.2","articulo_txt":"Art. 45.2 Ley 40/2015","bloque_id":"L40|Título Preliminar. Disposiciones generales, principios de actuación y funcionamiento del sector público · Capítulo V. Funcionamiento electrónico del sector público","enunciado":"Según el artículo 45.2 de la Ley 40/2015, cuando una Administración utilice sistemas de firma electrónica distintos de los basados en certificado electrónico reconocido o cualificado para remitir a otras Administraciones documentación firmada electrónicamente, con el fin de favorecer la interoperabilidad y posibilitar la verificación automática de la firma:","opciones":{"a":"Deberá superponer un sello electrónico basado en un certificado electrónico reconocido o cualificado.","b":"Podrá superponer un sello electrónico basado en un certificado electrónico reconocido o cualificado.","c":"Deberá sustituir la firma utilizada por un código seguro de verificación vinculado al órgano remitente.","d":"Podrá superponer la firma electrónica avanzada del titular del órgano que remita la documentación."},"correcta":"b","explicacion":"El art. 45.2 establece que la Administración «podrá superponer un sello electrónico basado en un certificado electrónico reconocido o cualificado». La opción a) convierte esa facultad en obligación, y las opciones c) y d) recogen medidas que el precepto no prevé.","cita":"«Con el fin de favorecer la interoperabilidad y posibilitar la verificación automática de la firma electrónica de los documentos electrónicos, cuando una Administración utilice sistemas de firma electrónica distintos de aquellos basados en certificado electrónico reconocido o cualificado, para remitir o poner a disposición de otros órganos, organismos públicos, entidades de Derecho Público o Administraciones la documentación firmada electrónicamente, podrá superponer un sello electrónico basado en un certificado electrónico reconocido o cualificado.»","dificultad":2},{"id":"L40-L3-045","ley":"L40","articulo":"52.1","articulo_txt":"Art. 52.1 Ley 40/2015","bloque_id":"L40|Título Preliminar. Disposiciones generales, principios de actuación y funcionamiento del sector público · Capítulo VI. De los convenios","enunciado":"Según el artículo 52.1 de la Ley 40/2015, el cumplimiento y la resolución de los convenios dará lugar a:","opciones":{"a":"La devolución íntegra de las aportaciones financieras realizadas por cada una de las partes firmantes del convenio.","b":"La indemnización de los perjuicios causados, en todo caso, a la parte que no hubiera dado lugar a la resolución.","c":"La fiscalización de las cuentas del convenio por la Intervención General de cada una de las partes firmantes.","d":"La liquidación de los mismos con el objeto de determinar las obligaciones y compromisos de cada una de las partes."},"correcta":"d","explicacion":"El art. 52.1 dispone que el cumplimiento y la resolución darán lugar «a la liquidación de los mismos con el objeto de determinar las obligaciones y compromisos de cada una de las partes». Las opciones a), b) y c) recogen efectos que el precepto no establece; en particular, según el art. 51.2.c), la resolución por incumplimiento solo «podrá conllevar la indemnización de los perjuicios causados si así se hubiera previsto».","cita":"«El cumplimiento y la resolución de los convenios dará lugar a la liquidación de los mismos con el objeto de determinar las obligaciones y compromisos de cada una de las partes.»","dificultad":1},{"id":"L40-L4-003","ley":"L40","articulo":"54.1","articulo_txt":"Art. 54.1 Ley 40/2015","bloque_id":"L40|Título I. Administración General del Estado · Capítulo I. Organización administrativa","enunciado":"Según el artículo 54.1 de la Ley 40/2015, la Administración General del Estado garantizará el principio de presencia equilibrada de mujeres y hombres en los nombramientos y designaciones de las personas titulares de los órganos superiores y directivos y, además, en:","opciones":{"a":"Las jefaturas de las unidades administrativas de los Ministerios.","b":"Los puestos de libre designación de nivel inferior a Subdirección General.","c":"El personal de alta dirección de las entidades del sector público institucional estatal.","d":"Los órganos de cooperación con las Comunidades Autónomas."},"correcta":"c","explicacion":"El segundo párrafo del art. 54.1, en la redacción dada por el art. 8.1 de la Ley Orgánica 2/2024, de 1 de agosto, extiende esa garantía al «personal de alta dirección de las entidades del sector público institucional estatal», de acuerdo con los artículos 55 bis y 84 bis. Las opciones a), b) y d) no aparecen en el precepto.","cita":"«Asimismo, garantizará el principio de presencia equilibrada de mujeres y hombres en los nombramientos y designaciones de las personas titulares de los órganos superiores y directivos y en el personal de alta dirección de las entidades del sector público institucional estatal, de acuerdo con lo establecido en los artículos 55 bis y 84 bis.»","dificultad":2},{"id":"L40-L4-026","ley":"L40","articulo":"61","articulo_txt":"Art. 61 Ley 40/2015","bloque_id":"L40|Título I. Administración General del Estado · Capítulo II. Los Ministerios y su estructura interna","enunciado":"Según el artículo 61 de la Ley 40/2015, ¿cuál de las siguientes funciones NO corresponde a los Ministros?","opciones":{"a":"Ejercer la potestad reglamentaria en las materias propias de su Departamento.","b":"Convocar las Conferencias sectoriales en el ámbito de las competencias atribuidas a su Departamento.","c":"Revisar de oficio los actos administrativos y resolver los conflictos de atribuciones cuando les corresponda.","d":"Ostentar la representación ordinaria del Ministerio."},"correcta":"d","explicacion":"La representación ordinaria del Ministerio no figura entre las funciones del art. 61: el art. 63.1 dispone que «Los Subsecretarios ostentan la representación ordinaria del Ministerio». El art. 61.m) solo atribuye a los Ministros decidir la representación del Ministerio en los órganos colegiados o grupos de trabajo en los que no esté previamente determinado quién debe representarlo, lo que no equivale a ostentar la representación ordinaria. Las funciones de las opciones a), b) y c) corresponden a los Ministros según el art. 61.a), h) y j).","cita":"«a) Ejercer la potestad reglamentaria en las materias propias de su Departamento. (…) h) Mantener las relaciones con las Comunidades Autónomas y convocar las Conferencias sectoriales y los órganos de cooperación en el ámbito de las competencias atribuidas a su Departamento. (…) j) Revisar de oficio los actos administrativos y resolver los conflictos de atribuciones cuando les corresponda, así como plantear los que procedan con otros Ministerios.»","dificultad":2},{"id":"L40-L5-005","ley":"L40","articulo":"71.2","articulo_txt":"Art. 71.2 Ley 40/2015","bloque_id":"L40|Título I. Administración General del Estado · Capítulo III. Órganos territoriales · Sección 1.ª La organización territorial de la Administración General del Estado","enunciado":"Según el artículo 71.2 de la Ley 40/2015, cuando afecte a órganos inferiores a la Subdirección General, la organización de los servicios territoriales no integrados en las Delegaciones del Gobierno se establecerá:","opciones":{"a":"Por Real Decreto aprobado a propuesta conjunta de dos Ministerios.","b":"Por Orden conjunta.","c":"Por resolución del Delegado del Gobierno en la Comunidad Autónoma.","d":"Por acuerdo de la Comisión interministerial de coordinación de la Administración periférica del Estado."},"correcta":"b","explicacion":"El art. 71.2 exige Real Decreto a propuesta conjunta del titular del Ministerio del que dependan y del titular del Ministerio competente en estructuras organizativas cuando la organización «contemple unidades con nivel de Subdirección General o equivalentes, o por Orden conjunta cuando afecte a órganos inferiores». La opción a) es el instrumento previsto para las unidades con nivel de Subdirección General o equivalentes, y la opción c) y la opción d) atribuyen la decisión a órganos que el precepto no menciona.","cita":"«2. La organización de los servicios territoriales no integrados en las Delegaciones del Gobierno se establecerá mediante Real Decreto a propuesta conjunta del titular del Ministerio del que dependan y del titular del Ministerio que tenga atribuida la competencia para la racionalización, análisis y evaluación de las estructuras organizativas de la Administración General del Estado y sus organismos públicos, cuando contemple unidades con nivel de Subdirección General o equivalentes, o por Orden conjunta cuando afecte a órganos inferiores.»","dificultad":2},{"id":"L40-L5-011","ley":"L40","articulo":"73.1.a)","articulo_txt":"Art. 73.1.a) Ley 40/2015","bloque_id":"L40|Título I. Administración General del Estado · Capítulo III. Órganos territoriales · Sección 2.ª Los Delegados del Gobierno en las Comunidades Autónomas","enunciado":"Según el artículo 73.1.a) de la Ley 40/2015, respecto de las propuestas de nombramiento de los titulares de órganos territoriales de la Administración General del Estado y de los Organismos públicos estatales de ámbito autonómico y provincial, corresponde al Delegado del Gobierno:","opciones":{"a":"Informarlas con carácter facultativo, cuando lo solicite el Ministerio del que dependan.","b":"Informarlas con carácter preceptivo.","c":"Aprobarlas, previo informe del Ministerio competente por razón de la materia.","d":"Elevarlas al Consejo de Ministros, junto con el informe de la Comisión territorial de asistencia."},"correcta":"b","explicacion":"El art. 73.1.a).3.º atribuye a los Delegados la competencia de «Informar, con carácter preceptivo, las propuestas de nombramiento de los titulares de órganos territoriales». La opción a) convierte el informe en facultativo, y la opción c) y la opción d) atribuyen al Delegado facultades de decisión o elevación que el precepto no recoge.","cita":"«3.º Informar, con carácter preceptivo, las propuestas de nombramiento de los titulares de órganos territoriales de la Administración General del Estado y los Organismos públicos estatales de ámbito autonómico y provincial en la Delegación del Gobierno.»","dificultad":2},{"id":"L40-L5-015","ley":"L40","articulo":"74","articulo_txt":"Art. 74 Ley 40/2015","bloque_id":"L40|Título I. Administración General del Estado · Capítulo III. Órganos territoriales · Sección 3.ª Los Subdelegados del Gobierno en las provincias","enunciado":"Según el artículo 74 de la Ley 40/2015, el Subdelegado del Gobierno en cada provincia será nombrado:","opciones":{"a":"Por Real Decreto del Consejo de Ministros, entre funcionarios de carrera del Estado pertenecientes a Cuerpos o Escalas clasificados como Subgrupo A1.","b":"Por el Ministro de Hacienda y Administraciones Públicas, a propuesta del Delegado del Gobierno, entre funcionarios de carrera del Estado, de las Comunidades Autónomas o de las Entidades Locales.","c":"Por el Delegado del Gobierno, mediante concurso entre funcionarios de carrera del Estado pertenecientes a Cuerpos o Escalas clasificados como Subgrupo A1 o A2.","d":"Por el Delegado del Gobierno, mediante libre designación entre funcionarios de carrera del Estado, de las Comunidades Autónomas o de las Entidades Locales, pertenecientes a Cuerpos o Escalas clasificados como Subgrupo A1."},"correcta":"d","explicacion":"El art. 74 dispone que el Subdelegado «será nombrado por aquél», es decir, por el Delegado del Gobierno, «mediante el procedimiento de libre designación entre funcionarios de carrera del Estado, de las Comunidades Autónomas o de las Entidades Locales, pertenecientes a Cuerpos o Escalas clasificados como Subgrupo A1». La opción a) y la opción b) cambian el órgano que nombra, y la opción c) cambia el procedimiento y amplía el subgrupo. «Ministerio de Hacienda y Administraciones Públicas» es la denominación que conserva el texto consolidado y debe entenderse referida al departamento que hoy tenga atribuidas esas competencias.","cita":"«En cada provincia y bajo la inmediata dependencia del Delegado del Gobierno en la respectiva Comunidad Autónoma, existirá un Subdelegado del Gobierno, con nivel de Subdirector General, que será nombrado por aquél mediante el procedimiento de libre designación entre funcionarios de carrera del Estado, de las Comunidades Autónomas o de las Entidades Locales, pertenecientes a Cuerpos o Escalas clasificados como Subgrupo A1.»","dificultad":2},{"id":"L40-L5-021","ley":"L40","articulo":"77","articulo_txt":"Art. 77 Ley 40/2015","bloque_id":"L40|Título I. Administración General del Estado · Capítulo III. Órganos territoriales · Sección 4.ª La estructura de las delegaciones del gobierno","enunciado":"Según el artículo 77 de la Ley 40/2015, la asistencia jurídica y las funciones de intervención y control económico financiero en relación con las Delegaciones y Subdelegaciones del Gobierno se ejercerán, respectivamente, por:","opciones":{"a":"Los servicios jurídicos de la propia Delegación del Gobierno y la Intervención General de la Administración del Estado.","b":"La Abogacía del Estado y el Tribunal de Cuentas.","c":"La Abogacía del Estado y la Intervención General de la Administración del Estado.","d":"La Secretaría General Técnica del Ministerio de Hacienda y Administraciones Públicas y el Tribunal de Cuentas."},"correcta":"c","explicacion":"El art. 77 atribuye esas funciones a «la Abogacía del Estado y la Intervención General de la Administración del Estado respectivamente, de acuerdo con su normativa específica». La opción a) cambia el órgano de asistencia jurídica, la opción b) el de control económico financiero, y la opción d) ambos. «Ministerio de Hacienda y Administraciones Públicas» es la denominación que conserva el texto consolidado y debe entenderse referida al departamento que hoy tenga atribuidas esas competencias.","cita":"«La asistencia jurídica y las funciones de intervención y control económico financiero en relación con las Delegaciones y Subdelegaciones del Gobierno se ejercerán por la Abogacía del Estado y la Intervención General de la Administración del Estado respectivamente, de acuerdo con su normativa específica.»","dificultad":1},{"id":"L40-L5-024","ley":"L40","articulo":"79.1.c)","articulo_txt":"Art. 79.1.c) Ley 40/2015","bloque_id":"L40|Título I. Administración General del Estado · Capítulo III. Órganos territoriales · Sección 5.ª Órganos colegiados","enunciado":"Según el artículo 79.1.c) de la Ley 40/2015, ¿cuál de las siguientes funciones desarrollará, en todo caso, la Comisión territorial de asistencia al Delegado del Gobierno?","opciones":{"a":"Aprobar los planes y programas que hayan de ejecutar los servicios territoriales y los Organismos públicos en la Comunidad Autónoma.","b":"Homogeneizar el desarrollo de las políticas públicas en su ámbito territorial, mediante criterios comunes de actuación.","c":"Resolver los conflictos de atribuciones que se planteen entre los servicios territoriales integrados y no integrados.","d":"Aprobar las propuestas de simplificación administrativa y de racionalización en la utilización de los recursos."},"correcta":"b","explicacion":"El art. 79.1.c).2.º atribuye a la Comisión la función de «Homogeneizar el desarrollo de las políticas públicas en su ámbito territorial». La opción a) y la opción c) recogen funciones que el precepto no le asigna, y la opción d) transforma en aprobación lo que el art. 79.1.c).3.º configura como asesoramiento al Delegado en la elaboración de esas propuestas.","cita":"«2.º Homogeneizar el desarrollo de las políticas públicas en su ámbito territorial, a través del establecimiento de criterios comunes de actuación que habrán de ser compatibles con las instrucciones y objetivos de los respectivos departamentos ministeriales.»","dificultad":2},{"id":"L40-L5-026","ley":"L40","articulo":"80","articulo_txt":"Art. 80 Ley 40/2015","bloque_id":"L40|Título I. Administración General del Estado · Capítulo IV. De la Administración General del Estado en el exterior","enunciado":"Según el artículo 80 de la Ley 40/2015, el Servicio Exterior del Estado se rige, en todo lo concerniente a su composición, organización, funciones, integración y personal:","opciones":{"a":"Por la Ley 40/2015 y, supletoriamente, por la Ley 2/2014, de 25 de marzo, de la Acción y del Servicio Exterior del Estado.","b":"Por la Ley 2/2014, de 25 de marzo, de la Acción y del Servicio Exterior del Estado y su normativa de desarrollo y, supletoriamente, por la Ley 40/2015.","c":"Exclusivamente por la Ley 2/2014, de 25 de marzo, de la Acción y del Servicio Exterior del Estado y su normativa de desarrollo.","d":"Por los tratados internacionales suscritos por España y, supletoriamente, por la Ley 40/2015."},"correcta":"b","explicacion":"El art. 80 remite a «la Ley 2/2014, de 25 de marzo, de la Acción y del Servicio Exterior del Estado y en su normativa de desarrollo y, supletoriamente, por lo dispuesto en esta Ley». La opción a) invierte el orden de aplicación, la opción c) suprime la aplicación supletoria de la Ley 40/2015 y la opción d) sustituye la ley de referencia.","cita":"«El Servicio Exterior del Estado se rige en todo lo concerniente a su composición, organización, funciones, integración y personal por lo dispuesto en la Ley 2/2014, de 25 de marzo, de la Acción y del Servicio Exterior del Estado y en su normativa de desarrollo y, supletoriamente, por lo dispuesto en esta Ley.»","dificultad":1},{"id":"L40-L5-029","ley":"L40","articulo":"81.3","articulo_txt":"Art. 81.3 Ley 40/2015","bloque_id":"L40|Título II. Organización y funcionamiento del sector público institucional · Capítulo I. Del sector público institucional","enunciado":"Según el artículo 81.3 de la Ley 40/2015, los organismos y entidades vinculados o dependientes de la Administración autonómica y local se regirán por las disposiciones básicas de esta ley que les resulten de aplicación y, en particular, por lo dispuesto en:","opciones":{"a":"Los Capítulos I y II y los artículos 129 y 134.","b":"Los Capítulos I y VI y los artículos 120 y 135.","c":"Los Capítulos I y VI y los artículos 129 y 134.","d":"Los Capítulos II y III y los artículos 84 y 85."},"correcta":"c","explicacion":"El art. 81.3, redactado conforme a la corrección de errores publicada en el BOE núm. 306, de 23 de diciembre de 2015, remite en particular a «lo dispuesto en los Capítulos I y VI y en los artículos 129 y 134», además de a la normativa propia de la Administración a la que se adscriban. La opción a), la opción b) y la opción d) alteran los capítulos o los artículos citados.","cita":"«3. Los organismos y entidades vinculados o dependientes de la Administración autonómica y local se regirán por las disposiciones básicas de esta ley que les resulten de aplicación, y en particular, por lo dispuesto en los Capítulos I y VI y en los artículos 129 y 134, así como por la normativa propia de la Administración a la que se adscriban.»","dificultad":3},{"id":"L40-L5-038","ley":"L40","articulo":"84 bis.2","articulo_txt":"Art. 84 bis.2 Ley 40/2015","bloque_id":"L40|Título II. Organización y funcionamiento del sector público institucional · Capítulo II. Organización y funcionamiento del sector público institucional estatal","enunciado":"Según el artículo 84 bis.2 de la Ley 40/2015, el principio de representación equilibrada entre mujeres y hombres se garantizará también en:","opciones":{"a":"Los procesos selectivos del personal laboral y funcionario de las entidades.","b":"La composición de los tribunales de selección de las entidades.","c":"La plantilla de personal funcionario adscrito a las entidades.","d":"La composición de los órganos colegiados de gobierno de las entidades."},"correcta":"d","explicacion":"El art. 84 bis.2 dispone que el principio «se garantizará también en la composición de los órganos colegiados de gobierno de las entidades». La opción a), la opción b) y la opción c) no aparecen en el precepto. El art. 84 bis fue añadido por el art. 8.3 de la Ley Orgánica 2/2024, de 1 de agosto, y el BOE advierte: «Téngase en cuenta para su aplicación lo previsto en la disposición transitoria 1.3 de la citada Ley Orgánica».","cita":"«2. El principio de representación equilibrada se garantizará también en la composición de los órganos colegiados de gobierno de las entidades.»","dificultad":1},{"id":"L40-L6-024","ley":"L40","articulo":"97.1","articulo_txt":"Art. 97.1 Ley 40/2015","bloque_id":"L40|Título II. Organización y funcionamiento del sector público institucional · Capítulo III. De los organismos públicos estatales · Sección 1.ª Disposiciones generales","enunciado":"Según el artículo 97.1 de la Ley 40/2015, publicado el acuerdo de disolución de un organismo público estatal, o transcurridos los plazos establecidos sin que éste haya sido publicado, se entenderá:","opciones":{"a":"Automáticamente iniciada la liquidación.","b":"Producida la extinción del organismo.","c":"Abierto un plazo de alegaciones para los acreedores.","d":"Suspendida su actividad hasta que se apruebe un plan de liquidación."},"correcta":"a","explicacion":"El art. 97.1 dispone que en esos casos «se entenderá automáticamente iniciada la liquidación». La opción b) es falsa porque, según el art. 97.4, la extinción automática se produce una vez formalizada la liquidación; la opción c) y la opción d) no aparecen en el precepto.","cita":"«1. Publicado el acuerdo de disolución al que se refiere el artículo anterior, o transcurridos los plazos en él establecidos sin que éste haya sido publicado, se entenderá automáticamente iniciada la liquidación.»","dificultad":2},{"id":"L40-L6-027","ley":"L40","articulo":"99","articulo_txt":"Art. 99 Ley 40/2015","bloque_id":"L40|Título II. Organización y funcionamiento del sector público institucional · Capítulo III. De los organismos públicos estatales · Sección 2.ª Organismos autónomos estatales","enunciado":"Según el artículo 99 de la Ley 40/2015, en defecto de norma administrativa, a los organismos autónomos se les aplicará:","opciones":{"a":"El Derecho laboral.","b":"El derecho común.","c":"Lo que disponga su Consejo Rector.","d":"La normativa de las sociedades mercantiles estatales."},"correcta":"b","explicacion":"El art. 99, tras enumerar las normas administrativas por las que se rigen los organismos autónomos, dispone: «En defecto de norma administrativa, se aplicará el derecho común.» Las opciones a), c) y d) no son el derecho supletorio que señala el precepto.","cita":"«En defecto de norma administrativa, se aplicará el derecho común.»","dificultad":1},{"id":"L40-L6-041","ley":"L40","articulo":"107.3","articulo_txt":"Art. 107.3 Ley 40/2015","bloque_id":"L40|Título II. Organización y funcionamiento del sector público institucional · Capítulo III. De los organismos públicos estatales · Sección 3.ª Las entidades públicas empresariales de ámbito estatal","enunciado":"Según el artículo 107.3 de la Ley 40/2015, se entiende que las entidades públicas empresariales se financian mayoritariamente con ingresos de mercado cuando:","opciones":{"a":"Sus ingresos comerciales cubran íntegramente sus gastos de personal.","b":"Así lo declare cada año la Intervención General de la Administración del Estado tras auditar sus cuentas.","c":"Así lo certifique el Tribunal de Cuentas tras fiscalizar sus cuentas.","d":"Tengan la consideración de productor de mercado de conformidad con el Sistema Europeo de Cuentas."},"correcta":"d","explicacion":"El art. 107.3, modificado por la disposición final 34.7 de la Ley 11/2020, de 30 de diciembre, dispone: «Se entiende que se financian mayoritariamente con ingresos de mercado cuando tengan la consideración de productor de mercado de conformidad con el Sistema Europeo de Cuentas», tomando en consideración la clasificación del Comité Técnico de Cuentas Nacionales recogida en el Inventario de Entidades. Los criterios de la opción a), la opción b) y la opción c) no figuran en el precepto.","cita":"«Se entiende que se financian mayoritariamente con ingresos de mercado cuando tengan la consideración de productor de mercado de conformidad con el Sistema Europeo de Cuentas.»","dificultad":2},{"id":"L40-L6-058","ley":"L40","articulo":"108 sexies.2","articulo_txt":"Art. 108 sexies.2 Ley 40/2015","bloque_id":"L40|Título II. Organización y funcionamiento del sector público institucional · Capítulo III. De los organismos públicos estatales · Sección 4.ª Agencias estatales","enunciado":"Según el artículo 108 sexies.2 de la Ley 40/2015, el presupuesto de gastos de las agencias estatales tiene carácter:","opciones":{"a":"Limitativo y vinculante en todos sus créditos, cualquiera que sea el nivel de la clasificación económica en que se establezcan.","b":"Limitativo por su importe global y estimativo para la distribución de los créditos en categorías económicas, salvo excepciones.","c":"Estimativo en su totalidad, incluidos los gastos de personal.","d":"Estimativo por su importe global y limitativo para la distribución de los créditos en categorías económicas."},"correcta":"b","explicacion":"El art. 108 sexies.2 atribuye al presupuesto de gastos «carácter limitativo por su importe global y carácter estimativo para la distribución de los créditos en categorías económicas», salvo los gastos de personal, las subvenciones nominativas y las atenciones protocolarias y representativas, que tienen carácter limitativo y vinculante. La opción d) invierte ambos caracteres, la opción a) extiende a todos los créditos lo que solo rige para las excepciones, y la opción c) contradice el carácter limitativo de los gastos de personal.","cita":"«El presupuesto de gastos de las agencias estatales, tiene carácter limitativo por su importe global y carácter estimativo para la distribución de los créditos en categorías económicas, con excepción de los correspondientes a gastos de personal que en todo caso tienen carácter limitativo y vinculante por su cuantía total (…)»","dificultad":3},{"id":"L40-L7-005","ley":"L40","articulo":"110.2","articulo_txt":"Art. 110.2 Ley 40/2015","bloque_id":"L40|Título II. Organización y funcionamiento del sector público institucional · Capítulo IV. Las autoridades administrativas independientes de ámbito estatal","enunciado":"Según el artículo 110.2 de la Ley 40/2015, las autoridades administrativas independientes estarán sujetas al principio de sostenibilidad financiera de acuerdo con lo previsto en:","opciones":{"a":"La Ley 47/2003, de 26 de noviembre.","b":"La Ley Orgánica 2/2012, de 27 de abril.","c":"La Ley 33/2003, de 3 de noviembre.","d":"La Ley 39/2015, de 1 de octubre."},"correcta":"b","explicacion":"El art. 110.2 sujeta estas autoridades al principio de sostenibilidad financiera «de acuerdo con lo previsto en la Ley Orgánica 2/2012, de 27 de abril». Las normas de la opción a), la opción c) y la opción d) figuran en el art. 110.1 entre las normas aplicables supletoriamente, la última como Ley del Procedimiento Administrativo Común de las Administraciones Públicas, pero no son la referencia del principio de sostenibilidad financiera.","cita":"«Las autoridades administrativas independientes estarán sujetas al principio de sostenibilidad financiera de acuerdo con lo previsto en la Ley Orgánica 2/2012, de 27 de abril.»","dificultad":2},{"id":"L40-L7-006","ley":"L40","articulo":"111.1.a)","articulo_txt":"Art. 111.1.a) Ley 40/2015","bloque_id":"L40|Título II. Organización y funcionamiento del sector público institucional · Capítulo V. De las sociedades mercantiles estatales","enunciado":"Según el artículo 111.1.a) de la Ley 40/2015, una sociedad mercantil está sometida a control estatal por razón de su capital cuando la participación directa en él de la Administración General del Estado o de las entidades que integran el sector público institucional estatal supere el umbral de:","opciones":{"a":"El 25 por 100.","b":"Los dos tercios.","c":"El 75 por 100.","d":"El 50 por 100."},"correcta":"d","explicacion":"El art. 111.1.a) exige que esa participación directa «sea superior al 50 por 100». Los umbrales de la opción a), la opción b) y la opción c) no son los del precepto.","cita":"«a) Bien porque la participación directa, en su capital social de la Administración General del Estado o alguna de las entidades que, conforme a lo dispuesto en el artículo 84, integran el sector público institucional estatal, incluidas las sociedades mercantiles estatales, sea superior al 50 por 100.»","dificultad":2},{"id":"L40-L7-032","ley":"L40","articulo":"126.1","articulo_txt":"Art. 126.1 Ley 40/2015","bloque_id":"L40|Título II. Organización y funcionamiento del sector público institucional · Capítulo VI. De los consorcios","enunciado":"Según el artículo 126.1 de la Ley 40/2015, el ejercicio del derecho de separación produce la disolución del consorcio, salvo que el resto de sus miembros acuerden su continuidad y sigan permaneciendo en él, al menos:","opciones":{"a":"Tres Administraciones Públicas, de las cuales una deberá ser la Administración de adscripción.","b":"La mitad más uno de los miembros que suscribieron el convenio de creación del consorcio.","c":"Una Administración Pública y una entidad privada sin ánimo de lucro.","d":"Dos Administraciones, o entidades u organismos públicos dependientes de más de una Administración."},"correcta":"d","explicacion":"El art. 126.1 exige que sigan permaneciendo en el consorcio «al menos, dos Administraciones, o entidades u organismos públicos vinculados o dependientes de más de una Administración». La opción a) eleva la cifra a tres, y la opción b) y la opción c) establecen requisitos que el precepto no recoge.","cita":"«El ejercicio del derecho de separación produce la disolución del consorcio salvo que el resto de sus miembros, de conformidad con lo previsto en sus estatutos, acuerden su continuidad y sigan permaneciendo en el consorcio, al menos, dos Administraciones, o entidades u organismos públicos vinculados o dependientes de más de una Administración.»","dificultad":2},{"id":"L40-L7-038","ley":"L40","articulo":"129.2.g)","articulo_txt":"Art. 129.2.g) Ley 40/2015","bloque_id":"L40|Título II. Organización y funcionamiento del sector público institucional · Capítulo VII. De las fundaciones del sector público estatal","enunciado":"Según el artículo 129.2.g) de la Ley 40/2015, si la aplicación de los demás criterios de adscripción no resultara determinante, la fundación del sector público se adscribirá:","opciones":{"a":"A la Administración que tenga mayor número de habitantes o extensión territorial, según sus fines.","b":"A la Administración de la Comunidad Autónoma en cuyo territorio radique el domicilio de la fundación.","c":"A la Administración General del Estado y, si esta no participa, a la que decida su patronato.","d":"A la Administración que designe el Protectorado y, en su defecto, a la que decida su patronato."},"correcta":"c","explicacion":"La letra g) del art. 129.2, añadida por la disposición final 27.4 de la Ley 22/2021, de 28 de diciembre, dispone que «se adscribirá a la Administración General del Estado, y, en el caso de que ésta no participe, se adscribirá a la administración que decida su patronato». La opción a) reproduce el último criterio de adscripción de los consorcios, previsto en el art. 120.2.h), y la opción b) y la opción d) no figuran en el precepto.","cita":"«g) Si la aplicación de los anteriores no resultara determinante, se adscribirá a la Administración General del Estado, y, en el caso de que ésta no participe, se adscribirá a la administración que decida su patronato.»","dificultad":3},{"id":"L40-L7-048","ley":"L40","articulo":"137.1 y 137.2","articulo_txt":"Art. 137.1 y 137.2 Ley 40/2015","bloque_id":"L40|Título II. Organización y funcionamiento del sector público institucional · Capítulo VIII. De los fondos carentes de personalidad jurídica del sector público estatal","enunciado":"Según el artículo 137 de la Ley 40/2015, en cuanto a la creación y la extinción de los fondos carentes de personalidad jurídica del sector público estatal:","opciones":{"a":"Se crean por ley y solo pueden extinguirse por otra norma con rango de ley.","b":"Se crean por real decreto y se extinguen por orden del Ministerio de adscripción.","c":"Se crean por ley y se extinguen por norma de rango reglamentario.","d":"Se crean por acuerdo del Consejo de Ministros y se extinguen por ley."},"correcta":"c","explicacion":"El art. 137.1 dispone que su creación «se efectuará por Ley» y el art. 137.2 añade que «Con independencia de su creación por Ley se extinguirán por norma de rango reglamentario». La opción a) exige ley también para la extinción, y la opción b) y la opción d) no respetan la exigencia de ley para la creación.","cita":"«1. La creación de fondos carentes de personalidad jurídica en el sector público estatal se efectuará por Ley. (…) 2. Con independencia de su creación por Ley se extinguirán por norma de rango reglamentario.»","dificultad":2},{"id":"L40-L8-003","ley":"L40","articulo":"140.1","articulo_txt":"Art. 140.1 Ley 40/2015","bloque_id":"L40|Título III. Relaciones interadministrativas · Capítulo I. Principios generales de las relaciones interadministrativas","enunciado":"Según el artículo 140.1 de la Ley 40/2015, ¿cuál de los siguientes NO figura entre los principios con arreglo a los cuales las Administraciones Públicas actúan y se relacionan con otras Administraciones?","opciones":{"a":"Solidaridad interterritorial de acuerdo con la Constitución.","b":"Responsabilidad de cada Administración Pública en el cumplimiento de sus obligaciones y compromisos.","c":"Garantía e igualdad en el ejercicio de los derechos de todos los ciudadanos en sus relaciones con las diferentes Administraciones.","d":"Jerarquía."},"correcta":"d","explicacion":"La jerarquía no está en la lista del art. 140.1, que sí recoge la solidaridad interterritorial del art. 140.1.i), la responsabilidad de cada Administración del art. 140.1.g) y la garantía e igualdad en el ejercicio de los derechos de los ciudadanos del art. 140.1.h). La jerarquía figura entre los principios con arreglo a los cuales actúan las Administraciones Públicas según el art. 3.1 de la propia Ley 40/2015, pero no entre los principios de las relaciones interadministrativas del art. 140.1.","cita":"«g) Responsabilidad de cada Administración Pública en el cumplimiento de sus obligaciones y compromisos. h) Garantía e igualdad en el ejercicio de los derechos de todos los ciudadanos en sus relaciones con las diferentes Administraciones. i) Solidaridad interterritorial de acuerdo con la Constitución.»","dificultad":2},{"id":"L40-L8-009","ley":"L40","articulo":"142.b)","articulo_txt":"Art. 142.b) Ley 40/2015","bloque_id":"L40|Título III. Relaciones interadministrativas · Capítulo II. Deber de colaboración","enunciado":"Según el artículo 142 de la Ley 40/2015, una de las técnicas de colaboración consiste en proporcionar la inclusión en un sistema integrado de información de las respectivas áreas personalizadas o carpetas ciudadanas, de forma que el interesado pueda acceder a sus contenidos, notificaciones o funcionalidades mediante procedimientos seguros:","opciones":{"a":"Únicamente desde la sede electrónica de la Administración que haya dictado el acto.","b":"Siempre que acceda a través del Punto de Acceso General electrónico de la Administración General del Estado.","c":"Únicamente desde el punto de acceso de la Administración en la que conste empadronado.","d":"Independientemente de cuál haya sido el punto de acceso."},"correcta":"d","explicacion":"El art. 142.b), en la redacción dada por la disposición final 22.1 del Real Decreto-ley 6/2022, permite al interesado acceder «independientemente de cuál haya sido el punto de acceso». Las opciones a), b) y c) limitan el acceso a un punto concreto, justo lo que el precepto descarta.","cita":"«b) La colaboración a fin de proporcionar la inclusión en un sistema integrado de información de las respectivas áreas personalizadas o carpetas ciudadanas, o determinadas funcionalidades de las mismas, de forma que el interesado pueda acceder a sus contenidos, notificaciones o funcionalidades mediante procedimientos seguros que garanticen la integridad y confidencialidad de los datos de carácter personal, independientemente de cuál haya sido el punto de acceso.»","dificultad":2},{"id":"L40-L8-011","ley":"L40","articulo":"143.1","articulo_txt":"Art. 143.1 Ley 40/2015","bloque_id":"L40|Título III. Relaciones interadministrativas · Capítulo III. Relaciones de cooperación · Sección 1.ª Técnicas de cooperación","enunciado":"Según el artículo 143.1 de la Ley 40/2015, las Administraciones, que cooperarán al servicio del interés general, podrán acordar de manera voluntaria:","opciones":{"a":"La transferencia de la titularidad de sus respectivas competencias a la Administración que mejor sirva al interés general.","b":"La renuncia temporal al ejercicio de sus competencias en favor de otra Administración de ámbito territorial superior.","c":"La forma de ejercer sus respectivas competencias que mejor sirva a este principio.","d":"La atribución recíproca de sus competencias sin necesidad de formalizar convenio alguno."},"correcta":"c","explicacion":"El art. 143.1 permite acordar «la forma de ejercer sus respectivas competencias que mejor sirva a este principio». La cooperación no traslada la titularidad de las competencias, como dice la opción a), ni supone renunciar a ellas, como dice la opción b); y la opción d) prescinde de la formalización que el art. 143.2 exige en acuerdos de órganos de cooperación o en convenios.","cita":"«1. Las Administraciones cooperarán al servicio del interés general y podrán acordar de manera voluntaria la forma de ejercer sus respectivas competencias que mejor sirva a este principio.»","dificultad":2},{"id":"L40-L8-036","ley":"L40","articulo":"153.1","articulo_txt":"Art. 153.1 Ley 40/2015","bloque_id":"L40|Título III. Relaciones interadministrativas · Capítulo III. Relaciones de cooperación · Sección 2.ª Técnicas orgánicas de cooperación","enunciado":"Según el artículo 153.1 de la Ley 40/2015, las Comisiones Bilaterales de Cooperación son órganos de cooperación de composición bilateral que reúnen a los representantes de la Administración General del Estado y a los de la Comunidad Autónoma o de la Ciudad de Ceuta o de la Ciudad de Melilla:","opciones":{"a":"Con mayoría de representantes de la Administración General del Estado.","b":"Por un número igual de representantes.","c":"En número proporcional a la población de la Comunidad o Ciudad.","d":"Con mayoría de representantes de la Comunidad Autónoma o Ciudad."},"correcta":"b","explicacion":"El art. 153.1 dispone que estas Comisiones reúnen a unos y otros «por un número igual de representantes». No hay mayoría de ninguna de las partes, como plantean la opción a) y la opción d), ni proporción según la población, como plantea la opción c).","cita":"«1. Las Comisiones Bilaterales de Cooperación son órganos de cooperación de composición bilateral que reúnen, por un número igual de representantes, a miembros del Gobierno, en representación de la Administración General del Estado, y miembros del Consejo de Gobierno de la Comunidad Autónoma o representantes de la Ciudad de Ceuta o de la Ciudad de Melilla.»","dificultad":1},{"id":"L40-L8-044","ley":"L40","articulo":"156.2","articulo_txt":"Art. 156.2 Ley 40/2015","bloque_id":"L40|Título III. Relaciones interadministrativas · Capítulo IV. Relaciones electrónicas entre las Administraciones","enunciado":"Según el artículo 156.2 de la Ley 40/2015, el Esquema Nacional de Seguridad está constituido por:","opciones":{"a":"El conjunto de criterios y recomendaciones en materia de seguridad, conservación y normalización de la información, de los formatos y de las aplicaciones.","b":"Las normas técnicas que deben respetar las aplicaciones cedidas para su reutilización entre las distintas Administraciones Públicas.","c":"Los principios básicos y requisitos mínimos que garanticen adecuadamente la seguridad de la información tratada.","d":"Los protocolos y criterios funcionales o técnicos para acceder a los datos de los interesados con garantías de seguridad."},"correcta":"c","explicacion":"El art. 156.2 dispone que el Esquema Nacional de Seguridad «está constituido por los principios básicos y requisitos mínimos que garanticen adecuadamente la seguridad de la información tratada». La opción a) corresponde al Esquema Nacional de Interoperabilidad del art. 156.1, la opción d) evoca las condiciones de acceso a los datos del art. 155.1 y la opción b) no figura en el precepto.","cita":"«2. El Esquema Nacional de Seguridad tiene por objeto establecer la política de seguridad en la utilización de medios electrónicos en el ámbito de la presente Ley, y está constituido por los principios básicos y requisitos mínimos que garanticen adecuadamente la seguridad de la información tratada.»","dificultad":2}]};</script>
<script>
/* Letra de Ley — motor de test. Sin dependencias; funciona sin conexión.
   Necesita window.LDL_CONFIG y window.LDL_BANCO (los inyecta sistema/letradeley.py). */
(function () {
  "use strict";
  var CFG = window.LDL_CONFIG, B = window.LDL_BANCO;
  var raiz = document.getElementById("ldl");
  var LETRAS = ["a", "b", "c", "d"];
  var POR_ID = {};
  B.preguntas.forEach(function (p) { POR_ID[p.id] = p; });
  var CLAVE = "ldl1:" + CFG.pack.id;
  var prog = cargar();
  var sesion = null;
  var vista = CFG.modo === "web" ? "portada" : "inicio";
  var reloj = null;

  /* ---------- utilidades ---------- */
  function esc(t) {
    return String(t == null ? "" : t).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function barajar(lista) {
    var a = lista.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function pct(a, b) { return b ? Math.round((a / b) * 100) : 0; }
  function plural(n, uno, varios) { return n + " " + (n === 1 ? uno : varios); }
  function num(n) { return String(n).replace(".", ","); }
  function cargar() {
    try { var s = localStorage.getItem(CLAVE); if (s) { var d = JSON.parse(s); if (d && d.p) return d; } } catch (e) {}
    return { p: {}, h: [] };
  }
  function guardar() { try { localStorage.setItem(CLAVE, JSON.stringify(prog)); } catch (e) {} }
  function registrar(id, acierto) {
    var r = prog.p[id] || { v: 0, a: 0, f: 0, c: 0 };
    r.v++;
    if (acierto) { r.a++; r.c = Math.min((r.c || 0) + 1, 5); } else { r.f++; r.c = 0; }
    r.u = acierto ? 1 : 0;
    r.t = Date.now();
    prog.p[id] = r;
    guardar();
  }
  function fallosPendientes() {
    return B.preguntas.filter(function (p) { var r = prog.p[p.id]; return r && r.u === 0; });
  }
  function resumen(lista) {
    var vistas = 0, aciertos = 0, intentos = 0;
    lista.forEach(function (p) {
      var r = prog.p[p.id];
      if (r) { vistas++; aciertos += r.a; intentos += r.v; }
    });
    return { total: lista.length, vistas: vistas, acierto: pct(aciertos, intentos) };
  }
  function delBloque(id) { return B.preguntas.filter(function (p) { return p.bloque_id === id; }); }

  /* ---------- tema claro / oscuro ---------- */
  function aplicarTema() {
    var t = null;
    try { t = localStorage.getItem("ldl:tema"); } catch (e) {}
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    else document.documentElement.removeAttribute("data-theme");
    return t || "auto";
  }
  function cambiarTema() {
    var orden = { auto: "light", light: "dark", dark: "auto" };
    var actual = aplicarTema();
    try { localStorage.setItem("ldl:tema", orden[actual]); } catch (e) {}
    aplicarTema();
    pintar();
  }

  /* ---------- sesiones ---------- */
  function empezar(tipo, preguntas, opciones) {
    opciones = opciones || {};
    if (!preguntas.length) return;
    pararReloj();
    sesion = {
      tipo: tipo, titulo: opciones.titulo || "Test", ids: preguntas.map(function (p) { return p.id; }),
      i: 0, resp: {}, corregida: {}, inicio: Date.now(), limite: opciones.minutos ? opciones.minutos * 60 : 0, fin: null,
      origen: vista === "test" || vista === "resultado" ? (sesion && sesion.origen) || "inicio" : vista
    };
    vista = "test";
    if (sesion.limite) reloj = setInterval(tic, 1000);
    pintar();
    window.scrollTo(0, 0);
  }
  function tic() {
    if (!sesion || sesion.fin) return pararReloj();
    var el = document.getElementById("ldl-crono");
    var resta = sesion.limite - Math.floor((Date.now() - sesion.inicio) / 1000);
    if (resta <= 0) { terminar(); return; }
    if (el) el.textContent = mmss(resta);
  }
  function pararReloj() { if (reloj) { clearInterval(reloj); reloj = null; } }
  function mmss(s) { var m = Math.floor(s / 60), r = s % 60; return m + ":" + (r < 10 ? "0" : "") + r; }

  function responder(letra) {
    var id = sesion.ids[sesion.i];
    if (sesion.tipo === "simulacro") {
      sesion.resp[id] = sesion.resp[id] === letra ? undefined : letra;
      pintar();
      return;
    }
    if (sesion.corregida[id]) return;
    sesion.resp[id] = letra;
    sesion.corregida[id] = true;
    registrar(id, letra === POR_ID[id].correcta);
    pintar();
  }
  function siguiente() {
    if (sesion.i < sesion.ids.length - 1) { sesion.i++; pintar(); window.scrollTo(0, 0); }
    else terminar();
  }
  function anterior() { if (sesion.i > 0) { sesion.i--; pintar(); } }
  function terminar() {
    pararReloj();
    if (sesion.tipo === "simulacro") {
      sesion.ids.forEach(function (id) {
        if (sesion.resp[id]) registrar(id, sesion.resp[id] === POR_ID[id].correcta);
      });
    }
    sesion.fin = Date.now();
    var r = calcular(sesion);
    prog.h.unshift({ t: sesion.fin, tipo: sesion.tipo, n: r.total, a: r.aciertos, e: r.errores, nota: r.nota });
    prog.h = prog.h.slice(0, 50);
    guardar();
    vista = "resultado";
    pintar();
    window.scrollTo(0, 0);
  }
  function calcular(s) {
    var a = 0, e = 0, nr = 0;
    s.ids.forEach(function (id) {
      var r = s.resp[id];
      if (!r) nr++; else if (r === POR_ID[id].correcta) a++; else e++;
    });
    var pen = (CFG.simulacro && CFG.simulacro.penalizacion) || 1 / 3;
    var neta = s.tipo === "simulacro" ? a - e * pen : a;
    var nota = Math.max(0, (neta / s.ids.length) * 10);
    return { total: s.ids.length, aciertos: a, errores: e, blancos: nr, neta: neta, nota: Math.round(nota * 100) / 100 };
  }

  /* ---------- vistas ---------- */
  function cabecera() {
    var tema = aplicarTema();
    var etiquetas = { auto: "Tema: auto", light: "Tema: claro", dark: "Tema: oscuro" };
    return '<header class="ldl-top"><a class="ldl-brand" href="' + esc(CFG.web || "#") + '">' +
      '<span class="ldl-logo" aria-hidden="true">§</span><span><b>Letra de Ley</b><small>' +
      esc(CFG.pack.nombre) + "</small></span></a>" +
      '<button class="ldl-tema" data-acc="tema" type="button">' + etiquetas[tema] + "</button></header>";
  }
  function navegacion() {
    if (CFG.modo === "web") return "";
    var items = [["inicio", "Inicio"], ["temas", "Por temas"], ["simulacro", "Simulacro"], ["fallos", "Fallos"], ["stats", "Estadísticas"]];
    return '<nav class="ldl-nav" aria-label="Secciones">' + items.map(function (it) {
      var actual = vista === it[0] || (vista === "test" && sesion && sesion.origen === it[0]);
      return '<button type="button" data-acc="ir" data-v="' + it[0] + '"' + (actual ? ' aria-current="page"' : "") + ">" + it[1] + "</button>";
    }).join("") + "</nav>";
  }
  function pie() {
    return '<p class="ldl-pie">Letra de Ley · ' + esc(CFG.pack.edicion) + " · Texto legal actualizado a " +
      esc(CFG.pack.actualizado) + "<br>Uso personal. Prohibida su redistribución.</p>";
  }

  function vInicio() {
    var r = resumen(B.preguntas), f = fallosPendientes().length;
    return '<section class="ldl-card"><h2>' + esc(CFG.pack.nombre) + "</h2>" +
      '<p class="ldl-muted">' + B.preguntas.length + " preguntas comentadas, con el artículo exacto de cada respuesta.</p>" +
      '<div class="ldl-kpis"><div class="ldl-kpi"><b>' + r.vistas + "/" + r.total + "</b><span>respondidas</span></div>" +
      '<div class="ldl-kpi"><b>' + r.acierto + ' %</b><span>de acierto</span></div>' +
      '<div class="ldl-kpi"><b>' + f + "</b><span>fallos por repasar</span></div></div>" +
      '<div class="ldl-acciones"><button class="ldl-btn" data-acc="rapido" type="button">Test rápido de 20</button>' +
      '<button class="ldl-btn sec" data-acc="ir" data-v="simulacro" type="button">Simulacro de examen</button>' +
      (f ? '<button class="ldl-btn sec" data-acc="repasar" type="button">Repasar ' + f + " fallos</button>" : "") +
      "</div></section>" +
      '<section class="ldl-card"><h3>Cómo sacarle partido</h3><ol class="ldl-muted">' +
      "<li>Practica <b>por temas</b>: cada respuesta te enseña el artículo y por qué fallan las demás opciones.</li>" +
      "<li>Cada pocos días, <b>repasa tus fallos</b>: es donde más se aprende.</li>" +
      "<li>Antes del examen, haz <b>simulacros</b> con tiempo y con la penalización real (cada error resta 1/3).</li></ol>" +
      '<p class="ldl-small ldl-muted">Tu progreso se guarda en este dispositivo y en este navegador.</p></section>' + historial();
  }
  function historial() {
    if (!prog.h.length) return "";
    return '<section class="ldl-card"><h3>Últimos tests</h3><ul class="ldl-revision">' + prog.h.slice(0, 5).map(function (h) {
      var d = new Date(h.t);
      return "<li><b>" + (h.tipo === "simulacro" ? "Simulacro" : "Práctica") + "</b> · " + d.toLocaleDateString("es-ES") +
        " · " + h.a + "/" + h.n + " aciertos" + (h.tipo === "simulacro" ? " · nota " + num(h.nota) : "") + "</li>";
    }).join("") + "</ul></section>";
  }
  function vTemas() {
    var html = '<section class="ldl-card"><h2>Practicar por temas</h2><p class="ldl-muted">Elige un bloque. Las preguntas salen en orden aleatorio y se corrigen al momento.</p><ul class="ldl-bloques">';
    B.bloques.forEach(function (b) {
      var lista = delBloque(b.id), r = resumen(lista);
      html += '<li><button type="button" data-acc="bloque" data-id="' + esc(b.id) + '"><span class="t">' + esc(b.nombre) +
        '</span><span class="n">' + r.vistas + "/" + r.total + (r.vistas ? " · " + r.acierto + " %" : "") + "</span>" +
        '<span class="ldl-barra"><i style="width:' + pct(r.vistas, r.total) + '%"></i></span></button></li>';
    });
    return html + "</ul></section>";
  }
  function vSimulacro() {
    var total = B.preguntas.length;
    var opcionesN = [10, 20, 30, 50, 100].filter(function (n) { return n < total; });
    opcionesN.push(total);
    var porDefecto = Math.min((CFG.simulacro && CFG.simulacro.preguntas) || 30, total);
    return '<section class="ldl-card"><h2>Simulacro de examen</h2>' +
      '<p class="ldl-muted">Como el día del examen: no ves las soluciones hasta el final y cada error resta un tercio de acierto.</p>' +
      '<div class="ldl-campo"><label for="ldl-n">Número de preguntas</label><select id="ldl-n">' +
      opcionesN.map(function (n) { return "<option" + (n === porDefecto ? " selected" : "") + ">" + n + "</option>"; }).join("") +
      '</select></div><div class="ldl-campo"><label for="ldl-t">Tiempo</label><select id="ldl-t">' +
      '<option value="1">1 minuto por pregunta</option><option value="0">Sin límite de tiempo</option></select></div>' +
      '<div class="ldl-campo"><label for="ldl-b">Temas</label><select id="ldl-b"><option value="">Todos</option>' +
      B.bloques.map(function (b) { return '<option value="' + esc(b.id) + '">' + esc(b.nombre) + "</option>"; }).join("") +
      '</select></div><div class="ldl-acciones"><button class="ldl-btn" data-acc="simular" type="button">Empezar simulacro</button></div></section>';
  }
  function vFallos() {
    var f = fallosPendientes();
    if (!f.length) {
      return '<section class="ldl-card"><h2>Repaso de fallos</h2><p class="ldl-muted">No tienes fallos pendientes. Cuando falles una pregunta aparecerá aquí hasta que la aciertes.</p></section>';
    }
    return '<section class="ldl-card"><h2>Repaso de fallos</h2><p class="ldl-muted">Tienes <b>' + f.length +
      "</b> preguntas falladas. Salen de aquí en cuanto las aciertas.</p>" +
      '<div class="ldl-acciones"><button class="ldl-btn" data-acc="repasar" type="button">Repasar ahora</button></div></section>';
  }
  function vStats() {
    var html = '<section class="ldl-card"><h2>Estadísticas</h2><ul class="ldl-bloques">';
    B.bloques.forEach(function (b) {
      var r = resumen(delBloque(b.id));
      html += '<li><button type="button" data-acc="bloque" data-id="' + esc(b.id) + '"><span class="t">' + esc(b.nombre) +
        '</span><span class="n">' + (r.vistas ? r.acierto + " % de acierto" : "sin empezar") + '</span><span class="ldl-barra"><i style="width:' +
        r.acierto + '%"></i></span></button></li>';
    });
    html += '</ul></section><section class="ldl-card"><h3>Empezar de cero</h3><p class="ldl-muted ldl-small">Borra tu progreso guardado en este dispositivo.</p>' +
      '<div class="ldl-acciones"><button class="ldl-btn sec" data-acc="borrar" type="button">Borrar mi progreso</button></div></section>';
    return html;
  }
  function vPortada() {
    var n = B.preguntas.length;
    return '<section class="ldl-card"><h2>' + esc(CFG.pack.nombre) + "</h2>" +
      '<p class="ldl-muted">' + n + " preguntas tipo examen, corregidas al momento, con el artículo exacto y la explicación de cada opción. Gratis y sin registrarte.</p>" +
      '<div class="ldl-acciones"><button class="ldl-btn" data-acc="empezarweb" type="button">Empezar el test</button></div></section>';
  }

  function vTest() {
    var id = sesion.ids[sesion.i], p = POR_ID[id], sim = sesion.tipo === "simulacro";
    var elegida = sesion.resp[id], corregida = !sim && sesion.corregida[id];
    var html = '<section class="ldl-card"><div class="ldl-meta"><span>' + esc(sesion.titulo) + " · " + (sesion.i + 1) + " de " + sesion.ids.length +
      "</span><span>" + (sesion.limite ? '⏱ <span id="ldl-crono" class="ldl-crono">' +
        mmss(Math.max(0, sesion.limite - Math.floor((Date.now() - sesion.inicio) / 1000))) + "</span>" : esc(p.articulo_txt)) +
      '</span></div><div class="ldl-progreso"><i style="width:' + pct(sesion.i + (corregida ? 1 : 0), sesion.ids.length) + '%"></i></div>' +
      '<p class="ldl-enunciado">' + esc(p.enunciado) + '</p><div class="ldl-opciones" role="group" aria-label="Opciones">';
    LETRAS.forEach(function (l) {
      var cls = "ldl-op";
      if (corregida) { if (l === p.correcta) cls += " ok"; else if (l === elegida) cls += " ko"; }
      else if (sim && elegida === l) cls += " marcada";
      html += '<button type="button" class="' + cls + '" data-acc="resp" data-l="' + l + '"' + (corregida ? " disabled" : "") +
        (sim ? ' aria-pressed="' + (elegida === l) + '"' : "") + '><span class="l">' + l + ")</span><span>" + esc(p.opciones[l]) + "</span></button>";
    });
    html += "</div>";
    if (corregida) html += feedback(p, elegida);
    html += '<div class="ldl-acciones">';
    if (sim) {
      html += (sesion.i > 0 ? '<button class="ldl-btn sec" data-acc="ant" type="button">Anterior</button>' : "") +
        '<button class="ldl-btn" data-acc="sig" type="button">' + (sesion.i < sesion.ids.length - 1 ? "Siguiente" : "Entregar") + "</button>" +
        (sesion.i < sesion.ids.length - 1 ? '<button class="ldl-btn sec" data-acc="entregar" type="button">Entregar ya</button>' : "");
    } else if (corregida) {
      html += '<button class="ldl-btn" data-acc="sig" type="button">' + (sesion.i < sesion.ids.length - 1 ? "Siguiente" : "Ver resultado") + "</button>";
    }
    html += '<button class="ldl-btn sec" data-acc="salir" type="button">Salir</button></div></section>';
    return html;
  }
  function feedback(p, elegida) {
    var bien = elegida === p.correcta;
    return '<div class="ldl-feedback" aria-live="polite"><div class="v ' + (bien ? "ok" : "ko") + '">' +
      (bien ? "¡Correcta!" : "Incorrecta. La respuesta correcta es la " + p.correcta + ")") + "</div><div>" + esc(p.explicacion) + "</div>" +
      (p.cita ? '<blockquote class="ldl-cita">' + esc(p.cita) + "<small>" + esc(p.articulo_txt) + "</small></blockquote>" : "") + "</div>";
  }
  function vResultado() {
    var r = calcular(sesion), sim = sesion.tipo === "simulacro";
    var html = '<section class="ldl-card"><h2>' + (sim ? "Resultado del simulacro" : "Resultado") + "</h2>" +
      '<div class="ldl-nota">' + (sim ? num(r.nota.toFixed(2)) : r.aciertos + "/" + r.total) + "</div>" +
      '<p class="ldl-muted">' + plural(r.aciertos, "acierto", "aciertos") + " · " + plural(r.errores, "error", "errores") +
      (r.blancos ? " · " + r.blancos + " en blanco" : "") +
      (sim ? " · nota sobre 10 con penalización" : "") + "</p>";
    if (CFG.modo === "web") html += ctaWeb(r);
    html += '<div class="ldl-acciones">' + (CFG.modo === "web" ? '<button class="ldl-btn sec" data-acc="empezarweb" type="button">Repetir con otro orden</button>' :
      '<button class="ldl-btn" data-acc="ir" data-v="inicio" type="button">Volver al inicio</button>') + "</div></section>";
    html += '<section class="ldl-card"><h3>Revisión</h3><ul class="ldl-revision">';
    sesion.ids.forEach(function (id, n) {
      var p = POR_ID[id], e = sesion.resp[id], chip = !e ? '<span class="ldl-chip nr">En blanco</span>' :
        e === p.correcta ? '<span class="ldl-chip ok">Bien</span>' : '<span class="ldl-chip ko">Mal</span>';
      html += "<li>" + chip + '<span class="e">' + (n + 1) + ". " + esc(p.enunciado) + "</span><br>" +
        '<span class="ldl-small">Correcta: <b>' + p.correcta + ") " + esc(p.opciones[p.correcta]) + "</b>" +
        (e && e !== p.correcta ? " · Marcaste " + e + ")" : "") + '</span><br><span class="ldl-small ldl-muted">' + esc(p.explicacion) + "</span></li>";
    });
    return html + "</ul></section>";
  }
  function ctaWeb() {
    var c = CFG.compra || {}, html = "";
    if (c.url) {
      html += '<div class="ldl-card ldl-cta"><h3>' + esc(c.titulo) + '</h3><p class="ldl-muted">' + esc(c.texto) + "</p>" +
        '<div class="ldl-acciones"><a class="ldl-btn acc" href="' + esc(c.url) + '">' + esc(c.boton) + "</a></div></div>";
    }
    if (CFG.telegram) {
      html += '<p class="ldl-small">¿Quieres un test cada día? <a href="' + esc(CFG.telegram) + '">Únete gratis al canal de Telegram</a>.</p>';
    }
    return html;
  }

  function pintar() {
    var cuerpo;
    if (vista === "test") cuerpo = vTest();
    else if (vista === "resultado") cuerpo = vResultado();
    else if (vista === "portada") cuerpo = vPortada();
    else if (vista === "temas") cuerpo = vTemas();
    else if (vista === "simulacro") cuerpo = vSimulacro();
    else if (vista === "fallos") cuerpo = vFallos();
    else if (vista === "stats") cuerpo = vStats();
    else cuerpo = vInicio();
    raiz.innerHTML = '<div class="ldl">' + cabecera() + navegacion() + "<main>" + cuerpo + "</main>" + pie() + "</div>";
  }

  /* ---------- eventos ---------- */
  raiz.addEventListener("click", function (ev) {
    var el = ev.target.closest("[data-acc]");
    if (!el) return;
    var acc = el.getAttribute("data-acc");
    if (acc === "tema") return cambiarTema();
    if (acc === "ir") { pararReloj(); vista = el.getAttribute("data-v"); sesion = null; pintar(); return; }
    if (acc === "rapido") return empezar("practica", barajar(B.preguntas).slice(0, 20), { titulo: "Test rápido" });
    if (acc === "repasar") return empezar("practica", barajar(fallosPendientes()).slice(0, 30), { titulo: "Repaso de fallos" });
    if (acc === "bloque") {
      var b = B.bloques.filter(function (x) { return x.id === el.getAttribute("data-id"); })[0];
      return empezar("practica", barajar(delBloque(b.id)), { titulo: b.nombre });
    }
    if (acc === "simular") {
      var n = parseInt(document.getElementById("ldl-n").value, 10);
      var conTiempo = document.getElementById("ldl-t").value === "1";
      var bloque = document.getElementById("ldl-b").value;
      var fuente = bloque ? delBloque(bloque) : B.preguntas;
      var elegidas = barajar(fuente).slice(0, n);
      return empezar("simulacro", elegidas, { titulo: "Simulacro", minutos: conTiempo ? elegidas.length : 0 });
    }
    if (acc === "empezarweb") return empezar("practica", barajar(B.preguntas), { titulo: "Test gratuito" });
    if (acc === "resp") return responder(el.getAttribute("data-l"));
    if (acc === "sig") return siguiente();
    if (acc === "ant") return anterior();
    if (acc === "entregar") return terminar();
    if (acc === "salir") { pararReloj(); sesion = null; vista = CFG.modo === "web" ? "portada" : "inicio"; pintar(); return; }
    if (acc === "borrar") {
      if (el.getAttribute("data-confirmar") === "1") { prog = { p: {}, h: [] }; guardar(); pintar(); }
      else { el.setAttribute("data-confirmar", "1"); el.textContent = "Pulsa otra vez para confirmar"; }
    }
  });
  document.addEventListener("keydown", function (ev) {
    if (vista !== "test" || !sesion || ev.altKey || ev.ctrlKey || ev.metaKey) return;
    var k = ev.key.toLowerCase(), mapa = { "1": "a", "2": "b", "3": "c", "4": "d", a: "a", b: "b", c: "c", d: "d" };
    if (mapa[k]) { ev.preventDefault(); responder(mapa[k]); }
    else if (k === "enter" || k === "arrowright") {
      var id = sesion.ids[sesion.i];
      if (sesion.tipo === "simulacro" || sesion.corregida[id]) { ev.preventDefault(); siguiente(); }
    } else if (k === "arrowleft" && sesion.tipo === "simulacro") { ev.preventDefault(); anterior(); }
  });

  pintar();
})();
</script>
</body>
</html>
