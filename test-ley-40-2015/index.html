eneral del Estado · Capítulo II. Los Ministerios y su estructura interna"}],"preguntas":[{"id":"L40-L1-004","ley":"L40","articulo":"2.2.c)","articulo_txt":"Art. 2.2.c) Ley 40/2015","bloque_id":"L40|Título Preliminar. Disposiciones generales, principios de actuación y funcionamiento del sector público · Capítulo I. Disposiciones generales","enunciado":"Según el artículo 2.2.c) de la Ley 40/2015, las Universidades públicas se regirán:","opciones":{"a":"Por la Ley 40/2015 y supletoriamente por su normativa específica.","b":"Únicamente por su normativa específica, sin aplicación de la Ley 40/2015.","c":"Únicamente por la Ley 40/2015, como los organismos públicos estatales.","d":"Por su normativa específica y, supletoriamente, por la Ley 40/2015."},"correcta":"d","explicacion":"El art. 2.2.c) dispone que las Universidades públicas «se regirán por su normativa específica y supletoriamente por las previsiones de la presente Ley». La opción a) invierte el orden de aplicación, y las opciones b) y c) excluyen, respectivamente, la aplicación supletoria de la ley o la de su normativa específica.","cita":"«c) Las Universidades públicas que se regirán por su normativa específica y supletoriamente por las previsiones de la presente Ley.»","dificultad":2},{"id":"L40-L1-005","ley":"L40","articulo":"2.3","articulo_txt":"Art. 2.3 Ley 40/2015","bloque_id":"L40|Título Preliminar. Disposiciones generales, principios de actuación y funcionamiento del sector público · Capítulo I. Disposiciones generales","enunciado":"Según el artículo 2.3 de la Ley 40/2015, ¿cuál de los siguientes NO tiene la consideración de Administración Pública?","opciones":{"a":"La Administración General del Estado y las Administraciones de las Comunidades Autónomas.","b":"Las entidades de derecho privado vinculadas o dependientes de las Administraciones Públicas.","c":"Las Entidades que integran la Administración Local.","d":"Los organismos públicos y entidades de derecho público vinculados o dependientes de las Administraciones Públicas."},"correcta":"b","explicacion":"El art. 2.3 considera Administraciones Públicas a la Administración General del Estado, a las de las Comunidades Autónomas (opción a), a las Entidades que integran la Administración Local (opción c) y a «los organismos públicos y entidades de derecho público previstos en la letra a) del apartado 2» (opción d). Las entidades de derecho privado de la letra b) del art. 2.2 forman parte del sector público institucional, pero no tienen esa consideración.","cita":"«3. Tienen la consideración de Administraciones Públicas la Administración General del Estado, las Administraciones de las Comunidades Autónomas, las Entidades que integran la Administración Local, así como los organismos públicos y entidades de derecho público previstos en la letra a) del apartado 2.»","dificultad":2},{"id":"L40-L1-007","ley":"L40","articulo":"3.1","articulo_txt":"Art. 3.1 Ley 40/2015","bloque_id":"L40|Título Preliminar. Disposiciones generales, principios de actuación y funcionamiento del sector público · Capítulo I. Disposiciones generales","enunciado":"¿Cuál de los siguientes NO figura entre los principios que, según el artículo 3.1 de la Ley 40/2015, deberán respetar las Administraciones Públicas en su actuación y relaciones?","opciones":{"a":"Buena fe, confianza legítima y lealtad institucional.","b":"Simplicidad, claridad y proximidad a los ciudadanos.","c":"Publicidad, gratuidad y celeridad de la actuación administrativa.","d":"Racionalización y agilidad de los procedimientos administrativos y de las actividades materiales de gestión."},"correcta":"c","explicacion":"La opción a) reproduce el art. 3.1.e), la opción b) el art. 3.1.b) y la opción d) el art. 3.1.d). La lista del art. 3.1 recoge la «Participación, objetividad y transparencia de la actuación administrativa» (art. 3.1.c), pero no la publicidad, gratuidad y celeridad.","cita":"«Deberán respetar en su actuación y relaciones los siguientes principios: (…) b) Simplicidad, claridad y proximidad a los ciudadanos. c) Participación, objetividad y transparencia de la actuación administrativa. d) Racionalización y agilidad de los procedimientos administrativos y de las actividades materiales de gestión. e) Buena fe, confianza legítima y lealtad institucional. (…)»","dificultad":2},{"id":"L40-L1-009","ley":"L40","articulo":"4.1","articulo_txt":"Art. 4.1 Ley 40/2015","bloque_id":"L40|Título Preliminar. Disposiciones generales, principios de actuación y funcionamiento del sector público · Capítulo I. Disposiciones generales","enunciado":"Según el artículo 4.1 de la Ley 40/2015, las Administraciones Públicas que, en el ejercicio de sus competencias, establezcan medidas que limiten el ejercicio de derechos individuales o colectivos deberán:","opciones":{"a":"Aplicar el principio de precaución y elegir, entre las posibles, la medida más eficaz.","b":"Aplicar el principio de proporcionalidad y elegir la medida más eficaz.","c":"Aplicar el principio de jerarquía y elegir la medida menos costosa.","d":"Aplicar el principio de proporcionalidad y elegir la medida menos restrictiva."},"correcta":"d","explicacion":"El art. 4.1 obliga a esas Administraciones a «aplicar el principio de proporcionalidad y elegir la medida menos restrictiva», además de motivar su necesidad y justificar su adecuación. Las opciones a), b) y c) cambian el principio aplicable o el criterio de elección de la medida.","cita":"«1. Las Administraciones Públicas que, en el ejercicio de sus respectivas competencias, establezcan medidas que limiten el ejercicio de derechos individuales o colectivos o exijan el cumplimiento de requisitos para el desarrollo de una actividad, deberán aplicar el principio de proporcionalidad y elegir la medida menos restrictiva, motivar su necesidad para la protección del interés público así como justificar su adecuación para lograr los fines que se persiguen, sin que en ningún caso se produzcan diferencias de trato discriminatorias.»","dificultad":2},{"id":"L40-L1-011","ley":"L40","articulo":"5.1","articulo_txt":"Art. 5.1 Ley 40/2015","bloque_id":"L40|Título Preliminar. Disposiciones generales, principios de actuación y funcionamiento del sector público · Capítulo II. De los órganos de las Administraciones Públicas · Sección 1.ª De los órganos administrativos","enunciado":"Según el artículo 5.1 de la Ley 40/2015, tendrán la consideración de órganos administrativos las unidades administrativas:","opciones":{"a":"A las que se atribuyan funciones de carácter material o técnico, o cuya actuación tenga carácter consultivo.","b":"A las que se atribuyan funciones con efectos jurídicos frente a terceros, siempre que tengan personalidad jurídica.","c":"A las que se atribuyan funciones con efectos jurídicos frente a terceros, o cuya actuación sea preceptiva.","d":"A las que se atribuyan funciones de dirección política, o cuya actuación tenga carácter vinculante."},"correcta":"c","explicacion":"El art. 5.1 define como órganos administrativos las unidades «a las que se les atribuyan funciones que tengan efectos jurídicos frente a terceros, o cuya actuación tenga carácter preceptivo». Las funciones materiales o técnicas (opción a) o de dirección política (opción d) no son el criterio legal, y la ley no exige personalidad jurídica (opción b).","cita":"«1. Tendrán la consideración de órganos administrativos las unidades administrativas a las que se les atribuyan funciones que tengan efectos jurídicos frente a terceros, o cuya actuación tenga carácter preceptivo.»","dificultad":1},{"id":"L40-L1-015","ley":"L40","articulo":"6.2","articulo_txt":"Art. 6.2 Ley 40/2015","bloque_id":"L40|Título Preliminar. Disposiciones generales, principios de actuación y funcionamiento del sector público · Capítulo II. De los órganos de las Administraciones Públicas · Sección 1.ª De los órganos administrativos","enunciado":"Según el artículo 6.2 de la Ley 40/2015, el incumplimiento de las instrucciones u órdenes de servicio, respecto de los actos dictados por los órganos administrativos:","opciones":{"a":"Determina por sí solo la nulidad de pleno derecho de los actos dictados por esos órganos.","b":"Determina por sí solo la anulabilidad de los actos así dictados.","c":"No afecta por sí solo a su validez, sin perjuicio de la responsabilidad disciplinaria.","d":"No afecta a su validez ni da lugar, en ningún caso, a responsabilidad disciplinaria."},"correcta":"c","explicacion":"El art. 6.2 dispone que ese incumplimiento «no afecta por sí solo a la validez de los actos dictados por los órganos administrativos, sin perjuicio de la responsabilidad disciplinaria en que se pueda incurrir». No produce por sí solo nulidad (opción a) ni anulabilidad (opción b), y sí puede generar responsabilidad disciplinaria (opción d).","cita":"«2. El incumplimiento de las instrucciones u órdenes de servicio no afecta por sí solo a la validez de los actos dictados por los órganos administrativos, sin perjuicio de la responsabilidad disciplinaria en que se pueda incurrir.»","dificultad":1},{"id":"L40-L1-016","ley":"L40","articulo":"7","articulo_txt":"Art. 7 Ley 40/2015","bloque_id":"L40|Título Preliminar. Disposiciones generales, principios de actuación y funcionamiento del sector público · Capítulo II. De los órganos de las Administraciones Públicas · Sección 1.ª De los órganos administrativos","enunciado":"Según el artículo 7 de la Ley 40/2015, cuando la Administración consultiva se articule a través de los servicios de la Administración activa que prestan asistencia jurídica, dichos servicios, para cumplir con las garantías que establece ese artículo, actuarán de forma:","opciones":{"a":"Colegiada.","b":"Unipersonal.","c":"Jerarquizada.","d":"Desconcentrada."},"correcta":"a","explicacion":"El art. 7 dispone que esos servicios no podrán estar sujetos a dependencia jerárquica ni recibir instrucciones de los órganos autores de lo consultado, «actuando para cumplir con tales garantías de forma colegiada». Las opciones b), c) y d) no recogen la forma de actuación que fija la ley; la actuación jerarquizada (opción c) es, además, contraria a la ausencia de dependencia jerárquica que impone el artículo.","cita":"«En tal caso, dichos servicios no podrán estar sujetos a dependencia jerárquica, ya sea orgánica o funcional, ni recibir instrucciones, directrices o cualquier clase de indicación de los órganos que hayan elaborado las disposiciones o producido los actos objeto de consulta, actuando para cumplir con tales garantías de forma colegiada.»","dificultad":2},{"id":"L40-L1-017","ley":"L40","articulo":"8.1","articulo_txt":"Art. 8.1 Ley 40/2015","bloque_id":"L40|Título Preliminar. Disposiciones generales, principios de actuación y funcionamiento del sector público · Capítulo II. De los órganos de las Administraciones Públicas · Sección 2.ª Competencia","enunciado":"Según el artículo 8.1 de la Ley 40/2015, la competencia es irrenunciable y se ejercerá por los órganos administrativos que la tengan atribuida como propia, salvo los casos de:","opciones":{"a":"Encomienda de gestión o suplencia.","b":"Delegación de firma o suplencia.","c":"Delegación o encomienda de gestión.","d":"Delegación o avocación."},"correcta":"d","explicacion":"El art. 8.1 exceptúa únicamente «los casos de delegación o avocación, cuando se efectúen en los términos previstos en ésta u otras leyes». La encomienda de gestión, la delegación de firma y la suplencia, que aparecen en las opciones a), b) y c), no figuran en esa salvedad.","cita":"«1. La competencia es irrenunciable y se ejercerá por los órganos administrativos que la tengan atribuida como propia, salvo los casos de delegación o avocación, cuando se efectúen en los términos previstos en ésta u otras leyes.»","dificultad":1},{"id":"L40-L1-028","ley":"L40","articulo":"10.2","articulo_txt":"Art. 10.2 Ley 40/2015","bloque_id":"L40|Título Preliminar. Disposiciones generales, principios de actuación y funcionamiento del sector público · Capítulo II. De los órganos de las Administraciones Públicas · Sección 2.ª Competencia","enunciado":"Según el artículo 10.2 de la Ley 40/2015, contra el acuerdo de avocación:","opciones":{"a":"Cabrá recurso de alzada ante el superior jerárquico del órgano que lo adopte.","b":"No cabrá recurso, aunque podrá impugnarse en el que se interponga contra la resolución.","c":"Cabrá recurso potestativo de reposición ante el mismo órgano que lo adopte.","d":"No cabrá recurso alguno ni podrá impugnarse en el que se interponga contra la resolución final."},"correcta":"b","explicacion":"El art. 10.2 dispone: «Contra el acuerdo de avocación no cabrá recurso, aunque podrá impugnarse en el que, en su caso, se interponga contra la resolución del procedimiento». Los recursos de alzada (opción a) y de reposición (opción c), que regula la Ley 39/2015, no proceden contra este acuerdo, y la opción d) niega la posibilidad de impugnarlo con la resolución.","cita":"«Contra el acuerdo de avocación no cabrá recurso, aunque podrá impugnarse en el que, en su caso, se interponga contra la resolución del procedimiento.»","dificultad":2},{"id":"L40-L1-033","ley":"L40","articulo":"12.2","articulo_txt":"Art. 12.2 Ley 40/2015","bloque_id":"L40|Título Preliminar. Disposiciones generales, principios de actuación y funcionamiento del sector público · Capítulo II. De los órganos de las Administraciones Públicas · Sección 2.ª Competencia","enunciado":"Según el artículo 12.2 de la Ley 40/2015, la delegación de firma:","opciones":{"a":"Altera la competencia del órgano delegante y requiere publicación para su validez.","b":"No altera la competencia del órgano delegante, pero requiere publicación para su validez.","c":"Altera la competencia del órgano delegante, aunque no requiere publicación para su validez.","d":"No altera la competencia del órgano delegante y no requiere publicación para su validez."},"correcta":"d","explicacion":"El art. 12.2 dispone que «La delegación de firma no alterará la competencia del órgano delegante y para su validez no será necesaria su publicación». Las opciones a) y c) afirman que altera la competencia, y las opciones a) y b) exigen una publicación que la ley declara innecesaria.","cita":"«2. La delegación de firma no alterará la competencia del órgano delegante y para su validez no será necesaria su publicación.»","dificultad":1},{"id":"L40-L1-040","ley":"L40","articulo":"15.3","articulo_txt":"Art. 15.3 Ley 40/2015","bloque_id":"L40|Título Preliminar. Disposiciones generales, principios de actuación y funcionamiento del sector público · Capítulo II. De los órganos de las Administraciones Públicas · Sección 3.ª Órganos colegiados de las distintas administraciones públicas · Subsección 1.ª Funcionamiento","enunciado":"Según el artículo 15.3 de la Ley 40/2015, cuando se trate de un órgano colegiado de los previstos en el apartado 2 de ese artículo, la publicidad de su acuerdo de creación y de sus normas de funcionamiento se realizará por:","opciones":{"a":"La Administración a quien corresponda la Presidencia.","b":"La Administración a quien corresponda la Secretaría.","c":"Cada una de las Administraciones representadas.","d":"La Administración General del Estado, en todo caso."},"correcta":"a","explicacion":"El art. 15.3 dispone que, en ese caso, «la citada publicidad se realizará por la Administración a quien corresponda la Presidencia». No corresponde a la Administración que ejerza la Secretaría (opción b), ni a todas las representadas (opción c), ni siempre a la Administración General del Estado (opción d).","cita":"«Cuando se trate de un órgano colegiado a los que se refiere el apartado 2 de este artículo la citada publicidad se realizará por la Administración a quien corresponda la Presidencia.»","dificultad":3},{"id":"L40-L1-042","ley":"L40","articulo":"16.2","articulo_txt":"Art. 16.2 Ley 40/2015","bloque_id":"L40|Título Preliminar. Disposiciones generales, principios de actuación y funcionamiento del sector público · Capítulo II. De los órganos de las Administraciones Públicas · Sección 3.ª Órganos colegiados de las distintas administraciones públicas · Subsección 1.ª Funcionamiento","enunciado":"Según el artículo 16.2 de la Ley 40/2015, corresponderá al Secretario del órgano colegiado:","opciones":{"a":"Dirimir con su voto los empates, a efectos de adoptar acuerdos.","b":"Ostentar la representación del órgano colegiado.","c":"Velar por la legalidad formal y material de las actuaciones del órgano.","d":"Acordar la convocatoria de las sesiones ordinarias y extraordinarias y fijar el orden del día."},"correcta":"c","explicacion":"El art. 16.2 atribuye al Secretario «velar por la legalidad formal y material de las actuaciones del órgano colegiado», certificar sus actuaciones y garantizar el respeto de las reglas de constitución y adopción de acuerdos. Las opciones a), b) y d) no figuran en el art. 16.2; en los órganos colegiados de la Administración General del Estado, el art. 19.2 de la misma ley las atribuye al Presidente.","cita":"«2. Corresponderá al Secretario velar por la legalidad formal y material de las actuaciones del órgano colegiado, certificar las actuaciones del mismo y garantizar que los procedimientos y reglas de constitución y adopción de acuerdos son respetadas.»","dificultad":2},{"id":"L40-L1-043","ley":"L40","articulo":"17.2","articulo_txt":"Art. 17.2 Ley 40/2015","bloque_id":"L40|Título Preliminar. Disposiciones generales, principios de actuación y funcionamiento del sector público · Capítulo II. De los órganos de las Administraciones Públicas · Sección 3.ª Órganos colegiados de las distintas administraciones públicas · Subsección 1.ª Funcionamiento","enunciado":"Según el artículo 17.2 de la Ley 40/2015, para la válida constitución del órgano colegiado, a efectos de la celebración de sesiones, deliberaciones y toma de acuerdos, se requerirá la asistencia del Presidente y del Secretario, o de quienes les suplan, y la de:","opciones":{"a":"La mitad, al menos, de sus miembros.","b":"Dos tercios, al menos, de sus miembros.","c":"Un tercio, al menos, de sus miembros.","d":"Las tres cuartas partes de sus miembros."},"correcta":"a","explicacion":"El art. 17.2 exige, además del Presidente y del Secretario o de quienes les suplan, la asistencia de «la mitad, al menos, de sus miembros». Las opciones b), c) y d) alteran la proporción de miembros que exige la ley.","cita":"«2. Para la válida constitución del órgano, a efectos de la celebración de sesiones, deliberaciones y toma de acuerdos, se requerirá la asistencia, presencial o a distancia, del Presidente y Secretario o en su caso, de quienes les suplan, y la de la mitad, al menos, de sus miembros.»","dificultad":2},{"id":"L40-L2-002","ley":"L40","articulo":"19.3.a)","articulo_txt":"Art. 19.3.a) Ley 40/2015","bloque_id":"L40|Título Preliminar. Disposiciones generales, principios de actuación y funcionamiento del sector público · Capítulo II. De los órganos de las Administraciones Públicas · Sección 3.ª Órganos colegiados de las distintas administraciones públicas · Subsección 2.ª De los órganos colegiados en la Administración General del Estado","enunciado":"Según el artículo 19.3.a) de la Ley 40/2015, los miembros de un órgano colegiado de la Administración General del Estado deberán recibir la convocatoria conteniendo el orden del día de las reuniones con una antelación mínima de:","opciones":{"a":"Veinticuatro horas.","b":"Tres días.","c":"Cinco días.","d":"Dos días."},"correcta":"d","explicacion":"El art. 19.3.a) establece que los miembros deberán «Recibir, con una antelación mínima de dos días, la convocatoria conteniendo el orden del día de las reuniones». Las opciones a), b) y c) recogen plazos que el precepto no prevé.","cita":"«a) Recibir, con una antelación mínima de dos días, la convocatoria conteniendo el orden del día de las reuniones. La información sobre los temas que figuren en el orden del día estará a disposición de los miembros en igual plazo.»","dificultad":1},{"id":"L40-L2-004","ley":"L40","articulo":"19.4.a)","articulo_txt":"Art. 19.4.a) Ley 40/2015","bloque_id":"L40|Título Preliminar. Disposiciones generales, principios de actuación y funcionamiento del sector público · Capítulo II. De los órganos de las Administraciones Públicas · Sección 3.ª Órganos colegiados de las distintas administraciones públicas · Subsección 2.ª De los órganos colegiados en la Administración General del Estado","enunciado":"Según el artículo 19.4 de la Ley 40/2015, el Secretario de un órgano colegiado de la Administración General del Estado asistirá a las reuniones:","opciones":{"a":"Con voz y voto en todo caso, en las mismas condiciones que los demás miembros del órgano.","b":"Sin voz ni voto, salvo que el Presidente le conceda la palabra durante la sesión.","c":"Con voz pero sin voto, y con voz y voto si la Secretaría la ostenta un miembro del órgano.","d":"Con voz pero sin voto en todo caso, aunque la Secretaría la ostente un miembro del órgano."},"correcta":"c","explicacion":"Corresponde al Secretario, según el art. 19.4.a), «Asistir a las reuniones con voz pero sin voto, y con voz y voto si la Secretaría del órgano la ostenta un miembro del mismo». La opción a) le reconoce siempre el voto, la opción b) le niega la voz y la opción d) ignora el supuesto en que la Secretaría la ostenta un miembro.","cita":"«a) Asistir a las reuniones con voz pero sin voto, y con voz y voto si la Secretaría del órgano la ostenta un miembro del mismo.»","dificultad":1},{"id":"L40-L2-009","ley":"L40","articulo":"22.3","articulo_txt":"Art. 22.3 Ley 40/2015","bloque_id":"L40|Título Preliminar. Disposiciones generales, principios de actuación y funcionamiento del sector público · Capítulo II. De los órganos de las Administraciones Públicas · Sección 3.ª Órganos colegiados de las distintas administraciones públicas · Subsección 2.ª De los órganos colegiados en la Administración General del Estado","enunciado":"Según el artículo 22.3 de la Ley 40/2015, los órganos colegiados que tienen el carácter de grupos o comisiones de trabajo:","opciones":{"a":"Adoptan acuerdos con efectos frente a terceros desde su publicación oficial.","b":"Adoptan acuerdos que no podrán tener efectos directos frente a terceros.","c":"Adoptan acuerdos con efectos frente a terceros si los ratifica el Ministro.","d":"Adoptan acuerdos con efectos directos frente a terceros si son unánimes."},"correcta":"b","explicacion":"El art. 22.3 establece que los acuerdos de los grupos o comisiones de trabajo «no podrán tener efectos directos frente a terceros», sin excepción alguna. Por eso son falsas la publicación (opción a), la ratificación ministerial (opción c) y la unanimidad (opción d).","cita":"«3. En todos los supuestos no comprendidos en el apartado 1 de este artículo, los órganos colegiados tendrán el carácter de grupos o comisiones de trabajo y podrán ser creados por Acuerdo del Consejo de Ministros o por los Ministerios interesados. Sus acuerdos no podrán tener efectos directos frente a terceros.»","dificultad":1},{"id":"L40-L2-013","ley":"L40","articulo":"23.4","articulo_txt":"Art. 23.4 Ley 40/2015","bloque_id":"L40|Título Preliminar. Disposiciones generales, principios de actuación y funcionamiento del sector público · Capítulo II. De los órganos de las Administraciones Públicas · Sección 4.ª Abstención y recusación","enunciado":"Según el artículo 23.4 de la Ley 40/2015, la actuación de autoridades y personal al servicio de las Administraciones Públicas en los que concurran motivos de abstención:","opciones":{"a":"Determinará en todo caso la nulidad de pleno derecho de los actos en que hayan intervenido.","b":"No implicará, necesariamente, y en todo caso, la invalidez de los actos en que hayan intervenido.","c":"Determinará en todo caso la anulabilidad de los actos en que hayan intervenido.","d":"Solo implicará la invalidez de los actos si los interesados han promovido la recusación."},"correcta":"b","explicacion":"El art. 23.4 dispone que esa actuación «no implicará, necesariamente, y en todo caso, la invalidez de los actos en que hayan intervenido». Por eso son falsas la nulidad (opción a) o la anulabilidad (opción c) automáticas, y la ley no condiciona la invalidez a la recusación (opción d).","cita":"«4. La actuación de autoridades y personal al servicio de las Administraciones Públicas en los que concurran motivos de abstención no implicará, necesariamente, y en todo caso, la invalidez de los actos en que hayan intervenido.»","dificultad":2},{"id":"L40-L2-015","ley":"L40","articulo":"24.3","articulo_txt":"Art. 24.3 Ley 40/2015","bloque_id":"L40|Título Preliminar. Disposiciones generales, principios de actuación y funcionamiento del sector público · Capítulo II. De los órganos de las Administraciones Públicas · Sección 4.ª Abstención y recusación","enunciado":"Según el artículo 24.3 de la Ley 40/2015, planteada la recusación, ¿cuándo manifestará el recusado a su inmediato superior si se da o no en él la causa alegada?","opciones":{"a":"En el día siguiente.","b":"En el plazo de cinco días.","c":"En el plazo de diez días.","d":"En el plazo de quince días."},"correcta":"a","explicacion":"El art. 24.3 dispone que «En el día siguiente el recusado manifestará a su inmediato superior si se da o no en él la causa alegada». Los plazos de las opciones b), c) y d) no figuran en el precepto.","cita":"«3. En el día siguiente el recusado manifestará a su inmediato superior si se da o no en él la causa alegada. En el primer caso, si el superior aprecia la concurrencia de la causa de recusación, acordará su sustitución acto seguido.»","dificultad":2},{"id":"L40-L2-016","ley":"L40","articulo":"24.4","articulo_txt":"Art. 24.4 Ley 40/2015","bloque_id":"L40|Título Preliminar. Disposiciones generales, principios de actuación y funcionamiento del sector público · Capítulo II. De los órganos de las Administraciones Públicas · Sección 4.ª Abstención y recusación","enunciado":"Según el artículo 24.4 de la Ley 40/2015, si el recusado niega la causa de recusación, el superior resolverá en el plazo de:","opciones":{"a":"Cinco días, previos los informes y comprobaciones que considere oportunos.","b":"Diez días, previos los informes y comprobaciones que considere oportunos.","c":"Tres días, previos los informes y comprobaciones que considere oportunos.","d":"Quince días, previos los informes y comprobaciones que considere oportunos."},"correcta":"c","explicacion":"El art. 24.4 establece que, si el recusado niega la causa, «el superior resolverá en el plazo de tres días, previos los informes y comprobaciones que considere oportunos». Los plazos de las opciones a), b) y d) no son los del precepto.","cita":"«4. Si el recusado niega la causa de recusación, el superior resolverá en el plazo de tres días, previos los informes y comprobaciones que considere oportunos.»","dificultad":2},{"id":"L40-L2-028","ley":"L40","articulo":"29.6","articulo_txt":"Art. 29.6 Ley 40/2015","bloque_id":"L40|Título Preliminar. Disposiciones generales, principios de actuación y funcionamiento del sector público · Capítulo III. Principios de la potestad sancionadora","enunciado":"Según el artículo 29.6 de la Ley 40/2015, será sancionable como infracción continuada la realización de una pluralidad de acciones u omisiones que infrinjan el mismo o semejantes preceptos administrativos:","opciones":{"a":"Siempre que perjudiquen a una pluralidad de personas.","b":"Siempre que el infractor hubiera sido sancionado antes por ellas.","c":"En ejecución de un plan preconcebido o aprovechando idéntica ocasión.","d":"Siempre que se cometan en el mismo término municipal."},"correcta":"c","explicacion":"El art. 29.6 considera infracción continuada esa pluralidad de acciones u omisiones realizadas «en ejecución de un plan preconcebido o aprovechando idéntica ocasión». La pluralidad de perjudicados (opción a), la sanción previa (opción b) y la comisión en un mismo municipio (opción d) no son requisitos del precepto.","cita":"«6. Será sancionable, como infracción continuada, la realización de una pluralidad de acciones u omisiones que infrinjan el mismo o semejantes preceptos administrativos, en ejecución de un plan preconcebido o aprovechando idéntica ocasión.»","dificultad":2},{"id":"L40-L2-032","ley":"L40","articulo":"30.2","articulo_txt":"Art. 30.2 Ley 40/2015","bloque_id":"L40|Título Preliminar. Disposiciones generales, principios de actuación y funcionamiento del sector público · Capítulo III. Principios de la potestad sancionadora","enunciado":"Según el artículo 30.2 de la Ley 40/2015, interrumpida la prescripción de la infracción por la iniciación, con conocimiento del interesado, del procedimiento sancionador, el plazo se reiniciará si el expediente estuviera paralizado:","opciones":{"a":"Durante más de tres meses por causa no imputable al presunto responsable.","b":"Durante más de quince días por causa no imputable al presunto responsable.","c":"Durante más de un mes por causa no imputable al presunto responsable.","d":"Durante más de un mes, aunque la causa sea imputable al presunto responsable."},"correcta":"c","explicacion":"El art. 30.2 prevé que se reinicie el plazo «si el expediente sancionador estuviera paralizado durante más de un mes por causa no imputable al presunto responsable». Las opciones a) y b) cambian el plazo y la opción d) prescinde del requisito de que la causa no sea imputable al presunto responsable.","cita":"«Interrumpirá la prescripción la iniciación, con conocimiento del interesado, de un procedimiento administrativo de naturaleza sancionadora, reiniciándose el plazo de prescripción si el expediente sancionador estuviera paralizado durante más de un mes por causa no imputable al presunto responsable.»","dificultad":2},{"id":"L40-L2-034","ley":"L40","articulo":"31.2","articulo_txt":"Art. 31.2 Ley 40/2015","bloque_id":"L40|Título Preliminar. Disposiciones generales, principios de actuación y funcionamiento del sector público · Capítulo III. Principios de la potestad sancionadora","enunciado":"Según el artículo 31.2 de la Ley 40/2015, cuando un órgano de la Unión Europea hubiera impuesto una sanción por los mismos hechos, en los supuestos en que no opere la prohibición del apartado 1, el órgano competente para resolver:","opciones":{"a":"Deberá abstenerse de imponer sanción alguna y archivar el procedimiento sancionador.","b":"Deberá tenerla en cuenta para graduar la sanción que deba imponer, pudiendo minorarla.","c":"Deberá suspender el procedimiento hasta que la sanción de la Unión Europea sea firme.","d":"No podrá tenerla en cuenta, por proceder de un ordenamiento jurídico distinto del estatal."},"correcta":"b","explicacion":"El art. 31.2 se aplica cuando la sanción europea es por los mismos hechos «y siempre que no concurra la identidad de sujeto y fundamento», es decir, cuando no se da la triple identidad que impide sancionar según el apartado 1. En ese caso, el órgano competente «deberá tenerla en cuenta a efectos de graduar la que, en su caso, deba imponer, pudiendo minorarla, sin perjuicio de declarar la comisión de la infracción». No debe abstenerse de sancionar (opción a) ni suspender el procedimiento (opción c), y sí debe tener en cuenta la sanción europea (opción d).","cita":"«2. Cuando un órgano de la Unión Europea hubiera impuesto una sanción por los mismos hechos, y siempre que no concurra la identidad de sujeto y fundamento, el órgano competente para resolver deberá tenerla en cuenta a efectos de graduar la que, en su caso, deba imponer, pudiendo minorarla, sin perjuicio de declarar la comisión de la infracción.»","dificultad":3},{"id":"L40-L2-038","ley":"L40","articulo":"32.8","articulo_txt":"Art. 32.8 Ley 40/2015","bloque_id":"L40|Título Preliminar. Disposiciones generales, principios de actuación y funcionamiento del sector público · Capítulo IV. De la responsabilidad patrimonial de las Administraciones Públicas · Sección 1.ª Responsabilidad patrimonial de las Administraciones Públicas","enunciado":"Según el artículo 32.8 de la Ley 40/2015, ¿quién fija el importe de las indemnizaciones que proceda abonar cuando el Tribunal Constitucional haya declarado, a instancia de parte interesada, la existencia de un funcionamiento anormal en la tramitación de los recursos de amparo o de las cuestiones de inconstitucionalidad?","opciones":{"a":"El Ministerio de Justicia.","b":"El Consejo de Ministros.","c":"El propio Tribunal Constitucional.","d":"El Consejo General del Poder Judicial."},"correcta":"b","explicacion":"El art. 32.8 atribuye al «Consejo de Ministros» la fijación del importe. El Ministerio de Justicia (opción a) solo tramita el procedimiento, «con audiencia al Consejo de Estado», y ni el Tribunal Constitucional (opción c) ni el Consejo General del Poder Judicial (opción d) fijan esas indemnizaciones.","cita":"«8. El Consejo de Ministros fijará el importe de las indemnizaciones que proceda abonar cuando el Tribunal Constitucional haya declarado, a instancia de parte interesada, la existencia de un funcionamiento anormal en la tramitación de los recursos de amparo o de las cuestiones de inconstitucionalidad. El procedimiento para fijar el importe de las indemnizaciones se tramitará por el Ministerio de Justicia, con audiencia al Consejo de Estado.»","dificultad":2},{"id":"L40-L2-039","ley":"L40","articulo":"33.1","articulo_txt":"Art. 33.1 Ley 40/2015","bloque_id":"L40|Título Preliminar. Disposiciones generales, principios de actuación y funcionamiento del sector público · Capítulo IV. De la responsabilidad patrimonial de las Administraciones Públicas · Sección 1.ª Responsabilidad patrimonial de las Administraciones Públicas","enunciado":"Según el artículo 33.1 de la Ley 40/2015, cuando de la gestión dimanante de fórmulas conjuntas de actuación entre varias Administraciones públicas se derive responsabilidad, las Administraciones intervinientes responderán frente al particular:","opciones":{"a":"En todo caso, de forma solidaria.","b":"De forma mancomunada, según su participación.","c":"De forma solidaria, solo si no puede fijarse la de cada una.","d":"De forma subsidiaria respecto de la que gestione el servicio."},"correcta":"a","explicacion":"El art. 33.1 dispone que las Administraciones intervinientes «responderán frente al particular, en todo caso, de forma solidaria», sin perjuicio de que el instrumento regulador distribuya internamente la responsabilidad. La solidaridad condicionada de la opción c) corresponde a los «otros supuestos de concurrencia» del art. 33.2, y las opciones b) y d) no recogen el régimen del precepto.","cita":"«1. Cuando de la gestión dimanante de fórmulas conjuntas de actuación entre varias Administraciones públicas se derive responsabilidad en los términos previstos en la presente Ley, las Administraciones intervinientes responderán frente al particular, en todo caso, de forma solidaria. (…)»","dificultad":2},{"id":"L40-L2-041","ley":"L40","articulo":"34.1","articulo_txt":"Art. 34.1 Ley 40/2015","bloque_id":"L40|Título Preliminar. Disposiciones generales, principios de actuación y funcionamiento del sector público · Capítulo IV. De la responsabilidad patrimonial de las Administraciones Públicas · Sección 1.ª Responsabilidad patrimonial de las Administraciones Públicas","enunciado":"Según el artículo 34.1 de la Ley 40/2015, no serán indemnizables los daños que se deriven de hechos o circunstancias que no se hubiesen podido prever o evitar según el estado de los conocimientos de la ciencia o de la técnica existentes:","opciones":{"a":"En el momento de dictarse la resolución.","b":"En el momento de presentarse la reclamación.","c":"En el momento de iniciarse la prestación del servicio.","d":"En el momento de producción de aquéllos."},"correcta":"d","explicacion":"El art. 34.1 se refiere al estado de los conocimientos de la ciencia o de la técnica «existentes en el momento de producción de aquéllos», es decir, de los daños. Los momentos de las opciones a), b) y c) no son los que menciona el precepto.","cita":"«No serán indemnizables los daños que se deriven de hechos o circunstancias que no se hubiesen podido prever o evitar según el estado de los conocimientos de la ciencia o de la técnica existentes en el momento de producción de aquéllos, todo ello sin perjuicio de las prestaciones asistenciales o económicas que las leyes puedan establecer para estos casos.»","dificultad":2},{"id":"L40-L2-045","ley":"L40","articulo":"36.1","articulo_txt":"Art. 36.1 Ley 40/2015","bloque_id":"L40|Título Preliminar. Disposiciones generales, principios de actuación y funcionamiento del sector público · Capítulo IV. De la responsabilidad patrimonial de las Administraciones Públicas · Sección 2.ª Responsabilidad de las autoridades y personal al servicio de las Administraciones Públicas","enunciado":"Según el artículo 36.1 de la Ley 40/2015, para hacer efectiva la responsabilidad patrimonial, los particulares exigirán las indemnizaciones por los daños y perjuicios causados por las autoridades y personal al servicio de las Administraciones:","opciones":{"a":"Directamente a la autoridad o empleado público causante.","b":"A la Administración, solo si el causante resulta insolvente.","c":"Conjuntamente a la Administración y al causante del daño.","d":"Directamente a la Administración Pública correspondiente."},"correcta":"d","explicacion":"El art. 36.1 dispone que «los particulares exigirán directamente a la Administración Pública correspondiente las indemnizaciones por los daños y perjuicios causados por las autoridades y personal a su servicio». La reclamación no se dirige al causante (opciones a y c) ni la responsabilidad de la Administración es subsidiaria (opción b).","cita":"«1. Para hacer efectiva la responsabilidad patrimonial a que se refiere esta Ley, los particulares exigirán directamente a la Administración Pública correspondiente las indemnizaciones por los daños y perjuicios causados por las autoridades y personal a su servicio.»","dificultad":1},{"id":"L40-L2-046","ley":"L40","articulo":"36.3","articulo_txt":"Art. 36.3 Ley 40/2015","bloque_id":"L40|Título Preliminar. Disposiciones generales, principios de actuación y funcionamiento del sector público · Capítulo IV. De la responsabilidad patrimonial de las Administraciones Públicas · Sección 2.ª Responsabilidad de las autoridades y personal al servicio de las Administraciones Públicas","enunciado":"Según el artículo 36.3 de la Ley 40/2015, la Administración instruirá el correspondiente procedimiento a sus autoridades y demás personal por los daños y perjuicios causados en sus bienes o derechos cuando hubiera concurrido:","opciones":{"a":"Dolo, o culpa o negligencia graves.","b":"Únicamente dolo.","c":"Dolo, o culpa o negligencia leves.","d":"Culpa o negligencia graves, pero no dolo."},"correcta":"a","explicacion":"El art. 36.3 exige que «hubiera concurrido dolo, o culpa o negligencia graves». No basta la culpa leve (opción c), no se limita al dolo (opción b) y el dolo también está incluido (opción d).","cita":"«3. Asimismo, la Administración instruirá igual procedimiento a las autoridades y demás personal a su servicio por los daños y perjuicios causados en sus bienes o derechos cuando hubiera concurrido dolo, o culpa o negligencia graves.»","dificultad":2},{"id":"L40-L2-048","ley":"L40","articulo":"37.2","articulo_txt":"Art. 37.2 Ley 40/2015","bloque_id":"L40|Título Preliminar. Disposiciones generales, principios de actuación y funcionamiento del sector público · Capítulo IV. De la responsabilidad patrimonial de las Administraciones Públicas · Sección 2.ª Responsabilidad de las autoridades y personal al servicio de las Administraciones Públicas","enunciado":"Según el artículo 37.2 de la Ley 40/2015, la exigencia de responsabilidad penal del personal al servicio de las Administraciones Públicas, respecto de los procedimientos de reconocimiento de responsabilidad patrimonial que se instruyan:","opciones":{"a":"Los suspenderá en todo caso hasta que recaiga sentencia firme en el orden jurisdiccional penal.","b":"No los suspenderá, salvo que la determinación de los hechos en el orden penal sea necesaria para fijar aquella.","c":"No los suspenderá en ningún caso, aunque la determinación de los hechos en el orden penal sea necesaria.","d":"Los suspenderá solo cuando así lo solicite el Ministerio Fiscal en el proceso penal."},"correcta":"b","explicacion":"El art. 37.2 dispone que la exigencia de responsabilidad penal «no suspenderá los procedimientos de reconocimiento de responsabilidad patrimonial que se instruyan, salvo que la determinación de los hechos en el orden jurisdiccional penal sea necesaria para la fijación de la responsabilidad patrimonial». La opción a) convierte la excepción en regla, la opción c) niega la excepción y la opción d) añade un requisito que la ley no prevé.","cita":"«2. La exigencia de responsabilidad penal del personal al servicio de las Administraciones Públicas no suspenderá los procedimientos de reconocimiento de responsabilidad patrimonial que se instruyan, salvo que la determinación de los hechos en el orden jurisdiccional penal sea necesaria para la fijación de la responsabilidad patrimonial.»","dificultad":2},{"id":"L40-L3-003","ley":"L40","articulo":"38.3","articulo_txt":"Art. 38.3 Ley 40/2015","bloque_id":"L40|Título Preliminar. Disposiciones generales, principios de actuación y funcionamiento del sector público · Capítulo V. Funcionamiento electrónico del sector público","enunciado":"Según el artículo 38.3 de la Ley 40/2015, ¿cuál de los siguientes principios NO figura entre aquellos a los que debe sujetarse cada Administración Pública al determinar las condiciones e instrumentos de creación de las sedes electrónicas?","opciones":{"a":"Neutralidad.","b":"Interoperabilidad.","c":"Proporcionalidad.","d":"Disponibilidad."},"correcta":"c","explicacion":"El art. 38.3 enumera los principios de «transparencia, publicidad, responsabilidad, calidad, seguridad, disponibilidad, accesibilidad, neutralidad e interoperabilidad», entre los que no está la proporcionalidad. La neutralidad, la interoperabilidad y la disponibilidad (opciones a, b y d) sí figuran en la lista.","cita":"«Cada Administración Pública determinará las condiciones e instrumentos de creación de las sedes electrónicas, con sujeción a los principios de transparencia, publicidad, responsabilidad, calidad, seguridad, disponibilidad, accesibilidad, neutralidad e interoperabilidad. (…)»","dificultad":2},{"id":"L40-L3-011","ley":"L40","articulo":"41.2","articulo_txt":"Art. 41.2 Ley 40/2015","bloque_id":"L40|Título Preliminar. Disposiciones generales, principios de actuación y funcionamiento del sector público · Capítulo V. Funcionamiento electrónico del sector público","enunciado":"Según el artículo 41.2 de la Ley 40/2015, en caso de actuación administrativa automatizada deberá establecerse previamente el órgano u órganos competentes para la definición de las especificaciones, programación, mantenimiento, supervisión y control de calidad y, en su caso:","opciones":{"a":"Publicación del código fuente del sistema en el portal de internet.","b":"Auditoría del sistema de información y de su código fuente.","c":"Certificación del sistema por una entidad acreditada externa.","d":"Notificación a los interesados de los actos dictados por el sistema."},"correcta":"b","explicacion":"El art. 41.2 completa la lista de funciones con la «auditoría del sistema de información y de su código fuente». La publicación del código (opción a), la certificación externa (opción c) y la notificación de los actos (opción d) no figuran en el precepto.","cita":"«En caso de actuación administrativa automatizada deberá establecerse previamente el órgano u órganos competentes, según los casos, para la definición de las especificaciones, programación, mantenimiento, supervisión y control de calidad y, en su caso, auditoría del sistema de información y de su código fuente. (…)»","dificultad":3},{"id":"L40-L3-019","ley":"L40","articulo":"45.2","articulo_txt":"Art. 45.2 Ley 40/2015","bloque_id":"L40|Título Preliminar. Disposiciones generales, principios de actuación y funcionamiento del sector público · Capítulo V. Funcionamiento electrónico del sector público","enunciado":"Según el artículo 45.2 de la Ley 40/2015, cuando una Administración utilice sistemas de firma electrónica distintos de los basados en certificado electrónico reconocido o cualificado para remitir a otras Administraciones documentación firmada electrónicamente, con el fin de favorecer la interoperabilidad y posibilitar la verificación automática de la firma:","opciones":{"a":"Deberá superponer un sello electrónico basado en un certificado electrónico reconocido o cualificado.","b":"Podrá superponer un sello electrónico basado en un certificado electrónico reconocido o cualificado.","c":"Deberá sustituir la firma utilizada por un código seguro de verificación vinculado al órgano remitente.","d":"Podrá superponer la firma electrónica avanzada del titular del órgano que remita la documentación."},"correcta":"b","explicacion":"El art. 45.2 establece que la Administración «podrá superponer un sello electrónico basado en un certificado electrónico reconocido o cualificado». La opción a) convierte esa facultad en obligación, y las opciones c) y d) recogen medidas que el precepto no prevé.","cita":"«Con el fin de favorecer la interoperabilidad y posibilitar la verificación automática de la firma electrónica de los documentos electrónicos, cuando una Administración utilice sistemas de firma electrónica distintos de aquellos basados en certificado electrónico reconocido o cualificado, para remitir o poner a disposición de otros órganos, organismos públicos, entidades de Derecho Público o Administraciones la documentación firmada electrónicamente, podrá superponer un sello electrónico basado en un certificado electrónico reconocido o cualificado.»","dificultad":2},{"id":"L40-L3-035","ley":"L40","articulo":"49.g)","articulo_txt":"Art. 49.g) Ley 40/2015","bloque_id":"L40|Título Preliminar. Disposiciones generales, principios de actuación y funcionamiento del sector público · Capítulo VI. De los convenios","enunciado":"Según el artículo 49.g) de la Ley 40/2015, a falta de regulación expresa en el convenio, la modificación de su contenido requerirá:","opciones":{"a":"Acuerdo de la mayoría absoluta de los firmantes.","b":"Acuerdo unánime de los firmantes.","c":"Acuerdo de los firmantes que aporten la mayor parte de la financiación.","d":"Acuerdo del firmante que lo hubiera promovido, previa audiencia de los demás."},"correcta":"b","explicacion":"El art. 49.g) establece que «A falta de regulación expresa la modificación del contenido del convenio requerirá acuerdo unánime de los firmantes». Las opciones a), c) y d) admiten la modificación sin la unanimidad que exige el precepto.","cita":"«g) El régimen de modificación del convenio. A falta de regulación expresa la modificación del contenido del convenio requerirá acuerdo unánime de los firmantes.»","dificultad":2},{"id":"L40-L3-037","ley":"L40","articulo":"49.h).2.º","articulo_txt":"Art. 49.h).2.º Ley 40/2015","bloque_id":"L40|Título Preliminar. Disposiciones generales, principios de actuación y funcionamiento del sector público · Capítulo VI. De los convenios","enunciado":"Según el artículo 49.h).2.º de la Ley 40/2015, en cualquier momento antes de la finalización del plazo de vigencia previsto, los firmantes del convenio podrán acordar su prórroga por un periodo de:","opciones":{"a":"Hasta dos años adicionales.","b":"Hasta cuatro años adicionales.","c":"Hasta cinco años adicionales.","d":"Hasta seis años adicionales."},"correcta":"b","explicacion":"El art. 49.h).2.º permite acordar la prórroga «por un periodo de hasta cuatro años adicionales o su extinción». Las opciones a), c) y d) recogen periodos que el precepto no prevé.","cita":"«2.º En cualquier momento antes de la finalización del plazo previsto en el apartado anterior, los firmantes del convenio podrán acordar unánimemente su prórroga por un periodo de hasta cuatro años adicionales o su extinción.»","dificultad":2},{"id":"L40-L3-043","ley":"L40","articulo":"51.2","articulo_txt":"Art. 51.2 Ley 40/2015","bloque_id":"L40|Título Preliminar. Disposiciones generales, principios de actuación y funcionamiento del sector público · Capítulo VI. De los convenios","enunciado":"Según el artículo 51.2 de la Ley 40/2015, ¿cuál de las siguientes figura expresamente entre las causas de resolución de los convenios?","opciones":{"a":"El acuerdo de la mayoría de los firmantes.","b":"La resolución administrativa que declare su nulidad.","c":"El acuerdo unánime de todos los firmantes.","d":"El transcurso del plazo de vigencia aunque se haya acordado su prórroga."},"correcta":"c","explicacion":"El art. 51.2.b) recoge como causa de resolución «El acuerdo unánime de todos los firmantes». La opción a) no exige unanimidad, la opción b) sustituye la «decisión judicial declaratoria de la nulidad del convenio» del art. 51.2.d) por una resolución administrativa y la opción d) contradice el art. 51.2.a), que exige que no se haya acordado la prórroga.","cita":"«2. Son causas de resolución: a) El transcurso del plazo de vigencia del convenio sin haberse acordado la prórroga del mismo. b) El acuerdo unánime de todos los firmantes. (…) d) Por decisión judicial declaratoria de la nulidad del convenio. (…)»","dificultad":2},{"id":"L40-L4-003","ley":"L40","articulo":"54.1","articulo_txt":"Art. 54.1 Ley 40/2015","bloque_id":"L40|Título I. Administración General del Estado · Capítulo I. Organización administrativa","enunciado":"Según el artículo 54.1 de la Ley 40/2015, la Administración General del Estado garantizará el principio de presencia equilibrada de mujeres y hombres en los nombramientos y designaciones de las personas titulares de los órganos superiores y directivos y, además, en:","opciones":{"a":"Las jefaturas de las unidades administrativas de los Ministerios.","b":"Los puestos de libre designación de nivel inferior a Subdirección General.","c":"El personal de alta dirección de las entidades del sector público institucional estatal.","d":"Los órganos de cooperación con las Comunidades Autónomas."},"correcta":"c","explicacion":"El segundo párrafo del art. 54.1, en la redacción dada por el art. 8.1 de la Ley Orgánica 2/2024, de 1 de agosto, extiende esa garantía al «personal de alta dirección de las entidades del sector público institucional estatal», de acuerdo con los artículos 55 bis y 84 bis. Las opciones a), b) y d) no aparecen en el precepto.","cita":"«Asimismo, garantizará el principio de presencia equilibrada de mujeres y hombres en los nombramientos y designaciones de las personas titulares de los órganos superiores y directivos y en el personal de alta dirección de las entidades del sector público institucional estatal, de acuerdo con lo establecido en los artículos 55 bis y 84 bis.»","dificultad":2},{"id":"L40-L4-001","ley":"L40","articulo":"54.1","articulo_txt":"Art. 54.1 Ley 40/2015","bloque_id":"L40|Título I. Administración General del Estado · Capítulo I. Organización administrativa","enunciado":"Según el artículo 54.1 de la Ley 40/2015, además de los principios establecidos en el artículo 3, la Administración General del Estado actúa y se organiza de acuerdo con los principios de:","opciones":{"a":"Descentralización funcional y desconcentración funcional y territorial.","b":"Descentralización territorial y desconcentración funcional.","c":"Desconcentración funcional y descentralización funcional y territorial.","d":"Descentralización funcional y territorial y desconcentración territorial."},"correcta":"a","explicacion":"El art. 54.1 añade a los principios del artículo 3 «los de descentralización funcional y desconcentración funcional y territorial». La opción b) habla de descentralización territorial y omite la desconcentración territorial, la opción c) intercambia los sustantivos de ambos principios (atribuye la vertiente territorial a la descentralización) y la opción d) omite la desconcentración funcional y añade una descentralización territorial que el precepto no recoge.","cita":"«1. La Administración General del Estado actúa y se organiza de acuerdo con los principios establecidos en el artículo 3, así como los de descentralización funcional y desconcentración funcional y territorial.»","dificultad":2},{"id":"L40-L4-007","ley":"L40","articulo":"55.3.b)","articulo_txt":"Art. 55.3.b) Ley 40/2015","bloque_id":"L40|Título I. Administración General del Estado · Capítulo I. Organización administrativa","enunciado":"Según el artículo 55.3.b) de la Ley 40/2015, ¿qué órganos directivos de la organización central figuran en el ordinal 1.º de su enumeración?","opciones":{"a":"Los Subsecretarios y Secretarios generales técnicos.","b":"Los Secretarios generales y Directores generales.","c":"Los Subsecretarios y Secretarios generales.","d":"Los Subsecretarios y Directores generales."},"correcta":"c","explicacion":"El art. 55.3.b) sitúa en el ordinal 1.º a «Los Subsecretarios y Secretarios generales», en el 2.º a «Los Secretarios generales técnicos y Directores generales» y en el 3.º a «Los Subdirectores generales». Las opciones a), b) y d) mezclan órganos de los ordinales 1.º y 2.º.","cita":"«b) Órganos directivos: 1.º Los Subsecretarios y Secretarios generales. 2.º Los Secretarios generales técnicos y Directores generales. 3.º Los Subdirectores generales.»","dificultad":2},{"id":"L40-L4-026","ley":"L40","articulo":"61","articulo_txt":"Art. 61 Ley 40/2015","bloque_id":"L40|Título I. Administración General del Estado · Capítulo II. Los Ministerios y su estructura interna","enunciado":"Según el artículo 61 de la Ley 40/2015, ¿cuál de las siguientes funciones NO corresponde a los Ministros?","opciones":{"a":"Ejercer la potestad reglamentaria en las materias propias de su Departamento.","b":"Convocar las Conferencias sectoriales en el ámbito de las competencias atribuidas a su Departamento.","c":"Revisar de oficio los actos administrativos y resolver los conflictos de atribuciones cuando les corresponda.","d":"Ostentar la representación ordinaria del Ministerio."},"correcta":"d","explicacion":"La representación ordinaria del Ministerio no figura entre las funciones del art. 61: el art. 63.1 dispone que «Los Subsecretarios ostentan la representación ordinaria del Ministerio». El art. 61.m) solo atribuye a los Ministros decidir la representación del Ministerio en los órganos colegiados o grupos de trabajo en los que no esté previamente determinado quién debe representarlo, lo que no equivale a ostentar la representación ordinaria. Las funciones de las opciones a), b) y c) corresponden a los Ministros según el art. 61.a), h) y j).","cita":"«a) Ejercer la potestad reglamentaria en las materias propias de su Departamento. (…) h) Mantener las relaciones con las Comunidades Autónomas y convocar las Conferencias sectoriales y los órganos de cooperación en el ámbito de las competencias atribuidas a su Departamento. (…) j) Revisar de oficio los actos administrativos y resolver los conflictos de atribuciones cuando les corresponda, así como plantear los que procedan con otros Ministerios.»","dificultad":2},{"id":"L40-L4-036","ley":"L40","articulo":"64.3","articulo_txt":"Art. 64.3 Ley 40/2015","bloque_id":"L40|Título I. Administración General del Estado · Capítulo II. Los Ministerios y su estructura interna","enunciado":"Según el artículo 64.3 de la Ley 40/2015, los nombramientos de los Secretarios generales habrán de efectuarse entre:","opciones":{"a":"Personas con cualificación y experiencia en el desempeño de puestos de responsabilidad en la gestión pública o privada.","b":"Funcionarios de carrera del Estado pertenecientes al Subgrupo A1 con experiencia en puestos directivos.","c":"Funcionarios de carrera o personal laboral fijo de las Administraciones Públicas con titulación universitaria superior.","d":"Funcionarios de carrera del Estado con al menos diez años de servicios."},"correcta":"a","explicacion":"El art. 64.3 exige «personas con cualificación y experiencia en el desempeño de puestos de responsabilidad en la gestión pública o privada», que además han de reunir los requisitos de idoneidad de la Ley 3/2015. El precepto no exige la condición de funcionario ni de personal laboral, por lo que las opciones b), c) y d) son incorrectas.","cita":"«Los nombramientos habrán de efectuarse entre personas con cualificación y experiencia en el desempeño de puestos de responsabilidad en la gestión pública o privada.»","dificultad":2},{"id":"L40-L4-043","ley":"L40","articulo":"67.2","articulo_txt":"Art. 67.2 Ley 40/2015","bloque_id":"L40|Título I. Administración General del Estado · Capítulo II. Los Ministerios y su estructura interna","enunciado":"Según el artículo 67.2 de la Ley 40/2015, los Subdirectores generales serán nombrados y cesados por:","opciones":{"a":"Real Decreto del Consejo de Ministros, a propuesta del Ministro.","b":"El Subsecretario del Departamento, en todo caso.","c":"El Secretario general técnico, a propuesta del Subsecretario.","d":"El Ministro, Secretario de Estado o Subsecretario del que dependan."},"correcta":"d","explicacion":"El art. 67.2 dispone que los Subdirectores generales son nombrados, respetando los principios de igualdad, mérito y capacidad, y cesados «por el Ministro, Secretario de Estado o Subsecretario del que dependan». La opción a) exige un Real Decreto que el precepto no prevé, la opción b) atribuye la competencia siempre al Subsecretario y la opción c) menciona al Secretario general técnico, que no figura en el apartado.","cita":"«2. Los Subdirectores generales serán nombrados, respetando los principios de igualdad, mérito y capacidad, y cesados por el Ministro, Secretario de Estado o Subsecretario del que dependan.»","dificultad":2}]};</script>
<script>
/* Letra de Ley — motor de test. Sin dependencias; funciona sin conexión.
   Necesita window.LDL_CONFIG y window.LDL_BANCO (los inyecta sistema/letradeley.py). */
(function () {
  "use strict";
  var CFG = window.LDL_CONFIG, B = window.LDL_BANCO;
  var raiz = document.getElementById("ldl");
  var LETRAS = ["a", "b", "c", "d"];
  var POR_ID = {};
  B.preguntas.forEach(function (p) { POR_ID[p.id] = p; });
  var CLAVE = "ldl1:" + CFG.pack.id;
  var prog = cargar();
  var sesion = null;
  var vista = CFG.modo === "web" ? "portada" : "inicio";
  var reloj = null;

  /* ---------- utilidades ---------- */
  function esc(t) {
    return String(t == null ? "" : t).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function barajar(lista) {
    var a = lista.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function pct(a, b) { return b ? Math.round((a / b) * 100) : 0; }
  function plural(n, uno, varios) { return n + " " + (n === 1 ? uno : varios); }
  function num(n) { return String(n).replace(".", ","); }
  function cargar() {
    try { var s = localStorage.getItem(CLAVE); if (s) { var d = JSON.parse(s); if (d && d.p) return d; } } catch (e) {}
    return { p: {}, h: [] };
  }
  function guardar() { try { localStorage.setItem(CLAVE, JSON.stringify(prog)); } catch (e) {} }
  function registrar(id, acierto) {
    var r = prog.p[id] || { v: 0, a: 0, f: 0, c: 0 };
    r.v++;
    if (acierto) { r.a++; r.c = Math.min((r.c || 0) + 1, 5); } else { r.f++; r.c = 0; }
    r.u = acierto ? 1 : 0;
    r.t = Date.now();
    prog.p[id] = r;
    guardar();
  }
  function fallosPendientes() {
    return B.preguntas.filter(function (p) { var r = prog.p[p.id]; return r && r.u === 0; });
  }
  function resumen(lista) {
    var vistas = 0, aciertos = 0, intentos = 0;
    lista.forEach(function (p) {
      var r = prog.p[p.id];
      if (r) { vistas++; aciertos += r.a; intentos += r.v; }
    });
    return { total: lista.length, vistas: vistas, acierto: pct(aciertos, intentos) };
  }
  function delBloque(id) { return B.preguntas.filter(function (p) { return p.bloque_id === id; }); }

  /* ---------- tema claro / oscuro ---------- */
  function aplicarTema() {
    var t = null;
    try { t = localStorage.getItem("ldl:tema"); } catch (e) {}
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    else document.documentElement.removeAttribute("data-theme");
    return t || "auto";
  }
  function cambiarTema() {
    var orden = { auto: "light", light: "dark", dark: "auto" };
    var actual = aplicarTema();
    try { localStorage.setItem("ldl:tema", orden[actual]); } catch (e) {}
    aplicarTema();
    pintar();
  }

  /* ---------- sesiones ---------- */
  function empezar(tipo, preguntas, opciones) {
    opciones = opciones || {};
    if (!preguntas.length) return;
    pararReloj();
    sesion = {
      tipo: tipo, titulo: opciones.titulo || "Test", ids: preguntas.map(function (p) { return p.id; }),
      i: 0, resp: {}, corregida: {}, inicio: Date.now(), limite: opciones.minutos ? opciones.minutos * 60 : 0, fin: null,
      origen: vista === "test" || vista === "resultado" ? (sesion && sesion.origen) || "inicio" : vista
    };
    vista = "test";
    if (sesion.limite) reloj = setInterval(tic, 1000);
    pintar();
    window.scrollTo(0, 0);
  }
  function tic() {
    if (!sesion || sesion.fin) return pararReloj();
    var el = document.getElementById("ldl-crono");
    var resta = sesion.limite - Math.floor((Date.now() - sesion.inicio) / 1000);
    if (resta <= 0) { terminar(); return; }
    if (el) el.textContent = mmss(resta);
  }
  function pararReloj() { if (reloj) { clearInterval(reloj); reloj = null; } }
  function mmss(s) { var m = Math.floor(s / 60), r = s % 60; return m + ":" + (r < 10 ? "0" : "") + r; }

  function responder(letra) {
    var id = sesion.ids[sesion.i];
    if (sesion.tipo === "simulacro") {
      sesion.resp[id] = sesion.resp[id] === letra ? undefined : letra;
      pintar();
      return;
    }
    if (sesion.corregida[id]) return;
    sesion.resp[id] = letra;
    sesion.corregida[id] = true;
    registrar(id, letra === POR_ID[id].correcta);
    pintar();
  }
  function siguiente() {
    if (sesion.i < sesion.ids.length - 1) { sesion.i++; pintar(); window.scrollTo(0, 0); }
    else terminar();
  }
  function anterior() { if (sesion.i > 0) { sesion.i--; pintar(); } }
  function terminar() {
    pararReloj();
    if (sesion.tipo === "simulacro") {
      sesion.ids.forEach(function (id) {
        if (sesion.resp[id]) registrar(id, sesion.resp[id] === POR_ID[id].correcta);
      });
    }
    sesion.fin = Date.now();
    var r = calcular(sesion);
    prog.h.unshift({ t: sesion.fin, tipo: sesion.tipo, n: r.total, a: r.aciertos, e: r.errores, nota: r.nota });
    prog.h = prog.h.slice(0, 50);
    guardar();
    vista = "resultado";
    pintar();
    window.scrollTo(0, 0);
  }
  function calcular(s) {
    var a = 0, e = 0, nr = 0;
    s.ids.forEach(function (id) {
      var r = s.resp[id];
      if (!r) nr++; else if (r === POR_ID[id].correcta) a++; else e++;
    });
    var pen = (CFG.simulacro && CFG.simulacro.penalizacion) || 1 / 3;
    var neta = s.tipo === "simulacro" ? a - e * pen : a;
    var nota = Math.max(0, (neta / s.ids.length) * 10);
    return { total: s.ids.length, aciertos: a, errores: e, blancos: nr, neta: neta, nota: Math.round(nota * 100) / 100 };
  }

  /* ---------- vistas ---------- */
  function cabecera() {
    var tema = aplicarTema();
    var etiquetas = { auto: "Tema: auto", light: "Tema: claro", dark: "Tema: oscuro" };
    return '<header class="ldl-top"><a class="ldl-brand" href="' + esc(CFG.web || "#") + '">' +
      '<span class="ldl-logo" aria-hidden="true">§</span><span><b>Letra de Ley</b><small>' +
      esc(CFG.pack.nombre) + "</small></span></a>" +
      '<button class="ldl-tema" data-acc="tema" type="button">' + etiquetas[tema] + "</button></header>";
  }
  function navegacion() {
    if (CFG.modo === "web") return "";
    var items = [["inicio", "Inicio"], ["temas", "Por temas"], ["simulacro", "Simulacro"], ["fallos", "Fallos"], ["stats", "Estadísticas"]];
    return '<nav class="ldl-nav" aria-label="Secciones">' + items.map(function (it) {
      var actual = vista === it[0] || (vista === "test" && sesion && sesion.origen === it[0]);
      return '<button type="button" data-acc="ir" data-v="' + it[0] + '"' + (actual ? ' aria-current="page"' : "") + ">" + it[1] + "</button>";
    }).join("") + "</nav>";
  }
  function pie() {
    return '<p class="ldl-pie">Letra de Ley · ' + esc(CFG.pack.edicion) + " · Texto legal actualizado a " +
      esc(CFG.pack.actualizado) + "<br>Uso personal. Prohibida su redistribución.</p>";
  }

  function vInicio() {
    var r = resumen(B.preguntas), f = fallosPendientes().length;
    return '<section class="ldl-card"><h2>' + esc(CFG.pack.nombre) + "</h2>" +
      '<p class="ldl-muted">' + B.preguntas.length + " preguntas comentadas, con el artículo exacto de cada respuesta.</p>" +
      '<div class="ldl-kpis"><div class="ldl-kpi"><b>' + r.vistas + "/" + r.total + "</b><span>respondidas</span></div>" +
      '<div class="ldl-kpi"><b>' + r.acierto + ' %</b><span>de acierto</span></div>' +
      '<div class="ldl-kpi"><b>' + f + "</b><span>fallos por repasar</span></div></div>" +
      '<div class="ldl-acciones"><button class="ldl-btn" data-acc="rapido" type="button">Test rápido de 20</button>' +
      '<button class="ldl-btn sec" data-acc="ir" data-v="simulacro" type="button">Simulacro de examen</button>' +
      (f ? '<button class="ldl-btn sec" data-acc="repasar" type="button">Repasar ' + f + " fallos</button>" : "") +
      "</div></section>" +
      '<section class="ldl-card"><h3>Cómo sacarle partido</h3><ol class="ldl-muted">' +
      "<li>Practica <b>por temas</b>: cada respuesta te enseña el artículo y por qué fallan las demás opciones.</li>" +
      "<li>Cada pocos días, <b>repasa tus fallos</b>: es donde más se aprende.</li>" +
      "<li>Antes del examen, haz <b>simulacros</b> con tiempo y con la penalización real (cada error resta 1/3).</li></ol>" +
      '<p class="ldl-small ldl-muted">Tu progreso se guarda en este dispositivo y en este navegador.</p></section>' + historial();
  }
  function historial() {
    if (!prog.h.length) return "";
    return '<section class="ldl-card"><h3>Últimos tests</h3><ul class="ldl-revision">' + prog.h.slice(0, 5).map(function (h) {
      var d = new Date(h.t);
      return "<li><b>" + (h.tipo === "simulacro" ? "Simulacro" : "Práctica") + "</b> · " + d.toLocaleDateString("es-ES") +
        " · " + h.a + "/" + h.n + " aciertos" + (h.tipo === "simulacro" ? " · nota " + num(h.nota) : "") + "</li>";
    }).join("") + "</ul></section>";
  }
  function vTemas() {
    var html = '<section class="ldl-card"><h2>Practicar por temas</h2><p class="ldl-muted">Elige un bloque. Las preguntas salen en orden aleatorio y se corrigen al momento.</p><ul class="ldl-bloques">';
    B.bloques.forEach(function (b) {
      var lista = delBloque(b.id), r = resumen(lista);
      html += '<li><button type="button" data-acc="bloque" data-id="' + esc(b.id) + '"><span class="t">' + esc(b.nombre) +
        '</span><span class="n">' + r.vistas + "/" + r.total + (r.vistas ? " · " + r.acierto + " %" : "") + "</span>" +
        '<span class="ldl-barra"><i style="width:' + pct(r.vistas, r.total) + '%"></i></span></button></li>';
    });
    return html + "</ul></section>";
  }
  function vSimulacro() {
    var total = B.preguntas.length;
    var opcionesN = [10, 20, 30, 50, 100].filter(function (n) { return n < total; });
    opcionesN.push(total);
    var porDefecto = Math.min((CFG.simulacro && CFG.simulacro.preguntas) || 30, total);
    return '<section class="ldl-card"><h2>Simulacro de examen</h2>' +
      '<p class="ldl-muted">Como el día del examen: no ves las soluciones hasta el final y cada error resta un tercio de acierto.</p>' +
      '<div class="ldl-campo"><label for="ldl-n">Número de preguntas</label><select id="ldl-n">' +
      opcionesN.map(function (n) { return "<option" + (n === porDefecto ? " selected" : "") + ">" + n + "</option>"; }).join("") +
      '</select></div><div class="ldl-campo"><label for="ldl-t">Tiempo</label><select id="ldl-t">' +
      '<option value="1">1 minuto por pregunta</option><option value="0">Sin límite de tiempo</option></select></div>' +
      '<div class="ldl-campo"><label for="ldl-b">Temas</label><select id="ldl-b"><option value="">Todos</option>' +
      B.bloques.map(function (b) { return '<option value="' + esc(b.id) + '">' + esc(b.nombre) + "</option>"; }).join("") +
      '</select></div><div class="ldl-acciones"><button class="ldl-btn" data-acc="simular" type="button">Empezar simulacro</button></div></section>';
  }
  function vFallos() {
    var f = fallosPendientes();
    if (!f.length) {
      return '<section class="ldl-card"><h2>Repaso de fallos</h2><p class="ldl-muted">No tienes fallos pendientes. Cuando falles una pregunta aparecerá aquí hasta que la aciertes.</p></section>';
    }
    return '<section class="ldl-card"><h2>Repaso de fallos</h2><p class="ldl-muted">Tienes <b>' + f.length +
      "</b> preguntas falladas. Salen de aquí en cuanto las aciertas.</p>" +
      '<div class="ldl-acciones"><button class="ldl-btn" data-acc="repasar" type="button">Repasar ahora</button></div></section>';
  }
  function vStats() {
    var html = '<section class="ldl-card"><h2>Estadísticas</h2><ul class="ldl-bloques">';
    B.bloques.forEach(function (b) {
      var r = resumen(delBloque(b.id));
      html += '<li><button type="button" data-acc="bloque" data-id="' + esc(b.id) + '"><span class="t">' + esc(b.nombre) +
        '</span><span class="n">' + (r.vistas ? r.acierto + " % de acierto" : "sin empezar") + '</span><span class="ldl-barra"><i style="width:' +
        r.acierto + '%"></i></span></button></li>';
    });
    html += '</ul></section><section class="ldl-card"><h3>Empezar de cero</h3><p class="ldl-muted ldl-small">Borra tu progreso guardado en este dispositivo.</p>' +
      '<div class="ldl-acciones"><button class="ldl-btn sec" data-acc="borrar" type="button">Borrar mi progreso</button></div></section>';
    return html;
  }
  function vPortada() {
    var n = B.preguntas.length;
    return '<section class="ldl-card"><h2>' + esc(CFG.pack.nombre) + "</h2>" +
      '<p class="ldl-muted">' + n + " preguntas tipo examen, corregidas al momento, con el artículo exacto y la explicación de cada opción. Gratis y sin registrarte.</p>" +
      '<div class="ldl-acciones"><button class="ldl-btn" data-acc="empezarweb" type="button">Empezar el test</button></div></section>';
  }

  function vTest() {
    var id = sesion.ids[sesion.i], p = POR_ID[id], sim = sesion.tipo === "simulacro";
    var elegida = sesion.resp[id], corregida = !sim && sesion.corregida[id];
    var html = '<section class="ldl-card"><div class="ldl-meta"><span>' + esc(sesion.titulo) + " · " + (sesion.i + 1) + " de " + sesion.ids.length +
      "</span><span>" + (sesion.limite ? '⏱ <span id="ldl-crono" class="ldl-crono">' +
        mmss(Math.max(0, sesion.limite - Math.floor((Date.now() - sesion.inicio) / 1000))) + "</span>" : esc(p.articulo_txt)) +
      '</span></div><div class="ldl-progreso"><i style="width:' + pct(sesion.i + (corregida ? 1 : 0), sesion.ids.length) + '%"></i></div>' +
      '<p class="ldl-enunciado">' + esc(p.enunciado) + '</p><div class="ldl-opciones" role="group" aria-label="Opciones">';
    LETRAS.forEach(function (l) {
      var cls = "ldl-op";
      if (corregida) { if (l === p.correcta) cls += " ok"; else if (l === elegida) cls += " ko"; }
      else if (sim && elegida === l) cls += " marcada";
      html += '<button type="button" class="' + cls + '" data-acc="resp" data-l="' + l + '"' + (corregida ? " disabled" : "") +
        (sim ? ' aria-pressed="' + (elegida === l) + '"' : "") + '><span class="l">' + l + ")</span><span>" + esc(p.opciones[l]) + "</span></button>";
    });
    html += "</div>";
    if (corregida) html += feedback(p, elegida);
    html += '<div class="ldl-acciones">';
    if (sim) {
      html += (sesion.i > 0 ? '<button class="ldl-btn sec" data-acc="ant" type="button">Anterior</button>' : "") +
        '<button class="ldl-btn" data-acc="sig" type="button">' + (sesion.i < sesion.ids.length - 1 ? "Siguiente" : "Entregar") + "</button>" +
        (sesion.i < sesion.ids.length - 1 ? '<button class="ldl-btn sec" data-acc="entregar" type="button">Entregar ya</button>' : "");
    } else if (corregida) {
      html += '<button class="ldl-btn" data-acc="sig" type="button">' + (sesion.i < sesion.ids.length - 1 ? "Siguiente" : "Ver resultado") + "</button>";
    }
    html += '<button class="ldl-btn sec" data-acc="salir" type="button">Salir</button></div></section>';
    return html;
  }
  function feedback(p, elegida) {
    var bien = elegida === p.correcta;
    return '<div class="ldl-feedback" aria-live="polite"><div class="v ' + (bien ? "ok" : "ko") + '">' +
      (bien ? "¡Correcta!" : "Incorrecta. La respuesta correcta es la " + p.correcta + ")") + "</div><div>" + esc(p.explicacion) + "</div>" +
      (p.cita ? '<blockquote class="ldl-cita">' + esc(p.cita) + "<small>" + esc(p.articulo_txt) + "</small></blockquote>" : "") + "</div>";
  }
  function vResultado() {
    var r = calcular(sesion), sim = sesion.tipo === "simulacro";
    var html = '<section class="ldl-card"><h2>' + (sim ? "Resultado del simulacro" : "Resultado") + "</h2>" +
      '<div class="ldl-nota">' + (sim ? num(r.nota.toFixed(2)) : r.aciertos + "/" + r.total) + "</div>" +
      '<p class="ldl-muted">' + plural(r.aciertos, "acierto", "aciertos") + " · " + plural(r.errores, "error", "errores") +
      (r.blancos ? " · " + r.blancos + " en blanco" : "") +
      (sim ? " · nota sobre 10 con penalización" : "") + "</p>";
    if (CFG.modo === "web") html += ctaWeb(r);
    html += '<div class="ldl-acciones">' + (CFG.modo === "web" ? '<button class="ldl-btn sec" data-acc="empezarweb" type="button">Repetir con otro orden</button>' :
      '<button class="ldl-btn" data-acc="ir" data-v="inicio" type="button">Volver al inicio</button>') + "</div></section>";
    html += '<section class="ldl-card"><h3>Revisión</h3><ul class="ldl-revision">';
    sesion.ids.forEach(function (id, n) {
      var p = POR_ID[id], e = sesion.resp[id], chip = !e ? '<span class="ldl-chip nr">En blanco</span>' :
        e === p.correcta ? '<span class="ldl-chip ok">Bien</span>' : '<span class="ldl-chip ko">Mal</span>';
      html += "<li>" + chip + '<span class="e">' + (n + 1) + ". " + esc(p.enunciado) + "</span><br>" +
        '<span class="ldl-small">Correcta: <b>' + p.correcta + ") " + esc(p.opciones[p.correcta]) + "</b>" +
        (e && e !== p.correcta ? " · Marcaste " + e + ")" : "") + '</span><br><span class="ldl-small ldl-muted">' + esc(p.explicacion) + "</span></li>";
    });
    return html + "</ul></section>";
  }
  function ctaWeb() {
    var c = CFG.compra || {}, html = "";
    if (c.url) {
      html += '<div class="ldl-card ldl-cta"><h3>' + esc(c.titulo) + '</h3><p class="ldl-muted">' + esc(c.texto) + "</p>" +
        '<div class="ldl-acciones"><a class="ldl-btn acc" href="' + esc(c.url) + '">' + esc(c.boton) + "</a></div></div>";
    }
    if (CFG.telegram) {
      html += '<p class="ldl-small">¿Quieres un test cada día? <a href="' + esc(CFG.telegram) + '">Únete gratis al canal de Telegram</a>.</p>';
    }
    return html;
  }

  function pintar() {
    var cuerpo;
    if (vista === "test") cuerpo = vTest();
    else if (vista === "resultado") cuerpo = vResultado();
    else if (vista === "portada") cuerpo = vPortada();
    else if (vista === "temas") cuerpo = vTemas();
    else if (vista === "simulacro") cuerpo = vSimulacro();
    else if (vista === "fallos") cuerpo = vFallos();
    else if (vista === "stats") cuerpo = vStats();
    else cuerpo = vInicio();
    raiz.innerHTML = '<div class="ldl">' + cabecera() + navegacion() + "<main>" + cuerpo + "</main>" + pie() + "</div>";
  }

  /* ---------- eventos ---------- */
  raiz.addEventListener("click", function (ev) {
    var el = ev.target.closest("[data-acc]");
    if (!el) return;
    var acc = el.getAttribute("data-acc");
    if (acc === "tema") return cambiarTema();
    if (acc === "ir") { pararReloj(); vista = el.getAttribute("data-v"); sesion = null; pintar(); return; }
    if (acc === "rapido") return empezar("practica", barajar(B.preguntas).slice(0, 20), { titulo: "Test rápido" });
    if (acc === "repasar") return empezar("practica", barajar(fallosPendientes()).slice(0, 30), { titulo: "Repaso de fallos" });
    if (acc === "bloque") {
      var b = B.bloques.filter(function (x) { return x.id === el.getAttribute("data-id"); })[0];
      return empezar("practica", barajar(delBloque(b.id)), { titulo: b.nombre });
    }
    if (acc === "simular") {
      var n = parseInt(document.getElementById("ldl-n").value, 10);
      var conTiempo = document.getElementById("ldl-t").value === "1";
      var bloque = document.getElementById("ldl-b").value;
      var fuente = bloque ? delBloque(bloque) : B.preguntas;
      var elegidas = barajar(fuente).slice(0, n);
      return empezar("simulacro", elegidas, { titulo: "Simulacro", minutos: conTiempo ? elegidas.length : 0 });
    }
    if (acc === "empezarweb") return empezar("practica", barajar(B.preguntas), { titulo: "Test gratuito" });
    if (acc === "resp") return responder(el.getAttribute("data-l"));
    if (acc === "sig") return siguiente();
    if (acc === "ant") return anterior();
    if (acc === "entregar") return terminar();
    if (acc === "salir") { pararReloj(); sesion = null; vista = CFG.modo === "web" ? "portada" : "inicio"; pintar(); return; }
    if (acc === "borrar") {
      if (el.getAttribute("data-confirmar") === "1") { prog = { p: {}, h: [] }; guardar(); pintar(); }
      else { el.setAttribute("data-confirmar", "1"); el.textContent = "Pulsa otra vez para confirmar"; }
    }
  });
  document.addEventListener("keydown", function (ev) {
    if (vista !== "test" || !sesion || ev.altKey || ev.ctrlKey || ev.metaKey) return;
    var k = ev.key.toLowerCase(), mapa = { "1": "a", "2": "b", "3": "c", "4": "d", a: "a", b: "b", c: "c", d: "d" };
    if (mapa[k]) { ev.preventDefault(); responder(mapa[k]); }
    else if (k === "enter" || k === "arrowright") {
      var id = sesion.ids[sesion.i];
      if (sesion.tipo === "simulacro" || sesion.corregida[id]) { ev.preventDefault(); siguiente(); }
    } else if (k === "arrowleft" && sesion.tipo === "simulacro") { ev.preventDefault(); anterior(); }
  });

  pintar();
})();
</script>
</body>
</html>
