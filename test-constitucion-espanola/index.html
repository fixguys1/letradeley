e":"Disposición derogatoria"},{"id":"CE|Disposición final","ley":"CE","nombre":"Disposición final"}],"preguntas":[{"id":"CE-L1-002","ley":"CE","articulo":"Preámbulo","articulo_txt":"Preámbulo · CE","bloque_id":"CE|Preámbulo","enunciado":"Según el Preámbulo de la Constitución, ¿quién aprueba la Constitución y quién la ratifica?","opciones":{"a":"El pueblo español la aprueba y las Cortes la ratifican","b":"Las Cortes la aprueban y el Rey la ratifica","c":"La Nación española la aprueba y las Cortes la ratifican","d":"Las Cortes la aprueban y el pueblo español la ratifica"},"correcta":"d","explicacion":"El último párrafo del Preámbulo dice que «las Cortes aprueban y el pueblo español ratifica» la Constitución. La a) invierte los papeles que el Preámbulo atribuye a las Cortes y al pueblo español. La b) el Preámbulo no menciona al Rey: quien ratifica es el pueblo español. La c) la Nación española es el sujeto que proclama su voluntad al comienzo del Preámbulo, no quien aprueba la Constitución.","cita":"«En consecuencia, las Cortes aprueban y el pueblo español ratifica la siguiente CONSTITUCIÓN»","dificultad":1},{"id":"CE-L1-003","ley":"CE","articulo":"Preámbulo","articulo_txt":"Preámbulo · CE","bloque_id":"CE|Preámbulo","enunciado":"Según el Preámbulo de la Constitución, uno de los fines que se proclaman es consolidar un Estado de Derecho que asegure:","opciones":{"a":"el imperio de la ley como expresión de la voluntad popular","b":"la soberanía nacional como expresión de la voluntad popular","c":"la convivencia democrática dentro de la Constitución y de las leyes","d":"la primacía de la Constitución como norma suprema del ordenamiento"},"correcta":"a","explicacion":"El Preámbulo proclama la voluntad de «Consolidar un Estado de Derecho que asegure el imperio de la ley como expresión de la voluntad popular». La b) sustituye «el imperio de la ley» por la soberanía nacional, que el art. 1.2 sitúa en el pueblo español. La c) la convivencia democrática es otro fin distinto del Preámbulo, que la Nación quiere «garantizar». La d) esa expresión no figura en el Preámbulo.","cita":"«Consolidar un Estado de Derecho que asegure el imperio de la ley como expresión de la voluntad popular.»","dificultad":2},{"id":"CE-L1-010","ley":"CE","articulo":"1.2","articulo_txt":"Art. 1.2 CE","bloque_id":"CE|Título Preliminar","enunciado":"Según el artículo 1.2 de la Constitución, la soberanía nacional:","opciones":{"a":"reside en las Cortes Generales, de las que emanan los poderes del Estado","b":"reside en la Nación española, de la que emanan los poderes del Estado","c":"reside en el Rey y en las Cortes Generales, de quienes emanan los poderes del Estado","d":"reside en el pueblo español, del que emanan los poderes del Estado"},"correcta":"d","explicacion":"El art. 1.2 establece: «La soberanía nacional reside en el pueblo español, del que emanan los poderes del Estado». La a) el art. 1.2 no sitúa la soberanía en las Cortes Generales, sino en el pueblo español. La b) aunque el Preámbulo dice que la Nación española actúa «en uso de su soberanía», el art. 1.2 sitúa la soberanía nacional en el pueblo español. La c) el art. 1.2 no menciona al Rey ni a las Cortes Generales.","cita":"«La soberanía nacional reside en el pueblo español, del que emanan los poderes del Estado.»","dificultad":1},{"id":"CE-L1-039","ley":"CE","articulo":"8.1","articulo_txt":"Art. 8.1 CE","bloque_id":"CE|Título Preliminar","enunciado":"¿Cuál de las siguientes NO forma parte de la misión que el artículo 8.1 de la Constitución atribuye a las Fuerzas Armadas?","opciones":{"a":"Garantizar la soberanía e independencia de España","b":"Defender la integridad territorial de España","c":"Garantizar la seguridad ciudadana","d":"Defender el ordenamiento constitucional"},"correcta":"c","explicacion":"La seguridad ciudadana no aparece en el art. 8.1: garantizarla es misión de las Fuerzas y Cuerpos de seguridad según el art. 104.1. La a), la b) y la d) sí forman parte de la misión que el art. 8.1 atribuye a las Fuerzas Armadas.","cita":"«Las Fuerzas Armadas, constituidas por el Ejército de Tierra, la Armada y el Ejército del Aire, tienen como misión garantizar la soberanía e independencia de España, defender su integridad territorial y el ordenamiento constitucional.»","dificultad":1},{"id":"CE-L1-052","ley":"CE","articulo":"10.1","articulo_txt":"Art. 10.1 CE","bloque_id":"CE|Título I. De los derechos y deberes fundamentales","enunciado":"¿Con qué adjetivo califica el artículo 10.1 de la Constitución a los derechos que menciona junto a la dignidad de la persona?","opciones":{"a":"Inviolables","b":"Inalienables","c":"Imprescriptibles","d":"Universales"},"correcta":"a","explicacion":"El art. 10.1 menciona «los derechos inviolables que le son inherentes». La b), la c) y la d) no corresponden al adjetivo que emplea el art. 10.1.","cita":"«La dignidad de la persona, los derechos inviolables que le son inherentes, el libre desarrollo de la personalidad, el respeto a la ley y a los derechos de los demás son fundamento del orden político y de la paz social.»","dificultad":2},{"id":"CE-L1-054","ley":"CE","articulo":"10.2","articulo_txt":"Art. 10.2 CE","bloque_id":"CE|Título I. De los derechos y deberes fundamentales","enunciado":"¿Qué texto internacional menciona expresamente el artículo 10.2 de la Constitución como criterio de interpretación de las normas relativas a los derechos fundamentales y a las libertades?","opciones":{"a":"La Declaración Universal de Derechos Humanos","b":"El Convenio Europeo de Derechos Humanos","c":"La Carta de los Derechos Fundamentales de la Unión Europea","d":"El Pacto Internacional de Derechos Civiles y Políticos"},"correcta":"a","explicacion":"El único texto que el art. 10.2 cita por su nombre es «la Declaración Universal de Derechos Humanos»; los demás tratados y acuerdos se mencionan de forma genérica. La b), la c) y la d) no se citan por su nombre en el art. 10.2.","cita":"«Las normas relativas a los derechos fundamentales y a las libertades que la Constitución reconoce se interpretarán de conformidad con la Declaración Universal de Derechos Humanos y los tratados y acuerdos internacionales sobre las mismas materias ratificados por España.»","dificultad":2},{"id":"CE-L1-064","ley":"CE","articulo":"13.2","articulo_txt":"Art. 13.2 CE","bloque_id":"CE|Título I. Capítulo primero. De los españoles y los extranjeros","enunciado":"Según el artículo 13.2 de la Constitución, ¿quiénes serán titulares de los derechos reconocidos en el artículo 23, salvo la excepción que el propio apartado prevé?","opciones":{"a":"Solamente los españoles","b":"Los españoles y los ciudadanos de la Unión Europea residentes en España","c":"Los españoles y los extranjeros con residencia legal en España","d":"Todas las personas mayores de edad residentes en España"},"correcta":"a","explicacion":"El art. 13.2 dispone que «Solamente los españoles serán titulares de los derechos reconocidos en el artículo 23», con la salvedad que prevé para las elecciones municipales. La b) el art. 13.2 reserva la titularidad a los españoles, con la única salvedad de las elecciones municipales. La c) el art. 13.2 no extiende la titularidad a los extranjeros residentes. La d) el art. 13.2 reserva la titularidad a los españoles.","cita":"«Solamente los españoles serán titulares de los derechos reconocidos en el artículo 23, salvo lo que, atendiendo a criterios de reciprocidad, pueda establecerse por tratado o ley para el derecho de sufragio activo y pasivo en las elecciones municipales.»","dificultad":1},{"id":"CE-L1-067","ley":"CE","articulo":"13.3","articulo_txt":"Art. 13.3 CE","bloque_id":"CE|Título I. Capítulo primero. De los españoles y los extranjeros","enunciado":"Según el artículo 13.3 de la Constitución, la extradición:","opciones":{"a":"solo se concederá en cumplimiento de un tratado internacional ratificado por España","b":"se concederá siempre que la solicite un Estado que aplique el principio de reciprocidad","c":"solo se concederá en cumplimiento de un tratado o de la ley, atendiendo al principio de reciprocidad","d":"solo se concederá en cumplimiento de la ley, sin atender a la reciprocidad"},"correcta":"c","explicacion":"El art. 13.3 dispone que «La extradición sólo se concederá en cumplimiento de un tratado o de la ley, atendiendo al principio de reciprocidad». La a) el art. 13.3 admite también la extradición en cumplimiento de la ley. La b) el art. 13.3 exige que se conceda en cumplimiento de un tratado o de la ley. La d) el art. 13.3 exige atender al principio de reciprocidad.","cita":"«La extradición sólo se concederá en cumplimiento de un tratado o de la ley, atendiendo al principio de reciprocidad. Quedan excluidos de la extradición los delitos políticos, no considerándose como tales los actos de terrorismo.»","dificultad":1},{"id":"CE-L1-073","ley":"CE","articulo":"14","articulo_txt":"Art. 14 CE","bloque_id":"CE|Título I. Capítulo segundo. Derechos y libertades","enunciado":"¿Dónde se ubica el artículo 14 dentro de la Constitución?","opciones":{"a":"En la Sección 1.ª del Capítulo segundo del Título I, «De los derechos fundamentales y de las libertades públicas»","b":"En el Capítulo primero del Título I, «De los españoles y los extranjeros»","c":"En el Título Preliminar","d":"En el Capítulo segundo del Título I, antes de la Sección 1.ª"},"correcta":"d","explicacion":"El art. 14 abre el Capítulo segundo del Título I, «Derechos y libertades», y precede a la Sección 1.ª, que comienza en el art. 15. La a) la Sección 1.ª comienza en el art. 15. La b) ese capítulo termina en el art. 13. La c) el Título Preliminar termina en el art. 9.","cita":"«Los españoles son iguales ante la ley, sin que pueda prevalecer discriminación alguna por razón de nacimiento, raza, sexo, religión, opinión o cualquier otra condición o circunstancia personal o social.»","dificultad":3},{"id":"CE-L1-072","ley":"CE","articulo":"14","articulo_txt":"Art. 14 CE","bloque_id":"CE|Título I. Capítulo segundo. Derechos y libertades","enunciado":"Según el artículo 14 de la Constitución, no puede prevalecer discriminación alguna por razón de:","opciones":{"a":"nacimiento, raza, sexo, lengua, religión u opinión","b":"raza, sexo, edad, religión, opinión o cualquier otra condición o circunstancia personal o social","c":"nacimiento, raza, sexo, religión, opinión o cualquier otra condición o circunstancia personal o social","d":"nacimiento, raza, sexo, religión, ideología o cualquier otra condición o circunstancia personal o económica"},"correcta":"c","explicacion":"El art. 14 prohíbe la discriminación «por razón de nacimiento, raza, sexo, religión, opinión o cualquier otra condición o circunstancia personal o social». La a) incluye la lengua, que el art. 14 no nombra, y omite la cláusula final abierta. La b) sustituye el nacimiento por la edad, que el art. 14 no nombra. La d) cambia «opinión» por «ideología» y «social» por «económica».","cita":"«Los españoles son iguales ante la ley, sin que pueda prevalecer discriminación alguna por razón de nacimiento, raza, sexo, religión, opinión o cualquier otra condición o circunstancia personal o social.»","dificultad":2},{"id":"CE-L2-034","ley":"CE","articulo":"23.1","articulo_txt":"Art. 23.1 CE","bloque_id":"CE|Título I, Capítulo II, Sección 1.ª: De los derechos fundamentales y de las libertades públicas","enunciado":"Según el artículo 23.1 de la Constitución, el derecho a participar en los asuntos públicos se ejerce:","opciones":{"a":"únicamente por medio de representantes, elegidos por sufragio universal, libre, igual, directo y secreto.","b":"directamente o por medio de representantes, libremente elegidos en elecciones periódicas por sufragio universal.","c":"directamente o por medio de representantes, designados por los partidos políticos en proporción a sus votos.","d":"a través de los partidos políticos, que concurren a la formación y manifestación de la voluntad popular."},"correcta":"b","explicacion":"Art. 23.1 CE: se participa «directamente o por medio de representantes, libremente elegidos en elecciones periódicas por sufragio universal». La a) excluye la participación directa; la c) sustituye la libre elección por una designación de los partidos, y la d) reproduce en parte el art. 6 CE, relativo a los partidos políticos.","cita":"«Los ciudadanos tienen el derecho a participar en los asuntos públicos, directamente o por medio de representantes, libremente elegidos en elecciones periódicas por sufragio universal.»","dificultad":1},{"id":"CE-L2-048","ley":"CE","articulo":"27.4","articulo_txt":"Art. 27.4 CE","bloque_id":"CE|Título I, Capítulo II, Sección 1.ª: De los derechos fundamentales y de las libertades públicas","enunciado":"Conforme al artículo 27.4 de la Constitución, la enseñanza básica es:","opciones":{"a":"gratuita, pero no obligatoria.","b":"obligatoria, y gratuita solo para quienes acrediten insuficiencia de recursos.","c":"obligatoria y gratuita.","d":"obligatoria hasta los dieciocho años y gratuita."},"correcta":"c","explicacion":"Art. 27.4 CE: «La enseñanza básica es obligatoria y gratuita». La a) suprime la obligatoriedad; la b) condiciona la gratuidad a la falta de recursos, y la d) introduce una edad que la Constitución no fija.","cita":"«La enseñanza básica es obligatoria y gratuita.»","dificultad":1},{"id":"CE-L2-070","ley":"CE","articulo":"32.2","articulo_txt":"Art. 32.2 CE","bloque_id":"CE|Título I, Capítulo II, Sección 2.ª: De los derechos y deberes de los ciudadanos","enunciado":"¿Cuál de las siguientes materias NO menciona el artículo 32.2 de la Constitución entre las que la ley regulará en relación con el matrimonio?","opciones":{"a":"Las formas de matrimonio.","b":"La edad y capacidad para contraerlo.","c":"El régimen económico matrimonial.","d":"Las causas de separación y disolución y sus efectos."},"correcta":"c","explicacion":"El art. 32.2 CE remite a la ley «las formas de matrimonio, la edad y capacidad para contraerlo, los derechos y deberes de los cónyuges, las causas de separación y disolución y sus efectos». El régimen económico matrimonial no figura en esa enumeración, mientras que la a), la b) y la d) sí.","cita":"«La ley regulará las formas de matrimonio, la edad y capacidad para contraerlo, los derechos y deberes de los cónyuges, las causas de separación y disolución y sus efectos.»","dificultad":2},{"id":"CE-L2-078","ley":"CE","articulo":"36","articulo_txt":"Art. 36 CE","bloque_id":"CE|Título I, Capítulo II, Sección 2.ª: De los derechos y deberes de los ciudadanos","enunciado":"Según el artículo 36 de la Constitución, la estructura interna y el funcionamiento de los Colegios Profesionales deberán ser:","opciones":{"a":"transparentes y participativos.","b":"democráticos.","c":"los que determinen sus propios estatutos, sin sujeción a la ley.","d":"los que apruebe el Gobierno mediante real decreto."},"correcta":"b","explicacion":"Art. 36 CE: «La estructura interna y el funcionamiento de los Colegios deberán ser democráticos». La a) emplea calificativos que el precepto no utiliza; la c) ignora la remisión a la ley del primer inciso, y la d) introduce una aprobación gubernativa que el texto no prevé. La Ley de Colegios Profesionales sí somete a las organizaciones colegiales al principio de transparencia en su gestión y prevé que el Gobierno apruebe los Estatutos generales de cada profesión, pero el art. 36 CE solo exige que su estructura interna y su funcionamiento sean democráticos.","cita":"«La ley regulará las peculiaridades propias del régimen jurídico de los Colegios Profesionales y el ejercicio de las profesiones tituladas. La estructura interna y el funcionamiento de los Colegios deberán ser democráticos.»","dificultad":1},{"id":"CE-L3-017","ley":"CE","articulo":"49.2","articulo_txt":"Art. 49.2 CE","bloque_id":"CE|Título I. De los derechos y deberes fundamentales. Capítulo III. De los principios rectores de la política social y económica","enunciado":"Según el artículo 49.2 de la Constitución, en su redacción vigente, los poderes públicos impulsarán las políticas que garanticen la plena autonomía personal y la inclusión social de las personas con discapacidad:","opciones":{"a":"En centros especializados de atención.","b":"Mediante un sistema de servicios sociales que atienda sus problemas específicos.","c":"En entornos universalmente accesibles.","d":"En colaboración con las familias y los centros educativos."},"correcta":"c","explicacion":"Art. 49.2 CE (reforma de 2024): esas políticas se impulsan «en entornos universalmente accesibles». Los centros especializados (a) y la colaboración con familias y centros educativos (d) no aparecen en el precepto, y la b) evoca el sistema de servicios sociales que el art. 50 prevé para la tercera edad.","cita":"«Los poderes públicos impulsarán las políticas que garanticen la plena autonomía personal y la inclusión social de las personas con discapacidad, en entornos universalmente accesibles. Asimismo, fomentarán la participación de sus organizaciones, en los términos que la ley establezca. Se atenderán particularmente las necesidades específicas de las mujeres y los menores con discapacidad.»","dificultad":2},{"id":"CE-L3-018","ley":"CE","articulo":"49.2","articulo_txt":"Art. 49.2 CE","bloque_id":"CE|Título I. De los derechos y deberes fundamentales. Capítulo III. De los principios rectores de la política social y económica","enunciado":"Según el artículo 49.2 de la Constitución, en su redacción vigente, se atenderán particularmente las necesidades específicas de:","opciones":{"a":"Las personas mayores con discapacidad.","b":"Las mujeres y los menores con discapacidad.","c":"Las personas con discapacidad que residan en el medio rural.","d":"Las familias con algún miembro con discapacidad."},"correcta":"b","explicacion":"Art. 49.2 CE (reforma de 2024): «Se atenderán particularmente las necesidades específicas de las mujeres y los menores con discapacidad». Las personas mayores (a), las que residen en el medio rural (c) y las familias (d) no se mencionan en el precepto, que también prevé el fomento de la participación de las organizaciones de personas con discapacidad.","cita":"«Los poderes públicos impulsarán las políticas que garanticen la plena autonomía personal y la inclusión social de las personas con discapacidad, en entornos universalmente accesibles. Asimismo, fomentarán la participación de sus organizaciones, en los términos que la ley establezca. Se atenderán particularmente las necesidades específicas de las mujeres y los menores con discapacidad.»","dificultad":1},{"id":"CE-L3-025","ley":"CE","articulo":"53.2","articulo_txt":"Art. 53.2 CE","bloque_id":"CE|Título I. De los derechos y deberes fundamentales. Capítulo IV. De las garantías de las libertades y derechos fundamentales","enunciado":"Según el artículo 53.2 de la Constitución, el procedimiento ante los Tribunales ordinarios por el que cualquier ciudadano podrá recabar la tutela de determinadas libertades y derechos se basa en los principios de:","opciones":{"a":"Celeridad y eficacia.","b":"Preferencia y sumariedad.","c":"Oralidad e inmediación.","d":"Publicidad y gratuidad."},"correcta":"b","explicacion":"Art. 53.2 CE: el procedimiento ante los Tribunales ordinarios se basa en los principios de preferencia y sumariedad. Las parejas de principios de las opciones a), c) y d) no figuran en el art. 53.2.","cita":"«Cualquier ciudadano podrá recabar la tutela de las libertades y derechos reconocidos en el artículo 14 y la Sección primera del Capítulo segundo ante los Tribunales ordinarios por un procedimiento basado en los principios de preferencia y sumariedad y, en su caso, a través del recurso de amparo ante el Tribunal Constitucional. Este último recurso será aplicable a la objeción de conciencia reconocida en el artículo 30.»","dificultad":1},{"id":"CE-L3-032","ley":"CE","articulo":"54","articulo_txt":"Art. 54 CE","bloque_id":"CE|Título I. De los derechos y deberes fundamentales. Capítulo IV. De las garantías de las libertades y derechos fundamentales","enunciado":"Según el artículo 54 de la Constitución, el Defensor del Pueblo podrá supervisar la actividad de la Administración, dando cuenta:","opciones":{"a":"Al Gobierno.","b":"Al Tribunal Constitucional.","c":"Al Congreso de los Diputados.","d":"A las Cortes Generales."},"correcta":"d","explicacion":"Art. 54 CE: el Defensor del Pueblo supervisa la actividad de la Administración «dando cuenta a las Cortes Generales», de las que es alto comisionado. No da cuenta al Gobierno (a) ni al Tribunal Constitucional (b), y el precepto se refiere a las Cortes Generales, no solo al Congreso de los Diputados (c).","cita":"«Una ley orgánica regulará la institución del Defensor del Pueblo, como alto comisionado de las Cortes Generales, designado por éstas para la defensa de los derechos comprendidos en este Título, a cuyo efecto podrá supervisar la actividad de la Administración, dando cuenta a las Cortes Generales.»","dificultad":1},{"id":"CE-L3-033","ley":"CE","articulo":"55.1","articulo_txt":"Art. 55.1 CE","bloque_id":"CE|Título I. De los derechos y deberes fundamentales. Capítulo V. De la suspensión de los derechos y libertades","enunciado":"Según el artículo 55.1 de la Constitución, ¿cuál de los siguientes derechos NO figura entre los que pueden ser suspendidos con carácter general en los supuestos que contempla dicho apartado?","opciones":{"a":"El derecho de reunión (art. 21).","b":"El derecho a la huelga de los trabajadores (art. 28.2).","c":"El derecho de asociación (art. 22).","d":"El derecho a elegir libremente la residencia y a circular por el territorio nacional (art. 19)."},"correcta":"c","explicacion":"Art. 55.1 CE: pueden suspenderse los derechos de los arts. 17 (el apartado 3, solo en el estado de sitio), 18.2 y 18.3, 19, 20.1.a) y d) y 20.5, 21, 28.2 y 37.2. El derecho de asociación del art. 22 no figura en esa lista, mientras que sí figuran el derecho de reunión (a), el derecho a la huelga (b) y las libertades de residencia y circulación (d).","cita":"«Los derechos reconocidos en los artículos 17, 18, apartados 2 y 3, artículos 19, 20, apartados 1, a) y d), y 5, artículos 21, 28, apartado 2, y artículo 37, apartado 2, podrán ser suspendidos cuando se acuerde la declaración del estado de excepción o de sitio en los términos previstos en la Constitución. Se exceptúa de lo establecido anteriormente el apartado 3 del artículo 17 para el supuesto de declaración de estado de excepción.»","dificultad":2},{"id":"CE-L3-038","ley":"CE","articulo":"55.2","articulo_txt":"Art. 55.2 CE","bloque_id":"CE|Título I. De los derechos y deberes fundamentales. Capítulo V. De la suspensión de los derechos y libertades","enunciado":"Según el artículo 55.2 de la Constitución, la suspensión individual de determinados derechos para personas determinadas puede acordarse en relación con las investigaciones correspondientes a:","opciones":{"a":"La actuación de bandas armadas o elementos terroristas.","b":"Los delitos de tráfico de drogas y de blanqueo de capitales.","c":"La actuación de organizaciones criminales de cualquier tipo.","d":"Los delitos contra la seguridad del Estado cometidos por funcionarios públicos."},"correcta":"a","explicacion":"Art. 55.2 CE: la suspensión individual se vincula a «las investigaciones correspondientes a la actuación de bandas armadas o elementos terroristas» y exige la necesaria intervención judicial y el adecuado control parlamentario. El precepto no se refiere al narcotráfico ni al blanqueo (b), a las organizaciones criminales en general (c) ni a los delitos contra la seguridad del Estado (d).","cita":"«Una ley orgánica podrá determinar la forma y los casos en los que, de forma individual y con la necesaria intervención judicial y el adecuado control parlamentario, los derechos reconocidos en los artículos 17, apartado 2, y 18, apartados 2 y 3, pueden ser suspendidos para personas determinadas, en relación con las investigaciones correspondientes a la actuación de bandas armadas o elementos terroristas.»","dificultad":1},{"id":"CE-L3-044","ley":"CE","articulo":"56.3","articulo_txt":"Art. 56.3 CE","bloque_id":"CE|Título II. De la Corona","enunciado":"Según el artículo 56.3 de la Constitución, la persona del Rey:","opciones":{"a":"Es inviolable y no está sujeta a responsabilidad.","b":"Es inviolable, pero responde políticamente ante las Cortes Generales.","c":"No está sujeta a responsabilidad, salvo por delitos de traición.","d":"Es irresponsable políticamente, pero responde penalmente ante el Tribunal Supremo."},"correcta":"a","explicacion":"Art. 56.3 CE: «La persona del Rey es inviolable y no está sujeta a responsabilidad». Las opciones b), c) y d) le atribuyen responsabilidades (política, por traición o penal ante el Tribunal Supremo) que la Constitución no prevé; de sus actos responden las personas que los refrenden (art. 64.2).","cita":"«La persona del Rey es inviolable y no está sujeta a responsabilidad. Sus actos estarán siempre refrendados en la forma establecida en el artículo 64, careciendo de validez sin dicho refrendo, salvo lo dispuesto en el artículo 65, 2.»","dificultad":1},{"id":"CE-L3-068","ley":"CE","articulo":"62.j","articulo_txt":"Art. 62.j CE","bloque_id":"CE|Título II. De la Corona","enunciado":"Según el artículo 62 de la Constitución, corresponde al Rey:","opciones":{"a":"La dirección de la defensa del Estado.","b":"La presidencia del Consejo General del Poder Judicial.","c":"La dirección de la Administración militar.","d":"El Alto Patronazgo de las Reales Academias."},"correcta":"d","explicacion":"Art. 62.j) CE: corresponde al Rey «el Alto Patronazgo de las Reales Academias». La dirección de la defensa del Estado (a) y la de la Administración militar (c) no figuran en el art. 62, sino en el art. 97, que las atribuye al Gobierno; y el Consejo General del Poder Judicial (b) lo preside el Presidente del Tribunal Supremo (art. 122.3).","cita":"«Corresponde al Rey: […] j) El Alto Patronazgo de las Reales Academias.»","dificultad":1},{"id":"CE-L4-004","ley":"CE","articulo":"67.1","articulo_txt":"Art. 67.1 CE","bloque_id":"CE|Título III. De las Cortes Generales. Capítulo I. De las Cámaras","enunciado":"Según el artículo 67.1 de la Constitución, ¿cuál de las siguientes acumulaciones de cargos está expresamente prohibida?","opciones":{"a":"Ser Diputado al Congreso y miembro del Gobierno.","b":"Ser Senador y miembro de una Asamblea de Comunidad Autónoma.","c":"Ser miembro de una Asamblea de Comunidad Autónoma y Diputado al Congreso.","d":"Ser Senador y concejal de un ayuntamiento."},"correcta":"c","explicacion":"Art. 67.1 CE: nadie puede ser miembro de las dos Cámaras a la vez ni acumular el acta de una Asamblea de Comunidad Autónoma con la de Diputado al Congreso. La prohibición autonómica se refiere solo al Diputado, no al Senador (b); el art. 67.1 nada dice del cargo de concejal (d), y la Constitución no impide ser parlamentario y miembro del Gobierno (a): el art. 70.1.b) exceptúa expresamente a los miembros del Gobierno.","cita":"«Nadie podrá ser miembro de las dos Cámaras simultáneamente, ni acumular el acta de una Asamblea de Comunidad Autónoma con la de Diputado al Congreso.»","dificultad":2},{"id":"CE-L7-013","ley":"CE","articulo":"78.4","articulo_txt":"Art. 78.4 CE","bloque_id":"CE|Título III. De las Cortes Generales. Capítulo I. De las Cámaras","enunciado":"Según el artículo 78.4 de la Constitución, ¿qué deberá hacer la Diputación Permanente ante la Cámara correspondiente?","opciones":{"a":"Someter sus decisiones a la aprobación del Pleno.","b":"Presentarle un informe anual sobre el ejercicio de sus funciones.","c":"Solicitarle autorización previa para cada una de sus decisiones.","d":"Darle cuenta de los asuntos tratados y de sus decisiones."},"correcta":"d","explicacion":"Art. 78.4 CE: «Reunida la Cámara correspondiente, la Diputación Permanente dará cuenta de los asuntos tratados y de sus decisiones». El precepto no prevé que el Pleno apruebe sus decisiones (opción a), un informe anual (opción b) ni una autorización previa de cada decisión (opción c).","cita":"«4. Reunida la Cámara correspondiente, la Diputación Permanente dará cuenta de los asuntos tratados y de sus decisiones.»","dificultad":1},{"id":"CE-L4-068","ley":"CE","articulo":"87.2","articulo_txt":"Art. 87.2 CE","bloque_id":"CE|Título III. De las Cortes Generales. Capítulo II. De la elaboración de las leyes","enunciado":"Según el artículo 87.2 de la Constitución, cuando las Asambleas de las Comunidades Autónomas remitan a la Mesa del Congreso una proposición de ley, podrán delegar ante dicha Cámara, para su defensa:","opciones":{"a":"Un máximo de cinco miembros de la Asamblea.","b":"Un mínimo de tres miembros de la Asamblea.","c":"Al Presidente de la Comunidad Autónoma.","d":"Un máximo de tres miembros de la Asamblea."},"correcta":"d","explicacion":"Art. 87.2 CE: las Asambleas pueden solicitar del Gobierno la adopción de un proyecto de ley o remitir a la Mesa del Congreso una proposición de ley, delegando ante dicha Cámara «un máximo de tres miembros de la Asamblea encargados de su defensa». La a) cambia la cifra; la b) convierte el máximo en mínimo; la c) atribuye la defensa al Presidente autonómico, que el precepto no menciona.","cita":"«Las Asambleas de las Comunidades Autónomas podrán solicitar del Gobierno la adopción de un proyecto de ley o remitir a la Mesa del Congreso una proposición de ley, delegando ante dicha Cámara un máximo de tres miembros de la Asamblea encargados de su defensa.»","dificultad":2},{"id":"CE-L4-072","ley":"CE","articulo":"89.2","articulo_txt":"Art. 89.2 CE","bloque_id":"CE|Título III. De las Cortes Generales. Capítulo II. De la elaboración de las leyes","enunciado":"Según el artículo 89.2 de la Constitución, las proposiciones de ley que, de acuerdo con el artículo 87, tome en consideración el Senado:","opciones":{"a":"Se tramitarán íntegramente en el Senado y después se elevarán al Rey para su sanción.","b":"Se remitirán al Gobierno para que las convierta en proyecto de ley.","c":"Se remitirán al Congreso para su trámite en este como tal proposición.","d":"Se remitirán a una Comisión Mixta de Diputados y Senadores."},"correcta":"c","explicacion":"Art. 89.2 CE: las proposiciones de ley tomadas en consideración por el Senado «se remitirán al Congreso para su trámite en éste como tal proposición». No se tramitan íntegramente en el Senado (a), no se transforman en proyecto del Gobierno (b) ni pasan a una Comisión Mixta (d).","cita":"«Las proposiciones de ley que, de acuerdo con el artículo 87, tome en consideración el Senado, se remitirán al Congreso para su trámite en éste como tal proposición.»","dificultad":2},{"id":"CE-L4-083","ley":"CE","articulo":"93","articulo_txt":"Art. 93 CE","bloque_id":"CE|Título III. De las Cortes Generales. Capítulo III. De los Tratados Internacionales","enunciado":"Según el artículo 93 de la Constitución, ¿mediante qué tipo de norma se podrá autorizar la celebración de los tratados que regula ese artículo?","opciones":{"a":"Ley ordinaria.","b":"Acuerdo de las Cortes Generales adoptado por mayoría de cada una de las Cámaras.","c":"Ley orgánica.","d":"Real decreto acordado en Consejo de Ministros."},"correcta":"c","explicacion":"Art. 93 CE: «Mediante ley orgánica se podrá autorizar la celebración de tratados» que atribuyan a una organización o institución internacional el ejercicio de competencias derivadas de la Constitución. No basta una ley ordinaria (a); la autorización por mayoría de cada Cámara (b) es la de los tratados del art. 94.1 (art. 74.2); y un real decreto (d) no puede autorizar estos tratados.","cita":"«Mediante ley orgánica se podrá autorizar la celebración de tratados por los que se atribuya a una organización o institución internacional el ejercicio de competencias derivadas de la Constitución. Corresponde a las Cortes Generales o al Gobierno, según los casos, la garantía del cumplimiento de estos tratados y de las resoluciones emanadas de los organismos internacionales o supranacionales titulares de la cesión.»","dificultad":1},{"id":"CE-L4-094","ley":"CE","articulo":"96.2","articulo_txt":"Art. 96.2 CE","bloque_id":"CE|Título III. De las Cortes Generales. Capítulo III. De los Tratados Internacionales","enunciado":"Según el artículo 96.2 de la Constitución, para la denuncia de los tratados y convenios internacionales se utilizará:","opciones":{"a":"En todo caso, la previa autorización de las Cortes Generales.","b":"El mismo procedimiento previsto para su aprobación en el artículo 94.","c":"Una ley orgánica.","d":"La previa revisión constitucional."},"correcta":"b","explicacion":"Art. 96.2 CE: para la denuncia «se utilizará el mismo procedimiento previsto para su aprobación en el artículo 94». Por eso no se exige en todo caso la autorización de las Cortes (a): dependerá de si el tratado está en alguno de los supuestos del art. 94.1. La ley orgánica (c) y la revisión constitucional (d) son propias de los arts. 93 y 95.1.","cita":"«Para la denuncia de los tratados y convenios internacionales se utilizará el mismo procedimiento previsto para su aprobación en el artículo 94.»","dificultad":2},{"id":"CE-L5-008","ley":"CE","articulo":"99.1","articulo_txt":"Art. 99.1 CE","bloque_id":"CE|Título IV. Del Gobierno y de la Administración","enunciado":"Según el artículo 99.1 de la Constitución, después de cada renovación del Congreso de los Diputados, el Rey propondrá un candidato a la Presidencia del Gobierno:","opciones":{"a":"Previa consulta con los Presidentes del Congreso y del Senado, y a través del Presidente del Senado.","b":"Previa consulta con los representantes designados por los Grupos políticos con representación parlamentaria, y a través del Presidente del Congreso.","c":"Previa consulta con los representantes de los Grupos políticos, y a través del Presidente del Gobierno en funciones.","d":"Previa deliberación del Consejo de Ministros, y a través del Presidente del Congreso."},"correcta":"b","explicacion":"Art. 99.1 CE: el Rey propone el candidato «previa consulta con los representantes designados por los Grupos políticos con representación parlamentaria, y a través del Presidente del Congreso». La a) y la c) cambian los consultados o el cauce (Presidente del Senado, Presidente del Gobierno en funciones), y la d) introduce una deliberación del Consejo de Ministros que el precepto no prevé.","cita":"«Después de cada renovación del Congreso de los Diputados, y en los demás supuestos constitucionales en que así proceda, el Rey, previa consulta con los representantes designados por los Grupos políticos con representación parlamentaria, y a través del Presidente del Congreso, propondrá un candidato a la Presidencia del Gobierno»","dificultad":2},{"id":"CE-L5-021","ley":"CE","articulo":"102.2","articulo_txt":"Art. 102.2 CE","bloque_id":"CE|Título IV. Del Gobierno y de la Administración","enunciado":"Conforme al artículo 102.2 de la Constitución, además de la iniciativa exigida, la acusación por traición contra un miembro del Gobierno requiere la aprobación:","opciones":{"a":"De la mayoría absoluta del Congreso.","b":"De la mayoría de tres quintos del Congreso.","c":"De la mayoría de dos tercios del Congreso.","d":"De la mayoría absoluta de cada una de las Cámaras."},"correcta":"a","explicacion":"Art. 102.2 CE: la acusación exige la iniciativa de la cuarta parte de los miembros del Congreso «y con la aprobación de la mayoría absoluta del mismo». No se piden mayorías reforzadas de tres quintos (b) o de dos tercios (c), ni interviene el Senado (d).","cita":"«Si la acusación fuere por traición o por cualquier delito contra la seguridad del Estado en el ejercicio de sus funciones, sólo podrá ser planteada por iniciativa de la cuarta parte de los miembros del Congreso, y con la aprobación de la mayoría absoluta del mismo»","dificultad":2},{"id":"CE-L7-017","ley":"CE","articulo":"111.2","articulo_txt":"Art. 111.2 CE","bloque_id":"CE|Título V. De las relaciones entre el Gobierno y las Cortes Generales","enunciado":"Según el artículo 111.2 de la Constitución, toda interpelación podrá dar lugar a:","opciones":{"a":"Una moción en la que la Cámara manifieste su posición.","b":"Una cuestión de confianza planteada por el Presidente del Gobierno.","c":"Una moción de censura contra el miembro del Gobierno interpelado.","d":"Un debate de totalidad sobre la política general del Gobierno."},"correcta":"a","explicacion":"Art. 111.2 CE: «Toda interpelación podrá dar lugar a una moción en la que la Cámara manifieste su posición». La cuestión de confianza (opción b) la plantea el Presidente del Gobierno, previa deliberación del Consejo de Ministros, conforme al art. 112, y no como consecuencia de una interpelación; la moción de censura del art. 113.1 sirve para exigir la responsabilidad política del Gobierno, no la de un miembro interpelado (opción c), y el precepto no prevé un debate de totalidad (opción d).","cita":"«2. Toda interpelación podrá dar lugar a una moción en la que la Cámara manifieste su posición.»","dificultad":1},{"id":"CE-L5-069","ley":"CE","articulo":"120.3","articulo_txt":"Art. 120.3 CE","bloque_id":"CE|Título VI. Del Poder Judicial","enunciado":"Conforme al artículo 120 de la Constitución, las sentencias:","opciones":{"a":"Serán siempre motivadas y se pronunciarán en audiencia pública.","b":"Serán motivadas cuando así lo exijan las leyes de procedimiento.","c":"Se pronunciarán en audiencia pública, salvo en materia criminal.","d":"Serán siempre motivadas y se notificarán por escrito, sin pronunciarse en audiencia pública."},"correcta":"a","explicacion":"Art. 120.3 CE: «Las sentencias serán siempre motivadas y se pronunciarán en audiencia pública». La motivación se exige «siempre» y no depende de las leyes de procedimiento (b), a las que el art. 120.1 solo remite las excepciones a la publicidad de las actuaciones judiciales; no hay salvedad para la materia criminal (c) y la d) contradice la exigencia de audiencia pública.","cita":"«Las sentencias serán siempre motivadas y se pronunciarán en audiencia pública»","dificultad":1},{"id":"CE-L7-026","ley":"CE","articulo":"133.4","articulo_txt":"Art. 133.4 CE","bloque_id":"CE|Título VII. Economía y Hacienda","enunciado":"Según el artículo 133.4 de la Constitución, las administraciones públicas solo podrán contraer obligaciones financieras y realizar gastos:","opciones":{"a":"Previo informe favorable del Tribunal de Cuentas.","b":"De acuerdo con las leyes.","c":"Con la autorización expresa del Congreso de los Diputados.","d":"De acuerdo con las leyes y con cargo exclusivamente a sus ingresos tributarios."},"correcta":"b","explicacion":"Art. 133.4 CE: «Las administraciones públicas sólo podrán contraer obligaciones financieras y realizar gastos de acuerdo con las leyes». El precepto no exige informe del Tribunal de Cuentas (opción a) ni autorización del Congreso (opción c), ni limita el gasto a los ingresos tributarios (opción d): la propia Constitución prevé que el Estado y las Comunidades Autónomas, autorizados por ley, emitan deuda pública o contraigan crédito (art. 135.3).","cita":"«4. Las administraciones públicas sólo podrán contraer obligaciones financieras y realizar gastos de acuerdo con las leyes.»","dificultad":1},{"id":"CE-L6-037","ley":"CE","articulo":"147.3","articulo_txt":"Art. 147.3 CE","bloque_id":"CE|Título VIII. De la Organización Territorial del Estado","enunciado":"Según el artículo 147.3 de la Constitución, la reforma de los Estatutos se ajustará al procedimiento establecido en los mismos y requerirá, en todo caso:","opciones":{"a":"La aprobación por las Cortes Generales, mediante ley orgánica.","b":"La ratificación mediante referéndum de los electores de la Comunidad Autónoma.","c":"La aprobación por mayoría de tres quintos de la Asamblea Legislativa de la Comunidad Autónoma.","d":"El dictamen previo del Tribunal Constitucional."},"correcta":"a","explicacion":"Art. 147.3 CE: la reforma estatutaria requiere, «en todo caso, la aprobación por las Cortes Generales, mediante ley orgánica». La b) es falsa porque la Constitución solo exige referéndum para reformar los Estatutos aprobados por la vía del art. 151 (art. 152.2), aunque cada Estatuto puede preverlo en su propio procedimiento de reforma; la c), porque la mayoría que debe reunir la Asamblea Legislativa la fija, en su caso, cada Estatuto, no el art. 147.3, y la d), porque el precepto no prevé ningún dictamen del Tribunal Constitucional.","cita":"«La reforma de los Estatutos se ajustará al procedimiento establecido en los mismos y requerirá, en todo caso, la aprobación por las Cortes Generales, mediante ley orgánica.»","dificultad":2},{"id":"CE-L6-066","ley":"CE","articulo":"159.3","articulo_txt":"Art. 159.3 CE","bloque_id":"CE|Título IX. Del Tribunal Constitucional","enunciado":"Según el artículo 159.3 de la Constitución, los miembros del Tribunal Constitucional serán designados por un período de:","opciones":{"a":"Nueve años, y se renovarán por mitades cada cuatro años y medio.","b":"Doce años, y se renovarán por terceras partes cada cuatro.","c":"Seis años, y se renovarán por mitades cada tres.","d":"Nueve años, y se renovarán por terceras partes cada tres."},"correcta":"d","explicacion":"Art. 159.3 CE: los miembros del Tribunal Constitucional «serán designados por un período de nueve años y se renovarán por terceras partes cada tres». La a) altera el sistema de renovación, y la b) y la c) cambian la duración del mandato.","cita":"«Los miembros del Tribunal Constitucional serán designados por un período de nueve años y se renovarán por terceras partes cada tres.»","dificultad":1},{"id":"CE-L6-090","ley":"CE","articulo":"168.1","articulo_txt":"Art. 168.1 CE","bloque_id":"CE|Título X. De la reforma constitucional","enunciado":"Según el artículo 168.1 de la Constitución, cuando se propusiere la revisión total de la Constitución:","opciones":{"a":"Se procederá a la aprobación del principio por mayoría de dos tercios de cada Cámara y a la disolución inmediata de las Cortes.","b":"Se procederá a la aprobación del principio por mayoría de tres quintos de cada Cámara y a la disolución inmediata de las Cortes.","c":"Se procederá a la aprobación del principio por mayoría de dos tercios de cada Cámara, sin necesidad de disolver las Cortes.","d":"Se procederá a la aprobación del principio por mayoría absoluta del Congreso y a la convocatoria de un referéndum consultivo."},"correcta":"a","explicacion":"Art. 168.1 CE: «se procederá a la aprobación del principio por mayoría de dos tercios de cada Cámara, y a la disolución inmediata de las Cortes». La b) aplica la mayoría del art. 167, la c) suprime la disolución y la d) introduce una mayoría y un referéndum consultivo que el precepto no prevé.","cita":"«Cuando se propusiere la revisión total de la Constitución o una parcial que afecte al Título preliminar, al Capítulo segundo, Sección primera del Título I, o al Título II, se procederá a la aprobación del principio por mayoría de dos tercios de cada Cámara, y a la disolución inmediata de las Cortes.»","dificultad":2},{"id":"CE-L6-097","ley":"CE","articulo":"DA 2ª","articulo_txt":"DA 2ª · CE","bloque_id":"CE|Disposiciones adicionales","enunciado":"Según la disposición adicional segunda de la Constitución, la declaración de mayoría de edad contenida en el artículo 12:","opciones":{"a":"Prevalece en todo caso sobre las situaciones amparadas por los derechos forales.","b":"No perjudica las situaciones amparadas por los derechos forales en el ámbito del Derecho público.","c":"No perjudica las situaciones amparadas por los derechos forales en el ámbito del Derecho privado.","d":"Solo se aplicará en los territorios forales cuando lo acuerden sus órganos forales competentes."},"correcta":"c","explicacion":"DA 2.ª CE: la mayoría de edad del art. 12 «no perjudica las situaciones amparadas por los derechos forales en el ámbito del Derecho privado». La a) niega esa salvedad, la b) la traslada al Derecho público y la d) condiciona la aplicación del art. 12 a una decisión foral que la disposición no prevé.","cita":"«La declaración de mayoría de edad contenida en el artículo 12 de esta Constitución no perjudica las situaciones amparadas por los derechos forales en el ámbito del Derecho privado.»","dificultad":2},{"id":"CE-L6-106","ley":"CE","articulo":"DT 6ª","articulo_txt":"DT 6ª · CE","bloque_id":"CE|Disposiciones transitorias","enunciado":"Según la disposición transitoria sexta de la Constitución, cuando se remitieran a la Comisión Constitucional del Congreso varios proyectos de Estatuto:","opciones":{"a":"Se dictaminarán conjuntamente en un solo procedimiento, y el plazo del artículo 151 se computará para todos ellos desde la entrada del primero en la Comisión.","b":"Se dictaminarán por el orden que fije la Mesa del Congreso, y el plazo del artículo 151 se ampliará al doble.","c":"Se dictaminarán por el orden de entrada en aquélla, y el plazo del artículo 151 empezará a contar desde que la Comisión termine el estudio del proyecto o proyectos de que sucesivamente haya conocido.","d":"Se dictaminarán por el orden de entrada, pero el plazo del artículo 151 se computará para todos ellos desde la entrada del primero en la Comisión."},"correcta":"c","explicacion":"DT 6.ª CE: los proyectos «se dictaminarán por el orden de entrada» en la Comisión, y el plazo de dos meses del art. 151 «empezará a contar desde que la Comisión termine el estudio del proyecto o proyectos de que sucesivamente haya conocido». La a) y la b) alteran tanto el orden de examen como el plazo, y la d), aunque respeta el orden de entrada, computa el plazo desde un momento distinto. Esta disposición agotó sus efectos con la tramitación de los primeros Estatutos de Autonomía.","cita":"«Cuando se remitieran a la Comisión Constitucional del Congreso varios proyectos de Estatuto, se dictaminarán por el orden de entrada en aquélla, y el plazo de dos meses a que se refiere el artículo 151 empezará a contar desde que la Comisión termine el estudio del proyecto o proyectos de que sucesivamente haya conocido.»","dificultad":3},{"id":"CE-L6-110","ley":"CE","articulo":"DD.1","articulo_txt":"DD.1 · CE","bloque_id":"CE|Disposición derogatoria","enunciado":"Según el apartado 1 de la disposición derogatoria de la Constitución, la Ley de Principios del Movimiento Nacional, el Fuero de los Españoles, el Fuero del Trabajo, la Ley Constitutiva de las Cortes y la Ley de Sucesión en la Jefatura del Estado quedan derogadas:","opciones":{"a":"Solo en lo que se opongan a lo establecido en la Constitución.","b":"En tanto en cuanto no estuvieran ya derogadas por la Ley 1/1977, de 4 de enero, para la Reforma Política.","c":"Con efectos desde la constitución de las primeras Cortes Generales elegidas conforme a la Constitución.","d":"Salvo en lo relativo a la sucesión en la Jefatura del Estado."},"correcta":"b","explicacion":"Disposición derogatoria.1 CE: queda derogada la Ley 1/1977, de 4 de enero, para la Reforma Política, así como, «en tanto en cuanto no estuvieran ya derogadas por la anteriormente mencionada Ley», las demás leyes que enumera. La a) confunde esta derogación expresa con la cláusula general del apartado 3, y la c) y la d) añaden un aplazamiento y una excepción que la disposición no contiene.","cita":"«1. Queda derogada la Ley 1/1977, de 4 de enero, para la Reforma Política, así como, en tanto en cuanto no estuvieran ya derogadas por la anteriormente mencionada Ley, la de Principios del Movimiento Nacional, de 17 de mayo de 1958; el Fuero de los Españoles, de 17 de julio de 1945; el del Trabajo, de 9 de marzo de 1938; la Ley Constitutiva de las Cortes, de 17 de julio de 1942; la Ley de Sucesión en la Jefatura del Estado, de 26 de julio de 1947, todas ellas modificadas por la Ley Orgánica del Estado, de 10 de enero de 1967, y en los mismos términos esta última y la de Referéndum Nacional de 22 de octubre de 1945.»","dificultad":3},{"id":"CE-L6-112","ley":"CE","articulo":"DF","articulo_txt":"DF · CE","bloque_id":"CE|Disposición final","enunciado":"Según la disposición final de la Constitución, la Constitución entrará en vigor:","opciones":{"a":"El mismo día de la publicación de su texto oficial en el Boletín Oficial del Estado.","b":"A los veinte días de su completa publicación en el Boletín Oficial del Estado.","c":"El día siguiente al de la publicación de su texto oficial en el Boletín Oficial del Estado.","d":"El mismo día de su sanción por el Rey ante las Cortes Generales."},"correcta":"a","explicacion":"Disposición final CE: «Esta Constitución entrará en vigor el mismo día de la publicación de su texto oficial en el boletín oficial del Estado», y se publicará también en las demás lenguas de España. La b) reproduce la regla general de entrada en vigor de las leyes del art. 2.1 del Código Civil, la c) la retrasa un día y la d) la vincula a la sanción y no a la publicación.","cita":"«Esta Constitución entrará en vigor el mismo día de la publicación de su texto oficial en el boletín oficial del Estado. Se publicará también en las demás lenguas de España.»","dificultad":1}]};</script>
<script>
/* Letra de Ley — motor de test. Sin dependencias; funciona sin conexión.
   Necesita window.LDL_CONFIG y window.LDL_BANCO (los inyecta sistema/letradeley.py). */
(function () {
  "use strict";
  var CFG = window.LDL_CONFIG, B = window.LDL_BANCO;
  var raiz = document.getElementById("ldl");
  var LETRAS = ["a", "b", "c", "d"];
  var POR_ID = {};
  B.preguntas.forEach(function (p) { POR_ID[p.id] = p; });
  var CLAVE = "ldl1:" + CFG.pack.id;
  var prog = cargar();
  var sesion = null;
  var vista = CFG.modo === "web" ? "portada" : "inicio";
  var reloj = null;

  /* ---------- utilidades ---------- */
  function esc(t) {
    return String(t == null ? "" : t).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function barajar(lista) {
    var a = lista.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function pct(a, b) { return b ? Math.round((a / b) * 100) : 0; }
  function plural(n, uno, varios) { return n + " " + (n === 1 ? uno : varios); }
  function num(n) { return String(n).replace(".", ","); }
  function cargar() {
    try { var s = localStorage.getItem(CLAVE); if (s) { var d = JSON.parse(s); if (d && d.p) return d; } } catch (e) {}
    return { p: {}, h: [] };
  }
  function guardar() { try { localStorage.setItem(CLAVE, JSON.stringify(prog)); } catch (e) {} }
  function registrar(id, acierto) {
    var r = prog.p[id] || { v: 0, a: 0, f: 0, c: 0 };
    r.v++;
    if (acierto) { r.a++; r.c = Math.min((r.c || 0) + 1, 5); } else { r.f++; r.c = 0; }
    r.u = acierto ? 1 : 0;
    r.t = Date.now();
    prog.p[id] = r;
    guardar();
  }
  function fallosPendientes() {
    return B.preguntas.filter(function (p) { var r = prog.p[p.id]; return r && r.u === 0; });
  }
  function resumen(lista) {
    var vistas = 0, aciertos = 0, intentos = 0;
    lista.forEach(function (p) {
      var r = prog.p[p.id];
      if (r) { vistas++; aciertos += r.a; intentos += r.v; }
    });
    return { total: lista.length, vistas: vistas, acierto: pct(aciertos, intentos) };
  }
  function delBloque(id) { return B.preguntas.filter(function (p) { return p.bloque_id === id; }); }

  /* ---------- tema claro / oscuro ---------- */
  function aplicarTema() {
    var t = null;
    try { t = localStorage.getItem("ldl:tema"); } catch (e) {}
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    else document.documentElement.removeAttribute("data-theme");
    return t || "auto";
  }
  function cambiarTema() {
    var orden = { auto: "light", light: "dark", dark: "auto" };
    var actual = aplicarTema();
    try { localStorage.setItem("ldl:tema", orden[actual]); } catch (e) {}
    aplicarTema();
    pintar();
  }

  /* ---------- sesiones ---------- */
  function empezar(tipo, preguntas, opciones) {
    opciones = opciones || {};
    if (!preguntas.length) return;
    pararReloj();
    sesion = {
      tipo: tipo, titulo: opciones.titulo || "Test", ids: preguntas.map(function (p) { return p.id; }),
      i: 0, resp: {}, corregida: {}, inicio: Date.now(), limite: opciones.minutos ? opciones.minutos * 60 : 0, fin: null,
      origen: vista === "test" || vista === "resultado" ? (sesion && sesion.origen) || "inicio" : vista
    };
    vista = "test";
    if (sesion.limite) reloj = setInterval(tic, 1000);
    pintar();
    window.scrollTo(0, 0);
  }
  function tic() {
    if (!sesion || sesion.fin) return pararReloj();
    var el = document.getElementById("ldl-crono");
    var resta = sesion.limite - Math.floor((Date.now() - sesion.inicio) / 1000);
    if (resta <= 0) { terminar(); return; }
    if (el) el.textContent = mmss(resta);
  }
  function pararReloj() { if (reloj) { clearInterval(reloj); reloj = null; } }
  function mmss(s) { var m = Math.floor(s / 60), r = s % 60; return m + ":" + (r < 10 ? "0" : "") + r; }

  function responder(letra) {
    var id = sesion.ids[sesion.i];
    if (sesion.tipo === "simulacro") {
      sesion.resp[id] = sesion.resp[id] === letra ? undefined : letra;
      pintar();
      return;
    }
    if (sesion.corregida[id]) return;
    sesion.resp[id] = letra;
    sesion.corregida[id] = true;
    registrar(id, letra === POR_ID[id].correcta);
    pintar();
  }
  function siguiente() {
    if (sesion.i < sesion.ids.length - 1) { sesion.i++; pintar(); window.scrollTo(0, 0); }
    else terminar();
  }
  function anterior() { if (sesion.i > 0) { sesion.i--; pintar(); } }
  function terminar() {
    pararReloj();
    if (sesion.tipo === "simulacro") {
      sesion.ids.forEach(function (id) {
        if (sesion.resp[id]) registrar(id, sesion.resp[id] === POR_ID[id].correcta);
      });
    }
    sesion.fin = Date.now();
    var r = calcular(sesion);
    prog.h.unshift({ t: sesion.fin, tipo: sesion.tipo, n: r.total, a: r.aciertos, e: r.errores, nota: r.nota });
    prog.h = prog.h.slice(0, 50);
    guardar();
    vista = "resultado";
    pintar();
    window.scrollTo(0, 0);
  }
  function calcular(s) {
    var a = 0, e = 0, nr = 0;
    s.ids.forEach(function (id) {
      var r = s.resp[id];
      if (!r) nr++; else if (r === POR_ID[id].correcta) a++; else e++;
    });
    var pen = (CFG.simulacro && CFG.simulacro.penalizacion) || 1 / 3;
    var neta = s.tipo === "simulacro" ? a - e * pen : a;
    var nota = Math.max(0, (neta / s.ids.length) * 10);
    return { total: s.ids.length, aciertos: a, errores: e, blancos: nr, neta: neta, nota: Math.round(nota * 100) / 100 };
  }

  /* ---------- vistas ---------- */
  function cabecera() {
    var tema = aplicarTema();
    var etiquetas = { auto: "Tema: auto", light: "Tema: claro", dark: "Tema: oscuro" };
    return '<header class="ldl-top"><a class="ldl-brand" href="' + esc(CFG.web || "#") + '">' +
      '<span class="ldl-logo" aria-hidden="true">§</span><span><b>Letra de Ley</b><small>' +
      esc(CFG.pack.nombre) + "</small></span></a>" +
      '<button class="ldl-tema" data-acc="tema" type="button">' + etiquetas[tema] + "</button></header>";
  }
  function navegacion() {
    if (CFG.modo === "web") return "";
    var items = [["inicio", "Inicio"], ["temas", "Por temas"], ["simulacro", "Simulacro"], ["fallos", "Fallos"], ["stats", "Estadísticas"]];
    return '<nav class="ldl-nav" aria-label="Secciones">' + items.map(function (it) {
      var actual = vista === it[0] || (vista === "test" && sesion && sesion.origen === it[0]);
      return '<button type="button" data-acc="ir" data-v="' + it[0] + '"' + (actual ? ' aria-current="page"' : "") + ">" + it[1] + "</button>";
    }).join("") + "</nav>";
  }
  function pie() {
    return '<p class="ldl-pie">Letra de Ley · ' + esc(CFG.pack.edicion) + " · Texto legal actualizado a " +
      esc(CFG.pack.actualizado) + "<br>Uso personal. Prohibida su redistribución.</p>";
  }

  function vInicio() {
    var r = resumen(B.preguntas), f = fallosPendientes().length;
    return '<section class="ldl-card"><h2>' + esc(CFG.pack.nombre) + "</h2>" +
      '<p class="ldl-muted">' + B.preguntas.length + " preguntas comentadas, con el artículo exacto de cada respuesta.</p>" +
      '<div class="ldl-kpis"><div class="ldl-kpi"><b>' + r.vistas + "/" + r.total + "</b><span>respondidas</span></div>" +
      '<div class="ldl-kpi"><b>' + r.acierto + ' %</b><span>de acierto</span></div>' +
      '<div class="ldl-kpi"><b>' + f + "</b><span>fallos por repasar</span></div></div>" +
      '<div class="ldl-acciones"><button class="ldl-btn" data-acc="rapido" type="button">Test rápido de 20</button>' +
      '<button class="ldl-btn sec" data-acc="ir" data-v="simulacro" type="button">Simulacro de examen</button>' +
      (f ? '<button class="ldl-btn sec" data-acc="repasar" type="button">Repasar ' + f + " fallos</button>" : "") +
      "</div></section>" +
      '<section class="ldl-card"><h3>Cómo sacarle partido</h3><ol class="ldl-muted">' +
      "<li>Practica <b>por temas</b>: cada respuesta te enseña el artículo y por qué fallan las demás opciones.</li>" +
      "<li>Cada pocos días, <b>repasa tus fallos</b>: es donde más se aprende.</li>" +
      "<li>Antes del examen, haz <b>simulacros</b> con tiempo y con la penalización real (cada error resta 1/3).</li></ol>" +
      '<p class="ldl-small ldl-muted">Tu progreso se guarda en este dispositivo y en este navegador.</p></section>' + historial();
  }
  function historial() {
    if (!prog.h.length) return "";
    return '<section class="ldl-card"><h3>Últimos tests</h3><ul class="ldl-revision">' + prog.h.slice(0, 5).map(function (h) {
      var d = new Date(h.t);
      return "<li><b>" + (h.tipo === "simulacro" ? "Simulacro" : "Práctica") + "</b> · " + d.toLocaleDateString("es-ES") +
        " · " + h.a + "/" + h.n + " aciertos" + (h.tipo === "simulacro" ? " · nota " + num(h.nota) : "") + "</li>";
    }).join("") + "</ul></section>";
  }
  function vTemas() {
    var html = '<section class="ldl-card"><h2>Practicar por temas</h2><p class="ldl-muted">Elige un bloque. Las preguntas salen en orden aleatorio y se corrigen al momento.</p><ul class="ldl-bloques">';
    B.bloques.forEach(function (b) {
      var lista = delBloque(b.id), r = resumen(lista);
      html += '<li><button type="button" data-acc="bloque" data-id="' + esc(b.id) + '"><span class="t">' + esc(b.nombre) +
        '</span><span class="n">' + r.vistas + "/" + r.total + (r.vistas ? " · " + r.acierto + " %" : "") + "</span>" +
        '<span class="ldl-barra"><i style="width:' + pct(r.vistas, r.total) + '%"></i></span></button></li>';
    });
    return html + "</ul></section>";
  }
  function vSimulacro() {
    var total = B.preguntas.length;
    var opcionesN = [10, 20, 30, 50, 100].filter(function (n) { return n < total; });
    opcionesN.push(total);
    var porDefecto = Math.min((CFG.simulacro && CFG.simulacro.preguntas) || 30, total);
    return '<section class="ldl-card"><h2>Simulacro de examen</h2>' +
      '<p class="ldl-muted">Como el día del examen: no ves las soluciones hasta el final y cada error resta un tercio de acierto.</p>' +
      '<div class="ldl-campo"><label for="ldl-n">Número de preguntas</label><select id="ldl-n">' +
      opcionesN.map(function (n) { return "<option" + (n === porDefecto ? " selected" : "") + ">" + n + "</option>"; }).join("") +
      '</select></div><div class="ldl-campo"><label for="ldl-t">Tiempo</label><select id="ldl-t">' +
      '<option value="1">1 minuto por pregunta</option><option value="0">Sin límite de tiempo</option></select></div>' +
      '<div class="ldl-campo"><label for="ldl-b">Temas</label><select id="ldl-b"><option value="">Todos</option>' +
      B.bloques.map(function (b) { return '<option value="' + esc(b.id) + '">' + esc(b.nombre) + "</option>"; }).join("") +
      '</select></div><div class="ldl-acciones"><button class="ldl-btn" data-acc="simular" type="button">Empezar simulacro</button></div></section>';
  }
  function vFallos() {
    var f = fallosPendientes();
    if (!f.length) {
      return '<section class="ldl-card"><h2>Repaso de fallos</h2><p class="ldl-muted">No tienes fallos pendientes. Cuando falles una pregunta aparecerá aquí hasta que la aciertes.</p></section>';
    }
    return '<section class="ldl-card"><h2>Repaso de fallos</h2><p class="ldl-muted">Tienes <b>' + f.length +
      "</b> preguntas falladas. Salen de aquí en cuanto las aciertas.</p>" +
      '<div class="ldl-acciones"><button class="ldl-btn" data-acc="repasar" type="button">Repasar ahora</button></div></section>';
  }
  function vStats() {
    var html = '<section class="ldl-card"><h2>Estadísticas</h2><ul class="ldl-bloques">';
    B.bloques.forEach(function (b) {
      var r = resumen(delBloque(b.id));
      html += '<li><button type="button" data-acc="bloque" data-id="' + esc(b.id) + '"><span class="t">' + esc(b.nombre) +
        '</span><span class="n">' + (r.vistas ? r.acierto + " % de acierto" : "sin empezar") + '</span><span class="ldl-barra"><i style="width:' +
        r.acierto + '%"></i></span></button></li>';
    });
    html += '</ul></section><section class="ldl-card"><h3>Empezar de cero</h3><p class="ldl-muted ldl-small">Borra tu progreso guardado en este dispositivo.</p>' +
      '<div class="ldl-acciones"><button class="ldl-btn sec" data-acc="borrar" type="button">Borrar mi progreso</button></div></section>';
    return html;
  }
  function vPortada() {
    var n = B.preguntas.length;
    return '<section class="ldl-card"><h2>' + esc(CFG.pack.nombre) + "</h2>" +
      '<p class="ldl-muted">' + n + " preguntas tipo examen, corregidas al momento, con el artículo exacto y la explicación de cada opción. Gratis y sin registrarte.</p>" +
      '<div class="ldl-acciones"><button class="ldl-btn" data-acc="empezarweb" type="button">Empezar el test</button></div></section>';
  }

  function vTest() {
    var id = sesion.ids[sesion.i], p = POR_ID[id], sim = sesion.tipo === "simulacro";
    var elegida = sesion.resp[id], corregida = !sim && sesion.corregida[id];
    var html = '<section class="ldl-card"><div class="ldl-meta"><span>' + esc(sesion.titulo) + " · " + (sesion.i + 1) + " de " + sesion.ids.length +
      "</span><span>" + (sesion.limite ? '⏱ <span id="ldl-crono" class="ldl-crono">' +
        mmss(Math.max(0, sesion.limite - Math.floor((Date.now() - sesion.inicio) / 1000))) + "</span>" : esc(p.articulo_txt)) +
      '</span></div><div class="ldl-progreso"><i style="width:' + pct(sesion.i + (corregida ? 1 : 0), sesion.ids.length) + '%"></i></div>' +
      '<p class="ldl-enunciado">' + esc(p.enunciado) + '</p><div class="ldl-opciones" role="group" aria-label="Opciones">';
    LETRAS.forEach(function (l) {
      var cls = "ldl-op";
      if (corregida) { if (l === p.correcta) cls += " ok"; else if (l === elegida) cls += " ko"; }
      else if (sim && elegida === l) cls += " marcada";
      html += '<button type="button" class="' + cls + '" data-acc="resp" data-l="' + l + '"' + (corregida ? " disabled" : "") +
        (sim ? ' aria-pressed="' + (elegida === l) + '"' : "") + '><span class="l">' + l + ")</span><span>" + esc(p.opciones[l]) + "</span></button>";
    });
    html += "</div>";
    if (corregida) html += feedback(p, elegida);
    html += '<div class="ldl-acciones">';
    if (sim) {
      html += (sesion.i > 0 ? '<button class="ldl-btn sec" data-acc="ant" type="button">Anterior</button>' : "") +
        '<button class="ldl-btn" data-acc="sig" type="button">' + (sesion.i < sesion.ids.length - 1 ? "Siguiente" : "Entregar") + "</button>" +
        (sesion.i < sesion.ids.length - 1 ? '<button class="ldl-btn sec" data-acc="entregar" type="button">Entregar ya</button>' : "");
    } else if (corregida) {
      html += '<button class="ldl-btn" data-acc="sig" type="button">' + (sesion.i < sesion.ids.length - 1 ? "Siguiente" : "Ver resultado") + "</button>";
    }
    html += '<button class="ldl-btn sec" data-acc="salir" type="button">Salir</button></div></section>';
    return html;
  }
  function feedback(p, elegida) {
    var bien = elegida === p.correcta;
    return '<div class="ldl-feedback" aria-live="polite"><div class="v ' + (bien ? "ok" : "ko") + '">' +
      (bien ? "¡Correcta!" : "Incorrecta. La respuesta correcta es la " + p.correcta + ")") + "</div><div>" + esc(p.explicacion) + "</div>" +
      (p.cita ? '<blockquote class="ldl-cita">' + esc(p.cita) + "<small>" + esc(p.articulo_txt) + "</small></blockquote>" : "") + "</div>";
  }
  function vResultado() {
    var r = calcular(sesion), sim = sesion.tipo === "simulacro";
    var html = '<section class="ldl-card"><h2>' + (sim ? "Resultado del simulacro" : "Resultado") + "</h2>" +
      '<div class="ldl-nota">' + (sim ? num(r.nota.toFixed(2)) : r.aciertos + "/" + r.total) + "</div>" +
      '<p class="ldl-muted">' + plural(r.aciertos, "acierto", "aciertos") + " · " + plural(r.errores, "error", "errores") +
      (r.blancos ? " · " + r.blancos + " en blanco" : "") +
      (sim ? " · nota sobre 10 con penalización" : "") + "</p>";
    if (CFG.modo === "web") html += ctaWeb(r);
    html += '<div class="ldl-acciones">' + (CFG.modo === "web" ? '<button class="ldl-btn sec" data-acc="empezarweb" type="button">Repetir con otro orden</button>' :
      '<button class="ldl-btn" data-acc="ir" data-v="inicio" type="button">Volver al inicio</button>') + "</div></section>";
    html += '<section class="ldl-card"><h3>Revisión</h3><ul class="ldl-revision">';
    sesion.ids.forEach(function (id, n) {
      var p = POR_ID[id], e = sesion.resp[id], chip = !e ? '<span class="ldl-chip nr">En blanco</span>' :
        e === p.correcta ? '<span class="ldl-chip ok">Bien</span>' : '<span class="ldl-chip ko">Mal</span>';
      html += "<li>" + chip + '<span class="e">' + (n + 1) + ". " + esc(p.enunciado) + "</span><br>" +
        '<span class="ldl-small">Correcta: <b>' + p.correcta + ") " + esc(p.opciones[p.correcta]) + "</b>" +
        (e && e !== p.correcta ? " · Marcaste " + e + ")" : "") + '</span><br><span class="ldl-small ldl-muted">' + esc(p.explicacion) + "</span></li>";
    });
    return html + "</ul></section>";
  }
  function ctaWeb() {
    var c = CFG.compra || {}, html = "";
    if (c.url) {
      html += '<div class="ldl-card ldl-cta"><h3>' + esc(c.titulo) + '</h3><p class="ldl-muted">' + esc(c.texto) + "</p>" +
        '<div class="ldl-acciones"><a class="ldl-btn acc" href="' + esc(c.url) + '">' + esc(c.boton) + "</a></div></div>";
    }
    if (CFG.telegram) {
      html += '<p class="ldl-small">¿Quieres un test cada día? <a href="' + esc(CFG.telegram) + '">Únete gratis al canal de Telegram</a>.</p>';
    }
    return html;
  }

  function pintar() {
    var cuerpo;
    if (vista === "test") cuerpo = vTest();
    else if (vista === "resultado") cuerpo = vResultado();
    else if (vista === "portada") cuerpo = vPortada();
    else if (vista === "temas") cuerpo = vTemas();
    else if (vista === "simulacro") cuerpo = vSimulacro();
    else if (vista === "fallos") cuerpo = vFallos();
    else if (vista === "stats") cuerpo = vStats();
    else cuerpo = vInicio();
    raiz.innerHTML = '<div class="ldl">' + cabecera() + navegacion() + "<main>" + cuerpo + "</main>" + pie() + "</div>";
  }

  /* ---------- eventos ---------- */
  raiz.addEventListener("click", function (ev) {
    var el = ev.target.closest("[data-acc]");
    if (!el) return;
    var acc = el.getAttribute("data-acc");
    if (acc === "tema") return cambiarTema();
    if (acc === "ir") { pararReloj(); vista = el.getAttribute("data-v"); sesion = null; pintar(); return; }
    if (acc === "rapido") return empezar("practica", barajar(B.preguntas).slice(0, 20), { titulo: "Test rápido" });
    if (acc === "repasar") return empezar("practica", barajar(fallosPendientes()).slice(0, 30), { titulo: "Repaso de fallos" });
    if (acc === "bloque") {
      var b = B.bloques.filter(function (x) { return x.id === el.getAttribute("data-id"); })[0];
      return empezar("practica", barajar(delBloque(b.id)), { titulo: b.nombre });
    }
    if (acc === "simular") {
      var n = parseInt(document.getElementById("ldl-n").value, 10);
      var conTiempo = document.getElementById("ldl-t").value === "1";
      var bloque = document.getElementById("ldl-b").value;
      var fuente = bloque ? delBloque(bloque) : B.preguntas;
      var elegidas = barajar(fuente).slice(0, n);
      return empezar("simulacro", elegidas, { titulo: "Simulacro", minutos: conTiempo ? elegidas.length : 0 });
    }
    if (acc === "empezarweb") return empezar("practica", barajar(B.preguntas), { titulo: "Test gratuito" });
    if (acc === "resp") return responder(el.getAttribute("data-l"));
    if (acc === "sig") return siguiente();
    if (acc === "ant") return anterior();
    if (acc === "entregar") return terminar();
    if (acc === "salir") { pararReloj(); sesion = null; vista = CFG.modo === "web" ? "portada" : "inicio"; pintar(); return; }
    if (acc === "borrar") {
      if (el.getAttribute("data-confirmar") === "1") { prog = { p: {}, h: [] }; guardar(); pintar(); }
      else { el.setAttribute("data-confirmar", "1"); el.textContent = "Pulsa otra vez para confirmar"; }
    }
  });
  document.addEventListener("keydown", function (ev) {
    if (vista !== "test" || !sesion || ev.altKey || ev.ctrlKey || ev.metaKey) return;
    var k = ev.key.toLowerCase(), mapa = { "1": "a", "2": "b", "3": "c", "4": "d", a: "a", b: "b", c: "c", d: "d" };
    if (mapa[k]) { ev.preventDefault(); responder(mapa[k]); }
    else if (k === "enter" || k === "arrowright") {
      var id = sesion.ids[sesion.i];
      if (sesion.tipo === "simulacro" || sesion.corregida[id]) { ev.preventDefault(); siguiente(); }
    } else if (k === "arrowleft" && sesion.tipo === "simulacro") { ev.preventDefault(); anterior(); }
  });

  pintar();
})();
</script>
</body>
</html>
