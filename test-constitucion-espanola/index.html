e":"Disposición derogatoria"},{"id":"CE|Disposición final","ley":"CE","nombre":"Disposición final"}],"preguntas":[{"id":"CE-L1-002","ley":"CE","articulo":"Preámbulo","articulo_txt":"Preámbulo · CE","bloque_id":"CE|Preámbulo","enunciado":"Según el Preámbulo de la Constitución, ¿quién aprueba la Constitución y quién la ratifica?","opciones":{"a":"El pueblo español la aprueba y las Cortes la ratifican","b":"Las Cortes la aprueban y el Rey la ratifica","c":"La Nación española la aprueba y las Cortes la ratifican","d":"Las Cortes la aprueban y el pueblo español la ratifica"},"correcta":"d","explicacion":"El último párrafo del Preámbulo dice que «las Cortes aprueban y el pueblo español ratifica» la Constitución. La a) invierte los papeles que el Preámbulo atribuye a las Cortes y al pueblo español. La b) el Preámbulo no menciona al Rey: quien ratifica es el pueblo español. La c) la Nación española es el sujeto que proclama su voluntad al comienzo del Preámbulo, no quien aprueba la Constitución.","cita":"«En consecuencia, las Cortes aprueban y el pueblo español ratifica la siguiente CONSTITUCIÓN»","dificultad":1},{"id":"CE-L1-003","ley":"CE","articulo":"Preámbulo","articulo_txt":"Preámbulo · CE","bloque_id":"CE|Preámbulo","enunciado":"Según el Preámbulo de la Constitución, uno de los fines que se proclaman es consolidar un Estado de Derecho que asegure:","opciones":{"a":"el imperio de la ley como expresión de la voluntad popular","b":"la soberanía nacional como expresión de la voluntad popular","c":"la convivencia democrática dentro de la Constitución y de las leyes","d":"la primacía de la Constitución como norma suprema del ordenamiento"},"correcta":"a","explicacion":"El Preámbulo proclama la voluntad de «Consolidar un Estado de Derecho que asegure el imperio de la ley como expresión de la voluntad popular». La b) sustituye «el imperio de la ley» por la soberanía nacional, que el art. 1.2 sitúa en el pueblo español. La c) la convivencia democrática es otro fin distinto del Preámbulo, que la Nación quiere «garantizar». La d) esa expresión no figura en el Preámbulo.","cita":"«Consolidar un Estado de Derecho que asegure el imperio de la ley como expresión de la voluntad popular.»","dificultad":2},{"id":"CE-L1-010","ley":"CE","articulo":"1.2","articulo_txt":"Art. 1.2 CE","bloque_id":"CE|Título Preliminar","enunciado":"Según el artículo 1.2 de la Constitución, la soberanía nacional:","opciones":{"a":"reside en las Cortes Generales, de las que emanan los poderes del Estado","b":"reside en la Nación española, de la que emanan los poderes del Estado","c":"reside en el Rey y en las Cortes Generales, de quienes emanan los poderes del Estado","d":"reside en el pueblo español, del que emanan los poderes del Estado"},"correcta":"d","explicacion":"El art. 1.2 establece: «La soberanía nacional reside en el pueblo español, del que emanan los poderes del Estado». La a) el art. 1.2 no sitúa la soberanía en las Cortes Generales, sino en el pueblo español. La b) aunque el Preámbulo dice que la Nación española actúa «en uso de su soberanía», el art. 1.2 sitúa la soberanía nacional en el pueblo español. La c) el art. 1.2 no menciona al Rey ni a las Cortes Generales.","cita":"«La soberanía nacional reside en el pueblo español, del que emanan los poderes del Estado.»","dificultad":1},{"id":"CE-L1-039","ley":"CE","articulo":"8.1","articulo_txt":"Art. 8.1 CE","bloque_id":"CE|Título Preliminar","enunciado":"¿Cuál de las siguientes NO forma parte de la misión que el artículo 8.1 de la Constitución atribuye a las Fuerzas Armadas?","opciones":{"a":"Garantizar la soberanía e independencia de España","b":"Defender la integridad territorial de España","c":"Garantizar la seguridad ciudadana","d":"Defender el ordenamiento constitucional"},"correcta":"c","explicacion":"La seguridad ciudadana no aparece en el art. 8.1: garantizarla es misión de las Fuerzas y Cuerpos de seguridad según el art. 104.1. La a), la b) y la d) sí forman parte de la misión que el art. 8.1 atribuye a las Fuerzas Armadas.","cita":"«Las Fuerzas Armadas, constituidas por el Ejército de Tierra, la Armada y el Ejército del Aire, tienen como misión garantizar la soberanía e independencia de España, defender su integridad territorial y el ordenamiento constitucional.»","dificultad":1},{"id":"CE-L1-052","ley":"CE","articulo":"10.1","articulo_txt":"Art. 10.1 CE","bloque_id":"CE|Título I. De los derechos y deberes fundamentales","enunciado":"¿Con qué adjetivo califica el artículo 10.1 de la Constitución a los derechos que menciona junto a la dignidad de la persona?","opciones":{"a":"Inviolables","b":"Inalienables","c":"Imprescriptibles","d":"Universales"},"correcta":"a","explicacion":"El art. 10.1 menciona «los derechos inviolables que le son inherentes». La b), la c) y la d) no corresponden al adjetivo que emplea el art. 10.1.","cita":"«La dignidad de la persona, los derechos inviolables que le son inherentes, el libre desarrollo de la personalidad, el respeto a la ley y a los derechos de los demás son fundamento del orden político y de la paz social.»","dificultad":2},{"id":"CE-L1-054","ley":"CE","articulo":"10.2","articulo_txt":"Art. 10.2 CE","bloque_id":"CE|Título I. De los derechos y deberes fundamentales","enunciado":"¿Qué texto internacional menciona expresamente el artículo 10.2 de la Constitución como criterio de interpretación de las normas relativas a los derechos fundamentales y a las libertades?","opciones":{"a":"La Declaración Universal de Derechos Humanos","b":"El Convenio Europeo de Derechos Humanos","c":"La Carta de los Derechos Fundamentales de la Unión Europea","d":"El Pacto Internacional de Derechos Civiles y Políticos"},"correcta":"a","explicacion":"El único texto que el art. 10.2 cita por su nombre es «la Declaración Universal de Derechos Humanos»; los demás tratados y acuerdos se mencionan de forma genérica. La b), la c) y la d) no se citan por su nombre en el art. 10.2.","cita":"«Las normas relativas a los derechos fundamentales y a las libertades que la Constitución reconoce se interpretarán de conformidad con la Declaración Universal de Derechos Humanos y los tratados y acuerdos internacionales sobre las mismas materias ratificados por España.»","dificultad":2},{"id":"CE-L1-064","ley":"CE","articulo":"13.2","articulo_txt":"Art. 13.2 CE","bloque_id":"CE|Título I. Capítulo primero. De los españoles y los extranjeros","enunciado":"Según el artículo 13.2 de la Constitución, ¿quiénes serán titulares de los derechos reconocidos en el artículo 23, salvo la excepción que el propio apartado prevé?","opciones":{"a":"Solamente los españoles","b":"Los españoles y los ciudadanos de la Unión Europea residentes en España","c":"Los españoles y los extranjeros con residencia legal en España","d":"Todas las personas mayores de edad residentes en España"},"correcta":"a","explicacion":"El art. 13.2 dispone que «Solamente los españoles serán titulares de los derechos reconocidos en el artículo 23», con la salvedad que prevé para las elecciones municipales. La b) el art. 13.2 reserva la titularidad a los españoles, con la única salvedad de las elecciones municipales. La c) el art. 13.2 no extiende la titularidad a los extranjeros residentes. La d) el art. 13.2 reserva la titularidad a los españoles.","cita":"«Solamente los españoles serán titulares de los derechos reconocidos en el artículo 23, salvo lo que, atendiendo a criterios de reciprocidad, pueda establecerse por tratado o ley para el derecho de sufragio activo y pasivo en las elecciones municipales.»","dificultad":1},{"id":"CE-L1-067","ley":"CE","articulo":"13.3","articulo_txt":"Art. 13.3 CE","bloque_id":"CE|Título I. Capítulo primero. De los españoles y los extranjeros","enunciado":"Según el artículo 13.3 de la Constitución, la extradición:","opciones":{"a":"solo se concederá en cumplimiento de un tratado internacional ratificado por España","b":"se concederá siempre que la solicite un Estado que aplique el principio de reciprocidad","c":"solo se concederá en cumplimiento de un tratado o de la ley, atendiendo al principio de reciprocidad","d":"solo se concederá en cumplimiento de la ley, sin atender a la reciprocidad"},"correcta":"c","explicacion":"El art. 13.3 dispone que «La extradición sólo se concederá en cumplimiento de un tratado o de la ley, atendiendo al principio de reciprocidad». La a) el art. 13.3 admite también la extradición en cumplimiento de la ley. La b) el art. 13.3 exige que se conceda en cumplimiento de un tratado o de la ley. La d) el art. 13.3 exige atender al principio de reciprocidad.","cita":"«La extradición sólo se concederá en cumplimiento de un tratado o de la ley, atendiendo al principio de reciprocidad. Quedan excluidos de la extradición los delitos políticos, no considerándose como tales los actos de terrorismo.»","dificultad":1},{"id":"CE-L1-073","ley":"CE","articulo":"14","articulo_txt":"Art. 14 CE","bloque_id":"CE|Título I. Capítulo segundo. Derechos y libertades","enunciado":"¿Dónde se ubica el artículo 14 dentro de la Constitución?","opciones":{"a":"En la Sección 1.ª del Capítulo segundo del Título I, «De los derechos fundamentales y de las libertades públicas»","b":"En el Capítulo primero del Título I, «De los españoles y los extranjeros»","c":"En el Título Preliminar","d":"En el Capítulo segundo del Título I, antes de la Sección 1.ª"},"correcta":"d","explicacion":"El art. 14 abre el Capítulo segundo del Título I, «Derechos y libertades», y precede a la Sección 1.ª, que comienza en el art. 15. La a) la Sección 1.ª comienza en el art. 15. La b) ese capítulo termina en el art. 13. La c) el Título Preliminar termina en el art. 9.","cita":"«Los españoles son iguales ante la ley, sin que pueda prevalecer discriminación alguna por razón de nacimiento, raza, sexo, religión, opinión o cualquier otra condición o circunstancia personal o social.»","dificultad":3},{"id":"CE-L1-072","ley":"CE","articulo":"14","articulo_txt":"Art. 14 CE","bloque_id":"CE|Título I. Capítulo segundo. Derechos y libertades","enunciado":"Según el artículo 14 de la Constitución, no puede prevalecer discriminación alguna por razón de:","opciones":{"a":"nacimiento, raza, sexo, lengua, religión u opinión","b":"raza, sexo, edad, religión, opinión o cualquier otra condición o circunstancia personal o social","c":"nacimiento, raza, sexo, religión, opinión o cualquier otra condición o circunstancia personal o social","d":"nacimiento, raza, sexo, religión, ideología o cualquier otra condición o circunstancia personal o económica"},"correcta":"c","explicacion":"El art. 14 prohíbe la discriminación «por razón de nacimiento, raza, sexo, religión, opinión o cualquier otra condición o circunstancia personal o social». La a) incluye la lengua, que el art. 14 no nombra, y omite la cláusula final abierta. La b) sustituye el nacimiento por la edad, que el art. 14 no nombra. La d) cambia «opinión» por «ideología» y «social» por «económica».","cita":"«Los españoles son iguales ante la ley, sin que pueda prevalecer discriminación alguna por razón de nacimiento, raza, sexo, religión, opinión o cualquier otra condición o circunstancia personal o social.»","dificultad":2},{"id":"CE-L2-021","ley":"CE","articulo":"20.1.d)","articulo_txt":"Art. 20.1.d) CE","bloque_id":"CE|Título I, Capítulo II, Sección 1.ª: De los derechos fundamentales y de las libertades públicas","enunciado":"Según el artículo 20.1.d) de la Constitución, se reconoce y protege el derecho a comunicar o recibir libremente información:","opciones":{"a":"objetiva por los medios de comunicación social.","b":"veraz por los medios de comunicación autorizados.","c":"veraz por cualquier medio de difusión.","d":"imparcial por cualquier medio de difusión."},"correcta":"c","explicacion":"Art. 20.1.d) CE: «A comunicar o recibir libremente información veraz por cualquier medio de difusión». La a) y la d) cambian el adjetivo «veraz» por otros (objetiva, imparcial), y la a) y la b) restringen los medios de difusión.","cita":"«A comunicar o recibir libremente información veraz por cualquier medio de difusión. La ley regulará el derecho a la cláusula de conciencia y al secreto profesional en el ejercicio de estas libertades.»","dificultad":2},{"id":"CE-L2-044","ley":"CE","articulo":"25.3","articulo_txt":"Art. 25.3 CE","bloque_id":"CE|Título I, Capítulo II, Sección 1.ª: De los derechos fundamentales y de las libertades públicas","enunciado":"De acuerdo con el artículo 25.3 de la Constitución:","opciones":{"a":"La Administración civil no podrá imponer sanciones que, directa o subsidiariamente, impliquen privación de libertad.","b":"La Administración civil podrá imponer sanciones que impliquen privación de libertad solo con carácter subsidiario.","c":"Ninguna Administración pública, civil o militar, podrá imponer sanciones que impliquen privación de libertad.","d":"La Administración no podrá imponer sanciones pecuniarias superiores a las penas de multa previstas en el Código Penal."},"correcta":"a","explicacion":"Art. 25.3 CE: la prohibición se refiere a «La Administración civil» y abarca las sanciones que, «directa o subsidiariamente», impliquen privación de libertad. La b) admite la vía subsidiaria que el precepto excluye; la c) extiende la prohibición a la Administración militar, que el texto no menciona, y la d) no figura en el artículo.","cita":"«La Administración civil no podrá imponer sanciones que, directa o subsidiariamente, impliquen privación de libertad.»","dificultad":2},{"id":"CE-L2-070","ley":"CE","articulo":"32.2","articulo_txt":"Art. 32.2 CE","bloque_id":"CE|Título I, Capítulo II, Sección 2.ª: De los derechos y deberes de los ciudadanos","enunciado":"¿Cuál de las siguientes materias NO menciona el artículo 32.2 de la Constitución entre las que la ley regulará en relación con el matrimonio?","opciones":{"a":"Las formas de matrimonio.","b":"La edad y capacidad para contraerlo.","c":"El régimen económico matrimonial.","d":"Las causas de separación y disolución y sus efectos."},"correcta":"c","explicacion":"El art. 32.2 CE remite a la ley «las formas de matrimonio, la edad y capacidad para contraerlo, los derechos y deberes de los cónyuges, las causas de separación y disolución y sus efectos». El régimen económico matrimonial no figura en esa enumeración, mientras que la a), la b) y la d) sí.","cita":"«La ley regulará las formas de matrimonio, la edad y capacidad para contraerlo, los derechos y deberes de los cónyuges, las causas de separación y disolución y sus efectos.»","dificultad":2},{"id":"CE-L2-078","ley":"CE","articulo":"36","articulo_txt":"Art. 36 CE","bloque_id":"CE|Título I, Capítulo II, Sección 2.ª: De los derechos y deberes de los ciudadanos","enunciado":"Según el artículo 36 de la Constitución, la estructura interna y el funcionamiento de los Colegios Profesionales deberán ser:","opciones":{"a":"transparentes y participativos.","b":"democráticos.","c":"los que determinen sus propios estatutos, sin sujeción a la ley.","d":"los que apruebe el Gobierno mediante real decreto."},"correcta":"b","explicacion":"Art. 36 CE: «La estructura interna y el funcionamiento de los Colegios deberán ser democráticos». La a) emplea calificativos que el precepto no utiliza; la c) ignora la remisión a la ley del primer inciso, y la d) introduce una aprobación gubernativa que el texto no prevé. La Ley de Colegios Profesionales sí somete a las organizaciones colegiales al principio de transparencia en su gestión y prevé que el Gobierno apruebe los Estatutos generales de cada profesión, pero el art. 36 CE solo exige que su estructura interna y su funcionamiento sean democráticos.","cita":"«La ley regulará las peculiaridades propias del régimen jurídico de los Colegios Profesionales y el ejercicio de las profesiones tituladas. La estructura interna y el funcionamiento de los Colegios deberán ser democráticos.»","dificultad":1},{"id":"CE-L3-003","ley":"CE","articulo":"40.1","articulo_txt":"Art. 40.1 CE","bloque_id":"CE|Título I. De los derechos y deberes fundamentales. Capítulo III. De los principios rectores de la política social y económica","enunciado":"Según el artículo 40.1 de la Constitución, ¿qué política realizarán de manera especial los poderes públicos?","opciones":{"a":"Una política orientada a la estabilidad presupuestaria.","b":"Una política orientada al pleno empleo.","c":"Una política orientada a la reducción de la jornada laboral.","d":"Una política orientada al equilibrio territorial."},"correcta":"b","explicacion":"Art. 40.1 CE: «De manera especial realizarán una política orientada al pleno empleo». La a) confunde con el marco de «estabilidad económica» del mismo apartado (la estabilidad presupuestaria es el principio del art. 135); la c) evoca la limitación de la jornada laboral, que el art. 40.2 prevé como medio para garantizar el descanso; y el equilibrio territorial (d) no es la política que el precepto destaca.","cita":"«Los poderes públicos promoverán las condiciones favorables para el progreso social y económico y para una distribución de la renta regional y personal más equitativa, en el marco de una política de estabilidad económica. De manera especial realizarán una política orientada al pleno empleo.»","dificultad":1},{"id":"CE-L3-010","ley":"CE","articulo":"45.1","articulo_txt":"Art. 45.1 CE","bloque_id":"CE|Título I. De los derechos y deberes fundamentales. Capítulo III. De los principios rectores de la política social y económica","enunciado":"Según el artículo 45.1 de la Constitución, respecto de un medio ambiente adecuado para el desarrollo de la persona, todos tienen:","opciones":{"a":"El derecho a disfrutarlo y el deber de denunciar su deterioro.","b":"El deber de conservarlo, sin que se reconozca un derecho a disfrutarlo.","c":"El derecho a disfrutarlo, cuya conservación corresponde en exclusiva a los poderes públicos.","d":"El derecho a disfrutarlo, así como el deber de conservarlo."},"correcta":"d","explicacion":"Art. 45.1 CE: todos tienen el derecho a disfrutar de un medio ambiente adecuado para el desarrollo de la persona, «así como el deber de conservarlo». La a) inventa un deber de denuncia; la b) niega el derecho que el precepto reconoce; y la c) atribuye la conservación en exclusiva a los poderes públicos, cuando el deber de conservarlo corresponde a todos.","cita":"«Todos tienen el derecho a disfrutar de un medio ambiente adecuado para el desarrollo de la persona, así como el deber de conservarlo.»","dificultad":1},{"id":"CE-L3-024","ley":"CE","articulo":"53.1","articulo_txt":"Art. 53.1 CE","bloque_id":"CE|Título I. De los derechos y deberes fundamentales. Capítulo IV. De las garantías de las libertades y derechos fundamentales","enunciado":"Según el artículo 53.1 de la Constitución, los derechos y libertades reconocidos en el Capítulo segundo del Título I se tutelarán de acuerdo con lo previsto en el artículo:","opciones":{"a":"161.1.a), relativo al recurso de inconstitucionalidad contra leyes y disposiciones normativas con fuerza de ley.","b":"161.1.b), relativo al recurso de amparo.","c":"162.1.b), relativo a la legitimación para interponer el recurso de amparo.","d":"163, relativo a la cuestión de inconstitucionalidad planteada por los órganos judiciales."},"correcta":"a","explicacion":"Art. 53.1 CE: los derechos del Capítulo II «se tutelarán de acuerdo con lo previsto en el artículo 161, 1, a)», es decir, mediante el recurso de inconstitucionalidad contra leyes y disposiciones normativas con fuerza de ley. El recurso de amparo (b), con la legitimación del art. 162.1.b) (c), solo protege los derechos a los que se refiere el art. 53.2, y la cuestión de inconstitucionalidad del art. 163 (d) no es la referencia que hace el art. 53.1.","cita":"«Los derechos y libertades reconocidos en el Capítulo segundo del presente Título vinculan a todos los poderes públicos. Sólo por ley, que en todo caso deberá respetar su contenido esencial, podrá regularse el ejercicio de tales derechos y libertades, que se tutelarán de acuerdo con lo previsto en el artículo 161, 1, a).»","dificultad":3},{"id":"CE-L3-028","ley":"CE","articulo":"53.3","articulo_txt":"Art. 53.3 CE","bloque_id":"CE|Título I. De los derechos y deberes fundamentales. Capítulo IV. De las garantías de las libertades y derechos fundamentales","enunciado":"Según el artículo 53.3 de la Constitución, los principios reconocidos en el Capítulo tercero del Título I:","opciones":{"a":"Vinculan a todos los poderes públicos y se tutelan mediante el recurso de amparo.","b":"Solo podrán ser alegados ante la Jurisdicción ordinaria de acuerdo con lo que dispongan las leyes que los desarrollen.","c":"Podrán ser alegados directamente ante la Jurisdicción ordinaria por un procedimiento preferente y sumario.","d":"Solo podrán ser alegados ante el Tribunal Constitucional mediante el recurso de inconstitucionalidad."},"correcta":"b","explicacion":"Art. 53.3 CE: los principios rectores informan la legislación positiva, la práctica judicial y la actuación de los poderes públicos, y «sólo podrán ser alegados ante la Jurisdicción ordinaria de acuerdo con lo que dispongan las leyes que los desarrollen». La a) y la c) les atribuyen garantías (amparo, procedimiento preferente y sumario) propias de los derechos del art. 53.2, y la d) sustituye la Jurisdicción ordinaria por el Tribunal Constitucional y el recurso de inconstitucionalidad, que el art. 53.3 no menciona.","cita":"«El reconocimiento, el respeto y la protección de los principios reconocidos en el Capítulo tercero informarán la legislación positiva, la práctica judicial y la actuación de los poderes públicos. Sólo podrán ser alegados ante la Jurisdicción ordinaria de acuerdo con lo que dispongan las leyes que los desarrollen.»","dificultad":2},{"id":"CE-L3-034","ley":"CE","articulo":"55.1","articulo_txt":"Art. 55.1 CE","bloque_id":"CE|Título I. De los derechos y deberes fundamentales. Capítulo V. De la suspensión de los derechos y libertades","enunciado":"Según el artículo 55.1 de la Constitución, ¿qué derechos no pueden suspenderse cuando se declara el estado de excepción, aunque sí cuando se declara el estado de sitio?","opciones":{"a":"La garantía de que la detención preventiva no dure más de setenta y dos horas (art. 17.2).","b":"La inviolabilidad del domicilio (art. 18.2).","c":"Los derechos del detenido del artículo 17.3 (ser informado, no ser obligado a declarar y asistencia de abogado).","d":"El secreto de las comunicaciones (art. 18.3)."},"correcta":"c","explicacion":"Art. 55.1 CE: «Se exceptúa de lo establecido anteriormente el apartado 3 del artículo 17 para el supuesto de declaración de estado de excepción». Por tanto, los derechos del detenido del art. 17.3 solo pueden suspenderse en el estado de sitio, mientras que los de los arts. 17.2 (a), 18.2 (b) y 18.3 (d) pueden suspenderse tanto en el estado de excepción como en el de sitio.","cita":"«Los derechos reconocidos en los artículos 17, 18, apartados 2 y 3, artículos 19, 20, apartados 1, a) y d), y 5, artículos 21, 28, apartado 2, y artículo 37, apartado 2, podrán ser suspendidos cuando se acuerde la declaración del estado de excepción o de sitio en los términos previstos en la Constitución. Se exceptúa de lo establecido anteriormente el apartado 3 del artículo 17 para el supuesto de declaración de estado de excepción.»","dificultad":3},{"id":"CE-L3-039","ley":"CE","articulo":"55.2","articulo_txt":"Art. 55.2 CE","bloque_id":"CE|Título I. De los derechos y deberes fundamentales. Capítulo V. De la suspensión de los derechos y libertades","enunciado":"Según el artículo 55.2 de la Constitución, la utilización injustificada o abusiva de las facultades reconocidas en la ley orgánica que regule la suspensión individual de derechos producirá:","opciones":{"a":"Responsabilidad disciplinaria, conforme al régimen de los funcionarios públicos.","b":"Responsabilidad patrimonial del Estado, exclusivamente.","c":"Responsabilidad penal, como violación de los derechos y libertades reconocidos por las leyes.","d":"La nulidad de las actuaciones y la responsabilidad política del Gobierno ante el Congreso de los Diputados."},"correcta":"c","explicacion":"Art. 55.2 CE, párrafo segundo: la utilización injustificada o abusiva de esas facultades «producirá responsabilidad penal, como violación de los derechos y libertades reconocidos por las leyes». El precepto no menciona la responsabilidad disciplinaria (a), la patrimonial (b) ni la política del Gobierno (d).","cita":"«La utilización injustificada o abusiva de las facultades reconocidas en dicha ley orgánica producirá responsabilidad penal, como violación de los derechos y libertades reconocidos por las leyes.»","dificultad":2},{"id":"CE-L3-061","ley":"CE","articulo":"61.1","articulo_txt":"Art. 61.1 CE","bloque_id":"CE|Título II. De la Corona","enunciado":"Según el artículo 61.1 de la Constitución, el Rey prestará juramento al ser proclamado:","opciones":{"a":"Ante el Congreso de los Diputados.","b":"Ante el Tribunal Constitucional.","c":"Ante las Cortes Generales.","d":"Ante el Gobierno en pleno."},"correcta":"c","explicacion":"Art. 61.1 CE: el Rey presta juramento «al ser proclamado ante las Cortes Generales». No es proclamado ante una sola Cámara (a), ni ante el Tribunal Constitucional (b) o el Gobierno (d).","cita":"«El Rey, al ser proclamado ante las Cortes Generales, prestará juramento de desempeñar fielmente sus funciones, guardar y hacer guardar la Constitución y las leyes y respetar los derechos de los ciudadanos y de las Comunidades Autónomas.»","dificultad":1},{"id":"CE-L3-068","ley":"CE","articulo":"62.j","articulo_txt":"Art. 62.j CE","bloque_id":"CE|Título II. De la Corona","enunciado":"Según el artículo 62 de la Constitución, corresponde al Rey:","opciones":{"a":"La dirección de la defensa del Estado.","b":"La presidencia del Consejo General del Poder Judicial.","c":"La dirección de la Administración militar.","d":"El Alto Patronazgo de las Reales Academias."},"correcta":"d","explicacion":"Art. 62.j) CE: corresponde al Rey «el Alto Patronazgo de las Reales Academias». La dirección de la defensa del Estado (a) y la de la Administración militar (c) no figuran en el art. 62, sino en el art. 97, que las atribuye al Gobierno; y el Consejo General del Poder Judicial (b) lo preside el Presidente del Tribunal Supremo (art. 122.3).","cita":"«Corresponde al Rey: […] j) El Alto Patronazgo de las Reales Academias.»","dificultad":1},{"id":"CE-L4-024","ley":"CE","articulo":"71.4","articulo_txt":"Art. 71.4 CE","bloque_id":"CE|Título III. De las Cortes Generales. Capítulo I. De las Cámaras","enunciado":"Según el artículo 71.4 de la Constitución, la asignación que perciben los Diputados y Senadores:","opciones":{"a":"Será fijada por la Ley de Presupuestos Generales del Estado.","b":"Será fijada por el Gobierno, a propuesta de las Mesas de las Cámaras.","c":"Será fijada de común acuerdo por ambas Cámaras en el Estatuto del Personal de las Cortes Generales.","d":"Será fijada por las respectivas Cámaras."},"correcta":"d","explicacion":"Art. 71.4 CE: los Diputados y Senadores perciben una asignación «que será fijada por las respectivas Cámaras». No la fija la Ley de Presupuestos (a) ni el Gobierno (b); y el Estatuto del Personal de las Cortes Generales (c), que las Cámaras regulan de común acuerdo (art. 72.1), se refiere al personal de las Cortes, no a los parlamentarios.","cita":"«Los Diputados y Senadores percibirán una asignación que será fijada por las respectivas Cámaras.»","dificultad":2},{"id":"CE-L4-044","ley":"CE","articulo":"78.2","articulo_txt":"Art. 78.2 CE","bloque_id":"CE|Título III. De las Cortes Generales. Capítulo I. De las Cámaras","enunciado":"Según el artículo 78.2 de la Constitución, cuando las Cámaras hubieren sido disueltas o hubiere expirado su mandato, las Diputaciones Permanentes asumirán las facultades que correspondan a las Cámaras de acuerdo con los artículos:","opciones":{"a":"81 y 116.","b":"86 y 116.","c":"86 y 155.","d":"94 y 116."},"correcta":"b","explicacion":"Art. 78.2 CE: asumen las facultades de las Cámaras «de acuerdo con los artículos 86 y 116», es decir, en materia de decretos-leyes y de estados de alarma, excepción y sitio. El art. 81 regula las leyes orgánicas (a); el 155, las medidas del Gobierno ante una Comunidad Autónoma que incumpla sus obligaciones (c); y el 94, la autorización de tratados (d).","cita":"«Las Diputaciones Permanentes estarán presididas por el Presidente de la Cámara respectiva y tendrán como funciones la prevista en el artículo 73, la de asumir las facultades que correspondan a las Cámaras, de acuerdo con los artículos 86 y 116, en caso de que éstas hubieren sido disueltas o hubiere expirado su mandato y la de velar por los poderes de las Cámaras cuando éstas no estén reunidas.»","dificultad":3},{"id":"CE-L4-057","ley":"CE","articulo":"82.3","articulo_txt":"Art. 82.3 CE","bloque_id":"CE|Título III. De las Cortes Generales. Capítulo II. De la elaboración de las leyes","enunciado":"Según el artículo 82.3 de la Constitución, la delegación legislativa:","opciones":{"a":"Podrá entenderse concedida de modo implícito cuando así resulte de la ley de bases.","b":"Se agota por el uso que de ella haga el Gobierno mediante la publicación de la norma correspondiente.","c":"Podrá otorgarse por tiempo indeterminado cuando se trate de refundir textos legales.","d":"Podrá permitir la subdelegación en los órganos de gobierno de las Comunidades Autónomas."},"correcta":"b","explicacion":"Art. 82.3 CE: la delegación «se agota por el uso que de ella haga el Gobierno mediante la publicación de la norma correspondiente». El mismo apartado prohíbe entenderla concedida de modo implícito (a) o por tiempo indeterminado (c) y permitir la subdelegación a autoridades distintas del propio Gobierno (d).","cita":"«La delegación legislativa habrá de otorgarse al Gobierno de forma expresa para materia concreta y con fijación del plazo para su ejercicio. La delegación se agota por el uso que de ella haga el Gobierno mediante la publicación de la norma correspondiente. No podrá entenderse concedida de modo implícito o por tiempo indeterminado. Tampoco podrá permitir la subdelegación a autoridades distintas del propio Gobierno.»","dificultad":2},{"id":"CE-L4-073","ley":"CE","articulo":"90.2","articulo_txt":"Art. 90.2 CE","bloque_id":"CE|Título III. De las Cortes Generales. Capítulo II. De la elaboración de las leyes","enunciado":"Según el artículo 90.2 de la Constitución, el Senado dispone, a partir del día de la recepción del texto, de un plazo para oponer su veto o introducir enmiendas de:","opciones":{"a":"Un mes.","b":"Veinte días naturales.","c":"Tres meses.","d":"Dos meses."},"correcta":"d","explicacion":"Art. 90.2 CE: el Senado tiene «dos meses, a partir del día de la recepción del texto» para vetar o enmendar mediante mensaje motivado. Veinte días naturales (b) es el plazo reducido de los proyectos declarados urgentes por el Gobierno o por el Congreso (art. 90.3); un mes (a) y tres meses (c) no aparecen en el precepto.","cita":"«El Senado en el plazo de dos meses, a partir del día de la recepción del texto, puede, mediante mensaje motivado, oponer su veto o introducir enmiendas al mismo. El veto deberá ser aprobado por mayoría absoluta. El proyecto no podrá ser sometido al Rey para sanción sin que el Congreso ratifique por mayoría absoluta, en caso de veto, el texto inicial, o por mayoría simple, una vez transcurridos dos meses desde la interposición del mismo, o se pronuncie sobre las enmiendas, aceptándolas o no por mayoría simple.»","dificultad":1},{"id":"CE-L4-090","ley":"CE","articulo":"95.1","articulo_txt":"Art. 95.1 CE","bloque_id":"CE|Título III. De las Cortes Generales. Capítulo III. De los Tratados Internacionales","enunciado":"Según el artículo 95.1 de la Constitución, la celebración de un tratado internacional que contenga estipulaciones contrarias a la Constitución exigirá:","opciones":{"a":"Su autorización mediante ley orgánica.","b":"La previa revisión constitucional.","c":"La previa autorización de las Cortes Generales por mayoría de tres quintos.","d":"La previa declaración del Tribunal Constitucional sobre la existencia de esa contradicción."},"correcta":"b","explicacion":"Art. 95.1 CE: exige «la previa revisión constitucional». La ley orgánica (a) es la vía del art. 93; la mayoría de tres quintos (c) no aparece en el precepto; y el requerimiento al Tribunal Constitucional para que declare si existe contradicción (d) es una facultad del Gobierno o de cualquiera de las Cámaras (art. 95.2), no un requisito en todo caso.","cita":"«La celebración de un tratado internacional que contenga estipulaciones contrarias a la Constitución exigirá la previa revisión constitucional.»","dificultad":1},{"id":"CE-L4-094","ley":"CE","articulo":"96.2","articulo_txt":"Art. 96.2 CE","bloque_id":"CE|Título III. De las Cortes Generales. Capítulo III. De los Tratados Internacionales","enunciado":"Según el artículo 96.2 de la Constitución, para la denuncia de los tratados y convenios internacionales se utilizará:","opciones":{"a":"En todo caso, la previa autorización de las Cortes Generales.","b":"El mismo procedimiento previsto para su aprobación en el artículo 94.","c":"Una ley orgánica.","d":"La previa revisión constitucional."},"correcta":"b","explicacion":"Art. 96.2 CE: para la denuncia «se utilizará el mismo procedimiento previsto para su aprobación en el artículo 94». Por eso no se exige en todo caso la autorización de las Cortes (a): dependerá de si el tratado está en alguno de los supuestos del art. 94.1. La ley orgánica (c) y la revisión constitucional (d) son propias de los arts. 93 y 95.1.","cita":"«Para la denuncia de los tratados y convenios internacionales se utilizará el mismo procedimiento previsto para su aprobación en el artículo 94.»","dificultad":2},{"id":"CE-L5-005","ley":"CE","articulo":"98.2","articulo_txt":"Art. 98.2 CE","bloque_id":"CE|Título IV. Del Gobierno y de la Administración","enunciado":"Conforme al artículo 98.2 de la Constitución, el Presidente del Gobierno:","opciones":{"a":"Dirige la acción del Gobierno y responde personalmente de ella ante el Senado.","b":"Dirige la acción del Gobierno y coordina las funciones de los demás miembros del mismo, que responden únicamente ante él y carecen de responsabilidad directa en su gestión.","c":"Dirige la acción del Gobierno y coordina las funciones de los demás miembros del mismo, sin perjuicio de la competencia y responsabilidad directa de estos en su gestión.","d":"Dirige la acción del Gobierno y ejerce en exclusiva la potestad reglamentaria."},"correcta":"c","explicacion":"Art. 98.2 CE, reproducido en la c). La a) es falsa: el Gobierno responde solidariamente ante el Congreso de los Diputados (art. 108), no ante el Senado; la b) niega la responsabilidad directa de los demás miembros del Gobierno en su gestión, que el precepto salva expresamente; y la d) también, porque la potestad reglamentaria corresponde al Gobierno (art. 97), no en exclusiva a su Presidente.","cita":"«El Presidente dirige la acción del Gobierno y coordina las funciones de los demás miembros del mismo, sin perjuicio de la competencia y responsabilidad directa de éstos en su gestión»","dificultad":1},{"id":"CE-L5-034","ley":"CE","articulo":"107","articulo_txt":"Art. 107 CE","bloque_id":"CE|Título IV. Del Gobierno y de la Administración","enunciado":"¿Qué tipo de norma menciona el artículo 107 de la Constitución para regular la composición y competencia del Consejo de Estado?","opciones":{"a":"Una ley ordinaria.","b":"Un reglamento aprobado por el propio Consejo de Estado.","c":"Un real decreto acordado en Consejo de Ministros.","d":"Una ley orgánica."},"correcta":"d","explicacion":"Art. 107 CE: «Una ley orgánica regulará su composición y competencia». No basta una ley ordinaria (a), y el precepto no se remite a un reglamento del propio Consejo (b) ni a un real decreto (c).","cita":"«El Consejo de Estado es el supremo órgano consultivo del Gobierno. Una ley orgánica regulará su composición y competencia»","dificultad":1},{"id":"CE-L5-039","ley":"CE","articulo":"111.1","articulo_txt":"Art. 111.1 CE","bloque_id":"CE|Título V. De las relaciones entre el Gobierno y las Cortes Generales","enunciado":"Según el artículo 111.1 de la Constitución, para el debate de las interpelaciones y preguntas formuladas al Gobierno y a cada uno de sus miembros, los Reglamentos de las Cámaras establecerán:","opciones":{"a":"Un tiempo máximo semanal.","b":"Un tiempo mínimo semanal.","c":"Un tiempo mínimo mensual.","d":"Una sesión plenaria cada quince días."},"correcta":"b","explicacion":"Art. 111.1 CE: «Para esta clase de debate los Reglamentos establecerán un tiempo mínimo semanal». No es un tiempo máximo (a), ni mensual (c), ni una sesión quincenal (d).","cita":"«El Gobierno y cada uno de sus miembros están sometidos a las interpelaciones y preguntas que se le formulen en las Cámaras. Para esta clase de debate los Reglamentos establecerán un tiempo mínimo semanal»","dificultad":1},{"id":"CE-L5-066","ley":"CE","articulo":"118","articulo_txt":"Art. 118 CE","bloque_id":"CE|Título VI. Del Poder Judicial","enunciado":"Según el artículo 118 de la Constitución, es obligado cumplir las sentencias y demás resoluciones firmes de los Jueces y Tribunales, así como:","opciones":{"a":"Acatar las instrucciones generales del Consejo General del Poder Judicial.","b":"Prestar la colaboración requerida por el Ministerio Fiscal en sus investigaciones, con exclusión de la que requieran los Jueces.","c":"Prestar la colaboración requerida por estos únicamente en la fase de ejecución de lo resuelto.","d":"Prestar la colaboración requerida por estos en el curso del proceso y en la ejecución de lo resuelto."},"correcta":"d","explicacion":"Art. 118 CE: es obligado «prestar la colaboración requerida por éstos en el curso del proceso y en la ejecución de lo resuelto». El precepto no menciona instrucciones del Consejo General del Poder Judicial (a), la colaboración se debe a los Jueces y Tribunales (b) y no se limita a la fase de ejecución (c).","cita":"«Es obligado cumplir las sentencias y demás resoluciones firmes de los Jueces y Tribunales, así como prestar la colaboración requerida por éstos en el curso del proceso y en la ejecución de lo resuelto»","dificultad":1},{"id":"CE-L6-005","ley":"CE","articulo":"132.2","articulo_txt":"Art. 132.2 CE","bloque_id":"CE|Título VII. Economía y Hacienda","enunciado":"Según el artículo 132.2 de la Constitución, son bienes de dominio público estatal los que determine la ley y, en todo caso:","opciones":{"a":"La zona marítimo-terrestre, las playas, las aguas continentales y los recursos naturales del subsuelo del territorio nacional.","b":"Las playas, el mar territorial, los puertos de interés general y el espacio aéreo.","c":"El mar territorial, las aguas interiores, los montes de utilidad pública y los recursos naturales de la plataforma continental.","d":"La zona marítimo-terrestre, las playas, el mar territorial y los recursos naturales de la zona económica y la plataforma continental."},"correcta":"d","explicacion":"Art. 132.2 CE: la enumeración constitucional es «la zona marítimo-terrestre, las playas, el mar territorial y los recursos naturales de la zona económica y la plataforma continental». Las demás opciones introducen bienes que el precepto no menciona: las aguas continentales y el subsuelo en la a), los puertos y el espacio aéreo en la b) y las aguas interiores y los montes de utilidad pública en la c). Algunos de esos bienes son de dominio público estatal porque así lo dispone una ley (por ejemplo, las aguas continentales, según la Ley de Aguas, o las aguas interiores, según la Ley de Costas), pero no forman parte de la lista que la Constitución fija «en todo caso».","cita":"«Son bienes de dominio público estatal los que determine la ley y, en todo caso, la zona marítimo-terrestre, las playas, el mar territorial y los recursos naturales de la zona económica y la plataforma continental.»","dificultad":2},{"id":"CE-L6-049","ley":"CE","articulo":"151.1","articulo_txt":"Art. 151.1 CE","bloque_id":"CE|Título VIII. De la Organización Territorial del Estado","enunciado":"Según el artículo 151.1 de la Constitución, la iniciativa autonómica prevista en ese precepto debe ser ratificada mediante referéndum por:","opciones":{"a":"La mayoría de los votos válidamente emitidos en cada provincia.","b":"El voto afirmativo de la mayoría absoluta de los electores de cada provincia.","c":"El voto afirmativo de la mayoría absoluta de los electores del conjunto del territorio afectado.","d":"El voto afirmativo de las tres cuartas partes de los electores de cada provincia."},"correcta":"b","explicacion":"Art. 151.1 CE: la ratificación exige «el voto afirmativo de la mayoría absoluta de los electores de cada provincia», en los términos que establezca una ley orgánica. La a) es la mayoría que el art. 151.2 exige para aprobar en referéndum el proyecto de Estatuto, la c) computa el conjunto del territorio en lugar de cada provincia y la d) eleva la mayoría.","cita":"«[…] y dicha iniciativa sea ratificada mediante referéndum por el voto afirmativo de la mayoría absoluta de los electores de cada provincia en los términos que establezca una ley orgánica.»","dificultad":3},{"id":"CE-L6-073","ley":"CE","articulo":"162.1.a","articulo_txt":"Art. 162.1.a CE","bloque_id":"CE|Título IX. Del Tribunal Constitucional","enunciado":"Según el artículo 162.1.a) de la Constitución, ¿quiénes están legitimados para interponer el recurso de inconstitucionalidad?","opciones":{"a":"El Presidente del Gobierno, el Defensor del Pueblo, 50 Diputados, 50 Senadores, los órganos colegiados ejecutivos de las Comunidades Autónomas y, en su caso, las Asambleas de las mismas.","b":"El Presidente del Gobierno, el Defensor del Pueblo, el Ministerio Fiscal, 50 Diputados, 50 Senadores y los órganos colegiados ejecutivos de las Comunidades Autónomas.","c":"El Gobierno, el Defensor del Pueblo, 50 Diputados, 25 Senadores, los Presidentes de las Comunidades Autónomas y, en su caso, las Asambleas de las mismas.","d":"El Presidente del Gobierno, el Defensor del Pueblo, 50 Diputados, 50 Senadores y el Consejo General del Poder Judicial."},"correcta":"a","explicacion":"Art. 162.1.a) CE: están legitimados «el Presidente del Gobierno, el Defensor del Pueblo, 50 Diputados, 50 Senadores, los órganos colegiados ejecutivos de las Comunidades Autónomas y, en su caso, las Asambleas de las mismas». La b) incluye al Ministerio Fiscal, que solo está legitimado para el recurso de amparo (art. 162.1.b); la c) altera el número de Senadores y los órganos legitimados, y la d) incluye al Consejo General del Poder Judicial, que el precepto no menciona, y omite a los órganos de las Comunidades Autónomas.","cita":"«1. Están legitimados: a) Para interponer el recurso de inconstitucionalidad, el Presidente del Gobierno, el Defensor del Pueblo, 50 Diputados, 50 Senadores, los órganos colegiados ejecutivos de las Comunidades Autónomas y, en su caso, las Asambleas de las mismas. b) Para interponer el recurso de amparo, toda persona natural o jurídica que invoque un interés legítimo, así como el Defensor del Pueblo y el Ministerio Fiscal.»","dificultad":2},{"id":"CE-L6-090","ley":"CE","articulo":"168.1","articulo_txt":"Art. 168.1 CE","bloque_id":"CE|Título X. De la reforma constitucional","enunciado":"Según el artículo 168.1 de la Constitución, cuando se propusiere la revisión total de la Constitución:","opciones":{"a":"Se procederá a la aprobación del principio por mayoría de dos tercios de cada Cámara y a la disolución inmediata de las Cortes.","b":"Se procederá a la aprobación del principio por mayoría de tres quintos de cada Cámara y a la disolución inmediata de las Cortes.","c":"Se procederá a la aprobación del principio por mayoría de dos tercios de cada Cámara, sin necesidad de disolver las Cortes.","d":"Se procederá a la aprobación del principio por mayoría absoluta del Congreso y a la convocatoria de un referéndum consultivo."},"correcta":"a","explicacion":"Art. 168.1 CE: «se procederá a la aprobación del principio por mayoría de dos tercios de cada Cámara, y a la disolución inmediata de las Cortes». La b) aplica la mayoría del art. 167, la c) suprime la disolución y la d) introduce una mayoría y un referéndum consultivo que el precepto no prevé.","cita":"«Cuando se propusiere la revisión total de la Constitución o una parcial que afecte al Título preliminar, al Capítulo segundo, Sección primera del Título I, o al Título II, se procederá a la aprobación del principio por mayoría de dos tercios de cada Cámara, y a la disolución inmediata de las Cortes.»","dificultad":2},{"id":"CE-L6-099","ley":"CE","articulo":"DA 4ª","articulo_txt":"DA 4ª · CE","bloque_id":"CE|Disposiciones adicionales","enunciado":"Según la disposición adicional cuarta de la Constitución, en las Comunidades Autónomas donde tengan su sede más de una Audiencia Territorial, los Estatutos de Autonomía respectivos:","opciones":{"a":"Deberán suprimirlas y atribuir sus competencias al Tribunal Superior de Justicia.","b":"Podrán mantener las existentes, distribuyendo las competencias entre ellas.","c":"Podrán mantener únicamente la que tenga su sede en la capital de la Comunidad.","d":"Podrán mantenerlas, previa autorización del Consejo General del Poder Judicial."},"correcta":"b","explicacion":"DA 4.ª CE: los Estatutos «podrán mantener las existentes, distribuyendo las competencias entre ellas», siempre de conformidad con la ley orgánica del poder judicial y dentro de la unidad e independencia de éste. La a) impone una supresión que la disposición no establece, la c) limita el mantenimiento a una sola Audiencia y la d) añade una autorización que no se exige. Hoy no existen Audiencias Territoriales: la Ley Orgánica del Poder Judicial de 1985 las sustituyó por los Tribunales Superiores de Justicia.","cita":"«En las Comunidades Autónomas donde tengan su sede más de una Audiencia Territorial, los Estatutos de Autonomía respectivos podrán mantener las existentes, distribuyendo las competencias entre ellas, siempre de conformidad con lo previsto en la ley orgánica del poder judicial y dentro de la unidad e independencia de éste.»","dificultad":2},{"id":"CE-L6-100","ley":"CE","articulo":"DT 1ª","articulo_txt":"DT 1ª · CE","bloque_id":"CE|Disposiciones transitorias","enunciado":"Según la disposición transitoria primera de la Constitución, en los territorios dotados de un régimen provisional de autonomía, sus órganos colegiados superiores podrán sustituir la iniciativa que el artículo 143.2 atribuye a las Diputaciones Provinciales o a los órganos interinsulares correspondientes mediante acuerdo adoptado por:","opciones":{"a":"La mayoría de dos tercios de sus miembros.","b":"La mayoría absoluta de sus miembros.","c":"La mayoría de tres quintos de sus miembros.","d":"La mayoría simple de los miembros presentes."},"correcta":"b","explicacion":"DT 1.ª CE: la sustitución de la iniciativa requiere un acuerdo «adoptado por la mayoría absoluta de sus miembros». La a), la c) y la d) cambian la mayoría exigida. Esta disposición ya no tiene efecto práctico: los regímenes provisionales de autonomía desaparecieron al aprobarse los Estatutos de Autonomía, entre 1979 y 1983.","cita":"«En los territorios dotados de un régimen provisional de autonomía, sus órganos colegiados superiores, mediante acuerdo adoptado por la mayoría absoluta de sus miembros, podrán sustituir la iniciativa que en el apartado 2 del artículo 143 atribuye a las Diputaciones Provinciales o a los órganos interinsulares correspondientes.»","dificultad":2},{"id":"CE-L6-110","ley":"CE","articulo":"DD.1","articulo_txt":"DD.1 · CE","bloque_id":"CE|Disposición derogatoria","enunciado":"Según el apartado 1 de la disposición derogatoria de la Constitución, la Ley de Principios del Movimiento Nacional, el Fuero de los Españoles, el Fuero del Trabajo, la Ley Constitutiva de las Cortes y la Ley de Sucesión en la Jefatura del Estado quedan derogadas:","opciones":{"a":"Solo en lo que se opongan a lo establecido en la Constitución.","b":"En tanto en cuanto no estuvieran ya derogadas por la Ley 1/1977, de 4 de enero, para la Reforma Política.","c":"Con efectos desde la constitución de las primeras Cortes Generales elegidas conforme a la Constitución.","d":"Salvo en lo relativo a la sucesión en la Jefatura del Estado."},"correcta":"b","explicacion":"Disposición derogatoria.1 CE: queda derogada la Ley 1/1977, de 4 de enero, para la Reforma Política, así como, «en tanto en cuanto no estuvieran ya derogadas por la anteriormente mencionada Ley», las demás leyes que enumera. La a) confunde esta derogación expresa con la cláusula general del apartado 3, y la c) y la d) añaden un aplazamiento y una excepción que la disposición no contiene.","cita":"«1. Queda derogada la Ley 1/1977, de 4 de enero, para la Reforma Política, así como, en tanto en cuanto no estuvieran ya derogadas por la anteriormente mencionada Ley, la de Principios del Movimiento Nacional, de 17 de mayo de 1958; el Fuero de los Españoles, de 17 de julio de 1945; el del Trabajo, de 9 de marzo de 1938; la Ley Constitutiva de las Cortes, de 17 de julio de 1942; la Ley de Sucesión en la Jefatura del Estado, de 26 de julio de 1947, todas ellas modificadas por la Ley Orgánica del Estado, de 10 de enero de 1967, y en los mismos términos esta última y la de Referéndum Nacional de 22 de octubre de 1945.»","dificultad":3},{"id":"CE-L6-112","ley":"CE","articulo":"DF","articulo_txt":"DF · CE","bloque_id":"CE|Disposición final","enunciado":"Según la disposición final de la Constitución, la Constitución entrará en vigor:","opciones":{"a":"El mismo día de la publicación de su texto oficial en el Boletín Oficial del Estado.","b":"A los veinte días de su completa publicación en el Boletín Oficial del Estado.","c":"El día siguiente al de la publicación de su texto oficial en el Boletín Oficial del Estado.","d":"El mismo día de su sanción por el Rey ante las Cortes Generales."},"correcta":"a","explicacion":"Disposición final CE: «Esta Constitución entrará en vigor el mismo día de la publicación de su texto oficial en el boletín oficial del Estado», y se publicará también en las demás lenguas de España. La b) reproduce la regla general de entrada en vigor de las leyes del art. 2.1 del Código Civil, la c) la retrasa un día y la d) la vincula a la sanción y no a la publicación.","cita":"«Esta Constitución entrará en vigor el mismo día de la publicación de su texto oficial en el boletín oficial del Estado. Se publicará también en las demás lenguas de España.»","dificultad":1}]};</script>
<script>
/* Letra de Ley — motor de test. Sin dependencias; funciona sin conexión.
   Necesita window.LDL_CONFIG y window.LDL_BANCO (los inyecta sistema/letradeley.py). */
(function () {
  "use strict";
  var CFG = window.LDL_CONFIG, B = window.LDL_BANCO;
  var raiz = document.getElementById("ldl");
  var LETRAS = ["a", "b", "c", "d"];
  var POR_ID = {};
  B.preguntas.forEach(function (p) { POR_ID[p.id] = p; });
  var CLAVE = "ldl1:" + CFG.pack.id;
  var prog = cargar();
  var sesion = null;
  var vista = CFG.modo === "web" ? "portada" : "inicio";
  var reloj = null;

  /* ---------- utilidades ---------- */
  function esc(t) {
    return String(t == null ? "" : t).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function barajar(lista) {
    var a = lista.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function pct(a, b) { return b ? Math.round((a / b) * 100) : 0; }
  function plural(n, uno, varios) { return n + " " + (n === 1 ? uno : varios); }
  function num(n) { return String(n).replace(".", ","); }
  function cargar() {
    try { var s = localStorage.getItem(CLAVE); if (s) { var d = JSON.parse(s); if (d && d.p) return d; } } catch (e) {}
    return { p: {}, h: [] };
  }
  function guardar() { try { localStorage.setItem(CLAVE, JSON.stringify(prog)); } catch (e) {} }
  function registrar(id, acierto) {
    var r = prog.p[id] || { v: 0, a: 0, f: 0, c: 0 };
    r.v++;
    if (acierto) { r.a++; r.c = Math.min((r.c || 0) + 1, 5); } else { r.f++; r.c = 0; }
    r.u = acierto ? 1 : 0;
    r.t = Date.now();
    prog.p[id] = r;
    guardar();
  }
  function fallosPendientes() {
    return B.preguntas.filter(function (p) { var r = prog.p[p.id]; return r && r.u === 0; });
  }
  function resumen(lista) {
    var vistas = 0, aciertos = 0, intentos = 0;
    lista.forEach(function (p) {
      var r = prog.p[p.id];
      if (r) { vistas++; aciertos += r.a; intentos += r.v; }
    });
    return { total: lista.length, vistas: vistas, acierto: pct(aciertos, intentos) };
  }
  function delBloque(id) { return B.preguntas.filter(function (p) { return p.bloque_id === id; }); }

  /* ---------- tema claro / oscuro ---------- */
  function aplicarTema() {
    var t = null;
    try { t = localStorage.getItem("ldl:tema"); } catch (e) {}
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    else document.documentElement.removeAttribute("data-theme");
    return t || "auto";
  }
  function cambiarTema() {
    var orden = { auto: "light", light: "dark", dark: "auto" };
    var actual = aplicarTema();
    try { localStorage.setItem("ldl:tema", orden[actual]); } catch (e) {}
    aplicarTema();
    pintar();
  }

  /* ---------- sesiones ---------- */
  function empezar(tipo, preguntas, opciones) {
    opciones = opciones || {};
    if (!preguntas.length) return;
    pararReloj();
    sesion = {
      tipo: tipo, titulo: opciones.titulo || "Test", ids: preguntas.map(function (p) { return p.id; }),
      i: 0, resp: {}, corregida: {}, inicio: Date.now(), limite: opciones.minutos ? opciones.minutos * 60 : 0, fin: null,
      origen: vista === "test" || vista === "resultado" ? (sesion && sesion.origen) || "inicio" : vista
    };
    vista = "test";
    if (sesion.limite) reloj = setInterval(tic, 1000);
    pintar();
    window.scrollTo(0, 0);
  }
  function tic() {
    if (!sesion || sesion.fin) return pararReloj();
    var el = document.getElementById("ldl-crono");
    var resta = sesion.limite - Math.floor((Date.now() - sesion.inicio) / 1000);
    if (resta <= 0) { terminar(); return; }
    if (el) el.textContent = mmss(resta);
  }
  function pararReloj() { if (reloj) { clearInterval(reloj); reloj = null; } }
  function mmss(s) { var m = Math.floor(s / 60), r = s % 60; return m + ":" + (r < 10 ? "0" : "") + r; }

  function responder(letra) {
    var id = sesion.ids[sesion.i];
    if (sesion.tipo === "simulacro") {
      sesion.resp[id] = sesion.resp[id] === letra ? undefined : letra;
      pintar();
      return;
    }
    if (sesion.corregida[id]) return;
    sesion.resp[id] = letra;
    sesion.corregida[id] = true;
    registrar(id, letra === POR_ID[id].correcta);
    pintar();
  }
  function siguiente() {
    if (sesion.i < sesion.ids.length - 1) { sesion.i++; pintar(); window.scrollTo(0, 0); }
    else terminar();
  }
  function anterior() { if (sesion.i > 0) { sesion.i--; pintar(); } }
  function terminar() {
    pararReloj();
    if (sesion.tipo === "simulacro") {
      sesion.ids.forEach(function (id) {
        if (sesion.resp[id]) registrar(id, sesion.resp[id] === POR_ID[id].correcta);
      });
    }
    sesion.fin = Date.now();
    var r = calcular(sesion);
    prog.h.unshift({ t: sesion.fin, tipo: sesion.tipo, n: r.total, a: r.aciertos, e: r.errores, nota: r.nota });
    prog.h = prog.h.slice(0, 50);
    guardar();
    vista = "resultado";
    pintar();
    window.scrollTo(0, 0);
  }
  function calcular(s) {
    var a = 0, e = 0, nr = 0;
    s.ids.forEach(function (id) {
      var r = s.resp[id];
      if (!r) nr++; else if (r === POR_ID[id].correcta) a++; else e++;
    });
    var pen = (CFG.simulacro && CFG.simulacro.penalizacion) || 1 / 3;
    var neta = s.tipo === "simulacro" ? a - e * pen : a;
    var nota = Math.max(0, (neta / s.ids.length) * 10);
    return { total: s.ids.length, aciertos: a, errores: e, blancos: nr, neta: neta, nota: Math.round(nota * 100) / 100 };
  }

  /* ---------- vistas ---------- */
  function cabecera() {
    var tema = aplicarTema();
    var etiquetas = { auto: "Tema: auto", light: "Tema: claro", dark: "Tema: oscuro" };
    return '<header class="ldl-top"><a class="ldl-brand" href="' + esc(CFG.web || "#") + '">' +
      '<span class="ldl-logo" aria-hidden="true">§</span><span><b>Letra de Ley</b><small>' +
      esc(CFG.pack.nombre) + "</small></span></a>" +
      '<button class="ldl-tema" data-acc="tema" type="button">' + etiquetas[tema] + "</button></header>";
  }
  function navegacion() {
    if (CFG.modo === "web") return "";
    var items = [["inicio", "Inicio"], ["temas", "Por temas"], ["simulacro", "Simulacro"], ["fallos", "Fallos"], ["stats", "Estadísticas"]];
    return '<nav class="ldl-nav" aria-label="Secciones">' + items.map(function (it) {
      var actual = vista === it[0] || (vista === "test" && sesion && sesion.origen === it[0]);
      return '<button type="button" data-acc="ir" data-v="' + it[0] + '"' + (actual ? ' aria-current="page"' : "") + ">" + it[1] + "</button>";
    }).join("") + "</nav>";
  }
  function pie() {
    return '<p class="ldl-pie">Letra de Ley · ' + esc(CFG.pack.edicion) + " · Texto legal actualizado a " +
      esc(CFG.pack.actualizado) + "<br>Uso personal. Prohibida su redistribución.</p>";
  }

  function vInicio() {
    var r = resumen(B.preguntas), f = fallosPendientes().length;
    return '<section class="ldl-card"><h2>' + esc(CFG.pack.nombre) + "</h2>" +
      '<p class="ldl-muted">' + B.preguntas.length + " preguntas comentadas, con el artículo exacto de cada respuesta.</p>" +
      '<div class="ldl-kpis"><div class="ldl-kpi"><b>' + r.vistas + "/" + r.total + "</b><span>respondidas</span></div>" +
      '<div class="ldl-kpi"><b>' + r.acierto + ' %</b><span>de acierto</span></div>' +
      '<div class="ldl-kpi"><b>' + f + "</b><span>fallos por repasar</span></div></div>" +
      '<div class="ldl-acciones"><button class="ldl-btn" data-acc="rapido" type="button">Test rápido de 20</button>' +
      '<button class="ldl-btn sec" data-acc="ir" data-v="simulacro" type="button">Simulacro de examen</button>' +
      (f ? '<button class="ldl-btn sec" data-acc="repasar" type="button">Repasar ' + f + " fallos</button>" : "") +
      "</div></section>" +
      '<section class="ldl-card"><h3>Cómo sacarle partido</h3><ol class="ldl-muted">' +
      "<li>Practica <b>por temas</b>: cada respuesta te enseña el artículo y por qué fallan las demás opciones.</li>" +
      "<li>Cada pocos días, <b>repasa tus fallos</b>: es donde más se aprende.</li>" +
      "<li>Antes del examen, haz <b>simulacros</b> con tiempo y con la penalización real (cada error resta 1/3).</li></ol>" +
      '<p class="ldl-small ldl-muted">Tu progreso se guarda en este dispositivo y en este navegador.</p></section>' + historial();
  }
  function historial() {
    if (!prog.h.length) return "";
    return '<section class="ldl-card"><h3>Últimos tests</h3><ul class="ldl-revision">' + prog.h.slice(0, 5).map(function (h) {
      var d = new Date(h.t);
      return "<li><b>" + (h.tipo === "simulacro" ? "Simulacro" : "Práctica") + "</b> · " + d.toLocaleDateString("es-ES") +
        " · " + h.a + "/" + h.n + " aciertos" + (h.tipo === "simulacro" ? " · nota " + num(h.nota) : "") + "</li>";
    }).join("") + "</ul></section>";
  }
  function vTemas() {
    var html = '<section class="ldl-card"><h2>Practicar por temas</h2><p class="ldl-muted">Elige un bloque. Las preguntas salen en orden aleatorio y se corrigen al momento.</p><ul class="ldl-bloques">';
    B.bloques.forEach(function (b) {
      var lista = delBloque(b.id), r = resumen(lista);
      html += '<li><button type="button" data-acc="bloque" data-id="' + esc(b.id) + '"><span class="t">' + esc(b.nombre) +
        '</span><span class="n">' + r.vistas + "/" + r.total + (r.vistas ? " · " + r.acierto + " %" : "") + "</span>" +
        '<span class="ldl-barra"><i style="width:' + pct(r.vistas, r.total) + '%"></i></span></button></li>';
    });
    return html + "</ul></section>";
  }
  function vSimulacro() {
    var total = B.preguntas.length;
    var opcionesN = [10, 20, 30, 50, 100].filter(function (n) { return n < total; });
    opcionesN.push(total);
    var porDefecto = Math.min((CFG.simulacro && CFG.simulacro.preguntas) || 30, total);
    return '<section class="ldl-card"><h2>Simulacro de examen</h2>' +
      '<p class="ldl-muted">Como el día del examen: no ves las soluciones hasta el final y cada error resta un tercio de acierto.</p>' +
      '<div class="ldl-campo"><label for="ldl-n">Número de preguntas</label><select id="ldl-n">' +
      opcionesN.map(function (n) { return "<option" + (n === porDefecto ? " selected" : "") + ">" + n + "</option>"; }).join("") +
      '</select></div><div class="ldl-campo"><label for="ldl-t">Tiempo</label><select id="ldl-t">' +
      '<option value="1">1 minuto por pregunta</option><option value="0">Sin límite de tiempo</option></select></div>' +
      '<div class="ldl-campo"><label for="ldl-b">Temas</label><select id="ldl-b"><option value="">Todos</option>' +
      B.bloques.map(function (b) { return '<option value="' + esc(b.id) + '">' + esc(b.nombre) + "</option>"; }).join("") +
      '</select></div><div class="ldl-acciones"><button class="ldl-btn" data-acc="simular" type="button">Empezar simulacro</button></div></section>';
  }
  function vFallos() {
    var f = fallosPendientes();
    if (!f.length) {
      return '<section class="ldl-card"><h2>Repaso de fallos</h2><p class="ldl-muted">No tienes fallos pendientes. Cuando falles una pregunta aparecerá aquí hasta que la aciertes.</p></section>';
    }
    return '<section class="ldl-card"><h2>Repaso de fallos</h2><p class="ldl-muted">Tienes <b>' + f.length +
      "</b> preguntas falladas. Salen de aquí en cuanto las aciertas.</p>" +
      '<div class="ldl-acciones"><button class="ldl-btn" data-acc="repasar" type="button">Repasar ahora</button></div></section>';
  }
  function vStats() {
    var html = '<section class="ldl-card"><h2>Estadísticas</h2><ul class="ldl-bloques">';
    B.bloques.forEach(function (b) {
      var r = resumen(delBloque(b.id));
      html += '<li><button type="button" data-acc="bloque" data-id="' + esc(b.id) + '"><span class="t">' + esc(b.nombre) +
        '</span><span class="n">' + (r.vistas ? r.acierto + " % de acierto" : "sin empezar") + '</span><span class="ldl-barra"><i style="width:' +
        r.acierto + '%"></i></span></button></li>';
    });
    html += '</ul></section><section class="ldl-card"><h3>Empezar de cero</h3><p class="ldl-muted ldl-small">Borra tu progreso guardado en este dispositivo.</p>' +
      '<div class="ldl-acciones"><button class="ldl-btn sec" data-acc="borrar" type="button">Borrar mi progreso</button></div></section>';
    return html;
  }
  function vPortada() {
    var n = B.preguntas.length;
    return '<section class="ldl-card"><h2>' + esc(CFG.pack.nombre) + "</h2>" +
      '<p class="ldl-muted">' + n + " preguntas tipo examen, corregidas al momento, con el artículo exacto y la explicación de cada opción. Gratis y sin registrarte.</p>" +
      '<div class="ldl-acciones"><button class="ldl-btn" data-acc="empezarweb" type="button">Empezar el test</button></div></section>';
  }

  function vTest() {
    var id = sesion.ids[sesion.i], p = POR_ID[id], sim = sesion.tipo === "simulacro";
    var elegida = sesion.resp[id], corregida = !sim && sesion.corregida[id];
    var html = '<section class="ldl-card"><div class="ldl-meta"><span>' + esc(sesion.titulo) + " · " + (sesion.i + 1) + " de " + sesion.ids.length +
      "</span><span>" + (sesion.limite ? '⏱ <span id="ldl-crono" class="ldl-crono">' +
        mmss(Math.max(0, sesion.limite - Math.floor((Date.now() - sesion.inicio) / 1000))) + "</span>" : esc(p.articulo_txt)) +
      '</span></div><div class="ldl-progreso"><i style="width:' + pct(sesion.i + (corregida ? 1 : 0), sesion.ids.length) + '%"></i></div>' +
      '<p class="ldl-enunciado">' + esc(p.enunciado) + '</p><div class="ldl-opciones" role="group" aria-label="Opciones">';
    LETRAS.forEach(function (l) {
      var cls = "ldl-op";
      if (corregida) { if (l === p.correcta) cls += " ok"; else if (l === elegida) cls += " ko"; }
      else if (sim && elegida === l) cls += " marcada";
      html += '<button type="button" class="' + cls + '" data-acc="resp" data-l="' + l + '"' + (corregida ? " disabled" : "") +
        (sim ? ' aria-pressed="' + (elegida === l) + '"' : "") + '><span class="l">' + l + ")</span><span>" + esc(p.opciones[l]) + "</span></button>";
    });
    html += "</div>";
    if (corregida) html += feedback(p, elegida);
    html += '<div class="ldl-acciones">';
    if (sim) {
      html += (sesion.i > 0 ? '<button class="ldl-btn sec" data-acc="ant" type="button">Anterior</button>' : "") +
        '<button class="ldl-btn" data-acc="sig" type="button">' + (sesion.i < sesion.ids.length - 1 ? "Siguiente" : "Entregar") + "</button>" +
        (sesion.i < sesion.ids.length - 1 ? '<button class="ldl-btn sec" data-acc="entregar" type="button">Entregar ya</button>' : "");
    } else if (corregida) {
      html += '<button class="ldl-btn" data-acc="sig" type="button">' + (sesion.i < sesion.ids.length - 1 ? "Siguiente" : "Ver resultado") + "</button>";
    }
    html += '<button class="ldl-btn sec" data-acc="salir" type="button">Salir</button></div></section>';
    return html;
  }
  function feedback(p, elegida) {
    var bien = elegida === p.correcta;
    return '<div class="ldl-feedback" aria-live="polite"><div class="v ' + (bien ? "ok" : "ko") + '">' +
      (bien ? "¡Correcta!" : "Incorrecta. La respuesta correcta es la " + p.correcta + ")") + "</div><div>" + esc(p.explicacion) + "</div>" +
      (p.cita ? '<blockquote class="ldl-cita">' + esc(p.cita) + "<small>" + esc(p.articulo_txt) + "</small></blockquote>" : "") + "</div>";
  }
  function vResultado() {
    var r = calcular(sesion), sim = sesion.tipo === "simulacro";
    var html = '<section class="ldl-card"><h2>' + (sim ? "Resultado del simulacro" : "Resultado") + "</h2>" +
      '<div class="ldl-nota">' + (sim ? num(r.nota.toFixed(2)) : r.aciertos + "/" + r.total) + "</div>" +
      '<p class="ldl-muted">' + plural(r.aciertos, "acierto", "aciertos") + " · " + plural(r.errores, "error", "errores") +
      (r.blancos ? " · " + r.blancos + " en blanco" : "") +
      (sim ? " · nota sobre 10 con penalización" : "") + "</p>";
    if (CFG.modo === "web") html += ctaWeb(r);
    html += '<div class="ldl-acciones">' + (CFG.modo === "web" ? '<button class="ldl-btn sec" data-acc="empezarweb" type="button">Repetir con otro orden</button>' :
      '<button class="ldl-btn" data-acc="ir" data-v="inicio" type="button">Volver al inicio</button>') + "</div></section>";
    html += '<section class="ldl-card"><h3>Revisión</h3><ul class="ldl-revision">';
    sesion.ids.forEach(function (id, n) {
      var p = POR_ID[id], e = sesion.resp[id], chip = !e ? '<span class="ldl-chip nr">En blanco</span>' :
        e === p.correcta ? '<span class="ldl-chip ok">Bien</span>' : '<span class="ldl-chip ko">Mal</span>';
      html += "<li>" + chip + '<span class="e">' + (n + 1) + ". " + esc(p.enunciado) + "</span><br>" +
        '<span class="ldl-small">Correcta: <b>' + p.correcta + ") " + esc(p.opciones[p.correcta]) + "</b>" +
        (e && e !== p.correcta ? " · Marcaste " + e + ")" : "") + '</span><br><span class="ldl-small ldl-muted">' + esc(p.explicacion) + "</span></li>";
    });
    return html + "</ul></section>";
  }
  function ctaWeb() {
    var c = CFG.compra || {}, html = "";
    if (c.url) {
      html += '<div class="ldl-card ldl-cta"><h3>' + esc(c.titulo) + '</h3><p class="ldl-muted">' + esc(c.texto) + "</p>" +
        '<div class="ldl-acciones"><a class="ldl-btn acc" href="' + esc(c.url) + '">' + esc(c.boton) + "</a></div></div>";
    }
    if (CFG.telegram) {
      html += '<p class="ldl-small">¿Quieres un test cada día? <a href="' + esc(CFG.telegram) + '">Únete gratis al canal de Telegram</a>.</p>';
    }
    return html;
  }

  function pintar() {
    var cuerpo;
    if (vista === "test") cuerpo = vTest();
    else if (vista === "resultado") cuerpo = vResultado();
    else if (vista === "portada") cuerpo = vPortada();
    else if (vista === "temas") cuerpo = vTemas();
    else if (vista === "simulacro") cuerpo = vSimulacro();
    else if (vista === "fallos") cuerpo = vFallos();
    else if (vista === "stats") cuerpo = vStats();
    else cuerpo = vInicio();
    raiz.innerHTML = '<div class="ldl">' + cabecera() + navegacion() + "<main>" + cuerpo + "</main>" + pie() + "</div>";
  }

  /* ---------- eventos ---------- */
  raiz.addEventListener("click", function (ev) {
    var el = ev.target.closest("[data-acc]");
    if (!el) return;
    var acc = el.getAttribute("data-acc");
    if (acc === "tema") return cambiarTema();
    if (acc === "ir") { pararReloj(); vista = el.getAttribute("data-v"); sesion = null; pintar(); return; }
    if (acc === "rapido") return empezar("practica", barajar(B.preguntas).slice(0, 20), { titulo: "Test rápido" });
    if (acc === "repasar") return empezar("practica", barajar(fallosPendientes()).slice(0, 30), { titulo: "Repaso de fallos" });
    if (acc === "bloque") {
      var b = B.bloques.filter(function (x) { return x.id === el.getAttribute("data-id"); })[0];
      return empezar("practica", barajar(delBloque(b.id)), { titulo: b.nombre });
    }
    if (acc === "simular") {
      var n = parseInt(document.getElementById("ldl-n").value, 10);
      var conTiempo = document.getElementById("ldl-t").value === "1";
      var bloque = document.getElementById("ldl-b").value;
      var fuente = bloque ? delBloque(bloque) : B.preguntas;
      var elegidas = barajar(fuente).slice(0, n);
      return empezar("simulacro", elegidas, { titulo: "Simulacro", minutos: conTiempo ? elegidas.length : 0 });
    }
    if (acc === "empezarweb") return empezar("practica", barajar(B.preguntas), { titulo: "Test gratuito" });
    if (acc === "resp") return responder(el.getAttribute("data-l"));
    if (acc === "sig") return siguiente();
    if (acc === "ant") return anterior();
    if (acc === "entregar") return terminar();
    if (acc === "salir") { pararReloj(); sesion = null; vista = CFG.modo === "web" ? "portada" : "inicio"; pintar(); return; }
    if (acc === "borrar") {
      if (el.getAttribute("data-confirmar") === "1") { prog = { p: {}, h: [] }; guardar(); pintar(); }
      else { el.setAttribute("data-confirmar", "1"); el.textContent = "Pulsa otra vez para confirmar"; }
    }
  });
  document.addEventListener("keydown", function (ev) {
    if (vista !== "test" || !sesion || ev.altKey || ev.ctrlKey || ev.metaKey) return;
    var k = ev.key.toLowerCase(), mapa = { "1": "a", "2": "b", "3": "c", "4": "d", a: "a", b: "b", c: "c", d: "d" };
    if (mapa[k]) { ev.preventDefault(); responder(mapa[k]); }
    else if (k === "enter" || k === "arrowright") {
      var id = sesion.ids[sesion.i];
      if (sesion.tipo === "simulacro" || sesion.corregida[id]) { ev.preventDefault(); siguiente(); }
    } else if (k === "arrowleft" && sesion.tipo === "simulacro") { ev.preventDefault(); anterior(); }
  });

  pintar();
})();
</script>
</body>
</html>
