oria"},{"id":"CE|Disposición final","ley":"CE","nombre":"Disposición final"}],"preguntas":[{"id":"CE-L1-002","ley":"CE","articulo":"Preámbulo","articulo_txt":"Preámbulo · CE","bloque_id":"CE|Preámbulo","enunciado":"Según el Preámbulo de la Constitución, ¿quién aprueba la Constitución y quién la ratifica?","opciones":{"a":"El pueblo español la aprueba y las Cortes la ratifican","b":"Las Cortes la aprueban y el Rey la ratifica","c":"La Nación española la aprueba y las Cortes la ratifican","d":"Las Cortes la aprueban y el pueblo español la ratifica"},"correcta":"d","explicacion":"El último párrafo del Preámbulo dice que «las Cortes aprueban y el pueblo español ratifica» la Constitución. La a) invierte los papeles que el Preámbulo atribuye a las Cortes y al pueblo español. La b) el Preámbulo no menciona al Rey: quien ratifica es el pueblo español. La c) la Nación española es el sujeto que proclama su voluntad al comienzo del Preámbulo, no quien aprueba la Constitución.","cita":"«En consecuencia, las Cortes aprueban y el pueblo español ratifica la siguiente CONSTITUCIÓN»","dificultad":1},{"id":"CE-L1-003","ley":"CE","articulo":"Preámbulo","articulo_txt":"Preámbulo · CE","bloque_id":"CE|Preámbulo","enunciado":"Según el Preámbulo de la Constitución, uno de los fines que se proclaman es consolidar un Estado de Derecho que asegure:","opciones":{"a":"el imperio de la ley como expresión de la voluntad popular","b":"la soberanía nacional como expresión de la voluntad popular","c":"la convivencia democrática dentro de la Constitución y de las leyes","d":"la primacía de la Constitución como norma suprema del ordenamiento"},"correcta":"a","explicacion":"El Preámbulo proclama la voluntad de «Consolidar un Estado de Derecho que asegure el imperio de la ley como expresión de la voluntad popular». La b) sustituye «el imperio de la ley» por la soberanía nacional, que el art. 1.2 sitúa en el pueblo español. La c) la convivencia democrática es otro fin distinto del Preámbulo, que la Nación quiere «garantizar». La d) esa expresión no figura en el Preámbulo.","cita":"«Consolidar un Estado de Derecho que asegure el imperio de la ley como expresión de la voluntad popular.»","dificultad":2},{"id":"CE-L1-036","ley":"CE","articulo":"7","articulo_txt":"Art. 7 CE","bloque_id":"CE|Título Preliminar","enunciado":"Según el artículo 7 de la Constitución, la creación de sindicatos de trabajadores y de asociaciones empresariales y el ejercicio de su actividad:","opciones":{"a":"son libres dentro del respeto a la Constitución y a la ley","b":"requieren autorización previa de la autoridad laboral","c":"son libres dentro del respeto a la Constitución, a la ley y a los convenios colectivos","d":"son libres dentro del respeto a la Constitución y a los acuerdos del Gobierno"},"correcta":"a","explicacion":"El art. 7 dispone que «Su creación y el ejercicio de su actividad son libres dentro del respeto a la Constitución y a la ley». La b) el art. 7 declara libres su creación y su actividad. La c) el art. 7 no menciona los convenios colectivos. La d) el art. 7 menciona la Constitución y la ley, no los acuerdos del Gobierno.","cita":"«Los sindicatos de trabajadores y las asociaciones empresariales contribuyen a la defensa y promoción de los intereses económicos y sociales que les son propios. Su creación y el ejercicio de su actividad son libres dentro del respeto a la Constitución y a la ley. Su estructura interna y funcionamiento deberán ser democráticos.»","dificultad":2},{"id":"CE-L1-037","ley":"CE","articulo":"8.1","articulo_txt":"Art. 8.1 CE","bloque_id":"CE|Título Preliminar","enunciado":"Según el artículo 8.1 de la Constitución, las Fuerzas Armadas están constituidas por:","opciones":{"a":"el Ejército de Tierra, la Armada, el Ejército del Aire y la Guardia Civil","b":"el Ejército de Tierra y la Armada","c":"el Ejército de Tierra, la Armada y el Ejército del Aire","d":"el Ejército de Tierra, el Ejército del Aire y la Guardia Civil"},"correcta":"c","explicacion":"El art. 8.1 enumera literalmente «el Ejército de Tierra, la Armada y el Ejército del Aire». La a) el art. 8.1 no incluye a la Guardia Civil en su enumeración. La b) omite el Ejército del Aire. La d) omite la Armada e incluye a la Guardia Civil, que el art. 8.1 no menciona.","cita":"«Las Fuerzas Armadas, constituidas por el Ejército de Tierra, la Armada y el Ejército del Aire, tienen como misión garantizar la soberanía e independencia de España, defender su integridad territorial y el ordenamiento constitucional.»","dificultad":1},{"id":"CE-L1-055","ley":"CE","articulo":"10","articulo_txt":"Art. 10 CE","bloque_id":"CE|Título I. De los derechos y deberes fundamentales","enunciado":"¿Dónde se ubica el artículo 10 dentro de la Constitución?","opciones":{"a":"En el Título Preliminar","b":"En el Título I, antes del Capítulo primero","c":"En el Capítulo primero del Título I, «De los españoles y los extranjeros»","d":"En la Sección 1.ª del Capítulo segundo del Título I"},"correcta":"b","explicacion":"El art. 10 abre el Título I, «De los derechos y deberes fundamentales», y no está incluido en ninguno de sus capítulos. La a) el Título Preliminar termina en el art. 9. La c) ese capítulo comprende los arts. 11 a 13. La d) esa sección comienza en el art. 15.","cita":"«La dignidad de la persona, los derechos inviolables que le son inherentes, el libre desarrollo de la personalidad, el respeto a la ley y a los derechos de los demás son fundamento del orden político y de la paz social.»","dificultad":3},{"id":"CE-L1-050","ley":"CE","articulo":"10.1","articulo_txt":"Art. 10.1 CE","bloque_id":"CE|Título I. De los derechos y deberes fundamentales","enunciado":"Según el artículo 10.1 de la Constitución, la dignidad de la persona y los demás elementos que enumera ese apartado son:","opciones":{"a":"fundamento del orden político y de la paz social","b":"valores superiores del ordenamiento jurídico","c":"principios rectores de la política social y económica","d":"garantía del Estado social y democrático de Derecho"},"correcta":"a","explicacion":"El art. 10.1 declara que la dignidad de la persona, los derechos inviolables que le son inherentes, el libre desarrollo de la personalidad y el respeto a la ley y a los derechos de los demás «son fundamento del orden político y de la paz social». La b) así califica el art. 1.1 a la libertad, la justicia, la igualdad y el pluralismo político. La c) esa es la rúbrica del Capítulo tercero del Título I. La d) el art. 10.1 no emplea esa expresión.","cita":"«La dignidad de la persona, los derechos inviolables que le son inherentes, el libre desarrollo de la personalidad, el respeto a la ley y a los derechos de los demás son fundamento del orden político y de la paz social.»","dificultad":1},{"id":"CE-L1-061","ley":"CE","articulo":"12","articulo_txt":"Art. 12 CE","bloque_id":"CE|Título I. Capítulo primero. De los españoles y los extranjeros","enunciado":"Según el artículo 12 de la Constitución, los españoles son mayores de edad:","opciones":{"a":"a los dieciocho años","b":"a los dieciséis años","c":"a los veintiún años","d":"a la edad que establezca la ley"},"correcta":"a","explicacion":"El art. 12 dispone: «Los españoles son mayores de edad a los dieciocho años». La b) el art. 12 fija los dieciocho años, no los dieciséis. La c) el art. 12 fija los dieciocho años, no los veintiuno. La d) la Constitución fija directamente la edad, sin remitirse a la ley.","cita":"«Los españoles son mayores de edad a los dieciocho años.»","dificultad":1},{"id":"CE-L1-069","ley":"CE","articulo":"13.4","articulo_txt":"Art. 13.4 CE","bloque_id":"CE|Título I. Capítulo primero. De los españoles y los extranjeros","enunciado":"Según el artículo 13.4 de la Constitución, ¿qué norma establecerá los términos en que los ciudadanos de otros países y los apátridas podrán gozar del derecho de asilo en España?","opciones":{"a":"Una ley orgánica","b":"Los tratados internacionales ratificados por España","c":"La ley","d":"Un real decreto del Gobierno"},"correcta":"c","explicacion":"El art. 13.4 dispone: «La ley establecerá los términos en que los ciudadanos de otros países y los apátridas podrán gozar del derecho de asilo en España». La a) el art. 13.4 se remite a «la ley», sin exigir ley orgánica. La b) el art. 13.4 remite a la ley, no a los tratados. La d) el art. 13.4 remite a la ley, no a un real decreto.","cita":"«La ley establecerá los términos en que los ciudadanos de otros países y los apátridas podrán gozar del derecho de asilo en España.»","dificultad":2},{"id":"CE-L1-071","ley":"CE","articulo":"14","articulo_txt":"Art. 14 CE","bloque_id":"CE|Título I. Capítulo segundo. Derechos y libertades","enunciado":"¿Cuál de las siguientes circunstancias NO se menciona expresamente en el artículo 14 de la Constitución entre las razones por las que no puede prevalecer discriminación alguna?","opciones":{"a":"El nacimiento","b":"La edad","c":"La religión","d":"La opinión"},"correcta":"b","explicacion":"El art. 14 nombra expresamente el «nacimiento, raza, sexo, religión, opinión» y cierra con «cualquier otra condición o circunstancia personal o social»; la edad no aparece nombrada. La a), la c) y la d) sí se mencionan expresamente en el art. 14.","cita":"«Los españoles son iguales ante la ley, sin que pueda prevalecer discriminación alguna por razón de nacimiento, raza, sexo, religión, opinión o cualquier otra condición o circunstancia personal o social.»","dificultad":1},{"id":"CE-L1-070","ley":"CE","articulo":"14","articulo_txt":"Art. 14 CE","bloque_id":"CE|Título I. Capítulo segundo. Derechos y libertades","enunciado":"Según el artículo 14 de la Constitución, ¿quiénes son iguales ante la ley?","opciones":{"a":"Todas las personas","b":"Los españoles","c":"Los españoles y los extranjeros con residencia legal en España","d":"Los ciudadanos de la Unión Europea"},"correcta":"b","explicacion":"El art. 14 comienza: «Los españoles son iguales ante la ley». La a) el art. 14 se refiere literalmente a «Los españoles». La c) el art. 14 no menciona a los extranjeros. La d) el art. 14 no menciona a los ciudadanos de la Unión Europea.","cita":"«Los españoles son iguales ante la ley, sin que pueda prevalecer discriminación alguna por razón de nacimiento, raza, sexo, religión, opinión o cualquier otra condición o circunstancia personal o social.»","dificultad":1},{"id":"CE-L2-035","ley":"CE","articulo":"23.2","articulo_txt":"Art. 23.2 CE","bloque_id":"CE|Título I, Capítulo II, Sección 1.ª: De los derechos fundamentales y de las libertades públicas","enunciado":"Según el artículo 23.2 de la Constitución, el derecho a acceder a las funciones y cargos públicos se ejerce:","opciones":{"a":"de acuerdo con los principios de mérito y capacidad, sin otros requisitos.","b":"en condiciones de igualdad, siempre que se sea mayor de edad y se resida en España.","c":"libremente, sin más requisitos que los que fije cada Administración.","d":"en condiciones de igualdad, con los requisitos que señalen las leyes."},"correcta":"d","explicacion":"Art. 23.2 CE: se trata del derecho «a acceder en condiciones de igualdad a las funciones y cargos públicos, con los requisitos que señalen las leyes». La a) toma los principios de mérito y capacidad del art. 103.3 CE y excluye otros requisitos; la b) añade requisitos que el precepto no fija, y la c) suprime la igualdad y sustituye la remisión a las leyes por la decisión de cada Administración.","cita":"«Asimismo, tienen derecho a acceder en condiciones de igualdad a las funciones y cargos públicos, con los requisitos que señalen las leyes.»","dificultad":1},{"id":"CE-L2-050","ley":"CE","articulo":"27.7","articulo_txt":"Art. 27.7 CE","bloque_id":"CE|Título I, Capítulo II, Sección 1.ª: De los derechos fundamentales y de las libertades públicas","enunciado":"Según el artículo 27.7 de la Constitución, ¿quiénes intervendrán en el control y gestión de todos los centros sostenidos por la Administración con fondos públicos?","opciones":{"a":"Los profesores, los padres y, en su caso, los alumnos.","b":"Los profesores y los padres, exclusivamente.","c":"Los profesores, los padres, los alumnos y el personal de administración y servicios.","d":"La Administración educativa, los profesores y, en su caso, los padres."},"correcta":"a","explicacion":"Art. 27.7 CE: «Los profesores, los padres y, en su caso, los alumnos intervendrán en el control y gestión de todos los centros sostenidos por la Administración con fondos públicos, en los términos que la ley establezca». La b) excluye a los alumnos; la c) añade al personal de administración y servicios, y la d) altera los sujetos y relega a los padres a una intervención eventual. La LOE sí da participación al personal de administración y servicios en el consejo escolar de los centros públicos, pero el art. 27.7 CE no lo menciona.","cita":"«Los profesores, los padres y, en su caso, los alumnos intervendrán en el control y gestión de todos los centros sostenidos por la Administración con fondos públicos, en los términos que la ley establezca.»","dificultad":2},{"id":"CE-L2-064","ley":"CE","articulo":"30.4","articulo_txt":"Art. 30.4 CE","bloque_id":"CE|Título I, Capítulo II, Sección 2.ª: De los derechos y deberes de los ciudadanos","enunciado":"De acuerdo con el artículo 30.4 de la Constitución, mediante ley podrán regularse los deberes de los ciudadanos en los casos de:","opciones":{"a":"guerra, estado de sitio o estado de excepción.","b":"grave riesgo, catástrofe o calamidad pública.","c":"grave riesgo, catástrofe o calamidad pública, solo cuando se haya declarado el estado de alarma.","d":"grave alteración del orden público o amenaza para la seguridad nacional."},"correcta":"b","explicacion":"Art. 30.4 CE: «Mediante ley podrán regularse los deberes de los ciudadanos en los casos de grave riesgo, catástrofe o calamidad pública». La a) y la d) citan supuestos que el precepto no menciona, y la c) añade una condición, la declaración del estado de alarma, que el texto no exige.","cita":"«Mediante ley podrán regularse los deberes de los ciudadanos en los casos de grave riesgo, catástrofe o calamidad pública.»","dificultad":2},{"id":"CE-L2-078","ley":"CE","articulo":"36","articulo_txt":"Art. 36 CE","bloque_id":"CE|Título I, Capítulo II, Sección 2.ª: De los derechos y deberes de los ciudadanos","enunciado":"Según el artículo 36 de la Constitución, la estructura interna y el funcionamiento de los Colegios Profesionales deberán ser:","opciones":{"a":"transparentes y participativos.","b":"democráticos.","c":"los que determinen sus propios estatutos, sin sujeción a la ley.","d":"los que apruebe el Gobierno mediante real decreto."},"correcta":"b","explicacion":"Art. 36 CE: «La estructura interna y el funcionamiento de los Colegios deberán ser democráticos». La a) emplea calificativos que el precepto no utiliza; la c) ignora la remisión a la ley del primer inciso, y la d) introduce una aprobación gubernativa que el texto no prevé. La Ley de Colegios Profesionales sí somete a las organizaciones colegiales al principio de transparencia en su gestión y prevé que el Gobierno apruebe los Estatutos generales de cada profesión, pero el art. 36 CE solo exige que su estructura interna y su funcionamiento sean democráticos.","cita":"«La ley regulará las peculiaridades propias del régimen jurídico de los Colegios Profesionales y el ejercicio de las profesiones tituladas. La estructura interna y el funcionamiento de los Colegios deberán ser democráticos.»","dificultad":1},{"id":"CE-L3-011","ley":"CE","articulo":"45.3","articulo_txt":"Art. 45.3 CE","bloque_id":"CE|Título I. De los derechos y deberes fundamentales. Capítulo III. De los principios rectores de la política social y económica","enunciado":"Según el artículo 45.3 de la Constitución, para quienes violen lo dispuesto en su apartado 2 sobre la utilización racional de los recursos naturales, se establecerán, en los términos que la ley fije:","opciones":{"a":"Sanciones administrativas exclusivamente, así como la obligación de reparar el daño causado.","b":"Sanciones penales o, en su caso, administrativas, así como la obligación de reparar el daño causado.","c":"Sanciones penales o, en su caso, administrativas, sin perjuicio de la responsabilidad patrimonial del Estado.","d":"Sanciones penales en todo caso, sin obligación de reparar el daño."},"correcta":"b","explicacion":"Art. 45.3 CE: se establecerán sanciones penales o, en su caso, administrativas, así como la obligación de reparar el daño causado. La a) excluye las sanciones penales; la c) sustituye la reparación del daño por una responsabilidad patrimonial del Estado que el precepto no menciona; y la d) impone siempre sanción penal y suprime la obligación de reparar.","cita":"«Para quienes violen lo dispuesto en el apartado anterior, en los términos que la ley fije se establecerán sanciones penales o, en su caso, administrativas, así como la obligación de reparar el daño causado.»","dificultad":2},{"id":"CE-L3-020","ley":"CE","articulo":"51.1","articulo_txt":"Art. 51.1 CE","bloque_id":"CE|Título I. De los derechos y deberes fundamentales. Capítulo III. De los principios rectores de la política social y económica","enunciado":"Según el artículo 51.1 de la Constitución, los poderes públicos garantizarán la defensa de los consumidores y usuarios protegiendo, mediante procedimientos eficaces:","opciones":{"a":"La seguridad, la salud y los legítimos intereses económicos de los mismos.","b":"La salud, la información y los legítimos intereses económicos de los mismos.","c":"La seguridad, la salud y los derechos lingüísticos de los mismos.","d":"La seguridad, la calidad de los productos y los intereses generales de los mismos."},"correcta":"a","explicacion":"Art. 51.1 CE: se protegen la seguridad, la salud y los legítimos intereses económicos de consumidores y usuarios. La b) incluye la información, que el art. 51.2 contempla como objeto de promoción; la c) y la d) introducen elementos (derechos lingüísticos, calidad de los productos, intereses generales) que no figuran en el precepto.","cita":"«Los poderes públicos garantizarán la defensa de los consumidores y usuarios, protegiendo, mediante procedimientos eficaces, la seguridad, la salud y los legítimos intereses económicos de los mismos.»","dificultad":2},{"id":"CE-L3-025","ley":"CE","articulo":"53.2","articulo_txt":"Art. 53.2 CE","bloque_id":"CE|Título I. De los derechos y deberes fundamentales. Capítulo IV. De las garantías de las libertades y derechos fundamentales","enunciado":"Según el artículo 53.2 de la Constitución, cualquier ciudadano podrá recabar la tutela de las libertades y derechos reconocidos en el artículo 14 y la Sección primera del Capítulo segundo ante los Tribunales ordinarios por un procedimiento basado en los principios de:","opciones":{"a":"Celeridad y eficacia.","b":"Preferencia y sumariedad.","c":"Oralidad e inmediación.","d":"Publicidad y gratuidad."},"correcta":"b","explicacion":"Art. 53.2 CE: el procedimiento ante los Tribunales ordinarios se basa en los principios de preferencia y sumariedad. Las parejas de principios de las opciones a), c) y d) no figuran en el art. 53.2.","cita":"«Cualquier ciudadano podrá recabar la tutela de las libertades y derechos reconocidos en el artículo 14 y la Sección primera del Capítulo segundo ante los Tribunales ordinarios por un procedimiento basado en los principios de preferencia y sumariedad y, en su caso, a través del recurso de amparo ante el Tribunal Constitucional. Este último recurso será aplicable a la objeción de conciencia reconocida en el artículo 30.»","dificultad":1},{"id":"CE-L3-032","ley":"CE","articulo":"54","articulo_txt":"Art. 54 CE","bloque_id":"CE|Título I. De los derechos y deberes fundamentales. Capítulo IV. De las garantías de las libertades y derechos fundamentales","enunciado":"Según el artículo 54 de la Constitución, el Defensor del Pueblo podrá supervisar la actividad de la Administración, dando cuenta:","opciones":{"a":"Al Gobierno.","b":"Al Tribunal Constitucional.","c":"Al Congreso de los Diputados.","d":"A las Cortes Generales."},"correcta":"d","explicacion":"Art. 54 CE: el Defensor del Pueblo supervisa la actividad de la Administración «dando cuenta a las Cortes Generales», de las que es alto comisionado. No da cuenta al Gobierno (a) ni al Tribunal Constitucional (b), y el precepto se refiere a las Cortes Generales, no solo al Congreso de los Diputados (c).","cita":"«Una ley orgánica regulará la institución del Defensor del Pueblo, como alto comisionado de las Cortes Generales, designado por éstas para la defensa de los derechos comprendidos en este Título, a cuyo efecto podrá supervisar la actividad de la Administración, dando cuenta a las Cortes Generales.»","dificultad":1},{"id":"CE-L3-033","ley":"CE","articulo":"55.1","articulo_txt":"Art. 55.1 CE","bloque_id":"CE|Título I. De los derechos y deberes fundamentales. Capítulo V. De la suspensión de los derechos y libertades","enunciado":"Según el artículo 55.1 de la Constitución, ¿cuál de los siguientes derechos NO figura entre los que pueden ser suspendidos cuando se acuerde la declaración del estado de excepción o de sitio?","opciones":{"a":"El derecho de reunión (art. 21).","b":"El derecho a la huelga de los trabajadores (art. 28.2).","c":"El derecho de asociación (art. 22).","d":"El derecho a elegir libremente la residencia y a circular por el territorio nacional (art. 19)."},"correcta":"c","explicacion":"Art. 55.1 CE: pueden suspenderse los derechos de los arts. 17 (el apartado 3, solo en el estado de sitio), 18.2 y 18.3, 19, 20.1.a) y d) y 20.5, 21, 28.2 y 37.2. El derecho de asociación del art. 22 no figura en esa lista, mientras que sí figuran el derecho de reunión (a), el derecho a la huelga (b) y las libertades de residencia y circulación (d).","cita":"«Los derechos reconocidos en los artículos 17, 18, apartados 2 y 3, artículos 19, 20, apartados 1, a) y d), y 5, artículos 21, 28, apartado 2, y artículo 37, apartado 2, podrán ser suspendidos cuando se acuerde la declaración del estado de excepción o de sitio en los términos previstos en la Constitución. Se exceptúa de lo establecido anteriormente el apartado 3 del artículo 17 para el supuesto de declaración de estado de excepción.»","dificultad":2},{"id":"CE-L3-038","ley":"CE","articulo":"55.2","articulo_txt":"Art. 55.2 CE","bloque_id":"CE|Título I. De los derechos y deberes fundamentales. Capítulo V. De la suspensión de los derechos y libertades","enunciado":"Según el artículo 55.2 de la Constitución, la suspensión individual de determinados derechos para personas determinadas puede acordarse en relación con las investigaciones correspondientes a:","opciones":{"a":"La actuación de bandas armadas o elementos terroristas.","b":"Los delitos de tráfico de drogas y de blanqueo de capitales.","c":"La actuación de organizaciones criminales de cualquier tipo.","d":"Los delitos contra la seguridad del Estado cometidos por funcionarios públicos."},"correcta":"a","explicacion":"Art. 55.2 CE: la suspensión individual se vincula a «las investigaciones correspondientes a la actuación de bandas armadas o elementos terroristas» y exige la necesaria intervención judicial y el adecuado control parlamentario. El precepto no se refiere al narcotráfico ni al blanqueo (b), a las organizaciones criminales en general (c) ni a los delitos contra la seguridad del Estado (d).","cita":"«Una ley orgánica podrá determinar la forma y los casos en los que, de forma individual y con la necesaria intervención judicial y el adecuado control parlamentario, los derechos reconocidos en los artículos 17, apartado 2, y 18, apartados 2 y 3, pueden ser suspendidos para personas determinadas, en relación con las investigaciones correspondientes a la actuación de bandas armadas o elementos terroristas.»","dificultad":1},{"id":"CE-L3-067","ley":"CE","articulo":"62.e","articulo_txt":"Art. 62.e CE","bloque_id":"CE|Título II. De la Corona","enunciado":"Según el artículo 62.e) de la Constitución, el Rey nombra y separa a los miembros del Gobierno:","opciones":{"a":"A propuesta del Congreso de los Diputados.","b":"A propuesta de su Presidente.","c":"Previa consulta con los representantes designados por los grupos políticos con representación parlamentaria.","d":"Libremente, sin necesidad de propuesta."},"correcta":"b","explicacion":"Art. 62.e) CE: el Rey nombra y separa a los miembros del Gobierno «a propuesta de su Presidente» (en el mismo sentido, art. 100). El Congreso no propone a los Ministros (a); la consulta con los grupos políticos (c) es el trámite previo a la propuesta de candidato a la Presidencia del Gobierno (art. 99.1); y la libre designación es propia de los miembros de la Casa del Rey (art. 65.2), no de los del Gobierno (d).","cita":"«Corresponde al Rey: […] e) Nombrar y separar a los miembros del Gobierno, a propuesta de su Presidente.»","dificultad":2},{"id":"CE-L3-071","ley":"CE","articulo":"63.3","articulo_txt":"Art. 63.3 CE","bloque_id":"CE|Título II. De la Corona","enunciado":"Según el artículo 63.3 de la Constitución, al Rey corresponde declarar la guerra y hacer la paz:","opciones":{"a":"A propuesta del Consejo de Seguridad Nacional.","b":"Previa autorización del Congreso de los Diputados.","c":"Previa autorización de las Cortes Generales.","d":"Previo acuerdo del Consejo de Ministros, dando cuenta posteriormente a las Cortes Generales."},"correcta":"c","explicacion":"Art. 63.3 CE: «Al Rey corresponde, previa autorización de las Cortes Generales, declarar la guerra y hacer la paz». La Constitución no menciona aquí al Consejo de Seguridad Nacional (a), no basta la autorización del Congreso (b) y la intervención de las Cortes es previa, no una dación de cuenta posterior (d).","cita":"«Al Rey corresponde, previa autorización de las Cortes Generales, declarar la guerra y hacer la paz.»","dificultad":1},{"id":"CE-L4-009","ley":"CE","articulo":"68.2 y 68.3","articulo_txt":"Art. 68.2 y 68.3 CE","bloque_id":"CE|Título III. De las Cortes Generales. Capítulo I. De las Cámaras","enunciado":"Según el artículo 68 de la Constitución, en la elección de los Diputados:","opciones":{"a":"La circunscripción electoral es la provincia y la elección se verifica atendiendo a criterios de representación proporcional.","b":"La circunscripción electoral es la Comunidad Autónoma y la elección se verifica atendiendo a criterios de representación proporcional.","c":"La circunscripción electoral es la provincia y la elección se verifica conforme a un sistema mayoritario.","d":"Existe una circunscripción única para todo el territorio nacional y la elección se verifica atendiendo a criterios de representación proporcional."},"correcta":"a","explicacion":"El art. 68.2 CE dispone que «la circunscripción electoral es la provincia» y el art. 68.3, que la elección se verifica en cada circunscripción «atendiendo a criterios de representación proporcional». La b) y la d) cambian la circunscripción, y la c) sustituye la representación proporcional por un sistema mayoritario.","cita":"«La circunscripción electoral es la provincia.» (art. 68.2) «La elección se verificará en cada circunscripción atendiendo a criterios de representación proporcional.» (art. 68.3)","dificultad":1},{"id":"CE-L4-017","ley":"CE","articulo":"69.5","articulo_txt":"Art. 69.5 CE","bloque_id":"CE|Título III. De las Cortes Generales. Capítulo I. De las Cámaras","enunciado":"Según el artículo 69.5 de la Constitución, las Comunidades Autónomas designarán además:","opciones":{"a":"Dos Senadores y otro más por cada millón de habitantes de su respectivo territorio.","b":"Un Senador por cada millón de habitantes de su respectivo territorio.","c":"Un Senador y otro más por cada millón de habitantes de su respectivo territorio.","d":"Un Senador y otro más por cada quinientos mil habitantes de su respectivo territorio."},"correcta":"c","explicacion":"Art. 69.5 CE: cada Comunidad Autónoma designa «un Senador y otro más por cada millón de habitantes de su respectivo territorio». La a) duplica el número fijo; la b) suprime el Senador que corresponde a toda Comunidad sea cual sea su población; la d) cambia el millón por quinientos mil habitantes.","cita":"«Las Comunidades Autónomas designarán además un Senador y otro más por cada millón de habitantes de su respectivo territorio. La designación corresponderá a la Asamblea legislativa o, en su defecto, al órgano colegiado superior de la Comunidad Autónoma, de acuerdo con lo que establezcan los Estatutos, que asegurarán, en todo caso, la adecuada representación proporcional.»","dificultad":2},{"id":"CE-L4-065","ley":"CE","articulo":"86.2","articulo_txt":"Art. 86.2 CE","bloque_id":"CE|Título III. De las Cortes Generales. Capítulo II. De la elaboración de las leyes","enunciado":"Según el artículo 86.2 de la Constitución, ¿qué órgano ha de pronunciarse expresamente sobre la convalidación o derogación de los Decretos-leyes?","opciones":{"a":"Las Cortes Generales en sesión conjunta.","b":"El Senado.","c":"El Congreso de los Diputados y el Senado, sucesivamente.","d":"El Congreso de los Diputados."},"correcta":"d","explicacion":"Art. 86.2 CE: los Decretos-leyes se someten al Congreso de los Diputados, que «habrá de pronunciarse expresamente» sobre su convalidación o derogación por un procedimiento especial y sumario que establecerá el Reglamento. El Senado no interviene en la convalidación (b y c), y no hay sesión conjunta (a).","cita":"«Los Decretos-leyes deberán ser inmediatamente sometidos a debate y votación de totalidad al Congreso de los Diputados, convocado al efecto si no estuviere reunido, en el plazo de los treinta días siguientes a su promulgación. El Congreso habrá de pronunciarse expresamente dentro de dicho plazo sobre su convalidación o derogación, para lo cual el Reglamento establecerá un procedimiento especial y sumario.»","dificultad":1},{"id":"CE-L4-075","ley":"CE","articulo":"90.2","articulo_txt":"Art. 90.2 CE","bloque_id":"CE|Título III. De las Cortes Generales. Capítulo II. De la elaboración de las leyes","enunciado":"Según el artículo 90.2 de la Constitución, en caso de veto del Senado, el Congreso podrá ratificar el texto inicial:","opciones":{"a":"Por mayoría absoluta, pero solo una vez transcurridos dos meses desde la interposición del veto.","b":"Por mayoría simple de forma inmediata, o por mayoría absoluta una vez transcurridos dos meses.","c":"Por mayoría absoluta, o por mayoría simple una vez transcurridos dos meses desde la interposición del veto.","d":"Por mayoría de tres quintos de forma inmediata, o por mayoría absoluta una vez transcurridos dos meses."},"correcta":"c","explicacion":"Art. 90.2 CE: el Congreso puede ratificar el texto inicial por mayoría absoluta o, «una vez transcurridos dos meses desde la interposición del mismo», por mayoría simple. La a) impide ratificar por mayoría absoluta antes de los dos meses; la b) invierte el orden de las mayorías; la d) introduce una mayoría de tres quintos que el precepto no exige.","cita":"«El Senado en el plazo de dos meses, a partir del día de la recepción del texto, puede, mediante mensaje motivado, oponer su veto o introducir enmiendas al mismo. El veto deberá ser aprobado por mayoría absoluta. El proyecto no podrá ser sometido al Rey para sanción sin que el Congreso ratifique por mayoría absoluta, en caso de veto, el texto inicial, o por mayoría simple, una vez transcurridos dos meses desde la interposición del mismo, o se pronuncie sobre las enmiendas, aceptándolas o no por mayoría simple.»","dificultad":2},{"id":"CE-L4-085","ley":"CE","articulo":"93","articulo_txt":"Art. 93 CE","bloque_id":"CE|Título III. De las Cortes Generales. Capítulo III. De los Tratados Internacionales","enunciado":"Según el artículo 93 de la Constitución, la garantía del cumplimiento de los tratados por los que se atribuye a una organización internacional el ejercicio de competencias derivadas de la Constitución corresponde:","opciones":{"a":"A las Cortes Generales o al Gobierno, según los casos.","b":"Exclusivamente al Gobierno.","c":"Al Tribunal Constitucional.","d":"Al Rey, como Jefe del Estado."},"correcta":"a","explicacion":"Art. 93 CE: «Corresponde a las Cortes Generales o al Gobierno, según los casos, la garantía del cumplimiento de estos tratados y de las resoluciones emanadas de los organismos internacionales o supranacionales titulares de la cesión». No corresponde solo al Gobierno (b), ni al Tribunal Constitucional (c), ni al Rey (d).","cita":"«Mediante ley orgánica se podrá autorizar la celebración de tratados por los que se atribuya a una organización o institución internacional el ejercicio de competencias derivadas de la Constitución. Corresponde a las Cortes Generales o al Gobierno, según los casos, la garantía del cumplimiento de estos tratados y de las resoluciones emanadas de los organismos internacionales o supranacionales titulares de la cesión.»","dificultad":2},{"id":"CE-L4-090","ley":"CE","articulo":"95.1","articulo_txt":"Art. 95.1 CE","bloque_id":"CE|Título III. De las Cortes Generales. Capítulo III. De los Tratados Internacionales","enunciado":"Según el artículo 95.1 de la Constitución, la celebración de un tratado internacional que contenga estipulaciones contrarias a la Constitución exigirá:","opciones":{"a":"Su autorización mediante ley orgánica.","b":"La previa revisión constitucional.","c":"La previa autorización de las Cortes Generales por mayoría de tres quintos.","d":"La previa declaración del Tribunal Constitucional sobre la existencia de esa contradicción."},"correcta":"b","explicacion":"Art. 95.1 CE: exige «la previa revisión constitucional». La ley orgánica (a) es la vía del art. 93; la mayoría de tres quintos (c) no aparece en el precepto; y el requerimiento al Tribunal Constitucional para que declare si existe contradicción (d) es una facultad del Gobierno o de cualquiera de las Cámaras (art. 95.2), no un requisito en todo caso.","cita":"«La celebración de un tratado internacional que contenga estipulaciones contrarias a la Constitución exigirá la previa revisión constitucional.»","dificultad":1},{"id":"CE-L5-006","ley":"CE","articulo":"98.3","articulo_txt":"Art. 98.3 CE","bloque_id":"CE|Título IV. Del Gobierno y de la Administración","enunciado":"Según el artículo 98.3 de la Constitución, los miembros del Gobierno no podrán ejercer otras funciones representativas que:","opciones":{"a":"Las propias del mandato parlamentario.","b":"Las propias de la representación sindical.","c":"Las que autorice expresamente el Presidente del Gobierno.","d":"Las de carácter local o autonómico."},"correcta":"a","explicacion":"Art. 98.3 CE: los miembros del Gobierno no podrán ejercer otras funciones representativas «que las propias del mandato parlamentario», ni otra función pública que no derive de su cargo, ni actividad profesional o mercantil alguna. El precepto no salva la representación sindical (b), ni autorizaciones del Presidente (c), ni funciones representativas locales o autonómicas (d).","cita":"«Los miembros del Gobierno no podrán ejercer otras funciones representativas que las propias del mandato parlamentario, ni cualquier otra función pública que no derive de su cargo, ni actividad profesional o mercantil alguna»","dificultad":1},{"id":"CE-L5-030","ley":"CE","articulo":"105.c","articulo_txt":"Art. 105.c CE","bloque_id":"CE|Título IV. Del Gobierno y de la Administración","enunciado":"Conforme al artículo 105.c) de la Constitución, la ley regulará el procedimiento a través del cual deben producirse los actos administrativos, garantizando:","opciones":{"a":"En todo caso, la audiencia del interesado.","b":"En todo caso, la asistencia letrada del interesado.","c":"La audiencia de las organizaciones y asociaciones reconocidas por la ley.","d":"Cuando proceda, la audiencia del interesado."},"correcta":"d","explicacion":"Art. 105.c) CE: la ley regulará ese procedimiento «garantizando, cuando proceda, la audiencia del interesado». La a) cambia «cuando proceda» por «en todo caso»; la b) alude a una asistencia letrada que el precepto no menciona; y la c) toma elementos de la letra a), que prevé la audiencia de los ciudadanos, directamente o a través de organizaciones y asociaciones, en la elaboración de las disposiciones administrativas.","cita":"«La ley regulará: […] c) El procedimiento a través del cual deben producirse los actos administrativos, garantizando, cuando proceda, la audiencia del interesado»","dificultad":2},{"id":"CE-L5-053","ley":"CE","articulo":"115.3","articulo_txt":"Art. 115.3 CE","bloque_id":"CE|Título V. De las relaciones entre el Gobierno y las Cortes Generales","enunciado":"Según el artículo 115.3 de la Constitución, no procederá nueva disolución antes de que transcurra un año desde la anterior, salvo:","opciones":{"a":"Que lo autorice el Congreso de los Diputados por mayoría absoluta.","b":"Que haya prosperado una moción de censura.","c":"Que se haya declarado el estado de sitio.","d":"Lo dispuesto en el artículo 99, apartado 5."},"correcta":"d","explicacion":"Art. 115.3 CE: la única salvedad al plazo de un año es «lo dispuesto en el artículo 99, apartado 5», es decir, la disolución que procede si, transcurridos dos meses desde la primera votación de investidura, ningún candidato ha obtenido la confianza del Congreso. No hay excepción por autorización del Congreso (a) ni por moción de censura (b), y durante el estado de sitio no puede disolverse el Congreso (art. 116.5), por lo que la c) también es falsa.","cita":"«No procederá nueva disolución antes de que transcurra un año desde la anterior, salvo lo dispuesto en el artículo 99, apartado 5»","dificultad":2},{"id":"CE-L5-075","ley":"CE","articulo":"122.3","articulo_txt":"Art. 122.3 CE","bloque_id":"CE|Título VI. Del Poder Judicial","enunciado":"Según el artículo 122.3 de la Constitución, los cuatro miembros del Consejo General del Poder Judicial propuestos por el Congreso de los Diputados y los cuatro propuestos por el Senado son elegidos, en ambos casos, por:","opciones":{"a":"Mayoría de dos tercios de sus miembros.","b":"Mayoría de tres quintos de sus miembros.","c":"Mayoría absoluta de sus miembros.","d":"Mayoría de tres quintos de los miembros presentes."},"correcta":"b","explicacion":"Art. 122.3 CE: son «elegidos en ambos casos por mayoría de tres quintos de sus miembros», es decir, de los miembros de cada Cámara y no de los presentes (d). No se exigen dos tercios (a) ni basta la mayoría absoluta (c).","cita":"«El Consejo General del Poder Judicial estará integrado por el Presidente del Tribunal Supremo, que lo presidirá, y por veinte miembros nombrados por el Rey por un período de cinco años. De éstos, doce entre Jueces y Magistrados de todas las categorías judiciales, en los términos que establezca la ley orgánica; cuatro a propuesta del Congreso de los Diputados, y cuatro a propuesta del Senado, elegidos en ambos casos por mayoría de tres quintos de sus miembros, entre abogados y otros juristas, todos ellos de reconocida competencia y con más de quince años de ejercicio en su profesión»","dificultad":2},{"id":"CE-L6-010","ley":"CE","articulo":"134.7","articulo_txt":"Art. 134.7 CE","bloque_id":"CE|Título VII. Economía y Hacienda","enunciado":"Según el artículo 134.7 de la Constitución, la Ley de Presupuestos:","opciones":{"a":"Puede crear tributos siempre que su vigencia se limite al ejercicio presupuestario.","b":"No puede crear ni modificar tributos en ningún caso.","c":"Puede crear y modificar tributos cuando así lo autorice una ley orgánica.","d":"No puede crear tributos, pero podrá modificarlos cuando una ley tributaria sustantiva así lo prevea."},"correcta":"d","explicacion":"Art. 134.7 CE: «La Ley de Presupuestos no puede crear tributos. Podrá modificarlos cuando una ley tributaria sustantiva así lo prevea». La a) y la c) le permiten crear tributos, lo que el precepto prohíbe sin excepciones, y la b) le niega la posibilidad de modificarlos, que sí existe si lo prevé una ley tributaria sustantiva.","cita":"«La Ley de Presupuestos no puede crear tributos. Podrá modificarlos cuando una ley tributaria sustantiva así lo prevea.»","dificultad":2},{"id":"CE-L6-022","ley":"CE","articulo":"139.2","articulo_txt":"Art. 139.2 CE","bloque_id":"CE|Título VIII. De la Organización Territorial del Estado","enunciado":"Según el artículo 139.2 de la Constitución, ninguna autoridad podrá adoptar medidas que directa o indirectamente obstaculicen:","opciones":{"a":"La libertad de circulación y establecimiento de las personas y la libre circulación de bienes en todo el territorio español.","b":"La libertad de empresa en el marco de la economía de mercado.","c":"La libertad de circulación y establecimiento de las personas, únicamente dentro de la Comunidad Autónoma en que residan.","d":"La libertad de circulación y residencia de las personas en todo el territorio español, pero no la libre circulación de bienes."},"correcta":"a","explicacion":"Art. 139.2 CE: se prohíben las medidas que obstaculicen «la libertad de circulación y establecimiento de las personas y la libre circulación de bienes en todo el territorio español». La b) reproduce el art. 38 CE, la c) limita la protección al territorio de la Comunidad Autónoma de residencia, cuando el precepto se refiere a todo el territorio español, y la d) excluye la libre circulación de bienes, que sí está protegida.","cita":"«Ninguna autoridad podrá adoptar medidas que directa o indirectamente obstaculicen la libertad de circulación y establecimiento de las personas y la libre circulación de bienes en todo el territorio español.»","dificultad":1},{"id":"CE-L6-074","ley":"CE","articulo":"162.1.b","articulo_txt":"Art. 162.1.b CE","bloque_id":"CE|Título IX. Del Tribunal Constitucional","enunciado":"Según el artículo 162.1.b) de la Constitución, están legitimados para interponer el recurso de amparo:","opciones":{"a":"Toda persona natural que invoque un interés legítimo, así como el Defensor del Pueblo.","b":"Toda persona natural o jurídica que invoque un interés legítimo, así como el Defensor del Pueblo y el Ministerio Fiscal.","c":"Toda persona natural o jurídica que invoque un interés legítimo, así como el Presidente del Gobierno y el Ministerio Fiscal.","d":"Únicamente la persona directamente afectada por la violación del derecho y el Ministerio Fiscal."},"correcta":"b","explicacion":"Art. 162.1.b) CE: están legitimados «toda persona natural o jurídica que invoque un interés legítimo, así como el Defensor del Pueblo y el Ministerio Fiscal». La a) excluye a las personas jurídicas y al Ministerio Fiscal, la c) incluye al Presidente del Gobierno, legitimado solo para el recurso de inconstitucionalidad, y la d) restringe la legitimación y omite al Defensor del Pueblo.","cita":"«1. Están legitimados: a) Para interponer el recurso de inconstitucionalidad, el Presidente del Gobierno, el Defensor del Pueblo, 50 Diputados, 50 Senadores, los órganos colegiados ejecutivos de las Comunidades Autónomas y, en su caso, las Asambleas de las mismas. b) Para interponer el recurso de amparo, toda persona natural o jurídica que invoque un interés legítimo, así como el Defensor del Pueblo y el Ministerio Fiscal.»","dificultad":2},{"id":"CE-L6-089","ley":"CE","articulo":"168.1","articulo_txt":"Art. 168.1 CE","bloque_id":"CE|Título X. De la reforma constitucional","enunciado":"Según el artículo 168.1 de la Constitución, el procedimiento de reforma previsto en ese artículo se aplica cuando se propusiere la revisión total de la Constitución o una parcial que afecte:","opciones":{"a":"Al Título preliminar, a todo el Título I o al Título II.","b":"Al Título preliminar, a todo el Capítulo segundo del Título I o al Título II.","c":"Al Título preliminar, al Capítulo segundo, Sección primera del Título I, o al Título IX.","d":"Al Título preliminar, al Capítulo segundo, Sección primera del Título I, o al Título II."},"correcta":"d","explicacion":"Art. 168.1 CE: este procedimiento se sigue en la revisión total o en la parcial que afecte «al Título preliminar, al Capítulo segundo, Sección primera del Título I, o al Título II». La a) y la b) extienden la protección a todo el Título I o a todo su Capítulo segundo, cuando solo alcanza a la Sección primera de ese capítulo, y la c) sustituye el Título II por el Título IX.","cita":"«Cuando se propusiere la revisión total de la Constitución o una parcial que afecte al Título preliminar, al Capítulo segundo, Sección primera del Título I, o al Título II, se procederá a la aprobación del principio por mayoría de dos tercios de cada Cámara, y a la disolución inmediata de las Cortes.»","dificultad":2},{"id":"CE-L6-095","ley":"CE","articulo":"DA 1ª","articulo_txt":"DA 1ª · CE","bloque_id":"CE|Disposiciones adicionales","enunciado":"Según la disposición adicional primera de la Constitución, la Constitución ampara y respeta los derechos históricos de:","opciones":{"a":"Las nacionalidades y regiones que integran la Nación española.","b":"Las Comunidades Autónomas que accedieron a la autonomía por la vía del artículo 151.","c":"Los territorios forales.","d":"Los territorios que en el pasado hubiesen plebiscitado afirmativamente proyectos de Estatuto de autonomía."},"correcta":"c","explicacion":"DA 1.ª CE: «La Constitución ampara y respeta los derechos históricos de los territorios forales». La a) evoca el derecho a la autonomía del art. 2, la b) una vía de acceso a la autonomía y la d) los territorios a que se refiere la disposición transitoria segunda.","cita":"«La Constitución ampara y respeta los derechos históricos de los territorios forales. La actualización general de dicho régimen foral se llevará a cabo, en su caso, en el marco de la Constitución y de los Estatutos de Autonomía.»","dificultad":1},{"id":"CE-L6-100","ley":"CE","articulo":"DT 1ª","articulo_txt":"DT 1ª · CE","bloque_id":"CE|Disposiciones transitorias","enunciado":"Según la disposición transitoria primera de la Constitución, en los territorios dotados de un régimen provisional de autonomía, sus órganos colegiados superiores podrán sustituir la iniciativa que el artículo 143.2 atribuye a las Diputaciones Provinciales o a los órganos interinsulares correspondientes mediante acuerdo adoptado por:","opciones":{"a":"La mayoría de dos tercios de sus miembros.","b":"La mayoría absoluta de sus miembros.","c":"La mayoría de tres quintos de sus miembros.","d":"La mayoría simple de los miembros presentes."},"correcta":"b","explicacion":"DT 1.ª CE: la sustitución de la iniciativa requiere un acuerdo «adoptado por la mayoría absoluta de sus miembros». La a), la c) y la d) cambian la mayoría exigida. Esta disposición ya no tiene efecto práctico: los regímenes provisionales de autonomía desaparecieron al aprobarse los Estatutos de Autonomía, entre 1979 y 1983.","cita":"«En los territorios dotados de un régimen provisional de autonomía, sus órganos colegiados superiores, mediante acuerdo adoptado por la mayoría absoluta de sus miembros, podrán sustituir la iniciativa que en el apartado 2 del artículo 143 atribuye a las Diputaciones Provinciales o a los órganos interinsulares correspondientes.»","dificultad":2},{"id":"CE-L6-111","ley":"CE","articulo":"DD.2","articulo_txt":"DD.2 · CE","bloque_id":"CE|Disposición derogatoria","enunciado":"Según el apartado 2 de la disposición derogatoria de la Constitución, en tanto en cuanto pudiera conservar alguna vigencia, se considera definitivamente derogada la Ley de 25 de octubre de 1839 en lo que pudiera afectar a:","opciones":{"a":"Las provincias de Álava, Guipúzcoa y Vizcaya.","b":"La provincia de Navarra.","c":"Las provincias de Álava, Guipúzcoa, Vizcaya y Navarra.","d":"Las provincias de Guipúzcoa y Vizcaya, pero no a la de Álava."},"correcta":"a","explicacion":"Disposición derogatoria.2 CE: la Ley de 25 de octubre de 1839 se considera definitivamente derogada «en lo que pudiera afectar a las provincias de Álava, Guipúzcoa y Vizcaya», y en los mismos términos la Ley de 21 de julio de 1876. La b) y la c) incluyen a Navarra, que la disposición no menciona, y la d) excluye a Álava.","cita":"«2. En tanto en cuanto pudiera conservar alguna vigencia, se considera definitivamente derogada la Ley de 25 de octubre de 1839 en lo que pudiera afectar a las provincias de Álava, Guipúzcoa y Vizcaya. En los mismos términos se considera definitivamente derogada la Ley de 21 de julio de 1876.»","dificultad":2},{"id":"CE-L6-112","ley":"CE","articulo":"DF","articulo_txt":"DF · CE","bloque_id":"CE|Disposición final","enunciado":"Según la disposición final de la Constitución, la Constitución entrará en vigor:","opciones":{"a":"El mismo día de la publicación de su texto oficial en el Boletín Oficial del Estado.","b":"A los veinte días de su completa publicación en el Boletín Oficial del Estado.","c":"El día siguiente al de la publicación de su texto oficial en el Boletín Oficial del Estado.","d":"El mismo día de su sanción por el Rey ante las Cortes Generales."},"correcta":"a","explicacion":"Disposición final CE: «Esta Constitución entrará en vigor el mismo día de la publicación de su texto oficial en el Boletín Oficial del Estado», y se publicará también en las demás lenguas de España. La b) reproduce la regla general de entrada en vigor de las leyes del art. 2.1 del Código Civil, la c) la retrasa un día y la d) la vincula a la sanción y no a la publicación.","cita":"«Esta Constitución entrará en vigor el mismo día de la publicación de su texto oficial en el Boletín Oficial del Estado. Se publicará también en las demás lenguas de España.»","dificultad":1}]};</script>
<script>
/* Letra de Ley — motor de test. Sin dependencias; funciona sin conexión.
   Necesita window.LDL_CONFIG y window.LDL_BANCO (los inyecta sistema/letradeley.py). */
(function () {
  "use strict";
  var CFG = window.LDL_CONFIG, B = window.LDL_BANCO;
  var raiz = document.getElementById("ldl");
  var LETRAS = ["a", "b", "c", "d"];
  var POR_ID = {};
  B.preguntas.forEach(function (p) { POR_ID[p.id] = p; });
  var CLAVE = "ldl1:" + CFG.pack.id;
  var prog = cargar();
  var sesion = null;
  var vista = CFG.modo === "web" ? "portada" : "inicio";
  var reloj = null;

  /* ---------- utilidades ---------- */
  function esc(t) {
    return String(t == null ? "" : t).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function barajar(lista) {
    var a = lista.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function pct(a, b) { return b ? Math.round((a / b) * 100) : 0; }
  function plural(n, uno, varios) { return n + " " + (n === 1 ? uno : varios); }
  function num(n) { return String(n).replace(".", ","); }
  function cargar() {
    try { var s = localStorage.getItem(CLAVE); if (s) { var d = JSON.parse(s); if (d && d.p) return d; } } catch (e) {}
    return { p: {}, h: [] };
  }
  function guardar() { try { localStorage.setItem(CLAVE, JSON.stringify(prog)); } catch (e) {} }
  function registrar(id, acierto) {
    var r = prog.p[id] || { v: 0, a: 0, f: 0, c: 0 };
    r.v++;
    if (acierto) { r.a++; r.c = Math.min((r.c || 0) + 1, 5); } else { r.f++; r.c = 0; }
    r.u = acierto ? 1 : 0;
    r.t = Date.now();
    prog.p[id] = r;
    guardar();
  }
  function fallosPendientes() {
    return B.preguntas.filter(function (p) { var r = prog.p[p.id]; return r && r.u === 0; });
  }
  function resumen(lista) {
    var vistas = 0, aciertos = 0, intentos = 0;
    lista.forEach(function (p) {
      var r = prog.p[p.id];
      if (r) { vistas++; aciertos += r.a; intentos += r.v; }
    });
    return { total: lista.length, vistas: vistas, acierto: pct(aciertos, intentos) };
  }
  function delBloque(id) { return B.preguntas.filter(function (p) { return p.bloque_id === id; }); }

  /* ---------- tema claro / oscuro ---------- */
  function aplicarTema() {
    var t = null;
    try { t = localStorage.getItem("ldl:tema"); } catch (e) {}
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    else document.documentElement.removeAttribute("data-theme");
    return t || "auto";
  }
  function cambiarTema() {
    var orden = { auto: "light", light: "dark", dark: "auto" };
    var actual = aplicarTema();
    try { localStorage.setItem("ldl:tema", orden[actual]); } catch (e) {}
    aplicarTema();
    pintar();
  }

  /* ---------- sesiones ---------- */
  function empezar(tipo, preguntas, opciones) {
    opciones = opciones || {};
    if (!preguntas.length) return;
    pararReloj();
    sesion = {
      tipo: tipo, titulo: opciones.titulo || "Test", ids: preguntas.map(function (p) { return p.id; }),
      i: 0, resp: {}, corregida: {}, inicio: Date.now(), limite: opciones.minutos ? opciones.minutos * 60 : 0, fin: null,
      origen: vista === "test" || vista === "resultado" ? (sesion && sesion.origen) || "inicio" : vista
    };
    vista = "test";
    if (sesion.limite) reloj = setInterval(tic, 1000);
    pintar();
    window.scrollTo(0, 0);
  }
  function tic() {
    if (!sesion || sesion.fin) return pararReloj();
    var el = document.getElementById("ldl-crono");
    var resta = sesion.limite - Math.floor((Date.now() - sesion.inicio) / 1000);
    if (resta <= 0) { terminar(); return; }
    if (el) el.textContent = mmss(resta);
  }
  function pararReloj() { if (reloj) { clearInterval(reloj); reloj = null; } }
  function mmss(s) { var m = Math.floor(s / 60), r = s % 60; return m + ":" + (r < 10 ? "0" : "") + r; }

  function responder(letra) {
    var id = sesion.ids[sesion.i];
    if (sesion.tipo === "simulacro") {
      sesion.resp[id] = sesion.resp[id] === letra ? undefined : letra;
      pintar();
      return;
    }
    if (sesion.corregida[id]) return;
    sesion.resp[id] = letra;
    sesion.corregida[id] = true;
    registrar(id, letra === POR_ID[id].correcta);
    pintar();
  }
  function siguiente() {
    if (sesion.i < sesion.ids.length - 1) { sesion.i++; pintar(); window.scrollTo(0, 0); }
    else terminar();
  }
  function anterior() { if (sesion.i > 0) { sesion.i--; pintar(); } }
  function terminar() {
    pararReloj();
    if (sesion.tipo === "simulacro") {
      sesion.ids.forEach(function (id) {
        if (sesion.resp[id]) registrar(id, sesion.resp[id] === POR_ID[id].correcta);
      });
    }
    sesion.fin = Date.now();
    var r = calcular(sesion);
    prog.h.unshift({ t: sesion.fin, tipo: sesion.tipo, n: r.total, a: r.aciertos, e: r.errores, nota: r.nota });
    prog.h = prog.h.slice(0, 50);
    guardar();
    vista = "resultado";
    pintar();
    window.scrollTo(0, 0);
  }
  function calcular(s) {
    var a = 0, e = 0, nr = 0;
    s.ids.forEach(function (id) {
      var r = s.resp[id];
      if (!r) nr++; else if (r === POR_ID[id].correcta) a++; else e++;
    });
    var pen = (CFG.simulacro && CFG.simulacro.penalizacion) || 1 / 3;
    var neta = s.tipo === "simulacro" ? a - e * pen : a;
    var nota = Math.max(0, (neta / s.ids.length) * 10);
    return { total: s.ids.length, aciertos: a, errores: e, blancos: nr, neta: neta, nota: Math.round(nota * 100) / 100 };
  }

  /* ---------- vistas ---------- */
  function cabecera() {
    var tema = aplicarTema();
    var etiquetas = { auto: "Tema: auto", light: "Tema: claro", dark: "Tema: oscuro" };
    return '<header class="ldl-top"><a class="ldl-brand" href="' + esc(CFG.web || "#") + '">' +
      '<span class="ldl-logo" aria-hidden="true">§</span><span><b>Letra de Ley</b><small>' +
      esc(CFG.pack.nombre) + "</small></span></a>" +
      '<button class="ldl-tema" data-acc="tema" type="button">' + etiquetas[tema] + "</button></header>";
  }
  function navegacion() {
    if (CFG.modo === "web") return "";
    var items = [["inicio", "Inicio"], ["temas", "Por temas"], ["simulacro", "Simulacro"], ["fallos", "Fallos"], ["stats", "Estadísticas"]];
    return '<nav class="ldl-nav" aria-label="Secciones">' + items.map(function (it) {
      var actual = vista === it[0] || (vista === "test" && sesion && sesion.origen === it[0]);
      return '<button type="button" data-acc="ir" data-v="' + it[0] + '"' + (actual ? ' aria-current="page"' : "") + ">" + it[1] + "</button>";
    }).join("") + "</nav>";
  }
  function pie() {
    return '<p class="ldl-pie">Letra de Ley · ' + esc(CFG.pack.edicion) + " · Texto legal actualizado a " +
      esc(CFG.pack.actualizado) + "<br>Uso personal. Prohibida su redistribución.</p>";
  }

  function vInicio() {
    var r = resumen(B.preguntas), f = fallosPendientes().length;
    return '<section class="ldl-card"><h2>' + esc(CFG.pack.nombre) + "</h2>" +
      '<p class="ldl-muted">' + B.preguntas.length + " preguntas comentadas, con el artículo exacto de cada respuesta.</p>" +
      '<div class="ldl-kpis"><div class="ldl-kpi"><b>' + r.vistas + "/" + r.total + "</b><span>respondidas</span></div>" +
      '<div class="ldl-kpi"><b>' + r.acierto + ' %</b><span>de acierto</span></div>' +
      '<div class="ldl-kpi"><b>' + f + "</b><span>fallos por repasar</span></div></div>" +
      '<div class="ldl-acciones"><button class="ldl-btn" data-acc="rapido" type="button">Test rápido de 20</button>' +
      '<button class="ldl-btn sec" data-acc="ir" data-v="simulacro" type="button">Simulacro de examen</button>' +
      (f ? '<button class="ldl-btn sec" data-acc="repasar" type="button">Repasar ' + f + " fallos</button>" : "") +
      "</div></section>" +
      '<section class="ldl-card"><h3>Cómo sacarle partido</h3><ol class="ldl-muted">' +
      "<li>Practica <b>por temas</b>: cada respuesta te enseña el artículo y por qué fallan las demás opciones.</li>" +
      "<li>Cada pocos días, <b>repasa tus fallos</b>: es donde más se aprende.</li>" +
      "<li>Antes del examen, haz <b>simulacros</b> con tiempo y con la penalización real (cada error resta 1/3).</li></ol>" +
      '<p class="ldl-small ldl-muted">Tu progreso se guarda en este dispositivo y en este navegador.</p></section>' + historial();
  }
  function historial() {
    if (!prog.h.length) return "";
    return '<section class="ldl-card"><h3>Últimos tests</h3><ul class="ldl-revision">' + prog.h.slice(0, 5).map(function (h) {
      var d = new Date(h.t);
      return "<li><b>" + (h.tipo === "simulacro" ? "Simulacro" : "Práctica") + "</b> · " + d.toLocaleDateString("es-ES") +
        " · " + h.a + "/" + h.n + " aciertos" + (h.tipo === "simulacro" ? " · nota " + num(h.nota) : "") + "</li>";
    }).join("") + "</ul></section>";
  }
  function vTemas() {
    var html = '<section class="ldl-card"><h2>Practicar por temas</h2><p class="ldl-muted">Elige un bloque. Las preguntas salen en orden aleatorio y se corrigen al momento.</p><ul class="ldl-bloques">';
    B.bloques.forEach(function (b) {
      var lista = delBloque(b.id), r = resumen(lista);
      html += '<li><button type="button" data-acc="bloque" data-id="' + esc(b.id) + '"><span class="t">' + esc(b.nombre) +
        '</span><span class="n">' + r.vistas + "/" + r.total + (r.vistas ? " · " + r.acierto + " %" : "") + "</span>" +
        '<span class="ldl-barra"><i style="width:' + pct(r.vistas, r.total) + '%"></i></span></button></li>';
    });
    return html + "</ul></section>";
  }
  function vSimulacro() {
    var total = B.preguntas.length;
    var opcionesN = [10, 20, 30, 50, 100].filter(function (n) { return n < total; });
    opcionesN.push(total);
    var porDefecto = Math.min((CFG.simulacro && CFG.simulacro.preguntas) || 30, total);
    return '<section class="ldl-card"><h2>Simulacro de examen</h2>' +
      '<p class="ldl-muted">Como el día del examen: no ves las soluciones hasta el final y cada error resta un tercio de acierto.</p>' +
      '<div class="ldl-campo"><label for="ldl-n">Número de preguntas</label><select id="ldl-n">' +
      opcionesN.map(function (n) { return "<option" + (n === porDefecto ? " selected" : "") + ">" + n + "</option>"; }).join("") +
      '</select></div><div class="ldl-campo"><label for="ldl-t">Tiempo</label><select id="ldl-t">' +
      '<option value="1">1 minuto por pregunta</option><option value="0">Sin límite de tiempo</option></select></div>' +
      '<div class="ldl-campo"><label for="ldl-b">Temas</label><select id="ldl-b"><option value="">Todos</option>' +
      B.bloques.map(function (b) { return '<option value="' + esc(b.id) + '">' + esc(b.nombre) + "</option>"; }).join("") +
      '</select></div><div class="ldl-acciones"><button class="ldl-btn" data-acc="simular" type="button">Empezar simulacro</button></div></section>';
  }
  function vFallos() {
    var f = fallosPendientes();
    if (!f.length) {
      return '<section class="ldl-card"><h2>Repaso de fallos</h2><p class="ldl-muted">No tienes fallos pendientes. Cuando falles una pregunta aparecerá aquí hasta que la aciertes.</p></section>';
    }
    return '<section class="ldl-card"><h2>Repaso de fallos</h2><p class="ldl-muted">Tienes <b>' + f.length +
      "</b> preguntas falladas. Salen de aquí en cuanto las aciertas.</p>" +
      '<div class="ldl-acciones"><button class="ldl-btn" data-acc="repasar" type="button">Repasar ahora</button></div></section>';
  }
  function vStats() {
    var html = '<section class="ldl-card"><h2>Estadísticas</h2><ul class="ldl-bloques">';
    B.bloques.forEach(function (b) {
      var r = resumen(delBloque(b.id));
      html += '<li><button type="button" data-acc="bloque" data-id="' + esc(b.id) + '"><span class="t">' + esc(b.nombre) +
        '</span><span class="n">' + (r.vistas ? r.acierto + " % de acierto" : "sin empezar") + '</span><span class="ldl-barra"><i style="width:' +
        r.acierto + '%"></i></span></button></li>';
    });
    html += '</ul></section><section class="ldl-card"><h3>Empezar de cero</h3><p class="ldl-muted ldl-small">Borra tu progreso guardado en este dispositivo.</p>' +
      '<div class="ldl-acciones"><button class="ldl-btn sec" data-acc="borrar" type="button">Borrar mi progreso</button></div></section>';
    return html;
  }
  function vPortada() {
    var n = B.preguntas.length;
    return '<section class="ldl-card"><h2>' + esc(CFG.pack.nombre) + "</h2>" +
      '<p class="ldl-muted">' + n + " preguntas tipo examen, corregidas al momento, con el artículo exacto y la explicación de cada opción. Gratis y sin registrarte.</p>" +
      '<div class="ldl-acciones"><button class="ldl-btn" data-acc="empezarweb" type="button">Empezar el test</button></div></section>';
  }

  function vTest() {
    var id = sesion.ids[sesion.i], p = POR_ID[id], sim = sesion.tipo === "simulacro";
    var elegida = sesion.resp[id], corregida = !sim && sesion.corregida[id];
    var html = '<section class="ldl-card"><div class="ldl-meta"><span>' + esc(sesion.titulo) + " · " + (sesion.i + 1) + " de " + sesion.ids.length +
      "</span><span>" + (sesion.limite ? '⏱ <span id="ldl-crono" class="ldl-crono">' +
        mmss(Math.max(0, sesion.limite - Math.floor((Date.now() - sesion.inicio) / 1000))) + "</span>" : esc(p.articulo_txt)) +
      '</span></div><div class="ldl-progreso"><i style="width:' + pct(sesion.i + (corregida ? 1 : 0), sesion.ids.length) + '%"></i></div>' +
      '<p class="ldl-enunciado">' + esc(p.enunciado) + '</p><div class="ldl-opciones" role="group" aria-label="Opciones">';
    LETRAS.forEach(function (l) {
      var cls = "ldl-op";
      if (corregida) { if (l === p.correcta) cls += " ok"; else if (l === elegida) cls += " ko"; }
      else if (sim && elegida === l) cls += " marcada";
      html += '<button type="button" class="' + cls + '" data-acc="resp" data-l="' + l + '"' + (corregida ? " disabled" : "") +
        (sim ? ' aria-pressed="' + (elegida === l) + '"' : "") + '><span class="l">' + l + ")</span><span>" + esc(p.opciones[l]) + "</span></button>";
    });
    html += "</div>";
    if (corregida) html += feedback(p, elegida);
    html += '<div class="ldl-acciones">';
    if (sim) {
      html += (sesion.i > 0 ? '<button class="ldl-btn sec" data-acc="ant" type="button">Anterior</button>' : "") +
        '<button class="ldl-btn" data-acc="sig" type="button">' + (sesion.i < sesion.ids.length - 1 ? "Siguiente" : "Entregar") + "</button>" +
        (sesion.i < sesion.ids.length - 1 ? '<button class="ldl-btn sec" data-acc="entregar" type="button">Entregar ya</button>' : "");
    } else if (corregida) {
      html += '<button class="ldl-btn" data-acc="sig" type="button">' + (sesion.i < sesion.ids.length - 1 ? "Siguiente" : "Ver resultado") + "</button>";
    }
    html += '<button class="ldl-btn sec" data-acc="salir" type="button">Salir</button></div></section>';
    return html;
  }
  function feedback(p, elegida) {
    var bien = elegida === p.correcta;
    return '<div class="ldl-feedback" aria-live="polite"><div class="v ' + (bien ? "ok" : "ko") + '">' +
      (bien ? "¡Correcta!" : "Incorrecta. La respuesta correcta es la " + p.correcta + ")") + "</div><div>" + esc(p.explicacion) + "</div>" +
      (p.cita ? '<blockquote class="ldl-cita">' + esc(p.cita) + "<small>" + esc(p.articulo_txt) + "</small></blockquote>" : "") + "</div>";
  }
  function vResultado() {
    var r = calcular(sesion), sim = sesion.tipo === "simulacro";
    var html = '<section class="ldl-card"><h2>' + (sim ? "Resultado del simulacro" : "Resultado") + "</h2>" +
      '<div class="ldl-nota">' + (sim ? num(r.nota.toFixed(2)) : r.aciertos + "/" + r.total) + "</div>" +
      '<p class="ldl-muted">' + plural(r.aciertos, "acierto", "aciertos") + " · " + plural(r.errores, "error", "errores") +
      (r.blancos ? " · " + r.blancos + " en blanco" : "") +
      (sim ? " · nota sobre 10 con penalización" : "") + "</p>";
    if (CFG.modo === "web") html += ctaWeb(r);
    html += '<div class="ldl-acciones">' + (CFG.modo === "web" ? '<button class="ldl-btn sec" data-acc="empezarweb" type="button">Repetir con otro orden</button>' :
      '<button class="ldl-btn" data-acc="ir" data-v="inicio" type="button">Volver al inicio</button>') + "</div></section>";
    html += '<section class="ldl-card"><h3>Revisión</h3><ul class="ldl-revision">';
    sesion.ids.forEach(function (id, n) {
      var p = POR_ID[id], e = sesion.resp[id], chip = !e ? '<span class="ldl-chip nr">En blanco</span>' :
        e === p.correcta ? '<span class="ldl-chip ok">Bien</span>' : '<span class="ldl-chip ko">Mal</span>';
      html += "<li>" + chip + '<span class="e">' + (n + 1) + ". " + esc(p.enunciado) + "</span><br>" +
        '<span class="ldl-small">Correcta: <b>' + p.correcta + ") " + esc(p.opciones[p.correcta]) + "</b>" +
        (e && e !== p.correcta ? " · Marcaste " + e + ")" : "") + '</span><br><span class="ldl-small ldl-muted">' + esc(p.explicacion) + "</span></li>";
    });
    return html + "</ul></section>";
  }
  function ctaWeb() {
    var c = CFG.compra || {}, html = "";
    if (c.url) {
      html += '<div class="ldl-card ldl-cta"><h3>' + esc(c.titulo) + '</h3><p class="ldl-muted">' + esc(c.texto) + "</p>" +
        '<div class="ldl-acciones"><a class="ldl-btn acc" href="' + esc(c.url) + '">' + esc(c.boton) + "</a></div></div>";
    }
    if (CFG.telegram) {
      html += '<p class="ldl-small">¿Quieres un test cada día? <a href="' + esc(CFG.telegram) + '">Únete gratis al canal de Telegram</a>.</p>';
    }
    return html;
  }

  function pintar() {
    var cuerpo;
    if (vista === "test") cuerpo = vTest();
    else if (vista === "resultado") cuerpo = vResultado();
    else if (vista === "portada") cuerpo = vPortada();
    else if (vista === "temas") cuerpo = vTemas();
    else if (vista === "simulacro") cuerpo = vSimulacro();
    else if (vista === "fallos") cuerpo = vFallos();
    else if (vista === "stats") cuerpo = vStats();
    else cuerpo = vInicio();
    raiz.innerHTML = '<div class="ldl">' + cabecera() + navegacion() + "<main>" + cuerpo + "</main>" + pie() + "</div>";
  }

  /* ---------- eventos ---------- */
  raiz.addEventListener("click", function (ev) {
    var el = ev.target.closest("[data-acc]");
    if (!el) return;
    var acc = el.getAttribute("data-acc");
    if (acc === "tema") return cambiarTema();
    if (acc === "ir") { pararReloj(); vista = el.getAttribute("data-v"); sesion = null; pintar(); return; }
    if (acc === "rapido") return empezar("practica", barajar(B.preguntas).slice(0, 20), { titulo: "Test rápido" });
    if (acc === "repasar") return empezar("practica", barajar(fallosPendientes()).slice(0, 30), { titulo: "Repaso de fallos" });
    if (acc === "bloque") {
      var b = B.bloques.filter(function (x) { return x.id === el.getAttribute("data-id"); })[0];
      return empezar("practica", barajar(delBloque(b.id)), { titulo: b.nombre });
    }
    if (acc === "simular") {
      var n = parseInt(document.getElementById("ldl-n").value, 10);
      var conTiempo = document.getElementById("ldl-t").value === "1";
      var bloque = document.getElementById("ldl-b").value;
      var fuente = bloque ? delBloque(bloque) : B.preguntas;
      var elegidas = barajar(fuente).slice(0, n);
      return empezar("simulacro", elegidas, { titulo: "Simulacro", minutos: conTiempo ? elegidas.length : 0 });
    }
    if (acc === "empezarweb") return empezar("practica", barajar(B.preguntas), { titulo: "Test gratuito" });
    if (acc === "resp") return responder(el.getAttribute("data-l"));
    if (acc === "sig") return siguiente();
    if (acc === "ant") return anterior();
    if (acc === "entregar") return terminar();
    if (acc === "salir") { pararReloj(); sesion = null; vista = CFG.modo === "web" ? "portada" : "inicio"; pintar(); return; }
    if (acc === "borrar") {
      if (el.getAttribute("data-confirmar") === "1") { prog = { p: {}, h: [] }; guardar(); pintar(); }
      else { el.setAttribute("data-confirmar", "1"); el.textContent = "Pulsa otra vez para confirmar"; }
    }
  });
  document.addEventListener("keydown", function (ev) {
    if (vista !== "test" || !sesion || ev.altKey || ev.ctrlKey || ev.metaKey) return;
    var k = ev.key.toLowerCase(), mapa = { "1": "a", "2": "b", "3": "c", "4": "d", a: "a", b: "b", c: "c", d: "d" };
    if (mapa[k]) { ev.preventDefault(); responder(mapa[k]); }
    else if (k === "enter" || k === "arrowright") {
      var id = sesion.ids[sesion.i];
      if (sesion.tipo === "simulacro" || sesion.corregida[id]) { ev.preventDefault(); siguiente(); }
    } else if (k === "arrowleft" && sesion.tipo === "simulacro") { ev.preventDefault(); anterior(); }
  });

  pintar();
})();
</script>
</body>
</html>
