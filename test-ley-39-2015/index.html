},{"id":"L39|Título V. De la revisión de los actos en vía administrativa · Capítulo I. Revisión de oficio","ley":"L39","nombre":"Título V. De la revisión de los actos en vía administrativa · Capítulo I. Revisión de oficio"},{"id":"L39|Título V. De la revisión de los actos en vía administrativa · Capítulo II. Recursos administrativos · Sección 1.ª Principios generales","ley":"L39","nombre":"Título V. De la revisión de los actos en vía administrativa · Capítulo II. Recursos administrativos · Sección 1.ª Principios generales"},{"id":"L39|Título V. De la revisión de los actos en vía administrativa · Capítulo II. Recursos administrativos · Sección 2.ª Recurso de alzada","ley":"L39","nombre":"Título V. De la revisión de los actos en vía administrativa · Capítulo II. Recursos administrativos · Sección 2.ª Recurso de alzada"},{"id":"L39|Título V. De la revisión de los actos en vía administrativa · Capítulo II. Recursos administrativos · Sección 3.ª Recurso potestativo de reposición","ley":"L39","nombre":"Título V. De la revisión de los actos en vía administrativa · Capítulo II. Recursos administrativos · Sección 3.ª Recurso potestativo de reposición"},{"id":"L39|Título V. De la revisión de los actos en vía administrativa · Capítulo II. Recursos administrativos · Sección 4.ª Recurso extraordinario de revisión","ley":"L39","nombre":"Título V. De la revisión de los actos en vía administrativa · Capítulo II. Recursos administrativos · Sección 4.ª Recurso extraordinario de revisión"},{"id":"L39|Título VI. De la iniciativa legislativa y de la potestad para dictar reglamentos y otras disposiciones","ley":"L39","nombre":"Título VI. De la iniciativa legislativa y de la potestad para dictar reglamentos y otras disposiciones"},{"id":"L39|Disposiciones adicionales","ley":"L39","nombre":"Disposiciones adicionales"},{"id":"L39|Disposiciones transitorias","ley":"L39","nombre":"Disposiciones transitorias"},{"id":"L39|Disposición derogatoria","ley":"L39","nombre":"Disposición derogatoria"},{"id":"L39|Disposiciones finales","ley":"L39","nombre":"Disposiciones finales"}],"preguntas":[{"id":"L39-L1-002","ley":"L39","articulo":"1.1","articulo_txt":"Art. 1.1 Ley 39/2015","bloque_id":"L39|Título Preliminar. Disposiciones generales","enunciado":"Según el artículo 1.1 de la Ley 39/2015, la Ley también tiene por objeto regular los principios a los que se ha de ajustar el ejercicio de:","opciones":{"a":"La potestad sancionadora y la potestad reglamentaria","b":"La iniciativa legislativa y la potestad sancionadora","c":"La potestad reglamentaria y la potestad expropiatoria","d":"La iniciativa legislativa y la potestad reglamentaria"},"correcta":"d","explicacion":"El artículo 1.1 termina refiriéndose a «los principios a los que se ha de ajustar el ejercicio de la iniciativa legislativa y la potestad reglamentaria». La a) el artículo 1.1 no se refiere a los principios de la potestad sancionadora, sino a los de la iniciativa legislativa. La b) junto a la iniciativa legislativa, el artículo 1.1 cita la potestad reglamentaria, no la sancionadora. La c) el artículo 1.1 no menciona la potestad expropiatoria; la otra potestad citada es la iniciativa legislativa.","cita":"«(…) así como los principios a los que se ha de ajustar el ejercicio de la iniciativa legislativa y la potestad reglamentaria.»","dificultad":1},{"id":"L39-L1-006","ley":"L39","articulo":"2.3","articulo_txt":"Art. 2.3 Ley 39/2015","bloque_id":"L39|Título Preliminar. Disposiciones generales","enunciado":"Según el artículo 2.3 de la Ley 39/2015, ¿cuál de los siguientes NO tiene la consideración de Administración Pública?","opciones":{"a":"Las entidades de derecho privado vinculadas o dependientes de las Administraciones Públicas","b":"La Administración General del Estado","c":"Las Entidades que integran la Administración Local","d":"Los organismos públicos y entidades de derecho público vinculados o dependientes de las Administraciones Públicas"},"correcta":"a","explicacion":"El artículo 2.3 considera Administraciones Públicas a la Administración General del Estado, las de las Comunidades Autónomas, las Entidades que integran la Administración Local y los organismos públicos y entidades de derecho público de la letra a) del apartado 2, pero no a las entidades de derecho privado de la letra b). La b) figura expresamente en el artículo 2.3 como Administración Pública. La c) el artículo 2.3 las incluye expresamente entre las Administraciones Públicas. La d) el artículo 2.3 les reconoce esa consideración al remitirse a la letra a) del apartado 2.","cita":"«3. Tienen la consideración de Administraciones Públicas la Administración General del Estado, las Administraciones de las Comunidades Autónomas, las Entidades que integran la Administración Local, así como los organismos públicos y entidades de derecho público previstos en la letra a) del apartado 2 anterior.»","dificultad":2},{"id":"L39-L1-009","ley":"L39","articulo":"3.b","articulo_txt":"Art. 3.b Ley 39/2015","bloque_id":"L39|Título I. De los interesados en el procedimiento","enunciado":"Según el artículo 3.b) de la Ley 39/2015, los menores de edad tendrán capacidad de obrar ante las Administraciones Públicas:","opciones":{"a":"Solo cuando hayan cumplido dieciséis años, para el ejercicio y defensa de cualquiera de sus derechos e intereses y en cualquier procedimiento","b":"En ningún caso, pues deben actuar siempre por medio de quien ejerza la patria potestad, tutela o curatela","c":"Solo para formular solicitudes y presentar declaraciones responsables o comunicaciones, y siempre con la autorización expresa de quien ejerza la patria potestad, tutela o curatela","d":"Para el ejercicio y defensa de los derechos e intereses cuya actuación permita el ordenamiento jurídico sin la asistencia de quien ejerza la patria potestad, tutela o curatela"},"correcta":"d","explicacion":"El artículo 3.b) reconoce capacidad de obrar a los menores para el ejercicio y defensa de los derechos e intereses cuya actuación permita el ordenamiento jurídico sin la asistencia de quien ejerza la patria potestad, tutela o curatela. La a) el artículo 3.b) no fija una edad mínima, sino que atiende a los derechos e intereses cuya actuación permita el ordenamiento sin asistencia. La b) el artículo 3.b) sí les reconoce capacidad de obrar en determinados supuestos. La c) el artículo 3.b) no limita la capacidad a las solicitudes y declaraciones ni exige autorización: se refiere precisamente a actuaciones permitidas sin esa asistencia.","cita":"«b) Los menores de edad para el ejercicio y defensa de aquellos de sus derechos e intereses cuya actuación esté permitida por el ordenamiento jurídico sin la asistencia de la persona que ejerza la patria potestad, tutela o curatela. (…)»","dificultad":2},{"id":"L39-L1-008","ley":"L39","articulo":"3.a","articulo_txt":"Art. 3.a Ley 39/2015","bloque_id":"L39|Título I. De los interesados en el procedimiento","enunciado":"Según el artículo 3 de la Ley 39/2015, tendrán capacidad de obrar ante las Administraciones Públicas las personas físicas o jurídicas que ostenten capacidad de obrar con arreglo a:","opciones":{"a":"Las normas administrativas","b":"Las normas mercantiles","c":"Las normas civiles","d":"Las normas procesales"},"correcta":"c","explicacion":"El artículo 3.a) remite a la capacidad de obrar que las personas físicas o jurídicas ostenten «con arreglo a las normas civiles». La a) el artículo 3.a) no remite a las normas administrativas, sino a las civiles. La b) la referencia del artículo 3.a) es a las normas civiles, no a las mercantiles. La d) el artículo 3.a) no remite a las normas procesales, sino a las civiles.","cita":"«a) Las personas físicas o jurídicas que ostenten capacidad de obrar con arreglo a las normas civiles.»","dificultad":1},{"id":"L39-L2-027","ley":"L39","articulo":"24.1","articulo_txt":"Art. 24.1 Ley 39/2015","bloque_id":"L39|Título II. De la actividad de las Administraciones Públicas · Capítulo I. Normas generales de actuación","enunciado":"Según el artículo 24.1 de la Ley 39/2015, en los procedimientos de responsabilidad patrimonial de las Administraciones Públicas, el silencio administrativo tiene efecto:","opciones":{"a":"Desestimatorio.","b":"Estimatorio.","c":"Estimatorio, salvo que la indemnización solicitada supere la cuantía que fije la norma reguladora.","d":"Estimatorio, si la solicitud se presentó dentro del plazo de prescripción."},"correcta":"a","explicacion":"El artículo 24.1 enumera los procedimientos de responsabilidad patrimonial de las Administraciones Públicas entre aquellos en que «el silencio tendrá efecto desestimatorio». La b), la c) y la d) le atribuyen efecto estimatorio, sin apoyo en el precepto.","cita":"«El silencio tendrá efecto desestimatorio en los procedimientos relativos al ejercicio del derecho de petición, a que se refiere el artículo 29 de la Constitución, (…) y en los procedimientos de responsabilidad patrimonial de las Administraciones Públicas.»","dificultad":1},{"id":"L39-L9-011","ley":"L39","articulo":"28.6","articulo_txt":"Art. 28.6 Ley 39/2015","bloque_id":"L39|Título II. De la actividad de las Administraciones Públicas · Capítulo I. Normas generales de actuación","enunciado":"Según el artículo 28.6 de la Ley 39/2015, las copias que aporten los interesados al procedimiento administrativo tendrán eficacia:","opciones":{"a":"Plena frente a terceros, una vez incorporadas al expediente.","b":"Únicamente en el procedimiento en el que hayan sido aportadas.","c":"Exclusivamente en el ámbito de la actividad de las Administraciones Públicas.","d":"La misma que el documento original, tanto en el ámbito público como en el privado."},"correcta":"c","explicacion":"El art. 28.6 dispone que estas copias «tendrán eficacia, exclusivamente en el ámbito de la actividad de las Administraciones Públicas». La opción b) reduce esa eficacia al procedimiento concreto, y las opciones a) y d) la extienden más allá de la actividad de las Administraciones Públicas.","cita":"«6. Las copias que aporten los interesados al procedimiento administrativo tendrán eficacia, exclusivamente en el ámbito de la actividad de las Administraciones Públicas.»","dificultad":2},{"id":"L39-L9-012","ley":"L39","articulo":"30.8","articulo_txt":"Art. 30.8 Ley 39/2015","bloque_id":"L39|Título II. De la actividad de las Administraciones Públicas · Capítulo II. Términos y plazos","enunciado":"Según el artículo 30.8 de la Ley 39/2015, la declaración de un día como hábil o inhábil a efectos de cómputo de plazos:","opciones":{"a":"No determina por sí sola el funcionamiento de los centros de trabajo de las Administraciones Públicas ni su régimen de jornada y horarios.","b":"Determina el cierre, en los días declarados inhábiles, de las oficinas de asistencia en materia de registros.","c":"Obliga a adaptar el calendario laboral del personal de las Administraciones Públicas a las que afecte.","d":"Determina por sí sola la organización del tiempo de trabajo del personal al servicio de las Administraciones Públicas."},"correcta":"a","explicacion":"El art. 30.8 establece que esa declaración «no determina por sí sola el funcionamiento de los centros de trabajo de las Administraciones Públicas, la organización del tiempo de trabajo o el régimen de jornada y horarios de las mismas». Las opciones b), c) y d) le atribuyen efectos sobre la apertura de las oficinas, el calendario laboral o la organización del tiempo de trabajo que el precepto le niega.","cita":"«8. La declaración de un día como hábil o inhábil a efectos de cómputo de plazos no determina por sí sola el funcionamiento de los centros de trabajo de las Administraciones Públicas, la organización del tiempo de trabajo o el régimen de jornada y horarios de las mismas.»","dificultad":2},{"id":"L39-L2-048","ley":"L39","articulo":"32.2","articulo_txt":"Art. 32.2 Ley 39/2015","bloque_id":"L39|Título II. De la actividad de las Administraciones Públicas · Capítulo II. Términos y plazos","enunciado":"Según el artículo 32.2 de la Ley 39/2015, la ampliación de los plazos por el tiempo máximo permitido se aplicará en todo caso:","opciones":{"a":"A los procedimientos en que intervengan interesados residentes fuera de España.","b":"A los procedimientos en que intervengan más de diez interesados.","c":"A los procedimientos de concurrencia competitiva.","d":"A los procedimientos afectados por una incidencia técnica que haya imposibilitado el funcionamiento ordinario del sistema."},"correcta":"a","explicacion":"El artículo 32.2 aplica en todo caso la ampliación máxima a los procedimientos tramitados por misiones diplomáticas y oficinas consulares, a los que exijan algún trámite en el extranjero y a aquellos «en los que intervengan interesados residentes fuera de España». La b) y la c) no figuran en el precepto, y la d) corresponde al artículo 32.4, donde la ampliación es potestativa («podrá determinar»).","cita":"«2. La ampliación de los plazos por el tiempo máximo permitido se aplicará en todo caso a los procedimientos tramitados por las misiones diplomáticas y oficinas consulares, así como a aquellos que, sustanciándose en el interior, exijan cumplimentar algún trámite en el extranjero o en los que intervengan interesados residentes fuera de España.»","dificultad":2},{"id":"L39-L3-005","ley":"L39","articulo":"35.2","articulo_txt":"Art. 35.2 Ley 39/2015","bloque_id":"L39|Título III. De los actos administrativos · Capítulo I. Requisitos de los actos administrativos","enunciado":"Según el artículo 35.2 de la Ley 39/2015, la motivación de los actos que pongan fin a los procedimientos selectivos y de concurrencia competitiva se realizará:","opciones":{"a":"Mediante un informe motivado del órgano de selección, que se publicará junto con la resolución en el mismo diario oficial en que se publicó la convocatoria.","b":"Conforme a lo que dispongan las normas de sus convocatorias, debiendo quedar acreditados en todo caso en el procedimiento los fundamentos de la resolución.","c":"Solo cuando lo solicite expresamente alguno de los participantes.","d":"Por remisión genérica a las bases de la convocatoria, sin necesidad de que consten en el procedimiento los fundamentos de la resolución que se adopte."},"correcta":"b","explicacion":"El artículo 35.2 remite a las normas que regulen las convocatorias, «debiendo, en todo caso, quedar acreditados en el procedimiento los fundamentos de la resolución que se adopte». La a) y la c) introducen requisitos o condiciones que el precepto no prevé, y la d) contradice la exigencia de que consten, en todo caso, esos fundamentos.","cita":"«2. La motivación de los actos que pongan fin a los procedimientos selectivos y de concurrencia competitiva se realizará de conformidad con lo que dispongan las normas que regulen sus convocatorias, debiendo, en todo caso, quedar acreditados en el procedimiento los fundamentos de la resolución que se adopte.»","dificultad":2},{"id":"L39-L3-006","ley":"L39","articulo":"36.1","articulo_txt":"Art. 36.1 Ley 39/2015","bloque_id":"L39|Título III. De los actos administrativos · Capítulo I. Requisitos de los actos administrativos","enunciado":"Según el artículo 36.1 de la Ley 39/2015, los actos administrativos se producirán:","opciones":{"a":"Por escrito a través de medios electrónicos, a menos que su naturaleza exija otra forma más adecuada de expresión y constancia.","b":"Por escrito, en papel o por medios electrónicos, a elección del órgano que los dicte.","c":"Por escrito en soporte papel, salvo que el interesado esté obligado a relacionarse electrónicamente con la Administración.","d":"Por escrito a través de medios electrónicos, salvo que el interesado no esté obligado a relacionarse electrónicamente con la Administración."},"correcta":"a","explicacion":"El artículo 36.1 establece que los actos se producirán «por escrito a través de medios electrónicos, a menos que su naturaleza exija otra forma más adecuada de expresión y constancia». La excepción depende de la naturaleza del acto, no de la elección del órgano, como dice la b), ni de que el interesado esté o no obligado a relacionarse electrónicamente, como dicen la c) y la d).","cita":"«1. Los actos administrativos se producirán por escrito a través de medios electrónicos, a menos que su naturaleza exija otra forma más adecuada de expresión y constancia.»","dificultad":1},{"id":"L39-L3-013","ley":"L39","articulo":"39.3","articulo_txt":"Art. 39.3 Ley 39/2015","bloque_id":"L39|Título III. De los actos administrativos · Capítulo II. Eficacia de los actos","enunciado":"Según el artículo 39.3 de la Ley 39/2015, excepcionalmente podrá otorgarse eficacia retroactiva a los actos que produzcan efectos favorables al interesado, siempre que:","opciones":{"a":"Lo solicite expresamente el interesado y lo autorice el superior jerárquico del órgano que dicte el acto.","b":"No hayan transcurrido más de cuatro años desde la fecha a que se retrotraiga la eficacia del acto.","c":"Los supuestos de hecho necesarios existieran ya en la fecha a que se retrotraiga la eficacia del acto y ésta no lesione derechos o intereses legítimos de otras personas.","d":"Los supuestos de hecho necesarios existieran ya en la fecha a que se retrotraiga la eficacia del acto, aunque ésta lesione derechos de otras personas."},"correcta":"c","explicacion":"El artículo 39.3 exige que «los supuestos de hecho necesarios existieran ya en la fecha a que se retrotraiga la eficacia del acto y ésta no lesione derechos o intereses legítimos de otras personas». La a) y la b) añaden requisitos que el precepto no contiene, y la d) omite la exigencia de no lesionar derechos de terceros.","cita":"«3. Excepcionalmente, podrá otorgarse eficacia retroactiva a los actos cuando se dicten en sustitución de actos anulados, así como cuando produzcan efectos favorables al interesado, siempre que los supuestos de hecho necesarios existieran ya en la fecha a que se retrotraiga la eficacia del acto y ésta no lesione derechos o intereses legítimos de otras personas.»","dificultad":2},{"id":"L39-L3-022","ley":"L39","articulo":"41.6","articulo_txt":"Art. 41.6 Ley 39/2015","bloque_id":"L39|Título III. De los actos administrativos · Capítulo II. Eficacia de los actos","enunciado":"Según el artículo 41.6 de la Ley 39/2015, la falta de práctica del aviso que las Administraciones deben enviar al dispositivo electrónico y/o a la dirección de correo electrónico comunicados por el interesado:","opciones":{"a":"Determinará la nulidad de la notificación.","b":"Obligará a repetir la notificación en papel.","c":"Suspenderá el cómputo de los plazos hasta que el aviso se practique.","d":"No impedirá que la notificación sea considerada plenamente válida."},"correcta":"d","explicacion":"El artículo 41.6 dispone que «La falta de práctica de este aviso no impedirá que la notificación sea considerada plenamente válida». Por eso no hay nulidad (a), ni obligación de repetir la notificación (b), ni suspensión de plazos (c).","cita":"«La falta de práctica de este aviso no impedirá que la notificación sea considerada plenamente válida.»","dificultad":1},{"id":"L39-L3-041","ley":"L39","articulo":"48.2","articulo_txt":"Art. 48.2 Ley 39/2015","bloque_id":"L39|Título III. De los actos administrativos · Capítulo III. Nulidad y anulabilidad","enunciado":"Según el artículo 48.2 de la Ley 39/2015, el defecto de forma sólo determinará la anulabilidad cuando:","opciones":{"a":"Así lo aprecie el órgano que dictó el acto, atendiendo a la gravedad del defecto y a su incidencia en la resolución final.","b":"El defecto afecte a la motivación del acto, en todo caso, aunque no dé lugar a la indefensión de los interesados.","c":"El acto carezca de los requisitos formales indispensables para alcanzar su fin o cause indefensión a los interesados.","d":"El interesado lo alegue dentro del plazo para recurrir."},"correcta":"c","explicacion":"El artículo 48.2 limita la anulabilidad por defecto de forma a los casos en que el acto «carezca de los requisitos formales indispensables para alcanzar su fin o dé lugar a la indefensión de los interesados». La a), la b) y la d) introducen criterios que el precepto no recoge.","cita":"«2. No obstante, el defecto de forma sólo determinará la anulabilidad cuando el acto carezca de los requisitos formales indispensables para alcanzar su fin o dé lugar a la indefensión de los interesados.»","dificultad":2},{"id":"L39-L9-016","ley":"L39","articulo":"49.1","articulo_txt":"Art. 49.1 Ley 39/2015","bloque_id":"L39|Título III. De los actos administrativos · Capítulo III. Nulidad y anulabilidad","enunciado":"Según el artículo 49.1 de la Ley 39/2015, la nulidad o anulabilidad de un acto, respecto de los actos sucesivos en el procedimiento:","opciones":{"a":"Implicará siempre la de todos ellos, por traer causa del acto viciado.","b":"No implicará la de los que sean independientes del primero.","c":"Implicará la de los que haya dictado el mismo órgano que dictó el acto viciado.","d":"No implicará la de los que sean independientes del primero, salvo que el vicio sea determinante de nulidad de pleno derecho."},"correcta":"b","explicacion":"El art. 49.1 dispone que la nulidad o anulabilidad de un acto «no implicará la de los sucesivos en el procedimiento que sean independientes del primero». La opción a) extiende siempre la invalidez y la opción c) la hace depender del órgano que dictó los actos. La opción d) añade una excepción para la nulidad de pleno derecho que el precepto no contiene: la regla se aplica por igual a la nulidad y a la anulabilidad.","cita":"«1. La nulidad o anulabilidad de un acto no implicará la de los sucesivos en el procedimiento que sean independientes del primero.»","dificultad":1},{"id":"L39-L4-002","ley":"L39","articulo":"53.1.a","articulo_txt":"Art. 53.1.a Ley 39/2015","bloque_id":"L39|Título IV. De las disposiciones sobre el procedimiento administrativo común · Capítulo I. Garantías del procedimiento","enunciado":"Según el artículo 53.1.a) de la Ley 39/2015, la obligación de la Administración de facilitar copias de los documentos contenidos en los procedimientos se entenderá cumplida:","opciones":{"a":"Mediante su remisión a la dirección de correo electrónico que haya facilitado el interesado.","b":"Mediante la puesta a disposición de las copias en el Punto de Acceso General electrónico de la Administración competente o en las sedes electrónicas que correspondan.","c":"Únicamente mediante su entrega en una oficina de asistencia en materia de registros.","d":"Mediante su publicación en el Tablón Edictal Único."},"correcta":"b","explicacion":"El segundo párrafo del artículo 53.1.a) dispone que esa obligación se entiende cumplida «mediante la puesta a disposición de las mismas en el Punto de Acceso General electrónico de la Administración competente o en las sedes electrónicas que correspondan». Ni el envío al correo electrónico (a), ni la entrega exclusiva en una oficina de asistencia en materia de registros (c), ni la publicación en el Tablón Edictal Único (d) aparecen en el precepto.","cita":"«Se entenderá cumplida la obligación de la Administración de facilitar copias de los documentos contenidos en los procedimientos mediante la puesta a disposición de las mismas en el Punto de Acceso General electrónico de la Administración competente o en las sedes electrónicas que correspondan.»","dificultad":2},{"id":"L39-L4-006","ley":"L39","articulo":"53.2.a","articulo_txt":"Art. 53.2.a Ley 39/2015","bloque_id":"L39|Título IV. De las disposiciones sobre el procedimiento administrativo común · Capítulo I. Garantías del procedimiento","enunciado":"Según el artículo 53.2.a) de la Ley 39/2015, en los procedimientos de naturaleza sancionadora el presunto responsable tiene derecho a ser notificado de varios extremos. ¿Cuál de los siguientes NO figura entre ellos?","opciones":{"a":"La identidad del instructor.","b":"La identidad del denunciante.","c":"La autoridad competente para imponer la sanción.","d":"La norma que atribuya la competencia para imponer la sanción."},"correcta":"b","explicacion":"El artículo 53.2.a) incluye los hechos imputados, las infracciones y las posibles sanciones, así como «la identidad del instructor, de la autoridad competente para imponer la sanción y de la norma que atribuya tal competencia», pero no la identidad del denunciante. Por eso la a), la c) y la d) sí figuran y la b) es la respuesta.","cita":"«a) A ser notificado de los hechos que se le imputen, de las infracciones que tales hechos puedan constituir y de las sanciones que, en su caso, se les pudieran imponer, así como de la identidad del instructor, de la autoridad competente para imponer la sanción y de la norma que atribuya tal competencia.»","dificultad":2},{"id":"L39-L4-008","ley":"L39","articulo":"55.1","articulo_txt":"Art. 55.1 Ley 39/2015","bloque_id":"L39|Título IV. De las disposiciones sobre el procedimiento administrativo común · Capítulo II. Iniciación del procedimiento","enunciado":"Según el artículo 55.1 de la Ley 39/2015, con anterioridad al inicio del procedimiento, el órgano competente podrá abrir un período de información o actuaciones previas con el fin de:","opciones":{"a":"Conocer las circunstancias del caso concreto y la conveniencia o no de iniciar el procedimiento.","b":"Adoptar las medidas provisionales necesarias para asegurar la eficacia de la resolución.","c":"Dar audiencia a los posibles interesados antes de acordar la iniciación.","d":"Fijar la cuantía de la sanción o de la indemnización que pudiera corresponder."},"correcta":"a","explicacion":"El artículo 55.1 permite abrir ese período «con el fin de conocer las circunstancias del caso concreto y la conveniencia o no de iniciar el procedimiento». Las medidas provisionales (b) se regulan en el artículo 56, y ni la audiencia a los interesados (c) ni la fijación de sanciones o indemnizaciones (d) son finalidades de las actuaciones previas según el artículo 55.","cita":"«1. Con anterioridad al inicio del procedimiento, el órgano competente podrá abrir un período de información o actuaciones previas con el fin de conocer las circunstancias del caso concreto y la conveniencia o no de iniciar el procedimiento.»","dificultad":1},{"id":"L39-L4-029","ley":"L39","articulo":"64.1","articulo_txt":"Art. 64.1 Ley 39/2015","bloque_id":"L39|Título IV. De las disposiciones sobre el procedimiento administrativo común · Capítulo II. Iniciación del procedimiento","enunciado":"Según el artículo 64.1 de la Ley 39/2015, la incoación del procedimiento sancionador se comunicará al denunciante:","opciones":{"a":"En todo caso, junto con la notificación al inculpado.","b":"Cuando las normas reguladoras del procedimiento así lo prevean.","c":"Solo cuando lo haya solicitado expresamente en su denuncia.","d":"Una vez que se haya dictado la resolución que ponga fin al procedimiento."},"correcta":"b","explicacion":"El artículo 64.1 dispone que «la incoación se comunicará al denunciante cuando las normas reguladoras del procedimiento así lo prevean». A diferencia de la notificación a los interesados, entre ellos el inculpado, esta comunicación no se produce en todo caso (a), no depende de que la pida el denunciante (c) ni se aplaza a la resolución final (d).","cita":"«Asimismo, la incoación se comunicará al denunciante cuando las normas reguladoras del procedimiento así lo prevean.»","dificultad":2},{"id":"L39-L5-003","ley":"L39","articulo":"71.1","articulo_txt":"Art. 71.1 Ley 39/2015","bloque_id":"L39|Título IV. De las disposiciones sobre el procedimiento administrativo común · Capítulo III. Ordenación del procedimiento","enunciado":"Según el artículo 71.1 de la Ley 39/2015, el procedimiento, sometido al principio de celeridad, se impulsará:","opciones":{"a":"A instancia de los interesados en todos sus trámites, salvo en los procedimientos iniciados de oficio.","b":"De oficio únicamente en los procedimientos iniciados de oficio, y a instancia de parte en los demás.","c":"De oficio en todos sus trámites y a través de medios electrónicos, respetando los principios de transparencia y publicidad.","d":"De oficio en sus trámites esenciales y a instancia de los interesados en los restantes."},"correcta":"c","explicacion":"El artículo 71.1 dispone que el procedimiento «se impulsará de oficio en todos sus trámites y a través de medios electrónicos, respetando los principios de transparencia y publicidad». El impulso de oficio alcanza a todos los trámites, cualquiera que sea la forma de iniciación, por lo que fallan las opciones a), b) y d).","cita":"«El procedimiento, sometido al principio de celeridad, se impulsará de oficio en todos sus trámites y a través de medios electrónicos, respetando los principios de transparencia y publicidad.»","dificultad":1},{"id":"L39-L5-009","ley":"L39","articulo":"73.2","articulo_txt":"Art. 73.2 Ley 39/2015","bloque_id":"L39|Título IV. De las disposiciones sobre el procedimiento administrativo común · Capítulo III. Ordenación del procedimiento","enunciado":"Según el artículo 73.2 de la Ley 39/2015, cuando la Administración considere, en cualquier momento del procedimiento, que alguno de los actos de los interesados no reúne los requisitos necesarios:","opciones":{"a":"Lo pondrá en conocimiento de su autor y le concederá un plazo para cumplimentarlo.","b":"Lo inadmitirá sin más trámite mediante resolución motivada.","c":"Lo tendrá por no realizado y continuará la tramitación sin tenerlo en cuenta.","d":"Lo completará de oficio, sin necesidad de comunicarlo a su autor."},"correcta":"a","explicacion":"El artículo 73.2 dispone que la Administración «lo pondrá en conocimiento de su autor, concediéndole un plazo de diez días para cumplimentarlo». No cabe, por tanto, inadmitirlo sin más (opción b), tenerlo directamente por no realizado (opción c) ni completarlo de oficio sin comunicarlo (opción d).","cita":"«En cualquier momento del procedimiento, cuando la Administración considere que alguno de los actos de los interesados no reúne los requisitos necesarios, lo pondrá en conocimiento de su autor, concediéndole un plazo de diez días para cumplimentarlo.»","dificultad":1},{"id":"L39-L5-014","ley":"L39","articulo":"76.1","articulo_txt":"Art. 76.1 Ley 39/2015","bloque_id":"L39|Título IV. De las disposiciones sobre el procedimiento administrativo común · Capítulo IV. Instrucción del procedimiento · Sección 1.ª Disposiciones generales","enunciado":"Según el artículo 76.1 de la Ley 39/2015, los interesados podrán aducir alegaciones y aportar documentos u otros elementos de juicio:","opciones":{"a":"Únicamente dentro de los diez días siguientes a la notificación del acuerdo de iniciación.","b":"En cualquier momento del procedimiento anterior al trámite de audiencia.","c":"En cualquier momento anterior a la resolución que ponga fin al procedimiento.","d":"Únicamente durante el período de prueba."},"correcta":"b","explicacion":"El artículo 76.1 permite aducir alegaciones y aportar documentos «en cualquier momento del procedimiento anterior al trámite de audiencia». La opción a) y la d) restringen indebidamente ese momento, y la c) lo extiende hasta la resolución.","cita":"«Los interesados podrán, en cualquier momento del procedimiento anterior al trámite de audiencia, aducir alegaciones y aportar documentos u otros elementos de juicio.»","dificultad":1},{"id":"L39-L9-021","ley":"L39","articulo":"77.4","articulo_txt":"Art. 77.4 Ley 39/2015","bloque_id":"L39|Título IV. De las disposiciones sobre el procedimiento administrativo común · Capítulo IV. Instrucción del procedimiento · Sección 2.ª Prueba","enunciado":"Según el artículo 77.4 de la Ley 39/2015, en los procedimientos de carácter sancionador, los hechos declarados probados por resoluciones judiciales penales firmes:","opciones":{"a":"Vincularán a las Administraciones Públicas respecto de los procedimientos sancionadores que substancien.","b":"Podrán ser tenidos en cuenta por las Administraciones Públicas, sin que las vinculen.","c":"Vincularán a las Administraciones Públicas si el interesado los invoca en el trámite de audiencia.","d":"Vincularán a las Administraciones Públicas únicamente cuando la sentencia sea condenatoria."},"correcta":"a","explicacion":"El art. 77.4 dispone que esos hechos «vincularán a las Administraciones Públicas respecto de los procedimientos sancionadores que substancien». La opción b) niega esa vinculación, y las opciones c) y d) la condicionan a la invocación por el interesado o al sentido de la sentencia, requisitos que el precepto no establece.","cita":"«4. En los procedimientos de carácter sancionador, los hechos declarados probados por resoluciones judiciales penales firmes vincularán a las Administraciones Públicas respecto de los procedimientos sancionadores que substancien.»","dificultad":1},{"id":"L39-L9-023","ley":"L39","articulo":"81.1","articulo_txt":"Art. 81.1 Ley 39/2015","bloque_id":"L39|Título IV. De las disposiciones sobre el procedimiento administrativo común · Capítulo IV. Instrucción del procedimiento · Sección 3.ª Informes","enunciado":"Según el artículo 81.1 de la Ley 39/2015, en los procedimientos de responsabilidad patrimonial será preceptivo solicitar informe al servicio cuyo funcionamiento haya ocasionado la presunta lesión indemnizable, y el plazo para su emisión no podrá exceder de:","opciones":{"a":"Cinco días.","b":"Quince días.","c":"Un mes.","d":"Diez días."},"correcta":"d","explicacion":"El art. 81.1 dispone que el plazo de emisión de ese informe no podrá «exceder de diez días»: opción d). Los plazos de cinco días, quince días y un mes de las opciones a), b) y c) no son los que fija el precepto.","cita":"«1. En el caso de los procedimientos de responsabilidad patrimonial será preceptivo solicitar informe al servicio cuyo funcionamiento haya ocasionado la presunta lesión indemnizable, no pudiendo exceder de diez días el plazo de su emisión.»","dificultad":2},{"id":"L39-L5-032","ley":"L39","articulo":"82.2","articulo_txt":"Art. 82.2 Ley 39/2015","bloque_id":"L39|Título IV. De las disposiciones sobre el procedimiento administrativo común · Capítulo IV. Instrucción del procedimiento · Sección 4.ª Participación de los interesados","enunciado":"Según el artículo 82.2 de la Ley 39/2015, en el trámite de audiencia los interesados podrán alegar y presentar los documentos y justificaciones que estimen pertinentes en un plazo:","opciones":{"a":"No inferior a cinco días ni superior a diez.","b":"No inferior a diez días ni superior a quince.","c":"No inferior a diez días ni superior a veinte.","d":"No inferior a quince días ni superior a treinta."},"correcta":"b","explicacion":"El artículo 82.2 fija para la audiencia un plazo «no inferior a diez días ni superior a quince». Los límites de las opciones a), c) y d) no son los del precepto.","cita":"«Los interesados, en un plazo no inferior a diez días ni superior a quince, podrán alegar y presentar los documentos y justificaciones que estimen pertinentes.»","dificultad":2},{"id":"L39-L5-043","ley":"L39","articulo":"85.3","articulo_txt":"Art. 85.3 Ley 39/2015","bloque_id":"L39|Título IV. De las disposiciones sobre el procedimiento administrativo común · Capítulo V. Finalización del procedimiento · Sección 1.ª Disposiciones generales","enunciado":"Según el artículo 85.3 de la Ley 39/2015, la efectividad de las reducciones sobre el importe de la sanción propuesta estará condicionada:","opciones":{"a":"Al desistimiento o renuncia de cualquier acción o recurso, tanto en vía administrativa como en vía contencioso-administrativa, contra la sanción.","b":"A que el infractor no haya sido sancionado por la misma infracción en el año anterior.","c":"A que el importe se abone dentro de los quince días siguientes a la notificación de la resolución.","d":"Al desistimiento o renuncia de cualquier acción o recurso en vía administrativa contra la sanción."},"correcta":"d","explicacion":"El artículo 85.3 dispone que la efectividad de las reducciones «estará condicionada al desistimiento o renuncia de cualquier acción o recurso en vía administrativa contra la sanción». La opción a) extiende indebidamente esa renuncia a la vía contencioso-administrativa, y las condiciones de las opciones b) y c) no figuran en el precepto.","cita":"«Las citadas reducciones, deberán estar determinadas en la notificación de iniciación del procedimiento y su efectividad estará condicionada al desistimiento o renuncia de cualquier acción o recurso en vía administrativa contra la sanción.»","dificultad":2},{"id":"L39-L6-013","ley":"L39","articulo":"91.3","articulo_txt":"Art. 91.3 Ley 39/2015","bloque_id":"L39|Título IV. De las disposiciones sobre el procedimiento administrativo común · Capítulo V. Finalización del procedimiento · Sección 2.ª Resolución","enunciado":"Según el artículo 91.3 de la Ley 39/2015, si en un procedimiento de responsabilidad patrimonial no ha recaído ni se ha notificado resolución expresa ni, en su caso, se ha formalizado el acuerdo:","opciones":{"a":"Transcurridos tres meses desde que se inició el procedimiento, podrá entenderse que la resolución es contraria a la indemnización del particular.","b":"Transcurridos seis meses desde que se inició el procedimiento, podrá entenderse que la resolución es contraria a la indemnización del particular.","c":"Transcurridos seis meses desde que se inició el procedimiento, podrá entenderse que la resolución es favorable a la indemnización solicitada por el particular.","d":"Transcurrido un año desde que se inició el procedimiento, se producirá su caducidad."},"correcta":"b","explicacion":"El artículo 91.3 establece que, «Transcurridos seis meses desde que se inició el procedimiento» sin resolución expresa notificada ni acuerdo formalizado, «podrá entenderse que la resolución es contraria a la indemnización del particular». El plazo no es de tres meses (opción a), el sentido no es favorable (opción c) y el precepto no prevé la caducidad (opción d).","cita":"«3. Transcurridos seis meses desde que se inició el procedimiento sin que haya recaído y se notifique resolución expresa o, en su caso, se haya formalizado el acuerdo, podrá entenderse que la resolución es contraria a la indemnización del particular.»","dificultad":2},{"id":"L39-L6-017","ley":"L39","articulo":"94.1","articulo_txt":"Art. 94.1 Ley 39/2015","bloque_id":"L39|Título IV. De las disposiciones sobre el procedimiento administrativo común · Capítulo V. Finalización del procedimiento · Sección 3.ª Desistimiento y renuncia","enunciado":"Según el artículo 94.1 de la Ley 39/2015, todo interesado podrá:","opciones":{"a":"Desistir de su solicitud o, cuando ello no esté prohibido por el ordenamiento jurídico, renunciar a sus derechos.","b":"Renunciar a sus derechos o, cuando ello no esté prohibido por el ordenamiento jurídico, desistir de su solicitud.","c":"Desistir de su solicitud y renunciar a sus derechos en cualquier caso, sin limitación alguna.","d":"Desistir de su solicitud únicamente con la conformidad de la Administración, y renunciar a sus derechos cuando lo autorice una ley."},"correcta":"a","explicacion":"El artículo 94.1 establece que «Todo interesado podrá desistir de su solicitud o, cuando ello no esté prohibido por el ordenamiento jurídico, renunciar a sus derechos»: la salvedad se aplica a la renuncia, no al desistimiento. La opción b) invierte los términos, la opción c) omite el límite de la renuncia y la opción d) añade requisitos que el precepto no contempla.","cita":"«1. Todo interesado podrá desistir de su solicitud o, cuando ello no esté prohibido por el ordenamiento jurídico, renunciar a sus derechos.»","dificultad":1},{"id":"L39-L6-024","ley":"L39","articulo":"95.3","articulo_txt":"Art. 95.3 Ley 39/2015","bloque_id":"L39|Título IV. De las disposiciones sobre el procedimiento administrativo común · Capítulo V. Finalización del procedimiento · Sección 4.ª Caducidad","enunciado":"Según el artículo 95.3 de la Ley 39/2015, cuando tras la caducidad de un procedimiento se inicie uno nuevo, ¿qué trámites deberán cumplimentarse en todo caso en este último?","opciones":{"a":"Únicamente el trámite de audiencia al interesado.","b":"Los de información pública y audiencia al interesado.","c":"Todos los actos y trámites del procedimiento caducado, sin que pueda incorporarse ninguno de ellos.","d":"Los de alegaciones, proposición de prueba y audiencia al interesado."},"correcta":"d","explicacion":"El segundo párrafo del artículo 95.3 permite incorporar al nuevo procedimiento «los actos y trámites cuyo contenido se hubiera mantenido igual de no haberse producido la caducidad», pero exige que, en todo caso, se cumplimenten «los trámites de alegaciones, proposición de prueba y audiencia al interesado». Las opciones a) y b) no recogen esos tres trámites, y la opción c) contradice la posibilidad de incorporación.","cita":"«En los casos en los que sea posible la iniciación de un nuevo procedimiento por no haberse producido la prescripción, podrán incorporarse a éste los actos y trámites cuyo contenido se hubiera mantenido igual de no haberse producido la caducidad. En todo caso, en el nuevo procedimiento deberán cumplimentarse los trámites de alegaciones, proposición de prueba y audiencia al interesado.»","dificultad":2},{"id":"L39-L6-029","ley":"L39","articulo":"96.6","articulo_txt":"Art. 96.6 Ley 39/2015","bloque_id":"L39|Título IV. De las disposiciones sobre el procedimiento administrativo común · Capítulo VI. De la tramitación simplificada del procedimiento administrativo común","enunciado":"Según el artículo 96.6 de la Ley 39/2015, salvo que reste menos para su tramitación ordinaria, los procedimientos administrativos tramitados de manera simplificada deberán ser resueltos en:","opciones":{"a":"Treinta días, a contar desde la fecha del acuerdo de iniciación del procedimiento.","b":"Treinta días, a contar desde el siguiente al que se notifique al interesado el acuerdo de tramitación simplificada del procedimiento.","c":"Veinte días, a contar desde el siguiente al que se notifique al interesado el acuerdo de tramitación simplificada del procedimiento.","d":"Un mes, a contar desde la presentación de la solicitud del interesado."},"correcta":"b","explicacion":"El artículo 96.6 dispone que estos procedimientos «deberán ser resueltos en treinta días, a contar desde el siguiente al que se notifique al interesado el acuerdo de tramitación simplificada del procedimiento». La opción a) yerra en el día inicial del cómputo, la opción c) en la duración del plazo y la opción d) en ambos extremos.","cita":"«6. Salvo que reste menos para su tramitación ordinaria, los procedimientos administrativos tramitados de manera simplificada deberán ser resueltos en treinta días, a contar desde el siguiente al que se notifique al interesado el acuerdo de tramitación simplificada del procedimiento, y constarán únicamente de los siguientes trámites: (…)»","dificultad":2},{"id":"L39-L6-033","ley":"L39","articulo":"98.1","articulo_txt":"Art. 98.1 Ley 39/2015","bloque_id":"L39|Título IV. De las disposiciones sobre el procedimiento administrativo común · Capítulo VII. Ejecución","enunciado":"Según el artículo 98.1 de la Ley 39/2015, los actos de las Administraciones Públicas sujetos al Derecho Administrativo serán inmediatamente ejecutivos, salvo en determinados supuestos. ¿Cuál de los siguientes NO figura entre ellos?","opciones":{"a":"Que se interponga recurso contencioso-administrativo.","b":"Que se produzca la suspensión de la ejecución del acto.","c":"Que una disposición establezca lo contrario.","d":"Que se necesite aprobación o autorización superior."},"correcta":"a","explicacion":"El artículo 98.1 exceptúa de la ejecutividad inmediata los supuestos en que «Se produzca la suspensión de la ejecución del acto» (opción b), «Una disposición establezca lo contrario» (opción c) o «Se necesite aprobación o autorización superior» (opción d), además de ciertas resoluciones sancionadoras. La mera interposición de un recurso contencioso-administrativo no figura entre las excepciones.","cita":"«1. Los actos de las Administraciones Públicas sujetos al Derecho Administrativo serán inmediatamente ejecutivos, salvo que: a) Se produzca la suspensión de la ejecución del acto. b) Se trate de una resolución de un procedimiento de naturaleza sancionadora contra la que quepa algún recurso en vía administrativa, incluido el potestativo de reposición. c) Una disposición establezca lo contrario. d) Se necesite aprobación o autorización superior.»","dificultad":2},{"id":"L39-L7-015","ley":"L39","articulo":"111.b)","articulo_txt":"Art. 111.b) Ley 39/2015","bloque_id":"L39|Título V. De la revisión de los actos en vía administrativa · Capítulo I. Revisión de oficio","enunciado":"Según el artículo 111 de la Ley 39/2015, en la Administración General del Estado, la revisión de oficio de los actos y disposiciones dictados por los órganos directivos dependientes de una Secretaría de Estado corresponde a:","opciones":{"a":"El Secretario de Estado del que dependan.","b":"El Ministro del Departamento.","c":"El Subsecretario del Departamento.","d":"El Secretario General Técnico."},"correcta":"a","explicacion":"El art. 111.b).2.º atribuye la competencia a «Los Secretarios de Estado, respecto de los actos y disposiciones dictados por los órganos directivos de ellos dependientes». Al Ministro (opción b) le corresponde la revisión de los actos de los Secretarios de Estado y de los órganos directivos no dependientes de una Secretaría de Estado; el Subsecretario (opción c) y el Secretario General Técnico (opción d) no figuran en el precepto.","cita":"«b) En la Administración General del Estado: 1.º Los Ministros, respecto de los actos y disposiciones de los Secretarios de Estado y de los dictados por órganos directivos de su Departamento no dependientes de una Secretaría de Estado. 2.º Los Secretarios de Estado, respecto de los actos y disposiciones dictados por los órganos directivos de ellos dependientes.»","dificultad":2},{"id":"L39-L7-031","ley":"L39","articulo":"119.2","articulo_txt":"Art. 119.2 Ley 39/2015","bloque_id":"L39|Título V. De la revisión de los actos en vía administrativa · Capítulo II. Recursos administrativos · Sección 1.ª Principios generales","enunciado":"Según el artículo 119.2 de la Ley 39/2015, cuando existiendo vicio de forma no se estime procedente resolver sobre el fondo del recurso:","opciones":{"a":"Se ordenará la retroacción del procedimiento al momento de su iniciación.","b":"Se declarará la inadmisión del recurso por defecto de forma.","c":"Se ordenará la retroacción del procedimiento al momento en el que el vicio fue cometido.","d":"Se estimará el recurso y se declarará la nulidad de todas las actuaciones."},"correcta":"c","explicacion":"El art. 119.2 dispone que en ese caso «se ordenará la retroacción del procedimiento al momento en el que el vicio fue cometido», sin perjuicio de la posible convalidación conforme al art. 52. No se retrotrae al inicio (opción a), no se inadmite el recurso (opción b) ni se anulan todas las actuaciones (opción d).","cita":"«2. Cuando existiendo vicio de forma no se estime procedente resolver sobre el fondo se ordenará la retroacción del procedimiento al momento en el que el vicio fue cometido, sin perjuicio de que eventualmente pueda acordarse la convalidación de actuaciones por el órgano competente para ello, de acuerdo con lo dispuesto en el artículo 52.»","dificultad":2},{"id":"L39-L7-034","ley":"L39","articulo":"121.1","articulo_txt":"Art. 121.1 Ley 39/2015","bloque_id":"L39|Título V. De la revisión de los actos en vía administrativa · Capítulo II. Recursos administrativos · Sección 2.ª Recurso de alzada","enunciado":"Según el artículo 121.1 de la Ley 39/2015, a efectos del recurso de alzada, los Tribunales y órganos de selección del personal al servicio de las Administraciones Públicas se considerarán dependientes:","opciones":{"a":"Del órgano que haya convocado el proceso selectivo o, en su defecto, del Ministro del ramo.","b":"Del órgano que haya nombrado a sus vocales o, en su defecto, del Subsecretario del Departamento.","c":"Del órgano al que estén adscritos o, en su defecto, del que haya nombrado a su presidente.","d":"Del órgano competente en materia de función pública de la Administración que los haya convocado."},"correcta":"c","explicacion":"El art. 121.1 dispone que esos órganos «se considerarán dependientes del órgano al que estén adscritos o, en su defecto, del que haya nombrado al presidente de los mismos». Las opciones a), b) y d) sustituyen esos criterios por otros que el precepto no recoge.","cita":"«(…) A estos efectos, los Tribunales y órganos de selección del personal al servicio de las Administraciones Públicas y cualesquiera otros que, en el seno de éstas, actúen con autonomía funcional, se considerarán dependientes del órgano al que estén adscritos o, en su defecto, del que haya nombrado al presidente de los mismos.»","dificultad":2},{"id":"L39-L7-043","ley":"L39","articulo":"124.2","articulo_txt":"Art. 124.2 Ley 39/2015","bloque_id":"L39|Título V. De la revisión de los actos en vía administrativa · Capítulo II. Recursos administrativos · Sección 3.ª Recurso potestativo de reposición","enunciado":"Según el artículo 124.2 de la Ley 39/2015, el plazo máximo para dictar y notificar la resolución del recurso de reposición será de:","opciones":{"a":"Diez días.","b":"Un mes.","c":"Quince días.","d":"Tres meses."},"correcta":"b","explicacion":"El art. 124.2 dispone que «El plazo máximo para dictar y notificar la resolución del recurso será de un mes». Los plazos de diez (opción a) y quince días (opción c) no figuran en el precepto, y el de tres meses (opción d) es el que el art. 122.2 fija para resolver la alzada.","cita":"«2. El plazo máximo para dictar y notificar la resolución del recurso será de un mes.»","dificultad":1},{"id":"L39-L7-044","ley":"L39","articulo":"125.1","articulo_txt":"Art. 125.1 Ley 39/2015","bloque_id":"L39|Título V. De la revisión de los actos en vía administrativa · Capítulo II. Recursos administrativos · Sección 4.ª Recurso extraordinario de revisión","enunciado":"Según el artículo 125.1 de la Ley 39/2015, el recurso extraordinario de revisión se interpondrá:","opciones":{"a":"Ante el superior jerárquico del que dictó el acto, que también lo será para su resolución.","b":"Ante el órgano que dictó el acto, correspondiendo su resolución al superior jerárquico.","c":"Ante el órgano que dictó el acto, que también será el competente para su resolución.","d":"Ante el Consejo de Estado u órgano consultivo equivalente, que será quien lo resuelva."},"correcta":"c","explicacion":"El art. 125.1 dispone que el recurso se interpondrá «ante el órgano administrativo que los dictó, que también será el competente para su resolución». No se interpone ante el superior jerárquico (opción a), ni lo resuelve este (opción b), ni el Consejo de Estado (opción d).","cita":"«1. Contra los actos firmes en vía administrativa podrá interponerse el recurso extraordinario de revisión ante el órgano administrativo que los dictó, que también será el competente para su resolución, cuando concurra alguna de las circunstancias siguientes: (…)»","dificultad":2},{"id":"L39-L8-004","ley":"L39","articulo":"128.2","articulo_txt":"Art. 128.2 Ley 39/2015","bloque_id":"L39|Título VI. De la iniciativa legislativa y de la potestad para dictar reglamentos y otras disposiciones","enunciado":"Según el artículo 128.2 de la Ley 39/2015, sin perjuicio de su función de desarrollo o colaboración con respecto a la ley, los reglamentos y disposiciones administrativas:","opciones":{"a":"No podrán tipificar infracciones administrativas ni establecer sanciones.","b":"Podrán tipificar infracciones administrativas y establecer sanciones, pero no delitos ni penas.","c":"Podrán establecer tributos y exacciones parafiscales, pero no prestaciones personales.","d":"Podrán establecer prestaciones patrimoniales de carácter público, pero no tributos."},"correcta":"a","explicacion":"El art. 128.2 dispone que los reglamentos y disposiciones administrativas «no podrán tipificar delitos, faltas o infracciones administrativas, establecer penas o sanciones», ni tampoco tributos, exacciones parafiscales u otras cargas o prestaciones personales o patrimoniales de carácter público. Por eso son falsas las opciones b), c) y d), que admiten alguna de esas figuras.","cita":"«Sin perjuicio de su función de desarrollo o colaboración con respecto a la ley, no podrán tipificar delitos, faltas o infracciones administrativas, establecer penas o sanciones, así como tributos, exacciones parafiscales u otras cargas o prestaciones personales o patrimoniales de carácter público.»","dificultad":2},{"id":"L39-L8-030","ley":"L39","articulo":"DA 6ª.1","articulo_txt":"DA 6ª.1 · Ley 39/2015","bloque_id":"L39|Disposiciones adicionales","enunciado":"Según la disposición adicional sexta de la Ley 39/2015, en las relaciones de los interesados con los sujetos sometidos a su ámbito de aplicación, los sistemas de identificación basados en tecnologías de registro distribuido:","opciones":{"a":"Serán admisibles previa autorización expresa del Consejo de Ministros en cada caso.","b":"No serán admisibles en ningún caso mientras no sean objeto de regulación específica por el Estado.","c":"Serán admisibles cuando así lo prevea la normativa de la Comunidad Autónoma competente.","d":"Serán admisibles para la identificación de los interesados, pero no para la firma."},"correcta":"b","explicacion":"La DA 6.ª.1 establece que esos sistemas, y los de firma basados en ellos, «no serán admisibles en ningún caso y, por lo tanto, no podrán ser autorizados», en tanto no sean objeto de regulación específica por el Estado en el marco del Derecho de la Unión Europea. Por eso son falsas las opciones a), c) y d), que admiten su uso en ciertos casos.","cita":"«1. No obstante lo dispuesto en los artículos 9.2 c) y 10.2 c) de la presente Ley, en las relaciones de los interesados con los sujetos sometidos al ámbito de aplicación de esta Ley, no serán admisibles en ningún caso y, por lo tanto, no podrán ser autorizados, los sistemas de identificación basados en tecnologías de registro distribuido y los sistemas de firma basados en los anteriores, en tanto que no sean objeto de regulación específica por el Estado en el marco del Derecho de la Unión Europea.»","dificultad":2},{"id":"L39-L8-034","ley":"L39","articulo":"DT 1ª.2","articulo_txt":"DT 1ª.2 · Ley 39/2015","bloque_id":"L39|Disposiciones transitorias","enunciado":"Según la disposición transitoria primera de la Ley 39/2015, siempre que sea posible, los documentos en papel asociados a procedimientos administrativos finalizados antes de la entrada en vigor de dicha Ley:","opciones":{"a":"Podrán destruirse una vez transcurridos cinco años desde su finalización.","b":"Deberán digitalizarse de acuerdo con la normativa reguladora aplicable.","c":"Deberán conservarse exclusivamente en soporte papel.","d":"Deberán remitirse al archivo histórico de la Administración correspondiente."},"correcta":"b","explicacion":"La DT 1.ª.2 dispone que esos documentos en papel «deberán digitalizarse de acuerdo con los requisitos establecidos en la normativa reguladora aplicable». La disposición no prevé su destrucción (opción a), ni su conservación exclusiva en papel (opción c), ni su remisión a un archivo histórico (opción d).","cita":"«2. Siempre que sea posible, los documentos en papel asociados a procedimientos administrativos finalizados antes de la entrada en vigor de esta Ley, deberán digitalizarse de acuerdo con los requisitos establecidos en la normativa reguladora aplicable.»","dificultad":1},{"id":"L39-L8-040","ley":"L39","articulo":"DD única.1","articulo_txt":"DD única.1 · Ley 39/2015","bloque_id":"L39|Disposición derogatoria","enunciado":"Según el apartado 1 de la disposición derogatoria única de la Ley 39/2015, quedan derogadas todas las normas de igual o inferior rango:","opciones":{"a":"Que regulen el procedimiento administrativo, aunque no se opongan a dicha Ley.","b":"Que se hubieran dictado en desarrollo de la Ley 30/1992, en todo caso.","c":"En lo que contradigan a dicha Ley, salvo las de rango reglamentario.","d":"En lo que contradigan o se opongan a lo dispuesto en dicha Ley."},"correcta":"d","explicacion":"La DD única.1 deroga las normas de igual o inferior rango «en lo que contradigan o se opongan a lo dispuesto en la presente Ley». No deroga normas que no se opongan (opción a), ni en todo caso las dictadas en desarrollo de la Ley 30/1992 (opción b), ni excluye las de rango reglamentario (opción c).","cita":"«1. Quedan derogadas todas las normas de igual o inferior rango en lo que contradigan o se opongan a lo dispuesto en la presente Ley.»","dificultad":1},{"id":"L39-L8-045","ley":"L39","articulo":"DF 7ª","articulo_txt":"DF 7ª · Ley 39/2015","bloque_id":"L39|Disposiciones finales","enunciado":"Según la disposición final séptima de la Ley 39/2015, en su redacción vigente, las previsiones relativas al registro electrónico de apoderamientos, al registro de empleados públicos habilitados y al archivo único electrónico, entre otras, producirán efectos a partir del día:","opciones":{"a":"2 de octubre de 2018.","b":"2 de octubre de 2020.","c":"2 de abril de 2020.","d":"2 de abril de 2021."},"correcta":"d","explicacion":"El segundo párrafo de la DF 7.ª, en la redacción dada por la Ley 10/2021, de 9 de julio, fija la fecha de «2 de abril de 2021»; la disposición ha sido modificada varias veces, pero las fechas de las opciones a), b) y c) no son las vigentes. Como esa fecha ya ha pasado, estas previsiones producen hoy plenamente sus efectos.","cita":"«No obstante, las previsiones relativas al registro electrónico de apoderamientos, registro electrónico, registro de empleados públicos habilitados, punto de acceso general electrónico de la Administración y archivo único electrónico producirán efectos a partir del día 2 de abril de 2021.»","dificultad":2}]};</script>
<script>
/* Letra de Ley — motor de test. Sin dependencias; funciona sin conexión.
   Necesita window.LDL_CONFIG y window.LDL_BANCO (los inyecta sistema/letradeley.py). */
(function () {
  "use strict";
  var CFG = window.LDL_CONFIG, B = window.LDL_BANCO;
  var raiz = document.getElementById("ldl");
  var LETRAS = ["a", "b", "c", "d"];
  var POR_ID = {};
  B.preguntas.forEach(function (p) { POR_ID[p.id] = p; });
  var CLAVE = "ldl1:" + CFG.pack.id;
  var prog = cargar();
  var sesion = null;
  var vista = CFG.modo === "web" ? "portada" : "inicio";
  var reloj = null;

  /* ---------- utilidades ---------- */
  function esc(t) {
    return String(t == null ? "" : t).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function barajar(lista) {
    var a = lista.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function pct(a, b) { return b ? Math.round((a / b) * 100) : 0; }
  function plural(n, uno, varios) { return n + " " + (n === 1 ? uno : varios); }
  function num(n) { return String(n).replace(".", ","); }
  function cargar() {
    try { var s = localStorage.getItem(CLAVE); if (s) { var d = JSON.parse(s); if (d && d.p) return d; } } catch (e) {}
    return { p: {}, h: [] };
  }
  function guardar() { try { localStorage.setItem(CLAVE, JSON.stringify(prog)); } catch (e) {} }
  function registrar(id, acierto) {
    var r = prog.p[id] || { v: 0, a: 0, f: 0, c: 0 };
    r.v++;
    if (acierto) { r.a++; r.c = Math.min((r.c || 0) + 1, 5); } else { r.f++; r.c = 0; }
    r.u = acierto ? 1 : 0;
    r.t = Date.now();
    prog.p[id] = r;
    guardar();
  }
  function fallosPendientes() {
    return B.preguntas.filter(function (p) { var r = prog.p[p.id]; return r && r.u === 0; });
  }
  function resumen(lista) {
    var vistas = 0, aciertos = 0, intentos = 0;
    lista.forEach(function (p) {
      var r = prog.p[p.id];
      if (r) { vistas++; aciertos += r.a; intentos += r.v; }
    });
    return { total: lista.length, vistas: vistas, acierto: pct(aciertos, intentos) };
  }
  function delBloque(id) { return B.preguntas.filter(function (p) { return p.bloque_id === id; }); }

  /* ---------- tema claro / oscuro ---------- */
  function aplicarTema() {
    var t = null;
    try { t = localStorage.getItem("ldl:tema"); } catch (e) {}
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    else document.documentElement.removeAttribute("data-theme");
    return t || "auto";
  }
  function cambiarTema() {
    var orden = { auto: "light", light: "dark", dark: "auto" };
    var actual = aplicarTema();
    try { localStorage.setItem("ldl:tema", orden[actual]); } catch (e) {}
    aplicarTema();
    pintar();
  }

  /* ---------- sesiones ---------- */
  function empezar(tipo, preguntas, opciones) {
    opciones = opciones || {};
    if (!preguntas.length) return;
    pararReloj();
    sesion = {
      tipo: tipo, titulo: opciones.titulo || "Test", ids: preguntas.map(function (p) { return p.id; }),
      i: 0, resp: {}, corregida: {}, inicio: Date.now(), limite: opciones.minutos ? opciones.minutos * 60 : 0, fin: null,
      origen: vista === "test" || vista === "resultado" ? (sesion && sesion.origen) || "inicio" : vista
    };
    vista = "test";
    if (sesion.limite) reloj = setInterval(tic, 1000);
    pintar();
    window.scrollTo(0, 0);
  }
  function tic() {
    if (!sesion || sesion.fin) return pararReloj();
    var el = document.getElementById("ldl-crono");
    var resta = sesion.limite - Math.floor((Date.now() - sesion.inicio) / 1000);
    if (resta <= 0) { terminar(); return; }
    if (el) el.textContent = mmss(resta);
  }
  function pararReloj() { if (reloj) { clearInterval(reloj); reloj = null; } }
  function mmss(s) { var m = Math.floor(s / 60), r = s % 60; return m + ":" + (r < 10 ? "0" : "") + r; }

  function responder(letra) {
    var id = sesion.ids[sesion.i];
    if (sesion.tipo === "simulacro") {
      sesion.resp[id] = sesion.resp[id] === letra ? undefined : letra;
      pintar();
      return;
    }
    if (sesion.corregida[id]) return;
    sesion.resp[id] = letra;
    sesion.corregida[id] = true;
    registrar(id, letra === POR_ID[id].correcta);
    pintar();
  }
  function siguiente() {
    if (sesion.i < sesion.ids.length - 1) { sesion.i++; pintar(); window.scrollTo(0, 0); }
    else terminar();
  }
  function anterior() { if (sesion.i > 0) { sesion.i--; pintar(); } }
  function terminar() {
    pararReloj();
    if (sesion.tipo === "simulacro") {
      sesion.ids.forEach(function (id) {
        if (sesion.resp[id]) registrar(id, sesion.resp[id] === POR_ID[id].correcta);
      });
    }
    sesion.fin = Date.now();
    var r = calcular(sesion);
    prog.h.unshift({ t: sesion.fin, tipo: sesion.tipo, n: r.total, a: r.aciertos, e: r.errores, nota: r.nota });
    prog.h = prog.h.slice(0, 50);
    guardar();
    vista = "resultado";
    pintar();
    window.scrollTo(0, 0);
  }
  function calcular(s) {
    var a = 0, e = 0, nr = 0;
    s.ids.forEach(function (id) {
      var r = s.resp[id];
      if (!r) nr++; else if (r === POR_ID[id].correcta) a++; else e++;
    });
    var pen = (CFG.simulacro && CFG.simulacro.penalizacion) || 1 / 3;
    var neta = s.tipo === "simulacro" ? a - e * pen : a;
    var nota = Math.max(0, (neta / s.ids.length) * 10);
    return { total: s.ids.length, aciertos: a, errores: e, blancos: nr, neta: neta, nota: Math.round(nota * 100) / 100 };
  }

  /* ---------- vistas ---------- */
  function cabecera() {
    var tema = aplicarTema();
    var etiquetas = { auto: "Tema: auto", light: "Tema: claro", dark: "Tema: oscuro" };
    return '<header class="ldl-top"><a class="ldl-brand" href="' + esc(CFG.web || "#") + '">' +
      '<span class="ldl-logo" aria-hidden="true">§</span><span><b>Letra de Ley</b><small>' +
      esc(CFG.pack.nombre) + "</small></span></a>" +
      '<button class="ldl-tema" data-acc="tema" type="button">' + etiquetas[tema] + "</button></header>";
  }
  function navegacion() {
    if (CFG.modo === "web") return "";
    var items = [["inicio", "Inicio"], ["temas", "Por temas"], ["simulacro", "Simulacro"], ["fallos", "Fallos"], ["stats", "Estadísticas"]];
    return '<nav class="ldl-nav" aria-label="Secciones">' + items.map(function (it) {
      var actual = vista === it[0] || (vista === "test" && sesion && sesion.origen === it[0]);
      return '<button type="button" data-acc="ir" data-v="' + it[0] + '"' + (actual ? ' aria-current="page"' : "") + ">" + it[1] + "</button>";
    }).join("") + "</nav>";
  }
  function pie() {
    return '<p class="ldl-pie">Letra de Ley · ' + esc(CFG.pack.edicion) + " · Texto legal actualizado a " +
      esc(CFG.pack.actualizado) + "<br>Uso personal. Prohibida su redistribución.</p>";
  }

  function vInicio() {
    var r = resumen(B.preguntas), f = fallosPendientes().length;
    return '<section class="ldl-card"><h2>' + esc(CFG.pack.nombre) + "</h2>" +
      '<p class="ldl-muted">' + B.preguntas.length + " preguntas comentadas, con el artículo exacto de cada respuesta.</p>" +
      '<div class="ldl-kpis"><div class="ldl-kpi"><b>' + r.vistas + "/" + r.total + "</b><span>respondidas</span></div>" +
      '<div class="ldl-kpi"><b>' + r.acierto + ' %</b><span>de acierto</span></div>' +
      '<div class="ldl-kpi"><b>' + f + "</b><span>fallos por repasar</span></div></div>" +
      '<div class="ldl-acciones"><button class="ldl-btn" data-acc="rapido" type="button">Test rápido de 20</button>' +
      '<button class="ldl-btn sec" data-acc="ir" data-v="simulacro" type="button">Simulacro de examen</button>' +
      (f ? '<button class="ldl-btn sec" data-acc="repasar" type="button">Repasar ' + f + " fallos</button>" : "") +
      "</div></section>" +
      '<section class="ldl-card"><h3>Cómo sacarle partido</h3><ol class="ldl-muted">' +
      "<li>Practica <b>por temas</b>: cada respuesta te enseña el artículo y por qué fallan las demás opciones.</li>" +
      "<li>Cada pocos días, <b>repasa tus fallos</b>: es donde más se aprende.</li>" +
      "<li>Antes del examen, haz <b>simulacros</b> con tiempo y con la penalización real (cada error resta 1/3).</li></ol>" +
      '<p class="ldl-small ldl-muted">Tu progreso se guarda en este dispositivo y en este navegador.</p></section>' + historial();
  }
  function historial() {
    if (!prog.h.length) return "";
    return '<section class="ldl-card"><h3>Últimos tests</h3><ul class="ldl-revision">' + prog.h.slice(0, 5).map(function (h) {
      var d = new Date(h.t);
      return "<li><b>" + (h.tipo === "simulacro" ? "Simulacro" : "Práctica") + "</b> · " + d.toLocaleDateString("es-ES") +
        " · " + h.a + "/" + h.n + " aciertos" + (h.tipo === "simulacro" ? " · nota " + num(h.nota) : "") + "</li>";
    }).join("") + "</ul></section>";
  }
  function vTemas() {
    var html = '<section class="ldl-card"><h2>Practicar por temas</h2><p class="ldl-muted">Elige un bloque. Las preguntas salen en orden aleatorio y se corrigen al momento.</p><ul class="ldl-bloques">';
    B.bloques.forEach(function (b) {
      var lista = delBloque(b.id), r = resumen(lista);
      html += '<li><button type="button" data-acc="bloque" data-id="' + esc(b.id) + '"><span class="t">' + esc(b.nombre) +
        '</span><span class="n">' + r.vistas + "/" + r.total + (r.vistas ? " · " + r.acierto + " %" : "") + "</span>" +
        '<span class="ldl-barra"><i style="width:' + pct(r.vistas, r.total) + '%"></i></span></button></li>';
    });
    return html + "</ul></section>";
  }
  function vSimulacro() {
    var total = B.preguntas.length;
    var opcionesN = [10, 20, 30, 50, 100].filter(function (n) { return n < total; });
    opcionesN.push(total);
    var porDefecto = Math.min((CFG.simulacro && CFG.simulacro.preguntas) || 30, total);
    return '<section class="ldl-card"><h2>Simulacro de examen</h2>' +
      '<p class="ldl-muted">Como el día del examen: no ves las soluciones hasta el final y cada error resta un tercio de acierto.</p>' +
      '<div class="ldl-campo"><label for="ldl-n">Número de preguntas</label><select id="ldl-n">' +
      opcionesN.map(function (n) { return "<option" + (n === porDefecto ? " selected" : "") + ">" + n + "</option>"; }).join("") +
      '</select></div><div class="ldl-campo"><label for="ldl-t">Tiempo</label><select id="ldl-t">' +
      '<option value="1">1 minuto por pregunta</option><option value="0">Sin límite de tiempo</option></select></div>' +
      '<div class="ldl-campo"><label for="ldl-b">Temas</label><select id="ldl-b"><option value="">Todos</option>' +
      B.bloques.map(function (b) { return '<option value="' + esc(b.id) + '">' + esc(b.nombre) + "</option>"; }).join("") +
      '</select></div><div class="ldl-acciones"><button class="ldl-btn" data-acc="simular" type="button">Empezar simulacro</button></div></section>';
  }
  function vFallos() {
    var f = fallosPendientes();
    if (!f.length) {
      return '<section class="ldl-card"><h2>Repaso de fallos</h2><p class="ldl-muted">No tienes fallos pendientes. Cuando falles una pregunta aparecerá aquí hasta que la aciertes.</p></section>';
    }
    return '<section class="ldl-card"><h2>Repaso de fallos</h2><p class="ldl-muted">Tienes <b>' + f.length +
      "</b> preguntas falladas. Salen de aquí en cuanto las aciertas.</p>" +
      '<div class="ldl-acciones"><button class="ldl-btn" data-acc="repasar" type="button">Repasar ahora</button></div></section>';
  }
  function vStats() {
    var html = '<section class="ldl-card"><h2>Estadísticas</h2><ul class="ldl-bloques">';
    B.bloques.forEach(function (b) {
      var r = resumen(delBloque(b.id));
      html += '<li><button type="button" data-acc="bloque" data-id="' + esc(b.id) + '"><span class="t">' + esc(b.nombre) +
        '</span><span class="n">' + (r.vistas ? r.acierto + " % de acierto" : "sin empezar") + '</span><span class="ldl-barra"><i style="width:' +
        r.acierto + '%"></i></span></button></li>';
    });
    html += '</ul></section><section class="ldl-card"><h3>Empezar de cero</h3><p class="ldl-muted ldl-small">Borra tu progreso guardado en este dispositivo.</p>' +
      '<div class="ldl-acciones"><button class="ldl-btn sec" data-acc="borrar" type="button">Borrar mi progreso</button></div></section>';
    return html;
  }
  function vPortada() {
    var n = B.preguntas.length;
    return '<section class="ldl-card"><h2>' + esc(CFG.pack.nombre) + "</h2>" +
      '<p class="ldl-muted">' + n + " preguntas tipo examen, corregidas al momento, con el artículo exacto y la explicación de cada opción. Gratis y sin registrarte.</p>" +
      '<div class="ldl-acciones"><button class="ldl-btn" data-acc="empezarweb" type="button">Empezar el test</button></div></section>';
  }

  function vTest() {
    var id = sesion.ids[sesion.i], p = POR_ID[id], sim = sesion.tipo === "simulacro";
    var elegida = sesion.resp[id], corregida = !sim && sesion.corregida[id];
    var html = '<section class="ldl-card"><div class="ldl-meta"><span>' + esc(sesion.titulo) + " · " + (sesion.i + 1) + " de " + sesion.ids.length +
      "</span><span>" + (sesion.limite ? '⏱ <span id="ldl-crono" class="ldl-crono">' +
        mmss(Math.max(0, sesion.limite - Math.floor((Date.now() - sesion.inicio) / 1000))) + "</span>" : esc(p.articulo_txt)) +
      '</span></div><div class="ldl-progreso"><i style="width:' + pct(sesion.i + (corregida ? 1 : 0), sesion.ids.length) + '%"></i></div>' +
      '<p class="ldl-enunciado">' + esc(p.enunciado) + '</p><div class="ldl-opciones" role="group" aria-label="Opciones">';
    LETRAS.forEach(function (l) {
      var cls = "ldl-op";
      if (corregida) { if (l === p.correcta) cls += " ok"; else if (l === elegida) cls += " ko"; }
      else if (sim && elegida === l) cls += " marcada";
      html += '<button type="button" class="' + cls + '" data-acc="resp" data-l="' + l + '"' + (corregida ? " disabled" : "") +
        (sim ? ' aria-pressed="' + (elegida === l) + '"' : "") + '><span class="l">' + l + ")</span><span>" + esc(p.opciones[l]) + "</span></button>";
    });
    html += "</div>";
    if (corregida) html += feedback(p, elegida);
    html += '<div class="ldl-acciones">';
    if (sim) {
      html += (sesion.i > 0 ? '<button class="ldl-btn sec" data-acc="ant" type="button">Anterior</button>' : "") +
        '<button class="ldl-btn" data-acc="sig" type="button">' + (sesion.i < sesion.ids.length - 1 ? "Siguiente" : "Entregar") + "</button>" +
        (sesion.i < sesion.ids.length - 1 ? '<button class="ldl-btn sec" data-acc="entregar" type="button">Entregar ya</button>' : "");
    } else if (corregida) {
      html += '<button class="ldl-btn" data-acc="sig" type="button">' + (sesion.i < sesion.ids.length - 1 ? "Siguiente" : "Ver resultado") + "</button>";
    }
    html += '<button class="ldl-btn sec" data-acc="salir" type="button">Salir</button></div></section>';
    return html;
  }
  function feedback(p, elegida) {
    var bien = elegida === p.correcta;
    return '<div class="ldl-feedback" aria-live="polite"><div class="v ' + (bien ? "ok" : "ko") + '">' +
      (bien ? "¡Correcta!" : "Incorrecta. La respuesta correcta es la " + p.correcta + ")") + "</div><div>" + esc(p.explicacion) + "</div>" +
      (p.cita ? '<blockquote class="ldl-cita">' + esc(p.cita) + "<small>" + esc(p.articulo_txt) + "</small></blockquote>" : "") + "</div>";
  }
  function vResultado() {
    var r = calcular(sesion), sim = sesion.tipo === "simulacro";
    var html = '<section class="ldl-card"><h2>' + (sim ? "Resultado del simulacro" : "Resultado") + "</h2>" +
      '<div class="ldl-nota">' + (sim ? num(r.nota.toFixed(2)) : r.aciertos + "/" + r.total) + "</div>" +
      '<p class="ldl-muted">' + plural(r.aciertos, "acierto", "aciertos") + " · " + plural(r.errores, "error", "errores") +
      (r.blancos ? " · " + r.blancos + " en blanco" : "") +
      (sim ? " · nota sobre 10 con penalización" : "") + "</p>";
    if (CFG.modo === "web") html += ctaWeb(r);
    html += '<div class="ldl-acciones">' + (CFG.modo === "web" ? '<button class="ldl-btn sec" data-acc="empezarweb" type="button">Repetir con otro orden</button>' :
      '<button class="ldl-btn" data-acc="ir" data-v="inicio" type="button">Volver al inicio</button>') + "</div></section>";
    html += '<section class="ldl-card"><h3>Revisión</h3><ul class="ldl-revision">';
    sesion.ids.forEach(function (id, n) {
      var p = POR_ID[id], e = sesion.resp[id], chip = !e ? '<span class="ldl-chip nr">En blanco</span>' :
        e === p.correcta ? '<span class="ldl-chip ok">Bien</span>' : '<span class="ldl-chip ko">Mal</span>';
      html += "<li>" + chip + '<span class="e">' + (n + 1) + ". " + esc(p.enunciado) + "</span><br>" +
        '<span class="ldl-small">Correcta: <b>' + p.correcta + ") " + esc(p.opciones[p.correcta]) + "</b>" +
        (e && e !== p.correcta ? " · Marcaste " + e + ")" : "") + '</span><br><span class="ldl-small ldl-muted">' + esc(p.explicacion) + "</span></li>";
    });
    return html + "</ul></section>";
  }
  function ctaWeb() {
    var c = CFG.compra || {}, html = "";
    if (c.url) {
      html += '<div class="ldl-card ldl-cta"><h3>' + esc(c.titulo) + '</h3><p class="ldl-muted">' + esc(c.texto) + "</p>" +
        '<div class="ldl-acciones"><a class="ldl-btn acc" href="' + esc(c.url) + '">' + esc(c.boton) + "</a></div></div>";
    }
    if (CFG.telegram) {
      html += '<p class="ldl-small">¿Quieres un test cada día? <a href="' + esc(CFG.telegram) + '">Únete gratis al canal de Telegram</a>.</p>';
    }
    return html;
  }

  function pintar() {
    var cuerpo;
    if (vista === "test") cuerpo = vTest();
    else if (vista === "resultado") cuerpo = vResultado();
    else if (vista === "portada") cuerpo = vPortada();
    else if (vista === "temas") cuerpo = vTemas();
    else if (vista === "simulacro") cuerpo = vSimulacro();
    else if (vista === "fallos") cuerpo = vFallos();
    else if (vista === "stats") cuerpo = vStats();
    else cuerpo = vInicio();
    raiz.innerHTML = '<div class="ldl">' + cabecera() + navegacion() + "<main>" + cuerpo + "</main>" + pie() + "</div>";
  }

  /* ---------- eventos ---------- */
  raiz.addEventListener("click", function (ev) {
    var el = ev.target.closest("[data-acc]");
    if (!el) return;
    var acc = el.getAttribute("data-acc");
    if (acc === "tema") return cambiarTema();
    if (acc === "ir") { pararReloj(); vista = el.getAttribute("data-v"); sesion = null; pintar(); return; }
    if (acc === "rapido") return empezar("practica", barajar(B.preguntas).slice(0, 20), { titulo: "Test rápido" });
    if (acc === "repasar") return empezar("practica", barajar(fallosPendientes()).slice(0, 30), { titulo: "Repaso de fallos" });
    if (acc === "bloque") {
      var b = B.bloques.filter(function (x) { return x.id === el.getAttribute("data-id"); })[0];
      return empezar("practica", barajar(delBloque(b.id)), { titulo: b.nombre });
    }
    if (acc === "simular") {
      var n = parseInt(document.getElementById("ldl-n").value, 10);
      var conTiempo = document.getElementById("ldl-t").value === "1";
      var bloque = document.getElementById("ldl-b").value;
      var fuente = bloque ? delBloque(bloque) : B.preguntas;
      var elegidas = barajar(fuente).slice(0, n);
      return empezar("simulacro", elegidas, { titulo: "Simulacro", minutos: conTiempo ? elegidas.length : 0 });
    }
    if (acc === "empezarweb") return empezar("practica", barajar(B.preguntas), { titulo: "Test gratuito" });
    if (acc === "resp") return responder(el.getAttribute("data-l"));
    if (acc === "sig") return siguiente();
    if (acc === "ant") return anterior();
    if (acc === "entregar") return terminar();
    if (acc === "salir") { pararReloj(); sesion = null; vista = CFG.modo === "web" ? "portada" : "inicio"; pintar(); return; }
    if (acc === "borrar") {
      if (el.getAttribute("data-confirmar") === "1") { prog = { p: {}, h: [] }; guardar(); pintar(); }
      else { el.setAttribute("data-confirmar", "1"); el.textContent = "Pulsa otra vez para confirmar"; }
    }
  });
  document.addEventListener("keydown", function (ev) {
    if (vista !== "test" || !sesion || ev.altKey || ev.ctrlKey || ev.metaKey) return;
    var k = ev.key.toLowerCase(), mapa = { "1": "a", "2": "b", "3": "c", "4": "d", a: "a", b: "b", c: "c", d: "d" };
    if (mapa[k]) { ev.preventDefault(); responder(mapa[k]); }
    else if (k === "enter" || k === "arrowright") {
      var id = sesion.ids[sesion.i];
      if (sesion.tipo === "simulacro" || sesion.corregida[id]) { ev.preventDefault(); siguiente(); }
    } else if (k === "arrowleft" && sesion.tipo === "simulacro") { ev.preventDefault(); anterior(); }
  });

  pintar();
})();
</script>
</body>
</html>
