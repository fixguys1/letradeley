lo IV. De las disposiciones sobre el procedimiento administrativo común · Capítulo I. Garantías del procedimiento"},{"id":"L39|Título IV. De las disposiciones sobre el procedimiento administrativo común · Capítulo II. Iniciación del procedimiento","ley":"L39","nombre":"Título IV. De las disposiciones sobre el procedimiento administrativo común · Capítulo II. Iniciación del procedimiento"}],"preguntas":[{"id":"L39-L1-002","ley":"L39","articulo":"1.1","articulo_txt":"Art. 1.1 Ley 39/2015","bloque_id":"L39|Título Preliminar. Disposiciones generales","enunciado":"Según el artículo 1.1 de la Ley 39/2015, la Ley también tiene por objeto regular los principios a los que se ha de ajustar el ejercicio de:","opciones":{"a":"La potestad sancionadora y la potestad reglamentaria","b":"La iniciativa legislativa y la potestad sancionadora","c":"La potestad reglamentaria y la potestad expropiatoria","d":"La iniciativa legislativa y la potestad reglamentaria"},"correcta":"d","explicacion":"El artículo 1.1 termina refiriéndose a «los principios a los que se ha de ajustar el ejercicio de la iniciativa legislativa y la potestad reglamentaria». La a) el artículo 1.1 no se refiere a los principios de la potestad sancionadora, sino a los de la iniciativa legislativa. La b) junto a la iniciativa legislativa, el artículo 1.1 cita la potestad reglamentaria, no la sancionadora. La c) el artículo 1.1 no menciona la potestad expropiatoria; la otra potestad citada es la iniciativa legislativa.","cita":"«(…) así como los principios a los que se ha de ajustar el ejercicio de la iniciativa legislativa y la potestad reglamentaria.»","dificultad":1},{"id":"L39-L1-003","ley":"L39","articulo":"1.2","articulo_txt":"Art. 1.2 Ley 39/2015","bloque_id":"L39|Título Preliminar. Disposiciones generales","enunciado":"Según el artículo 1.2 de la Ley 39/2015, ¿cómo podrán incluirse trámites adicionales o distintos a los contemplados en esta Ley?","opciones":{"a":"Mediante ley o mediante reglamento, de manera motivada","b":"Mediante reglamento, cuando así lo exija la naturaleza del procedimiento","c":"Solo mediante ley, cuando resulte eficaz, proporcionado y necesario, y de manera motivada","d":"Mediante ley o real decreto aprobado por el Consejo de Ministros"},"correcta":"c","explicacion":"El artículo 1.2 dispone que «Solo mediante ley», cuando resulte eficaz, proporcionado y necesario para los fines del procedimiento, y de manera motivada, podrán incluirse trámites adicionales o distintos. La a) el artículo 1.2 reserva la inclusión de trámites adicionales o distintos a la ley; el reglamento solo puede establecer determinadas especialidades del procedimiento. La b) los trámites adicionales o distintos solo pueden incluirse mediante ley, no por vía reglamentaria. La d) el artículo 1.2 dice «Solo mediante ley», sin admitir el real decreto para incluir esos trámites.","cita":"«Solo mediante ley, cuando resulte eficaz, proporcionado y necesario para la consecución de los fines propios del procedimiento, y de manera motivada, podrán incluirse trámites adicionales o distintos a los contemplados en esta Ley.»","dificultad":2},{"id":"L39-L1-005","ley":"L39","articulo":"2.2.b","articulo_txt":"Art. 2.2.b Ley 39/2015","bloque_id":"L39|Título Preliminar. Disposiciones generales","enunciado":"Según el artículo 2.2.b) de la Ley 39/2015, las entidades de derecho privado vinculadas o dependientes de las Administraciones Públicas quedarán sujetas a lo dispuesto en las normas de esta Ley que específicamente se refieran a las mismas y, en todo caso:","opciones":{"a":"Cuando su financiación proceda mayoritariamente de fondos públicos","b":"Cuando ejerzan potestades administrativas","c":"Cuando actúen en régimen de derecho privado","d":"Cuando así lo acuerde la Administración de la que dependan"},"correcta":"b","explicacion":"El artículo 2.2.b) las somete a las normas de la Ley que se refieran a ellas «y en todo caso, cuando ejerzan potestades administrativas». La a) el artículo 2.2.b) no atiende al origen de la financiación, sino al ejercicio de potestades administrativas. La c) es lo contrario de lo que dispone el artículo: la sujeción en todo caso se produce cuando ejercen potestades administrativas. La d) el artículo 2.2.b) no deja la sujeción a un acuerdo de la Administración matriz, sino que la impone cuando ejerzan potestades administrativas.","cita":"«b) Las entidades de derecho privado vinculadas o dependientes de las Administraciones Públicas, que quedarán sujetas a lo dispuesto en las normas de esta Ley que específicamente se refieran a las mismas, y en todo caso, cuando ejerzan potestades administrativas.»","dificultad":2},{"id":"L39-L1-006","ley":"L39","articulo":"2.3","articulo_txt":"Art. 2.3 Ley 39/2015","bloque_id":"L39|Título Preliminar. Disposiciones generales","enunciado":"Según el artículo 2.3 de la Ley 39/2015, ¿cuál de los siguientes NO tiene la consideración de Administración Pública?","opciones":{"a":"Las entidades de derecho privado vinculadas o dependientes de las Administraciones Públicas","b":"La Administración General del Estado","c":"Las Entidades que integran la Administración Local","d":"Los organismos públicos y entidades de derecho público vinculados o dependientes de las Administraciones Públicas"},"correcta":"a","explicacion":"El artículo 2.3 considera Administraciones Públicas a la Administración General del Estado, las de las Comunidades Autónomas, las Entidades que integran la Administración Local y los organismos públicos y entidades de derecho público de la letra a) del apartado 2, pero no a las entidades de derecho privado de la letra b). La b) figura expresamente en el artículo 2.3 como Administración Pública. La c) el artículo 2.3 las incluye expresamente entre las Administraciones Públicas. La d) el artículo 2.3 les reconoce esa consideración al remitirse a la letra a) del apartado 2.","cita":"«3. Tienen la consideración de Administraciones Públicas la Administración General del Estado, las Administraciones de las Comunidades Autónomas, las Entidades que integran la Administración Local, así como los organismos públicos y entidades de derecho público previstos en la letra a) del apartado 2 anterior.»","dificultad":2},{"id":"L39-L1-007","ley":"L39","articulo":"2.4","articulo_txt":"Art. 2.4 Ley 39/2015","bloque_id":"L39|Título Preliminar. Disposiciones generales","enunciado":"Según el artículo 2.4 de la Ley 39/2015, las Corporaciones de Derecho Público, en el ejercicio de las funciones públicas que les hayan sido atribuidas por Ley o delegadas por una Administración Pública, se regirán:","opciones":{"a":"Por la Ley 39/2015 y supletoriamente por su normativa específica","b":"Exclusivamente por su normativa específica","c":"Por la Ley 39/2015 en todo caso, como cualquier Administración Pública","d":"Por su normativa específica y supletoriamente por la Ley 39/2015"},"correcta":"d","explicacion":"El artículo 2.4 dispone que se rigen «por su normativa específica» en el ejercicio de esas funciones públicas, «y supletoriamente por la presente Ley». La a) invierte el orden de aplicación: la Ley 39/2015 es la norma supletoria, no la principal. La b) el artículo 2.4 prevé la aplicación supletoria de la Ley 39/2015. La c) las Corporaciones de Derecho Público no figuran entre las Administraciones Públicas del artículo 2.3, y el artículo 2.4 da preferencia a su normativa específica.","cita":"«4. Las Corporaciones de Derecho Público se regirán por su normativa específica en el ejercicio de las funciones públicas que les hayan sido atribuidas por Ley o delegadas por una Administración Pública, y supletoriamente por la presente Ley.»","dificultad":2},{"id":"L39-L1-009","ley":"L39","articulo":"3.b","articulo_txt":"Art. 3.b Ley 39/2015","bloque_id":"L39|Título I. De los interesados en el procedimiento","enunciado":"Según el artículo 3.b) de la Ley 39/2015, los menores de edad tendrán capacidad de obrar ante las Administraciones Públicas:","opciones":{"a":"Solo cuando hayan cumplido dieciséis años, para cualquier derecho o interés y en cualquier procedimiento","b":"En ningún caso, pues deben actuar siempre por medio de quien ejerza la patria potestad, tutela o curatela","c":"Solo para formular solicitudes, y siempre con la autorización expresa de quien ejerza la patria potestad, tutela o curatela","d":"Para el ejercicio y defensa de aquellos de sus derechos e intereses cuya actuación esté permitida por el ordenamiento jurídico sin la asistencia de quien ejerza la patria potestad, tutela o curatela"},"correcta":"d","explicacion":"El artículo 3.b) reconoce capacidad de obrar a los menores para el ejercicio y defensa de los derechos e intereses cuya actuación permita el ordenamiento jurídico sin la asistencia de quien ejerza la patria potestad, tutela o curatela. La a) el artículo 3.b) no fija una edad mínima, sino que atiende a los derechos e intereses cuya actuación permita el ordenamiento sin asistencia. La b) el artículo 3.b) sí les reconoce capacidad de obrar en determinados supuestos. La c) el artículo 3.b) no limita la capacidad a las solicitudes ni exige autorización: se refiere precisamente a actuaciones permitidas sin esa asistencia.","cita":"«b) Los menores de edad para el ejercicio y defensa de aquellos de sus derechos e intereses cuya actuación esté permitida por el ordenamiento jurídico sin la asistencia de la persona que ejerza la patria potestad, tutela o curatela. (…)»","dificultad":2},{"id":"L39-L1-008","ley":"L39","articulo":"3.a","articulo_txt":"Art. 3.a Ley 39/2015","bloque_id":"L39|Título I. De los interesados en el procedimiento","enunciado":"Según el artículo 3 de la Ley 39/2015, tendrán capacidad de obrar ante las Administraciones Públicas las personas físicas o jurídicas que ostenten capacidad de obrar con arreglo a:","opciones":{"a":"Las normas administrativas","b":"Las normas mercantiles","c":"Las normas civiles","d":"Las normas procesales"},"correcta":"c","explicacion":"El artículo 3.a) remite a la capacidad de obrar que las personas físicas o jurídicas ostenten «con arreglo a las normas civiles». La a) el artículo 3.a) no remite a las normas administrativas, sino a las civiles. La b) la referencia del artículo 3.a) es a las normas civiles, no a las mercantiles. La d) el artículo 3.a) no remite a las normas procesales, sino a las civiles.","cita":"«a) Las personas físicas o jurídicas que ostenten capacidad de obrar con arreglo a las normas civiles.»","dificultad":1},{"id":"L39-L1-012","ley":"L39","articulo":"4.1.c","articulo_txt":"Art. 4.1.c Ley 39/2015","bloque_id":"L39|Título I. De los interesados en el procedimiento","enunciado":"Según el artículo 4.1.c) de la Ley 39/2015, quienes tengan intereses legítimos que puedan resultar afectados por la resolución se consideran interesados si se personan en el procedimiento:","opciones":{"a":"Antes de que se dicte la propuesta de resolución","b":"En tanto no haya recaído resolución definitiva","c":"Dentro de los diez días siguientes a la notificación del acuerdo de iniciación","d":"Antes de que concluya el trámite de audiencia"},"correcta":"b","explicacion":"El artículo 4.1.c) exige que se personen en el procedimiento «en tanto no haya recaído resolución definitiva». La a) el límite temporal del artículo 4.1.c) no es la propuesta de resolución, sino la resolución definitiva. La c) el artículo 4.1.c) no fija un plazo de diez días, sino que admite la personación mientras no haya resolución definitiva. La d) el artículo 4.1.c) no se refiere al trámite de audiencia, sino a la resolución definitiva.","cita":"«c) Aquellos cuyos intereses legítimos, individuales o colectivos, puedan resultar afectados por la resolución y se personen en el procedimiento en tanto no haya recaído resolución definitiva.»","dificultad":2},{"id":"L39-L1-020","ley":"L39","articulo":"5.6","articulo_txt":"Art. 5.6 Ley 39/2015","bloque_id":"L39|Título I. De los interesados en el procedimiento","enunciado":"Según el artículo 5.6 de la Ley 39/2015, la falta o insuficiente acreditación de la representación no impedirá que se tenga por realizado el acto, siempre que se aporte aquélla o se subsane el defecto dentro del plazo que deberá conceder el órgano administrativo. ¿Cuál es ese plazo?","opciones":{"a":"Cinco días, ampliables a diez cuando las circunstancias del caso así lo requieran","b":"Quince días, sin posibilidad de ampliación","c":"Diez días, sin posibilidad de conceder un plazo superior","d":"Diez días, o un plazo superior cuando las circunstancias del caso así lo requieran"},"correcta":"d","explicacion":"El artículo 5.6 fija «el plazo de diez días», o «un plazo superior cuando las circunstancias del caso así lo requieran». La a) el plazo es de diez días, no de cinco. La b) el plazo es de diez días y admite uno superior si las circunstancias lo requieren. La c) el artículo 5.6 permite conceder un plazo superior cuando las circunstancias del caso lo requieran.","cita":"«6. La falta o insuficiente acreditación de la representación no impedirá que se tenga por realizado el acto de que se trate, siempre que se aporte aquélla o se subsane el defecto dentro del plazo de diez días que deberá conceder al efecto el órgano administrativo, o de un plazo superior cuando las circunstancias del caso así lo requieran.»","dificultad":2},{"id":"L39-L1-031","ley":"L39","articulo":"9.2.c","articulo_txt":"Art. 9.2.c Ley 39/2015","bloque_id":"L39|Título I. De los interesados en el procedimiento","enunciado":"Según el artículo 9.2.c) de la Ley 39/2015, en relación con los sistemas de identificación de esa letra, el órgano estatal competente por motivos de seguridad pública podrá acudir a la vía jurisdiccional previo informe vinculante:","opciones":{"a":"De la Secretaría General de Administración Digital, que deberá emitirlo en el plazo de diez días desde su solicitud","b":"De la Secretaría de Estado de Seguridad, que deberá emitirlo en el plazo de un mes desde su solicitud","c":"De la Secretaría de Estado de Seguridad, que deberá emitirlo en el plazo de diez días desde su solicitud","d":"Del Centro Criptológico Nacional, que deberá emitirlo en el plazo de quince días desde su solicitud"},"correcta":"c","explicacion":"El artículo 9.2.c) exige el «previo informe vinculante de la Secretaría de Estado de Seguridad, que deberá emitir en el plazo de diez días desde su solicitud». La a) a la Secretaría General de Administración Digital se le comunica el sistema; el informe vinculante es de la Secretaría de Estado de Seguridad. La b) el plazo para emitir el informe es de diez días, no de un mes. La d) el artículo 9.2.c) no menciona a ese organismo y el plazo es de diez días.","cita":"«(…) durante los cuales el órgano estatal competente por motivos de seguridad pública podrá acudir a la vía jurisdiccional, previo informe vinculante de la Secretaría de Estado de Seguridad, que deberá emitir en el plazo de diez días desde su solicitud.»","dificultad":3},{"id":"L39-L2-016","ley":"L39","articulo":"20.2","articulo_txt":"Art. 20.2 Ley 39/2015","bloque_id":"L39|Título II. De la actividad de las Administraciones Públicas · Capítulo I. Normas generales de actuación","enunciado":"Según el artículo 20.2 de la Ley 39/2015, los interesados podrán solicitar la exigencia de la responsabilidad de los titulares de las unidades administrativas y del personal que tengan a su cargo la tramitación de los asuntos a:","opciones":{"a":"El superior jerárquico del órgano instructor, exclusivamente.","b":"El órgano jurisdiccional contencioso-administrativo competente.","c":"El Consejo de Transparencia y Buen Gobierno.","d":"La Administración Pública de que dependa el personal afectado."},"correcta":"d","explicacion":"El artículo 20.2 dispone que los interesados podrán solicitar la exigencia de esa responsabilidad «a la Administración Pública de que dependa el personal afectado». Ni el superior jerárquico del instructor (a), ni los tribunales (b), ni el Consejo de Transparencia (c) son los destinatarios que señala el precepto.","cita":"«2. Los interesados podrán solicitar la exigencia de esa responsabilidad a la Administración Pública de que dependa el personal afectado.»","dificultad":2},{"id":"L39-L2-017","ley":"L39","articulo":"21.1","articulo_txt":"Art. 21.1 Ley 39/2015","bloque_id":"L39|Título II. De la actividad de las Administraciones Públicas · Capítulo I. Normas generales de actuación","enunciado":"Según el artículo 21.1 de la Ley 39/2015, ¿en cuál de los siguientes supuestos se exceptúa la obligación de la Administración de dictar resolución expresa y notificarla?","opciones":{"a":"Caducidad del procedimiento.","b":"Terminación del procedimiento por pacto o convenio.","c":"Desistimiento de la solicitud.","d":"Desaparición sobrevenida del objeto del procedimiento."},"correcta":"b","explicacion":"El artículo 21.1 exceptúa de la obligación de resolver «los supuestos de terminación del procedimiento por pacto o convenio» (y los procedimientos sometidos solo a declaración responsable o comunicación). En los casos de la a), la c) y la d) sí debe dictarse resolución, que consistirá en la declaración de la circunstancia que concurra, con indicación de los hechos producidos y las normas aplicables.","cita":"«En los casos de prescripción, renuncia del derecho, caducidad del procedimiento o desistimiento de la solicitud, así como de desaparición sobrevenida del objeto del procedimiento, la resolución consistirá en la declaración de la circunstancia que concurra en cada caso, con indicación de los hechos producidos y las normas aplicables. Se exceptúan de la obligación a que se refiere el párrafo primero, los supuestos de terminación del procedimiento por pacto o convenio, así como los procedimientos relativos al ejercicio de derechos sometidos únicamente al deber de declaración responsable o comunicación a la Administración.»","dificultad":2},{"id":"L39-L2-025","ley":"L39","articulo":"23.1","articulo_txt":"Art. 23.1 Ley 39/2015","bloque_id":"L39|Título II. De la actividad de las Administraciones Públicas · Capítulo I. Normas generales de actuación","enunciado":"Según el artículo 23.1 de la Ley 39/2015, cuando se hayan agotado los medios personales y materiales disponibles, ¿cuál es el límite máximo de la ampliación del plazo máximo de resolución y notificación que puede acordarse?","opciones":{"a":"La mitad del plazo establecido para la tramitación del procedimiento.","b":"El propio plazo establecido para la tramitación del procedimiento, al que no puede ser superior.","c":"Tres meses, cualquiera que sea el plazo establecido.","d":"Seis meses, salvo previsión de una norma con rango de ley."},"correcta":"b","explicacion":"El artículo 23.1 permite acordar motivadamente la ampliación «no pudiendo ser éste superior al establecido para la tramitación del procedimiento». La a) recoge el límite de la mitad propio de la ampliación de plazos del artículo 32.1, y la c) y la d) fijan topes que el artículo 23 no contiene.","cita":"«1. Excepcionalmente, cuando se hayan agotado los medios personales y materiales disponibles a los que se refiere el apartado 5 del artículo 21, el órgano competente para resolver, a propuesta, en su caso, del órgano instructor o el superior jerárquico del órgano competente para resolver, podrá acordar de manera motivada la ampliación del plazo máximo de resolución y notificación, no pudiendo ser éste superior al establecido para la tramitación del procedimiento.»","dificultad":3},{"id":"L39-L2-029","ley":"L39","articulo":"24.4","articulo_txt":"Art. 24.4 Ley 39/2015","bloque_id":"L39|Título II. De la actividad de las Administraciones Públicas · Capítulo I. Normas generales de actuación","enunciado":"Según el artículo 24.4 de la Ley 39/2015, el certificado acreditativo del silencio producido se expedirá de oficio por el órgano competente para resolver en el plazo de:","opciones":{"a":"Diez días desde que expire el plazo máximo para resolver el procedimiento.","b":"Quince días desde que expire el plazo máximo para resolver el procedimiento.","c":"Un mes desde que expire el plazo máximo para resolver el procedimiento.","d":"Veinte días desde que el interesado lo solicite."},"correcta":"b","explicacion":"El artículo 24.4 dispone que el certificado «se expedirá de oficio por el órgano competente para resolver en el plazo de quince días desde que expire el plazo máximo para resolver». La a), la c) y la d) cambian el plazo; además, si lo pide el interesado, el mismo plazo se cuenta desde el día siguiente a la entrada de la petición en el registro electrónico competente.","cita":"«Este certificado se expedirá de oficio por el órgano competente para resolver en el plazo de quince días desde que expire el plazo máximo para resolver el procedimiento.»","dificultad":2},{"id":"L39-L2-033","ley":"L39","articulo":"26.3","articulo_txt":"Art. 26.3 Ley 39/2015","bloque_id":"L39|Título II. De la actividad de las Administraciones Públicas · Capítulo I. Normas generales de actuación","enunciado":"Según el artículo 26.3 de la Ley 39/2015, ¿qué documentos electrónicos emitidos por las Administraciones Públicas no requerirán de firma electrónica?","opciones":{"a":"Los que se publiquen con carácter meramente informativo, así como aquellos que no formen parte de un expediente administrativo.","b":"Los que se dirijan a otras Administraciones Públicas a través de redes corporativas.","c":"Los que se notifiquen a interesados que no estén obligados a relacionarse electrónicamente.","d":"Las copias auténticas expedidas mediante actuación administrativa automatizada."},"correcta":"a","explicacion":"El artículo 26.3 exime de firma electrónica a los documentos «que se publiquen con carácter meramente informativo, así como aquellos que no formen parte de un expediente administrativo», aunque siempre debe identificarse su origen. La b), la c) y la d) no figuran entre las excepciones del precepto.","cita":"«3. No requerirán de firma electrónica, los documentos electrónicos emitidos por las Administraciones Públicas que se publiquen con carácter meramente informativo, así como aquellos que no formen parte de un expediente administrativo. En todo caso, será necesario identificar el origen de estos documentos.»","dificultad":2},{"id":"L39-L2-040","ley":"L39","articulo":"30.1","articulo_txt":"Art. 30.1 Ley 39/2015","bloque_id":"L39|Título II. De la actividad de las Administraciones Públicas · Capítulo II. Términos y plazos","enunciado":"Según el artículo 30.1 de la Ley 39/2015, salvo que por ley o en el Derecho de la Unión Europea se disponga otro cómputo, cuando los plazos se señalen por horas:","opciones":{"a":"Se entiende que son naturales.","b":"Se entiende que son hábiles las comprendidas en el horario de atención al público de las oficinas de registro.","c":"Se entiende que son hábiles las comprendidas entre las ocho y las veinte horas de cada día hábil.","d":"Se entiende que son hábiles, y son hábiles todas las horas del día que formen parte de un día hábil."},"correcta":"d","explicacion":"El artículo 30.1 establece que, cuando los plazos se señalan por horas, «se entiende que éstas son hábiles» y que «son hábiles todas las horas del día que formen parte de un día hábil». La a) contradice la regla, y la b) y la c) restringen las horas hábiles a franjas horarias que la ley no prevé.","cita":"«1. Salvo que por Ley o en el Derecho de la Unión Europea se disponga otro cómputo, cuando los plazos se señalen por horas, se entiende que éstas son hábiles. Son hábiles todas las horas del día que formen parte de un día hábil.»","dificultad":2},{"id":"L39-L2-042","ley":"L39","articulo":"30.2","articulo_txt":"Art. 30.2 Ley 39/2015","bloque_id":"L39|Título II. De la actividad de las Administraciones Públicas · Capítulo II. Términos y plazos","enunciado":"Según el artículo 30.2 de la Ley 39/2015, siempre que por ley o en el Derecho de la Unión Europea no se exprese otro cómputo, cuando los plazos se señalen por días, ¿qué días se excluyen del cómputo?","opciones":{"a":"Los domingos y los declarados festivos.","b":"Únicamente los declarados festivos.","c":"Los sábados, los domingos y los declarados festivos.","d":"Los sábados por la tarde, los domingos y los declarados festivos."},"correcta":"c","explicacion":"El artículo 30.2 dispone que los plazos por días son hábiles, «excluyéndose del cómputo los sábados, los domingos y los declarados festivos». La a) y la b) omiten los sábados (y la b, también los domingos), y la d) solo excluye la tarde del sábado.","cita":"«2. Siempre que por Ley o en el Derecho de la Unión Europea no se exprese otro cómputo, cuando los plazos se señalen por días, se entiende que éstos son hábiles, excluyéndose del cómputo los sábados, los domingos y los declarados festivos.»","dificultad":1},{"id":"L39-L2-043","ley":"L39","articulo":"30.4","articulo_txt":"Art. 30.4 Ley 39/2015","bloque_id":"L39|Título II. De la actividad de las Administraciones Públicas · Capítulo II. Términos y plazos","enunciado":"Según el artículo 30.4 de la Ley 39/2015, cuando el plazo se fija en meses o años, ¿qué día concluye?","opciones":{"a":"El día anterior a aquel en que se produjo la notificación, publicación o silencio administrativo, en el mes o el año de vencimiento.","b":"El mismo día en que se produjo la notificación, publicación o silencio administrativo, en el mes o el año de vencimiento.","c":"El día siguiente a aquel en que se produjo la notificación, publicación o silencio administrativo, en el mes o el año de vencimiento.","d":"Al cumplirse treinta días naturales por cada mes, contados desde el día siguiente a la notificación o publicación."},"correcta":"b","explicacion":"El artículo 30.4 dispone que «el plazo concluirá el mismo día en que se produjo la notificación, publicación o silencio administrativo en el mes o el año de vencimiento» (y, si no hay día equivalente, el último día del mes). La a) y la c) desplazan un día el vencimiento, y la d) convierte los meses en días, lo que la ley no prevé.","cita":"«El plazo concluirá el mismo día en que se produjo la notificación, publicación o silencio administrativo en el mes o el año de vencimiento. Si en el mes de vencimiento no hubiera día equivalente a aquel en que comienza el cómputo, se entenderá que el plazo expira el último día del mes.»","dificultad":2},{"id":"L39-L2-045","ley":"L39","articulo":"31.2.b","articulo_txt":"Art. 31.2.b Ley 39/2015","bloque_id":"L39|Título II. De la actividad de las Administraciones Públicas · Capítulo II. Términos y plazos","enunciado":"Según el artículo 31.2.b) de la Ley 39/2015, a los efectos del cómputo de plazos fijados en días hábiles y en lo que se refiere al cumplimiento de plazos por los interesados, la presentación de un documento en el registro electrónico en un día inhábil se entenderá realizada, salvo que una norma permita expresamente la recepción en día inhábil:","opciones":{"a":"En la primera hora del primer día hábil siguiente.","b":"En la última hora del último día hábil anterior.","c":"En la fecha y hora efectivas de la presentación.","d":"A la misma hora del primer día hábil siguiente."},"correcta":"a","explicacion":"El artículo 31.2.b) dispone que esa presentación «se entenderá realizada en la primera hora del primer día hábil siguiente». La b) retrotrae la presentación, la c) ignora la regla especial y la d) traslada la hora real de presentación, cuando la ley remite a la primera hora.","cita":"«b) A los efectos del cómputo de plazo fijado en días hábiles, y en lo que se refiere al cumplimiento de plazos por los interesados, la presentación en un día inhábil se entenderá realizada en la primera hora del primer día hábil siguiente salvo que una norma permita expresamente la recepción en día inhábil.»","dificultad":2},{"id":"L39-L2-047","ley":"L39","articulo":"32.1","articulo_txt":"Art. 32.1 Ley 39/2015","bloque_id":"L39|Título II. De la actividad de las Administraciones Públicas · Capítulo II. Términos y plazos","enunciado":"Según el artículo 32.1 de la Ley 39/2015, la ampliación de los plazos establecidos que la Administración puede conceder, de oficio o a petición de los interesados, salvo precepto en contrario, tiene como límite máximo:","opciones":{"a":"Un tercio de los plazos establecidos.","b":"El doble de los plazos establecidos.","c":"El mismo plazo inicialmente establecido.","d":"La mitad de los plazos establecidos."},"correcta":"d","explicacion":"El artículo 32.1 permite una ampliación «que no exceda de la mitad de los mismos», si las circunstancias lo aconsejan y no se perjudican derechos de tercero. La c) recoge el límite de la ampliación del plazo máximo para resolver (art. 23.1), y la a) y la b) no responden al texto.","cita":"«1. La Administración, salvo precepto en contrario, podrá conceder de oficio o a petición de los interesados, una ampliación de los plazos establecidos, que no exceda de la mitad de los mismos, si las circunstancias lo aconsejan y con ello no se perjudican derechos de tercero. El acuerdo de ampliación deberá ser notificado a los interesados.»","dificultad":2},{"id":"L39-L3-001","ley":"L39","articulo":"34.2","articulo_txt":"Art. 34.2 Ley 39/2015","bloque_id":"L39|Título III. De los actos administrativos · Capítulo I. Requisitos de los actos administrativos","enunciado":"Según el artículo 34.2 de la Ley 39/2015, el contenido de los actos administrativos se ajustará a lo dispuesto por el ordenamiento jurídico y será:","opciones":{"a":"Determinado y adecuado a los fines de aquéllos.","b":"Uniforme para todos los interesados en el procedimiento.","c":"Proporcionado al interés público y a los medios disponibles.","d":"Conforme, en todo caso, con lo solicitado por el interesado."},"correcta":"a","explicacion":"El artículo 34.2 exige que el contenido de los actos sea «determinado y adecuado a los fines de aquéllos». Ni la uniformidad (b), ni la proporcionalidad a los medios disponibles (c), ni la conformidad en todo caso con lo solicitado (d) figuran en ese apartado.","cita":"«2. El contenido de los actos se ajustará a lo dispuesto por el ordenamiento jurídico y será determinado y adecuado a los fines de aquéllos.»","dificultad":1},{"id":"L39-L3-003","ley":"L39","articulo":"35.1","articulo_txt":"Art. 35.1 Ley 39/2015","bloque_id":"L39|Título III. De los actos administrativos · Capítulo I. Requisitos de los actos administrativos","enunciado":"Según el artículo 35.1 de la Ley 39/2015, los actos que deben ser motivados lo serán con:","opciones":{"a":"Exposición detallada de los hechos, de los fundamentos de derecho y de las pruebas practicadas.","b":"Sucinta referencia de hechos y fundamentos de derecho.","c":"Referencia expresa a los informes y dictámenes que consten en el expediente.","d":"Sucinta referencia a los fundamentos de derecho, sin necesidad de relatar los hechos."},"correcta":"b","explicacion":"El artículo 35.1 dispone que serán motivados «con sucinta referencia de hechos y fundamentos de derecho». La a) exige una exposición detallada que la ley no pide; la c) añade una referencia a informes que el precepto no establece, y la d) suprime la referencia a los hechos.","cita":"«1. Serán motivados, con sucinta referencia de hechos y fundamentos de derecho:»","dificultad":1},{"id":"L39-L3-002","ley":"L39","articulo":"35.1","articulo_txt":"Art. 35.1 Ley 39/2015","bloque_id":"L39|Título III. De los actos administrativos · Capítulo I. Requisitos de los actos administrativos","enunciado":"Según el artículo 35.1 de la Ley 39/2015, ¿cuál de los siguientes actos NO aparece en la relación de actos que deben ser motivados?","opciones":{"a":"Los actos que rechacen pruebas propuestas por los interesados.","b":"Los acuerdos de aplicación de la tramitación de urgencia.","c":"Los actos que admitan las pruebas propuestas por los interesados.","d":"Las propuestas de resolución en los procedimientos de carácter sancionador."},"correcta":"c","explicacion":"El artículo 35.1 solo menciona, en materia de prueba, «Los actos que rechacen pruebas propuestas por los interesados» (letra f), no los que las admiten. La a) reproduce la letra f), la b) figura en la letra e) y la d) en la letra h) del artículo 35.1.","cita":"«1. Serán motivados, con sucinta referencia de hechos y fundamentos de derecho: (…) e) Los acuerdos de aplicación de la tramitación de urgencia, de ampliación de plazos y de realización de actuaciones complementarias. (…) Los actos que rechacen pruebas propuestas por los interesados. (…) h) Las propuestas de resolución en los procedimientos de carácter sancionador (…)»","dificultad":2},{"id":"L39-L3-005","ley":"L39","articulo":"35.2","articulo_txt":"Art. 35.2 Ley 39/2015","bloque_id":"L39|Título III. De los actos administrativos · Capítulo I. Requisitos de los actos administrativos","enunciado":"Según el artículo 35.2 de la Ley 39/2015, la motivación de los actos que pongan fin a los procedimientos selectivos y de concurrencia competitiva se realizará:","opciones":{"a":"Mediante un informe del órgano de selección, que se publicará junto con la resolución.","b":"De conformidad con lo que dispongan las normas que regulen sus convocatorias, debiendo, en todo caso, quedar acreditados en el procedimiento los fundamentos de la resolución que se adopte.","c":"Solo cuando lo solicite expresamente alguno de los participantes.","d":"Por remisión genérica a las bases de la convocatoria, sin necesidad de que consten en el procedimiento los fundamentos de la resolución."},"correcta":"b","explicacion":"El artículo 35.2 remite a las normas que regulen las convocatorias, «debiendo, en todo caso, quedar acreditados en el procedimiento los fundamentos de la resolución que se adopte». La a) y la c) introducen requisitos o condiciones que el precepto no prevé, y la d) contradice la exigencia de que consten, en todo caso, esos fundamentos.","cita":"«2. La motivación de los actos que pongan fin a los procedimientos selectivos y de concurrencia competitiva se realizará de conformidad con lo que dispongan las normas que regulen sus convocatorias, debiendo, en todo caso, quedar acreditados en el procedimiento los fundamentos de la resolución que se adopte.»","dificultad":2},{"id":"L39-L3-024","ley":"L39","articulo":"42.2","articulo_txt":"Art. 42.2 Ley 39/2015","bloque_id":"L39|Título III. De los actos administrativos · Capítulo II. Eficacia de los actos","enunciado":"Según el artículo 42.2 de la Ley 39/2015, cuando la notificación se practique en el domicilio del interesado y no se halle presente éste en el momento de entregarse, podrá hacerse cargo de ella:","opciones":{"a":"Cualquier persona mayor de dieciséis años que se encuentre en el domicilio y haga constar su identidad.","b":"Cualquier persona mayor de edad que se encuentre en el domicilio y haga constar su identidad.","c":"Cualquier persona mayor de catorce años que se encuentre en el domicilio y haga constar su identidad.","d":"Únicamente un familiar del interesado, mayor de edad, que haga constar su identidad."},"correcta":"c","explicacion":"El artículo 42.2 permite que se haga cargo «cualquier persona mayor de catorce años que se encuentre en el domicilio y haga constar su identidad». La a) y la b) cambian la edad, y la d) limita la entrega a familiares, restricción que la ley no establece.","cita":"«2. Cuando la notificación se practique en el domicilio del interesado, de no hallarse presente éste en el momento de entregarse la notificación, podrá hacerse cargo de la misma cualquier persona mayor de catorce años que se encuentre en el domicilio y haga constar su identidad.»","dificultad":1},{"id":"L39-L3-028","ley":"L39","articulo":"43.2","articulo_txt":"Art. 43.2 Ley 39/2015","bloque_id":"L39|Título III. De los actos administrativos · Capítulo II. Eficacia de los actos","enunciado":"Según el artículo 43.2 de la Ley 39/2015, cuando la notificación por medios electrónicos sea de carácter obligatorio, o haya sido expresamente elegida por el interesado, se entenderá rechazada cuando hayan transcurrido, desde su puesta a disposición sin que se acceda a su contenido:","opciones":{"a":"Diez días hábiles.","b":"Diez días naturales.","c":"Quince días naturales.","d":"Cinco días hábiles."},"correcta":"b","explicacion":"El artículo 43.2 dispone que se entenderá rechazada «cuando hayan transcurrido diez días naturales desde la puesta a disposición de la notificación sin que se acceda a su contenido». La trampa habitual es la a): los días son naturales, no hábiles; la c) y la d) alteran la cifra.","cita":"«Cuando la notificación por medios electrónicos sea de carácter obligatorio, o haya sido expresamente elegida por el interesado, se entenderá rechazada cuando hayan transcurrido diez días naturales desde la puesta a disposición de la notificación sin que se acceda a su contenido.»","dificultad":2},{"id":"L39-L3-030","ley":"L39","articulo":"44","articulo_txt":"Art. 44 Ley 39/2015","bloque_id":"L39|Título III. De los actos administrativos · Capítulo II. Eficacia de los actos","enunciado":"Según el artículo 44 de la Ley 39/2015, cuando los interesados en un procedimiento sean desconocidos, se ignore el lugar de la notificación o bien, intentada ésta, no se hubiese podido practicar, la notificación se hará por medio de un anuncio publicado en:","opciones":{"a":"La sede electrónica de la Administración u Organismo actuante.","b":"El «Boletín Oficial del Estado».","c":"La dirección electrónica habilitada única.","d":"Un diario de los de mayor difusión en la provincia del último domicilio del interesado."},"correcta":"b","explicacion":"El artículo 44 establece que, en estos casos, la notificación se hará por medio de un anuncio publicado en el «Boletín Oficial del Estado». La sede electrónica (a), la dirección electrónica habilitada única (c) y los diarios de difusión provincial (d) no sustituyen a ese anuncio.","cita":"«Cuando los interesados en un procedimiento sean desconocidos, se ignore el lugar de la notificación o bien, intentada ésta, no se hubiese podido practicar, la notificación se hará por medio de un anuncio publicado en el «Boletín Oficial del Estado».»","dificultad":1},{"id":"L39-L3-035","ley":"L39","articulo":"46","articulo_txt":"Art. 46 Ley 39/2015","bloque_id":"L39|Título III. De los actos administrativos · Capítulo II. Eficacia de los actos","enunciado":"Según el artículo 46 de la Ley 39/2015, si el órgano competente apreciase que la notificación por medio de anuncios o la publicación de un acto lesiona derechos o intereses legítimos:","opciones":{"a":"Se abstendrá de publicar el acto y lo notificará personalmente a cada interesado.","b":"Publicará el acto íntegro, previa supresión de los datos personales de los interesados.","c":"Se limitará a publicar una somera indicación del contenido del acto y del lugar donde los interesados podrán comparecer para conocimiento de su contenido íntegro.","d":"Suspenderá la publicación hasta que los interesados presten su consentimiento."},"correcta":"c","explicacion":"El artículo 46 dispone que el órgano «se limitará a publicar en el Diario oficial que corresponda una somera indicación del contenido del acto y del lugar donde los interesados podrán comparecer», en el plazo que se establezca. No se renuncia a publicar (a), no se publica el acto íntegro (b) y no se condiciona al consentimiento de los interesados (d).","cita":"«Si el órgano competente apreciase que la notificación por medio de anuncios o la publicación de un acto lesiona derechos o intereses legítimos, se limitará a publicar en el Diario oficial que corresponda una somera indicación del contenido del acto y del lugar donde los interesados podrán comparecer, en el plazo que se establezca, para conocimiento del contenido íntegro del mencionado acto y constancia de tal conocimiento.»","dificultad":2},{"id":"L39-L3-036","ley":"L39","articulo":"47.1","articulo_txt":"Art. 47.1 Ley 39/2015","bloque_id":"L39|Título III. De los actos administrativos · Capítulo III. Nulidad y anulabilidad","enunciado":"Según el artículo 47.1 de la Ley 39/2015, ¿cuál de los siguientes actos NO figura entre los supuestos de nulidad de pleno derecho?","opciones":{"a":"Los que tengan un contenido imposible.","b":"Los dictados sin la motivación exigida por el artículo 35.","c":"Los que sean constitutivos de infracción penal o se dicten como consecuencia de ésta.","d":"Los que lesionen los derechos y libertades susceptibles de amparo constitucional."},"correcta":"b","explicacion":"La falta de motivación no aparece en la relación del artículo 47.1. Sí figuran en él la a), que corresponde a la letra c); la c), a la letra d), y la d), a la letra a).","cita":"«1. Los actos de las Administraciones Públicas son nulos de pleno derecho en los casos siguientes: a) Los que lesionen los derechos y libertades susceptibles de amparo constitucional. (…) c) Los que tengan un contenido imposible. d) Los que sean constitutivos de infracción penal o se dicten como consecuencia de ésta.»","dificultad":2},{"id":"L39-L3-038","ley":"L39","articulo":"47.1.g","articulo_txt":"Art. 47.1.g Ley 39/2015","bloque_id":"L39|Título III. De los actos administrativos · Capítulo III. Nulidad y anulabilidad","enunciado":"Según el artículo 47.1.g) de la Ley 39/2015, son también nulos de pleno derecho los actos de las Administraciones Públicas en cualquier otro caso que se establezca expresamente en una disposición con rango de:","opciones":{"a":"Real decreto.","b":"Reglamento.","c":"Orden ministerial.","d":"Ley."},"correcta":"d","explicacion":"El artículo 47.1.g) se refiere a «Cualquier otro que se establezca expresamente en una disposición con rango de Ley». Una norma reglamentaria, como el real decreto (a), el reglamento en general (b) o la orden ministerial (c), no basta para crear nuevos supuestos de nulidad de pleno derecho.","cita":"«g) Cualquier otro que se establezca expresamente en una disposición con rango de Ley.»","dificultad":1},{"id":"L39-L3-039","ley":"L39","articulo":"47.2","articulo_txt":"Art. 47.2 Ley 39/2015","bloque_id":"L39|Título III. De los actos administrativos · Capítulo III. Nulidad y anulabilidad","enunciado":"Según el artículo 47.2 de la Ley 39/2015, también serán nulas de pleno derecho las disposiciones administrativas que establezcan la retroactividad de:","opciones":{"a":"Disposiciones sancionadoras no favorables o restrictivas de derechos individuales.","b":"Cualquier disposición, sea favorable o desfavorable.","c":"Disposiciones favorables a los interesados.","d":"Disposiciones de carácter organizativo."},"correcta":"a","explicacion":"El artículo 47.2 incluye las disposiciones que establezcan «la retroactividad de disposiciones sancionadoras no favorables o restrictivas de derechos individuales». No alcanza a cualquier disposición (b), ni a las favorables (c), ni a las organizativas (d).","cita":"«2. También serán nulas de pleno derecho las disposiciones administrativas que vulneren la Constitución, las leyes u otras disposiciones administrativas de rango superior, las que regulen materias reservadas a la Ley, y las que establezcan la retroactividad de disposiciones sancionadoras no favorables o restrictivas de derechos individuales.»","dificultad":2},{"id":"L39-L3-046","ley":"L39","articulo":"52.2","articulo_txt":"Art. 52.2 Ley 39/2015","bloque_id":"L39|Título III. De los actos administrativos · Capítulo III. Nulidad y anulabilidad","enunciado":"Según el artículo 52.2 de la Ley 39/2015, el acto de convalidación producirá efecto:","opciones":{"a":"Desde la fecha del acto convalidado, en todo caso.","b":"Desde su notificación a los interesados, en todo caso.","c":"Desde la fecha del acto convalidado, salvo que lesione derechos de terceros.","d":"Desde su fecha, salvo lo dispuesto en el artículo 39.3 para la retroactividad de los actos administrativos."},"correcta":"d","explicacion":"El artículo 52.2 dispone que el acto de convalidación «producirá efecto desde su fecha, salvo lo dispuesto en el artículo 39.3 para la retroactividad de los actos administrativos». La a) y la c) le atribuyen, como regla, efectos retroactivos a la fecha del acto convalidado, y la b) cambia el momento inicial.","cita":"«2. El acto de convalidación producirá efecto desde su fecha, salvo lo dispuesto en el artículo 39.3 para la retroactividad de los actos administrativos.»","dificultad":2},{"id":"L39-L4-003","ley":"L39","articulo":"53.1.c","articulo_txt":"Art. 53.1.c Ley 39/2015","bloque_id":"L39|Título IV. De las disposiciones sobre el procedimiento administrativo común · Capítulo I. Garantías del procedimiento","enunciado":"Según el artículo 53.1.c) de la Ley 39/2015, cuando, excepcionalmente, un interesado deba presentar un documento original, tendrá derecho a:","opciones":{"a":"Que el original le sea devuelto en el plazo máximo de diez días.","b":"Sustituirlo por una declaración responsable sobre su contenido.","c":"Que se le exima de aportar cualquier otro documento en ese procedimiento.","d":"Obtener una copia autenticada de éste."},"correcta":"d","explicacion":"El artículo 53.1.c) establece que, si excepcionalmente deben presentar un documento original, los interesados «tendrán derecho a obtener una copia autenticada de éste». El precepto no fija un plazo de devolución del original (a), no permite sustituirlo por una declaración responsable (b) ni exime de aportar otros documentos (c).","cita":"«c) A no presentar documentos originales salvo que, de manera excepcional, la normativa reguladora aplicable establezca lo contrario. En caso de que, excepcionalmente, deban presentar un documento original, tendrán derecho a obtener una copia autenticada de éste.»","dificultad":1},{"id":"L39-L4-005","ley":"L39","articulo":"53.1.e","articulo_txt":"Art. 53.1.e Ley 39/2015","bloque_id":"L39|Título IV. De las disposiciones sobre el procedimiento administrativo común · Capítulo I. Garantías del procedimiento","enunciado":"Según el artículo 53.1.e) de la Ley 39/2015, los interesados tienen derecho a formular alegaciones, utilizar los medios de defensa admitidos por el Ordenamiento Jurídico y aportar documentos:","opciones":{"a":"Únicamente durante el trámite de audiencia.","b":"En cualquier momento anterior a que se dicte la resolución.","c":"En cualquier fase del procedimiento anterior al trámite de audiencia.","d":"Solo dentro de los diez días siguientes a la notificación del acuerdo de iniciación."},"correcta":"c","explicacion":"El artículo 53.1.e) permite formular alegaciones y aportar documentos «en cualquier fase del procedimiento anterior al trámite de audiencia», que deberán ser tenidos en cuenta por el órgano competente al redactar la propuesta de resolución. La a) limita indebidamente el derecho al trámite de audiencia, la b) extiende el límite hasta la resolución y la d) fija un plazo de diez días que el precepto no contiene.","cita":"«e) A formular alegaciones, utilizar los medios de defensa admitidos por el Ordenamiento Jurídico, y a aportar documentos en cualquier fase del procedimiento anterior al trámite de audiencia, que deberán ser tenidos en cuenta por el órgano competente al redactar la propuesta de resolución.»","dificultad":2},{"id":"L39-L4-001","ley":"L39","articulo":"53.1.a","articulo_txt":"Art. 53.1.a Ley 39/2015","bloque_id":"L39|Título IV. De las disposiciones sobre el procedimiento administrativo común · Capítulo I. Garantías del procedimiento","enunciado":"Según el artículo 53.1.a) de la Ley 39/2015, ¿cuál de los siguientes extremos NO figura entre los que los interesados tienen derecho a conocer, en cualquier momento, respecto de los procedimientos en los que tengan esa condición?","opciones":{"a":"El estado de la tramitación del procedimiento.","b":"El sentido del silencio administrativo que corresponda si la Administración no dicta ni notifica resolución expresa en plazo.","c":"La identidad de los demás interesados que se hayan personado en el procedimiento.","d":"Los actos de trámite dictados."},"correcta":"c","explicacion":"El artículo 53.1.a) reconoce el derecho a conocer el estado de la tramitación, «el sentido del silencio administrativo que corresponda», el órgano competente para la instrucción y resolución «y los actos de trámite dictados», pero no la identidad de los demás interesados. Por eso la a), la b) y la d) sí figuran en el precepto y la c) es la respuesta.","cita":"«a) A conocer, en cualquier momento, el estado de la tramitación de los procedimientos en los que tengan la condición de interesados; el sentido del silencio administrativo que corresponda, en caso de que la Administración no dicte ni notifique resolución expresa en plazo; el órgano competente para su instrucción, en su caso, y resolución; y los actos de trámite dictados.»","dificultad":2},{"id":"L39-L4-004","ley":"L39","articulo":"53.1.d","articulo_txt":"Art. 53.1.d Ley 39/2015","bloque_id":"L39|Título IV. De las disposiciones sobre el procedimiento administrativo común · Capítulo I. Garantías del procedimiento","enunciado":"Según el artículo 53.1.d) de la Ley 39/2015, los interesados tienen derecho a no presentar datos y documentos no exigidos por las normas aplicables al procedimiento de que se trate, que ya se encuentren en poder de las Administraciones Públicas o que:","opciones":{"a":"Hayan sido elaborados por éstas.","b":"Hayan sido declarados confidenciales por el propio interesado.","c":"Consten en cualquier registro público de otro Estado miembro de la Unión Europea.","d":"Hayan sido verificados mediante la firma electrónica del interesado."},"correcta":"a","explicacion":"El artículo 53.1.d) reconoce el derecho a no presentar datos y documentos no exigidos por las normas aplicables, «que ya se encuentren en poder de las Administraciones Públicas o que hayan sido elaborados por éstas». La b), la c) y la d) introducen supuestos que el precepto no contempla.","cita":"«d) A no presentar datos y documentos no exigidos por las normas aplicables al procedimiento de que se trate, que ya se encuentren en poder de las Administraciones Públicas o que hayan sido elaborados por éstas.»","dificultad":1},{"id":"L39-L4-036","ley":"L39","articulo":"66.6","articulo_txt":"Art. 66.6 Ley 39/2015","bloque_id":"L39|Título IV. De las disposiciones sobre el procedimiento administrativo común · Capítulo II. Iniciación del procedimiento","enunciado":"Según el artículo 66.6 de la Ley 39/2015, cuando la Administración, en un procedimiento concreto, establezca expresamente modelos específicos de presentación de solicitudes, estos modelos serán:","opciones":{"a":"De uso obligatorio por los interesados.","b":"De uso voluntario, como los modelos de presentación masiva.","c":"De uso obligatorio solo para los sujetos obligados a relacionarse electrónicamente.","d":"De uso obligatorio solo en los procedimientos de concurrencia competitiva."},"correcta":"a","explicacion":"El artículo 66.6 dispone que esos modelos específicos «serán de uso obligatorio por los interesados», sin limitarlo a ciertos sujetos (c) o procedimientos (d). La b) confunde este supuesto con los modelos de presentación masiva del artículo 66.4, que sí son «de uso voluntario».","cita":"«6. Cuando la Administración en un procedimiento concreto establezca expresamente modelos específicos de presentación de solicitudes, éstos serán de uso obligatorio por los interesados.»","dificultad":1},{"id":"L39-L4-039","ley":"L39","articulo":"67.1","articulo_txt":"Art. 67.1 Ley 39/2015","bloque_id":"L39|Título IV. De las disposiciones sobre el procedimiento administrativo común · Capítulo II. Iniciación del procedimiento","enunciado":"Según el artículo 67.1 de la Ley 39/2015, en los casos de responsabilidad patrimonial a que se refiere el artículo 32, apartados 4 y 5, de la Ley de Régimen Jurídico del Sector Público, el plazo para reclamar se cuenta desde:","opciones":{"a":"La entrada en vigor de la norma declarada inconstitucional o contraria al Derecho de la Unión Europea.","b":"La publicación en el «Boletín Oficial del Estado» o en el «Diario Oficial de la Unión Europea», según el caso, de la sentencia que declare la inconstitucionalidad de la norma o su carácter contrario al Derecho de la Unión Europea.","c":"La notificación al interesado de la resolución administrativa que le aplicó la norma.","d":"La fecha en que se dicte la sentencia, con independencia de su publicación."},"correcta":"b","explicacion":"El tercer párrafo del artículo 67.1 vincula el plazo a la publicación oficial de la sentencia que declare la inconstitucionalidad de la norma o su carácter contrario al Derecho de la Unión Europea. No se cuenta desde la entrada en vigor de la norma (a), ni desde una notificación (c), ni desde la fecha de la sentencia sin atender a su publicación (d).","cita":"«En los casos de responsabilidad patrimonial a que se refiere el artículo 32, apartados 4 y 5, de la Ley de Régimen Jurídico del Sector Público, el derecho a reclamar prescribirá al año de la publicación en el «Boletín Oficial del Estado» o en el «Diario Oficial de la Unión Europea», según el caso, de la sentencia que declare la inconstitucionalidad de la norma o su carácter contrario al Derecho de la Unión Europea.»","dificultad":3},{"id":"L39-L4-041","ley":"L39","articulo":"68.2","articulo_txt":"Art. 68.2 Ley 39/2015","bloque_id":"L39|Título IV. De las disposiciones sobre el procedimiento administrativo común · Capítulo II. Iniciación del procedimiento","enunciado":"Según el artículo 68.2 de la Ley 39/2015, la ampliación prudencial del plazo de subsanación de la solicitud, cuando la aportación de los documentos requeridos presente dificultades especiales, NO es posible en los procedimientos:","opciones":{"a":"Iniciados mediante presentación electrónica.","b":"De responsabilidad patrimonial.","c":"Tramitados por la Administración General del Estado.","d":"Selectivos o de concurrencia competitiva."},"correcta":"d","explicacion":"El artículo 68.2 permite ampliar el plazo «hasta cinco días», a petición del interesado o a iniciativa del órgano, siempre que no se trate de «procedimientos selectivos o de concurrencia competitiva». Ninguna de las demás opciones figura como excepción en el precepto.","cita":"«2. Siempre que no se trate de procedimientos selectivos o de concurrencia competitiva, este plazo podrá ser ampliado prudencialmente, hasta cinco días, a petición del interesado o a iniciativa del órgano, cuando la aportación de los documentos requeridos presente dificultades especiales.»","dificultad":2},{"id":"L39-L4-043","ley":"L39","articulo":"69.1","articulo_txt":"Art. 69.1 Ley 39/2015","bloque_id":"L39|Título IV. De las disposiciones sobre el procedimiento administrativo común · Capítulo II. Iniciación del procedimiento","enunciado":"Según el artículo 69.1 de la Ley 39/2015, en la declaración responsable el interesado manifiesta, bajo su responsabilidad, que cumple con los requisitos establecidos en la normativa vigente, que dispone de la documentación que así lo acredita y que:","opciones":{"a":"La acompaña necesariamente a la declaración.","b":"La presentará en el registro en el plazo de diez días desde la declaración.","c":"La pondrá a disposición de la Administración cuando le sea requerida.","d":"La conservará únicamente hasta que la Administración realice la primera comprobación."},"correcta":"c","explicacion":"El artículo 69.1 define la declaración responsable como el documento en que el interesado manifiesta que dispone de la documentación acreditativa, «que la pondrá a disposición de la Administración cuando le sea requerida», y que se compromete a mantener el cumplimiento durante el período inherente al reconocimiento o ejercicio. No exige acompañarla (a) ni presentarla en un plazo (b), y la d) contradice ese compromiso de mantenimiento.","cita":"«1. A los efectos de esta Ley, se entenderá por declaración responsable el documento suscrito por un interesado en el que éste manifiesta, bajo su responsabilidad, que cumple con los requisitos establecidos en la normativa vigente para obtener el reconocimiento de un derecho o facultad o para su ejercicio, que dispone de la documentación que así lo acredita, que la pondrá a disposición de la Administración cuando le sea requerida, y que se compromete a mantener el cumplimiento de las anteriores obligaciones durante el período de tiempo inherente a dicho reconocimiento o ejercicio.»","dificultad":2}]};</script>
<script>
/* Letra de Ley — motor de test. Sin dependencias; funciona sin conexión.
   Necesita window.LDL_CONFIG y window.LDL_BANCO (los inyecta sistema/letradeley.py). */
(function () {
  "use strict";
  var CFG = window.LDL_CONFIG, B = window.LDL_BANCO;
  var raiz = document.getElementById("ldl");
  var LETRAS = ["a", "b", "c", "d"];
  var POR_ID = {};
  B.preguntas.forEach(function (p) { POR_ID[p.id] = p; });
  var CLAVE = "ldl1:" + CFG.pack.id;
  var prog = cargar();
  var sesion = null;
  var vista = CFG.modo === "web" ? "portada" : "inicio";
  var reloj = null;

  /* ---------- utilidades ---------- */
  function esc(t) {
    return String(t == null ? "" : t).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function barajar(lista) {
    var a = lista.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function pct(a, b) { return b ? Math.round((a / b) * 100) : 0; }
  function plural(n, uno, varios) { return n + " " + (n === 1 ? uno : varios); }
  function num(n) { return String(n).replace(".", ","); }
  function cargar() {
    try { var s = localStorage.getItem(CLAVE); if (s) { var d = JSON.parse(s); if (d && d.p) return d; } } catch (e) {}
    return { p: {}, h: [] };
  }
  function guardar() { try { localStorage.setItem(CLAVE, JSON.stringify(prog)); } catch (e) {} }
  function registrar(id, acierto) {
    var r = prog.p[id] || { v: 0, a: 0, f: 0, c: 0 };
    r.v++;
    if (acierto) { r.a++; r.c = Math.min((r.c || 0) + 1, 5); } else { r.f++; r.c = 0; }
    r.u = acierto ? 1 : 0;
    r.t = Date.now();
    prog.p[id] = r;
    guardar();
  }
  function fallosPendientes() {
    return B.preguntas.filter(function (p) { var r = prog.p[p.id]; return r && r.u === 0; });
  }
  function resumen(lista) {
    var vistas = 0, aciertos = 0, intentos = 0;
    lista.forEach(function (p) {
      var r = prog.p[p.id];
      if (r) { vistas++; aciertos += r.a; intentos += r.v; }
    });
    return { total: lista.length, vistas: vistas, acierto: pct(aciertos, intentos) };
  }
  function delBloque(id) { return B.preguntas.filter(function (p) { return p.bloque_id === id; }); }

  /* ---------- tema claro / oscuro ---------- */
  function aplicarTema() {
    var t = null;
    try { t = localStorage.getItem("ldl:tema"); } catch (e) {}
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    else document.documentElement.removeAttribute("data-theme");
    return t || "auto";
  }
  function cambiarTema() {
    var orden = { auto: "light", light: "dark", dark: "auto" };
    var actual = aplicarTema();
    try { localStorage.setItem("ldl:tema", orden[actual]); } catch (e) {}
    aplicarTema();
    pintar();
  }

  /* ---------- sesiones ---------- */
  function empezar(tipo, preguntas, opciones) {
    opciones = opciones || {};
    if (!preguntas.length) return;
    pararReloj();
    sesion = {
      tipo: tipo, titulo: opciones.titulo || "Test", ids: preguntas.map(function (p) { return p.id; }),
      i: 0, resp: {}, corregida: {}, inicio: Date.now(), limite: opciones.minutos ? opciones.minutos * 60 : 0, fin: null,
      origen: vista === "test" || vista === "resultado" ? (sesion && sesion.origen) || "inicio" : vista
    };
    vista = "test";
    if (sesion.limite) reloj = setInterval(tic, 1000);
    pintar();
    window.scrollTo(0, 0);
  }
  function tic() {
    if (!sesion || sesion.fin) return pararReloj();
    var el = document.getElementById("ldl-crono");
    var resta = sesion.limite - Math.floor((Date.now() - sesion.inicio) / 1000);
    if (resta <= 0) { terminar(); return; }
    if (el) el.textContent = mmss(resta);
  }
  function pararReloj() { if (reloj) { clearInterval(reloj); reloj = null; } }
  function mmss(s) { var m = Math.floor(s / 60), r = s % 60; return m + ":" + (r < 10 ? "0" : "") + r; }

  function responder(letra) {
    var id = sesion.ids[sesion.i];
    if (sesion.tipo === "simulacro") {
      sesion.resp[id] = sesion.resp[id] === letra ? undefined : letra;
      pintar();
      return;
    }
    if (sesion.corregida[id]) return;
    sesion.resp[id] = letra;
    sesion.corregida[id] = true;
    registrar(id, letra === POR_ID[id].correcta);
    pintar();
  }
  function siguiente() {
    if (sesion.i < sesion.ids.length - 1) { sesion.i++; pintar(); window.scrollTo(0, 0); }
    else terminar();
  }
  function anterior() { if (sesion.i > 0) { sesion.i--; pintar(); } }
  function terminar() {
    pararReloj();
    if (sesion.tipo === "simulacro") {
      sesion.ids.forEach(function (id) {
        if (sesion.resp[id]) registrar(id, sesion.resp[id] === POR_ID[id].correcta);
      });
    }
    sesion.fin = Date.now();
    var r = calcular(sesion);
    prog.h.unshift({ t: sesion.fin, tipo: sesion.tipo, n: r.total, a: r.aciertos, e: r.errores, nota: r.nota });
    prog.h = prog.h.slice(0, 50);
    guardar();
    vista = "resultado";
    pintar();
    window.scrollTo(0, 0);
  }
  function calcular(s) {
    var a = 0, e = 0, nr = 0;
    s.ids.forEach(function (id) {
      var r = s.resp[id];
      if (!r) nr++; else if (r === POR_ID[id].correcta) a++; else e++;
    });
    var pen = (CFG.simulacro && CFG.simulacro.penalizacion) || 1 / 3;
    var neta = s.tipo === "simulacro" ? a - e * pen : a;
    var nota = Math.max(0, (neta / s.ids.length) * 10);
    return { total: s.ids.length, aciertos: a, errores: e, blancos: nr, neta: neta, nota: Math.round(nota * 100) / 100 };
  }

  /* ---------- vistas ---------- */
  function cabecera() {
    var tema = aplicarTema();
    var etiquetas = { auto: "Tema: auto", light: "Tema: claro", dark: "Tema: oscuro" };
    return '<header class="ldl-top"><a class="ldl-brand" href="' + esc(CFG.web || "#") + '">' +
      '<span class="ldl-logo" aria-hidden="true">§</span><span><b>Letra de Ley</b><small>' +
      esc(CFG.pack.nombre) + "</small></span></a>" +
      '<button class="ldl-tema" data-acc="tema" type="button">' + etiquetas[tema] + "</button></header>";
  }
  function navegacion() {
    if (CFG.modo === "web") return "";
    var items = [["inicio", "Inicio"], ["temas", "Por temas"], ["simulacro", "Simulacro"], ["fallos", "Fallos"], ["stats", "Estadísticas"]];
    return '<nav class="ldl-nav" aria-label="Secciones">' + items.map(function (it) {
      var actual = vista === it[0] || (vista === "test" && sesion && sesion.origen === it[0]);
      return '<button type="button" data-acc="ir" data-v="' + it[0] + '"' + (actual ? ' aria-current="page"' : "") + ">" + it[1] + "</button>";
    }).join("") + "</nav>";
  }
  function pie() {
    return '<p class="ldl-pie">Letra de Ley · ' + esc(CFG.pack.edicion) + " · Texto legal actualizado a " +
      esc(CFG.pack.actualizado) + "<br>Uso personal. Prohibida su redistribución.</p>";
  }

  function vInicio() {
    var r = resumen(B.preguntas), f = fallosPendientes().length;
    return '<section class="ldl-card"><h2>' + esc(CFG.pack.nombre) + "</h2>" +
      '<p class="ldl-muted">' + B.preguntas.length + " preguntas comentadas, con el artículo exacto de cada respuesta.</p>" +
      '<div class="ldl-kpis"><div class="ldl-kpi"><b>' + r.vistas + "/" + r.total + "</b><span>respondidas</span></div>" +
      '<div class="ldl-kpi"><b>' + r.acierto + ' %</b><span>de acierto</span></div>' +
      '<div class="ldl-kpi"><b>' + f + "</b><span>fallos por repasar</span></div></div>" +
      '<div class="ldl-acciones"><button class="ldl-btn" data-acc="rapido" type="button">Test rápido de 20</button>' +
      '<button class="ldl-btn sec" data-acc="ir" data-v="simulacro" type="button">Simulacro de examen</button>' +
      (f ? '<button class="ldl-btn sec" data-acc="repasar" type="button">Repasar ' + f + " fallos</button>" : "") +
      "</div></section>" +
      '<section class="ldl-card"><h3>Cómo sacarle partido</h3><ol class="ldl-muted">' +
      "<li>Practica <b>por temas</b>: cada respuesta te enseña el artículo y por qué fallan las demás opciones.</li>" +
      "<li>Cada pocos días, <b>repasa tus fallos</b>: es donde más se aprende.</li>" +
      "<li>Antes del examen, haz <b>simulacros</b> con tiempo y con la penalización real (cada error resta 1/3).</li></ol>" +
      '<p class="ldl-small ldl-muted">Tu progreso se guarda en este dispositivo y en este navegador.</p></section>' + historial();
  }
  function historial() {
    if (!prog.h.length) return "";
    return '<section class="ldl-card"><h3>Últimos tests</h3><ul class="ldl-revision">' + prog.h.slice(0, 5).map(function (h) {
      var d = new Date(h.t);
      return "<li><b>" + (h.tipo === "simulacro" ? "Simulacro" : "Práctica") + "</b> · " + d.toLocaleDateString("es-ES") +
        " · " + h.a + "/" + h.n + " aciertos" + (h.tipo === "simulacro" ? " · nota " + num(h.nota) : "") + "</li>";
    }).join("") + "</ul></section>";
  }
  function vTemas() {
    var html = '<section class="ldl-card"><h2>Practicar por temas</h2><p class="ldl-muted">Elige un bloque. Las preguntas salen en orden aleatorio y se corrigen al momento.</p><ul class="ldl-bloques">';
    B.bloques.forEach(function (b) {
      var lista = delBloque(b.id), r = resumen(lista);
      html += '<li><button type="button" data-acc="bloque" data-id="' + esc(b.id) + '"><span class="t">' + esc(b.nombre) +
        '</span><span class="n">' + r.vistas + "/" + r.total + (r.vistas ? " · " + r.acierto + " %" : "") + "</span>" +
        '<span class="ldl-barra"><i style="width:' + pct(r.vistas, r.total) + '%"></i></span></button></li>';
    });
    return html + "</ul></section>";
  }
  function vSimulacro() {
    var total = B.preguntas.length;
    var opcionesN = [10, 20, 30, 50, 100].filter(function (n) { return n < total; });
    opcionesN.push(total);
    var porDefecto = Math.min((CFG.simulacro && CFG.simulacro.preguntas) || 30, total);
    return '<section class="ldl-card"><h2>Simulacro de examen</h2>' +
      '<p class="ldl-muted">Como el día del examen: no ves las soluciones hasta el final y cada error resta un tercio de acierto.</p>' +
      '<div class="ldl-campo"><label for="ldl-n">Número de preguntas</label><select id="ldl-n">' +
      opcionesN.map(function (n) { return "<option" + (n === porDefecto ? " selected" : "") + ">" + n + "</option>"; }).join("") +
      '</select></div><div class="ldl-campo"><label for="ldl-t">Tiempo</label><select id="ldl-t">' +
      '<option value="1">1 minuto por pregunta</option><option value="0">Sin límite de tiempo</option></select></div>' +
      '<div class="ldl-campo"><label for="ldl-b">Temas</label><select id="ldl-b"><option value="">Todos</option>' +
      B.bloques.map(function (b) { return '<option value="' + esc(b.id) + '">' + esc(b.nombre) + "</option>"; }).join("") +
      '</select></div><div class="ldl-acciones"><button class="ldl-btn" data-acc="simular" type="button">Empezar simulacro</button></div></section>';
  }
  function vFallos() {
    var f = fallosPendientes();
    if (!f.length) {
      return '<section class="ldl-card"><h2>Repaso de fallos</h2><p class="ldl-muted">No tienes fallos pendientes. Cuando falles una pregunta aparecerá aquí hasta que la aciertes.</p></section>';
    }
    return '<section class="ldl-card"><h2>Repaso de fallos</h2><p class="ldl-muted">Tienes <b>' + f.length +
      "</b> preguntas falladas. Salen de aquí en cuanto las aciertas.</p>" +
      '<div class="ldl-acciones"><button class="ldl-btn" data-acc="repasar" type="button">Repasar ahora</button></div></section>';
  }
  function vStats() {
    var html = '<section class="ldl-card"><h2>Estadísticas</h2><ul class="ldl-bloques">';
    B.bloques.forEach(function (b) {
      var r = resumen(delBloque(b.id));
      html += '<li><button type="button" data-acc="bloque" data-id="' + esc(b.id) + '"><span class="t">' + esc(b.nombre) +
        '</span><span class="n">' + (r.vistas ? r.acierto + " % de acierto" : "sin empezar") + '</span><span class="ldl-barra"><i style="width:' +
        r.acierto + '%"></i></span></button></li>';
    });
    html += '</ul></section><section class="ldl-card"><h3>Empezar de cero</h3><p class="ldl-muted ldl-small">Borra tu progreso guardado en este dispositivo.</p>' +
      '<div class="ldl-acciones"><button class="ldl-btn sec" data-acc="borrar" type="button">Borrar mi progreso</button></div></section>';
    return html;
  }
  function vPortada() {
    var n = B.preguntas.length;
    return '<section class="ldl-card"><h2>' + esc(CFG.pack.nombre) + "</h2>" +
      '<p class="ldl-muted">' + n + " preguntas tipo examen, corregidas al momento, con el artículo exacto y la explicación de cada opción. Gratis y sin registrarte.</p>" +
      '<div class="ldl-acciones"><button class="ldl-btn" data-acc="empezarweb" type="button">Empezar el test</button></div></section>';
  }

  function vTest() {
    var id = sesion.ids[sesion.i], p = POR_ID[id], sim = sesion.tipo === "simulacro";
    var elegida = sesion.resp[id], corregida = !sim && sesion.corregida[id];
    var html = '<section class="ldl-card"><div class="ldl-meta"><span>' + esc(sesion.titulo) + " · " + (sesion.i + 1) + " de " + sesion.ids.length +
      "</span><span>" + (sesion.limite ? '⏱ <span id="ldl-crono" class="ldl-crono">' +
        mmss(Math.max(0, sesion.limite - Math.floor((Date.now() - sesion.inicio) / 1000))) + "</span>" : esc(p.articulo_txt)) +
      '</span></div><div class="ldl-progreso"><i style="width:' + pct(sesion.i + (corregida ? 1 : 0), sesion.ids.length) + '%"></i></div>' +
      '<p class="ldl-enunciado">' + esc(p.enunciado) + '</p><div class="ldl-opciones" role="group" aria-label="Opciones">';
    LETRAS.forEach(function (l) {
      var cls = "ldl-op";
      if (corregida) { if (l === p.correcta) cls += " ok"; else if (l === elegida) cls += " ko"; }
      else if (sim && elegida === l) cls += " marcada";
      html += '<button type="button" class="' + cls + '" data-acc="resp" data-l="' + l + '"' + (corregida ? " disabled" : "") +
        (sim ? ' aria-pressed="' + (elegida === l) + '"' : "") + '><span class="l">' + l + ")</span><span>" + esc(p.opciones[l]) + "</span></button>";
    });
    html += "</div>";
    if (corregida) html += feedback(p, elegida);
    html += '<div class="ldl-acciones">';
    if (sim) {
      html += (sesion.i > 0 ? '<button class="ldl-btn sec" data-acc="ant" type="button">Anterior</button>' : "") +
        '<button class="ldl-btn" data-acc="sig" type="button">' + (sesion.i < sesion.ids.length - 1 ? "Siguiente" : "Entregar") + "</button>" +
        (sesion.i < sesion.ids.length - 1 ? '<button class="ldl-btn sec" data-acc="entregar" type="button">Entregar ya</button>' : "");
    } else if (corregida) {
      html += '<button class="ldl-btn" data-acc="sig" type="button">' + (sesion.i < sesion.ids.length - 1 ? "Siguiente" : "Ver resultado") + "</button>";
    }
    html += '<button class="ldl-btn sec" data-acc="salir" type="button">Salir</button></div></section>';
    return html;
  }
  function feedback(p, elegida) {
    var bien = elegida === p.correcta;
    return '<div class="ldl-feedback" aria-live="polite"><div class="v ' + (bien ? "ok" : "ko") + '">' +
      (bien ? "¡Correcta!" : "Incorrecta. La respuesta correcta es la " + p.correcta + ")") + "</div><div>" + esc(p.explicacion) + "</div>" +
      (p.cita ? '<blockquote class="ldl-cita">' + esc(p.cita) + "<small>" + esc(p.articulo_txt) + "</small></blockquote>" : "") + "</div>";
  }
  function vResultado() {
    var r = calcular(sesion), sim = sesion.tipo === "simulacro";
    var html = '<section class="ldl-card"><h2>' + (sim ? "Resultado del simulacro" : "Resultado") + "</h2>" +
      '<div class="ldl-nota">' + (sim ? num(r.nota.toFixed(2)) : r.aciertos + "/" + r.total) + "</div>" +
      '<p class="ldl-muted">' + plural(r.aciertos, "acierto", "aciertos") + " · " + plural(r.errores, "error", "errores") +
      (r.blancos ? " · " + r.blancos + " en blanco" : "") +
      (sim ? " · nota sobre 10 con penalización" : "") + "</p>";
    if (CFG.modo === "web") html += ctaWeb(r);
    html += '<div class="ldl-acciones">' + (CFG.modo === "web" ? '<button class="ldl-btn sec" data-acc="empezarweb" type="button">Repetir con otro orden</button>' :
      '<button class="ldl-btn" data-acc="ir" data-v="inicio" type="button">Volver al inicio</button>') + "</div></section>";
    html += '<section class="ldl-card"><h3>Revisión</h3><ul class="ldl-revision">';
    sesion.ids.forEach(function (id, n) {
      var p = POR_ID[id], e = sesion.resp[id], chip = !e ? '<span class="ldl-chip nr">En blanco</span>' :
        e === p.correcta ? '<span class="ldl-chip ok">Bien</span>' : '<span class="ldl-chip ko">Mal</span>';
      html += "<li>" + chip + '<span class="e">' + (n + 1) + ". " + esc(p.enunciado) + "</span><br>" +
        '<span class="ldl-small">Correcta: <b>' + p.correcta + ") " + esc(p.opciones[p.correcta]) + "</b>" +
        (e && e !== p.correcta ? " · Marcaste " + e + ")" : "") + '</span><br><span class="ldl-small ldl-muted">' + esc(p.explicacion) + "</span></li>";
    });
    return html + "</ul></section>";
  }
  function ctaWeb() {
    var c = CFG.compra || {}, html = "";
    if (c.url) {
      html += '<div class="ldl-card ldl-cta"><h3>' + esc(c.titulo) + '</h3><p class="ldl-muted">' + esc(c.texto) + "</p>" +
        '<div class="ldl-acciones"><a class="ldl-btn acc" href="' + esc(c.url) + '">' + esc(c.boton) + "</a></div></div>";
    }
    if (CFG.telegram) {
      html += '<p class="ldl-small">¿Quieres un test cada día? <a href="' + esc(CFG.telegram) + '">Únete gratis al canal de Telegram</a>.</p>';
    }
    return html;
  }

  function pintar() {
    var cuerpo;
    if (vista === "test") cuerpo = vTest();
    else if (vista === "resultado") cuerpo = vResultado();
    else if (vista === "portada") cuerpo = vPortada();
    else if (vista === "temas") cuerpo = vTemas();
    else if (vista === "simulacro") cuerpo = vSimulacro();
    else if (vista === "fallos") cuerpo = vFallos();
    else if (vista === "stats") cuerpo = vStats();
    else cuerpo = vInicio();
    raiz.innerHTML = '<div class="ldl">' + cabecera() + navegacion() + "<main>" + cuerpo + "</main>" + pie() + "</div>";
  }

  /* ---------- eventos ---------- */
  raiz.addEventListener("click", function (ev) {
    var el = ev.target.closest("[data-acc]");
    if (!el) return;
    var acc = el.getAttribute("data-acc");
    if (acc === "tema") return cambiarTema();
    if (acc === "ir") { pararReloj(); vista = el.getAttribute("data-v"); sesion = null; pintar(); return; }
    if (acc === "rapido") return empezar("practica", barajar(B.preguntas).slice(0, 20), { titulo: "Test rápido" });
    if (acc === "repasar") return empezar("practica", barajar(fallosPendientes()).slice(0, 30), { titulo: "Repaso de fallos" });
    if (acc === "bloque") {
      var b = B.bloques.filter(function (x) { return x.id === el.getAttribute("data-id"); })[0];
      return empezar("practica", barajar(delBloque(b.id)), { titulo: b.nombre });
    }
    if (acc === "simular") {
      var n = parseInt(document.getElementById("ldl-n").value, 10);
      var conTiempo = document.getElementById("ldl-t").value === "1";
      var bloque = document.getElementById("ldl-b").value;
      var fuente = bloque ? delBloque(bloque) : B.preguntas;
      var elegidas = barajar(fuente).slice(0, n);
      return empezar("simulacro", elegidas, { titulo: "Simulacro", minutos: conTiempo ? elegidas.length : 0 });
    }
    if (acc === "empezarweb") return empezar("practica", barajar(B.preguntas), { titulo: "Test gratuito" });
    if (acc === "resp") return responder(el.getAttribute("data-l"));
    if (acc === "sig") return siguiente();
    if (acc === "ant") return anterior();
    if (acc === "entregar") return terminar();
    if (acc === "salir") { pararReloj(); sesion = null; vista = CFG.modo === "web" ? "portada" : "inicio"; pintar(); return; }
    if (acc === "borrar") {
      if (el.getAttribute("data-confirmar") === "1") { prog = { p: {}, h: [] }; guardar(); pintar(); }
      else { el.setAttribute("data-confirmar", "1"); el.textContent = "Pulsa otra vez para confirmar"; }
    }
  });
  document.addEventListener("keydown", function (ev) {
    if (vista !== "test" || !sesion || ev.altKey || ev.ctrlKey || ev.metaKey) return;
    var k = ev.key.toLowerCase(), mapa = { "1": "a", "2": "b", "3": "c", "4": "d", a: "a", b: "b", c: "c", d: "d" };
    if (mapa[k]) { ev.preventDefault(); responder(mapa[k]); }
    else if (k === "enter" || k === "arrowright") {
      var id = sesion.ids[sesion.i];
      if (sesion.tipo === "simulacro" || sesion.corregida[id]) { ev.preventDefault(); siguiente(); }
    } else if (k === "arrowleft" && sesion.tipo === "simulacro") { ev.preventDefault(); anterior(); }
  });

  pintar();
})();
</script>
</body>
</html>
