},{"id":"L39|Título V. De la revisión de los actos en vía administrativa · Capítulo I. Revisión de oficio","ley":"L39","nombre":"Título V. De la revisión de los actos en vía administrativa · Capítulo I. Revisión de oficio"},{"id":"L39|Título V. De la revisión de los actos en vía administrativa · Capítulo II. Recursos administrativos · Sección 1.ª Principios generales","ley":"L39","nombre":"Título V. De la revisión de los actos en vía administrativa · Capítulo II. Recursos administrativos · Sección 1.ª Principios generales"},{"id":"L39|Título V. De la revisión de los actos en vía administrativa · Capítulo II. Recursos administrativos · Sección 2.ª Recurso de alzada","ley":"L39","nombre":"Título V. De la revisión de los actos en vía administrativa · Capítulo II. Recursos administrativos · Sección 2.ª Recurso de alzada"},{"id":"L39|Título V. De la revisión de los actos en vía administrativa · Capítulo II. Recursos administrativos · Sección 3.ª Recurso potestativo de reposición","ley":"L39","nombre":"Título V. De la revisión de los actos en vía administrativa · Capítulo II. Recursos administrativos · Sección 3.ª Recurso potestativo de reposición"},{"id":"L39|Título V. De la revisión de los actos en vía administrativa · Capítulo II. Recursos administrativos · Sección 4.ª Recurso extraordinario de revisión","ley":"L39","nombre":"Título V. De la revisión de los actos en vía administrativa · Capítulo II. Recursos administrativos · Sección 4.ª Recurso extraordinario de revisión"},{"id":"L39|Título VI. De la iniciativa legislativa y de la potestad para dictar reglamentos y otras disposiciones","ley":"L39","nombre":"Título VI. De la iniciativa legislativa y de la potestad para dictar reglamentos y otras disposiciones"},{"id":"L39|Disposiciones adicionales","ley":"L39","nombre":"Disposiciones adicionales"},{"id":"L39|Disposiciones transitorias","ley":"L39","nombre":"Disposiciones transitorias"},{"id":"L39|Disposición derogatoria","ley":"L39","nombre":"Disposición derogatoria"},{"id":"L39|Disposiciones finales","ley":"L39","nombre":"Disposiciones finales"}],"preguntas":[{"id":"L39-L1-002","ley":"L39","articulo":"1.1","articulo_txt":"Art. 1.1 Ley 39/2015","bloque_id":"L39|Título Preliminar. Disposiciones generales","enunciado":"Según el artículo 1.1 de la Ley 39/2015, la Ley también tiene por objeto regular los principios a los que se ha de ajustar el ejercicio de:","opciones":{"a":"La potestad sancionadora y la potestad reglamentaria","b":"La iniciativa legislativa y la potestad sancionadora","c":"La potestad reglamentaria y la potestad expropiatoria","d":"La iniciativa legislativa y la potestad reglamentaria"},"correcta":"d","explicacion":"El artículo 1.1 termina refiriéndose a «los principios a los que se ha de ajustar el ejercicio de la iniciativa legislativa y la potestad reglamentaria». La a) el artículo 1.1 no se refiere a los principios de la potestad sancionadora, sino a los de la iniciativa legislativa. La b) junto a la iniciativa legislativa, el artículo 1.1 cita la potestad reglamentaria, no la sancionadora. La c) el artículo 1.1 no menciona la potestad expropiatoria; la otra potestad citada es la iniciativa legislativa.","cita":"«(…) así como los principios a los que se ha de ajustar el ejercicio de la iniciativa legislativa y la potestad reglamentaria.»","dificultad":1},{"id":"L39-L1-006","ley":"L39","articulo":"2.3","articulo_txt":"Art. 2.3 Ley 39/2015","bloque_id":"L39|Título Preliminar. Disposiciones generales","enunciado":"Según el artículo 2.3 de la Ley 39/2015, ¿cuál de los siguientes NO tiene la consideración de Administración Pública?","opciones":{"a":"Las entidades de derecho privado vinculadas o dependientes de las Administraciones Públicas","b":"La Administración General del Estado","c":"Las Entidades que integran la Administración Local","d":"Los organismos públicos y entidades de derecho público vinculados o dependientes de las Administraciones Públicas"},"correcta":"a","explicacion":"El artículo 2.3 considera Administraciones Públicas a la Administración General del Estado, las de las Comunidades Autónomas, las Entidades que integran la Administración Local y los organismos públicos y entidades de derecho público de la letra a) del apartado 2, pero no a las entidades de derecho privado de la letra b). La b) figura expresamente en el artículo 2.3 como Administración Pública. La c) el artículo 2.3 las incluye expresamente entre las Administraciones Públicas. La d) el artículo 2.3 les reconoce esa consideración al remitirse a la letra a) del apartado 2.","cita":"«3. Tienen la consideración de Administraciones Públicas la Administración General del Estado, las Administraciones de las Comunidades Autónomas, las Entidades que integran la Administración Local, así como los organismos públicos y entidades de derecho público previstos en la letra a) del apartado 2 anterior.»","dificultad":2},{"id":"L39-L1-009","ley":"L39","articulo":"3.b","articulo_txt":"Art. 3.b Ley 39/2015","bloque_id":"L39|Título I. De los interesados en el procedimiento","enunciado":"Según el artículo 3.b) de la Ley 39/2015, los menores de edad tendrán capacidad de obrar ante las Administraciones Públicas:","opciones":{"a":"Solo cuando hayan cumplido dieciséis años, para el ejercicio y defensa de cualquiera de sus derechos e intereses y en cualquier procedimiento","b":"En ningún caso, pues deben actuar siempre por medio de quien ejerza la patria potestad, tutela o curatela","c":"Solo para formular solicitudes y presentar declaraciones responsables o comunicaciones, y siempre con la autorización expresa de quien ejerza la patria potestad, tutela o curatela","d":"Para el ejercicio y defensa de los derechos e intereses cuya actuación permita el ordenamiento jurídico sin la asistencia de quien ejerza la patria potestad, tutela o curatela"},"correcta":"d","explicacion":"El artículo 3.b) reconoce capacidad de obrar a los menores para el ejercicio y defensa de los derechos e intereses cuya actuación permita el ordenamiento jurídico sin la asistencia de quien ejerza la patria potestad, tutela o curatela. La a) el artículo 3.b) no fija una edad mínima, sino que atiende a los derechos e intereses cuya actuación permita el ordenamiento sin asistencia. La b) el artículo 3.b) sí les reconoce capacidad de obrar en determinados supuestos. La c) el artículo 3.b) no limita la capacidad a las solicitudes y declaraciones ni exige autorización: se refiere precisamente a actuaciones permitidas sin esa asistencia.","cita":"«b) Los menores de edad para el ejercicio y defensa de aquellos de sus derechos e intereses cuya actuación esté permitida por el ordenamiento jurídico sin la asistencia de la persona que ejerza la patria potestad, tutela o curatela. (…)»","dificultad":2},{"id":"L39-L1-008","ley":"L39","articulo":"3.a","articulo_txt":"Art. 3.a Ley 39/2015","bloque_id":"L39|Título I. De los interesados en el procedimiento","enunciado":"Según el artículo 3 de la Ley 39/2015, tendrán capacidad de obrar ante las Administraciones Públicas las personas físicas o jurídicas que ostenten capacidad de obrar con arreglo a:","opciones":{"a":"Las normas administrativas","b":"Las normas mercantiles","c":"Las normas civiles","d":"Las normas procesales"},"correcta":"c","explicacion":"El artículo 3.a) remite a la capacidad de obrar que las personas físicas o jurídicas ostenten «con arreglo a las normas civiles». La a) el artículo 3.a) no remite a las normas administrativas, sino a las civiles. La b) la referencia del artículo 3.a) es a las normas civiles, no a las mercantiles. La d) el artículo 3.a) no remite a las normas procesales, sino a las civiles.","cita":"«a) Las personas físicas o jurídicas que ostenten capacidad de obrar con arreglo a las normas civiles.»","dificultad":1},{"id":"L39-L2-016","ley":"L39","articulo":"20.2","articulo_txt":"Art. 20.2 Ley 39/2015","bloque_id":"L39|Título II. De la actividad de las Administraciones Públicas · Capítulo I. Normas generales de actuación","enunciado":"Según el artículo 20.2 de la Ley 39/2015, los interesados podrán solicitar la exigencia de la responsabilidad de los titulares de las unidades administrativas y del personal que tengan a su cargo la tramitación de los asuntos a:","opciones":{"a":"El superior jerárquico del órgano instructor, exclusivamente.","b":"El órgano jurisdiccional contencioso-administrativo competente.","c":"El Consejo de Transparencia y Buen Gobierno.","d":"La Administración Pública de que dependa el personal afectado."},"correcta":"d","explicacion":"El artículo 20.2 dispone que los interesados podrán solicitar la exigencia de esa responsabilidad «a la Administración Pública de que dependa el personal afectado». Ni el superior jerárquico del instructor (a), ni los tribunales (b), ni el Consejo de Transparencia (c) son los destinatarios que señala el precepto.","cita":"«2. Los interesados podrán solicitar la exigencia de esa responsabilidad a la Administración Pública de que dependa el personal afectado.»","dificultad":2},{"id":"L39-L2-029","ley":"L39","articulo":"24.4","articulo_txt":"Art. 24.4 Ley 39/2015","bloque_id":"L39|Título II. De la actividad de las Administraciones Públicas · Capítulo I. Normas generales de actuación","enunciado":"Según el artículo 24.4 de la Ley 39/2015, el certificado acreditativo del silencio producido se expedirá de oficio por el órgano competente para resolver en el plazo de:","opciones":{"a":"Diez días desde que expire el plazo máximo para resolver el procedimiento.","b":"Quince días desde que expire el plazo máximo para resolver el procedimiento.","c":"Un mes desde que expire el plazo máximo para resolver el procedimiento.","d":"Veinte días desde que el interesado lo solicite."},"correcta":"b","explicacion":"El artículo 24.4 dispone que el certificado «se expedirá de oficio por el órgano competente para resolver en el plazo de quince días desde que expire el plazo máximo para resolver». La a), la c) y la d) cambian el plazo; además, si lo pide el interesado, el mismo plazo se cuenta desde el día siguiente a la entrada de la petición en el registro electrónico competente.","cita":"«Este certificado se expedirá de oficio por el órgano competente para resolver en el plazo de quince días desde que expire el plazo máximo para resolver el procedimiento.»","dificultad":2},{"id":"L39-L2-040","ley":"L39","articulo":"30.1","articulo_txt":"Art. 30.1 Ley 39/2015","bloque_id":"L39|Título II. De la actividad de las Administraciones Públicas · Capítulo II. Términos y plazos","enunciado":"Según el artículo 30.1 de la Ley 39/2015, salvo que por ley o en el Derecho de la Unión Europea se disponga otro cómputo, cuando los plazos se señalen por horas:","opciones":{"a":"Se entiende que son naturales.","b":"Se entiende que son hábiles las comprendidas en el horario de atención al público de las oficinas de registro.","c":"Se entiende que son hábiles las comprendidas entre las ocho y las veinte horas de cada día hábil.","d":"Se entiende que son hábiles, y son hábiles todas las horas del día que formen parte de un día hábil."},"correcta":"d","explicacion":"El artículo 30.1 establece que, cuando los plazos se señalan por horas, «se entiende que éstas son hábiles» y que «son hábiles todas las horas del día que formen parte de un día hábil». La a) contradice la regla, y la b) y la c) restringen las horas hábiles a franjas horarias que la ley no prevé.","cita":"«1. Salvo que por Ley o en el Derecho de la Unión Europea se disponga otro cómputo, cuando los plazos se señalen por horas, se entiende que éstas son hábiles. Son hábiles todas las horas del día que formen parte de un día hábil.»","dificultad":2},{"id":"L39-L2-047","ley":"L39","articulo":"32.1","articulo_txt":"Art. 32.1 Ley 39/2015","bloque_id":"L39|Título II. De la actividad de las Administraciones Públicas · Capítulo II. Términos y plazos","enunciado":"Según el artículo 32.1 de la Ley 39/2015, la ampliación de los plazos establecidos que la Administración puede conceder, de oficio o a petición de los interesados, salvo precepto en contrario, tiene como límite máximo:","opciones":{"a":"Un tercio de los plazos establecidos.","b":"El doble de los plazos establecidos.","c":"El mismo plazo inicialmente establecido.","d":"La mitad de los plazos establecidos."},"correcta":"d","explicacion":"El artículo 32.1 permite una ampliación «que no exceda de la mitad de los mismos», si las circunstancias lo aconsejan y no se perjudican derechos de tercero. La c) recoge el límite de la ampliación del plazo máximo para resolver (art. 23.1), y la a) y la b) no responden al texto.","cita":"«1. La Administración, salvo precepto en contrario, podrá conceder de oficio o a petición de los interesados, una ampliación de los plazos establecidos, que no exceda de la mitad de los mismos, si las circunstancias lo aconsejan y con ello no se perjudican derechos de tercero. El acuerdo de ampliación deberá ser notificado a los interesados.»","dificultad":2},{"id":"L39-L3-001","ley":"L39","articulo":"34.2","articulo_txt":"Art. 34.2 Ley 39/2015","bloque_id":"L39|Título III. De los actos administrativos · Capítulo I. Requisitos de los actos administrativos","enunciado":"Según el artículo 34.2 de la Ley 39/2015, el contenido de los actos administrativos se ajustará a lo dispuesto por el ordenamiento jurídico y será:","opciones":{"a":"Determinado y adecuado a los fines de aquéllos.","b":"Uniforme para todos los interesados en el procedimiento.","c":"Proporcionado al interés público y a los medios disponibles.","d":"Conforme, en todo caso, con lo solicitado por el interesado."},"correcta":"a","explicacion":"El artículo 34.2 exige que el contenido de los actos sea «determinado y adecuado a los fines de aquéllos». Ni la uniformidad (b), ni la proporcionalidad a los medios disponibles (c), ni la conformidad en todo caso con lo solicitado (d) figuran en ese apartado.","cita":"«2. El contenido de los actos se ajustará a lo dispuesto por el ordenamiento jurídico y será determinado y adecuado a los fines de aquéllos.»","dificultad":1},{"id":"L39-L3-003","ley":"L39","articulo":"35.1","articulo_txt":"Art. 35.1 Ley 39/2015","bloque_id":"L39|Título III. De los actos administrativos · Capítulo I. Requisitos de los actos administrativos","enunciado":"Según el artículo 35.1 de la Ley 39/2015, los actos que deben ser motivados lo serán con:","opciones":{"a":"Exposición detallada de los hechos, de los fundamentos de derecho y de las pruebas practicadas.","b":"Sucinta referencia de hechos y fundamentos de derecho.","c":"Referencia expresa a los informes y dictámenes que consten en el expediente.","d":"Sucinta referencia a los fundamentos de derecho, sin necesidad de relatar los hechos."},"correcta":"b","explicacion":"El artículo 35.1 dispone que serán motivados «con sucinta referencia de hechos y fundamentos de derecho». La a) exige una exposición detallada que la ley no pide; la c) añade una referencia a informes que el precepto no establece, y la d) suprime la referencia a los hechos.","cita":"«1. Serán motivados, con sucinta referencia de hechos y fundamentos de derecho:»","dificultad":1},{"id":"L39-L3-030","ley":"L39","articulo":"44","articulo_txt":"Art. 44 Ley 39/2015","bloque_id":"L39|Título III. De los actos administrativos · Capítulo II. Eficacia de los actos","enunciado":"Según el artículo 44 de la Ley 39/2015, cuando los interesados en un procedimiento sean desconocidos, se ignore el lugar de la notificación o bien, intentada ésta, no se hubiese podido practicar, la notificación se hará por medio de un anuncio publicado en:","opciones":{"a":"La sede electrónica de la Administración u Organismo actuante.","b":"El «Boletín Oficial del Estado».","c":"La dirección electrónica habilitada única.","d":"Un diario de los de mayor difusión en la provincia del último domicilio del interesado."},"correcta":"b","explicacion":"El artículo 44 establece que, en estos casos, la notificación se hará por medio de un anuncio publicado en el «Boletín Oficial del Estado». La sede electrónica (a), la dirección electrónica habilitada única (c) y los diarios de difusión provincial (d) no sustituyen a ese anuncio.","cita":"«Cuando los interesados en un procedimiento sean desconocidos, se ignore el lugar de la notificación o bien, intentada ésta, no se hubiese podido practicar, la notificación se hará por medio de un anuncio publicado en el «Boletín Oficial del Estado».»","dificultad":1},{"id":"L39-L3-035","ley":"L39","articulo":"46","articulo_txt":"Art. 46 Ley 39/2015","bloque_id":"L39|Título III. De los actos administrativos · Capítulo II. Eficacia de los actos","enunciado":"Según el artículo 46 de la Ley 39/2015, si el órgano competente apreciase que la notificación por medio de anuncios o la publicación de un acto lesiona derechos o intereses legítimos:","opciones":{"a":"Se abstendrá de publicar el acto y lo notificará personalmente a cada uno de los interesados en el domicilio que conste en el expediente.","b":"Publicará el acto íntegro, previa supresión de los datos personales de los interesados y de los demás datos que permitan identificarlos, localizarlos o conocer su situación.","c":"Se limitará a publicar una somera indicación del contenido del acto y del lugar donde los interesados podrán comparecer para conocer su contenido íntegro.","d":"Suspenderá la publicación hasta que los interesados presten su consentimiento."},"correcta":"c","explicacion":"El artículo 46 dispone que el órgano «se limitará a publicar en el Diario oficial que corresponda una somera indicación del contenido del acto y del lugar donde los interesados podrán comparecer», en el plazo que se establezca. No se renuncia a publicar (a), no se publica el acto íntegro (b) y no se condiciona al consentimiento de los interesados (d).","cita":"«Si el órgano competente apreciase que la notificación por medio de anuncios o la publicación de un acto lesiona derechos o intereses legítimos, se limitará a publicar en el Diario oficial que corresponda una somera indicación del contenido del acto y del lugar donde los interesados podrán comparecer, en el plazo que se establezca, para conocimiento del contenido íntegro del mencionado acto y constancia de tal conocimiento.»","dificultad":2},{"id":"L39-L3-036","ley":"L39","articulo":"47.1","articulo_txt":"Art. 47.1 Ley 39/2015","bloque_id":"L39|Título III. De los actos administrativos · Capítulo III. Nulidad y anulabilidad","enunciado":"Según el artículo 47.1 de la Ley 39/2015, ¿cuál de los siguientes actos NO figura entre los supuestos de nulidad de pleno derecho?","opciones":{"a":"Los que tengan un contenido imposible.","b":"Los dictados sin la motivación exigida por el artículo 35.","c":"Los que sean constitutivos de infracción penal o se dicten como consecuencia de ésta.","d":"Los que lesionen los derechos y libertades susceptibles de amparo constitucional."},"correcta":"b","explicacion":"La falta de motivación no aparece en la relación del artículo 47.1. Sí figuran en él la a), que corresponde a la letra c); la c), a la letra d), y la d), a la letra a).","cita":"«1. Los actos de las Administraciones Públicas son nulos de pleno derecho en los casos siguientes: a) Los que lesionen los derechos y libertades susceptibles de amparo constitucional. (…) c) Los que tengan un contenido imposible. d) Los que sean constitutivos de infracción penal o se dicten como consecuencia de ésta.»","dificultad":2},{"id":"L39-L3-046","ley":"L39","articulo":"52.2","articulo_txt":"Art. 52.2 Ley 39/2015","bloque_id":"L39|Título III. De los actos administrativos · Capítulo III. Nulidad y anulabilidad","enunciado":"Según el artículo 52.2 de la Ley 39/2015, el acto de convalidación producirá efecto:","opciones":{"a":"Desde la fecha del acto convalidado, en todo caso.","b":"Desde su notificación o publicación a los interesados, en todo caso y sin posibilidad de que se le otorgue eficacia retroactiva.","c":"Desde la fecha del acto convalidado, salvo que lesione derechos de terceros.","d":"Desde su fecha, salvo lo dispuesto en el artículo 39.3 para la retroactividad de los actos administrativos."},"correcta":"d","explicacion":"El artículo 52.2 dispone que el acto de convalidación «producirá efecto desde su fecha, salvo lo dispuesto en el artículo 39.3 para la retroactividad de los actos administrativos». La a) y la c) le atribuyen, como regla, efectos retroactivos a la fecha del acto convalidado, y la b) cambia el momento inicial.","cita":"«2. El acto de convalidación producirá efecto desde su fecha, salvo lo dispuesto en el artículo 39.3 para la retroactividad de los actos administrativos.»","dificultad":2},{"id":"L39-L4-003","ley":"L39","articulo":"53.1.c","articulo_txt":"Art. 53.1.c Ley 39/2015","bloque_id":"L39|Título IV. De las disposiciones sobre el procedimiento administrativo común · Capítulo I. Garantías del procedimiento","enunciado":"Según el artículo 53.1.c) de la Ley 39/2015, cuando, excepcionalmente, un interesado deba presentar un documento original, tendrá derecho a:","opciones":{"a":"Que el original le sea devuelto en el plazo máximo de diez días.","b":"Sustituirlo por una declaración responsable sobre su contenido.","c":"Que se le exima de aportar cualquier otro documento en ese procedimiento.","d":"Obtener una copia autenticada de éste."},"correcta":"d","explicacion":"El artículo 53.1.c) establece que, si excepcionalmente deben presentar un documento original, los interesados «tendrán derecho a obtener una copia autenticada de éste». El precepto no fija un plazo de devolución del original (a), no permite sustituirlo por una declaración responsable (b) ni exime de aportar otros documentos (c).","cita":"«c) A no presentar documentos originales salvo que, de manera excepcional, la normativa reguladora aplicable establezca lo contrario. En caso de que, excepcionalmente, deban presentar un documento original, tendrán derecho a obtener una copia autenticada de éste.»","dificultad":1},{"id":"L39-L4-005","ley":"L39","articulo":"53.1.e","articulo_txt":"Art. 53.1.e Ley 39/2015","bloque_id":"L39|Título IV. De las disposiciones sobre el procedimiento administrativo común · Capítulo I. Garantías del procedimiento","enunciado":"Según el artículo 53.1.e) de la Ley 39/2015, los interesados tienen derecho a formular alegaciones, utilizar los medios de defensa admitidos por el Ordenamiento Jurídico y aportar documentos:","opciones":{"a":"Únicamente durante el trámite de audiencia.","b":"En cualquier momento anterior a que se dicte la resolución.","c":"En cualquier fase del procedimiento anterior al trámite de audiencia.","d":"Solo dentro de los diez días siguientes a la notificación del acuerdo de iniciación."},"correcta":"c","explicacion":"El artículo 53.1.e) permite formular alegaciones y aportar documentos «en cualquier fase del procedimiento anterior al trámite de audiencia», que deberán ser tenidos en cuenta por el órgano competente al redactar la propuesta de resolución. La a) limita indebidamente el derecho al trámite de audiencia, la b) extiende el límite hasta la resolución y la d) fija un plazo de diez días que el precepto no contiene.","cita":"«e) A formular alegaciones, utilizar los medios de defensa admitidos por el Ordenamiento Jurídico, y a aportar documentos en cualquier fase del procedimiento anterior al trámite de audiencia, que deberán ser tenidos en cuenta por el órgano competente al redactar la propuesta de resolución.»","dificultad":2},{"id":"L39-L4-036","ley":"L39","articulo":"66.6","articulo_txt":"Art. 66.6 Ley 39/2015","bloque_id":"L39|Título IV. De las disposiciones sobre el procedimiento administrativo común · Capítulo II. Iniciación del procedimiento","enunciado":"Según el artículo 66.6 de la Ley 39/2015, cuando la Administración, en un procedimiento concreto, establezca expresamente modelos específicos de presentación de solicitudes, estos modelos serán:","opciones":{"a":"De uso obligatorio por los interesados.","b":"De uso voluntario, como los modelos de presentación masiva.","c":"De uso obligatorio solo para los sujetos obligados a relacionarse electrónicamente.","d":"De uso obligatorio solo en los procedimientos de concurrencia competitiva."},"correcta":"a","explicacion":"El artículo 66.6 dispone que esos modelos específicos «serán de uso obligatorio por los interesados», sin limitarlo a ciertos sujetos (c) o procedimientos (d). La b) confunde este supuesto con los modelos de presentación masiva del artículo 66.4, que sí son «de uso voluntario».","cita":"«6. Cuando la Administración en un procedimiento concreto establezca expresamente modelos específicos de presentación de solicitudes, éstos serán de uso obligatorio por los interesados.»","dificultad":1},{"id":"L39-L4-043","ley":"L39","articulo":"69.1","articulo_txt":"Art. 69.1 Ley 39/2015","bloque_id":"L39|Título IV. De las disposiciones sobre el procedimiento administrativo común · Capítulo II. Iniciación del procedimiento","enunciado":"Según el artículo 69.1 de la Ley 39/2015, en la declaración responsable el interesado manifiesta, bajo su responsabilidad, que cumple con los requisitos establecidos en la normativa vigente, que dispone de la documentación que así lo acredita y que:","opciones":{"a":"La acompaña necesariamente a la declaración.","b":"La presentará en el registro en el plazo de diez días desde la declaración.","c":"La pondrá a disposición de la Administración cuando le sea requerida.","d":"La conservará únicamente hasta que la Administración realice la primera comprobación."},"correcta":"c","explicacion":"El artículo 69.1 define la declaración responsable como el documento en que el interesado manifiesta que dispone de la documentación acreditativa, «que la pondrá a disposición de la Administración cuando le sea requerida», y que se compromete a mantener el cumplimiento durante el período inherente al reconocimiento o ejercicio. No exige acompañarla (a) ni presentarla en un plazo (b), y la d) contradice ese compromiso de mantenimiento.","cita":"«1. A los efectos de esta Ley, se entenderá por declaración responsable el documento suscrito por un interesado en el que éste manifiesta, bajo su responsabilidad, que cumple con los requisitos establecidos en la normativa vigente para obtener el reconocimiento de un derecho o facultad o para su ejercicio, que dispone de la documentación que así lo acredita, que la pondrá a disposición de la Administración cuando le sea requerida, y que se compromete a mantener el cumplimiento de las anteriores obligaciones durante el período de tiempo inherente a dicho reconocimiento o ejercicio.»","dificultad":2},{"id":"L39-L5-005","ley":"L39","articulo":"71.3","articulo_txt":"Art. 71.3 Ley 39/2015","bloque_id":"L39|Título IV. De las disposiciones sobre el procedimiento administrativo común · Capítulo III. Ordenación del procedimiento","enunciado":"Según el artículo 71.3 de la Ley 39/2015, ¿quiénes serán responsables directos de la tramitación del procedimiento y, en especial, del cumplimiento de los plazos establecidos?","opciones":{"a":"Exclusivamente el órgano competente para resolver el procedimiento.","b":"El superior jerárquico común del órgano instructor y del órgano competente para resolver, que deberá velar por el cumplimiento de los plazos establecidos.","c":"Las personas designadas como órgano instructor o, en su caso, los titulares de las unidades administrativas que tengan atribuida tal función.","d":"El titular del departamento ministerial al que esté adscrito el órgano que tramita el procedimiento, sin perjuicio de la responsabilidad del órgano competente para resolver."},"correcta":"c","explicacion":"El artículo 71.3 atribuye esa responsabilidad directa a las personas designadas como órgano instructor «o, en su caso, los titulares de las unidades administrativas que tengan atribuida tal función». Ni el órgano competente para resolver (opción a), ni el superior jerárquico común (opción b), ni el titular del departamento (opción d) aparecen en el precepto.","cita":"«Las personas designadas como órgano instructor o, en su caso, los titulares de las unidades administrativas que tengan atribuida tal función serán responsables directos de la tramitación del procedimiento y, en especial, del cumplimiento de los plazos establecidos.»","dificultad":2},{"id":"L39-L5-011","ley":"L39","articulo":"74","articulo_txt":"Art. 74 Ley 39/2015","bloque_id":"L39|Título IV. De las disposiciones sobre el procedimiento administrativo común · Capítulo III. Ordenación del procedimiento","enunciado":"Según el artículo 74 de la Ley 39/2015, las cuestiones incidentales que se susciten en el procedimiento:","opciones":{"a":"Suspenderán la tramitación del procedimiento hasta que sean resueltas.","b":"No suspenderán la tramitación del procedimiento, salvo la abstención.","c":"Suspenderán la tramitación del procedimiento únicamente cuando se refieran a la nulidad de actuaciones.","d":"No suspenderán la tramitación del procedimiento, salvo la recusación."},"correcta":"d","explicacion":"El artículo 74 establece que las cuestiones incidentales, «incluso las que se refieran a la nulidad de actuaciones, no suspenderán la tramitación del mismo, salvo la recusación». La opción a) invierte la regla, la b) cambia la recusación por la abstención y la c) convierte en causa de suspensión justo lo que el precepto excluye.","cita":"«Las cuestiones incidentales que se susciten en el procedimiento, incluso las que se refieran a la nulidad de actuaciones, no suspenderán la tramitación del mismo, salvo la recusación.»","dificultad":2},{"id":"L39-L5-016","ley":"L39","articulo":"76.2","articulo_txt":"Art. 76.2 Ley 39/2015","bloque_id":"L39|Título IV. De las disposiciones sobre el procedimiento administrativo común · Capítulo IV. Instrucción del procedimiento · Sección 1.ª Disposiciones generales","enunciado":"Según el artículo 76.2 de la Ley 39/2015, las alegaciones de los interesados sobre defectos de tramitación, en especial los que supongan paralización, infracción de los plazos preceptivamente señalados u omisión de trámites subsanables, podrán dar lugar, si hubiere razones para ello, a:","opciones":{"a":"La nulidad de pleno derecho de todo lo actuado.","b":"La caducidad del procedimiento.","c":"La exigencia de la correspondiente responsabilidad disciplinaria.","d":"La suspensión automática del plazo máximo para resolver."},"correcta":"c","explicacion":"El artículo 76.2 establece que dichas alegaciones «podrán dar lugar, si hubiere razones para ello, a la exigencia de la correspondiente responsabilidad disciplinaria». La nulidad (opción a), la caducidad (opción b) y la suspensión del plazo para resolver (opción d) no son consecuencias previstas en el precepto.","cita":"«En todo momento podrán los interesados alegar los defectos de tramitación y, en especial, los que supongan paralización, infracción de los plazos preceptivamente señalados o la omisión de trámites que pueden ser subsanados antes de la resolución definitiva del asunto. Dichas alegaciones podrán dar lugar, si hubiere razones para ello, a la exigencia de la correspondiente responsabilidad disciplinaria.»","dificultad":2},{"id":"L39-L5-020","ley":"L39","articulo":"77.3","articulo_txt":"Art. 77.3 Ley 39/2015","bloque_id":"L39|Título IV. De las disposiciones sobre el procedimiento administrativo común · Capítulo IV. Instrucción del procedimiento · Sección 2.ª Prueba","enunciado":"Según el artículo 77.3 de la Ley 39/2015, el instructor del procedimiento sólo podrá rechazar las pruebas propuestas por los interesados:","opciones":{"a":"Cuando las considere improcedentes, sin necesidad de motivar su decisión.","b":"Cuando su práctica implique gastos para la Administración, mediante resolución motivada.","c":"Cuando así lo solicite cualquier otro interesado en el procedimiento.","d":"Cuando sean manifiestamente improcedentes o innecesarias, mediante resolución motivada."},"correcta":"d","explicacion":"El artículo 77.3 permite rechazar las pruebas propuestas solo «cuando sean manifiestamente improcedentes o innecesarias, mediante resolución motivada». La opción a) suprime el carácter manifiesto y la motivación; la b) no es causa de rechazo, pues el artículo 78.3 permite exigir el anticipo de los gastos; y la c) introduce un supuesto inexistente.","cita":"«El instructor del procedimiento sólo podrá rechazar las pruebas propuestas por los interesados cuando sean manifiestamente improcedentes o innecesarias, mediante resolución motivada.»","dificultad":2},{"id":"L39-L5-030","ley":"L39","articulo":"81.3","articulo_txt":"Art. 81.3 Ley 39/2015","bloque_id":"L39|Título IV. De las disposiciones sobre el procedimiento administrativo común · Capítulo IV. Instrucción del procedimiento · Sección 3.ª Informes","enunciado":"Según el artículo 81.3 de la Ley 39/2015, en el caso de reclamaciones en materia de responsabilidad patrimonial del Estado por el funcionamiento anormal de la Administración de Justicia, será preceptivo el informe:","opciones":{"a":"Del Consejo General del Poder Judicial.","b":"Del Ministerio de Justicia.","c":"De la Sala de Gobierno del Tribunal Supremo.","d":"De la Abogacía General del Estado."},"correcta":"a","explicacion":"El artículo 81.3 exige en estos casos «el informe del Consejo General del Poder Judicial», que se evacuará en el plazo máximo de dos meses y durante cuya tramitación queda suspendido el plazo para resolver. Los órganos de las opciones b), c) y d) no son los previstos en el precepto.","cita":"«En el caso de reclamaciones en materia de responsabilidad patrimonial del Estado por el funcionamiento anormal de la Administración de Justicia, será preceptivo el informe del Consejo General del Poder Judicial que será evacuado en el plazo máximo de dos meses.»","dificultad":2},{"id":"L39-L5-035","ley":"L39","articulo":"83.1","articulo_txt":"Art. 83.1 Ley 39/2015","bloque_id":"L39|Título IV. De las disposiciones sobre el procedimiento administrativo común · Capítulo IV. Instrucción del procedimiento · Sección 4.ª Participación de los interesados","enunciado":"Según el artículo 83.1 de la Ley 39/2015, cuando la naturaleza del procedimiento lo requiera, podrá acordar un período de información pública:","opciones":{"a":"El órgano instructor del procedimiento.","b":"El superior jerárquico del órgano competente para resolver.","c":"El órgano al que corresponda la resolución del procedimiento.","d":"El titular del departamento ministerial correspondiente, en todo caso."},"correcta":"c","explicacion":"El artículo 83.1 atribuye esa facultad al órgano «al que corresponda la resolución del procedimiento». No la tiene el instructor (opción a), ni el superior jerárquico (opción b), ni, en todo caso, el titular del departamento (opción d).","cita":"«El órgano al que corresponda la resolución del procedimiento, cuando la naturaleza de éste lo requiera, podrá acordar un período de información pública.»","dificultad":2},{"id":"L39-L5-044","ley":"L39","articulo":"86.2","articulo_txt":"Art. 86.2 Ley 39/2015","bloque_id":"L39|Título IV. De las disposiciones sobre el procedimiento administrativo común · Capítulo V. Finalización del procedimiento · Sección 1.ª Disposiciones generales","enunciado":"Según el artículo 86.2 de la Ley 39/2015, ¿cuál de los siguientes extremos NO forma parte del contenido mínimo que deben establecer los instrumentos de terminación convencional?","opciones":{"a":"Las garantías que deban prestar las partes para asegurar su cumplimiento.","b":"La identificación de las partes intervinientes.","c":"El ámbito personal, funcional y territorial.","d":"El plazo de vigencia."},"correcta":"a","explicacion":"El artículo 86.2 fija como contenido mínimo «la identificación de las partes intervinientes, el ámbito personal, funcional y territorial, y el plazo de vigencia». Las opciones b), c) y d) forman parte de ese contenido; las garantías no se mencionan.","cita":"«Los citados instrumentos deberán establecer como contenido mínimo la identificación de las partes intervinientes, el ámbito personal, funcional y territorial, y el plazo de vigencia, debiendo publicarse o no según su naturaleza y las personas a las que estuvieran destinados.»","dificultad":2},{"id":"L39-L6-004","ley":"L39","articulo":"88.5","articulo_txt":"Art. 88.5 Ley 39/2015","bloque_id":"L39|Título IV. De las disposiciones sobre el procedimiento administrativo común · Capítulo V. Finalización del procedimiento · Sección 2.ª Resolución","enunciado":"Según el artículo 88.5 de la Ley 39/2015, podrá acordarse la inadmisión de:","opciones":{"a":"Las solicitudes en las que los preceptos legales aplicables al caso sean oscuros o insuficientes.","b":"Las peticiones formuladas en ejercicio del derecho de petición previsto en el artículo 29 de la Constitución.","c":"Las solicitudes de reconocimiento de derechos no previstos en el ordenamiento jurídico o manifiestamente carentes de fundamento.","d":"Las solicitudes que no reúnan los requisitos exigidos, sin necesidad de requerir su subsanación."},"correcta":"c","explicacion":"El artículo 88.5 permite acordar «la inadmisión de las solicitudes de reconocimiento de derechos no previstos en el ordenamiento jurídico o manifiestamente carentes de fundamento». La opción a) es contraria al precepto, que prohíbe abstenerse de resolver «so pretexto de silencio, oscuridad o insuficiencia de los preceptos legales aplicables al caso»; la opción b) también, porque la inadmisión se entiende «sin perjuicio del derecho de petición previsto por el artículo 29 de la Constitución»; y la opción d) no figura en el artículo.","cita":"«5. En ningún caso podrá la Administración abstenerse de resolver so pretexto de silencio, oscuridad o insuficiencia de los preceptos legales aplicables al caso, aunque podrá acordarse la inadmisión de las solicitudes de reconocimiento de derechos no previstos en el ordenamiento jurídico o manifiestamente carentes de fundamento, sin perjuicio del derecho de petición previsto por el artículo 29 de la Constitución.»","dificultad":2},{"id":"L39-L6-020","ley":"L39","articulo":"94.5","articulo_txt":"Art. 94.5 Ley 39/2015","bloque_id":"L39|Título IV. De las disposiciones sobre el procedimiento administrativo común · Capítulo V. Finalización del procedimiento · Sección 3.ª Desistimiento y renuncia","enunciado":"Según el artículo 94.5 de la Ley 39/2015, si la cuestión suscitada por la incoación del procedimiento entrañase interés general o fuera conveniente sustanciarla para su definición y esclarecimiento, la Administración:","opciones":{"a":"Deberá rechazar el desistimiento o la renuncia, que no producirán efecto alguno.","b":"Declarará la caducidad del procedimiento e incoará de oficio uno nuevo.","c":"Podrá limitar los efectos del desistimiento o la renuncia al interesado y seguirá el procedimiento.","d":"Deberá someter la cuestión a información pública antes de aceptar el desistimiento o la renuncia."},"correcta":"c","explicacion":"El artículo 94.5 establece que, en ese caso, «la Administración podrá limitar los efectos del desistimiento o la renuncia al interesado y seguirá el procedimiento». No se rechaza el desistimiento o la renuncia (opción a), no se declara la caducidad (opción b) y el precepto no prevé un trámite de información pública (opción d).","cita":"«5. Si la cuestión suscitada por la incoación del procedimiento entrañase interés general o fuera conveniente sustanciarla para su definición y esclarecimiento, la Administración podrá limitar los efectos del desistimiento o la renuncia al interesado y seguirá el procedimiento.»","dificultad":2},{"id":"L39-L6-023","ley":"L39","articulo":"95.3","articulo_txt":"Art. 95.3 Ley 39/2015","bloque_id":"L39|Título IV. De las disposiciones sobre el procedimiento administrativo común · Capítulo V. Finalización del procedimiento · Sección 4.ª Caducidad","enunciado":"Según el artículo 95.3 de la Ley 39/2015, en relación con la prescripción, la caducidad del procedimiento:","opciones":{"a":"Interrumpirá el plazo de prescripción de las acciones del particular, pero no el de las acciones de la Administración.","b":"No producirá por sí sola la prescripción de las acciones del particular o de la Administración, pero los procedimientos caducados no interrumpirán el plazo de prescripción.","c":"No producirá por sí sola la prescripción de las acciones del particular o de la Administración, y los procedimientos caducados interrumpirán el plazo de prescripción.","d":"Suspenderá el plazo de prescripción hasta que se notifique la resolución que la declare."},"correcta":"b","explicacion":"El artículo 95.3 dispone que «La caducidad no producirá por sí sola la prescripción de las acciones del particular o de la Administración, pero los procedimientos caducados no interrumpirán el plazo de prescripción». La opción c) contradice la segunda parte del precepto, y las opciones a) y d) atribuyen a la caducidad efectos interruptivos o suspensivos que la ley excluye o no prevé.","cita":"«3. La caducidad no producirá por sí sola la prescripción de las acciones del particular o de la Administración, pero los procedimientos caducados no interrumpirán el plazo de prescripción.»","dificultad":2},{"id":"L39-L6-030","ley":"L39","articulo":"96.6.d","articulo_txt":"Art. 96.6.d Ley 39/2015","bloque_id":"L39|Título IV. De las disposiciones sobre el procedimiento administrativo común · Capítulo VI. De la tramitación simplificada del procedimiento administrativo común","enunciado":"Según el artículo 96.6.d) de la Ley 39/2015, en los procedimientos tramitados de manera simplificada, el trámite de audiencia se practicará:","opciones":{"a":"Únicamente cuando la resolución vaya a ser desfavorable para el interesado.","b":"En todo caso, antes de dictar la resolución.","c":"Únicamente cuando lo solicite el interesado en sus alegaciones iniciales.","d":"Únicamente cuando sea preceptivo el Dictamen del Consejo de Estado u órgano consultivo equivalente."},"correcta":"a","explicacion":"El art. 96.6.d) incluye entre los trámites del procedimiento simplificado el «Trámite de audiencia, únicamente cuando la resolución vaya a ser desfavorable para el interesado». No se practica en todo caso (opción b), ni depende de la petición del interesado (opción c) o del carácter preceptivo del Dictamen (opción d).","cita":"«d) Trámite de audiencia, únicamente cuando la resolución vaya a ser desfavorable para el interesado.»","dificultad":1},{"id":"L39-L6-037","ley":"L39","articulo":"99","articulo_txt":"Art. 99 Ley 39/2015","bloque_id":"L39|Título IV. De las disposiciones sobre el procedimiento administrativo común · Capítulo VII. Ejecución","enunciado":"Según el artículo 99 de la Ley 39/2015, ¿en cuál de los siguientes supuestos NO podrán las Administraciones Públicas proceder a la ejecución forzosa de los actos administrativos?","opciones":{"a":"Cuando el acto se haya dictado en un procedimiento iniciado a solicitud del interesado.","b":"Cuando el obligado manifieste su oposición a la ejecución.","c":"Cuando la Constitución o la Ley exijan la intervención de un órgano judicial.","d":"Cuando el acto no haya ganado firmeza en vía jurisdiccional."},"correcta":"c","explicacion":"El artículo 99 exceptúa de la ejecución forzosa por la Administración «los supuestos en que se suspenda la ejecución de acuerdo con la Ley» y aquellos en que «la Constitución o la Ley exijan la intervención de un órgano judicial». El origen del procedimiento a solicitud del interesado (opción a), la oposición del obligado (opción b) o la falta de firmeza jurisdiccional (opción d) no figuran como excepciones.","cita":"«Las Administraciones Públicas, a través de sus órganos competentes en cada caso, podrán proceder, previo apercibimiento, a la ejecución forzosa de los actos administrativos, salvo en los supuestos en que se suspenda la ejecución de acuerdo con la Ley, o cuando la Constitución o la Ley exijan la intervención de un órgano judicial.»","dificultad":2},{"id":"L39-L7-002","ley":"L39","articulo":"106.2","articulo_txt":"Art. 106.2 Ley 39/2015","bloque_id":"L39|Título V. De la revisión de los actos en vía administrativa · Capítulo I. Revisión de oficio","enunciado":"Según el artículo 106.2 de la Ley 39/2015, la nulidad de las disposiciones administrativas en los supuestos previstos en el artículo 47.2:","opciones":{"a":"Solo podrá declararse a solicitud de interesado, dentro del año siguiente a su publicación.","b":"Podrá declararse de oficio por las Administraciones Públicas en cualquier momento.","c":"Solo podrá declararse de oficio dentro del año siguiente a la publicación de la disposición.","d":"Solo podrá declararse por los órganos del orden jurisdiccional contencioso-administrativo."},"correcta":"b","explicacion":"El art. 106.2 dispone que, «en cualquier momento, las Administraciones Públicas de oficio», con el dictamen favorable que exige, «podrán declarar la nulidad de las disposiciones administrativas en los supuestos previstos en el artículo 47.2». No hay plazo de un año (opciones a y c), la revisión de las disposiciones se hace de oficio y no a solicitud de interesado (opción a) y la ley la atribuye a la propia Administración, no en exclusiva a los tribunales (opción d).","cita":"«2. Asimismo, en cualquier momento, las Administraciones Públicas de oficio, y previo dictamen favorable del Consejo de Estado u órgano consultivo equivalente de la Comunidad Autónoma si lo hubiere, podrán declarar la nulidad de las disposiciones administrativas en los supuestos previstos en el artículo 47.2.»","dificultad":2},{"id":"L39-L7-022","ley":"L39","articulo":"114.2.c)","articulo_txt":"Art. 114.2.c) Ley 39/2015","bloque_id":"L39|Título V. De la revisión de los actos en vía administrativa · Capítulo II. Recursos administrativos · Sección 1.ª Principios generales","enunciado":"Según el artículo 114.2 de la Ley 39/2015, en el ámbito estatal ponen fin a la vía administrativa los actos emanados de los órganos directivos con nivel de Director general o superior:","opciones":{"a":"En relación con las competencias que tengan atribuidas en materia de contratación.","b":"En relación con las competencias que tengan atribuidas en materia de subvenciones.","c":"En relación con todas las competencias que tengan atribuidas por delegación.","d":"En relación con las competencias que tengan atribuidas en materia de personal."},"correcta":"d","explicacion":"El art. 114.2.c) se refiere a los actos «emanados de los órganos directivos con nivel de Director general o superior, en relación con las competencias que tengan atribuidas en materia de personal». Las materias de contratación (opción a) y subvenciones (opción b) y las competencias delegadas en general (opción c) no figuran en ese apartado.","cita":"«c) Los emanados de los órganos directivos con nivel de Director general o superior, en relación con las competencias que tengan atribuidas en materia de personal.»","dificultad":2},{"id":"L39-L7-038","ley":"L39","articulo":"122.2","articulo_txt":"Art. 122.2 Ley 39/2015","bloque_id":"L39|Título V. De la revisión de los actos en vía administrativa · Capítulo II. Recursos administrativos · Sección 2.ª Recurso de alzada","enunciado":"Según el artículo 122.2 de la Ley 39/2015, el plazo máximo para dictar y notificar la resolución del recurso de alzada será de:","opciones":{"a":"Dos meses.","b":"Seis meses.","c":"Cuatro meses.","d":"Tres meses."},"correcta":"d","explicacion":"El art. 122.2 dispone que «El plazo máximo para dictar y notificar la resolución será de tres meses»; transcurrido sin resolución, se podrá entender desestimado el recurso, salvo en el supuesto del art. 24.1, tercer párrafo. Los plazos de dos (opción a), seis (opción b) y cuatro meses (opción c) no figuran en el precepto.","cita":"«2. El plazo máximo para dictar y notificar la resolución será de tres meses. Transcurrido este plazo sin que recaiga resolución, se podrá entender desestimado el recurso, salvo en el supuesto previsto en el artículo 24.1, tercer párrafo.»","dificultad":1},{"id":"L39-L7-043","ley":"L39","articulo":"124.2","articulo_txt":"Art. 124.2 Ley 39/2015","bloque_id":"L39|Título V. De la revisión de los actos en vía administrativa · Capítulo II. Recursos administrativos · Sección 3.ª Recurso potestativo de reposición","enunciado":"Según el artículo 124.2 de la Ley 39/2015, el plazo máximo para dictar y notificar la resolución del recurso de reposición será de:","opciones":{"a":"Diez días.","b":"Un mes.","c":"Quince días.","d":"Tres meses."},"correcta":"b","explicacion":"El art. 124.2 dispone que «El plazo máximo para dictar y notificar la resolución del recurso será de un mes». Los plazos de diez (opción a) y quince días (opción c) no figuran en el precepto, y el de tres meses (opción d) es el que el art. 122.2 fija para resolver la alzada.","cita":"«2. El plazo máximo para dictar y notificar la resolución del recurso será de un mes.»","dificultad":1},{"id":"L39-L7-046","ley":"L39","articulo":"125.2","articulo_txt":"Art. 125.2 Ley 39/2015","bloque_id":"L39|Título V. De la revisión de los actos en vía administrativa · Capítulo II. Recursos administrativos · Sección 4.ª Recurso extraordinario de revisión","enunciado":"Según el artículo 125.2 de la Ley 39/2015, ¿cuáles son los plazos de interposición del recurso extraordinario de revisión?","opciones":{"a":"Tres meses desde la notificación de la resolución en la causa a), y cuatro años en los demás casos.","b":"Cuatro años desde la notificación de la resolución en la causa a), y tres meses en los demás casos.","c":"Cuatro años desde que se dictó la resolución en la causa a), y un mes en los demás casos.","d":"Un año desde la notificación de la resolución en la causa a), y tres meses en los demás casos."},"correcta":"b","explicacion":"El art. 125.2 fija, para la causa del art. 125.1.a), el plazo de «cuatro años siguientes a la fecha de la notificación de la resolución impugnada» y, en los demás casos, el de «tres meses a contar desde el conocimiento de los documentos o desde que la sentencia judicial quedó firme». La opción a) invierte los plazos, la opción c) cambia el inicio del cómputo y el segundo plazo, y la opción d) cambia el primero.","cita":"«2. El recurso extraordinario de revisión se interpondrá, cuando se trate de la causa a) del apartado anterior, dentro del plazo de cuatro años siguientes a la fecha de la notificación de la resolución impugnada. En los demás casos, el plazo será de tres meses a contar desde el conocimiento de los documentos o desde que la sentencia judicial quedó firme.»","dificultad":2},{"id":"L39-L8-003","ley":"L39","articulo":"128.1","articulo_txt":"Art. 128.1 Ley 39/2015","bloque_id":"L39|Título VI. De la iniciativa legislativa y de la potestad para dictar reglamentos y otras disposiciones","enunciado":"Según el artículo 128.1 de la Ley 39/2015, el ejercicio de la potestad reglamentaria corresponde:","opciones":{"a":"Al Gobierno de la Nación y a los órganos de Gobierno de las Comunidades Autónomas, pero no a los locales.","b":"Únicamente al Gobierno de la Nación, que podrá delegarlo en los órganos de gobierno locales.","c":"Al Gobierno de la Nación, a los órganos de Gobierno autonómicos y a los órganos de gobierno locales.","d":"Únicamente al Gobierno de la Nación y a los órganos de gobierno de las entidades locales."},"correcta":"c","explicacion":"El art. 128.1 atribuye la potestad reglamentaria «al Gobierno de la Nación, a los órganos de Gobierno de las Comunidades Autónomas» y «a los órganos de gobierno locales». Las opciones a) y d) omiten, respectivamente, a los órganos de gobierno locales y a los autonómicos, y la opción b) reduce indebidamente la titularidad al Gobierno de la Nación.","cita":"«1. El ejercicio de la potestad reglamentaria corresponde al Gobierno de la Nación, a los órganos de Gobierno de las Comunidades Autónomas, de conformidad con lo establecido en sus respectivos Estatutos, y a los órganos de gobierno locales, de acuerdo con lo previsto en la Constitución, los Estatutos de Autonomía y la Ley 7/1985, de 2 de abril, reguladora de las Bases del Régimen Local.»","dificultad":1},{"id":"L39-L8-032","ley":"L39","articulo":"DA 8ª","articulo_txt":"DA 8ª · Ley 39/2015","bloque_id":"L39|Disposiciones adicionales","enunciado":"Según la disposición adicional octava de la Ley 39/2015, los sistemas de firma electrónica no basados en certificados electrónicos establecidos por Resolución de la Secretaría General de Administración Digital para su ámbito competencial adquieren eficacia jurídica, salvo que la Resolución disponga otra cosa:","opciones":{"a":"Al día siguiente de la publicación de la Resolución.","b":"A los dos meses de la publicación de la Resolución.","c":"A los veinte días de la publicación de la Resolución.","d":"Al mes de la publicación de la Resolución."},"correcta":"a","explicacion":"La DA 8.ª dispone que no será preciso el transcurso del plazo de dos meses del art. 10.2.c) (opción b), «adquiriendo eficacia jurídica al día siguiente de la publicación de la Resolución, salvo que esta disponga otra cosa». Los plazos de veinte días (opción c) y de un mes (opción d) no figuran en el precepto.","cita":"«(…) no será preciso el transcurso del plazo de dos meses para la eficacia jurídica del sistema a que se refiere el artículo 10.2.c) de la presente ley, adquiriendo eficacia jurídica al día siguiente de la publicación de la Resolución, salvo que esta disponga otra cosa.»","dificultad":2},{"id":"L39-L8-034","ley":"L39","articulo":"DT 1ª.2","articulo_txt":"DT 1ª.2 · Ley 39/2015","bloque_id":"L39|Disposiciones transitorias","enunciado":"Según la disposición transitoria primera de la Ley 39/2015, siempre que sea posible, los documentos en papel asociados a procedimientos administrativos finalizados antes de la entrada en vigor de dicha Ley:","opciones":{"a":"Podrán destruirse una vez transcurridos cinco años desde su finalización.","b":"Deberán digitalizarse de acuerdo con la normativa reguladora aplicable.","c":"Deberán conservarse exclusivamente en soporte papel.","d":"Deberán remitirse al archivo histórico de la Administración correspondiente."},"correcta":"b","explicacion":"La DT 1.ª.2 dispone que esos documentos en papel «deberán digitalizarse de acuerdo con los requisitos establecidos en la normativa reguladora aplicable». La disposición no prevé su destrucción (opción a), ni su conservación exclusiva en papel (opción c), ni su remisión a un archivo histórico (opción d).","cita":"«2. Siempre que sea posible, los documentos en papel asociados a procedimientos administrativos finalizados antes de la entrada en vigor de esta Ley, deberán digitalizarse de acuerdo con los requisitos establecidos en la normativa reguladora aplicable.»","dificultad":1},{"id":"L39-L8-040","ley":"L39","articulo":"DD única.1","articulo_txt":"DD única.1 · Ley 39/2015","bloque_id":"L39|Disposición derogatoria","enunciado":"Según el apartado 1 de la disposición derogatoria única de la Ley 39/2015, quedan derogadas todas las normas de igual o inferior rango:","opciones":{"a":"Que regulen el procedimiento administrativo, aunque no se opongan a dicha Ley.","b":"Que se hubieran dictado en desarrollo de la Ley 30/1992, en todo caso.","c":"En lo que contradigan a dicha Ley, salvo las de rango reglamentario.","d":"En lo que contradigan o se opongan a lo dispuesto en dicha Ley."},"correcta":"d","explicacion":"La DD única.1 deroga las normas de igual o inferior rango «en lo que contradigan o se opongan a lo dispuesto en la presente Ley». No deroga normas que no se opongan (opción a), ni en todo caso las dictadas en desarrollo de la Ley 30/1992 (opción b), ni excluye las de rango reglamentario (opción c).","cita":"«1. Quedan derogadas todas las normas de igual o inferior rango en lo que contradigan o se opongan a lo dispuesto en la presente Ley.»","dificultad":1},{"id":"L39-L8-045","ley":"L39","articulo":"DF 7ª","articulo_txt":"DF 7ª · Ley 39/2015","bloque_id":"L39|Disposiciones finales","enunciado":"Según la disposición final séptima de la Ley 39/2015, en su redacción vigente, las previsiones relativas al registro electrónico de apoderamientos, al registro de empleados públicos habilitados y al archivo único electrónico, entre otras, producirán efectos a partir del día:","opciones":{"a":"2 de octubre de 2018.","b":"2 de octubre de 2020.","c":"2 de abril de 2020.","d":"2 de abril de 2021."},"correcta":"d","explicacion":"El segundo párrafo de la DF 7.ª, en la redacción dada por la Ley 10/2021, de 9 de julio, fija la fecha de «2 de abril de 2021»; la disposición ha sido modificada varias veces, pero las fechas de las opciones a), b) y c) no son las vigentes. Como esa fecha ya ha pasado, estas previsiones producen hoy plenamente sus efectos.","cita":"«No obstante, las previsiones relativas al registro electrónico de apoderamientos, registro electrónico, registro de empleados públicos habilitados, punto de acceso general electrónico de la Administración y archivo único electrónico producirán efectos a partir del día 2 de abril de 2021.»","dificultad":2}]};</script>
<script>
/* Letra de Ley — motor de test. Sin dependencias; funciona sin conexión.
   Necesita window.LDL_CONFIG y window.LDL_BANCO (los inyecta sistema/letradeley.py). */
(function () {
  "use strict";
  var CFG = window.LDL_CONFIG, B = window.LDL_BANCO;
  var raiz = document.getElementById("ldl");
  var LETRAS = ["a", "b", "c", "d"];
  var POR_ID = {};
  B.preguntas.forEach(function (p) { POR_ID[p.id] = p; });
  var CLAVE = "ldl1:" + CFG.pack.id;
  var prog = cargar();
  var sesion = null;
  var vista = CFG.modo === "web" ? "portada" : "inicio";
  var reloj = null;

  /* ---------- utilidades ---------- */
  function esc(t) {
    return String(t == null ? "" : t).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function barajar(lista) {
    var a = lista.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function pct(a, b) { return b ? Math.round((a / b) * 100) : 0; }
  function plural(n, uno, varios) { return n + " " + (n === 1 ? uno : varios); }
  function num(n) { return String(n).replace(".", ","); }
  function cargar() {
    try { var s = localStorage.getItem(CLAVE); if (s) { var d = JSON.parse(s); if (d && d.p) return d; } } catch (e) {}
    return { p: {}, h: [] };
  }
  function guardar() { try { localStorage.setItem(CLAVE, JSON.stringify(prog)); } catch (e) {} }
  function registrar(id, acierto) {
    var r = prog.p[id] || { v: 0, a: 0, f: 0, c: 0 };
    r.v++;
    if (acierto) { r.a++; r.c = Math.min((r.c || 0) + 1, 5); } else { r.f++; r.c = 0; }
    r.u = acierto ? 1 : 0;
    r.t = Date.now();
    prog.p[id] = r;
    guardar();
  }
  function fallosPendientes() {
    return B.preguntas.filter(function (p) { var r = prog.p[p.id]; return r && r.u === 0; });
  }
  function resumen(lista) {
    var vistas = 0, aciertos = 0, intentos = 0;
    lista.forEach(function (p) {
      var r = prog.p[p.id];
      if (r) { vistas++; aciertos += r.a; intentos += r.v; }
    });
    return { total: lista.length, vistas: vistas, acierto: pct(aciertos, intentos) };
  }
  function delBloque(id) { return B.preguntas.filter(function (p) { return p.bloque_id === id; }); }

  /* ---------- tema claro / oscuro ---------- */
  function aplicarTema() {
    var t = null;
    try { t = localStorage.getItem("ldl:tema"); } catch (e) {}
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    else document.documentElement.removeAttribute("data-theme");
    return t || "auto";
  }
  function cambiarTema() {
    var orden = { auto: "light", light: "dark", dark: "auto" };
    var actual = aplicarTema();
    try { localStorage.setItem("ldl:tema", orden[actual]); } catch (e) {}
    aplicarTema();
    pintar();
  }

  /* ---------- sesiones ---------- */
  function empezar(tipo, preguntas, opciones) {
    opciones = opciones || {};
    if (!preguntas.length) return;
    pararReloj();
    sesion = {
      tipo: tipo, titulo: opciones.titulo || "Test", ids: preguntas.map(function (p) { return p.id; }),
      i: 0, resp: {}, corregida: {}, inicio: Date.now(), limite: opciones.minutos ? opciones.minutos * 60 : 0, fin: null,
      origen: vista === "test" || vista === "resultado" ? (sesion && sesion.origen) || "inicio" : vista
    };
    vista = "test";
    if (sesion.limite) reloj = setInterval(tic, 1000);
    pintar();
    window.scrollTo(0, 0);
  }
  function tic() {
    if (!sesion || sesion.fin) return pararReloj();
    var el = document.getElementById("ldl-crono");
    var resta = sesion.limite - Math.floor((Date.now() - sesion.inicio) / 1000);
    if (resta <= 0) { terminar(); return; }
    if (el) el.textContent = mmss(resta);
  }
  function pararReloj() { if (reloj) { clearInterval(reloj); reloj = null; } }
  function mmss(s) { var m = Math.floor(s / 60), r = s % 60; return m + ":" + (r < 10 ? "0" : "") + r; }

  function responder(letra) {
    var id = sesion.ids[sesion.i];
    if (sesion.tipo === "simulacro") {
      sesion.resp[id] = sesion.resp[id] === letra ? undefined : letra;
      pintar();
      return;
    }
    if (sesion.corregida[id]) return;
    sesion.resp[id] = letra;
    sesion.corregida[id] = true;
    registrar(id, letra === POR_ID[id].correcta);
    pintar();
  }
  function siguiente() {
    if (sesion.i < sesion.ids.length - 1) { sesion.i++; pintar(); window.scrollTo(0, 0); }
    else terminar();
  }
  function anterior() { if (sesion.i > 0) { sesion.i--; pintar(); } }
  function terminar() {
    pararReloj();
    if (sesion.tipo === "simulacro") {
      sesion.ids.forEach(function (id) {
        if (sesion.resp[id]) registrar(id, sesion.resp[id] === POR_ID[id].correcta);
      });
    }
    sesion.fin = Date.now();
    var r = calcular(sesion);
    prog.h.unshift({ t: sesion.fin, tipo: sesion.tipo, n: r.total, a: r.aciertos, e: r.errores, nota: r.nota });
    prog.h = prog.h.slice(0, 50);
    guardar();
    vista = "resultado";
    pintar();
    window.scrollTo(0, 0);
  }
  function calcular(s) {
    var a = 0, e = 0, nr = 0;
    s.ids.forEach(function (id) {
      var r = s.resp[id];
      if (!r) nr++; else if (r === POR_ID[id].correcta) a++; else e++;
    });
    var pen = (CFG.simulacro && CFG.simulacro.penalizacion) || 1 / 3;
    var neta = s.tipo === "simulacro" ? a - e * pen : a;
    var nota = Math.max(0, (neta / s.ids.length) * 10);
    return { total: s.ids.length, aciertos: a, errores: e, blancos: nr, neta: neta, nota: Math.round(nota * 100) / 100 };
  }

  /* ---------- vistas ---------- */
  function cabecera() {
    var tema = aplicarTema();
    var etiquetas = { auto: "Tema: auto", light: "Tema: claro", dark: "Tema: oscuro" };
    return '<header class="ldl-top"><a class="ldl-brand" href="' + esc(CFG.web || "#") + '">' +
      '<span class="ldl-logo" aria-hidden="true">§</span><span><b>Letra de Ley</b><small>' +
      esc(CFG.pack.nombre) + "</small></span></a>" +
      '<button class="ldl-tema" data-acc="tema" type="button">' + etiquetas[tema] + "</button></header>";
  }
  function navegacion() {
    if (CFG.modo === "web") return "";
    var items = [["inicio", "Inicio"], ["temas", "Por temas"], ["simulacro", "Simulacro"], ["fallos", "Fallos"], ["stats", "Estadísticas"]];
    return '<nav class="ldl-nav" aria-label="Secciones">' + items.map(function (it) {
      var actual = vista === it[0] || (vista === "test" && sesion && sesion.origen === it[0]);
      return '<button type="button" data-acc="ir" data-v="' + it[0] + '"' + (actual ? ' aria-current="page"' : "") + ">" + it[1] + "</button>";
    }).join("") + "</nav>";
  }
  function pie() {
    return '<p class="ldl-pie">Letra de Ley · ' + esc(CFG.pack.edicion) + " · Texto legal actualizado a " +
      esc(CFG.pack.actualizado) + "<br>Uso personal. Prohibida su redistribución.</p>";
  }

  function vInicio() {
    var r = resumen(B.preguntas), f = fallosPendientes().length;
    return '<section class="ldl-card"><h2>' + esc(CFG.pack.nombre) + "</h2>" +
      '<p class="ldl-muted">' + B.preguntas.length + " preguntas comentadas, con el artículo exacto de cada respuesta.</p>" +
      '<div class="ldl-kpis"><div class="ldl-kpi"><b>' + r.vistas + "/" + r.total + "</b><span>respondidas</span></div>" +
      '<div class="ldl-kpi"><b>' + r.acierto + ' %</b><span>de acierto</span></div>' +
      '<div class="ldl-kpi"><b>' + f + "</b><span>fallos por repasar</span></div></div>" +
      '<div class="ldl-acciones"><button class="ldl-btn" data-acc="rapido" type="button">Test rápido de 20</button>' +
      '<button class="ldl-btn sec" data-acc="ir" data-v="simulacro" type="button">Simulacro de examen</button>' +
      (f ? '<button class="ldl-btn sec" data-acc="repasar" type="button">Repasar ' + f + " fallos</button>" : "") +
      "</div></section>" +
      '<section class="ldl-card"><h3>Cómo sacarle partido</h3><ol class="ldl-muted">' +
      "<li>Practica <b>por temas</b>: cada respuesta te enseña el artículo y por qué fallan las demás opciones.</li>" +
      "<li>Cada pocos días, <b>repasa tus fallos</b>: es donde más se aprende.</li>" +
      "<li>Antes del examen, haz <b>simulacros</b> con tiempo y con la penalización real (cada error resta 1/3).</li></ol>" +
      '<p class="ldl-small ldl-muted">Tu progreso se guarda en este dispositivo y en este navegador.</p></section>' + historial();
  }
  function historial() {
    if (!prog.h.length) return "";
    return '<section class="ldl-card"><h3>Últimos tests</h3><ul class="ldl-revision">' + prog.h.slice(0, 5).map(function (h) {
      var d = new Date(h.t);
      return "<li><b>" + (h.tipo === "simulacro" ? "Simulacro" : "Práctica") + "</b> · " + d.toLocaleDateString("es-ES") +
        " · " + h.a + "/" + h.n + " aciertos" + (h.tipo === "simulacro" ? " · nota " + num(h.nota) : "") + "</li>";
    }).join("") + "</ul></section>";
  }
  function vTemas() {
    var html = '<section class="ldl-card"><h2>Practicar por temas</h2><p class="ldl-muted">Elige un bloque. Las preguntas salen en orden aleatorio y se corrigen al momento.</p><ul class="ldl-bloques">';
    B.bloques.forEach(function (b) {
      var lista = delBloque(b.id), r = resumen(lista);
      html += '<li><button type="button" data-acc="bloque" data-id="' + esc(b.id) + '"><span class="t">' + esc(b.nombre) +
        '</span><span class="n">' + r.vistas + "/" + r.total + (r.vistas ? " · " + r.acierto + " %" : "") + "</span>" +
        '<span class="ldl-barra"><i style="width:' + pct(r.vistas, r.total) + '%"></i></span></button></li>';
    });
    return html + "</ul></section>";
  }
  function vSimulacro() {
    var total = B.preguntas.length;
    var opcionesN = [10, 20, 30, 50, 100].filter(function (n) { return n < total; });
    opcionesN.push(total);
    var porDefecto = Math.min((CFG.simulacro && CFG.simulacro.preguntas) || 30, total);
    return '<section class="ldl-card"><h2>Simulacro de examen</h2>' +
      '<p class="ldl-muted">Como el día del examen: no ves las soluciones hasta el final y cada error resta un tercio de acierto.</p>' +
      '<div class="ldl-campo"><label for="ldl-n">Número de preguntas</label><select id="ldl-n">' +
      opcionesN.map(function (n) { return "<option" + (n === porDefecto ? " selected" : "") + ">" + n + "</option>"; }).join("") +
      '</select></div><div class="ldl-campo"><label for="ldl-t">Tiempo</label><select id="ldl-t">' +
      '<option value="1">1 minuto por pregunta</option><option value="0">Sin límite de tiempo</option></select></div>' +
      '<div class="ldl-campo"><label for="ldl-b">Temas</label><select id="ldl-b"><option value="">Todos</option>' +
      B.bloques.map(function (b) { return '<option value="' + esc(b.id) + '">' + esc(b.nombre) + "</option>"; }).join("") +
      '</select></div><div class="ldl-acciones"><button class="ldl-btn" data-acc="simular" type="button">Empezar simulacro</button></div></section>';
  }
  function vFallos() {
    var f = fallosPendientes();
    if (!f.length) {
      return '<section class="ldl-card"><h2>Repaso de fallos</h2><p class="ldl-muted">No tienes fallos pendientes. Cuando falles una pregunta aparecerá aquí hasta que la aciertes.</p></section>';
    }
    return '<section class="ldl-card"><h2>Repaso de fallos</h2><p class="ldl-muted">Tienes <b>' + f.length +
      "</b> preguntas falladas. Salen de aquí en cuanto las aciertas.</p>" +
      '<div class="ldl-acciones"><button class="ldl-btn" data-acc="repasar" type="button">Repasar ahora</button></div></section>';
  }
  function vStats() {
    var html = '<section class="ldl-card"><h2>Estadísticas</h2><ul class="ldl-bloques">';
    B.bloques.forEach(function (b) {
      var r = resumen(delBloque(b.id));
      html += '<li><button type="button" data-acc="bloque" data-id="' + esc(b.id) + '"><span class="t">' + esc(b.nombre) +
        '</span><span class="n">' + (r.vistas ? r.acierto + " % de acierto" : "sin empezar") + '</span><span class="ldl-barra"><i style="width:' +
        r.acierto + '%"></i></span></button></li>';
    });
    html += '</ul></section><section class="ldl-card"><h3>Empezar de cero</h3><p class="ldl-muted ldl-small">Borra tu progreso guardado en este dispositivo.</p>' +
      '<div class="ldl-acciones"><button class="ldl-btn sec" data-acc="borrar" type="button">Borrar mi progreso</button></div></section>';
    return html;
  }
  function vPortada() {
    var n = B.preguntas.length;
    return '<section class="ldl-card"><h2>' + esc(CFG.pack.nombre) + "</h2>" +
      '<p class="ldl-muted">' + n + " preguntas tipo examen, corregidas al momento, con el artículo exacto y la explicación de cada opción. Gratis y sin registrarte.</p>" +
      '<div class="ldl-acciones"><button class="ldl-btn" data-acc="empezarweb" type="button">Empezar el test</button></div></section>';
  }

  function vTest() {
    var id = sesion.ids[sesion.i], p = POR_ID[id], sim = sesion.tipo === "simulacro";
    var elegida = sesion.resp[id], corregida = !sim && sesion.corregida[id];
    var html = '<section class="ldl-card"><div class="ldl-meta"><span>' + esc(sesion.titulo) + " · " + (sesion.i + 1) + " de " + sesion.ids.length +
      "</span><span>" + (sesion.limite ? '⏱ <span id="ldl-crono" class="ldl-crono">' +
        mmss(Math.max(0, sesion.limite - Math.floor((Date.now() - sesion.inicio) / 1000))) + "</span>" : esc(p.articulo_txt)) +
      '</span></div><div class="ldl-progreso"><i style="width:' + pct(sesion.i + (corregida ? 1 : 0), sesion.ids.length) + '%"></i></div>' +
      '<p class="ldl-enunciado">' + esc(p.enunciado) + '</p><div class="ldl-opciones" role="group" aria-label="Opciones">';
    LETRAS.forEach(function (l) {
      var cls = "ldl-op";
      if (corregida) { if (l === p.correcta) cls += " ok"; else if (l === elegida) cls += " ko"; }
      else if (sim && elegida === l) cls += " marcada";
      html += '<button type="button" class="' + cls + '" data-acc="resp" data-l="' + l + '"' + (corregida ? " disabled" : "") +
        (sim ? ' aria-pressed="' + (elegida === l) + '"' : "") + '><span class="l">' + l + ")</span><span>" + esc(p.opciones[l]) + "</span></button>";
    });
    html += "</div>";
    if (corregida) html += feedback(p, elegida);
    html += '<div class="ldl-acciones">';
    if (sim) {
      html += (sesion.i > 0 ? '<button class="ldl-btn sec" data-acc="ant" type="button">Anterior</button>' : "") +
        '<button class="ldl-btn" data-acc="sig" type="button">' + (sesion.i < sesion.ids.length - 1 ? "Siguiente" : "Entregar") + "</button>" +
        (sesion.i < sesion.ids.length - 1 ? '<button class="ldl-btn sec" data-acc="entregar" type="button">Entregar ya</button>' : "");
    } else if (corregida) {
      html += '<button class="ldl-btn" data-acc="sig" type="button">' + (sesion.i < sesion.ids.length - 1 ? "Siguiente" : "Ver resultado") + "</button>";
    }
    html += '<button class="ldl-btn sec" data-acc="salir" type="button">Salir</button></div></section>';
    return html;
  }
  function feedback(p, elegida) {
    var bien = elegida === p.correcta;
    return '<div class="ldl-feedback" aria-live="polite"><div class="v ' + (bien ? "ok" : "ko") + '">' +
      (bien ? "¡Correcta!" : "Incorrecta. La respuesta correcta es la " + p.correcta + ")") + "</div><div>" + esc(p.explicacion) + "</div>" +
      (p.cita ? '<blockquote class="ldl-cita">' + esc(p.cita) + "<small>" + esc(p.articulo_txt) + "</small></blockquote>" : "") + "</div>";
  }
  function vResultado() {
    var r = calcular(sesion), sim = sesion.tipo === "simulacro";
    var html = '<section class="ldl-card"><h2>' + (sim ? "Resultado del simulacro" : "Resultado") + "</h2>" +
      '<div class="ldl-nota">' + (sim ? num(r.nota.toFixed(2)) : r.aciertos + "/" + r.total) + "</div>" +
      '<p class="ldl-muted">' + plural(r.aciertos, "acierto", "aciertos") + " · " + plural(r.errores, "error", "errores") +
      (r.blancos ? " · " + r.blancos + " en blanco" : "") +
      (sim ? " · nota sobre 10 con penalización" : "") + "</p>";
    if (CFG.modo === "web") html += ctaWeb(r);
    html += '<div class="ldl-acciones">' + (CFG.modo === "web" ? '<button class="ldl-btn sec" data-acc="empezarweb" type="button">Repetir con otro orden</button>' :
      '<button class="ldl-btn" data-acc="ir" data-v="inicio" type="button">Volver al inicio</button>') + "</div></section>";
    html += '<section class="ldl-card"><h3>Revisión</h3><ul class="ldl-revision">';
    sesion.ids.forEach(function (id, n) {
      var p = POR_ID[id], e = sesion.resp[id], chip = !e ? '<span class="ldl-chip nr">En blanco</span>' :
        e === p.correcta ? '<span class="ldl-chip ok">Bien</span>' : '<span class="ldl-chip ko">Mal</span>';
      html += "<li>" + chip + '<span class="e">' + (n + 1) + ". " + esc(p.enunciado) + "</span><br>" +
        '<span class="ldl-small">Correcta: <b>' + p.correcta + ") " + esc(p.opciones[p.correcta]) + "</b>" +
        (e && e !== p.correcta ? " · Marcaste " + e + ")" : "") + '</span><br><span class="ldl-small ldl-muted">' + esc(p.explicacion) + "</span></li>";
    });
    return html + "</ul></section>";
  }
  function ctaWeb() {
    var c = CFG.compra || {}, html = "";
    if (c.url) {
      html += '<div class="ldl-card ldl-cta"><h3>' + esc(c.titulo) + '</h3><p class="ldl-muted">' + esc(c.texto) + "</p>" +
        '<div class="ldl-acciones"><a class="ldl-btn acc" href="' + esc(c.url) + '">' + esc(c.boton) + "</a></div></div>";
    }
    if (CFG.telegram) {
      html += '<p class="ldl-small">¿Quieres un test cada día? <a href="' + esc(CFG.telegram) + '">Únete gratis al canal de Telegram</a>.</p>';
    }
    return html;
  }

  function pintar() {
    var cuerpo;
    if (vista === "test") cuerpo = vTest();
    else if (vista === "resultado") cuerpo = vResultado();
    else if (vista === "portada") cuerpo = vPortada();
    else if (vista === "temas") cuerpo = vTemas();
    else if (vista === "simulacro") cuerpo = vSimulacro();
    else if (vista === "fallos") cuerpo = vFallos();
    else if (vista === "stats") cuerpo = vStats();
    else cuerpo = vInicio();
    raiz.innerHTML = '<div class="ldl">' + cabecera() + navegacion() + "<main>" + cuerpo + "</main>" + pie() + "</div>";
  }

  /* ---------- eventos ---------- */
  raiz.addEventListener("click", function (ev) {
    var el = ev.target.closest("[data-acc]");
    if (!el) return;
    var acc = el.getAttribute("data-acc");
    if (acc === "tema") return cambiarTema();
    if (acc === "ir") { pararReloj(); vista = el.getAttribute("data-v"); sesion = null; pintar(); return; }
    if (acc === "rapido") return empezar("practica", barajar(B.preguntas).slice(0, 20), { titulo: "Test rápido" });
    if (acc === "repasar") return empezar("practica", barajar(fallosPendientes()).slice(0, 30), { titulo: "Repaso de fallos" });
    if (acc === "bloque") {
      var b = B.bloques.filter(function (x) { return x.id === el.getAttribute("data-id"); })[0];
      return empezar("practica", barajar(delBloque(b.id)), { titulo: b.nombre });
    }
    if (acc === "simular") {
      var n = parseInt(document.getElementById("ldl-n").value, 10);
      var conTiempo = document.getElementById("ldl-t").value === "1";
      var bloque = document.getElementById("ldl-b").value;
      var fuente = bloque ? delBloque(bloque) : B.preguntas;
      var elegidas = barajar(fuente).slice(0, n);
      return empezar("simulacro", elegidas, { titulo: "Simulacro", minutos: conTiempo ? elegidas.length : 0 });
    }
    if (acc === "empezarweb") return empezar("practica", barajar(B.preguntas), { titulo: "Test gratuito" });
    if (acc === "resp") return responder(el.getAttribute("data-l"));
    if (acc === "sig") return siguiente();
    if (acc === "ant") return anterior();
    if (acc === "entregar") return terminar();
    if (acc === "salir") { pararReloj(); sesion = null; vista = CFG.modo === "web" ? "portada" : "inicio"; pintar(); return; }
    if (acc === "borrar") {
      if (el.getAttribute("data-confirmar") === "1") { prog = { p: {}, h: [] }; guardar(); pintar(); }
      else { el.setAttribute("data-confirmar", "1"); el.textContent = "Pulsa otra vez para confirmar"; }
    }
  });
  document.addEventListener("keydown", function (ev) {
    if (vista !== "test" || !sesion || ev.altKey || ev.ctrlKey || ev.metaKey) return;
    var k = ev.key.toLowerCase(), mapa = { "1": "a", "2": "b", "3": "c", "4": "d", a: "a", b: "b", c: "c", d: "d" };
    if (mapa[k]) { ev.preventDefault(); responder(mapa[k]); }
    else if (k === "enter" || k === "arrowright") {
      var id = sesion.ids[sesion.i];
      if (sesion.tipo === "simulacro" || sesion.corregida[id]) { ev.preventDefault(); siguiente(); }
    } else if (k === "arrowleft" && sesion.tipo === "simulacro") { ev.preventDefault(); anterior(); }
  });

  pintar();
})();
</script>
</body>
</html>
