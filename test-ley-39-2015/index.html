}],"preguntas":[{"id":"L39-L1-002","ley":"L39","articulo":"1.1","articulo_txt":"Art. 1.1 Ley 39/2015","bloque_id":"L39|Título Preliminar. Disposiciones generales","enunciado":"Según el artículo 1.1 de la Ley 39/2015, la Ley también tiene por objeto regular los principios a los que se ha de ajustar el ejercicio de:","opciones":{"a":"La potestad sancionadora y la potestad reglamentaria","b":"La iniciativa legislativa y la potestad sancionadora","c":"La potestad reglamentaria y la potestad expropiatoria","d":"La iniciativa legislativa y la potestad reglamentaria"},"correcta":"d","explicacion":"El artículo 1.1 termina refiriéndose a «los principios a los que se ha de ajustar el ejercicio de la iniciativa legislativa y la potestad reglamentaria». La a) el artículo 1.1 no se refiere a los principios de la potestad sancionadora, sino a los de la iniciativa legislativa. La b) junto a la iniciativa legislativa, el artículo 1.1 cita la potestad reglamentaria, no la sancionadora. La c) el artículo 1.1 no menciona la potestad expropiatoria; la otra potestad citada es la iniciativa legislativa.","cita":"«(…) así como los principios a los que se ha de ajustar el ejercicio de la iniciativa legislativa y la potestad reglamentaria.»","dificultad":1},{"id":"L39-L1-006","ley":"L39","articulo":"2.3","articulo_txt":"Art. 2.3 Ley 39/2015","bloque_id":"L39|Título Preliminar. Disposiciones generales","enunciado":"Según el artículo 2.3 de la Ley 39/2015, ¿cuál de los siguientes NO tiene la consideración de Administración Pública?","opciones":{"a":"Las entidades de derecho privado vinculadas o dependientes de las Administraciones Públicas","b":"La Administración General del Estado","c":"Las Entidades que integran la Administración Local","d":"Los organismos públicos y entidades de derecho público vinculados o dependientes de las Administraciones Públicas"},"correcta":"a","explicacion":"El artículo 2.3 considera Administraciones Públicas a la Administración General del Estado, las de las Comunidades Autónomas, las Entidades que integran la Administración Local y los organismos públicos y entidades de derecho público de la letra a) del apartado 2, pero no a las entidades de derecho privado de la letra b). La b) figura expresamente en el artículo 2.3 como Administración Pública. La c) el artículo 2.3 las incluye expresamente entre las Administraciones Públicas. La d) el artículo 2.3 les reconoce esa consideración al remitirse a la letra a) del apartado 2.","cita":"«3. Tienen la consideración de Administraciones Públicas la Administración General del Estado, las Administraciones de las Comunidades Autónomas, las Entidades que integran la Administración Local, así como los organismos públicos y entidades de derecho público previstos en la letra a) del apartado 2 anterior.»","dificultad":2},{"id":"L39-L1-009","ley":"L39","articulo":"3.b","articulo_txt":"Art. 3.b Ley 39/2015","bloque_id":"L39|Título I. De los interesados en el procedimiento","enunciado":"Según el artículo 3.b) de la Ley 39/2015, los menores de edad tendrán capacidad de obrar ante las Administraciones Públicas:","opciones":{"a":"Solo cuando hayan cumplido dieciséis años, para cualquier derecho o interés y en cualquier procedimiento","b":"En ningún caso, pues deben actuar siempre por medio de quien ejerza la patria potestad, tutela o curatela","c":"Solo para formular solicitudes, y siempre con la autorización expresa de quien ejerza la patria potestad, tutela o curatela","d":"Para el ejercicio y defensa de aquellos de sus derechos e intereses cuya actuación esté permitida por el ordenamiento jurídico sin la asistencia de quien ejerza la patria potestad, tutela o curatela"},"correcta":"d","explicacion":"El artículo 3.b) reconoce capacidad de obrar a los menores para el ejercicio y defensa de los derechos e intereses cuya actuación permita el ordenamiento jurídico sin la asistencia de quien ejerza la patria potestad, tutela o curatela. La a) el artículo 3.b) no fija una edad mínima, sino que atiende a los derechos e intereses cuya actuación permita el ordenamiento sin asistencia. La b) el artículo 3.b) sí les reconoce capacidad de obrar en determinados supuestos. La c) el artículo 3.b) no limita la capacidad a las solicitudes ni exige autorización: se refiere precisamente a actuaciones permitidas sin esa asistencia.","cita":"«b) Los menores de edad para el ejercicio y defensa de aquellos de sus derechos e intereses cuya actuación esté permitida por el ordenamiento jurídico sin la asistencia de la persona que ejerza la patria potestad, tutela o curatela. (…)»","dificultad":2},{"id":"L39-L1-008","ley":"L39","articulo":"3.a","articulo_txt":"Art. 3.a Ley 39/2015","bloque_id":"L39|Título I. De los interesados en el procedimiento","enunciado":"Según el artículo 3 de la Ley 39/2015, tendrán capacidad de obrar ante las Administraciones Públicas las personas físicas o jurídicas que ostenten capacidad de obrar con arreglo a:","opciones":{"a":"Las normas administrativas","b":"Las normas mercantiles","c":"Las normas civiles","d":"Las normas procesales"},"correcta":"c","explicacion":"El artículo 3.a) remite a la capacidad de obrar que las personas físicas o jurídicas ostenten «con arreglo a las normas civiles». La a) el artículo 3.a) no remite a las normas administrativas, sino a las civiles. La b) la referencia del artículo 3.a) es a las normas civiles, no a las mercantiles. La d) el artículo 3.a) no remite a las normas procesales, sino a las civiles.","cita":"«a) Las personas físicas o jurídicas que ostenten capacidad de obrar con arreglo a las normas civiles.»","dificultad":1},{"id":"L39-L2-016","ley":"L39","articulo":"20.2","articulo_txt":"Art. 20.2 Ley 39/2015","bloque_id":"L39|Título II. De la actividad de las Administraciones Públicas · Capítulo I. Normas generales de actuación","enunciado":"Según el artículo 20.2 de la Ley 39/2015, los interesados podrán solicitar la exigencia de la responsabilidad de los titulares de las unidades administrativas y del personal que tengan a su cargo la tramitación de los asuntos a:","opciones":{"a":"El superior jerárquico del órgano instructor, exclusivamente.","b":"El órgano jurisdiccional contencioso-administrativo competente.","c":"El Consejo de Transparencia y Buen Gobierno.","d":"La Administración Pública de que dependa el personal afectado."},"correcta":"d","explicacion":"El artículo 20.2 dispone que los interesados podrán solicitar la exigencia de esa responsabilidad «a la Administración Pública de que dependa el personal afectado». Ni el superior jerárquico del instructor (a), ni los tribunales (b), ni el Consejo de Transparencia (c) son los destinatarios que señala el precepto.","cita":"«2. Los interesados podrán solicitar la exigencia de esa responsabilidad a la Administración Pública de que dependa el personal afectado.»","dificultad":2},{"id":"L39-L2-029","ley":"L39","articulo":"24.4","articulo_txt":"Art. 24.4 Ley 39/2015","bloque_id":"L39|Título II. De la actividad de las Administraciones Públicas · Capítulo I. Normas generales de actuación","enunciado":"Según el artículo 24.4 de la Ley 39/2015, el certificado acreditativo del silencio producido se expedirá de oficio por el órgano competente para resolver en el plazo de:","opciones":{"a":"Diez días desde que expire el plazo máximo para resolver el procedimiento.","b":"Quince días desde que expire el plazo máximo para resolver el procedimiento.","c":"Un mes desde que expire el plazo máximo para resolver el procedimiento.","d":"Veinte días desde que el interesado lo solicite."},"correcta":"b","explicacion":"El artículo 24.4 dispone que el certificado «se expedirá de oficio por el órgano competente para resolver en el plazo de quince días desde que expire el plazo máximo para resolver». La a), la c) y la d) cambian el plazo; además, si lo pide el interesado, el mismo plazo se cuenta desde el día siguiente a la entrada de la petición en el registro electrónico competente.","cita":"«Este certificado se expedirá de oficio por el órgano competente para resolver en el plazo de quince días desde que expire el plazo máximo para resolver el procedimiento.»","dificultad":2},{"id":"L39-L2-040","ley":"L39","articulo":"30.1","articulo_txt":"Art. 30.1 Ley 39/2015","bloque_id":"L39|Título II. De la actividad de las Administraciones Públicas · Capítulo II. Términos y plazos","enunciado":"Según el artículo 30.1 de la Ley 39/2015, salvo que por ley o en el Derecho de la Unión Europea se disponga otro cómputo, cuando los plazos se señalen por horas:","opciones":{"a":"Se entiende que son naturales.","b":"Se entiende que son hábiles las comprendidas en el horario de atención al público de las oficinas de registro.","c":"Se entiende que son hábiles las comprendidas entre las ocho y las veinte horas de cada día hábil.","d":"Se entiende que son hábiles, y son hábiles todas las horas del día que formen parte de un día hábil."},"correcta":"d","explicacion":"El artículo 30.1 establece que, cuando los plazos se señalan por horas, «se entiende que éstas son hábiles» y que «son hábiles todas las horas del día que formen parte de un día hábil». La a) contradice la regla, y la b) y la c) restringen las horas hábiles a franjas horarias que la ley no prevé.","cita":"«1. Salvo que por Ley o en el Derecho de la Unión Europea se disponga otro cómputo, cuando los plazos se señalen por horas, se entiende que éstas son hábiles. Son hábiles todas las horas del día que formen parte de un día hábil.»","dificultad":2},{"id":"L39-L2-047","ley":"L39","articulo":"32.1","articulo_txt":"Art. 32.1 Ley 39/2015","bloque_id":"L39|Título II. De la actividad de las Administraciones Públicas · Capítulo II. Términos y plazos","enunciado":"Según el artículo 32.1 de la Ley 39/2015, la ampliación de los plazos establecidos que la Administración puede conceder, de oficio o a petición de los interesados, salvo precepto en contrario, tiene como límite máximo:","opciones":{"a":"Un tercio de los plazos establecidos.","b":"El doble de los plazos establecidos.","c":"El mismo plazo inicialmente establecido.","d":"La mitad de los plazos establecidos."},"correcta":"d","explicacion":"El artículo 32.1 permite una ampliación «que no exceda de la mitad de los mismos», si las circunstancias lo aconsejan y no se perjudican derechos de tercero. La c) recoge el límite de la ampliación del plazo máximo para resolver (art. 23.1), y la a) y la b) no responden al texto.","cita":"«1. La Administración, salvo precepto en contrario, podrá conceder de oficio o a petición de los interesados, una ampliación de los plazos establecidos, que no exceda de la mitad de los mismos, si las circunstancias lo aconsejan y con ello no se perjudican derechos de tercero. El acuerdo de ampliación deberá ser notificado a los interesados.»","dificultad":2},{"id":"L39-L3-001","ley":"L39","articulo":"34.2","articulo_txt":"Art. 34.2 Ley 39/2015","bloque_id":"L39|Título III. De los actos administrativos · Capítulo I. Requisitos de los actos administrativos","enunciado":"Según el artículo 34.2 de la Ley 39/2015, el contenido de los actos administrativos se ajustará a lo dispuesto por el ordenamiento jurídico y será:","opciones":{"a":"Determinado y adecuado a los fines de aquéllos.","b":"Uniforme para todos los interesados en el procedimiento.","c":"Proporcionado al interés público y a los medios disponibles.","d":"Conforme, en todo caso, con lo solicitado por el interesado."},"correcta":"a","explicacion":"El artículo 34.2 exige que el contenido de los actos sea «determinado y adecuado a los fines de aquéllos». Ni la uniformidad (b), ni la proporcionalidad a los medios disponibles (c), ni la conformidad en todo caso con lo solicitado (d) figuran en ese apartado.","cita":"«2. El contenido de los actos se ajustará a lo dispuesto por el ordenamiento jurídico y será determinado y adecuado a los fines de aquéllos.»","dificultad":1},{"id":"L39-L3-003","ley":"L39","articulo":"35.1","articulo_txt":"Art. 35.1 Ley 39/2015","bloque_id":"L39|Título III. De los actos administrativos · Capítulo I. Requisitos de los actos administrativos","enunciado":"Según el artículo 35.1 de la Ley 39/2015, los actos que deben ser motivados lo serán con:","opciones":{"a":"Exposición detallada de los hechos, de los fundamentos de derecho y de las pruebas practicadas.","b":"Sucinta referencia de hechos y fundamentos de derecho.","c":"Referencia expresa a los informes y dictámenes que consten en el expediente.","d":"Sucinta referencia a los fundamentos de derecho, sin necesidad de relatar los hechos."},"correcta":"b","explicacion":"El artículo 35.1 dispone que serán motivados «con sucinta referencia de hechos y fundamentos de derecho». La a) exige una exposición detallada que la ley no pide; la c) añade una referencia a informes que el precepto no establece, y la d) suprime la referencia a los hechos.","cita":"«1. Serán motivados, con sucinta referencia de hechos y fundamentos de derecho:»","dificultad":1},{"id":"L39-L3-030","ley":"L39","articulo":"44","articulo_txt":"Art. 44 Ley 39/2015","bloque_id":"L39|Título III. De los actos administrativos · Capítulo II. Eficacia de los actos","enunciado":"Según el artículo 44 de la Ley 39/2015, cuando los interesados en un procedimiento sean desconocidos, se ignore el lugar de la notificación o bien, intentada ésta, no se hubiese podido practicar, la notificación se hará por medio de un anuncio publicado en:","opciones":{"a":"La sede electrónica de la Administración u Organismo actuante.","b":"El «Boletín Oficial del Estado».","c":"La dirección electrónica habilitada única.","d":"Un diario de los de mayor difusión en la provincia del último domicilio del interesado."},"correcta":"b","explicacion":"El artículo 44 establece que, en estos casos, la notificación se hará por medio de un anuncio publicado en el «Boletín Oficial del Estado». La sede electrónica (a), la dirección electrónica habilitada única (c) y los diarios de difusión provincial (d) no sustituyen a ese anuncio.","cita":"«Cuando los interesados en un procedimiento sean desconocidos, se ignore el lugar de la notificación o bien, intentada ésta, no se hubiese podido practicar, la notificación se hará por medio de un anuncio publicado en el «Boletín Oficial del Estado».»","dificultad":1},{"id":"L39-L3-035","ley":"L39","articulo":"46","articulo_txt":"Art. 46 Ley 39/2015","bloque_id":"L39|Título III. De los actos administrativos · Capítulo II. Eficacia de los actos","enunciado":"Según el artículo 46 de la Ley 39/2015, si el órgano competente apreciase que la notificación por medio de anuncios o la publicación de un acto lesiona derechos o intereses legítimos:","opciones":{"a":"Se abstendrá de publicar el acto y lo notificará personalmente a cada interesado.","b":"Publicará el acto íntegro, previa supresión de los datos personales de los interesados.","c":"Se limitará a publicar una somera indicación del contenido del acto y del lugar donde los interesados podrán comparecer para conocimiento de su contenido íntegro.","d":"Suspenderá la publicación hasta que los interesados presten su consentimiento."},"correcta":"c","explicacion":"El artículo 46 dispone que el órgano «se limitará a publicar en el Diario oficial que corresponda una somera indicación del contenido del acto y del lugar donde los interesados podrán comparecer», en el plazo que se establezca. No se renuncia a publicar (a), no se publica el acto íntegro (b) y no se condiciona al consentimiento de los interesados (d).","cita":"«Si el órgano competente apreciase que la notificación por medio de anuncios o la publicación de un acto lesiona derechos o intereses legítimos, se limitará a publicar en el Diario oficial que corresponda una somera indicación del contenido del acto y del lugar donde los interesados podrán comparecer, en el plazo que se establezca, para conocimiento del contenido íntegro del mencionado acto y constancia de tal conocimiento.»","dificultad":2},{"id":"L39-L3-036","ley":"L39","articulo":"47.1","articulo_txt":"Art. 47.1 Ley 39/2015","bloque_id":"L39|Título III. De los actos administrativos · Capítulo III. Nulidad y anulabilidad","enunciado":"Según el artículo 47.1 de la Ley 39/2015, ¿cuál de los siguientes actos NO figura entre los supuestos de nulidad de pleno derecho?","opciones":{"a":"Los que tengan un contenido imposible.","b":"Los dictados sin la motivación exigida por el artículo 35.","c":"Los que sean constitutivos de infracción penal o se dicten como consecuencia de ésta.","d":"Los que lesionen los derechos y libertades susceptibles de amparo constitucional."},"correcta":"b","explicacion":"La falta de motivación no aparece en la relación del artículo 47.1. Sí figuran en él la a), que corresponde a la letra c); la c), a la letra d), y la d), a la letra a).","cita":"«1. Los actos de las Administraciones Públicas son nulos de pleno derecho en los casos siguientes: a) Los que lesionen los derechos y libertades susceptibles de amparo constitucional. (…) c) Los que tengan un contenido imposible. d) Los que sean constitutivos de infracción penal o se dicten como consecuencia de ésta.»","dificultad":2},{"id":"L39-L3-046","ley":"L39","articulo":"52.2","articulo_txt":"Art. 52.2 Ley 39/2015","bloque_id":"L39|Título III. De los actos administrativos · Capítulo III. Nulidad y anulabilidad","enunciado":"Según el artículo 52.2 de la Ley 39/2015, el acto de convalidación producirá efecto:","opciones":{"a":"Desde la fecha del acto convalidado, en todo caso.","b":"Desde su notificación a los interesados, en todo caso.","c":"Desde la fecha del acto convalidado, salvo que lesione derechos de terceros.","d":"Desde su fecha, salvo lo dispuesto en el artículo 39.3 para la retroactividad de los actos administrativos."},"correcta":"d","explicacion":"El artículo 52.2 dispone que el acto de convalidación «producirá efecto desde su fecha, salvo lo dispuesto en el artículo 39.3 para la retroactividad de los actos administrativos». La a) y la c) le atribuyen, como regla, efectos retroactivos a la fecha del acto convalidado, y la b) cambia el momento inicial.","cita":"«2. El acto de convalidación producirá efecto desde su fecha, salvo lo dispuesto en el artículo 39.3 para la retroactividad de los actos administrativos.»","dificultad":2},{"id":"L39-L4-003","ley":"L39","articulo":"53.1.c","articulo_txt":"Art. 53.1.c Ley 39/2015","bloque_id":"L39|Título IV. De las disposiciones sobre el procedimiento administrativo común · Capítulo I. Garantías del procedimiento","enunciado":"Según el artículo 53.1.c) de la Ley 39/2015, cuando, excepcionalmente, un interesado deba presentar un documento original, tendrá derecho a:","opciones":{"a":"Que el original le sea devuelto en el plazo máximo de diez días.","b":"Sustituirlo por una declaración responsable sobre su contenido.","c":"Que se le exima de aportar cualquier otro documento en ese procedimiento.","d":"Obtener una copia autenticada de éste."},"correcta":"d","explicacion":"El artículo 53.1.c) establece que, si excepcionalmente deben presentar un documento original, los interesados «tendrán derecho a obtener una copia autenticada de éste». El precepto no fija un plazo de devolución del original (a), no permite sustituirlo por una declaración responsable (b) ni exime de aportar otros documentos (c).","cita":"«c) A no presentar documentos originales salvo que, de manera excepcional, la normativa reguladora aplicable establezca lo contrario. En caso de que, excepcionalmente, deban presentar un documento original, tendrán derecho a obtener una copia autenticada de éste.»","dificultad":1},{"id":"L39-L4-005","ley":"L39","articulo":"53.1.e","articulo_txt":"Art. 53.1.e Ley 39/2015","bloque_id":"L39|Título IV. De las disposiciones sobre el procedimiento administrativo común · Capítulo I. Garantías del procedimiento","enunciado":"Según el artículo 53.1.e) de la Ley 39/2015, los interesados tienen derecho a formular alegaciones, utilizar los medios de defensa admitidos por el Ordenamiento Jurídico y aportar documentos:","opciones":{"a":"Únicamente durante el trámite de audiencia.","b":"En cualquier momento anterior a que se dicte la resolución.","c":"En cualquier fase del procedimiento anterior al trámite de audiencia.","d":"Solo dentro de los diez días siguientes a la notificación del acuerdo de iniciación."},"correcta":"c","explicacion":"El artículo 53.1.e) permite formular alegaciones y aportar documentos «en cualquier fase del procedimiento anterior al trámite de audiencia», que deberán ser tenidos en cuenta por el órgano competente al redactar la propuesta de resolución. La a) limita indebidamente el derecho al trámite de audiencia, la b) extiende el límite hasta la resolución y la d) fija un plazo de diez días que el precepto no contiene.","cita":"«e) A formular alegaciones, utilizar los medios de defensa admitidos por el Ordenamiento Jurídico, y a aportar documentos en cualquier fase del procedimiento anterior al trámite de audiencia, que deberán ser tenidos en cuenta por el órgano competente al redactar la propuesta de resolución.»","dificultad":2},{"id":"L39-L4-036","ley":"L39","articulo":"66.6","articulo_txt":"Art. 66.6 Ley 39/2015","bloque_id":"L39|Título IV. De las disposiciones sobre el procedimiento administrativo común · Capítulo II. Iniciación del procedimiento","enunciado":"Según el artículo 66.6 de la Ley 39/2015, cuando la Administración, en un procedimiento concreto, establezca expresamente modelos específicos de presentación de solicitudes, estos modelos serán:","opciones":{"a":"De uso obligatorio por los interesados.","b":"De uso voluntario, como los modelos de presentación masiva.","c":"De uso obligatorio solo para los sujetos obligados a relacionarse electrónicamente.","d":"De uso obligatorio solo en los procedimientos de concurrencia competitiva."},"correcta":"a","explicacion":"El artículo 66.6 dispone que esos modelos específicos «serán de uso obligatorio por los interesados», sin limitarlo a ciertos sujetos (c) o procedimientos (d). La b) confunde este supuesto con los modelos de presentación masiva del artículo 66.4, que sí son «de uso voluntario».","cita":"«6. Cuando la Administración en un procedimiento concreto establezca expresamente modelos específicos de presentación de solicitudes, éstos serán de uso obligatorio por los interesados.»","dificultad":1},{"id":"L39-L4-043","ley":"L39","articulo":"69.1","articulo_txt":"Art. 69.1 Ley 39/2015","bloque_id":"L39|Título IV. De las disposiciones sobre el procedimiento administrativo común · Capítulo II. Iniciación del procedimiento","enunciado":"Según el artículo 69.1 de la Ley 39/2015, en la declaración responsable el interesado manifiesta, bajo su responsabilidad, que cumple con los requisitos establecidos en la normativa vigente, que dispone de la documentación que así lo acredita y que:","opciones":{"a":"La acompaña necesariamente a la declaración.","b":"La presentará en el registro en el plazo de diez días desde la declaración.","c":"La pondrá a disposición de la Administración cuando le sea requerida.","d":"La conservará únicamente hasta que la Administración realice la primera comprobación."},"correcta":"c","explicacion":"El artículo 69.1 define la declaración responsable como el documento en que el interesado manifiesta que dispone de la documentación acreditativa, «que la pondrá a disposición de la Administración cuando le sea requerida», y que se compromete a mantener el cumplimiento durante el período inherente al reconocimiento o ejercicio. No exige acompañarla (a) ni presentarla en un plazo (b), y la d) contradice ese compromiso de mantenimiento.","cita":"«1. A los efectos de esta Ley, se entenderá por declaración responsable el documento suscrito por un interesado en el que éste manifiesta, bajo su responsabilidad, que cumple con los requisitos establecidos en la normativa vigente para obtener el reconocimiento de un derecho o facultad o para su ejercicio, que dispone de la documentación que así lo acredita, que la pondrá a disposición de la Administración cuando le sea requerida, y que se compromete a mantener el cumplimiento de las anteriores obligaciones durante el período de tiempo inherente a dicho reconocimiento o ejercicio.»","dificultad":2},{"id":"L39-L5-005","ley":"L39","articulo":"71.3","articulo_txt":"Art. 71.3 Ley 39/2015","bloque_id":"L39|Título IV. De las disposiciones sobre el procedimiento administrativo común · Capítulo III. Ordenación del procedimiento","enunciado":"Según el artículo 71.3 de la Ley 39/2015, ¿quiénes serán responsables directos de la tramitación del procedimiento y, en especial, del cumplimiento de los plazos establecidos?","opciones":{"a":"Exclusivamente el órgano competente para resolver el procedimiento.","b":"El superior jerárquico común del órgano instructor y del órgano competente para resolver.","c":"Las personas designadas como órgano instructor o, en su caso, los titulares de las unidades administrativas que tengan atribuida tal función.","d":"El titular del departamento ministerial al que esté adscrito el órgano que tramita el procedimiento."},"correcta":"c","explicacion":"El artículo 71.3 atribuye esa responsabilidad directa a las personas designadas como órgano instructor «o, en su caso, los titulares de las unidades administrativas que tengan atribuida tal función». Ni el órgano competente para resolver (opción a), ni el superior jerárquico común (opción b), ni el titular del departamento (opción d) aparecen en el precepto.","cita":"«Las personas designadas como órgano instructor o, en su caso, los titulares de las unidades administrativas que tengan atribuida tal función serán responsables directos de la tramitación del procedimiento y, en especial, del cumplimiento de los plazos establecidos.»","dificultad":2},{"id":"L39-L5-011","ley":"L39","articulo":"74","articulo_txt":"Art. 74 Ley 39/2015","bloque_id":"L39|Título IV. De las disposiciones sobre el procedimiento administrativo común · Capítulo III. Ordenación del procedimiento","enunciado":"Según el artículo 74 de la Ley 39/2015, las cuestiones incidentales que se susciten en el procedimiento:","opciones":{"a":"Suspenderán la tramitación del procedimiento hasta que sean resueltas.","b":"No suspenderán la tramitación del procedimiento, salvo la abstención.","c":"Suspenderán la tramitación del procedimiento únicamente cuando se refieran a la nulidad de actuaciones.","d":"No suspenderán la tramitación del procedimiento, salvo la recusación."},"correcta":"d","explicacion":"El artículo 74 establece que las cuestiones incidentales, «incluso las que se refieran a la nulidad de actuaciones, no suspenderán la tramitación del mismo, salvo la recusación». La opción a) invierte la regla, la b) cambia la recusación por la abstención y la c) convierte en causa de suspensión justo lo que el precepto excluye.","cita":"«Las cuestiones incidentales que se susciten en el procedimiento, incluso las que se refieran a la nulidad de actuaciones, no suspenderán la tramitación del mismo, salvo la recusación.»","dificultad":2},{"id":"L39-L5-012","ley":"L39","articulo":"75.3","articulo_txt":"Art. 75.3 Ley 39/2015","bloque_id":"L39|Título IV. De las disposiciones sobre el procedimiento administrativo común · Capítulo IV. Instrucción del procedimiento · Sección 1.ª Disposiciones generales","enunciado":"Según el artículo 75.3 de la Ley 39/2015, los actos de instrucción que requieran la intervención de los interesados habrán de practicarse:","opciones":{"a":"En la forma que resulte más conveniente para ellos y sea compatible, en la medida de lo posible, con sus obligaciones laborales o profesionales.","b":"En la forma que determine el órgano instructor, sin atender a las circunstancias personales de los interesados.","c":"Siempre de forma presencial en las dependencias del órgano que tramite el procedimiento.","d":"En horario de atención al público, salvo que todos los interesados soliciten otro distinto."},"correcta":"a","explicacion":"El artículo 75.3 exige practicarlos «en la forma que resulte más conveniente para ellos y sea compatible, en la medida de lo posible, con sus obligaciones laborales o profesionales». Las opciones b), c) y d) imponen criterios que el precepto no recoge y que desatienden esa conveniencia de los interesados.","cita":"«Los actos de instrucción que requieran la intervención de los interesados habrán de practicarse en la forma que resulte más conveniente para ellos y sea compatible, en la medida de lo posible, con sus obligaciones laborales o profesionales.»","dificultad":1},{"id":"L39-L5-016","ley":"L39","articulo":"76.2","articulo_txt":"Art. 76.2 Ley 39/2015","bloque_id":"L39|Título IV. De las disposiciones sobre el procedimiento administrativo común · Capítulo IV. Instrucción del procedimiento · Sección 1.ª Disposiciones generales","enunciado":"Según el artículo 76.2 de la Ley 39/2015, las alegaciones de los interesados sobre defectos de tramitación, en especial los que supongan paralización, infracción de los plazos preceptivamente señalados u omisión de trámites subsanables, podrán dar lugar, si hubiere razones para ello, a:","opciones":{"a":"La nulidad de pleno derecho de todo lo actuado.","b":"La caducidad del procedimiento.","c":"La exigencia de la correspondiente responsabilidad disciplinaria.","d":"La suspensión automática del plazo máximo para resolver."},"correcta":"c","explicacion":"El artículo 76.2 establece que dichas alegaciones «podrán dar lugar, si hubiere razones para ello, a la exigencia de la correspondiente responsabilidad disciplinaria». La nulidad (opción a), la caducidad (opción b) y la suspensión del plazo para resolver (opción d) no son consecuencias previstas en el precepto.","cita":"«En todo momento podrán los interesados alegar los defectos de tramitación y, en especial, los que supongan paralización, infracción de los plazos preceptivamente señalados o la omisión de trámites que pueden ser subsanados antes de la resolución definitiva del asunto. Dichas alegaciones podrán dar lugar, si hubiere razones para ello, a la exigencia de la correspondiente responsabilidad disciplinaria.»","dificultad":2},{"id":"L39-L5-020","ley":"L39","articulo":"77.3","articulo_txt":"Art. 77.3 Ley 39/2015","bloque_id":"L39|Título IV. De las disposiciones sobre el procedimiento administrativo común · Capítulo IV. Instrucción del procedimiento · Sección 2.ª Prueba","enunciado":"Según el artículo 77.3 de la Ley 39/2015, el instructor del procedimiento sólo podrá rechazar las pruebas propuestas por los interesados:","opciones":{"a":"Cuando las considere improcedentes, sin necesidad de motivar su decisión.","b":"Cuando su práctica implique gastos para la Administración, mediante resolución motivada.","c":"Cuando así lo solicite cualquier otro interesado en el procedimiento.","d":"Cuando sean manifiestamente improcedentes o innecesarias, mediante resolución motivada."},"correcta":"d","explicacion":"El artículo 77.3 permite rechazar las pruebas propuestas solo «cuando sean manifiestamente improcedentes o innecesarias, mediante resolución motivada». La opción a) suprime el carácter manifiesto y la motivación; la b) no es causa de rechazo, pues el artículo 78.3 permite exigir el anticipo de los gastos; y la c) introduce un supuesto inexistente.","cita":"«El instructor del procedimiento sólo podrá rechazar las pruebas propuestas por los interesados cuando sean manifiestamente improcedentes o innecesarias, mediante resolución motivada.»","dificultad":2},{"id":"L39-L5-021","ley":"L39","articulo":"77.5","articulo_txt":"Art. 77.5 Ley 39/2015","bloque_id":"L39|Título IV. De las disposiciones sobre el procedimiento administrativo común · Capítulo IV. Instrucción del procedimiento · Sección 2.ª Prueba","enunciado":"Según el artículo 77.5 de la Ley 39/2015, los documentos formalizados por los funcionarios a los que se reconoce la condición de autoridad, en los que, observándose los requisitos legales correspondientes, se recojan los hechos constatados por aquéllos:","opciones":{"a":"Harán prueba plena de éstos, sin que se admita prueba en contrario.","b":"Carecerán de valor probatorio si el interesado niega los hechos.","c":"Solo harán prueba de éstos si el funcionario los ratifica durante el período de prueba.","d":"Harán prueba de éstos salvo que se acredite lo contrario."},"correcta":"d","explicacion":"El artículo 77.5 dispone que tales documentos «harán prueba de éstos salvo que se acredite lo contrario», es decir, admiten prueba en contrario. La opción a) niega esa posibilidad, la b) les priva de valor por la mera negación del interesado y la c) exige una ratificación que el precepto no contempla.","cita":"«Los documentos formalizados por los funcionarios a los que se reconoce la condición de autoridad y en los que, observándose los requisitos legales correspondientes se recojan los hechos constatados por aquéllos harán prueba de éstos salvo que se acredite lo contrario.»","dificultad":2},{"id":"L39-L5-027","ley":"L39","articulo":"80.3","articulo_txt":"Art. 80.3 Ley 39/2015","bloque_id":"L39|Título IV. De las disposiciones sobre el procedimiento administrativo común · Capítulo IV. Instrucción del procedimiento · Sección 3.ª Informes","enunciado":"Según el artículo 80.3 de la Ley 39/2015, si un informe preceptivo no se emite en el plazo señalado, y sin perjuicio de la responsabilidad en que incurra el responsable de la demora:","opciones":{"a":"Se entenderá que el informe ha sido emitido en sentido favorable.","b":"Se entenderá que el informe ha sido emitido en sentido desfavorable.","c":"Se podrá suspender el transcurso del plazo máximo legal para resolver el procedimiento en los términos establecidos en el artículo 22.1.d).","d":"Se producirá la caducidad del procedimiento."},"correcta":"c","explicacion":"El artículo 80.3 permite, en general, proseguir las actuaciones si el informe no se emite en plazo, salvo cuando sea preceptivo, «en cuyo caso se podrá suspender el transcurso del plazo máximo legal para resolver el procedimiento» en los términos del art. 22.1.d). La ley no atribuye a la falta de informe sentido favorable (opción a) ni desfavorable (opción b), ni provoca la caducidad (opción d).","cita":"«De no emitirse el informe en el plazo señalado, y sin perjuicio de la responsabilidad en que incurra el responsable de la demora, se podrán proseguir las actuaciones salvo cuando se trate de un informe preceptivo, en cuyo caso se podrá suspender el transcurso del plazo máximo legal para resolver el procedimiento en los términos establecidos en la letra d) del apartado 1 del artículo 22.»","dificultad":2},{"id":"L39-L5-030","ley":"L39","articulo":"81.3","articulo_txt":"Art. 81.3 Ley 39/2015","bloque_id":"L39|Título IV. De las disposiciones sobre el procedimiento administrativo común · Capítulo IV. Instrucción del procedimiento · Sección 3.ª Informes","enunciado":"Según el artículo 81.3 de la Ley 39/2015, en el caso de reclamaciones en materia de responsabilidad patrimonial del Estado por el funcionamiento anormal de la Administración de Justicia, será preceptivo el informe:","opciones":{"a":"Del Consejo General del Poder Judicial.","b":"Del Ministerio de Justicia.","c":"De la Sala de Gobierno del Tribunal Supremo.","d":"De la Abogacía General del Estado."},"correcta":"a","explicacion":"El artículo 81.3 exige en estos casos «el informe del Consejo General del Poder Judicial», que se evacuará en el plazo máximo de dos meses y durante cuya tramitación queda suspendido el plazo para resolver. Los órganos de las opciones b), c) y d) no son los previstos en el precepto.","cita":"«En el caso de reclamaciones en materia de responsabilidad patrimonial del Estado por el funcionamiento anormal de la Administración de Justicia, será preceptivo el informe del Consejo General del Poder Judicial que será evacuado en el plazo máximo de dos meses.»","dificultad":2},{"id":"L39-L5-035","ley":"L39","articulo":"83.1","articulo_txt":"Art. 83.1 Ley 39/2015","bloque_id":"L39|Título IV. De las disposiciones sobre el procedimiento administrativo común · Capítulo IV. Instrucción del procedimiento · Sección 4.ª Participación de los interesados","enunciado":"Según el artículo 83.1 de la Ley 39/2015, cuando la naturaleza del procedimiento lo requiera, podrá acordar un período de información pública:","opciones":{"a":"El órgano instructor del procedimiento.","b":"El superior jerárquico del órgano competente para resolver.","c":"El órgano al que corresponda la resolución del procedimiento.","d":"El titular del departamento ministerial correspondiente, en todo caso."},"correcta":"c","explicacion":"El artículo 83.1 atribuye esa facultad al órgano «al que corresponda la resolución del procedimiento». No la tiene el instructor (opción a), ni el superior jerárquico (opción b), ni, en todo caso, el titular del departamento (opción d).","cita":"«El órgano al que corresponda la resolución del procedimiento, cuando la naturaleza de éste lo requiera, podrá acordar un período de información pública.»","dificultad":2},{"id":"L39-L5-037","ley":"L39","articulo":"83.3","articulo_txt":"Art. 83.3 Ley 39/2015","bloque_id":"L39|Título IV. De las disposiciones sobre el procedimiento administrativo común · Capítulo IV. Instrucción del procedimiento · Sección 4.ª Participación de los interesados","enunciado":"Según el artículo 83.3 de la Ley 39/2015, la comparecencia en el trámite de información pública:","opciones":{"a":"No otorga, por sí misma, la condición de interesado.","b":"Otorga, por sí misma, la condición de interesado.","c":"Otorga la condición de interesado siempre que se presenten alegaciones u observaciones.","d":"Es requisito necesario para poder interponer los recursos procedentes contra la resolución definitiva del procedimiento."},"correcta":"a","explicacion":"El artículo 83.3 establece que la comparecencia en el trámite de información pública «no otorga, por sí misma, la condición de interesado», lo que descarta las opciones b) y c). La opción d) contradice el mismo apartado, según el cual la incomparecencia no impide a los interesados interponer los recursos procedentes.","cita":"«La incomparecencia en este trámite no impedirá a los interesados interponer los recursos procedentes contra la resolución definitiva del procedimiento. (…) La comparecencia en el trámite de información pública no otorga, por sí misma, la condición de interesado.»","dificultad":2},{"id":"L39-L5-042","ley":"L39","articulo":"85.3","articulo_txt":"Art. 85.3 Ley 39/2015","bloque_id":"L39|Título IV. De las disposiciones sobre el procedimiento administrativo común · Capítulo V. Finalización del procedimiento · Sección 1.ª Disposiciones generales","enunciado":"Según el artículo 85.3 de la Ley 39/2015, en los supuestos previstos en los apartados 1 y 2 de ese artículo, cuando la sanción tenga únicamente carácter pecuniario, el órgano competente para resolver aplicará sobre el importe de la sanción propuesta reducciones de, al menos:","opciones":{"a":"El 10 %.","b":"El 20 %.","c":"El 25 %.","d":"El 30 %."},"correcta":"b","explicacion":"El artículo 85.3 obliga a aplicar «reducciones de, al menos, el 20 % sobre el importe de la sanción propuesta», acumulables entre sí; ese porcentaje podrá ser incrementado reglamentariamente. Los porcentajes de las opciones a), c) y d) no son el mínimo legal.","cita":"«En ambos casos, cuando la sanción tenga únicamente carácter pecuniario, el órgano competente para resolver el procedimiento aplicará reducciones de, al menos, el 20 % sobre el importe de la sanción propuesta, siendo éstos acumulables entre sí.»","dificultad":2},{"id":"L39-L5-044","ley":"L39","articulo":"86.2","articulo_txt":"Art. 86.2 Ley 39/2015","bloque_id":"L39|Título IV. De las disposiciones sobre el procedimiento administrativo común · Capítulo V. Finalización del procedimiento · Sección 1.ª Disposiciones generales","enunciado":"Según el artículo 86.2 de la Ley 39/2015, ¿cuál de los siguientes extremos NO forma parte del contenido mínimo que deben establecer los instrumentos de terminación convencional?","opciones":{"a":"Las garantías que deban prestar las partes para asegurar su cumplimiento.","b":"La identificación de las partes intervinientes.","c":"El ámbito personal, funcional y territorial.","d":"El plazo de vigencia."},"correcta":"a","explicacion":"El artículo 86.2 fija como contenido mínimo «la identificación de las partes intervinientes, el ámbito personal, funcional y territorial, y el plazo de vigencia». Las opciones b), c) y d) forman parte de ese contenido; las garantías no se mencionan.","cita":"«Los citados instrumentos deberán establecer como contenido mínimo la identificación de las partes intervinientes, el ámbito personal, funcional y territorial, y el plazo de vigencia, debiendo publicarse o no según su naturaleza y las personas a las que estuvieran destinados.»","dificultad":2},{"id":"L39-L6-001","ley":"L39","articulo":"88.1","articulo_txt":"Art. 88.1 Ley 39/2015","bloque_id":"L39|Título IV. De las disposiciones sobre el procedimiento administrativo común · Capítulo V. Finalización del procedimiento · Sección 2.ª Resolución","enunciado":"Según el artículo 88.1 de la Ley 39/2015, cuando se trate de cuestiones conexas que no hubieran sido planteadas por los interesados, el órgano competente podrá pronunciarse sobre ellas poniéndolo antes de manifiesto a aquéllos por un plazo no superior a:","opciones":{"a":"Diez días.","b":"Quince días.","c":"Cinco días.","d":"Veinte días."},"correcta":"b","explicacion":"El segundo párrafo del artículo 88.1 permite al órgano competente pronunciarse sobre las cuestiones conexas no planteadas «poniéndolo antes de manifiesto a aquéllos por un plazo no superior a quince días». Los plazos de diez (opción a), cinco (opción c) y veinte días (opción d) no figuran en el precepto.","cita":"«Cuando se trate de cuestiones conexas que no hubieran sido planteadas por los interesados, el órgano competente podrá pronunciarse sobre las mismas, poniéndolo antes de manifiesto a aquéllos por un plazo no superior a quince días, para que formulen las alegaciones que estimen pertinentes y aporten, en su caso, los medios de prueba.»","dificultad":2},{"id":"L39-L6-004","ley":"L39","articulo":"88.5","articulo_txt":"Art. 88.5 Ley 39/2015","bloque_id":"L39|Título IV. De las disposiciones sobre el procedimiento administrativo común · Capítulo V. Finalización del procedimiento · Sección 2.ª Resolución","enunciado":"Según el artículo 88.5 de la Ley 39/2015, podrá acordarse la inadmisión de:","opciones":{"a":"Las solicitudes en las que los preceptos legales aplicables al caso sean oscuros o insuficientes.","b":"Las peticiones formuladas en ejercicio del derecho de petición previsto en el artículo 29 de la Constitución.","c":"Las solicitudes de reconocimiento de derechos no previstos en el ordenamiento jurídico o manifiestamente carentes de fundamento.","d":"Las solicitudes que no reúnan los requisitos exigidos, sin necesidad de requerir su subsanación."},"correcta":"c","explicacion":"El artículo 88.5 permite acordar «la inadmisión de las solicitudes de reconocimiento de derechos no previstos en el ordenamiento jurídico o manifiestamente carentes de fundamento». La opción a) es contraria al precepto, que prohíbe abstenerse de resolver «so pretexto de silencio, oscuridad o insuficiencia de los preceptos legales aplicables al caso»; la opción b) también, porque la inadmisión se entiende «sin perjuicio del derecho de petición previsto por el artículo 29 de la Constitución»; y la opción d) no figura en el artículo.","cita":"«5. En ningún caso podrá la Administración abstenerse de resolver so pretexto de silencio, oscuridad o insuficiencia de los preceptos legales aplicables al caso, aunque podrá acordarse la inadmisión de las solicitudes de reconocimiento de derechos no previstos en el ordenamiento jurídico o manifiestamente carentes de fundamento, sin perjuicio del derecho de petición previsto por el artículo 29 de la Constitución.»","dificultad":2},{"id":"L39-L6-016","ley":"L39","articulo":"93","articulo_txt":"Art. 93 Ley 39/2015","bloque_id":"L39|Título IV. De las disposiciones sobre el procedimiento administrativo común · Capítulo V. Finalización del procedimiento · Sección 3.ª Desistimiento y renuncia","enunciado":"Según el artículo 93 de la Ley 39/2015, el desistimiento por la Administración:","opciones":{"a":"Es posible en cualquier procedimiento, cuando lo estime conveniente para el interés público, sin necesidad de motivación.","b":"Sólo cabe en los procedimientos iniciados a solicitud del interesado, con la conformidad de éste.","c":"Cabe en los procedimientos iniciados de oficio, motivadamente, en los supuestos y con los requisitos previstos en las Leyes.","d":"Cabe en los procedimientos iniciados de oficio, siempre que no se hayan personado terceros interesados."},"correcta":"c","explicacion":"El artículo 93 dispone que «En los procedimientos iniciados de oficio, la Administración podrá desistir, motivadamente, en los supuestos y con los requisitos previstos en las Leyes». Por eso son falsas la opción a) (exige motivación y cobertura legal), la opción b) (se refiere a procedimientos iniciados de oficio) y la opción d) (el precepto no menciona a terceros interesados).","cita":"«En los procedimientos iniciados de oficio, la Administración podrá desistir, motivadamente, en los supuestos y con los requisitos previstos en las Leyes.»","dificultad":1},{"id":"L39-L6-020","ley":"L39","articulo":"94.5","articulo_txt":"Art. 94.5 Ley 39/2015","bloque_id":"L39|Título IV. De las disposiciones sobre el procedimiento administrativo común · Capítulo V. Finalización del procedimiento · Sección 3.ª Desistimiento y renuncia","enunciado":"Según el artículo 94.5 de la Ley 39/2015, si la cuestión suscitada por la incoación del procedimiento entrañase interés general o fuera conveniente sustanciarla para su definición y esclarecimiento, la Administración:","opciones":{"a":"Deberá rechazar el desistimiento o la renuncia, que no producirán efecto alguno.","b":"Declarará la caducidad del procedimiento e incoará de oficio uno nuevo.","c":"Podrá limitar los efectos del desistimiento o la renuncia al interesado y seguirá el procedimiento.","d":"Deberá someter la cuestión a información pública antes de aceptar el desistimiento o la renuncia."},"correcta":"c","explicacion":"El artículo 94.5 establece que, en ese caso, «la Administración podrá limitar los efectos del desistimiento o la renuncia al interesado y seguirá el procedimiento». No se rechaza el desistimiento o la renuncia (opción a), no se declara la caducidad (opción b) y el precepto no prevé un trámite de información pública (opción d).","cita":"«5. Si la cuestión suscitada por la incoación del procedimiento entrañase interés general o fuera conveniente sustanciarla para su definición y esclarecimiento, la Administración podrá limitar los efectos del desistimiento o la renuncia al interesado y seguirá el procedimiento.»","dificultad":2},{"id":"L39-L6-023","ley":"L39","articulo":"95.3","articulo_txt":"Art. 95.3 Ley 39/2015","bloque_id":"L39|Título IV. De las disposiciones sobre el procedimiento administrativo común · Capítulo V. Finalización del procedimiento · Sección 4.ª Caducidad","enunciado":"Según el artículo 95.3 de la Ley 39/2015, en relación con la prescripción, la caducidad del procedimiento:","opciones":{"a":"Interrumpirá el plazo de prescripción de las acciones del particular, pero no el de las acciones de la Administración.","b":"No producirá por sí sola la prescripción de las acciones del particular o de la Administración, pero los procedimientos caducados no interrumpirán el plazo de prescripción.","c":"No producirá por sí sola la prescripción de las acciones del particular o de la Administración, y los procedimientos caducados interrumpirán el plazo de prescripción.","d":"Suspenderá el plazo de prescripción hasta que se notifique la resolución que la declare."},"correcta":"b","explicacion":"El artículo 95.3 dispone que «La caducidad no producirá por sí sola la prescripción de las acciones del particular o de la Administración, pero los procedimientos caducados no interrumpirán el plazo de prescripción». La opción c) contradice la segunda parte del precepto, y las opciones a) y d) atribuyen a la caducidad efectos interruptivos o suspensivos que la ley excluye o no prevé.","cita":"«3. La caducidad no producirá por sí sola la prescripción de las acciones del particular o de la Administración, pero los procedimientos caducados no interrumpirán el plazo de prescripción.»","dificultad":2},{"id":"L39-L6-024","ley":"L39","articulo":"95.3","articulo_txt":"Art. 95.3 Ley 39/2015","bloque_id":"L39|Título IV. De las disposiciones sobre el procedimiento administrativo común · Capítulo V. Finalización del procedimiento · Sección 4.ª Caducidad","enunciado":"Según el artículo 95.3 de la Ley 39/2015, cuando tras la caducidad de un procedimiento se inicie uno nuevo, ¿qué trámites deberán cumplimentarse en todo caso en este último?","opciones":{"a":"Únicamente el trámite de audiencia al interesado.","b":"Los de información pública y audiencia al interesado.","c":"Todos los actos y trámites del procedimiento caducado, sin que pueda incorporarse ninguno de ellos.","d":"Los de alegaciones, proposición de prueba y audiencia al interesado."},"correcta":"d","explicacion":"El segundo párrafo del artículo 95.3 permite incorporar al nuevo procedimiento «los actos y trámites cuyo contenido se hubiera mantenido igual de no haberse producido la caducidad», pero exige que, en todo caso, se cumplimenten «los trámites de alegaciones, proposición de prueba y audiencia al interesado». Las opciones a) y b) no recogen esos tres trámites, y la opción c) contradice la posibilidad de incorporación.","cita":"«En los casos en los que sea posible la iniciación de un nuevo procedimiento por no haberse producido la prescripción, podrán incorporarse a éste los actos y trámites cuyo contenido se hubiera mantenido igual de no haberse producido la caducidad. En todo caso, en el nuevo procedimiento deberán cumplimentarse los trámites de alegaciones, proposición de prueba y audiencia al interesado.»","dificultad":2},{"id":"L39-L6-030","ley":"L39","articulo":"96.6.d","articulo_txt":"Art. 96.6.d Ley 39/2015","bloque_id":"L39|Título IV. De las disposiciones sobre el procedimiento administrativo común · Capítulo VI. De la tramitación simplificada del procedimiento administrativo común","enunciado":"Según el artículo 96.6.d) de la Ley 39/2015, en los procedimientos tramitados de manera simplificada, el trámite de audiencia se practicará:","opciones":{"a":"Únicamente cuando la resolución vaya a ser desfavorable para el interesado.","b":"En todo caso, antes de dictar la resolución.","c":"Únicamente cuando lo solicite el interesado en sus alegaciones iniciales.","d":"Únicamente cuando sea preceptivo el Dictamen del Consejo de Estado u órgano consultivo equivalente."},"correcta":"a","explicacion":"El art. 96.6.d) incluye entre los trámites del procedimiento simplificado el «Trámite de audiencia, únicamente cuando la resolución vaya a ser desfavorable para el interesado». No se practica en todo caso (opción b), ni depende de la petición del interesado (opción c) o del carácter preceptivo del Dictamen (opción d).","cita":"«d) Trámite de audiencia, únicamente cuando la resolución vaya a ser desfavorable para el interesado.»","dificultad":1},{"id":"L39-L6-029","ley":"L39","articulo":"96.6","articulo_txt":"Art. 96.6 Ley 39/2015","bloque_id":"L39|Título IV. De las disposiciones sobre el procedimiento administrativo común · Capítulo VI. De la tramitación simplificada del procedimiento administrativo común","enunciado":"Según el artículo 96.6 de la Ley 39/2015, salvo que reste menos para su tramitación ordinaria, los procedimientos administrativos tramitados de manera simplificada deberán ser resueltos en:","opciones":{"a":"Treinta días, a contar desde la fecha del acuerdo de iniciación del procedimiento.","b":"Treinta días, a contar desde el siguiente al que se notifique al interesado el acuerdo de tramitación simplificada del procedimiento.","c":"Veinte días, a contar desde el siguiente al que se notifique al interesado el acuerdo de tramitación simplificada del procedimiento.","d":"Un mes, a contar desde la presentación de la solicitud del interesado."},"correcta":"b","explicacion":"El artículo 96.6 dispone que estos procedimientos «deberán ser resueltos en treinta días, a contar desde el siguiente al que se notifique al interesado el acuerdo de tramitación simplificada del procedimiento». La opción a) yerra en el día inicial del cómputo, la opción c) en la duración del plazo y la opción d) en ambos extremos.","cita":"«6. Salvo que reste menos para su tramitación ordinaria, los procedimientos administrativos tramitados de manera simplificada deberán ser resueltos en treinta días, a contar desde el siguiente al que se notifique al interesado el acuerdo de tramitación simplificada del procedimiento, y constarán únicamente de los siguientes trámites: (…)»","dificultad":2},{"id":"L39-L6-037","ley":"L39","articulo":"99","articulo_txt":"Art. 99 Ley 39/2015","bloque_id":"L39|Título IV. De las disposiciones sobre el procedimiento administrativo común · Capítulo VII. Ejecución","enunciado":"Según el artículo 99 de la Ley 39/2015, ¿en cuál de los siguientes supuestos NO podrán las Administraciones Públicas proceder a la ejecución forzosa de los actos administrativos?","opciones":{"a":"Cuando el acto se haya dictado en un procedimiento iniciado a solicitud del interesado.","b":"Cuando el obligado manifieste su oposición a la ejecución.","c":"Cuando la Constitución o la Ley exijan la intervención de un órgano judicial.","d":"Cuando el acto no haya ganado firmeza en vía jurisdiccional."},"correcta":"c","explicacion":"El artículo 99 exceptúa de la ejecución forzosa por la Administración «los supuestos en que se suspenda la ejecución de acuerdo con la Ley» y aquellos en que «la Constitución o la Ley exijan la intervención de un órgano judicial». El origen del procedimiento a solicitud del interesado (opción a), la oposición del obligado (opción b) o la falta de firmeza jurisdiccional (opción d) no figuran como excepciones.","cita":"«Las Administraciones Públicas, a través de sus órganos competentes en cada caso, podrán proceder, previo apercibimiento, a la ejecución forzosa de los actos administrativos, salvo en los supuestos en que se suspenda la ejecución de acuerdo con la Ley, o cuando la Constitución o la Ley exijan la intervención de un órgano judicial.»","dificultad":2},{"id":"L39-L6-047","ley":"L39","articulo":"104.2","articulo_txt":"Art. 104.2 Ley 39/2015","bloque_id":"L39|Título IV. De las disposiciones sobre el procedimiento administrativo común · Capítulo VII. Ejecución","enunciado":"Según el artículo 104.2 de la Ley 39/2015, si, tratándose de obligaciones personalísimas de hacer, no se realizase la prestación:","opciones":{"a":"El obligado deberá resarcir los daños y perjuicios, a cuya liquidación y cobro se procederá en vía administrativa.","b":"La Administración realizará la prestación por sí o a través de las personas que determine, a costa del obligado.","c":"El obligado deberá resarcir los daños y perjuicios, cuya reclamación deberá ejercitarse ante la jurisdicción civil.","d":"La Administración archivará las actuaciones sin más efectos."},"correcta":"a","explicacion":"El artículo 104.2 dispone que «el obligado deberá resarcir los daños y perjuicios, a cuya liquidación y cobro se procederá en vía administrativa». La opción b) describe la ejecución subsidiaria del artículo 102.2, que exige actos no personalísimos; la opción c) yerra en la vía de cobro y la opción d) no tiene apoyo en el precepto.","cita":"«2. Si, tratándose de obligaciones personalísimas de hacer, no se realizase la prestación, el obligado deberá resarcir los daños y perjuicios, a cuya liquidación y cobro se procederá en vía administrativa.»","dificultad":2}]};</script>
<script>
/* Letra de Ley — motor de test. Sin dependencias; funciona sin conexión.
   Necesita window.LDL_CONFIG y window.LDL_BANCO (los inyecta sistema/letradeley.py). */
(function () {
  "use strict";
  var CFG = window.LDL_CONFIG, B = window.LDL_BANCO;
  var raiz = document.getElementById("ldl");
  var LETRAS = ["a", "b", "c", "d"];
  var POR_ID = {};
  B.preguntas.forEach(function (p) { POR_ID[p.id] = p; });
  var CLAVE = "ldl1:" + CFG.pack.id;
  var prog = cargar();
  var sesion = null;
  var vista = CFG.modo === "web" ? "portada" : "inicio";
  var reloj = null;

  /* ---------- utilidades ---------- */
  function esc(t) {
    return String(t == null ? "" : t).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function barajar(lista) {
    var a = lista.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function pct(a, b) { return b ? Math.round((a / b) * 100) : 0; }
  function plural(n, uno, varios) { return n + " " + (n === 1 ? uno : varios); }
  function num(n) { return String(n).replace(".", ","); }
  function cargar() {
    try { var s = localStorage.getItem(CLAVE); if (s) { var d = JSON.parse(s); if (d && d.p) return d; } } catch (e) {}
    return { p: {}, h: [] };
  }
  function guardar() { try { localStorage.setItem(CLAVE, JSON.stringify(prog)); } catch (e) {} }
  function registrar(id, acierto) {
    var r = prog.p[id] || { v: 0, a: 0, f: 0, c: 0 };
    r.v++;
    if (acierto) { r.a++; r.c = Math.min((r.c || 0) + 1, 5); } else { r.f++; r.c = 0; }
    r.u = acierto ? 1 : 0;
    r.t = Date.now();
    prog.p[id] = r;
    guardar();
  }
  function fallosPendientes() {
    return B.preguntas.filter(function (p) { var r = prog.p[p.id]; return r && r.u === 0; });
  }
  function resumen(lista) {
    var vistas = 0, aciertos = 0, intentos = 0;
    lista.forEach(function (p) {
      var r = prog.p[p.id];
      if (r) { vistas++; aciertos += r.a; intentos += r.v; }
    });
    return { total: lista.length, vistas: vistas, acierto: pct(aciertos, intentos) };
  }
  function delBloque(id) { return B.preguntas.filter(function (p) { return p.bloque_id === id; }); }

  /* ---------- tema claro / oscuro ---------- */
  function aplicarTema() {
    var t = null;
    try { t = localStorage.getItem("ldl:tema"); } catch (e) {}
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    else document.documentElement.removeAttribute("data-theme");
    return t || "auto";
  }
  function cambiarTema() {
    var orden = { auto: "light", light: "dark", dark: "auto" };
    var actual = aplicarTema();
    try { localStorage.setItem("ldl:tema", orden[actual]); } catch (e) {}
    aplicarTema();
    pintar();
  }

  /* ---------- sesiones ---------- */
  function empezar(tipo, preguntas, opciones) {
    opciones = opciones || {};
    if (!preguntas.length) return;
    pararReloj();
    sesion = {
      tipo: tipo, titulo: opciones.titulo || "Test", ids: preguntas.map(function (p) { return p.id; }),
      i: 0, resp: {}, corregida: {}, inicio: Date.now(), limite: opciones.minutos ? opciones.minutos * 60 : 0, fin: null,
      origen: vista === "test" || vista === "resultado" ? (sesion && sesion.origen) || "inicio" : vista
    };
    vista = "test";
    if (sesion.limite) reloj = setInterval(tic, 1000);
    pintar();
    window.scrollTo(0, 0);
  }
  function tic() {
    if (!sesion || sesion.fin) return pararReloj();
    var el = document.getElementById("ldl-crono");
    var resta = sesion.limite - Math.floor((Date.now() - sesion.inicio) / 1000);
    if (resta <= 0) { terminar(); return; }
    if (el) el.textContent = mmss(resta);
  }
  function pararReloj() { if (reloj) { clearInterval(reloj); reloj = null; } }
  function mmss(s) { var m = Math.floor(s / 60), r = s % 60; return m + ":" + (r < 10 ? "0" : "") + r; }

  function responder(letra) {
    var id = sesion.ids[sesion.i];
    if (sesion.tipo === "simulacro") {
      sesion.resp[id] = sesion.resp[id] === letra ? undefined : letra;
      pintar();
      return;
    }
    if (sesion.corregida[id]) return;
    sesion.resp[id] = letra;
    sesion.corregida[id] = true;
    registrar(id, letra === POR_ID[id].correcta);
    pintar();
  }
  function siguiente() {
    if (sesion.i < sesion.ids.length - 1) { sesion.i++; pintar(); window.scrollTo(0, 0); }
    else terminar();
  }
  function anterior() { if (sesion.i > 0) { sesion.i--; pintar(); } }
  function terminar() {
    pararReloj();
    if (sesion.tipo === "simulacro") {
      sesion.ids.forEach(function (id) {
        if (sesion.resp[id]) registrar(id, sesion.resp[id] === POR_ID[id].correcta);
      });
    }
    sesion.fin = Date.now();
    var r = calcular(sesion);
    prog.h.unshift({ t: sesion.fin, tipo: sesion.tipo, n: r.total, a: r.aciertos, e: r.errores, nota: r.nota });
    prog.h = prog.h.slice(0, 50);
    guardar();
    vista = "resultado";
    pintar();
    window.scrollTo(0, 0);
  }
  function calcular(s) {
    var a = 0, e = 0, nr = 0;
    s.ids.forEach(function (id) {
      var r = s.resp[id];
      if (!r) nr++; else if (r === POR_ID[id].correcta) a++; else e++;
    });
    var pen = (CFG.simulacro && CFG.simulacro.penalizacion) || 1 / 3;
    var neta = s.tipo === "simulacro" ? a - e * pen : a;
    var nota = Math.max(0, (neta / s.ids.length) * 10);
    return { total: s.ids.length, aciertos: a, errores: e, blancos: nr, neta: neta, nota: Math.round(nota * 100) / 100 };
  }

  /* ---------- vistas ---------- */
  function cabecera() {
    var tema = aplicarTema();
    var etiquetas = { auto: "Tema: auto", light: "Tema: claro", dark: "Tema: oscuro" };
    return '<header class="ldl-top"><a class="ldl-brand" href="' + esc(CFG.web || "#") + '">' +
      '<span class="ldl-logo" aria-hidden="true">§</span><span><b>Letra de Ley</b><small>' +
      esc(CFG.pack.nombre) + "</small></span></a>" +
      '<button class="ldl-tema" data-acc="tema" type="button">' + etiquetas[tema] + "</button></header>";
  }
  function navegacion() {
    if (CFG.modo === "web") return "";
    var items = [["inicio", "Inicio"], ["temas", "Por temas"], ["simulacro", "Simulacro"], ["fallos", "Fallos"], ["stats", "Estadísticas"]];
    return '<nav class="ldl-nav" aria-label="Secciones">' + items.map(function (it) {
      var actual = vista === it[0] || (vista === "test" && sesion && sesion.origen === it[0]);
      return '<button type="button" data-acc="ir" data-v="' + it[0] + '"' + (actual ? ' aria-current="page"' : "") + ">" + it[1] + "</button>";
    }).join("") + "</nav>";
  }
  function pie() {
    return '<p class="ldl-pie">Letra de Ley · ' + esc(CFG.pack.edicion) + " · Texto legal actualizado a " +
      esc(CFG.pack.actualizado) + "<br>Uso personal. Prohibida su redistribución.</p>";
  }

  function vInicio() {
    var r = resumen(B.preguntas), f = fallosPendientes().length;
    return '<section class="ldl-card"><h2>' + esc(CFG.pack.nombre) + "</h2>" +
      '<p class="ldl-muted">' + B.preguntas.length + " preguntas comentadas, con el artículo exacto de cada respuesta.</p>" +
      '<div class="ldl-kpis"><div class="ldl-kpi"><b>' + r.vistas + "/" + r.total + "</b><span>respondidas</span></div>" +
      '<div class="ldl-kpi"><b>' + r.acierto + ' %</b><span>de acierto</span></div>' +
      '<div class="ldl-kpi"><b>' + f + "</b><span>fallos por repasar</span></div></div>" +
      '<div class="ldl-acciones"><button class="ldl-btn" data-acc="rapido" type="button">Test rápido de 20</button>' +
      '<button class="ldl-btn sec" data-acc="ir" data-v="simulacro" type="button">Simulacro de examen</button>' +
      (f ? '<button class="ldl-btn sec" data-acc="repasar" type="button">Repasar ' + f + " fallos</button>" : "") +
      "</div></section>" +
      '<section class="ldl-card"><h3>Cómo sacarle partido</h3><ol class="ldl-muted">' +
      "<li>Practica <b>por temas</b>: cada respuesta te enseña el artículo y por qué fallan las demás opciones.</li>" +
      "<li>Cada pocos días, <b>repasa tus fallos</b>: es donde más se aprende.</li>" +
      "<li>Antes del examen, haz <b>simulacros</b> con tiempo y con la penalización real (cada error resta 1/3).</li></ol>" +
      '<p class="ldl-small ldl-muted">Tu progreso se guarda en este dispositivo y en este navegador.</p></section>' + historial();
  }
  function historial() {
    if (!prog.h.length) return "";
    return '<section class="ldl-card"><h3>Últimos tests</h3><ul class="ldl-revision">' + prog.h.slice(0, 5).map(function (h) {
      var d = new Date(h.t);
      return "<li><b>" + (h.tipo === "simulacro" ? "Simulacro" : "Práctica") + "</b> · " + d.toLocaleDateString("es-ES") +
        " · " + h.a + "/" + h.n + " aciertos" + (h.tipo === "simulacro" ? " · nota " + num(h.nota) : "") + "</li>";
    }).join("") + "</ul></section>";
  }
  function vTemas() {
    var html = '<section class="ldl-card"><h2>Practicar por temas</h2><p class="ldl-muted">Elige un bloque. Las preguntas salen en orden aleatorio y se corrigen al momento.</p><ul class="ldl-bloques">';
    B.bloques.forEach(function (b) {
      var lista = delBloque(b.id), r = resumen(lista);
      html += '<li><button type="button" data-acc="bloque" data-id="' + esc(b.id) + '"><span class="t">' + esc(b.nombre) +
        '</span><span class="n">' + r.vistas + "/" + r.total + (r.vistas ? " · " + r.acierto + " %" : "") + "</span>" +
        '<span class="ldl-barra"><i style="width:' + pct(r.vistas, r.total) + '%"></i></span></button></li>';
    });
    return html + "</ul></section>";
  }
  function vSimulacro() {
    var total = B.preguntas.length;
    var opcionesN = [10, 20, 30, 50, 100].filter(function (n) { return n < total; });
    opcionesN.push(total);
    var porDefecto = Math.min((CFG.simulacro && CFG.simulacro.preguntas) || 30, total);
    return '<section class="ldl-card"><h2>Simulacro de examen</h2>' +
      '<p class="ldl-muted">Como el día del examen: no ves las soluciones hasta el final y cada error resta un tercio de acierto.</p>' +
      '<div class="ldl-campo"><label for="ldl-n">Número de preguntas</label><select id="ldl-n">' +
      opcionesN.map(function (n) { return "<option" + (n === porDefecto ? " selected" : "") + ">" + n + "</option>"; }).join("") +
      '</select></div><div class="ldl-campo"><label for="ldl-t">Tiempo</label><select id="ldl-t">' +
      '<option value="1">1 minuto por pregunta</option><option value="0">Sin límite de tiempo</option></select></div>' +
      '<div class="ldl-campo"><label for="ldl-b">Temas</label><select id="ldl-b"><option value="">Todos</option>' +
      B.bloques.map(function (b) { return '<option value="' + esc(b.id) + '">' + esc(b.nombre) + "</option>"; }).join("") +
      '</select></div><div class="ldl-acciones"><button class="ldl-btn" data-acc="simular" type="button">Empezar simulacro</button></div></section>';
  }
  function vFallos() {
    var f = fallosPendientes();
    if (!f.length) {
      return '<section class="ldl-card"><h2>Repaso de fallos</h2><p class="ldl-muted">No tienes fallos pendientes. Cuando falles una pregunta aparecerá aquí hasta que la aciertes.</p></section>';
    }
    return '<section class="ldl-card"><h2>Repaso de fallos</h2><p class="ldl-muted">Tienes <b>' + f.length +
      "</b> preguntas falladas. Salen de aquí en cuanto las aciertas.</p>" +
      '<div class="ldl-acciones"><button class="ldl-btn" data-acc="repasar" type="button">Repasar ahora</button></div></section>';
  }
  function vStats() {
    var html = '<section class="ldl-card"><h2>Estadísticas</h2><ul class="ldl-bloques">';
    B.bloques.forEach(function (b) {
      var r = resumen(delBloque(b.id));
      html += '<li><button type="button" data-acc="bloque" data-id="' + esc(b.id) + '"><span class="t">' + esc(b.nombre) +
        '</span><span class="n">' + (r.vistas ? r.acierto + " % de acierto" : "sin empezar") + '</span><span class="ldl-barra"><i style="width:' +
        r.acierto + '%"></i></span></button></li>';
    });
    html += '</ul></section><section class="ldl-card"><h3>Empezar de cero</h3><p class="ldl-muted ldl-small">Borra tu progreso guardado en este dispositivo.</p>' +
      '<div class="ldl-acciones"><button class="ldl-btn sec" data-acc="borrar" type="button">Borrar mi progreso</button></div></section>';
    return html;
  }
  function vPortada() {
    var n = B.preguntas.length;
    return '<section class="ldl-card"><h2>' + esc(CFG.pack.nombre) + "</h2>" +
      '<p class="ldl-muted">' + n + " preguntas tipo examen, corregidas al momento, con el artículo exacto y la explicación de cada opción. Gratis y sin registrarte.</p>" +
      '<div class="ldl-acciones"><button class="ldl-btn" data-acc="empezarweb" type="button">Empezar el test</button></div></section>';
  }

  function vTest() {
    var id = sesion.ids[sesion.i], p = POR_ID[id], sim = sesion.tipo === "simulacro";
    var elegida = sesion.resp[id], corregida = !sim && sesion.corregida[id];
    var html = '<section class="ldl-card"><div class="ldl-meta"><span>' + esc(sesion.titulo) + " · " + (sesion.i + 1) + " de " + sesion.ids.length +
      "</span><span>" + (sesion.limite ? '⏱ <span id="ldl-crono" class="ldl-crono">' +
        mmss(Math.max(0, sesion.limite - Math.floor((Date.now() - sesion.inicio) / 1000))) + "</span>" : esc(p.articulo_txt)) +
      '</span></div><div class="ldl-progreso"><i style="width:' + pct(sesion.i + (corregida ? 1 : 0), sesion.ids.length) + '%"></i></div>' +
      '<p class="ldl-enunciado">' + esc(p.enunciado) + '</p><div class="ldl-opciones" role="group" aria-label="Opciones">';
    LETRAS.forEach(function (l) {
      var cls = "ldl-op";
      if (corregida) { if (l === p.correcta) cls += " ok"; else if (l === elegida) cls += " ko"; }
      else if (sim && elegida === l) cls += " marcada";
      html += '<button type="button" class="' + cls + '" data-acc="resp" data-l="' + l + '"' + (corregida ? " disabled" : "") +
        (sim ? ' aria-pressed="' + (elegida === l) + '"' : "") + '><span class="l">' + l + ")</span><span>" + esc(p.opciones[l]) + "</span></button>";
    });
    html += "</div>";
    if (corregida) html += feedback(p, elegida);
    html += '<div class="ldl-acciones">';
    if (sim) {
      html += (sesion.i > 0 ? '<button class="ldl-btn sec" data-acc="ant" type="button">Anterior</button>' : "") +
        '<button class="ldl-btn" data-acc="sig" type="button">' + (sesion.i < sesion.ids.length - 1 ? "Siguiente" : "Entregar") + "</button>" +
        (sesion.i < sesion.ids.length - 1 ? '<button class="ldl-btn sec" data-acc="entregar" type="button">Entregar ya</button>' : "");
    } else if (corregida) {
      html += '<button class="ldl-btn" data-acc="sig" type="button">' + (sesion.i < sesion.ids.length - 1 ? "Siguiente" : "Ver resultado") + "</button>";
    }
    html += '<button class="ldl-btn sec" data-acc="salir" type="button">Salir</button></div></section>';
    return html;
  }
  function feedback(p, elegida) {
    var bien = elegida === p.correcta;
    return '<div class="ldl-feedback" aria-live="polite"><div class="v ' + (bien ? "ok" : "ko") + '">' +
      (bien ? "¡Correcta!" : "Incorrecta. La respuesta correcta es la " + p.correcta + ")") + "</div><div>" + esc(p.explicacion) + "</div>" +
      (p.cita ? '<blockquote class="ldl-cita">' + esc(p.cita) + "<small>" + esc(p.articulo_txt) + "</small></blockquote>" : "") + "</div>";
  }
  function vResultado() {
    var r = calcular(sesion), sim = sesion.tipo === "simulacro";
    var html = '<section class="ldl-card"><h2>' + (sim ? "Resultado del simulacro" : "Resultado") + "</h2>" +
      '<div class="ldl-nota">' + (sim ? num(r.nota.toFixed(2)) : r.aciertos + "/" + r.total) + "</div>" +
      '<p class="ldl-muted">' + plural(r.aciertos, "acierto", "aciertos") + " · " + plural(r.errores, "error", "errores") +
      (r.blancos ? " · " + r.blancos + " en blanco" : "") +
      (sim ? " · nota sobre 10 con penalización" : "") + "</p>";
    if (CFG.modo === "web") html += ctaWeb(r);
    html += '<div class="ldl-acciones">' + (CFG.modo === "web" ? '<button class="ldl-btn sec" data-acc="empezarweb" type="button">Repetir con otro orden</button>' :
      '<button class="ldl-btn" data-acc="ir" data-v="inicio" type="button">Volver al inicio</button>') + "</div></section>";
    html += '<section class="ldl-card"><h3>Revisión</h3><ul class="ldl-revision">';
    sesion.ids.forEach(function (id, n) {
      var p = POR_ID[id], e = sesion.resp[id], chip = !e ? '<span class="ldl-chip nr">En blanco</span>' :
        e === p.correcta ? '<span class="ldl-chip ok">Bien</span>' : '<span class="ldl-chip ko">Mal</span>';
      html += "<li>" + chip + '<span class="e">' + (n + 1) + ". " + esc(p.enunciado) + "</span><br>" +
        '<span class="ldl-small">Correcta: <b>' + p.correcta + ") " + esc(p.opciones[p.correcta]) + "</b>" +
        (e && e !== p.correcta ? " · Marcaste " + e + ")" : "") + '</span><br><span class="ldl-small ldl-muted">' + esc(p.explicacion) + "</span></li>";
    });
    return html + "</ul></section>";
  }
  function ctaWeb() {
    var c = CFG.compra || {}, html = "";
    if (c.url) {
      html += '<div class="ldl-card ldl-cta"><h3>' + esc(c.titulo) + '</h3><p class="ldl-muted">' + esc(c.texto) + "</p>" +
        '<div class="ldl-acciones"><a class="ldl-btn acc" href="' + esc(c.url) + '">' + esc(c.boton) + "</a></div></div>";
    }
    if (CFG.telegram) {
      html += '<p class="ldl-small">¿Quieres un test cada día? <a href="' + esc(CFG.telegram) + '">Únete gratis al canal de Telegram</a>.</p>';
    }
    return html;
  }

  function pintar() {
    var cuerpo;
    if (vista === "test") cuerpo = vTest();
    else if (vista === "resultado") cuerpo = vResultado();
    else if (vista === "portada") cuerpo = vPortada();
    else if (vista === "temas") cuerpo = vTemas();
    else if (vista === "simulacro") cuerpo = vSimulacro();
    else if (vista === "fallos") cuerpo = vFallos();
    else if (vista === "stats") cuerpo = vStats();
    else cuerpo = vInicio();
    raiz.innerHTML = '<div class="ldl">' + cabecera() + navegacion() + "<main>" + cuerpo + "</main>" + pie() + "</div>";
  }

  /* ---------- eventos ---------- */
  raiz.addEventListener("click", function (ev) {
    var el = ev.target.closest("[data-acc]");
    if (!el) return;
    var acc = el.getAttribute("data-acc");
    if (acc === "tema") return cambiarTema();
    if (acc === "ir") { pararReloj(); vista = el.getAttribute("data-v"); sesion = null; pintar(); return; }
    if (acc === "rapido") return empezar("practica", barajar(B.preguntas).slice(0, 20), { titulo: "Test rápido" });
    if (acc === "repasar") return empezar("practica", barajar(fallosPendientes()).slice(0, 30), { titulo: "Repaso de fallos" });
    if (acc === "bloque") {
      var b = B.bloques.filter(function (x) { return x.id === el.getAttribute("data-id"); })[0];
      return empezar("practica", barajar(delBloque(b.id)), { titulo: b.nombre });
    }
    if (acc === "simular") {
      var n = parseInt(document.getElementById("ldl-n").value, 10);
      var conTiempo = document.getElementById("ldl-t").value === "1";
      var bloque = document.getElementById("ldl-b").value;
      var fuente = bloque ? delBloque(bloque) : B.preguntas;
      var elegidas = barajar(fuente).slice(0, n);
      return empezar("simulacro", elegidas, { titulo: "Simulacro", minutos: conTiempo ? elegidas.length : 0 });
    }
    if (acc === "empezarweb") return empezar("practica", barajar(B.preguntas), { titulo: "Test gratuito" });
    if (acc === "resp") return responder(el.getAttribute("data-l"));
    if (acc === "sig") return siguiente();
    if (acc === "ant") return anterior();
    if (acc === "entregar") return terminar();
    if (acc === "salir") { pararReloj(); sesion = null; vista = CFG.modo === "web" ? "portada" : "inicio"; pintar(); return; }
    if (acc === "borrar") {
      if (el.getAttribute("data-confirmar") === "1") { prog = { p: {}, h: [] }; guardar(); pintar(); }
      else { el.setAttribute("data-confirmar", "1"); el.textContent = "Pulsa otra vez para confirmar"; }
    }
  });
  document.addEventListener("keydown", function (ev) {
    if (vista !== "test" || !sesion || ev.altKey || ev.ctrlKey || ev.metaKey) return;
    var k = ev.key.toLowerCase(), mapa = { "1": "a", "2": "b", "3": "c", "4": "d", a: "a", b: "b", c: "c", d: "d" };
    if (mapa[k]) { ev.preventDefault(); responder(mapa[k]); }
    else if (k === "enter" || k === "arrowright") {
      var id = sesion.ids[sesion.i];
      if (sesion.tipo === "simulacro" || sesion.corregida[id]) { ev.preventDefault(); siguiente(); }
    } else if (k === "arrowleft" && sesion.tipo === "simulacro") { ev.preventDefault(); anterior(); }
  });

  pintar();
})();
</script>
</body>
</html>
