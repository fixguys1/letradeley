<script>window.LDL_CONFIG={"modo":"web","web":"../","telegram":"https://t.me/letradeley","pack":{"id":"muestra-l39","nombre":"Test de la Ley 39/2015 de Procedimiento Administrativo Común","edicion":"Muestra gratuita","actualizado":"31/10/2026"},"compra":{"url":"","titulo":"¿Te ha servido? Hay 96 preguntas como estas en el pack","texto":"Pack Bloque Legal AGE 2027: app sin conexión con simulacros y repaso de fallos, PDF imprimible y Anki.","boton":"Consíguelo por 14,90 €"}};window.LDL_BANCO={"bloques":[{"id":"L39|Título Preliminar. Disposiciones generales","ley":"L39","nombre":"Título Preliminar. Disposiciones generales"},{"id":"L39|Título I. De los interesados en el procedimiento","ley":"L39","nombre":"Título I. De los interesados en el procedimiento"},{"id":"L39|Título II. De la actividad de las Administraciones Públicas · Capítulo I. Normas generales de actuación","ley":"L39","nombre":"Título II. De la actividad de las Administraciones Públicas · Capítulo I. Normas generales de actuación"},{"id":"L39|Título II. De la actividad de las Administraciones Públicas · Capítulo II. Términos y plazos","ley":"L39","nombre":"Título II. De la actividad de las Administraciones Públicas · Capítulo II. Términos y plazos"}],"preguntas":[{"id":"L39-L1-002","ley":"L39","articulo":"1.1","articulo_txt":"Art. 1.1 Ley 39/2015","bloque_id":"L39|Título Preliminar. Disposiciones generales","enunciado":"Según el artículo 1.1 de la Ley 39/2015, la Ley también tiene por objeto regular los principios a los que se ha de ajustar el ejercicio de:","opciones":{"a":"La potestad sancionadora y la potestad reglamentaria","b":"La iniciativa legislativa y la potestad sancionadora","c":"La potestad reglamentaria y la potestad expropiatoria","d":"La iniciativa legislativa y la potestad reglamentaria"},"correcta":"d","explicacion":"El artículo 1.1 termina refiriéndose a «los principios a los que se ha de ajustar el ejercicio de la iniciativa legislativa y la potestad reglamentaria». La a) el artículo 1.1 no se refiere a los principios de la potestad sancionadora, sino a los de la iniciativa legislativa. La b) junto a la iniciativa legislativa, el artículo 1.1 cita la potestad reglamentaria, no la sancionadora. La c) el artículo 1.1 no menciona la potestad expropiatoria; la otra potestad citada es la iniciativa legislativa.","cita":"«(…) así como los principios a los que se ha de ajustar el ejercicio de la iniciativa legislativa y la potestad reglamentaria.»","dificultad":1},{"id":"L39-L1-001","ley":"L39","articulo":"1.1","articulo_txt":"Art. 1.1 Ley 39/2015","bloque_id":"L39|Título Preliminar. Disposiciones generales","enunciado":"Según el artículo 1.1 de la Ley 39/2015, la Ley tiene por objeto regular, entre otros aspectos, el procedimiento administrativo común a todas las Administraciones Públicas, incluyendo:","opciones":{"a":"El sancionador y el tributario","b":"El de reclamación de responsabilidad y el de contratación pública","c":"El sancionador y el de reclamación de responsabilidad de las Administraciones Públicas","d":"El disciplinario y el sancionador"},"correcta":"c","explicacion":"El artículo 1.1 menciona expresamente, dentro del procedimiento administrativo común, «el sancionador y el de reclamación de responsabilidad de las Administraciones Públicas». La a) el artículo 1.1 no menciona el procedimiento tributario, sino el de reclamación de responsabilidad junto al sancionador. La b) el artículo 1.1 no incluye el procedimiento de contratación pública; el que acompaña al de responsabilidad es el sancionador. La d) el artículo 1.1 no cita el procedimiento disciplinario, sino el de reclamación de responsabilidad de las Administraciones Públicas.","cita":"«La presente Ley tiene por objeto regular (…) el procedimiento administrativo común a todas las Administraciones Públicas, incluyendo el sancionador y el de reclamación de responsabilidad de las Administraciones Públicas (…)»","dificultad":1},{"id":"L39-L1-003","ley":"L39","articulo":"1.2","articulo_txt":"Art. 1.2 Ley 39/2015","bloque_id":"L39|Título Preliminar. Disposiciones generales","enunciado":"Según el artículo 1.2 de la Ley 39/2015, ¿cómo podrán incluirse trámites adicionales o distintos a los contemplados en esta Ley?","opciones":{"a":"Mediante ley o mediante reglamento, de manera motivada","b":"Mediante reglamento, cuando así lo exija la naturaleza del procedimiento","c":"Solo mediante ley, cuando resulte eficaz, proporcionado y necesario, y de manera motivada","d":"Mediante ley o real decreto aprobado por el Consejo de Ministros"},"correcta":"c","explicacion":"El artículo 1.2 dispone que «Solo mediante ley», cuando resulte eficaz, proporcionado y necesario para los fines del procedimiento, y de manera motivada, podrán incluirse trámites adicionales o distintos. La a) el artículo 1.2 reserva la inclusión de trámites adicionales o distintos a la ley; el reglamento solo puede establecer determinadas especialidades del procedimiento. La b) los trámites adicionales o distintos solo pueden incluirse mediante ley, no por vía reglamentaria. La d) el artículo 1.2 dice «Solo mediante ley», sin admitir el real decreto para incluir esos trámites.","cita":"«Solo mediante ley, cuando resulte eficaz, proporcionado y necesario para la consecución de los fines propios del procedimiento, y de manera motivada, podrán incluirse trámites adicionales o distintos a los contemplados en esta Ley.»","dificultad":2},{"id":"L39-L1-005","ley":"L39","articulo":"2.2.b","articulo_txt":"Art. 2.2.b Ley 39/2015","bloque_id":"L39|Título Preliminar. Disposiciones generales","enunciado":"Según el artículo 2.2.b) de la Ley 39/2015, las entidades de derecho privado vinculadas o dependientes de las Administraciones Públicas quedarán sujetas a lo dispuesto en las normas de esta Ley que específicamente se refieran a las mismas y, en todo caso:","opciones":{"a":"Cuando su financiación proceda mayoritariamente de fondos públicos","b":"Cuando ejerzan potestades administrativas","c":"Cuando actúen en régimen de derecho privado","d":"Cuando así lo acuerde la Administración de la que dependan"},"correcta":"b","explicacion":"El artículo 2.2.b) las somete a las normas de la Ley que se refieran a ellas «y en todo caso, cuando ejerzan potestades administrativas». La a) el artículo 2.2.b) no atiende al origen de la financiación, sino al ejercicio de potestades administrativas. La c) es lo contrario de lo que dispone el artículo: la sujeción en todo caso se produce cuando ejercen potestades administrativas. La d) el artículo 2.2.b) no deja la sujeción a un acuerdo de la Administración matriz, sino que la impone cuando ejerzan potestades administrativas.","cita":"«b) Las entidades de derecho privado vinculadas o dependientes de las Administraciones Públicas, que quedarán sujetas a lo dispuesto en las normas de esta Ley que específicamente se refieran a las mismas, y en todo caso, cuando ejerzan potestades administrativas.»","dificultad":2},{"id":"L39-L1-004","ley":"L39","articulo":"2.2","articulo_txt":"Art. 2.2 Ley 39/2015","bloque_id":"L39|Título Preliminar. Disposiciones generales","enunciado":"Según el artículo 2.2 de la Ley 39/2015, ¿cuál de las siguientes se integra en el sector público institucional?","opciones":{"a":"Las Corporaciones de Derecho Público","b":"Las Universidades públicas","c":"Las Entidades que integran la Administración Local","d":"Las Administraciones de las Comunidades Autónomas"},"correcta":"b","explicacion":"El artículo 2.2.c) incluye en el sector público institucional a «Las Universidades públicas». La a) el artículo 2.2 no las incluye en el sector público institucional; el artículo 2.4 dispone que se rigen por su normativa específica en el ejercicio de funciones públicas y supletoriamente por esta Ley. La c) forman parte del sector público según el artículo 2.1.c), pero no del sector público institucional, que es otra categoría distinta (artículo 2.1.d). La d) el artículo 2.1.b) las incluye en el sector público, pero no dentro del sector público institucional.","cita":"«2. El sector público institucional se integra por: (…) c) Las Universidades públicas, que se regirán por su normativa específica y supletoriamente por las previsiones de esta Ley.»","dificultad":2},{"id":"L39-L1-006","ley":"L39","articulo":"2.3","articulo_txt":"Art. 2.3 Ley 39/2015","bloque_id":"L39|Título Preliminar. Disposiciones generales","enunciado":"Según el artículo 2.3 de la Ley 39/2015, ¿cuál de los siguientes NO tiene la consideración de Administración Pública?","opciones":{"a":"Las entidades de derecho privado vinculadas o dependientes de las Administraciones Públicas","b":"La Administración General del Estado","c":"Las Entidades que integran la Administración Local","d":"Los organismos públicos y entidades de derecho público vinculados o dependientes de las Administraciones Públicas"},"correcta":"a","explicacion":"El artículo 2.3 considera Administraciones Públicas a la Administración General del Estado, las de las Comunidades Autónomas, las Entidades que integran la Administración Local y los organismos públicos y entidades de derecho público de la letra a) del apartado 2, pero no a las entidades de derecho privado de la letra b). La b) figura expresamente en el artículo 2.3 como Administración Pública. La c) el artículo 2.3 las incluye expresamente entre las Administraciones Públicas. La d) el artículo 2.3 les reconoce esa consideración al remitirse a la letra a) del apartado 2.","cita":"«3. Tienen la consideración de Administraciones Públicas la Administración General del Estado, las Administraciones de las Comunidades Autónomas, las Entidades que integran la Administración Local, así como los organismos públicos y entidades de derecho público previstos en la letra a) del apartado 2 anterior.»","dificultad":2},{"id":"L39-L1-007","ley":"L39","articulo":"2.4","articulo_txt":"Art. 2.4 Ley 39/2015","bloque_id":"L39|Título Preliminar. Disposiciones generales","enunciado":"Según el artículo 2.4 de la Ley 39/2015, las Corporaciones de Derecho Público, en el ejercicio de las funciones públicas que les hayan sido atribuidas por Ley o delegadas por una Administración Pública, se regirán:","opciones":{"a":"Por la Ley 39/2015 y supletoriamente por su normativa específica","b":"Exclusivamente por su normativa específica","c":"Por la Ley 39/2015 en todo caso, como cualquier Administración Pública","d":"Por su normativa específica y supletoriamente por la Ley 39/2015"},"correcta":"d","explicacion":"El artículo 2.4 dispone que se rigen «por su normativa específica» en el ejercicio de esas funciones públicas, «y supletoriamente por la presente Ley». La a) invierte el orden de aplicación: la Ley 39/2015 es la norma supletoria, no la principal. La b) el artículo 2.4 prevé la aplicación supletoria de la Ley 39/2015. La c) las Corporaciones de Derecho Público no figuran entre las Administraciones Públicas del artículo 2.3, y el artículo 2.4 da preferencia a su normativa específica.","cita":"«4. Las Corporaciones de Derecho Público se regirán por su normativa específica en el ejercicio de las funciones públicas que les hayan sido atribuidas por Ley o delegadas por una Administración Pública, y supletoriamente por la presente Ley.»","dificultad":2},{"id":"L39-L1-009","ley":"L39","articulo":"3.b","articulo_txt":"Art. 3.b Ley 39/2015","bloque_id":"L39|Título I. De los interesados en el procedimiento","enunciado":"Según el artículo 3.b) de la Ley 39/2015, los menores de edad tendrán capacidad de obrar ante las Administraciones Públicas:","opciones":{"a":"Solo cuando hayan cumplido dieciséis años, para cualquier derecho o interés y en cualquier procedimiento","b":"En ningún caso, pues deben actuar siempre por medio de quien ejerza la patria potestad, tutela o curatela","c":"Solo para formular solicitudes, y siempre con la autorización expresa de quien ejerza la patria potestad, tutela o curatela","d":"Para el ejercicio y defensa de aquellos de sus derechos e intereses cuya actuación esté permitida por el ordenamiento jurídico sin la asistencia de quien ejerza la patria potestad, tutela o curatela"},"correcta":"d","explicacion":"El artículo 3.b) reconoce capacidad de obrar a los menores para el ejercicio y defensa de los derechos e intereses cuya actuación permita el ordenamiento jurídico sin la asistencia de quien ejerza la patria potestad, tutela o curatela. La a) el artículo 3.b) no fija una edad mínima, sino que atiende a los derechos e intereses cuya actuación permita el ordenamiento sin asistencia. La b) el artículo 3.b) sí les reconoce capacidad de obrar en determinados supuestos. La c) el artículo 3.b) no limita la capacidad a las solicitudes ni exige autorización: se refiere precisamente a actuaciones permitidas sin esa asistencia.","cita":"«b) Los menores de edad para el ejercicio y defensa de aquellos de sus derechos e intereses cuya actuación esté permitida por el ordenamiento jurídico sin la asistencia de la persona que ejerza la patria potestad, tutela o curatela. (…)»","dificultad":2},{"id":"L39-L1-008","ley":"L39","articulo":"3.a","articulo_txt":"Art. 3.a Ley 39/2015","bloque_id":"L39|Título I. De los interesados en el procedimiento","enunciado":"Según el artículo 3 de la Ley 39/2015, tendrán capacidad de obrar ante las Administraciones Públicas las personas físicas o jurídicas que ostenten capacidad de obrar con arreglo a:","opciones":{"a":"Las normas administrativas","b":"Las normas mercantiles","c":"Las normas civiles","d":"Las normas procesales"},"correcta":"c","explicacion":"El artículo 3.a) remite a la capacidad de obrar que las personas físicas o jurídicas ostenten «con arreglo a las normas civiles». La a) el artículo 3.a) no remite a las normas administrativas, sino a las civiles. La b) la referencia del artículo 3.a) es a las normas civiles, no a las mercantiles. La d) el artículo 3.a) no remite a las normas procesales, sino a las civiles.","cita":"«a) Las personas físicas o jurídicas que ostenten capacidad de obrar con arreglo a las normas civiles.»","dificultad":1},{"id":"L39-L1-012","ley":"L39","articulo":"4.1.c","articulo_txt":"Art. 4.1.c Ley 39/2015","bloque_id":"L39|Título I. De los interesados en el procedimiento","enunciado":"Según el artículo 4.1.c) de la Ley 39/2015, quienes tengan intereses legítimos que puedan resultar afectados por la resolución se consideran interesados si se personan en el procedimiento:","opciones":{"a":"Antes de que se dicte la propuesta de resolución","b":"En tanto no haya recaído resolución definitiva","c":"Dentro de los diez días siguientes a la notificación del acuerdo de iniciación","d":"Antes de que concluya el trámite de audiencia"},"correcta":"b","explicacion":"El artículo 4.1.c) exige que se personen en el procedimiento «en tanto no haya recaído resolución definitiva». La a) el límite temporal del artículo 4.1.c) no es la propuesta de resolución, sino la resolución definitiva. La c) el artículo 4.1.c) no fija un plazo de diez días, sino que admite la personación mientras no haya resolución definitiva. La d) el artículo 4.1.c) no se refiere al trámite de audiencia, sino a la resolución definitiva.","cita":"«c) Aquellos cuyos intereses legítimos, individuales o colectivos, puedan resultar afectados por la resolución y se personen en el procedimiento en tanto no haya recaído resolución definitiva.»","dificultad":2},{"id":"L39-L1-014","ley":"L39","articulo":"4.3","articulo_txt":"Art. 4.3 Ley 39/2015","bloque_id":"L39|Título I. De los interesados en el procedimiento","enunciado":"Según el artículo 4.3 de la Ley 39/2015, cuando la condición de interesado derivase de alguna relación jurídica transmisible, el derecho-habiente sucederá en tal condición:","opciones":{"a":"Cualquiera que sea el estado del procedimiento","b":"Solo si el procedimiento no ha superado la fase de instrucción","c":"Solo si el órgano competente lo autoriza expresamente","d":"Solo si se persona en el plazo de diez días desde la transmisión"},"correcta":"a","explicacion":"El artículo 4.3 dispone que el derecho-habiente sucederá en la condición de interesado «cualquiera que sea el estado del procedimiento». La b) el artículo 4.3 no limita la sucesión a la fase de instrucción. La c) el artículo 4.3 no exige autorización del órgano competente para la sucesión. La d) el artículo 4.3 no establece ningún plazo para que se produzca la sucesión.","cita":"«3. Cuando la condición de interesado derivase de alguna relación jurídica transmisible, el derecho-habiente sucederá en tal condición cualquiera que sea el estado del procedimiento.»","dificultad":1},{"id":"L39-L1-020","ley":"L39","articulo":"5.6","articulo_txt":"Art. 5.6 Ley 39/2015","bloque_id":"L39|Título I. De los interesados en el procedimiento","enunciado":"Según el artículo 5.6 de la Ley 39/2015, la falta o insuficiente acreditación de la representación no impedirá que se tenga por realizado el acto, siempre que se aporte aquélla o se subsane el defecto dentro del plazo que deberá conceder el órgano administrativo. ¿Cuál es ese plazo?","opciones":{"a":"Cinco días, ampliables a diez cuando las circunstancias del caso así lo requieran","b":"Quince días, sin posibilidad de ampliación","c":"Diez días, sin posibilidad de conceder un plazo superior","d":"Diez días, o un plazo superior cuando las circunstancias del caso así lo requieran"},"correcta":"d","explicacion":"El artículo 5.6 fija «el plazo de diez días», o «un plazo superior cuando las circunstancias del caso así lo requieran». La a) el plazo es de diez días, no de cinco. La b) el plazo es de diez días y admite uno superior si las circunstancias lo requieren. La c) el artículo 5.6 permite conceder un plazo superior cuando las circunstancias del caso lo requieran.","cita":"«6. La falta o insuficiente acreditación de la representación no impedirá que se tenga por realizado el acto de que se trate, siempre que se aporte aquélla o se subsane el defecto dentro del plazo de diez días que deberá conceder al efecto el órgano administrativo, o de un plazo superior cuando las circunstancias del caso así lo requieran.»","dificultad":2},{"id":"L39-L1-025","ley":"L39","articulo":"6.3","articulo_txt":"Art. 6.3 Ley 39/2015","bloque_id":"L39|Título I. De los interesados en el procedimiento","enunciado":"Según el artículo 6.3 de la Ley 39/2015, ¿cuál de los siguientes datos NO figura entre la información que, al menos, deben contener los asientos de los registros electrónicos de apoderamientos?","opciones":{"a":"La fecha de inscripción","b":"El período de tiempo por el cual se otorga el poder","c":"El tipo de poder según las facultades que otorgue","d":"El domicilio del apoderado"},"correcta":"d","explicacion":"El artículo 6.3 exige los datos identificativos del poderdante y del apoderado (nombre y apellidos o denominación o razón social, DNI, NIF o documento equivalente), la fecha de inscripción, el período de tiempo y el tipo de poder, pero no el domicilio. La a) figura en la letra c) del artículo 6.3. La b) figura en la letra d) del artículo 6.3. La c) figura en la letra e) del artículo 6.3.","cita":"«3. Los asientos que se realicen en los registros electrónicos generales y particulares de apoderamientos deberán contener, al menos, la siguiente información: (…) c) Fecha de inscripción. d) Período de tiempo por el cual se otorga el poder. e) Tipo de poder según las facultades que otorgue.»","dificultad":2},{"id":"L39-L1-031","ley":"L39","articulo":"9.2.c","articulo_txt":"Art. 9.2.c Ley 39/2015","bloque_id":"L39|Título I. De los interesados en el procedimiento","enunciado":"Según el artículo 9.2.c) de la Ley 39/2015, en relación con los sistemas de identificación de esa letra, el órgano estatal competente por motivos de seguridad pública podrá acudir a la vía jurisdiccional previo informe vinculante:","opciones":{"a":"De la Secretaría General de Administración Digital, que deberá emitirlo en el plazo de diez días desde su solicitud","b":"De la Secretaría de Estado de Seguridad, que deberá emitirlo en el plazo de un mes desde su solicitud","c":"De la Secretaría de Estado de Seguridad, que deberá emitirlo en el plazo de diez días desde su solicitud","d":"Del Centro Criptológico Nacional, que deberá emitirlo en el plazo de quince días desde su solicitud"},"correcta":"c","explicacion":"El artículo 9.2.c) exige el «previo informe vinculante de la Secretaría de Estado de Seguridad, que deberá emitir en el plazo de diez días desde su solicitud». La a) a la Secretaría General de Administración Digital se le comunica el sistema; el informe vinculante es de la Secretaría de Estado de Seguridad. La b) el plazo para emitir el informe es de diez días, no de un mes. La d) el artículo 9.2.c) no menciona a ese organismo y el plazo es de diez días.","cita":"«(…) durante los cuales el órgano estatal competente por motivos de seguridad pública podrá acudir a la vía jurisdiccional, previo informe vinculante de la Secretaría de Estado de Seguridad, que deberá emitir en el plazo de diez días desde su solicitud.»","dificultad":3},{"id":"L39-L1-032","ley":"L39","articulo":"9.2","articulo_txt":"Art. 9.2 Ley 39/2015","bloque_id":"L39|Título I. De los interesados en el procedimiento","enunciado":"Según el artículo 9.2 de la Ley 39/2015, las Administraciones Públicas deberán garantizar que la utilización de uno de los sistemas de identificación basados en certificados electrónicos cualificados sea posible:","opciones":{"a":"Solo en los procedimientos en que no se admita ningún otro sistema de identificación","b":"Para todo procedimiento, aun cuando se admita para ese mismo procedimiento alguno de los demás sistemas que consideren válidos","c":"Solo en los procedimientos iniciados a solicitud de personas jurídicas","d":"Solo para formular solicitudes e interponer recursos"},"correcta":"b","explicacion":"El último párrafo del artículo 9.2 obliga a garantizar que el uso de uno de los sistemas de las letras a) y b) «sea posible para todo procedimiento, aun cuando se admita para ese mismo procedimiento alguno de los previstos en la letra c)». La a) el artículo 9.2 exige esa posibilidad en todo procedimiento, aunque se admitan otros sistemas. La c) el artículo 9.2 no distingue según el tipo de interesado: se refiere a todo procedimiento. La d) el artículo 9.2 no limita la garantía a determinadas actuaciones, sino que la extiende a todo procedimiento.","cita":"«Las Administraciones Públicas deberán garantizar que la utilización de uno de los sistemas previstos en las letras a) y b) sea posible para todo procedimiento, aun cuando se admita para ese mismo procedimiento alguno de los previstos en la letra c).»","dificultad":2},{"id":"L39-L1-036","ley":"L39","articulo":"10.2.a","articulo_txt":"Art. 10.2.a Ley 39/2015","bloque_id":"L39|Título I. De los interesados en el procedimiento","enunciado":"Según el artículo 10.2.a) de la Ley 39/2015, cuando los interesados opten por relacionarse con las Administraciones Públicas a través de medios electrónicos, se considerarán válidos a efectos de firma los sistemas de firma electrónica:","opciones":{"a":"Cualificada, exclusivamente","b":"Avanzada basados en certificados electrónicos no cualificados","c":"Simple, avanzada o cualificada, con independencia del certificado en que se basen","d":"Cualificada y avanzada basados en certificados electrónicos cualificados de firma electrónica"},"correcta":"d","explicacion":"El artículo 10.2.a) considera válidos los «Sistemas de firma electrónica cualificada y avanzada basados en certificados electrónicos cualificados de firma electrónica» expedidos por prestadores de la «Lista de confianza». La a) el artículo 10.2.a) incluye también la firma electrónica avanzada basada en certificados cualificados. La b) el artículo 10.2.a) exige que los certificados sean cualificados. La c) el artículo 10.2.a) solo se refiere a la firma cualificada y avanzada basadas en certificados cualificados.","cita":"«a) Sistemas de firma electrónica cualificada y avanzada basados en certificados electrónicos cualificados de firma electrónica expedidos por prestadores incluidos en la ‘‘Lista de confianza de prestadores de servicios de certificación’’.»","dificultad":2},{"id":"L39-L1-039","ley":"L39","articulo":"11.1","articulo_txt":"Art. 11.1 Ley 39/2015","bloque_id":"L39|Título I. De los interesados en el procedimiento","enunciado":"Según el artículo 11.1 de la Ley 39/2015, con carácter general, para realizar cualquier actuación prevista en el procedimiento administrativo:","opciones":{"a":"Será necesaria, en todo caso, la firma del interesado","b":"Será suficiente con que los interesados acrediten previamente su identidad a través de cualquiera de los medios de identificación previstos en la Ley","c":"Será necesario que el interesado disponga de un certificado electrónico cualificado de firma electrónica","d":"Será suficiente con que los interesados aporten una copia de su Documento Nacional de Identidad"},"correcta":"b","explicacion":"El artículo 11.1 establece que «será suficiente con que los interesados acrediten previamente su identidad a través de cualquiera de los medios de identificación previstos en esta Ley». La a) la firma solo es obligatoria para las actuaciones del artículo 11.2; con carácter general basta la identificación. La c) el artículo 11.1 admite cualquiera de los medios de identificación de la Ley, no solo el certificado cualificado. La d) el artículo 11.1 se remite a los medios de identificación previstos en la Ley, no a la aportación de una copia del DNI.","cita":"«1. Con carácter general, para realizar cualquier actuación prevista en el procedimiento administrativo, será suficiente con que los interesados acrediten previamente su identidad a través de cualquiera de los medios de identificación previstos en esta Ley.»","dificultad":2},{"id":"L39-L1-041","ley":"L39","articulo":"12.1","articulo_txt":"Art. 12.1 Ley 39/2015","bloque_id":"L39|Título I. De los interesados en el procedimiento","enunciado":"Según el artículo 12.1 de la Ley 39/2015, para garantizar que los interesados pueden relacionarse con la Administración a través de medios electrónicos, las Administraciones Públicas pondrán a su disposición:","opciones":{"a":"Un certificado electrónico cualificado de firma electrónica, de forma gratuita","b":"Los canales de acceso que sean necesarios así como los sistemas y aplicaciones que en cada caso se determinen","c":"Un servicio de asistencia telefónica gratuito y permanente","d":"Un sistema de identificación electrónica propio de cada Administración"},"correcta":"b","explicacion":"El artículo 12.1 dispone que pondrán a disposición de los interesados «los canales de acceso que sean necesarios así como los sistemas y aplicaciones que en cada caso se determinen». La a) el artículo 12.1 no obliga a facilitar certificados electrónicos. La c) el artículo 12.1 no menciona ningún servicio telefónico, sino canales de acceso, sistemas y aplicaciones. La d) el artículo 12.1 no impone a cada Administración un sistema de identificación propio.","cita":"«1. Las Administraciones Públicas deberán garantizar que los interesados pueden relacionarse con la Administración a través de medios electrónicos, para lo que pondrán a su disposición los canales de acceso que sean necesarios así como los sistemas y aplicaciones que en cada caso se determinen.»","dificultad":1},{"id":"L39-L2-002","ley":"L39","articulo":"13","articulo_txt":"Art. 13 Ley 39/2015","bloque_id":"L39|Título II. De la actividad de las Administraciones Públicas · Capítulo I. Normas generales de actuación","enunciado":"Según el artículo 13 de la Ley 39/2015, los derechos que en él se enumeran se entienden sin perjuicio de los reconocidos, referidos a los interesados en el procedimiento administrativo, en el artículo:","opciones":{"a":"4 de la Ley 39/2015.","b":"66 de la Ley 39/2015.","c":"53 de la Ley 39/2015.","d":"35 de la Ley 39/2015."},"correcta":"c","explicacion":"El párrafo final del artículo 13 dispone que estos derechos «se entienden sin perjuicio de los reconocidos en el artículo 53 referidos a los interesados en el procedimiento administrativo». El artículo 13 no remite a los artículos 4, 66 ni 35, por lo que la a), la b) y la d) son incorrectas.","cita":"«Estos derechos se entienden sin perjuicio de los reconocidos en el artículo 53 referidos a los interesados en el procedimiento administrativo.»","dificultad":2},{"id":"L39-L2-005","ley":"L39","articulo":"14.2.c","articulo_txt":"Art. 14.2.c Ley 39/2015","bloque_id":"L39|Título II. De la actividad de las Administraciones Públicas · Capítulo I. Normas generales de actuación","enunciado":"Según el artículo 14.2.c) de la Ley 39/2015, ¿qué profesionales menciona expresamente como incluidos, en todo caso, en el colectivo de quienes ejercen una actividad profesional para la que se requiere colegiación obligatoria?","opciones":{"a":"Los abogados y los procuradores de los tribunales.","b":"Los notarios y los abogados del Estado.","c":"Los notarios y los registradores de la propiedad y mercantiles.","d":"Los registradores de la propiedad y los gestores administrativos."},"correcta":"c","explicacion":"El artículo 14.2.c) añade: «En todo caso, dentro de este colectivo se entenderán incluidos los notarios y registradores de la propiedad y mercantiles». La a) cita profesiones que el precepto no nombra expresamente, y la b) y la d) combinan uno de los colectivos citados con otro (abogados del Estado, gestores administrativos) que el artículo no menciona.","cita":"«c) Quienes ejerzan una actividad profesional para la que se requiera colegiación obligatoria, para los trámites y actuaciones que realicen con las Administraciones Públicas en ejercicio de dicha actividad profesional. En todo caso, dentro de este colectivo se entenderán incluidos los notarios y registradores de la propiedad y mercantiles.»","dificultad":2},{"id":"L39-L2-010","ley":"L39","articulo":"16.3","articulo_txt":"Art. 16.3 Ley 39/2015","bloque_id":"L39|Título II. De la actividad de las Administraciones Públicas · Capítulo I. Normas generales de actuación","enunciado":"Según el artículo 16.3 de la Ley 39/2015, el recibo que se emite automáticamente al practicar un asiento en el registro electrónico consiste en:","opciones":{"a":"Un justificante de presentación que incluye únicamente el número de entrada de registro.","b":"Un certificado de presentación expedido por el órgano destinatario en el plazo de diez días.","c":"Una copia autenticada del documento de que se trate, incluyendo la fecha y hora de presentación y el número de entrada de registro.","d":"Una copia simple del documento, sin valor acreditativo, que el interesado puede solicitar posteriormente."},"correcta":"c","explicacion":"El artículo 16.3 dispone que se emitirá automáticamente «un recibo consistente en una copia autenticada del documento de que se trate, incluyendo la fecha y hora de presentación y el número de entrada de registro». La a) omite la copia autenticada y la fecha y hora; la b) y la d) no responden a un recibo automático ni a su contenido legal.","cita":"«Para ello, se emitirá automáticamente un recibo consistente en una copia autenticada del documento de que se trate, incluyendo la fecha y hora de presentación y el número de entrada de registro, así como un recibo acreditativo de otros documentos que, en su caso, lo acompañen, que garantice la integridad y el no repudio de los mismos.»","dificultad":2},{"id":"L39-L2-012","ley":"L39","articulo":"16.5","articulo_txt":"Art. 16.5 Ley 39/2015","bloque_id":"L39|Título II. De la actividad de las Administraciones Públicas · Capítulo I. Normas generales de actuación","enunciado":"Según el artículo 16.5 de la Ley 39/2015, los documentos presentados de manera presencial ante las Administraciones Públicas deberán ser digitalizados, para su incorporación al expediente administrativo electrónico, por:","opciones":{"a":"El órgano instructor del procedimiento.","b":"El propio interesado, con carácter previo a su presentación.","c":"El órgano responsable del archivo electrónico único de la Administración competente.","d":"La oficina de asistencia en materia de registros en la que hayan sido presentados."},"correcta":"d","explicacion":"El artículo 16.5 atribuye la digitalización a «la oficina de asistencia en materia de registros en la que hayan sido presentados», devolviéndose los originales al interesado salvo las excepciones previstas. La a) y la c) señalan órganos que el precepto no menciona, y la b) traslada al interesado una carga que la ley impone a la oficina.","cita":"«5. Los documentos presentados de manera presencial ante las Administraciones Públicas, deberán ser digitalizados, de acuerdo con lo previsto en el artículo 27 y demás normativa aplicable, por la oficina de asistencia en materia de registros en la que hayan sido presentados para su incorporación al expediente administrativo electrónico, devolviéndose los originales al interesado (…)»","dificultad":1},{"id":"L39-L2-013","ley":"L39","articulo":"17.1","articulo_txt":"Art. 17.1 Ley 39/2015","bloque_id":"L39|Título II. De la actividad de las Administraciones Públicas · Capítulo I. Normas generales de actuación","enunciado":"Según el artículo 17.1 de la Ley 39/2015, cada Administración deberá mantener un archivo electrónico único de los documentos electrónicos que correspondan a:","opciones":{"a":"Procedimientos en tramitación.","b":"Procedimientos finalizados.","c":"Procedimientos iniciados a solicitud del interesado, estén o no finalizados.","d":"Procedimientos en los que haya recaído sentencia firme."},"correcta":"b","explicacion":"El artículo 17.1 se refiere a los documentos electrónicos «que correspondan a procedimientos finalizados». La a) y la c) incluyen procedimientos aún en curso, y la d) añade un requisito judicial que el precepto no contiene.","cita":"«1. Cada Administración deberá mantener un archivo electrónico único de los documentos electrónicos que correspondan a procedimientos finalizados, en los términos establecidos en la normativa reguladora aplicable.»","dificultad":1},{"id":"L39-L2-016","ley":"L39","articulo":"20.2","articulo_txt":"Art. 20.2 Ley 39/2015","bloque_id":"L39|Título II. De la actividad de las Administraciones Públicas · Capítulo I. Normas generales de actuación","enunciado":"Según el artículo 20.2 de la Ley 39/2015, los interesados podrán solicitar la exigencia de la responsabilidad de los titulares de las unidades administrativas y del personal que tengan a su cargo la tramitación de los asuntos a:","opciones":{"a":"El superior jerárquico del órgano instructor, exclusivamente.","b":"El órgano jurisdiccional contencioso-administrativo competente.","c":"El Consejo de Transparencia y Buen Gobierno.","d":"La Administración Pública de que dependa el personal afectado."},"correcta":"d","explicacion":"El artículo 20.2 dispone que los interesados podrán solicitar la exigencia de esa responsabilidad «a la Administración Pública de que dependa el personal afectado». Ni el superior jerárquico del instructor (a), ni los tribunales (b), ni el Consejo de Transparencia (c) son los destinatarios que señala el precepto.","cita":"«2. Los interesados podrán solicitar la exigencia de esa responsabilidad a la Administración Pública de que dependa el personal afectado.»","dificultad":2},{"id":"L39-L2-017","ley":"L39","articulo":"21.1","articulo_txt":"Art. 21.1 Ley 39/2015","bloque_id":"L39|Título II. De la actividad de las Administraciones Públicas · Capítulo I. Normas generales de actuación","enunciado":"Según el artículo 21.1 de la Ley 39/2015, ¿en cuál de los siguientes supuestos se exceptúa la obligación de la Administración de dictar resolución expresa y notificarla?","opciones":{"a":"Caducidad del procedimiento.","b":"Terminación del procedimiento por pacto o convenio.","c":"Desistimiento de la solicitud.","d":"Desaparición sobrevenida del objeto del procedimiento."},"correcta":"b","explicacion":"El artículo 21.1 exceptúa de la obligación de resolver «los supuestos de terminación del procedimiento por pacto o convenio» (y los procedimientos sometidos solo a declaración responsable o comunicación). En los casos de la a), la c) y la d) sí debe dictarse resolución, que consistirá en la declaración de la circunstancia que concurra, con indicación de los hechos producidos y las normas aplicables.","cita":"«En los casos de prescripción, renuncia del derecho, caducidad del procedimiento o desistimiento de la solicitud, así como de desaparición sobrevenida del objeto del procedimiento, la resolución consistirá en la declaración de la circunstancia que concurra en cada caso, con indicación de los hechos producidos y las normas aplicables. Se exceptúan de la obligación a que se refiere el párrafo primero, los supuestos de terminación del procedimiento por pacto o convenio, así como los procedimientos relativos al ejercicio de derechos sometidos únicamente al deber de declaración responsable o comunicación a la Administración.»","dificultad":2},{"id":"L39-L2-024","ley":"L39","articulo":"22.2","articulo_txt":"Art. 22.2 Ley 39/2015","bloque_id":"L39|Título II. De la actividad de las Administraciones Públicas · Capítulo I. Normas generales de actuación","enunciado":"Según el artículo 22 de la Ley 39/2015, ¿en cuál de los siguientes casos el transcurso del plazo máximo legal para resolver un procedimiento y notificar la resolución se suspenderá de forma obligatoria, y no meramente potestativa?","opciones":{"a":"Cuando deban realizarse pruebas técnicas o análisis contradictorios o dirimentes propuestos por los interesados.","b":"Cuando deba obtenerse un pronunciamiento previo y preceptivo de un órgano de la Unión Europea.","c":"Cuando se inicien negociaciones con vistas a la conclusión de un pacto o convenio.","d":"Cuando los interesados promuevan la recusación en cualquier momento de la tramitación de un procedimiento."},"correcta":"d","explicacion":"La recusación figura en el artículo 22.2, cuyos supuestos operan imperativamente («se suspenderá»), desde que se plantea hasta que la resuelve el superior jerárquico del recusado. La a), la b) y la c) están en el artículo 22.1, donde el plazo solo «se podrá suspender».","cita":"«2. El transcurso del plazo máximo legal para resolver un procedimiento y notificar la resolución se suspenderá en los siguientes casos: (…) c) Cuando los interesados promuevan la recusación en cualquier momento de la tramitación de un procedimiento, desde que ésta se plantee hasta que sea resuelta por el superior jerárquico del recusado.»","dificultad":3},{"id":"L39-L2-025","ley":"L39","articulo":"23.1","articulo_txt":"Art. 23.1 Ley 39/2015","bloque_id":"L39|Título II. De la actividad de las Administraciones Públicas · Capítulo I. Normas generales de actuación","enunciado":"Según el artículo 23.1 de la Ley 39/2015, cuando se hayan agotado los medios personales y materiales disponibles, ¿cuál es el límite máximo de la ampliación del plazo máximo de resolución y notificación que puede acordarse?","opciones":{"a":"La mitad del plazo establecido para la tramitación del procedimiento.","b":"El propio plazo establecido para la tramitación del procedimiento, al que no puede ser superior.","c":"Tres meses, cualquiera que sea el plazo establecido.","d":"Seis meses, salvo previsión de una norma con rango de ley."},"correcta":"b","explicacion":"El artículo 23.1 permite acordar motivadamente la ampliación «no pudiendo ser éste superior al establecido para la tramitación del procedimiento». La a) recoge el límite de la mitad propio de la ampliación de plazos del artículo 32.1, y la c) y la d) fijan topes que el artículo 23 no contiene.","cita":"«1. Excepcionalmente, cuando se hayan agotado los medios personales y materiales disponibles a los que se refiere el apartado 5 del artículo 21, el órgano competente para resolver, a propuesta, en su caso, del órgano instructor o el superior jerárquico del órgano competente para resolver, podrá acordar de manera motivada la ampliación del plazo máximo de resolución y notificación, no pudiendo ser éste superior al establecido para la tramitación del procedimiento.»","dificultad":3},{"id":"L39-L2-029","ley":"L39","articulo":"24.4","articulo_txt":"Art. 24.4 Ley 39/2015","bloque_id":"L39|Título II. De la actividad de las Administraciones Públicas · Capítulo I. Normas generales de actuación","enunciado":"Según el artículo 24.4 de la Ley 39/2015, el certificado acreditativo del silencio producido se expedirá de oficio por el órgano competente para resolver en el plazo de:","opciones":{"a":"Diez días desde que expire el plazo máximo para resolver el procedimiento.","b":"Quince días desde que expire el plazo máximo para resolver el procedimiento.","c":"Un mes desde que expire el plazo máximo para resolver el procedimiento.","d":"Veinte días desde que el interesado lo solicite."},"correcta":"b","explicacion":"El artículo 24.4 dispone que el certificado «se expedirá de oficio por el órgano competente para resolver en el plazo de quince días desde que expire el plazo máximo para resolver». La a), la c) y la d) cambian el plazo; además, si lo pide el interesado, el mismo plazo se cuenta desde el día siguiente a la entrada de la petición en el registro electrónico competente.","cita":"«Este certificado se expedirá de oficio por el órgano competente para resolver en el plazo de quince días desde que expire el plazo máximo para resolver el procedimiento.»","dificultad":2},{"id":"L39-L2-033","ley":"L39","articulo":"26.3","articulo_txt":"Art. 26.3 Ley 39/2015","bloque_id":"L39|Título II. De la actividad de las Administraciones Públicas · Capítulo I. Normas generales de actuación","enunciado":"Según el artículo 26.3 de la Ley 39/2015, ¿qué documentos electrónicos emitidos por las Administraciones Públicas no requerirán de firma electrónica?","opciones":{"a":"Los que se publiquen con carácter meramente informativo, así como aquellos que no formen parte de un expediente administrativo.","b":"Los que se dirijan a otras Administraciones Públicas a través de redes corporativas.","c":"Los que se notifiquen a interesados que no estén obligados a relacionarse electrónicamente.","d":"Las copias auténticas expedidas mediante actuación administrativa automatizada."},"correcta":"a","explicacion":"El artículo 26.3 exime de firma electrónica a los documentos «que se publiquen con carácter meramente informativo, así como aquellos que no formen parte de un expediente administrativo», aunque siempre debe identificarse su origen. La b), la c) y la d) no figuran entre las excepciones del precepto.","cita":"«3. No requerirán de firma electrónica, los documentos electrónicos emitidos por las Administraciones Públicas que se publiquen con carácter meramente informativo, así como aquellos que no formen parte de un expediente administrativo. En todo caso, será necesario identificar el origen de estos documentos.»","dificultad":2},{"id":"L39-L2-040","ley":"L39","articulo":"30.1","articulo_txt":"Art. 30.1 Ley 39/2015","bloque_id":"L39|Título II. De la actividad de las Administraciones Públicas · Capítulo II. Términos y plazos","enunciado":"Según el artículo 30.1 de la Ley 39/2015, salvo que por ley o en el Derecho de la Unión Europea se disponga otro cómputo, cuando los plazos se señalen por horas:","opciones":{"a":"Se entiende que son naturales.","b":"Se entiende que son hábiles las comprendidas en el horario de atención al público de las oficinas de registro.","c":"Se entiende que son hábiles las comprendidas entre las ocho y las veinte horas de cada día hábil.","d":"Se entiende que son hábiles, y son hábiles todas las horas del día que formen parte de un día hábil."},"correcta":"d","explicacion":"El artículo 30.1 establece que, cuando los plazos se señalan por horas, «se entiende que éstas son hábiles» y que «son hábiles todas las horas del día que formen parte de un día hábil». La a) contradice la regla, y la b) y la c) restringen las horas hábiles a franjas horarias que la ley no prevé.","cita":"«1. Salvo que por Ley o en el Derecho de la Unión Europea se disponga otro cómputo, cuando los plazos se señalen por horas, se entiende que éstas son hábiles. Son hábiles todas las horas del día que formen parte de un día hábil.»","dificultad":2},{"id":"L39-L2-041","ley":"L39","articulo":"30.1","articulo_txt":"Art. 30.1 Ley 39/2015","bloque_id":"L39|Título II. De la actividad de las Administraciones Públicas · Capítulo II. Términos y plazos","enunciado":"Según el artículo 30.1 de la Ley 39/2015, los plazos expresados por horas se contarán de hora en hora y de minuto en minuto desde la hora y minuto en que tenga lugar la notificación o publicación del acto. ¿Cuál es la duración máxima que pueden tener?","opciones":{"a":"Veinticuatro horas; si fuera mayor, el plazo se expresará en días.","b":"Cuarenta y ocho horas; si fuera mayor, el plazo se expresará en días.","c":"Setenta y dos horas; si fuera mayor, el plazo se expresará en días.","d":"Doce horas; si fuera mayor, el plazo se expresará en días."},"correcta":"a","explicacion":"El artículo 30.1 dispone que los plazos por horas «no podrán tener una duración superior a veinticuatro horas, en cuyo caso se expresarán en días». Las cifras de la b), la c) y la d) no son el límite legal.","cita":"«Los plazos expresados por horas se contarán de hora en hora y de minuto en minuto desde la hora y minuto en que tenga lugar la notificación o publicación del acto de que se trate y no podrán tener una duración superior a veinticuatro horas, en cuyo caso se expresarán en días.»","dificultad":1},{"id":"L39-L2-042","ley":"L39","articulo":"30.2","articulo_txt":"Art. 30.2 Ley 39/2015","bloque_id":"L39|Título II. De la actividad de las Administraciones Públicas · Capítulo II. Términos y plazos","enunciado":"Según el artículo 30.2 de la Ley 39/2015, siempre que por ley o en el Derecho de la Unión Europea no se exprese otro cómputo, cuando los plazos se señalen por días, ¿qué días se excluyen del cómputo?","opciones":{"a":"Los domingos y los declarados festivos.","b":"Únicamente los declarados festivos.","c":"Los sábados, los domingos y los declarados festivos.","d":"Los sábados por la tarde, los domingos y los declarados festivos."},"correcta":"c","explicacion":"El artículo 30.2 dispone que los plazos por días son hábiles, «excluyéndose del cómputo los sábados, los domingos y los declarados festivos». La a) y la b) omiten los sábados (y la b, también los domingos), y la d) solo excluye la tarde del sábado.","cita":"«2. Siempre que por Ley o en el Derecho de la Unión Europea no se exprese otro cómputo, cuando los plazos se señalen por días, se entiende que éstos son hábiles, excluyéndose del cómputo los sábados, los domingos y los declarados festivos.»","dificultad":1},{"id":"L39-L2-043","ley":"L39","articulo":"30.4","articulo_txt":"Art. 30.4 Ley 39/2015","bloque_id":"L39|Título II. De la actividad de las Administraciones Públicas · Capítulo II. Términos y plazos","enunciado":"Según el artículo 30.4 de la Ley 39/2015, cuando el plazo se fija en meses o años, ¿qué día concluye?","opciones":{"a":"El día anterior a aquel en que se produjo la notificación, publicación o silencio administrativo, en el mes o el año de vencimiento.","b":"El mismo día en que se produjo la notificación, publicación o silencio administrativo, en el mes o el año de vencimiento.","c":"El día siguiente a aquel en que se produjo la notificación, publicación o silencio administrativo, en el mes o el año de vencimiento.","d":"Al cumplirse treinta días naturales por cada mes, contados desde el día siguiente a la notificación o publicación."},"correcta":"b","explicacion":"El artículo 30.4 dispone que «el plazo concluirá el mismo día en que se produjo la notificación, publicación o silencio administrativo en el mes o el año de vencimiento» (y, si no hay día equivalente, el último día del mes). La a) y la c) desplazan un día el vencimiento, y la d) convierte los meses en días, lo que la ley no prevé.","cita":"«El plazo concluirá el mismo día en que se produjo la notificación, publicación o silencio administrativo en el mes o el año de vencimiento. Si en el mes de vencimiento no hubiera día equivalente a aquel en que comienza el cómputo, se entenderá que el plazo expira el último día del mes.»","dificultad":2},{"id":"L39-L2-045","ley":"L39","articulo":"31.2.b","articulo_txt":"Art. 31.2.b Ley 39/2015","bloque_id":"L39|Título II. De la actividad de las Administraciones Públicas · Capítulo II. Términos y plazos","enunciado":"Según el artículo 31.2.b) de la Ley 39/2015, a los efectos del cómputo de plazos fijados en días hábiles y en lo que se refiere al cumplimiento de plazos por los interesados, la presentación de un documento en el registro electrónico en un día inhábil se entenderá realizada, salvo que una norma permita expresamente la recepción en día inhábil:","opciones":{"a":"En la primera hora del primer día hábil siguiente.","b":"En la última hora del último día hábil anterior.","c":"En la fecha y hora efectivas de la presentación.","d":"A la misma hora del primer día hábil siguiente."},"correcta":"a","explicacion":"El artículo 31.2.b) dispone que esa presentación «se entenderá realizada en la primera hora del primer día hábil siguiente». La b) retrotrae la presentación, la c) ignora la regla especial y la d) traslada la hora real de presentación, cuando la ley remite a la primera hora.","cita":"«b) A los efectos del cómputo de plazo fijado en días hábiles, y en lo que se refiere al cumplimiento de plazos por los interesados, la presentación en un día inhábil se entenderá realizada en la primera hora del primer día hábil siguiente salvo que una norma permita expresamente la recepción en día inhábil.»","dificultad":2},{"id":"L39-L2-047","ley":"L39","articulo":"32.1","articulo_txt":"Art. 32.1 Ley 39/2015","bloque_id":"L39|Título II. De la actividad de las Administraciones Públicas · Capítulo II. Términos y plazos","enunciado":"Según el artículo 32.1 de la Ley 39/2015, la ampliación de los plazos establecidos que la Administración puede conceder, de oficio o a petición de los interesados, salvo precepto en contrario, tiene como límite máximo:","opciones":{"a":"Un tercio de los plazos establecidos.","b":"El doble de los plazos establecidos.","c":"El mismo plazo inicialmente establecido.","d":"La mitad de los plazos establecidos."},"correcta":"d","explicacion":"El artículo 32.1 permite una ampliación «que no exceda de la mitad de los mismos», si las circunstancias lo aconsejan y no se perjudican derechos de tercero. La c) recoge el límite de la ampliación del plazo máximo para resolver (art. 23.1), y la a) y la b) no responden al texto.","cita":"«1. La Administración, salvo precepto en contrario, podrá conceder de oficio o a petición de los interesados, una ampliación de los plazos establecidos, que no exceda de la mitad de los mismos, si las circunstancias lo aconsejan y con ello no se perjudican derechos de tercero. El acuerdo de ampliación deberá ser notificado a los interesados.»","dificultad":2},{"id":"L39-L2-048","ley":"L39","articulo":"32.2","articulo_txt":"Art. 32.2 Ley 39/2015","bloque_id":"L39|Título II. De la actividad de las Administraciones Públicas · Capítulo II. Términos y plazos","enunciado":"Según el artículo 32.2 de la Ley 39/2015, la ampliación de los plazos por el tiempo máximo permitido se aplicará en todo caso:","opciones":{"a":"A los procedimientos en que intervengan interesados residentes fuera de España.","b":"A los procedimientos en que intervengan más de diez interesados.","c":"A los procedimientos de concurrencia competitiva.","d":"A los procedimientos afectados por una incidencia técnica que haya imposibilitado el funcionamiento ordinario del sistema."},"correcta":"a","explicacion":"El artículo 32.2 aplica en todo caso la ampliación máxima a los procedimientos tramitados por misiones diplomáticas y oficinas consulares, a los que exijan algún trámite en el extranjero y a aquellos «en los que intervengan interesados residentes fuera de España». La b) y la c) no figuran en el precepto, y la d) corresponde al artículo 32.4, donde la ampliación es potestativa («podrá determinar»).","cita":"«2. La ampliación de los plazos por el tiempo máximo permitido se aplicará en todo caso a los procedimientos tramitados por las misiones diplomáticas y oficinas consulares, así como a aquellos que, sustanciándose en el interior, exijan cumplimentar algún trámite en el extranjero o en los que intervengan interesados residentes fuera de España.»","dificultad":2},{"id":"L39-L2-049","ley":"L39","articulo":"32.3","articulo_txt":"Art. 32.3 Ley 39/2015","bloque_id":"L39|Título II. De la actividad de las Administraciones Públicas · Capítulo II. Términos y plazos","enunciado":"Según el artículo 32.3 de la Ley 39/2015, ¿puede ser objeto de ampliación un plazo ya vencido?","opciones":{"a":"Sí, si la petición del interesado se presentó antes del vencimiento, aunque la decisión se adopte después.","b":"Sí, siempre que con ello no se perjudiquen derechos de tercero.","c":"No, en ningún caso.","d":"Sí, cuando el vencimiento se haya debido a una incidencia técnica."},"correcta":"c","explicacion":"El artículo 32.3 es tajante: «En ningún caso podrá ser objeto de ampliación un plazo ya vencido», y tanto la petición como la decisión deben producirse antes del vencimiento, lo que descarta la a). La b) mezcla un requisito del artículo 32.1, y la d) es falsa porque el artículo 32.4 solo permite ampliar plazos no vencidos.","cita":"«3. Tanto la petición de los interesados como la decisión sobre la ampliación deberán producirse, en todo caso, antes del vencimiento del plazo de que se trate. En ningún caso podrá ser objeto de ampliación un plazo ya vencido.»","dificultad":2},{"id":"L39-L2-050","ley":"L39","articulo":"32.5","articulo_txt":"Art. 32.5 Ley 39/2015","bloque_id":"L39|Título II. De la actividad de las Administraciones Públicas · Capítulo II. Términos y plazos","enunciado":"Según el artículo 32.5 de la Ley 39/2015, cuando como consecuencia de un ciberincidente se hayan visto gravemente afectados los servicios y sistemas utilizados para la tramitación de los procedimientos, la Administración podrá acordar:","opciones":{"a":"La suspensión de todos los plazos hasta que se restablezca el servicio.","b":"La ampliación general de plazos de los procedimientos administrativos.","c":"La declaración como inhábiles de los días afectados por el ciberincidente.","d":"La tramitación de urgencia de los procedimientos afectados."},"correcta":"b","explicacion":"El artículo 32.5, añadido por el Real Decreto-ley 6/2022, permite a la Administración «acordar la ampliación general de plazos de los procedimientos administrativos». La suspensión (a), la declaración de días inhábiles (c) y la tramitación de urgencia (d) no son la medida que prevé el precepto.","cita":"«5. Cuando como consecuencia de un ciberincidente se hayan visto gravemente afectados los servicios y sistemas utilizados para la tramitación de los procedimientos y el ejercicio de los derechos de los interesados que prevé la normativa vigente, la Administración podrá acordar la ampliación general de plazos de los procedimientos administrativos.»","dificultad":2},{"id":"L39-L2-051","ley":"L39","articulo":"33.1","articulo_txt":"Art. 33.1 Ley 39/2015","bloque_id":"L39|Título II. De la actividad de las Administraciones Públicas · Capítulo II. Términos y plazos","enunciado":"Según el artículo 33.1 de la Ley 39/2015, cuando se acuerde la aplicación al procedimiento de la tramitación de urgencia, se reducirán a la mitad los plazos establecidos para el procedimiento ordinario, salvo:","opciones":{"a":"Los relativos a la emisión de informes preceptivos.","b":"Los relativos al trámite de audiencia y alegaciones.","c":"El plazo máximo para resolver y notificar.","d":"Los relativos a la presentación de solicitudes y recursos."},"correcta":"d","explicacion":"El artículo 33.1 exceptúa de la reducción a la mitad los plazos «relativos a la presentación de solicitudes y recursos». Los plazos de informes (a), de audiencia y alegaciones (b) y el plazo para resolver (c) no figuran entre las excepciones.","cita":"«1. Cuando razones de interés público lo aconsejen, se podrá acordar, de oficio o a petición del interesado, la aplicación al procedimiento de la tramitación de urgencia, por la cual se reducirán a la mitad los plazos establecidos para el procedimiento ordinario, salvo los relativos a la presentación de solicitudes y recursos.»","dificultad":2},{"id":"L39-L2-052","ley":"L39","articulo":"33.2","articulo_txt":"Art. 33.2 Ley 39/2015","bloque_id":"L39|Título II. De la actividad de las Administraciones Públicas · Capítulo II. Términos y plazos","enunciado":"Según el artículo 33.2 de la Ley 39/2015, contra el acuerdo que declare la aplicación de la tramitación de urgencia al procedimiento:","opciones":{"a":"Cabrá recurso de alzada ante el superior jerárquico.","b":"No cabrá recurso alguno, sin perjuicio del procedente contra la resolución que ponga fin al procedimiento.","c":"Cabrá recurso potestativo de reposición.","d":"Cabrá directamente recurso contencioso-administrativo."},"correcta":"b","explicacion":"El artículo 33.2 dispone que «no cabrá recurso alguno contra el acuerdo que declare la aplicación de la tramitación de urgencia», sin perjuicio del que proceda contra la resolución final. Por eso son incorrectas la a), la c) y la d), que admiten un recurso directo contra ese acuerdo.","cita":"«2. No cabrá recurso alguno contra el acuerdo que declare la aplicación de la tramitación de urgencia al procedimiento, sin perjuicio del procedente contra la resolución que ponga fin al procedimiento.»","dificultad":1}]};</script>
<script>
/* Letra de Ley — motor de test. Sin dependencias; funciona sin conexión.
   Necesita window.LDL_CONFIG y window.LDL_BANCO (los inyecta sistema/letradeley.py). */
(function () {
  "use strict";
  var CFG = window.LDL_CONFIG, B = window.LDL_BANCO;
  var raiz = document.getElementById("ldl");
  var LETRAS = ["a", "b", "c", "d"];
  var POR_ID = {};
  B.preguntas.forEach(function (p) { POR_ID[p.id] = p; });
  var CLAVE = "ldl1:" + CFG.pack.id;
  var prog = cargar();
  var sesion = null;
  var vista = CFG.modo === "web" ? "portada" : "inicio";
  var reloj = null;

  /* ---------- utilidades ---------- */
  function esc(t) {
    return String(t == null ? "" : t).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function barajar(lista) {
    var a = lista.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function pct(a, b) { return b ? Math.round((a / b) * 100) : 0; }
  function plural(n, uno, varios) { return n + " " + (n === 1 ? uno : varios); }
  function num(n) { return String(n).replace(".", ","); }
  function cargar() {
    try { var s = localStorage.getItem(CLAVE); if (s) { var d = JSON.parse(s); if (d && d.p) return d; } } catch (e) {}
    return { p: {}, h: [] };
  }
  function guardar() { try { localStorage.setItem(CLAVE, JSON.stringify(prog)); } catch (e) {} }
  function registrar(id, acierto) {
    var r = prog.p[id] || { v: 0, a: 0, f: 0, c: 0 };
    r.v++;
    if (acierto) { r.a++; r.c = Math.min((r.c || 0) + 1, 5); } else { r.f++; r.c = 0; }
    r.u = acierto ? 1 : 0;
    r.t = Date.now();
    prog.p[id] = r;
    guardar();
  }
  function fallosPendientes() {
    return B.preguntas.filter(function (p) { var r = prog.p[p.id]; return r && r.u === 0; });
  }
  function resumen(lista) {
    var vistas = 0, aciertos = 0, intentos = 0;
    lista.forEach(function (p) {
      var r = prog.p[p.id];
      if (r) { vistas++; aciertos += r.a; intentos += r.v; }
    });
    return { total: lista.length, vistas: vistas, acierto: pct(aciertos, intentos) };
  }
  function delBloque(id) { return B.preguntas.filter(function (p) { return p.bloque_id === id; }); }

  /* ---------- tema claro / oscuro ---------- */
  function aplicarTema() {
    var t = null;
    try { t = localStorage.getItem("ldl:tema"); } catch (e) {}
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    else document.documentElement.removeAttribute("data-theme");
    return t || "auto";
  }
  function cambiarTema() {
    var orden = { auto: "light", light: "dark", dark: "auto" };
    var actual = aplicarTema();
    try { localStorage.setItem("ldl:tema", orden[actual]); } catch (e) {}
    aplicarTema();
    pintar();
  }

  /* ---------- sesiones ---------- */
  function empezar(tipo, preguntas, opciones) {
    opciones = opciones || {};
    if (!preguntas.length) return;
    pararReloj();
    sesion = {
      tipo: tipo, titulo: opciones.titulo || "Test", ids: preguntas.map(function (p) { return p.id; }),
      i: 0, resp: {}, corregida: {}, inicio: Date.now(), limite: opciones.minutos ? opciones.minutos * 60 : 0, fin: null,
      origen: vista === "test" || vista === "resultado" ? (sesion && sesion.origen) || "inicio" : vista
    };
    vista = "test";
    if (sesion.limite) reloj = setInterval(tic, 1000);
    pintar();
    window.scrollTo(0, 0);
  }
  function tic() {
    if (!sesion || sesion.fin) return pararReloj();
    var el = document.getElementById("ldl-crono");
    var resta = sesion.limite - Math.floor((Date.now() - sesion.inicio) / 1000);
    if (resta <= 0) { terminar(); return; }
    if (el) el.textContent = mmss(resta);
  }
  function pararReloj() { if (reloj) { clearInterval(reloj); reloj = null; } }
  function mmss(s) { var m = Math.floor(s / 60), r = s % 60; return m + ":" + (r < 10 ? "0" : "") + r; }

  function responder(letra) {
    var id = sesion.ids[sesion.i];
    if (sesion.tipo === "simulacro") {
      sesion.resp[id] = sesion.resp[id] === letra ? undefined : letra;
      pintar();
      return;
    }
    if (sesion.corregida[id]) return;
    sesion.resp[id] = letra;
    sesion.corregida[id] = true;
    registrar(id, letra === POR_ID[id].correcta);
    pintar();
  }
  function siguiente() {
    if (sesion.i < sesion.ids.length - 1) { sesion.i++; pintar(); window.scrollTo(0, 0); }
    else terminar();
  }
  function anterior() { if (sesion.i > 0) { sesion.i--; pintar(); } }
  function terminar() {
    pararReloj();
    if (sesion.tipo === "simulacro") {
      sesion.ids.forEach(function (id) {
        if (sesion.resp[id]) registrar(id, sesion.resp[id] === POR_ID[id].correcta);
      });
    }
    sesion.fin = Date.now();
    var r = calcular(sesion);
    prog.h.unshift({ t: sesion.fin, tipo: sesion.tipo, n: r.total, a: r.aciertos, e: r.errores, nota: r.nota });
    prog.h = prog.h.slice(0, 50);
    guardar();
    vista = "resultado";
    pintar();
    window.scrollTo(0, 0);
  }
  function calcular(s) {
    var a = 0, e = 0, nr = 0;
    s.ids.forEach(function (id) {
      var r = s.resp[id];
      if (!r) nr++; else if (r === POR_ID[id].correcta) a++; else e++;
    });
    var pen = (CFG.simulacro && CFG.simulacro.penalizacion) || 1 / 3;
    var neta = s.tipo === "simulacro" ? a - e * pen : a;
    var nota = Math.max(0, (neta / s.ids.length) * 10);
    return { total: s.ids.length, aciertos: a, errores: e, blancos: nr, neta: neta, nota: Math.round(nota * 100) / 100 };
  }

  /* ---------- vistas ---------- */
  function cabecera() {
    var tema = aplicarTema();
    var etiquetas = { auto: "Tema: auto", light: "Tema: claro", dark: "Tema: oscuro" };
    return '<header class="ldl-top"><a class="ldl-brand" href="' + esc(CFG.web || "#") + '">' +
      '<span class="ldl-logo" aria-hidden="true">§</span><span><b>Letra de Ley</b><small>' +
      esc(CFG.pack.nombre) + "</small></span></a>" +
      '<button class="ldl-tema" data-acc="tema" type="button">' + etiquetas[tema] + "</button></header>";
  }
  function navegacion() {
    if (CFG.modo === "web") return "";
    var items = [["inicio", "Inicio"], ["temas", "Por temas"], ["simulacro", "Simulacro"], ["fallos", "Fallos"], ["stats", "Estadísticas"]];
    return '<nav class="ldl-nav" aria-label="Secciones">' + items.map(function (it) {
      var actual = vista === it[0] || (vista === "test" && sesion && sesion.origen === it[0]);
      return '<button type="button" data-acc="ir" data-v="' + it[0] + '"' + (actual ? ' aria-current="page"' : "") + ">" + it[1] + "</button>";
    }).join("") + "</nav>";
  }
  function pie() {
    return '<p class="ldl-pie">Letra de Ley · ' + esc(CFG.pack.edicion) + " · Texto legal actualizado a " +
      esc(CFG.pack.actualizado) + "<br>Uso personal. Prohibida su redistribución.</p>";
  }

  function vInicio() {
    var r = resumen(B.preguntas), f = fallosPendientes().length;
    return '<section class="ldl-card"><h2>' + esc(CFG.pack.nombre) + "</h2>" +
      '<p class="ldl-muted">' + B.preguntas.length + " preguntas comentadas, con el artículo exacto de cada respuesta.</p>" +
      '<div class="ldl-kpis"><div class="ldl-kpi"><b>' + r.vistas + "/" + r.total + "</b><span>respondidas</span></div>" +
      '<div class="ldl-kpi"><b>' + r.acierto + ' %</b><span>de acierto</span></div>' +
      '<div class="ldl-kpi"><b>' + f + "</b><span>fallos por repasar</span></div></div>" +
      '<div class="ldl-acciones"><button class="ldl-btn" data-acc="rapido" type="button">Test rápido de 20</button>' +
      '<button class="ldl-btn sec" data-acc="ir" data-v="simulacro" type="button">Simulacro de examen</button>' +
      (f ? '<button class="ldl-btn sec" data-acc="repasar" type="button">Repasar ' + f + " fallos</button>" : "") +
      "</div></section>" +
      '<section class="ldl-card"><h3>Cómo sacarle partido</h3><ol class="ldl-muted">' +
      "<li>Practica <b>por temas</b>: cada respuesta te enseña el artículo y por qué fallan las demás opciones.</li>" +
      "<li>Cada pocos días, <b>repasa tus fallos</b>: es donde más se aprende.</li>" +
      "<li>Antes del examen, haz <b>simulacros</b> con tiempo y con la penalización real (cada error resta 1/3).</li></ol>" +
      '<p class="ldl-small ldl-muted">Tu progreso se guarda en este dispositivo y en este navegador.</p></section>' + historial();
  }
  function historial() {
    if (!prog.h.length) return "";
    return '<section class="ldl-card"><h3>Últimos tests</h3><ul class="ldl-revision">' + prog.h.slice(0, 5).map(function (h) {
      var d = new Date(h.t);
      return "<li><b>" + (h.tipo === "simulacro" ? "Simulacro" : "Práctica") + "</b> · " + d.toLocaleDateString("es-ES") +
        " · " + h.a + "/" + h.n + " aciertos" + (h.tipo === "simulacro" ? " · nota " + num(h.nota) : "") + "</li>";
    }).join("") + "</ul></section>";
  }
  function vTemas() {
    var html = '<section class="ldl-card"><h2>Practicar por temas</h2><p class="ldl-muted">Elige un bloque. Las preguntas salen en orden aleatorio y se corrigen al momento.</p><ul class="ldl-bloques">';
    B.bloques.forEach(function (b) {
      var lista = delBloque(b.id), r = resumen(lista);
      html += '<li><button type="button" data-acc="bloque" data-id="' + esc(b.id) + '"><span class="t">' + esc(b.nombre) +
        '</span><span class="n">' + r.vistas + "/" + r.total + (r.vistas ? " · " + r.acierto + " %" : "") + "</span>" +
        '<span class="ldl-barra"><i style="width:' + pct(r.vistas, r.total) + '%"></i></span></button></li>';
    });
    return html + "</ul></section>";
  }
  function vSimulacro() {
    var total = B.preguntas.length;
    var opcionesN = [10, 20, 30, 50, 100].filter(function (n) { return n < total; });
    opcionesN.push(total);
    var porDefecto = Math.min((CFG.simulacro && CFG.simulacro.preguntas) || 30, total);
    return '<section class="ldl-card"><h2>Simulacro de examen</h2>' +
      '<p class="ldl-muted">Como el día del examen: no ves las soluciones hasta el final y cada error resta un tercio de acierto.</p>' +
      '<div class="ldl-campo"><label for="ldl-n">Número de preguntas</label><select id="ldl-n">' +
      opcionesN.map(function (n) { return "<option" + (n === porDefecto ? " selected" : "") + ">" + n + "</option>"; }).join("") +
      '</select></div><div class="ldl-campo"><label for="ldl-t">Tiempo</label><select id="ldl-t">' +
      '<option value="1">1 minuto por pregunta</option><option value="0">Sin límite de tiempo</option></select></div>' +
      '<div class="ldl-campo"><label for="ldl-b">Temas</label><select id="ldl-b"><option value="">Todos</option>' +
      B.bloques.map(function (b) { return '<option value="' + esc(b.id) + '">' + esc(b.nombre) + "</option>"; }).join("") +
      '</select></div><div class="ldl-acciones"><button class="ldl-btn" data-acc="simular" type="button">Empezar simulacro</button></div></section>';
  }
  function vFallos() {
    var f = fallosPendientes();
    if (!f.length) {
      return '<section class="ldl-card"><h2>Repaso de fallos</h2><p class="ldl-muted">No tienes fallos pendientes. Cuando falles una pregunta aparecerá aquí hasta que la aciertes.</p></section>';
    }
    return '<section class="ldl-card"><h2>Repaso de fallos</h2><p class="ldl-muted">Tienes <b>' + f.length +
      "</b> preguntas falladas. Salen de aquí en cuanto las aciertas.</p>" +
      '<div class="ldl-acciones"><button class="ldl-btn" data-acc="repasar" type="button">Repasar ahora</button></div></section>';
  }
  function vStats() {
    var html = '<section class="ldl-card"><h2>Estadísticas</h2><ul class="ldl-bloques">';
    B.bloques.forEach(function (b) {
      var r = resumen(delBloque(b.id));
      html += '<li><button type="button" data-acc="bloque" data-id="' + esc(b.id) + '"><span class="t">' + esc(b.nombre) +
        '</span><span class="n">' + (r.vistas ? r.acierto + " % de acierto" : "sin empezar") + '</span><span class="ldl-barra"><i style="width:' +
        r.acierto + '%"></i></span></button></li>';
    });
    html += '</ul></section><section class="ldl-card"><h3>Empezar de cero</h3><p class="ldl-muted ldl-small">Borra tu progreso guardado en este dispositivo.</p>' +
      '<div class="ldl-acciones"><button class="ldl-btn sec" data-acc="borrar" type="button">Borrar mi progreso</button></div></section>';
    return html;
  }
  function vPortada() {
    var n = B.preguntas.length;
    return '<section class="ldl-card"><h2>' + esc(CFG.pack.nombre) + "</h2>" +
      '<p class="ldl-muted">' + n + " preguntas tipo examen, corregidas al momento, con el artículo exacto y la explicación de cada opción. Gratis y sin registrarte.</p>" +
      '<div class="ldl-acciones"><button class="ldl-btn" data-acc="empezarweb" type="button">Empezar el test</button></div></section>';
  }

  function vTest() {
    var id = sesion.ids[sesion.i], p = POR_ID[id], sim = sesion.tipo === "simulacro";
    var elegida = sesion.resp[id], corregida = !sim && sesion.corregida[id];
    var html = '<section class="ldl-card"><div class="ldl-meta"><span>' + esc(sesion.titulo) + " · " + (sesion.i + 1) + " de " + sesion.ids.length +
      "</span><span>" + (sesion.limite ? '⏱ <span id="ldl-crono" class="ldl-crono">' +
        mmss(Math.max(0, sesion.limite - Math.floor((Date.now() - sesion.inicio) / 1000))) + "</span>" : esc(p.articulo_txt)) +
      '</span></div><div class="ldl-progreso"><i style="width:' + pct(sesion.i + (corregida ? 1 : 0), sesion.ids.length) + '%"></i></div>' +
      '<p class="ldl-enunciado">' + esc(p.enunciado) + '</p><div class="ldl-opciones" role="group" aria-label="Opciones">';
    LETRAS.forEach(function (l) {
      var cls = "ldl-op";
      if (corregida) { if (l === p.correcta) cls += " ok"; else if (l === elegida) cls += " ko"; }
      else if (sim && elegida === l) cls += " marcada";
      html += '<button type="button" class="' + cls + '" data-acc="resp" data-l="' + l + '"' + (corregida ? " disabled" : "") +
        (sim ? ' aria-pressed="' + (elegida === l) + '"' : "") + '><span class="l">' + l + ")</span><span>" + esc(p.opciones[l]) + "</span></button>";
    });
    html += "</div>";
    if (corregida) html += feedback(p, elegida);
    html += '<div class="ldl-acciones">';
    if (sim) {
      html += (sesion.i > 0 ? '<button class="ldl-btn sec" data-acc="ant" type="button">Anterior</button>' : "") +
        '<button class="ldl-btn" data-acc="sig" type="button">' + (sesion.i < sesion.ids.length - 1 ? "Siguiente" : "Entregar") + "</button>" +
        (sesion.i < sesion.ids.length - 1 ? '<button class="ldl-btn sec" data-acc="entregar" type="button">Entregar ya</button>' : "");
    } else if (corregida) {
      html += '<button class="ldl-btn" data-acc="sig" type="button">' + (sesion.i < sesion.ids.length - 1 ? "Siguiente" : "Ver resultado") + "</button>";
    }
    html += '<button class="ldl-btn sec" data-acc="salir" type="button">Salir</button></div></section>';
    return html;
  }
  function feedback(p, elegida) {
    var bien = elegida === p.correcta;
    return '<div class="ldl-feedback" aria-live="polite"><div class="v ' + (bien ? "ok" : "ko") + '">' +
      (bien ? "¡Correcta!" : "Incorrecta. La respuesta correcta es la " + p.correcta + ")") + "</div><div>" + esc(p.explicacion) + "</div>" +
      (p.cita ? '<blockquote class="ldl-cita">' + esc(p.cita) + "<small>" + esc(p.articulo_txt) + "</small></blockquote>" : "") + "</div>";
  }
  function vResultado() {
    var r = calcular(sesion), sim = sesion.tipo === "simulacro";
    var html = '<section class="ldl-card"><h2>' + (sim ? "Resultado del simulacro" : "Resultado") + "</h2>" +
      '<div class="ldl-nota">' + (sim ? num(r.nota.toFixed(2)) : r.aciertos + "/" + r.total) + "</div>" +
      '<p class="ldl-muted">' + plural(r.aciertos, "acierto", "aciertos") + " · " + plural(r.errores, "error", "errores") +
      (r.blancos ? " · " + r.blancos + " en blanco" : "") +
      (sim ? " · nota sobre 10 con penalización" : "") + "</p>";
    if (CFG.modo === "web") html += ctaWeb(r);
    html += '<div class="ldl-acciones">' + (CFG.modo === "web" ? '<button class="ldl-btn sec" data-acc="empezarweb" type="button">Repetir con otro orden</button>' :
      '<button class="ldl-btn" data-acc="ir" data-v="inicio" type="button">Volver al inicio</button>') + "</div></section>";
    html += '<section class="ldl-card"><h3>Revisión</h3><ul class="ldl-revision">';
    sesion.ids.forEach(function (id, n) {
      var p = POR_ID[id], e = sesion.resp[id], chip = !e ? '<span class="ldl-chip nr">En blanco</span>' :
        e === p.correcta ? '<span class="ldl-chip ok">Bien</span>' : '<span class="ldl-chip ko">Mal</span>';
      html += "<li>" + chip + '<span class="e">' + (n + 1) + ". " + esc(p.enunciado) + "</span><br>" +
        '<span class="ldl-small">Correcta: <b>' + p.correcta + ") " + esc(p.opciones[p.correcta]) + "</b>" +
        (e && e !== p.correcta ? " · Marcaste " + e + ")" : "") + '</span><br><span class="ldl-small ldl-muted">' + esc(p.explicacion) + "</span></li>";
    });
    return html + "</ul></section>";
  }
  function ctaWeb() {
    var c = CFG.compra || {}, html = "";
    if (c.url) {
      html += '<div class="ldl-card ldl-cta"><h3>' + esc(c.titulo) + '</h3><p class="ldl-muted">' + esc(c.texto) + "</p>" +
        '<div class="ldl-acciones"><a class="ldl-btn acc" href="' + esc(c.url) + '">' + esc(c.boton) + "</a></div></div>";
    }
    if (CFG.telegram) {
      html += '<p class="ldl-small">¿Quieres un test cada día? <a href="' + esc(CFG.telegram) + '">Únete gratis al canal de Telegram</a>.</p>';
    }
    return html;
  }

  function pintar() {
    var cuerpo;
    if (vista === "test") cuerpo = vTest();
    else if (vista === "resultado") cuerpo = vResultado();
    else if (vista === "portada") cuerpo = vPortada();
    else if (vista === "temas") cuerpo = vTemas();
    else if (vista === "simulacro") cuerpo = vSimulacro();
    else if (vista === "fallos") cuerpo = vFallos();
    else if (vista === "stats") cuerpo = vStats();
    else cuerpo = vInicio();
    raiz.innerHTML = '<div class="ldl">' + cabecera() + navegacion() + "<main>" + cuerpo + "</main>" + pie() + "</div>";
  }

  /* ---------- eventos ---------- */
  raiz.addEventListener("click", function (ev) {
    var el = ev.target.closest("[data-acc]");
    if (!el) return;
    var acc = el.getAttribute("data-acc");
    if (acc === "tema") return cambiarTema();
    if (acc === "ir") { pararReloj(); vista = el.getAttribute("data-v"); sesion = null; pintar(); return; }
    if (acc === "rapido") return empezar("practica", barajar(B.preguntas).slice(0, 20), { titulo: "Test rápido" });
    if (acc === "repasar") return empezar("practica", barajar(fallosPendientes()).slice(0, 30), { titulo: "Repaso de fallos" });
    if (acc === "bloque") {
      var b = B.bloques.filter(function (x) { return x.id === el.getAttribute("data-id"); })[0];
      return empezar("practica", barajar(delBloque(b.id)), { titulo: b.nombre });
    }
    if (acc === "simular") {
      var n = parseInt(document.getElementById("ldl-n").value, 10);
      var conTiempo = document.getElementById("ldl-t").value === "1";
      var bloque = document.getElementById("ldl-b").value;
      var fuente = bloque ? delBloque(bloque) : B.preguntas;
      var elegidas = barajar(fuente).slice(0, n);
      return empezar("simulacro", elegidas, { titulo: "Simulacro", minutos: conTiempo ? elegidas.length : 0 });
    }
    if (acc === "empezarweb") return empezar("practica", barajar(B.preguntas), { titulo: "Test gratuito" });
    if (acc === "resp") return responder(el.getAttribute("data-l"));
    if (acc === "sig") return siguiente();
    if (acc === "ant") return anterior();
    if (acc === "entregar") return terminar();
    if (acc === "salir") { pararReloj(); sesion = null; vista = CFG.modo === "web" ? "portada" : "inicio"; pintar(); return; }
    if (acc === "borrar") {
      if (el.getAttribute("data-confirmar") === "1") { prog = { p: {}, h: [] }; guardar(); pintar(); }
      else { el.setAttribute("data-confirmar", "1"); el.textContent = "Pulsa otra vez para confirmar"; }
    }
  });
  document.addEventListener("keydown", function (ev) {
    if (vista !== "test" || !sesion || ev.altKey || ev.ctrlKey || ev.metaKey) return;
    var k = ev.key.toLowerCase(), mapa = { "1": "a", "2": "b", "3": "c", "4": "d", a: "a", b: "b", c: "c", d: "d" };
    if (mapa[k]) { ev.preventDefault(); responder(mapa[k]); }
    else if (k === "enter" || k === "arrowright") {
      var id = sesion.ids[sesion.i];
      if (sesion.tipo === "simulacro" || sesion.corregida[id]) { ev.preventDefault(); siguiente(); }
    } else if (k === "arrowleft" && sesion.tipo === "simulacro") { ev.preventDefault(); anterior(); }
  });

  pintar();
})();
</script>
</body>
</html>
