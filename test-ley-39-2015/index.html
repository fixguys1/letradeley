<style>
/* Letra de Ley — motor de test (app de pago y test gratuito de la web) */
:root {
  --bg: #f7f6f2;
  --surface: #ffffff;
  --surface-2: #f0eee8;
  --ink: #1b2440;
  --text: #1f2328;

  --line: #dcd8cf;
  --primary: #1d3a7a;
  --primary-ink: #ffffff;
  --accent: #b4540c;
  --ok: #17803d;
  --ok-bg: #e7f5ec;
  --ko: #b42318;
  --ko-bg: #fdecea;

  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1320; --surface: #161d2e; --surface-2: #1d2639; --ink: #e8ecf6; --text: #e6e7ea;
    --muted: #a3a9b8; --line: #2b3550; --primary: #8fb0ff; --primary-ink: #0e1320; --accent: #f0a04b;
    --ok: #4ade80; --ok-bg: #12301f; --ko: #f87171; --ko-bg: #3a1717; --focus: #8fb0ff;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1320; --surface: #161d2e; --surface-2: #1d2639; --ink: #e8ecf6; --text: #e6e7ea;
  --muted: #a3a9b8; --line: #2b3550; --primary: #8fb0ff; --primary-ink: #0e1320; --accent: #f0a04b;
  --ok: #4ade80; --ok-bg: #12301f; --ko: #f87171; --ko-bg: #3a1717; --focus: #8fb0ff;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text); font: 16px/1.55 var(--sans);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
.ldl { max-width: 760px; margin: 0 auto; padding: 16px 16px 48px; }
.ldl a { color: var(--primary); }
.ldl :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 8px; }

/* Cabecera */
.ldl-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.ldl-brand { display: flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; }
.ldl-logo {
  width: 36px; height: 36px; border-radius: 10px; background: var(--ink); color: var(--bg);
  display: grid; place-items: center; font: 700 22px/1 var(--serif);
}
.ldl-brand b { font: 700 19px/1.1 var(--serif); letter-spacing: .2px; }
.ldl-brand small { display: block; color: var(--muted); font: 12px/1.2 var(--sans); }
.ldl-tema {
  border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 999px;
  padding: 6px 12px; font: 13px var(--sans); cursor: pointer;
}

/* Navegación */
.ldl-nav { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 16px; scrollbar-width: none; }
.ldl-nav button {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface); color: var(--text);
  border-radius: 999px; padding: 8px 14px; font: 600 14px var(--sans); cursor: pointer;
}
.ldl-nav button[aria-current="page"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* Tarjetas */
.ldl-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; margin-bottom: 14px; }
.ldl-card h2 { font: 700 22px/1.25 var(--serif); color: var(--ink); margin: 0 0 8px; }
.ldl-card h3 { font: 700 17px/1.3 var(--sans); color: var(--ink); margin: 0 0 6px; }
.ldl-muted { color: var(--muted); }
.ldl-small { font-size: 13px; }

.ldl-kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 12px 0 4px; }
.ldl-kpi { background: var(--surface-2); border-radius: 12px; padding: 12px; text-align: center; }
.ldl-kpi b { display: block; font: 700 24px/1.1 var(--sans); color: var(--ink); font-variant-numeric: tabular-nums; }
.ldl-kpi span { font-size: 12px; color: var(--muted); }

/* Botones */
.ldl-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; cursor: pointer;
  background: var(--primary); color: var(--primary-ink); font: 700 15px var(--sans); padding: 12px 18px;
  border-radius: 12px; text-decoration: none; min-height: 44px;
}
.ldl-btn.sec { background: var(--surface-2); color: var(--ink); }
.ldl-btn.acc { background: var(--accent); color: #fff; }
.ldl-btn[disabled] { opacity: .5; cursor: default; }
.ldl-acciones { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }

/* Lista de bloques */
.ldl-bloques { list-style: none; margin: 0; padding: 0; }
.ldl-bloques li { border-top: 1px solid var(--line); }
.ldl-bloques li:first-child { border-top: 0; }
.ldl-bloques button {
  width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; text-align: left;
  background: none; border: 0; color: var(--text); padding: 14px 4px; cursor: pointer; font: inherit;
}
.ldl-bloques .t { font-weight: 600; color: var(--ink); }
.ldl-bloques .n { color: var(--muted); font-size: 13px; }
.ldl-barra { grid-column: 1 / -1; height: 6px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
.ldl-barra i { display: block; height: 100%; background: var(--ok); }

/* Pregunta */
.ldl-meta { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 13px; margin-bottom: 10px; }
.ldl-progreso { height: 6px; border-radius: 6px; background: var(--surface-2); overflow: hidden; margin-bottom: 16px; }
.ldl-progreso i { display: block; height: 100%; background: var(--primary); transition: width .2s; }
.ldl-enunciado { font: 600 18px/1.45 var(--sans); color: var(--ink); margin: 0 0 16px; }
.ldl-opciones { display: grid; gap: 10px; }
.ldl-op {
  display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start; text-align: left; width: 100%;
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px; cursor: pointer;
  color: var(--text); font: 16px/1.45 var(--sans);
}
.ldl-op:hover:not([disabled]) { border-color: var(--primary); }
.ldl-op .l {
  width: 30px; height: 30px; border-radius: 8px; background: var(--surface-2); display: grid; place-items: center;
  font-weight: 700; color: var(--ink); text-transform: lowercase;
}
.ldl-op[disabled] { cursor: default; }
.ldl-op.ok { border-color: var(--ok); background: var(--ok-bg); }
.ldl-op.ok .l { background: var(--ok); color: #fff; }
.ldl-op.ko { border-color: var(--ko); background: var(--ko-bg); }
.ldl-op.ko .l { background: var(--ko); color: #fff; }
.ldl-op.marcada { border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); }
.ldl-feedback { margin-top: 16px; border-radius: 12px; padding: 14px 16px; background: var(--surface-2); }
.ldl-feedback .v { font-weight: 700; margin-bottom: 6px; }
.ldl-feedback .v.ok { color: var(--ok); }
.ldl-feedback .v.ko { color: var(--ko); }
.ldl-cita { margin: 10px 0 0; padding: 10px 12px; border-left: 3px solid var(--accent); background: var(--surface); border-radius: 0 8px 8px 0; font: italic 15px/1.5 var(--serif); }
.ldl-cita small { display: block; font: 600 12px var(--sans); font-style: normal; color: var(--muted); margin-top: 6px; }

/* Resultados */
.ldl-nota { font: 800 54px/1 var(--sans); color: var(--ink); font-variant-numeric: tabular-nums; }
.ldl-revision { list-style: none; padding: 0; margin: 12px 0 0; }
.ldl-revision li { border-top: 1px solid var(--line); padding: 12px 0; }
.ldl-revision .e { font-weight: 600; color: var(--ink); }
.ldl-chip { display: inline-block; font: 700 12px var(--sans); border-radius: 999px; padding: 2px 8px; margin-right: 6px; }
.ldl-chip.ok { background: var(--ok-bg); color: var(--ok); }
.ldl-chip.ko { background: var(--ko-bg); color: var(--ko); }
.ldl-chip.nr { background: var(--surface-2); color: var(--muted); }

/* Formularios */
.ldl-campo { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; margin: 10px 0; }
.ldl-campo label { font-weight: 600; font-size: 14px; }
.ldl-campo select, .ldl-campo input {
  font: 16px var(--sans); padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface); color: var(--text); width: 100%; max-width: 100%; min-width: 0; text-overflow: ellipsis;
}
.ldl-cta { border: 2px solid var(--accent); }
.ldl-pie { text-align: center; color: var(--muted); font-size: 12px; margin-top: 24px; }
.ldl-crono { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--ink); }

@media (max-width: 480px) {
  .ldl-enunciado { font-size: 17px; }
  .ldl-kpi b { font-size: 20px; }
  .ldl-nota { font-size: 44px; }
}
@media print { .ldl-nav, .ldl-tema, .ldl-acciones { display: none; } }
</style>
