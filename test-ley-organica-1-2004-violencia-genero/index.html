.ldl-chip.ko { background: var(--ko-bg); color: var(--ko); }

  background: var(--surface); color: var(--text); width: 100%; max-width: 100%; min-width: 0; text-overflow: ellipsis;
}

@media print { .ldl-nav, .ldl-tema, .ldl-acciones { display: none; } }

II. Derechos laborales y prestaciones de la Seguridad Social","ley":"LOVG","nombre":"Título II. Derechos de las mujeres víctimas de violencia de género · Capítulo II. Derechos laborales y prestaciones de la Seguridad Social"},{"id":"LOVG|Título II. Derechos de las mujeres víctimas de violencia de género · Capítulo III. Derechos de las funcionarias públicas","ley":"LOVG","nombre":"Título II. Derechos de las mujeres víctimas de violencia de género · Capítulo III. Derechos de las funcionarias públicas"},{"id":"LOVG|Título II. Derechos de las mujeres víctimas de violencia de género · Capítulo IV. Derechos económicos","ley":"LOVG","nombre":"Título II. Derechos de las mujeres víctimas de violencia de género · Capítulo IV. Derechos económicos"},{"id":"LOVG|Título II. Derechos de las mujeres víctimas de violencia de género · Capítulo V. Derecho a la reparación","ley":"LOVG","nombre":"Título II. Derechos de las mujeres víctimas de violencia de género · Capítulo V. Derecho a la reparación"},{"id":"LOVG|Título III. Tutela Institucional","ley":"LOVG","nombre":"Título III. Tutela Institucional"},{"id":"LOVG|Título IV. Tutela Penal","ley":"LOVG","nombre":"Título IV. Tutela Penal"},{"id":"LOVG|Título V. Tutela Judicial · Capítulo I. De los Juzgados de Violencia sobre la Mujer","ley":"LOVG","nombre":"Título V. Tutela Judicial · Capítulo I. De los Juzgados de Violencia sobre la Mujer"},{"id":"LOVG|Título V. Tutela Judicial · Capítulo II. Normas procesales civiles","ley":"LOVG","nombre":"Título V. Tutela Judicial · Capítulo II. Normas procesales civiles"},{"id":"LOVG|Título V. Tutela Judicial · Capítulo III. Normas procesales penales","ley":"LOVG","nombre":"Título V. Tutela Judicial · Capítulo III. Normas procesales penales"},{"id":"LOVG|Título V. Tutela Judicial · Capítulo IV. Medidas judiciales de protección y de seguridad de las víctimas","ley":"LOVG","nombre":"Título V. Tutela Judicial · Capítulo IV. Medidas judiciales de protección y de seguridad de las víctimas"},{"id":"LOVG|Título V. Tutela Judicial · Capítulo V. Del Fiscal contra la Violencia sobre la Mujer","ley":"LOVG","nombre":"Título V. Tutela Judicial · Capítulo V. Del Fiscal contra la Violencia sobre la Mujer"},{"id":"LOVG|Disposiciones adicionales","ley":"LOVG","nombre":"Disposiciones adicionales"},{"id":"LOVG|Disposición derogatoria","ley":"LOVG","nombre":"Disposición derogatoria"},{"id":"LOVG|Disposiciones finales","ley":"LOVG","nombre":"Disposiciones finales"}],"preguntas":[{"id":"LOVG-L1-002","ley":"LOVG","articulo":"1.2","articulo_txt":"Art. 1.2 LO 1/2004","bloque_id":"LOVG|Título preliminar","enunciado":"Según el artículo 1.2 de la Ley Orgánica 1/2004, las medidas de protección integral que establece la ley tienen, entre otras finalidades, la de prestar asistencia a las mujeres víctimas de esta violencia y también:","opciones":{"a":"A sus hijos e hijas, cualquiera que sea su edad, y a sus ascendientes, víctimas de esta violencia.","b":"A sus hijos menores y a los menores sujetos a su tutela, o guarda y custodia, víctimas de esta violencia.","c":"A sus hijos menores y a los demás familiares que convivan con ellas, víctimas de esta violencia.","d":"A sus hijos menores, a sus ascendientes y a las personas con discapacidad a su cargo, víctimas de esta violencia."},"correcta":"b","explicacion":"El art. 1.2 señala como finalidad prestar asistencia «a las mujeres, a sus hijos menores y a los menores sujetos a su tutela, o guarda y custodia, víctimas de esta violencia»: opción b). El apartado no menciona a los demás familiares convivientes, como dice la opción c), ni a los hijos de cualquier edad o a los ascendientes, como dicen las opciones a) y d), ni a las personas con discapacidad a cargo de la mujer. Nota BOE: el apartado 2 fue modificado por la disposición final 3.1 de la Ley Orgánica 8/2015, de 22 de julio.","cita":"«2. Por esta ley se establecen medidas de protección integral cuya finalidad es prevenir, sancionar y erradicar esta violencia y prestar asistencia a las mujeres, a sus hijos menores y a los menores sujetos a su tutela, o guarda y custodia, víctimas de esta violencia.»","dificultad":2},{"id":"LOVG-L1-003","ley":"LOVG","articulo":"1.4","articulo_txt":"Art. 1.4 LO 1/2004","bloque_id":"LOVG|Título preliminar","enunciado":"Según el artículo 1.4 de la Ley Orgánica 1/2004, la violencia de género a que se refiere esa ley también comprende la que, con el objetivo de causar perjuicio o daño a las mujeres, ejerzan las personas indicadas en el apartado primero sobre:","opciones":{"a":"Sus familiares o allegados menores de edad.","b":"Sus familiares o allegados, cualquiera que sea su edad.","c":"Sus ascendientes que convivan con ellas.","d":"Sus familiares mayores de edad que dependan de ellas."},"correcta":"a","explicacion":"El art. 1.4 extiende el concepto a la violencia que, con ese objetivo, se ejerza «sobre sus familiares o allegados menores de edad»: opción a). La opción b) prescinde del requisito de la minoría de edad. Las opciones c) y d) sustituyen a los familiares o allegados menores de edad por círculos de personas que el apartado no menciona. Nota BOE: el apartado 4 fue añadido por la disposición final 10 de la Ley Orgánica 8/2021, de 4 de junio.","cita":"«4. La violencia de género a que se refiere esta Ley también comprende la violencia que con el objetivo de causar perjuicio o daño a las mujeres se ejerza sobre sus familiares o allegados menores de edad por parte de las personas indicadas en el apartado primero.»","dificultad":2},{"id":"LOVG-L1-006","ley":"LOVG","articulo":"3.1","articulo_txt":"Art. 3.1 LO 1/2004","bloque_id":"LOVG|Título I. Medidas de sensibilización, prevención y detección","enunciado":"Según el artículo 3.1 de la Ley Orgánica 1/2004, el Plan Estatal de Sensibilización y Prevención de la Violencia de Género que se pondrá en marcha desde la responsabilidad del Gobierno del Estado, con la consiguiente dotación presupuestaria, tendrá carácter:","opciones":{"a":"Bienal.","b":"Cuatrienal.","c":"Plurianual, con la duración que fije el propio Plan.","d":"Permanente."},"correcta":"d","explicacion":"El art. 3.1 prevé un Plan Estatal de Sensibilización y Prevención de la Violencia de Género «con carácter permanente»: opción d). El artículo no fija una vigencia de cuatro o dos años, como dicen las opciones b) y a), ni remite su duración al propio Plan, como dice la opción c). Nota BOE: el art. 3 fue modificado, con efectos desde el 7 de octubre de 2022, por la disposición final 9.1 de la Ley Orgánica 10/2022, de 6 de septiembre.","cita":"«1. Desde la responsabilidad del Gobierno del Estado y de manera inmediata a la entrada en vigor de esta ley, con la consiguiente dotación presupuestaria, se pondrá en marcha un Plan Estatal de Sensibilización y Prevención de la Violencia de Género con carácter permanente que como mínimo recoja los siguientes elementos:»","dificultad":1},{"id":"LOVG-L1-007","ley":"LOVG","articulo":"3.1","articulo_txt":"Art. 3.1 LO 1/2004","bloque_id":"LOVG|Título I. Medidas de sensibilización, prevención y detección","enunciado":"Según el artículo 3.1 de la Ley Orgánica 1/2004, la Delegación del Gobierno contra la Violencia de Género, oída la Comisión de amplia participación que controla el Plan Estatal de Sensibilización y Prevención de la Violencia de Género, elaborará el Informe anual de evaluación de ese Plan y lo remitirá:","opciones":{"a":"Al Consejo de Estado.","b":"Al Consejo de Ministros.","c":"A las Cortes Generales.","d":"A la Conferencia Sectorial de Igualdad."},"correcta":"c","explicacion":"El art. 3.1, párrafo final, dispone que la Delegación del Gobierno contra la Violencia de Género elaborará el Informe anual de evaluación del Plan Estatal «y lo remitirá a las Cortes Generales»: opción c). El precepto no prevé su remisión al Consejo de Ministros, a la Conferencia Sectorial de Igualdad ni al Consejo de Estado, opciones b), d) y a). Nota BOE: párrafo en la redacción dada por la disposición final 9.1 de la Ley Orgánica 10/2022, de 6 de septiembre.","cita":"«La Delegación del Gobierno contra la Violencia de Género, oída la Comisión a la que se refiere el párrafo anterior, elaborará el Informe anual de evaluación del Plan Estatal de Sensibilización y Prevención de la Violencia de Género y lo remitirá a las Cortes Generales.»","dificultad":2},{"id":"LOVG-L1-010","ley":"LOVG","articulo":"5","articulo_txt":"Art. 5 LO 1/2004","bloque_id":"LOVG|Título I. Medidas de sensibilización, prevención y detección · Capítulo I. En el ámbito educativo","enunciado":"Según la Ley Orgánica 1/2004, las Administraciones competentes deberán prever la escolarización inmediata de los hijos que se vean afectados por:","opciones":{"a":"Un cambio de residencia derivada de actos de violencia de género.","b":"La apertura de diligencias penales por violencia de género contra el progenitor.","c":"Una resolución judicial que atribuya a la madre la guarda y custodia en un procedimiento por violencia de género.","d":"Una situación de absentismo escolar derivada de actos de violencia de género."},"correcta":"a","explicacion":"El art. 5 obliga a las Administraciones competentes a prever la escolarización inmediata de los hijos «que se vean afectados por un cambio de residencia derivada de actos de violencia de género»: opción a). El artículo no vincula esa previsión a una resolución sobre la guarda y custodia, opción c), al absentismo escolar, opción d), ni a la apertura de diligencias penales, opción b).","cita":"«Las Administraciones competentes deberán prever la escolarización inmediata de los hijos que se vean afectados por un cambio de residencia derivada de actos de violencia de género.»","dificultad":1},{"id":"LOVG-L1-012","ley":"LOVG","articulo":"7.c)","articulo_txt":"Art. 7.c) LO 1/2004","bloque_id":"LOVG|Título I. Medidas de sensibilización, prevención y detección · Capítulo I. En el ámbito educativo","enunciado":"Según el artículo 7 de la Ley Orgánica 1/2004, la formación específica en materia de igualdad que se incluya en los planes de formación inicial y permanente del profesorado debe habilitarles, entre otros fines, para la detección precoz de la violencia en el ámbito familiar, especialmente sobre:","opciones":{"a":"Las personas menores de edad y las personas con discapacidad.","b":"Las personas dependientes y quienes las cuidan.","c":"Las personas mayores y las personas con discapacidad.","d":"La mujer y los hijos e hijas."},"correcta":"d","explicacion":"El art. 7.c) se refiere a «La detección precoz de la violencia en el ámbito familiar, especialmente sobre la mujer y los hijos e hijas»: opción d). Las opciones c), b) y a) mencionan colectivos que el art. 7.c) no destaca.","cita":"«c) La detección precoz de la violencia en el ámbito familiar, especialmente sobre la mujer y los hijos e hijas.»","dificultad":1},{"id":"LOVG-L1-015","ley":"LOVG","articulo":"10","articulo_txt":"Art. 10 LO 1/2004","bloque_id":"LOVG|Título I. Medidas de sensibilización, prevención y detección · Capítulo II. En el ámbito de la publicidad y de los medios de comunicación","enunciado":"Según el artículo 10 de la Ley Orgánica 1/2004, de acuerdo con lo establecido en la Ley 34/1988, de 11 de noviembre, General de Publicidad, la publicidad que utilice la imagen de la mujer con carácter vejatorio o discriminatorio se considerará:","opciones":{"a":"Publicidad engañosa.","b":"Publicidad desleal.","c":"Publicidad ilícita.","d":"Publicidad agresiva."},"correcta":"c","explicacion":"El art. 10 dispone que, de acuerdo con lo establecido en la Ley 34/1988, General de Publicidad, «se considerará ilícita la publicidad que utilice la imagen de la mujer con carácter vejatorio o discriminatorio»: opción c). El art. 10 no emplea las calificaciones de publicidad engañosa, desleal o agresiva de las opciones a), b) y d).","cita":"«De acuerdo con lo establecido en la Ley 34/1988, de 11 de noviembre, General de Publicidad, se considerará ilícita la publicidad que utilice la imagen de la mujer con carácter vejatorio o discriminatorio.»","dificultad":1},{"id":"LOVG-L1-017","ley":"LOVG","articulo":"12","articulo_txt":"Art. 12 LO 1/2004","bloque_id":"LOVG|Título I. Medidas de sensibilización, prevención y detección · Capítulo II. En el ámbito de la publicidad y de los medios de comunicación","enunciado":"Según el artículo 12 de la Ley Orgánica 1/2004, ¿cuál de los siguientes NO figura entre los legitimados para ejercitar ante los Tribunales la acción de cesación prevista en ese artículo?","opciones":{"a":"El Ministerio Fiscal.","b":"El Defensor del Pueblo.","c":"La Delegación Especial del Gobierno contra la Violencia sobre la Mujer.","d":"Las asociaciones que tengan como objetivo único la defensa de los intereses de la mujer."},"correcta":"b","explicacion":"El art. 12 legitima a la Delegación Especial del Gobierno contra la Violencia sobre la Mujer, al Instituto de la Mujer u órgano equivalente de cada Comunidad Autónoma, al Ministerio Fiscal y a las asociaciones que tengan como objetivo único la defensa de los intereses de la mujer; no menciona al Defensor del Pueblo: opción b). Las opciones a), c) y d) sí figuran en el art. 12. El art. 12 conserva las denominaciones «Delegación Especial del Gobierno contra la Violencia sobre la Mujer» e «Instituto de la Mujer»; los arts. 3.1 y 29, en la redacción dada por la Ley Orgánica 10/2022, se refieren a la «Delegación del Gobierno contra la Violencia de Género».","cita":"«La Delegación Especial del Gobierno contra la Violencia sobre la Mujer, el Instituto de la Mujer u órgano equivalente de cada Comunidad Autónoma, el Ministerio Fiscal y las Asociaciones que tengan como objetivo único la defensa de los intereses de la mujer estarán legitimados para ejercitar ante los Tribunales la acción de cesación de publicidad ilícita por utilizar en forma vejatoria la imagen de la mujer, en los términos de la Ley 34/1988, de 11 de noviembre, General de Publicidad.»","dificultad":2},{"id":"LOVG-L1-020","ley":"LOVG","articulo":"15.4","articulo_txt":"Art. 15.4 LO 1/2004","bloque_id":"LOVG|Título I. Medidas de sensibilización, prevención y detección · Capítulo III. En el ámbito sanitario","enunciado":"Según el artículo 15.4 de la Ley Orgánica 1/2004, ¿dónde se contemplará un apartado de prevención e intervención integral en violencia de género?","opciones":{"a":"En los protocolos de actuación sanitaria que apruebe cada Comunidad Autónoma.","b":"En la cartera común de servicios del Sistema Nacional de Salud.","c":"En los Planes Nacionales de Salud que procedan.","d":"En el Plan Estatal de Sensibilización y Prevención de la Violencia de Género."},"correcta":"c","explicacion":"El art. 15.4 dispone que «En los Planes Nacionales de Salud que procedan se contemplará un apartado de prevención e intervención integral en violencia de género»: opción c). El Plan Estatal de la opción d) es el de sensibilización del art. 3, cuyo contenido mínimo es otro. Las opciones a) y b) no figuran en el art. 15.4.","cita":"«4. En los Planes Nacionales de Salud que procedan se contemplará un apartado de prevención e intervención integral en violencia de género.»","dificultad":1},{"id":"LOVG-L1-021","ley":"LOVG","articulo":"16","articulo_txt":"Art. 16 LO 1/2004","bloque_id":"LOVG|Título I. Medidas de sensibilización, prevención y detección · Capítulo III. En el ámbito sanitario","enunciado":"Según el artículo 16 de la Ley Orgánica 1/2004, la Comisión contra la Violencia de Género del Consejo Interterritorial del Sistema Nacional de Salud estará compuesta por:","opciones":{"a":"Representantes de las Comunidades Autónomas y de las sociedades científicas del ámbito sanitario.","b":"Representantes de todas las Comunidades Autónomas con competencia en la materia.","c":"Profesionales sanitarios de reconocido prestigio designados por el Pleno del Consejo Interterritorial.","d":"Representantes de la Administración General del Estado y de las Comunidades Autónomas, en régimen paritario."},"correcta":"b","explicacion":"El art. 16, párrafo segundo, dispone que esa Comisión «estará compuesta por representantes de todas las Comunidades Autónomas con competencia en la materia»: opción b). El artículo no prevé una composición paritaria con la Administración General del Estado, opción d), ni la presencia de sociedades científicas, opción a), ni la designación de profesionales por el Pleno, opción c).","cita":"«La Comisión contra la Violencia de Género del Consejo Interterritorial del Sistema Nacional de Salud estará compuesta por representantes de todas las Comunidades Autónomas con competencia en la materia.»","dificultad":2},{"id":"LOVG-L1-022","ley":"LOVG","articulo":"17.1","articulo_txt":"Art. 17.1 LO 1/2004","bloque_id":"LOVG|Título II. Derechos de las mujeres víctimas de violencia de género · Capítulo I. Derecho a la información, a la asistencia social integral y a la asistencia jurídica gratuita","enunciado":"Según el artículo 17.1 de la Ley Orgánica 1/2004, todas las mujeres víctimas de violencia de género tienen garantizados los derechos reconocidos en esa ley:","opciones":{"a":"En los términos que establezca la legislación de cada Comunidad Autónoma.","b":"Siempre que residan legalmente en España.","c":"Siempre que la violencia se haya producido en territorio español.","d":"Sin que pueda existir discriminación en el acceso a los mismos."},"correcta":"d","explicacion":"El art. 17.1 garantiza a todas las mujeres víctimas de violencia de género los derechos reconocidos en la ley «sin que pueda existir discriminación en el acceso a los mismos»: opción d). El apartado no condiciona esos derechos a la residencia legal, opción b), a la producción de la violencia en territorio español, opción c), ni a lo que disponga cada Comunidad Autónoma, opción a). Nota BOE: el art. 17 fue modificado, con efectos desde el 7 de octubre de 2022, por la disposición final 9.2 de la Ley Orgánica 10/2022, de 6 de septiembre.","cita":"«1. Todas las mujeres víctimas de violencia de género tienen garantizados los derechos reconocidos en esta ley, sin que pueda existir discriminación en el acceso a los mismos.»","dificultad":1},{"id":"LOVG-L1-028","ley":"LOVG","articulo":"19.6","articulo_txt":"Art. 19.6 LO 1/2004","bloque_id":"LOVG|Título II. Derechos de las mujeres víctimas de violencia de género · Capítulo I. Derecho a la información, a la asistencia social integral y a la asistencia jurídica gratuita","enunciado":"Según el artículo 19.6 de la Ley Orgánica 1/2004, en los instrumentos y procedimientos de cooperación entre la Administración General del Estado y la Administración de las comunidades autónomas en las materias reguladas en ese artículo se incluirán:","opciones":{"a":"Compromisos de aportación, por parte de las comunidades autónomas, de un porcentaje mínimo de sus presupuestos destinado específicamente a la prestación de los servicios.","b":"Compromisos de aportación, por parte de la Administración General del Estado, de recursos financieros referidos específicamente a la prestación de los servicios.","c":"Compromisos de cofinanciación a partes iguales entre ambas Administraciones de los recursos financieros referidos a la prestación de los servicios.","d":"Compromisos de evaluación anual, por parte de la Administración General del Estado, de la calidad de los servicios prestados por las comunidades autónomas."},"correcta":"b","explicacion":"El art. 19.6 exige incluir «compromisos de aportación, por parte de la Administración General del Estado, de recursos financieros referidos específicamente a la prestación de los servicios»: opción b). La opción a) traslada la aportación a las comunidades autónomas; la opción c) añade una cofinanciación a partes iguales que el apartado no prevé; y la opción d) sustituye la aportación de recursos por una evaluación que el apartado no menciona.","cita":"«6. En los instrumentos y procedimientos de cooperación entre la Administración General del Estado y la Administración de las comunidades autónomas en las materias reguladas en este artículo, se incluirán compromisos de aportación, por parte de la Administración General del Estado, de recursos financieros referidos específicamente a la prestación de los servicios.»","dificultad":2},{"id":"LOVG-L1-036","ley":"LOVG","articulo":"21.5","articulo_txt":"Art. 21.5 LO 1/2004","bloque_id":"LOVG|Título II. Derechos de las mujeres víctimas de violencia de género · Capítulo II. Derechos laborales y prestaciones de la Seguridad Social","enunciado":"Según el artículo 21.5 de la Ley Orgánica 1/2004, a las trabajadoras por cuenta propia víctimas de violencia de género que cesen en su actividad para hacer efectiva su protección o su derecho a la asistencia social integral se les suspenderá la obligación de cotización durante un período de:","opciones":{"a":"Seis meses, que no les serán considerados como de cotización efectiva a efectos de las prestaciones de Seguridad Social.","b":"Nueve meses, que no les serán considerados como de cotización efectiva a efectos de las prestaciones de Seguridad Social.","c":"Nueve meses, que les serán considerados como de cotización efectiva a efectos de las prestaciones de Seguridad Social.","d":"Seis meses, que les serán considerados como de cotización efectiva a efectos de las prestaciones de Seguridad Social."},"correcta":"d","explicacion":"El art. 21.5 suspende la obligación de cotización «durante un período de seis meses, que les serán considerados como de cotización efectiva a efectos de las prestaciones de Seguridad Social»: opción d). Las opciones a) y b) niegan el carácter de cotización efectiva y las opciones c) y b) alteran la duración. El mismo apartado considera su situación asimilada al alta y toma como base de cotización el promedio de las bases cotizadas durante los seis meses previos.","cita":"«5. A las trabajadoras por cuenta propia víctimas de violencia de género que cesen en su actividad para hacer efectiva su protección o su derecho a la asistencia social integral, se les considerará en situación de cese temporal de la actividad en los términos previstos en el texto refundido de la Ley General de la Seguridad Social, aprobado por el Real Decreto Legislativo 8/2015, de 30 de octubre, y se les suspenderá la obligación de cotización durante un período de seis meses, que les serán considerados como de cotización efectiva a efectos de las prestaciones de Seguridad Social.»","dificultad":2},{"id":"LOVG-L1-040","ley":"LOVG","articulo":"24","articulo_txt":"Art. 24 LO 1/2004","bloque_id":"LOVG|Título II. Derechos de las mujeres víctimas de violencia de género · Capítulo III. Derechos de las funcionarias públicas","enunciado":"Según el artículo 24 de la Ley Orgánica 1/2004, la funcionaria víctima de violencia de género tendrá derecho a la reducción o a la reordenación de su tiempo de trabajo, a la movilidad geográfica de centro de trabajo y a la excedencia:","opciones":{"a":"En los términos que se pacten en la negociación colectiva de cada Administración.","b":"En los mismos términos que el artículo 21 de esa ley reconoce a la trabajadora.","c":"En los términos que se determinen en su legislación específica.","d":"En los términos previstos en el Estatuto de los Trabajadores."},"correcta":"c","explicacion":"El art. 24 reconoce esos derechos a la funcionaria «en los términos que se determinen en su legislación específica»: opción c). La remisión al Estatuto de los Trabajadores, opción d), es la que hace el art. 21.1 para la trabajadora, no para la funcionaria, y el art. 24 no remite al art. 21, opción b), ni a la negociación colectiva, opción a).","cita":"«La funcionaria víctima de violencia de género tendrá derecho a la reducción o a la reordenación de su tiempo de trabajo, a la movilidad geográfica de centro de trabajo y a la excedencia en los términos que se determinen en su legislación específica.»","dificultad":2},{"id":"LOVG-L1-043","ley":"LOVG","articulo":"27.1","articulo_txt":"Art. 27.1 LO 1/2004","bloque_id":"LOVG|Título II. Derechos de las mujeres víctimas de violencia de género · Capítulo IV. Derechos económicos","enunciado":"Según el artículo 27.1 de la Ley Orgánica 1/2004, la ayuda de pago único corresponde, cuando concurran los demás requisitos del apartado, a las víctimas de violencia de género que careciesen de rentas superiores, en cómputo mensual, al:","opciones":{"a":"50 por 100 del indicador público de renta de efectos múltiples, excluida la parte proporcional de dos pagas extraordinarias.","b":"75 por 100 del indicador público de renta de efectos múltiples, incluida la parte proporcional de dos pagas extraordinarias.","c":"50 por 100 del salario mínimo interprofesional, incluida la parte proporcional de dos pagas extraordinarias.","d":"75 por 100 del salario mínimo interprofesional, excluida la parte proporcional de dos pagas extraordinarias."},"correcta":"d","explicacion":"El art. 27.1 toma como referencia el «75 por 100 del salario mínimo interprofesional, excluida la parte proporcional de dos pagas extraordinarias»: opción d). Las opciones b), c) y a) alteran el porcentaje, el indicador de referencia o el cómputo de las pagas extraordinarias.","cita":"«1. Cuando las víctimas de violencia de género careciesen de rentas superiores, en cómputo mensual, al 75 por 100 del salario mínimo interprofesional, excluida la parte proporcional de dos pagas extraordinarias, recibirán una ayuda de pago único, siempre que se presuma que debido a su edad, falta de preparación general o especializada y circunstancias sociales, la víctima tendrá especiales dificultades para obtener un empleo y por dicha circunstancia no participará en los programas de empleo establecidos para su inserción profesional.»","dificultad":2},{"id":"LOVG-L1-047","ley":"LOVG","articulo":"28 bis","articulo_txt":"Art. 28 bis LO 1/2004","bloque_id":"LOVG|Título II. Derechos de las mujeres víctimas de violencia de género · Capítulo V. Derecho a la reparación","enunciado":"Según el artículo 28 bis de la Ley Orgánica 1/2004, el derecho a la reparación de las víctimas de violencia de género comprende la compensación económica por los daños y perjuicios derivados de la violencia, las medidas necesarias para su completa recuperación física, psíquica y social, las acciones de reparación simbólica y:","opciones":{"a":"El acceso preferente a los programas de empleo.","b":"La asistencia jurídica gratuita en todos los procesos.","c":"Las garantías de no repetición.","d":"La reserva del puesto de trabajo durante la recuperación."},"correcta":"c","explicacion":"El art. 28 bis incluye en la reparación, junto a los demás elementos citados en el enunciado, «las garantías de no repetición»: opción c). La asistencia jurídica gratuita, opción b), se regula en el art. 20, pero el art. 28 bis no la incluye en la reparación; el acceso preferente a los programas de empleo, opción a), y la reserva del puesto de trabajo, opción d), tampoco figuran en él. Nota BOE: el art. 28 bis fue añadido, con efectos desde el 7 de octubre de 2022, por la disposición final 9.9 de la Ley Orgánica 10/2022, de 6 de septiembre.","cita":"«Las víctimas de violencia de género tienen derecho a la reparación, lo que comprende la compensación económica por los daños y perjuicios derivados de la violencia, las medidas necesarias para su completa recuperación física, psíquica y social, las acciones de reparación simbólica y las garantías de no repetición.»","dificultad":1},{"id":"LOVG-L2-003","ley":"LOVG","articulo":"30.2","articulo_txt":"Art. 30.2 LO 1/2004","bloque_id":"LOVG|Título III. Tutela Institucional","enunciado":"Según el artículo 30.2 de la Ley Orgánica 1/2004, ¿a quién remitirá el Observatorio Estatal de Violencia sobre la Mujer, con periodicidad anual, un informe sobre la evolución de la violencia ejercida sobre la mujer?","opciones":{"a":"A las Cortes Generales y al Consejo General del Poder Judicial.","b":"Al Gobierno y a las Cortes Generales.","c":"Al Consejo General del Poder Judicial y a las Comunidades Autónomas.","d":"Al Gobierno y a las Comunidades Autónomas."},"correcta":"d","explicacion":"El art. 30.2 dispone que el Observatorio «remitirá al Gobierno y a las Comunidades Autónomas, con periodicidad anual, un informe»; es la opción d). Las opciones a), b) y c) incluyen a las Cortes Generales o al Consejo General del Poder Judicial, que el art. 30.2 no menciona como destinatarios.","cita":"«2. El Observatorio Estatal de Violencia sobre la Mujer remitirá al Gobierno y a las Comunidades Autónomas, con periodicidad anual, un informe sobre la evolución de la violencia ejercida sobre la mujer en los términos a que se refiere el artículo 1 de la presente Ley, con determinación de los tipos penales que se hayan aplicado, y de la efectividad de las medidas acordadas para la protección de las víctimas.»","dificultad":2},{"id":"LOVG-L2-014","ley":"LOVG","articulo":"39","articulo_txt":"Art. 39 LO 1/2004","bloque_id":"LOVG|Título IV. Tutela Penal","enunciado":"Según el artículo 39 de la Ley Orgánica 1/2004, al añadirse al artículo 172 del Código Penal un nuevo apartado sobre las coacciones leves, el contenido que hasta entonces tenía ese artículo:","opciones":{"a":"Pasa a constituir un nuevo artículo 172 bis.","b":"Queda numerado como apartado 2.","c":"Queda numerado como apartado 1.","d":"Queda sin contenido y es sustituido por el nuevo texto."},"correcta":"c","explicacion":"El art. 39 dispone que «El contenido actual del artículo 172 del Código Penal queda numerado como apartado 1» y añade un apartado 2; es la opción c). La opción b) invierte la numeración, y las opciones a) y d) describen operaciones que el art. 39 no realiza. Aviso: en el art. 172 del Código Penal vigente el apartado 1 sigue recogiendo las coacciones y el apartado 2 las coacciones leves a la esposa o pareja (comprobado).","cita":"«El contenido actual del artículo 172 del Código Penal queda numerado como apartado 1 y se añade un apartado 2 a dicho artículo con la siguiente redacción:»","dificultad":1},{"id":"LOVG-L2-022","ley":"LOVG","articulo":"46","articulo_txt":"Art. 46 LO 1/2004","bloque_id":"LOVG|Título V. Tutela Judicial · Capítulo I. De los Juzgados de Violencia sobre la Mujer","enunciado":"Según el artículo 46 de la Ley Orgánica 1/2004, que adiciona un párrafo al artículo 82.4 de la Ley Orgánica del Poder Judicial, a fin de facilitar el conocimiento de los recursos contra las resoluciones dictadas en materia civil por los Juzgados de Violencia sobre la Mujer de la provincia, y atendiendo al número de asuntos existentes, en las Audiencias Provinciales:","opciones":{"a":"Deberá constituirse una Sala de Violencia sobre la Mujer.","b":"Deberán especializarse una o varias de sus secciones.","c":"Podrá constituirse una Sala de Violencia sobre la Mujer.","d":"Podrán especializarse una o varias de sus secciones."},"correcta":"d","explicacion":"En materia civil, el texto introducido por el art. 46 dispone que «podrán especializarse una o varias de sus secciones»; es la opción d). La opción b) es la fórmula que el art. 45 de la LOVG emplea para los recursos en materia penal, y las opciones a) y c) aluden a una Sala que el texto no prevé. Aviso: hoy el art. 82.2.2.º LOPJ (redacción de la LO 1/2025) mantiene «podrán especializarse» para los recursos civiles contra resoluciones, entre otras, de las Secciones de Violencia sobre la Mujer de los Tribunales de Instancia, nombre que hoy reciben esos órganos.","cita":"«Las Audiencias Provinciales conocerán, asimismo, de los recursos que establezca la ley contra las resoluciones dictadas en materia civil por los Juzgados de Violencia sobre la Mujer de la provincia. A fin de facilitar el conocimiento de estos recursos, y atendiendo al número de asuntos existentes, podrán especializarse una o varias de sus secciones de conformidad con lo previsto en el artículo 98 de la citada Ley Orgánica.»","dificultad":3},{"id":"LOVG-L2-031","ley":"LOVG","articulo":"57","articulo_txt":"Art. 57 LO 1/2004","bloque_id":"LOVG|Título V. Tutela Judicial · Capítulo II. Normas procesales civiles","enunciado":"Según el artículo 49 bis.2 de la Ley de Enjuiciamiento Civil, introducido por el artículo 57 de la Ley Orgánica 1/2004, cuando un Juez que esté conociendo de un procedimiento civil tuviese noticia de la posible comisión de un acto de violencia de género que no haya dado lugar a la iniciación de un proceso penal ni a dictar una orden de protección, tras verificar que concurren los requisitos legales, deberá citar a las partes a una comparecencia con el Ministerio Fiscal que se celebrará:","opciones":{"a":"En las siguientes 24 horas.","b":"En las siguientes 48 horas.","c":"En las siguientes 72 horas.","d":"En las siguientes 12 horas."},"correcta":"a","explicacion":"El art. 49 bis.2 de la Ley de Enjuiciamiento Civil, en el texto introducido por el art. 57 de la LOVG, dispone que la comparecencia «se celebrará en las siguientes 24 horas»; es la opción a). Tras ella, el Fiscal decidirá si procede, en las 24 horas siguientes, a denunciar o a solicitar orden de protección. Las cifras de las opciones b), c) y d) no aparecen en el texto. Aviso: el art. 49 bis.2 de la Ley de Enjuiciamiento Civil sigue vigente con esta redacción (comprobado), aunque la LO 1/2025 suprimió el art. 87 ter de la LOPJ al que remite; los requisitos están hoy en el art. 89.7 LOPJ.","cita":"«2. Cuando un Juez que esté conociendo de un procedimiento civil, tuviese noticia de la posible comisión de un acto de violencia de género, que no haya dado lugar a la iniciación de un proceso penal, ni a dictar una orden de protección, tras verificar que concurren los requisitos del apartado 3 del artículo 87 ter de la Ley Orgánica del Poder Judicial, deberá inmediatamente citar a las partes a una comparecencia con el Ministerio Fiscal que se celebrará en las siguientes 24 horas a fin de que éste tome conocimiento de cuantos datos sean relevantes sobre los hechos acaecidos.»","dificultad":2},{"id":"LOVG-L2-034","ley":"LOVG","articulo":"60","articulo_txt":"Art. 60 LO 1/2004","bloque_id":"LOVG|Título V. Tutela Judicial · Capítulo III. Normas procesales penales","enunciado":"Según el artículo 17 bis de la Ley de Enjuiciamiento Criminal, adicionado por el artículo 60 de la Ley Orgánica 1/2004, la competencia de los Juzgados de Violencia sobre la Mujer se extenderá a la instrucción y conocimiento de los delitos y faltas conexas siempre que la conexión tenga su origen en alguno de los supuestos previstos en el artículo 17 de esa ley, en sus números:","opciones":{"a":"1.º y 2.º","b":"2.º y 3.º","c":"1.º y 4.º","d":"3.º y 4.º"},"correcta":"d","explicacion":"El texto adicionado por el art. 60 se refiere a los supuestos previstos «en los números 3.º y 4.º del artículo 17»; es la opción d). Las combinaciones de las opciones a), b) y c) no aparecen en el texto. Aviso: el art. 17 bis de la Ley de Enjuiciamiento Criminal sigue vigente con esta redacción (comprobado); tras la Ley 41/2015 esos supuestos figuran en los números 3.º y 4.º del art. 17.2 (delitos cometidos como medio para perpetrar otros y para procurar la impunidad de otros delitos).","cita":"«La competencia de los Juzgados de Violencia sobre la Mujer se extenderá a la instrucción y conocimiento de los delitos y faltas conexas siempre que la conexión tenga su origen en alguno de los supuestos previstos en los números 3.º y 4.º del artículo 17 de la presente Ley.»","dificultad":3},{"id":"LOVG-L2-036","ley":"LOVG","articulo":"62","articulo_txt":"Art. 62 LO 1/2004","bloque_id":"LOVG|Título V. Tutela Judicial · Capítulo IV. Medidas judiciales de protección y de seguridad de las víctimas","enunciado":"Según el artículo 62 de la Ley Orgánica 1/2004, recibida la solicitud de adopción de una orden de protección, ¿quién actuará de conformidad con lo dispuesto en el artículo 544 ter de la Ley de Enjuiciamiento Criminal?","opciones":{"a":"El Juez de Violencia sobre la Mujer y, en su caso, el Juez de Guardia.","b":"Exclusivamente el Juez de Violencia sobre la Mujer.","c":"El Juez de Guardia y, en su caso, el Juez de lo Penal.","d":"El Ministerio Fiscal y, en su caso, el Juez de Violencia sobre la Mujer."},"correcta":"a","explicacion":"El art. 62 dispone que actuarán «el Juez de Violencia sobre la Mujer y, en su caso, el Juez de Guardia»; es la opción a). La opción b) excluye al Juez de Guardia, la opción c) menciona al Juez de lo Penal y la opción d) al Ministerio Fiscal, que el art. 62 no cita.","cita":"«Recibida la solicitud de adopción de una orden de protección, el Juez de Violencia sobre la Mujer y, en su caso, el Juez de Guardia, actuarán de conformidad con lo dispuesto en el artículo 544 ter de la Ley de Enjuiciamiento Criminal.»","dificultad":1},{"id":"LOVG-L2-045","ley":"LOVG","articulo":"70","articulo_txt":"Art. 70 LO 1/2004","bloque_id":"LOVG|Título V. Tutela Judicial · Capítulo V. Del Fiscal contra la Violencia sobre la Mujer","enunciado":"Según el artículo 70 de la Ley Orgánica 1/2004, que añadió un artículo 18 quáter a la Ley 50/1981, reguladora del Estatuto Orgánico del Ministerio Fiscal, ¿con qué periodicidad elaborará el Fiscal contra la Violencia sobre la Mujer un informe sobre los procedimientos seguidos y actuaciones practicadas por el Ministerio Fiscal en materia de violencia de género?","opciones":{"a":"Trimestralmente.","b":"Semestralmente.","c":"Cuatrimestralmente.","d":"Bimestralmente."},"correcta":"b","explicacion":"El art. 18 quáter.1.e) del Estatuto Orgánico del Ministerio Fiscal, en el texto añadido por el art. 70 de la LOVG, le encomienda «Elaborar semestralmente» ese informe y presentarlo al Fiscal General del Estado, para su remisión a la Junta de Fiscales de Sala del Tribunal Supremo, y al Consejo Fiscal; es la opción b). Las periodicidades de las opciones a), c) y d) no aparecen en el texto. Aviso: hoy esta función figura en el art. 20.Uno.e) del Estatuto Orgánico del Ministerio Fiscal, que mantiene «Elaborar semestralmente» y extiende el informe a la violencia sexual (comprobado).","cita":"«e) Elaborar semestralmente, y presentar al Fiscal General del Estado, para su remisión a la Junta de Fiscales de Sala del Tribunal Supremo, y al Consejo Fiscal, un informe sobre los procedimientos seguidos y actuaciones practicadas por el Ministerio Fiscal en materia de violencia de género.»","dificultad":2},{"id":"LOVG-L3-013","ley":"LOVG","articulo":"DA 15ª","articulo_txt":"DA 15ª · LO 1/2004","bloque_id":"LOVG|Disposiciones adicionales","enunciado":"Según la disposición adicional decimoquinta de la Ley Orgánica 1/2004, mediante convenios con las Administraciones competentes, el Gobierno podrá promover:","opciones":{"a":"Una reserva mínima de viviendas protegidas en cada promoción pública destinada a las víctimas de violencia de género.","b":"Procesos específicos de adjudicación de viviendas protegidas a las víctimas de violencia de género.","c":"Ayudas directas para el alquiler de la vivienda habitual de las víctimas de violencia de género.","d":"La exención de los requisitos de renta para el acceso de las víctimas de violencia de género a viviendas protegidas."},"correcta":"b","explicacion":"La DA 15ª dispone que el Gobierno podrá promover, mediante esos convenios, «procesos específicos de adjudicación de viviendas protegidas a las víctimas de violencia de género»: opción b). La disposición no prevé una reserva mínima de viviendas, opción a), ni ayudas al alquiler, opción c), ni la exención de requisitos de renta, opción d).","cita":"«Mediante convenios con las Administraciones competentes, el Gobierno podrá promover procesos específicos de adjudicación de viviendas protegidas a las víctimas de violencia de género.»","dificultad":1},{"id":"LOVG-L3-021","ley":"LOVG","articulo":"DD única","articulo_txt":"DD única · LO 1/2004","bloque_id":"LOVG|Disposición derogatoria","enunciado":"Según la disposición derogatoria única de la Ley Orgánica 1/2004, ¿qué normas quedan derogadas?","opciones":{"a":"Las normas que se relacionan expresamente en la propia disposición, sin cláusula general de derogación.","b":"Cuantas normas, de igual o inferior rango, se opongan a lo establecido en la ley.","c":"Las normas de igual rango que se opongan a lo establecido en la ley; las de rango inferior deberán interpretarse de conformidad con ella.","d":"Cuantas normas de rango inferior se opongan a lo establecido en la ley, sin afectar a las de igual rango."},"correcta":"b","explicacion":"La disposición derogatoria única dispone: «Quedan derogadas cuantas normas, de igual o inferior rango, se opongan a lo establecido en la presente Ley»: opción b). No contiene una relación de normas derogadas, opción a), y la derogación alcanza tanto a las normas de igual rango como a las de rango inferior, a diferencia de lo que dicen las opciones c) y d).","cita":"«Quedan derogadas cuantas normas, de igual o inferior rango, se opongan a lo establecido en la presente Ley.»","dificultad":1},{"id":"LOVG-L3-022","ley":"LOVG","articulo":"DF 1ª","articulo_txt":"DF 1ª · LO 1/2004","bloque_id":"LOVG|Disposiciones finales","enunciado":"Según la disposición final primera de la Ley Orgánica 1/2004, las referencias y menciones a los Jueces de Instrucción que deben también entenderse referidas a los Jueces de Violencia sobre la Mujer, en las materias propias de su competencia, son todas las contenidas en:","opciones":{"a":"Las leyes procesales civiles y penales.","b":"La Ley Orgánica del Poder Judicial.","c":"El Código Penal y las leyes penales especiales.","d":"Las leyes procesales penales."},"correcta":"d","explicacion":"La DF 1ª se refiere a «Todas las referencias y menciones contenidas en las leyes procesales penales a los Jueces de Instrucción»: opción d). La disposición no menciona las leyes procesales civiles, opción a), la Ley Orgánica del Poder Judicial, opción b), ni las leyes penales sustantivas, opción c). Aviso: «Jueces de Violencia sobre la Mujer» es la denominación que emplea la ley; tras la Ley Orgánica 1/2025, de 2 de enero, la Ley Orgánica del Poder Judicial integra esos órganos como Secciones de Violencia sobre la Mujer de los Tribunales de Instancia (arts. 84.2.c) y 89).","cita":"«Todas las referencias y menciones contenidas en las leyes procesales penales a los Jueces de Instrucción deben también entenderse referidas a los Jueces de Violencia sobre la Mujer en las materias propias de su competencia.»","dificultad":1}]};</script>
<script>
/* Letra de Ley — motor de test. Sin dependencias; funciona sin conexión.
   Necesita window.LDL_CONFIG y window.LDL_BANCO (los inyecta sistema/letradeley.py). */
(function () {
  "use strict";
  var CFG = window.LDL_CONFIG, B = window.LDL_BANCO;
  var raiz = document.getElementById("ldl");
  var LETRAS = ["a", "b", "c", "d"];
  var POR_ID = {};
  B.preguntas.forEach(function (p) { POR_ID[p.id] = p; });
  var CLAVE = "ldl1:" + CFG.pack.id;
  var prog = cargar();
  var sesion = null;
  var vista = CFG.modo === "web" ? "portada" : "inicio";
  var reloj = null;

  /* ---------- utilidades ---------- */
  function esc(t) {
    return String(t == null ? "" : t).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function barajar(lista) {
    var a = lista.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function pct(a, b) { return b ? Math.round((a / b) * 100) : 0; }
  function plural(n, uno, varios) { return n + " " + (n === 1 ? uno : varios); }
  function num(n) { return String(n).replace(".", ","); }
  function cargar() {
    try { var s = localStorage.getItem(CLAVE); if (s) { var d = JSON.parse(s); if (d && d.p) return d; } } catch (e) {}
    return { p: {}, h: [] };
  }
  function guardar() { try { localStorage.setItem(CLAVE, JSON.stringify(prog)); } catch (e) {} }
  function registrar(id, acierto) {
    var r = prog.p[id] || { v: 0, a: 0, f: 0, c: 0 };
    r.v++;
    if (acierto) { r.a++; r.c = Math.min((r.c || 0) + 1, 5); } else { r.f++; r.c = 0; }
    r.u = acierto ? 1 : 0;
    r.t = Date.now();
    prog.p[id] = r;
    guardar();
  }
  function fallosPendientes() {
    return B.preguntas.filter(function (p) { var r = prog.p[p.id]; return r && r.u === 0; });
  }
  function resumen(lista) {
    var vistas = 0, aciertos = 0, intentos = 0;
    lista.forEach(function (p) {
      var r = prog.p[p.id];
      if (r) { vistas++; aciertos += r.a; intentos += r.v; }
    });
    return { total: lista.length, vistas: vistas, acierto: pct(aciertos, intentos) };
  }
  function delBloque(id) { return B.preguntas.filter(function (p) { return p.bloque_id === id; }); }

  /* ---------- tema claro / oscuro ---------- */
  function aplicarTema() {
    var t = null;
    try { t = localStorage.getItem("ldl:tema"); } catch (e) {}
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    else document.documentElement.removeAttribute("data-theme");
    return t || "auto";
  }
  function cambiarTema() {
    var orden = { auto: "light", light: "dark", dark: "auto" };
    var actual = aplicarTema();
    try { localStorage.setItem("ldl:tema", orden[actual]); } catch (e) {}
    aplicarTema();
    pintar();
  }

  /* ---------- sesiones ---------- */
  function empezar(tipo, preguntas, opciones) {
    opciones = opciones || {};
    if (!preguntas.length) return;
    pararReloj();
    sesion = {
      tipo: tipo, titulo: opciones.titulo || "Test", ids: preguntas.map(function (p) { return p.id; }),
      i: 0, resp: {}, corregida: {}, inicio: Date.now(), limite: opciones.minutos ? opciones.minutos * 60 : 0, fin: null,
      origen: vista === "test" || vista === "resultado" ? (sesion && sesion.origen) || "inicio" : vista
    };
    vista = "test";
    if (sesion.limite) reloj = setInterval(tic, 1000);
    pintar();
    window.scrollTo(0, 0);
  }
  function tic() {
    if (!sesion || sesion.fin) return pararReloj();
    var el = document.getElementById("ldl-crono");
    var resta = sesion.limite - Math.floor((Date.now() - sesion.inicio) / 1000);
    if (resta <= 0) { terminar(); return; }
    if (el) el.textContent = mmss(resta);
  }
  function pararReloj() { if (reloj) { clearInterval(reloj); reloj = null; } }
  function mmss(s) { var m = Math.floor(s / 60), r = s % 60; return m + ":" + (r < 10 ? "0" : "") + r; }

  function responder(letra) {
    var id = sesion.ids[sesion.i];
    if (sesion.tipo === "simulacro") {
      sesion.resp[id] = sesion.resp[id] === letra ? undefined : letra;
      pintar();
      return;
    }
    if (sesion.corregida[id]) return;
    sesion.resp[id] = letra;
    sesion.corregida[id] = true;
    registrar(id, letra === POR_ID[id].correcta);
    pintar();
  }
  function siguiente() {
    if (sesion.i < sesion.ids.length - 1) { sesion.i++; pintar(); window.scrollTo(0, 0); }
    else terminar();
  }
  function anterior() { if (sesion.i > 0) { sesion.i--; pintar(); } }
  function terminar() {
    pararReloj();
    if (sesion.tipo === "simulacro") {
      sesion.ids.forEach(function (id) {
        if (sesion.resp[id]) registrar(id, sesion.resp[id] === POR_ID[id].correcta);
      });
    }
    sesion.fin = Date.now();
    var r = calcular(sesion);
    prog.h.unshift({ t: sesion.fin, tipo: sesion.tipo, n: r.total, a: r.aciertos, e: r.errores, nota: r.nota });
    prog.h = prog.h.slice(0, 50);
    guardar();
    vista = "resultado";
    pintar();
    window.scrollTo(0, 0);
  }
  function calcular(s) {
    var a = 0, e = 0, nr = 0;
    s.ids.forEach(function (id) {
      var r = s.resp[id];
      if (!r) nr++; else if (r === POR_ID[id].correcta) a++; else e++;
    });
    var pen = (CFG.simulacro && CFG.simulacro.penalizacion) || 1 / 3;
    var neta = s.tipo === "simulacro" ? a - e * pen : a;
    var nota = Math.max(0, (neta / s.ids.length) * 10);
    return { total: s.ids.length, aciertos: a, errores: e, blancos: nr, neta: neta, nota: Math.round(nota * 100) / 100 };
  }

  /* ---------- vistas ---------- */
  function cabecera() {
    var tema = aplicarTema();
    var etiquetas = { auto: "Tema: auto", light: "Tema: claro", dark: "Tema: oscuro" };
    return '<header class="ldl-top"><a class="ldl-brand" href="' + esc(CFG.web || "#") + '">' +
      '<span class="ldl-logo" aria-hidden="true">§</span><span><b>Letra de Ley</b><small>' +
      esc(CFG.pack.nombre) + "</small></span></a>" +
      '<button class="ldl-tema" data-acc="tema" type="button">' + etiquetas[tema] + "</button></header>";
  }
  function navegacion() {
    if (CFG.modo === "web") return "";
    var items = [["inicio", "Inicio"], ["temas", "Por temas"], ["simulacro", "Simulacro"], ["fallos", "Fallos"], ["stats", "Estadísticas"]];
    return '<nav class="ldl-nav" aria-label="Secciones">' + items.map(function (it) {
      var actual = vista === it[0] || (vista === "test" && sesion && sesion.origen === it[0]);
      return '<button type="button" data-acc="ir" data-v="' + it[0] + '"' + (actual ? ' aria-current="page"' : "") + ">" + it[1] + "</button>";
    }).join("") + "</nav>";
  }
  function pie() {
    return '<p class="ldl-pie">Letra de Ley · ' + esc(CFG.pack.edicion) + " · Texto legal actualizado a " +
      esc(CFG.pack.actualizado) + "<br>Uso personal. Prohibida su redistribución.</p>";
  }

  function vInicio() {
    var r = resumen(B.preguntas), f = fallosPendientes().length;
    return '<section class="ldl-card"><h2>' + esc(CFG.pack.nombre) + "</h2>" +
      '<p class="ldl-muted">' + B.preguntas.length + " preguntas comentadas, con el artículo exacto de cada respuesta.</p>" +
      '<div class="ldl-kpis"><div class="ldl-kpi"><b>' + r.vistas + "/" + r.total + "</b><span>respondidas</span></div>" +
      '<div class="ldl-kpi"><b>' + r.acierto + ' %</b><span>de acierto</span></div>' +
      '<div class="ldl-kpi"><b>' + f + "</b><span>fallos por repasar</span></div></div>" +
      '<div class="ldl-acciones"><button class="ldl-btn" data-acc="rapido" type="button">Test rápido de 20</button>' +
      '<button class="ldl-btn sec" data-acc="ir" data-v="simulacro" type="button">Simulacro de examen</button>' +
      (f ? '<button class="ldl-btn sec" data-acc="repasar" type="button">Repasar ' + f + " fallos</button>" : "") +
      "</div></section>" +
      '<section class="ldl-card"><h3>Cómo sacarle partido</h3><ol class="ldl-muted">' +
      "<li>Practica <b>por temas</b>: cada respuesta te enseña el artículo y por qué fallan las demás opciones.</li>" +
      "<li>Cada pocos días, <b>repasa tus fallos</b>: es donde más se aprende.</li>" +
      "<li>Antes del examen, haz <b>simulacros</b> con tiempo y con la penalización real (cada error resta 1/3).</li></ol>" +
      '<p class="ldl-small ldl-muted">Tu progreso se guarda en este dispositivo y en este navegador.</p></section>' + historial();
  }
  function historial() {
    if (!prog.h.length) return "";
    return '<section class="ldl-card"><h3>Últimos tests</h3><ul class="ldl-revision">' + prog.h.slice(0, 5).map(function (h) {
      var d = new Date(h.t);
      return "<li><b>" + (h.tipo === "simulacro" ? "Simulacro" : "Práctica") + "</b> · " + d.toLocaleDateString("es-ES") +
        " · " + h.a + "/" + h.n + " aciertos" + (h.tipo === "simulacro" ? " · nota " + num(h.nota) : "") + "</li>";
    }).join("") + "</ul></section>";
  }
  function vTemas() {
    var html = '<section class="ldl-card"><h2>Practicar por temas</h2><p class="ldl-muted">Elige un bloque. Las preguntas salen en orden aleatorio y se corrigen al momento.</p><ul class="ldl-bloques">';
    B.bloques.forEach(function (b) {
      var lista = delBloque(b.id), r = resumen(lista);
      html += '<li><button type="button" data-acc="bloque" data-id="' + esc(b.id) + '"><span class="t">' + esc(b.nombre) +
        '</span><span class="n">' + r.vistas + "/" + r.total + (r.vistas ? " · " + r.acierto + " %" : "") + "</span>" +
        '<span class="ldl-barra"><i style="width:' + pct(r.vistas, r.total) + '%"></i></span></button></li>';
    });
    return html + "</ul></section>";
  }
  function vSimulacro() {
    var total = B.preguntas.length;
    var opcionesN = [10, 20, 30, 50, 100].filter(function (n) { return n < total; });
    opcionesN.push(total);
    var porDefecto = Math.min((CFG.simulacro && CFG.simulacro.preguntas) || 30, total);
    return '<section class="ldl-card"><h2>Simulacro de examen</h2>' +
      '<p class="ldl-muted">Como el día del examen: no ves las soluciones hasta el final y cada error resta un tercio de acierto.</p>' +
      '<div class="ldl-campo"><label for="ldl-n">Número de preguntas</label><select id="ldl-n">' +
      opcionesN.map(function (n) { return "<option" + (n === porDefecto ? " selected" : "") + ">" + n + "</option>"; }).join("") +
      '</select></div><div class="ldl-campo"><label for="ldl-t">Tiempo</label><select id="ldl-t">' +
      '<option value="1">1 minuto por pregunta</option><option value="0">Sin límite de tiempo</option></select></div>' +
      '<div class="ldl-campo"><label for="ldl-b">Temas</label><select id="ldl-b"><option value="">Todos</option>' +
      B.bloques.map(function (b) { return '<option value="' + esc(b.id) + '">' + esc(b.nombre) + "</option>"; }).join("") +
      '</select></div><div class="ldl-acciones"><button class="ldl-btn" data-acc="simular" type="button">Empezar simulacro</button></div></section>';
  }
  function vFallos() {
    var f = fallosPendientes();
    if (!f.length) {
      return '<section class="ldl-card"><h2>Repaso de fallos</h2><p class="ldl-muted">No tienes fallos pendientes. Cuando falles una pregunta aparecerá aquí hasta que la aciertes.</p></section>';
    }
    return '<section class="ldl-card"><h2>Repaso de fallos</h2><p class="ldl-muted">Tienes <b>' + f.length +
      "</b> preguntas falladas. Salen de aquí en cuanto las aciertas.</p>" +
      '<div class="ldl-acciones"><button class="ldl-btn" data-acc="repasar" type="button">Repasar ahora</button></div></section>';
  }
  function vStats() {
    var html = '<section class="ldl-card"><h2>Estadísticas</h2><ul class="ldl-bloques">';
    B.bloques.forEach(function (b) {
      var r = resumen(delBloque(b.id));
      html += '<li><button type="button" data-acc="bloque" data-id="' + esc(b.id) + '"><span class="t">' + esc(b.nombre) +
        '</span><span class="n">' + (r.vistas ? r.acierto + " % de acierto" : "sin empezar") + '</span><span class="ldl-barra"><i style="width:' +
        r.acierto + '%"></i></span></button></li>';
    });
    html += '</ul></section><section class="ldl-card"><h3>Empezar de cero</h3><p class="ldl-muted ldl-small">Borra tu progreso guardado en este dispositivo.</p>' +
      '<div class="ldl-acciones"><button class="ldl-btn sec" data-acc="borrar" type="button">Borrar mi progreso</button></div></section>';
    return html;
  }
  function vPortada() {
    var n = B.preguntas.length;
    return '<section class="ldl-card"><h2>' + esc(CFG.pack.nombre) + "</h2>" +
      '<p class="ldl-muted">' + n + " preguntas tipo examen, corregidas al momento, con el artículo exacto y la explicación de cada opción. Gratis y sin registrarte.</p>" +
      '<div class="ldl-acciones"><button class="ldl-btn" data-acc="empezarweb" type="button">Empezar el test</button></div></section>';
  }

  function vTest() {
    var id = sesion.ids[sesion.i], p = POR_ID[id], sim = sesion.tipo === "simulacro";
    var elegida = sesion.resp[id], corregida = !sim && sesion.corregida[id];
    var html = '<section class="ldl-card"><div class="ldl-meta"><span>' + esc(sesion.titulo) + " · " + (sesion.i + 1) + " de " + sesion.ids.length +
      "</span><span>" + (sesion.limite ? '⏱ <span id="ldl-crono" class="ldl-crono">' +
        mmss(Math.max(0, sesion.limite - Math.floor((Date.now() - sesion.inicio) / 1000))) + "</span>" : esc(p.articulo_txt)) +
      '</span></div><div class="ldl-progreso"><i style="width:' + pct(sesion.i + (corregida ? 1 : 0), sesion.ids.length) + '%"></i></div>' +
      '<p class="ldl-enunciado">' + esc(p.enunciado) + '</p><div class="ldl-opciones" role="group" aria-label="Opciones">';
    LETRAS.forEach(function (l) {
      var cls = "ldl-op";
      if (corregida) { if (l === p.correcta) cls += " ok"; else if (l === elegida) cls += " ko"; }
      else if (sim && elegida === l) cls += " marcada";
      html += '<button type="button" class="' + cls + '" data-acc="resp" data-l="' + l + '"' + (corregida ? " disabled" : "") +
        (sim ? ' aria-pressed="' + (elegida === l) + '"' : "") + '><span class="l">' + l + ")</span><span>" + esc(p.opciones[l]) + "</span></button>";
    });
    html += "</div>";
    if (corregida) html += feedback(p, elegida);
    html += '<div class="ldl-acciones">';
    if (sim) {
      html += (sesion.i > 0 ? '<button class="ldl-btn sec" data-acc="ant" type="button">Anterior</button>' : "") +
        '<button class="ldl-btn" data-acc="sig" type="button">' + (sesion.i < sesion.ids.length - 1 ? "Siguiente" : "Entregar") + "</button>" +
        (sesion.i < sesion.ids.length - 1 ? '<button class="ldl-btn sec" data-acc="entregar" type="button">Entregar ya</button>' : "");
    } else if (corregida) {
      html += '<button class="ldl-btn" data-acc="sig" type="button">' + (sesion.i < sesion.ids.length - 1 ? "Siguiente" : "Ver resultado") + "</button>";
    }
    html += '<button class="ldl-btn sec" data-acc="salir" type="button">Salir</button></div></section>';
    return html;
  }
  function feedback(p, elegida) {
    var bien = elegida === p.correcta;
    return '<div class="ldl-feedback" aria-live="polite"><div class="v ' + (bien ? "ok" : "ko") + '">' +
      (bien ? "¡Correcta!" : "Incorrecta. La respuesta correcta es la " + p.correcta + ")") + "</div><div>" + esc(p.explicacion) + "</div>" +
      (p.cita ? '<blockquote class="ldl-cita">' + esc(p.cita) + "<small>" + esc(p.articulo_txt) + "</small></blockquote>" : "") + "</div>";
  }
  function vResultado() {
    var r = calcular(sesion), sim = sesion.tipo === "simulacro";
    var html = '<section class="ldl-card"><h2>' + (sim ? "Resultado del simulacro" : "Resultado") + "</h2>" +
      '<div class="ldl-nota">' + (sim ? num(r.nota.toFixed(2)) : r.aciertos + "/" + r.total) + "</div>" +
      '<p class="ldl-muted">' + plural(r.aciertos, "acierto", "aciertos") + " · " + plural(r.errores, "error", "errores") +
      (r.blancos ? " · " + r.blancos + " en blanco" : "") +
      (sim ? " · nota sobre 10 con penalización" : "") + "</p>";
    if (CFG.modo === "web") html += ctaWeb(r);
    html += '<div class="ldl-acciones">' + (CFG.modo === "web" ? '<button class="ldl-btn sec" data-acc="empezarweb" type="button">Repetir con otro orden</button>' :
      '<button class="ldl-btn" data-acc="ir" data-v="inicio" type="button">Volver al inicio</button>') + "</div></section>";
    html += '<section class="ldl-card"><h3>Revisión</h3><ul class="ldl-revision">';
    sesion.ids.forEach(function (id, n) {
      var p = POR_ID[id], e = sesion.resp[id], chip = !e ? '<span class="ldl-chip nr">En blanco</span>' :
        e === p.correcta ? '<span class="ldl-chip ok">Bien</span>' : '<span class="ldl-chip ko">Mal</span>';
      html += "<li>" + chip + '<span class="e">' + (n + 1) + ". " + esc(p.enunciado) + "</span><br>" +
        '<span class="ldl-small">Correcta: <b>' + p.correcta + ") " + esc(p.opciones[p.correcta]) + "</b>" +
        (e && e !== p.correcta ? " · Marcaste " + e + ")" : "") + '</span><br><span class="ldl-small ldl-muted">' + esc(p.explicacion) + "</span></li>";
    });
    return html + "</ul></section>";
  }
  function ctaWeb() {
    var c = CFG.compra || {}, html = "";
    if (c.url) {
      html += '<div class="ldl-card ldl-cta"><h3>' + esc(c.titulo) + '</h3><p class="ldl-muted">' + esc(c.texto) + "</p>" +
        '<div class="ldl-acciones"><a class="ldl-btn acc" href="' + esc(c.url) + '">' + esc(c.boton) + "</a></div></div>";
    }
    if (CFG.telegram) {
      html += '<p class="ldl-small">¿Quieres un test cada día? <a href="' + esc(CFG.telegram) + '">Únete gratis al canal de Telegram</a>.</p>';
    }
    return html;
  }

  function pintar() {
    var cuerpo;
    if (vista === "test") cuerpo = vTest();
    else if (vista === "resultado") cuerpo = vResultado();
    else if (vista === "portada") cuerpo = vPortada();
    else if (vista === "temas") cuerpo = vTemas();
    else if (vista === "simulacro") cuerpo = vSimulacro();
    else if (vista === "fallos") cuerpo = vFallos();
    else if (vista === "stats") cuerpo = vStats();
    else cuerpo = vInicio();
    raiz.innerHTML = '<div class="ldl">' + cabecera() + navegacion() + "<main>" + cuerpo + "</main>" + pie() + "</div>";
  }

  /* ---------- eventos ---------- */
  raiz.addEventListener("click", function (ev) {
    var el = ev.target.closest("[data-acc]");
    if (!el) return;
    var acc = el.getAttribute("data-acc");
    if (acc === "tema") return cambiarTema();
    if (acc === "ir") { pararReloj(); vista = el.getAttribute("data-v"); sesion = null; pintar(); return; }
    if (acc === "rapido") return empezar("practica", barajar(B.preguntas).slice(0, 20), { titulo: "Test rápido" });
    if (acc === "repasar") return empezar("practica", barajar(fallosPendientes()).slice(0, 30), { titulo: "Repaso de fallos" });
    if (acc === "bloque") {
      var b = B.bloques.filter(function (x) { return x.id === el.getAttribute("data-id"); })[0];
      return empezar("practica", barajar(delBloque(b.id)), { titulo: b.nombre });
    }
    if (acc === "simular") {
      var n = parseInt(document.getElementById("ldl-n").value, 10);
      var conTiempo = document.getElementById("ldl-t").value === "1";
      var bloque = document.getElementById("ldl-b").value;
      var fuente = bloque ? delBloque(bloque) : B.preguntas;
      var elegidas = barajar(fuente).slice(0, n);
      return empezar("simulacro", elegidas, { titulo: "Simulacro", minutos: conTiempo ? elegidas.length : 0 });
    }
    if (acc === "empezarweb") return empezar("practica", barajar(B.preguntas), { titulo: "Test gratuito" });
    if (acc === "resp") return responder(el.getAttribute("data-l"));
    if (acc === "sig") return siguiente();
    if (acc === "ant") return anterior();
    if (acc === "entregar") return terminar();
    if (acc === "salir") { pararReloj(); sesion = null; vista = CFG.modo === "web" ? "portada" : "inicio"; pintar(); return; }
    if (acc === "borrar") {
      if (el.getAttribute("data-confirmar") === "1") { prog = { p: {}, h: [] }; guardar(); pintar(); }
      else { el.setAttribute("data-confirmar", "1"); el.textContent = "Pulsa otra vez para confirmar"; }
    }
  });
  document.addEventListener("keydown", function (ev) {
    if (vista !== "test" || !sesion || ev.altKey || ev.ctrlKey || ev.metaKey) return;
    var k = ev.key.toLowerCase(), mapa = { "1": "a", "2": "b", "3": "c", "4": "d", a: "a", b: "b", c: "c", d: "d" };
    if (mapa[k]) { ev.preventDefault(); responder(mapa[k]); }
    else if (k === "enter" || k === "arrowright") {
      var id = sesion.ids[sesion.i];
      if (sesion.tipo === "simulacro" || sesion.corregida[id]) { ev.preventDefault(); siguiente(); }
    } else if (k === "arrowleft" && sesion.tipo === "simulacro") { ev.preventDefault(); anterior(); }
  });

  pintar();
})();
</script>
</body>
</html>
