s · Capítulo II. Autoridades autonómicas de protección de datos · Sección 2.ª Coordinación en el marco de los procedimientos establecidos en el Reglamento (UE) 2016/679","ley":"LOPDGDD","nombre":"Título VII. Autoridades de protección de datos · Capítulo II. Autoridades autonómicas de protección de datos · Sección 2.ª Coordinación en el marco de los procedimientos establecidos en el Reglamento (UE) 2016/679"},{"id":"LOPDGDD|Título VIII. Procedimientos en caso de posible vulneración de la normativa de protección de datos","ley":"LOPDGDD","nombre":"Título VIII. Procedimientos en caso de posible vulneración de la normativa de protección de datos"},{"id":"LOPDGDD|Título IX. Régimen sancionador","ley":"LOPDGDD","nombre":"Título IX. Régimen sancionador"}],"preguntas":[{"id":"LOPDGDD-L1-003","ley":"LOPDGDD","articulo":"3.1","articulo_txt":"Art. 3.1 LO 3/2018","bloque_id":"LOPDGDD|Título I. Disposiciones generales","enunciado":"Según el artículo 3.1 de la Ley Orgánica 3/2018, aunque la persona fallecida hubiese prohibido expresamente el acceso a sus datos, sus herederos podrán acceder:","opciones":{"a":"A los datos relativos a la salud del causante.","b":"A los datos de carácter patrimonial del causante.","c":"A los datos del causante que sean necesarios para aceptar la herencia.","d":"A los datos del causante que obren en registros públicos."},"correcta":"b","explicacion":"El art. 3.1 establece que esa prohibición «no afectará al derecho de los herederos a acceder a los datos de carácter patrimonial del causante»; es la opción b). Las opciones a), c) y d) describen datos que el art. 3.1 no excluye del alcance de la prohibición.","cita":"«Como excepción, las personas a las que se refiere el párrafo anterior no podrán acceder a los datos del causante, ni solicitar su rectificación o supresión, cuando la persona fallecida lo hubiese prohibido expresamente o así lo establezca una ley. Dicha prohibición no afectará al derecho de los herederos a acceder a los datos de carácter patrimonial del causante.»","dificultad":2},{"id":"LOPDGDD-L1-004","ley":"LOPDGDD","articulo":"3.3","articulo_txt":"Art. 3.3 LO 3/2018","bloque_id":"LOPDGDD|Título I. Disposiciones generales","enunciado":"Según el artículo 3.3 de la Ley Orgánica 3/2018, en caso de fallecimiento de menores, las facultades de acceso, rectificación y supresión de sus datos podrán ejercerse también por sus representantes legales o, en el marco de sus competencias, por:","opciones":{"a":"La Agencia Española de Protección de Datos, que podrá actuar de oficio o a instancia de persona interesada.","b":"El Ministerio Fiscal, que podrá actuar de oficio o a instancia de persona física o jurídica interesada.","c":"El Defensor del Pueblo, que podrá actuar de oficio o a instancia de persona física o jurídica interesada.","d":"La entidad pública de protección de menores competente, a instancia de los herederos del menor."},"correcta":"b","explicacion":"El art. 3.3 atribuye también estas facultades, «en el marco de sus competencias», al Ministerio Fiscal, «que podrá actuar de oficio o a instancia de cualquier persona física o jurídica interesada»; es la opción b). Las opciones a), c) y d) mencionan órganos o entidades a los que el art. 3.3 no se refiere.","cita":"«3. En caso de fallecimiento de menores, estas facultades podrán ejercerse también por sus representantes legales o, en el marco de sus competencias, por el Ministerio Fiscal, que podrá actuar de oficio o a instancia de cualquier persona física o jurídica interesada.»","dificultad":2},{"id":"LOPDGDD-L1-011","ley":"LOPDGDD","articulo":"9.1","articulo_txt":"Art. 9.1 LO 3/2018","bloque_id":"LOPDGDD|Título II. Principios de protección de datos","enunciado":"Según el artículo 9.1 de la Ley Orgánica 3/2018, a fin de evitar situaciones discriminatorias, el solo consentimiento del afectado no bastará para levantar la prohibición del tratamiento de datos cuya finalidad principal sea identificar determinadas circunstancias suyas. ¿Cuál de las siguientes NO figura entre ellas?","opciones":{"a":"Su estado de salud.","b":"Su orientación sexual.","c":"Sus creencias.","d":"Su origen racial o étnico."},"correcta":"a","explicacion":"El art. 9.1 no menciona la salud entre esas finalidades, que son identificar la «ideología, afiliación sindical, religión, orientación sexual, creencias u origen racial o étnico» del afectado; es la opción a). Las opciones b), c) y d) sí figuran en la enumeración del art. 9.1.","cita":"«1. A los efectos del artículo 9.2.a) del Reglamento (UE) 2016/679, a fin de evitar situaciones discriminatorias, el solo consentimiento del afectado no bastará para levantar la prohibición del tratamiento de datos cuya finalidad principal sea identificar su ideología, afiliación sindical, religión, orientación sexual, creencias u origen racial o étnico.»","dificultad":2},{"id":"LOPDGDD-L1-012","ley":"LOPDGDD","articulo":"10.3","articulo_txt":"Art. 10.3 LO 3/2018","bloque_id":"LOPDGDD|Título II. Principios de protección de datos","enunciado":"Según el artículo 10.3 de la Ley Orgánica 3/2018, fuera de los supuestos previstos en los apartados anteriores, los tratamientos de datos referidos a condenas e infracciones penales, así como a procedimientos y medidas cautelares y de seguridad conexas, solo serán posibles cuando sean llevados a cabo por:","opciones":{"a":"Abogados y procuradores, para recoger la información facilitada por sus clientes para el ejercicio de sus funciones.","b":"Detectives privados, para recoger la información necesaria para cumplir el encargo de sus clientes.","c":"Colegios profesionales, para el ejercicio de la potestad disciplinaria sobre sus colegiados.","d":"Entidades aseguradoras, para valorar el riesgo en la celebración de los contratos de seguro."},"correcta":"a","explicacion":"El art. 10.3 solo admite estos tratamientos cuando «sean llevados a cabo por abogados y procuradores y tengan por objeto recoger la información facilitada por sus clientes para el ejercicio de sus funciones»; es la opción a). Las opciones b), c) y d) mencionan sujetos y fines que el art. 10.3 no contempla.","cita":"«3. Fuera de los supuestos señalados en los apartados anteriores, los tratamientos de datos referidos a condenas e infracciones penales, así como a procedimientos y medidas cautelares y de seguridad conexas solo serán posibles cuando sean llevados a cabo por abogados y procuradores y tengan por objeto recoger la información facilitada por sus clientes para el ejercicio de sus funciones.»","dificultad":2},{"id":"LOPDGDD-L1-013","ley":"LOPDGDD","articulo":"11.2","articulo_txt":"Art. 11.2 LO 3/2018","bloque_id":"LOPDGDD|Título III. Derechos de las personas · Capítulo I. Transparencia e información","enunciado":"Según el artículo 11.2 de la Ley Orgánica 3/2018, ¿cuál de los siguientes extremos NO figura entre los que, al menos, debe contener la información básica que se facilita al afectado cuando los datos se obtienen de él?","opciones":{"a":"La identidad del responsable del tratamiento y de su representante, en su caso.","b":"La finalidad del tratamiento.","c":"La posibilidad de ejercer los derechos establecidos en los artículos 15 a 22 del Reglamento (UE) 2016/679.","d":"El plazo durante el cual se conservarán los datos personales."},"correcta":"d","explicacion":"El art. 11.2 no incluye el plazo de conservación en el contenido mínimo de la información básica; es la opción d). Las opciones a), b) y c) recogen, respectivamente, las letras a), b) y c) del art. 11.2.","cita":"«2. La información básica a la que se refiere el apartado anterior deberá contener, al menos: a) La identidad del responsable del tratamiento y de su representante, en su caso. b) La finalidad del tratamiento. c) La posibilidad de ejercer los derechos establecidos en los artículos 15 a 22 del Reglamento (UE) 2016/679.»","dificultad":1},{"id":"LOPDGDD-L1-014","ley":"LOPDGDD","articulo":"12.1","articulo_txt":"Art. 12.1 LO 3/2018","bloque_id":"LOPDGDD|Título III. Derechos de las personas · Capítulo II. Ejercicio de los derechos","enunciado":"Según el artículo 12.1 de la Ley Orgánica 3/2018, los derechos reconocidos en los artículos 15 a 22 del Reglamento (UE) 2016/679 podrán ejercerse:","opciones":{"a":"Directamente o por medio de representante legal o voluntario.","b":"Únicamente de forma personal por el afectado, previa acreditación de su identidad.","c":"Directamente o por medio de representante legal, pero no voluntario.","d":"Directamente o a través del delegado de protección de datos del responsable."},"correcta":"a","explicacion":"El art. 12.1 permite ejercer esos derechos «directamente o por medio de representante legal o voluntario»; es la opción a). Las opciones b), c) y d) restringen o alteran las formas de ejercicio que admite el art. 12.1.","cita":"«1. Los derechos reconocidos en los artículos 15 a 22 del Reglamento (UE) 2016/679, podrán ejercerse directamente o por medio de representante legal o voluntario.»","dificultad":1},{"id":"LOPDGDD-L1-018","ley":"LOPDGDD","articulo":"16.2","articulo_txt":"Art. 16.2 LO 3/2018","bloque_id":"LOPDGDD|Título III. Derechos de las personas · Capítulo II. Ejercicio de los derechos","enunciado":"Según el artículo 16.2 de la Ley Orgánica 3/2018, el hecho de que el tratamiento de los datos personales esté limitado:","opciones":{"a":"Debe comunicarse a la Agencia Española de Protección de Datos.","b":"Debe inscribirse en el registro de actividades de tratamiento.","c":"Debe constar claramente en los sistemas de información del responsable.","d":"Debe hacerse constar en la información básica facilitada al afectado."},"correcta":"c","explicacion":"El art. 16.2 dispone que esa circunstancia «debe constar claramente en los sistemas de información del responsable»; es la opción c). Las opciones a), b) y d) recogen exigencias que el art. 16.2 no establece.","cita":"«2. El hecho de que el tratamiento de los datos personales esté limitado debe constar claramente en los sistemas de información del responsable.»","dificultad":1},{"id":"LOPDGDD-L1-025","ley":"LOPDGDD","articulo":"22.3","articulo_txt":"Art. 22.3 LO 3/2018","bloque_id":"LOPDGDD|Título IV. Disposiciones aplicables a tratamientos concretos","enunciado":"Según el artículo 22.3 de la Ley Orgánica 3/2018, cuando las imágenes captadas con fines de videovigilancia hubieran de conservarse para acreditar la comisión de actos que atenten contra la integridad de personas, bienes o instalaciones, deberán ser puestas a disposición de la autoridad competente en un plazo máximo de:","opciones":{"a":"Setenta y dos horas desde que se tuviera conocimiento de la existencia de la grabación.","b":"Setenta y dos horas desde la captación de las imágenes.","c":"Cuarenta y ocho horas desde que se tuviera conocimiento de la existencia de la grabación.","d":"Cuarenta y ocho horas desde la captación de las imágenes."},"correcta":"a","explicacion":"El art. 22.3 fija un plazo máximo de «setenta y dos horas desde que se tuviera conocimiento de la existencia de la grabación»; es la opción a). La opción b) acierta en la cifra, pero no en el día inicial del cómputo. Las opciones c) y d) reducen el plazo a cuarenta y ocho horas, cifra que el art. 22.3 no recoge.","cita":"«3. Los datos serán suprimidos en el plazo máximo de un mes desde su captación, salvo cuando hubieran de ser conservados para acreditar la comisión de actos que atenten contra la integridad de personas, bienes o instalaciones. En tal caso, las imágenes deberán ser puestas a disposición de la autoridad competente en un plazo máximo de setenta y dos horas desde que se tuviera conocimiento de la existencia de la grabación.»","dificultad":2},{"id":"LOPDGDD-L1-030","ley":"LOPDGDD","articulo":"27.1.a)","articulo_txt":"Art. 27.1.a) LO 3/2018","bloque_id":"LOPDGDD|Título IV. Disposiciones aplicables a tratamientos concretos","enunciado":"Según el artículo 27.1 de la Ley Orgánica 3/2018, el tratamiento de datos relativos a infracciones y sanciones administrativas, incluido el mantenimiento de registros relacionados con las mismas, exigirá que el tratamiento se limite a los datos estrictamente necesarios para la finalidad perseguida y que los responsables de dichos tratamientos sean:","opciones":{"a":"Los órganos que ejerzan la función inspectora en el sector de actividad al que se refieran las infracciones y sanciones.","b":"Los órganos competentes para resolver los recursos administrativos que se interpongan contra las resoluciones sancionadoras.","c":"Los órganos competentes para la instrucción del procedimiento sancionador, para la declaración de las infracciones o la imposición de las sanciones.","d":"Los órganos que tengan atribuida la llevanza de un registro público de sanciones administrativas o de antecedentes."},"correcta":"c","explicacion":"El art. 27.1.a) exige «Que los responsables de dichos tratamientos sean los órganos competentes para la instrucción del procedimiento sancionador, para la declaración de las infracciones o la imposición de las sanciones»; es la opción c). Las opciones a), b) y d) describen responsables que el art. 27.1 no contempla.","cita":"«1. A los efectos del artículo 86 del Reglamento (UE) 2016/679, el tratamiento de datos relativos a infracciones y sanciones administrativas, incluido el mantenimiento de registros relacionados con las mismas, exigirá: a) Que los responsables de dichos tratamientos sean los órganos competentes para la instrucción del procedimiento sancionador, para la declaración de las infracciones o la imposición de las sanciones. b) Que el tratamiento se limite a los datos estrictamente necesarios para la finalidad perseguida por aquel.»","dificultad":2},{"id":"LOPDGDD-L1-031","ley":"LOPDGDD","articulo":"28.2","articulo_txt":"Art. 28.2 LO 3/2018","bloque_id":"LOPDGDD|Título V. Responsable y encargado del tratamiento · Capítulo I. Disposiciones generales. Medidas de responsabilidad activa","enunciado":"Según el artículo 28.2 de la Ley Orgánica 3/2018, ¿cuál de los siguientes NO figura expresamente entre los supuestos de mayor riesgo que los responsables y encargados deben tener en cuenta, en particular, al adoptar las medidas técnicas y organizativas apropiadas?","opciones":{"a":"Cuando se produzca un tratamiento masivo que implique a un gran número de afectados.","b":"Cuando el tratamiento lo lleve a cabo una Administración Pública en el ejercicio de sus competencias.","c":"Cuando se traten datos de grupos de afectados en situación de especial vulnerabilidad, en particular de menores de edad y personas con discapacidad.","d":"Cuando los datos fuesen a ser objeto de transferencia, con carácter habitual, a terceros Estados u organizaciones internacionales respecto de los que no se hubiese declarado un nivel adecuado de protección."},"correcta":"b","explicacion":"El art. 28.2 no menciona el hecho de que el tratamiento lo realice una Administración Pública; es la opción b). Las opciones a), c) y d) recogen, respectivamente, las letras f), e) y g) del art. 28.2. La letra h) añade, sin enumerarlos, «Cualesquiera otros que a juicio del responsable o del encargado pudieran tener relevancia».","cita":"«2. Para la adopción de las medidas a que se refiere el apartado anterior los responsables y encargados del tratamiento tendrán en cuenta, en particular, los mayores riesgos que podrían producirse en los siguientes supuestos: […] e) Cuando se lleve a cabo el tratamiento de datos de grupos de afectados en situación de especial vulnerabilidad y, en particular, de menores de edad y personas con discapacidad. f) Cuando se produzca un tratamiento masivo que implique a un gran número de afectados o conlleve la recogida de una gran cantidad de datos personales. g) Cuando los datos personales fuesen a ser objeto de transferencia, con carácter habitual, a terceros Estados u organizaciones internacionales respecto de los que no se hubiese declarado un nivel adecuado de protección.»","dificultad":2},{"id":"LOPDGDD-L1-034","ley":"LOPDGDD","articulo":"31.1","articulo_txt":"Art. 31.1 LO 3/2018","bloque_id":"LOPDGDD|Título V. Responsable y encargado del tratamiento · Capítulo I. Disposiciones generales. Medidas de responsabilidad activa","enunciado":"Según el artículo 31.1 de la Ley Orgánica 3/2018, las adiciones, modificaciones o exclusiones en el contenido del registro de actividades de tratamiento deberán comunicarse:","opciones":{"a":"A la Agencia Española de Protección de Datos o, en su caso, a la autoridad autonómica de protección de datos competente.","b":"A los afectados cuyos datos sean objeto de las actividades de tratamiento modificadas.","c":"Al Comité Europeo de Protección de Datos, a través de la autoridad de control competente.","d":"Al delegado de protección de datos, cuando el responsable o el encargado lo hubieran designado."},"correcta":"d","explicacion":"El art. 31.1, párrafo tercero, obliga al responsable o encargado que hubiera designado un delegado de protección de datos a «comunicarle cualquier adición, modificación o exclusión en el contenido del registro»; es la opción d). Las opciones a), b) y c) mencionan destinatarios que el art. 31.1 no prevé.","cita":"«Cuando el responsable o el encargado del tratamiento hubieran designado un delegado de protección de datos deberán comunicarle cualquier adición, modificación o exclusión en el contenido del registro.»","dificultad":2},{"id":"LOPDGDD-L1-036","ley":"LOPDGDD","articulo":"33.2","articulo_txt":"Art. 33.2 LO 3/2018","bloque_id":"LOPDGDD|Título V. Responsable y encargado del tratamiento · Capítulo II. Encargado del tratamiento","enunciado":"Según el artículo 33.2 de la Ley Orgánica 3/2018, tendrá la consideración de responsable del tratamiento:","opciones":{"a":"Quien, actuando por cuenta de otro, acceda a los datos necesarios para prestarle un servicio.","b":"Quien, figurando como encargado, utilizase los datos para sus propias finalidades.","c":"Quien conserve los datos debidamente bloqueados mientras puedan derivarse responsabilidades de su relación con el responsable.","d":"El órgano de la Administración al que una norma reguladora atribuya las competencias propias de un encargado."},"correcta":"b","explicacion":"El art. 33.2, párrafo segundo, atribuye la condición de responsable a «quien figurando como encargado utilizase los datos para sus propias finalidades»; es la opción b). La opción a) describe el acceso de un encargado que, según el art. 33.1, no se considera comunicación de datos. La opción c) describe una facultad que el art. 33.4 reconoce al propio encargado del tratamiento. La opción d) corresponde al art. 33.5, que permite atribuir a un órgano las competencias propias de un encargado.","cita":"«Tendrá asimismo la consideración de responsable del tratamiento quien figurando como encargado utilizase los datos para sus propias finalidades.»","dificultad":3},{"id":"LOPDGDD-L1-037","ley":"LOPDGDD","articulo":"34.1","articulo_txt":"Art. 34.1 LO 3/2018","bloque_id":"LOPDGDD|Título V. Responsable y encargado del tratamiento · Capítulo III. Delegado de protección de datos","enunciado":"Según el artículo 34.1 de la Ley Orgánica 3/2018, ¿cuál de las siguientes entidades NO figura en la enumeración de aquellas que, en todo caso, deberán designar un delegado de protección de datos?","opciones":{"a":"Las empresas de seguridad privada.","b":"Las federaciones deportivas cuando traten datos de menores de edad.","c":"Las organizaciones sindicales.","d":"Los colegios profesionales y sus consejos generales."},"correcta":"c","explicacion":"Las organizaciones sindicales no figuran en la enumeración del art. 34.1; es la opción c). Las opciones a), b) y d) recogen, respectivamente, las letras ñ), o) y a) del art. 34.1.","cita":"«1. Los responsables y encargados del tratamiento deberán designar un delegado de protección de datos en los supuestos previstos en el artículo 37.1 del Reglamento (UE) 2016/679 y, en todo caso, cuando se trate de las siguientes entidades: a) Los colegios profesionales y sus consejos generales. […] ñ) Las empresas de seguridad privada. o) Las federaciones deportivas cuando traten datos de menores de edad.»","dificultad":2},{"id":"LOPDGDD-L1-039","ley":"LOPDGDD","articulo":"35","articulo_txt":"Art. 35 LO 3/2018","bloque_id":"LOPDGDD|Título V. Responsable y encargado del tratamiento · Capítulo III. Delegado de protección de datos","enunciado":"Según el artículo 35 de la Ley Orgánica 3/2018, el cumplimiento de los requisitos para la designación del delegado de protección de datos podrá demostrarse, entre otros medios, a través de mecanismos voluntarios de certificación que tendrán particularmente en cuenta:","opciones":{"a":"La superación de un examen convocado al efecto por la Agencia Española de Protección de Datos o por las autoridades autonómicas de protección de datos.","b":"La experiencia profesional acreditada en puestos de responsabilidad relacionados con la seguridad de la información y el cumplimiento normativo.","c":"La inscripción previa del candidato en un colegio profesional del ámbito jurídico o de las tecnologías de la información.","d":"La obtención de una titulación universitaria que acredite conocimientos especializados en el derecho y la práctica en materia de protección de datos."},"correcta":"d","explicacion":"El art. 35 menciona particularmente «la obtención de una titulación universitaria que acredite conocimientos especializados en el derecho y la práctica en materia de protección de datos»; es la opción d). Las opciones a), b) y c) recogen méritos que el art. 35 no menciona.","cita":"«El cumplimiento de los requisitos establecidos en el artículo 37.5 del Reglamento (UE) 2016/679 para la designación del delegado de protección de datos, sea persona física o jurídica, podrá demostrarse, entre otros medios, a través de mecanismos voluntarios de certificación que tendrán particularmente en cuenta la obtención de una titulación universitaria que acredite conocimientos especializados en el derecho y la práctica en materia de protección de datos.»","dificultad":2},{"id":"LOPDGDD-L1-042","ley":"LOPDGDD","articulo":"38.3","articulo_txt":"Art. 38.3 LO 3/2018","bloque_id":"LOPDGDD|Título V. Responsable y encargado del tratamiento · Capítulo IV. Códigos de conducta y certificación","enunciado":"Según el artículo 38.3 de la Ley Orgánica 3/2018, los códigos de conducta serán aprobados por:","opciones":{"a":"La Agencia Española de Protección de Datos o, en su caso, la autoridad autonómica de protección de datos competente.","b":"El Comité Europeo de Protección de Datos, previo dictamen favorable de la Agencia Española de Protección de Datos.","c":"El Ministerio competente por razón de la materia, mediante orden ministerial.","d":"Las organizaciones empresariales del sector, tras su registro en la Agencia Española de Protección de Datos."},"correcta":"a","explicacion":"El art. 38.3 dispone que los códigos de conducta «serán aprobados por la Agencia Española de Protección de Datos o, en su caso, por la autoridad autonómica de protección de datos competente»; es la opción a). Las opciones b), c) y d) atribuyen la aprobación a órganos o entidades distintos de los que señala el art. 38.3.","cita":"«3. Los códigos de conducta serán aprobados por la Agencia Española de Protección de Datos o, en su caso, por la autoridad autonómica de protección de datos competente.»","dificultad":1},{"id":"LOPDGDD-L1-044","ley":"LOPDGDD","articulo":"40","articulo_txt":"Art. 40 LO 3/2018","bloque_id":"LOPDGDD|Título VI. Transferencias internacionales de datos","enunciado":"Según el artículo 40 de la Ley Orgánica 3/2018, las transferencias internacionales de datos se regirán por lo dispuesto en el Reglamento (UE) 2016/679, en esa ley orgánica y sus normas de desarrollo aprobadas por el Gobierno, y en:","opciones":{"a":"Las directrices que apruebe el Comité Europeo de Protección de Datos, que tendrán carácter vinculante.","b":"Las circulares de la Agencia Española de Protección de Datos y de las autoridades autonómicas de protección de datos.","c":"Los acuerdos del Consejo de Ministros que autoricen, en cada caso, la transferencia.","d":"Los reglamentos de las comunidades autónomas con competencias en materia de protección de datos."},"correcta":"b","explicacion":"El art. 40 incluye «las circulares de la Agencia Española de Protección de Datos y de las autoridades autonómicas de protección de datos, en el ámbito de sus respectivas competencias»; es la opción b). Las opciones a), c) y d) mencionan instrumentos que el art. 40 no cita.","cita":"«Las transferencias internacionales de datos se regirán por lo dispuesto en el Reglamento (UE) 2016/679, en la presente ley orgánica y sus normas de desarrollo aprobadas por el Gobierno, y en las circulares de la Agencia Española de Protección de Datos y de las autoridades autonómicas de protección de datos, en el ámbito de sus respectivas competencias.»","dificultad":2},{"id":"LOPDGDD-L2-006","ley":"LOPDGDD","articulo":"48.5","articulo_txt":"Art. 48.5 LO 3/2018","bloque_id":"LOPDGDD|Título VII. Autoridades de protección de datos · Capítulo I. La Agencia Española de Protección de Datos · Sección 1.ª Disposiciones generales","enunciado":"Según el artículo 48.5 de la Ley Orgánica 3/2018, el mandato de la Presidencia y del Adjunto de la Agencia Española de Protección de Datos:","opciones":{"a":"Tiene una duración de cuatro años y puede ser renovado para otro período de igual duración.","b":"Tiene una duración de cinco años y no puede ser renovado.","c":"Tiene una duración de cuatro años y no puede ser renovado.","d":"Tiene una duración de cinco años y puede ser renovado para otro período de igual duración."},"correcta":"d","explicacion":"El art. 48.5 dispone que el mandato «tiene una duración de cinco años y puede ser renovado para otro período de igual duración»; es la opción d). La opción a) reduce la duración a cuatro años. La opción b) niega la renovación: un período no renovable de cinco años es el que el art. 37.1 de la Ley 19/2013 prevé para el Presidente del Consejo de Transparencia y Buen Gobierno, no para la Agencia. La opción c) incurre en ambos errores.","cita":"«5. El mandato de la Presidencia y del Adjunto de la Agencia Española de Protección de Datos tiene una duración de cinco años y puede ser renovado para otro período de igual duración.»","dificultad":2},{"id":"LOPDGDD-L2-016","ley":"LOPDGDD","articulo":"53 bis","articulo_txt":"Art. 53 bis LO 3/2018","bloque_id":"LOPDGDD|Título VII. Autoridades de protección de datos · Capítulo I. La Agencia Española de Protección de Datos · Sección 2.ª Potestades de investigación y planes de auditoría preventiva","enunciado":"Según el artículo 53 bis de la Ley Orgánica 3/2018, la utilización de sistemas digitales, como la videoconferencia, en las actuaciones de investigación se producirá:","opciones":{"a":"Cuando lo solicite el inspeccionado y requerirá la conformidad de la Agencia en relación con su uso y con la fecha y la hora de su desarrollo.","b":"Cuando lo determine la Agencia, que fijará la fecha y hora de su desarrollo sin necesidad de recabar la conformidad del inspeccionado.","c":"Cuando lo determine la Agencia y requerirá la conformidad del inspeccionado en relación con su uso y con la fecha y hora de su desarrollo.","d":"Cuando lo autorice el órgano judicial competente, a solicitud de la Agencia y previa audiencia del inspeccionado."},"correcta":"c","explicacion":"El art. 53 bis, añadido por la disposición final 9.3 de la Ley 11/2023, dispone que «La utilización de estos sistemas se producirá cuando lo determine la Agencia y requerirá la conformidad del inspeccionado en relación con su uso y con la fecha y hora de su desarrollo»; es la opción c). La opción a) invierte los papeles de la Agencia y del inspeccionado. La opción b) prescinde de la conformidad del inspeccionado. La opción d) exige una autorización judicial que la norma no prevé.","cita":"«La utilización de estos sistemas se producirá cuando lo determine la Agencia y requerirá la conformidad del inspeccionado en relación con su uso y con la fecha y hora de su desarrollo.»","dificultad":2},{"id":"LOPDGDD-L2-019","ley":"LOPDGDD","articulo":"56.3.c)","articulo_txt":"Art. 56.3.c) LO 3/2018","bloque_id":"LOPDGDD|Título VII. Autoridades de protección de datos · Capítulo I. La Agencia Española de Protección de Datos · Sección 3.ª Otras potestades de la Agencia Española de Protección de Datos","enunciado":"Según el artículo 56.3.c) de la Ley Orgánica 3/2018, la Agencia Española de Protección de Datos colaborará con autoridades, instituciones, organismos y Administraciones de otros Estados a fin de impulsar, promover y desarrollar el derecho fundamental a la protección de datos, en particular en el ámbito:","opciones":{"a":"Mediterráneo.","b":"Del Consejo de Europa.","c":"De la Organización para la Cooperación y el Desarrollo Económicos.","d":"Iberoamericano."},"correcta":"d","explicacion":"El art. 56.3.c) menciona expresamente la colaboración «en particular en el ámbito iberoamericano»; es la opción d). Las opciones a), b) y c) citan ámbitos que el art. 56.3.c) no destaca.","cita":"«c) Colaborará con autoridades, instituciones, organismos y Administraciones de otros Estados a fin de impulsar, promover y desarrollar el derecho fundamental a la protección de datos, en particular en el ámbito iberoamericano, pudiendo suscribir acuerdos internacionales administrativos y no normativos en la materia.»","dificultad":1},{"id":"LOPDGDD-L2-022","ley":"LOPDGDD","articulo":"59","articulo_txt":"Art. 59 LO 3/2018","bloque_id":"LOPDGDD|Título VII. Autoridades de protección de datos · Capítulo II. Autoridades autonómicas de protección de datos · Sección 1.ª Disposiciones generales","enunciado":"Según el artículo 59 de la Ley Orgánica 3/2018, cuando la Presidencia de la Agencia Española de Protección de Datos considere que un tratamiento llevado a cabo en materias que fueran competencia de las autoridades autonómicas de protección de datos vulnera el Reglamento (UE) 2016/679, podrá:","opciones":{"a":"Requerirlas a que adopten, en el plazo de un mes, las medidas necesarias para su cesación.","b":"Requerirlas a que adopten, en el plazo de quince días, las medidas necesarias para su cesación.","c":"Adoptar directamente, en el plazo de un mes, las medidas necesarias para su cesación, en sustitución de la autoridad autonómica.","d":"Adoptar directamente, en el plazo de quince días, las medidas necesarias para su cesación, en sustitución de la autoridad autonómica."},"correcta":"a","explicacion":"El art. 59 permite a la Presidencia «requerirlas a que adopten, en el plazo de un mes, las medidas necesarias para su cesación»; es la opción a). Si el requerimiento no se atiende, la Agencia podrá ejercer las acciones que procedan ante la jurisdicción contencioso-administrativa. La opción b) acorta el plazo. Las opciones c) y d) permiten a la Agencia sustituir a la autoridad autonómica, lo que el art. 59 no prevé.","cita":"«Cuando la Presidencia de la Agencia Española de Protección de Datos considere que un tratamiento llevado a cabo en materias que fueran competencia de las autoridades autonómicas de protección de datos vulnera el Reglamento (UE) 2016/679 podrá requerirlas a que adopten, en el plazo de un mes, las medidas necesarias para su cesación. Si la autoridad autonómica no atendiere en plazo el requerimiento o las medidas adoptadas no supusiesen la cesación en el tratamiento ilícito, la Agencia Española de Protección de Datos podrá ejercer las acciones que procedan ante la jurisdicción contencioso-administrativa.»","dificultad":2},{"id":"LOPDGDD-L2-025","ley":"LOPDGDD","articulo":"62.2","articulo_txt":"Art. 62.2 LO 3/2018","bloque_id":"LOPDGDD|Título VII. Autoridades de protección de datos · Capítulo II. Autoridades autonómicas de protección de datos · Sección 2.ª Coordinación en el marco de los procedimientos establecidos en el Reglamento (UE) 2016/679","enunciado":"Según el artículo 62.2 de la Ley Orgánica 3/2018, las autoridades autonómicas de protección de datos que tengan la condición de autoridad interesada no principal en un procedimiento de los previstos en el artículo 65 del Reglamento (UE) 2016/679:","opciones":{"a":"Informarán a la Agencia Española de Protección de Datos solo una vez que el Comité Europeo de Protección de Datos haya adoptado su decisión vinculante sobre el asunto.","b":"Informarán directamente al Comité Europeo de Protección de Datos, sin intervención de la Agencia Española de Protección de Datos.","c":"Informarán a la Agencia Española de Protección de Datos cuando el asunto sea remitido al Comité Europeo de Protección de Datos, facilitándole la documentación necesaria.","d":"Informarán a la Agencia Española de Protección de Datos únicamente cuando esta se lo requiera de forma expresa."},"correcta":"c","explicacion":"El art. 62.2 dispone que esas autoridades «informarán a la Agencia Española de Protección de Datos cuando el asunto sea remitido al Comité Europeo de Protección de Datos, facilitándole la documentación e información necesarias para su tramitación»; es la opción c). La opción a) retrasa la información al momento de la decisión del Comité. La opción b) prescinde de la Agencia, a la que el art. 62.2 obliga a informar y que es quien interviene ante el Comité, asistida por un representante de la autoridad autonómica interesada. La opción d) condiciona la información a un requerimiento previo que la norma no exige.","cita":"«2. Las autoridades autonómicas de protección de datos que tengan la condición de autoridad interesada no principal en un procedimiento de los previstos en el artículo 65 del Reglamento (UE) 2016/679 informarán a la Agencia Española de Protección de Datos cuando el asunto sea remitido al Comité Europeo de Protección de Datos, facilitándole la documentación e información necesarias para su tramitación.»","dificultad":2},{"id":"LOPDGDD-L2-027","ley":"LOPDGDD","articulo":"64.1","articulo_txt":"Art. 64.1 LO 3/2018","bloque_id":"LOPDGDD|Título VIII. Procedimientos en caso de posible vulneración de la normativa de protección de datos","enunciado":"Según el artículo 64.1 de la Ley Orgánica 3/2018, cuando el procedimiento se refiera exclusivamente a la falta de atención de una solicitud de ejercicio de los derechos establecidos en los artículos 15 a 22 del Reglamento (UE) 2016/679 y transcurra el plazo para resolverlo:","opciones":{"a":"El interesado podrá considerar desestimada su reclamación.","b":"La reclamación se entenderá inadmitida a trámite.","c":"El interesado podrá considerar estimada su reclamación.","d":"El interesado deberá reiterar su solicitud ante el responsable del tratamiento."},"correcta":"c","explicacion":"El art. 64.1 fija un plazo de seis meses para resolver, a contar desde la notificación al reclamante del acuerdo de admisión a trámite, y añade: «Transcurrido ese plazo, el interesado podrá considerar estimada su reclamación»; es la opción c). Las opciones a) y b) atribuyen al transcurso del plazo un efecto distinto del que fija la norma. La opción d) impone al interesado una carga que el art. 64.1 no prevé.","cita":"«En este caso el plazo para resolver el procedimiento será de seis meses a contar desde la fecha en que hubiera sido notificado al reclamante el acuerdo de admisión a trámite. Transcurrido ese plazo, el interesado podrá considerar estimada su reclamación.»","dificultad":2},{"id":"LOPDGDD-L2-043","ley":"LOPDGDD","articulo":"76.4","articulo_txt":"Art. 76.4 LO 3/2018","bloque_id":"LOPDGDD|Título IX. Régimen sancionador","enunciado":"Según el artículo 76.4 de la Ley Orgánica 3/2018, cuando la autoridad competente sea la Agencia Española de Protección de Datos, será objeto de publicación en el Boletín Oficial del Estado la información que identifique al infractor, la infracción cometida y el importe de la sanción impuesta si:","opciones":{"a":"La sanción fuese superior a 500.000 euros y el infractor sea una persona jurídica.","b":"La sanción fuese superior a un millón de euros y el infractor sea una persona jurídica.","c":"La sanción fuese superior a un millón de euros, tanto si el infractor es una persona física como jurídica.","d":"La sanción fuese superior a 500.000 euros, tanto si el infractor es una persona física como jurídica."},"correcta":"b","explicacion":"El art. 76.4 exige que «la sanción fuese superior a un millón de euros y el infractor sea una persona jurídica»; es la opción b). La opción a) rebaja el umbral. La opción c) incluye a las personas físicas. La opción d) incurre en ambos errores.","cita":"«4. Será objeto de publicación en el Boletín Oficial del Estado la información que identifique al infractor, la infracción cometida y el importe de la sanción impuesta cuando la autoridad competente sea la Agencia Española de Protección de Datos, la sanción fuese superior a un millón de euros y el infractor sea una persona jurídica.»","dificultad":2}]};</script>
<script>
/* Letra de Ley — motor de test. Sin dependencias; funciona sin conexión.
   Necesita window.LDL_CONFIG y window.LDL_BANCO (los inyecta sistema/letradeley.py). */
(function () {
  "use strict";
  var CFG = window.LDL_CONFIG, B = window.LDL_BANCO;
  var raiz = document.getElementById("ldl");
  var LETRAS = ["a", "b", "c", "d"];
  var POR_ID = {};
  B.preguntas.forEach(function (p) { POR_ID[p.id] = p; });
  var CLAVE = "ldl1:" + CFG.pack.id;
  var prog = cargar();
  var sesion = null;
  var vista = CFG.modo === "web" ? "portada" : "inicio";
  var reloj = null;

  /* ---------- utilidades ---------- */
  function esc(t) {
    return String(t == null ? "" : t).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function barajar(lista) {
    var a = lista.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function pct(a, b) { return b ? Math.round((a / b) * 100) : 0; }
  function plural(n, uno, varios) { return n + " " + (n === 1 ? uno : varios); }
  function num(n) { return String(n).replace(".", ","); }
  function cargar() {
    try { var s = localStorage.getItem(CLAVE); if (s) { var d = JSON.parse(s); if (d && d.p) return d; } } catch (e) {}
    return { p: {}, h: [] };
  }
  function guardar() { try { localStorage.setItem(CLAVE, JSON.stringify(prog)); } catch (e) {} }
  function registrar(id, acierto) {
    var r = prog.p[id] || { v: 0, a: 0, f: 0, c: 0 };
    r.v++;
    if (acierto) { r.a++; r.c = Math.min((r.c || 0) + 1, 5); } else { r.f++; r.c = 0; }
    r.u = acierto ? 1 : 0;
    r.t = Date.now();
    prog.p[id] = r;
    guardar();
  }
  function fallosPendientes() {
    return B.preguntas.filter(function (p) { var r = prog.p[p.id]; return r && r.u === 0; });
  }
  function resumen(lista) {
    var vistas = 0, aciertos = 0, intentos = 0;
    lista.forEach(function (p) {
      var r = prog.p[p.id];
      if (r) { vistas++; aciertos += r.a; intentos += r.v; }
    });
    return { total: lista.length, vistas: vistas, acierto: pct(aciertos, intentos) };
  }
  function delBloque(id) { return B.preguntas.filter(function (p) { return p.bloque_id === id; }); }

  /* ---------- tema claro / oscuro ---------- */
  function aplicarTema() {
    var t = null;
    try { t = localStorage.getItem("ldl:tema"); } catch (e) {}
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    else document.documentElement.removeAttribute("data-theme");
    return t || "auto";
  }
  function cambiarTema() {
    var orden = { auto: "light", light: "dark", dark: "auto" };
    var actual = aplicarTema();
    try { localStorage.setItem("ldl:tema", orden[actual]); } catch (e) {}
    aplicarTema();
    pintar();
  }

  /* ---------- sesiones ---------- */
  function empezar(tipo, preguntas, opciones) {
    opciones = opciones || {};
    if (!preguntas.length) return;
    pararReloj();
    sesion = {
      tipo: tipo, titulo: opciones.titulo || "Test", ids: preguntas.map(function (p) { return p.id; }),
      i: 0, resp: {}, corregida: {}, inicio: Date.now(), limite: opciones.minutos ? opciones.minutos * 60 : 0, fin: null,
      origen: vista === "test" || vista === "resultado" ? (sesion && sesion.origen) || "inicio" : vista
    };
    vista = "test";
    if (sesion.limite) reloj = setInterval(tic, 1000);
    pintar();
    window.scrollTo(0, 0);
  }
  function tic() {
    if (!sesion || sesion.fin) return pararReloj();
    var el = document.getElementById("ldl-crono");
    var resta = sesion.limite - Math.floor((Date.now() - sesion.inicio) / 1000);
    if (resta <= 0) { terminar(); return; }
    if (el) el.textContent = mmss(resta);
  }
  function pararReloj() { if (reloj) { clearInterval(reloj); reloj = null; } }
  function mmss(s) { var m = Math.floor(s / 60), r = s % 60; return m + ":" + (r < 10 ? "0" : "") + r; }

  function responder(letra) {
    var id = sesion.ids[sesion.i];
    if (sesion.tipo === "simulacro") {
      sesion.resp[id] = sesion.resp[id] === letra ? undefined : letra;
      pintar();
      return;
    }
    if (sesion.corregida[id]) return;
    sesion.resp[id] = letra;
    sesion.corregida[id] = true;
    registrar(id, letra === POR_ID[id].correcta);
    pintar();
  }
  function siguiente() {
    if (sesion.i < sesion.ids.length - 1) { sesion.i++; pintar(); window.scrollTo(0, 0); }
    else terminar();
  }
  function anterior() { if (sesion.i > 0) { sesion.i--; pintar(); } }
  function terminar() {
    pararReloj();
    if (sesion.tipo === "simulacro") {
      sesion.ids.forEach(function (id) {
        if (sesion.resp[id]) registrar(id, sesion.resp[id] === POR_ID[id].correcta);
      });
    }
    sesion.fin = Date.now();
    var r = calcular(sesion);
    prog.h.unshift({ t: sesion.fin, tipo: sesion.tipo, n: r.total, a: r.aciertos, e: r.errores, nota: r.nota });
    prog.h = prog.h.slice(0, 50);
    guardar();
    vista = "resultado";
    pintar();
    window.scrollTo(0, 0);
  }
  function calcular(s) {
    var a = 0, e = 0, nr = 0;
    s.ids.forEach(function (id) {
      var r = s.resp[id];
      if (!r) nr++; else if (r === POR_ID[id].correcta) a++; else e++;
    });
    var pen = (CFG.simulacro && CFG.simulacro.penalizacion) || 1 / 3;
    var neta = s.tipo === "simulacro" ? a - e * pen : a;
    var nota = Math.max(0, (neta / s.ids.length) * 10);
    return { total: s.ids.length, aciertos: a, errores: e, blancos: nr, neta: neta, nota: Math.round(nota * 100) / 100 };
  }

  /* ---------- vistas ---------- */
  function cabecera() {
    var tema = aplicarTema();
    var etiquetas = { auto: "Tema: auto", light: "Tema: claro", dark: "Tema: oscuro" };
    return '<header class="ldl-top"><a class="ldl-brand" href="' + esc(CFG.web || "#") + '">' +
      '<span class="ldl-logo" aria-hidden="true">§</span><span><b>Letra de Ley</b><small>' +
      esc(CFG.pack.nombre) + "</small></span></a>" +
      '<button class="ldl-tema" data-acc="tema" type="button">' + etiquetas[tema] + "</button></header>";
  }
  function navegacion() {
    if (CFG.modo === "web") return "";
    var items = [["inicio", "Inicio"], ["temas", "Por temas"], ["simulacro", "Simulacro"], ["fallos", "Fallos"], ["stats", "Estadísticas"]];
    return '<nav class="ldl-nav" aria-label="Secciones">' + items.map(function (it) {
      var actual = vista === it[0] || (vista === "test" && sesion && sesion.origen === it[0]);
      return '<button type="button" data-acc="ir" data-v="' + it[0] + '"' + (actual ? ' aria-current="page"' : "") + ">" + it[1] + "</button>";
    }).join("") + "</nav>";
  }
  function pie() {
    return '<p class="ldl-pie">Letra de Ley · ' + esc(CFG.pack.edicion) + " · Texto legal actualizado a " +
      esc(CFG.pack.actualizado) + "<br>Uso personal. Prohibida su redistribución.</p>";
  }

  function vInicio() {
    var r = resumen(B.preguntas), f = fallosPendientes().length;
    return '<section class="ldl-card"><h2>' + esc(CFG.pack.nombre) + "</h2>" +
      '<p class="ldl-muted">' + B.preguntas.length + " preguntas comentadas, con el artículo exacto de cada respuesta.</p>" +
      '<div class="ldl-kpis"><div class="ldl-kpi"><b>' + r.vistas + "/" + r.total + "</b><span>respondidas</span></div>" +
      '<div class="ldl-kpi"><b>' + r.acierto + ' %</b><span>de acierto</span></div>' +
      '<div class="ldl-kpi"><b>' + f + "</b><span>fallos por repasar</span></div></div>" +
      '<div class="ldl-acciones"><button class="ldl-btn" data-acc="rapido" type="button">Test rápido de 20</button>' +
      '<button class="ldl-btn sec" data-acc="ir" data-v="simulacro" type="button">Simulacro de examen</button>' +
      (f ? '<button class="ldl-btn sec" data-acc="repasar" type="button">Repasar ' + f + " fallos</button>" : "") +
      "</div></section>" +
      '<section class="ldl-card"><h3>Cómo sacarle partido</h3><ol class="ldl-muted">' +
      "<li>Practica <b>por temas</b>: cada respuesta te enseña el artículo y por qué fallan las demás opciones.</li>" +
      "<li>Cada pocos días, <b>repasa tus fallos</b>: es donde más se aprende.</li>" +
      "<li>Antes del examen, haz <b>simulacros</b> con tiempo y con la penalización real (cada error resta 1/3).</li></ol>" +
      '<p class="ldl-small ldl-muted">Tu progreso se guarda en este dispositivo y en este navegador.</p></section>' + historial();
  }
  function historial() {
    if (!prog.h.length) return "";
    return '<section class="ldl-card"><h3>Últimos tests</h3><ul class="ldl-revision">' + prog.h.slice(0, 5).map(function (h) {
      var d = new Date(h.t);
      return "<li><b>" + (h.tipo === "simulacro" ? "Simulacro" : "Práctica") + "</b> · " + d.toLocaleDateString("es-ES") +
        " · " + h.a + "/" + h.n + " aciertos" + (h.tipo === "simulacro" ? " · nota " + num(h.nota) : "") + "</li>";
    }).join("") + "</ul></section>";
  }
  function vTemas() {
    var html = '<section class="ldl-card"><h2>Practicar por temas</h2><p class="ldl-muted">Elige un bloque. Las preguntas salen en orden aleatorio y se corrigen al momento.</p><ul class="ldl-bloques">';
    B.bloques.forEach(function (b) {
      var lista = delBloque(b.id), r = resumen(lista);
      html += '<li><button type="button" data-acc="bloque" data-id="' + esc(b.id) + '"><span class="t">' + esc(b.nombre) +
        '</span><span class="n">' + r.vistas + "/" + r.total + (r.vistas ? " · " + r.acierto + " %" : "") + "</span>" +
        '<span class="ldl-barra"><i style="width:' + pct(r.vistas, r.total) + '%"></i></span></button></li>';
    });
    return html + "</ul></section>";
  }
  function vSimulacro() {
    var total = B.preguntas.length;
    var opcionesN = [10, 20, 30, 50, 100].filter(function (n) { return n < total; });
    opcionesN.push(total);
    var porDefecto = Math.min((CFG.simulacro && CFG.simulacro.preguntas) || 30, total);
    return '<section class="ldl-card"><h2>Simulacro de examen</h2>' +
      '<p class="ldl-muted">Como el día del examen: no ves las soluciones hasta el final y cada error resta un tercio de acierto.</p>' +
      '<div class="ldl-campo"><label for="ldl-n">Número de preguntas</label><select id="ldl-n">' +
      opcionesN.map(function (n) { return "<option" + (n === porDefecto ? " selected" : "") + ">" + n + "</option>"; }).join("") +
      '</select></div><div class="ldl-campo"><label for="ldl-t">Tiempo</label><select id="ldl-t">' +
      '<option value="1">1 minuto por pregunta</option><option value="0">Sin límite de tiempo</option></select></div>' +
      '<div class="ldl-campo"><label for="ldl-b">Temas</label><select id="ldl-b"><option value="">Todos</option>' +
      B.bloques.map(function (b) { return '<option value="' + esc(b.id) + '">' + esc(b.nombre) + "</option>"; }).join("") +
      '</select></div><div class="ldl-acciones"><button class="ldl-btn" data-acc="simular" type="button">Empezar simulacro</button></div></section>';
  }
  function vFallos() {
    var f = fallosPendientes();
    if (!f.length) {
      return '<section class="ldl-card"><h2>Repaso de fallos</h2><p class="ldl-muted">No tienes fallos pendientes. Cuando falles una pregunta aparecerá aquí hasta que la aciertes.</p></section>';
    }
    return '<section class="ldl-card"><h2>Repaso de fallos</h2><p class="ldl-muted">Tienes <b>' + f.length +
      "</b> preguntas falladas. Salen de aquí en cuanto las aciertas.</p>" +
      '<div class="ldl-acciones"><button class="ldl-btn" data-acc="repasar" type="button">Repasar ahora</button></div></section>';
  }
  function vStats() {
    var html = '<section class="ldl-card"><h2>Estadísticas</h2><ul class="ldl-bloques">';
    B.bloques.forEach(function (b) {
      var r = resumen(delBloque(b.id));
      html += '<li><button type="button" data-acc="bloque" data-id="' + esc(b.id) + '"><span class="t">' + esc(b.nombre) +
        '</span><span class="n">' + (r.vistas ? r.acierto + " % de acierto" : "sin empezar") + '</span><span class="ldl-barra"><i style="width:' +
        r.acierto + '%"></i></span></button></li>';
    });
    html += '</ul></section><section class="ldl-card"><h3>Empezar de cero</h3><p class="ldl-muted ldl-small">Borra tu progreso guardado en este dispositivo.</p>' +
      '<div class="ldl-acciones"><button class="ldl-btn sec" data-acc="borrar" type="button">Borrar mi progreso</button></div></section>';
    return html;
  }
  function vPortada() {
    var n = B.preguntas.length;
    return '<section class="ldl-card"><h2>' + esc(CFG.pack.nombre) + "</h2>" +
      '<p class="ldl-muted">' + n + " preguntas tipo examen, corregidas al momento, con el artículo exacto y la explicación de cada opción. Gratis y sin registrarte.</p>" +
      '<div class="ldl-acciones"><button class="ldl-btn" data-acc="empezarweb" type="button">Empezar el test</button></div></section>';
  }

  function vTest() {
    var id = sesion.ids[sesion.i], p = POR_ID[id], sim = sesion.tipo === "simulacro";
    var elegida = sesion.resp[id], corregida = !sim && sesion.corregida[id];
    var html = '<section class="ldl-card"><div class="ldl-meta"><span>' + esc(sesion.titulo) + " · " + (sesion.i + 1) + " de " + sesion.ids.length +
      "</span><span>" + (sesion.limite ? '⏱ <span id="ldl-crono" class="ldl-crono">' +
        mmss(Math.max(0, sesion.limite - Math.floor((Date.now() - sesion.inicio) / 1000))) + "</span>" : esc(p.articulo_txt)) +
      '</span></div><div class="ldl-progreso"><i style="width:' + pct(sesion.i + (corregida ? 1 : 0), sesion.ids.length) + '%"></i></div>' +
      '<p class="ldl-enunciado">' + esc(p.enunciado) + '</p><div class="ldl-opciones" role="group" aria-label="Opciones">';
    LETRAS.forEach(function (l) {
      var cls = "ldl-op";
      if (corregida) { if (l === p.correcta) cls += " ok"; else if (l === elegida) cls += " ko"; }
      else if (sim && elegida === l) cls += " marcada";
      html += '<button type="button" class="' + cls + '" data-acc="resp" data-l="' + l + '"' + (corregida ? " disabled" : "") +
        (sim ? ' aria-pressed="' + (elegida === l) + '"' : "") + '><span class="l">' + l + ")</span><span>" + esc(p.opciones[l]) + "</span></button>";
    });
    html += "</div>";
    if (corregida) html += feedback(p, elegida);
    html += '<div class="ldl-acciones">';
    if (sim) {
      html += (sesion.i > 0 ? '<button class="ldl-btn sec" data-acc="ant" type="button">Anterior</button>' : "") +
        '<button class="ldl-btn" data-acc="sig" type="button">' + (sesion.i < sesion.ids.length - 1 ? "Siguiente" : "Entregar") + "</button>" +
        (sesion.i < sesion.ids.length - 1 ? '<button class="ldl-btn sec" data-acc="entregar" type="button">Entregar ya</button>' : "");
    } else if (corregida) {
      html += '<button class="ldl-btn" data-acc="sig" type="button">' + (sesion.i < sesion.ids.length - 1 ? "Siguiente" : "Ver resultado") + "</button>";
    }
    html += '<button class="ldl-btn sec" data-acc="salir" type="button">Salir</button></div></section>';
    return html;
  }
  function feedback(p, elegida) {
    var bien = elegida === p.correcta;
    return '<div class="ldl-feedback" aria-live="polite"><div class="v ' + (bien ? "ok" : "ko") + '">' +
      (bien ? "¡Correcta!" : "Incorrecta. La respuesta correcta es la " + p.correcta + ")") + "</div><div>" + esc(p.explicacion) + "</div>" +
      (p.cita ? '<blockquote class="ldl-cita">' + esc(p.cita) + "<small>" + esc(p.articulo_txt) + "</small></blockquote>" : "") + "</div>";
  }
  function vResultado() {
    var r = calcular(sesion), sim = sesion.tipo === "simulacro";
    var html = '<section class="ldl-card"><h2>' + (sim ? "Resultado del simulacro" : "Resultado") + "</h2>" +
      '<div class="ldl-nota">' + (sim ? num(r.nota.toFixed(2)) : r.aciertos + "/" + r.total) + "</div>" +
      '<p class="ldl-muted">' + plural(r.aciertos, "acierto", "aciertos") + " · " + plural(r.errores, "error", "errores") +
      (r.blancos ? " · " + r.blancos + " en blanco" : "") +
      (sim ? " · nota sobre 10 con penalización" : "") + "</p>";
    if (CFG.modo === "web") html += ctaWeb(r);
    html += '<div class="ldl-acciones">' + (CFG.modo === "web" ? '<button class="ldl-btn sec" data-acc="empezarweb" type="button">Repetir con otro orden</button>' :
      '<button class="ldl-btn" data-acc="ir" data-v="inicio" type="button">Volver al inicio</button>') + "</div></section>";
    html += '<section class="ldl-card"><h3>Revisión</h3><ul class="ldl-revision">';
    sesion.ids.forEach(function (id, n) {
      var p = POR_ID[id], e = sesion.resp[id], chip = !e ? '<span class="ldl-chip nr">En blanco</span>' :
        e === p.correcta ? '<span class="ldl-chip ok">Bien</span>' : '<span class="ldl-chip ko">Mal</span>';
      html += "<li>" + chip + '<span class="e">' + (n + 1) + ". " + esc(p.enunciado) + "</span><br>" +
        '<span class="ldl-small">Correcta: <b>' + p.correcta + ") " + esc(p.opciones[p.correcta]) + "</b>" +
        (e && e !== p.correcta ? " · Marcaste " + e + ")" : "") + '</span><br><span class="ldl-small ldl-muted">' + esc(p.explicacion) + "</span></li>";
    });
    return html + "</ul></section>";
  }
  function ctaWeb() {
    var c = CFG.compra || {}, html = "";
    if (c.url) {
      html += '<div class="ldl-card ldl-cta"><h3>' + esc(c.titulo) + '</h3><p class="ldl-muted">' + esc(c.texto) + "</p>" +
        '<div class="ldl-acciones"><a class="ldl-btn acc" href="' + esc(c.url) + '">' + esc(c.boton) + "</a></div></div>";
    }
    if (CFG.telegram) {
      html += '<p class="ldl-small">¿Quieres un test cada día? <a href="' + esc(CFG.telegram) + '">Únete gratis al canal de Telegram</a>.</p>';
    }
    return html;
  }

  function pintar() {
    var cuerpo;
    if (vista === "test") cuerpo = vTest();
    else if (vista === "resultado") cuerpo = vResultado();
    else if (vista === "portada") cuerpo = vPortada();
    else if (vista === "temas") cuerpo = vTemas();
    else if (vista === "simulacro") cuerpo = vSimulacro();
    else if (vista === "fallos") cuerpo = vFallos();
    else if (vista === "stats") cuerpo = vStats();
    else cuerpo = vInicio();
    raiz.innerHTML = '<div class="ldl">' + cabecera() + navegacion() + "<main>" + cuerpo + "</main>" + pie() + "</div>";
  }

  /* ---------- eventos ---------- */
  raiz.addEventListener("click", function (ev) {
    var el = ev.target.closest("[data-acc]");
    if (!el) return;
    var acc = el.getAttribute("data-acc");
    if (acc === "tema") return cambiarTema();
    if (acc === "ir") { pararReloj(); vista = el.getAttribute("data-v"); sesion = null; pintar(); return; }
    if (acc === "rapido") return empezar("practica", barajar(B.preguntas).slice(0, 20), { titulo: "Test rápido" });
    if (acc === "repasar") return empezar("practica", barajar(fallosPendientes()).slice(0, 30), { titulo: "Repaso de fallos" });
    if (acc === "bloque") {
      var b = B.bloques.filter(function (x) { return x.id === el.getAttribute("data-id"); })[0];
      return empezar("practica", barajar(delBloque(b.id)), { titulo: b.nombre });
    }
    if (acc === "simular") {
      var n = parseInt(document.getElementById("ldl-n").value, 10);
      var conTiempo = document.getElementById("ldl-t").value === "1";
      var bloque = document.getElementById("ldl-b").value;
      var fuente = bloque ? delBloque(bloque) : B.preguntas;
      var elegidas = barajar(fuente).slice(0, n);
      return empezar("simulacro", elegidas, { titulo: "Simulacro", minutos: conTiempo ? elegidas.length : 0 });
    }
    if (acc === "empezarweb") return empezar("practica", barajar(B.preguntas), { titulo: "Test gratuito" });
    if (acc === "resp") return responder(el.getAttribute("data-l"));
    if (acc === "sig") return siguiente();
    if (acc === "ant") return anterior();
    if (acc === "entregar") return terminar();
    if (acc === "salir") { pararReloj(); sesion = null; vista = CFG.modo === "web" ? "portada" : "inicio"; pintar(); return; }
    if (acc === "borrar") {
      if (el.getAttribute("data-confirmar") === "1") { prog = { p: {}, h: [] }; guardar(); pintar(); }
      else { el.setAttribute("data-confirmar", "1"); el.textContent = "Pulsa otra vez para confirmar"; }
    }
  });
  document.addEventListener("keydown", function (ev) {
    if (vista !== "test" || !sesion || ev.altKey || ev.ctrlKey || ev.metaKey) return;
    var k = ev.key.toLowerCase(), mapa = { "1": "a", "2": "b", "3": "c", "4": "d", a: "a", b: "b", c: "c", d: "d" };
    if (mapa[k]) { ev.preventDefault(); responder(mapa[k]); }
    else if (k === "enter" || k === "arrowright") {
      var id = sesion.ids[sesion.i];
      if (sesion.tipo === "simulacro" || sesion.corregida[id]) { ev.preventDefault(); siguiente(); }
    } else if (k === "arrowleft" && sesion.tipo === "simulacro") { ev.preventDefault(); anterior(); }
  });

  pintar();
})();
</script>
</body>
</html>
