gualdad en el empleo público · Capítulo V. Fuerzas y Cuerpos de Seguridad del Estado","ley":"LOI","nombre":"Título V. El principio de igualdad en el empleo público · Capítulo V. Fuerzas y Cuerpos de Seguridad del Estado"},{"id":"LOI|Título VI. Igualdad de trato en el acceso a bienes y servicios y su suministro","ley":"LOI","nombre":"Título VI. Igualdad de trato en el acceso a bienes y servicios y su suministro"},{"id":"LOI|Título VII. La igualdad en la responsabilidad social de las empresas","ley":"LOI","nombre":"Título VII. La igualdad en la responsabilidad social de las empresas"},{"id":"LOI|Título VIII. Disposiciones organizativas","ley":"LOI","nombre":"Título VIII. Disposiciones organizativas"},{"id":"LOI|Disposiciones adicionales","ley":"LOI","nombre":"Disposiciones adicionales"},{"id":"LOI|Disposiciones transitorias","ley":"LOI","nombre":"Disposiciones transitorias"},{"id":"LOI|Disposiciones finales","ley":"LOI","nombre":"Disposiciones finales"}],"preguntas":[{"id":"LOI-L1-002","ley":"LOI","articulo":"1.1","articulo_txt":"Art. 1.1 LO 3/2007","bloque_id":"LOI|Título preliminar. Objeto y ámbito de la Ley","enunciado":"Según el artículo 1.1 de la Ley Orgánica 3/2007, la eliminación de la discriminación de la mujer se persigue en cualesquiera de los ámbitos de la vida y, singularmente, en las esferas:","opciones":{"a":"Política, laboral, económica, educativa, sanitaria y cultural.","b":"Civil, laboral, familiar, económica, social y deportiva.","c":"Política, judicial, laboral, económica, social y artística.","d":"Política, civil, laboral, económica, social y cultural."},"correcta":"d","explicacion":"El art. 1.1 enumera «las esferas política, civil, laboral, económica, social y cultural»; es la opción d). Las opciones a), b) y c) incluyen esferas que el art. 1.1 no menciona (educativa, sanitaria, familiar, deportiva, judicial o artística) en lugar de algunas de las que sí enumera.","cita":"«1. Las mujeres y los hombres son iguales en dignidad humana, e iguales en derechos y deberes. Esta Ley tiene por objeto hacer efectivo el derecho de igualdad de trato y de oportunidades entre mujeres y hombres, en particular mediante la eliminación de la discriminación de la mujer, sea cual fuere su circunstancia o condición, en cualesquiera de los ámbitos de la vida y, singularmente, en las esferas política, civil, laboral, económica, social y cultural para, en el desarrollo de los artículos 9.2 y 14 de la Constitución, alcanzar una sociedad más democrática, más justa y más solidaria.»","dificultad":2},{"id":"LOI-L1-003","ley":"LOI","articulo":"1.2","articulo_txt":"Art. 1.2 LO 3/2007","bloque_id":"LOI|Título preliminar. Objeto y ámbito de la Ley","enunciado":"Según el artículo 1.2 de la Ley Orgánica 3/2007, a los efectos de hacer efectivo el derecho de igualdad de trato y de oportunidades, la Ley regula derechos y deberes de:","opciones":{"a":"Las personas físicas y las personas jurídicas privadas, mientras que a las públicas solo les fija principios de actuación.","b":"Las personas físicas y jurídicas, tanto públicas como privadas.","c":"Los empleados públicos y las empresas que contraten con el sector público.","d":"Las Administraciones públicas y las organizaciones sindicales y empresariales."},"correcta":"b","explicacion":"El art. 1.2 dispone que la Ley «regula derechos y deberes de las personas físicas y jurídicas, tanto públicas como privadas»; es la opción b). La opción a) excluye a las personas jurídicas públicas, que el art. 1.2 sí incluye; los principios de actuación los establece la Ley para los Poderes Públicos. Las opciones c) y d) limitan los destinatarios a determinados sujetos, cuando el art. 1.2 se refiere a todas las personas físicas y jurídicas.","cita":"«2. A estos efectos, la Ley establece principios de actuación de los Poderes Públicos, regula derechos y deberes de las personas físicas y jurídicas, tanto públicas como privadas, y prevé medidas destinadas a eliminar y corregir en los sectores público y privado, toda forma de discriminación por razón de sexo.»","dificultad":2},{"id":"LOI-L1-005","ley":"LOI","articulo":"2.2","articulo_txt":"Art. 2.2 LO 3/2007","bloque_id":"LOI|Título preliminar. Objeto y ámbito de la Ley","enunciado":"Según el artículo 2.2 de la Ley Orgánica 3/2007, las obligaciones establecidas en la Ley serán de aplicación a toda persona, física o jurídica:","opciones":{"a":"Que se encuentre o actúe en territorio español, cualquiera que fuese su nacionalidad, domicilio o residencia.","b":"Que tenga su domicilio o su residencia habitual en territorio español, cualquiera que fuese su nacionalidad o el lugar donde actúe.","c":"De nacionalidad española o que resida legalmente en España, con independencia del lugar en que desarrolle su actividad.","d":"Que actúe en territorio español, siempre que tenga allí su domicilio social o su residencia legal durante más de seis meses."},"correcta":"a","explicacion":"El art. 2.2 aplica las obligaciones de la Ley a toda persona «que se encuentre o actúe en territorio español, cualquiera que fuese su nacionalidad, domicilio o residencia»; es la opción a). Las opciones b), c) y d) hacen depender la aplicación del domicilio, la residencia o la nacionalidad, circunstancias que el art. 2.2 declara irrelevantes.","cita":"«2. Las obligaciones establecidas en esta Ley serán de aplicación a toda persona, física o jurídica, que se encuentre o actúe en territorio español, cualquiera que fuese su nacionalidad, domicilio o residencia.»","dificultad":2},{"id":"LOI-L1-006","ley":"LOI","articulo":"3","articulo_txt":"Art. 3 LO 3/2007","bloque_id":"LOI|Título I. El principio de igualdad y la tutela contra la discriminación","enunciado":"Según el artículo 3 de la Ley Orgánica 3/2007, el principio de igualdad de trato entre mujeres y hombres supone la ausencia de toda discriminación, directa o indirecta, por razón de sexo, y, especialmente, de las derivadas de:","opciones":{"a":"El embarazo, la orientación sexual y la situación familiar.","b":"La maternidad, la edad y la situación laboral.","c":"La paternidad, la convivencia en pareja y el estado civil.","d":"La maternidad, la asunción de obligaciones familiares y el estado civil."},"correcta":"d","explicacion":"El art. 3 menciona especialmente las discriminaciones derivadas de «la maternidad, la asunción de obligaciones familiares y el estado civil»; es la opción d). Las opciones a), b) y c) sustituyen alguna de esas tres circunstancias por otras que el art. 3 no menciona.","cita":"«El principio de igualdad de trato entre mujeres y hombres supone la ausencia de toda discriminación, directa o indirecta, por razón de sexo, y, especialmente, las derivadas de la maternidad, la asunción de obligaciones familiares y el estado civil.»","dificultad":2},{"id":"LOI-L1-009","ley":"LOI","articulo":"5","articulo_txt":"Art. 5 LO 3/2007","bloque_id":"LOI|Título I. El principio de igualdad y la tutela contra la discriminación","enunciado":"Según el artículo 5 de la Ley Orgánica 3/2007, el principio de igualdad de trato y de oportunidades se garantizará también en la afiliación y participación en:","opciones":{"a":"Los partidos políticos y las organizaciones sindicales, con exclusión de las organizaciones empresariales.","b":"Las asociaciones de mujeres y las organizaciones no gubernamentales de cooperación para el desarrollo.","c":"Las fundaciones y las asociaciones declaradas de utilidad pública por la Administración competente.","d":"Las organizaciones sindicales y empresariales y las organizaciones cuyos miembros ejerzan una profesión concreta."},"correcta":"d","explicacion":"El art. 5 incluye la afiliación y participación «en las organizaciones sindicales y empresariales, o en cualquier organización cuyos miembros ejerzan una profesión concreta, incluidas las prestaciones concedidas por las mismas»; es la opción d). La opción a) excluye las organizaciones empresariales, que el art. 5 menciona expresamente. Las opciones b) y c) se refieren a entidades que el art. 5 no menciona en este punto.","cita":"«El principio de igualdad de trato y de oportunidades entre mujeres y hombres, aplicable en el ámbito del empleo privado y en el del empleo público, se garantizará, en los términos previstos en la normativa aplicable, en el acceso al empleo, incluso al trabajo por cuenta propia, en la formación profesional, en la promoción profesional, en las condiciones de trabajo, incluidas las retributivas y las de despido, y en la afiliación y participación en las organizaciones sindicales y empresariales, o en cualquier organización cuyos miembros ejerzan una profesión concreta, incluidas las prestaciones concedidas por las mismas.»","dificultad":2},{"id":"LOI-L4-003","ley":"LOI","articulo":"14.10","articulo_txt":"Art. 14.10 LO 3/2007","bloque_id":"LOI|Título II. Políticas públicas para la igualdad · Capítulo I. Principios generales","enunciado":"Según el artículo 14 de la Ley Orgánica 3/2007, ¿cuál de los siguientes figura entre los criterios generales de actuación de los Poderes Públicos a los fines de esa Ley?","opciones":{"a":"El fomento de la efectividad del principio de igualdad entre mujeres y hombres en las relaciones entre particulares.","b":"La gratuidad de los servicios públicos de atención a la primera infancia para las familias monoparentales con rentas bajas.","c":"La exención de tasas académicas para las mujeres que cursen enseñanzas técnicas en las universidades públicas.","d":"La creación de juzgados especializados en la discriminación por razón de sexo en todas las provincias."},"correcta":"a","explicacion":"El art. 14.10 recoge «El fomento de la efectividad del principio de igualdad entre mujeres y hombres en las relaciones entre particulares»; es la opción a). Las opciones b), c) y d) describen medidas que no figuran entre los criterios del art. 14.","cita":"«10. El fomento de la efectividad del principio de igualdad entre mujeres y hombres en las relaciones entre particulares.»","dificultad":2},{"id":"LOI-L1-039","ley":"LOI","articulo":"17","articulo_txt":"Art. 17 LO 3/2007","bloque_id":"LOI|Título II. Políticas públicas para la igualdad · Capítulo I. Principios generales","enunciado":"Según el artículo 17 de la Ley Orgánica 3/2007, el Plan Estratégico de Igualdad de Oportunidades que se apruebe periódicamente se referirá a:","opciones":{"a":"Las materias que sean de la competencia del Estado.","b":"Todas las materias, incluidas las de competencia autonómica.","c":"Las materias estatales y las que le deleguen las Comunidades Autónomas.","d":"Solo el empleo público de la Administración General del Estado."},"correcta":"a","explicacion":"El art. 17 prevé que el Gobierno, «en las materias que sean de la competencia del Estado», apruebe periódicamente ese Plan; es la opción a). Las opciones b) y c) extienden el Plan a materias autonómicas, lo que el art. 17 no prevé. La opción d) es falsa: el art. 17 no limita el Plan al empleo público; incluirá medidas para alcanzar la igualdad y eliminar la discriminación por razón de sexo en las materias de competencia estatal.","cita":"«El Gobierno, en las materias que sean de la competencia del Estado, aprobará periódicamente un Plan Estratégico de Igualdad de Oportunidades, que incluirá medidas para alcanzar el objetivo de igualdad entre mujeres y hombres y eliminar la discriminación por razón de sexo.»","dificultad":2},{"id":"LOI-L2-007","ley":"LOI","articulo":"29.2","articulo_txt":"Art. 29.2 LO 3/2007","bloque_id":"LOI|Título II. Políticas públicas para la igualdad · Capítulo II. Acción administrativa para la igualdad","enunciado":"Según el artículo 29.2 de la Ley Orgánica 3/2007, el Gobierno promoverá el deporte femenino y favorecerá la efectiva apertura de las disciplinas deportivas a las mujeres mediante el desarrollo de programas específicos:","opciones":{"a":"En la etapa escolar y universitaria, como base para la incorporación posterior al deporte de competición.","b":"En el deporte de alto nivel y de alto rendimiento, con exclusión de los órganos de dirección deportiva.","c":"En las disciplinas deportivas en que la participación femenina sea inferior a la masculina.","d":"En todas las etapas de la vida y en todos los niveles, incluidos los de responsabilidad y decisión."},"correcta":"d","explicacion":"El art. 29.2 prevé programas específicos «en todas las etapas de la vida y en todos los niveles, incluidos los de responsabilidad y decisión»; es la opción d). Las opciones a) y c) restringen los programas a determinadas etapas o disciplinas, cuando el art. 29.2 los extiende a todas las etapas de la vida y a todos los niveles. La opción b) es falsa: el art. 29.2 incluye expresamente los niveles de responsabilidad y decisión.","cita":"«2. El Gobierno promoverá el deporte femenino y favorecerá la efectiva apertura de las disciplinas deportivas a las mujeres, mediante el desarrollo de programas específicos en todas las etapas de la vida y en todos los niveles, incluidos los de responsabilidad y decisión.»","dificultad":2},{"id":"LOI-L2-009","ley":"LOI","articulo":"31.2","articulo_txt":"Art. 31.2 LO 3/2007","bloque_id":"LOI|Título II. Políticas públicas para la igualdad · Capítulo II. Acción administrativa para la igualdad","enunciado":"Según el artículo 31.2 de la Ley Orgánica 3/2007, el Gobierno fomentará el acceso a la vivienda de las mujeres en situación de necesidad o en riesgo de exclusión, y de las que hayan sido víctimas de la violencia de género, en especial cuando, en ambos casos:","opciones":{"a":"Residan en municipios del medio rural.","b":"Carezcan de una vivienda en propiedad.","c":"Tengan hijos menores exclusivamente a su cargo.","d":"Tengan a su cargo personas mayores o dependientes."},"correcta":"c","explicacion":"El art. 31.2 pone el acento en los casos en que esas mujeres «tengan hijos menores exclusivamente a su cargo»; es la opción c). Las opciones a), b) y d) mencionan circunstancias que el art. 31.2 no destaca; la atención a menores, mayores y dependientes en el mundo rural aparece en el art. 30.4 como medida de conciliación, no en materia de vivienda.","cita":"«2. El Gobierno, en el ámbito de sus competencias, fomentará el acceso a la vivienda de las mujeres en situación de necesidad o en riesgo de exclusión, y de las que hayan sido víctimas de la violencia de género, en especial cuando, en ambos casos, tengan hijos menores exclusivamente a su cargo.»","dificultad":2},{"id":"LOI-L2-019","ley":"LOI","articulo":"37.2","articulo_txt":"Art. 37.2 LO 3/2007","bloque_id":"LOI|Título III. Igualdad y medios de comunicación","enunciado":"Según el artículo 37.2 de la Ley Orgánica 3/2007, la Corporación RTVE fomentará la relación con asociaciones y grupos de mujeres con el fin de:","opciones":{"a":"Identificar sus necesidades e intereses en el ámbito de la comunicación.","b":"Elaborar con ellos los códigos de conducta previstos en el apartado 1.","c":"Cederles espacios gratuitos de emisión en su programación.","d":"Integrarlos en sus órganos de control de la programación."},"correcta":"a","explicacion":"El art. 37.2 dispone que la Corporación RTVE «fomentará la relación con asociaciones y grupos de mujeres para identificar sus necesidades e intereses en el ámbito de la comunicación»; es la opción a). La opción b) es falsa: el art. 37.1.c) se refiere a la adopción de códigos de conducta «mediante la autorregulación», sin prever su elaboración con esas asociaciones. Las opciones c) y d) atribuyen a esa relación finalidades que el art. 37.2 no recoge.","cita":"«2. La Corporación RTVE promoverá la incorporación de las mujeres a puestos de responsabilidad directiva y profesional. Asimismo, fomentará la relación con asociaciones y grupos de mujeres para identificar sus necesidades e intereses en el ámbito de la comunicación.»","dificultad":2},{"id":"LOI-L2-021","ley":"LOI","articulo":"39.1","articulo_txt":"Art. 39.1 LO 3/2007","bloque_id":"LOI|Título III. Igualdad y medios de comunicación","enunciado":"Según el artículo 39.1 de la Ley Orgánica 3/2007, ¿qué medios de comunicación respetarán la igualdad entre mujeres y hombres, evitando toda forma de discriminación?","opciones":{"a":"Solo los medios de comunicación de titularidad privada.","b":"Todos los medios de comunicación.","c":"Los medios de titularidad privada que perciban ayudas públicas.","d":"Los medios audiovisuales, pero no la prensa escrita."},"correcta":"b","explicacion":"El art. 39.1 dispone que «Todos los medios de comunicación respetarán la igualdad entre mujeres y hombres, evitando cualquier forma de discriminación»; es la opción b). Las opciones a), c) y d) limitan el deber a una parte de los medios, cuando el art. 39.1 lo extiende a todos, aunque la rúbrica del artículo se refiera a los de titularidad privada.","cita":"«1. Todos los medios de comunicación respetarán la igualdad entre mujeres y hombres, evitando cualquier forma de discriminación.»","dificultad":2},{"id":"LOI-L2-025","ley":"LOI","articulo":"42.1","articulo_txt":"Art. 42.1 LO 3/2007","bloque_id":"LOI|Título IV. El derecho al trabajo en igualdad de oportunidades · Capítulo I. Igualdad de trato y de oportunidades en el ámbito laboral","enunciado":"Según el artículo 42.1 de la Ley Orgánica 3/2007, ¿qué tendrán las políticas de empleo como uno de sus objetivos prioritarios?","opciones":{"a":"Reducir la temporalidad de los contratos de las mujeres y equiparar su tasa de empleo a la de los hombres en cada sector.","b":"Aumentar la participación de las mujeres en el mercado de trabajo y avanzar en la igualdad efectiva entre mujeres y hombres.","c":"Garantizar la composición paritaria de las plantillas de las empresas y de los órganos de dirección de estas.","d":"Reservar a las mujeres un porcentaje mínimo de las contrataciones subvencionadas con fondos públicos."},"correcta":"b","explicacion":"El art. 42.1 dispone que las políticas de empleo tendrán como uno de sus objetivos prioritarios «aumentar la participación de las mujeres en el mercado de trabajo y avanzar en la igualdad efectiva entre mujeres y hombres»; es la opción b). Las opciones a), c) y d) enuncian objetivos que el art. 42.1 no recoge; el medio que prevé es mejorar la empleabilidad y la permanencia en el empleo de las mujeres, potenciando su nivel formativo y su adaptabilidad a los requerimientos del mercado de trabajo.","cita":"«1. Las políticas de empleo tendrán como uno de sus objetivos prioritarios aumentar la participación de las mujeres en el mercado de trabajo y avanzar en la igualdad efectiva entre mujeres y hombres. Para ello, se mejorará la empleabilidad y la permanencia en el empleo de las mujeres, potenciando su nivel formativo y su adaptabilidad a los requerimientos del mercado de trabajo.»","dificultad":1},{"id":"LOI-L2-026","ley":"LOI","articulo":"42.2","articulo_txt":"Art. 42.2 LO 3/2007","bloque_id":"LOI|Título IV. El derecho al trabajo en igualdad de oportunidades · Capítulo I. Igualdad de trato y de oportunidades en el ámbito laboral","enunciado":"Según el artículo 42.2 de la Ley Orgánica 3/2007, los Programas de inserción laboral activa dirigidos a personas en desempleo:","opciones":{"a":"Se destinarán exclusivamente a mujeres, con independencia de su nivel educativo y de su edad.","b":"Deberán reservar a las mujeres, como mínimo, la mitad de las plazas que se oferten en cada programa.","c":"Se dirigirán a las mujeres que no hayan completado la enseñanza obligatoria, con prioridad para las más jóvenes.","d":"Se podrán destinar prioritariamente a colectivos específicos de mujeres o contemplar una determinada proporción de mujeres."},"correcta":"d","explicacion":"El art. 42.2 dispone que esos programas comprenderán todos los niveles educativos y edad de las mujeres y «se podrán destinar prioritariamente a colectivos específicos de mujeres o contemplar una determinada proporción de mujeres»; es la opción d). Las opciones a) y b) convierten en exclusividad o en reserva mínima obligatoria lo que el art. 42.2 configura como una posibilidad. La opción c) es falsa: el art. 42.2 dice que esos programas comprenderán todos los niveles educativos y edad de las mujeres.","cita":"«2. Los Programas de inserción laboral activa comprenderán todos los niveles educativos y edad de las mujeres, incluyendo los de Formación Profesional, Escuelas Taller y Casas de Oficios, dirigidos a personas en desempleo, se podrán destinar prioritariamente a colectivos específicos de mujeres o contemplar una determinada proporción de mujeres.»","dificultad":2},{"id":"LOI-L2-028","ley":"LOI","articulo":"44.1","articulo_txt":"Art. 44.1 LO 3/2007","bloque_id":"LOI|Título IV. El derecho al trabajo en igualdad de oportunidades · Capítulo II. Igualdad y conciliación","enunciado":"Según el artículo 44.1 de la Ley Orgánica 3/2007, los derechos de conciliación de la vida personal, familiar y laboral se reconocerán a los trabajadores y las trabajadoras en forma que:","opciones":{"a":"Correspondan preferentemente a las trabajadoras, como medida de acción positiva en su favor.","b":"Queden subordinados a las necesidades organizativas y productivas de la empresa.","c":"Su ejercicio no suponga en ningún caso una reducción de las retribuciones de quien los disfrute.","d":"Fomenten la asunción equilibrada de las responsabilidades familiares, evitando toda discriminación basada en su ejercicio."},"correcta":"d","explicacion":"El art. 44.1 dispone que esos derechos se reconocerán «en forma que fomenten la asunción equilibrada de las responsabilidades familiares, evitando toda discriminación basada en su ejercicio»; es la opción d). La opción a) es contraria al art. 44.1, que busca un reparto equilibrado de las responsabilidades familiares entre trabajadores y trabajadoras. Las opciones b) y c) introducen condiciones o garantías que el art. 44.1 no menciona.","cita":"«1. Los derechos de conciliación de la vida personal, familiar y laboral se reconocerán a los trabajadores y las trabajadoras en forma que fomenten la asunción equilibrada de las responsabilidades familiares, evitando toda discriminación basada en su ejercicio.»","dificultad":1},{"id":"LOI-L2-034","ley":"LOI","articulo":"46.1","articulo_txt":"Art. 46.1 LO 3/2007","bloque_id":"LOI|Título IV. El derecho al trabajo en igualdad de oportunidades · Capítulo III. Los planes de igualdad de las empresas y otras medidas de promoción de la igualdad","enunciado":"Según el artículo 46.1 de la Ley Orgánica 3/2007, ¿qué fijarán los planes de igualdad?","opciones":{"a":"Los objetivos de igualdad a alcanzar y las sanciones disciplinarias aplicables a quienes incumplan las medidas, cuyo seguimiento corresponderá a la autoridad laboral.","b":"Las estrategias y prácticas a adoptar y un régimen de incentivos económicos para la plantilla, cuya evaluación se encomendará a una entidad externa acreditada.","c":"Los objetivos de igualdad para cada centro de trabajo y la composición de la comisión encargada de su seguimiento, que será designada por la dirección de la empresa.","d":"Los concretos objetivos de igualdad a alcanzar, las estrategias y prácticas a adoptar para su consecución y el establecimiento de sistemas eficaces de seguimiento y evaluación."},"correcta":"d","explicacion":"El párrafo segundo del art. 46.1 dispone que los planes de igualdad fijarán «los concretos objetivos de igualdad a alcanzar, las estrategias y prácticas a adoptar para su consecución, así como el establecimiento de sistemas eficaces de seguimiento y evaluación de los objetivos fijados»; es la opción d). Las opciones a), b) y c) incluyen contenidos o atribuyen el seguimiento y la evaluación a sujetos que el art. 46.1 no menciona.","cita":"«Los planes de igualdad fijarán los concretos objetivos de igualdad a alcanzar, las estrategias y prácticas a adoptar para su consecución, así como el establecimiento de sistemas eficaces de seguimiento y evaluación de los objetivos fijados.»","dificultad":2},{"id":"LOI-L2-043","ley":"LOI","articulo":"48.2","articulo_txt":"Art. 48.2 LO 3/2007","bloque_id":"LOI|Título IV. El derecho al trabajo en igualdad de oportunidades · Capítulo III. Los planes de igualdad de las empresas y otras medidas de promoción de la igualdad","enunciado":"Según el artículo 48.2 de la Ley Orgánica 3/2007, los representantes de los trabajadores deberán contribuir a prevenir la comisión de delitos y otras conductas contra la libertad sexual y la integridad moral en el trabajo mediante:","opciones":{"a":"La denuncia directa ante la autoridad laboral de las conductas o comportamientos de que tuvieran conocimiento, sin necesidad de informar previamente a la dirección de la empresa.","b":"La tramitación de los expedientes disciplinarios que se incoen por estas conductas y la propuesta a la dirección de la empresa de las sanciones que procedan.","c":"La aprobación de los protocolos de actuación de la empresa y la designación, entre sus miembros, de la persona encargada de recibir las quejas.","d":"La sensibilización de los trabajadores y trabajadoras y la información a la dirección de la empresa de las conductas o comportamientos de que tuvieran conocimiento."},"correcta":"d","explicacion":"El art. 48.2 dispone que los representantes de los trabajadores contribuirán a esa prevención «mediante la sensibilización de los trabajadores y trabajadoras frente al mismo y la información a la dirección de la empresa de las conductas o comportamientos de que tuvieran conocimiento y que pudieran propiciarlo»; es la opción d). Las opciones a), b) y c) atribuyen a los representantes funciones que el art. 48.2 no recoge.","cita":"«2. Los representantes de los trabajadores deberán contribuir a prevenir la comisión de delitos y otras conductas contra la libertad sexual y la integridad moral en el trabajo, con especial atención al acoso sexual y el acoso por razón de sexo, incluidos los cometidos en el ámbito digital, mediante la sensibilización de los trabajadores y trabajadoras frente al mismo y la información a la dirección de la empresa de las conductas o comportamientos de que tuvieran conocimiento y que pudieran propiciarlo.»","dificultad":2},{"id":"LOI-L2-045","ley":"LOI","articulo":"50.1","articulo_txt":"Art. 50.1 LO 3/2007","bloque_id":"LOI|Título IV. El derecho al trabajo en igualdad de oportunidades · Capítulo IV. Distintivo empresarial en materia de igualdad","enunciado":"Según el artículo 50.1 de la Ley Orgánica 3/2007, el distintivo para reconocer a las empresas que destaquen por la aplicación de políticas de igualdad de trato y de oportunidades con sus trabajadores y trabajadoras:","opciones":{"a":"Podrá ser utilizado en el tráfico comercial de la empresa, pero no con fines publicitarios.","b":"Solo podrá ser utilizado en las relaciones de la empresa con las Administraciones públicas.","c":"Podrá ser utilizado en el tráfico comercial de la empresa y con fines publicitarios.","d":"Solo podrá ser utilizado en la documentación interna y en las comunicaciones con la plantilla."},"correcta":"c","explicacion":"El art. 50.1 dispone que ese distintivo «podrá ser utilizado en el tráfico comercial de la empresa y con fines publicitarios»; es la opción c). La opción a) es falsa: el art. 50.1 permite también su uso con fines publicitarios. Las opciones b) y d) restringen el uso del distintivo a ámbitos que el art. 50.1 no limita.","cita":"«1. El Ministerio de Trabajo y Asuntos Sociales creará un distintivo para reconocer a aquellas empresas que destaquen por la aplicación de políticas de igualdad de trato y de oportunidades con sus trabajadores y trabajadoras, que podrá ser utilizado en el tráfico comercial de la empresa y con fines publicitarios.»","dificultad":2},{"id":"LOI-L2-046","ley":"LOI","articulo":"50.2","articulo_txt":"Art. 50.2 LO 3/2007","bloque_id":"LOI|Título IV. El derecho al trabajo en igualdad de oportunidades · Capítulo IV. Distintivo empresarial en materia de igualdad","enunciado":"Según el artículo 50.2 de la Ley Orgánica 3/2007, con el fin de obtener el distintivo empresarial en materia de igualdad, ¿qué empresas podrán presentar un balance sobre los parámetros de igualdad implantados respecto de las relaciones de trabajo y la publicidad de los productos y servicios prestados?","opciones":{"a":"Toda empresa, sea de capital público o privado.","b":"Las empresas de capital privado, pero no las de capital público.","c":"Únicamente las empresas que tengan un plan de igualdad inscrito en el registro.","d":"Solo las empresas que no estén obligadas a elaborar un plan de igualdad."},"correcta":"a","explicacion":"El art. 50.2 permite presentar ese balance a «cualquier empresa, sea de capital público o privado»; es la opción a). Las opciones b), c) y d) limitan a determinadas empresas una posibilidad que el art. 50.2 abre a todas; la adopción de planes de igualdad es uno de los criterios de concesión del art. 50.4, no un requisito para presentar el balance.","cita":"«2. Con el fin de obtener este distintivo, cualquier empresa, sea de capital público o privado, podrá presentar al Ministerio de Trabajo y Asuntos Sociales un balance sobre los parámetros de igualdad implantados respecto de las relaciones de trabajo y la publicidad de los productos y servicios prestados.»","dificultad":2},{"id":"LOI-L4-016","ley":"LOI","articulo":"51.a)","articulo_txt":"Art. 51.a) LO 3/2007","bloque_id":"LOI|Título V. El principio de igualdad en el empleo público · Capítulo I. Criterios de actuación de las Administraciones públicas","enunciado":"Según el artículo 51.a) de la Ley Orgánica 3/2007, las Administraciones públicas deberán «remover los obstáculos que impliquen la pervivencia de cualquier tipo de discriminación» con el fin de ofrecer condiciones de igualdad efectiva entre mujeres y hombres en:","opciones":{"a":"La negociación colectiva y la representación sindical del personal.","b":"El acceso a la jubilación y a las prestaciones de protección social.","c":"El acceso al empleo público y el desarrollo de la carrera profesional.","d":"El disfrute de los permisos y de las vacaciones del personal."},"correcta":"c","explicacion":"El art. 51.a) persigue ofrecer condiciones de igualdad efectiva entre mujeres y hombres «en el acceso al empleo público y en el desarrollo de la carrera profesional»; es la opción c). Las opciones a), b) y d) mencionan ámbitos a los que no se refiere el art. 51.a).","cita":"«a) Remover los obstáculos que impliquen la pervivencia de cualquier tipo de discriminación con el fin de ofrecer condiciones de igualdad efectiva entre mujeres y hombres en el acceso al empleo público y en el desarrollo de la carrera profesional.»","dificultad":1},{"id":"LOI-L3-002","ley":"LOI","articulo":"51","articulo_txt":"Art. 51 LO 3/2007","bloque_id":"LOI|Título V. El principio de igualdad en el empleo público · Capítulo I. Criterios de actuación de las Administraciones públicas","enunciado":"Según el artículo 51 de la Ley Orgánica 3/2007, ¿cuál de los siguientes NO figura entre los criterios de actuación que deben seguir las Administraciones públicas en aplicación del principio de igualdad entre mujeres y hombres?","opciones":{"a":"Fomentar la formación en igualdad a lo largo de la carrera profesional.","b":"Establecer medidas efectivas para eliminar la discriminación retributiva, directa o indirecta, por razón de sexo.","c":"Evaluar periódicamente la efectividad del principio de igualdad en sus respectivos ámbitos de actuación.","d":"Implantar el teletrabajo como medida preferente de conciliación para el personal con hijos menores."},"correcta":"d","explicacion":"El art. 51 no menciona el teletrabajo entre los criterios de actuación de las Administraciones públicas; es la opción d). Las opciones a), b) y c) recogen, respectivamente, las letras c), f) y g) del art. 51.","cita":"«Las Administraciones públicas, en el ámbito de sus respectivas competencias y en aplicación del principio de igualdad entre mujeres y hombres, deberán: […] c) Fomentar la formación en igualdad, tanto en el acceso al empleo público como a lo largo de la carrera profesional. d) Promover la presencia equilibrada de mujeres y hombres en los órganos de selección y valoración. e) Establecer medidas efectivas de protección frente al acoso sexual y al acoso por razón de sexo. f) Establecer medidas efectivas para eliminar cualquier discriminación retributiva, directa o indirecta, por razón de sexo. g) Evaluar periódicamente la efectividad del principio de igualdad en sus respectivos ámbitos de actuación.»","dificultad":2},{"id":"LOI-L3-005","ley":"LOI","articulo":"53","articulo_txt":"Art. 53 LO 3/2007","bloque_id":"LOI|Título V. El principio de igualdad en el empleo público · Capítulo II. El principio de presencia equilibrada en la Administración General del Estado y en los organismos públicos vinculados o dependientes de ella","enunciado":"Según el artículo 53 de la Ley Orgánica 3/2007, la representación de la Administración General del Estado y de los organismos públicos vinculados o dependientes de ella se ajustará al principio de composición equilibrada de ambos sexos en:","opciones":{"a":"Las comisiones de seguimiento de los convenios colectivos aplicables a su personal laboral.","b":"Las comisiones de investigación de las denuncias por acoso sexual o por razón de sexo.","c":"Las comisiones de evaluación del desempeño de su personal.","d":"Las comisiones de valoración de méritos para la provisión de puestos de trabajo."},"correcta":"d","explicacion":"El párrafo segundo del art. 53 se refiere a la representación de la Administración «en las comisiones de valoración de méritos para la provisión de puestos de trabajo»; es la opción d). Las opciones a), b) y c) mencionan comisiones a las que el art. 53 no se refiere.","cita":"«Asimismo, la representación de la Administración General del Estado y de los organismos públicos vinculados o dependientes de ella en las comisiones de valoración de méritos para la provisión de puestos de trabajo se ajustará al principio de composición equilibrada de ambos sexos.»","dificultad":2},{"id":"LOI-L3-006","ley":"LOI","articulo":"54","articulo_txt":"Art. 54 LO 3/2007","bloque_id":"LOI|Título V. El principio de igualdad en el empleo público · Capítulo II. El principio de presencia equilibrada en la Administración General del Estado y en los organismos públicos vinculados o dependientes de ella","enunciado":"Según el artículo 54 de la Ley Orgánica 3/2007, además de en la designación de sus representantes en órganos colegiados, comités de personas expertas o comités consultivos, ¿en qué otros nombramientos observarán la Administración General del Estado y sus organismos públicos vinculados o dependientes el principio de presencia equilibrada?","opciones":{"a":"En los de las personas que integran los gabinetes de los órganos superiores de cada Departamento.","b":"En los de los órganos de gobierno de las universidades públicas.","c":"En los de los consejos de administración de las empresas en cuyo capital participen.","d":"En los de las jefaturas de las unidades administrativas de rango inferior a Subdirección General."},"correcta":"c","explicacion":"El párrafo segundo del art. 54 extiende el principio a «los nombramientos que le corresponda efectuar en los consejos de administración de las empresas en cuyo capital participe»; es la opción c). Las opciones a), b) y d) se refieren a nombramientos (gabinetes, universidades, jefaturas de unidad) que el art. 54 no menciona.","cita":"«Asimismo, la Administración General del Estado y los organismos públicos vinculados o dependientes de ella observarán el principio de presencia equilibrada en los nombramientos que le corresponda efectuar en los consejos de administración de las empresas en cuyo capital participe.»","dificultad":2},{"id":"LOI-L3-007","ley":"LOI","articulo":"55","articulo_txt":"Art. 55 LO 3/2007","bloque_id":"LOI|Título V. El principio de igualdad en el empleo público · Capítulo III. Medidas de Igualdad en el empleo para la Administración General del Estado y para los organismos públicos vinculados o dependientes de ella","enunciado":"Según el artículo 55 de la Ley Orgánica 3/2007, la aprobación de convocatorias de pruebas selectivas para el acceso al empleo público deberá acompañarse de un informe de impacto de género:","opciones":{"a":"Salvo en casos de urgencia y sin perjuicio de la prohibición de discriminación por razón de sexo.","b":"Salvo en las convocatorias de personal laboral temporal, en las que su emisión será potestativa.","c":"En todo caso, sin que quepa prescindir de él por razones de urgencia ni de ningún otro tipo.","d":"Salvo cuando el número de plazas convocadas no supere el que se determine reglamentariamente para cada cuerpo o escala."},"correcta":"a","explicacion":"El art. 55 exige el informe de impacto de género «salvo en casos de urgencia y siempre sin perjuicio de la prohibición de discriminación por razón de sexo»; es la opción a). Las opciones b) y d) establecen excepciones (personal laboral temporal, número de plazas) que el art. 55 no recoge. La opción c) es falsa porque el art. 55 sí exceptúa los casos de urgencia.","cita":"«La aprobación de convocatorias de pruebas selectivas para el acceso al empleo público deberá acompañarse de un informe de impacto de género, salvo en casos de urgencia y siempre sin perjuicio de la prohibición de discriminación por razón de sexo.»","dificultad":2},{"id":"LOI-L3-018","ley":"LOI","articulo":"63","articulo_txt":"Art. 63 LO 3/2007","bloque_id":"LOI|Título V. El principio de igualdad en el empleo público · Capítulo III. Medidas de Igualdad en el empleo para la Administración General del Estado y para los organismos públicos vinculados o dependientes de ella","enunciado":"Según el artículo 63 de la Ley Orgánica 3/2007, la información que han de remitir todos los Departamentos Ministeriales y Organismos Públicos sobre la aplicación efectiva del principio de igualdad especificará, mediante la desagregación por sexo de los datos, varios aspectos. ¿Cuál de los siguientes NO se menciona?","opciones":{"a":"La distribución de la plantilla.","b":"La antigüedad media del personal.","c":"El nivel de complemento de destino.","d":"Las retribuciones promediadas del personal."},"correcta":"b","explicacion":"El art. 63 enumera «la distribución de su plantilla, grupo de titulación, nivel de complemento de destino y retribuciones promediadas de su personal», sin mencionar la antigüedad; es la opción b). Las opciones a), c) y d) figuran en esa enumeración del art. 63.","cita":"«Todos los Departamentos Ministeriales y Organismos Públicos remitirán, al menos anualmente, a los Ministerios de Trabajo y Asuntos Sociales y de Administraciones Públicas, información relativa a la aplicación efectiva en cada uno de ellos del principio de igualdad entre mujeres y hombres, con especificación, mediante la desagregación por sexo de los datos, de la distribución de su plantilla, grupo de titulación, nivel de complemento de destino y retribuciones promediadas de su personal.»","dificultad":2},{"id":"LOI-L3-021","ley":"LOI","articulo":"65","articulo_txt":"Art. 65 LO 3/2007","bloque_id":"LOI|Título V. El principio de igualdad en el empleo público · Capítulo IV. Fuerzas Armadas","enunciado":"Según el artículo 65 de la Ley Orgánica 3/2007, las normas sobre personal de las Fuerzas Armadas procurarán la efectividad del principio de igualdad entre mujeres y hombres, en especial en lo que se refiere a determinados ámbitos. ¿Cuál de los siguientes NO se menciona expresamente?","opciones":{"a":"Los ascensos.","b":"Las retribuciones.","c":"Los destinos.","d":"Las situaciones administrativas."},"correcta":"b","explicacion":"El art. 65 se refiere en especial al «régimen de acceso, formación, ascensos, destinos y situaciones administrativas», sin mencionar las retribuciones; es la opción b). Las opciones a), c) y d) figuran en esa enumeración del art. 65.","cita":"«Las normas sobre personal de las Fuerzas Armadas procurarán la efectividad del principio de igualdad entre mujeres y hombres, en especial en lo que se refiere al régimen de acceso, formación, ascensos, destinos y situaciones administrativas.»","dificultad":2},{"id":"LOI-L3-022","ley":"LOI","articulo":"66","articulo_txt":"Art. 66 LO 3/2007","bloque_id":"LOI|Título V. El principio de igualdad en el empleo público · Capítulo IV. Fuerzas Armadas","enunciado":"Según el artículo 66 de la Ley Orgánica 3/2007, las normas referidas al personal al servicio de las administraciones públicas en las materias que el propio artículo enumera serán de aplicación en las Fuerzas Armadas:","opciones":{"a":"En sus mismos términos, sin que quepa introducir adaptación alguna.","b":"Solo respecto del personal civil que preste servicios en el Ministerio de Defensa y en sus organismos públicos.","c":"Con las adaptaciones que resulten necesarias y en los términos establecidos en su normativa específica.","d":"Cuando así lo acuerde el Consejo de Ministros para cada una de esas materias."},"correcta":"c","explicacion":"El art. 66, en la redacción dada por la disposición final 10.4 de la Ley Orgánica 10/2022 (con efectos desde el 7 de octubre de 2022), aplica esas normas en las Fuerzas Armadas «con las adaptaciones que resulten necesarias y en los términos establecidos en su normativa específica»; es la opción c). La opción a) excluye las adaptaciones que el art. 66 admite. Las opciones b) y d) añaden límites o requisitos (solo personal civil, acuerdo del Consejo de Ministros) que el art. 66 no establece.","cita":"«Las normas referidas al personal al servicio de las administraciones públicas en materia de igualdad, protección integral contra la violencia de género y la violencia sexual, y la conciliación de la vida personal, familiar y profesional serán de aplicación en las Fuerzas Armadas, con las adaptaciones que resulten necesarias y en los términos establecidos en su normativa específica.»","dificultad":2},{"id":"LOI-L3-023","ley":"LOI","articulo":"67","articulo_txt":"Art. 67 LO 3/2007","bloque_id":"LOI|Título V. El principio de igualdad en el empleo público · Capítulo V. Fuerzas y Cuerpos de Seguridad del Estado","enunciado":"Según el artículo 67 de la Ley Orgánica 3/2007, respecto de la igualdad efectiva entre mujeres y hombres, las normas reguladoras de las Fuerzas y Cuerpos de Seguridad del Estado:","opciones":{"a":"La procurarán en la medida en que lo permitan las peculiaridades de sus funciones.","b":"La promoverán, impidiendo toda situación de discriminación profesional.","c":"La garantizarán mediante cuotas de acceso en favor del sexo menos representado.","d":"La promoverán únicamente en relación con el personal de nuevo ingreso."},"correcta":"b","explicacion":"El art. 67 dispone que esas normas «promoverán la igualdad efectiva entre mujeres y hombres, impidiendo cualquier situación de discriminación profesional»; es la opción b). La opción a) rebaja el mandato del art. 67, que no lo condiciona a las peculiaridades de las funciones. La opción c) menciona unas cuotas de acceso que el art. 67 no prevé. La opción d) es falsa: el art. 67 no se limita al personal de nuevo ingreso y menciona expresamente, entre otros, los ascensos y los destinos.","cita":"«Las normas reguladoras de las Fuerzas y Cuerpos de Seguridad del Estado promoverán la igualdad efectiva entre mujeres y hombres, impidiendo cualquier situación de discriminación profesional, especialmente, en el sistema de acceso, formación, ascensos, destinos y situaciones administrativas.»","dificultad":2},{"id":"LOI-L3-024","ley":"LOI","articulo":"68","articulo_txt":"Art. 68 LO 3/2007","bloque_id":"LOI|Título V. El principio de igualdad en el empleo público · Capítulo V. Fuerzas y Cuerpos de Seguridad del Estado","enunciado":"Según el artículo 68 de la Ley Orgánica 3/2007, ¿en qué materias serán de aplicación en las Fuerzas y Cuerpos de Seguridad las normas referidas al personal al servicio de las administraciones públicas?","opciones":{"a":"Igualdad, prevención de la violencia de género y la violencia sexual, y conciliación.","b":"Igualdad, régimen disciplinario y prevención de riesgos laborales.","c":"Igualdad, prevención de la violencia de género y la violencia sexual, y régimen disciplinario.","d":"Igualdad, prevención de riesgos laborales y conciliación."},"correcta":"a","explicacion":"El art. 68, en la redacción dada por la disposición final 10.5 de la Ley Orgánica 10/2022 (con efectos desde el 7 de octubre de 2022), se refiere a las materias de «igualdad, prevención de la violencia de género y la violencia sexual, y la conciliación de la vida personal, familiar y profesional»; es la opción a). Las opciones b), c) y d) incluyen el régimen disciplinario o la prevención de riesgos laborales, que el art. 68 no menciona.","cita":"«Las normas referidas al personal al servicio de las administraciones públicas en materia de igualdad, prevención de la violencia de género y la violencia sexual, y la conciliación de la vida personal, familiar y profesional serán de aplicación en las Fuerzas y Cuerpos de Seguridad, adaptándose, en su caso, a las peculiaridades de las funciones que tienen encomendadas, en los términos establecidos por su normativa específica.»","dificultad":2},{"id":"LOI-L3-026","ley":"LOI","articulo":"69.2","articulo_txt":"Art. 69.2 LO 3/2007","bloque_id":"LOI|Título VI. Igualdad de trato en el acceso a bienes y servicios y su suministro","enunciado":"Según el artículo 69.2 de la Ley Orgánica 3/2007, la obligación de igualdad de trato en el suministro de bienes y servicios no afecta a la libertad de contratación, incluida la libertad de la persona de elegir a la otra parte contratante:","opciones":{"a":"Siempre que el contrato se celebre entre particulares que no actúen profesionalmente.","b":"Salvo cuando el bien o servicio se ofrezca por una entidad del sector público.","c":"Siempre y cuando dicha elección no venga determinada por su sexo.","d":"Siempre que los motivos consten en el contrato."},"correcta":"c","explicacion":"El art. 69.2 salvaguarda la libertad de contratación «siempre y cuando dicha elección no venga determinada por su sexo»; es la opción c). Las opciones a), b) y d) sustituyen ese único límite por condiciones (contratación entre particulares, sector público, constancia de los motivos) que el art. 69.2 no establece.","cita":"«2. Lo previsto en el apartado anterior no afecta a la libertad de contratación, incluida la libertad de la persona de elegir a la otra parte contratante, siempre y cuando dicha elección no venga determinada por su sexo.»","dificultad":2},{"id":"LOI-L3-028","ley":"LOI","articulo":"71.2","articulo_txt":"Art. 71.2 LO 3/2007","bloque_id":"LOI|Título VI. Igualdad de trato en el acceso a bienes y servicios y su suministro","enunciado":"Según el artículo 71.2 de la Ley Orgánica 3/2007, los costes relacionados con el embarazo y el parto:","opciones":{"a":"No justificarán diferencias en las primas y prestaciones de las personas consideradas individualmente, sin que puedan autorizarse diferencias.","b":"Podrán justificar diferencias en las primas, pero no en las prestaciones, de las personas consideradas individualmente.","c":"Solo podrán repercutirse en las primas de los seguros colectivos, y nunca en las de los seguros contratados de forma individual por cada persona asegurada.","d":"Justificarán diferencias en las primas cuando así se pacte de forma expresa en el contrato de seguro."},"correcta":"a","explicacion":"El art. 71.2 establece que esos costes «no justificarán diferencias en las primas y prestaciones de las personas consideradas individualmente, sin que puedan autorizarse diferencias al respecto»; es la opción a). Las opciones b), c) y d) admiten, en algún caso, diferencias que el art. 71.2 excluye por completo.","cita":"«2. Los costes relacionados con el embarazo y el parto no justificarán diferencias en las primas y prestaciones de las personas consideradas individualmente, sin que puedan autorizarse diferencias al respecto.»","dificultad":2},{"id":"LOI-L3-031","ley":"LOI","articulo":"73","articulo_txt":"Art. 73 LO 3/2007","bloque_id":"LOI|Título VII. La igualdad en la responsabilidad social de las empresas","enunciado":"Según el artículo 73 de la Ley Orgánica 3/2007, la realización de las acciones de responsabilidad social en materia de igualdad podrá ser concertada con varios sujetos. ¿Cuál de los siguientes NO se menciona?","opciones":{"a":"Las organizaciones empresariales más representativas.","b":"Las organizaciones de consumidores y consumidoras y usuarios y usuarias.","c":"Las asociaciones cuyo fin primordial sea la defensa de la igualdad de trato entre mujeres y hombres.","d":"Los Organismos de Igualdad."},"correcta":"a","explicacion":"El art. 73 no menciona a las organizaciones empresariales entre los sujetos con los que pueden concertarse esas acciones; es la opción a). Las opciones b), c) y d) figuran en la enumeración del párrafo segundo del art. 73, junto con la representación de los trabajadores y las trabajadoras.","cita":"«La realización de estas acciones podrá ser concertada con la representación de los trabajadores y las trabajadoras, las organizaciones de consumidores y consumidoras y usuarios y usuarias, las asociaciones cuyo fin primordial sea la defensa de la igualdad de trato entre mujeres y hombres y los Organismos de Igualdad.»","dificultad":2},{"id":"LOI-L3-034","ley":"LOI","articulo":"75","articulo_txt":"Art. 75 LO 3/2007","bloque_id":"LOI|Título VII. La igualdad en la responsabilidad social de las empresas","enunciado":"Según el artículo 75 de la Ley Orgánica 3/2007, ¿qué sociedades procurarán incluir en su Consejo de administración un número de mujeres que permita alcanzar una presencia equilibrada de mujeres y hombres?","opciones":{"a":"Las que puedan presentar cuenta de pérdidas y ganancias abreviada.","b":"Todas las sociedades mercantiles, con independencia de su tamaño.","c":"Las obligadas a presentar cuenta de pérdidas y ganancias no abreviada.","d":"Las sociedades anónimas, con independencia del modelo de cuentas que presenten."},"correcta":"c","explicacion":"El art. 75 se dirige a «Las sociedades obligadas a presentar cuenta de pérdidas y ganancias no abreviada»; es la opción c). La opción a) invierte el criterio del art. 75. Las opciones b) y d) amplían el ámbito a todas las sociedades mercantiles o a todas las sociedades anónimas, sin el límite del modelo de cuentas que establece el art. 75.","cita":"«Las sociedades obligadas a presentar cuenta de pérdidas y ganancias no abreviada procurarán incluir en su Consejo de administración un número de mujeres que permita alcanzar una presencia equilibrada de mujeres y hombres en un plazo de ocho años a partir de la entrada en vigor de esta Ley.»","dificultad":2},{"id":"LOI-L3-035","ley":"LOI","articulo":"76","articulo_txt":"Art. 76 LO 3/2007","bloque_id":"LOI|Título VIII. Disposiciones organizativas","enunciado":"Según la Ley Orgánica 3/2007, ¿qué órgano colegiado es el responsable de la coordinación de las políticas y medidas adoptadas por los departamentos ministeriales con la finalidad de garantizar el derecho a la igualdad entre mujeres y hombres y promover su efectividad?","opciones":{"a":"El Consejo de Participación de la Mujer.","b":"La Comisión Interministerial de Igualdad entre mujeres y hombres.","c":"La Comisión General de Secretarios de Estado y Subsecretarios.","d":"La Conferencia de Presidentes."},"correcta":"b","explicacion":"El art. 76 atribuye esa coordinación a «La Comisión Interministerial de Igualdad entre mujeres y hombres»; es la opción b). Las opciones a), c) y d) mencionan órganos colegiados a los que la Ley Orgánica 3/2007 no atribuye esa función. «Comisión Interministerial de Igualdad entre mujeres y hombres» es la denominación que emplea la Ley Orgánica 3/2007.","cita":"«La Comisión Interministerial de Igualdad entre mujeres y hombres es el órgano colegiado responsable de la coordinación de las políticas y medidas adoptadas por los departamentos ministeriales con la finalidad de garantizar el derecho a la igualdad entre mujeres y hombres y promover su efectividad.»","dificultad":1},{"id":"LOI-L4-019","ley":"LOI","articulo":"77.e)","articulo_txt":"Art. 77.e) LO 3/2007","bloque_id":"LOI|Título VIII. Disposiciones organizativas","enunciado":"Según el artículo 77 de la Ley Orgánica 3/2007, ¿cuál de las siguientes figura entre las funciones que corresponden en particular a las que la ley denomina Unidades de Igualdad?","opciones":{"a":"Tramitar los expedientes disciplinarios incoados al personal del Departamento por acoso sexual o por razón de sexo.","b":"Velar por el cumplimiento de esta Ley y por la aplicación efectiva del principio de igualdad.","c":"Autorizar las adaptaciones de jornada solicitadas por el personal del Departamento por motivos de conciliación.","d":"Gestionar las subvenciones del Departamento destinadas a las asociaciones de mujeres."},"correcta":"b","explicacion":"El art. 77, que lleva por título «Las Unidades de Igualdad», atribuye en su letra e) la función de «Velar por el cumplimiento de esta Ley y por la aplicación efectiva del principio de igualdad»; es la opción b). Las opciones a), c) y d) recogen funciones que el art. 77 no atribuye a esas unidades.","cita":"«e) Velar por el cumplimiento de esta Ley y por la aplicación efectiva del principio de igualdad.»","dificultad":2},{"id":"LOI-L3-039","ley":"LOI","articulo":"DA 28ª","articulo_txt":"DA 28ª · LO 3/2007","bloque_id":"LOI|Disposiciones adicionales","enunciado":"Según la disposición adicional vigésima octava de la Ley Orgánica 3/2007, el Instituto de la Mujer será:","opciones":{"a":"El órgano encargado de conceder y retirar el distintivo empresarial en materia de igualdad a las empresas que lo soliciten.","b":"El organismo competente en el Reino de España a efectos de determinados preceptos de Directivas sobre igualdad de trato.","c":"El órgano colegiado de coordinación de las Unidades de Igualdad de los distintos Ministerios.","d":"La autoridad competente para sancionar las infracciones en materia de publicidad discriminatoria."},"correcta":"b","explicacion":"La DA 28ª designa al Instituto de la Mujer como «el organismo competente en el Reino de España» a efectos del art. 8 bis de la Directiva 76/207 (modificada por la Directiva 2002/73) y del art. 12 de la Directiva 2004/113; es la opción b). Las opciones a), c) y d) le atribuyen funciones que la DA 28ª no menciona. «Instituto de la Mujer» es la denominación que emplea la DA 28ª de la Ley Orgánica 3/2007.","cita":"«El Instituto de la Mujer será el organismo competente en el Reino de España a efectos de lo dispuesto en el artículo 8 bis de la Directiva 76/207, de 9 de febrero de 1976, modificada por la Directiva 2002/73, del Parlamento Europeo y del Consejo, de 23 de septiembre de 2002, relativa a la aplicación del principio de igualdad de trato entre hombres y mujeres en lo que se refiere al acceso al empleo, a la formación y a la promoción profesionales, y a las condiciones de trabajo y en el artículo 12 de la Directiva 2004/113, del Consejo, de 13 de diciembre de 2004, sobre aplicación del principio de igualdad de trato entre hombres y mujeres en el acceso a bienes y servicios y su suministro.»","dificultad":3},{"id":"LOI-L3-040","ley":"LOI","articulo":"DA 32ª.1","articulo_txt":"DA 32ª.1 · LO 3/2007","bloque_id":"LOI|Disposiciones adicionales","enunciado":"Según la disposición adicional trigésima segunda de la Ley Orgánica 3/2007, ¿quiénes accederán a la profesión de agentes de igualdad?","opciones":{"a":"Quienes tengan un título de grado, posgrado o equivalente en estudios de género, estudios feministas y políticas públicas de igualdad, o amplia y acreditada experiencia en políticas de igualdad.","b":"Quienes tengan un título de grado del ámbito de estudios de género, estudios feministas y políticas públicas de igualdad, sin que la experiencia profesional pueda suplir la falta de ese título.","c":"Quienes superen las pruebas de habilitación que convoque el Ministerio de Ciencia, Innovación y Universidades, previa acreditación de una titulación universitaria oficial.","d":"Quienes tengan un título universitario oficial de grado, sea cual sea su rama, y acrediten haber cursado formación específica en materia de igualdad."},"correcta":"a","explicacion":"La DA 32ª.1, añadida por la disposición final 6 de la Ley Orgánica 2/2024 (en vigor desde el 22 de agosto de 2024), da acceso a quienes tengan un título de grado, posgrado o equivalente de ese ámbito de conocimiento «o cuenten con una amplia y acreditada experiencia en el diseño, desarrollo e implementación de políticas de igualdad»; es la opción a). La opción b) excluye la vía de la experiencia, que la DA 32ª.1 admite. Las opciones c) y d) exigen unas pruebas de habilitación o una formación específica que la DA 32ª.1 no contempla.","cita":"«1. Accederán a la profesión de agentes de igualdad las personas que estén en posesión de un título de grado, posgrado o equivalente del ámbito de conocimiento de estudios de género, estudios feministas y políticas públicas de igualdad, incorporado en el anexo I del Real Decreto 822/2021, de 28 de septiembre, por el que se establece la organización de las enseñanzas universitarias y del procedimiento de aseguramiento de su calidad, o cuenten con una amplia y acreditada experiencia en el diseño, desarrollo e implementación de políticas de igualdad.»","dificultad":2},{"id":"LOI-L3-041","ley":"LOI","articulo":"DT 12ª","articulo_txt":"DT 12ª · LO 3/2007","bloque_id":"LOI|Disposiciones transitorias","enunciado":"Según la disposición transitoria décima segunda de la Ley Orgánica 3/2007, los periodos de transitoriedad de que dispusieron las empresas, según su número de personas trabajadoras, para la aprobación de los planes de igualdad se computaban:","opciones":{"a":"Desde la constitución de la comisión negociadora del plan en cada empresa.","b":"Desde que cada empresa alcanzara el número de personas trabajadoras que determina la obligación de aprobar el plan.","c":"Desde la entrada en vigor de la Ley Orgánica 3/2007.","d":"Desde la publicación del Real Decreto-ley 6/2019, de 1 de marzo, en el «Boletín Oficial del Estado»."},"correcta":"d","explicacion":"La DT 12ª, añadida por el art. 1.3 del Real Decreto-ley 6/2019, dispone que esos periodos «se computarán desde la publicación» de dicho Real Decreto-ley en el BOE; es la opción d). Los tres periodos (uno, dos y tres años, según el tamaño de la empresa) ya han transcurrido: el más largo venció en marzo de 2022, por lo que la disposición ya no tiene efecto práctico. Las opciones a), b) y c) toman como inicio del cómputo un momento distinto del que fija la DT 12ª.","cita":"«Estos periodos de transitoriedad se computarán desde la publicación del Real Decreto-ley 6/2019, de 1 de marzo, en el “Boletín Oficial del Estado”.»","dificultad":3},{"id":"LOI-L3-042","ley":"LOI","articulo":"DF 1ª.3","articulo_txt":"DF 1ª.3 · LO 3/2007","bloque_id":"LOI|Disposiciones finales","enunciado":"Según la disposición final primera de la Ley Orgánica 3/2007, los preceptos contenidos en los Títulos VI y VII de la Ley constituyen:","opciones":{"a":"Legislación de aplicación directa en todo el Estado.","b":"Legislación laboral de aplicación en todo el Estado.","c":"Regulación de las condiciones básicas que garantizan la igualdad de todos los españoles en el ejercicio de los derechos.","d":"Preceptos de aplicación únicamente a la Administración General del Estado."},"correcta":"a","explicacion":"La DF 1ª.3 dispone que los preceptos de los Títulos VI y VII «constituyen legislación de aplicación directa en todo el Estado, de acuerdo con el artículo 149.1.6.ª y 8.ª de la Constitución»; es la opción a). La opción b) corresponde, según la DF 1ª.3, al Título IV y a varias disposiciones adicionales. La opción c) corresponde, según la DF 1ª.1, entre otros, al Título Preliminar y al Título I. La opción d) describe, según la DF 1ª.4, el resto de los preceptos de la Ley.","cita":"«El artículo 41, los preceptos contenidos en los Títulos VI y VII y las disposiciones adicionales vigésima quinta y vigésima sexta de esta Ley constituyen legislación de aplicación directa en todo el Estado, de acuerdo con el artículo 149.1.6.ª y 8.ª de la Constitución.»","dificultad":3},{"id":"LOI-L3-045","ley":"LOI","articulo":"DF 8ª","articulo_txt":"DF 8ª · LO 3/2007","bloque_id":"LOI|Disposiciones finales","enunciado":"Según la disposición final octava de la Ley Orgánica 3/2007, ¿cuándo entró en vigor la Ley?","opciones":{"a":"El día siguiente al de su publicación en el «Boletín Oficial del Estado», salvo lo previsto en el artículo 71.2, que lo hizo el 1 de enero de 2008.","b":"A los veinte días naturales de su publicación en el «Boletín Oficial del Estado», salvo lo previsto en el artículo 71.2, que lo hizo el 31 de diciembre de 2008.","c":"El día siguiente al de su publicación en el «Boletín Oficial del Estado», salvo lo previsto en el artículo 71.2, que lo hizo el 31 de diciembre de 2008.","d":"A los veinte días naturales de su publicación en el «Boletín Oficial del Estado», salvo lo previsto en el artículo 71.2, que lo hizo el 1 de enero de 2008."},"correcta":"c","explicacion":"La DF 8ª dispone que la Ley «entrará en vigor el día siguiente al de su publicación en el Boletín Oficial del Estado, con excepción de lo previsto en el artículo 71.2, que lo hará el 31 de diciembre de 2008»; es la opción c). La opción a) fija para el art. 71.2 una fecha distinta de la que establece la DF 8ª. La opción b) sustituye la regla general del día siguiente a la publicación por un plazo de veinte días naturales que la DF 8ª no prevé. La opción d) incurre en los dos errores: el plazo de veinte días naturales y la fecha del 1 de enero de 2008.","cita":"«La presente Ley entrará en vigor el día siguiente al de su publicación en el Boletín Oficial del Estado, con excepción de lo previsto en el artículo 71.2, que lo hará el 31 de diciembre de 2008.»","dificultad":2}]};</script>
<script>
/* Letra de Ley — motor de test. Sin dependencias; funciona sin conexión.
   Necesita window.LDL_CONFIG y window.LDL_BANCO (los inyecta sistema/letradeley.py). */
(function () {
  "use strict";
  var CFG = window.LDL_CONFIG, B = window.LDL_BANCO;
  var raiz = document.getElementById("ldl");
  var LETRAS = ["a", "b", "c", "d"];
  var POR_ID = {};
  B.preguntas.forEach(function (p) { POR_ID[p.id] = p; });
  var CLAVE = "ldl1:" + CFG.pack.id;
  var prog = cargar();
  var sesion = null;
  var vista = CFG.modo === "web" ? "portada" : "inicio";
  var reloj = null;

  /* ---------- utilidades ---------- */
  function esc(t) {
    return String(t == null ? "" : t).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function barajar(lista) {
    var a = lista.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function pct(a, b) { return b ? Math.round((a / b) * 100) : 0; }
  function plural(n, uno, varios) { return n + " " + (n === 1 ? uno : varios); }
  function num(n) { return String(n).replace(".", ","); }
  function cargar() {
    try { var s = localStorage.getItem(CLAVE); if (s) { var d = JSON.parse(s); if (d && d.p) return d; } } catch (e) {}
    return { p: {}, h: [] };
  }
  function guardar() { try { localStorage.setItem(CLAVE, JSON.stringify(prog)); } catch (e) {} }
  function registrar(id, acierto) {
    var r = prog.p[id] || { v: 0, a: 0, f: 0, c: 0 };
    r.v++;
    if (acierto) { r.a++; r.c = Math.min((r.c || 0) + 1, 5); } else { r.f++; r.c = 0; }
    r.u = acierto ? 1 : 0;
    r.t = Date.now();
    prog.p[id] = r;
    guardar();
  }
  function fallosPendientes() {
    return B.preguntas.filter(function (p) { var r = prog.p[p.id]; return r && r.u === 0; });
  }
  function resumen(lista) {
    var vistas = 0, aciertos = 0, intentos = 0;
    lista.forEach(function (p) {
      var r = prog.p[p.id];
      if (r) { vistas++; aciertos += r.a; intentos += r.v; }
    });
    return { total: lista.length, vistas: vistas, acierto: pct(aciertos, intentos) };
  }
  function delBloque(id) { return B.preguntas.filter(function (p) { return p.bloque_id === id; }); }

  /* ---------- tema claro / oscuro ---------- */
  function aplicarTema() {
    var t = null;
    try { t = localStorage.getItem("ldl:tema"); } catch (e) {}
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    else document.documentElement.removeAttribute("data-theme");
    return t || "auto";
  }
  function cambiarTema() {
    var orden = { auto: "light", light: "dark", dark: "auto" };
    var actual = aplicarTema();
    try { localStorage.setItem("ldl:tema", orden[actual]); } catch (e) {}
    aplicarTema();
    pintar();
  }

  /* ---------- sesiones ---------- */
  function empezar(tipo, preguntas, opciones) {
    opciones = opciones || {};
    if (!preguntas.length) return;
    pararReloj();
    sesion = {
      tipo: tipo, titulo: opciones.titulo || "Test", ids: preguntas.map(function (p) { return p.id; }),
      i: 0, resp: {}, corregida: {}, inicio: Date.now(), limite: opciones.minutos ? opciones.minutos * 60 : 0, fin: null,
      origen: vista === "test" || vista === "resultado" ? (sesion && sesion.origen) || "inicio" : vista
    };
    vista = "test";
    if (sesion.limite) reloj = setInterval(tic, 1000);
    pintar();
    window.scrollTo(0, 0);
  }
  function tic() {
    if (!sesion || sesion.fin) return pararReloj();
    var el = document.getElementById("ldl-crono");
    var resta = sesion.limite - Math.floor((Date.now() - sesion.inicio) / 1000);
    if (resta <= 0) { terminar(); return; }
    if (el) el.textContent = mmss(resta);
  }
  function pararReloj() { if (reloj) { clearInterval(reloj); reloj = null; } }
  function mmss(s) { var m = Math.floor(s / 60), r = s % 60; return m + ":" + (r < 10 ? "0" : "") + r; }

  function responder(letra) {
    var id = sesion.ids[sesion.i];
    if (sesion.tipo === "simulacro") {
      sesion.resp[id] = sesion.resp[id] === letra ? undefined : letra;
      pintar();
      return;
    }
    if (sesion.corregida[id]) return;
    sesion.resp[id] = letra;
    sesion.corregida[id] = true;
    registrar(id, letra === POR_ID[id].correcta);
    pintar();
  }
  function siguiente() {
    if (sesion.i < sesion.ids.length - 1) { sesion.i++; pintar(); window.scrollTo(0, 0); }
    else terminar();
  }
  function anterior() { if (sesion.i > 0) { sesion.i--; pintar(); } }
  function terminar() {
    pararReloj();
    if (sesion.tipo === "simulacro") {
      sesion.ids.forEach(function (id) {
        if (sesion.resp[id]) registrar(id, sesion.resp[id] === POR_ID[id].correcta);
      });
    }
    sesion.fin = Date.now();
    var r = calcular(sesion);
    prog.h.unshift({ t: sesion.fin, tipo: sesion.tipo, n: r.total, a: r.aciertos, e: r.errores, nota: r.nota });
    prog.h = prog.h.slice(0, 50);
    guardar();
    vista = "resultado";
    pintar();
    window.scrollTo(0, 0);
  }
  function calcular(s) {
    var a = 0, e = 0, nr = 0;
    s.ids.forEach(function (id) {
      var r = s.resp[id];
      if (!r) nr++; else if (r === POR_ID[id].correcta) a++; else e++;
    });
    var pen = (CFG.simulacro && CFG.simulacro.penalizacion) || 1 / 3;
    var neta = s.tipo === "simulacro" ? a - e * pen : a;
    var nota = Math.max(0, (neta / s.ids.length) * 10);
    return { total: s.ids.length, aciertos: a, errores: e, blancos: nr, neta: neta, nota: Math.round(nota * 100) / 100 };
  }

  /* ---------- vistas ---------- */
  function cabecera() {
    var tema = aplicarTema();
    var etiquetas = { auto: "Tema: auto", light: "Tema: claro", dark: "Tema: oscuro" };
    return '<header class="ldl-top"><a class="ldl-brand" href="' + esc(CFG.web || "#") + '">' +
      '<span class="ldl-logo" aria-hidden="true">§</span><span><b>Letra de Ley</b><small>' +
      esc(CFG.pack.nombre) + "</small></span></a>" +
      '<button class="ldl-tema" data-acc="tema" type="button">' + etiquetas[tema] + "</button></header>";
  }
  function navegacion() {
    if (CFG.modo === "web") return "";
    var items = [["inicio", "Inicio"], ["temas", "Por temas"], ["simulacro", "Simulacro"], ["fallos", "Fallos"], ["stats", "Estadísticas"]];
    return '<nav class="ldl-nav" aria-label="Secciones">' + items.map(function (it) {
      var actual = vista === it[0] || (vista === "test" && sesion && sesion.origen === it[0]);
      return '<button type="button" data-acc="ir" data-v="' + it[0] + '"' + (actual ? ' aria-current="page"' : "") + ">" + it[1] + "</button>";
    }).join("") + "</nav>";
  }
  function pie() {
    return '<p class="ldl-pie">Letra de Ley · ' + esc(CFG.pack.edicion) + " · Texto legal actualizado a " +
      esc(CFG.pack.actualizado) + "<br>Uso personal. Prohibida su redistribución.</p>";
  }

  function vInicio() {
    var r = resumen(B.preguntas), f = fallosPendientes().length;
    return '<section class="ldl-card"><h2>' + esc(CFG.pack.nombre) + "</h2>" +
      '<p class="ldl-muted">' + B.preguntas.length + " preguntas comentadas, con el artículo exacto de cada respuesta.</p>" +
      '<div class="ldl-kpis"><div class="ldl-kpi"><b>' + r.vistas + "/" + r.total + "</b><span>respondidas</span></div>" +
      '<div class="ldl-kpi"><b>' + r.acierto + ' %</b><span>de acierto</span></div>' +
      '<div class="ldl-kpi"><b>' + f + "</b><span>fallos por repasar</span></div></div>" +
      '<div class="ldl-acciones"><button class="ldl-btn" data-acc="rapido" type="button">Test rápido de 20</button>' +
      '<button class="ldl-btn sec" data-acc="ir" data-v="simulacro" type="button">Simulacro de examen</button>' +
      (f ? '<button class="ldl-btn sec" data-acc="repasar" type="button">Repasar ' + f + " fallos</button>" : "") +
      "</div></section>" +
      '<section class="ldl-card"><h3>Cómo sacarle partido</h3><ol class="ldl-muted">' +
      "<li>Practica <b>por temas</b>: cada respuesta te enseña el artículo y por qué fallan las demás opciones.</li>" +
      "<li>Cada pocos días, <b>repasa tus fallos</b>: es donde más se aprende.</li>" +
      "<li>Antes del examen, haz <b>simulacros</b> con tiempo y con la penalización real (cada error resta 1/3).</li></ol>" +
      '<p class="ldl-small ldl-muted">Tu progreso se guarda en este dispositivo y en este navegador.</p></section>' + historial();
  }
  function historial() {
    if (!prog.h.length) return "";
    return '<section class="ldl-card"><h3>Últimos tests</h3><ul class="ldl-revision">' + prog.h.slice(0, 5).map(function (h) {
      var d = new Date(h.t);
      return "<li><b>" + (h.tipo === "simulacro" ? "Simulacro" : "Práctica") + "</b> · " + d.toLocaleDateString("es-ES") +
        " · " + h.a + "/" + h.n + " aciertos" + (h.tipo === "simulacro" ? " · nota " + num(h.nota) : "") + "</li>";
    }).join("") + "</ul></section>";
  }
  function vTemas() {
    var html = '<section class="ldl-card"><h2>Practicar por temas</h2><p class="ldl-muted">Elige un bloque. Las preguntas salen en orden aleatorio y se corrigen al momento.</p><ul class="ldl-bloques">';
    B.bloques.forEach(function (b) {
      var lista = delBloque(b.id), r = resumen(lista);
      html += '<li><button type="button" data-acc="bloque" data-id="' + esc(b.id) + '"><span class="t">' + esc(b.nombre) +
        '</span><span class="n">' + r.vistas + "/" + r.total + (r.vistas ? " · " + r.acierto + " %" : "") + "</span>" +
        '<span class="ldl-barra"><i style="width:' + pct(r.vistas, r.total) + '%"></i></span></button></li>';
    });
    return html + "</ul></section>";
  }
  function vSimulacro() {
    var total = B.preguntas.length;
    var opcionesN = [10, 20, 30, 50, 100].filter(function (n) { return n < total; });
    opcionesN.push(total);
    var porDefecto = Math.min((CFG.simulacro && CFG.simulacro.preguntas) || 30, total);
    return '<section class="ldl-card"><h2>Simulacro de examen</h2>' +
      '<p class="ldl-muted">Como el día del examen: no ves las soluciones hasta el final y cada error resta un tercio de acierto.</p>' +
      '<div class="ldl-campo"><label for="ldl-n">Número de preguntas</label><select id="ldl-n">' +
      opcionesN.map(function (n) { return "<option" + (n === porDefecto ? " selected" : "") + ">" + n + "</option>"; }).join("") +
      '</select></div><div class="ldl-campo"><label for="ldl-t">Tiempo</label><select id="ldl-t">' +
      '<option value="1">1 minuto por pregunta</option><option value="0">Sin límite de tiempo</option></select></div>' +
      '<div class="ldl-campo"><label for="ldl-b">Temas</label><select id="ldl-b"><option value="">Todos</option>' +
      B.bloques.map(function (b) { return '<option value="' + esc(b.id) + '">' + esc(b.nombre) + "</option>"; }).join("") +
      '</select></div><div class="ldl-acciones"><button class="ldl-btn" data-acc="simular" type="button">Empezar simulacro</button></div></section>';
  }
  function vFallos() {
    var f = fallosPendientes();
    if (!f.length) {
      return '<section class="ldl-card"><h2>Repaso de fallos</h2><p class="ldl-muted">No tienes fallos pendientes. Cuando falles una pregunta aparecerá aquí hasta que la aciertes.</p></section>';
    }
    return '<section class="ldl-card"><h2>Repaso de fallos</h2><p class="ldl-muted">Tienes <b>' + f.length +
      "</b> preguntas falladas. Salen de aquí en cuanto las aciertas.</p>" +
      '<div class="ldl-acciones"><button class="ldl-btn" data-acc="repasar" type="button">Repasar ahora</button></div></section>';
  }
  function vStats() {
    var html = '<section class="ldl-card"><h2>Estadísticas</h2><ul class="ldl-bloques">';
    B.bloques.forEach(function (b) {
      var r = resumen(delBloque(b.id));
      html += '<li><button type="button" data-acc="bloque" data-id="' + esc(b.id) + '"><span class="t">' + esc(b.nombre) +
        '</span><span class="n">' + (r.vistas ? r.acierto + " % de acierto" : "sin empezar") + '</span><span class="ldl-barra"><i style="width:' +
        r.acierto + '%"></i></span></button></li>';
    });
    html += '</ul></section><section class="ldl-card"><h3>Empezar de cero</h3><p class="ldl-muted ldl-small">Borra tu progreso guardado en este dispositivo.</p>' +
      '<div class="ldl-acciones"><button class="ldl-btn sec" data-acc="borrar" type="button">Borrar mi progreso</button></div></section>';
    return html;
  }
  function vPortada() {
    var n = B.preguntas.length;
    return '<section class="ldl-card"><h2>' + esc(CFG.pack.nombre) + "</h2>" +
      '<p class="ldl-muted">' + n + " preguntas tipo examen, corregidas al momento, con el artículo exacto y la explicación de cada opción. Gratis y sin registrarte.</p>" +
      '<div class="ldl-acciones"><button class="ldl-btn" data-acc="empezarweb" type="button">Empezar el test</button></div></section>';
  }

  function vTest() {
    var id = sesion.ids[sesion.i], p = POR_ID[id], sim = sesion.tipo === "simulacro";
    var elegida = sesion.resp[id], corregida = !sim && sesion.corregida[id];
    var html = '<section class="ldl-card"><div class="ldl-meta"><span>' + esc(sesion.titulo) + " · " + (sesion.i + 1) + " de " + sesion.ids.length +
      "</span><span>" + (sesion.limite ? '⏱ <span id="ldl-crono" class="ldl-crono">' +
        mmss(Math.max(0, sesion.limite - Math.floor((Date.now() - sesion.inicio) / 1000))) + "</span>" : esc(p.articulo_txt)) +
      '</span></div><div class="ldl-progreso"><i style="width:' + pct(sesion.i + (corregida ? 1 : 0), sesion.ids.length) + '%"></i></div>' +
      '<p class="ldl-enunciado">' + esc(p.enunciado) + '</p><div class="ldl-opciones" role="group" aria-label="Opciones">';
    LETRAS.forEach(function (l) {
      var cls = "ldl-op";
      if (corregida) { if (l === p.correcta) cls += " ok"; else if (l === elegida) cls += " ko"; }
      else if (sim && elegida === l) cls += " marcada";
      html += '<button type="button" class="' + cls + '" data-acc="resp" data-l="' + l + '"' + (corregida ? " disabled" : "") +
        (sim ? ' aria-pressed="' + (elegida === l) + '"' : "") + '><span class="l">' + l + ")</span><span>" + esc(p.opciones[l]) + "</span></button>";
    });
    html += "</div>";
    if (corregida) html += feedback(p, elegida);
    html += '<div class="ldl-acciones">';
    if (sim) {
      html += (sesion.i > 0 ? '<button class="ldl-btn sec" data-acc="ant" type="button">Anterior</button>' : "") +
        '<button class="ldl-btn" data-acc="sig" type="button">' + (sesion.i < sesion.ids.length - 1 ? "Siguiente" : "Entregar") + "</button>" +
        (sesion.i < sesion.ids.length - 1 ? '<button class="ldl-btn sec" data-acc="entregar" type="button">Entregar ya</button>' : "");
    } else if (corregida) {
      html += '<button class="ldl-btn" data-acc="sig" type="button">' + (sesion.i < sesion.ids.length - 1 ? "Siguiente" : "Ver resultado") + "</button>";
    }
    html += '<button class="ldl-btn sec" data-acc="salir" type="button">Salir</button></div></section>';
    return html;
  }
  function feedback(p, elegida) {
    var bien = elegida === p.correcta;
    return '<div class="ldl-feedback" aria-live="polite"><div class="v ' + (bien ? "ok" : "ko") + '">' +
      (bien ? "¡Correcta!" : "Incorrecta. La respuesta correcta es la " + p.correcta + ")") + "</div><div>" + esc(p.explicacion) + "</div>" +
      (p.cita ? '<blockquote class="ldl-cita">' + esc(p.cita) + "<small>" + esc(p.articulo_txt) + "</small></blockquote>" : "") + "</div>";
  }
  function vResultado() {
    var r = calcular(sesion), sim = sesion.tipo === "simulacro";
    var html = '<section class="ldl-card"><h2>' + (sim ? "Resultado del simulacro" : "Resultado") + "</h2>" +
      '<div class="ldl-nota">' + (sim ? num(r.nota.toFixed(2)) : r.aciertos + "/" + r.total) + "</div>" +
      '<p class="ldl-muted">' + plural(r.aciertos, "acierto", "aciertos") + " · " + plural(r.errores, "error", "errores") +
      (r.blancos ? " · " + r.blancos + " en blanco" : "") +
      (sim ? " · nota sobre 10 con penalización" : "") + "</p>";
    if (CFG.modo === "web") html += ctaWeb(r);
    html += '<div class="ldl-acciones">' + (CFG.modo === "web" ? '<button class="ldl-btn sec" data-acc="empezarweb" type="button">Repetir con otro orden</button>' :
      '<button class="ldl-btn" data-acc="ir" data-v="inicio" type="button">Volver al inicio</button>') + "</div></section>";
    html += '<section class="ldl-card"><h3>Revisión</h3><ul class="ldl-revision">';
    sesion.ids.forEach(function (id, n) {
      var p = POR_ID[id], e = sesion.resp[id], chip = !e ? '<span class="ldl-chip nr">En blanco</span>' :
        e === p.correcta ? '<span class="ldl-chip ok">Bien</span>' : '<span class="ldl-chip ko">Mal</span>';
      html += "<li>" + chip + '<span class="e">' + (n + 1) + ". " + esc(p.enunciado) + "</span><br>" +
        '<span class="ldl-small">Correcta: <b>' + p.correcta + ") " + esc(p.opciones[p.correcta]) + "</b>" +
        (e && e !== p.correcta ? " · Marcaste " + e + ")" : "") + '</span><br><span class="ldl-small ldl-muted">' + esc(p.explicacion) + "</span></li>";
    });
    return html + "</ul></section>";
  }
  function ctaWeb() {
    var c = CFG.compra || {}, html = "";
    if (c.url) {
      html += '<div class="ldl-card ldl-cta"><h3>' + esc(c.titulo) + '</h3><p class="ldl-muted">' + esc(c.texto) + "</p>" +
        '<div class="ldl-acciones"><a class="ldl-btn acc" href="' + esc(c.url) + '">' + esc(c.boton) + "</a></div></div>";
    }
    if (CFG.telegram) {
      html += '<p class="ldl-small">¿Quieres un test cada día? <a href="' + esc(CFG.telegram) + '">Únete gratis al canal de Telegram</a>.</p>';
    }
    return html;
  }

  function pintar() {
    var cuerpo;
    if (vista === "test") cuerpo = vTest();
    else if (vista === "resultado") cuerpo = vResultado();
    else if (vista === "portada") cuerpo = vPortada();
    else if (vista === "temas") cuerpo = vTemas();
    else if (vista === "simulacro") cuerpo = vSimulacro();
    else if (vista === "fallos") cuerpo = vFallos();
    else if (vista === "stats") cuerpo = vStats();
    else cuerpo = vInicio();
    raiz.innerHTML = '<div class="ldl">' + cabecera() + navegacion() + "<main>" + cuerpo + "</main>" + pie() + "</div>";
  }

  /* ---------- eventos ---------- */
  raiz.addEventListener("click", function (ev) {
    var el = ev.target.closest("[data-acc]");
    if (!el) return;
    var acc = el.getAttribute("data-acc");
    if (acc === "tema") return cambiarTema();
    if (acc === "ir") { pararReloj(); vista = el.getAttribute("data-v"); sesion = null; pintar(); return; }
    if (acc === "rapido") return empezar("practica", barajar(B.preguntas).slice(0, 20), { titulo: "Test rápido" });
    if (acc === "repasar") return empezar("practica", barajar(fallosPendientes()).slice(0, 30), { titulo: "Repaso de fallos" });
    if (acc === "bloque") {
      var b = B.bloques.filter(function (x) { return x.id === el.getAttribute("data-id"); })[0];
      return empezar("practica", barajar(delBloque(b.id)), { titulo: b.nombre });
    }
    if (acc === "simular") {
      var n = parseInt(document.getElementById("ldl-n").value, 10);
      var conTiempo = document.getElementById("ldl-t").value === "1";
      var bloque = document.getElementById("ldl-b").value;
      var fuente = bloque ? delBloque(bloque) : B.preguntas;
      var elegidas = barajar(fuente).slice(0, n);
      return empezar("simulacro", elegidas, { titulo: "Simulacro", minutos: conTiempo ? elegidas.length : 0 });
    }
    if (acc === "empezarweb") return empezar("practica", barajar(B.preguntas), { titulo: "Test gratuito" });
    if (acc === "resp") return responder(el.getAttribute("data-l"));
    if (acc === "sig") return siguiente();
    if (acc === "ant") return anterior();
    if (acc === "entregar") return terminar();
    if (acc === "salir") { pararReloj(); sesion = null; vista = CFG.modo === "web" ? "portada" : "inicio"; pintar(); return; }
    if (acc === "borrar") {
      if (el.getAttribute("data-confirmar") === "1") { prog = { p: {}, h: [] }; guardar(); pintar(); }
      else { el.setAttribute("data-confirmar", "1"); el.textContent = "Pulsa otra vez para confirmar"; }
    }
  });
  document.addEventListener("keydown", function (ev) {
    if (vista !== "test" || !sesion || ev.altKey || ev.ctrlKey || ev.metaKey) return;
    var k = ev.key.toLowerCase(), mapa = { "1": "a", "2": "b", "3": "c", "4": "d", a: "a", b: "b", c: "c", d: "d" };
    if (mapa[k]) { ev.preventDefault(); responder(mapa[k]); }
    else if (k === "enter" || k === "arrowright") {
      var id = sesion.ids[sesion.i];
      if (sesion.tipo === "simulacro" || sesion.corregida[id]) { ev.preventDefault(); siguiente(); }
    } else if (k === "arrowleft" && sesion.tipo === "simulacro") { ev.preventDefault(); anterior(); }
  });

  pintar();
})();
</script>
</body>
</html>
