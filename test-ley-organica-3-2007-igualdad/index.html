gualdad en el empleo público · Capítulo V. Fuerzas y Cuerpos de Seguridad del Estado","ley":"LOI","nombre":"Título V. El principio de igualdad en el empleo público · Capítulo V. Fuerzas y Cuerpos de Seguridad del Estado"},{"id":"LOI|Título VI. Igualdad de trato en el acceso a bienes y servicios y su suministro","ley":"LOI","nombre":"Título VI. Igualdad de trato en el acceso a bienes y servicios y su suministro"},{"id":"LOI|Título VII. La igualdad en la responsabilidad social de las empresas","ley":"LOI","nombre":"Título VII. La igualdad en la responsabilidad social de las empresas"},{"id":"LOI|Título VIII. Disposiciones organizativas","ley":"LOI","nombre":"Título VIII. Disposiciones organizativas"},{"id":"LOI|Disposiciones adicionales","ley":"LOI","nombre":"Disposiciones adicionales"},{"id":"LOI|Disposiciones transitorias","ley":"LOI","nombre":"Disposiciones transitorias"},{"id":"LOI|Disposiciones finales","ley":"LOI","nombre":"Disposiciones finales"}],"preguntas":[{"id":"LOI-L1-002","ley":"LOI","articulo":"1.1","articulo_txt":"Art. 1.1 LO 3/2007","bloque_id":"LOI|Título preliminar. Objeto y ámbito de la Ley","enunciado":"Según el artículo 1.1 de la Ley Orgánica 3/2007, la eliminación de la discriminación de la mujer se persigue en cualesquiera de los ámbitos de la vida y, singularmente, en las esferas:","opciones":{"a":"Política, laboral, económica, educativa, sanitaria y cultural.","b":"Civil, laboral, familiar, económica, social y deportiva.","c":"Política, judicial, laboral, económica, social y artística.","d":"Política, civil, laboral, económica, social y cultural."},"correcta":"d","explicacion":"El art. 1.1 enumera «las esferas política, civil, laboral, económica, social y cultural»; es la opción d). Las opciones a), b) y c) incluyen esferas que el art. 1.1 no menciona (educativa, sanitaria, familiar, deportiva, judicial o artística) en lugar de algunas de las que sí enumera.","cita":"«1. Las mujeres y los hombres son iguales en dignidad humana, e iguales en derechos y deberes. Esta Ley tiene por objeto hacer efectivo el derecho de igualdad de trato y de oportunidades entre mujeres y hombres, en particular mediante la eliminación de la discriminación de la mujer, sea cual fuere su circunstancia o condición, en cualesquiera de los ámbitos de la vida y, singularmente, en las esferas política, civil, laboral, económica, social y cultural para, en el desarrollo de los artículos 9.2 y 14 de la Constitución, alcanzar una sociedad más democrática, más justa y más solidaria.»","dificultad":2},{"id":"LOI-L1-003","ley":"LOI","articulo":"1.2","articulo_txt":"Art. 1.2 LO 3/2007","bloque_id":"LOI|Título preliminar. Objeto y ámbito de la Ley","enunciado":"Según el artículo 1.2 de la Ley Orgánica 3/2007, a los efectos de hacer efectivo el derecho de igualdad de trato y de oportunidades, la Ley regula derechos y deberes de:","opciones":{"a":"Las personas físicas y las personas jurídicas privadas, mientras que a las públicas solo les fija principios de actuación.","b":"Las personas físicas y jurídicas, tanto públicas como privadas.","c":"Los empleados públicos y las empresas que contraten con el sector público.","d":"Las Administraciones públicas y las organizaciones sindicales y empresariales."},"correcta":"b","explicacion":"El art. 1.2 dispone que la Ley «regula derechos y deberes de las personas físicas y jurídicas, tanto públicas como privadas»; es la opción b). La opción a) excluye a las personas jurídicas públicas, que el art. 1.2 sí incluye; los principios de actuación los establece la Ley para los Poderes Públicos. Las opciones c) y d) limitan los destinatarios a determinados sujetos, cuando el art. 1.2 se refiere a todas las personas físicas y jurídicas.","cita":"«2. A estos efectos, la Ley establece principios de actuación de los Poderes Públicos, regula derechos y deberes de las personas físicas y jurídicas, tanto públicas como privadas, y prevé medidas destinadas a eliminar y corregir en los sectores público y privado, toda forma de discriminación por razón de sexo.»","dificultad":2},{"id":"LOI-L1-006","ley":"LOI","articulo":"3","articulo_txt":"Art. 3 LO 3/2007","bloque_id":"LOI|Título I. El principio de igualdad y la tutela contra la discriminación","enunciado":"Según el artículo 3 de la Ley Orgánica 3/2007, el principio de igualdad de trato entre mujeres y hombres supone la ausencia de toda discriminación, directa o indirecta, por razón de sexo, y, especialmente, de las derivadas de:","opciones":{"a":"El embarazo, la orientación sexual y la situación familiar.","b":"La maternidad, la edad y la situación laboral.","c":"La paternidad, la convivencia en pareja y el estado civil.","d":"La maternidad, la asunción de obligaciones familiares y el estado civil."},"correcta":"d","explicacion":"El art. 3 menciona especialmente las discriminaciones derivadas de «la maternidad, la asunción de obligaciones familiares y el estado civil»; es la opción d). Las opciones a), b) y c) sustituyen alguna de esas tres circunstancias por otras que el art. 3 no menciona.","cita":"«El principio de igualdad de trato entre mujeres y hombres supone la ausencia de toda discriminación, directa o indirecta, por razón de sexo, y, especialmente, las derivadas de la maternidad, la asunción de obligaciones familiares y el estado civil.»","dificultad":2},{"id":"LOI-L1-013","ley":"LOI","articulo":"6.2","articulo_txt":"Art. 6.2 LO 3/2007","bloque_id":"LOI|Título I. El principio de igualdad y la tutela contra la discriminación","enunciado":"Según el artículo 6.2 de la Ley Orgánica 3/2007, no hay discriminación indirecta cuando la disposición, criterio o práctica de que se trate pueda justificarse objetivamente en atención a una finalidad legítima y los medios para alcanzar dicha finalidad sean:","opciones":{"a":"Idóneos y suficientes.","b":"Proporcionados y temporales.","c":"Necesarios y adecuados.","d":"Eficaces y transparentes."},"correcta":"c","explicacion":"El art. 6.2 exceptúa los supuestos en que la disposición, criterio o práctica puedan justificarse objetivamente en atención a una finalidad legítima y «que los medios para alcanzar dicha finalidad sean necesarios y adecuados»; es la opción c). Las opciones a), b) y d) emplean calificativos que el art. 6.2 no utiliza para los medios.","cita":"«2. Se considera discriminación indirecta por razón de sexo la situación en que una disposición, criterio o práctica aparentemente neutros pone a personas de un sexo en desventaja particular con respecto a personas del otro, salvo que dicha disposición, criterio o práctica puedan justificarse objetivamente en atención a una finalidad legítima y que los medios para alcanzar dicha finalidad sean necesarios y adecuados.»","dificultad":2},{"id":"LOI-L1-032","ley":"LOI","articulo":"14","articulo_txt":"Art. 14 LO 3/2007","bloque_id":"LOI|Título II. Políticas públicas para la igualdad · Capítulo I. Principios generales","enunciado":"Según el artículo 14 de la Ley Orgánica 3/2007, ¿cuál de los siguientes NO figura entre los criterios generales de actuación de los Poderes Públicos a los fines de la Ley?","opciones":{"a":"El establecimiento de medidas que aseguren la conciliación del trabajo y de la vida personal y familiar de las mujeres y los hombres.","b":"La adopción de las medidas necesarias para la erradicación de la violencia de género y de la violencia familiar.","c":"La reserva de un porcentaje mínimo de plazas para mujeres en las ofertas de empleo público.","d":"La protección de la maternidad, con especial atención a la asunción por la sociedad de los efectos derivados del embarazo, parto y lactancia."},"correcta":"c","explicacion":"La reserva de plazas en las ofertas de empleo público no figura entre los criterios del art. 14; es la opción c). Las opciones a), b) y d) recogen, respectivamente, los criterios de los apartados 8, 5 y 7 del art. 14.","cita":"«Artículo 14. Criterios generales de actuación de los Poderes Públicos. […] 5. La adopción de las medidas necesarias para la erradicación de la violencia de género, la violencia familiar y todas las formas de acoso sexual y acoso por razón de sexo. […] 7. La protección de la maternidad, con especial atención a la asunción por la sociedad de los efectos derivados del embarazo, parto y lactancia. […] 8. El establecimiento de medidas que aseguren la conciliación del trabajo y de la vida personal y familiar de las mujeres y los hombres, así como el fomento de la corresponsabilidad en las labores domésticas y en la atención a la familia.»","dificultad":2},{"id":"LOI-L1-040","ley":"LOI","articulo":"18","articulo_txt":"Art. 18 LO 3/2007","bloque_id":"LOI|Título II. Políticas públicas para la igualdad · Capítulo I. Principios generales","enunciado":"Según el artículo 18 de la Ley Orgánica 3/2007, ¿a quién se dará cuenta del informe que elabore el Gobierno sobre el conjunto de sus actuaciones en relación con la efectividad del principio de igualdad entre mujeres y hombres?","opciones":{"a":"Al Consejo de Estado.","b":"Al Defensor del Pueblo.","c":"A las Cortes Generales.","d":"Al Consejo de Participación de la Mujer."},"correcta":"c","explicacion":"El art. 18 dispone que «De este informe se dará cuenta a las Cortes Generales»; es la opción c). Las opciones a), b) y d) mencionan órganos a los que el art. 18 no prevé dar cuenta de ese informe.","cita":"«En los términos que reglamentariamente se determinen, el Gobierno elaborará un informe periódico sobre el conjunto de sus actuaciones en relación con la efectividad del principio de igualdad entre mujeres y hombres. De este informe se dará cuenta a las Cortes Generales.»","dificultad":1},{"id":"LOI-L2-011","ley":"LOI","articulo":"33","articulo_txt":"Art. 33 LO 3/2007","bloque_id":"LOI|Título II. Políticas públicas para la igualdad · Capítulo II. Acción administrativa para la igualdad","enunciado":"Según el artículo 33 de la Ley Orgánica 3/2007, en relación con la ejecución de los contratos que celebren las Administraciones públicas, las condiciones especiales con el fin de promover la igualdad entre mujeres y hombres en el mercado de trabajo:","opciones":{"a":"Solo podrán establecerse en los contratos cuyo valor estimado supere los umbrales de la Unión Europea.","b":"Solo podrán establecerse previo informe favorable de la Inspección de Trabajo y Seguridad Social.","c":"Podrán establecerse a través de sus órganos de contratación, de acuerdo con lo establecido en la legislación de contratos del sector público.","d":"Podrán establecerse únicamente en los contratos de obras y de servicios, y no en los de suministro."},"correcta":"c","explicacion":"El art. 33 dispone que las Administraciones públicas, «a través de sus órganos de contratación» y en relación con la ejecución de los contratos que celebren, «podrán establecer condiciones especiales» con ese fin, de acuerdo con la legislación de contratos del sector público; es la opción c). Las opciones a), b) y d) añaden una limitación por importe, un informe previo o una limitación por tipo de contrato que el art. 33 no prevé.","cita":"«Las Administraciones públicas, en el ámbito de sus respectivas competencias, a través de sus órganos de contratación y, en relación con la ejecución de los contratos que celebren, podrán establecer condiciones especiales con el fin de promover la igualdad entre mujeres y hombres en el mercado de trabajo, de acuerdo con lo establecido en la legislación de contratos del sector público.»","dificultad":2},{"id":"LOI-L2-016","ley":"LOI","articulo":"35","articulo_txt":"Art. 35 LO 3/2007","bloque_id":"LOI|Título II. Políticas públicas para la igualdad · Capítulo II. Acción administrativa para la igualdad","enunciado":"Según el artículo 35 de la Ley Orgánica 3/2007, ¿cuál de las siguientes NO se menciona expresamente entre las actuaciones que, a efectos de la concesión de subvenciones, podrán valorarse como de efectiva consecución de la igualdad por parte de las entidades solicitantes?","opciones":{"a":"El porcentaje de mujeres en la plantilla de la entidad solicitante.","b":"Las medidas de conciliación de la vida personal, laboral y familiar.","c":"Las medidas de responsabilidad social de la empresa.","d":"La obtención del distintivo empresarial en materia de igualdad."},"correcta":"a","explicacion":"El párrafo segundo del art. 35 menciona, entre otras, «las medidas de conciliación de la vida personal, laboral y familiar, de responsabilidad social de la empresa, o la obtención del distintivo empresarial en materia de igualdad». El porcentaje de mujeres en la plantilla no figura en esa enumeración; es la opción a). Las opciones b), c) y d) se mencionan expresamente en el párrafo segundo del art. 35.","cita":"«A estos efectos podrán valorarse, entre otras, las medidas de conciliación de la vida personal, laboral y familiar, de responsabilidad social de la empresa, o la obtención del distintivo empresarial en materia de igualdad regulado en el Capítulo IV del Título IV de la presente Ley.»","dificultad":1},{"id":"LOI-L2-019","ley":"LOI","articulo":"37.2","articulo_txt":"Art. 37.2 LO 3/2007","bloque_id":"LOI|Título III. Igualdad y medios de comunicación","enunciado":"Según el artículo 37.2 de la Ley Orgánica 3/2007, la Corporación RTVE fomentará la relación con asociaciones y grupos de mujeres con el fin de:","opciones":{"a":"Identificar sus necesidades e intereses en el ámbito de la comunicación.","b":"Elaborar con ellos los códigos de conducta previstos en el apartado 1.","c":"Cederles espacios gratuitos de emisión en su programación.","d":"Integrarlos en sus órganos de control de la programación."},"correcta":"a","explicacion":"El art. 37.2 dispone que la Corporación RTVE «fomentará la relación con asociaciones y grupos de mujeres para identificar sus necesidades e intereses en el ámbito de la comunicación»; es la opción a). La opción b) es falsa: el art. 37.1.c) se refiere a la adopción de códigos de conducta «mediante la autorregulación», sin prever su elaboración con esas asociaciones. Las opciones c) y d) atribuyen a esa relación finalidades que el art. 37.2 no recoge.","cita":"«2. La Corporación RTVE promoverá la incorporación de las mujeres a puestos de responsabilidad directiva y profesional. Asimismo, fomentará la relación con asociaciones y grupos de mujeres para identificar sus necesidades e intereses en el ámbito de la comunicación.»","dificultad":2},{"id":"LOI-L2-024","ley":"LOI","articulo":"41","articulo_txt":"Art. 41 LO 3/2007","bloque_id":"LOI|Título III. Igualdad y medios de comunicación","enunciado":"Según el artículo 41 de la Ley Orgánica 3/2007, la publicidad que comporte una conducta discriminatoria de acuerdo con esta Ley se considerará:","opciones":{"a":"Publicidad engañosa.","b":"Publicidad encubierta.","c":"Publicidad ilícita.","d":"Publicidad subliminal."},"correcta":"c","explicacion":"El art. 41 dispone que esa publicidad «se considerará publicidad ilícita, de conformidad con lo previsto en la legislación general de publicidad y de publicidad y comunicación institucional»; es la opción c). Las opciones a), b) y d) utilizan calificaciones que el art. 41 no emplea.","cita":"«La publicidad que comporte una conducta discriminatoria de acuerdo con esta Ley se considerará publicidad ilícita, de conformidad con lo previsto en la legislación general de publicidad y de publicidad y comunicación institucional.»","dificultad":1},{"id":"LOI-L2-026","ley":"LOI","articulo":"42.2","articulo_txt":"Art. 42.2 LO 3/2007","bloque_id":"LOI|Título IV. El derecho al trabajo en igualdad de oportunidades · Capítulo I. Igualdad de trato y de oportunidades en el ámbito laboral","enunciado":"Según el artículo 42.2 de la Ley Orgánica 3/2007, los Programas de inserción laboral activa dirigidos a personas en desempleo:","opciones":{"a":"Se destinarán exclusivamente a mujeres, con independencia de su nivel educativo y de su edad.","b":"Deberán reservar a las mujeres, como mínimo, la mitad de las plazas que se oferten en cada programa.","c":"Se dirigirán a las mujeres que no hayan completado la enseñanza obligatoria, con prioridad para las más jóvenes.","d":"Se podrán destinar prioritariamente a colectivos específicos de mujeres o contemplar una determinada proporción de mujeres."},"correcta":"d","explicacion":"El art. 42.2 dispone que esos programas comprenderán todos los niveles educativos y edad de las mujeres y «se podrán destinar prioritariamente a colectivos específicos de mujeres o contemplar una determinada proporción de mujeres»; es la opción d). Las opciones a) y b) convierten en exclusividad o en reserva mínima obligatoria lo que el art. 42.2 configura como una posibilidad. La opción c) es falsa: el art. 42.2 dice que esos programas comprenderán todos los niveles educativos y edad de las mujeres.","cita":"«2. Los Programas de inserción laboral activa comprenderán todos los niveles educativos y edad de las mujeres, incluyendo los de Formación Profesional, Escuelas Taller y Casas de Oficios, dirigidos a personas en desempleo, se podrán destinar prioritariamente a colectivos específicos de mujeres o contemplar una determinada proporción de mujeres.»","dificultad":2},{"id":"LOI-L2-027","ley":"LOI","articulo":"43","articulo_txt":"Art. 43 LO 3/2007","bloque_id":"LOI|Título IV. El derecho al trabajo en igualdad de oportunidades · Capítulo I. Igualdad de trato y de oportunidades en el ámbito laboral","enunciado":"Según el artículo 43 de la Ley Orgánica 3/2007, las medidas de acción positiva para favorecer el acceso de las mujeres al empleo y la aplicación efectiva del principio de igualdad de trato y no discriminación en las condiciones de trabajo entre mujeres y hombres:","opciones":{"a":"Se podrán establecer mediante la negociación colectiva, de acuerdo con lo establecido legalmente.","b":"Solo podrán establecerse en los convenios colectivos de ámbito estatal.","c":"Se podrán establecer mediante la negociación colectiva, previa autorización de la autoridad laboral.","d":"Solo podrán establecerse por ley o por reglamento, y no mediante la negociación colectiva."},"correcta":"a","explicacion":"El art. 43 dispone que, «De acuerdo con lo establecido legalmente, mediante la negociación colectiva se podrán establecer medidas de acción positiva» con esas finalidades; es la opción a). La opción b) limita esas medidas a un ámbito de negociación que el art. 43 no especifica. La opción c) añade una autorización previa que el art. 43 no exige. La opción d) es falsa: el art. 43 permite establecerlas mediante la negociación colectiva.","cita":"«De acuerdo con lo establecido legalmente, mediante la negociación colectiva se podrán establecer medidas de acción positiva para favorecer el acceso de las mujeres al empleo y la aplicación efectiva del principio de igualdad de trato y no discriminación en las condiciones de trabajo entre mujeres y hombres.»","dificultad":2},{"id":"LOI-L2-028","ley":"LOI","articulo":"44.1","articulo_txt":"Art. 44.1 LO 3/2007","bloque_id":"LOI|Título IV. El derecho al trabajo en igualdad de oportunidades · Capítulo II. Igualdad y conciliación","enunciado":"Según el artículo 44.1 de la Ley Orgánica 3/2007, los derechos de conciliación de la vida personal, familiar y laboral se reconocerán a los trabajadores y las trabajadoras en forma que:","opciones":{"a":"Correspondan preferentemente a las trabajadoras, como medida de acción positiva en su favor.","b":"Queden subordinados a las necesidades organizativas y productivas de la empresa.","c":"Su ejercicio no suponga en ningún caso una reducción de las retribuciones de quien los disfrute.","d":"Fomenten la asunción equilibrada de las responsabilidades familiares, evitando toda discriminación basada en su ejercicio."},"correcta":"d","explicacion":"El art. 44.1 dispone que esos derechos se reconocerán «en forma que fomenten la asunción equilibrada de las responsabilidades familiares, evitando toda discriminación basada en su ejercicio»; es la opción d). La opción a) es contraria al art. 44.1, que busca un reparto equilibrado de las responsabilidades familiares entre trabajadores y trabajadoras. Las opciones b) y c) introducen condiciones o garantías que el art. 44.1 no menciona.","cita":"«1. Los derechos de conciliación de la vida personal, familiar y laboral se reconocerán a los trabajadores y las trabajadoras en forma que fomenten la asunción equilibrada de las responsabilidades familiares, evitando toda discriminación basada en su ejercicio.»","dificultad":1},{"id":"LOI-L2-031","ley":"LOI","articulo":"45.3","articulo_txt":"Art. 45.3 LO 3/2007","bloque_id":"LOI|Título IV. El derecho al trabajo en igualdad de oportunidades · Capítulo III. Los planes de igualdad de las empresas y otras medidas de promoción de la igualdad","enunciado":"Según el artículo 45.3 de la Ley Orgánica 3/2007, sin perjuicio de lo dispuesto en el apartado 2, las empresas deberán elaborar y aplicar un plan de igualdad cuando así se establezca en:","opciones":{"a":"Una resolución de la Inspección de Trabajo y Seguridad Social, dictada tras una actuación de comprobación.","b":"El convenio colectivo que sea aplicable, en los términos previstos en el mismo.","c":"Una orden del Ministerio competente en materia de trabajo, por razón del sector de actividad.","d":"El acuerdo adoptado por la mayoría de la plantilla, convocada a tal efecto por la representación legal."},"correcta":"b","explicacion":"El art. 45.3 dispone que las empresas deberán elaborar y aplicar un plan de igualdad «cuando así se establezca en el convenio colectivo que sea aplicable, en los términos previstos en el mismo»; es la opción b). Las opciones a), c) y d) mencionan fuentes de la obligación que el art. 45 no recoge.","cita":"«3. Sin perjuicio de lo dispuesto en el apartado anterior, las empresas deberán elaborar y aplicar un plan de igualdad cuando así se establezca en el convenio colectivo que sea aplicable, en los términos previstos en el mismo.»","dificultad":1},{"id":"LOI-L2-035","ley":"LOI","articulo":"46.2","articulo_txt":"Art. 46.2 LO 3/2007","bloque_id":"LOI|Título IV. El derecho al trabajo en igualdad de oportunidades · Capítulo III. Los planes de igualdad de las empresas y otras medidas de promoción de la igualdad","enunciado":"Según el artículo 46.2 de la Ley Orgánica 3/2007, en su redacción vigente, ¿cuál de las siguientes materias NO figura entre las que contendrá al menos el diagnóstico que se elaborará con carácter previo al plan de igualdad?","opciones":{"a":"La infrarrepresentación femenina.","b":"Las condiciones de trabajo, incluida la auditoría salarial entre mujeres y hombres.","c":"La política de comunicación externa y de publicidad de la empresa.","d":"El ejercicio corresponsable de los derechos de la vida personal, familiar y laboral."},"correcta":"c","explicacion":"El art. 46.2, en la redacción dada por el art. 1.2 del Real Decreto-ley 6/2019, de 1 de marzo, enumera nueve materias del diagnóstico, de la a) a la i), entre las que no está la política de comunicación externa y de publicidad de la empresa; es la opción c). Las opciones a), b) y d) corresponden a las letras g), e) y f) del art. 46.2.","cita":"«2. Los planes de igualdad contendrán un conjunto ordenado de medidas evaluables dirigidas a remover los obstáculos que impiden o dificultan la igualdad efectiva de mujeres y hombres. Con carácter previo se elaborará un diagnóstico negociado, en su caso, con la representación legal de las personas trabajadoras, que contendrá al menos las siguientes materias: a) Proceso de selección y contratación. b) Clasificación profesional. c) Formación. d) Promoción profesional. e) Condiciones de trabajo, incluida la auditoría salarial entre mujeres y hombres. f) Ejercicio corresponsable de los derechos de la vida personal, familiar y laboral. g) Infrarrepresentación femenina. h) Retribuciones. i) Prevención del acoso sexual y por razón de sexo.»","dificultad":2},{"id":"LOI-L2-046","ley":"LOI","articulo":"50.2","articulo_txt":"Art. 50.2 LO 3/2007","bloque_id":"LOI|Título IV. El derecho al trabajo en igualdad de oportunidades · Capítulo IV. Distintivo empresarial en materia de igualdad","enunciado":"Según el artículo 50.2 de la Ley Orgánica 3/2007, con el fin de obtener el distintivo empresarial en materia de igualdad, ¿qué empresas podrán presentar un balance sobre los parámetros de igualdad implantados respecto de las relaciones de trabajo y la publicidad de los productos y servicios prestados?","opciones":{"a":"Toda empresa, sea de capital público o privado.","b":"Las empresas de capital privado, pero no las de capital público.","c":"Únicamente las empresas que tengan un plan de igualdad inscrito en el registro.","d":"Solo las empresas que no estén obligadas a elaborar un plan de igualdad."},"correcta":"a","explicacion":"El art. 50.2 permite presentar ese balance a «cualquier empresa, sea de capital público o privado»; es la opción a). Las opciones b), c) y d) limitan a determinadas empresas una posibilidad que el art. 50.2 abre a todas; la adopción de planes de igualdad es uno de los criterios de concesión del art. 50.4, no un requisito para presentar el balance.","cita":"«2. Con el fin de obtener este distintivo, cualquier empresa, sea de capital público o privado, podrá presentar al Ministerio de Trabajo y Asuntos Sociales un balance sobre los parámetros de igualdad implantados respecto de las relaciones de trabajo y la publicidad de los productos y servicios prestados.»","dificultad":2},{"id":"LOI-L2-047","ley":"LOI","articulo":"50.4","articulo_txt":"Art. 50.4 LO 3/2007","bloque_id":"LOI|Título IV. El derecho al trabajo en igualdad de oportunidades · Capítulo IV. Distintivo empresarial en materia de igualdad","enunciado":"Según el artículo 50.4 de la Ley Orgánica 3/2007, ¿cuál de los siguientes NO figura expresamente entre los criterios que se tendrán en cuenta para la concesión del distintivo empresarial en materia de igualdad?","opciones":{"a":"La presencia equilibrada de mujeres y hombres en los órganos de dirección y en los distintos grupos y categorías profesionales de la empresa.","b":"La ausencia de sanciones firmes en materia laboral impuestas a la empresa.","c":"La adopción de planes de igualdad u otras medidas innovadoras de fomento de la igualdad.","d":"La publicidad no sexista de los productos o servicios de la empresa."},"correcta":"b","explicacion":"El art. 50.4 menciona, entre otros criterios, la presencia equilibrada de mujeres y hombres en los órganos de dirección y en los grupos y categorías profesionales, «la adopción de planes de igualdad u otras medidas innovadoras de fomento de la igualdad» y «la publicidad no sexista de los productos o servicios de la empresa». La ausencia de sanciones no figura entre ellos; es la opción b). Las opciones a), c) y d) reproducen los criterios que enumera el art. 50.4.","cita":"«4. Para la concesión de este distintivo se tendrán en cuenta, entre otros criterios, la presencia equilibrada de mujeres y hombres en los órganos de dirección y en los distintos grupos y categorías profesionales de la empresa, la adopción de planes de igualdad u otras medidas innovadoras de fomento de la igualdad, así como la publicidad no sexista de los productos o servicios de la empresa.»","dificultad":2},{"id":"LOI-L3-002","ley":"LOI","articulo":"51","articulo_txt":"Art. 51 LO 3/2007","bloque_id":"LOI|Título V. El principio de igualdad en el empleo público · Capítulo I. Criterios de actuación de las Administraciones públicas","enunciado":"Según el artículo 51 de la Ley Orgánica 3/2007, ¿cuál de los siguientes NO figura entre los criterios de actuación que deben seguir las Administraciones públicas en aplicación del principio de igualdad entre mujeres y hombres?","opciones":{"a":"Fomentar la formación en igualdad a lo largo de la carrera profesional.","b":"Establecer medidas efectivas para eliminar la discriminación retributiva, directa o indirecta, por razón de sexo.","c":"Evaluar periódicamente la efectividad del principio de igualdad en sus respectivos ámbitos de actuación.","d":"Implantar el teletrabajo como medida preferente de conciliación para el personal con hijos menores."},"correcta":"d","explicacion":"El art. 51 no menciona el teletrabajo entre los criterios de actuación de las Administraciones públicas; es la opción d). Las opciones a), b) y c) recogen, respectivamente, las letras c), f) y g) del art. 51.","cita":"«Las Administraciones públicas, en el ámbito de sus respectivas competencias y en aplicación del principio de igualdad entre mujeres y hombres, deberán: […] c) Fomentar la formación en igualdad, tanto en el acceso al empleo público como a lo largo de la carrera profesional. d) Promover la presencia equilibrada de mujeres y hombres en los órganos de selección y valoración. e) Establecer medidas efectivas de protección frente al acoso sexual y al acoso por razón de sexo. f) Establecer medidas efectivas para eliminar cualquier discriminación retributiva, directa o indirecta, por razón de sexo. g) Evaluar periódicamente la efectividad del principio de igualdad en sus respectivos ámbitos de actuación.»","dificultad":2},{"id":"LOI-L3-001","ley":"LOI","articulo":"51.b)","articulo_txt":"Art. 51.b) LO 3/2007","bloque_id":"LOI|Título V. El principio de igualdad en el empleo público · Capítulo I. Criterios de actuación de las Administraciones públicas","enunciado":"Según el artículo 51 de la Ley Orgánica 3/2007, las Administraciones públicas, en el ámbito de sus respectivas competencias y en aplicación del principio de igualdad entre mujeres y hombres, deberán facilitar la conciliación de la vida personal, familiar y laboral:","opciones":{"a":"A costa, si es preciso, de la promoción profesional.","b":"Sin afectar a la calidad de los servicios.","c":"Dentro de los límites presupuestarios.","d":"Sin menoscabo de la promoción profesional."},"correcta":"d","explicacion":"El art. 51.b) obliga a «Facilitar la conciliación de la vida personal, familiar y laboral, sin menoscabo de la promoción profesional»; es la opción d). La opción a) contradice esa cautela: la conciliación no puede hacerse a costa de la promoción profesional. Las opciones b) y c) añaden condiciones (calidad de los servicios, límites presupuestarios) que el art. 51.b) no establece.","cita":"«b) Facilitar la conciliación de la vida personal, familiar y laboral, sin menoscabo de la promoción profesional.»","dificultad":1},{"id":"LOI-L3-004","ley":"LOI","articulo":"53","articulo_txt":"Art. 53 LO 3/2007","bloque_id":"LOI|Título V. El principio de igualdad en el empleo público · Capítulo II. El principio de presencia equilibrada en la Administración General del Estado y en los organismos públicos vinculados o dependientes de ella","enunciado":"Según el artículo 53 de la Ley Orgánica 3/2007, todos los tribunales y órganos de selección del personal de la Administración General del Estado y de los organismos públicos vinculados o dependientes de ella responderán al principio de presencia equilibrada de mujeres y hombres:","opciones":{"a":"Sin excepción alguna.","b":"Salvo en los procesos selectivos de promoción interna.","c":"Salvo que la propia convocatoria del proceso selectivo disponga otra cosa de forma expresa.","d":"Salvo por razones fundadas y objetivas, debidamente motivadas."},"correcta":"d","explicacion":"El art. 53 exceptúa los casos en que concurran «razones fundadas y objetivas, debidamente motivadas»; es la opción d). La opción a) es falsa porque el art. 53 sí admite excepciones. Las opciones b) y c) recogen excepciones (promoción interna, previsión de la convocatoria) que el art. 53 no contempla.","cita":"«Todos los tribunales y órganos de selección del personal de la Administración General del Estado y de los organismos públicos vinculados o dependientes de ella responderán al principio de presencia equilibrada de mujeres y hombres, salvo por razones fundadas y objetivas, debidamente motivadas.»","dificultad":2},{"id":"LOI-L3-006","ley":"LOI","articulo":"54","articulo_txt":"Art. 54 LO 3/2007","bloque_id":"LOI|Título V. El principio de igualdad en el empleo público · Capítulo II. El principio de presencia equilibrada en la Administración General del Estado y en los organismos públicos vinculados o dependientes de ella","enunciado":"Según el artículo 54 de la Ley Orgánica 3/2007, además de en la designación de sus representantes en órganos colegiados, comités de personas expertas o comités consultivos, ¿en qué otros nombramientos observarán la Administración General del Estado y sus organismos públicos vinculados o dependientes el principio de presencia equilibrada?","opciones":{"a":"En los de las personas que integran los gabinetes de los órganos superiores de cada Departamento.","b":"En los de los órganos de gobierno de las universidades públicas.","c":"En los de los consejos de administración de las empresas en cuyo capital participen.","d":"En los de las jefaturas de las unidades administrativas de rango inferior a Subdirección General."},"correcta":"c","explicacion":"El párrafo segundo del art. 54 extiende el principio a «los nombramientos que le corresponda efectuar en los consejos de administración de las empresas en cuyo capital participe»; es la opción c). Las opciones a), b) y d) se refieren a nombramientos (gabinetes, universidades, jefaturas de unidad) que el art. 54 no menciona.","cita":"«Asimismo, la Administración General del Estado y los organismos públicos vinculados o dependientes de ella observarán el principio de presencia equilibrada en los nombramientos que le corresponda efectuar en los consejos de administración de las empresas en cuyo capital participe.»","dificultad":2},{"id":"LOI-L3-009","ley":"LOI","articulo":"57","articulo_txt":"Art. 57 LO 3/2007","bloque_id":"LOI|Título V. El principio de igualdad en el empleo público · Capítulo III. Medidas de Igualdad en el empleo para la Administración General del Estado y para los organismos públicos vinculados o dependientes de ella","enunciado":"Según el artículo 57 de la Ley Orgánica 3/2007, en las bases de los concursos para la provisión de puestos de trabajo, el tiempo que las personas candidatas hayan permanecido en las situaciones a que se refiere el artículo 56:","opciones":{"a":"Se computará a efectos de antigüedad, pero no de valoración del trabajo desarrollado.","b":"No se computará, aunque tampoco podrá tenerse en cuenta en perjuicio de las personas candidatas.","c":"Se computará a los efectos de valoración del trabajo desarrollado y de los correspondientes méritos.","d":"Se computará solo cuando así lo prevea expresamente la relación de puestos de trabajo del Departamento."},"correcta":"c","explicacion":"El art. 57 dispone que ese tiempo «se computará, a los efectos de valoración del trabajo desarrollado y de los correspondientes méritos»; es la opción c). Las opciones a) y b) limitan o excluyen ese cómputo, en contra de lo que dispone el art. 57. La opción d) condiciona el cómputo a una previsión de la relación de puestos de trabajo que el art. 57 no exige.","cita":"«En las bases de los concursos para la provisión de puestos de trabajo se computará, a los efectos de valoración del trabajo desarrollado y de los correspondientes méritos, el tiempo que las personas candidatas hayan permanecido en las situaciones a que se refiere el artículo anterior.»","dificultad":1},{"id":"LOI-L3-019","ley":"LOI","articulo":"64","articulo_txt":"Art. 64 LO 3/2007","bloque_id":"LOI|Título V. El principio de igualdad en el empleo público · Capítulo III. Medidas de Igualdad en el empleo para la Administración General del Estado y para los organismos públicos vinculados o dependientes de ella","enunciado":"Según el artículo 64 de la Ley Orgánica 3/2007, ¿a quién corresponde aprobar el Plan para la Igualdad entre mujeres y hombres en la Administración General del Estado y en los organismos públicos vinculados o dependientes de ella?","opciones":{"a":"Al Gobierno.","b":"Al Ministerio con competencias en materia de igualdad.","c":"A cada Departamento ministerial, para su respectivo ámbito.","d":"A las Cortes Generales, a propuesta del Instituto de la Mujer."},"correcta":"a","explicacion":"El art. 64 dispone que «El Gobierno aprobará» ese Plan; es la opción a). Las opciones b), c) y d) atribuyen la aprobación del Plan a órganos distintos del que señala el art. 64.","cita":"«El Gobierno aprobará, al inicio de cada legislatura, un Plan para la Igualdad entre mujeres y hombres en la Administración General del Estado y en los organismos públicos vinculados o dependientes de ella.»","dificultad":1},{"id":"LOI-L3-021","ley":"LOI","articulo":"65","articulo_txt":"Art. 65 LO 3/2007","bloque_id":"LOI|Título V. El principio de igualdad en el empleo público · Capítulo IV. Fuerzas Armadas","enunciado":"Según el artículo 65 de la Ley Orgánica 3/2007, las normas sobre personal de las Fuerzas Armadas procurarán la efectividad del principio de igualdad entre mujeres y hombres, en especial en lo que se refiere a determinados ámbitos. ¿Cuál de los siguientes NO se menciona expresamente?","opciones":{"a":"Los ascensos.","b":"Las retribuciones.","c":"Los destinos.","d":"Las situaciones administrativas."},"correcta":"b","explicacion":"El art. 65 se refiere en especial al «régimen de acceso, formación, ascensos, destinos y situaciones administrativas», sin mencionar las retribuciones; es la opción b). Las opciones a), c) y d) figuran en esa enumeración del art. 65.","cita":"«Las normas sobre personal de las Fuerzas Armadas procurarán la efectividad del principio de igualdad entre mujeres y hombres, en especial en lo que se refiere al régimen de acceso, formación, ascensos, destinos y situaciones administrativas.»","dificultad":2},{"id":"LOI-L3-022","ley":"LOI","articulo":"66","articulo_txt":"Art. 66 LO 3/2007","bloque_id":"LOI|Título V. El principio de igualdad en el empleo público · Capítulo IV. Fuerzas Armadas","enunciado":"Según el artículo 66 de la Ley Orgánica 3/2007, las normas referidas al personal al servicio de las administraciones públicas en las materias que el propio artículo enumera serán de aplicación en las Fuerzas Armadas:","opciones":{"a":"En sus mismos términos, sin que quepa introducir adaptación alguna.","b":"Solo respecto del personal civil que preste servicios en el Ministerio de Defensa y en sus organismos públicos.","c":"Con las adaptaciones que resulten necesarias y en los términos establecidos en su normativa específica.","d":"Cuando así lo acuerde el Consejo de Ministros para cada una de esas materias."},"correcta":"c","explicacion":"El art. 66, en la redacción dada por la disposición final 10.4 de la Ley Orgánica 10/2022 (con efectos desde el 7 de octubre de 2022), aplica esas normas en las Fuerzas Armadas «con las adaptaciones que resulten necesarias y en los términos establecidos en su normativa específica»; es la opción c). La opción a) excluye las adaptaciones que el art. 66 admite. Las opciones b) y d) añaden límites o requisitos (solo personal civil, acuerdo del Consejo de Ministros) que el art. 66 no establece.","cita":"«Las normas referidas al personal al servicio de las administraciones públicas en materia de igualdad, protección integral contra la violencia de género y la violencia sexual, y la conciliación de la vida personal, familiar y profesional serán de aplicación en las Fuerzas Armadas, con las adaptaciones que resulten necesarias y en los términos establecidos en su normativa específica.»","dificultad":2},{"id":"LOI-L3-023","ley":"LOI","articulo":"67","articulo_txt":"Art. 67 LO 3/2007","bloque_id":"LOI|Título V. El principio de igualdad en el empleo público · Capítulo V. Fuerzas y Cuerpos de Seguridad del Estado","enunciado":"Según el artículo 67 de la Ley Orgánica 3/2007, respecto de la igualdad efectiva entre mujeres y hombres, las normas reguladoras de las Fuerzas y Cuerpos de Seguridad del Estado:","opciones":{"a":"La procurarán en la medida en que lo permitan las peculiaridades de sus funciones.","b":"La promoverán, impidiendo toda situación de discriminación profesional.","c":"La garantizarán mediante cuotas de acceso en favor del sexo menos representado.","d":"La promoverán únicamente en relación con el personal de nuevo ingreso."},"correcta":"b","explicacion":"El art. 67 dispone que esas normas «promoverán la igualdad efectiva entre mujeres y hombres, impidiendo cualquier situación de discriminación profesional»; es la opción b). La opción a) rebaja el mandato del art. 67, que no lo condiciona a las peculiaridades de las funciones. La opción c) menciona unas cuotas de acceso que el art. 67 no prevé. La opción d) es falsa: el art. 67 no se limita al personal de nuevo ingreso y menciona expresamente, entre otros, los ascensos y los destinos.","cita":"«Las normas reguladoras de las Fuerzas y Cuerpos de Seguridad del Estado promoverán la igualdad efectiva entre mujeres y hombres, impidiendo cualquier situación de discriminación profesional, especialmente, en el sistema de acceso, formación, ascensos, destinos y situaciones administrativas.»","dificultad":2},{"id":"LOI-L3-024","ley":"LOI","articulo":"68","articulo_txt":"Art. 68 LO 3/2007","bloque_id":"LOI|Título V. El principio de igualdad en el empleo público · Capítulo V. Fuerzas y Cuerpos de Seguridad del Estado","enunciado":"Según el artículo 68 de la Ley Orgánica 3/2007, ¿en qué materias serán de aplicación en las Fuerzas y Cuerpos de Seguridad las normas referidas al personal al servicio de las administraciones públicas?","opciones":{"a":"Igualdad, prevención de la violencia de género y la violencia sexual, y conciliación.","b":"Igualdad, régimen disciplinario y prevención de riesgos laborales.","c":"Igualdad, prevención de la violencia de género y la violencia sexual, y régimen disciplinario.","d":"Igualdad, prevención de riesgos laborales y conciliación."},"correcta":"a","explicacion":"El art. 68, en la redacción dada por la disposición final 10.5 de la Ley Orgánica 10/2022 (con efectos desde el 7 de octubre de 2022), se refiere a las materias de «igualdad, prevención de la violencia de género y la violencia sexual, y la conciliación de la vida personal, familiar y profesional»; es la opción a). Las opciones b), c) y d) incluyen el régimen disciplinario o la prevención de riesgos laborales, que el art. 68 no menciona.","cita":"«Las normas referidas al personal al servicio de las administraciones públicas en materia de igualdad, prevención de la violencia de género y la violencia sexual, y la conciliación de la vida personal, familiar y profesional serán de aplicación en las Fuerzas y Cuerpos de Seguridad, adaptándose, en su caso, a las peculiaridades de las funciones que tienen encomendadas, en los términos establecidos por su normativa específica.»","dificultad":2},{"id":"LOI-L3-026","ley":"LOI","articulo":"69.2","articulo_txt":"Art. 69.2 LO 3/2007","bloque_id":"LOI|Título VI. Igualdad de trato en el acceso a bienes y servicios y su suministro","enunciado":"Según el artículo 69.2 de la Ley Orgánica 3/2007, la obligación de igualdad de trato en el suministro de bienes y servicios no afecta a la libertad de contratación, incluida la libertad de la persona de elegir a la otra parte contratante:","opciones":{"a":"Siempre que el contrato se celebre entre particulares que no actúen profesionalmente.","b":"Salvo cuando el bien o servicio se ofrezca por una entidad del sector público.","c":"Siempre y cuando dicha elección no venga determinada por su sexo.","d":"Siempre que los motivos consten en el contrato."},"correcta":"c","explicacion":"El art. 69.2 salvaguarda la libertad de contratación «siempre y cuando dicha elección no venga determinada por su sexo»; es la opción c). Las opciones a), b) y d) sustituyen ese único límite por condiciones (contratación entre particulares, sector público, constancia de los motivos) que el art. 69.2 no establece.","cita":"«2. Lo previsto en el apartado anterior no afecta a la libertad de contratación, incluida la libertad de la persona de elegir a la otra parte contratante, siempre y cuando dicha elección no venga determinada por su sexo.»","dificultad":2},{"id":"LOI-L3-030","ley":"LOI","articulo":"72.2","articulo_txt":"Art. 72.2 LO 3/2007","bloque_id":"LOI|Título VI. Igualdad de trato en el acceso a bienes y servicios y su suministro","enunciado":"Según el artículo 72.2 de la Ley Orgánica 3/2007, en el ámbito de los contratos de seguros o de servicios financieros afines, el incumplimiento de la prohibición contenida en el artículo 71 otorgará al contratante perjudicado el derecho a:","opciones":{"a":"Reclamar la asimilación de sus primas y prestaciones a las del sexo más beneficiado, manteniéndose en lo demás la validez y eficacia del contrato.","b":"Reclamar la asimilación de sus primas y prestaciones a la media de las establecidas para ambos sexos, manteniéndose en lo demás la validez y eficacia del contrato.","c":"Reclamar la asimilación de sus primas y prestaciones a las que correspondan a su grupo de edad, con independencia del sexo.","d":"Reclamar la asimilación de sus primas, pero no la de sus prestaciones, a las del sexo más beneficiado."},"correcta":"a","explicacion":"El art. 72.2 reconoce el derecho a «reclamar la asimilación de sus primas y prestaciones a las del sexo más beneficiado, manteniéndose en los restantes extremos la validez y eficacia del contrato»; es la opción a). Las opciones b) y c) toman como referencia la media de ambos sexos o el grupo de edad, en lugar del sexo más beneficiado. La opción d) excluye las prestaciones, que el art. 72.2 incluye.","cita":"«2. En el ámbito de los contratos de seguros o de servicios financieros afines, y sin perjuicio de lo previsto en el artículo 10 de esta Ley, el incumplimiento de la prohibición contenida en el artículo 71 otorgará al contratante perjudicado el derecho a reclamar la asimilación de sus primas y prestaciones a las del sexo más beneficiado, manteniéndose en los restantes extremos la validez y eficacia del contrato.»","dificultad":2},{"id":"LOI-L3-033","ley":"LOI","articulo":"74","articulo_txt":"Art. 74 LO 3/2007","bloque_id":"LOI|Título VII. La igualdad en la responsabilidad social de las empresas","enunciado":"Según el artículo 74 de la Ley Orgánica 3/2007, el Instituto de la Mujer, u órganos equivalentes de las Comunidades Autónomas, estarán legitimados para ejercer la acción de cesación cuando consideren que pudiera haberse incurrido en supuestos de:","opciones":{"a":"Publicidad comparativa.","b":"Discriminación en el acceso a bienes y servicios.","c":"Publicidad engañosa.","d":"Incumplimiento de un plan de igualdad."},"correcta":"c","explicacion":"El art. 74 legitima a esos organismos para ejercer la acción de cesación en los «supuestos de publicidad engañosa»; es la opción c). Las opciones a), b) y d) mencionan supuestos a los que el art. 74 no se refiere. «Instituto de la Mujer» es la denominación que emplea el art. 74 de la Ley Orgánica 3/2007.","cita":"«Las empresas podrán hacer uso publicitario de sus acciones de responsabilidad en materia de igualdad, de acuerdo con las condiciones establecidas en la legislación general de publicidad. El Instituto de la Mujer, u órganos equivalentes de las Comunidades Autónomas, estarán legitimados para ejercer la acción de cesación cuando consideren que pudiera haberse incurrido en supuestos de publicidad engañosa.»","dificultad":2},{"id":"LOI-L3-038","ley":"LOI","articulo":"78.1","articulo_txt":"Art. 78.1 LO 3/2007","bloque_id":"LOI|Título VIII. Disposiciones organizativas","enunciado":"Según el artículo 78.1 de la Ley Orgánica 3/2007, el Consejo de Participación de la Mujer se crea como:","opciones":{"a":"Organismo autónomo de carácter administrativo.","b":"Órgano colegiado de cooperación entre la Administración General del Estado y las Comunidades Autónomas.","c":"Órgano colegiado de consulta y asesoramiento.","d":"Órgano unipersonal de defensa de la igualdad."},"correcta":"c","explicacion":"El art. 78.1 crea el Consejo de Participación de la Mujer «como órgano colegiado de consulta y asesoramiento»; es la opción c). Las opciones a) y d) le atribuyen una naturaleza (organismo autónomo, órgano unipersonal) distinta de la que fija el art. 78.1. La opción b) es falsa: el art. 78.1 no lo configura como órgano de cooperación, sino como cauce para la participación de las mujeres. «Consejo de Participación de la Mujer» es la denominación que emplea la Ley Orgánica 3/2007.","cita":"«1. Se crea el Consejo de Participación de la Mujer, como órgano colegiado de consulta y asesoramiento, con el fin esencial de servir de cauce para la participación de las mujeres en la consecución efectiva del principio de igualdad de trato y de oportunidades entre mujeres y hombres, y la lucha contra la discriminación por razón de sexo.»","dificultad":1},{"id":"LOI-L3-039","ley":"LOI","articulo":"DA 28ª","articulo_txt":"DA 28ª · LO 3/2007","bloque_id":"LOI|Disposiciones adicionales","enunciado":"Según la disposición adicional vigésima octava de la Ley Orgánica 3/2007, el Instituto de la Mujer será:","opciones":{"a":"El órgano encargado de conceder y retirar el distintivo empresarial en materia de igualdad a las empresas que lo soliciten.","b":"El organismo competente en el Reino de España a efectos de determinados preceptos de Directivas sobre igualdad de trato.","c":"El órgano colegiado de coordinación de las Unidades de Igualdad de los distintos Ministerios.","d":"La autoridad competente para sancionar las infracciones en materia de publicidad discriminatoria."},"correcta":"b","explicacion":"La DA 28ª designa al Instituto de la Mujer como «el organismo competente en el Reino de España» a efectos del art. 8 bis de la Directiva 76/207 (modificada por la Directiva 2002/73) y del art. 12 de la Directiva 2004/113; es la opción b). Las opciones a), c) y d) le atribuyen funciones que la DA 28ª no menciona. «Instituto de la Mujer» es la denominación que emplea la DA 28ª de la Ley Orgánica 3/2007.","cita":"«El Instituto de la Mujer será el organismo competente en el Reino de España a efectos de lo dispuesto en el artículo 8 bis de la Directiva 76/207, de 9 de febrero de 1976, modificada por la Directiva 2002/73, del Parlamento Europeo y del Consejo, de 23 de septiembre de 2002, relativa a la aplicación del principio de igualdad de trato entre hombres y mujeres en lo que se refiere al acceso al empleo, a la formación y a la promoción profesionales, y a las condiciones de trabajo y en el artículo 12 de la Directiva 2004/113, del Consejo, de 13 de diciembre de 2004, sobre aplicación del principio de igualdad de trato entre hombres y mujeres en el acceso a bienes y servicios y su suministro.»","dificultad":3},{"id":"LOI-L3-041","ley":"LOI","articulo":"DT 12ª","articulo_txt":"DT 12ª · LO 3/2007","bloque_id":"LOI|Disposiciones transitorias","enunciado":"Según la disposición transitoria décima segunda de la Ley Orgánica 3/2007, los periodos de transitoriedad de que dispusieron las empresas, según su número de personas trabajadoras, para la aprobación de los planes de igualdad se computaban:","opciones":{"a":"Desde la constitución de la comisión negociadora del plan en cada empresa.","b":"Desde que cada empresa alcanzara el número de personas trabajadoras que determina la obligación de aprobar el plan.","c":"Desde la entrada en vigor de la Ley Orgánica 3/2007.","d":"Desde la publicación del Real Decreto-ley 6/2019, de 1 de marzo, en el «Boletín Oficial del Estado»."},"correcta":"d","explicacion":"La DT 12ª, añadida por el art. 1.3 del Real Decreto-ley 6/2019, dispone que esos periodos «se computarán desde la publicación» de dicho Real Decreto-ley en el BOE; es la opción d). Los tres periodos (uno, dos y tres años, según el tamaño de la empresa) ya han transcurrido: el más largo venció en marzo de 2022, por lo que la disposición ya no tiene efecto práctico. Las opciones a), b) y c) toman como inicio del cómputo un momento distinto del que fija la DT 12ª.","cita":"«Estos periodos de transitoriedad se computarán desde la publicación del Real Decreto-ley 6/2019, de 1 de marzo, en el “Boletín Oficial del Estado”.»","dificultad":3},{"id":"LOI-L3-044","ley":"LOI","articulo":"DF 2ª","articulo_txt":"DF 2ª · LO 3/2007","bloque_id":"LOI|Disposiciones finales","enunciado":"Según la disposición final segunda de la Ley Orgánica 3/2007, ¿qué preceptos de la Ley tienen carácter orgánico?","opciones":{"a":"Las disposiciones adicionales primera, segunda y tercera.","b":"Todos sus preceptos, por tratarse de una ley orgánica.","c":"El Título Preliminar, el Título I y la disposición adicional primera.","d":"Las disposiciones adicionales segunda a séptima."},"correcta":"a","explicacion":"La DF 2ª dispone que «Las normas contenidas en las disposiciones adicionales primera, segunda y tercera de esta Ley tienen carácter orgánico» y que el resto no lo tiene; es la opción a). La opción b) es falsa: la DF 2ª niega expresamente el carácter orgánico al resto de los preceptos. Las opciones c) y d) incluyen preceptos sin carácter orgánico o dejan fuera alguna de las tres disposiciones adicionales que lo tienen.","cita":"«Las normas contenidas en las disposiciones adicionales primera, segunda y tercera de esta Ley tienen carácter orgánico. El resto de los preceptos contenidos en esta Ley no tienen tal carácter.»","dificultad":2}]};</script>
<script>
/* Letra de Ley — motor de test. Sin dependencias; funciona sin conexión.
   Necesita window.LDL_CONFIG y window.LDL_BANCO (los inyecta sistema/letradeley.py). */
(function () {
  "use strict";
  var CFG = window.LDL_CONFIG, B = window.LDL_BANCO;
  var raiz = document.getElementById("ldl");
  var LETRAS = ["a", "b", "c", "d"];
  var POR_ID = {};
  B.preguntas.forEach(function (p) { POR_ID[p.id] = p; });
  var CLAVE = "ldl1:" + CFG.pack.id;
  var prog = cargar();
  var sesion = null;
  var vista = CFG.modo === "web" ? "portada" : "inicio";
  var reloj = null;

  /* ---------- utilidades ---------- */
  function esc(t) {
    return String(t == null ? "" : t).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function barajar(lista) {
    var a = lista.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function pct(a, b) { return b ? Math.round((a / b) * 100) : 0; }
  function plural(n, uno, varios) { return n + " " + (n === 1 ? uno : varios); }
  function num(n) { return String(n).replace(".", ","); }
  function cargar() {
    try { var s = localStorage.getItem(CLAVE); if (s) { var d = JSON.parse(s); if (d && d.p) return d; } } catch (e) {}
    return { p: {}, h: [] };
  }
  function guardar() { try { localStorage.setItem(CLAVE, JSON.stringify(prog)); } catch (e) {} }
  function registrar(id, acierto) {
    var r = prog.p[id] || { v: 0, a: 0, f: 0, c: 0 };
    r.v++;
    if (acierto) { r.a++; r.c = Math.min((r.c || 0) + 1, 5); } else { r.f++; r.c = 0; }
    r.u = acierto ? 1 : 0;
    r.t = Date.now();
    prog.p[id] = r;
    guardar();
  }
  function fallosPendientes() {
    return B.preguntas.filter(function (p) { var r = prog.p[p.id]; return r && r.u === 0; });
  }
  function resumen(lista) {
    var vistas = 0, aciertos = 0, intentos = 0;
    lista.forEach(function (p) {
      var r = prog.p[p.id];
      if (r) { vistas++; aciertos += r.a; intentos += r.v; }
    });
    return { total: lista.length, vistas: vistas, acierto: pct(aciertos, intentos) };
  }
  function delBloque(id) { return B.preguntas.filter(function (p) { return p.bloque_id === id; }); }

  /* ---------- tema claro / oscuro ---------- */
  function aplicarTema() {
    var t = null;
    try { t = localStorage.getItem("ldl:tema"); } catch (e) {}
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    else document.documentElement.removeAttribute("data-theme");
    return t || "auto";
  }
  function cambiarTema() {
    var orden = { auto: "light", light: "dark", dark: "auto" };
    var actual = aplicarTema();
    try { localStorage.setItem("ldl:tema", orden[actual]); } catch (e) {}
    aplicarTema();
    pintar();
  }

  /* ---------- sesiones ---------- */
  function empezar(tipo, preguntas, opciones) {
    opciones = opciones || {};
    if (!preguntas.length) return;
    pararReloj();
    sesion = {
      tipo: tipo, titulo: opciones.titulo || "Test", ids: preguntas.map(function (p) { return p.id; }),
      i: 0, resp: {}, corregida: {}, inicio: Date.now(), limite: opciones.minutos ? opciones.minutos * 60 : 0, fin: null,
      origen: vista === "test" || vista === "resultado" ? (sesion && sesion.origen) || "inicio" : vista
    };
    vista = "test";
    if (sesion.limite) reloj = setInterval(tic, 1000);
    pintar();
    window.scrollTo(0, 0);
  }
  function tic() {
    if (!sesion || sesion.fin) return pararReloj();
    var el = document.getElementById("ldl-crono");
    var resta = sesion.limite - Math.floor((Date.now() - sesion.inicio) / 1000);
    if (resta <= 0) { terminar(); return; }
    if (el) el.textContent = mmss(resta);
  }
  function pararReloj() { if (reloj) { clearInterval(reloj); reloj = null; } }
  function mmss(s) { var m = Math.floor(s / 60), r = s % 60; return m + ":" + (r < 10 ? "0" : "") + r; }

  function responder(letra) {
    var id = sesion.ids[sesion.i];
    if (sesion.tipo === "simulacro") {
      sesion.resp[id] = sesion.resp[id] === letra ? undefined : letra;
      pintar();
      return;
    }
    if (sesion.corregida[id]) return;
    sesion.resp[id] = letra;
    sesion.corregida[id] = true;
    registrar(id, letra === POR_ID[id].correcta);
    pintar();
  }
  function siguiente() {
    if (sesion.i < sesion.ids.length - 1) { sesion.i++; pintar(); window.scrollTo(0, 0); }
    else terminar();
  }
  function anterior() { if (sesion.i > 0) { sesion.i--; pintar(); } }
  function terminar() {
    pararReloj();
    if (sesion.tipo === "simulacro") {
      sesion.ids.forEach(function (id) {
        if (sesion.resp[id]) registrar(id, sesion.resp[id] === POR_ID[id].correcta);
      });
    }
    sesion.fin = Date.now();
    var r = calcular(sesion);
    prog.h.unshift({ t: sesion.fin, tipo: sesion.tipo, n: r.total, a: r.aciertos, e: r.errores, nota: r.nota });
    prog.h = prog.h.slice(0, 50);
    guardar();
    vista = "resultado";
    pintar();
    window.scrollTo(0, 0);
  }
  function calcular(s) {
    var a = 0, e = 0, nr = 0;
    s.ids.forEach(function (id) {
      var r = s.resp[id];
      if (!r) nr++; else if (r === POR_ID[id].correcta) a++; else e++;
    });
    var pen = (CFG.simulacro && CFG.simulacro.penalizacion) || 1 / 3;
    var neta = s.tipo === "simulacro" ? a - e * pen : a;
    var nota = Math.max(0, (neta / s.ids.length) * 10);
    return { total: s.ids.length, aciertos: a, errores: e, blancos: nr, neta: neta, nota: Math.round(nota * 100) / 100 };
  }

  /* ---------- vistas ---------- */
  function cabecera() {
    var tema = aplicarTema();
    var etiquetas = { auto: "Tema: auto", light: "Tema: claro", dark: "Tema: oscuro" };
    return '<header class="ldl-top"><a class="ldl-brand" href="' + esc(CFG.web || "#") + '">' +
      '<span class="ldl-logo" aria-hidden="true">§</span><span><b>Letra de Ley</b><small>' +
      esc(CFG.pack.nombre) + "</small></span></a>" +
      '<button class="ldl-tema" data-acc="tema" type="button">' + etiquetas[tema] + "</button></header>";
  }
  function navegacion() {
    if (CFG.modo === "web") return "";
    var items = [["inicio", "Inicio"], ["temas", "Por temas"], ["simulacro", "Simulacro"], ["fallos", "Fallos"], ["stats", "Estadísticas"]];
    return '<nav class="ldl-nav" aria-label="Secciones">' + items.map(function (it) {
      var actual = vista === it[0] || (vista === "test" && sesion && sesion.origen === it[0]);
      return '<button type="button" data-acc="ir" data-v="' + it[0] + '"' + (actual ? ' aria-current="page"' : "") + ">" + it[1] + "</button>";
    }).join("") + "</nav>";
  }
  function pie() {
    return '<p class="ldl-pie">Letra de Ley · ' + esc(CFG.pack.edicion) + " · Texto legal actualizado a " +
      esc(CFG.pack.actualizado) + "<br>Uso personal. Prohibida su redistribución.</p>";
  }

  function vInicio() {
    var r = resumen(B.preguntas), f = fallosPendientes().length;
    return '<section class="ldl-card"><h2>' + esc(CFG.pack.nombre) + "</h2>" +
      '<p class="ldl-muted">' + B.preguntas.length + " preguntas comentadas, con el artículo exacto de cada respuesta.</p>" +
      '<div class="ldl-kpis"><div class="ldl-kpi"><b>' + r.vistas + "/" + r.total + "</b><span>respondidas</span></div>" +
      '<div class="ldl-kpi"><b>' + r.acierto + ' %</b><span>de acierto</span></div>' +
      '<div class="ldl-kpi"><b>' + f + "</b><span>fallos por repasar</span></div></div>" +
      '<div class="ldl-acciones"><button class="ldl-btn" data-acc="rapido" type="button">Test rápido de 20</button>' +
      '<button class="ldl-btn sec" data-acc="ir" data-v="simulacro" type="button">Simulacro de examen</button>' +
      (f ? '<button class="ldl-btn sec" data-acc="repasar" type="button">Repasar ' + f + " fallos</button>" : "") +
      "</div></section>" +
      '<section class="ldl-card"><h3>Cómo sacarle partido</h3><ol class="ldl-muted">' +
      "<li>Practica <b>por temas</b>: cada respuesta te enseña el artículo y por qué fallan las demás opciones.</li>" +
      "<li>Cada pocos días, <b>repasa tus fallos</b>: es donde más se aprende.</li>" +
      "<li>Antes del examen, haz <b>simulacros</b> con tiempo y con la penalización real (cada error resta 1/3).</li></ol>" +
      '<p class="ldl-small ldl-muted">Tu progreso se guarda en este dispositivo y en este navegador.</p></section>' + historial();
  }
  function historial() {
    if (!prog.h.length) return "";
    return '<section class="ldl-card"><h3>Últimos tests</h3><ul class="ldl-revision">' + prog.h.slice(0, 5).map(function (h) {
      var d = new Date(h.t);
      return "<li><b>" + (h.tipo === "simulacro" ? "Simulacro" : "Práctica") + "</b> · " + d.toLocaleDateString("es-ES") +
        " · " + h.a + "/" + h.n + " aciertos" + (h.tipo === "simulacro" ? " · nota " + num(h.nota) : "") + "</li>";
    }).join("") + "</ul></section>";
  }
  function vTemas() {
    var html = '<section class="ldl-card"><h2>Practicar por temas</h2><p class="ldl-muted">Elige un bloque. Las preguntas salen en orden aleatorio y se corrigen al momento.</p><ul class="ldl-bloques">';
    B.bloques.forEach(function (b) {
      var lista = delBloque(b.id), r = resumen(lista);
      html += '<li><button type="button" data-acc="bloque" data-id="' + esc(b.id) + '"><span class="t">' + esc(b.nombre) +
        '</span><span class="n">' + r.vistas + "/" + r.total + (r.vistas ? " · " + r.acierto + " %" : "") + "</span>" +
        '<span class="ldl-barra"><i style="width:' + pct(r.vistas, r.total) + '%"></i></span></button></li>';
    });
    return html + "</ul></section>";
  }
  function vSimulacro() {
    var total = B.preguntas.length;
    var opcionesN = [10, 20, 30, 50, 100].filter(function (n) { return n < total; });
    opcionesN.push(total);
    var porDefecto = Math.min((CFG.simulacro && CFG.simulacro.preguntas) || 30, total);
    return '<section class="ldl-card"><h2>Simulacro de examen</h2>' +
      '<p class="ldl-muted">Como el día del examen: no ves las soluciones hasta el final y cada error resta un tercio de acierto.</p>' +
      '<div class="ldl-campo"><label for="ldl-n">Número de preguntas</label><select id="ldl-n">' +
      opcionesN.map(function (n) { return "<option" + (n === porDefecto ? " selected" : "") + ">" + n + "</option>"; }).join("") +
      '</select></div><div class="ldl-campo"><label for="ldl-t">Tiempo</label><select id="ldl-t">' +
      '<option value="1">1 minuto por pregunta</option><option value="0">Sin límite de tiempo</option></select></div>' +
      '<div class="ldl-campo"><label for="ldl-b">Temas</label><select id="ldl-b"><option value="">Todos</option>' +
      B.bloques.map(function (b) { return '<option value="' + esc(b.id) + '">' + esc(b.nombre) + "</option>"; }).join("") +
      '</select></div><div class="ldl-acciones"><button class="ldl-btn" data-acc="simular" type="button">Empezar simulacro</button></div></section>';
  }
  function vFallos() {
    var f = fallosPendientes();
    if (!f.length) {
      return '<section class="ldl-card"><h2>Repaso de fallos</h2><p class="ldl-muted">No tienes fallos pendientes. Cuando falles una pregunta aparecerá aquí hasta que la aciertes.</p></section>';
    }
    return '<section class="ldl-card"><h2>Repaso de fallos</h2><p class="ldl-muted">Tienes <b>' + f.length +
      "</b> preguntas falladas. Salen de aquí en cuanto las aciertas.</p>" +
      '<div class="ldl-acciones"><button class="ldl-btn" data-acc="repasar" type="button">Repasar ahora</button></div></section>';
  }
  function vStats() {
    var html = '<section class="ldl-card"><h2>Estadísticas</h2><ul class="ldl-bloques">';
    B.bloques.forEach(function (b) {
      var r = resumen(delBloque(b.id));
      html += '<li><button type="button" data-acc="bloque" data-id="' + esc(b.id) + '"><span class="t">' + esc(b.nombre) +
        '</span><span class="n">' + (r.vistas ? r.acierto + " % de acierto" : "sin empezar") + '</span><span class="ldl-barra"><i style="width:' +
        r.acierto + '%"></i></span></button></li>';
    });
    html += '</ul></section><section class="ldl-card"><h3>Empezar de cero</h3><p class="ldl-muted ldl-small">Borra tu progreso guardado en este dispositivo.</p>' +
      '<div class="ldl-acciones"><button class="ldl-btn sec" data-acc="borrar" type="button">Borrar mi progreso</button></div></section>';
    return html;
  }
  function vPortada() {
    var n = B.preguntas.length;
    return '<section class="ldl-card"><h2>' + esc(CFG.pack.nombre) + "</h2>" +
      '<p class="ldl-muted">' + n + " preguntas tipo examen, corregidas al momento, con el artículo exacto y la explicación de cada opción. Gratis y sin registrarte.</p>" +
      '<div class="ldl-acciones"><button class="ldl-btn" data-acc="empezarweb" type="button">Empezar el test</button></div></section>';
  }

  function vTest() {
    var id = sesion.ids[sesion.i], p = POR_ID[id], sim = sesion.tipo === "simulacro";
    var elegida = sesion.resp[id], corregida = !sim && sesion.corregida[id];
    var html = '<section class="ldl-card"><div class="ldl-meta"><span>' + esc(sesion.titulo) + " · " + (sesion.i + 1) + " de " + sesion.ids.length +
      "</span><span>" + (sesion.limite ? '⏱ <span id="ldl-crono" class="ldl-crono">' +
        mmss(Math.max(0, sesion.limite - Math.floor((Date.now() - sesion.inicio) / 1000))) + "</span>" : esc(p.articulo_txt)) +
      '</span></div><div class="ldl-progreso"><i style="width:' + pct(sesion.i + (corregida ? 1 : 0), sesion.ids.length) + '%"></i></div>' +
      '<p class="ldl-enunciado">' + esc(p.enunciado) + '</p><div class="ldl-opciones" role="group" aria-label="Opciones">';
    LETRAS.forEach(function (l) {
      var cls = "ldl-op";
      if (corregida) { if (l === p.correcta) cls += " ok"; else if (l === elegida) cls += " ko"; }
      else if (sim && elegida === l) cls += " marcada";
      html += '<button type="button" class="' + cls + '" data-acc="resp" data-l="' + l + '"' + (corregida ? " disabled" : "") +
        (sim ? ' aria-pressed="' + (elegida === l) + '"' : "") + '><span class="l">' + l + ")</span><span>" + esc(p.opciones[l]) + "</span></button>";
    });
    html += "</div>";
    if (corregida) html += feedback(p, elegida);
    html += '<div class="ldl-acciones">';
    if (sim) {
      html += (sesion.i > 0 ? '<button class="ldl-btn sec" data-acc="ant" type="button">Anterior</button>' : "") +
        '<button class="ldl-btn" data-acc="sig" type="button">' + (sesion.i < sesion.ids.length - 1 ? "Siguiente" : "Entregar") + "</button>" +
        (sesion.i < sesion.ids.length - 1 ? '<button class="ldl-btn sec" data-acc="entregar" type="button">Entregar ya</button>' : "");
    } else if (corregida) {
      html += '<button class="ldl-btn" data-acc="sig" type="button">' + (sesion.i < sesion.ids.length - 1 ? "Siguiente" : "Ver resultado") + "</button>";
    }
    html += '<button class="ldl-btn sec" data-acc="salir" type="button">Salir</button></div></section>';
    return html;
  }
  function feedback(p, elegida) {
    var bien = elegida === p.correcta;
    return '<div class="ldl-feedback" aria-live="polite"><div class="v ' + (bien ? "ok" : "ko") + '">' +
      (bien ? "¡Correcta!" : "Incorrecta. La respuesta correcta es la " + p.correcta + ")") + "</div><div>" + esc(p.explicacion) + "</div>" +
      (p.cita ? '<blockquote class="ldl-cita">' + esc(p.cita) + "<small>" + esc(p.articulo_txt) + "</small></blockquote>" : "") + "</div>";
  }
  function vResultado() {
    var r = calcular(sesion), sim = sesion.tipo === "simulacro";
    var html = '<section class="ldl-card"><h2>' + (sim ? "Resultado del simulacro" : "Resultado") + "</h2>" +
      '<div class="ldl-nota">' + (sim ? num(r.nota.toFixed(2)) : r.aciertos + "/" + r.total) + "</div>" +
      '<p class="ldl-muted">' + plural(r.aciertos, "acierto", "aciertos") + " · " + plural(r.errores, "error", "errores") +
      (r.blancos ? " · " + r.blancos + " en blanco" : "") +
      (sim ? " · nota sobre 10 con penalización" : "") + "</p>";
    if (CFG.modo === "web") html += ctaWeb(r);
    html += '<div class="ldl-acciones">' + (CFG.modo === "web" ? '<button class="ldl-btn sec" data-acc="empezarweb" type="button">Repetir con otro orden</button>' :
      '<button class="ldl-btn" data-acc="ir" data-v="inicio" type="button">Volver al inicio</button>') + "</div></section>";
    html += '<section class="ldl-card"><h3>Revisión</h3><ul class="ldl-revision">';
    sesion.ids.forEach(function (id, n) {
      var p = POR_ID[id], e = sesion.resp[id], chip = !e ? '<span class="ldl-chip nr">En blanco</span>' :
        e === p.correcta ? '<span class="ldl-chip ok">Bien</span>' : '<span class="ldl-chip ko">Mal</span>';
      html += "<li>" + chip + '<span class="e">' + (n + 1) + ". " + esc(p.enunciado) + "</span><br>" +
        '<span class="ldl-small">Correcta: <b>' + p.correcta + ") " + esc(p.opciones[p.correcta]) + "</b>" +
        (e && e !== p.correcta ? " · Marcaste " + e + ")" : "") + '</span><br><span class="ldl-small ldl-muted">' + esc(p.explicacion) + "</span></li>";
    });
    return html + "</ul></section>";
  }
  function ctaWeb() {
    var c = CFG.compra || {}, html = "";
    if (c.url) {
      html += '<div class="ldl-card ldl-cta"><h3>' + esc(c.titulo) + '</h3><p class="ldl-muted">' + esc(c.texto) + "</p>" +
        '<div class="ldl-acciones"><a class="ldl-btn acc" href="' + esc(c.url) + '">' + esc(c.boton) + "</a></div></div>";
    }
    if (CFG.telegram) {
      html += '<p class="ldl-small">¿Quieres un test cada día? <a href="' + esc(CFG.telegram) + '">Únete gratis al canal de Telegram</a>.</p>';
    }
    return html;
  }

  function pintar() {
    var cuerpo;
    if (vista === "test") cuerpo = vTest();
    else if (vista === "resultado") cuerpo = vResultado();
    else if (vista === "portada") cuerpo = vPortada();
    else if (vista === "temas") cuerpo = vTemas();
    else if (vista === "simulacro") cuerpo = vSimulacro();
    else if (vista === "fallos") cuerpo = vFallos();
    else if (vista === "stats") cuerpo = vStats();
    else cuerpo = vInicio();
    raiz.innerHTML = '<div class="ldl">' + cabecera() + navegacion() + "<main>" + cuerpo + "</main>" + pie() + "</div>";
  }

  /* ---------- eventos ---------- */
  raiz.addEventListener("click", function (ev) {
    var el = ev.target.closest("[data-acc]");
    if (!el) return;
    var acc = el.getAttribute("data-acc");
    if (acc === "tema") return cambiarTema();
    if (acc === "ir") { pararReloj(); vista = el.getAttribute("data-v"); sesion = null; pintar(); return; }
    if (acc === "rapido") return empezar("practica", barajar(B.preguntas).slice(0, 20), { titulo: "Test rápido" });
    if (acc === "repasar") return empezar("practica", barajar(fallosPendientes()).slice(0, 30), { titulo: "Repaso de fallos" });
    if (acc === "bloque") {
      var b = B.bloques.filter(function (x) { return x.id === el.getAttribute("data-id"); })[0];
      return empezar("practica", barajar(delBloque(b.id)), { titulo: b.nombre });
    }
    if (acc === "simular") {
      var n = parseInt(document.getElementById("ldl-n").value, 10);
      var conTiempo = document.getElementById("ldl-t").value === "1";
      var bloque = document.getElementById("ldl-b").value;
      var fuente = bloque ? delBloque(bloque) : B.preguntas;
      var elegidas = barajar(fuente).slice(0, n);
      return empezar("simulacro", elegidas, { titulo: "Simulacro", minutos: conTiempo ? elegidas.length : 0 });
    }
    if (acc === "empezarweb") return empezar("practica", barajar(B.preguntas), { titulo: "Test gratuito" });
    if (acc === "resp") return responder(el.getAttribute("data-l"));
    if (acc === "sig") return siguiente();
    if (acc === "ant") return anterior();
    if (acc === "entregar") return terminar();
    if (acc === "salir") { pararReloj(); sesion = null; vista = CFG.modo === "web" ? "portada" : "inicio"; pintar(); return; }
    if (acc === "borrar") {
      if (el.getAttribute("data-confirmar") === "1") { prog = { p: {}, h: [] }; guardar(); pintar(); }
      else { el.setAttribute("data-confirmar", "1"); el.textContent = "Pulsa otra vez para confirmar"; }
    }
  });
  document.addEventListener("keydown", function (ev) {
    if (vista !== "test" || !sesion || ev.altKey || ev.ctrlKey || ev.metaKey) return;
    var k = ev.key.toLowerCase(), mapa = { "1": "a", "2": "b", "3": "c", "4": "d", a: "a", b: "b", c: "c", d: "d" };
    if (mapa[k]) { ev.preventDefault(); responder(mapa[k]); }
    else if (k === "enter" || k === "arrowright") {
      var id = sesion.ids[sesion.i];
      if (sesion.tipo === "simulacro" || sesion.corregida[id]) { ev.preventDefault(); siguiente(); }
    } else if (k === "arrowleft" && sesion.tipo === "simulacro") { ev.preventDefault(); anterior(); }
  });

  pintar();
})();
</script>
</body>
</html>
