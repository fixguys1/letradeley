/* Letra de Ley — motor de test (app de pago y test gratuito de la web) */
:root {

}

    --ok: #4ade80; --ok-bg: #12301f; --ko: #f87171; --ko-bg: #3a1717; --focus: #8fb0ff;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);

  }
}

  --bg: #0e1320; --surface: #161d2e; --surface-2: #1d2639; --ink: #e8ecf6; --text: #e6e7ea;
  --muted: #a3a9b8; --line: #2b3550; --primary: #8fb0ff; --primary-ink: #0e1320; --accent: #f0a04b;
  --ok: #4ade80; --ok-bg: #12301f; --ko: #f87171; --ko-bg: #3a1717; --focus: #8fb0ff;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);

}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text); font: 16px/1.55 var(--sans);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
.ldl { max-width: 760px; margin: 0 auto; padding: 16px 16px 48px; }

.ldl :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 8px; }

/* Cabecera */
.ldl-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.ldl-brand { display: flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; }
.ldl-logo {
  /* Logotipo: § en papel sobre tinta, igual en claro y en oscuro (DESIGN.md → Logotipo) */

  display: grid; place-items: center; font: 700 22px/1 var(--serif);
}

.ldl-tema {
  border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 999px;
  padding: 6px 12px; font: 13px var(--sans); cursor: pointer;
}

  border-radius: 999px; padding: 8px 14px; font: 600 14px var(--sans); cursor: pointer;
}
.ldl-nav button[aria-current="page"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* Tarjetas */
.ldl-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; margin-bottom: 14px; }

  background: none; border: 0; color: var(--text); padding: 14px 4px; cursor: pointer; font: inherit;
}
.ldl-bloques .t { font-weight: 600; color: var(--ink); }
.ldl-bloques .n { color: var(--muted); font-size: 13px; }
.ldl-barra { grid-column: 1 / -1; height: 6px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
.ldl-barra i { display: block; height: 100%; background: var(--ok); }

/* Pregunta */
.ldl-meta { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 13px; margin-bottom: 10px; }
.ldl-progreso { height: 6px; border-radius: 6px; background: var(--surface-2); overflow: hidden; margin-bottom: 16px; }
.ldl-progreso i { display: block; height: 100%; background: var(--primary); transition: width .2s; }
.ldl-enunciado { font: 600 18px/1.45 var(--sans); color: var(--ink); margin: 0 0 16px; }
.ldl-opciones { display: grid; gap: 10px; }
.ldl-op {
  display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start; text-align: left; width: 100%;
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px; cursor: pointer;
  color: var(--text); font: 16px/1.45 var(--sans);
}
.ldl-op:hover:not([disabled]) { border-color: var(--primary); }
.ldl-op .l {
  width: 30px; height: 30px; border-radius: 8px; background: var(--surface-2); display: grid; place-items: center;
  font-weight: 700; color: var(--ink); text-transform: lowercase;
}
.ldl-op[disabled] { cursor: default; }
.ldl-op.ok { border-color: var(--ok); background: var(--ok-bg); }
.ldl-op.ok .l { background: var(--ok); color: #fff; }
.ldl-op.ko { border-color: var(--ko); background: var(--ko-bg); }
.ldl-op.ko .l { background: var(--ko); color: #fff; }
.ldl-op.marcada { border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); }
.ldl-feedback { margin-top: 16px; border-radius: 12px; padding: 14px 16px; background: var(--surface-2); }
.ldl-feedback .v { font-weight: 700; margin-bottom: 6px; }
.ldl-feedback .v.ok { color: var(--ok); }
.ldl-feedback .v.ko { color: var(--ko); }
.ldl-cita { margin: 10px 0 0; padding: 10px 12px; border-left: 3px solid var(--accent); background: var(--surface); border-radius: 0 8px 8px 0; font: italic 15px/1.5 var(--serif); }
.ldl-cita small { display: block; font: 600 12px var(--sans); font-style: normal; color: var(--muted); margin-top: 6px; }

/* Resultados */
.ldl-nota { font: 800 54px/1 var(--sans); color: var(--ink); font-variant-numeric: tabular-nums; }
.ldl-revision { list-style: none; padding: 0; margin: 12px 0 0; }
.ldl-revision li { border-top: 1px solid var(--line); padding: 12px 0; }
.ldl-revision .e { font-weight: 600; color: var(--ink); }
.ldl-chip { display: inline-block; font: 700 12px var(--sans); border-radius: 999px; padding: 2px 8px; margin-right: 6px; }
.ldl-chip.ok { background: var(--ok-bg); color: var(--ok); }
.ldl-chip.ko { background: var(--ko-bg); color: var(--ko); }
.ldl-chip.nr { background: var(--surface-2); color: var(--muted); }

/* Formularios */
.ldl-campo { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; margin: 10px 0; }
.ldl-campo label { font-weight: 600; font-size: 14px; }
.ldl-campo select, .ldl-campo input {
  font: 16px var(--sans); padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface); color: var(--text); width: 100%; max-width: 100%; min-width: 0; text-overflow: ellipsis;
}
.ldl-cta { border: 2px solid var(--accent); }
.ldl-pie { text-align: center; color: var(--muted); font-size: 12px; margin-top: 24px; }
.ldl-crono { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--ink); }

@media (max-width: 480px) {
  .ldl-enunciado { font-size: 17px; }
  .ldl-kpi b { font-size: 20px; }
  .ldl-nota { font-size: 44px; }
}
@media print { .ldl-nav, .ldl-tema, .ldl-acciones { display: none; } }
</style>

<script>window.LDL_CONFIG={"modo":"web","web":"../","telegram":"https://t.me/letradeley","pack":{"id":"muestra-loi","nombre":"Test de la Ley Orgánica 3/2007 de Igualdad","edicion":"Muestra gratuita","actualizado":"15/11/2026"},"compra":{"url":"","titulo":"¿Te ha servido? Hay 46 preguntas como estas en el pack","texto":"Pack Bloque Legal AGE 2027: app sin conexión con simulacros y repaso de fallos, PDF imprimible y Anki.","boton":"Consíguelo por 14,90 €"}};window.LDL_BANCO={"bloques":[{"id":"LOI|Título preliminar. Objeto y ámbito de la Ley","ley":"LOI","nombre":"Título preliminar. Objeto y ámbito de la Ley"},{"id":"LOI|Título I. El principio de igualdad y la tutela contra la discriminación","ley":"LOI","nombre":"Título I. El principio de igualdad y la tutela contra la discriminación"},{"id":"LOI|Título II. Políticas públicas para la igualdad · Capítulo I. Principios generales","ley":"LOI","nombre":"Título II. Políticas públicas para la igualdad · Capítulo I. Principios generales"}],"preguntas":[{"id":"LOI-L1-002","ley":"LOI","articulo":"1.1","articulo_txt":"Art. 1.1 LO 3/2007","bloque_id":"LOI|Título preliminar. Objeto y ámbito de la Ley","enunciado":"Según el artículo 1.1 de la Ley Orgánica 3/2007, la eliminación de la discriminación de la mujer se persigue en cualesquiera de los ámbitos de la vida y, singularmente, en las esferas:","opciones":{"a":"Política, laboral, económica, educativa, sanitaria y cultural.","b":"Civil, laboral, familiar, económica, social y deportiva.","c":"Política, judicial, laboral, económica, social y artística.","d":"Política, civil, laboral, económica, social y cultural."},"correcta":"d","explicacion":"El art. 1.1 enumera «las esferas política, civil, laboral, económica, social y cultural»; es la opción d). Las opciones a), b) y c) incluyen esferas que el art. 1.1 no menciona (educativa, sanitaria, familiar, deportiva, judicial o artística) en lugar de algunas de las que sí enumera.","cita":"«1. Las mujeres y los hombres son iguales en dignidad humana, e iguales en derechos y deberes. Esta Ley tiene por objeto hacer efectivo el derecho de igualdad de trato y de oportunidades entre mujeres y hombres, en particular mediante la eliminación de la discriminación de la mujer, sea cual fuere su circunstancia o condición, en cualesquiera de los ámbitos de la vida y, singularmente, en las esferas política, civil, laboral, económica, social y cultural para, en el desarrollo de los artículos 9.2 y 14 de la Constitución, alcanzar una sociedad más democrática, más justa y más solidaria.»","dificultad":2},{"id":"LOI-L1-003","ley":"LOI","articulo":"1.2","articulo_txt":"Art. 1.2 LO 3/2007","bloque_id":"LOI|Título preliminar. Objeto y ámbito de la Ley","enunciado":"Según el artículo 1.2 de la Ley Orgánica 3/2007, a los efectos de hacer efectivo el derecho de igualdad de trato y de oportunidades, la Ley regula derechos y deberes de:","opciones":{"a":"Las personas físicas y las personas jurídicas privadas, mientras que a las públicas solo les fija principios de actuación.","b":"Las personas físicas y jurídicas, tanto públicas como privadas.","c":"Los empleados públicos y las empresas que contraten con el sector público.","d":"Las Administraciones públicas y las organizaciones sindicales y empresariales."},"correcta":"b","explicacion":"El art. 1.2 dispone que la Ley «regula derechos y deberes de las personas físicas y jurídicas, tanto públicas como privadas»; es la opción b). La opción a) excluye a las personas jurídicas públicas, que el art. 1.2 sí incluye; los principios de actuación los establece la Ley para los Poderes Públicos. Las opciones c) y d) limitan los destinatarios a determinados sujetos, cuando el art. 1.2 se refiere a todas las personas físicas y jurídicas.","cita":"«2. A estos efectos, la Ley establece principios de actuación de los Poderes Públicos, regula derechos y deberes de las personas físicas y jurídicas, tanto públicas como privadas, y prevé medidas destinadas a eliminar y corregir en los sectores público y privado, toda forma de discriminación por razón de sexo.»","dificultad":2},{"id":"LOI-L1-004","ley":"LOI","articulo":"2.1","articulo_txt":"Art. 2.1 LO 3/2007","bloque_id":"LOI|Título preliminar. Objeto y ámbito de la Ley","enunciado":"Según el artículo 2.1 de la Ley Orgánica 3/2007, ¿quiénes gozarán de los derechos derivados del principio de igualdad de trato y de la prohibición de discriminación por razón de sexo?","opciones":{"a":"Las personas de nacionalidad española y los extranjeros que residan legalmente en España.","b":"Todas las personas.","c":"Las mujeres y, en los términos que establezca la ley, los hombres.","d":"Los ciudadanos de la Unión Europea que residan en España."},"correcta":"b","explicacion":"El art. 2.1 establece que «Todas las personas gozarán de los derechos derivados del principio de igualdad de trato y de la prohibición de discriminación por razón de sexo»; es la opción b). Las opciones a) y d) limitan la titularidad por nacionalidad o residencia, requisitos que el art. 2.1 no exige. La opción c) es falsa: el art. 2.1 no distingue entre mujeres y hombres en cuanto a la titularidad de estos derechos.","cita":"«1. Todas las personas gozarán de los derechos derivados del principio de igualdad de trato y de la prohibición de discriminación por razón de sexo.»","dificultad":1},{"id":"LOI-L1-005","ley":"LOI","articulo":"2.2","articulo_txt":"Art. 2.2 LO 3/2007","bloque_id":"LOI|Título preliminar. Objeto y ámbito de la Ley","enunciado":"Según el artículo 2.2 de la Ley Orgánica 3/2007, las obligaciones establecidas en la Ley serán de aplicación a toda persona, física o jurídica:","opciones":{"a":"Que se encuentre o actúe en territorio español, cualquiera que fuese su nacionalidad, domicilio o residencia.","b":"Que tenga su domicilio o su residencia habitual en territorio español, cualquiera que fuese su nacionalidad o el lugar donde actúe.","c":"De nacionalidad española o que resida legalmente en España, con independencia del lugar en que desarrolle su actividad.","d":"Que actúe en territorio español, siempre que tenga allí su domicilio social o su residencia legal durante más de seis meses."},"correcta":"a","explicacion":"El art. 2.2 aplica las obligaciones de la Ley a toda persona «que se encuentre o actúe en territorio español, cualquiera que fuese su nacionalidad, domicilio o residencia»; es la opción a). Las opciones b), c) y d) hacen depender la aplicación del domicilio, la residencia o la nacionalidad, circunstancias que el art. 2.2 declara irrelevantes.","cita":"«2. Las obligaciones establecidas en esta Ley serán de aplicación a toda persona, física o jurídica, que se encuentre o actúe en territorio español, cualquiera que fuese su nacionalidad, domicilio o residencia.»","dificultad":2},{"id":"LOI-L1-006","ley":"LOI","articulo":"3","articulo_txt":"Art. 3 LO 3/2007","bloque_id":"LOI|Título I. El principio de igualdad y la tutela contra la discriminación","enunciado":"Según el artículo 3 de la Ley Orgánica 3/2007, el principio de igualdad de trato entre mujeres y hombres supone la ausencia de toda discriminación, directa o indirecta, por razón de sexo, y, especialmente, de las derivadas de:","opciones":{"a":"El embarazo, la orientación sexual y la situación familiar.","b":"La maternidad, la edad y la situación laboral.","c":"La paternidad, la convivencia en pareja y el estado civil.","d":"La maternidad, la asunción de obligaciones familiares y el estado civil."},"correcta":"d","explicacion":"El art. 3 menciona especialmente las discriminaciones derivadas de «la maternidad, la asunción de obligaciones familiares y el estado civil»; es la opción d). Las opciones a), b) y c) sustituyen alguna de esas tres circunstancias por otras que el art. 3 no menciona.","cita":"«El principio de igualdad de trato entre mujeres y hombres supone la ausencia de toda discriminación, directa o indirecta, por razón de sexo, y, especialmente, las derivadas de la maternidad, la asunción de obligaciones familiares y el estado civil.»","dificultad":2},{"id":"LOI-L1-009","ley":"LOI","articulo":"5","articulo_txt":"Art. 5 LO 3/2007","bloque_id":"LOI|Título I. El principio de igualdad y la tutela contra la discriminación","enunciado":"Según el artículo 5 de la Ley Orgánica 3/2007, el principio de igualdad de trato y de oportunidades se garantizará también en la afiliación y participación en:","opciones":{"a":"Los partidos políticos y las organizaciones sindicales, con exclusión de las organizaciones empresariales.","b":"Las asociaciones de mujeres y las organizaciones no gubernamentales de cooperación para el desarrollo.","c":"Las fundaciones y las asociaciones declaradas de utilidad pública por la Administración competente.","d":"Las organizaciones sindicales y empresariales y las organizaciones cuyos miembros ejerzan una profesión concreta."},"correcta":"d","explicacion":"El art. 5 incluye la afiliación y participación «en las organizaciones sindicales y empresariales, o en cualquier organización cuyos miembros ejerzan una profesión concreta, incluidas las prestaciones concedidas por las mismas»; es la opción d). La opción a) excluye las organizaciones empresariales, que el art. 5 menciona expresamente. Las opciones b) y c) se refieren a entidades que el art. 5 no menciona en este punto.","cita":"«El principio de igualdad de trato y de oportunidades entre mujeres y hombres, aplicable en el ámbito del empleo privado y en el del empleo público, se garantizará, en los términos previstos en la normativa aplicable, en el acceso al empleo, incluso al trabajo por cuenta propia, en la formación profesional, en la promoción profesional, en las condiciones de trabajo, incluidas las retributivas y las de despido, y en la afiliación y participación en las organizaciones sindicales y empresariales, o en cualquier organización cuyos miembros ejerzan una profesión concreta, incluidas las prestaciones concedidas por las mismas.»","dificultad":2},{"id":"LOI-L1-013","ley":"LOI","articulo":"6.2","articulo_txt":"Art. 6.2 LO 3/2007","bloque_id":"LOI|Título I. El principio de igualdad y la tutela contra la discriminación","enunciado":"Según el artículo 6.2 de la Ley Orgánica 3/2007, no hay discriminación indirecta cuando la disposición, criterio o práctica de que se trate pueda justificarse objetivamente en atención a una finalidad legítima y los medios para alcanzar dicha finalidad sean:","opciones":{"a":"Idóneos y suficientes.","b":"Proporcionados y temporales.","c":"Necesarios y adecuados.","d":"Eficaces y transparentes."},"correcta":"c","explicacion":"El art. 6.2 exceptúa los supuestos en que la disposición, criterio o práctica puedan justificarse objetivamente en atención a una finalidad legítima y «que los medios para alcanzar dicha finalidad sean necesarios y adecuados»; es la opción c). Las opciones a), b) y d) emplean calificativos que el art. 6.2 no utiliza para los medios.","cita":"«2. Se considera discriminación indirecta por razón de sexo la situación en que una disposición, criterio o práctica aparentemente neutros pone a personas de un sexo en desventaja particular con respecto a personas del otro, salvo que dicha disposición, criterio o práctica puedan justificarse objetivamente en atención a una finalidad legítima y que los medios para alcanzar dicha finalidad sean necesarios y adecuados.»","dificultad":2},{"id":"LOI-L1-022","ley":"LOI","articulo":"10","articulo_txt":"Art. 10 LO 3/2007","bloque_id":"LOI|Título I. El principio de igualdad y la tutela contra la discriminación","enunciado":"Según el artículo 10 de la Ley Orgánica 3/2007, las reparaciones o indemnizaciones a través de las cuales las conductas discriminatorias dan lugar a responsabilidad han de ser:","opciones":{"a":"Suficientes, disuasorias y fijadas por vía reglamentaria.","b":"Íntegras, inmediatas y compatibles con las sanciones que procedan.","c":"Reales, efectivas y proporcionadas al perjuicio sufrido.","d":"Proporcionadas a la gravedad de la conducta y a la capacidad económica del infractor."},"correcta":"c","explicacion":"El art. 10 exige un sistema de reparaciones o indemnizaciones «que sean reales, efectivas y proporcionadas al perjuicio sufrido»; es la opción c). La opción a) es falsa: el art. 10 califica de «eficaz y disuasorio» el sistema de sanciones, no las reparaciones, y no remite a un reglamento. Las opciones b) y d) emplean calificativos o criterios de proporción que el art. 10 no recoge para las reparaciones.","cita":"«Los actos y las cláusulas de los negocios jurídicos que constituyan o causen discriminación por razón de sexo se considerarán nulos y sin efecto, y darán lugar a responsabilidad a través de un sistema de reparaciones o indemnizaciones que sean reales, efectivas y proporcionadas al perjuicio sufrido, así como, en su caso, a través de un sistema eficaz y disuasorio de sanciones que prevenga la realización de conductas discriminatorias.»","dificultad":2},{"id":"LOI-L1-032","ley":"LOI","articulo":"14","articulo_txt":"Art. 14 LO 3/2007","bloque_id":"LOI|Título II. Políticas públicas para la igualdad · Capítulo I. Principios generales","enunciado":"Según el artículo 14 de la Ley Orgánica 3/2007, ¿cuál de los siguientes NO figura entre los criterios generales de actuación de los Poderes Públicos a los fines de la Ley?","opciones":{"a":"El establecimiento de medidas que aseguren la conciliación del trabajo y de la vida personal y familiar de las mujeres y los hombres.","b":"La adopción de las medidas necesarias para la erradicación de la violencia de género y de la violencia familiar.","c":"La reserva de un porcentaje mínimo de plazas para mujeres en las ofertas de empleo público.","d":"La protección de la maternidad, con especial atención a la asunción por la sociedad de los efectos derivados del embarazo, parto y lactancia."},"correcta":"c","explicacion":"La reserva de plazas en las ofertas de empleo público no figura entre los criterios del art. 14; es la opción c). Las opciones a), b) y d) recogen, respectivamente, los criterios de los apartados 8, 5 y 7 del art. 14.","cita":"«Artículo 14. Criterios generales de actuación de los Poderes Públicos. […] 5. La adopción de las medidas necesarias para la erradicación de la violencia de género, la violencia familiar y todas las formas de acoso sexual y acoso por razón de sexo. […] 7. La protección de la maternidad, con especial atención a la asunción por la sociedad de los efectos derivados del embarazo, parto y lactancia. […] 8. El establecimiento de medidas que aseguren la conciliación del trabajo y de la vida personal y familiar de las mujeres y los hombres, así como el fomento de la corresponsabilidad en las labores domésticas y en la atención a la familia.»","dificultad":2},{"id":"LOI-L1-040","ley":"LOI","articulo":"18","articulo_txt":"Art. 18 LO 3/2007","bloque_id":"LOI|Título II. Políticas públicas para la igualdad · Capítulo I. Principios generales","enunciado":"Según el artículo 18 de la Ley Orgánica 3/2007, ¿a quién se dará cuenta del informe que elabore el Gobierno sobre el conjunto de sus actuaciones en relación con la efectividad del principio de igualdad entre mujeres y hombres?","opciones":{"a":"Al Consejo de Estado.","b":"Al Defensor del Pueblo.","c":"A las Cortes Generales.","d":"Al Consejo de Participación de la Mujer."},"correcta":"c","explicacion":"El art. 18 dispone que «De este informe se dará cuenta a las Cortes Generales»; es la opción c). Las opciones a), b) y d) mencionan órganos a los que el art. 18 no prevé dar cuenta de ese informe.","cita":"«En los términos que reglamentariamente se determinen, el Gobierno elaborará un informe periódico sobre el conjunto de sus actuaciones en relación con la efectividad del principio de igualdad entre mujeres y hombres. De este informe se dará cuenta a las Cortes Generales.»","dificultad":1},{"id":"LOI-L1-045","ley":"LOI","articulo":"21.2","articulo_txt":"Art. 21.2 LO 3/2007","bloque_id":"LOI|Título II. Políticas públicas para la igualdad · Capítulo I. Principios generales","enunciado":"Según el artículo 21.2 de la Ley Orgánica 3/2007, en relación con el derecho de igualdad, las Entidades Locales:","opciones":{"a":"Lo integrarán en el ejercicio de sus competencias y colaborarán, a tal efecto, con el resto de las Administraciones públicas.","b":"Podrán integrarlo en el ejercicio de sus competencias cuando así lo acuerde el Pleno de la corporación por mayoría absoluta.","c":"Lo integrarán en el ejercicio de sus competencias bajo la coordinación de la Comunidad Autónoma respectiva.","d":"Lo integrarán únicamente en el ejercicio de las competencias que les deleguen el Estado o la Comunidad Autónoma."},"correcta":"a","explicacion":"El art. 21.2 dispone que «Las Entidades Locales integrarán el derecho de igualdad en el ejercicio de sus competencias y colaborarán, a tal efecto, con el resto de las Administraciones públicas»; es la opción a). La opción b) convierte en facultativa una obligación y añade un acuerdo plenario que el art. 21.2 no exige. La opción c) añade una coordinación autonómica que el art. 21.2 no prevé, y la d) limita la integración a las competencias delegadas, cuando el art. 21.2 se refiere a sus competencias.","cita":"«2. Las Entidades Locales integrarán el derecho de igualdad en el ejercicio de sus competencias y colaborarán, a tal efecto, con el resto de las Administraciones públicas.»","dificultad":2}]};</script>
<script>
/* Letra de Ley — motor de test. Sin dependencias; funciona sin conexión.
   Necesita window.LDL_CONFIG y window.LDL_BANCO (los inyecta sistema/letradeley.py). */
(function () {
  "use strict";
  var CFG = window.LDL_CONFIG, B = window.LDL_BANCO;
  var raiz = document.getElementById("ldl");
  var LETRAS = ["a", "b", "c", "d"];
  var POR_ID = {};
  B.preguntas.forEach(function (p) { POR_ID[p.id] = p; });
  var CLAVE = "ldl1:" + CFG.pack.id;
  var prog = cargar();
  var sesion = null;
  var vista = CFG.modo === "web" ? "portada" : "inicio";
  var reloj = null;

  /* ---------- utilidades ---------- */
  function esc(t) {
    return String(t == null ? "" : t).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function barajar(lista) {
    var a = lista.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function pct(a, b) { return b ? Math.round((a / b) * 100) : 0; }
  function plural(n, uno, varios) { return n + " " + (n === 1 ? uno : varios); }
  function num(n) { return String(n).replace(".", ","); }
  function cargar() {
    try { var s = localStorage.getItem(CLAVE); if (s) { var d = JSON.parse(s); if (d && d.p) return d; } } catch (e) {}
    return { p: {}, h: [] };
  }
  function guardar() { try { localStorage.setItem(CLAVE, JSON.stringify(prog)); } catch (e) {} }
  function registrar(id, acierto) {
    var r = prog.p[id] || { v: 0, a: 0, f: 0, c: 0 };
    r.v++;
    if (acierto) { r.a++; r.c = Math.min((r.c || 0) + 1, 5); } else { r.f++; r.c = 0; }
    r.u = acierto ? 1 : 0;
    r.t = Date.now();
    prog.p[id] = r;
    guardar();
  }
  function fallosPendientes() {
    return B.preguntas.filter(function (p) { var r = prog.p[p.id]; return r && r.u === 0; });
  }
  function resumen(lista) {
    var vistas = 0, aciertos = 0, intentos = 0;
    lista.forEach(function (p) {
      var r = prog.p[p.id];
      if (r) { vistas++; aciertos += r.a; intentos += r.v; }
    });
    return { total: lista.length, vistas: vistas, acierto: pct(aciertos, intentos) };
  }
  function delBloque(id) { return B.preguntas.filter(function (p) { return p.bloque_id === id; }); }

  /* ---------- tema claro / oscuro ---------- */
  function aplicarTema() {
    var t = null;
    try { t = localStorage.getItem("ldl:tema"); } catch (e) {}
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    else document.documentElement.removeAttribute("data-theme");
    return t || "auto";
  }
  function cambiarTema() {
    var orden = { auto: "light", light: "dark", dark: "auto" };
    var actual = aplicarTema();
    try { localStorage.setItem("ldl:tema", orden[actual]); } catch (e) {}
    aplicarTema();
    pintar();
  }

  /* ---------- sesiones ---------- */
  function empezar(tipo, preguntas, opciones) {
    opciones = opciones || {};
    if (!preguntas.length) return;
    pararReloj();
    sesion = {
      tipo: tipo, titulo: opciones.titulo || "Test", ids: preguntas.map(function (p) { return p.id; }),
      i: 0, resp: {}, corregida: {}, inicio: Date.now(), limite: opciones.minutos ? opciones.minutos * 60 : 0, fin: null,
      origen: vista === "test" || vista === "resultado" ? (sesion && sesion.origen) || "inicio" : vista
    };
    vista = "test";
    if (sesion.limite) reloj = setInterval(tic, 1000);
    pintar();
    window.scrollTo(0, 0);
  }
  function tic() {
    if (!sesion || sesion.fin) return pararReloj();
    var el = document.getElementById("ldl-crono");
    var resta = sesion.limite - Math.floor((Date.now() - sesion.inicio) / 1000);
    if (resta <= 0) { terminar(); return; }
    if (el) el.textContent = mmss(resta);
  }
  function pararReloj() { if (reloj) { clearInterval(reloj); reloj = null; } }
  function mmss(s) { var m = Math.floor(s / 60), r = s % 60; return m + ":" + (r < 10 ? "0" : "") + r; }

  function responder(letra) {
    var id = sesion.ids[sesion.i];
    if (sesion.tipo === "simulacro") {
      sesion.resp[id] = sesion.resp[id] === letra ? undefined : letra;
      pintar();
      return;
    }
    if (sesion.corregida[id]) return;
    sesion.resp[id] = letra;
    sesion.corregida[id] = true;
    registrar(id, letra === POR_ID[id].correcta);
    pintar();
  }
  function siguiente() {
    if (sesion.i < sesion.ids.length - 1) { sesion.i++; pintar(); window.scrollTo(0, 0); }
    else terminar();
  }
  function anterior() { if (sesion.i > 0) { sesion.i--; pintar(); } }
  function terminar() {
    pararReloj();
    if (sesion.tipo === "simulacro") {
      sesion.ids.forEach(function (id) {
        if (sesion.resp[id]) registrar(id, sesion.resp[id] === POR_ID[id].correcta);
      });
    }
    sesion.fin = Date.now();
    var r = calcular(sesion);
    prog.h.unshift({ t: sesion.fin, tipo: sesion.tipo, n: r.total, a: r.aciertos, e: r.errores, nota: r.nota });
    prog.h = prog.h.slice(0, 50);
    guardar();
    vista = "resultado";
    pintar();
    window.scrollTo(0, 0);
  }
  function calcular(s) {
    var a = 0, e = 0, nr = 0;
    s.ids.forEach(function (id) {
      var r = s.resp[id];
      if (!r) nr++; else if (r === POR_ID[id].correcta) a++; else e++;
    });
    var pen = (CFG.simulacro && CFG.simulacro.penalizacion) || 1 / 3;
    var neta = s.tipo === "simulacro" ? a - e * pen : a;
    var nota = Math.max(0, (neta / s.ids.length) * 10);
    return { total: s.ids.length, aciertos: a, errores: e, blancos: nr, neta: neta, nota: Math.round(nota * 100) / 100 };
  }

  /* ---------- vistas ---------- */
  function cabecera() {
    var tema = aplicarTema();
    var etiquetas = { auto: "Tema: auto", light: "Tema: claro", dark: "Tema: oscuro" };
    return '<header class="ldl-top"><a class="ldl-brand" href="' + esc(CFG.web || "#") + '">' +
      '<span class="ldl-logo" aria-hidden="true">§</span><span><b>Letra de Ley</b><small>' +
      esc(CFG.pack.nombre) + "</small></span></a>" +
      '<button class="ldl-tema" data-acc="tema" type="button">' + etiquetas[tema] + "</button></header>";
  }
  function navegacion() {
    if (CFG.modo === "web") return "";
    var items = [["inicio", "Inicio"], ["temas", "Por temas"], ["simulacro", "Simulacro"], ["fallos", "Fallos"], ["stats", "Estadísticas"]];
    return '<nav class="ldl-nav" aria-label="Secciones">' + items.map(function (it) {
      var actual = vista === it[0] || (vista === "test" && sesion && sesion.origen === it[0]);
      return '<button type="button" data-acc="ir" data-v="' + it[0] + '"' + (actual ? ' aria-current="page"' : "") + ">" + it[1] + "</button>";
    }).join("") + "</nav>";
  }
  function pie() {
    return '<p class="ldl-pie">Letra de Ley · ' + esc(CFG.pack.edicion) + " · Texto legal actualizado a " +
      esc(CFG.pack.actualizado) + "<br>Uso personal. Prohibida su redistribución.</p>";
  }

  function vInicio() {
    var r = resumen(B.preguntas), f = fallosPendientes().length;
    return '<section class="ldl-card"><h2>' + esc(CFG.pack.nombre) + "</h2>" +
      '<p class="ldl-muted">' + B.preguntas.length + " preguntas comentadas, con el artículo exacto de cada respuesta.</p>" +
      '<div class="ldl-kpis"><div class="ldl-kpi"><b>' + r.vistas + "/" + r.total + "</b><span>respondidas</span></div>" +
      '<div class="ldl-kpi"><b>' + r.acierto + ' %</b><span>de acierto</span></div>' +
      '<div class="ldl-kpi"><b>' + f + "</b><span>fallos por repasar</span></div></div>" +
      '<div class="ldl-acciones"><button class="ldl-btn" data-acc="rapido" type="button">Test rápido de 20</button>' +
      '<button class="ldl-btn sec" data-acc="ir" data-v="simulacro" type="button">Simulacro de examen</button>' +
      (f ? '<button class="ldl-btn sec" data-acc="repasar" type="button">Repasar ' + f + " fallos</button>" : "") +
      "</div></section>" +
      '<section class="ldl-card"><h3>Cómo sacarle partido</h3><ol class="ldl-muted">' +
      "<li>Practica <b>por temas</b>: cada respuesta te enseña el artículo y por qué fallan las demás opciones.</li>" +
      "<li>Cada pocos días, <b>repasa tus fallos</b>: es donde más se aprende.</li>" +
      "<li>Antes del examen, haz <b>simulacros</b> con tiempo y con la penalización real (cada error resta 1/3).</li></ol>" +
      '<p class="ldl-small ldl-muted">Tu progreso se guarda en este dispositivo y en este navegador.</p></section>' + historial();
  }
  function historial() {
    if (!prog.h.length) return "";
    return '<section class="ldl-card"><h3>Últimos tests</h3><ul class="ldl-revision">' + prog.h.slice(0, 5).map(function (h) {
      var d = new Date(h.t);
      return "<li><b>" + (h.tipo === "simulacro" ? "Simulacro" : "Práctica") + "</b> · " + d.toLocaleDateString("es-ES") +
        " · " + h.a + "/" + h.n + " aciertos" + (h.tipo === "simulacro" ? " · nota " + num(h.nota) : "") + "</li>";
    }).join("") + "</ul></section>";
  }
  function vTemas() {
    var html = '<section class="ldl-card"><h2>Practicar por temas</h2><p class="ldl-muted">Elige un bloque. Las preguntas salen en orden aleatorio y se corrigen al momento.</p><ul class="ldl-bloques">';
    B.bloques.forEach(function (b) {
      var lista = delBloque(b.id), r = resumen(lista);
      html += '<li><button type="button" data-acc="bloque" data-id="' + esc(b.id) + '"><span class="t">' + esc(b.nombre) +
        '</span><span class="n">' + r.vistas + "/" + r.total + (r.vistas ? " · " + r.acierto + " %" : "") + "</span>" +
        '<span class="ldl-barra"><i style="width:' + pct(r.vistas, r.total) + '%"></i></span></button></li>';
    });
    return html + "</ul></section>";
  }
  function vSimulacro() {
    var total = B.preguntas.length;
    var opcionesN = [10, 20, 30, 50, 100].filter(function (n) { return n < total; });
    opcionesN.push(total);
    var porDefecto = Math.min((CFG.simulacro && CFG.simulacro.preguntas) || 30, total);
    return '<section class="ldl-card"><h2>Simulacro de examen</h2>' +
      '<p class="ldl-muted">Como el día del examen: no ves las soluciones hasta el final y cada error resta un tercio de acierto.</p>' +
      '<div class="ldl-campo"><label for="ldl-n">Número de preguntas</label><select id="ldl-n">' +
      opcionesN.map(function (n) { return "<option" + (n === porDefecto ? " selected" : "") + ">" + n + "</option>"; }).join("") +
      '</select></div><div class="ldl-campo"><label for="ldl-t">Tiempo</label><select id="ldl-t">' +
      '<option value="1">1 minuto por pregunta</option><option value="0">Sin límite de tiempo</option></select></div>' +
      '<div class="ldl-campo"><label for="ldl-b">Temas</label><select id="ldl-b"><option value="">Todos</option>' +
      B.bloques.map(function (b) { return '<option value="' + esc(b.id) + '">' + esc(b.nombre) + "</option>"; }).join("") +
      '</select></div><div class="ldl-acciones"><button class="ldl-btn" data-acc="simular" type="button">Empezar simulacro</button></div></section>';
  }
  function vFallos() {
    var f = fallosPendientes();
    if (!f.length) {
      return '<section class="ldl-card"><h2>Repaso de fallos</h2><p class="ldl-muted">No tienes fallos pendientes. Cuando falles una pregunta aparecerá aquí hasta que la aciertes.</p></section>';
    }
    return '<section class="ldl-card"><h2>Repaso de fallos</h2><p class="ldl-muted">Tienes <b>' + f.length +
      "</b> preguntas falladas. Salen de aquí en cuanto las aciertas.</p>" +
      '<div class="ldl-acciones"><button class="ldl-btn" data-acc="repasar" type="button">Repasar ahora</button></div></section>';
  }
  function vStats() {
    var html = '<section class="ldl-card"><h2>Estadísticas</h2><ul class="ldl-bloques">';
    B.bloques.forEach(function (b) {
      var r = resumen(delBloque(b.id));
      html += '<li><button type="button" data-acc="bloque" data-id="' + esc(b.id) + '"><span class="t">' + esc(b.nombre) +
        '</span><span class="n">' + (r.vistas ? r.acierto + " % de acierto" : "sin empezar") + '</span><span class="ldl-barra"><i style="width:' +
        r.acierto + '%"></i></span></button></li>';
    });
    html += '</ul></section><section class="ldl-card"><h3>Empezar de cero</h3><p class="ldl-muted ldl-small">Borra tu progreso guardado en este dispositivo.</p>' +
      '<div class="ldl-acciones"><button class="ldl-btn sec" data-acc="borrar" type="button">Borrar mi progreso</button></div></section>';
    return html;
  }
  function vPortada() {
    var n = B.preguntas.length;
    return '<section class="ldl-card"><h2>' + esc(CFG.pack.nombre) + "</h2>" +
      '<p class="ldl-muted">' + n + " preguntas tipo examen, corregidas al momento, con el artículo exacto y la explicación de cada opción. Gratis y sin registrarte.</p>" +
      '<div class="ldl-acciones"><button class="ldl-btn" data-acc="empezarweb" type="button">Empezar el test</button></div></section>';
  }

  function vTest() {
    var id = sesion.ids[sesion.i], p = POR_ID[id], sim = sesion.tipo === "simulacro";
    var elegida = sesion.resp[id], corregida = !sim && sesion.corregida[id];
    var html = '<section class="ldl-card"><div class="ldl-meta"><span>' + esc(sesion.titulo) + " · " + (sesion.i + 1) + " de " + sesion.ids.length +
      "</span><span>" + (sesion.limite ? '⏱ <span id="ldl-crono" class="ldl-crono">' +
        mmss(Math.max(0, sesion.limite - Math.floor((Date.now() - sesion.inicio) / 1000))) + "</span>" : esc(p.articulo_txt)) +
      '</span></div><div class="ldl-progreso"><i style="width:' + pct(sesion.i + (corregida ? 1 : 0), sesion.ids.length) + '%"></i></div>' +
      '<p class="ldl-enunciado">' + esc(p.enunciado) + '</p><div class="ldl-opciones" role="group" aria-label="Opciones">';
    LETRAS.forEach(function (l) {
      var cls = "ldl-op";
      if (corregida) { if (l === p.correcta) cls += " ok"; else if (l === elegida) cls += " ko"; }
      else if (sim && elegida === l) cls += " marcada";
      html += '<button type="button" class="' + cls + '" data-acc="resp" data-l="' + l + '"' + (corregida ? " disabled" : "") +
        (sim ? ' aria-pressed="' + (elegida === l) + '"' : "") + '><span class="l">' + l + ")</span><span>" + esc(p.opciones[l]) + "</span></button>";
    });
    html += "</div>";
    if (corregida) html += feedback(p, elegida);
    html += '<div class="ldl-acciones">';
    if (sim) {
      html += (sesion.i > 0 ? '<button class="ldl-btn sec" data-acc="ant" type="button">Anterior</button>' : "") +
        '<button class="ldl-btn" data-acc="sig" type="button">' + (sesion.i < sesion.ids.length - 1 ? "Siguiente" : "Entregar") + "</button>" +
        (sesion.i < sesion.ids.length - 1 ? '<button class="ldl-btn sec" data-acc="entregar" type="button">Entregar ya</button>' : "");
    } else if (corregida) {
      html += '<button class="ldl-btn" data-acc="sig" type="button">' + (sesion.i < sesion.ids.length - 1 ? "Siguiente" : "Ver resultado") + "</button>";
    }
    html += '<button class="ldl-btn sec" data-acc="salir" type="button">Salir</button></div></section>';
    return html;
  }
  function feedback(p, elegida) {
    var bien = elegida === p.correcta;
    return '<div class="ldl-feedback" aria-live="polite"><div class="v ' + (bien ? "ok" : "ko") + '">' +
      (bien ? "¡Correcta!" : "Incorrecta. La respuesta correcta es la " + p.correcta + ")") + "</div><div>" + esc(p.explicacion) + "</div>" +
      (p.cita ? '<blockquote class="ldl-cita">' + esc(p.cita) + "<small>" + esc(p.articulo_txt) + "</small></blockquote>" : "") + "</div>";
  }
  function vResultado() {
    var r = calcular(sesion), sim = sesion.tipo === "simulacro";
    var html = '<section class="ldl-card"><h2>' + (sim ? "Resultado del simulacro" : "Resultado") + "</h2>" +
      '<div class="ldl-nota">' + (sim ? num(r.nota.toFixed(2)) : r.aciertos + "/" + r.total) + "</div>" +
      '<p class="ldl-muted">' + plural(r.aciertos, "acierto", "aciertos") + " · " + plural(r.errores, "error", "errores") +
      (r.blancos ? " · " + r.blancos + " en blanco" : "") +
      (sim ? " · nota sobre 10 con penalización" : "") + "</p>";
    if (CFG.modo === "web") html += ctaWeb(r);
    html += '<div class="ldl-acciones">' + (CFG.modo === "web" ? '<button class="ldl-btn sec" data-acc="empezarweb" type="button">Repetir con otro orden</button>' :
      '<button class="ldl-btn" data-acc="ir" data-v="inicio" type="button">Volver al inicio</button>') + "</div></section>";
    html += '<section class="ldl-card"><h3>Revisión</h3><ul class="ldl-revision">';
    sesion.ids.forEach(function (id, n) {
      var p = POR_ID[id], e = sesion.resp[id], chip = !e ? '<span class="ldl-chip nr">En blanco</span>' :
        e === p.correcta ? '<span class="ldl-chip ok">Bien</span>' : '<span class="ldl-chip ko">Mal</span>';
      html += "<li>" + chip + '<span class="e">' + (n + 1) + ". " + esc(p.enunciado) + "</span><br>" +
        '<span class="ldl-small">Correcta: <b>' + p.correcta + ") " + esc(p.opciones[p.correcta]) + "</b>" +
        (e && e !== p.correcta ? " · Marcaste " + e + ")" : "") + '</span><br><span class="ldl-small ldl-muted">' + esc(p.explicacion) + "</span></li>";
    });
    return html + "</ul></section>";
  }
  function ctaWeb() {
    var c = CFG.compra || {}, html = "";
    if (c.url) {
      html += '<div class="ldl-card ldl-cta"><h3>' + esc(c.titulo) + '</h3><p class="ldl-muted">' + esc(c.texto) + "</p>" +
        '<div class="ldl-acciones"><a class="ldl-btn acc" href="' + esc(c.url) + '">' + esc(c.boton) + "</a></div></div>";
    }
    if (CFG.telegram) {
      html += '<p class="ldl-small">¿Quieres un test cada día? <a href="' + esc(CFG.telegram) + '">Únete gratis al canal de Telegram</a>.</p>';
    }
    return html;
  }

  function pintar() {
    var cuerpo;
    if (vista === "test") cuerpo = vTest();
    else if (vista === "resultado") cuerpo = vResultado();
    else if (vista === "portada") cuerpo = vPortada();
    else if (vista === "temas") cuerpo = vTemas();
    else if (vista === "simulacro") cuerpo = vSimulacro();
    else if (vista === "fallos") cuerpo = vFallos();
    else if (vista === "stats") cuerpo = vStats();
    else cuerpo = vInicio();
    raiz.innerHTML = '<div class="ldl">' + cabecera() + navegacion() + "<main>" + cuerpo + "</main>" + pie() + "</div>";
  }

  /* ---------- eventos ---------- */
  raiz.addEventListener("click", function (ev) {
    var el = ev.target.closest("[data-acc]");
    if (!el) return;
    var acc = el.getAttribute("data-acc");
    if (acc === "tema") return cambiarTema();
    if (acc === "ir") { pararReloj(); vista = el.getAttribute("data-v"); sesion = null; pintar(); return; }
    if (acc === "rapido") return empezar("practica", barajar(B.preguntas).slice(0, 20), { titulo: "Test rápido" });
    if (acc === "repasar") return empezar("practica", barajar(fallosPendientes()).slice(0, 30), { titulo: "Repaso de fallos" });
    if (acc === "bloque") {
      var b = B.bloques.filter(function (x) { return x.id === el.getAttribute("data-id"); })[0];
      return empezar("practica", barajar(delBloque(b.id)), { titulo: b.nombre });
    }
    if (acc === "simular") {
      var n = parseInt(document.getElementById("ldl-n").value, 10);
      var conTiempo = document.getElementById("ldl-t").value === "1";
      var bloque = document.getElementById("ldl-b").value;
      var fuente = bloque ? delBloque(bloque) : B.preguntas;
      var elegidas = barajar(fuente).slice(0, n);
      return empezar("simulacro", elegidas, { titulo: "Simulacro", minutos: conTiempo ? elegidas.length : 0 });
    }
    if (acc === "empezarweb") return empezar("practica", barajar(B.preguntas), { titulo: "Test gratuito" });
    if (acc === "resp") return responder(el.getAttribute("data-l"));
    if (acc === "sig") return siguiente();
    if (acc === "ant") return anterior();
    if (acc === "entregar") return terminar();
    if (acc === "salir") { pararReloj(); sesion = null; vista = CFG.modo === "web" ? "portada" : "inicio"; pintar(); return; }
    if (acc === "borrar") {
      if (el.getAttribute("data-confirmar") === "1") { prog = { p: {}, h: [] }; guardar(); pintar(); }
      else { el.setAttribute("data-confirmar", "1"); el.textContent = "Pulsa otra vez para confirmar"; }
    }
  });
  document.addEventListener("keydown", function (ev) {
    if (vista !== "test" || !sesion || ev.altKey || ev.ctrlKey || ev.metaKey) return;
    var k = ev.key.toLowerCase(), mapa = { "1": "a", "2": "b", "3": "c", "4": "d", a: "a", b: "b", c: "c", d: "d" };
    if (mapa[k]) { ev.preventDefault(); responder(mapa[k]); }
    else if (k === "enter" || k === "arrowright") {
      var id = sesion.ids[sesion.i];
      if (sesion.tipo === "simulacro" || sesion.corregida[id]) { ev.preventDefault(); siguiente(); }
    } else if (k === "arrowleft" && sesion.tipo === "simulacro") { ev.preventDefault(); anterior(); }
  });

  pintar();
})();
</script>
</body>
</html>
