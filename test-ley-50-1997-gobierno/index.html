:"Consejo de Ministros y en el Consejo de Estado.","c":"Consejo de Ministros y en Comisiones Delegadas del Gobierno.","d":"Consejo de Ministros y en el Secretariado del Gobierno."},"correcta":"c","explicacion":"El art. 1.3 establece que los miembros del Gobierno se reúnen «en Consejo de Ministros y en Comisiones Delegadas del Gobierno»; es la opción c). La opción a) es falsa: esa Comisión la integran los titulares de las Secretarías de Estado y los Subsecretarios (art. 8.1). Las opciones b) y d) citan órganos que no son reuniones de los miembros del Gobierno: el Consejo de Estado es un órgano consultivo y el Secretariado del Gobierno es un órgano de apoyo (art. 9.1).","cita":"«3. Los miembros del Gobierno se reúnen en Consejo de Ministros y en Comisiones Delegadas del Gobierno.»","dificultad":1},{"id":"L50-L1-009","ley":"L50","articulo":"3.2","articulo_txt":"Art. 3.2 Ley 50/1997","bloque_id":"L50|Título I. Del Gobierno: composición, organización y órganos de colaboración y apoyo · Capítulo I. Del Gobierno, su composición, organización y funciones","enunciado":"Según el artículo 3.2 de la Ley 50/1997, el Vicepresidente que asuma la titularidad de un Departamento Ministerial ostentará, además, la condición de:","opciones":{"a":"Secretario de Estado.","b":"Subsecretario del Departamento.","c":"Ministro.","d":"Portavoz del Gobierno."},"correcta":"c","explicacion":"El art. 3.2 dispone que ese Vicepresidente «ostentará, además, la condición de Ministro»; es la opción c). Las opciones a), b) y d) no aparecen en el precepto; el titular de un Departamento Ministerial es un Ministro (art. 4.1).","cita":"«2. El Vicepresidente que asuma la titularidad de un Departamento Ministerial, ostentará, además, la condición de Ministro.»","dificultad":1},{"id":"L50-L1-017","ley":"L50","articulo":"5.2","articulo_txt":"Art. 5.2 Ley 50/1997","bloque_id":"L50|Título I. Del Gobierno: composición, organización y órganos de colaboración y apoyo · Capítulo I. Del Gobierno, su composición, organización y funciones","enunciado":"Según el artículo 5.2 de la Ley 50/1997, ¿quiénes podrán asistir a las reuniones del Consejo de Ministros cuando sean convocados para ello?","opciones":{"a":"Los Subsecretarios y, excepcionalmente, los Directores Generales.","b":"Los Secretarios de Estado y los Subsecretarios, en todo caso.","c":"Los Secretarios de Estado y, excepcionalmente, otros altos cargos.","d":"Los Directores de los Gabinetes de los Ministros."},"correcta":"c","explicacion":"El art. 5.2 prevé que puedan asistir «los Secretarios de Estado y excepcionalmente otros altos cargos, cuando sean convocados para ello»; es la opción c). Las opciones a), b) y d) alteran quiénes pueden asistir o eliminan el carácter excepcional de la asistencia de otros altos cargos. La mención de otros altos cargos procede de la disposición final 3.2 de la Ley 40/2015, con efectos de 2 de octubre de 2016; la Ley Orgánica 1/2025, con efectos desde el 3 de abril de 2025, solo añadió la salvedad «sin perjuicio de lo dispuesto en los tratados internacionales válidamente celebrados por España».","cita":"«2. A las reuniones del Consejo de Ministros podrán asistir los Secretarios de Estado y excepcionalmente otros altos cargos, cuando sean convocados para ello, sin perjuicio de lo dispuesto en los tratados internacionales válidamente celebrados por España.»","dificultad":2},{"id":"L50-L1-020","ley":"L50","articulo":"6.4.c","articulo_txt":"Art. 6.4.c Ley 50/1997","bloque_id":"L50|Título I. Del Gobierno: composición, organización y órganos de colaboración y apoyo · Capítulo I. Del Gobierno, su composición, organización y funciones","enunciado":"Según el artículo 6.4 de la Ley 50/1997, corresponde a las Comisiones Delegadas del Gobierno resolver los asuntos que:","opciones":{"a":"Afecten a un solo Ministerio y les sean delegados por su titular.","b":"Por razones de urgencia, no puedan esperar a la siguiente reunión del Consejo de Ministros.","c":"Afecten a varias Comunidades Autónomas y requieran coordinación estatal.","d":"Afectando a más de un Ministerio, no requieran ser elevados al Consejo de Ministros."},"correcta":"d","explicacion":"El art. 6.4.c) les atribuye «Resolver los asuntos que, afectando a más de un Ministerio, no requieran ser elevados al Consejo de Ministros»; es la opción d). Las opciones a), b) y c) describen supuestos que el precepto no contempla.","cita":"«4. Corresponde a las Comisiones Delegadas, como órganos colegiados del Gobierno: […] c) Resolver los asuntos que, afectando a más de un Ministerio, no requieran ser elevados al Consejo de Ministros.»","dificultad":2},{"id":"L50-L1-021","ley":"L50","articulo":"7.1","articulo_txt":"Art. 7.1 Ley 50/1997","bloque_id":"L50|Título I. Del Gobierno: composición, organización y órganos de colaboración y apoyo · Capítulo II. De los órganos de colaboración y apoyo del Gobierno","enunciado":"Según el artículo 7.1 de la Ley 50/1997, los Secretarios de Estado son:","opciones":{"a":"Órganos directivos de la Administración General del Estado.","b":"Órganos superiores de la Administración General del Estado.","c":"Miembros del Gobierno sin derecho a voto en el Consejo de Ministros.","d":"Órganos colegiados de colaboración del Gobierno."},"correcta":"b","explicacion":"El art. 7.1 define a los Secretarios de Estado como «órganos superiores de la Administración General del Estado»; es la opción b). La opción a) cambia su naturaleza: no son órganos directivos. Las opciones c) y d) son falsas: el art. 1.2 no los incluye en el Gobierno y el art. 7.1 no los configura como órganos colegiados.","cita":"«1. Los Secretarios de Estado son órganos superiores de la Administración General del Estado, directamente responsables de la ejecución de la acción del Gobierno en un sector de actividad específica de un Departamento o de la Presidencia del Gobierno.»","dificultad":1},{"id":"L50-L1-028","ley":"L50","articulo":"8.6","articulo_txt":"Art. 8.6 Ley 50/1997","bloque_id":"L50|Título I. Del Gobierno: composición, organización y órganos de colaboración y apoyo · Capítulo II. De los órganos de colaboración y apoyo del Gobierno","enunciado":"Según el artículo 8.6 de la Ley 50/1997, la Comisión General de Secretarios de Estado y Subsecretarios podrá celebrar sesiones, deliberar y aprobar actas a distancia por medios electrónicos:","opciones":{"a":"Solo cuando concurran razones de urgencia apreciadas por su presidente.","b":"Siempre que lo autorice previamente el Consejo de Ministros para cada sesión.","c":"Siempre que el secretario de la Comisión asista presencialmente desde la sede del Ministerio de la Presidencia.","d":"Siempre que los miembros participantes se encuentren en territorio español y quede acreditada su identidad."},"correcta":"d","explicacion":"El art. 8.6, añadido por el art. 221.1 del Real Decreto-ley 5/2023, de 28 de junio, lo permite «siempre que los miembros participantes se encuentren en territorio español y quede acreditada su identidad»; es la opción d). Las opciones a), b) y c) añaden requisitos que el precepto no exige; además, debe asegurarse la comunicación en tiempo real y el carácter secreto o reservado de las deliberaciones.","cita":"«6. La Comisión General de Secretarios de Estado y Subsecretarios podrá celebrar sesiones, deliberar y aprobar actas a distancia por medios electrónicos, siempre que los miembros participantes se encuentren en territorio español y quede acreditada su identidad.»","dificultad":2},{"id":"L50-L1-029","ley":"L50","articulo":"9.1","articulo_txt":"Art. 9.1 Ley 50/1997","bloque_id":"L50|Título I. Del Gobierno: composición, organización y órganos de colaboración y apoyo · Capítulo II. De los órganos de colaboración y apoyo del Gobierno","enunciado":"Según el artículo 9.1 de la Ley 50/1997, ¿cuál de las siguientes NO es una función del Secretariado del Gobierno como órgano de apoyo de los órganos colegiados del Gobierno?","opciones":{"a":"La fijación del orden del día de las reuniones del Consejo de Ministros.","b":"La remisión de las convocatorias a los miembros de dichos órganos.","c":"El archivo y custodia de las convocatorias, órdenes del día y actas de las reuniones.","d":"Velar por la correcta y fiel publicación de las disposiciones del Gobierno que deban insertarse en el «Boletín Oficial del Estado»."},"correcta":"a","explicacion":"Fijar el orden del día de las reuniones del Consejo de Ministros corresponde al Presidente del Gobierno según el art. 2.2.g), no al Secretariado; es la opción a). Las opciones b), c) y d) son funciones del Secretariado recogidas en el art. 9.1, letras b), d) y f), respectivamente.","cita":"«1. El Secretariado del Gobierno, como órgano de apoyo del Consejo de Ministros, de las Comisiones Delegadas del Gobierno y de la Comisión General de Secretarios de Estado y Subsecretarios, ejercerá las siguientes funciones: […] b) La remisión de las convocatorias a los diferentes miembros de los órganos colegiados anteriormente enumerados. […] d) El archivo y custodia de las convocatorias, órdenes del día y actas de las reuniones. […] f) Velar por la correcta y fiel publicación de las disposiciones y normas emanadas del Gobierno que deban insertarse en el \"Boletín Oficial del Estado\".»","dificultad":2},{"id":"L50-L1-030","ley":"L50","articulo":"9.2","articulo_txt":"Art. 9.2 Ley 50/1997","bloque_id":"L50|Título I. Del Gobierno: composición, organización y órganos de colaboración y apoyo · Capítulo II. De los órganos de colaboración y apoyo del Gobierno","enunciado":"Según el artículo 9.2 de la Ley 50/1997, el Secretariado del Gobierno ejerce los trámites relativos a la sanción y promulgación real de las leyes aprobadas por las Cortes Generales como órgano de asistencia:","opciones":{"a":"Al Presidente del Gobierno.","b":"A la Casa de Su Majestad el Rey.","c":"Al Ministro de la Presidencia.","d":"Al Presidente del Congreso de los Diputados."},"correcta":"c","explicacion":"El art. 9.2 atribuye esas funciones al Secretariado «como órgano de asistencia al Ministro de la Presidencia»; es la opción c). Las opciones a), b) y d) señalan órganos que el precepto no menciona como destinatarios de esa asistencia.","cita":"«2. Asimismo, el Secretariado del Gobierno, como órgano de asistencia al Ministro de la Presidencia, ejercerá las siguientes funciones: […] a) Los trámites relativos a la sanción y promulgación real de las leyes aprobadas por las Cortes Generales y la expedición de los Reales Decretos.»","dificultad":2},{"id":"L50-L1-036","ley":"L50","articulo":"11","articulo_txt":"Art. 11 Ley 50/1997","bloque_id":"L50|Título II. Del estatuto de los miembros del Gobierno, de los Secretarios de Estado y de los Directores de los Gabinetes · Capítulo I. De los miembros del Gobierno","enunciado":"Según el artículo 11 de la Ley 50/1997, para ser miembro del Gobierno se requiere, además, reunir el resto de requisitos de idoneidad previstos en:","opciones":{"a":"La Ley 19/2013, de 9 de diciembre.","b":"La Ley 40/2015, de 1 de octubre.","c":"La Ley 39/2015, de 1 de octubre.","d":"La Ley 3/2015, de 30 de marzo."},"correcta":"d","explicacion":"El art. 11 remite a los requisitos de idoneidad previstos en la «Ley 3/2015, de 30 de marzo, reguladora del ejercicio del alto cargo de la Administración General del Estado»; es la opción d). Las opciones a), b) y c) citan leyes a las que el art. 11 no remite para los requisitos de idoneidad. El artículo fue modificado por la disposición final 3.8 de la Ley 40/2015, con efectos de 2 de octubre de 2016.","cita":"«Para ser miembro del Gobierno se requiere ser español, mayor de edad, disfrutar de los derechos de sufragio activo y pasivo, así como no estar inhabilitado para ejercer empleo o cargo público por sentencia judicial firme y reunir el resto de requisitos de idoneidad previstos en la Ley 3/2015, de 30 de marzo, reguladora del ejercicio del alto cargo de la Administración General del Estado.»","dificultad":2},{"id":"L50-L1-038","ley":"L50","articulo":"12.2 bis","articulo_txt":"Art. 12.2 bis Ley 50/1997","bloque_id":"L50|Título II. Del estatuto de los miembros del Gobierno, de los Secretarios de Estado y de los Directores de los Gabinetes · Capítulo I. De los miembros del Gobierno","enunciado":"Según el artículo 12 de la Ley 50/1997, en el nombramiento de las personas titulares de las Vicepresidencias y los Ministerios, cada uno de los sexos debe suponer, en su conjunto, como mínimo:","opciones":{"a":"El cuarenta por ciento.","b":"El treinta por ciento.","c":"El treinta y cinco por ciento.","d":"El cuarenta y cinco por ciento."},"correcta":"a","explicacion":"El art. 12.2 bis, añadido por el art. 7 de la Ley Orgánica 2/2024, de 1 de agosto, garantiza la presencia equilibrada de mujeres y hombres «de forma que cada uno de los sexos suponga como mínimo el cuarenta por ciento en su conjunto»; es la opción a). Las opciones b), c) y d) alteran el porcentaje mínimo fijado por la ley.","cita":"«2 bis. En el nombramiento de las personas titulares de las Vicepresidencias y los Ministerios se garantizará el principio de presencia equilibrada de mujeres y hombres, de forma que cada uno de los sexos suponga como mínimo el cuarenta por ciento en su conjunto.»","dificultad":2},{"id":"L50-L1-039","ley":"L50","articulo":"12.3","articulo_txt":"Art. 12.3 Ley 50/1997","bloque_id":"L50|Título II. Del estatuto de los miembros del Gobierno, de los Secretarios de Estado y de los Directores de los Gabinetes · Capítulo I. De los miembros del Gobierno","enunciado":"Según el artículo 12.3 de la Ley 50/1997, la separación de los Vicepresidentes del Gobierno:","opciones":{"a":"No produce la extinción del órgano, que permanece vacante hasta que el Presidente efectúe un nuevo nombramiento.","b":"Lleva aparejada la extinción de dichos órganos, salvo que simultáneamente se designe otro vicepresidente en sustitución del separado.","c":"Lleva aparejada la extinción de dichos órganos, salvo que el Vicepresidente separado sea titular de un Departamento.","d":"Lleva aparejada la extinción de dichos órganos, salvo que el Consejo de Ministros acuerde mantenerlos."},"correcta":"b","explicacion":"El art. 12.3 dispone que la separación «llevará aparejada la extinción de dichos órganos, salvo el caso en que simultáneamente se designe otro vicepresidente en sustitución del separado»; es la opción b). La opción a) niega la extinción. Las opciones c) y d) sustituyen la salvedad legal por otras que el precepto no prevé: que el Vicepresidente sea titular de un Departamento o que el Consejo de Ministros acuerde mantener el órgano.","cita":"«3. La separación de los Vicepresidentes del Gobierno llevará aparejada la extinción de dichos órganos, salvo el caso en que simultáneamente se designe otro vicepresidente en sustitución del separado.»","dificultad":2}]};</script>
<script>
/* Letra de Ley — motor de test. Sin dependencias; funciona sin conexión.
   Necesita window.LDL_CONFIG y window.LDL_BANCO (los inyecta sistema/letradeley.py). */
(function () {
  "use strict";
  var CFG = window.LDL_CONFIG, B = window.LDL_BANCO;
  var raiz = document.getElementById("ldl");
  var LETRAS = ["a", "b", "c", "d"];
  var POR_ID = {};
  B.preguntas.forEach(function (p) { POR_ID[p.id] = p; });
  var CLAVE = "ldl1:" + CFG.pack.id;
  var prog = cargar();
  var sesion = null;
  var vista = CFG.modo === "web" ? "portada" : "inicio";
  var reloj = null;

  /* ---------- utilidades ---------- */
  function esc(t) {
    return String(t == null ? "" : t).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function barajar(lista) {
    var a = lista.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function pct(a, b) { return b ? Math.round((a / b) * 100) : 0; }
  function plural(n, uno, varios) { return n + " " + (n === 1 ? uno : varios); }
  function num(n) { return String(n).replace(".", ","); }
  function cargar() {
    try { var s = localStorage.getItem(CLAVE); if (s) { var d = JSON.parse(s); if (d && d.p) return d; } } catch (e) {}
    return { p: {}, h: [] };
  }
  function guardar() { try { localStorage.setItem(CLAVE, JSON.stringify(prog)); } catch (e) {} }
  function registrar(id, acierto) {
    var r = prog.p[id] || { v: 0, a: 0, f: 0, c: 0 };
    r.v++;
    if (acierto) { r.a++; r.c = Math.min((r.c || 0) + 1, 5); } else { r.f++; r.c = 0; }
    r.u = acierto ? 1 : 0;
    r.t = Date.now();
    prog.p[id] = r;
    guardar();
  }
  function fallosPendientes() {
    return B.preguntas.filter(function (p) { var r = prog.p[p.id]; return r && r.u === 0; });
  }
  function resumen(lista) {
    var vistas = 0, aciertos = 0, intentos = 0;
    lista.forEach(function (p) {
      var r = prog.p[p.id];
      if (r) { vistas++; aciertos += r.a; intentos += r.v; }
    });
    return { total: lista.length, vistas: vistas, acierto: pct(aciertos, intentos) };
  }
  function delBloque(id) { return B.preguntas.filter(function (p) { return p.bloque_id === id; }); }

  /* ---------- tema claro / oscuro ---------- */
  function aplicarTema() {
    var t = null;
    try { t = localStorage.getItem("ldl:tema"); } catch (e) {}
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    else document.documentElement.removeAttribute("data-theme");
    return t || "auto";
  }
  function cambiarTema() {
    var orden = { auto: "light", light: "dark", dark: "auto" };
    var actual = aplicarTema();
    try { localStorage.setItem("ldl:tema", orden[actual]); } catch (e) {}
    aplicarTema();
    pintar();
  }

  /* ---------- sesiones ---------- */
  function empezar(tipo, preguntas, opciones) {
    opciones = opciones || {};
    if (!preguntas.length) return;
    pararReloj();
    sesion = {
      tipo: tipo, titulo: opciones.titulo || "Test", ids: preguntas.map(function (p) { return p.id; }),
      i: 0, resp: {}, corregida: {}, inicio: Date.now(), limite: opciones.minutos ? opciones.minutos * 60 : 0, fin: null,
      origen: vista === "test" || vista === "resultado" ? (sesion && sesion.origen) || "inicio" : vista
    };
    vista = "test";
    if (sesion.limite) reloj = setInterval(tic, 1000);
    pintar();
    window.scrollTo(0, 0);
  }
  function tic() {
    if (!sesion || sesion.fin) return pararReloj();
    var el = document.getElementById("ldl-crono");
    var resta = sesion.limite - Math.floor((Date.now() - sesion.inicio) / 1000);
    if (resta <= 0) { terminar(); return; }
    if (el) el.textContent = mmss(resta);
  }
  function pararReloj() { if (reloj) { clearInterval(reloj); reloj = null; } }
  function mmss(s) { var m = Math.floor(s / 60), r = s % 60; return m + ":" + (r < 10 ? "0" : "") + r; }

  function responder(letra) {
    var id = sesion.ids[sesion.i];
    if (sesion.tipo === "simulacro") {
      sesion.resp[id] = sesion.resp[id] === letra ? undefined : letra;
      pintar();
      return;
    }
    if (sesion.corregida[id]) return;
    sesion.resp[id] = letra;
    sesion.corregida[id] = true;
    registrar(id, letra === POR_ID[id].correcta);
    pintar();
  }
  function siguiente() {
    if (sesion.i < sesion.ids.length - 1) { sesion.i++; pintar(); window.scrollTo(0, 0); }
    else terminar();
  }
  function anterior() { if (sesion.i > 0) { sesion.i--; pintar(); } }
  function terminar() {
    pararReloj();
    if (sesion.tipo === "simulacro") {
      sesion.ids.forEach(function (id) {
        if (sesion.resp[id]) registrar(id, sesion.resp[id] === POR_ID[id].correcta);
      });
    }
    sesion.fin = Date.now();
    var r = calcular(sesion);
    prog.h.unshift({ t: sesion.fin, tipo: sesion.tipo, n: r.total, a: r.aciertos, e: r.errores, nota: r.nota });
    prog.h = prog.h.slice(0, 50);
    guardar();
    vista = "resultado";
    pintar();
    window.scrollTo(0, 0);
  }
  function calcular(s) {
    var a = 0, e = 0, nr = 0;
    s.ids.forEach(function (id) {
      var r = s.resp[id];
      if (!r) nr++; else if (r === POR_ID[id].correcta) a++; else e++;
    });
    var pen = (CFG.simulacro && CFG.simulacro.penalizacion) || 1 / 3;
    var neta = s.tipo === "simulacro" ? a - e * pen : a;
    var nota = Math.max(0, (neta / s.ids.length) * 10);
    return { total: s.ids.length, aciertos: a, errores: e, blancos: nr, neta: neta, nota: Math.round(nota * 100) / 100 };
  }

  /* ---------- vistas ---------- */
  function cabecera() {
    var tema = aplicarTema();
    var etiquetas = { auto: "Tema: auto", light: "Tema: claro", dark: "Tema: oscuro" };
    return '<header class="ldl-top"><a class="ldl-brand" href="' + esc(CFG.web || "#") + '">' +
      '<span class="ldl-logo" aria-hidden="true">§</span><span><b>Letra de Ley</b><small>' +
      esc(CFG.pack.nombre) + "</small></span></a>" +
      '<button class="ldl-tema" data-acc="tema" type="button">' + etiquetas[tema] + "</button></header>";
  }
  function navegacion() {
    if (CFG.modo === "web") return "";
    var items = [["inicio", "Inicio"], ["temas", "Por temas"], ["simulacro", "Simulacro"], ["fallos", "Fallos"], ["stats", "Estadísticas"]];
    return '<nav class="ldl-nav" aria-label="Secciones">' + items.map(function (it) {
      var actual = vista === it[0] || (vista === "test" && sesion && sesion.origen === it[0]);
      return '<button type="button" data-acc="ir" data-v="' + it[0] + '"' + (actual ? ' aria-current="page"' : "") + ">" + it[1] + "</button>";
    }).join("") + "</nav>";
  }
  function pie() {
    return '<p class="ldl-pie">Letra de Ley · ' + esc(CFG.pack.edicion) + " · Texto legal actualizado a " +
      esc(CFG.pack.actualizado) + "<br>Uso personal. Prohibida su redistribución.</p>";
  }

  function vInicio() {
    var r = resumen(B.preguntas), f = fallosPendientes().length;
    return '<section class="ldl-card"><h2>' + esc(CFG.pack.nombre) + "</h2>" +
      '<p class="ldl-muted">' + B.preguntas.length + " preguntas comentadas, con el artículo exacto de cada respuesta.</p>" +
      '<div class="ldl-kpis"><div class="ldl-kpi"><b>' + r.vistas + "/" + r.total + "</b><span>respondidas</span></div>" +
      '<div class="ldl-kpi"><b>' + r.acierto + ' %</b><span>de acierto</span></div>' +
      '<div class="ldl-kpi"><b>' + f + "</b><span>fallos por repasar</span></div></div>" +
      '<div class="ldl-acciones"><button class="ldl-btn" data-acc="rapido" type="button">Test rápido de 20</button>' +
      '<button class="ldl-btn sec" data-acc="ir" data-v="simulacro" type="button">Simulacro de examen</button>' +
      (f ? '<button class="ldl-btn sec" data-acc="repasar" type="button">Repasar ' + f + " fallos</button>" : "") +
      "</div></section>" +
      '<section class="ldl-card"><h3>Cómo sacarle partido</h3><ol class="ldl-muted">' +
      "<li>Practica <b>por temas</b>: cada respuesta te enseña el artículo y por qué fallan las demás opciones.</li>" +
      "<li>Cada pocos días, <b>repasa tus fallos</b>: es donde más se aprende.</li>" +
      "<li>Antes del examen, haz <b>simulacros</b> con tiempo y con la penalización real (cada error resta 1/3).</li></ol>" +
      '<p class="ldl-small ldl-muted">Tu progreso se guarda en este dispositivo y en este navegador.</p></section>' + historial();
  }
  function historial() {
    if (!prog.h.length) return "";
    return '<section class="ldl-card"><h3>Últimos tests</h3><ul class="ldl-revision">' + prog.h.slice(0, 5).map(function (h) {
      var d = new Date(h.t);
      return "<li><b>" + (h.tipo === "simulacro" ? "Simulacro" : "Práctica") + "</b> · " + d.toLocaleDateString("es-ES") +
        " · " + h.a + "/" + h.n + " aciertos" + (h.tipo === "simulacro" ? " · nota " + num(h.nota) : "") + "</li>";
    }).join("") + "</ul></section>";
  }
  function vTemas() {
    var html = '<section class="ldl-card"><h2>Practicar por temas</h2><p class="ldl-muted">Elige un bloque. Las preguntas salen en orden aleatorio y se corrigen al momento.</p><ul class="ldl-bloques">';
    B.bloques.forEach(function (b) {
      var lista = delBloque(b.id), r = resumen(lista);
      html += '<li><button type="button" data-acc="bloque" data-id="' + esc(b.id) + '"><span class="t">' + esc(b.nombre) +
        '</span><span class="n">' + r.vistas + "/" + r.total + (r.vistas ? " · " + r.acierto + " %" : "") + "</span>" +
        '<span class="ldl-barra"><i style="width:' + pct(r.vistas, r.total) + '%"></i></span></button></li>';
    });
    return html + "</ul></section>";
  }
  function vSimulacro() {
    var total = B.preguntas.length;
    var opcionesN = [10, 20, 30, 50, 100].filter(function (n) { return n < total; });
    opcionesN.push(total);
    var porDefecto = Math.min((CFG.simulacro && CFG.simulacro.preguntas) || 30, total);
    return '<section class="ldl-card"><h2>Simulacro de examen</h2>' +
      '<p class="ldl-muted">Como el día del examen: no ves las soluciones hasta el final y cada error resta un tercio de acierto.</p>' +
      '<div class="ldl-campo"><label for="ldl-n">Número de preguntas</label><select id="ldl-n">' +
      opcionesN.map(function (n) { return "<option" + (n === porDefecto ? " selected" : "") + ">" + n + "</option>"; }).join("") +
      '</select></div><div class="ldl-campo"><label for="ldl-t">Tiempo</label><select id="ldl-t">' +
      '<option value="1">1 minuto por pregunta</option><option value="0">Sin límite de tiempo</option></select></div>' +
      '<div class="ldl-campo"><label for="ldl-b">Temas</label><select id="ldl-b"><option value="">Todos</option>' +
      B.bloques.map(function (b) { return '<option value="' + esc(b.id) + '">' + esc(b.nombre) + "</option>"; }).join("") +
      '</select></div><div class="ldl-acciones"><button class="ldl-btn" data-acc="simular" type="button">Empezar simulacro</button></div></section>';
  }
  function vFallos() {
    var f = fallosPendientes();
    if (!f.length) {
      return '<section class="ldl-card"><h2>Repaso de fallos</h2><p class="ldl-muted">No tienes fallos pendientes. Cuando falles una pregunta aparecerá aquí hasta que la aciertes.</p></section>';
    }
    return '<section class="ldl-card"><h2>Repaso de fallos</h2><p class="ldl-muted">Tienes <b>' + f.length +
      "</b> preguntas falladas. Salen de aquí en cuanto las aciertas.</p>" +
      '<div class="ldl-acciones"><button class="ldl-btn" data-acc="repasar" type="button">Repasar ahora</button></div></section>';
  }
  function vStats() {
    var html = '<section class="ldl-card"><h2>Estadísticas</h2><ul class="ldl-bloques">';
    B.bloques.forEach(function (b) {
      var r = resumen(delBloque(b.id));
      html += '<li><button type="button" data-acc="bloque" data-id="' + esc(b.id) + '"><span class="t">' + esc(b.nombre) +
        '</span><span class="n">' + (r.vistas ? r.acierto + " % de acierto" : "sin empezar") + '</span><span class="ldl-barra"><i style="width:' +
        r.acierto + '%"></i></span></button></li>';
    });
    html += '</ul></section><section class="ldl-card"><h3>Empezar de cero</h3><p class="ldl-muted ldl-small">Borra tu progreso guardado en este dispositivo.</p>' +
      '<div class="ldl-acciones"><button class="ldl-btn sec" data-acc="borrar" type="button">Borrar mi progreso</button></div></section>';
    return html;
  }
  function vPortada() {
    var n = B.preguntas.length;
    return '<section class="ldl-card"><h2>' + esc(CFG.pack.nombre) + "</h2>" +
      '<p class="ldl-muted">' + n + " preguntas tipo examen, corregidas al momento, con el artículo exacto y la explicación de cada opción. Gratis y sin registrarte.</p>" +
      '<div class="ldl-acciones"><button class="ldl-btn" data-acc="empezarweb" type="button">Empezar el test</button></div></section>';
  }

  function vTest() {
    var id = sesion.ids[sesion.i], p = POR_ID[id], sim = sesion.tipo === "simulacro";
    var elegida = sesion.resp[id], corregida = !sim && sesion.corregida[id];
    var html = '<section class="ldl-card"><div class="ldl-meta"><span>' + esc(sesion.titulo) + " · " + (sesion.i + 1) + " de " + sesion.ids.length +
      "</span><span>" + (sesion.limite ? '⏱ <span id="ldl-crono" class="ldl-crono">' +
        mmss(Math.max(0, sesion.limite - Math.floor((Date.now() - sesion.inicio) / 1000))) + "</span>" : esc(p.articulo_txt)) +
      '</span></div><div class="ldl-progreso"><i style="width:' + pct(sesion.i + (corregida ? 1 : 0), sesion.ids.length) + '%"></i></div>' +
      '<p class="ldl-enunciado">' + esc(p.enunciado) + '</p><div class="ldl-opciones" role="group" aria-label="Opciones">';
    LETRAS.forEach(function (l) {
      var cls = "ldl-op";
      if (corregida) { if (l === p.correcta) cls += " ok"; else if (l === elegida) cls += " ko"; }
      else if (sim && elegida === l) cls += " marcada";
      html += '<button type="button" class="' + cls + '" data-acc="resp" data-l="' + l + '"' + (corregida ? " disabled" : "") +
        (sim ? ' aria-pressed="' + (elegida === l) + '"' : "") + '><span class="l">' + l + ")</span><span>" + esc(p.opciones[l]) + "</span></button>";
    });
    html += "</div>";
    if (corregida) html += feedback(p, elegida);
    html += '<div class="ldl-acciones">';
    if (sim) {
      html += (sesion.i > 0 ? '<button class="ldl-btn sec" data-acc="ant" type="button">Anterior</button>' : "") +
        '<button class="ldl-btn" data-acc="sig" type="button">' + (sesion.i < sesion.ids.length - 1 ? "Siguiente" : "Entregar") + "</button>" +
        (sesion.i < sesion.ids.length - 1 ? '<button class="ldl-btn sec" data-acc="entregar" type="button">Entregar ya</button>' : "");
    } else if (corregida) {
      html += '<button class="ldl-btn" data-acc="sig" type="button">' + (sesion.i < sesion.ids.length - 1 ? "Siguiente" : "Ver resultado") + "</button>";
    }
    html += '<button class="ldl-btn sec" data-acc="salir" type="button">Salir</button></div></section>';
    return html;
  }
  function feedback(p, elegida) {
    var bien = elegida === p.correcta;
    return '<div class="ldl-feedback" aria-live="polite"><div class="v ' + (bien ? "ok" : "ko") + '">' +
      (bien ? "¡Correcta!" : "Incorrecta. La respuesta correcta es la " + p.correcta + ")") + "</div><div>" + esc(p.explicacion) + "</div>" +
      (p.cita ? '<blockquote class="ldl-cita">' + esc(p.cita) + "<small>" + esc(p.articulo_txt) + "</small></blockquote>" : "") + "</div>";
  }
  function vResultado() {
    var r = calcular(sesion), sim = sesion.tipo === "simulacro";
    var html = '<section class="ldl-card"><h2>' + (sim ? "Resultado del simulacro" : "Resultado") + "</h2>" +
      '<div class="ldl-nota">' + (sim ? num(r.nota.toFixed(2)) : r.aciertos + "/" + r.total) + "</div>" +
      '<p class="ldl-muted">' + plural(r.aciertos, "acierto", "aciertos") + " · " + plural(r.errores, "error", "errores") +
      (r.blancos ? " · " + r.blancos + " en blanco" : "") +
      (sim ? " · nota sobre 10 con penalización" : "") + "</p>";
    if (CFG.modo === "web") html += ctaWeb(r);
    html += '<div class="ldl-acciones">' + (CFG.modo === "web" ? '<button class="ldl-btn sec" data-acc="empezarweb" type="button">Repetir con otro orden</button>' :
      '<button class="ldl-btn" data-acc="ir" data-v="inicio" type="button">Volver al inicio</button>') + "</div></section>";
    html += '<section class="ldl-card"><h3>Revisión</h3><ul class="ldl-revision">';
    sesion.ids.forEach(function (id, n) {
      var p = POR_ID[id], e = sesion.resp[id], chip = !e ? '<span class="ldl-chip nr">En blanco</span>' :
        e === p.correcta ? '<span class="ldl-chip ok">Bien</span>' : '<span class="ldl-chip ko">Mal</span>';
      html += "<li>" + chip + '<span class="e">' + (n + 1) + ". " + esc(p.enunciado) + "</span><br>" +
        '<span class="ldl-small">Correcta: <b>' + p.correcta + ") " + esc(p.opciones[p.correcta]) + "</b>" +
        (e && e !== p.correcta ? " · Marcaste " + e + ")" : "") + '</span><br><span class="ldl-small ldl-muted">' + esc(p.explicacion) + "</span></li>";
    });
    return html + "</ul></section>";
  }
  function ctaWeb() {
    var c = CFG.compra || {}, html = "";
    if (c.url) {
      html += '<div class="ldl-card ldl-cta"><h3>' + esc(c.titulo) + '</h3><p class="ldl-muted">' + esc(c.texto) + "</p>" +
        '<div class="ldl-acciones"><a class="ldl-btn acc" href="' + esc(c.url) + '">' + esc(c.boton) + "</a></div></div>";
    }
    if (CFG.telegram) {
      html += '<p class="ldl-small">¿Quieres un test cada día? <a href="' + esc(CFG.telegram) + '">Únete gratis al canal de Telegram</a>.</p>';
    }
    return html;
  }

  function pintar() {
    var cuerpo;
    if (vista === "test") cuerpo = vTest();
    else if (vista === "resultado") cuerpo = vResultado();
    else if (vista === "portada") cuerpo = vPortada();
    else if (vista === "temas") cuerpo = vTemas();
    else if (vista === "simulacro") cuerpo = vSimulacro();
    else if (vista === "fallos") cuerpo = vFallos();
    else if (vista === "stats") cuerpo = vStats();
    else cuerpo = vInicio();
    raiz.innerHTML = '<div class="ldl">' + cabecera() + navegacion() + "<main>" + cuerpo + "</main>" + pie() + "</div>";
  }

  /* ---------- eventos ---------- */
  raiz.addEventListener("click", function (ev) {
    var el = ev.target.closest("[data-acc]");
    if (!el) return;
    var acc = el.getAttribute("data-acc");
    if (acc === "tema") return cambiarTema();
    if (acc === "ir") { pararReloj(); vista = el.getAttribute("data-v"); sesion = null; pintar(); return; }
    if (acc === "rapido") return empezar("practica", barajar(B.preguntas).slice(0, 20), { titulo: "Test rápido" });
    if (acc === "repasar") return empezar("practica", barajar(fallosPendientes()).slice(0, 30), { titulo: "Repaso de fallos" });
    if (acc === "bloque") {
      var b = B.bloques.filter(function (x) { return x.id === el.getAttribute("data-id"); })[0];
      return empezar("practica", barajar(delBloque(b.id)), { titulo: b.nombre });
    }
    if (acc === "simular") {
      var n = parseInt(document.getElementById("ldl-n").value, 10);
      var conTiempo = document.getElementById("ldl-t").value === "1";
      var bloque = document.getElementById("ldl-b").value;
      var fuente = bloque ? delBloque(bloque) : B.preguntas;
      var elegidas = barajar(fuente).slice(0, n);
      return empezar("simulacro", elegidas, { titulo: "Simulacro", minutos: conTiempo ? elegidas.length : 0 });
    }
    if (acc === "empezarweb") return empezar("practica", barajar(B.preguntas), { titulo: "Test gratuito" });
    if (acc === "resp") return responder(el.getAttribute("data-l"));
    if (acc === "sig") return siguiente();
    if (acc === "ant") return anterior();
    if (acc === "entregar") return terminar();
    if (acc === "salir") { pararReloj(); sesion = null; vista = CFG.modo === "web" ? "portada" : "inicio"; pintar(); return; }
    if (acc === "borrar") {
      if (el.getAttribute("data-confirmar") === "1") { prog = { p: {}, h: [] }; guardar(); pintar(); }
      else { el.setAttribute("data-confirmar", "1"); el.textContent = "Pulsa otra vez para confirmar"; }
    }
  });
  document.addEventListener("keydown", function (ev) {
    if (vista !== "test" || !sesion || ev.altKey || ev.ctrlKey || ev.metaKey) return;
    var k = ev.key.toLowerCase(), mapa = { "1": "a", "2": "b", "3": "c", "4": "d", a: "a", b: "b", c: "c", d: "d" };
    if (mapa[k]) { ev.preventDefault(); responder(mapa[k]); }
    else if (k === "enter" || k === "arrowright") {
      var id = sesion.ids[sesion.i];
      if (sesion.tipo === "simulacro" || sesion.corregida[id]) { ev.preventDefault(); siguiente(); }
    } else if (k === "arrowleft" && sesion.tipo === "simulacro") { ev.preventDefault(); anterior(); }
  });

  pintar();
})();
</script>
</body>
</html>
