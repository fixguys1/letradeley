Directores Generales.","b":"Los Secretarios de Estado y los Subsecretarios, en todo caso.","c":"Los Secretarios de Estado y, excepcionalmente, otros altos cargos.","d":"Los Directores de los Gabinetes de los Ministros."},"correcta":"c","explicacion":"El art. 5.2 prevé que puedan asistir «los Secretarios de Estado y excepcionalmente otros altos cargos, cuando sean convocados para ello»; es la opción c). Las opciones a), b) y d) alteran quiénes pueden asistir o eliminan el carácter excepcional de la asistencia de otros altos cargos. La mención de otros altos cargos procede de la disposición final 3.2 de la Ley 40/2015, con efectos de 2 de octubre de 2016; la Ley Orgánica 1/2025, con efectos desde el 3 de abril de 2025, solo añadió la salvedad «sin perjuicio de lo dispuesto en los tratados internacionales válidamente celebrados por España».","cita":"«2. A las reuniones del Consejo de Ministros podrán asistir los Secretarios de Estado y excepcionalmente otros altos cargos, cuando sean convocados para ello, sin perjuicio de lo dispuesto en los tratados internacionales válidamente celebrados por España.»","dificultad":2},{"id":"L50-L1-020","ley":"L50","articulo":"6.4.c","articulo_txt":"Art. 6.4.c Ley 50/1997","bloque_id":"L50|Título I. Del Gobierno: composición, organización y órganos de colaboración y apoyo · Capítulo I. Del Gobierno, su composición, organización y funciones","enunciado":"Según el artículo 6.4 de la Ley 50/1997, corresponde a las Comisiones Delegadas del Gobierno resolver los asuntos que:","opciones":{"a":"Afecten a un solo Ministerio y les sean delegados por su titular.","b":"Por razones de urgencia, no puedan esperar a la siguiente reunión del Consejo de Ministros.","c":"Afecten a varias Comunidades Autónomas y requieran coordinación estatal.","d":"Afectando a más de un Ministerio, no requieran ser elevados al Consejo de Ministros."},"correcta":"d","explicacion":"El art. 6.4.c) les atribuye «Resolver los asuntos que, afectando a más de un Ministerio, no requieran ser elevados al Consejo de Ministros»; es la opción d). Las opciones a), b) y c) describen supuestos que el precepto no contempla.","cita":"«4. Corresponde a las Comisiones Delegadas, como órganos colegiados del Gobierno: […] c) Resolver los asuntos que, afectando a más de un Ministerio, no requieran ser elevados al Consejo de Ministros.»","dificultad":2},{"id":"L50-L1-021","ley":"L50","articulo":"7.1","articulo_txt":"Art. 7.1 Ley 50/1997","bloque_id":"L50|Título I. Del Gobierno: composición, organización y órganos de colaboración y apoyo · Capítulo II. De los órganos de colaboración y apoyo del Gobierno","enunciado":"Según el artículo 7.1 de la Ley 50/1997, los Secretarios de Estado son:","opciones":{"a":"Órganos directivos de la Administración General del Estado.","b":"Órganos superiores de la Administración General del Estado.","c":"Miembros del Gobierno sin derecho a voto en el Consejo de Ministros.","d":"Órganos colegiados de colaboración del Gobierno."},"correcta":"b","explicacion":"El art. 7.1 define a los Secretarios de Estado como «órganos superiores de la Administración General del Estado»; es la opción b). La opción a) cambia su naturaleza: no son órganos directivos. Las opciones c) y d) son falsas: el art. 1.2 no los incluye en el Gobierno y el art. 7.1 no los configura como órganos colegiados.","cita":"«1. Los Secretarios de Estado son órganos superiores de la Administración General del Estado, directamente responsables de la ejecución de la acción del Gobierno en un sector de actividad específica de un Departamento o de la Presidencia del Gobierno.»","dificultad":1},{"id":"L50-L1-028","ley":"L50","articulo":"8.6","articulo_txt":"Art. 8.6 Ley 50/1997","bloque_id":"L50|Título I. Del Gobierno: composición, organización y órganos de colaboración y apoyo · Capítulo II. De los órganos de colaboración y apoyo del Gobierno","enunciado":"Según el artículo 8.6 de la Ley 50/1997, la Comisión General de Secretarios de Estado y Subsecretarios podrá celebrar sesiones, deliberar y aprobar actas a distancia por medios electrónicos:","opciones":{"a":"Solo cuando concurran razones de urgencia apreciadas por su presidente.","b":"Siempre que lo autorice previamente el Consejo de Ministros para cada sesión.","c":"Siempre que el secretario de la Comisión asista presencialmente desde la sede del Ministerio de la Presidencia.","d":"Siempre que los miembros participantes se encuentren en territorio español y quede acreditada su identidad."},"correcta":"d","explicacion":"El art. 8.6, añadido por el art. 221.1 del Real Decreto-ley 5/2023, de 28 de junio, lo permite «siempre que los miembros participantes se encuentren en territorio español y quede acreditada su identidad»; es la opción d). Las opciones a), b) y c) añaden requisitos que el precepto no exige; además, debe asegurarse la comunicación en tiempo real y el carácter secreto o reservado de las deliberaciones.","cita":"«6. La Comisión General de Secretarios de Estado y Subsecretarios podrá celebrar sesiones, deliberar y aprobar actas a distancia por medios electrónicos, siempre que los miembros participantes se encuentren en territorio español y quede acreditada su identidad.»","dificultad":2},{"id":"L50-L1-029","ley":"L50","articulo":"9.1","articulo_txt":"Art. 9.1 Ley 50/1997","bloque_id":"L50|Título I. Del Gobierno: composición, organización y órganos de colaboración y apoyo · Capítulo II. De los órganos de colaboración y apoyo del Gobierno","enunciado":"Según el artículo 9.1 de la Ley 50/1997, ¿cuál de las siguientes NO es una función del Secretariado del Gobierno como órgano de apoyo de los órganos colegiados del Gobierno?","opciones":{"a":"La fijación del orden del día de las reuniones del Consejo de Ministros.","b":"La remisión de las convocatorias a los miembros de dichos órganos.","c":"El archivo y custodia de las convocatorias, órdenes del día y actas de las reuniones.","d":"Velar por la correcta y fiel publicación de las disposiciones del Gobierno que deban insertarse en el «Boletín Oficial del Estado»."},"correcta":"a","explicacion":"Fijar el orden del día de las reuniones del Consejo de Ministros corresponde al Presidente del Gobierno según el art. 2.2.g), no al Secretariado; es la opción a). Las opciones b), c) y d) son funciones del Secretariado recogidas en el art. 9.1, letras b), d) y f), respectivamente.","cita":"«1. El Secretariado del Gobierno, como órgano de apoyo del Consejo de Ministros, de las Comisiones Delegadas del Gobierno y de la Comisión General de Secretarios de Estado y Subsecretarios, ejercerá las siguientes funciones: […] b) La remisión de las convocatorias a los diferentes miembros de los órganos colegiados anteriormente enumerados. […] d) El archivo y custodia de las convocatorias, órdenes del día y actas de las reuniones. […] f) Velar por la correcta y fiel publicación de las disposiciones y normas emanadas del Gobierno que deban insertarse en el \"Boletín Oficial del Estado\".»","dificultad":2},{"id":"L50-L1-036","ley":"L50","articulo":"11","articulo_txt":"Art. 11 Ley 50/1997","bloque_id":"L50|Título II. Del estatuto de los miembros del Gobierno, de los Secretarios de Estado y de los Directores de los Gabinetes · Capítulo I. De los miembros del Gobierno","enunciado":"Según el artículo 11 de la Ley 50/1997, para ser miembro del Gobierno se requiere, además, reunir el resto de requisitos de idoneidad previstos en:","opciones":{"a":"La Ley 19/2013, de 9 de diciembre.","b":"La Ley 40/2015, de 1 de octubre.","c":"La Ley 39/2015, de 1 de octubre.","d":"La Ley 3/2015, de 30 de marzo."},"correcta":"d","explicacion":"El art. 11 remite a los requisitos de idoneidad previstos en la «Ley 3/2015, de 30 de marzo, reguladora del ejercicio del alto cargo de la Administración General del Estado»; es la opción d). Las opciones a), b) y c) citan leyes a las que el art. 11 no remite para los requisitos de idoneidad. El artículo fue modificado por la disposición final 3.8 de la Ley 40/2015, con efectos de 2 de octubre de 2016.","cita":"«Para ser miembro del Gobierno se requiere ser español, mayor de edad, disfrutar de los derechos de sufragio activo y pasivo, así como no estar inhabilitado para ejercer empleo o cargo público por sentencia judicial firme y reunir el resto de requisitos de idoneidad previstos en la Ley 3/2015, de 30 de marzo, reguladora del ejercicio del alto cargo de la Administración General del Estado.»","dificultad":2},{"id":"L50-L1-038","ley":"L50","articulo":"12.2 bis","articulo_txt":"Art. 12.2 bis Ley 50/1997","bloque_id":"L50|Título II. Del estatuto de los miembros del Gobierno, de los Secretarios de Estado y de los Directores de los Gabinetes · Capítulo I. De los miembros del Gobierno","enunciado":"Según el artículo 12 de la Ley 50/1997, en el nombramiento de las personas titulares de las Vicepresidencias y los Ministerios, cada uno de los sexos debe suponer, en su conjunto, como mínimo:","opciones":{"a":"El cuarenta por ciento.","b":"El treinta por ciento.","c":"El treinta y cinco por ciento.","d":"El cuarenta y cinco por ciento."},"correcta":"a","explicacion":"El art. 12.2 bis, añadido por el art. 7 de la Ley Orgánica 2/2024, de 1 de agosto, garantiza la presencia equilibrada de mujeres y hombres «de forma que cada uno de los sexos suponga como mínimo el cuarenta por ciento en su conjunto»; es la opción a). Las opciones b), c) y d) alteran el porcentaje mínimo fijado por la ley.","cita":"«2 bis. En el nombramiento de las personas titulares de las Vicepresidencias y los Ministerios se garantizará el principio de presencia equilibrada de mujeres y hombres, de forma que cada uno de los sexos suponga como mínimo el cuarenta por ciento en su conjunto.»","dificultad":2},{"id":"L50-L1-039","ley":"L50","articulo":"12.3","articulo_txt":"Art. 12.3 Ley 50/1997","bloque_id":"L50|Título II. Del estatuto de los miembros del Gobierno, de los Secretarios de Estado y de los Directores de los Gabinetes · Capítulo I. De los miembros del Gobierno","enunciado":"Según el artículo 12.3 de la Ley 50/1997, la separación de los Vicepresidentes del Gobierno:","opciones":{"a":"No produce la extinción del órgano, que permanece vacante hasta que el Presidente efectúe un nuevo nombramiento.","b":"Lleva aparejada la extinción de dichos órganos, salvo que simultáneamente se designe otro vicepresidente en sustitución del separado.","c":"Lleva aparejada la extinción de dichos órganos, salvo que el Vicepresidente separado sea titular de un Departamento.","d":"Lleva aparejada la extinción de dichos órganos, salvo que el Consejo de Ministros acuerde mantenerlos."},"correcta":"b","explicacion":"El art. 12.3 dispone que la separación «llevará aparejada la extinción de dichos órganos, salvo el caso en que simultáneamente se designe otro vicepresidente en sustitución del separado»; es la opción b). La opción a) niega la extinción. Las opciones c) y d) sustituyen la salvedad legal por otras que el precepto no prevé: que el Vicepresidente sea titular de un Departamento o que el Consejo de Ministros acuerde mantener el órgano.","cita":"«3. La separación de los Vicepresidentes del Gobierno llevará aparejada la extinción de dichos órganos, salvo el caso en que simultáneamente se designe otro vicepresidente en sustitución del separado.»","dificultad":2},{"id":"L50-L2-001","ley":"L50","articulo":"15.1","articulo_txt":"Art. 15.1 Ley 50/1997","bloque_id":"L50|Título II. Del estatuto de los miembros del Gobierno, de los Secretarios de Estado y de los Directores de los Gabinetes · Capítulo II. De los Secretarios de Estado","enunciado":"Según el artículo 15.1 de la Ley 50/1997, los Secretarios de Estado son nombrados y separados:","opciones":{"a":"Por Real Decreto del Presidente del Gobierno, a propuesta del Ministro a cuyo Departamento pertenezcan, previa deliberación del Consejo de Ministros.","b":"Por Real Decreto del Consejo de Ministros, aprobado a propuesta, en todo caso, del Ministro de la Presidencia.","c":"Por Real Decreto del Consejo de Ministros, aprobado a propuesta del Presidente del Gobierno o del miembro del Gobierno a cuyo Departamento pertenezcan.","d":"Por Orden del Ministro a cuyo Departamento pertenezcan, previa deliberación del Consejo de Ministros."},"correcta":"c","explicacion":"El art. 15.1 dispone que los Secretarios de Estado «son nombrados y separados por Real Decreto del Consejo de Ministros, aprobado a propuesta del Presidente del Gobierno o del miembro del Gobierno a cuyo Departamento pertenezcan»; es la opción c). La opción a) atribuye el Real Decreto al Presidente del Gobierno, cuando la ley lo atribuye al Consejo de Ministros. La opción b) reserva la propuesta al Ministro de la Presidencia, al que el precepto no menciona. La opción d) sustituye el Real Decreto por una Orden ministerial.","cita":"«1. Los Secretarios de Estado son nombrados y separados por Real Decreto del Consejo de Ministros, aprobado a propuesta del Presidente del Gobierno o del miembro del Gobierno a cuyo Departamento pertenezcan.»","dificultad":2},{"id":"L50-L2-002","ley":"L50","articulo":"15.2","articulo_txt":"Art. 15.2 Ley 50/1997","bloque_id":"L50|Título II. Del estatuto de los miembros del Gobierno, de los Secretarios de Estado y de los Directores de los Gabinetes · Capítulo II. De los Secretarios de Estado","enunciado":"Según el artículo 15.2 de la Ley 50/1997, la suplencia de los Secretarios de Estado del mismo Departamento se determinará:","opciones":{"a":"Según el orden de precedencia que se derive del Real Decreto de estructura orgánica del Ministerio.","b":"Según la antigüedad en el cargo de cada uno de los Secretarios de Estado del Departamento.","c":"Por acuerdo del Consejo de Ministros, a propuesta del Ministro del Departamento.","d":"Por Orden del Ministro del Departamento, que designará en cada caso al suplente."},"correcta":"a","explicacion":"El art. 15.2 dispone que esta suplencia «se determinará según el orden de precedencia que se derive del Real Decreto de estructura orgánica del Ministerio»; es la opción a). Las opciones b), c) y d) no se ajustan al precepto, que no atiende a la antigüedad ni deja la designación al Ministro o al Consejo de Ministros, sino que remite a la norma de estructura orgánica del Ministerio.","cita":"«2. La suplencia de los Secretarios de Estado del mismo Departamento se determinará según el orden de precedencia que se derive del Real Decreto de estructura orgánica del Ministerio.»","dificultad":2},{"id":"L50-L2-003","ley":"L50","articulo":"15.3","articulo_txt":"Art. 15.3 Ley 50/1997","bloque_id":"L50|Título II. Del estatuto de los miembros del Gobierno, de los Secretarios de Estado y de los Directores de los Gabinetes · Capítulo II. De los Secretarios de Estado","enunciado":"Según el artículo 15.3 de la Ley 50/1997, los Secretarios de Estado dependientes directamente de la Presidencia del Gobierno serán suplidos por:","opciones":{"a":"El Ministro de la Presidencia.","b":"Quien designe el Presidente.","c":"El Secretario de Estado de mayor antigüedad en el cargo.","d":"El Director del Gabinete de la Presidencia del Gobierno."},"correcta":"b","explicacion":"El art. 15.3 dispone que estos Secretarios de Estado «serán suplidos por quien designe el Presidente»; es la opción b). Las opciones a), c) y d) atribuyen la suplencia a órganos que el precepto no menciona, pues la ley deja la designación al Presidente.","cita":"«3. Los Secretarios de Estado dependientes directamente de la Presidencia del Gobierno serán suplidos por quien designe el Presidente.»","dificultad":1},{"id":"L50-L2-005","ley":"L50","articulo":"16.2","articulo_txt":"Art. 16.2 Ley 50/1997","bloque_id":"L50|Título II. Del estatuto de los miembros del Gobierno, de los Secretarios de Estado y de los Directores de los Gabinetes · Capítulo III. De los Directores de los Gabinetes de Presidente, Vicepresidentes, Ministros y Secretarios de Estado","enunciado":"Según el artículo 16.2 de la Ley 50/1997, los Directores de Gabinete de los Secretarios de Estado serán nombrados:","opciones":{"a":"Por Orden Ministerial, previo informe de la Comisión General de Secretarios de Estado y Subsecretarios.","b":"Por Orden Ministerial, previo conocimiento del Consejo de Ministros.","c":"Por resolución del Secretario de Estado respectivo, previa comunicación al Ministro.","d":"Por Orden Ministerial, previa autorización del Presidente del Gobierno."},"correcta":"b","explicacion":"El art. 16.2 dispone que estos Directores de Gabinete «serán nombrados por Orden Ministerial, previo conocimiento del Consejo de Ministros»; es la opción b). Las opciones a) y d) mantienen la Orden Ministerial, pero sustituyen el conocimiento del Consejo de Ministros por un trámite que la ley no prevé. La opción c) atribuye el nombramiento al propio Secretario de Estado, lo que el precepto no contempla.","cita":"«2. Los Directores de Gabinete de los Secretarios de Estado serán nombrados por Orden Ministerial, previo conocimiento del Consejo de Ministros.»","dificultad":2},{"id":"L50-L2-007","ley":"L50","articulo":"16.3","articulo_txt":"Art. 16.3 Ley 50/1997","bloque_id":"L50|Título II. Del estatuto de los miembros del Gobierno, de los Secretarios de Estado y de los Directores de los Gabinetes · Capítulo III. De los Directores de los Gabinetes de Presidente, Vicepresidentes, Ministros y Secretarios de Estado","enunciado":"Según el artículo 16.3 de la Ley 50/1997, en el supuesto del Gobierno en funciones, los Directores de los Gabinetes:","opciones":{"a":"Cesarán el mismo día en que se celebren las elecciones generales.","b":"Continuarán solo si así lo acuerda expresamente el Consejo de Ministros en funciones.","c":"Pasarán a depender del Ministro de la Presidencia mientras dure esa situación.","d":"Continuarán hasta la formación del nuevo Gobierno."},"correcta":"d","explicacion":"El art. 16.3 prevé que «En el supuesto del Gobierno en funciones continuarán hasta la formación del nuevo Gobierno»; es la opción d). Las opciones a), b) y c) no se ajustan al precepto, que los mantiene en su puesto hasta ese momento sin condiciones ni cambio de dependencia.","cita":"«En el supuesto del Gobierno en funciones continuarán hasta la formación del nuevo Gobierno.»","dificultad":2},{"id":"L50-L2-009","ley":"L50","articulo":"16.4","articulo_txt":"Art. 16.4 Ley 50/1997","bloque_id":"L50|Título II. Del estatuto de los miembros del Gobierno, de los Secretarios de Estado y de los Directores de los Gabinetes · Capítulo III. De los Directores de los Gabinetes de Presidente, Vicepresidentes, Ministros y Secretarios de Estado","enunciado":"Según el artículo 16.4 de la Ley 50/1997, el personal no funcionario que se incorpore a los Gabinetes a que se refiere dicho artículo:","opciones":{"a":"Tendrá derecho a la reserva del puesto y antigüedad, conforme a lo dispuesto en su legislación específica.","b":"Tendrá derecho a la reserva del puesto, pero no al cómputo de la antigüedad durante ese tiempo.","c":"Deberá extinguir previamente la relación laboral que mantenga con su entidad de origen.","d":"Tendrá derecho a una indemnización a su cese, en los términos que fije el Consejo de Ministros."},"correcta":"a","explicacion":"El párrafo segundo del art. 16.4 reconoce a este personal el «derecho a la reserva del puesto y antigüedad, conforme a lo dispuesto en su legislación específica»; es la opción a). La opción b) excluye la antigüedad, que la ley reconoce junto a la reserva del puesto. Las opciones c) y d) no figuran en el precepto.","cita":"«Del mismo modo, el personal no funcionario que se incorpore a estos Gabinetes tendrá derecho a la reserva del puesto y antigüedad, conforme a lo dispuesto en su legislación específica.»","dificultad":2},{"id":"L50-L2-017","ley":"L50","articulo":"20.1.b","articulo_txt":"Art. 20.1.b Ley 50/1997","bloque_id":"L50|Título III. De las normas de funcionamiento del Gobierno y de la delegación de competencias","enunciado":"Según el artículo 20.1.b) de la Ley 50/1997, ¿cuál de los siguientes órganos NO figura entre aquellos en cuyo favor los Ministros pueden delegar el ejercicio de competencias propias?","opciones":{"a":"Los Secretarios de Estado de otros Departamentos.","b":"Los demás órganos directivos del Ministerio.","c":"Los Delegados del Gobierno en las Comunidades Autónomas.","d":"Los Secretarios de Estado dependientes de ellos."},"correcta":"a","explicacion":"El art. 20.1.b) permite a los Ministros delegar «en favor de los Secretarios de Estado y de los Subsecretarios dependientes de ellos, de los Delegados del Gobierno en las Comunidades Autónomas y de los demás órganos directivos del Ministerio», lista en la que no figuran los Secretarios de Estado de otros Departamentos; es la opción a). Las opciones b), c) y d) figuran expresamente en el precepto. La delegación entre órganos de la Administración General del Estado no relacionados jerárquicamente se regula con carácter general en el art. 9.1 de la Ley 40/2015.","cita":"«1. Pueden delegar el ejercicio de competencias propias: […] b) Los Ministros en favor de los Secretarios de Estado y de los Subsecretarios dependientes de ellos, de los Delegados del Gobierno en las Comunidades Autónomas y de los demás órganos directivos del Ministerio.»","dificultad":2},{"id":"L50-L2-021","ley":"L50","articulo":"20.4","articulo_txt":"Art. 20.4 Ley 50/1997","bloque_id":"L50|Título III. De las normas de funcionamiento del Gobierno y de la delegación de competencias","enunciado":"Según el artículo 20.4 de la Ley 50/1997, el Consejo de Ministros podrá avocar para sí el conocimiento de un asunto a propuesta:","opciones":{"a":"Del Ministro de la Presidencia.","b":"De la Comisión General de Secretarios de Estado y Subsecretarios.","c":"Del Ministro competente por razón de la materia.","d":"Del Presidente del Gobierno."},"correcta":"d","explicacion":"El art. 20.4, introducido en la redacción dada al art. 20 por la disposición final 3.11 de la Ley 40/2015, dispone que «El Consejo de Ministros podrá avocar para sí, a propuesta del Presidente del Gobierno, el conocimiento de un asunto cuya decisión corresponda a las Comisiones Delegadas del Gobierno»; es la opción d). Las opciones a), b) y c) atribuyen la propuesta a órganos que el precepto no menciona.","cita":"«4. El Consejo de Ministros podrá avocar para sí, a propuesta del Presidente del Gobierno, el conocimiento de un asunto cuya decisión corresponda a las Comisiones Delegadas del Gobierno.»","dificultad":2},{"id":"L50-L2-022","ley":"L50","articulo":"20.4","articulo_txt":"Art. 20.4 Ley 50/1997","bloque_id":"L50|Título III. De las normas de funcionamiento del Gobierno y de la delegación de competencias","enunciado":"Según el artículo 20.4 de la Ley 50/1997, el acuerdo motivado de avocación del Consejo de Ministros será objeto de mención expresa en:","opciones":{"a":"El acta de la siguiente reunión de la Comisión General de Secretarios de Estado y Subsecretarios.","b":"La decisión que se adopte en el ejercicio de la avocación.","c":"El «Boletín Oficial del Estado», con carácter previo a la decisión.","d":"La comunicación que se remita a las Cortes Generales."},"correcta":"b","explicacion":"Según el párrafo segundo del art. 20.4, la avocación se realiza «mediante acuerdo motivado al efecto, del que se hará mención expresa en la decisión que se adopte en el ejercicio de la avocación»; es la opción b). Las opciones a), c) y d) no figuran en el precepto, que añade que contra el acuerdo de avocación no cabe recurso, aunque podrá impugnarse en el que, en su caso, se interponga contra la decisión adoptada.","cita":"«La avocación se realizará mediante acuerdo motivado al efecto, del que se hará mención expresa en la decisión que se adopte en el ejercicio de la avocación. Contra el acuerdo de avocación no cabrá recurso, aunque podrá impugnarse en el que, en su caso, se interponga contra la decisión adoptada.»","dificultad":3},{"id":"L50-L2-024","ley":"L50","articulo":"21.2","articulo_txt":"Art. 21.2 Ley 50/1997","bloque_id":"L50|Título IV. Del Gobierno en funciones","enunciado":"Según el artículo 21.2 de la Ley 50/1997, el Gobierno cesante continúa en funciones con las limitaciones establecidas en:","opciones":{"a":"El Reglamento del Congreso de los Diputados.","b":"El Real Decreto por el que se declare su cese.","c":"La propia Ley 50/1997.","d":"El acuerdo que adopte el Consejo de Ministros cesante."},"correcta":"c","explicacion":"El art. 21.2 dispone que el Gobierno cesante continúa en funciones hasta la toma de posesión del nuevo Gobierno, «con las limitaciones establecidas en esta Ley»; es la opción c). El art. 101.2 de la Constitución recoge la continuidad en funciones, y la Ley 50/1997 añade la remisión a sus propias limitaciones. Las opciones a), b) y d) remiten a normas o actos que el precepto no menciona.","cita":"«2. El Gobierno cesante continúa en funciones hasta la toma de posesión del nuevo Gobierno, con las limitaciones establecidas en esta Ley.»","dificultad":1},{"id":"L50-L2-027","ley":"L50","articulo":"21.4.b","articulo_txt":"Art. 21.4.b Ley 50/1997","bloque_id":"L50|Título IV. Del Gobierno en funciones","enunciado":"Según el artículo 21.4 de la Ley 50/1997, el Presidente del Gobierno en funciones no podrá:","opciones":{"a":"Representar al Gobierno.","b":"Dirigir la política de defensa.","c":"Impartir instrucciones a los demás miembros del Gobierno.","d":"Plantear la cuestión de confianza."},"correcta":"d","explicacion":"El art. 21.4.b) incluye entre las facultades que el Presidente del Gobierno en funciones no podrá ejercer la de «Plantear la cuestión de confianza»; es la opción d). Las opciones a), b) y c) son funciones que el art. 2.2 atribuye al Presidente del Gobierno y que el art. 21.4 no excluye.","cita":"«4. El Presidente del Gobierno en funciones no podrá ejercer las siguientes facultades: […] b) Plantear la cuestión de confianza.»","dificultad":2},{"id":"L50-L2-030","ley":"L50","articulo":"21.5.b","articulo_txt":"Art. 21.5.b Ley 50/1997","bloque_id":"L50|Título IV. Del Gobierno en funciones","enunciado":"Según el artículo 21.5.b) de la Ley 50/1997, en cuanto a la presentación de proyectos de ley al Congreso de los Diputados o, en su caso, al Senado, el Gobierno en funciones:","opciones":{"a":"Podrá presentar únicamente proyectos de ley orgánica.","b":"Podrá presentarlos con autorización expresa de la Diputación Permanente del Congreso de los Diputados.","c":"Podrá presentar los que el Consejo de Ministros hubiera aprobado antes de quedar en funciones.","d":"No podrá presentarlos."},"correcta":"d","explicacion":"El art. 21.5.b) incluye, sin prever excepción alguna, entre las facultades que el Gobierno en funciones no podrá ejercer la de «Presentar proyectos de ley al Congreso de los Diputados o, en su caso, al Senado»; es la opción d). Las opciones a), b) y c) añaden excepciones que el precepto no contempla.","cita":"«5. El Gobierno en funciones no podrá ejercer las siguientes facultades: […] b) Presentar proyectos de ley al Congreso de los Diputados o, en su caso, al Senado.»","dificultad":2},{"id":"L50-L3-008","ley":"L50","articulo":"26.2","articulo_txt":"Art. 26.2 Ley 50/1997","bloque_id":"L50|Título V. De la iniciativa legislativa y la potestad reglamentaria del Gobierno","enunciado":"Según el artículo 26.2 de la Ley 50/1997, ¿en cuál de los siguientes supuestos podrá prescindirse del trámite de consulta pública?","opciones":{"a":"Cuando la norma afecte a los derechos e intereses legítimos de las personas.","b":"Cuando la propuesta normativa no figure en el Plan Anual Normativo.","c":"Cuando la norma vaya a ser dictaminada por el Consejo de Estado.","d":"Cuando concurran razones graves de interés público que lo justifiquen."},"correcta":"d","explicacion":"Entre las circunstancias que permiten prescindir de la consulta pública, el art. 26.2.b) recoge el supuesto en que «concurran razones graves de interés público que lo justifiquen»; es la opción d). El apartado 2 tiene la redacción dada por la disposición final 11.2 de la Ley Orgánica 1/2025, de 2 de enero, con efectos desde el 3 de abril de 2025. La opción a) es falsa: la afectación a los derechos e intereses legítimos de las personas es lo que obliga a abrir el trámite de audiencia del art. 26.6, no una causa para omitir la consulta. La opción b) es falsa: si la propuesta no figura en el Plan, el art. 25.3 obliga a justificarlo en la Memoria, pero no exime de la consulta. La opción c) no figura entre las circunstancias que enumera el art. 26.2.","cita":"«Podrá prescindirse del trámite de consulta pública previsto en este apartado cuando concurra cualquiera de las siguientes circunstancias: […] b) Cuando concurran razones graves de interés público que lo justifiquen.»","dificultad":2},{"id":"L50-L3-018","ley":"L50","articulo":"26.5","articulo_txt":"Art. 26.5 Ley 50/1997","bloque_id":"L50|Título V. De la iniciativa legislativa y la potestad reglamentaria del Gobierno","enunciado":"Según el artículo 26.5 de la Ley 50/1997, en todo caso, los anteproyectos de ley, los proyectos de real decreto legislativo y los proyectos de disposiciones reglamentarias deberán ser informados por:","opciones":{"a":"La Abogacía del Estado en el Ministerio o Ministerios proponentes de la norma.","b":"La Intervención Delegada en el Ministerio o Ministerios proponentes.","c":"El Secretariado del Gobierno.","d":"La Secretaría General Técnica del Ministerio o Ministerios proponentes."},"correcta":"d","explicacion":"El art. 26.5 establece que «En todo caso», esos textos «deberán ser informados por la Secretaría General Técnica del Ministerio o Ministerios proponentes»; es la opción d). Las opciones a) y b) citan órganos a los que el art. 26.5 no atribuye este informe. La opción c) es falsa: el Secretariado del Gobierno es un órgano de apoyo de los órganos colegiados del Gobierno (art. 9) y no emite este informe.","cita":"«En todo caso, los anteproyectos de ley, los proyectos de real decreto legislativo y los proyectos de disposiciones reglamentarias, deberán ser informados por la Secretaría General Técnica del Ministerio o Ministerios proponentes.»","dificultad":1},{"id":"L50-L3-024","ley":"L50","articulo":"26.9","articulo_txt":"Art. 26.9 Ley 50/1997","bloque_id":"L50|Título V. De la iniciativa legislativa y la potestad reglamentaria del Gobierno","enunciado":"Según el artículo 26.9 de la Ley 50/1997, ¿cuál de los siguientes aspectos se analizará con el objeto de asegurar la coordinación y la calidad de la actividad normativa del Gobierno?","opciones":{"a":"El grado de apoyo parlamentario previsible de la iniciativa durante su tramitación en las Cortes Generales.","b":"La posible extralimitación respecto del contenido de la norma comunitaria que se trasponga.","c":"El número de aportaciones recibidas en el trámite de consulta pública.","d":"La adecuación de la iniciativa al programa político del Gobierno."},"correcta":"b","explicacion":"El art. 26.9.g) incluye entre los aspectos analizados «La posible extralimitación de la iniciativa normativa respecto del contenido de la norma comunitaria que se trasponga al derecho interno»; es la opción b). Las opciones a), c) y d) no figuran entre los aspectos que enumera el art. 26.9.","cita":"«9. El Ministerio de la Presidencia, con el objeto de asegurar la coordinación y la calidad de la actividad normativa del Gobierno analizará los siguientes aspectos: […] g) La posible extralimitación de la iniciativa normativa respecto del contenido de la norma comunitaria que se trasponga al derecho interno.»","dificultad":2},{"id":"L50-L3-038","ley":"L50","articulo":"29.1","articulo_txt":"Art. 29.1 Ley 50/1997","bloque_id":"L50|Título VI. Del control del Gobierno","enunciado":"Según el artículo 29.1 de la Ley 50/1997, el Gobierno está sujeto a la Constitución y al resto del ordenamiento jurídico:","opciones":{"a":"En toda su actuación.","b":"Salvo en el ejercicio de la función de dirección política.","c":"Únicamente en el ejercicio de la potestad reglamentaria.","d":"En su actuación administrativa, pero no en la política."},"correcta":"a","explicacion":"El art. 29.1 dispone que «El Gobierno está sujeto a la Constitución y al resto del ordenamiento jurídico en toda su actuación»; es la opción a). El art. 29 fue añadido por la disposición final 3.13 de la Ley 40/2015, con efectos de 2 de octubre de 2016; su anterior numeración era art. 26. Las opciones b), c) y d) introducen excepciones o limitaciones que el art. 29.1 no admite.","cita":"«1. El Gobierno está sujeto a la Constitución y al resto del ordenamiento jurídico en toda su actuación.»","dificultad":1},{"id":"L50-L3-039","ley":"L50","articulo":"29.3","articulo_txt":"Art. 29.3 Ley 50/1997","bloque_id":"L50|Título VI. Del control del Gobierno","enunciado":"Según el artículo 29.3 de la Ley 50/1997, ¿qué actuaciones del Gobierno y de los órganos y autoridades regulados en esa Ley son impugnables ante la jurisdicción contencioso-administrativa?","opciones":{"a":"Los actos y la inactividad, pero no las actuaciones materiales constitutivas de vía de hecho.","b":"Los actos y las actuaciones materiales constitutivas de vía de hecho, pero no la inactividad.","c":"Únicamente los actos expresos y las disposiciones de carácter reglamentario.","d":"Los actos, la inactividad y las actuaciones materiales que constituyan una vía de hecho."},"correcta":"d","explicacion":"El art. 29.3 declara impugnables ante la jurisdicción contencioso-administrativa «Los actos, la inactividad y las actuaciones materiales que constituyan una vía de hecho del Gobierno y de los órganos y autoridades regulados en la presente Ley»; es la opción d). Las opciones a), b) y c) excluyen alguna de las actuaciones que el art. 29.3 declara impugnables.","cita":"«3. Los actos, la inactividad y las actuaciones materiales que constituyan una vía de hecho del Gobierno y de los órganos y autoridades regulados en la presente Ley son impugnables ante la jurisdicción contencioso-administrativa, de conformidad con lo dispuesto en su Ley reguladora.»","dificultad":2},{"id":"L50-L3-040","ley":"L50","articulo":"DA 1ª","articulo_txt":"DA 1ª · Ley 50/1997","bloque_id":"L50|Disposiciones adicionales","enunciado":"Según la disposición adicional primera de la Ley 50/1997, quienes hubieran sido Presidentes del Gobierno:","opciones":{"a":"Conservan con carácter vitalicio la condición de miembros del Gobierno a efectos protocolarios.","b":"Solo pueden utilizar dicho título durante la legislatura siguiente a su cese.","c":"Necesitan autorización del Consejo de Ministros para utilizar dicho título.","d":"Tienen derecho a utilizar dicho título."},"correcta":"d","explicacion":"La disposición adicional primera reconoce a quienes hubieran sido Presidentes del Gobierno el derecho «a utilizar dicho título» y a gozar de los derechos, honores y precedencias que legal o reglamentariamente se determinen; es la opción d). La opción a) es falsa: la disposición no les atribuye la condición de miembros del Gobierno. Las opciones b) y c) limitan o condicionan un derecho que la disposición reconoce sin esas restricciones.","cita":"«Quienes hubieran sido Presidentes del Gobierno tienen derecho a utilizar dicho título y gozarán de todos aquellos derechos, honores y precedencias que legal o reglamentariamente se determinen.»","dificultad":1},{"id":"L50-L3-042","ley":"L50","articulo":"DA 3ª","articulo_txt":"DA 3ª · Ley 50/1997","bloque_id":"L50|Disposiciones adicionales","enunciado":"Según la disposición adicional tercera de la Ley 50/1997, en situaciones excepcionales y cuando la naturaleza de la crisis lo exija, ¿quién podrá decidir motivadamente que el Consejo de Ministros y las Comisiones Delegadas del Gobierno puedan celebrar sesiones, adoptar acuerdos y aprobar actas a distancia por medios electrónicos?","opciones":{"a":"El Consejo de Ministros, por mayoría absoluta de sus miembros.","b":"El Presidente del Gobierno.","c":"El Ministro de la Presidencia.","d":"La Comisión General de Secretarios de Estado y Subsecretarios."},"correcta":"b","explicacion":"El apartado 1 de la disposición adicional tercera atribuye esta decisión motivada al «Presidente del Gobierno»; es la opción b). La disposición adicional tercera fue añadida por la disposición final 1 del Real Decreto-ley 7/2020, de 12 de marzo, y su apartado 1 fue modificado por el art. 221.2 del Real Decreto-ley 5/2023, de 28 de junio. Las opciones a), c) y d) citan órganos a los que la disposición adicional tercera no atribuye esta decisión.","cita":"«1. En situaciones excepcionales, y cuando la naturaleza de la crisis lo exija, el Presidente del Gobierno podrá decidir motivadamente que el Consejo de Ministros y las Comisiones Delegadas del Gobierno puedan celebrar sesiones, adoptar acuerdos y aprobar actas a distancia por medios electrónicos, siempre que los miembros participantes se encuentren en territorio español y quede acreditada su identidad. Asimismo, se deberá asegurar la comunicación entre ellos en tiempo real durante la sesión, disponiéndose los medios necesarios para garantizar el carácter secreto o reservado de sus deliberaciones.»","dificultad":1},{"id":"L50-L3-043","ley":"L50","articulo":"DA 3ª","articulo_txt":"DA 3ª · Ley 50/1997","bloque_id":"L50|Disposiciones adicionales","enunciado":"Según la disposición adicional tercera de la Ley 50/1997, a efectos de la celebración a distancia de sesiones del Consejo de Ministros y de las Comisiones Delegadas del Gobierno, se consideran medios electrónicos válidos:","opciones":{"a":"Las videoconferencias y el correo electrónico.","b":"Las audioconferencias y la mensajería instantánea.","c":"Las audioconferencias y videoconferencias.","d":"Las videoconferencias y las plataformas de firma electrónica."},"correcta":"c","explicacion":"El apartado 2 de la disposición adicional tercera dispone que «se consideran medios electrónicos válidos las audioconferencias y videoconferencias»; es la opción c). Las opciones a), b) y d) incluyen medios que la disposición adicional tercera no menciona.","cita":"«2. A estos efectos, se consideran medios electrónicos válidos las audioconferencias y videoconferencias.»","dificultad":1},{"id":"L50-L3-044","ley":"L50","articulo":"DT única","articulo_txt":"DT única · Ley 50/1997","bloque_id":"L50|Disposición transitoria","enunciado":"Según la disposición transitoria única de la Ley 50/1997, en los procedimientos de elaboración de normas con rango de ley y reglamentos ya iniciados a la entrada en vigor de la Ley Orgánica de medidas en materia de eficiencia del Servicio Público de Justicia, en los que concurra alguna de las circunstancias previstas en el artículo 26.2:","opciones":{"a":"Deberá repetirse la consulta pública conforme a la nueva redacción del artículo 26.2.","b":"Deberá ampliarse la consulta pública hasta completar el plazo mínimo legal.","c":"No será necesaria la consulta pública.","d":"No será necesario el trámite de audiencia e información pública."},"correcta":"c","explicacion":"La disposición transitoria única establece que «No será necesaria la consulta pública» en esos procedimientos; es la opción c). Se trata de una norma transitoria, añadida por la disposición final 11.3 de la Ley Orgánica 1/2025, de 2 de enero, con efectos desde el 3 de abril de 2025, que solo se aplica a los procedimientos ya iniciados en esa fecha; los iniciados después se rigen directamente por el art. 26.2 vigente. Las opciones a) y b) imponen trámites adicionales que la disposición transitoria única no prevé. La opción d) es falsa: la disposición se refiere solo a la consulta pública, no a la audiencia e información pública del art. 26.6.","cita":"«No será necesaria la consulta pública en aquellos procedimientos de elaboración de normas con rango de ley y reglamentos ya iniciados a la entrada en vigor de la Ley Orgánica de medidas en materia de eficiencia del Servicio Público de Justicia, en los que concurra cualquiera de las circunstancias previstas en el artículo 26.2 de esta ley.»","dificultad":2},{"id":"L50-L3-045","ley":"L50","articulo":"DD única","articulo_txt":"DD única · Ley 50/1997","bloque_id":"L50|Disposición derogatoria","enunciado":"Según la disposición derogatoria única de la Ley 50/1997, ¿qué artículos de la Ley de Procedimiento Administrativo, de 17 de julio de 1958, se derogan expresamente?","opciones":{"a":"Los artículos 127 a 131.","b":"Los artículos 129 a 132.","c":"Los artículos 130 a 137.","d":"Los artículos 120 a 128."},"correcta":"b","explicacion":"El apartado 1.d) de la disposición derogatoria única deroga «Los artículos 129 a 132 de la Ley de Procedimiento Administrativo, de 17 de julio de 1958»; es la opción b). Advertencia: esta derogación se produjo al entrar en vigor la Ley 50/1997, el 18 de diciembre de 1997, así que el dato solo tiene hoy valor histórico. Las opciones a), c) y d) indican artículos que no recoge la disposición derogatoria única.","cita":"«1. Quedan derogadas cuantas disposiciones de igual o inferior rango se opongan a lo dispuesto en la presente Ley y, en concreto: […] d) Los artículos 129 a 132 de la Ley de Procedimiento Administrativo, de 17 de julio de 1958.»","dificultad":3}]};</script>
<script>
/* Letra de Ley — motor de test. Sin dependencias; funciona sin conexión.
   Necesita window.LDL_CONFIG y window.LDL_BANCO (los inyecta sistema/letradeley.py). */
(function () {
  "use strict";
  var CFG = window.LDL_CONFIG, B = window.LDL_BANCO;
  var raiz = document.getElementById("ldl");
  var LETRAS = ["a", "b", "c", "d"];
  var POR_ID = {};
  B.preguntas.forEach(function (p) { POR_ID[p.id] = p; });
  var CLAVE = "ldl1:" + CFG.pack.id;
  var prog = cargar();
  var sesion = null;
  var vista = CFG.modo === "web" ? "portada" : "inicio";
  var reloj = null;

  /* ---------- utilidades ---------- */
  function esc(t) {
    return String(t == null ? "" : t).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function barajar(lista) {
    var a = lista.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function pct(a, b) { return b ? Math.round((a / b) * 100) : 0; }
  function plural(n, uno, varios) { return n + " " + (n === 1 ? uno : varios); }
  function num(n) { return String(n).replace(".", ","); }
  function cargar() {
    try { var s = localStorage.getItem(CLAVE); if (s) { var d = JSON.parse(s); if (d && d.p) return d; } } catch (e) {}
    return { p: {}, h: [] };
  }
  function guardar() { try { localStorage.setItem(CLAVE, JSON.stringify(prog)); } catch (e) {} }
  function registrar(id, acierto) {
    var r = prog.p[id] || { v: 0, a: 0, f: 0, c: 0 };
    r.v++;
    if (acierto) { r.a++; r.c = Math.min((r.c || 0) + 1, 5); } else { r.f++; r.c = 0; }
    r.u = acierto ? 1 : 0;
    r.t = Date.now();
    prog.p[id] = r;
    guardar();
  }
  function fallosPendientes() {
    return B.preguntas.filter(function (p) { var r = prog.p[p.id]; return r && r.u === 0; });
  }
  function resumen(lista) {
    var vistas = 0, aciertos = 0, intentos = 0;
    lista.forEach(function (p) {
      var r = prog.p[p.id];
      if (r) { vistas++; aciertos += r.a; intentos += r.v; }
    });
    return { total: lista.length, vistas: vistas, acierto: pct(aciertos, intentos) };
  }
  function delBloque(id) { return B.preguntas.filter(function (p) { return p.bloque_id === id; }); }

  /* ---------- tema claro / oscuro ---------- */
  function aplicarTema() {
    var t = null;
    try { t = localStorage.getItem("ldl:tema"); } catch (e) {}
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    else document.documentElement.removeAttribute("data-theme");
    return t || "auto";
  }
  function cambiarTema() {
    var orden = { auto: "light", light: "dark", dark: "auto" };
    var actual = aplicarTema();
    try { localStorage.setItem("ldl:tema", orden[actual]); } catch (e) {}
    aplicarTema();
    pintar();
  }

  /* ---------- sesiones ---------- */
  function empezar(tipo, preguntas, opciones) {
    opciones = opciones || {};
    if (!preguntas.length) return;
    pararReloj();
    sesion = {
      tipo: tipo, titulo: opciones.titulo || "Test", ids: preguntas.map(function (p) { return p.id; }),
      i: 0, resp: {}, corregida: {}, inicio: Date.now(), limite: opciones.minutos ? opciones.minutos * 60 : 0, fin: null,
      origen: vista === "test" || vista === "resultado" ? (sesion && sesion.origen) || "inicio" : vista
    };
    vista = "test";
    if (sesion.limite) reloj = setInterval(tic, 1000);
    pintar();
    window.scrollTo(0, 0);
  }
  function tic() {
    if (!sesion || sesion.fin) return pararReloj();
    var el = document.getElementById("ldl-crono");
    var resta = sesion.limite - Math.floor((Date.now() - sesion.inicio) / 1000);
    if (resta <= 0) { terminar(); return; }
    if (el) el.textContent = mmss(resta);
  }
  function pararReloj() { if (reloj) { clearInterval(reloj); reloj = null; } }
  function mmss(s) { var m = Math.floor(s / 60), r = s % 60; return m + ":" + (r < 10 ? "0" : "") + r; }

  function responder(letra) {
    var id = sesion.ids[sesion.i];
    if (sesion.tipo === "simulacro") {
      sesion.resp[id] = sesion.resp[id] === letra ? undefined : letra;
      pintar();
      return;
    }
    if (sesion.corregida[id]) return;
    sesion.resp[id] = letra;
    sesion.corregida[id] = true;
    registrar(id, letra === POR_ID[id].correcta);
    pintar();
  }
  function siguiente() {
    if (sesion.i < sesion.ids.length - 1) { sesion.i++; pintar(); window.scrollTo(0, 0); }
    else terminar();
  }
  function anterior() { if (sesion.i > 0) { sesion.i--; pintar(); } }
  function terminar() {
    pararReloj();
    if (sesion.tipo === "simulacro") {
      sesion.ids.forEach(function (id) {
        if (sesion.resp[id]) registrar(id, sesion.resp[id] === POR_ID[id].correcta);
      });
    }
    sesion.fin = Date.now();
    var r = calcular(sesion);
    prog.h.unshift({ t: sesion.fin, tipo: sesion.tipo, n: r.total, a: r.aciertos, e: r.errores, nota: r.nota });
    prog.h = prog.h.slice(0, 50);
    guardar();
    vista = "resultado";
    pintar();
    window.scrollTo(0, 0);
  }
  function calcular(s) {
    var a = 0, e = 0, nr = 0;
    s.ids.forEach(function (id) {
      var r = s.resp[id];
      if (!r) nr++; else if (r === POR_ID[id].correcta) a++; else e++;
    });
    var pen = (CFG.simulacro && CFG.simulacro.penalizacion) || 1 / 3;
    var neta = s.tipo === "simulacro" ? a - e * pen : a;
    var nota = Math.max(0, (neta / s.ids.length) * 10);
    return { total: s.ids.length, aciertos: a, errores: e, blancos: nr, neta: neta, nota: Math.round(nota * 100) / 100 };
  }

  /* ---------- vistas ---------- */
  function cabecera() {
    var tema = aplicarTema();
    var etiquetas = { auto: "Tema: auto", light: "Tema: claro", dark: "Tema: oscuro" };
    return '<header class="ldl-top"><a class="ldl-brand" href="' + esc(CFG.web || "#") + '">' +
      '<span class="ldl-logo" aria-hidden="true">§</span><span><b>Letra de Ley</b><small>' +
      esc(CFG.pack.nombre) + "</small></span></a>" +
      '<button class="ldl-tema" data-acc="tema" type="button">' + etiquetas[tema] + "</button></header>";
  }
  function navegacion() {
    if (CFG.modo === "web") return "";
    var items = [["inicio", "Inicio"], ["temas", "Por temas"], ["simulacro", "Simulacro"], ["fallos", "Fallos"], ["stats", "Estadísticas"]];
    return '<nav class="ldl-nav" aria-label="Secciones">' + items.map(function (it) {
      var actual = vista === it[0] || (vista === "test" && sesion && sesion.origen === it[0]);
      return '<button type="button" data-acc="ir" data-v="' + it[0] + '"' + (actual ? ' aria-current="page"' : "") + ">" + it[1] + "</button>";
    }).join("") + "</nav>";
  }
  function pie() {
    return '<p class="ldl-pie">Letra de Ley · ' + esc(CFG.pack.edicion) + " · Texto legal actualizado a " +
      esc(CFG.pack.actualizado) + "<br>Uso personal. Prohibida su redistribución.</p>";
  }

  function vInicio() {
    var r = resumen(B.preguntas), f = fallosPendientes().length;
    return '<section class="ldl-card"><h2>' + esc(CFG.pack.nombre) + "</h2>" +
      '<p class="ldl-muted">' + B.preguntas.length + " preguntas comentadas, con el artículo exacto de cada respuesta.</p>" +
      '<div class="ldl-kpis"><div class="ldl-kpi"><b>' + r.vistas + "/" + r.total + "</b><span>respondidas</span></div>" +
      '<div class="ldl-kpi"><b>' + r.acierto + ' %</b><span>de acierto</span></div>' +
      '<div class="ldl-kpi"><b>' + f + "</b><span>fallos por repasar</span></div></div>" +
      '<div class="ldl-acciones"><button class="ldl-btn" data-acc="rapido" type="button">Test rápido de 20</button>' +
      '<button class="ldl-btn sec" data-acc="ir" data-v="simulacro" type="button">Simulacro de examen</button>' +
      (f ? '<button class="ldl-btn sec" data-acc="repasar" type="button">Repasar ' + f + " fallos</button>" : "") +
      "</div></section>" +
      '<section class="ldl-card"><h3>Cómo sacarle partido</h3><ol class="ldl-muted">' +
      "<li>Practica <b>por temas</b>: cada respuesta te enseña el artículo y por qué fallan las demás opciones.</li>" +
      "<li>Cada pocos días, <b>repasa tus fallos</b>: es donde más se aprende.</li>" +
      "<li>Antes del examen, haz <b>simulacros</b> con tiempo y con la penalización real (cada error resta 1/3).</li></ol>" +
      '<p class="ldl-small ldl-muted">Tu progreso se guarda en este dispositivo y en este navegador.</p></section>' + historial();
  }
  function historial() {
    if (!prog.h.length) return "";
    return '<section class="ldl-card"><h3>Últimos tests</h3><ul class="ldl-revision">' + prog.h.slice(0, 5).map(function (h) {
      var d = new Date(h.t);
      return "<li><b>" + (h.tipo === "simulacro" ? "Simulacro" : "Práctica") + "</b> · " + d.toLocaleDateString("es-ES") +
        " · " + h.a + "/" + h.n + " aciertos" + (h.tipo === "simulacro" ? " · nota " + num(h.nota) : "") + "</li>";
    }).join("") + "</ul></section>";
  }
  function vTemas() {
    var html = '<section class="ldl-card"><h2>Practicar por temas</h2><p class="ldl-muted">Elige un bloque. Las preguntas salen en orden aleatorio y se corrigen al momento.</p><ul class="ldl-bloques">';
    B.bloques.forEach(function (b) {
      var lista = delBloque(b.id), r = resumen(lista);
      html += '<li><button type="button" data-acc="bloque" data-id="' + esc(b.id) + '"><span class="t">' + esc(b.nombre) +
        '</span><span class="n">' + r.vistas + "/" + r.total + (r.vistas ? " · " + r.acierto + " %" : "") + "</span>" +
        '<span class="ldl-barra"><i style="width:' + pct(r.vistas, r.total) + '%"></i></span></button></li>';
    });
    return html + "</ul></section>";
  }
  function vSimulacro() {
    var total = B.preguntas.length;
    var opcionesN = [10, 20, 30, 50, 100].filter(function (n) { return n < total; });
    opcionesN.push(total);
    var porDefecto = Math.min((CFG.simulacro && CFG.simulacro.preguntas) || 30, total);
    return '<section class="ldl-card"><h2>Simulacro de examen</h2>' +
      '<p class="ldl-muted">Como el día del examen: no ves las soluciones hasta el final y cada error resta un tercio de acierto.</p>' +
      '<div class="ldl-campo"><label for="ldl-n">Número de preguntas</label><select id="ldl-n">' +
      opcionesN.map(function (n) { return "<option" + (n === porDefecto ? " selected" : "") + ">" + n + "</option>"; }).join("") +
      '</select></div><div class="ldl-campo"><label for="ldl-t">Tiempo</label><select id="ldl-t">' +
      '<option value="1">1 minuto por pregunta</option><option value="0">Sin límite de tiempo</option></select></div>' +
      '<div class="ldl-campo"><label for="ldl-b">Temas</label><select id="ldl-b"><option value="">Todos</option>' +
      B.bloques.map(function (b) { return '<option value="' + esc(b.id) + '">' + esc(b.nombre) + "</option>"; }).join("") +
      '</select></div><div class="ldl-acciones"><button class="ldl-btn" data-acc="simular" type="button">Empezar simulacro</button></div></section>';
  }
  function vFallos() {
    var f = fallosPendientes();
    if (!f.length) {
      return '<section class="ldl-card"><h2>Repaso de fallos</h2><p class="ldl-muted">No tienes fallos pendientes. Cuando falles una pregunta aparecerá aquí hasta que la aciertes.</p></section>';
    }
    return '<section class="ldl-card"><h2>Repaso de fallos</h2><p class="ldl-muted">Tienes <b>' + f.length +
      "</b> preguntas falladas. Salen de aquí en cuanto las aciertas.</p>" +
      '<div class="ldl-acciones"><button class="ldl-btn" data-acc="repasar" type="button">Repasar ahora</button></div></section>';
  }
  function vStats() {
    var html = '<section class="ldl-card"><h2>Estadísticas</h2><ul class="ldl-bloques">';
    B.bloques.forEach(function (b) {
      var r = resumen(delBloque(b.id));
      html += '<li><button type="button" data-acc="bloque" data-id="' + esc(b.id) + '"><span class="t">' + esc(b.nombre) +
        '</span><span class="n">' + (r.vistas ? r.acierto + " % de acierto" : "sin empezar") + '</span><span class="ldl-barra"><i style="width:' +
        r.acierto + '%"></i></span></button></li>';
    });
    html += '</ul></section><section class="ldl-card"><h3>Empezar de cero</h3><p class="ldl-muted ldl-small">Borra tu progreso guardado en este dispositivo.</p>' +
      '<div class="ldl-acciones"><button class="ldl-btn sec" data-acc="borrar" type="button">Borrar mi progreso</button></div></section>';
    return html;
  }
  function vPortada() {
    var n = B.preguntas.length;
    return '<section class="ldl-card"><h2>' + esc(CFG.pack.nombre) + "</h2>" +
      '<p class="ldl-muted">' + n + " preguntas tipo examen, corregidas al momento, con el artículo exacto y la explicación de cada opción. Gratis y sin registrarte.</p>" +
      '<div class="ldl-acciones"><button class="ldl-btn" data-acc="empezarweb" type="button">Empezar el test</button></div></section>';
  }

  function vTest() {
    var id = sesion.ids[sesion.i], p = POR_ID[id], sim = sesion.tipo === "simulacro";
    var elegida = sesion.resp[id], corregida = !sim && sesion.corregida[id];
    var html = '<section class="ldl-card"><div class="ldl-meta"><span>' + esc(sesion.titulo) + " · " + (sesion.i + 1) + " de " + sesion.ids.length +
      "</span><span>" + (sesion.limite ? '⏱ <span id="ldl-crono" class="ldl-crono">' +
        mmss(Math.max(0, sesion.limite - Math.floor((Date.now() - sesion.inicio) / 1000))) + "</span>" : esc(p.articulo_txt)) +
      '</span></div><div class="ldl-progreso"><i style="width:' + pct(sesion.i + (corregida ? 1 : 0), sesion.ids.length) + '%"></i></div>' +
      '<p class="ldl-enunciado">' + esc(p.enunciado) + '</p><div class="ldl-opciones" role="group" aria-label="Opciones">';
    LETRAS.forEach(function (l) {
      var cls = "ldl-op";
      if (corregida) { if (l === p.correcta) cls += " ok"; else if (l === elegida) cls += " ko"; }
      else if (sim && elegida === l) cls += " marcada";
      html += '<button type="button" class="' + cls + '" data-acc="resp" data-l="' + l + '"' + (corregida ? " disabled" : "") +
        (sim ? ' aria-pressed="' + (elegida === l) + '"' : "") + '><span class="l">' + l + ")</span><span>" + esc(p.opciones[l]) + "</span></button>";
    });
    html += "</div>";
    if (corregida) html += feedback(p, elegida);
    html += '<div class="ldl-acciones">';
    if (sim) {
      html += (sesion.i > 0 ? '<button class="ldl-btn sec" data-acc="ant" type="button">Anterior</button>' : "") +
        '<button class="ldl-btn" data-acc="sig" type="button">' + (sesion.i < sesion.ids.length - 1 ? "Siguiente" : "Entregar") + "</button>" +
        (sesion.i < sesion.ids.length - 1 ? '<button class="ldl-btn sec" data-acc="entregar" type="button">Entregar ya</button>' : "");
    } else if (corregida) {
      html += '<button class="ldl-btn" data-acc="sig" type="button">' + (sesion.i < sesion.ids.length - 1 ? "Siguiente" : "Ver resultado") + "</button>";
    }
    html += '<button class="ldl-btn sec" data-acc="salir" type="button">Salir</button></div></section>';
    return html;
  }
  function feedback(p, elegida) {
    var bien = elegida === p.correcta;
    return '<div class="ldl-feedback" aria-live="polite"><div class="v ' + (bien ? "ok" : "ko") + '">' +
      (bien ? "¡Correcta!" : "Incorrecta. La respuesta correcta es la " + p.correcta + ")") + "</div><div>" + esc(p.explicacion) + "</div>" +
      (p.cita ? '<blockquote class="ldl-cita">' + esc(p.cita) + "<small>" + esc(p.articulo_txt) + "</small></blockquote>" : "") + "</div>";
  }
  function vResultado() {
    var r = calcular(sesion), sim = sesion.tipo === "simulacro";
    var html = '<section class="ldl-card"><h2>' + (sim ? "Resultado del simulacro" : "Resultado") + "</h2>" +
      '<div class="ldl-nota">' + (sim ? num(r.nota.toFixed(2)) : r.aciertos + "/" + r.total) + "</div>" +
      '<p class="ldl-muted">' + plural(r.aciertos, "acierto", "aciertos") + " · " + plural(r.errores, "error", "errores") +
      (r.blancos ? " · " + r.blancos + " en blanco" : "") +
      (sim ? " · nota sobre 10 con penalización" : "") + "</p>";
    if (CFG.modo === "web") html += ctaWeb(r);
    html += '<div class="ldl-acciones">' + (CFG.modo === "web" ? '<button class="ldl-btn sec" data-acc="empezarweb" type="button">Repetir con otro orden</button>' :
      '<button class="ldl-btn" data-acc="ir" data-v="inicio" type="button">Volver al inicio</button>') + "</div></section>";
    html += '<section class="ldl-card"><h3>Revisión</h3><ul class="ldl-revision">';
    sesion.ids.forEach(function (id, n) {
      var p = POR_ID[id], e = sesion.resp[id], chip = !e ? '<span class="ldl-chip nr">En blanco</span>' :
        e === p.correcta ? '<span class="ldl-chip ok">Bien</span>' : '<span class="ldl-chip ko">Mal</span>';
      html += "<li>" + chip + '<span class="e">' + (n + 1) + ". " + esc(p.enunciado) + "</span><br>" +
        '<span class="ldl-small">Correcta: <b>' + p.correcta + ") " + esc(p.opciones[p.correcta]) + "</b>" +
        (e && e !== p.correcta ? " · Marcaste " + e + ")" : "") + '</span><br><span class="ldl-small ldl-muted">' + esc(p.explicacion) + "</span></li>";
    });
    return html + "</ul></section>";
  }
  function ctaWeb() {
    var c = CFG.compra || {}, html = "";
    if (c.url) {
      html += '<div class="ldl-card ldl-cta"><h3>' + esc(c.titulo) + '</h3><p class="ldl-muted">' + esc(c.texto) + "</p>" +
        '<div class="ldl-acciones"><a class="ldl-btn acc" href="' + esc(c.url) + '">' + esc(c.boton) + "</a></div></div>";
    }
    if (CFG.telegram) {
      html += '<p class="ldl-small">¿Quieres un test cada día? <a href="' + esc(CFG.telegram) + '">Únete gratis al canal de Telegram</a>.</p>';
    }
    return html;
  }

  function pintar() {
    var cuerpo;
    if (vista === "test") cuerpo = vTest();
    else if (vista === "resultado") cuerpo = vResultado();
    else if (vista === "portada") cuerpo = vPortada();
    else if (vista === "temas") cuerpo = vTemas();
    else if (vista === "simulacro") cuerpo = vSimulacro();
    else if (vista === "fallos") cuerpo = vFallos();
    else if (vista === "stats") cuerpo = vStats();
    else cuerpo = vInicio();
    raiz.innerHTML = '<div class="ldl">' + cabecera() + navegacion() + "<main>" + cuerpo + "</main>" + pie() + "</div>";
  }

  /* ---------- eventos ---------- */
  raiz.addEventListener("click", function (ev) {
    var el = ev.target.closest("[data-acc]");
    if (!el) return;
    var acc = el.getAttribute("data-acc");
    if (acc === "tema") return cambiarTema();
    if (acc === "ir") { pararReloj(); vista = el.getAttribute("data-v"); sesion = null; pintar(); return; }
    if (acc === "rapido") return empezar("practica", barajar(B.preguntas).slice(0, 20), { titulo: "Test rápido" });
    if (acc === "repasar") return empezar("practica", barajar(fallosPendientes()).slice(0, 30), { titulo: "Repaso de fallos" });
    if (acc === "bloque") {
      var b = B.bloques.filter(function (x) { return x.id === el.getAttribute("data-id"); })[0];
      return empezar("practica", barajar(delBloque(b.id)), { titulo: b.nombre });
    }
    if (acc === "simular") {
      var n = parseInt(document.getElementById("ldl-n").value, 10);
      var conTiempo = document.getElementById("ldl-t").value === "1";
      var bloque = document.getElementById("ldl-b").value;
      var fuente = bloque ? delBloque(bloque) : B.preguntas;
      var elegidas = barajar(fuente).slice(0, n);
      return empezar("simulacro", elegidas, { titulo: "Simulacro", minutos: conTiempo ? elegidas.length : 0 });
    }
    if (acc === "empezarweb") return empezar("practica", barajar(B.preguntas), { titulo: "Test gratuito" });
    if (acc === "resp") return responder(el.getAttribute("data-l"));
    if (acc === "sig") return siguiente();
    if (acc === "ant") return anterior();
    if (acc === "entregar") return terminar();
    if (acc === "salir") { pararReloj(); sesion = null; vista = CFG.modo === "web" ? "portada" : "inicio"; pintar(); return; }
    if (acc === "borrar") {
      if (el.getAttribute("data-confirmar") === "1") { prog = { p: {}, h: [] }; guardar(); pintar(); }
      else { el.setAttribute("data-confirmar", "1"); el.textContent = "Pulsa otra vez para confirmar"; }
    }
  });
  document.addEventListener("keydown", function (ev) {
    if (vista !== "test" || !sesion || ev.altKey || ev.ctrlKey || ev.metaKey) return;
    var k = ev.key.toLowerCase(), mapa = { "1": "a", "2": "b", "3": "c", "4": "d", a: "a", b: "b", c: "c", d: "d" };
    if (mapa[k]) { ev.preventDefault(); responder(mapa[k]); }
    else if (k === "enter" || k === "arrowright") {
      var id = sesion.ids[sesion.i];
      if (sesion.tipo === "simulacro" || sesion.corregida[id]) { ev.preventDefault(); siguiente(); }
    } else if (k === "arrowleft" && sesion.tipo === "simulacro") { ev.preventDefault(); anterior(); }
  });

  pintar();
})();
</script>
</body>
</html>
