  --bg: #0e1320; --surface: #161d2e; --surface-2: #1d2639; --ink: #e8ecf6; --text: #e6e7ea;

}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text); font: 16px/1.55 var(--sans);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
.ldl { max-width: 760px; margin: 0 auto; padding: 16px 16px 48px; }
.ldl a { color: var(--primary); }
.ldl :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 8px; }

/* Cabecera */
.ldl-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.ldl-brand { display: flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; }
.ldl-logo {

.ldl-tema {
  border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 999px;
  padding: 6px 12px; font: 13px var(--sans); cursor: pointer;
}

.ldl-nav { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 16px; scrollbar-width: none; }
.ldl-nav button {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface); color: var(--text);
  border-radius: 999px; padding: 8px 14px; font: 600 14px var(--sans); cursor: pointer;
}
.ldl-nav button[aria-current="page"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* Tarjetas */
.ldl-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; margin-bottom: 14px; }
.ldl-card h2 { font: 700 22px/1.25 var(--serif); color: var(--ink); margin: 0 0 8px; }

.ldl-opciones { display: grid; gap: 10px; }
.ldl-op {
  display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start; text-align: left; width: 100%;

  color: var(--text); font: 16px/1.45 var(--sans);

.ldl-op .l {

.ldl-op.ok { border-color: var(--ok); background: var(--ok-bg); }

.ldl-op.ko { border-color: var(--ko); background: var(--ko-bg); }

.ldl-op.marcada { border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); }
.ldl-feedback { margin-top: 16px; border-radius: 12px; padding: 14px 16px; background: var(--surface-2); }
.ldl-feedback .v { font-weight: 700; margin-bottom: 6px; }
.ldl-feedback .v.ok { color: var(--ok); }
.ldl-feedback .v.ko { color: var(--ko); }
.ldl-cita { margin: 10px 0 0; padding: 10px 12px; border-left: 3px solid var(--accent); background: var(--surface); border-radius: 0 8px 8px 0; font: italic 15px/1.5 var(--serif); }
.ldl-cita small { display: block; font: 600 12px var(--sans); font-style: normal; color: var(--muted); margin-top: 6px; }

.ldl-nota { font: 800 54px/1 var(--sans); color: var(--ink); font-variant-numeric: tabular-nums; }

.ldl-revision .e { font-weight: 600; color: var(--ink); }
.ldl-chip { display: inline-block; font: 700 12px var(--sans); border-radius: 999px; padding: 2px 8px; margin-right: 6px; }
.ldl-chip.ok { background: var(--ok-bg); color: var(--ok); }
.ldl-chip.ko { background: var(--ko-bg); color: var(--ko); }
.ldl-chip.nr { background: var(--surface-2); color: var(--muted); }

/* Formularios */
.ldl-campo { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; margin: 10px 0; }
.ldl-campo label { font-weight: 600; font-size: 14px; }
.ldl-campo select, .ldl-campo input {
  font: 16px var(--sans); padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface); color: var(--text); width: 100%; max-width: 100%; min-width: 0; text-overflow: ellipsis;
}
.ldl-cta { border: 2px solid var(--accent); }
.ldl-pie { text-align: center; color: var(--muted); font-size: 12px; margin-top: 24px; }
.ldl-crono { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--ink); }

@media (max-width: 480px) {
  .ldl-enunciado { font-size: 17px; }
  .ldl-kpi b { font-size: 20px; }
  .ldl-nota { font-size: 44px; }
}
@media print { .ldl-nav, .ldl-tema, .ldl-acciones { display: none; } }
</style>

ciones"},{"id":"L19|Título II. Buen gobierno","ley":"L19","nombre":"Título II. Buen gobierno"},{"id":"L19|Título III. Consejo de Transparencia y Buen Gobierno","ley":"L19","nombre":"Título III. Consejo de Transparencia y Buen Gobierno"},{"id":"L19|Disposiciones adicionales","ley":"L19","nombre":"Disposiciones adicionales"},{"id":"L19|Disposiciones finales","ley":"L19","nombre":"Disposiciones finales"}],"preguntas":[{"id":"L19-L1-002","ley":"L19","articulo":"1","articulo_txt":"Art. 1 Ley 19/2013","bloque_id":"L19|Título Preliminar","enunciado":"Según el artículo 1 de la Ley 19/2013, además de lo relativo a la transparencia y al derecho de acceso a la información, la Ley tiene por objeto establecer las obligaciones de buen gobierno que deben cumplir:","opciones":{"a":"Los responsables públicos, así como las consecuencias derivadas de su incumplimiento.","b":"Los empleados públicos, así como el procedimiento para exigir su responsabilidad patrimonial.","c":"Los cargos electos de las Entidades Locales, así como el régimen de sus incompatibilidades.","d":"Los funcionarios de carrera, así como las sanciones disciplinarias derivadas de su incumplimiento."},"correcta":"a","explicacion":"El art. 1 se refiere a «las obligaciones de buen gobierno que deben cumplir los responsables públicos así como las consecuencias derivadas de su incumplimiento»; es la opción a). Las opciones b), c) y d) cambian los destinatarios de esas obligaciones y añaden contenidos que el art. 1 no menciona.","cita":"«Esta Ley tiene por objeto ampliar y reforzar la transparencia de la actividad pública, regular y garantizar el derecho de acceso a la información relativa a aquella actividad y establecer las obligaciones de buen gobierno que deben cumplir los responsables públicos así como las consecuencias derivadas de su incumplimiento.»","dificultad":1},{"id":"L19-L1-001","ley":"L19","articulo":"1","articulo_txt":"Art. 1 Ley 19/2013","bloque_id":"L19|Título Preliminar","enunciado":"Según el artículo 1 de la Ley 19/2013, en relación con la transparencia de la actividad pública, la Ley tiene por objeto:","opciones":{"a":"Regularla y garantizarla.","b":"Declararla y promoverla.","c":"Fomentarla y supervisarla.","d":"Ampliarla y reforzarla."},"correcta":"d","explicacion":"El art. 1 señala como objeto «ampliar y reforzar la transparencia de la actividad pública»; es la opción d). La opción a) toma los verbos que el art. 1 aplica al derecho de acceso a la información («regular y garantizar»), no a la transparencia. Las opciones b) y c) emplean verbos que el art. 1 no utiliza.","cita":"«Esta Ley tiene por objeto ampliar y reforzar la transparencia de la actividad pública, regular y garantizar el derecho de acceso a la información relativa a aquella actividad y establecer las obligaciones de buen gobierno que deben cumplir los responsables públicos así como las consecuencias derivadas de su incumplimiento.»","dificultad":1},{"id":"L19-L1-007","ley":"L19","articulo":"2.1.f)","articulo_txt":"Art. 2.1.f) Ley 19/2013","bloque_id":"L19|Título I. Transparencia de la actividad pública · Capítulo I. Ámbito subjetivo de aplicación","enunciado":"¿Cuál de los siguientes NO figura entre los órganos e instituciones que enumera expresamente el artículo 2.1.f) de la Ley 19/2013?","opciones":{"a":"El Consejo General del Poder Judicial.","b":"El Banco de España.","c":"El Consejo Económico y Social.","d":"El Tribunal Supremo."},"correcta":"d","explicacion":"El Tribunal Supremo no aparece en el art. 2.1.f); es la opción d). Las opciones a), b) y c) figuran en la enumeración del art. 2.1.f), junto a la Casa de Su Majestad el Rey, el Congreso de los Diputados, el Senado, el Tribunal Constitucional, el Consejo de Estado, el Defensor del Pueblo, el Tribunal de Cuentas y las instituciones autonómicas análogas.","cita":"«f) La Casa de su Majestad el Rey, el Congreso de los Diputados, el Senado, el Tribunal Constitucional y el Consejo General del Poder Judicial, así como el Banco de España, el Consejo de Estado, el Defensor del Pueblo, el Tribunal de Cuentas, el Consejo Económico y Social y las instituciones autonómicas análogas, en relación con sus actividades sujetas a Derecho Administrativo.»","dificultad":2},{"id":"L19-L1-013","ley":"L19","articulo":"3.b)","articulo_txt":"Art. 3.b) Ley 19/2013","bloque_id":"L19|Título I. Transparencia de la actividad pública · Capítulo I. Ámbito subjetivo de aplicación","enunciado":"Según el artículo 3.b) de la Ley 19/2013, una entidad privada que no supere el umbral anual de ayudas o subvenciones previsto en ese precepto queda igualmente obligada cuando una parte del total de sus ingresos anuales tenga carácter de ayuda o subvención pública. ¿Qué proporción y qué cantidad mínima se exigen?","opciones":{"a":"Al menos el 30 % de sus ingresos anuales, siempre que alcancen como mínimo 5.000 euros.","b":"Al menos el 40 % de sus ingresos anuales, siempre que alcancen como mínimo 5.000 euros.","c":"Al menos el 40 % de sus ingresos anuales, siempre que alcancen como mínimo 10.000 euros.","d":"Al menos el 25 % de sus ingresos anuales, siempre que alcancen como mínimo 3.000 euros."},"correcta":"b","explicacion":"El art. 3.b) se refiere al supuesto en que «al menos el 40 % del total de sus ingresos anuales tengan carácter de ayuda o subvención pública, siempre que alcancen como mínimo la cantidad de 5.000 euros»; es la opción b). Las opciones a) y d) alteran el porcentaje, y la última también la cantidad mínima. La opción c) mantiene el porcentaje pero eleva la cantidad mínima.","cita":"«b) Las entidades privadas que perciban durante el período de un año ayudas o subvenciones públicas en una cuantía superior a 100.000 euros o cuando al menos el 40 % del total de sus ingresos anuales tengan carácter de ayuda o subvención pública, siempre que alcancen como mínimo la cantidad de 5.000 euros.»","dificultad":2},{"id":"L19-L1-011","ley":"L19","articulo":"3","articulo_txt":"Art. 3 Ley 19/2013","bloque_id":"L19|Título I. Transparencia de la actividad pública · Capítulo I. Ámbito subjetivo de aplicación","enunciado":"Según el artículo 3 de la Ley 19/2013, a los partidos políticos, organizaciones sindicales y organizaciones empresariales les son aplicables:","opciones":{"a":"Todas las disposiciones del título I, en los mismos términos que a las Administraciones Públicas.","b":"Únicamente las disposiciones del título II, relativas al buen gobierno.","c":"Únicamente las disposiciones del capítulo III del título I, relativas al derecho de acceso.","d":"Las disposiciones del capítulo II del título I, relativas a la publicidad activa."},"correcta":"d","explicacion":"El art. 3 dispone que «Las disposiciones del capítulo II de este título serán también aplicables» a los sujetos que enumera, entre ellos los de la letra a); el capítulo II del título I regula la publicidad activa. Es la opción d). Las opciones a), b) y c) no se corresponden con la remisión que hace el art. 3, que se limita al capítulo II del título I.","cita":"«Las disposiciones del capítulo II de este título serán también aplicables a: a) Los partidos políticos, organizaciones sindicales y organizaciones empresariales.»","dificultad":2},{"id":"L19-L1-012","ley":"L19","articulo":"3.b)","articulo_txt":"Art. 3.b) Ley 19/2013","bloque_id":"L19|Título I. Transparencia de la actividad pública · Capítulo I. Ámbito subjetivo de aplicación","enunciado":"Según el artículo 3.b) de la Ley 19/2013, se incluyen entre los otros sujetos obligados las entidades privadas que perciban durante el período de un año ayudas o subvenciones públicas en una cuantía:","opciones":{"a":"Superior a 60.000 euros.","b":"Superior a 100.000 euros.","c":"Igual o superior a 150.000 euros.","d":"Igual o superior a 200.000 euros."},"correcta":"b","explicacion":"El art. 3.b) fija el umbral en una cuantía «superior a 100.000 euros» durante el período de un año; es la opción b). Las opciones a), c) y d) indican cuantías que el art. 3.b) no recoge.","cita":"«b) Las entidades privadas que perciban durante el período de un año ayudas o subvenciones públicas en una cuantía superior a 100.000 euros o cuando al menos el 40 % del total de sus ingresos anuales tengan carácter de ayuda o subvención pública, siempre que alcancen como mínimo la cantidad de 5.000 euros.»","dificultad":1},{"id":"L19-L1-034","ley":"L19","articulo":"8.1.c)","articulo_txt":"Art. 8.1.c) Ley 19/2013","bloque_id":"L19|Título I. Transparencia de la actividad pública · Capítulo II. Publicidad activa","enunciado":"Según el artículo 8.1.c) de la Ley 19/2013, las subvenciones y ayudas públicas concedidas se publicarán con indicación de:","opciones":{"a":"Su importe y beneficiarios, salvo que estos sean personas físicas.","b":"Su objetivo o finalidad y el órgano concedente, sin identificar a los beneficiarios.","c":"Su importe global por programa, sin desglose por beneficiarios.","d":"Su importe, objetivo o finalidad y beneficiarios."},"correcta":"d","explicacion":"El art. 8.1.c) exige publicarlas «con indicación de su importe, objetivo o finalidad y beneficiarios»; es la opción d). Las opciones a), b) y c) omiten alguno de esos datos o introducen excepciones que el art. 8.1.c) no recoge.","cita":"«c) Las subvenciones y ayudas públicas concedidas con indicación de su importe, objetivo o finalidad y beneficiarios.»","dificultad":1},{"id":"L19-L1-043","ley":"L19","articulo":"9.3","articulo_txt":"Art. 9.3 Ley 19/2013","bloque_id":"L19|Título I. Transparencia de la actividad pública · Capítulo II. Publicidad activa","enunciado":"Según el artículo 9.3 de la Ley 19/2013, el incumplimiento reiterado de las obligaciones de publicidad activa reguladas en el capítulo II del título I tendrá la consideración de:","opciones":{"a":"Infracción muy grave.","b":"Infracción grave.","c":"Infracción leve.","d":"Infracción grave solo si es reiterado durante más de dos ejercicios."},"correcta":"b","explicacion":"El art. 9.3 califica el incumplimiento reiterado como «infracción grave» a los efectos de aplicar a sus responsables el régimen disciplinario previsto en la correspondiente normativa reguladora; es la opción b). Las opciones a) y c) asignan una calificación distinta de la que establece el art. 9.3. La opción d) añade un requisito temporal que el art. 9.3 no prevé.","cita":"«3. El incumplimiento reiterado de las obligaciones de publicidad activa reguladas en este capítulo tendrá la consideración de infracción grave a los efectos de aplicación a sus responsables del régimen disciplinario previsto en la correspondiente normativa reguladora.»","dificultad":1},{"id":"L19-L1-046","ley":"L19","articulo":"10.3","articulo_txt":"Art. 10.3 Ley 19/2013","bloque_id":"L19|Título I. Transparencia de la actividad pública · Capítulo II. Publicidad activa","enunciado":"Según el artículo 10.3 de la Ley 19/2013, para el cumplimiento de las obligaciones de transparencia del capítulo II del título I, la Administración General del Estado, las Administraciones de las Comunidades Autónomas y de las Ciudades de Ceuta y Melilla y las entidades que integran la Administración Local:","opciones":{"a":"Podrán adoptar otras medidas complementarias y de colaboración.","b":"Deberán integrar toda su información en un único portal estatal.","c":"Deberán suscribir un convenio anual de colaboración entre todas ellas.","d":"Podrán delegar sus obligaciones en las entidades sin ánimo de lucro."},"correcta":"a","explicacion":"El art. 10.3 dispone que esas Administraciones «podrán adoptar otras medidas complementarias y de colaboración para el cumplimiento de las obligaciones de transparencia recogidas en este capítulo»; es la opción a). Las opciones b) y c) convierten en deber unas medidas que el art. 10.3 configura como facultativas y les dan un contenido que no prevé. La opción d) contempla una delegación que el art. 10.3 no prevé.","cita":"«3. La Administración General del Estado, las Administraciones de las Comunidades Autónomas y de las Ciudades de Ceuta y Melilla y las entidades que integran la Administración Local podrán adoptar otras medidas complementarias y de colaboración para el cumplimiento de las obligaciones de transparencia recogidas en este capítulo.»","dificultad":2},{"id":"L19-L1-048","ley":"L19","articulo":"11.b)","articulo_txt":"Art. 11.b) Ley 19/2013","bloque_id":"L19|Título I. Transparencia de la actividad pública · Capítulo II. Publicidad activa","enunciado":"Según el artículo 11.b) de la Ley 19/2013, la información publicada en el Portal de la Transparencia será conforme:","opciones":{"a":"Al Esquema Nacional de Seguridad y a las guías de seguridad que lo desarrollan.","b":"A las normas técnicas que apruebe el Consejo de Transparencia y Buen Gobierno.","c":"Al Esquema Nacional de Interoperabilidad y a las normas técnicas de interoperabilidad.","d":"A las normas de la Organización Internacional de Normalización sobre gestión documental."},"correcta":"c","explicacion":"El art. 11.b) dispone que la información publicada «será conforme al Esquema Nacional de Interoperabilidad, aprobado por el Real Decreto 4/2010, de 8 enero, así como a las normas técnicas de interoperabilidad»; es la opción c). Las opciones a), b) y d) remiten a normas que el art. 11.b) no menciona.","cita":"«b) Interoperabilidad: la información publicada será conforme al Esquema Nacional de Interoperabilidad, aprobado por el Real Decreto 4/2010, de 8 enero, así como a las normas técnicas de interoperabilidad.»","dificultad":2},{"id":"L19-L2-004","ley":"L19","articulo":"14.1.g","articulo_txt":"Art. 14.1.g Ley 19/2013","bloque_id":"L19|Título I. Transparencia de la actividad pública · Capítulo III. Derecho de acceso a la información pública · Sección 1.ª Régimen general","enunciado":"Según el artículo 14.1 de la Ley 19/2013, el derecho de acceso podrá ser limitado cuando acceder a la información suponga un perjuicio para:","opciones":{"a":"Las funciones administrativas de vigilancia, inspección y control.","b":"Las funciones administrativas de planificación, programación y evaluación.","c":"La eficacia y la celeridad en el funcionamiento de los servicios públicos.","d":"El ejercicio de la potestad reglamentaria y de la iniciativa legislativa."},"correcta":"a","explicacion":"El art. 14.1.g) menciona «Las funciones administrativas de vigilancia, inspección y control»; es la opción a). Las opciones b), c) y d) describen ámbitos que no figuran en la relación del art. 14.1.","cita":"«1. El derecho de acceso podrá ser limitado cuando acceder a la información suponga un perjuicio para: […] g) Las funciones administrativas de vigilancia, inspección y control.»","dificultad":2},{"id":"L19-L2-006","ley":"L19","articulo":"14.2","articulo_txt":"Art. 14.2 Ley 19/2013","bloque_id":"L19|Título I. Transparencia de la actividad pública · Capítulo III. Derecho de acceso a la información pública · Sección 1.ª Régimen general","enunciado":"Según el artículo 14.2 de la Ley 19/2013, la aplicación de los límites al derecho de acceso será justificada y proporcionada a su objeto y finalidad de protección y atenderá a las circunstancias del caso concreto, especialmente a:","opciones":{"a":"La condición de interesado del solicitante en un procedimiento administrativo en curso.","b":"La concurrencia de un interés público o privado superior que justifique el acceso.","c":"El coste que para el órgano suponga la búsqueda y la entrega de la información.","d":"La naturaleza pública o privada de la persona o entidad que solicite la información."},"correcta":"b","explicacion":"El art. 14.2 ordena atender «especialmente a la concurrencia de un interés público o privado superior que justifique el acceso»; es la opción b). Las opciones a), c) y d) recogen circunstancias que el art. 14.2 no menciona.","cita":"«2. La aplicación de los límites será justificada y proporcionada a su objeto y finalidad de protección y atenderá a las circunstancias del caso concreto, especialmente a la concurrencia de un interés público o privado superior que justifique el acceso.»","dificultad":2},{"id":"L19-L2-009","ley":"L19","articulo":"15.1","articulo_txt":"Art. 15.1 Ley 19/2013","bloque_id":"L19|Título I. Transparencia de la actividad pública · Capítulo III. Derecho de acceso a la información pública · Sección 1.ª Régimen general","enunciado":"Según el artículo 15.1 de la Ley 19/2013, si la información incluyese datos relativos a la comisión de infracciones penales o administrativas que no conllevasen la amonestación pública al infractor, el acceso solo se podrá autorizar:","opciones":{"a":"Si se cuenta con el consentimiento expreso del afectado o si el acceso estuviera amparado por una norma con rango de ley.","b":"Si el órgano competente, previa audiencia del afectado, lo acuerda mediante resolución motivada.","c":"Si han transcurrido los plazos legalmente previstos para la cancelación de los antecedentes penales o administrativos del afectado.","d":"Si lo autoriza previamente la Agencia Española de Protección de Datos, oído el afectado."},"correcta":"a","explicacion":"El segundo párrafo del art. 15.1 dispone que en ese caso «el acceso solo se podrá autorizar en caso de que se cuente con el consentimiento expreso del afectado o si aquel estuviera amparado por una norma con rango de ley»; es la opción a). Las opciones b), c) y d) establecen condiciones que el art. 15.1 no prevé. El apartado 1 del art. 15 tiene la redacción dada por la disposición final 11.2 de la Ley Orgánica 3/2018, de 5 de diciembre.","cita":"«Si la información incluyese datos personales que hagan referencia al origen racial, a la salud o a la vida sexual, incluyese datos genéticos o biométricos o contuviera datos relativos a la comisión de infracciones penales o administrativas que no conllevasen la amonestación pública al infractor, el acceso solo se podrá autorizar en caso de que se cuente con el consentimiento expreso del afectado o si aquel estuviera amparado por una norma con rango de ley.»","dificultad":2},{"id":"L19-L2-011","ley":"L19","articulo":"15.3","articulo_txt":"Art. 15.3 Ley 19/2013","bloque_id":"L19|Título I. Transparencia de la actividad pública · Capítulo III. Derecho de acceso a la información pública · Sección 1.ª Régimen general","enunciado":"Según el artículo 15.3 de la Ley 19/2013, cuando la información solicitada no contuviera datos especialmente protegidos, el órgano al que se dirija la solicitud concederá el acceso:","opciones":{"a":"Previa audiencia de los afectados y conformidad expresa de todos ellos con la divulgación de sus datos.","b":"Previa ponderación suficientemente razonada del interés público en la divulgación y de los derechos de los afectados.","c":"Únicamente si el solicitante acredita un interés legítimo y directo en la información solicitada.","d":"Previo informe favorable de la Agencia Española de Protección de Datos sobre la divulgación."},"correcta":"b","explicacion":"El art. 15.3 exige conceder el acceso «previa ponderación suficientemente razonada del interés público en la divulgación de la información y los derechos de los afectados cuyos datos aparezcan en la información solicitada»; es la opción b). Las opciones a) y d) imponen requisitos que el art. 15.3 no exige. La opción c) es falsa: el art. 17.3 dispensa al solicitante de motivar su solicitud y el art. 15.3 no le exige acreditar interés alguno.","cita":"«3. Cuando la información solicitada no contuviera datos especialmente protegidos, el órgano al que se dirija la solicitud concederá el acceso previa ponderación suficientemente razonada del interés público en la divulgación de la información y los derechos de los afectados cuyos datos aparezcan en la información solicitada, en particular su derecho fundamental a la protección de datos de carácter personal.»","dificultad":2},{"id":"L19-L2-019","ley":"L19","articulo":"18.1.c","articulo_txt":"Art. 18.1.c Ley 19/2013","bloque_id":"L19|Título I. Transparencia de la actividad pública · Capítulo III. Derecho de acceso a la información pública · Sección 2.ª Ejercicio del derecho de acceso a la información pública","enunciado":"Según el artículo 18.1 de la Ley 19/2013, es causa de inadmisión que la solicitud se refiera a información para cuya divulgación sea necesaria:","opciones":{"a":"La autorización previa del tercero al que se refiera.","b":"Una consulta previa al Consejo de Transparencia y Buen Gobierno.","c":"Su traducción previa a una lengua distinta de la original.","d":"Una acción previa de reelaboración."},"correcta":"d","explicacion":"El art. 18.1.c) incluye las solicitudes «Relativas a información para cuya divulgación sea necesaria una acción previa de reelaboración»; es la opción d). Las opciones a), b) y c) describen supuestos que no figuran entre las causas de inadmisión del art. 18.1.","cita":"«1. Se inadmitirán a trámite, mediante resolución motivada, las solicitudes: […] c) Relativas a información para cuya divulgación sea necesaria una acción previa de reelaboración.»","dificultad":1},{"id":"L19-L2-029","ley":"L19","articulo":"20.2","articulo_txt":"Art. 20.2 Ley 19/2013","bloque_id":"L19|Título I. Transparencia de la actividad pública · Capítulo III. Derecho de acceso a la información pública · Sección 2.ª Ejercicio del derecho de acceso a la información pública","enunciado":"Según el artículo 20.2 de la Ley 19/2013, ¿cuál de las siguientes resoluciones en materia de acceso NO figura entre las que deben ser motivadas?","opciones":{"a":"La que deniegue el acceso, total o parcialmente, a la información solicitada.","b":"La que conceda el acceso a través de una modalidad distinta a la solicitada por el interesado.","c":"La que permita el acceso cuando haya habido oposición de un tercero.","d":"La que conceda íntegramente el acceso en la modalidad solicitada, sin oposición de terceros."},"correcta":"d","explicacion":"El art. 20.2 exige motivar las resoluciones que denieguen el acceso, las que concedan el acceso parcial o a través de una modalidad distinta a la solicitada y las que permitan el acceso cuando haya habido oposición de un tercero; no incluye la que concede íntegramente el acceso solicitado, que es la opción d). Las opciones a), b) y c) figuran en el art. 20.2.","cita":"«2. Serán motivadas las resoluciones que denieguen el acceso, las que concedan el acceso parcial o a través de una modalidad distinta a la solicitada y las que permitan el acceso cuando haya habido oposición de un tercero. En este último supuesto, se indicará expresamente al interesado que el acceso sólo tendrá lugar cuando haya transcurrido el plazo del artículo 22.2.»","dificultad":2},{"id":"L19-L2-034","ley":"L19","articulo":"22.1","articulo_txt":"Art. 22.1 Ley 19/2013","bloque_id":"L19|Título I. Transparencia de la actividad pública · Capítulo III. Derecho de acceso a la información pública · Sección 2.ª Ejercicio del derecho de acceso a la información pública","enunciado":"Según el artículo 22.1 de la Ley 19/2013, cuando no pueda darse el acceso a la información en el momento de la notificación de la resolución, deberá otorgarse en un plazo no superior a:","opciones":{"a":"Cinco días.","b":"Tres días.","c":"Veinte días.","d":"Diez días."},"correcta":"d","explicacion":"El art. 22.1 exige que el acceso se otorgue, en ese caso, «en un plazo no superior a diez días»; es la opción d). Las opciones a), b) y c) indican plazos que no figuran en el art. 22.1.","cita":"«1. El acceso a la información se realizará preferentemente por vía electrónica, salvo cuando no sea posible o el solicitante haya señalado expresamente otro medio. Cuando no pueda darse el acceso en el momento de la notificación de la resolución deberá otorgarse, en cualquier caso, en un plazo no superior a diez días.»","dificultad":2},{"id":"L19-L2-035","ley":"L19","articulo":"22.2","articulo_txt":"Art. 22.2 Ley 19/2013","bloque_id":"L19|Título I. Transparencia de la actividad pública · Capítulo III. Derecho de acceso a la información pública · Sección 2.ª Ejercicio del derecho de acceso a la información pública","enunciado":"Según el artículo 22.2 de la Ley 19/2013, si ha existido oposición de tercero, el acceso concedido solo tendrá lugar cuando:","opciones":{"a":"El Consejo de Transparencia y Buen Gobierno haya confirmado la resolución, previa reclamación presentada por el tercero que se opuso al acceso.","b":"Haya transcurrido el plazo para interponer la reclamación ante el Consejo de Transparencia y Buen Gobierno sin que el tercero la haya presentado.","c":"El tercero haya sido oído de nuevo y haya manifestado expresamente su conformidad con la entrega de la información solicitada.","d":"Haya transcurrido el plazo para interponer recurso contencioso-administrativo sin que se haya formalizado o haya sido resuelto confirmando el derecho a recibir la información."},"correcta":"d","explicacion":"El art. 22.2 dispone que el acceso solo tendrá lugar cuando, habiéndose concedido, «haya transcurrido el plazo para interponer recurso contencioso administrativo sin que se haya formalizado o haya sido resuelto confirmando el derecho a recibir la información»; es la opción d). Las opciones a), b) y c) no recogen la condición que fija el art. 22.2.","cita":"«2. Si ha existido oposición de tercero, el acceso sólo tendrá lugar cuando, habiéndose concedido dicho acceso, haya transcurrido el plazo para interponer recurso contencioso administrativo sin que se haya formalizado o haya sido resuelto confirmando el derecho a recibir la información.»","dificultad":3},{"id":"L19-L2-038","ley":"L19","articulo":"23.1","articulo_txt":"Art. 23.1 Ley 19/2013","bloque_id":"L19|Título I. Transparencia de la actividad pública · Capítulo III. Derecho de acceso a la información pública · Sección 3.ª Régimen de impugnaciones","enunciado":"Según el artículo 23.1 de la Ley 19/2013, la reclamación prevista en su artículo 24 tendrá la consideración de:","opciones":{"a":"Sustitutiva de los recursos administrativos.","b":"Previa y obligatoria al recurso de alzada.","c":"Complementaria del recurso de reposición.","d":"Sustitutiva del recurso contencioso-administrativo."},"correcta":"a","explicacion":"El art. 23.1 atribuye a la reclamación «la consideración de sustitutiva de los recursos administrativos»; es la opción a). Las opciones b) y c) presuponen la interposición de recursos administrativos, que la reclamación sustituye. La opción d) es falsa: la reclamación no sustituye la vía contencioso-administrativa. El art. 23.1 se remite al art. 107.2 de la Ley 30/1992, hoy derogada; según la disposición final cuarta de la Ley 39/2015, las referencias a esa ley se entienden hechas a la Ley 39/2015 o a la Ley 40/2015, según corresponda; en materia de recursos, el art. 112.2 de la Ley 39/2015 permite a las leyes sustituir los recursos de alzada y de reposición por otros procedimientos de impugnación o reclamación.","cita":"«1. La reclamación prevista en el artículo siguiente tendrá la consideración de sustitutiva de los recursos administrativos de conformidad con lo dispuesto en el artículo 107.2 de la Ley 30/1992, de 26 de noviembre, de Régimen Jurídico de las Administraciones Públicas y del Procedimiento Administrativo Común.»","dificultad":2},{"id":"L19-L2-039","ley":"L19","articulo":"23.2","articulo_txt":"Art. 23.2 Ley 19/2013","bloque_id":"L19|Título I. Transparencia de la actividad pública · Capítulo III. Derecho de acceso a la información pública · Sección 3.ª Régimen de impugnaciones","enunciado":"Según el artículo 23.2 de la Ley 19/2013, contra las resoluciones en materia de acceso dictadas por órganos como el Congreso de los Diputados, el Senado, el Tribunal Constitucional o el Consejo de Estado:","opciones":{"a":"Cabrá reclamación ante el Consejo de Transparencia y Buen Gobierno.","b":"Solo cabrá recurso de reposición ante el mismo órgano que las dictó.","c":"No cabrá recurso alguno, ni en vía administrativa ni en vía judicial.","d":"Solo cabrá la interposición de recurso contencioso-administrativo."},"correcta":"d","explicacion":"El art. 23.2 dispone que contra las resoluciones de los órganos previstos en el art. 2.1.f) «sólo cabrá la interposición de recurso contencioso-administrativo»; es la opción d). Las opciones a), b) y c) son incompatibles con esa previsión, que deja como única vía el recurso contencioso-administrativo.","cita":"«2. No obstante lo dispuesto en el apartado anterior, contra las resoluciones dictadas por los órganos previstos en el artículo 2.1.f) sólo cabrá la interposición de recurso contencioso-administrativo.»","dificultad":2},{"id":"L19-L2-041","ley":"L19","articulo":"24.2","articulo_txt":"Art. 24.2 Ley 19/2013","bloque_id":"L19|Título I. Transparencia de la actividad pública · Capítulo III. Derecho de acceso a la información pública · Sección 3.ª Régimen de impugnaciones","enunciado":"Según el artículo 24.2 de la Ley 19/2013, la reclamación ante el Consejo de Transparencia y Buen Gobierno se interpondrá en el plazo de:","opciones":{"a":"Dos meses a contar desde el día siguiente al de la notificación del acto impugnado.","b":"Veinte días hábiles a contar desde el día siguiente al de la notificación del acto impugnado.","c":"Treinta días hábiles a contar desde el día siguiente al de la notificación del acto impugnado.","d":"Un mes a contar desde el día siguiente al de la notificación del acto impugnado."},"correcta":"d","explicacion":"El art. 24.2 fija «el plazo de un mes a contar desde el día siguiente al de la notificación del acto impugnado»; es la opción d). La opción a) es falsa: dos meses es el plazo general del recurso contencioso-administrativo contra actos expresos según el art. 46.1 de la Ley 29/1998, de 13 de julio, reguladora de la Jurisdicción Contencioso-administrativa, no el de esta reclamación. Las opciones b) y c) indican plazos que no figuran en el art. 24.2.","cita":"«2. La reclamación se interpondrá en el plazo de un mes a contar desde el día siguiente al de la notificación del acto impugnado o desde el día siguiente a aquel en que se produzcan los efectos del silencio administrativo.»","dificultad":2},{"id":"L19-L2-044","ley":"L19","articulo":"24.6","articulo_txt":"Art. 24.6 Ley 19/2013","bloque_id":"L19|Título I. Transparencia de la actividad pública · Capítulo III. Derecho de acceso a la información pública · Sección 3.ª Régimen de impugnaciones","enunciado":"Según el artículo 24.6 de la Ley 19/2013, la competencia para conocer de las reclamaciones en materia de acceso corresponderá al Consejo de Transparencia y Buen Gobierno, salvo:","opciones":{"a":"Cuando la resolución impugnada haya sido dictada por una Entidad Local, en cuyo caso corresponderá a su Pleno.","b":"En los supuestos en que las Comunidades Autónomas atribuyan dicha competencia a un órgano específico.","c":"Cuando la reclamación se refiera a datos personales, en cuyo caso corresponderá a la Agencia Española de Protección de Datos.","d":"Cuando la resolución impugnada proceda de un Ministerio, en cuyo caso corresponderá al Consejo de Ministros."},"correcta":"b","explicacion":"El art. 24.6 exceptúa «aquellos supuestos en que las Comunidades Autónomas atribuyan dicha competencia a un órgano específico, de acuerdo con lo establecido en la disposición adicional cuarta de esta Ley»; es la opción b). La opción a) es falsa: según la disposición adicional cuarta.1, las reclamaciones contra resoluciones de las Entidades Locales corresponden al órgano independiente que determine la Comunidad Autónoma en cuyo ámbito territorial estén comprendidas. Las opciones c) y d) establecen excepciones que el art. 24.6 no prevé.","cita":"«6. La competencia para conocer de dichas reclamaciones corresponderá al Consejo de Transparencia y Buen Gobierno, salvo en aquellos supuestos en que las Comunidades Autónomas atribuyan dicha competencia a un órgano específico, de acuerdo con lo establecido en la disposición adicional cuarta de esta Ley.»","dificultad":2},{"id":"L19-L3-003","ley":"L19","articulo":"26.1","articulo_txt":"Art. 26.1 Ley 19/2013","bloque_id":"L19|Título II. Buen gobierno","enunciado":"Según el artículo 26.1 de la Ley 19/2013, las personas comprendidas en el ámbito de aplicación del título II observarán en el ejercicio de sus funciones lo dispuesto en la Constitución Española y en el resto del ordenamiento jurídico y promoverán:","opciones":{"a":"La participación de los ciudadanos en la vida política, económica y social.","b":"La igualdad efectiva de mujeres y hombres en el acceso a los cargos públicos.","c":"El respeto a los derechos fundamentales y a las libertades públicas.","d":"El conocimiento por los ciudadanos de sus derechos y deberes constitucionales."},"correcta":"c","explicacion":"El art. 26.1 dispone que esas personas «promoverán el respeto a los derechos fundamentales y a las libertades públicas»; es la opción c). Las opciones a), b) y d) recogen finalidades que el art. 26.1 no menciona.","cita":"«1. Las personas comprendidas en el ámbito de aplicación de este título observarán en el ejercicio de sus funciones lo dispuesto en la Constitución Española y en el resto del ordenamiento jurídico y promoverán el respeto a los derechos fundamentales y a las libertades públicas.»","dificultad":1},{"id":"L19-L3-012","ley":"L19","articulo":"29.1.c)","articulo_txt":"Art. 29.1.c) Ley 19/2013","bloque_id":"L19|Título II. Buen gobierno","enunciado":"Según el artículo 29 de la Ley 19/2013, la adopción de acuerdos manifiestamente ilegales constituye infracción muy grave cuando:","opciones":{"a":"Causen perjuicio grave a la Administración o a los ciudadanos.","b":"Se adopten con ocasión de la celebración de un proceso electoral.","c":"Afecten a la gestión de fondos procedentes de la Unión Europea.","d":"Se adopten de forma reiterada por el mismo órgano colegiado."},"correcta":"a","explicacion":"El art. 29.1.c) califica como muy grave la adopción de acuerdos manifiestamente ilegales «que causen perjuicio grave a la Administración o a los ciudadanos»; es la opción a). Cuando causan perjuicio pero no constituyen infracción muy grave, el art. 29.2.c) la califica como grave. Las opciones b), c) y d) recogen circunstancias que el art. 29 no exige para esa calificación.","cita":"«1. Son infracciones muy graves: […] c) La adopción de acuerdos manifiestamente ilegales que causen perjuicio grave a la Administración o a los ciudadanos.»","dificultad":2},{"id":"L19-L3-011","ley":"L19","articulo":"29.1.l)","articulo_txt":"Art. 29.1.l) Ley 19/2013","bloque_id":"L19|Título II. Buen gobierno","enunciado":"Según el artículo 29.1 de la Ley 19/2013, la comisión de una infracción grave constituye infracción muy grave cuando el autor hubiera sido sancionado:","opciones":{"a":"Por dos infracciones graves a lo largo del año anterior contra las que no quepa recurso en la vía administrativa.","b":"Por una infracción grave a lo largo del año anterior, aunque quepa recurso contra ella en la vía administrativa.","c":"Por dos infracciones graves en los seis meses anteriores, mediante resolución que sea firme en vía judicial.","d":"Por tres infracciones leves a lo largo del año anterior contra las que no quepa recurso en la vía administrativa."},"correcta":"a","explicacion":"El art. 29.1.l) exige que el autor hubiera sido sancionado «por dos infracciones graves a lo largo del año anterior contra las que no quepa recurso en la vía administrativa»; es la opción a). La opción b) reduce a una el número de infracciones graves y prescinde del requisito de que no quepa recurso en vía administrativa. La opción c) cambia el período, que es el año anterior, y exige una firmeza judicial que el art. 29.1.l) no menciona. La opción d) se refiere a infracciones leves previas, supuesto que el art. 29.1.l) no contempla.","cita":"«1. Son infracciones muy graves: […] l) La comisión de una infracción grave cuando el autor hubiera sido sancionado por dos infracciones graves a lo largo del año anterior contra las que no quepa recurso en la vía administrativa.»","dificultad":3},{"id":"L19-L3-022","ley":"L19","articulo":"33.2","articulo_txt":"Art. 33.2 Ley 19/2013","bloque_id":"L19|Título III. Consejo de Transparencia y Buen Gobierno","enunciado":"Según el artículo 33.2 de la Ley 19/2013, el Consejo de Transparencia y Buen Gobierno tiene personalidad jurídica propia y plena capacidad de obrar, y en el cumplimiento de sus fines actúa:","opciones":{"a":"Con autonomía y plena independencia.","b":"Bajo la dirección del Ministerio al que está adscrito.","c":"Con sujeción a las directrices que fije el Gobierno.","d":"Con sujeción a las instrucciones de la Comisión General de Secretarios de Estado y Subsecretarios."},"correcta":"a","explicacion":"El art. 33.2 dispone que el Consejo «Actúa con autonomía y plena independencia en el cumplimiento de sus fines»; es la opción a). Las opciones b), c) y d) someten la actuación del Consejo a una dirección, unas directrices o unas instrucciones que el art. 33.2 no prevé.","cita":"«2. El Consejo de Transparencia y Buen Gobierno tiene personalidad jurídica propia y plena capacidad de obrar. Actúa con autonomía y plena independencia en el cumplimiento de sus fines.»","dificultad":1},{"id":"L19-L3-027","ley":"L19","articulo":"36.4","articulo_txt":"Art. 36.4 Ley 19/2013","bloque_id":"L19|Título III. Consejo de Transparencia y Buen Gobierno","enunciado":"Según el artículo 36.4 de la Ley 19/2013, a la reunión que, al menos una vez al año, convoca la Comisión de Transparencia y Buen Gobierno con los representantes de los organismos de funciones similares creados por las Comunidades Autónomas podrá ser convocado un representante de la Administración Local propuesto por:","opciones":{"a":"La Federación Española de Municipios y Provincias.","b":"La Comisión Nacional de Administración Local.","c":"Las Diputaciones Provinciales, de común acuerdo.","d":"El Pleno del Ayuntamiento de mayor población."},"correcta":"a","explicacion":"El art. 36.4 prevé que pueda convocarse «un representante de la Administración Local propuesto por la Federación Española de Municipios y Provincias»; es la opción a). Las opciones b), c) y d) mencionan órganos o entidades a los que el art. 36.4 no atribuye esa propuesta.","cita":"«4. Al menos una vez al año, la Comisión de Transparencia y Buen Gobierno convocará a los representantes de los organismos que, con funciones similares a las desarrolladas por ella, hayan sido creados por las Comunidades Autónomas en ejercicio de sus competencias. A esta reunión podrá ser convocado un representante de la Administración Local propuesto por la Federación Española de Municipios y Provincias.»","dificultad":2},{"id":"L19-L3-030","ley":"L19","articulo":"37.2","articulo_txt":"Art. 37.2 Ley 19/2013","bloque_id":"L19|Título III. Consejo de Transparencia y Buen Gobierno","enunciado":"Según el artículo 37.2 de la Ley 19/2013, ¿cuál de las siguientes NO figura entre las causas de cese del Presidente del Consejo de Transparencia y Buen Gobierno?","opciones":{"a":"La incompatibilidad sobrevenida.","b":"El cese del Gobierno que propuso su nombramiento.","c":"La condena por delito doloso.","d":"La incapacidad permanente para el ejercicio de su función."},"correcta":"b","explicacion":"El art. 37.2 no prevé el cese del Presidente por el cese del Gobierno; es la opción b). Las opciones a), c) y d) figuran en el art. 37.2 entre los motivos de la separación acordada por el Gobierno.","cita":"«2. El Presidente del Consejo de Transparencia y Buen Gobierno cesará en su cargo por la expiración de su mandato, a petición propia o por separación acordada por el Gobierno, previa instrucción del correspondiente procedimiento por el titular del Ministerio de Hacienda y Administraciones Públicas, por incumplimiento grave de sus obligaciones, incapacidad permanente para el ejercicio de su función, incompatibilidad sobrevenida o condena por delito doloso.»","dificultad":2},{"id":"L19-L3-037","ley":"L19","articulo":"DA 1ª.1","articulo_txt":"DA 1ª.1 · Ley 19/2013","bloque_id":"L19|Disposiciones adicionales","enunciado":"Según la disposición adicional primera de la Ley 19/2013, el acceso por parte de quienes tengan la condición de interesados en un procedimiento administrativo en curso a los documentos que se integren en el mismo se regirá por:","opciones":{"a":"El capítulo III del título I de la Ley 19/2013, con carácter exclusivo.","b":"Lo que acuerde el órgano instructor, previo informe del Consejo de Transparencia y Buen Gobierno.","c":"La Ley 19/2013, salvo que el interesado opte por la normativa del procedimiento.","d":"La normativa reguladora del correspondiente procedimiento administrativo."},"correcta":"d","explicacion":"La DA 1.ª.1 declara aplicable a ese acceso «La normativa reguladora del correspondiente procedimiento administrativo»; es la opción d). Las opciones a), b) y c) no se ajustan a la remisión que hace la DA 1.ª.1.","cita":"«1. La normativa reguladora del correspondiente procedimiento administrativo será la aplicable al acceso por parte de quienes tengan la condición de interesados en un procedimiento administrativo en curso a los documentos que se integren en el mismo.»","dificultad":1},{"id":"L19-L3-038","ley":"L19","articulo":"DA 1ª.3","articulo_txt":"DA 1ª.3 · Ley 19/2013","bloque_id":"L19|Disposiciones adicionales","enunciado":"La disposición adicional primera.3 de la Ley 19/2013 menciona expresamente, como materias a cuyo acceso se aplicará esta Ley en lo no previsto en sus respectivas normas reguladoras:","opciones":{"a":"La información tributaria y la de la Seguridad Social.","b":"La información clasificada y la de los archivos históricos.","c":"La información estadística y la de los registros públicos.","d":"La información ambiental y la destinada a la reutilización."},"correcta":"d","explicacion":"La DA 1.ª.3 cita «la información ambiental» y la «destinada a la reutilización»; es la opción d). Las opciones a), b) y c) mencionan materias que la DA 1.ª.3 no cita expresamente.","cita":"«3. En este sentido, esta Ley será de aplicación, en lo no previsto en sus respectivas normas reguladoras, al acceso a la información ambiental y a la destinada a la reutilización.»","dificultad":2},{"id":"L19-L3-043","ley":"L19","articulo":"DA 6ª","articulo_txt":"DA 6ª · Ley 19/2013","bloque_id":"L19|Disposiciones adicionales","enunciado":"Según la disposición adicional sexta de la Ley 19/2013, ¿qué órgano es competente para tramitar el procedimiento en el que se solicite el acceso a la información que obre en poder de la Casa de Su Majestad el Rey?","opciones":{"a":"La Secretaría General de la Casa de Su Majestad el Rey.","b":"El Consejo de Transparencia y Buen Gobierno.","c":"La Jefatura de la Casa de Su Majestad el Rey.","d":"La Secretaría General de la Presidencia del Gobierno."},"correcta":"d","explicacion":"La DA 6.ª atribuye esa competencia a «La Secretaría General de la Presidencia del Gobierno»; es la opción d). Las opciones a), b) y c) mencionan órganos a los que la DA 6.ª no atribuye esa competencia. Las denominaciones de los órganos son las que emplea la Ley 19/2013.","cita":"«La Secretaría General de la Presidencia del Gobierno será el órgano competente para tramitar el procedimiento mediante en el que se solicite el acceso a la información que obre en poder de la Casa de Su Majestad el Rey, así como para conocer de cualquier otra cuestión que pudiera surgir derivada de la aplicación por este órgano de las disposiciones de esta Ley.»","dificultad":2},{"id":"L19-L3-045","ley":"L19","articulo":"DF 7ª","articulo_txt":"DF 7ª · Ley 19/2013","bloque_id":"L19|Disposiciones finales","enunciado":"Según la disposición final séptima de la Ley 19/2013, el Consejo de Ministros aprobará el Real Decreto por el que se apruebe el Estatuto orgánico del Consejo de Transparencia y Buen Gobierno en el plazo, desde la publicación de esta Ley en el «Boletín Oficial del Estado», de:","opciones":{"a":"Seis meses.","b":"Tres meses.","c":"Nueve meses.","d":"Cuatro meses."},"correcta":"b","explicacion":"La DF 7.ª fija un plazo de «tres meses desde la publicación de esta Ley»; es la opción b). Las opciones a), c) y d) no coinciden con el plazo de la DF 7.ª.","cita":"«El Consejo de Ministros aprobará, en el plazo de tres meses desde la publicación de esta Ley en el «Boletín Oficial del Estado», un Real Decreto por el que se apruebe el Estatuto orgánico del Consejo de Transparencia y Buen Gobierno.»","dificultad":2},{"id":"L19-L3-046","ley":"L19","articulo":"DF 8ª","articulo_txt":"DF 8ª · Ley 19/2013","bloque_id":"L19|Disposiciones finales","enunciado":"La disposición final octava de la Ley 19/2013 dispone que la Ley se dicta al amparo de los artículos 149.1.1.ª, 149.1.13.ª y 149.1.18.ª de la Constitución y exceptúa de ello determinados preceptos. ¿Cuál de los siguientes es uno de ellos?","opciones":{"a":"El título III.","b":"El artículo 12.","c":"El artículo 26.","d":"El artículo 14."},"correcta":"a","explicacion":"La DF 8.ª exceptúa, entre otros preceptos, «el título III»; es la opción a). Las opciones b), c) y d) no figuran entre los preceptos exceptuados, que son el segundo párrafo del art. 6.2, el art. 9, los apartados 1 y 2 del art. 10, el art. 11, el art. 21.2, el art. 25.1, el título III y la DA 2.ª.","cita":"«La presente Ley se dicta al amparo de lo dispuesto en los artículos 149.1.1.ª, 149.1.13.ª y 149.1.18.ª de la Constitución. Se exceptúa lo dispuesto en el segundo párrafo del apartado 2 del artículo 6, el artículo 9, los apartados 1 y 2 del artículo 10, el artículo 11, el apartado 2 del artículo 21, el apartado 1 del artículo 25, el título III y la disposición adicional segunda.»","dificultad":3},{"id":"L19-L3-047","ley":"L19","articulo":"DF 9ª","articulo_txt":"DF 9ª · Ley 19/2013","bloque_id":"L19|Disposiciones finales","enunciado":"Según la disposición final novena de la Ley 19/2013, las disposiciones previstas en el título II entrarán en vigor:","opciones":{"a":"A los veinte días de su publicación en el «Boletín Oficial del Estado».","b":"A los seis meses de su publicación en el «Boletín Oficial del Estado».","c":"A los dos meses de su publicación en el «Boletín Oficial del Estado».","d":"Al día siguiente de su publicación en el «Boletín Oficial del Estado»."},"correcta":"d","explicacion":"La DF 9.ª dispone que las disposiciones previstas en el título II «entrarán en vigor al día siguiente de su publicación»; es la opción d). Las opciones a), b) y c) fijan plazos que la DF 9.ª no prevé para el título II; según la misma disposición, el título preliminar y los títulos I y III entraron en vigor al año de su publicación.","cita":"«La entrada en vigor de esta ley se producirá de acuerdo con las siguientes reglas: – Las disposiciones previstas en el título II entrarán en vigor al día siguiente de su publicación en el «Boletín Oficial del Estado».»","dificultad":2}]};</script>
<script>
/* Letra de Ley — motor de test. Sin dependencias; funciona sin conexión.
   Necesita window.LDL_CONFIG y window.LDL_BANCO (los inyecta sistema/letradeley.py). */
(function () {
  "use strict";
  var CFG = window.LDL_CONFIG, B = window.LDL_BANCO;
  var raiz = document.getElementById("ldl");
  var LETRAS = ["a", "b", "c", "d"];
  var POR_ID = {};
  B.preguntas.forEach(function (p) { POR_ID[p.id] = p; });
  var CLAVE = "ldl1:" + CFG.pack.id;
  var prog = cargar();
  var sesion = null;
  var vista = CFG.modo === "web" ? "portada" : "inicio";
  var reloj = null;

  /* ---------- utilidades ---------- */
  function esc(t) {
    return String(t == null ? "" : t).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function barajar(lista) {
    var a = lista.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function pct(a, b) { return b ? Math.round((a / b) * 100) : 0; }
  function plural(n, uno, varios) { return n + " " + (n === 1 ? uno : varios); }
  function num(n) { return String(n).replace(".", ","); }
  function cargar() {
    try { var s = localStorage.getItem(CLAVE); if (s) { var d = JSON.parse(s); if (d && d.p) return d; } } catch (e) {}
    return { p: {}, h: [] };
  }
  function guardar() { try { localStorage.setItem(CLAVE, JSON.stringify(prog)); } catch (e) {} }
  function registrar(id, acierto) {
    var r = prog.p[id] || { v: 0, a: 0, f: 0, c: 0 };
    r.v++;
    if (acierto) { r.a++; r.c = Math.min((r.c || 0) + 1, 5); } else { r.f++; r.c = 0; }
    r.u = acierto ? 1 : 0;
    r.t = Date.now();
    prog.p[id] = r;
    guardar();
  }
  function fallosPendientes() {
    return B.preguntas.filter(function (p) { var r = prog.p[p.id]; return r && r.u === 0; });
  }
  function resumen(lista) {
    var vistas = 0, aciertos = 0, intentos = 0;
    lista.forEach(function (p) {
      var r = prog.p[p.id];
      if (r) { vistas++; aciertos += r.a; intentos += r.v; }
    });
    return { total: lista.length, vistas: vistas, acierto: pct(aciertos, intentos) };
  }
  function delBloque(id) { return B.preguntas.filter(function (p) { return p.bloque_id === id; }); }

  /* ---------- tema claro / oscuro ---------- */
  function aplicarTema() {
    var t = null;
    try { t = localStorage.getItem("ldl:tema"); } catch (e) {}
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    else document.documentElement.removeAttribute("data-theme");
    return t || "auto";
  }
  function cambiarTema() {
    var orden = { auto: "light", light: "dark", dark: "auto" };
    var actual = aplicarTema();
    try { localStorage.setItem("ldl:tema", orden[actual]); } catch (e) {}
    aplicarTema();
    pintar();
  }

  /* ---------- sesiones ---------- */
  function empezar(tipo, preguntas, opciones) {
    opciones = opciones || {};
    if (!preguntas.length) return;
    pararReloj();
    sesion = {
      tipo: tipo, titulo: opciones.titulo || "Test", ids: preguntas.map(function (p) { return p.id; }),
      i: 0, resp: {}, corregida: {}, inicio: Date.now(), limite: opciones.minutos ? opciones.minutos * 60 : 0, fin: null,
      origen: vista === "test" || vista === "resultado" ? (sesion && sesion.origen) || "inicio" : vista
    };
    vista = "test";
    if (sesion.limite) reloj = setInterval(tic, 1000);
    pintar();
    window.scrollTo(0, 0);
  }
  function tic() {
    if (!sesion || sesion.fin) return pararReloj();
    var el = document.getElementById("ldl-crono");
    var resta = sesion.limite - Math.floor((Date.now() - sesion.inicio) / 1000);
    if (resta <= 0) { terminar(); return; }
    if (el) el.textContent = mmss(resta);
  }
  function pararReloj() { if (reloj) { clearInterval(reloj); reloj = null; } }
  function mmss(s) { var m = Math.floor(s / 60), r = s % 60; return m + ":" + (r < 10 ? "0" : "") + r; }

  function responder(letra) {
    var id = sesion.ids[sesion.i];
    if (sesion.tipo === "simulacro") {
      sesion.resp[id] = sesion.resp[id] === letra ? undefined : letra;
      pintar();
      return;
    }
    if (sesion.corregida[id]) return;
    sesion.resp[id] = letra;
    sesion.corregida[id] = true;
    registrar(id, letra === POR_ID[id].correcta);
    pintar();
  }
  function siguiente() {
    if (sesion.i < sesion.ids.length - 1) { sesion.i++; pintar(); window.scrollTo(0, 0); }
    else terminar();
  }
  function anterior() { if (sesion.i > 0) { sesion.i--; pintar(); } }
  function terminar() {
    pararReloj();
    if (sesion.tipo === "simulacro") {
      sesion.ids.forEach(function (id) {
        if (sesion.resp[id]) registrar(id, sesion.resp[id] === POR_ID[id].correcta);
      });
    }
    sesion.fin = Date.now();
    var r = calcular(sesion);
    prog.h.unshift({ t: sesion.fin, tipo: sesion.tipo, n: r.total, a: r.aciertos, e: r.errores, nota: r.nota });
    prog.h = prog.h.slice(0, 50);
    guardar();
    vista = "resultado";
    pintar();
    window.scrollTo(0, 0);
  }
  function calcular(s) {
    var a = 0, e = 0, nr = 0;
    s.ids.forEach(function (id) {
      var r = s.resp[id];
      if (!r) nr++; else if (r === POR_ID[id].correcta) a++; else e++;
    });
    var pen = (CFG.simulacro && CFG.simulacro.penalizacion) || 1 / 3;
    var neta = s.tipo === "simulacro" ? a - e * pen : a;
    var nota = Math.max(0, (neta / s.ids.length) * 10);
    return { total: s.ids.length, aciertos: a, errores: e, blancos: nr, neta: neta, nota: Math.round(nota * 100) / 100 };
  }

  /* ---------- vistas ---------- */
  function cabecera() {
    var tema = aplicarTema();
    var etiquetas = { auto: "Tema: auto", light: "Tema: claro", dark: "Tema: oscuro" };
    return '<header class="ldl-top"><a class="ldl-brand" href="' + esc(CFG.web || "#") + '">' +
      '<span class="ldl-logo" aria-hidden="true">§</span><span><b>Letra de Ley</b><small>' +
      esc(CFG.pack.nombre) + "</small></span></a>" +
      '<button class="ldl-tema" data-acc="tema" type="button">' + etiquetas[tema] + "</button></header>";
  }
  function navegacion() {
    if (CFG.modo === "web") return "";
    var items = [["inicio", "Inicio"], ["temas", "Por temas"], ["simulacro", "Simulacro"], ["fallos", "Fallos"], ["stats", "Estadísticas"]];
    return '<nav class="ldl-nav" aria-label="Secciones">' + items.map(function (it) {
      var actual = vista === it[0] || (vista === "test" && sesion && sesion.origen === it[0]);
      return '<button type="button" data-acc="ir" data-v="' + it[0] + '"' + (actual ? ' aria-current="page"' : "") + ">" + it[1] + "</button>";
    }).join("") + "</nav>";
  }
  function pie() {
    return '<p class="ldl-pie">Letra de Ley · ' + esc(CFG.pack.edicion) + " · Texto legal actualizado a " +
      esc(CFG.pack.actualizado) + "<br>Uso personal. Prohibida su redistribución.</p>";
  }

  function vInicio() {
    var r = resumen(B.preguntas), f = fallosPendientes().length;
    return '<section class="ldl-card"><h2>' + esc(CFG.pack.nombre) + "</h2>" +
      '<p class="ldl-muted">' + B.preguntas.length + " preguntas comentadas, con el artículo exacto de cada respuesta.</p>" +
      '<div class="ldl-kpis"><div class="ldl-kpi"><b>' + r.vistas + "/" + r.total + "</b><span>respondidas</span></div>" +
      '<div class="ldl-kpi"><b>' + r.acierto + ' %</b><span>de acierto</span></div>' +
      '<div class="ldl-kpi"><b>' + f + "</b><span>fallos por repasar</span></div></div>" +
      '<div class="ldl-acciones"><button class="ldl-btn" data-acc="rapido" type="button">Test rápido de 20</button>' +
      '<button class="ldl-btn sec" data-acc="ir" data-v="simulacro" type="button">Simulacro de examen</button>' +
      (f ? '<button class="ldl-btn sec" data-acc="repasar" type="button">Repasar ' + f + " fallos</button>" : "") +
      "</div></section>" +
      '<section class="ldl-card"><h3>Cómo sacarle partido</h3><ol class="ldl-muted">' +
      "<li>Practica <b>por temas</b>: cada respuesta te enseña el artículo y por qué fallan las demás opciones.</li>" +
      "<li>Cada pocos días, <b>repasa tus fallos</b>: es donde más se aprende.</li>" +
      "<li>Antes del examen, haz <b>simulacros</b> con tiempo y con la penalización real (cada error resta 1/3).</li></ol>" +
      '<p class="ldl-small ldl-muted">Tu progreso se guarda en este dispositivo y en este navegador.</p></section>' + historial();
  }
  function historial() {
    if (!prog.h.length) return "";
    return '<section class="ldl-card"><h3>Últimos tests</h3><ul class="ldl-revision">' + prog.h.slice(0, 5).map(function (h) {
      var d = new Date(h.t);
      return "<li><b>" + (h.tipo === "simulacro" ? "Simulacro" : "Práctica") + "</b> · " + d.toLocaleDateString("es-ES") +
        " · " + h.a + "/" + h.n + " aciertos" + (h.tipo === "simulacro" ? " · nota " + num(h.nota) : "") + "</li>";
    }).join("") + "</ul></section>";
  }
  function vTemas() {
    var html = '<section class="ldl-card"><h2>Practicar por temas</h2><p class="ldl-muted">Elige un bloque. Las preguntas salen en orden aleatorio y se corrigen al momento.</p><ul class="ldl-bloques">';
    B.bloques.forEach(function (b) {
      var lista = delBloque(b.id), r = resumen(lista);
      html += '<li><button type="button" data-acc="bloque" data-id="' + esc(b.id) + '"><span class="t">' + esc(b.nombre) +
        '</span><span class="n">' + r.vistas + "/" + r.total + (r.vistas ? " · " + r.acierto + " %" : "") + "</span>" +
        '<span class="ldl-barra"><i style="width:' + pct(r.vistas, r.total) + '%"></i></span></button></li>';
    });
    return html + "</ul></section>";
  }
  function vSimulacro() {
    var total = B.preguntas.length;
    var opcionesN = [10, 20, 30, 50, 100].filter(function (n) { return n < total; });
    opcionesN.push(total);
    var porDefecto = Math.min((CFG.simulacro && CFG.simulacro.preguntas) || 30, total);
    return '<section class="ldl-card"><h2>Simulacro de examen</h2>' +
      '<p class="ldl-muted">Como el día del examen: no ves las soluciones hasta el final y cada error resta un tercio de acierto.</p>' +
      '<div class="ldl-campo"><label for="ldl-n">Número de preguntas</label><select id="ldl-n">' +
      opcionesN.map(function (n) { return "<option" + (n === porDefecto ? " selected" : "") + ">" + n + "</option>"; }).join("") +
      '</select></div><div class="ldl-campo"><label for="ldl-t">Tiempo</label><select id="ldl-t">' +
      '<option value="1">1 minuto por pregunta</option><option value="0">Sin límite de tiempo</option></select></div>' +
      '<div class="ldl-campo"><label for="ldl-b">Temas</label><select id="ldl-b"><option value="">Todos</option>' +
      B.bloques.map(function (b) { return '<option value="' + esc(b.id) + '">' + esc(b.nombre) + "</option>"; }).join("") +
      '</select></div><div class="ldl-acciones"><button class="ldl-btn" data-acc="simular" type="button">Empezar simulacro</button></div></section>';
  }
  function vFallos() {
    var f = fallosPendientes();
    if (!f.length) {
      return '<section class="ldl-card"><h2>Repaso de fallos</h2><p class="ldl-muted">No tienes fallos pendientes. Cuando falles una pregunta aparecerá aquí hasta que la aciertes.</p></section>';
    }
    return '<section class="ldl-card"><h2>Repaso de fallos</h2><p class="ldl-muted">Tienes <b>' + f.length +
      "</b> preguntas falladas. Salen de aquí en cuanto las aciertas.</p>" +
      '<div class="ldl-acciones"><button class="ldl-btn" data-acc="repasar" type="button">Repasar ahora</button></div></section>';
  }
  function vStats() {
    var html = '<section class="ldl-card"><h2>Estadísticas</h2><ul class="ldl-bloques">';
    B.bloques.forEach(function (b) {
      var r = resumen(delBloque(b.id));
      html += '<li><button type="button" data-acc="bloque" data-id="' + esc(b.id) + '"><span class="t">' + esc(b.nombre) +
        '</span><span class="n">' + (r.vistas ? r.acierto + " % de acierto" : "sin empezar") + '</span><span class="ldl-barra"><i style="width:' +
        r.acierto + '%"></i></span></button></li>';
    });
    html += '</ul></section><section class="ldl-card"><h3>Empezar de cero</h3><p class="ldl-muted ldl-small">Borra tu progreso guardado en este dispositivo.</p>' +
      '<div class="ldl-acciones"><button class="ldl-btn sec" data-acc="borrar" type="button">Borrar mi progreso</button></div></section>';
    return html;
  }
  function vPortada() {
    var n = B.preguntas.length;
    return '<section class="ldl-card"><h2>' + esc(CFG.pack.nombre) + "</h2>" +
      '<p class="ldl-muted">' + n + " preguntas tipo examen, corregidas al momento, con el artículo exacto y la explicación de cada opción. Gratis y sin registrarte.</p>" +
      '<div class="ldl-acciones"><button class="ldl-btn" data-acc="empezarweb" type="button">Empezar el test</button></div></section>';
  }

  function vTest() {
    var id = sesion.ids[sesion.i], p = POR_ID[id], sim = sesion.tipo === "simulacro";
    var elegida = sesion.resp[id], corregida = !sim && sesion.corregida[id];
    var html = '<section class="ldl-card"><div class="ldl-meta"><span>' + esc(sesion.titulo) + " · " + (sesion.i + 1) + " de " + sesion.ids.length +
      "</span><span>" + (sesion.limite ? '⏱ <span id="ldl-crono" class="ldl-crono">' +
        mmss(Math.max(0, sesion.limite - Math.floor((Date.now() - sesion.inicio) / 1000))) + "</span>" : esc(p.articulo_txt)) +
      '</span></div><div class="ldl-progreso"><i style="width:' + pct(sesion.i + (corregida ? 1 : 0), sesion.ids.length) + '%"></i></div>' +
      '<p class="ldl-enunciado">' + esc(p.enunciado) + '</p><div class="ldl-opciones" role="group" aria-label="Opciones">';
    LETRAS.forEach(function (l) {
      var cls = "ldl-op";
      if (corregida) { if (l === p.correcta) cls += " ok"; else if (l === elegida) cls += " ko"; }
      else if (sim && elegida === l) cls += " marcada";
      html += '<button type="button" class="' + cls + '" data-acc="resp" data-l="' + l + '"' + (corregida ? " disabled" : "") +
        (sim ? ' aria-pressed="' + (elegida === l) + '"' : "") + '><span class="l">' + l + ")</span><span>" + esc(p.opciones[l]) + "</span></button>";
    });
    html += "</div>";
    if (corregida) html += feedback(p, elegida);
    html += '<div class="ldl-acciones">';
    if (sim) {
      html += (sesion.i > 0 ? '<button class="ldl-btn sec" data-acc="ant" type="button">Anterior</button>' : "") +
        '<button class="ldl-btn" data-acc="sig" type="button">' + (sesion.i < sesion.ids.length - 1 ? "Siguiente" : "Entregar") + "</button>" +
        (sesion.i < sesion.ids.length - 1 ? '<button class="ldl-btn sec" data-acc="entregar" type="button">Entregar ya</button>' : "");
    } else if (corregida) {
      html += '<button class="ldl-btn" data-acc="sig" type="button">' + (sesion.i < sesion.ids.length - 1 ? "Siguiente" : "Ver resultado") + "</button>";
    }
    html += '<button class="ldl-btn sec" data-acc="salir" type="button">Salir</button></div></section>';
    return html;
  }
  function feedback(p, elegida) {
    var bien = elegida === p.correcta;
    return '<div class="ldl-feedback" aria-live="polite"><div class="v ' + (bien ? "ok" : "ko") + '">' +
      (bien ? "¡Correcta!" : "Incorrecta. La respuesta correcta es la " + p.correcta + ")") + "</div><div>" + esc(p.explicacion) + "</div>" +
      (p.cita ? '<blockquote class="ldl-cita">' + esc(p.cita) + "<small>" + esc(p.articulo_txt) + "</small></blockquote>" : "") + "</div>";
  }
  function vResultado() {
    var r = calcular(sesion), sim = sesion.tipo === "simulacro";
    var html = '<section class="ldl-card"><h2>' + (sim ? "Resultado del simulacro" : "Resultado") + "</h2>" +
      '<div class="ldl-nota">' + (sim ? num(r.nota.toFixed(2)) : r.aciertos + "/" + r.total) + "</div>" +
      '<p class="ldl-muted">' + plural(r.aciertos, "acierto", "aciertos") + " · " + plural(r.errores, "error", "errores") +
      (r.blancos ? " · " + r.blancos + " en blanco" : "") +
      (sim ? " · nota sobre 10 con penalización" : "") + "</p>";
    if (CFG.modo === "web") html += ctaWeb(r);
    html += '<div class="ldl-acciones">' + (CFG.modo === "web" ? '<button class="ldl-btn sec" data-acc="empezarweb" type="button">Repetir con otro orden</button>' :
      '<button class="ldl-btn" data-acc="ir" data-v="inicio" type="button">Volver al inicio</button>') + "</div></section>";
    html += '<section class="ldl-card"><h3>Revisión</h3><ul class="ldl-revision">';
    sesion.ids.forEach(function (id, n) {
      var p = POR_ID[id], e = sesion.resp[id], chip = !e ? '<span class="ldl-chip nr">En blanco</span>' :
        e === p.correcta ? '<span class="ldl-chip ok">Bien</span>' : '<span class="ldl-chip ko">Mal</span>';
      html += "<li>" + chip + '<span class="e">' + (n + 1) + ". " + esc(p.enunciado) + "</span><br>" +
        '<span class="ldl-small">Correcta: <b>' + p.correcta + ") " + esc(p.opciones[p.correcta]) + "</b>" +
        (e && e !== p.correcta ? " · Marcaste " + e + ")" : "") + '</span><br><span class="ldl-small ldl-muted">' + esc(p.explicacion) + "</span></li>";
    });
    return html + "</ul></section>";
  }
  function ctaWeb() {
    var c = CFG.compra || {}, html = "";
    if (c.url) {
      html += '<div class="ldl-card ldl-cta"><h3>' + esc(c.titulo) + '</h3><p class="ldl-muted">' + esc(c.texto) + "</p>" +
        '<div class="ldl-acciones"><a class="ldl-btn acc" href="' + esc(c.url) + '">' + esc(c.boton) + "</a></div></div>";
    }
    if (CFG.telegram) {
      html += '<p class="ldl-small">¿Quieres un test cada día? <a href="' + esc(CFG.telegram) + '">Únete gratis al canal de Telegram</a>.</p>';
    }
    return html;
  }

  function pintar() {
    var cuerpo;
    if (vista === "test") cuerpo = vTest();
    else if (vista === "resultado") cuerpo = vResultado();
    else if (vista === "portada") cuerpo = vPortada();
    else if (vista === "temas") cuerpo = vTemas();
    else if (vista === "simulacro") cuerpo = vSimulacro();
    else if (vista === "fallos") cuerpo = vFallos();
    else if (vista === "stats") cuerpo = vStats();
    else cuerpo = vInicio();
    raiz.innerHTML = '<div class="ldl">' + cabecera() + navegacion() + "<main>" + cuerpo + "</main>" + pie() + "</div>";
  }

  /* ---------- eventos ---------- */
  raiz.addEventListener("click", function (ev) {
    var el = ev.target.closest("[data-acc]");
    if (!el) return;
    var acc = el.getAttribute("data-acc");
    if (acc === "tema") return cambiarTema();
    if (acc === "ir") { pararReloj(); vista = el.getAttribute("data-v"); sesion = null; pintar(); return; }
    if (acc === "rapido") return empezar("practica", barajar(B.preguntas).slice(0, 20), { titulo: "Test rápido" });
    if (acc === "repasar") return empezar("practica", barajar(fallosPendientes()).slice(0, 30), { titulo: "Repaso de fallos" });
    if (acc === "bloque") {
      var b = B.bloques.filter(function (x) { return x.id === el.getAttribute("data-id"); })[0];
      return empezar("practica", barajar(delBloque(b.id)), { titulo: b.nombre });
    }
    if (acc === "simular") {
      var n = parseInt(document.getElementById("ldl-n").value, 10);
      var conTiempo = document.getElementById("ldl-t").value === "1";
      var bloque = document.getElementById("ldl-b").value;
      var fuente = bloque ? delBloque(bloque) : B.preguntas;
      var elegidas = barajar(fuente).slice(0, n);
      return empezar("simulacro", elegidas, { titulo: "Simulacro", minutos: conTiempo ? elegidas.length : 0 });
    }
    if (acc === "empezarweb") return empezar("practica", barajar(B.preguntas), { titulo: "Test gratuito" });
    if (acc === "resp") return responder(el.getAttribute("data-l"));
    if (acc === "sig") return siguiente();
    if (acc === "ant") return anterior();
    if (acc === "entregar") return terminar();
    if (acc === "salir") { pararReloj(); sesion = null; vista = CFG.modo === "web" ? "portada" : "inicio"; pintar(); return; }
    if (acc === "borrar") {
      if (el.getAttribute("data-confirmar") === "1") { prog = { p: {}, h: [] }; guardar(); pintar(); }
      else { el.setAttribute("data-confirmar", "1"); el.textContent = "Pulsa otra vez para confirmar"; }
    }
  });
  document.addEventListener("keydown", function (ev) {
    if (vista !== "test" || !sesion || ev.altKey || ev.ctrlKey || ev.metaKey) return;
    var k = ev.key.toLowerCase(), mapa = { "1": "a", "2": "b", "3": "c", "4": "d", a: "a", b: "b", c: "c", d: "d" };
    if (mapa[k]) { ev.preventDefault(); responder(mapa[k]); }
    else if (k === "enter" || k === "arrowright") {
      var id = sesion.ids[sesion.i];
      if (sesion.tipo === "simulacro" || sesion.corregida[id]) { ev.preventDefault(); siguiente(); }
    } else if (k === "arrowleft" && sesion.tipo === "simulacro") { ev.preventDefault(); anterior(); }
  });

  pintar();
})();
</script>
</body>
</html>
