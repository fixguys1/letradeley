  --bg: #0e1320; --surface: #161d2e; --surface-2: #1d2639; --ink: #e8ecf6; --text: #e6e7ea;

}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text); font: 16px/1.55 var(--sans);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
.ldl { max-width: 760px; margin: 0 auto; padding: 16px 16px 48px; }
.ldl a { color: var(--primary); }
.ldl :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 8px; }

/* Cabecera */
.ldl-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.ldl-brand { display: flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; }
.ldl-logo {

}

.ldl-tema {
  border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 999px;
  padding: 6px 12px; font: 13px var(--sans); cursor: pointer;
}

/* Navegación */
.ldl-nav { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 16px; scrollbar-width: none; }
.ldl-nav button {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface); color: var(--text);
  border-radius: 999px; padding: 8px 14px; font: 600 14px var(--sans); cursor: pointer;
}
.ldl-nav button[aria-current="page"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* Tarjetas */
.ldl-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; margin-bottom: 14px; }
.ldl-card h2 { font: 700 22px/1.25 var(--serif); color: var(--ink); margin: 0 0 8px; }

.ldl-opciones { display: grid; gap: 10px; }
.ldl-op {
  display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start; text-align: left; width: 100%;

  color: var(--text); font: 16px/1.45 var(--sans);
}
.ldl-op:hover:not([disabled]) { border-color: var(--primary); }
.ldl-op .l {

  font-weight: 700; color: var(--ink); text-transform: lowercase;

.ldl-op.ok { border-color: var(--ok); background: var(--ok-bg); }

.ldl-op.ko { border-color: var(--ko); background: var(--ko-bg); }

.ldl-op.marcada { border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); }
.ldl-feedback { margin-top: 16px; border-radius: 12px; padding: 14px 16px; background: var(--surface-2); }
.ldl-feedback .v { font-weight: 700; margin-bottom: 6px; }
.ldl-feedback .v.ok { color: var(--ok); }
.ldl-feedback .v.ko { color: var(--ko); }
.ldl-cita { margin: 10px 0 0; padding: 10px 12px; border-left: 3px solid var(--accent); background: var(--surface); border-radius: 0 8px 8px 0; font: italic 15px/1.5 var(--serif); }
.ldl-cita small { display: block; font: 600 12px var(--sans); font-style: normal; color: var(--muted); margin-top: 6px; }

/* Resultados */
.ldl-nota { font: 800 54px/1 var(--sans); color: var(--ink); font-variant-numeric: tabular-nums; }

.ldl-chip { display: inline-block; font: 700 12px var(--sans); border-radius: 999px; padding: 2px 8px; margin-right: 6px; }
.ldl-chip.ok { background: var(--ok-bg); color: var(--ok); }
.ldl-chip.ko { background: var(--ko-bg); color: var(--ko); }
.ldl-chip.nr { background: var(--surface-2); color: var(--muted); }

/* Formularios */
.ldl-campo { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; margin: 10px 0; }
.ldl-campo label { font-weight: 600; font-size: 14px; }
.ldl-campo select, .ldl-campo input {
  font: 16px var(--sans); padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface); color: var(--text); width: 100%; max-width: 100%; min-width: 0; text-overflow: ellipsis;
}
.ldl-cta { border: 2px solid var(--accent); }
.ldl-pie { text-align: center; color: var(--muted); font-size: 12px; margin-top: 24px; }
.ldl-crono { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--ink); }

@media (max-width: 480px) {
  .ldl-enunciado { font-size: 17px; }
  .ldl-kpi b { font-size: 20px; }
  .ldl-nota { font-size: 44px; }
}
@media print { .ldl-nav, .ldl-tema, .ldl-acciones { display: none; } }
</style>

ciones"},{"id":"L19|Título II. Buen gobierno","ley":"L19","nombre":"Título II. Buen gobierno"},{"id":"L19|Título III. Consejo de Transparencia y Buen Gobierno","ley":"L19","nombre":"Título III. Consejo de Transparencia y Buen Gobierno"},{"id":"L19|Disposiciones adicionales","ley":"L19","nombre":"Disposiciones adicionales"},{"id":"L19|Disposiciones finales","ley":"L19","nombre":"Disposiciones finales"}],"preguntas":[{"id":"L19-L1-002","ley":"L19","articulo":"1","articulo_txt":"Art. 1 Ley 19/2013","bloque_id":"L19|Título Preliminar","enunciado":"Según el artículo 1 de la Ley 19/2013, además de lo relativo a la transparencia y al derecho de acceso a la información, la Ley tiene por objeto establecer las obligaciones de buen gobierno que deben cumplir:","opciones":{"a":"Los responsables públicos, así como las consecuencias derivadas de su incumplimiento.","b":"Los empleados públicos, así como el procedimiento para exigir su responsabilidad patrimonial.","c":"Los cargos electos de las Entidades Locales, así como el régimen de sus incompatibilidades.","d":"Los funcionarios de carrera, así como las sanciones disciplinarias derivadas de su incumplimiento."},"correcta":"a","explicacion":"El art. 1 se refiere a «las obligaciones de buen gobierno que deben cumplir los responsables públicos así como las consecuencias derivadas de su incumplimiento»; es la opción a). Las opciones b), c) y d) cambian los destinatarios de esas obligaciones y añaden contenidos que el art. 1 no menciona.","cita":"«Esta Ley tiene por objeto ampliar y reforzar la transparencia de la actividad pública, regular y garantizar el derecho de acceso a la información relativa a aquella actividad y establecer las obligaciones de buen gobierno que deben cumplir los responsables públicos así como las consecuencias derivadas de su incumplimiento.»","dificultad":1},{"id":"L19-L1-001","ley":"L19","articulo":"1","articulo_txt":"Art. 1 Ley 19/2013","bloque_id":"L19|Título Preliminar","enunciado":"Según el artículo 1 de la Ley 19/2013, en relación con la transparencia de la actividad pública, la Ley tiene por objeto:","opciones":{"a":"Regularla y garantizarla.","b":"Declararla y promoverla.","c":"Fomentarla y supervisarla.","d":"Ampliarla y reforzarla."},"correcta":"d","explicacion":"El art. 1 señala como objeto «ampliar y reforzar la transparencia de la actividad pública»; es la opción d). La opción a) toma los verbos que el art. 1 aplica al derecho de acceso a la información («regular y garantizar»), no a la transparencia. Las opciones b) y c) emplean verbos que el art. 1 no utiliza.","cita":"«Esta Ley tiene por objeto ampliar y reforzar la transparencia de la actividad pública, regular y garantizar el derecho de acceso a la información relativa a aquella actividad y establecer las obligaciones de buen gobierno que deben cumplir los responsables públicos así como las consecuencias derivadas de su incumplimiento.»","dificultad":1},{"id":"L19-L1-007","ley":"L19","articulo":"2.1.f)","articulo_txt":"Art. 2.1.f) Ley 19/2013","bloque_id":"L19|Título I. Transparencia de la actividad pública · Capítulo I. Ámbito subjetivo de aplicación","enunciado":"¿Cuál de los siguientes NO figura entre los órganos e instituciones que enumera expresamente el artículo 2.1.f) de la Ley 19/2013?","opciones":{"a":"El Consejo General del Poder Judicial.","b":"El Banco de España.","c":"El Consejo Económico y Social.","d":"El Tribunal Supremo."},"correcta":"d","explicacion":"El Tribunal Supremo no aparece en el art. 2.1.f); es la opción d). Las opciones a), b) y c) figuran en la enumeración del art. 2.1.f), junto a la Casa de Su Majestad el Rey, el Congreso de los Diputados, el Senado, el Tribunal Constitucional, el Consejo de Estado, el Defensor del Pueblo, el Tribunal de Cuentas y las instituciones autonómicas análogas.","cita":"«f) La Casa de su Majestad el Rey, el Congreso de los Diputados, el Senado, el Tribunal Constitucional y el Consejo General del Poder Judicial, así como el Banco de España, el Consejo de Estado, el Defensor del Pueblo, el Tribunal de Cuentas, el Consejo Económico y Social y las instituciones autonómicas análogas, en relación con sus actividades sujetas a Derecho Administrativo.»","dificultad":2},{"id":"L19-L1-013","ley":"L19","articulo":"3.b)","articulo_txt":"Art. 3.b) Ley 19/2013","bloque_id":"L19|Título I. Transparencia de la actividad pública · Capítulo I. Ámbito subjetivo de aplicación","enunciado":"Según el artículo 3.b) de la Ley 19/2013, una entidad privada que no supere el umbral anual de ayudas o subvenciones previsto en ese precepto queda igualmente obligada cuando una parte del total de sus ingresos anuales tenga carácter de ayuda o subvención pública. ¿Qué proporción y qué cantidad mínima se exigen?","opciones":{"a":"Al menos el 30 % de sus ingresos anuales, siempre que alcancen como mínimo 5.000 euros.","b":"Al menos el 40 % de sus ingresos anuales, siempre que alcancen como mínimo 5.000 euros.","c":"Al menos el 40 % de sus ingresos anuales, siempre que alcancen como mínimo 10.000 euros.","d":"Al menos el 25 % de sus ingresos anuales, siempre que alcancen como mínimo 3.000 euros."},"correcta":"b","explicacion":"El art. 3.b) se refiere al supuesto en que «al menos el 40 % del total de sus ingresos anuales tengan carácter de ayuda o subvención pública, siempre que alcancen como mínimo la cantidad de 5.000 euros»; es la opción b). Las opciones a) y d) alteran el porcentaje, y la última también la cantidad mínima. La opción c) mantiene el porcentaje pero eleva la cantidad mínima.","cita":"«b) Las entidades privadas que perciban durante el período de un año ayudas o subvenciones públicas en una cuantía superior a 100.000 euros o cuando al menos el 40 % del total de sus ingresos anuales tengan carácter de ayuda o subvención pública, siempre que alcancen como mínimo la cantidad de 5.000 euros.»","dificultad":2},{"id":"L19-L1-011","ley":"L19","articulo":"3","articulo_txt":"Art. 3 Ley 19/2013","bloque_id":"L19|Título I. Transparencia de la actividad pública · Capítulo I. Ámbito subjetivo de aplicación","enunciado":"Según el artículo 3 de la Ley 19/2013, a los partidos políticos, organizaciones sindicales y organizaciones empresariales les son aplicables:","opciones":{"a":"Todas las disposiciones del título I, en los mismos términos que a las Administraciones Públicas.","b":"Únicamente las disposiciones del título II, relativas al buen gobierno.","c":"Únicamente las disposiciones del capítulo III del título I, relativas al derecho de acceso.","d":"Las disposiciones del capítulo II del título I, relativas a la publicidad activa."},"correcta":"d","explicacion":"El art. 3 dispone que «Las disposiciones del capítulo II de este título serán también aplicables» a los sujetos que enumera, entre ellos los de la letra a); el capítulo II del título I regula la publicidad activa. Es la opción d). Las opciones a), b) y c) no se corresponden con la remisión que hace el art. 3, que se limita al capítulo II del título I.","cita":"«Las disposiciones del capítulo II de este título serán también aplicables a: a) Los partidos políticos, organizaciones sindicales y organizaciones empresariales.»","dificultad":2},{"id":"L19-L1-012","ley":"L19","articulo":"3.b)","articulo_txt":"Art. 3.b) Ley 19/2013","bloque_id":"L19|Título I. Transparencia de la actividad pública · Capítulo I. Ámbito subjetivo de aplicación","enunciado":"Según el artículo 3.b) de la Ley 19/2013, se incluyen entre los otros sujetos obligados las entidades privadas que perciban durante el período de un año ayudas o subvenciones públicas en una cuantía:","opciones":{"a":"Superior a 60.000 euros.","b":"Superior a 100.000 euros.","c":"Igual o superior a 150.000 euros.","d":"Igual o superior a 200.000 euros."},"correcta":"b","explicacion":"El art. 3.b) fija el umbral en una cuantía «superior a 100.000 euros» durante el período de un año; es la opción b). Las opciones a), c) y d) indican cuantías que el art. 3.b) no recoge.","cita":"«b) Las entidades privadas que perciban durante el período de un año ayudas o subvenciones públicas en una cuantía superior a 100.000 euros o cuando al menos el 40 % del total de sus ingresos anuales tengan carácter de ayuda o subvención pública, siempre que alcancen como mínimo la cantidad de 5.000 euros.»","dificultad":1},{"id":"L19-L1-015","ley":"L19","articulo":"4","articulo_txt":"Art. 4 Ley 19/2013","bloque_id":"L19|Título I. Transparencia de la actividad pública · Capítulo I. Ámbito subjetivo de aplicación","enunciado":"Según el artículo 4 de la Ley 19/2013, la obligación de suministrar información que pesa sobre quienes presten servicios públicos o ejerzan potestades administrativas se extenderá a los adjudicatarios de contratos del sector público:","opciones":{"a":"En los términos que determine el Consejo de Transparencia y Buen Gobierno.","b":"En los términos previstos en el respectivo contrato.","c":"Solo cuando se trate de contratos sujetos a regulación armonizada.","d":"Solo durante el plazo de ejecución del contrato y su período de garantía."},"correcta":"b","explicacion":"El art. 4 dispone que «Esta obligación se extenderá a los adjudicatarios de contratos del sector público en los términos previstos en el respectivo contrato»; es la opción b). Las opciones a), c) y d) introducen remisiones o condiciones que el art. 4 no recoge.","cita":"«Las personas físicas y jurídicas distintas de las referidas en los artículos anteriores que presten servicios públicos o ejerzan potestades administrativas estarán obligadas a suministrar a la Administración, organismo o entidad de las previstas en el artículo 2.1 a la que se encuentren vinculadas, previo requerimiento, toda la información necesaria para el cumplimiento por aquéllos de las obligaciones previstas en este título. Esta obligación se extenderá a los adjudicatarios de contratos del sector público en los términos previstos en el respectivo contrato.»","dificultad":2},{"id":"L19-L1-018","ley":"L19","articulo":"5.3","articulo_txt":"Art. 5.3 Ley 19/2013","bloque_id":"L19|Título I. Transparencia de la actividad pública · Capítulo II. Publicidad activa","enunciado":"Según el artículo 5.3 de la Ley 19/2013, cuando la información sujeta a publicidad contuviera datos especialmente protegidos, la publicidad sólo se llevará a cabo:","opciones":{"a":"Previa disociación de los mismos.","b":"Previa autorización de la Agencia Española de Protección de Datos.","c":"Previo informe favorable del Consejo de Transparencia y Buen Gobierno.","d":"Previa resolución motivada del titular del órgano que custodie la información."},"correcta":"a","explicacion":"El art. 5.3 establece que, en ese caso, «la publicidad sólo se llevará a cabo previa disociación de los mismos»; es la opción a). Las opciones b), c) y d) exigen autorizaciones, informes o resoluciones previas que el art. 5.3 no prevé.","cita":"«3. Serán de aplicación, en su caso, los límites al derecho de acceso a la información pública previstos en el artículo 14 y, especialmente, el derivado de la protección de datos de carácter personal, regulado en el artículo 15. A este respecto, cuando la información contuviera datos especialmente protegidos, la publicidad sólo se llevará a cabo previa disociación de los mismos.»","dificultad":2},{"id":"L19-L1-032","ley":"L19","articulo":"8.1.a)","articulo_txt":"Art. 8.1.a) Ley 19/2013","bloque_id":"L19|Título I. Transparencia de la actividad pública · Capítulo II. Publicidad activa","enunciado":"Según el artículo 8.1.a) de la Ley 19/2013, ¿con qué periodicidad se prevé, respectivamente, la publicación de la información relativa a los contratos menores y la de la información estadística sobre la participación de las pymes en los contratos adjudicados?","opciones":{"a":"Semestralmente y trimestralmente.","b":"Mensualmente y trimestralmente.","c":"Trimestralmente y semestralmente.","d":"Trimestralmente y cuatrimestralmente."},"correcta":"c","explicacion":"El art. 8.1.a) dispone que la información de los contratos menores «podrá realizarse trimestralmente» y que la información estadística sobre pymes «se realizará semestralmente, a partir de un año de la publicación de la norma»; es la opción c). El art. 8.1.a) tiene la redacción dada por el artículo único de la Ley 14/2022, de 8 de julio. Las opciones a), b) y d) intercambian o alteran esas periodicidades.","cita":"«a) Todos los contratos, con indicación del objeto, duración, el importe de la licitación y de adjudicación, el procedimiento utilizado para su celebración, los instrumentos a través de los que, en su caso, se ha publicitado, el número de licitadores participantes en el procedimiento y la identidad del adjudicatario, así como las modificaciones del contrato. Igualmente serán objeto de publicación las decisiones de desistimiento y renuncia de los contratos. La publicación de la información relativa a los contratos menores podrá realizarse trimestralmente. […] Además, se publicará información estadística sobre el porcentaje de participación en contratos adjudicados, tanto en relación con su número como en relación con su valor, de la categoría de microempresas, pequeñas y medianas empresas (pymes), entendidas como tal según el anexo I del Reglamento (UE) n.º 651/2014 de la Comisión, de 17 de junio de 2014, para cada uno de los procedimientos y tipologías previstas en la legislación de contratos del sector público. La publicación de esta información se realizará semestralmente, a partir de un año de la publicación de la norma.»","dificultad":3},{"id":"L19-L1-041","ley":"L19","articulo":"9.1","articulo_txt":"Art. 9.1 Ley 19/2013","bloque_id":"L19|Título I. Transparencia de la actividad pública · Capítulo II. Publicidad activa","enunciado":"Según el artículo 9.1 de la Ley 19/2013, el cumplimiento por la Administración General del Estado de las obligaciones de publicidad activa será objeto de control por parte de:","opciones":{"a":"El Consejo de Transparencia y Buen Gobierno.","b":"La Intervención General de la Administración del Estado.","c":"El Defensor del Pueblo.","d":"La Agencia Española de Protección de Datos."},"correcta":"a","explicacion":"El art. 9.1 atribuye ese control al «Consejo de Transparencia y Buen Gobierno»; es la opción a). Las opciones b), c) y d) mencionan órganos a los que el art. 9.1 no atribuye ese control.","cita":"«1. El cumplimiento por la Administración General del Estado de las obligaciones contenidas en este capítulo será objeto de control por parte del Consejo de Transparencia y Buen Gobierno.»","dificultad":1},{"id":"L19-L1-045","ley":"L19","articulo":"10.2","articulo_txt":"Art. 10.2 Ley 19/2013","bloque_id":"L19|Título I. Transparencia de la actividad pública · Capítulo II. Publicidad activa","enunciado":"Según el artículo 10.2 de la Ley 19/2013, el Portal de la Transparencia incluirá, en los términos que se establezcan reglamentariamente, la información de la Administración General del Estado:","opciones":{"a":"Cuyo acceso se solicite con mayor frecuencia.","b":"Que haya sido declarada de interés preferente por el Consejo de Ministros.","c":"Cuyo acceso haya sido denegado y luego estimado en vía de reclamación.","d":"Que afecte a un mayor número de ciudadanos, según estudios estadísticos."},"correcta":"a","explicacion":"El art. 10.2 se refiere a la información de la Administración General del Estado «cuyo acceso se solicite con mayor frecuencia»; es la opción a). Las opciones b), c) y d) utilizan criterios que el art. 10.2 no recoge.","cita":"«2. El Portal de la Transparencia incluirá, en los términos que se establezcan reglamentariamente, la información de la Administración General del Estado, cuyo acceso se solicite con mayor frecuencia.»","dificultad":2},{"id":"L19-L1-047","ley":"L19","articulo":"11.a)","articulo_txt":"Art. 11.a) Ley 19/2013","bloque_id":"L19|Título I. Transparencia de la actividad pública · Capítulo II. Publicidad activa","enunciado":"Según el artículo 11 de la Ley 19/2013, ¿cuál de los principios técnicos a los que deben adecuarse las prescripciones del Portal de la Transparencia implica que se proporcionará información estructurada sobre los documentos y recursos de información con vistas a facilitar la identificación y búsqueda de la información?","opciones":{"a":"Interoperabilidad.","b":"Reutilización.","c":"Accesibilidad.","d":"Calidad."},"correcta":"c","explicacion":"El art. 11.a) define así el principio de «Accesibilidad»; es la opción c). Las opciones a) y b) son también principios del art. 11, pero el de interoperabilidad remite al Esquema Nacional de Interoperabilidad y a las normas técnicas de interoperabilidad, y el de reutilización al fomento de formatos reutilizables. La opción d) no figura entre los principios técnicos del art. 11.","cita":"«a) Accesibilidad: se proporcionará información estructurada sobre los documentos y recursos de información con vistas a facilitar la identificación y búsqueda de la información.»","dificultad":2},{"id":"L19-L2-001","ley":"L19","articulo":"12","articulo_txt":"Art. 12 Ley 19/2013","bloque_id":"L19|Título I. Transparencia de la actividad pública · Capítulo III. Derecho de acceso a la información pública · Sección 1.ª Régimen general","enunciado":"Según el artículo 12 de la Ley 19/2013, ¿quiénes son titulares del derecho a acceder a la información pública?","opciones":{"a":"Los ciudadanos españoles y los nacionales de los demás Estados miembros de la Unión Europea.","b":"Todas las personas.","c":"Las personas que acrediten un interés legítimo en la información solicitada.","d":"Quienes tengan la condición de interesados en un procedimiento administrativo en curso."},"correcta":"b","explicacion":"El art. 12 dispone que «Todas las personas tienen derecho a acceder a la información pública»; es la opción b). Las opciones a) y c) introducen requisitos de nacionalidad o de interés legítimo que el art. 12 no exige. La opción d) es falsa: la condición de interesado no es requisito del derecho; según la disposición adicional primera.1, el acceso de los interesados a los documentos de un procedimiento en curso se rige por la normativa de ese procedimiento.","cita":"«Todas las personas tienen derecho a acceder a la información pública, en los términos previstos en el artículo 105.b) de la Constitución Española, desarrollados por esta Ley.»","dificultad":1},{"id":"L19-L2-004","ley":"L19","articulo":"14.1.g","articulo_txt":"Art. 14.1.g Ley 19/2013","bloque_id":"L19|Título I. Transparencia de la actividad pública · Capítulo III. Derecho de acceso a la información pública · Sección 1.ª Régimen general","enunciado":"Según el artículo 14.1 de la Ley 19/2013, el derecho de acceso podrá ser limitado cuando acceder a la información suponga un perjuicio para:","opciones":{"a":"Las funciones administrativas de vigilancia, inspección y control.","b":"Las funciones administrativas de planificación, programación y evaluación.","c":"La eficacia y la celeridad en el funcionamiento de los servicios públicos.","d":"El ejercicio de la potestad reglamentaria y de la iniciativa legislativa."},"correcta":"a","explicacion":"El art. 14.1.g) menciona «Las funciones administrativas de vigilancia, inspección y control»; es la opción a). Las opciones b), c) y d) describen ámbitos que no figuran en la relación del art. 14.1.","cita":"«1. El derecho de acceso podrá ser limitado cuando acceder a la información suponga un perjuicio para: […] g) Las funciones administrativas de vigilancia, inspección y control.»","dificultad":2},{"id":"L19-L2-006","ley":"L19","articulo":"14.2","articulo_txt":"Art. 14.2 Ley 19/2013","bloque_id":"L19|Título I. Transparencia de la actividad pública · Capítulo III. Derecho de acceso a la información pública · Sección 1.ª Régimen general","enunciado":"Según el artículo 14.2 de la Ley 19/2013, la aplicación de los límites al derecho de acceso será justificada y proporcionada a su objeto y finalidad de protección y atenderá a las circunstancias del caso concreto, especialmente a:","opciones":{"a":"La condición de interesado del solicitante en un procedimiento administrativo en curso.","b":"La concurrencia de un interés público o privado superior que justifique el acceso.","c":"El coste que para el órgano suponga la búsqueda y la entrega de la información.","d":"La naturaleza pública o privada de la persona o entidad que solicite la información."},"correcta":"b","explicacion":"El art. 14.2 ordena atender «especialmente a la concurrencia de un interés público o privado superior que justifique el acceso»; es la opción b). Las opciones a), c) y d) recogen circunstancias que el art. 14.2 no menciona.","cita":"«2. La aplicación de los límites será justificada y proporcionada a su objeto y finalidad de protección y atenderá a las circunstancias del caso concreto, especialmente a la concurrencia de un interés público o privado superior que justifique el acceso.»","dificultad":2},{"id":"L19-L2-009","ley":"L19","articulo":"15.1","articulo_txt":"Art. 15.1 Ley 19/2013","bloque_id":"L19|Título I. Transparencia de la actividad pública · Capítulo III. Derecho de acceso a la información pública · Sección 1.ª Régimen general","enunciado":"Según el artículo 15.1 de la Ley 19/2013, si la información incluyese datos relativos a la comisión de infracciones penales o administrativas que no conllevasen la amonestación pública al infractor, el acceso solo se podrá autorizar:","opciones":{"a":"Si se cuenta con el consentimiento expreso del afectado o si el acceso estuviera amparado por una norma con rango de ley.","b":"Si el órgano competente, previa audiencia del afectado, lo acuerda mediante resolución motivada.","c":"Si han transcurrido los plazos legalmente previstos para la cancelación de los antecedentes penales o administrativos del afectado.","d":"Si lo autoriza previamente la Agencia Española de Protección de Datos, oído el afectado."},"correcta":"a","explicacion":"El segundo párrafo del art. 15.1 dispone que en ese caso «el acceso solo se podrá autorizar en caso de que se cuente con el consentimiento expreso del afectado o si aquel estuviera amparado por una norma con rango de ley»; es la opción a). Las opciones b), c) y d) establecen condiciones que el art. 15.1 no prevé. El apartado 1 del art. 15 tiene la redacción dada por la disposición final 11.2 de la Ley Orgánica 3/2018, de 5 de diciembre.","cita":"«Si la información incluyese datos personales que hagan referencia al origen racial, a la salud o a la vida sexual, incluyese datos genéticos o biométricos o contuviera datos relativos a la comisión de infracciones penales o administrativas que no conllevasen la amonestación pública al infractor, el acceso solo se podrá autorizar en caso de que se cuente con el consentimiento expreso del afectado o si aquel estuviera amparado por una norma con rango de ley.»","dificultad":2},{"id":"L19-L2-010","ley":"L19","articulo":"15.2","articulo_txt":"Art. 15.2 Ley 19/2013","bloque_id":"L19|Título I. Transparencia de la actividad pública · Capítulo III. Derecho de acceso a la información pública · Sección 1.ª Régimen general","enunciado":"Según el artículo 15.2 de la Ley 19/2013, con carácter general, y salvo que en el caso concreto prevalezca la protección de datos personales u otros derechos constitucionalmente protegidos sobre el interés público en la divulgación, se concederá el acceso a información que contenga:","opciones":{"a":"Datos relativos a las retribuciones y al patrimonio personal de los empleados públicos del órgano.","b":"Datos meramente identificativos relacionados con la organización, funcionamiento o actividad pública del órgano.","c":"Datos personales de los ciudadanos que se hayan relacionado con el órgano en el ejercicio de sus funciones.","d":"Datos relativos a la vida privada de los titulares del órgano que tengan relevancia para su actividad pública."},"correcta":"b","explicacion":"El art. 15.2 se refiere a la información que contenga «datos meramente identificativos relacionados con la organización, funcionamiento o actividad pública del órgano»; es la opción b). Las opciones a), c) y d) describen datos a los que el art. 15.2 no se refiere.","cita":"«2. Con carácter general, y salvo que en el caso concreto prevalezca la protección de datos personales u otros derechos constitucionalmente protegidos sobre el interés público en la divulgación que lo impida, se concederá el acceso a información que contenga datos meramente identificativos relacionados con la organización, funcionamiento o actividad pública del órgano.»","dificultad":2},{"id":"L19-L2-019","ley":"L19","articulo":"18.1.c","articulo_txt":"Art. 18.1.c Ley 19/2013","bloque_id":"L19|Título I. Transparencia de la actividad pública · Capítulo III. Derecho de acceso a la información pública · Sección 2.ª Ejercicio del derecho de acceso a la información pública","enunciado":"Según el artículo 18.1 de la Ley 19/2013, es causa de inadmisión que la solicitud se refiera a información para cuya divulgación sea necesaria:","opciones":{"a":"La autorización previa del tercero al que se refiera.","b":"Una consulta previa al Consejo de Transparencia y Buen Gobierno.","c":"Su traducción previa a una lengua distinta de la original.","d":"Una acción previa de reelaboración."},"correcta":"d","explicacion":"El art. 18.1.c) incluye las solicitudes «Relativas a información para cuya divulgación sea necesaria una acción previa de reelaboración»; es la opción d). Las opciones a), b) y c) describen supuestos que no figuran entre las causas de inadmisión del art. 18.1.","cita":"«1. Se inadmitirán a trámite, mediante resolución motivada, las solicitudes: […] c) Relativas a información para cuya divulgación sea necesaria una acción previa de reelaboración.»","dificultad":1},{"id":"L19-L2-025","ley":"L19","articulo":"19.3","articulo_txt":"Art. 19.3 Ley 19/2013","bloque_id":"L19|Título I. Transparencia de la actividad pública · Capítulo III. Derecho de acceso a la información pública · Sección 2.ª Ejercicio del derecho de acceso a la información pública","enunciado":"Según el artículo 19.3 de la Ley 19/2013, cuando se dé a terceros afectados por la información solicitada la ocasión de formular alegaciones, el plazo para dictar resolución:","opciones":{"a":"Seguirá corriendo, de modo que la falta de alegaciones no impedirá resolver en plazo.","b":"Quedará interrumpido y volverá a computarse íntegramente desde la fecha de presentación de las alegaciones.","c":"Quedará suspendido hasta que se reciban las alegaciones o transcurra el plazo para su presentación.","d":"Solo quedará suspendido si el tercero afectado lo solicita expresamente en su escrito."},"correcta":"c","explicacion":"El art. 19.3 prevé informar al solicitante «de la suspensión del plazo para dictar resolución hasta que se hayan recibido las alegaciones o haya transcurrido el plazo para su presentación»; es la opción c). Las opciones a), b) y d) no se ajustan a la suspensión que establece el art. 19.3.","cita":"«3. Si la información solicitada pudiera afectar a derechos o intereses de terceros, debidamente identificados, se les concederá un plazo de quince días para que puedan realizar las alegaciones que estimen oportunas. El solicitante deberá ser informado de esta circunstancia, así como de la suspensión del plazo para dictar resolución hasta que se hayan recibido las alegaciones o haya transcurrido el plazo para su presentación.»","dificultad":2},{"id":"L19-L2-029","ley":"L19","articulo":"20.2","articulo_txt":"Art. 20.2 Ley 19/2013","bloque_id":"L19|Título I. Transparencia de la actividad pública · Capítulo III. Derecho de acceso a la información pública · Sección 2.ª Ejercicio del derecho de acceso a la información pública","enunciado":"Según el artículo 20.2 de la Ley 19/2013, ¿cuál de las siguientes resoluciones en materia de acceso NO figura entre las que deben ser motivadas?","opciones":{"a":"La que deniegue el acceso, total o parcialmente, a la información solicitada.","b":"La que conceda el acceso a través de una modalidad distinta a la solicitada por el interesado.","c":"La que permita el acceso cuando haya habido oposición de un tercero.","d":"La que conceda íntegramente el acceso en la modalidad solicitada, sin oposición de terceros."},"correcta":"d","explicacion":"El art. 20.2 exige motivar las resoluciones que denieguen el acceso, las que concedan el acceso parcial o a través de una modalidad distinta a la solicitada y las que permitan el acceso cuando haya habido oposición de un tercero; no incluye la que concede íntegramente el acceso solicitado, que es la opción d). Las opciones a), b) y c) figuran en el art. 20.2.","cita":"«2. Serán motivadas las resoluciones que denieguen el acceso, las que concedan el acceso parcial o a través de una modalidad distinta a la solicitada y las que permitan el acceso cuando haya habido oposición de un tercero. En este último supuesto, se indicará expresamente al interesado que el acceso sólo tendrá lugar cuando haya transcurrido el plazo del artículo 22.2.»","dificultad":2},{"id":"L19-L2-035","ley":"L19","articulo":"22.2","articulo_txt":"Art. 22.2 Ley 19/2013","bloque_id":"L19|Título I. Transparencia de la actividad pública · Capítulo III. Derecho de acceso a la información pública · Sección 2.ª Ejercicio del derecho de acceso a la información pública","enunciado":"Según el artículo 22.2 de la Ley 19/2013, si ha existido oposición de tercero, el acceso concedido solo tendrá lugar cuando:","opciones":{"a":"El Consejo de Transparencia y Buen Gobierno haya confirmado la resolución, previa reclamación presentada por el tercero que se opuso al acceso.","b":"Haya transcurrido el plazo para interponer la reclamación ante el Consejo de Transparencia y Buen Gobierno sin que el tercero la haya presentado.","c":"El tercero haya sido oído de nuevo y haya manifestado expresamente su conformidad con la entrega de la información solicitada.","d":"Haya transcurrido el plazo para interponer recurso contencioso-administrativo sin que se haya formalizado o haya sido resuelto confirmando el derecho a recibir la información."},"correcta":"d","explicacion":"El art. 22.2 dispone que el acceso solo tendrá lugar cuando, habiéndose concedido, «haya transcurrido el plazo para interponer recurso contencioso administrativo sin que se haya formalizado o haya sido resuelto confirmando el derecho a recibir la información»; es la opción d). Las opciones a), b) y c) no recogen la condición que fija el art. 22.2.","cita":"«2. Si ha existido oposición de tercero, el acceso sólo tendrá lugar cuando, habiéndose concedido dicho acceso, haya transcurrido el plazo para interponer recurso contencioso administrativo sin que se haya formalizado o haya sido resuelto confirmando el derecho a recibir la información.»","dificultad":3},{"id":"L19-L2-038","ley":"L19","articulo":"23.1","articulo_txt":"Art. 23.1 Ley 19/2013","bloque_id":"L19|Título I. Transparencia de la actividad pública · Capítulo III. Derecho de acceso a la información pública · Sección 3.ª Régimen de impugnaciones","enunciado":"Según el artículo 23.1 de la Ley 19/2013, la reclamación prevista en su artículo 24 tendrá la consideración de:","opciones":{"a":"Sustitutiva de los recursos administrativos.","b":"Previa y obligatoria al recurso de alzada.","c":"Complementaria del recurso de reposición.","d":"Sustitutiva del recurso contencioso-administrativo."},"correcta":"a","explicacion":"El art. 23.1 atribuye a la reclamación «la consideración de sustitutiva de los recursos administrativos»; es la opción a). Las opciones b) y c) presuponen la interposición de recursos administrativos, que la reclamación sustituye. La opción d) es falsa: la reclamación no sustituye la vía contencioso-administrativa. El art. 23.1 se remite al art. 107.2 de la Ley 30/1992, hoy derogada; según la disposición final cuarta de la Ley 39/2015, las referencias a esa ley se entienden hechas a la Ley 39/2015 o a la Ley 40/2015, según corresponda; en materia de recursos, el art. 112.2 de la Ley 39/2015 permite a las leyes sustituir los recursos de alzada y de reposición por otros procedimientos de impugnación o reclamación.","cita":"«1. La reclamación prevista en el artículo siguiente tendrá la consideración de sustitutiva de los recursos administrativos de conformidad con lo dispuesto en el artículo 107.2 de la Ley 30/1992, de 26 de noviembre, de Régimen Jurídico de las Administraciones Públicas y del Procedimiento Administrativo Común.»","dificultad":2},{"id":"L19-L2-040","ley":"L19","articulo":"24.1","articulo_txt":"Art. 24.1 Ley 19/2013","bloque_id":"L19|Título I. Transparencia de la actividad pública · Capítulo III. Derecho de acceso a la información pública · Sección 3.ª Régimen de impugnaciones","enunciado":"Según el artículo 24.1 de la Ley 19/2013, la reclamación ante el Consejo de Transparencia y Buen Gobierno frente a las resoluciones en materia de acceso podrá interponerse:","opciones":{"a":"Con carácter potestativo y previo a su impugnación en vía contencioso-administrativa.","b":"Con carácter obligatorio y previo a su impugnación en vía contencioso-administrativa.","c":"Con carácter potestativo y simultáneo al recurso contencioso-administrativo.","d":"Solo frente a las resoluciones que denieguen totalmente el acceso solicitado."},"correcta":"a","explicacion":"El art. 24.1 prevé esta reclamación «con carácter potestativo y previo a su impugnación en vía contencioso-administrativa»; es la opción a). La opción b) es falsa: la reclamación no es obligatoria, y el art. 20.5 permite recurrir directamente ante la Jurisdicción Contencioso-administrativa. La opción c) es falsa: la reclamación es previa a la vía contencioso-administrativa, no simultánea. La opción d) es falsa: cabe frente a toda resolución en materia de acceso, no solo frente a las que lo deniegan totalmente.","cita":"«1. Frente a toda resolución expresa o presunta en materia de acceso podrá interponerse una reclamación ante el Consejo de Transparencia y Buen Gobierno, con carácter potestativo y previo a su impugnación en vía contencioso-administrativa.»","dificultad":2},{"id":"L19-L5-011","ley":"L19","articulo":"24.3","articulo_txt":"Art. 24.3 Ley 19/2013","bloque_id":"L19|Título I. Transparencia de la actividad pública · Capítulo III. Derecho de acceso a la información pública · Sección 3.ª Régimen de impugnaciones","enunciado":"Según el artículo 24.3 de la Ley 19/2013, cuando la denegación del acceso a la información se fundamente en la protección de derechos o intereses de terceros, previamente a la resolución de la reclamación:","opciones":{"a":"Se solicitará un informe preceptivo a la Agencia Española de Protección de Datos sobre la procedencia de la divulgación.","b":"Se dará traslado de la reclamación al órgano que denegó el acceso para que pueda revisar de oficio su resolución.","c":"Se otorgará trámite de audiencia a las personas que pudieran resultar afectadas para que aleguen lo que a su derecho convenga.","d":"Se dará audiencia a los terceros que se hubieran opuesto al acceso durante la tramitación de la solicitud, pero no a los demás posibles afectados."},"correcta":"c","explicacion":"El párrafo segundo del art. 24.3 dispone que «se otorgará, previamente a la resolución de la reclamación, trámite de audiencia a las personas que pudieran resultar afectadas para que aleguen lo que a su derecho convenga»; es la opción c). La opción d) es falsa porque limita la audiencia a quienes se opusieron al acceso, cuando el precepto la concede a todas las personas que pudieran resultar afectadas. Las opciones a) y b) describen trámites que el art. 24.3 no prevé.","cita":"«Cuando la denegación del acceso a la información se fundamente en la protección de derechos o intereses de terceros se otorgará, previamente a la resolución de la reclamación, trámite de audiencia a las personas que pudieran resultar afectadas para que aleguen lo que a su derecho convenga.»","dificultad":2},{"id":"L19-L2-042","ley":"L19","articulo":"24.4","articulo_txt":"Art. 24.4 Ley 19/2013","bloque_id":"L19|Título I. Transparencia de la actividad pública · Capítulo III. Derecho de acceso a la información pública · Sección 3.ª Régimen de impugnaciones","enunciado":"Según el artículo 24.4 de la Ley 19/2013, el plazo máximo para resolver y notificar la resolución de la reclamación será de:","opciones":{"a":"Tres meses.","b":"Seis meses.","c":"Dos meses.","d":"Cuatro meses."},"correcta":"a","explicacion":"El art. 24.4 fija un plazo máximo de «tres meses, transcurrido el cual, la reclamación se entenderá desestimada»; es la opción a). Las opciones b), c) y d) indican plazos que no figuran en el art. 24.4.","cita":"«4. El plazo máximo para resolver y notificar la resolución será de tres meses, transcurrido el cual, la reclamación se entenderá desestimada.»","dificultad":2},{"id":"L19-L3-006","ley":"L19","articulo":"26.3","articulo_txt":"Art. 26.3 Ley 19/2013","bloque_id":"L19|Título II. Buen gobierno","enunciado":"Según el artículo 26.3 de la Ley 19/2013, los principios establecidos en ese artículo informarán la interpretación y aplicación:","opciones":{"a":"Del régimen de incompatibilidades de los altos cargos.","b":"De las obligaciones de publicidad activa del título I.","c":"Del régimen sancionador regulado en el título II.","d":"Del procedimiento de nombramiento de los altos cargos."},"correcta":"c","explicacion":"El art. 26.3 dispone que esos principios «informarán la interpretación y aplicación del régimen sancionador regulado en este título»; es la opción c). Las opciones a), b) y d) mencionan ámbitos a los que el art. 26.3 no se refiere.","cita":"«3. Los principios establecidos en este artículo informarán la interpretación y aplicación del régimen sancionador regulado en este título.»","dificultad":1},{"id":"L19-L5-013","ley":"L19","articulo":"30.5.e)","articulo_txt":"Art. 30.5.e) Ley 19/2013","bloque_id":"L19|Título II. Buen gobierno","enunciado":"Según el artículo 30.5 de la Ley 19/2013, ¿cuál de los siguientes figura expresamente entre los criterios de acuerdo con los cuales se sancionará la comisión de infracciones muy graves, graves o leves?","opciones":{"a":"La antigüedad del infractor en el desempeño de cargos públicos en las distintas Administraciones.","b":"La circunstancia de haber procedido a la subsanación de la infracción por propia iniciativa.","c":"El rango del cargo que desempeñaba el infractor dentro de la estructura de su Administración.","d":"El tiempo de mandato que le reste al infractor en el momento de dictarse la resolución."},"correcta":"b","explicacion":"El art. 30.5.e) incluye «La circunstancia de haber procedido a la subsanación de la infracción por propia iniciativa»; es la opción b). Las opciones a), c) y d) recogen circunstancias que no figuran entre los criterios del art. 30.5 ni entre los del art. 29.3 de la Ley 40/2015. La remisión del art. 30.5 al art. 131.3 de la Ley 30/1992 se lee conforme a la disposición final cuarta de la Ley 39/2015, según la cual esas referencias «se entenderán hechas a la Ley del Procedimiento Administrativo Común de las Administraciones Públicas o a la Ley de Régimen Jurídico del Sector Público, según corresponda».","cita":"«a) La naturaleza y entidad de la infracción. b) La gravedad del peligro ocasionado o del perjuicio causado. c) Las ganancias obtenidas, en su caso, como consecuencia de los actos u omisiones constitutivos de la infracción. d) Las consecuencias desfavorables de los hechos para la Hacienda Pública respectiva. e) La circunstancia de haber procedido a la subsanación de la infracción por propia iniciativa. f) La reparación de los daños o perjuicios causados.»","dificultad":2},{"id":"L19-L3-017","ley":"L19","articulo":"31.1","articulo_txt":"Art. 31.1 Ley 19/2013","bloque_id":"L19|Título II. Buen gobierno","enunciado":"Según el artículo 31.1 de la Ley 19/2013, la responsabilidad será exigida en procedimiento administrativo instruido al efecto, sin perjuicio de dar conocimiento de los hechos, por si procediese la incoación del oportuno procedimiento de responsabilidad contable:","opciones":{"a":"A la Intervención General de la Administración del Estado.","b":"Al Tribunal de Cuentas.","c":"Al Consejo de Transparencia y Buen Gobierno.","d":"Al Defensor del Pueblo."},"correcta":"b","explicacion":"El art. 31.1 prevé dar conocimiento de los hechos «al Tribunal de Cuentas por si procediese, en su caso, la incoación del oportuno procedimiento de responsabilidad contable»; es la opción b). Las opciones a), c) y d) mencionan órganos a los que el art. 31.1 no se refiere.","cita":"«La responsabilidad será exigida en procedimiento administrativo instruido al efecto, sin perjuicio de dar conocimiento de los hechos al Tribunal de Cuentas por si procediese, en su caso, la incoación del oportuno procedimiento de responsabilidad contable.»","dificultad":1},{"id":"L19-L3-020","ley":"L19","articulo":"31.4.a)","articulo_txt":"Art. 31.4.a) Ley 19/2013","bloque_id":"L19|Título II. Buen gobierno","enunciado":"Según el artículo 31.4 de la Ley 19/2013, cuando el alto cargo tenga la condición de miembro del Gobierno o Secretario de Estado, la competencia para la imposición de sanciones corresponderá:","opciones":{"a":"Al Presidente del Gobierno.","b":"A la Comisión General de Secretarios de Estado y Subsecretarios.","c":"Al Congreso de los Diputados.","d":"Al Consejo de Ministros."},"correcta":"d","explicacion":"El art. 31.4.a) atribuye esa competencia «Al Consejo de Ministros»; es la opción d). Las opciones a), b) y c) mencionan órganos a los que el art. 31.4.a) no atribuye la imposición de sanciones.","cita":"«4. La competencia para la imposición de sanciones corresponderá: a) Al Consejo de Ministros cuando el alto cargo tenga la condición de miembro del Gobierno o Secretario de Estado.»","dificultad":1},{"id":"L19-L3-026","ley":"L19","articulo":"36.3","articulo_txt":"Art. 36.3 Ley 19/2013","bloque_id":"L19|Título III. Consejo de Transparencia y Buen Gobierno","enunciado":"Según el artículo 36.3 de la Ley 19/2013, la condición de miembro de la Comisión del Consejo de Transparencia y Buen Gobierno:","opciones":{"a":"Exigirá dedicación exclusiva y dará derecho a la remuneración que se fije en el Estatuto del Consejo.","b":"No exigirá dedicación exclusiva, pero dará derecho a la remuneración que se fije en el Estatuto del Consejo.","c":"No exigirá dedicación exclusiva ni dará derecho a remuneración, con excepción de lo previsto en el artículo siguiente.","d":"Exigirá dedicación exclusiva, aunque no dará derecho a remuneración, con excepción de lo previsto en el artículo siguiente."},"correcta":"c","explicacion":"El art. 36.3 establece que esa condición «no exigirá dedicación exclusiva ni dará derecho a remuneración con excepción de lo previsto en el artículo siguiente», que regula al Presidente; es la opción c). Las opciones a), b) y d) alteran el régimen de dedicación o de remuneración que fija el art. 36.3.","cita":"«3. La condición de miembro de la Comisión del Consejo de Transparencia y Buen Gobierno no exigirá dedicación exclusiva ni dará derecho a remuneración con excepción de lo previsto en el artículo siguiente.»","dificultad":2},{"id":"L19-L3-032","ley":"L19","articulo":"38.2.a)","articulo_txt":"Art. 38.2.a) Ley 19/2013","bloque_id":"L19|Título III. Consejo de Transparencia y Buen Gobierno","enunciado":"Según el artículo 38.2 de la Ley 19/2013, ¿cuál de las siguientes funciones corresponde al Presidente del Consejo de Transparencia y Buen Gobierno?","opciones":{"a":"Adoptar recomendaciones para el mejor cumplimiento de las obligaciones contenidas en esta Ley.","b":"Evaluar el grado de aplicación de esta Ley y elaborar anualmente una memoria sobre su cumplimiento.","c":"Promover actividades de formación y sensibilización para un mejor conocimiento de esta Ley.","d":"Adoptar criterios de interpretación uniforme de las obligaciones contenidas en esta Ley."},"correcta":"d","explicacion":"El art. 38.2.a) atribuye al Presidente la función de «Adoptar criterios de interpretación uniforme de las obligaciones contenidas en esta Ley»; es la opción d). Las opciones a), b) y c) recogen funciones que el art. 38.1 encomienda al Consejo, no al Presidente en el art. 38.2.","cita":"«2. El Presidente del Consejo de Transparencia y Buen Gobierno ejercerá las siguientes funciones: a) Adoptar criterios de interpretación uniforme de las obligaciones contenidas en esta Ley.»","dificultad":3},{"id":"L19-L5-019","ley":"L19","articulo":"38.2.d)","articulo_txt":"Art. 38.2.d) Ley 19/2013","bloque_id":"L19|Título III. Consejo de Transparencia y Buen Gobierno","enunciado":"Según el artículo 38.2 de la Ley 19/2013, el Presidente del Consejo de Transparencia y Buen Gobierno responderá las consultas que le planteen los órganos encargados de tramitar y resolver las solicitudes de acceso a la información. Esas consultas se plantean con carácter:","opciones":{"a":"Preceptivo.","b":"Preceptivo y vinculante.","c":"Facultativo.","d":"Preceptivo solo si hay datos personales."},"correcta":"c","explicacion":"El art. 38.2.d) se refiere a las consultas que, «con carácter facultativo», le planteen esos órganos; es la opción c). Las opciones a), b) y d) les atribuyen un carácter preceptivo que el art. 38.2.d) no establece.","cita":"«d) Responder las consultas que, con carácter facultativo, le planteen los órganos encargados de tramitar y resolver las solicitudes de acceso a la información.»","dificultad":2},{"id":"L19-L3-034","ley":"L19","articulo":"39.1.c)","articulo_txt":"Art. 39.1.c) Ley 19/2013","bloque_id":"L19|Título III. Consejo de Transparencia y Buen Gobierno","enunciado":"Según el artículo 39.1.c) de la Ley 19/2013, en sus adquisiciones patrimoniales, en lo no previsto en la Ley 33/2003, de 3 de noviembre, del Patrimonio de las Administraciones Públicas, el Consejo de Transparencia y Buen Gobierno se regirá por:","opciones":{"a":"La Ley 47/2003, de 26 de noviembre, General Presupuestaria.","b":"El Derecho administrativo general.","c":"El Derecho privado.","d":"Las normas que dicte su Presidente."},"correcta":"c","explicacion":"Según el art. 39.1.c), en lo no previsto en la Ley 33/2003, el Consejo se rige «por el Derecho privado en sus adquisiciones patrimoniales»; es la opción c). Las opciones a), b) y d) no son las normas a las que remite el art. 39.1.c) para esas adquisiciones.","cita":"«1. El Consejo de Transparencia y Buen Gobierno se regirá, además de por lo dispuesto en esta Ley, por: […] c) La Ley 33/2003, de 3 de noviembre, del Patrimonio de las Administraciones Públicas, y, en lo no previsto en ella, por el Derecho privado en sus adquisiciones patrimoniales.»","dificultad":2},{"id":"L19-L3-037","ley":"L19","articulo":"DA 1ª.1","articulo_txt":"DA 1ª.1 · Ley 19/2013","bloque_id":"L19|Disposiciones adicionales","enunciado":"Según la disposición adicional primera de la Ley 19/2013, el acceso por parte de quienes tengan la condición de interesados en un procedimiento administrativo en curso a los documentos que se integren en el mismo se regirá por:","opciones":{"a":"El capítulo III del título I de la Ley 19/2013, con carácter exclusivo.","b":"Lo que acuerde el órgano instructor, previo informe del Consejo de Transparencia y Buen Gobierno.","c":"La Ley 19/2013, salvo que el interesado opte por la normativa del procedimiento.","d":"La normativa reguladora del correspondiente procedimiento administrativo."},"correcta":"d","explicacion":"La DA 1.ª.1 declara aplicable a ese acceso «La normativa reguladora del correspondiente procedimiento administrativo»; es la opción d). Las opciones a), b) y c) no se ajustan a la remisión que hace la DA 1.ª.1.","cita":"«1. La normativa reguladora del correspondiente procedimiento administrativo será la aplicable al acceso por parte de quienes tengan la condición de interesados en un procedimiento administrativo en curso a los documentos que se integren en el mismo.»","dificultad":1},{"id":"L19-L3-038","ley":"L19","articulo":"DA 1ª.3","articulo_txt":"DA 1ª.3 · Ley 19/2013","bloque_id":"L19|Disposiciones adicionales","enunciado":"La disposición adicional primera.3 de la Ley 19/2013 menciona expresamente, como materias a cuyo acceso se aplicará esta Ley en lo no previsto en sus respectivas normas reguladoras:","opciones":{"a":"La información tributaria y la de la Seguridad Social.","b":"La información clasificada y la de los archivos históricos.","c":"La información estadística y la de los registros públicos.","d":"La información ambiental y la destinada a la reutilización."},"correcta":"d","explicacion":"La DA 1.ª.3 cita «la información ambiental» y la «destinada a la reutilización»; es la opción d). Las opciones a), b) y c) mencionan materias que la DA 1.ª.3 no cita expresamente.","cita":"«3. En este sentido, esta Ley será de aplicación, en lo no previsto en sus respectivas normas reguladoras, al acceso a la información ambiental y a la destinada a la reutilización.»","dificultad":2},{"id":"L19-L3-042","ley":"L19","articulo":"DA 5ª","articulo_txt":"DA 5ª · Ley 19/2013","bloque_id":"L19|Disposiciones adicionales","enunciado":"Según la disposición adicional quinta de la Ley 19/2013, el Consejo de Transparencia y Buen Gobierno y la Agencia Española de Protección de Datos adoptarán conjuntamente los criterios de aplicación, en su ámbito de actuación, de las reglas contenidas en:","opciones":{"a":"El artículo 14 de esta Ley.","b":"El artículo 18 de esta Ley.","c":"El artículo 20 de esta Ley.","d":"El artículo 15 de esta Ley."},"correcta":"d","explicacion":"La DA 5.ª se refiere a «las reglas contenidas en el artículo 15 de esta Ley», que regula la protección de datos personales; es la opción d). Las opciones a), b) y c) citan artículos que regulan los límites al derecho de acceso, las causas de inadmisión y la resolución, a los que la DA 5.ª no se refiere.","cita":"«El Consejo de Transparencia y Buen Gobierno y la Agencia Española de Protección de Datos adoptarán conjuntamente los criterios de aplicación, en su ámbito de actuación, de las reglas contenidas en el artículo 15 de esta Ley, en particular en lo que respecta a la ponderación del interés público en el acceso a la información y la garantía de los derechos de los interesados cuyos datos se contuviesen en la misma, de conformidad con lo dispuesto en esta Ley y en la Ley Orgánica 15/1999, de 13 de diciembre.»","dificultad":2},{"id":"L19-L4-001","ley":"L19","articulo":"DA 7ª","articulo_txt":"DA 7ª · Ley 19/2013","bloque_id":"L19|Disposiciones adicionales","enunciado":"Según la disposición adicional séptima de la Ley 19/2013, el plan formativo en el ámbito de la transparencia que aprobará el Gobierno irá dirigido a:","opciones":{"a":"Los empleados públicos de todas las Administraciones Públicas incluidas en su ámbito.","b":"Los funcionarios y personal de la Administración General del Estado.","c":"Los miembros de la Comisión del Consejo de Transparencia y Buen Gobierno.","d":"Los responsables de las unidades de información de cada Departamento."},"correcta":"b","explicacion":"La DA 7.ª prevé un plan formativo «dirigido a los funcionarios y personal de la Administración General del Estado»; es la opción b). Las opciones a), c) y d) señalan destinatarios que la DA 7.ª no menciona.","cita":"«El Gobierno aprobará un plan formativo en el ámbito de la transparencia dirigido a los funcionarios y personal de la Administración General del Estado, acompañado, a su vez, de una campaña informativa dirigida a los ciudadanos.»","dificultad":1},{"id":"L19-L3-045","ley":"L19","articulo":"DF 7ª","articulo_txt":"DF 7ª · Ley 19/2013","bloque_id":"L19|Disposiciones finales","enunciado":"Según la disposición final séptima de la Ley 19/2013, ¿en qué plazo, desde la publicación de esta Ley en el «Boletín Oficial del Estado», debía aprobarse el Estatuto orgánico del Consejo de Transparencia y Buen Gobierno?","opciones":{"a":"Seis meses.","b":"Tres meses.","c":"Nueve meses.","d":"Cuatro meses."},"correcta":"b","explicacion":"La DF 7.ª fija un plazo de «tres meses desde la publicación de esta Ley»; es la opción b). Las opciones a), c) y d) no coinciden con el plazo de la DF 7.ª.","cita":"«El Consejo de Ministros aprobará, en el plazo de tres meses desde la publicación de esta Ley en el «Boletín Oficial del Estado», un Real Decreto por el que se apruebe el Estatuto orgánico del Consejo de Transparencia y Buen Gobierno.»","dificultad":2},{"id":"L19-L3-046","ley":"L19","articulo":"DF 8ª","articulo_txt":"DF 8ª · Ley 19/2013","bloque_id":"L19|Disposiciones finales","enunciado":"La disposición final octava de la Ley 19/2013 dispone que la Ley se dicta al amparo de los artículos 149.1.1.ª, 149.1.13.ª y 149.1.18.ª de la Constitución y exceptúa de ello determinados preceptos. ¿Cuál de los siguientes es uno de ellos?","opciones":{"a":"El título III.","b":"El artículo 12.","c":"El artículo 26.","d":"El artículo 14."},"correcta":"a","explicacion":"La DF 8.ª exceptúa, entre otros preceptos, «el título III»; es la opción a). Las opciones b), c) y d) no figuran entre los preceptos exceptuados, que son el segundo párrafo del art. 6.2, el art. 9, los apartados 1 y 2 del art. 10, el art. 11, el art. 21.2, el art. 25.1, el título III y la DA 2.ª.","cita":"«La presente Ley se dicta al amparo de lo dispuesto en los artículos 149.1.1.ª, 149.1.13.ª y 149.1.18.ª de la Constitución. Se exceptúa lo dispuesto en el segundo párrafo del apartado 2 del artículo 6, el artículo 9, los apartados 1 y 2 del artículo 10, el artículo 11, el apartado 2 del artículo 21, el apartado 1 del artículo 25, el título III y la disposición adicional segunda.»","dificultad":3},{"id":"L19-L3-047","ley":"L19","articulo":"DF 9ª","articulo_txt":"DF 9ª · Ley 19/2013","bloque_id":"L19|Disposiciones finales","enunciado":"Según la disposición final novena de la Ley 19/2013, las disposiciones previstas en el título II entrarán en vigor:","opciones":{"a":"A los veinte días de su publicación en el «Boletín Oficial del Estado».","b":"A los seis meses de su publicación en el «Boletín Oficial del Estado».","c":"A los dos meses de su publicación en el «Boletín Oficial del Estado».","d":"Al día siguiente de su publicación en el «Boletín Oficial del Estado»."},"correcta":"d","explicacion":"La DF 9.ª dispone que las disposiciones previstas en el título II «entrarán en vigor al día siguiente de su publicación»; es la opción d). Las opciones a), b) y c) fijan plazos que la DF 9.ª no prevé para el título II; según la misma disposición, el título preliminar y los títulos I y III entraron en vigor al año de su publicación.","cita":"«La entrada en vigor de esta ley se producirá de acuerdo con las siguientes reglas: – Las disposiciones previstas en el título II entrarán en vigor al día siguiente de su publicación en el «Boletín Oficial del Estado».»","dificultad":2}]};</script>
<script>
/* Letra de Ley — motor de test. Sin dependencias; funciona sin conexión.
   Necesita window.LDL_CONFIG y window.LDL_BANCO (los inyecta sistema/letradeley.py). */
(function () {
  "use strict";
  var CFG = window.LDL_CONFIG, B = window.LDL_BANCO;
  var raiz = document.getElementById("ldl");
  var LETRAS = ["a", "b", "c", "d"];
  var POR_ID = {};
  B.preguntas.forEach(function (p) { POR_ID[p.id] = p; });
  var CLAVE = "ldl1:" + CFG.pack.id;
  var prog = cargar();
  var sesion = null;
  var vista = CFG.modo === "web" ? "portada" : "inicio";
  var reloj = null;

  /* ---------- utilidades ---------- */
  function esc(t) {
    return String(t == null ? "" : t).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function barajar(lista) {
    var a = lista.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function pct(a, b) { return b ? Math.round((a / b) * 100) : 0; }
  function plural(n, uno, varios) { return n + " " + (n === 1 ? uno : varios); }
  function num(n) { return String(n).replace(".", ","); }
  function cargar() {
    try { var s = localStorage.getItem(CLAVE); if (s) { var d = JSON.parse(s); if (d && d.p) return d; } } catch (e) {}
    return { p: {}, h: [] };
  }
  function guardar() { try { localStorage.setItem(CLAVE, JSON.stringify(prog)); } catch (e) {} }
  function registrar(id, acierto) {
    var r = prog.p[id] || { v: 0, a: 0, f: 0, c: 0 };
    r.v++;
    if (acierto) { r.a++; r.c = Math.min((r.c || 0) + 1, 5); } else { r.f++; r.c = 0; }
    r.u = acierto ? 1 : 0;
    r.t = Date.now();
    prog.p[id] = r;
    guardar();
  }
  function fallosPendientes() {
    return B.preguntas.filter(function (p) { var r = prog.p[p.id]; return r && r.u === 0; });
  }
  function resumen(lista) {
    var vistas = 0, aciertos = 0, intentos = 0;
    lista.forEach(function (p) {
      var r = prog.p[p.id];
      if (r) { vistas++; aciertos += r.a; intentos += r.v; }
    });
    return { total: lista.length, vistas: vistas, acierto: pct(aciertos, intentos) };
  }
  function delBloque(id) { return B.preguntas.filter(function (p) { return p.bloque_id === id; }); }

  /* ---------- tema claro / oscuro ---------- */
  function aplicarTema() {
    var t = null;
    try { t = localStorage.getItem("ldl:tema"); } catch (e) {}
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    else document.documentElement.removeAttribute("data-theme");
    return t || "auto";
  }
  function cambiarTema() {
    var orden = { auto: "light", light: "dark", dark: "auto" };
    var actual = aplicarTema();
    try { localStorage.setItem("ldl:tema", orden[actual]); } catch (e) {}
    aplicarTema();
    pintar();
  }

  /* ---------- sesiones ---------- */
  function empezar(tipo, preguntas, opciones) {
    opciones = opciones || {};
    if (!preguntas.length) return;
    pararReloj();
    sesion = {
      tipo: tipo, titulo: opciones.titulo || "Test", ids: preguntas.map(function (p) { return p.id; }),
      i: 0, resp: {}, corregida: {}, inicio: Date.now(), limite: opciones.minutos ? opciones.minutos * 60 : 0, fin: null,
      origen: vista === "test" || vista === "resultado" ? (sesion && sesion.origen) || "inicio" : vista
    };
    vista = "test";
    if (sesion.limite) reloj = setInterval(tic, 1000);
    pintar();
    window.scrollTo(0, 0);
  }
  function tic() {
    if (!sesion || sesion.fin) return pararReloj();
    var el = document.getElementById("ldl-crono");
    var resta = sesion.limite - Math.floor((Date.now() - sesion.inicio) / 1000);
    if (resta <= 0) { terminar(); return; }
    if (el) el.textContent = mmss(resta);
  }
  function pararReloj() { if (reloj) { clearInterval(reloj); reloj = null; } }
  function mmss(s) { var m = Math.floor(s / 60), r = s % 60; return m + ":" + (r < 10 ? "0" : "") + r; }

  function responder(letra) {
    var id = sesion.ids[sesion.i];
    if (sesion.tipo === "simulacro") {
      sesion.resp[id] = sesion.resp[id] === letra ? undefined : letra;
      pintar();
      return;
    }
    if (sesion.corregida[id]) return;
    sesion.resp[id] = letra;
    sesion.corregida[id] = true;
    registrar(id, letra === POR_ID[id].correcta);
    pintar();
  }
  function siguiente() {
    if (sesion.i < sesion.ids.length - 1) { sesion.i++; pintar(); window.scrollTo(0, 0); }
    else terminar();
  }
  function anterior() { if (sesion.i > 0) { sesion.i--; pintar(); } }
  function terminar() {
    pararReloj();
    if (sesion.tipo === "simulacro") {
      sesion.ids.forEach(function (id) {
        if (sesion.resp[id]) registrar(id, sesion.resp[id] === POR_ID[id].correcta);
      });
    }
    sesion.fin = Date.now();
    var r = calcular(sesion);
    prog.h.unshift({ t: sesion.fin, tipo: sesion.tipo, n: r.total, a: r.aciertos, e: r.errores, nota: r.nota });
    prog.h = prog.h.slice(0, 50);
    guardar();
    vista = "resultado";
    pintar();
    window.scrollTo(0, 0);
  }
  function calcular(s) {
    var a = 0, e = 0, nr = 0;
    s.ids.forEach(function (id) {
      var r = s.resp[id];
      if (!r) nr++; else if (r === POR_ID[id].correcta) a++; else e++;
    });
    var pen = (CFG.simulacro && CFG.simulacro.penalizacion) || 1 / 3;
    var neta = s.tipo === "simulacro" ? a - e * pen : a;
    var nota = Math.max(0, (neta / s.ids.length) * 10);
    return { total: s.ids.length, aciertos: a, errores: e, blancos: nr, neta: neta, nota: Math.round(nota * 100) / 100 };
  }

  /* ---------- vistas ---------- */
  function cabecera() {
    var tema = aplicarTema();
    var etiquetas = { auto: "Tema: auto", light: "Tema: claro", dark: "Tema: oscuro" };
    return '<header class="ldl-top"><a class="ldl-brand" href="' + esc(CFG.web || "#") + '">' +
      '<span class="ldl-logo" aria-hidden="true">§</span><span><b>Letra de Ley</b><small>' +
      esc(CFG.pack.nombre) + "</small></span></a>" +
      '<button class="ldl-tema" data-acc="tema" type="button">' + etiquetas[tema] + "</button></header>";
  }
  function navegacion() {
    if (CFG.modo === "web") return "";
    var items = [["inicio", "Inicio"], ["temas", "Por temas"], ["simulacro", "Simulacro"], ["fallos", "Fallos"], ["stats", "Estadísticas"]];
    return '<nav class="ldl-nav" aria-label="Secciones">' + items.map(function (it) {
      var actual = vista === it[0] || (vista === "test" && sesion && sesion.origen === it[0]);
      return '<button type="button" data-acc="ir" data-v="' + it[0] + '"' + (actual ? ' aria-current="page"' : "") + ">" + it[1] + "</button>";
    }).join("") + "</nav>";
  }
  function pie() {
    return '<p class="ldl-pie">Letra de Ley · ' + esc(CFG.pack.edicion) + " · Texto legal actualizado a " +
      esc(CFG.pack.actualizado) + "<br>Uso personal. Prohibida su redistribución.</p>";
  }

  function vInicio() {
    var r = resumen(B.preguntas), f = fallosPendientes().length;
    return '<section class="ldl-card"><h2>' + esc(CFG.pack.nombre) + "</h2>" +
      '<p class="ldl-muted">' + B.preguntas.length + " preguntas comentadas, con el artículo exacto de cada respuesta.</p>" +
      '<div class="ldl-kpis"><div class="ldl-kpi"><b>' + r.vistas + "/" + r.total + "</b><span>respondidas</span></div>" +
      '<div class="ldl-kpi"><b>' + r.acierto + ' %</b><span>de acierto</span></div>' +
      '<div class="ldl-kpi"><b>' + f + "</b><span>fallos por repasar</span></div></div>" +
      '<div class="ldl-acciones"><button class="ldl-btn" data-acc="rapido" type="button">Test rápido de 20</button>' +
      '<button class="ldl-btn sec" data-acc="ir" data-v="simulacro" type="button">Simulacro de examen</button>' +
      (f ? '<button class="ldl-btn sec" data-acc="repasar" type="button">Repasar ' + f + " fallos</button>" : "") +
      "</div></section>" +
      '<section class="ldl-card"><h3>Cómo sacarle partido</h3><ol class="ldl-muted">' +
      "<li>Practica <b>por temas</b>: cada respuesta te enseña el artículo y por qué fallan las demás opciones.</li>" +
      "<li>Cada pocos días, <b>repasa tus fallos</b>: es donde más se aprende.</li>" +
      "<li>Antes del examen, haz <b>simulacros</b> con tiempo y con la penalización real (cada error resta 1/3).</li></ol>" +
      '<p class="ldl-small ldl-muted">Tu progreso se guarda en este dispositivo y en este navegador.</p></section>' + historial();
  }
  function historial() {
    if (!prog.h.length) return "";
    return '<section class="ldl-card"><h3>Últimos tests</h3><ul class="ldl-revision">' + prog.h.slice(0, 5).map(function (h) {
      var d = new Date(h.t);
      return "<li><b>" + (h.tipo === "simulacro" ? "Simulacro" : "Práctica") + "</b> · " + d.toLocaleDateString("es-ES") +
        " · " + h.a + "/" + h.n + " aciertos" + (h.tipo === "simulacro" ? " · nota " + num(h.nota) : "") + "</li>";
    }).join("") + "</ul></section>";
  }
  function vTemas() {
    var html = '<section class="ldl-card"><h2>Practicar por temas</h2><p class="ldl-muted">Elige un bloque. Las preguntas salen en orden aleatorio y se corrigen al momento.</p><ul class="ldl-bloques">';
    B.bloques.forEach(function (b) {
      var lista = delBloque(b.id), r = resumen(lista);
      html += '<li><button type="button" data-acc="bloque" data-id="' + esc(b.id) + '"><span class="t">' + esc(b.nombre) +
        '</span><span class="n">' + r.vistas + "/" + r.total + (r.vistas ? " · " + r.acierto + " %" : "") + "</span>" +
        '<span class="ldl-barra"><i style="width:' + pct(r.vistas, r.total) + '%"></i></span></button></li>';
    });
    return html + "</ul></section>";
  }
  function vSimulacro() {
    var total = B.preguntas.length;
    var opcionesN = [10, 20, 30, 50, 100].filter(function (n) { return n < total; });
    opcionesN.push(total);
    var porDefecto = Math.min((CFG.simulacro && CFG.simulacro.preguntas) || 30, total);
    return '<section class="ldl-card"><h2>Simulacro de examen</h2>' +
      '<p class="ldl-muted">Como el día del examen: no ves las soluciones hasta el final y cada error resta un tercio de acierto.</p>' +
      '<div class="ldl-campo"><label for="ldl-n">Número de preguntas</label><select id="ldl-n">' +
      opcionesN.map(function (n) { return "<option" + (n === porDefecto ? " selected" : "") + ">" + n + "</option>"; }).join("") +
      '</select></div><div class="ldl-campo"><label for="ldl-t">Tiempo</label><select id="ldl-t">' +
      '<option value="1">1 minuto por pregunta</option><option value="0">Sin límite de tiempo</option></select></div>' +
      '<div class="ldl-campo"><label for="ldl-b">Temas</label><select id="ldl-b"><option value="">Todos</option>' +
      B.bloques.map(function (b) { return '<option value="' + esc(b.id) + '">' + esc(b.nombre) + "</option>"; }).join("") +
      '</select></div><div class="ldl-acciones"><button class="ldl-btn" data-acc="simular" type="button">Empezar simulacro</button></div></section>';
  }
  function vFallos() {
    var f = fallosPendientes();
    if (!f.length) {
      return '<section class="ldl-card"><h2>Repaso de fallos</h2><p class="ldl-muted">No tienes fallos pendientes. Cuando falles una pregunta aparecerá aquí hasta que la aciertes.</p></section>';
    }
    return '<section class="ldl-card"><h2>Repaso de fallos</h2><p class="ldl-muted">Tienes <b>' + f.length +
      "</b> preguntas falladas. Salen de aquí en cuanto las aciertas.</p>" +
      '<div class="ldl-acciones"><button class="ldl-btn" data-acc="repasar" type="button">Repasar ahora</button></div></section>';
  }
  function vStats() {
    var html = '<section class="ldl-card"><h2>Estadísticas</h2><ul class="ldl-bloques">';
    B.bloques.forEach(function (b) {
      var r = resumen(delBloque(b.id));
      html += '<li><button type="button" data-acc="bloque" data-id="' + esc(b.id) + '"><span class="t">' + esc(b.nombre) +
        '</span><span class="n">' + (r.vistas ? r.acierto + " % de acierto" : "sin empezar") + '</span><span class="ldl-barra"><i style="width:' +
        r.acierto + '%"></i></span></button></li>';
    });
    html += '</ul></section><section class="ldl-card"><h3>Empezar de cero</h3><p class="ldl-muted ldl-small">Borra tu progreso guardado en este dispositivo.</p>' +
      '<div class="ldl-acciones"><button class="ldl-btn sec" data-acc="borrar" type="button">Borrar mi progreso</button></div></section>';
    return html;
  }
  function vPortada() {
    var n = B.preguntas.length;
    return '<section class="ldl-card"><h2>' + esc(CFG.pack.nombre) + "</h2>" +
      '<p class="ldl-muted">' + n + " preguntas tipo examen, corregidas al momento, con el artículo exacto y la explicación de cada opción. Gratis y sin registrarte.</p>" +
      '<div class="ldl-acciones"><button class="ldl-btn" data-acc="empezarweb" type="button">Empezar el test</button></div></section>';
  }

  function vTest() {
    var id = sesion.ids[sesion.i], p = POR_ID[id], sim = sesion.tipo === "simulacro";
    var elegida = sesion.resp[id], corregida = !sim && sesion.corregida[id];
    var html = '<section class="ldl-card"><div class="ldl-meta"><span>' + esc(sesion.titulo) + " · " + (sesion.i + 1) + " de " + sesion.ids.length +
      "</span><span>" + (sesion.limite ? '⏱ <span id="ldl-crono" class="ldl-crono">' +
        mmss(Math.max(0, sesion.limite - Math.floor((Date.now() - sesion.inicio) / 1000))) + "</span>" : esc(p.articulo_txt)) +
      '</span></div><div class="ldl-progreso"><i style="width:' + pct(sesion.i + (corregida ? 1 : 0), sesion.ids.length) + '%"></i></div>' +
      '<p class="ldl-enunciado">' + esc(p.enunciado) + '</p><div class="ldl-opciones" role="group" aria-label="Opciones">';
    LETRAS.forEach(function (l) {
      var cls = "ldl-op";
      if (corregida) { if (l === p.correcta) cls += " ok"; else if (l === elegida) cls += " ko"; }
      else if (sim && elegida === l) cls += " marcada";
      html += '<button type="button" class="' + cls + '" data-acc="resp" data-l="' + l + '"' + (corregida ? " disabled" : "") +
        (sim ? ' aria-pressed="' + (elegida === l) + '"' : "") + '><span class="l">' + l + ")</span><span>" + esc(p.opciones[l]) + "</span></button>";
    });
    html += "</div>";
    if (corregida) html += feedback(p, elegida);
    html += '<div class="ldl-acciones">';
    if (sim) {
      html += (sesion.i > 0 ? '<button class="ldl-btn sec" data-acc="ant" type="button">Anterior</button>' : "") +
        '<button class="ldl-btn" data-acc="sig" type="button">' + (sesion.i < sesion.ids.length - 1 ? "Siguiente" : "Entregar") + "</button>" +
        (sesion.i < sesion.ids.length - 1 ? '<button class="ldl-btn sec" data-acc="entregar" type="button">Entregar ya</button>' : "");
    } else if (corregida) {
      html += '<button class="ldl-btn" data-acc="sig" type="button">' + (sesion.i < sesion.ids.length - 1 ? "Siguiente" : "Ver resultado") + "</button>";
    }
    html += '<button class="ldl-btn sec" data-acc="salir" type="button">Salir</button></div></section>';
    return html;
  }
  function feedback(p, elegida) {
    var bien = elegida === p.correcta;
    return '<div class="ldl-feedback" aria-live="polite"><div class="v ' + (bien ? "ok" : "ko") + '">' +
      (bien ? "¡Correcta!" : "Incorrecta. La respuesta correcta es la " + p.correcta + ")") + "</div><div>" + esc(p.explicacion) + "</div>" +
      (p.cita ? '<blockquote class="ldl-cita">' + esc(p.cita) + "<small>" + esc(p.articulo_txt) + "</small></blockquote>" : "") + "</div>";
  }
  function vResultado() {
    var r = calcular(sesion), sim = sesion.tipo === "simulacro";
    var html = '<section class="ldl-card"><h2>' + (sim ? "Resultado del simulacro" : "Resultado") + "</h2>" +
      '<div class="ldl-nota">' + (sim ? num(r.nota.toFixed(2)) : r.aciertos + "/" + r.total) + "</div>" +
      '<p class="ldl-muted">' + plural(r.aciertos, "acierto", "aciertos") + " · " + plural(r.errores, "error", "errores") +
      (r.blancos ? " · " + r.blancos + " en blanco" : "") +
      (sim ? " · nota sobre 10 con penalización" : "") + "</p>";
    if (CFG.modo === "web") html += ctaWeb(r);
    html += '<div class="ldl-acciones">' + (CFG.modo === "web" ? '<button class="ldl-btn sec" data-acc="empezarweb" type="button">Repetir con otro orden</button>' :
      '<button class="ldl-btn" data-acc="ir" data-v="inicio" type="button">Volver al inicio</button>') + "</div></section>";
    html += '<section class="ldl-card"><h3>Revisión</h3><ul class="ldl-revision">';
    sesion.ids.forEach(function (id, n) {
      var p = POR_ID[id], e = sesion.resp[id], chip = !e ? '<span class="ldl-chip nr">En blanco</span>' :
        e === p.correcta ? '<span class="ldl-chip ok">Bien</span>' : '<span class="ldl-chip ko">Mal</span>';
      html += "<li>" + chip + '<span class="e">' + (n + 1) + ". " + esc(p.enunciado) + "</span><br>" +
        '<span class="ldl-small">Correcta: <b>' + p.correcta + ") " + esc(p.opciones[p.correcta]) + "</b>" +
        (e && e !== p.correcta ? " · Marcaste " + e + ")" : "") + '</span><br><span class="ldl-small ldl-muted">' + esc(p.explicacion) + "</span></li>";
    });
    return html + "</ul></section>";
  }
  function ctaWeb() {
    var c = CFG.compra || {}, html = "";
    if (c.url) {
      html += '<div class="ldl-card ldl-cta"><h3>' + esc(c.titulo) + '</h3><p class="ldl-muted">' + esc(c.texto) + "</p>" +
        '<div class="ldl-acciones"><a class="ldl-btn acc" href="' + esc(c.url) + '">' + esc(c.boton) + "</a></div></div>";
    }
    if (CFG.telegram) {
      html += '<p class="ldl-small">¿Quieres un test cada día? <a href="' + esc(CFG.telegram) + '">Únete gratis al canal de Telegram</a>.</p>';
    }
    return html;
  }

  function pintar() {
    var cuerpo;
    if (vista === "test") cuerpo = vTest();
    else if (vista === "resultado") cuerpo = vResultado();
    else if (vista === "portada") cuerpo = vPortada();
    else if (vista === "temas") cuerpo = vTemas();
    else if (vista === "simulacro") cuerpo = vSimulacro();
    else if (vista === "fallos") cuerpo = vFallos();
    else if (vista === "stats") cuerpo = vStats();
    else cuerpo = vInicio();
    raiz.innerHTML = '<div class="ldl">' + cabecera() + navegacion() + "<main>" + cuerpo + "</main>" + pie() + "</div>";
  }

  /* ---------- eventos ---------- */
  raiz.addEventListener("click", function (ev) {
    var el = ev.target.closest("[data-acc]");
    if (!el) return;
    var acc = el.getAttribute("data-acc");
    if (acc === "tema") return cambiarTema();
    if (acc === "ir") { pararReloj(); vista = el.getAttribute("data-v"); sesion = null; pintar(); return; }
    if (acc === "rapido") return empezar("practica", barajar(B.preguntas).slice(0, 20), { titulo: "Test rápido" });
    if (acc === "repasar") return empezar("practica", barajar(fallosPendientes()).slice(0, 30), { titulo: "Repaso de fallos" });
    if (acc === "bloque") {
      var b = B.bloques.filter(function (x) { return x.id === el.getAttribute("data-id"); })[0];
      return empezar("practica", barajar(delBloque(b.id)), { titulo: b.nombre });
    }
    if (acc === "simular") {
      var n = parseInt(document.getElementById("ldl-n").value, 10);
      var conTiempo = document.getElementById("ldl-t").value === "1";
      var bloque = document.getElementById("ldl-b").value;
      var fuente = bloque ? delBloque(bloque) : B.preguntas;
      var elegidas = barajar(fuente).slice(0, n);
      return empezar("simulacro", elegidas, { titulo: "Simulacro", minutos: conTiempo ? elegidas.length : 0 });
    }
    if (acc === "empezarweb") return empezar("practica", barajar(B.preguntas), { titulo: "Test gratuito" });
    if (acc === "resp") return responder(el.getAttribute("data-l"));
    if (acc === "sig") return siguiente();
    if (acc === "ant") return anterior();
    if (acc === "entregar") return terminar();
    if (acc === "salir") { pararReloj(); sesion = null; vista = CFG.modo === "web" ? "portada" : "inicio"; pintar(); return; }
    if (acc === "borrar") {
      if (el.getAttribute("data-confirmar") === "1") { prog = { p: {}, h: [] }; guardar(); pintar(); }
      else { el.setAttribute("data-confirmar", "1"); el.textContent = "Pulsa otra vez para confirmar"; }
    }
  });
  document.addEventListener("keydown", function (ev) {
    if (vista !== "test" || !sesion || ev.altKey || ev.ctrlKey || ev.metaKey) return;
    var k = ev.key.toLowerCase(), mapa = { "1": "a", "2": "b", "3": "c", "4": "d", a: "a", b: "b", c: "c", d: "d" };
    if (mapa[k]) { ev.preventDefault(); responder(mapa[k]); }
    else if (k === "enter" || k === "arrowright") {
      var id = sesion.ids[sesion.i];
      if (sesion.tipo === "simulacro" || sesion.corregida[id]) { ev.preventDefault(); siguiente(); }
    } else if (k === "arrowleft" && sesion.tipo === "simulacro") { ev.preventDefault(); anterior(); }
  });

  pintar();
})();
</script>
</body>
</html>
